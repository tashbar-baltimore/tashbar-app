name: push-to-test
# After a pull request is merged into main: put main into the Apps Script editor (HEAD).
# This uses NO version slot and does not change what students see. Try it at the /dev link.
# OFF until the Head of School turns it on: repository variable GITHUB_PUBLISHING = on.
on:
  push:
    branches: [main]
    paths: ['src/**']
concurrency: { group: google-editor, cancel-in-progress: false }
permissions:
  contents: read
jobs:
  push:
    if: vars.GITHUB_PUBLISHING == 'on'
    runs-on: ubuntu-24.04
    environment: live
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Sign in (token is never printed)
        env: { CLASPRC: '${{ secrets.CLASPRC }}' }
        run: source tools/clasp-ci.sh && login
      - name: Stop if someone edited the editor by hand
        run: |
          source tools/clasp-ci.sh
          pull_editor /tmp/editor
          mkdir -p /tmp/before && git archive "${{ github.event.before }}" src | tar -x -C /tmp/before
          same_as /tmp/editor /tmp/before/src
      - name: Push main to the editor (HEAD only)
        run: clasp push -f | tail -1
      - name: Check the editor now equals main
        run: source tools/clasp-ci.sh && pull_editor /tmp/after && same_as /tmp/after src
