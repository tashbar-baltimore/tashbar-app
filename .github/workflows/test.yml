name: test
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # The kit runs in 2 parts, each on its own machine at the same time. Every part runs every check; the lessons that are
  # played start to finish (the sampled lessons and every One Bite bite) are shared out between the parts (PART in tests/run.js).
  kit:
    name: test kit part ${{ matrix.part }} of 2
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Run the test kit (pretend server, made-up kids only)
        run: node tests/run.js
        env:
          PART: ${{ matrix.part }}/2
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'test-report-part-${{ matrix.part }}', path: tests/out/ }
  # The one check named `test`: auto-publish (workflow_run on this workflow) and v2-gate (check run "test") wait for it.
  # It passes only when every part passed.
  test:
    needs: kit
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every part of the test kit passed
        run: |
          echo "test kit parts: ${{ needs.kit.result }}"
          [ "${{ needs.kit.result }}" = success ]
