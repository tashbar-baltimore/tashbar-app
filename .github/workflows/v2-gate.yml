name: v2-gate
# THE 2.0 RULE (HoS 2026-11-22): nothing goes into Tashbar Learning 2.0 until an approver (v2/APPROVERS.json on main: Mrs. Khaver,
# Esti, or anyone the HoS adds) says yes. Runs from main only, so a pull request cannot change how it decides.
# For a pull request that changes v2/:
#   - it must change ONLY v2/ (1.0 and 2.0 changes are never mixed);
#   - its tests must have passed on its newest commit;
#   - no approval yet  -> put it on a look link (publish-v2 preview) and wait;
#   - an approver approved its newest commit -> merge it and put 2.0 live (publish-v2 live).
on:
  workflow_dispatch:
    inputs:
      pr: { description: 'pull request number', required: true }
  workflow_run:
    workflows: [v2-review-seen]
    types: [completed]
concurrency: { group: 'v2-gate-${{ inputs.pr || github.event.workflow_run.head_branch }}', cancel-in-progress: false }
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  gate:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    env: { GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}' }
    steps:
      - name: Decide
        run: |
          set -euo pipefail
          n='${{ inputs.pr }}'
          if [ -z "$n" ]; then
            br='${{ github.event.workflow_run.head_branch }}'
            [ "${{ github.event.workflow_run.head_repository.full_name }}" = "$REPO" ] || { echo "Not from this repository."; exit 0; }
            n=$(gh api "repos/$REPO/pulls?state=open&head=${REPO%%/*}:$br" --jq '.[0].number // empty')
          fi
          [[ "$n" =~ ^[0-9]+$ ]] || { echo "No open pull request."; exit 0; }
          pr=$(gh api "repos/$REPO/pulls/$n"); [ "$(jq -r .state <<<"$pr")" = open ] || { echo "PR #$n is not open."; exit 0; }
          [ "$(jq -r .head.repo.full_name <<<"$pr")" = "$REPO" ] || { echo "PR #$n is from outside this repository."; exit 0; }
          sha=$(jq -r .head.sha <<<"$pr")
          files=$(gh api --paginate "repos/$REPO/pulls/$n/files" --jq '.[].filename')
          grep -q '^v2/' <<<"$files" || { echo "PR #$n does not change 2.0."; exit 0; }
          if grep -qv '^v2/' <<<"$files"; then
            echo "PR #$n mixes 1.0 and 2.0 changes:"; grep -v '^v2/' <<<"$files"
            gh api "repos/$REPO/issues/$n/comments" --jq '.[].body' | grep -q 'v2-gate: mixed' || gh pr comment "$n" --repo "$REPO" --body "v2-gate: mixed. This pull request changes 2.0 (v2/) and also 1.0 files. A 2.0 pull request may change only v2/. Please split it. Nothing was merged."
            exit 0; fi
          concl=$(gh api "repos/$REPO/commits/$sha/check-runs?check_name=test" --jq '[.check_runs[] | select(.status=="completed")][0].conclusion // "none"')
          [ "$concl" = success ] || { echo "PR #$n: tests on $sha are '$concl'; waiting for them to pass."; exit 0; }
          approvers=$(gh api "repos/$REPO/contents/v2/APPROVERS.json?ref=main" --jq .content | base64 -d | jq -r '.approvers[].github | select(. != "") | ascii_downcase')
          [ -n "$approvers" ] || echo "No approver has a GitHub username in v2/APPROVERS.json yet, so nobody can approve."
          ok=$(gh api --paginate "repos/$REPO/pulls/$n/reviews" --jq '.[] | [.user.login, .state, .commit_id] | @tsv' | awk -v s="$sha" -F'\t' '
                 { k=tolower($1); if ($2!="COMMENTED") { st[k]=$2; c[k]=$3 } }
                 END { for (k in st) if (st[k]=="APPROVED" && c[k]==s) print k }' | grep -Fxf <(printf '%s\n' $approvers) | head -1 || true)
          if [ -z "$ok" ]; then
            echo "PR #$n: no approver has approved commit $sha yet. Making a look link."
            gh api -X POST "repos/$REPO/actions/workflows/publish-v2.yml/dispatches" -f ref=main -f 'inputs[what]=preview' -f "inputs[pr]=$n"
            exit 0; fi
          echo "PR #$n: approved by $ok for $sha. Letting it into 2.0."
          gh api -X PUT "repos/$REPO/pulls/$n/merge" -f merge_method=squash -f sha="$sha" -f commit_title="$(jq -r .title <<<"$pr") (#$n, approved by $ok)" --jq .message
          gh api -X POST "repos/$REPO/actions/workflows/publish-v2.yml/dispatches" -f ref=main -f 'inputs[what]=live'
