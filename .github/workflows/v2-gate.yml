name: v2-gate
# THE 2.0 RULE (HoS 2026-11-22): nothing goes into Tashbar Learning 2.0 until a person working on 2.0 says yes. Everyone works through
# the HoS's GitHub, so the yes is a comment that person's Claude posts on the pull request:   APPROVED FOR 2.0 — <name>
# Anyone the HoS sends the 2.0 instructions to may approve (HoS: "anyone who I send things to can do whatever they need to do. Don't make
# restrictions."). The yes must come AFTER the pull request's newest commit (it counts only for the version that person looked at). This workflow always runs from main, so a pull request
# cannot change how it decides. For a pull request that changes v2/:
#   - it must change ONLY v2/ and the shared art library art/ (HoS 2026-11-24: art is shared; 1.0 code and 2.0 changes are never mixed);
#   - its tests must have passed on its newest commit;
#   - no yes yet -> put it on a private look link (publish-v2 preview) and wait;
#   - a yes for its newest commit -> merge it and put 2.0 live (publish-v2 live).
on:
  workflow_dispatch:
    inputs:
      pr: { description: 'pull request number', required: true }
  issue_comment:
    types: [created]
concurrency: { group: 'v2-gate-${{ inputs.pr || github.event.issue.number }}', cancel-in-progress: false }
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, 'APPROVED FOR 2.0'))
    runs-on: ubuntu-24.04
    env: { GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}' }
    steps:
      - name: Decide
        run: |
          set -euo pipefail
          n='${{ inputs.pr || github.event.issue.number }}'
          [[ "$n" =~ ^[0-9]+$ ]] || { echo "No pull request."; exit 0; }
          pr=$(gh api "repos/$REPO/pulls/$n"); [ "$(jq -r .state <<<"$pr")" = open ] || { echo "PR #$n is not open."; exit 0; }
          [ "$(jq -r .head.repo.full_name <<<"$pr")" = "$REPO" ] || { echo "PR #$n is from outside this repository."; exit 0; }
          sha=$(jq -r .head.sha <<<"$pr")
          files=$(gh api --paginate "repos/$REPO/pulls/$n/files" --jq '.[].filename')
          grep -q '^v2/' <<<"$files" || { echo "PR #$n does not change 2.0."; exit 0; }
          if grep -Eqv '^(v2|art)/' <<<"$files"; then
            echo "PR #$n mixes 1.0 and 2.0 changes:"; grep -Ev '^(v2|art)/' <<<"$files"
            gh api "repos/$REPO/issues/$n/comments" --jq '.[].body' | grep -q 'v2-gate: mixed' || gh pr comment "$n" --repo "$REPO" --body "v2-gate: mixed. This pull request changes 2.0 (v2/) and also 1.0 files. A 2.0 pull request may change only v2/ and the shared art library art/. Please split it. Nothing was merged."
            exit 0; fi
          concl=$(gh api "repos/$REPO/commits/$sha/check-runs?check_name=test" --jq '[.check_runs[] | select(.status=="completed")][0].conclusion // "none"')
          [ "$concl" = success ] || { echo "PR #$n: tests on $sha are '$concl'; waiting for them to pass."; exit 0; }
          # the newest commit's time: a yes must come after it
          since=$(gh api "repos/$REPO/commits/$sha" --jq '.commit.committer.date')
          yes=$(gh api --paginate "repos/$REPO/issues/$n/comments" --jq ".[] | select(.created_at > \"$since\") | select(.user.type != \"Bot\") | .body" \
                | grep -ioP '^\s*APPROVED FOR 2\.0\s*(?:-|–|—|:)\s*\K[^\r\n]+' | sed 's/[[:space:].!]*$//' | grep -m1 . || true)
          if [ -z "$yes" ]; then
            echo "PR #$n: no approver has said yes after its newest commit ($sha, $since). Making a look link."
            gh api -X POST "repos/$REPO/actions/workflows/publish-v2.yml/dispatches" -f ref=main -f 'inputs[what]=preview' -f "inputs[pr]=$n"
            exit 0; fi
          echo "PR #$n: approved by $yes for $sha. Letting it into 2.0."
          gh api -X PUT "repos/$REPO/pulls/$n/merge" -f merge_method=squash -f sha="$sha" -f commit_title="$(jq -r .title <<<"$pr") (#$n, approved by $yes)" --jq .message
          gh api -X POST "repos/$REPO/actions/workflows/publish-v2.yml/dispatches" -f ref=main -f 'inputs[what]=live'
          gh pr comment "$n" --repo "$REPO" --body "Approved by $yes. It is going into 2.0 now: https://tashbar-learning-v2.web.app (live in about 5 minutes)."
