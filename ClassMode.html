<script>
/* ClassMode.html — the boy side of "Teacher mode" (v51, 2026-11-11). Loaded by msQuestTools() in its own eval, LAST.
   While a teacher's class lesson is running for this boy (TeacherMode.js tmMine), his home screen is replaced by ONE card:
   the class lesson and a Start button. Every other part of the app (other subjects, Pathfinder, canteen, level checks,
   boss rounds, other lessons) is closed until the class ends. Sign out still works. Checks the server every 25 seconds. */
(function(){
if(typeof render!=='function'||typeof startMission!=='function'||typeof A==='undefined') return;
const TMC={s:null,checked:null,timer:null,done:0,ending:false};
window.TM_CLASS=()=>TMC.s;
const SUBJ={MATH:['📐','Math'],READ:['📖','Reading'],WRIT:['✍️','Writing'],LANG:['✍️','Writing'],SCI:['🔬','Science'],ELEC:['⚛️','Electives'],LK:['📜','Limudei Kodesh'],HEB:['📜','Limudei Kodesh · Lashon Hakodesh'],SIM:['😊',"B'Simcha"],SS:['🌎','Social Studies'],COMP:['💻','Computing'],LIFE:['💵','Life and Money'],TCH:['🧑‍🏫','Class lesson']};
/* v128 (DECISION 2230): a class can have several lessons, and teacher-made lessons (TCH.*) arrive with their questions */
const SKILLS=()=>TMC.s?(TMC.s.skills&&TMC.s.skills.length?TMC.s.skills:[TMC.s.skill]):[];
const subjOf=id=>{ const p=String(id).split('.')[0]; return p==='HEB'?'LK':p==='LANG'?'WRIT':p; };
try{ CURR.TCH=CURR.TCH||{label:'Class lesson',icon:'🧑‍🏫',cls:'c-tch',world:'Classroom'}; WORLD.TCH=WORLD.TCH||{name:'Class lesson',icon:'🧑‍🏫',boss:'Class Review',bf:'🧑‍🏫'}; WCOL.TCH='#4338CA'; WG.TCH='linear-gradient(135deg,#4338CA,#7C3AED)'; }catch(e){}
function addTeacherLessons(r){ (r&&r.lessons||[]).forEach(L=>{ try{ const qs=(L.qs||[]).map(q=>({q:q.q,o:[q.right].concat(q.wrong||[]),how:q.how||'',h:q.how||''}));
  if(!qs.length) return; const n=qs.length, check=n>=4?qs.slice(-3):[0,1,2].map(i=>Object.assign({},qs[i%n])), practice=n>=4?qs.slice(0,-3):qs;   /* mastery needs exactly 3 checks */
  BANK_ALL[L.id]={name:L.title,teach:[],practice,check};
  if(typeof TL_DO!=='undefined'){ const Q={}; (L.qs||[]).forEach(q=>{ if(q.how) Q[q.q]=q.how; }); TL_DO[L.id]={q:Q,s:'Think about what we learned in class.\nRead every answer.\nTap the one that fits best.'}; }
  }catch(e){ console.error('ClassMode teacher lesson',e); } }); }
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tm=t=>{ try{ return new Date(t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); }catch(e){ return ''; } };
function css(){ if(document.getElementById('tm-css')) return; const s=document.createElement('style'); s.id='tm-css'; s.textContent=`
.tmw{min-height:calc(100vh - 40px);display:grid;place-items:center;padding:24px 12px}
.tmc{width:min(640px,100%);background:#fff;border-radius:28px;box-shadow:0 24px 60px rgba(30,20,80,.22);overflow:hidden;text-align:center}
.tmc .top{background:linear-gradient(135deg,#4338CA,#7C3AED 60%,#DB2777);color:#fff;padding:26px 22px 22px}
.tmc .top small{display:inline-block;background:rgba(255,255,255,.2);border-radius:999px;padding:6px 14px;font:700 14px var(--body,'Barlow'),sans-serif;letter-spacing:.06em;text-transform:uppercase}
.tmc .top h2{font:800 clamp(26px,3.4vw,38px)/1.15 var(--display,'Barlow'),sans-serif;margin:14px 0 4px}
.tmc .top p{margin:0;font:600 17px var(--body,'Barlow'),sans-serif;opacity:.92}
.tmc .ic{font-size:64px;line-height:1;margin:22px 0 6px}
.tmc .sub{color:#5B6478;font:600 17px var(--body,'Barlow'),sans-serif;margin:0 18px}
.tmc .go{display:block;margin:20px auto 8px;width:min(360px,86%);border:0;border-radius:18px;padding:18px;background:linear-gradient(90deg,#F59E0B,#EC4899,#8B5CF6);color:#fff;font:800 24px var(--display,'Barlow'),sans-serif;box-shadow:0 8px 0 #6D28D9;cursor:pointer}
.tmc .go:active{transform:translateY(5px);box-shadow:0 3px 0 #6D28D9}
.tmc .done{margin:16px 18px 0;padding:12px;border-radius:14px;background:#ECFDF5;color:#065F46;font:700 17px var(--body,'Barlow'),sans-serif}
.tmc .foot{margin:16px 0 22px;color:#6B7280;font:600 15px var(--body,'Barlow'),sans-serif}
.tmlist{display:grid;gap:10px;margin:16px 18px 4px}.tml{display:flex;align-items:center;gap:14px;width:100%;border:2px solid #E0E7FF;border-radius:18px;background:#F8FAFF;padding:14px 16px;cursor:pointer;text-align:left;font:inherit}.tml:hover{border-color:#818CF8}.tml .ic2{font-size:30px}.tml .tx{flex:1;display:flex;flex-direction:column}.tml b{font:800 19px var(--display,'Barlow'),sans-serif;color:#1E1B4B}.tml small{color:#5B6478;font:600 15px var(--body,'Barlow'),sans-serif}.tml .ar{font-size:22px;color:#6366F1}
.tmwait{min-height:60vh;display:grid;place-items:center;color:#6B7280;font:700 20px var(--body,'Barlow'),sans-serif}`; document.head.appendChild(s); }
function lockHTML(){ const s=TMC.s, sk=SKILLS(); if(sk.length>1) return lockManyHTML(); const sj=SUBJ[subjOf(s.skill)]||['📘',s.subj], did=TMC.done>0||(typeof mastered==='function'&&A.st&&mastered(A.st,s.skill));
 return `<section class="tmw"><div class="tmc"><div class="top"><small>🧑‍🏫 Class lesson</small><h2>${E(s.name)}</h2><p>${E(sj[1])} · with ${E(s.by)}</p></div>
 <div class="ic" aria-hidden="true">${sj[0]}</div><p class="sub">Your class is learning this lesson together. Look at the board and follow your teacher.</p>
 ${did?`<div class="done">⭐ Great job! You can do it again for practice, or wait for your teacher.</div>`:''}
 <button class="go" data-tm="go">${did?'Practice again':'Start the lesson'} 🚀</button>
 <p class="foot">The rest of the app opens again when class ends${s.until?` (at ${E(tm(s.until))})`:''}.</p></div></section>`; }
function nameOf(id){ try{ return (BANK_ALL[id]&&BANK_ALL[id].name)||(typeof skillName==='function'?skillName(id):id); }catch(e){ return id; } }
function lockManyHTML(){ const s=TMC.s, sk=SKILLS();
 const rows=sk.map(id=>{ const sj=SUBJ[subjOf(id)]||['📘',''], did=typeof mastered==='function'&&A.st&&mastered(A.st,id); return `<button class="tml" data-tm="go" data-id="${E(id)}"><span class="ic2">${sj[0]}</span><span class="tx"><b>${E(nameOf(id))}</b><small>${E(sj[1])}${did?' · ⭐ done':''}</small></span><span class="ar">▶</span></button>`; }).join('');
 return `<section class="tmw"><div class="tmc"><div class="top"><small>🧑‍🏫 Class lessons</small><h2>${E(s.clsName||s.name)}</h2><p>with ${E(s.by)}</p></div>
 <p class="sub" style="margin-top:18px">Your teacher picked these lessons for now. Tap one to start.</p><div class="tmlist">${rows}</div>
 <p class="foot">The rest of the app opens again when class ends${s.until?` (at ${E(tm(s.until))})`:''}.</p></div></section>`; }
function startClass(pick){ const s=TMC.s; if(!s) return; const sk=SKILLS(); const id=pick&&sk.indexOf(pick)>=0?pick:sk[0]; const subj=subjOf(id);
 if(subj==='SCI'||subj==='ELEC'){ const b=document.createElement('button'); if(subj==='SCI'){ b.dataset.sci='open'; } else { b.dataset.elec='open'; } b.dataset.id=id; b.style.display='none'; document.body.appendChild(b); b.click(); b.remove();
   if(document.getElementById(subj==='SCI'?'sci-ov':'elec-ov')) return; }
 if(!BANK_ALL[id]&&!(typeof GEN!=='undefined'&&GEN[id])){ try{ toast('That lesson is still loading. Try again in a moment.'); }catch(e){} return; }   /* v182: core Math lessons live in GEN, not BANK_ALL */
 A.overlay=null; _start(subj,id,'skill'); }
function startClassOld(){ const s=TMC.s; if(!s) return;
 if(s.subj==='SCI'||s.subj==='ELEC'){ const b=document.createElement('button'); if(s.subj==='SCI'){ b.dataset.sci='open'; } else { b.dataset.elec='open'; } b.dataset.id=s.skill; b.style.display='none'; document.body.appendChild(b); b.click(); b.remove();
   if(document.getElementById(s.subj==='SCI'?'sci-ov':'elec-ov')) return; }
 A.overlay=null; _start(s.subj,s.skill,'skill'); }
/* only the class lesson may start while a class is running */
const _start=startMission;
startMission=function(c,id,kind){ const s=TMC.s; if(s&&(SKILLS().indexOf(id)<0||kind==='boss')){ try{ SND.wrong(); }catch(e){} A.view='hub'; A.play=null; return render(); } return _start.apply(this,arguments); };
const _render=render;
render=function(){
 const sid=A.st&&A.st.id; if(sid&&TMC.checked!==sid) pre(sid); const s=TMC.s;
 if(A.view==='result'&&s&&A.play&&SKILLS().indexOf(A.play.id)>=0&&A.res&&!A.res.tmCounted){ A.res.tmCounted=1; TMC.done++; }
 if(s&&A.view==='play'&&A.play&&SKILLS().indexOf(A.play.id)<0){ A.view='hub'; A.play=null; }
 if(A.view==='hub'&&sid&&s){   /* v162: no "Getting your day ready…" wait any more: until the class answer comes the home shows as usual; a running class takes over the moment it is known */
   css(); A.overlay=null; const el=document.getElementById('app'); if(!el) return _render.apply(this,arguments);
   el.innerHTML=lockHTML(); document.body.classList.add('tm-on'); document.body.classList.remove('hp-on'); return; }
 document.body.classList.remove('tm-on'); return _render.apply(this,arguments); };
document.addEventListener('click',e=>{ const b=e.target.closest('[data-tm]'); if(!b) return; if(b.dataset.tm==='go'){ try{ SND.tap(); }catch(x){} startClass(b.dataset.id); } },true);
/* v162: the class answer arrives WITH sign-in (msSignInFast, HomePage.html sets window.TL_PRE_TM), so no extra trip and no wait */
function use(r){ if(r&&r.until&&r.now) r.until=Date.now()+(r.until-r.now); if(r) addTeacherLessons(r); TMC.s=r||null; TMC.done=0; }
function pre(sid){ const p=window.TL_PRE_TM; if(!p||p.sid!==sid||!p.ok||Date.now()-p.at>120000) return false; window.TL_PRE_TM=null; use(p.r); TMC.checked=sid; return true; }
function check(){
 if(!(SRV&&SRV.token&&A.st&&A.view!=='signin')) return;
 const sid=A.st.id, tok=SRV.token;
 run('tmMine',tok).then(r=>{ if(SRV.token!==tok) return; const was=TMC.s, first=TMC.checked!==sid; TMC.checked=sid;
   if(r&&r.until&&r.now) r.until=Date.now()+(r.until-r.now);
   if(!was||!r||was.id!==r.id) TMC.done=0;
   if(r) addTeacherLessons(r);
   TMC.s=r||null;
   if(was&&!r){ if(A.view==='hub') render(); try{ toast('Class is over. Great work today! 🎉'); }catch(e){} return; }
   if(r&&(!was||was.id!==r.id)){ const rs=r.skills&&r.skills.length?r.skills:[r.skill]; if(A.view==='play'&&A.play&&rs.indexOf(A.play.id)<0){ A.view='hub'; A.play=null; } if(A.view!=='play'&&A.view!=='result') A.view='hub'; render(); return; }
   if(first) render();
 }).catch(()=>{ if(TMC.checked!==sid){ TMC.checked=sid; render(); } });
}
/* a class that runs out while the server cannot be reached still ends on time */
setInterval(()=>{ if(TMC.s&&TMC.s.until&&Date.now()>TMC.s.until){ TMC.s=null; if(A.view==='hub') render(); } },5000);
setInterval(check,25000);
let lastSid=null; setInterval(()=>{ const sid=A.st&&A.view!=='signin'?A.st.id:null; if(sid===lastSid) return; lastSid=sid;
 if(!sid){ TMC.s=null; TMC.done=0; TMC.checked=null; return; }
 if(TMC.checked===sid) return;                                    /* already answered at sign-in */
 TMC.s=null; TMC.done=0; if(pre(sid)){ if(TMC.s&&A.view==='hub') render(); return; } check(); },700);
})();
</script>
