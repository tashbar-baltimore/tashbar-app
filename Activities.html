<script>
/* Activities.html — lesson-page engine upgrade (v166, takeover4; HoS DECISION 1820Z: QUESTION 1045 (A)+(B); 00 PROPOSAL v2 115y1UXF…).
   For EVERY subject on the standard lesson page (Math, Reading, Writing, Science, Social Studies, Electives, Arts, Fact Finders, Kodesh lessons …):
   1. GUARD: an item with an unknown type t is skipped (console.warn), never a blank screen or a stuck lesson.
   2. NEW KINDS (practice[], re[], we[] only; check[] stays tap/order; boss rounds never use them):
      sort    {t:'sort', q, bins:[{id,label}], items:[{label,bin}], h}      tap a card, then tap its box. Right when every card is in its box.
      pairs   {t:'pairs', q, pairs:[[left,right],…], h}                     tap a left, then its match. Right when every pair is matched.
      type    {t:'type', q, a, alt:[…], kb:'num'|'abc', h}                  type the answer. Judged: trim, lower case, one space, no final "."; numbers by value.
      spotall {t:'spotall', q, cells:[{label,ok}], h}                       tap every right one. Right when all ok:true and no ok:false are chosen.
   3. WHY? CARD: after a right answer, when the skill's band is '5-6' or '7-8' and the item has why (and optional chav).
   4. TRY TOGETHER with fading: a skill's optional we[] (2-3 items with steps[]) plays first in practice: all steps but the last, then one, then none.
   5. WARM-UP: before Learn, up to 2 quick check questions from skills he mastered about 1 day / 1 week / 1 month ago (no mastery or money rule changes).
   8. QUICK MATCH (v174): every skill without a new-kind item gets a pairs review from its own teach/practice questions.
   7. STUCK PATH (v170): 3rd miss shows the skill's peg card (peg:{kind,show,say}); 5th miss offers "Talk to my Rebbe".
   6. CONTENT GUARD (v169): person and body-part pictures in lesson text show as neutral symbols (display only).
   Money and mastery rules do not change: mastery still comes only from check[]. No "double slash" in this file (HtmlService). Loaded after StoreKid. */
(function(){
if(typeof render!=='function'||typeof A==='undefined'||typeof prepItem!=='function') return;
const KINDS=['sort','pairs','type','spotall'], KNOWN=['mc','num','order','write','b','s',''].concat(KINDS);
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mix=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const norm=s=>String(s==null?'':s).trim().toLowerCase().replace(/\s+/g,' ').replace(/\.$/,'');
window.TL_AK={version:'act-1.0',kinds:KINDS.slice(),skipped:0};

/* ---------- styles ---------- */
try{ if(!document.getElementById('ak-css')){ const s=document.createElement('style'); s.id='ak-css'; s.textContent=`
.ak{margin:14px 0 6px}.ak .akhelp{color:var(--soft,#6B7280);font-size:15px;margin:0 0 8px}
.ak .chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 12px}
.ak .chip{border:2px solid #CBD5E1;background:#fff;border-radius:14px;padding:12px 16px;font:inherit;font-size:18px;font-weight:700;cursor:pointer;min-height:48px;text-align:left;color:#14213D}
.ak .chip.sel{border-color:#4F46E5;background:#EEF2FF;box-shadow:0 0 0 3px rgba(79,70,229,.25)}.ak .chip.on{border-color:#059669;background:#ECFDF5}.ak .chip:disabled{opacity:.6;cursor:default}
.ak .bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.ak .bin{border:3px dashed #A5B4FC;border-radius:18px;padding:10px;min-height:96px;background:#F8FAFF;cursor:pointer;text-align:left;font:inherit;color:#14213D}
.ak .bin h4{margin:0 0 8px;font-size:17px}.ak .bin .in{display:flex;flex-direction:column;gap:6px}.ak .bin .in span{background:#fff;border:1px solid #C7D2FE;border-radius:10px;padding:6px 10px;font-size:15px}
.ak .bin.ready{border-color:#4F46E5;background:#EEF2FF}
.ak .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ak .cols .col{display:flex;flex-direction:column;gap:8px}
.ak .chip .tag{display:inline-block;min-width:24px;border-radius:999px;color:#fff;font-size:13px;text-align:center;margin-right:6px;padding:1px 6px}
.ak.typer{display:flex;gap:10px;flex-wrap:wrap}.ak.typer input{flex:1;min-width:180px;font:inherit;font-size:22px;border:2px solid #CBD5E1;border-radius:14px;padding:12px 14px}
.ak .go{border:0;border-radius:14px;padding:12px 22px;font:800 18px var(--display,system-ui),system-ui,sans-serif;background:#4F46E5;color:#fff;cursor:pointer;min-height:48px}.ak .go:disabled{background:#CBD5E1;cursor:default}
.ak .count{font-weight:800;color:#4F46E5;margin-left:8px}
.akwhy{margin:12px 0;border-radius:16px;background:#ECFDF5;border:2px solid #A7F3D0;padding:12px 14px;color:#064E3B}.akwhy b{display:block;font-size:17px}.akwhy .chav{margin-top:6px;color:#047857;font-weight:700}
.akwe{margin:0 0 12px;border-radius:16px;background:#FFF7ED;border:2px solid #FED7AA;padding:12px 14px;color:#7C2D12}.akwe b{display:block;margin-bottom:4px}.akwe ol{margin:4px 0 0 20px;padding:0}.akwe li.blank{color:#C2410C;font-style:italic}
.akpeg{margin:12px 0;border-radius:16px;background:#F5F3FF;border:2px solid #C4B5FD;padding:12px 14px;color:#3B0764}.akpeg b{display:block;margin-bottom:4px}.akpeg .ps{font-size:28px;margin:4px 0}.akstuck{margin:12px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#EEF2FF;border-radius:16px;padding:12px 14px;color:#312E81;font-weight:700}.akwarm{display:inline-block;background:#FEF3C7;color:#92400E;border-radius:999px;padding:3px 10px;font-weight:800;font-size:13px;margin-bottom:6px}
@media (max-width:600px){.ak .cols{grid-template-columns:1fr 1fr}.ak .chip{font-size:16px;padding:10px 12px}}`; document.head.appendChild(s); } }catch(e){}

/* ---------- 1+2. prepare items (guard + new kinds) ---------- */
function shape(it){
  if(it.t==='sort'){ const items=(it.items||[]).map((x,i)=>({i,label:String(x.label),bin:String(x.bin)})); if(!(it.bins||[]).length||!items.length) return false; it._items=mix(items); it.correct=items.map(x=>x.bin).join('|'); }
  else if(it.t==='pairs'){ const P=(it.pairs||[]).map((x,i)=>({k:i,l:String(x[0]),r:String(x[1])})); if(P.length<2) return false; it._left=P.map(x=>({k:x.k,html:x.l})); let R=mix(P.map(x=>({k:x.k,html:x.r}))); if(R.every((x,i)=>x.k===i)&&R.length>1) R=R.slice(1).concat(R[0]); it._right=R; it.correct=P.map(x=>x.k).join('|'); }
  else if(it.t==='spotall'){ const C=(it.cells||[]).map((x,i)=>({i,label:String(x.label),ok:!!x.ok})); if(!C.some(c=>c.ok)) return false; it._cells=mix(C); it.correct=C.filter(c=>c.ok).map(c=>c.i).sort((a,b)=>a-b).join(','); }
  else if(it.t==='type'){ if(it.a===undefined||it.a===null||it.a==='') return false; it.correct=String(it.a); }
  return true;
}
const _prep=prepItem;
prepItem=function(raw,phase){
  const t=raw&&typeof raw.t==='string'?raw.t:'';
  if(raw&&t&&KNOWN.indexOf(t)<0){ const it=clone(raw); it.phase=phase; it._bad='unknown type '+t; return it; }
  if(KINDS.indexOf(t)>=0){ const it=clone(raw); it.phase=phase; if(!shape(it)) it._bad='bad '+t+' item'; return it; }
  return _prep.apply(this,arguments);
};
function clean(list,where){ return (list||[]).filter(it=>{ if(it&&it._bad){ TL_AK.skipped++; try{ console.warn('Lesson item skipped ('+where+'): '+it._bad+' · '+String(it.q||'').slice(0,60)); }catch(e){} return false; } return true; }); }

/* ---------- 4+5. try together (we[]) and warm-up, added to normal lessons ---------- */
const _bm=buildMission;
buildMission=function(id){
  let items=clean(_bm.apply(this,arguments),id);
  try{ const s=(typeof BANK_ALL!=='undefined'&&BANK_ALL[id])||null;
    /* check[] stays tap/order: a new kind that slipped into check is turned into practice so it never decides mastery */
    items.forEach(it=>{ if(it.phase==='check'&&KINDS.indexOf(it.t)>=0){ it.phase='practice'; } });
    if(s&&Array.isArray(s.we)&&s.we.length){ const we=clean(s.we.slice(0,3).map((x,k)=>{ const it=prepItem(x,'practice'); const st=Array.isArray(x.steps)?x.steps:[]; it._we={steps:st,show:Math.max(0,st.length-1-k)}; return it; }),id+' we');
      const at=items.findIndex(x=>x.phase==='practice'); if(at>=0) items.splice(at,0,...we); }
  }catch(e){ console.warn('try together',e); }
  try{ const s=(typeof BANK_ALL!=='undefined'&&BANK_ALL[id])||null, pr=s&&qmPairs(id,s);
    if(pr){ const it=prepItem(Object.assign({t:'pairs',q:pr.p?QM_SQ:QM_Q,pairs:pr.slice(),h:pr.p?'Look back in the story for each answer.':'Each answer goes with one question.'},pr.p?{p:pr.p}:{}),'practice'); it.skill=id;
      try{ if(window.TL_DO){ TL_DO[id]=TL_DO[id]||{}; TL_DO[id].q=TL_DO[id].q||{}; const qk=pr.p?QM_SQ:QM_Q; if(!TL_DO[id].q[qk]) TL_DO[id].q[qk]=qmBox(id); } }catch(x){}
      const idx=items.map(x=>x.phase).lastIndexOf('practice'); if(idx>=0&&!it._bad){ items.splice(idx,0,it); TL_AK.quick++; } } }catch(e){ console.warn('quick match',e); }
  try{ const s=(window.TL_FACT&&TL_FACT[id])||(typeof BANK_ALL!=='undefined'&&BANK_ALL[id])||null;   /* v179: a lesson that picks only some practice items must still show its new-kind item */
    if(s&&!items.some(x=>KINDS.indexOf(x.t)>=0)){ const k=(s.practice||[]).find(x=>x&&KINDS.indexOf(x.t)>=0);
      if(k){ const it=prepItem(k,'practice'); it.skill=id; const idx=items.map(x=>x.phase).lastIndexOf('practice'); if(idx>=0&&!it._bad){ items.splice(idx,0,it); TL_AK.kept=(TL_AK.kept||0)+1; } } } }catch(e){ console.warn('keep kind',e); }
  return items;
};
/* 8. QUICK MATCH (v174, HoS "do all the subjects"): every standard-page skill that has no new-kind item yet gets one "Quick Match"
   practice item made from its OWN teach and practice questions (never check[], so check answers are not given away): 3-4 short
   question → answer pairs, matched by tapping. Facts are the lesson's own. Not for Kodesh, Lashon Hakodesh, the Holocaust lessons,
   or Level 1-2 (still learning to read). Its How-to box uses the skill's own method box. Mastery still comes only from check[]. */
const QM_Q='Quick Match: match each question to its answer.';
const QM_SQ='Story Match: read the story, then match each question to its answer.';
const QM_SKIP=/^(LK|HEB|SIM|VOC)\.|^SS\.JHIST\.L0[89]\.0[1-4]$/;
function qmPairs(id,s){ try{
  if(QM_SKIP.test(id)) return null; const lv=+(String(id).match(/\.L(\d+)\./)||[])[1]; if(!lv||lv<3) return null;
  if((s.practice||[]).some(x=>x&&KINDS.indexOf(x.t)>=0)) return null;
  const story=[].concat(s.teach||[],s.practice||[],s.check||[]).some(x=>x&&x.p);   /* v179: story lessons get a Story Match that shows the story */
  let pool=[].concat(s.teach||[],s.practice||[]).filter(x=>x&&(!x.t||x.t==='mc')&&Array.isArray(x.o)&&x.o.length>=2&&x.tape===undefined&&!x.rashi);
  let P=null;
  if(story){ const g={}; pool.filter(x=>x.p).forEach(x=>{ (g[x.p]=g[x.p]||[]).push(x); }); const best=Object.keys(g).sort((a,b)=>g[b].length-g[a].length)[0];
    if(!best||g[best].length<3) return null; P=best; pool=g[best]; }
  else pool=pool.filter(x=>!x.p);
  const out=[], L={}, R={};
  for(const x of pool){ let q=String(x.q||'').trim(); const a=String(x.o[0]||'').trim(); if(!q||!a) continue;
    const qi=q.indexOf('?'); if(qi>0&&q.slice(qi+1).toLowerCase().indexOf(a.toLowerCase())>=0) q=q.slice(0,qi+1).trim();
    if(q.length>120||a.length>48||q.length<12) continue;
    if(/^(yes|no|true|false|both|neither|none|all of them)\b/i.test(a)) continue;
    if(/\b(these|those|this|that one|it says|he says)\b/i.test(q)) continue;
    { const k3=q.toLowerCase().split(/\s+/).slice(0,3).join(' '); if(out.some(p=>p[0].toLowerCase().split(/\s+/).slice(0,3).join(' ')===k3)) continue; }
    if(/look at|picture|the map|the graph|the timeline|the chart|the box|this one|which one|above|below/i.test(q)) continue;
    if(!P&&/the passage|the story/i.test(q)) continue;
    if(q.toLowerCase().indexOf(a.toLowerCase())>=0) continue;
    if(L[q]||R[a.toLowerCase()]) continue;
    if(out.some(p=>q.toLowerCase().indexOf(p[1].toLowerCase())>=0||p[0].toLowerCase().indexOf(a.toLowerCase())>=0)) continue;
    L[q]=1; R[a.toLowerCase()]=1; out.push([q,a]); if(out.length>=4) break; }
  if(out.length<3) return null; if(P) out.p=P; return out; }catch(e){ return null; } }
function qmBox(id){ try{ const d=window.TL_DO&&TL_DO[id]; const ls=String(d&&d.s||'').split('\n').filter(l=>l.trim()); const head=ls.slice(0,2).join('\n');
  return (head?head+'\n':'')+'Your turn: read each question, then find its answer.\nTap a question, then its answer.'; }catch(e){ return 'Read each question, then find its answer.\nTap a question, then its answer.'; } }
window.tlQuickMatch=qmPairs; TL_AK.quick=0;
const _br=typeof buildRetry==='function'?buildRetry:null; if(_br) buildRetry=function(){ return clean(_br.apply(this,arguments),'retry'); };
const _bb=typeof buildBoss==='function'?buildBoss:null; if(_bb) buildBoss=function(){ return clean(_bb.apply(this,arguments),'boss').filter(it=>KINDS.indexOf(it.t)<0); };
function warmItems(st,id){ try{
  const now=Date.now(), DAY=864e5, want=[[DAY*.6,DAY*3],[DAY*5,DAY*10],[DAY*24,DAY*40]], out=[], used={};
  const done=Object.keys(st.skills||{}).filter(k=>k!==id&&st.skills[k]&&st.skills[k].m&&typeof BANK_ALL!=='undefined'&&BANK_ALL[k]&&Array.isArray(BANK_ALL[k].check));
  const same=k=>String(k).split('.')[0]===String(id).split('.')[0];
  want.forEach(([lo,hi])=>{ if(out.length>=2) return; const c=done.filter(k=>!used[k]&&now-(st.skills[k].at||0)>=lo&&now-(st.skills[k].at||0)<=hi).sort((a,b)=>(same(b)?1:0)-(same(a)?1:0))[0]; if(!c) return; used[c]=1;
    const pool=BANK_ALL[c].check.filter(x=>!x.t||x.t==='mc'||x.t==='order'||x.t==='num'); if(!pool.length) return; const raw=pool[Math.floor(Math.random()*pool.length)];
    const it=prepItem(raw,'warm'); if(it._bad) return; it.skill=c; it._warm=skillName(c); out.push(it); });
  return out; }catch(e){ return []; } }
const _sm=startMission;
startMission=function(c,id,kind){ const out=_sm.apply(this,arguments); try{
  const p=A.play; if(p&&p.kind==='skill'&&!p.replay&&!kind&&A.st){ const w=warmItems(A.st,id); if(w.length){ p.items=w.concat(p.items); p.warm=w.length; A.overlay=null; render(); phaseIntro(); } }
}catch(e){ console.warn('warm-up',e); } return out; };
const _pi=phaseIntro;
phaseIntro=function(){ try{ const p=A.play, it=p&&p.items[p.i]; if(it&&it.phase==='warm'){ if(p.i>0) return; overlay(`<div class="oe">🔁</div><h2>Warm-up</h2><p>${p.warm} quick question${p.warm>1?'s':''} from skills you already know. Keep them fresh!</p><button class="btn go big" data-act="closeov">Let’s go</button>`); return; } }catch(e){} return _pi.apply(this,arguments); };

/* ---------- answers ---------- */
const _ck=checkAnswer;
checkAnswer=function(it,ans){
  if(it&&it.t==='type'){ const a=norm(ans); if(!a) return false; const list=[it.a].concat(it.alt||[]).map(norm);
    if(list.indexOf(a)>=0) return true; const n=parseFloat(a.replace(/,/g,'')); return /^-?[\d.,]+$/.test(a)&&list.some(x=>/^-?[\d.,]+$/.test(x)&&isFinite(n)&&Math.abs(parseFloat(x.replace(/,/g,''))-n)<1e-9); }
  if(it&&KINDS.indexOf(it.t)>=0) return String(ans)===String(it.correct);
  return _ck.apply(this,arguments);
};
const _ans=answer;
answer=function(ans,el){ const p=A.play, it=p&&p.items[p.i]; const r=_ans.apply(this,arguments);
  try{ if(it&&KINDS.indexOf(it.t)>=0&&p.fb&&!p.fb.ok&&it.phase!=='check'){ p.ak=null; if(it.t==='sort'||it.t==='spotall'||it.t==='pairs'){ if(it._items) it._items=mix(it._items); if(it._cells) it._cells=mix(it._cells); if(it._right) it._right=mix(it._right); } render(); } }catch(e){}
  return r; };
const _nx=next; next=function(){ if(A.play) A.play.ak=null; return _nx.apply(this,arguments); };

/* ---------- drawing ---------- */
function S(){ const p=A.play; p.ak=p.ak||{sel:null,place:{},link:{},on:{},text:''}; return p.ak; }
const COL=['#4F46E5','#DB2777','#059669','#D97706','#0891B2','#7C3AED'];
function kindHTML(it,locked,cooling){ const s=S(), dis=locked||cooling?'disabled':'';
  if(it.t==='sort'){ const left=it._items.filter(x=>!(x.i in s.place)); const all=it._items.length, n=Object.keys(s.place).length;
    return `<div class="ak" data-ak-kind="sort"><p class="akhelp">Tap a card, then tap the box it belongs in.</p><div class="chips">${left.map(x=>`<button class="chip ${s.sel===x.i?'sel':''}" data-ak="pick" data-i="${x.i}" ${dis}>${E(x.label)}</button>`).join('')||'<span class="akhelp">All cards are in boxes.</span>'}</div>
     <div class="bins">${it.bins.map(b=>`<button class="bin ${s.sel!==null?'ready':''}" data-ak="drop" data-b="${E(b.id)}" ${dis}><h4>${E(b.label)}</h4><div class="in">${it._items.filter(x=>s.place[x.i]===String(b.id)).map(x=>`<span>${E(x.label)}</span>`).join('')}</div></button>`).join('')}</div>
     <p><button class="go" data-ak="check" ${n<all||locked||cooling?'disabled':''}>Check</button> ${n?`<button class="chip" data-ak="reset" ${dis}>Start over</button>`:''}</p></div>`; }
  if(it.t==='pairs'){ const used={}; Object.keys(s.link).forEach(l=>used[s.link[l]]=l); const all=it._left.length, n=Object.keys(s.link).length;
    const tag=k=>{ const idx=Object.keys(s.link).indexOf(String(k)); return idx>=0?`<span class="tag" style="background:${COL[idx%COL.length]}">${idx+1}</span>`:''; };
    return `<div class="ak" data-ak-kind="pairs"><p class="akhelp">Tap one on the left, then its match on the right.</p><div class="cols"><div class="col">${it._left.map(x=>`<button class="chip ${s.sel===x.k?'sel':''} ${x.k in s.link?'on':''}" data-ak="left" data-k="${x.k}" ${dis}>${tag(x.k)}${E(x.html)}</button>`).join('')}</div>
     <div class="col">${it._right.map(x=>{ const l=used[x.k]; return `<button class="chip ${l!==undefined?'on':''}" data-ak="right" data-k="${x.k}" ${dis}>${l!==undefined?tag(l):''}${E(x.html)}</button>`; }).join('')}</div></div>
     <p><button class="go" data-ak="check" ${n<all||locked||cooling?'disabled':''}>Check</button> ${n?`<button class="chip" data-ak="reset" ${dis}>Start over</button>`:''}</p></div>`; }
  if(it.t==='spotall'){ const n=Object.keys(s.on).length;
    return `<div class="ak" data-ak-kind="spotall"><p class="akhelp">Tap every one that fits. Tap again to take it back.<span class="count">${n} chosen</span></p><div class="chips">${it._cells.map(c=>`<button class="chip ${s.on[c.i]?'on':''}" data-ak="spot" data-i="${c.i}" aria-pressed="${!!s.on[c.i]}" ${dis}>${s.on[c.i]?'✓ ':''}${E(c.label)}</button>`).join('')}</div>
     <p><button class="go" data-ak="check" ${!n||locked||cooling?'disabled':''}>Check</button></p></div>`; }
  if(it.t==='type'){ return `<form class="ak typer" data-ak-form="1"><label for="akin" class="vh">Your answer</label><input id="akin" ${it.kb==='num'?'inputmode="decimal"':''} autocomplete="off" spellcheck="false" placeholder="Type your answer" value="${E(locked?(A.play.sel||''):s.text)}" ${dis}><button class="go" ${dis}>Check</button></form>`; }
  return ''; }
function band(id){ try{ const s=BANK_ALL[id]; return s&&s.band||''; }catch(e){ return ''; } }
const _vp=vPlay;
vPlay=function(){ let h=_vp.apply(this,arguments); try{
  const p=A.play, it=p.items[p.i], locked=p.fb&&(p.fb.ok||it.phase==='check'), cooling=!!(p.cool&&Date.now()<p.cool);
  const at=h.indexOf('<div class="qrow">'); const end=at>=0?h.indexOf('</button></div>',at):-1; if(end<0) return h; const cut=end+'</button></div>'.length;
  let before='', after='';
  if(it.phase==='warm') before+=`<span class="akwarm">🔁 Warm-up · ${E(it._warm||'')}</span>`;
  if(it._we&&it._we.steps.length){ before+=`<div class="akwe"><b>🤝 Try it together</b><ol>${it._we.steps.map((t,k)=>k<it._we.show?`<li>${E(t)}</li>`:`<li class="blank">Your turn: what comes next?</li>`).slice(0,Math.min(it._we.steps.length,it._we.show+1)).join('')}</ol></div>`; }
  if(KINDS.indexOf(it.t)>=0) after+=kindHTML(it,locked,cooling);
  /* 7. STUCK PATH (v170): 3rd miss on an item shows the skill's memory-peg card (peg:{kind,show,say}, Kodesh Quest v7 shape); 5th miss offers "Talk to my Rebbe". */
  if(p.fb&&!p.fb.ok&&it.phase!=='check'){ const sk=(typeof BANK_ALL!=='undefined'&&BANK_ALL[it.skill||p.id])||{};
    if(p.tries>=3&&sk.peg&&(sk.peg.show||sk.peg.say)) after+=`<div class="akpeg" role="note"><b>🧠 Remember it this way${sk.peg.kind?' · '+E(sk.peg.kind):''}</b>${sk.peg.show?`<div class="ps">${E(sk.peg.show)}</div>`:''}${sk.peg.say?`<div>${E(sk.peg.say)}</div>`:''}</div>`;
    if(p.tries>=5&&typeof window.tlTalkRebbe==='function') after+=`<div class="akstuck"><span>Still stuck? That's OK. Your rebbe or teacher can help.</span><button type="button" class="go" data-ak="rebbe">✉️ Talk to my Rebbe</button></div>`; }
  if(p.fb&&p.fb.ok&&it.why&&/^(5-6|7-8)$/.test(band(it.skill||p.id))) after+=`<div class="akwhy" role="note"><b>✅ Correct! Why?</b>${E(it.why)}${it.chav||true?`<div class="chav">🗣️ ${E(it.chav||'Explain it to your chavrusa in your own words.')}</div>`:''}</div>`;
  if(before){ const q=h.indexOf('<div class="qrow">'); h=h.slice(0,q)+before+h.slice(q); return h.slice(0,cut+before.length)+after+h.slice(cut+before.length); }
  return h.slice(0,cut)+after+h.slice(cut);
}catch(e){ console.error('Activities',e); } return h; };


/* ---------- 6. CONTENT GUARD (v169): no person or body-part pictures in lesson text (rule: boys only, modesty; checker REPORT F-B found them in
   Social 66, Reading 41, Nuclear 18, Science 15, Computing 12, Life 3). Display only: each picture of a person or body part in the question,
   choices, tiles, hints, How-to box and picture box becomes one fixed neutral symbol, so counting pictures still count right.
   The lesson data, the answer check and the How-to keys do not change. Guides (Rabbi K) and Kodesh Quest are not touched. */
const PMAP={'🚶':'🥾','🏃':'👟','🧍':'📍','🧎':'📍','🚴':'🚲','🚵':'🚲','🏊':'🌊','🏄':'🌊','🚣':'🛶','🏇':'🐎','⛷':'🎿','🏂':'🏔️','🤸':'⭐','🧗':'⛰️','🏋':'🏆','⛹':'🏀','🤾':'⚽','🤽':'🌊','🤼':'🥇','🤹':'🎪','🧘':'🕊️','🛀':'🛁','🛌':'🛏️','💃':'🎵','🕺':'🎵','👯':'🎵','🕴':'🎩',
 '👋':'🙂','🤚':'⛔','🖐':'⛔','✋':'⛔','🖖':'✨','👌':'✅','🤌':'✨','🤏':'🔹','✌':'✨','🤞':'🍀','🤟':'💜','🤘':'🎸','🤙':'📞','👈':'⬅️','👉':'➡️','👆':'⬆️','🖕':'❌','👇':'⬇️','☝':'1️⃣','👍':'✅','👎':'❌','✊':'💥','👊':'💥','🤛':'💥','🤜':'💥','👏':'🎉','🙌':'🎉','👐':'📖','🤲':'📖','🤝':'🔗','🙏':'✨','✍':'✏️','💅':'✨','🤳':'📱','💪':'⚡','🦾':'⚙️','🦿':'⚙️','🦵':'📏','🦶':'📏','👂':'🔊','🦻':'🔊','👃':'🌸','🧠':'💡','🫀':'❤️','🫁':'🎈','🦷':'🪥','🦴':'🦴','👀':'🔍','👁':'🔍','👅':'🍭','👄':'💬','💋':'💌','🗣':'💬','👤':'🔵','👥':'🔵','🫂':'💛','👣':'🐾'};
const PERSON=/(?:[\u{1F466}-\u{1F469}\u{1F474}-\u{1F478}\u{1F46E}-\u{1F473}\u{1F47C}\u{1F481}-\u{1F487}\u{1F645}-\u{1F647}\u{1F64B}-\u{1F64E}\u{1F930}-\u{1F931}\u{1F934}-\u{1F936}\u{1F9B8}\u{1F9B9}\u{1F9D1}-\u{1F9DF}\u{1F9CF}\u{1F926}\u{1F937}\u{1F46A}-\u{1F46D}\u{1F48F}\u{1F491}\u{1F385}\u{1F936}\u{1F9D4}\u{1F9D5}\u{1F977}\u{1F470}\u{1F471}\u{1F472}\u{1F473}\u{1F935}\u{1F930}\u{1F931}\u{1F574}\u{1F575}\u{1F482}\u{1F477}\u{1F934}\u{1F478}\u{1F9DC}\u{1F9DD}\u{1F9DE}\u{1F9DF}])(?:[\u{1F3FB}-\u{1F3FF}])?(?:️)?(?:‍[^\s]{1,3})*/gu;
const BODY=new RegExp('('+Object.keys(PMAP).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?:[\\u{1F3FB}-\\u{1F3FF}])?(?:\\uFE0F)?(?:\\u200D[^\\s]{1,3})*','gu');
function scrubText(t){ if(!t||!/[\u{1F300}-\u{1FAFF}☀-➿]/u.test(t)) return t; return t.replace(PERSON,'🔵').replace(BODY,(m,b)=>PMAP[b]||'🔵'); }
window.tlScrub=scrubText;
function scrubDom(root){ try{ if(!root) return; const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); let n, k=0; while((n=w.nextNode())&&k<4000){ k++; const v=n.nodeValue, x=scrubText(v); if(x!==v){ n.nodeValue=x; TL_AK.scrubbed=(TL_AK.scrubbed||0)+1; } } }catch(e){} }
function scrubPlay(){ if(A.view!=='play') return; document.querySelectorAll('.play .qcard, .play .passage, .overlay .ocard').forEach(scrubDom); }
/* keep a note the boy is writing (Talk to my Rebbe) when the lesson screen redraws behind it */
document.addEventListener('input',e=>{ if(e.target&&e.target.id==='tr-text') TL_AK.trText=e.target.value; });
function keepNote(){ const ta=document.getElementById('tr-text'); if(!ta){ TL_AK.trText=''; return; } if(!ta.value&&TL_AK.trText){ ta.value=TL_AK.trText; ta.dispatchEvent(new Event('input')); } }
const _rd=render; render=function(){ const r=_rd.apply(this,arguments); try{ scrubPlay(); keepNote(); }catch(e){} return r; };
try{ new MutationObserver(()=>{ if(A.view==='play'&&!TL_AK._mq){ TL_AK._mq=1; requestAnimationFrame(()=>{ TL_AK._mq=0; scrubPlay(); }); } }).observe(document.getElementById('app')||document.body,{childList:true,subtree:true,characterData:true}); }catch(e){}
/* ---------- taps ---------- */
document.addEventListener('click',e=>{ const b=e.target.closest&&e.target.closest('[data-ak]'); if(!b||!A.play||A.view!=='play') return; e.preventDefault(); e.stopPropagation();
  const p=A.play, it=p.items[p.i], s=S(), a=b.dataset.ak; if(p.fb&&(p.fb.ok||it.phase==='check')) return;
  if(a==='pick'){ s.sel=s.sel===+b.dataset.i?null:+b.dataset.i; }
  else if(a==='drop'){ if(s.sel===null) return; s.place[s.sel]=String(b.dataset.b); s.sel=null; }
  else if(a==='left'){ const k=+b.dataset.k; if(k in s.link){ delete s.link[k]; s.sel=null; } else s.sel=k; }
  else if(a==='right'){ if(s.sel===null) return; const k=+b.dataset.k; Object.keys(s.link).forEach(l=>{ if(s.link[l]===k) delete s.link[l]; }); s.link[s.sel]=k; s.sel=null; }
  else if(a==='spot'){ const i=+b.dataset.i; if(s.on[i]) delete s.on[i]; else s.on[i]=1; }
  else if(a==='reset'){ p.ak=null; }
  else if(a==='rebbe'){ try{ const nm=skillName(p.id); window.tlTalkRebbe(); setTimeout(()=>{ const ta=document.getElementById('tr-text'); if(ta&&!ta.value){ ta.value='I am stuck on a lesson: '+nm+'. Can you help me?'; TL_AK.trText=ta.value; ta.dispatchEvent(new Event('input')); } },80); }catch(x){} return; }
  else if(a==='check'){ let ans='';
    if(it.t==='sort') ans=it._items.slice().sort((x,y)=>x.i-y.i).map(x=>s.place[x.i]||'').join('|');
    if(it.t==='pairs') ans=it._left.slice().sort((x,y)=>x.k-y.k).map(x=>s.link[x.k]===undefined?'':s.link[x.k]).join('|');
    if(it.t==='spotall') ans=Object.keys(s.on).map(Number).sort((x,y)=>x-y).join(',');
    answer(ans,null); return; }
  try{ if(window.SND&&SND.tap) SND.tap(); }catch(x){} render(); },true);
document.addEventListener('submit',e=>{ const f=e.target; if(!f||!f.dataset||!f.dataset.akForm||!A.play) return; e.preventDefault(); e.stopPropagation(); const v=(document.getElementById('akin')||{}).value||''; S().text=v; if(v.trim()) answer(v,null); },true);
document.addEventListener('input',e=>{ if(e.target&&e.target.id==='akin'&&A.play) S().text=e.target.value; });
})();
</script>
