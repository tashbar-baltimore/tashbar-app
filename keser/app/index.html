<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A1650">
<title>Keser Girls 3.0</title>
<link rel="stylesheet" href="kit.css">
<link rel="prefetch" href="signin.html">
<style>
/* WELCOME (M. Heinemann 2026-11-26: "clean and neat and fresh, not overwhelming"): the Keser logo on Keser purple, and Enter. */
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; overflow:hidden; color:#fff; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--keser); }
.sky{ position:fixed; inset:0; z-index:-1; background:linear-gradient(180deg,#341C62 0%,var(--keser) 55%,#1F1040 100%); }
main{ position:relative; z-index:1; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; padding:24px 16px; text-align:center; }
.crown{ width:min(56vw,52vh,440px); animation:in .9s ease both; }
.crown img{ width:100%; display:block; filter:drop-shadow(0 10px 24px rgba(10,0,25,.5)); }
.houses{ display:flex; gap:8px; } .houses i{ width:34px; height:4px; border-radius:2px; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
@keyframes in{ from{ opacity:0; transform:translateY(10px) } to{ opacity:1; transform:none } }
@media (prefers-reduced-motion: reduce){ .crown{ animation:none } }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<main>
  <div class="crown" id="crown"><img src="/pics/keser-logo.webp" alt="Keser Academy for Girls"></div>
  <div class="houses" aria-hidden="true"><i style="background:var(--maroon2)"></i><i style="background:var(--emerald)"></i><i style="background:var(--blue2)"></i></div>
  <h1 class="sr">Keser Girls</h1>
  <a class="k-btn" id="enter" href="signin.html">Enter</a>
</main>
<script src="sparkle.js"></script>
</body>
</html>
