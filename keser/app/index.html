<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keser Girls 3.0</title>
<style>
:root{ --bg:#FBF4F1; --ink:#3A2440; --soft:#6E5A73; --card:#FFFFFF; --line:#EADBD8; --plum:#7A3E7E; --gold:#C9A24A; }
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
main{ min-height:100%; display:grid; place-items:center; padding:24px 16px; }
.card{ width:100%; max-width:520px; background:var(--card); border:2px solid var(--line); border-radius:24px; padding:32px 24px; text-align:center; }
.crown{ width:72px; height:56px; margin:0 auto 12px; display:block; }
.he{ font-size:22px; color:var(--plum); margin:0 0 4px; font-weight:700; }
h1{ margin:0 0 8px; font-size:32px; } p{ margin:8px 0; color:var(--soft); font-size:18px; line-height:1.4; }
.tag{ display:inline-block; background:var(--plum); color:#fff; border-radius:999px; padding:4px 14px; font-weight:700; font-size:14px; margin-bottom:16px; }
</style>
</head>
<body>
<main><div class="card">
  <svg class="crown" viewBox="0 0 72 56" aria-hidden="true"><path d="M6 46 L10 14 L24 30 L36 6 L48 30 L62 14 L66 46 Z" fill="#C9A24A" stroke="#7A3E7E" stroke-width="3" stroke-linejoin="round"/><rect x="6" y="46" width="60" height="7" rx="3" fill="#7A3E7E"/></svg>
  <span class="tag">3.0</span>
  <p class="he" lang="he" dir="rtl">כתר</p>
  <h1>Keser Girls</h1>
  <p>Welcome! Our learning app is being built just for you.</p>
  <p>New things will appear here soon.</p>
</div></main>
</body>
</html>
