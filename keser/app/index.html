<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keser Girls 3.0</title>
<style>
:root{ --bg:#FBF3F6; --ink:#3B1A4A; --soft:#7A6382; --card:#FFFFFF; --rose:#E0568F; --plum:#7E3FC2; --gold:#E9B44C; }
*{ box-sizing:border-box; }
html,body{ margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
main{ min-height:100vh; display:grid; place-items:center; padding:24px 16px; }
.card{ width:100%; max-width:420px; background:var(--card); border:3px solid var(--gold); border-radius:28px; overflow:hidden; text-align:center;
  box-shadow:0 16px 36px -20px rgba(126,63,194,.5); }
.top{ padding:36px 20px 30px; background:linear-gradient(135deg,var(--rose),var(--plum)); }
.crown{ width:104px; height:80px; display:block; margin:0 auto; }
.body{ padding:24px 24px 30px; }
.he{ margin:0; font-size:20px; font-weight:700; color:var(--plum); }
h1{ margin:4px 0 0; font-size:36px; font-weight:800; letter-spacing:-.01em; }
.soon{ margin:14px 0 0; color:var(--soft); font-size:18px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="top">
      <svg class="crown" viewBox="0 0 120 92" aria-hidden="true">
        <path d="M14 74 L20 24 L41 50 L60 12 L79 50 L100 24 L106 74 Z" fill="#F6CF6A" stroke="#FFF4D6" stroke-width="3" stroke-linejoin="round"/>
        <rect x="12" y="70" width="96" height="14" rx="7" fill="#E9B44C" stroke="#FFF4D6" stroke-width="3"/>
        <circle cx="20" cy="22" r="5" fill="#fff"/><circle cx="60" cy="10" r="6" fill="#fff"/><circle cx="100" cy="22" r="5" fill="#fff"/>
      </svg>
    </div>
    <div class="body">
      <p class="he" lang="he" dir="rtl">כתר</p>
      <h1>Keser Girls</h1>
      <p class="soon">Coming soon</p>
    </div>
  </div>
</main>
</body>
</html>
