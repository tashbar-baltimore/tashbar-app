<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keser Girls 3.0</title>
<style>
:root{
  --bg1:#FFF0F6; --bg2:#F3E8FF; --ink:#3B1A4A; --soft:#6B4D78; --card:#FFFFFF;
  --rose:#F25C9A; --plum:#8B3FD1; --lav:#C9A7F5; --gold:#F2B84B; --gold2:#FFD978;
}
*{ box-sizing:border-box; }
html,body{ margin:0; min-height:100%; color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
body{ background:radial-gradient(circle at 15% 10%, #FFE3EF 0, transparent 40%), radial-gradient(circle at 85% 90%, #EADCFF 0, transparent 45%), linear-gradient(160deg,var(--bg1),var(--bg2)); background-attachment:fixed; }
main{ min-height:100vh; display:grid; place-items:center; padding:24px 16px; position:relative; overflow:hidden; }

/* floating sparkles and hearts in the background */
.float{ position:absolute; pointer-events:none; opacity:.55; animation:drift 9s ease-in-out infinite; }
.float svg{ display:block; }
@keyframes drift{ 0%,100%{ transform:translateY(0) rotate(0) } 50%{ transform:translateY(-18px) rotate(8deg) } }

.card{ position:relative; width:100%; max-width:460px; background:var(--card); border:4px solid var(--gold); border-radius:32px; overflow:hidden;
  box-shadow:0 18px 40px -18px rgba(139,63,209,.45), 0 0 0 8px rgba(255,255,255,.6); text-align:center; }
.top{ position:relative; padding:34px 20px 26px; background:linear-gradient(135deg,var(--rose) 0%,#C04FD6 55%,var(--plum) 100%); }
.top::after{ content:""; position:absolute; inset:0; background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.35) 0,transparent 35%),radial-gradient(circle at 80% 70%,rgba(255,255,255,.2) 0,transparent 30%); }
.crown{ position:relative; z-index:1; width:120px; height:96px; margin:0 auto; display:block; filter:drop-shadow(0 6px 10px rgba(80,20,90,.35)); animation:bob 3.2s ease-in-out infinite; }
@keyframes bob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-6px) } }
.tw{ position:absolute; z-index:1; animation:twinkle 2.4s ease-in-out infinite; }
@keyframes twinkle{ 0%,100%{ opacity:.25; transform:scale(.7) } 50%{ opacity:1; transform:scale(1.1) } }

.body{ padding:24px 24px 30px; }
.he{ margin:0; font-size:22px; font-weight:800; color:var(--plum); letter-spacing:.04em; }
h1{ margin:2px 0 6px; font-size:40px; line-height:1.05; font-weight:900;
  background:linear-gradient(90deg,var(--rose),var(--plum)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.ver{ display:inline-block; margin:0 0 14px; padding:4px 14px; border-radius:999px; background:linear-gradient(90deg,var(--gold),var(--gold2)); color:#5A3A00; font-weight:800; font-size:14px; }
p{ margin:6px 0; color:var(--soft); font-size:19px; line-height:1.45; }
.big{ color:var(--ink); font-weight:700; font-size:21px; }
.soon{ margin-top:18px; display:inline-flex; align-items:center; gap:8px; padding:10px 18px; border-radius:999px; background:#FBEFFF; color:var(--plum); font-weight:800; font-size:16px; border:2px dashed var(--lav); }

@media (prefers-reduced-motion: reduce){ .float,.crown,.tw{ animation:none } }
</style>
</head>
<body>
<main>
  <!-- background sparkles and hearts (decoration only) -->
  <div class="float" style="top:8%;left:8%" aria-hidden="true"><svg width="34" height="34" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3.4 5 6.9 5c2 0 3.3 1.1 5.1 3 1.8-1.9 3.1-3 5.1-3 3.5 0 5.7 3.6 4.4 6.8C19.5 16.4 12 21 12 21z" fill="#F7A8CB"/></svg></div>
  <div class="float" style="top:18%;right:10%;animation-delay:-3s" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="#C9A7F5"/></svg></div>
  <div class="float" style="bottom:12%;left:12%;animation-delay:-5s" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="#FFD978"/></svg></div>
  <div class="float" style="bottom:8%;right:9%;animation-delay:-2s" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3.4 5 6.9 5c2 0 3.3 1.1 5.1 3 1.8-1.9 3.1-3 5.1-3 3.5 0 5.7 3.6 4.4 6.8C19.5 16.4 12 21 12 21z" fill="#D9B8FF"/></svg></div>

  <div class="card">
    <div class="top">
      <svg class="tw" style="top:18px;left:28px" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="#fff"/></svg>
      <svg class="tw" style="top:30px;right:34px;animation-delay:-1s" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="#FFE59A"/></svg>
      <svg class="tw" style="bottom:22px;left:52px;animation-delay:-1.6s" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="#FFE59A"/></svg>
      <svg class="tw" style="bottom:26px;right:56px;animation-delay:-.6s" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="#fff"/></svg>
      <!-- the Keser crown -->
      <svg class="crown" viewBox="0 0 120 96" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE38A"/><stop offset="1" stop-color="#F2A93B"/></linearGradient></defs>
        <path d="M12 78 L18 26 L40 52 L60 12 L80 52 L102 26 L108 78 Z" fill="url(#g)" stroke="#B9741A" stroke-width="3" stroke-linejoin="round"/>
        <rect x="10" y="74" width="100" height="14" rx="7" fill="#F2B84B" stroke="#B9741A" stroke-width="3"/>
        <circle cx="18" cy="24" r="6" fill="#FF8FC0" stroke="#fff" stroke-width="2"/>
        <circle cx="60" cy="10" r="7" fill="#B98CFF" stroke="#fff" stroke-width="2"/>
        <circle cx="102" cy="24" r="6" fill="#FF8FC0" stroke="#fff" stroke-width="2"/>
        <path d="M60 58 l6 7 -6 7 -6 -7z" fill="#F25C9A" stroke="#fff" stroke-width="2"/>
        <circle cx="36" cy="81" r="3.5" fill="#fff"/><circle cx="60" cy="81" r="3.5" fill="#fff"/><circle cx="84" cy="81" r="3.5" fill="#fff"/>
      </svg>
    </div>
    <div class="body">
      <p class="he" lang="he" dir="rtl">כתר</p>
      <h1>Keser Girls</h1>
      <span class="ver">3.0</span>
      <p class="big">Welcome! Your very own learning app is on its way.</p>
      <p>Made just for girls in elementary and middle school.</p>
      <div class="soon">✨ Coming soon ✨</div>
    </div>
  </div>
</main>
</body>
</html>
