<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keser Girls 3.0</title>
<style>
:root{ --night:#1A0B2E; --plum:#3A1259; --pink:#FF5FA2; --lilac:#C49BFF; --gold1:#FFF1B8; --gold2:#F5C451; --gold3:#C98A1E; }
*{ box-sizing:border-box; }
html,body{ margin:0; min-height:100%; color:#fff; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--night); }
body{ background:
  radial-gradient(ellipse at 20% 0%, rgba(255,95,162,.45) 0, transparent 50%),
  radial-gradient(ellipse at 90% 100%, rgba(196,155,255,.45) 0, transparent 55%),
  linear-gradient(160deg, #2B0C45 0%, var(--night) 60%, #12061F 100%); background-attachment:fixed; }
main{ position:relative; min-height:100vh; display:grid; place-items:center; padding:24px 16px; overflow:hidden; }

/* glitter */
#glitter{ position:absolute; inset:0; pointer-events:none; }
#glitter i{ position:absolute; border-radius:50%; background:#fff; box-shadow:0 0 6px 1px rgba(255,255,255,.8); animation:tw 3s ease-in-out infinite; }
#glitter i.g{ background:var(--gold1); box-shadow:0 0 8px 2px rgba(245,196,81,.8); }
#glitter i.p{ background:#FFC2DD; box-shadow:0 0 8px 2px rgba(255,95,162,.8); }
@keyframes tw{ 0%,100%{ opacity:.1; transform:scale(.5) } 50%{ opacity:1; transform:scale(1.2) } }

/* card with a holographic edge */
.frame{ position:relative; width:100%; max-width:440px; padding:3px; border-radius:34px;
  background:linear-gradient(120deg,var(--gold2),var(--pink),var(--lilac),#8FE3FF,var(--gold2)); background-size:300% 300%; animation:holo 6s linear infinite;
  box-shadow:0 0 40px rgba(255,95,162,.45), 0 0 90px rgba(196,155,255,.25); }
@keyframes holo{ 0%{ background-position:0% 50% } 100%{ background-position:300% 50% } }
.card{ border-radius:31px; padding:40px 24px 38px; text-align:center;
  background:linear-gradient(180deg, rgba(58,18,89,.92), rgba(26,11,46,.96)); }

.crown{ width:150px; height:118px; display:block; margin:0 auto 6px; filter:drop-shadow(0 0 18px rgba(245,196,81,.55)); animation:float 3.5s ease-in-out infinite; }
@keyframes float{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-6px) } }
.glint{ animation:glint 2.6s ease-in-out infinite; transform-origin:center; transform-box:fill-box; }
@keyframes glint{ 0%,70%,100%{ opacity:0; transform:scale(.3) rotate(0) } 82%{ opacity:1; transform:scale(1.2) rotate(45deg) } }

.he{ margin:6px 0 0; font-size:22px; font-weight:700; letter-spacing:.12em; color:var(--lilac); }
h1{ margin:2px 0 0; font-family:"Didot","Bodoni 72","Bodoni MT","Playfair Display",Georgia,serif; font-size:54px; line-height:1.05; font-weight:700; letter-spacing:.01em;
  background:linear-gradient(100deg,var(--gold3) 0%,var(--gold2) 20%,var(--gold1) 40%,#fff 50%,var(--gold1) 60%,var(--gold2) 80%,var(--gold3) 100%);
  background-size:250% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:foil 4s linear infinite; }
@keyframes foil{ 0%{ background-position:100% 0 } 100%{ background-position:-150% 0 } }
.soon{ display:inline-block; margin-top:20px; padding:9px 22px; border-radius:999px; font-weight:800; font-size:13px; letter-spacing:.28em; text-transform:uppercase;
  color:#fff; background:linear-gradient(90deg,var(--pink),#B55CFF); box-shadow:0 0 18px rgba(255,95,162,.6); }

@media (max-width:420px){ h1{ font-size:46px } }
@media (prefers-reduced-motion: reduce){ #glitter i,.frame,.crown,.glint,h1{ animation:none } .glint{ opacity:0 } }
</style>
</head>
<body>
<main>
  <div id="glitter" aria-hidden="true"></div>
  <div class="frame"><div class="card">
    <svg class="crown" viewBox="0 0 150 118" aria-hidden="true">
      <defs>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1B8"/><stop offset=".45" stop-color="#F5C451"/><stop offset="1" stop-color="#C98A1E"/></linearGradient>
        <linearGradient id="pinkgem" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD0E6"/><stop offset="1" stop-color="#FF3D8E"/></linearGradient>
        <linearGradient id="lilgem" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EBDDFF"/><stop offset="1" stop-color="#9B5CFF"/></linearGradient>
      </defs>
      <path d="M18 92 L24 34 L50 64 L75 16 L100 64 L126 34 L132 92 Z" fill="url(#gold)" stroke="#FFF6D6" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="15" y="88" width="120" height="18" rx="9" fill="url(#gold)" stroke="#FFF6D6" stroke-width="2.5"/>
      <circle cx="24" cy="31" r="7" fill="url(#pinkgem)" stroke="#fff" stroke-width="2"/>
      <circle cx="126" cy="31" r="7" fill="url(#pinkgem)" stroke="#fff" stroke-width="2"/>
      <path d="M75 4 l9 10 -9 10 -9 -10z" fill="url(#lilgem)" stroke="#fff" stroke-width="2"/>
      <path d="M75 62 l10 11 -10 11 -10 -11z" fill="url(#pinkgem)" stroke="#fff" stroke-width="2"/>
      <circle cx="45" cy="97" r="4.5" fill="url(#lilgem)"/><circle cx="105" cy="97" r="4.5" fill="url(#lilgem)"/>
      <circle cx="60" cy="97" r="3" fill="#fff"/><circle cx="75" cy="97" r="3" fill="#fff"/><circle cx="90" cy="97" r="3" fill="#fff"/>
      <path class="glint" d="M75 0 l2 7 7 2 -7 2 -2 7 -2 -7 -7 -2 7 -2z" fill="#fff"/>
      <path class="glint" style="animation-delay:-1.3s" d="M120 22 l1.6 5 5 1.6 -5 1.6 -1.6 5 -1.6 -5 -5 -1.6 5 -1.6z" fill="#fff"/>
      <path class="glint" style="animation-delay:-.6s" d="M30 80 l1.4 4.5 4.5 1.4 -4.5 1.4 -1.4 4.5 -1.4 -4.5 -4.5 -1.4 4.5 -1.4z" fill="#fff"/>
    </svg>
    <p class="he" lang="he" dir="rtl">כתר</p>
    <h1>Keser Girls</h1>
    <span class="soon">Coming soon</span>
  </div></div>
</main>
<script>
(function () {
  var box = document.getElementById('glitter'), n = window.innerWidth < 500 ? 45 : 90, kinds = ['', 'g', 'p'];
  for (var i = 0; i < n; i++) {
    var s = document.createElement('i'), z = 1.5 + Math.random() * 3;
    s.className = kinds[i % 3];
    s.style.cssText = 'left:' + (Math.random() * 100) + '%;top:' + (Math.random() * 100) + '%;width:' + z + 'px;height:' + z + 'px;animation-delay:' + (-Math.random() * 3) + 's;animation-duration:' + (2 + Math.random() * 3) + 's';
    box.appendChild(s);
  }
})();
</script>
</body>
</html>
