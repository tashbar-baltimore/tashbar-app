<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A1650">
<title>Keser Girls 3.0 · Sign in</title>
<link rel="stylesheet" href="kit.css">
<link rel="prefetch" href="home.html">
<style>
/* HER SIGN-IN (M. Heinemann 2026-11-26: "too many openings ... clean and neat and fresh"): the Keser logo, her code, then straight to home. */
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; color:#fff; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--keser); -webkit-tap-highlight-color:transparent; }
main{ position:relative; z-index:1; min-height:100%; display:grid; grid-template-columns:auto auto; align-items:center; justify-content:center; gap:clamp(24px,6vw,90px); padding:24px 16px; }
.girls{ height:min(78vh,600px); }
.pad{ display:grid; justify-items:center; gap:16px; width:min(320px,100%); }
.pad .logo{ width:190px; position:relative; }
/* a little more sparkle on the way in (M. Heinemann 2026-11-27): a soft gold glow behind the logo with a slow sweep of light, glowing gold code dots, a gold aura behind the girls */
.logo-box{ position:relative; width:190px; }
.logo-box::before{ content:""; position:absolute; inset:-40% -30%; background:radial-gradient(circle, rgba(246,227,176,.35), rgba(212,170,80,.12) 45%, transparent 70%); animation:k-breathe 4s ease-in-out infinite; pointer-events:none; }
.logo-box::after{ content:""; position:absolute; inset:0; background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.8) 48%,transparent 60%); background-size:300% 100%; animation:k-sweep 3.6s ease-in-out infinite;
  -webkit-mask:url(/pics/keser-logo.webp) center/contain no-repeat; mask:url(/pics/keser-logo.webp) center/contain no-repeat; mix-blend-mode:overlay; pointer-events:none; }
@keyframes k-breathe{ 50%{ opacity:.6; transform:scale(1.06) } }
@keyframes k-sweep{ 0%,50%{ background-position:120% 0 } 100%{ background-position:-120% 0 } }
.girls-box{ position:relative; }
.girls-box::before{ content:""; position:absolute; inset:8% -6% 4%; background:radial-gradient(ellipse, rgba(246,227,176,.22), rgba(75,42,133,.2) 55%, transparent 72%); pointer-events:none; }
.girls-box img{ position:relative; }
.pad h1{ margin:0; font-family:var(--serif); font-weight:600; font-size:24px; }
.dots{ display:flex; gap:14px; height:20px; align-items:center; }
.dots i{ width:16px; height:16px; border-radius:50%; border:2px solid var(--gold2); transition:background .15s; }
.dots i.on{ background:var(--gold1); box-shadow:0 0 10px var(--gold2), 0 0 20px rgba(246,227,176,.6); transform:scale(1.15); }
.dots i{ transition:background .15s, box-shadow .2s, transform .2s; }
.keys{ display:grid; grid-template-columns:repeat(3,72px); gap:12px; }
.key{ appearance:none; cursor:pointer; height:60px; border-radius:14px; border:0; font:700 24px/1 system-ui,sans-serif; color:#fff;
  background:rgba(255,255,255,.08); box-shadow:inset 0 0 0 1px rgba(246,227,176,.4); transition:background .15s, transform .1s; }
.key:hover{ background:rgba(255,255,255,.15); }
.key:active{ transform:scale(.95); }
.key:focus-visible{ outline:3px solid var(--gold1); outline-offset:3px; }
.key.fn{ font-size:15px; font-weight:600; }
.msg{ min-height:20px; margin:0; font-size:14px; color:rgba(255,255,255,.75); text-align:center; }
.pad.shake{ animation:shake .4s; }
@keyframes shake{ 20%,60%{ transform:translateX(-8px) } 40%,80%{ transform:translateX(8px) } }
@media (max-width:760px){ main{ grid-template-columns:1fr; } .girls-box{ display:none; } }
@media (prefers-reduced-motion: reduce){ .pad.shake,.logo-box::before,.logo-box::after{ animation:none } }
</style>
</head>
<body data-sparkle="more">
<main>
  <div class="girls-box"><img class="girls" src="/pics/keser-girls-uniform-four.webp" alt="Four Keser girls in the school uniform"></div>
  <div class="pad" id="pad">
    <div class="logo-box"><img class="logo" src="/pics/keser-logo.webp" alt="Keser Academy for Girls"></div>
    <h1>Enter your code</h1>
    <div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="keys" id="keys"></div>
    <p class="msg" id="msg" aria-live="polite">Practice code: 1234</p>
  </div>
</main>
<script src="sparkle.js"></script>
<script type="module" src="signin.js"></script>
</body>
</html>
