<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A0B2E">
<title>Keser Girls · Sign in</title>
<link rel="stylesheet" href="kit.css">
<link rel="prefetch" href="world.html">
<style>
/* HER SIGN-IN: the jewel vault (HoS 2026-11-26: "a super glam code punch-in ... jewel encrusted crown punch in ... when you punch in the code,
   the crown turns like the safe ... you fly into the safe and the safe opens up ... this storehouse in the heavens that have these globes
   with these treasures that you made before"). Every picture is a painting from picture order 3 (keser/PICTURE-ORDERS.md).
   Until the girls' records are built (the staff side, keser/STAFF-PROMPT.md), it opens with a practice code only. */
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; overflow:hidden; color:#fff; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--night); -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
.scene{ position:fixed; inset:0; transition:opacity .9s var(--glide); }
.bg{ position:absolute; inset:-4%; width:108%; height:108%; object-fit:cover; }
.veil{ position:absolute; inset:0; background:radial-gradient(ellipse at 40% 45%, rgba(26,11,46,.05), rgba(26,11,46,.6) 75%), linear-gradient(180deg, rgba(26,11,46,.1), rgba(26,11,46,.55)); }
#fx{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:30; }

/* 1. the vault */
#vault .wrap{ position:absolute; inset:0; display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); align-items:center; gap:3vw; padding:4vh 5vw; }
.door-box{ position:relative; justify-self:center; width:min(48vw,72vh,560px); aspect-ratio:1; perspective:1400px; }
.door-glow{ position:absolute; inset:-14%; border-radius:50%; background:radial-gradient(circle, rgba(255,214,140,.55), rgba(255,95,162,.2) 45%, transparent 70%); animation:breathe 4s ease-in-out infinite; }
@keyframes breathe{ 50%{ opacity:.65; transform:scale(1.05) } }
.portal{ position:absolute; inset:9%; border-radius:50%; background:url(/pics/keser-vault-inside.webp) 52% 45%/260% auto no-repeat;
  box-shadow:0 0 0 6px rgba(201,138,30,.8), 0 0 60px 20px rgba(255,214,140,.7), inset 0 0 50px rgba(255,241,184,.9); opacity:0; transition:opacity .5s; }
.door-box.open .portal{ opacity:1; }
.door{ position:absolute; inset:0; transform-origin:12% 50%; transform-style:preserve-3d; transition:transform 1.3s cubic-bezier(.45,.05,.25,1); }
.door img.d{ width:100%; height:100%; display:block; filter:drop-shadow(0 24px 50px rgba(40,0,40,.55)); }
.dial{ position:absolute; left:50%; top:50%; width:42%; aspect-ratio:1; translate:-50% -50%; transition:rotate .7s var(--spring); }
.dial img{ width:100%; height:100%; display:block; filter:drop-shadow(0 6px 18px rgba(60,0,40,.5)); }
.door-box.shake{ animation:shake .5s; }
@keyframes shake{ 20%{ translate:-12px 0 } 40%{ translate:10px 0 } 60%{ translate:-7px 0 } 80%{ translate:4px 0 } }
.door-box.open .door{ transform:rotateY(-105deg); }
.pad{ justify-self:center; width:min(100%,400px); display:grid; gap:18px; justify-items:center; padding:26px 24px 22px; border-radius:30px;
  background:linear-gradient(160deg,rgba(70,20,90,.55),rgba(30,6,48,.5)); border:1px solid rgba(255,241,184,.45); box-shadow:0 30px 80px rgba(20,0,40,.45), inset 0 1px 0 rgba(255,255,255,.3);
  backdrop-filter:blur(14px) saturate(1.4); -webkit-backdrop-filter:blur(14px) saturate(1.4); transition:opacity .6s, transform .6s var(--glide); }
.pad h1{ margin:0; font-size:clamp(30px,3.4vw,40px); }
.slots{ display:flex; gap:16px; }
.slot{ width:26px; height:26px; transform:rotate(45deg); border-radius:6px; border:2px solid rgba(255,241,184,.7); background:rgba(255,255,255,.06); transition:all .35s var(--spring); }
.slot.on{ background:linear-gradient(135deg,#fff,#FF8FBF 40%,#FF3D8E); border-color:#FFF1B8; box-shadow:0 0 18px #FF5FA2; transform:rotate(45deg) scale(1.12); }
.slots.bad .slot{ border-color:#FF5F7E; background:rgba(255,95,126,.35); }
.keys{ display:grid; grid-template-columns:repeat(3,72px); gap:14px; }
.key{ appearance:none; border:0; padding:0; width:72px; height:72px; cursor:pointer; position:relative; background:url(/pics/keser-key-gem.webp) center/contain no-repeat;
  font:700 30px/1 var(--serif); color:#5B1238; text-shadow:0 1px 0 rgba(255,255,255,.7); filter:drop-shadow(0 6px 12px rgba(60,0,40,.45)); transition:transform .25s var(--spring), filter .2s; }
.key:hover{ transform:scale(1.07); filter:drop-shadow(0 8px 16px rgba(255,95,162,.6)); }
.key:active{ transform:scale(.88); }
.key:focus-visible{ outline:3px solid var(--gold1); outline-offset:3px; border-radius:50%; }
.key.small{ font:800 15px/1 system-ui,sans-serif; letter-spacing:.04em; }
.hint{ margin:0; font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold1); opacity:.85; }

/* 2. flying through the open vault */
#fly{ opacity:0; pointer-events:none; }
#fly .bg{ transform:scale(1.05); transition:transform 2.2s cubic-bezier(.5,0,.3,1); }
body.flying #fly{ opacity:1; }
body.flying #fly .bg{ transform:scale(2.6); }
body.flying #vault{ opacity:0; transform:scale(1.6); transition:opacity 1s .2s, transform 1.4s cubic-bezier(.6,0,.2,1); }

/* 3. her treasure house in the heavens */
#house{ opacity:0; pointer-events:none; }
body.home #house{ opacity:1; pointer-events:auto; }
body.home #fly{ opacity:0; }
#house .title{ position:absolute; top:max(4vh,18px); left:0; right:0; text-align:center; }
#house .title h1{ margin:0; font-size:clamp(34px,4.4vw,56px); filter:drop-shadow(0 2px 3px rgba(40,0,40,.95)) drop-shadow(0 0 18px rgba(40,0,40,.7)); }
.globes{ position:absolute; left:0; right:0; bottom:13vh; height:46vh; touch-action:pan-y; cursor:grab; }
.globes::before{ content:""; position:absolute; left:50%; bottom:2%; width:min(74vw,900px); height:16%; translate:-50% 0; border-radius:50%;
  background:radial-gradient(ellipse, rgba(255,214,140,.55), rgba(255,95,162,.18) 55%, transparent 72%); box-shadow:0 0 0 2px rgba(245,196,81,.35) inset; }
.globe{ appearance:none; border:0; background:none; padding:0; cursor:pointer; position:absolute; left:50%; bottom:6%; display:grid; justify-items:center; gap:6px; color:#fff;
  font:700 16px/1.1 var(--serif); transform-origin:50% 100%; will-change:transform, opacity; opacity:0; transition:opacity .8s; }
body.home .globe{ opacity:var(--o,1); }
.globe img{ width:clamp(90px,13vw,170px); filter:drop-shadow(0 0 24px var(--c)) drop-shadow(0 14px 24px rgba(40,0,40,.4)); animation:float 4s ease-in-out infinite; }
.globe:nth-child(2) img{ animation-delay:-.8s } .globe:nth-child(3) img{ animation-delay:-1.6s } .globe:nth-child(4) img{ animation-delay:-2.4s } .globe:nth-child(5) img{ animation-delay:-3.2s }
@keyframes float{ 50%{ translate:0 -10px } }
.globe.waiting img{ filter:saturate(.35) brightness(.8) drop-shadow(0 14px 24px rgba(40,0,40,.4)); opacity:.8; }
.globe span{ text-shadow:0 2px 10px rgba(40,0,40,.8); opacity:var(--lbl,1); }
.globe.front span{ font-size:20px; color:var(--gold1); }
.globe:focus-visible{ outline:3px solid var(--gold1); outline-offset:6px; border-radius:16px; }
.spin{ position:absolute; bottom:28vh; }
.spin.l{ left:max(18px,4vw); } .spin.r{ right:max(18px,4vw); }
#house .go{ position:absolute; left:0; right:0; bottom:max(4vh,18px); display:flex; justify-content:center; }

@media (max-width:760px), (max-aspect-ratio:1/1){
  #vault .wrap{ grid-template-columns:1fr; grid-template-rows:auto auto; align-content:center; gap:2vh; padding:3vh 16px; }
  .door-box{ width:min(62vw,36vh,320px); }
  .pad{ padding:16px 16px 14px; gap:12px; }
  .keys{ grid-template-columns:repeat(3,62px); gap:10px; } .key{ width:62px; height:62px; font-size:26px; }
  .globes{ bottom:15vh; height:44vh; } .globe img{ width:clamp(80px,26vw,130px); } .spin{ display:none; }
}
@media (prefers-reduced-motion: reduce){ .door-glow,.globe img{ animation:none } .door,.dial,#fly .bg,.globe{ transition-duration:.01s } body.flying #vault{ transition:opacity .3s } }
</style>
</head>
<body>
<section class="scene" id="vault">
  <img class="bg" src="/pics/keser-world-sky.webp" alt=""><div class="veil"></div>
  <div class="wrap">
    <div class="door-box" id="doorBox"><div class="door-glow"></div><div class="portal"></div>
      <div class="door"><img class="d" src="/pics/keser-vault-door.webp" alt="A jeweled vault door"><div class="dial" id="dial"><img src="/pics/keser-vault-dial.webp" alt="The crown dial"></div></div>
    </div>
    <div class="pad">
      <h1 class="k-foil">Your code</h1>
      <div class="slots" id="slots" aria-live="polite"><span class="slot"></span><span class="slot"></span><span class="slot"></span><span class="slot"></span></div>
      <div class="keys" id="keys"></div>
      <p class="hint" id="hint">Practice code: 1 2 3 4</p>
    </div>
  </div>
</section>
<section class="scene" id="fly" aria-hidden="true"><img class="bg" src="/pics/keser-vault-inside.webp" alt=""></section>
<section class="scene" id="house" aria-hidden="true">
  <img class="bg" src="/pics/keser-treasure-house.webp" alt=""><div class="veil" style="background:linear-gradient(180deg,rgba(26,11,46,.25),transparent 30%,transparent 60%,rgba(26,11,46,.55))"></div>
  <div class="title"><h1 class="k-foil">Your treasures</h1></div>
  <div class="globes" id="globes"></div>
  <button class="k-icon spin l" id="spinL" aria-label="Turn the treasures left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="k-icon spin r" id="spinR" aria-label="Turn the treasures right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  <div class="go"><a class="k-btn" id="toWorld" href="world.html"><svg class="k-star" viewBox="0 0 24 24"><path fill="#fff" d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z"/></svg>My world</a></div>
</section>
<canvas id="fx" aria-hidden="true"></canvas>
<script type="module" src="signin.js"></script>
</body>
</html>
