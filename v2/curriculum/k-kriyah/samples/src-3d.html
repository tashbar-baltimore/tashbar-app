<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kriyah Sample 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;user-select:none;font-family:Nunito,system-ui,sans-serif}
body{background:linear-gradient(#3fb4ff 0%,#8fd8ff 45%,#dff6ff 75%,#fff6d8 100%)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;z-index:5}
.btn{width:76px;height:76px;border-radius:50%;border:none;cursor:pointer;display:grid;place-items:center;
 background:radial-gradient(circle at 32% 28%,#ffffff 0 18%,#e8f3ff 40%,#b9d8f5 100%);
 box-shadow:inset 0 -6px 10px #7aa9d655,0 7px 0 #6f9dc8,0 14px 22px #0b3a6640}
.btn:active{transform:translateY(5px);box-shadow:inset 0 -6px 10px #7aa9d655,0 2px 0 #6f9dc8,0 6px 10px #0b3a6640}
.btn svg{width:40px;height:40px;filter:drop-shadow(0 2px 0 #fff)}
#again{left:18px;top:16px}
#prog{left:50%;top:22px;transform:translateX(-50%);display:flex;gap:12px;padding:10px 16px;border-radius:40px;background:linear-gradient(#ffffffd0,#ffffff90);box-shadow:0 6px 18px #0b3a6626,inset 0 -3px 0 #0001}
#prog i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d6e4f0);box-shadow:inset 0 -3px 4px #0002}
#prog i.on{background:radial-gradient(circle at 35% 30%,#fff9d0,#ffd02e 45%,#f0a000);box-shadow:inset 0 -3px 4px #b4730055,0 0 14px #ffd02e}
.go{left:50%;top:50%;transform:translate(-50%,-50%);width:190px;height:190px;border-radius:50%;border:none;cursor:pointer;
 background:radial-gradient(circle at 34% 26%,#d6ffe5 0 10%,#5be08f 35%,#1fa857 75%,#137a3e);
 box-shadow:inset 0 -14px 24px #0a5a2a88,inset 0 10px 18px #ffffff88,0 12px 0 #0f6a35,0 26px 40px #04331a55;animation:breathe 1.6s ease-in-out infinite}
.go svg{width:88px;height:88px;margin-left:12px;filter:drop-shadow(0 4px 2px #0a5a2a88)}
#next{right:24px;bottom:30px;width:116px;height:116px;display:none;
 background:radial-gradient(circle at 34% 26%,#d6ffe5 0 10%,#5be08f 35%,#1fa857 75%,#137a3e);
 box-shadow:inset 0 -10px 18px #0a5a2a88,inset 0 8px 14px #ffffff88,0 9px 0 #0f6a35,0 20px 30px #04331a55}
#next.show{display:grid;animation:pop .45s}
#next svg{width:58px;height:58px}
@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.07)}}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes bob{0%,100%{transform:translate(-30%,0) rotate(-12deg)}50%{transform:translate(-30%,-16px) rotate(-12deg)}}
.hand{position:fixed;width:96px;height:96px;pointer-events:none;z-index:8;display:none;filter:drop-shadow(0 6px 6px #0004)}
.hand.bob{animation:bob 1s ease-in-out infinite}
.yay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:9}
.yay.show{display:flex}
.stars{display:flex;gap:20px;padding:20px 30px;border-radius:44px;background:linear-gradient(#ffffffe8,#ffffffb8);box-shadow:0 16px 40px #0b3a6640,inset 0 -4px 0 #0001}
.stars svg{width:126px;height:126px;animation:pop .5s backwards;filter:drop-shadow(0 6px 4px #b4730066)}
.stars svg:nth-child(2){animation-delay:.2s}.stars svg:nth-child(3){animation-delay:.4s}
.note{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);font-size:12px;color:#234;background:#ffffffcc;padding:3px 10px;border-radius:10px;text-align:center;max-width:92vw;z-index:6}
#fail{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:22px;text-align:center;padding:20px}
@media (max-width:700px){.go{width:150px;height:150px}.go svg{width:70px;height:70px}#next{width:96px;height:96px;bottom:34px}.stars svg{width:86px;height:86px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<canvas id="c"></canvas>
<button class="ui btn" id="again" aria-label="Hear it again"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z" fill="#2f6fe1"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#2f6fe1" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg></button>
<div class="ui" id="prog"><i class="on"></i><i></i></div>
<button class="ui go" id="start" aria-label="Start"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></button>
<button class="ui btn" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke="#fff" stroke-width="3.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<svg class="hand" id="hand" viewBox="0 0 64 64"><path d="M26 6c3 0 5 2 5 5v19l2-1c2-6 10-5 10 1l1-1c2-4 9-3 9 2v2c2-3 8-2 8 3v12c0 9-7 16-16 16h-6c-6 0-10-3-13-8L10 40c-2-4 2-8 6-5l5 5V11c0-3 2-5 5-5z" fill="#fff" stroke="#1d2b3a" stroke-width="3"/></svg>
<div class="yay" id="yay"><div class="stars"></div></div>
<div id="fail">This sample needs a newer browser (3D graphics).</div>
<div class="note">Sample only. Computer voice for now; the real game uses the rebbe's recording.</div>

<script type="module">
import * as THREE from 'three';
import {SVGLoader} from 'three/addons/loaders/SVGLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const BEIS_D="__BEIS__";
const $=s=>document.querySelector(s);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
/* ---------- voice + sounds ---------- */
let lastLine='';
function say(t){lastLine=t;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.85;u.pitch=1.1;speechSynthesis.speak(u);}catch(e){}return wait(Math.max(1200,t.split(' ').length*420));}
$('#again').onclick=()=>say(lastLine);
let actx;function tone(f,d=.15,type='sine',v=.15,at=0){try{actx=actx||new AudioContext();const t=actx.currentTime+at,o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d);}catch(e){}}
const chime=()=>[660,880,1320].forEach((f,i)=>tone(f,.25,'sine',.15,i*.09));
const sparkleSnd=()=>[1200,1500,1800,2200,2600].forEach((f,i)=>tone(f,.14,'sine',.05,i*.06));
const boop=()=>tone(200,.3,'triangle',.12);
const whoosh=()=>{[300,500,800].forEach((f,i)=>tone(f,.18,'sine',.06,i*.04))};
const fanfare=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.32,'triangle',.12,i*.12));

/* ---------- renderer ---------- */
const canvas=$('#c');let R;
try{R=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});}catch(e){$('#fail').style.display='flex';throw e;}
R.setPixelRatio(Math.min(devicePixelRatio,1.75));R.outputColorSpace=THREE.SRGBColorSpace;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=.82;
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const pmrem=new THREE.PMREMGenerator(R);scene.environment=pmrem.fromScene(new RoomEnvironment(),.04).texture;const ENV=.55;
const cam=new THREE.PerspectiveCamera(38,1,.1,200);
scene.add(new THREE.HemisphereLight(0xcfeeff,0x6fbf4a,.9));
const sun=new THREE.DirectionalLight(0xfff1d6,2.4);sun.position.set(6,10,7);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-9,right:9,top:9,bottom:-9,near:1,far:40});sun.shadow.radius=6;sun.shadow.bias=-.0005;scene.add(sun);

const M=(c,o={})=>new THREE.MeshPhysicalMaterial(Object.assign({color:c,roughness:.45,clearcoat:.35,clearcoatRoughness:.35,envMapIntensity:ENV},o));
function mesh(geo,mat,x=0,y=0,z=0,cast=true){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;return m;}
function rbox(w,h,d,r=.08){const s=new THREE.Shape(),x=-w/2+r,y=-h/2+r;s.moveTo(-w/2,-h/2+r);s.absarc(x,y,r,Math.PI,1.5*Math.PI);s.absarc(w/2-r,y,r,1.5*Math.PI,2*Math.PI);s.absarc(w/2-r,h/2-r,r,0,.5*Math.PI);s.absarc(x,h/2-r,r,.5*Math.PI,Math.PI);
  const g=new THREE.ExtrudeGeometry(s,{depth:d-2*r,bevelEnabled:true,bevelSize:r,bevelThickness:r,bevelSegments:3,curveSegments:4});g.translate(0,0,-(d-2*r)/2);return g;}

/* ---------- the world ---------- */
const world=new THREE.Group();scene.add(world);
const grass=M(0x3fae2e,{roughness:.85,clearcoat:0}),grass2=M(0x5cc23d,{roughness:.85,clearcoat:0});
const g1=mesh(new THREE.SphereGeometry(40,64,32),grass,0,-39.95,-4,false);g1.scale.set(1,1,.6);world.add(g1);
const g2=mesh(new THREE.SphereGeometry(30,48,24),grass2,-14,-28.6,-20,false);world.add(g2);
const g3=mesh(new THREE.SphereGeometry(30,48,24),grass2,16,-28.2,-24,false);world.add(g3);
function tree(x,z,s=1){const t=new THREE.Group();t.add(mesh(new THREE.CylinderGeometry(.12,.18,1,10),M(0x8a5a3c),0,.5,0));
  const leaf=M(0x3fae4a,{roughness:.6});[[0,1.35,0,.62],[.32,1.1,.1,.45],[-.32,1.12,0,.46],[0,1.75,0,.42]].forEach(([a,b,c,r])=>t.add(mesh(new THREE.SphereGeometry(r,20,14),leaf,a,b,c)));
  t.position.set(x,0,z);t.scale.setScalar(s);world.add(t);return t;}
tree(-6.5,-3,1.3);tree(6.8,-3.5,1.5);tree(-9,-7,1.6);tree(9.5,-8,1.8);
const flowerCols=[0xff6fa5,0xffd43b,0xffffff,0xb388ff];
for(let k=0;k<26;k++){const x=(Math.random()-.5)*16,z=1+Math.random()*3.2;if(Math.abs(x)<1.6&&z<3)continue;const f=new THREE.Group();
  f.add(mesh(new THREE.CylinderGeometry(.02,.02,.25,5),M(0x2f8f3a),0,.12,0,false));f.add(mesh(new THREE.SphereGeometry(.09,10,8),M(flowerCols[k%4],{roughness:.3}),0,.27,0,false));f.position.set(x,0,z);world.add(f);}
const sunBall=mesh(new THREE.SphereGeometry(1.6,32,20),new THREE.MeshBasicMaterial({color:0xffe066}),9,9,-25,false);world.add(sunBall);
const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex('#fff3a0'),transparent:true,depthWrite:false,opacity:.9}));halo.scale.set(9,9,1);halo.position.copy(sunBall.position);world.add(halo);
const clouds=[];const cm=M(0xffffff,{roughness:.9,clearcoat:0,emissive:0xffffff,emissiveIntensity:.15});
for(let k=0;k<5;k++){const c=new THREE.Group();[[0,0,0,1],[.9,-.1,.1,.75],[-.9,-.15,0,.7],[.4,.5,0,.7],[-.35,.4,.1,.6]].forEach(([a,b,d,r])=>c.add(mesh(new THREE.SphereGeometry(r,18,12),cm,a,b,d,false)));
  c.position.set(-16+k*8,6+Math.random()*2.5,-14-Math.random()*6);c.scale.setScalar(.8+Math.random()*.6);world.add(c);clouds.push(c);}

function glowTex(col){const cv=document.createElement('canvas');cv.width=cv.height=128;const x=cv.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,col);g.addColorStop(.4,col+'aa');g.addColorStop(1,col+'00');x.fillStyle=g;x.fillRect(0,0,128,128);const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;return t;}
function starTex(){const cv=document.createElement('canvas');cv.width=cv.height=64;const x=cv.getContext('2d');const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'#fff');g.addColorStop(.25,'#fff6b0');g.addColorStop(1,'#ffd02e00');x.fillStyle=g;x.beginPath();
  for(let i=0;i<8;i++){const a=i*Math.PI/4,r=i%2?9:32;x.lineTo(32+Math.cos(a)*r,32+Math.sin(a)*r);}x.fill();const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;return t;}

/* ---------- house ---------- */
function house(lit){const h=new THREE.Group();
  const wall=M(0xffa552),roof=M(0xe8322b,{roughness:.35,clearcoat:.6}),white=M(0xffffff,{roughness:.3});
  h.add(mesh(rbox(2.4,1.9,2,.1),wall,0,.95,0));
  const tri=new THREE.Shape();tri.moveTo(-1.55,0);tri.lineTo(1.55,0);tri.lineTo(0,1.25);tri.closePath();
  const rg=new THREE.ExtrudeGeometry(tri,{depth:2.3,bevelEnabled:true,bevelSize:.08,bevelThickness:.08,bevelSegments:3});rg.translate(0,0,-1.15);
  h.add(mesh(rg,roof,0,1.9,0));
  h.add(mesh(new THREE.BoxGeometry(.38,.7,.38),M(0xc0473f),.7,2.5,-.2));
  h.add(mesh(rbox(.62,1.08,.14,.06),M(0x8a5a3c,{roughness:.6}),-.58,.56,1.02));
  h.add(mesh(new THREE.SphereGeometry(.05,12,10),M(0xffd43b,{metalness:.8,roughness:.2}),-.39,.56,1.11));
  const mez=mesh(new THREE.BoxGeometry(.07,.26,.07),M(0xd9a520,{metalness:.7,roughness:.25}),-.17,.95,1.06);mez.rotation.z=-.35;h.add(mez);
  h.add(mesh(rbox(.86,.82,.12,.06),white,.45,1.12,1.02));
  const glass=mesh(new THREE.BoxGeometry(.66,.62,.06),lit?new THREE.MeshStandardMaterial({color:0xfff1a8,emissive:0xffd36a,emissiveIntensity:.9}):M(0x3d5f8f,{roughness:.15,clearcoat:1}),.45,1.12,1.07,false);h.add(glass);
  [[-1.35,.28,1.05],[1.35,.3,1.0]].forEach(([x,y,z])=>{h.add(mesh(new THREE.SphereGeometry(.34,18,12),M(0x3fae4a,{roughness:.6}),x,y,z));h.add(mesh(new THREE.SphereGeometry(.07,10,8),M(0xff6fa5),x+.12,y+.26,z+.22));});
  h.userData.window=new THREE.Vector3(.45,1.12,1.1);return h;}

/* ---------- Mendy ---------- */
function mendy(){const b=new THREE.Group();
  const skin=M(0xffd2ad,{roughness:.55,clearcoat:.15}),shirt=M(0xffffff,{roughness:.5}),pants=M(0x26324a),kip=M(0x1f3c88,{roughness:.4,clearcoat:.5}),dark=M(0x1d2b3a,{roughness:.2,clearcoat:1}),hair=M(0x6b4423);
  b.add(mesh(new THREE.CapsuleGeometry(.1,.32,6,12),pants,-.12,.24,0));b.add(mesh(new THREE.CapsuleGeometry(.1,.32,6,12),pants,.12,.24,0));
  b.add(mesh(new THREE.CapsuleGeometry(.27,.36,8,16),shirt,0,.72,0));
  [-.2,.2].forEach(x=>{const s=mesh(new THREE.CylinderGeometry(.012,.012,.32,5),M(0xffffff),x,.5,.18,false);b.add(s);});
  const armL=mesh(new THREE.CapsuleGeometry(.075,.32,6,10),shirt,-.34,.74,0);armL.rotation.z=-.25;b.add(armL);
  const armR=new THREE.Group();armR.position.set(.32,.9,0);const ar=mesh(new THREE.CapsuleGeometry(.075,.32,6,10),shirt,0,.18,0);armR.add(ar);armR.add(mesh(new THREE.SphereGeometry(.085,12,10),skin,0,.4,0));b.add(armR);
  const head=new THREE.Group();head.position.set(0,1.32,0);b.add(head);
  head.add(mesh(new THREE.SphereGeometry(.34,32,24),skin));
  const k=mesh(new THREE.SphereGeometry(.24,24,12,0,Math.PI*2,0,Math.PI/2.4),kip,0,.2,-.03);k.rotation.x=-.25;head.add(k);
  [-.12,.12].forEach(x=>{head.add(mesh(new THREE.SphereGeometry(.05,14,10),dark,x,.04,.3));head.add(mesh(new THREE.SphereGeometry(.016,8,6),M(0xffffff),x+.015,.06,.345,false));
    head.add(mesh(new THREE.SphereGeometry(.05,10,8),M(0xff9a9a,{transparent:true,opacity:.6}),x*1.6,-.07,.26,false));});
  const sm=mesh(new THREE.TorusGeometry(.09,.017,8,20,Math.PI),dark,0,-.08,.31,false);sm.rotation.z=Math.PI;head.add(sm);
  [-1,1].forEach(s=>{const p=mesh(new THREE.TorusGeometry(.05,.02,8,16,Math.PI*1.6),hair,s*.31,-.12,.06,false);p.rotation.y=s*Math.PI/2;head.add(p);});
  b.userData={armR,head};return b;}

/* ---------- 3D letters ---------- */
const blueFace=new THREE.MeshPhysicalMaterial({color:0x1f5fff,roughness:.2,metalness:.05,clearcoat:1,clearcoatRoughness:.06,envMapIntensity:.8});
const blueSide=new THREE.MeshPhysicalMaterial({color:0x1236a8,roughness:.25,metalness:.05,clearcoat:1,clearcoatRoughness:.1,envMapIntensity:.7});
const goldDot=new THREE.MeshPhysicalMaterial({color:0xffc21a,roughness:.15,metalness:.35,clearcoat:1,emissive:0x6a4200,emissiveIntensity:.25});
let beisGeo;
function letterMesh(height=2.6){if(!beisGeo){const d=new SVGLoader().parse(`<svg xmlns="http://www.w3.org/2000/svg"><path d="${BEIS_D}"/></svg>`);
   const shapes=d.paths.flatMap(p=>SVGLoader.createShapes(p));
   beisGeo=new THREE.ExtrudeGeometry(shapes,{depth:14,bevelEnabled:true,bevelThickness:3,bevelSize:2.2,bevelSegments:5,curveSegments:10});beisGeo.computeBoundingBox();
   const bb=beisGeo.boundingBox,c=new THREE.Vector3();bb.getCenter(c);beisGeo.translate(-c.x,-c.y,-c.z);beisGeo.computeBoundingBox();}
  const g=new THREE.Group(),m=new THREE.Mesh(beisGeo,[blueFace,blueSide]);m.castShadow=true;m.receiveShadow=true;
  const h=beisGeo.boundingBox.max.y-beisGeo.boundingBox.min.y,s=height/h;m.scale.setScalar(s);g.add(m);
  const dot=mesh(new THREE.SphereGeometry(.2*height/2.6,32,24),goldDot,0,.02*height,.42*height/2.6);g.add(dot);
  g.userData={dot,body:m};return g;}

/* ---------- particles: sparkles + confetti ---------- */
const sparkTex=starTex();const sparks=[];
function sparkle(pos,n=18,spread=1){for(let i=0;i<n;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:sparkTex,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
  s.position.copy(pos);const v=new THREE.Vector3((Math.random()-.5),(Math.random()-.2),(Math.random()-.5)).normalize().multiplyScalar(.03+Math.random()*.06*spread);s.userData={v,life:50+Math.random()*30};s.scale.setScalar(.12+Math.random()*.16);scene.add(s);sparks.push(s);}}
const confGeo=new THREE.PlaneGeometry(.12,.07);const confCols=[0xff5d8f,0xffc21a,0x2dbb6a,0x2f7de1,0x9b5de5,0x00c2d1];const confs=[];
function confetti(pos,n=60){for(let i=0;i<n;i++){const m=new THREE.Mesh(confGeo,new THREE.MeshStandardMaterial({color:confCols[i%6],side:THREE.DoubleSide,roughness:.4,metalness:.3}));
  m.position.copy(pos);m.userData={v:new THREE.Vector3((Math.random()-.5)*.16,.08+Math.random()*.14,(Math.random()-.5)*.1),r:new THREE.Vector3(Math.random()*.3,Math.random()*.3,Math.random()*.3),life:110};scene.add(m);confs.push(m);}}
function stepParticles(){for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.position.add(s.userData.v);s.userData.v.multiplyScalar(.96);s.material.opacity=Math.min(1,s.userData.life/25);s.material.rotation+=.05;if(--s.userData.life<=0){scene.remove(s);sparks.splice(i,1);}}
  for(let i=confs.length-1;i>=0;i--){const c=confs[i];c.position.add(c.userData.v);c.userData.v.y-=.004;c.userData.v.x*=.99;c.rotation.x+=c.userData.r.x;c.rotation.y+=c.userData.r.y;if(--c.userData.life<=0){scene.remove(c);confs.splice(i,1);}}}

/* ---------- tweens ---------- */
const tweens=[];const ease={out:t=>1-Math.pow(1-t,3),inOut:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,back:t=>{const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)}};
function tween(ms,fn,e=ease.inOut){return new Promise(res=>tweens.push({t0:performance.now(),ms,fn,e,res}));}
function stepTweens(now){for(let i=tweens.length-1;i>=0;i--){const w=tweens[i];let t=Math.min(1,(now-w.t0)/w.ms);w.fn(w.e(t));if(t>=1){tweens.splice(i,1);w.res();}}}

/* ---------- layout ---------- */
let portrait=false;const camTarget=new THREE.Vector3(0,1.4,0);let camBase=new THREE.Vector3(0,2.6,9.5);
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;portrait=w/h<.9;cam.fov=portrait?52:38;cam.updateProjectionMatrix();layout();}
addEventListener('resize',resize);
function toScreen(v){const p=v.clone().project(cam);return[(p.x+1)/2*innerWidth,(1-p.y)/2*innerHeight];}

/* ---------- scene 1: story ---------- */
const H1=house(true);scene.add(H1);
const boy=mendy();boy.position.set(-.58,0,1.35);scene.add(boy);
const L1=letterMesh(2.8);L1.visible=false;scene.add(L1);
const glow1=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex('#ffffff'),transparent:true,depthWrite:false,opacity:0}));glow1.scale.set(6,6,1);scene.add(glow1);
let floatL1=false,waving=false;

/* ---------- scene 2: detective ---------- */
const HB=house(true),HV=house(false);HB.visible=HV.visible=false;scene.add(HB,HV);
const kid=mendy();kid.scale.setScalar(.55);HB.add(kid);kid.position.set(.45,.36,1.12);kid.userData.armR.visible=false;
const signB=letterMesh(.9),signV=letterMesh(.9);signV.userData.dot.visible=false;HB.add(signB);HV.add(signV);signB.position.set(0,2.55,1.45);signV.position.set(0,2.55,1.45);
const card=letterMesh(2.0);card.visible=false;scene.add(card);
const ring=mesh(new THREE.TorusGeometry(.42,.06,16,40),new THREE.MeshStandardMaterial({color:0xff8a00,emissive:0xff8a00,emissiveIntensity:1.2}),0,0,.7,false);ring.visible=false;card.add(ring);
const shelfB=[],shelfV=[];

function layout(){
  HS=portrait?.8:1;CS=portrait?1.2:1;
  if(portrait){if(mode==='story'){camBase.set(0,2.2,9.4);camTarget.set(0,1.75,0);}else{camBase.set(0,3.3,11.6);camTarget.set(0,2.5,0);}
    HB.position.set(-1.85,0,0);HV.position.set(1.85,0,0);cardHome.set(0,4.75,1.5);}
  else{camBase.set(0,2.6,9.5);camTarget.set(0,1.4,0);HB.position.set(-3.6,0,0);HV.position.set(3.6,0,0);cardHome.set(0,1.9,1.4);}
  if(HB.visible&&!busy){HB.scale.setScalar(HS);HV.scale.setScalar(HS);}
  if(card.visible&&!dragging&&!busy)card.position.copy(cardHome);}
const cardHome=new THREE.Vector3();let HS=1,CS=1,mode='story';

/* ---------- loop ---------- */
let t0=performance.now();
function loop(now){const t=(now-t0)/1000;stepTweens(now);stepParticles();
  cam.position.set(camBase.x+Math.sin(t*.25)*.35,camBase.y+Math.sin(t*.33)*.12,camBase.z);cam.lookAt(camTarget);
  clouds.forEach((c,i)=>{c.position.x+=.004+i*.001;if(c.position.x>22)c.position.x=-22;});
  if(waving){boy.userData.armR.rotation.z=-.6+Math.sin(t*8)*.45;}
  if(floatL1){L1.position.y=1.5+Math.sin(t*2)*.08;L1.rotation.y=Math.sin(t*.9)*.35;}
  if(card.visible&&!dragging&&!busy){card.position.y=cardHome.y+Math.sin(t*2.2)*.08;card.rotation.y=Math.sin(t*1.1)*.3;}
  if(ring.visible)ring.scale.setScalar(1+Math.sin(t*10)*.08);
  kid.userData.head.rotation.y=Math.sin(t*1.5)*.3;
  [signB,signV].forEach((s,i)=>s.rotation.y=Math.sin(t*1.2+i)*.25);
  R.render(scene,cam);requestAnimationFrame(loop);}
resize();requestAnimationFrame(loop);
window.__info=()=>({k:card.userData.k,ready:dragEnabled&&!busy&&card.visible,done:!!document.body.dataset.done,l1:toScreen(L1.position),card:toScreen(card.position),hb:toScreen(HB.position.clone().add(new THREE.Vector3(0,1,0))),hv:toScreen(HV.position.clone().add(new THREE.Vector3(0,1,0)))});

/* ---------- pointer / raycast ---------- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let onPick=null,dragging=false,busy=false,dragPlane=new THREE.Plane(new THREE.Vector3(0,0,1),0),grabOff=new THREE.Vector3();
function setRay(e){ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,cam);}
canvas.addEventListener('pointerdown',e=>{setRay(e);
  if(onPick&&ray.intersectObject(onPick.obj,true).length){onPick.fn();return;}
  if(dragEnabled&&card.visible&&!busy&&ray.intersectObject(card,true).length){dragging=true;canvas.setPointerCapture(e.pointerId);dragPlane.constant=-card.position.z;const p=new THREE.Vector3();ray.ray.intersectPlane(dragPlane,p);grabOff.copy(card.position).sub(p);}});
canvas.addEventListener('pointermove',e=>{if(!dragging)return;setRay(e);const p=new THREE.Vector3();if(ray.ray.intersectPlane(dragPlane,p)){card.position.copy(p.add(grabOff));card.rotation.z=(card.position.x-cardHome.x)*-.08;}
  const near=nearestHouse();[HB,HV].forEach(h=>h.scale.setScalar(HS*(h===near?1.06:1)));});
canvas.addEventListener('pointerup',()=>{if(!dragging)return;dragging=false;[HB,HV].forEach(h=>h.scale.setScalar(HS));drop(nearestHouse());});
function nearestHouse(){const c=card.position;for(const h of [HB,HV]){const dx=Math.abs(c.x-h.position.x),lim=portrait?1.5:1.9;if(dx<lim&&c.y<(portrait?3.7:3.4))return h;}return null;}

/* ---------- flow ---------- */
$('#start').onclick=async()=>{$('#start').style.display='none';tone(1,.01);await story();};
async function story(){
  waving=true;
  await say("This is a bayis. A house.");
  await say("Mendy is home! Hi, Mendy!");
  waving=false;boy.userData.armR.rotation.z=0;
  await say("Watch! The house turns into a letter.");
  const center=new THREE.Vector3(0,1.5,.6);
  // Mendy hops into the middle
  const p0=boy.position.clone();await tween(700,k=>{boy.position.lerpVectors(p0,new THREE.Vector3(0,.4,1.2),k);boy.position.y+=Math.sin(k*Math.PI)*.8;});
  sparkleSnd();whoosh();sparkle(new THREE.Vector3(0,1.4,1),40,1.5);
  L1.visible=true;L1.position.set(0,1.5,.6);L1.scale.setScalar(.01);L1.userData.dot.scale.setScalar(.01);
  await tween(1400,k=>{H1.scale.setScalar(1-k*.999);H1.rotation.y=k*1.2;L1.scale.setScalar(.01+k);L1.rotation.y=(1-k)*Math.PI*2;glow1.material.opacity=k*.8;glow1.position.set(0,1.5,-.3);
    boy.scale.setScalar(1-k*.9);boy.position.lerp(new THREE.Vector3(0,1.3,1),k*.2);},ease.inOut);
  H1.visible=false;
  await tween(500,k=>{boy.scale.setScalar(.1*(1-k));L1.userData.dot.scale.setScalar(.01+k);},ease.back);boy.visible=false;
  sparkle(L1.userData.dot.getWorldPosition(new THREE.Vector3()),24);sparkleSnd();floatL1=true;
  await say("This is Beis. Mendy is the dot inside.");
  await say("Beis says b.");
  await say("Tap Beis!");
  const hand=$('#hand');const [hx,hy]=toScreen(new THREE.Vector3(.9,.6,1));hand.style.left=hx+'px';hand.style.top=hy+'px';hand.style.display='block';hand.classList.add('bob');
  document.body.dataset.tapReady=1;
  onPick={obj:L1,fn:async()=>{onPick=null;delete document.body.dataset.tapReady;hand.style.display='none';chime();sparkle(new THREE.Vector3(0,1.6,1),30,1.2);
    floatL1=false;const r0=L1.rotation.y;await tween(800,k=>{L1.rotation.y=r0+k*Math.PI*2;L1.position.y=1.5+Math.sin(k*Math.PI)*.6;},ease.out);floatL1=true;
    await say("Beis says b. Now, nobody home.");
    const d=L1.userData.dot,dp=d.position.clone();whoosh();
    await tween(700,k=>{d.position.set(dp.x+k*1.5,dp.y+k*2.6,dp.z+k*.5);d.scale.setScalar(1-k);},ease.out);d.visible=false;sparkle(new THREE.Vector3(1.2,3.6,1),14);
    await say("No dot. Veis says v.");$('#next').classList.add('show');}};
}
$('#next').onclick=async()=>{$('#next').classList.remove('show');$('#prog i')[1];document.querySelectorAll('#prog i')[1].classList.add('on');
  await tween(600,k=>{L1.scale.setScalar(1-k);glow1.material.opacity=.8*(1-k);});L1.visible=false;floatL1=false;
  mode='det';HB.visible=HV.visible=true;busy=true;layout();const sc=HS;
  await tween(700,k=>{HB.scale.setScalar(sc*Math.max(.01,k));HV.scale.setScalar(sc*Math.max(.01,k));},ease.back);busy=false;
  detective();};

const deck=['b','v','b','v','v','b'];let idx=0,mistakes=0,dragEnabled=false;
function setCard(k){card.userData.k=k;card.userData.dot.visible=k==='b';card.userData.dot.scale.setScalar(1);card.position.copy(cardHome);card.rotation.set(0,0,0);card.visible=true;card.scale.setScalar(.01);
  tween(450,q=>card.scale.setScalar(CS*Math.max(.01,q)),ease.back);}
async function drop(h){
  const back=()=>{const p0=card.position.clone();busy=true;return tween(400,k=>{card.position.lerpVectors(p0,cardHome,k);card.rotation.z*=.8;},ease.out).then(()=>busy=false);};
  if(!h){await back();return;}
  const right=(h===HB)===(card.userData.k==='b');
  if(right){busy=true;dragEnabled=false;chime();const p0=card.position.clone(),target=h.localToWorld(h.userData.window.clone());
    await tween(450,k=>{card.position.lerpVectors(p0,target,k);card.scale.setScalar(CS*(1-k*.92));card.rotation.y=k*Math.PI;},ease.inOut);
    card.visible=false;confetti(target,70);sparkle(target,20);
    const s0=h.scale.x;tween(500,k=>{h.scale.set(s0*(1+Math.sin(k*Math.PI)*.12),s0*(1-Math.sin(k*Math.PI)*.1),s0);});
    const shelf=h===HB?shelfB:shelfV,mini=letterMesh(.42);mini.userData.dot.visible=h===HB;h.add(mini);mini.position.set(-.85+shelf.length*.55,.32,1.55);shelf.push(mini);
    idx++;busy=false;await say(card.userData.k==='b'?'Yes! Someone home. Beis.':'Yes! Nobody home. Veis.');
    if(idx<deck.length){setCard(deck[idx]);dragEnabled=true;}else finish();}
  else{boop();mistakes++;await back();busy=true;const x0=card.position.x;await tween(450,k=>card.position.x=x0+Math.sin(k*Math.PI*5)*.2*(1-k));card.position.x=x0;busy=false;
    ring.visible=true;await say(card.userData.k==='b'?'Look! A dot. Someone is home. That is Beis.':'Look! No dot. Nobody home. That is Veis.');ring.visible=false;await say('Try again!');}
}
async function detective(){
  setCard(deck[0]);await wait(600);
  await say("Watch me. Is anyone home?");
  ring.visible=true;await say("A dot! Someone is home. Beis!");ring.visible=false;
  const hand=$('#hand');hand.classList.remove('bob');let [sx,sy]=toScreen(card.position);hand.style.left=sx+'px';hand.style.top=sy+'px';hand.style.display='block';await wait(400);
  const p0=card.position.clone(),p1=new THREE.Vector3(HB.position.x+(portrait?.2:.4),portrait?2.4:1.6,1.4);
  await tween(1300,k=>{card.position.lerpVectors(p0,p1,k);const [x,y]=toScreen(card.position);hand.style.left=x+'px';hand.style.top=y+'px';});
  hand.style.display='none';await drop(HB);
  await say("Now you! Drag each letter to its house.");dragEnabled=true;document.body.dataset.dragReady=1;
}
async function finish(){const n=mistakes===0?3:mistakes<3?2:1;const y=$('#yay');
  y.querySelector('.stars').innerHTML=[0,1,2].map(k=>`<svg viewBox="0 0 24 24"><defs><radialGradient id="sg${k}" cx=".35" cy=".3"><stop offset="0" stop-color="#fffbe0"/><stop offset=".45" stop-color="#ffd02e"/><stop offset="1" stop-color="#e89a00"/></radialGradient></defs><path d="M12 2l3 7 7 .6-5.3 4.7 1.6 7.2L12 17.8 5.7 21.5l1.6-7.2L2 9.6 9 9z" fill="${k<n?`url(#sg${k})`:'#dde6ee'}" stroke="${k<n?'#c98400':'#c3cfda'}" stroke-width=".8" stroke-linejoin="round"/></svg>`).join('');
  y.classList.add('show');fanfare();for(let k=0;k<4;k++)setTimeout(()=>confetti(new THREE.Vector3((Math.random()-.5)*6,4,1),60),k*220);
  await say("Great job! Beis says b. Veis says v.");await wait(600);y.classList.remove('show');document.body.dataset.done=1;}
</script>
</body></html>
