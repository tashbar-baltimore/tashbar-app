<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kriyah Sample</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew:wght@700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--sky:#e9f6ff;--sun:#ffd34d;--ink:#1d2b3a;--blue:#2f7de1;--green:#2dbb6a;--red:#ef5b5b;--card:#fff;--wall:#ffb870;--roof:#e0574f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--sky);font-family:Nunito,system-ui,sans-serif;color:var(--ink);overflow:hidden;touch-action:none;user-select:none}
.heb{font-family:"Noto Serif Hebrew","Frank Ruehl CLM",serif;font-weight:700;direction:rtl}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.top{height:84px;display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.btn{width:68px;height:68px;border-radius:50%;border:none;background:#fff;box-shadow:0 4px 0 #c9dbea;display:grid;place-items:center;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c9dbea}
.btn svg{width:36px;height:36px}
.dots{display:flex;gap:10px}.dots i{width:16px;height:16px;border-radius:50%;background:#c9dbea}.dots i.on{background:var(--blue)}
.note{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);font-size:12px;color:#6b7f93;background:#ffffffcc;padding:3px 10px;border-radius:10px;text-align:center;max-width:92vw}
.stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
.scr{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:0 16px 30px}
.scr.show{display:flex}
.big{width:min(70vh,82vw);height:min(62vh,62vw)}
.go{width:150px;height:150px;border-radius:50%;border:none;background:var(--green);box-shadow:0 8px 0 #1e8a4d;cursor:pointer;display:grid;place-items:center}
.go svg{width:70px;height:70px}
.next{position:absolute;right:20px;bottom:40px;width:96px;height:96px;border-radius:50%;border:none;background:var(--green);box-shadow:0 6px 0 #1e8a4d;display:none;place-items:center;cursor:pointer}
.next svg{width:48px;height:48px}.next.show{display:grid;animation:pop .4s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes wiggle{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
/* detective */
.det{display:flex;width:100%;max-width:1100px;height:100%;gap:18px;align-items:stretch;padding-top:6px}
.box{flex:1;background:#fff;border-radius:28px;border:6px solid #d7e6f3;display:flex;flex-direction:column;align-items:center;padding:8px;position:relative;transition:border-color .2s,background .2s}
.box .lbl{font-size:min(17vh,120px);line-height:1.05}
.box .hs{width:min(24vh,170px);height:min(24vh,170px)}
.box.hot{border-color:var(--blue);background:#f2f8ff}
.box.good{border-color:var(--green);background:#eefbf3}
.box .got{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:auto}
.box .got span{font-size:min(7vh,46px);background:#f4f7fa;border-radius:12px;padding:0 10px}
.mid{width:min(40vh,300px);display:flex;align-items:center;justify-content:center;position:relative}
.card{width:min(34vh,250px);height:min(42vh,300px);background:#fff;border-radius:24px;box-shadow:0 8px 0 #c9dbea,0 10px 24px #0002;display:grid;place-items:center;font-size:min(30vh,220px);cursor:grab;position:relative;touch-action:none;z-index:5}
.card.drag{cursor:grabbing;box-shadow:0 16px 30px #0003}
.card .ring{position:absolute;width:34%;height:30%;border-radius:50%;border:7px solid var(--sun);box-shadow:0 0 22px var(--sun);left:33%;top:33%;display:none;animation:pulse .7s 3}
.card.why .ring{display:block}
.hand{position:fixed;width:84px;height:84px;pointer-events:none;z-index:50;display:none;filter:drop-shadow(0 4px 4px #0003)}
.yay{position:fixed;inset:0;pointer-events:none;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:40}
.yay.show{display:flex}
.stars{display:flex;gap:16px}.stars svg{width:110px;height:110px;animation:pop .5s backwards}
.stars svg:nth-child(2){animation-delay:.2s}.stars svg:nth-child(3){animation-delay:.4s}
@media (max-width:700px){.det{flex-direction:column;gap:10px}.mid{width:100%;height:min(32vh,240px)}.card{width:min(28vh,190px);height:min(30vh,220px);font-size:150px}.box{flex-direction:row;justify-content:space-between;padding:4px 14px}.box .lbl{font-size:72px}.box .hs{width:80px;height:80px}.box .got{margin:0}.big{width:92vw;height:56vh}.next{width:84px;height:84px;bottom:34px}}
</style></head><body>
<div id="app">
  <div class="top">
    <button class="btn" id="again" aria-label="Hear it again"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z" fill="#2f7de1"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#2f7de1" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button>
    <div class="dots"><i class="on"></i><i></i></div>
    <div style="width:68px"></div>
  </div>
  <div class="stage">
    <!-- start -->
    <div class="scr show" id="s0">
      <button class="go" id="start" aria-label="Start"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="#fff"/></svg></button>
    </div>
    <!-- picture story -->
    <div class="scr" id="s1">
      <svg class="big" viewBox="0 0 400 360" id="story">
        <g id="house">
          <polygon points="80,150 200,58 320,150" fill="var(--roof)"/>
          <rect x="300" y="250" width="0" height="0"/>
          <rect x="110" y="150" width="180" height="150" fill="var(--wall)"/>
          <rect x="240" y="88" width="26" height="40" fill="#b9473f"/>
          <rect x="135" y="215" width="44" height="85" rx="6" fill="#8a5a3c"/>
          <rect x="220" y="180" width="46" height="40" rx="6" fill="#bfe6ff" stroke="#fff" stroke-width="5"/>
          <rect x="40" y="300" width="320" height="16" rx="8" fill="#7cc46b"/>
        </g>
        <g id="boy">
          <circle cx="200" cy="232" r="24" fill="#ffd8b5"/>
          <path d="M176 226a24 24 0 0 1 48 0z" fill="#1d2b3a"/>
          <circle cx="192" cy="235" r="3" fill="#1d2b3a"/><circle cx="208" cy="235" r="3" fill="#1d2b3a"/>
          <path d="M192 244q8 6 16 0" stroke="#1d2b3a" stroke-width="3" fill="none" stroke-linecap="round"/>
        </g>
        <path id="beis" d="M110 150 H268 Q290 150 290 172 V300 M92 300 H318" stroke="var(--blue)" stroke-width="34" fill="none" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:900;stroke-dashoffset:900"/>
        <circle id="dagesh" cx="200" cy="232" r="0" fill="var(--blue)"/>
      </svg>
      <div id="plain" class="heb" style="display:none;font-size:min(52vh,60vw);line-height:1;color:var(--blue);cursor:pointer">בּ</div>
    </div>
    <!-- detective -->
    <div class="scr" id="s2">
      <div class="det">
        <div class="box" id="bB" data-k="b"><div class="lbl heb">בּ</div><svg class="hs" viewBox="0 0 100 100"><use href="#mini"/><circle cx="50" cy="62" r="9" fill="#2f7de1"/></svg><div class="got heb"></div></div>
        <div class="mid" id="mid"></div>
        <div class="box" id="bV" data-k="v"><div class="lbl heb">ב</div><svg class="hs" viewBox="0 0 100 100"><use href="#mini"/></svg><div class="got heb"></div></div>
      </div>
    </div>
    <button class="next" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div>
<svg width="0" height="0" style="position:absolute"><defs><g id="mini"><polygon points="12,40 50,10 88,40" fill="#e0574f"/><rect x="20" y="40" width="60" height="48" fill="#ffb870"/><rect x="8" y="86" width="84" height="6" rx="3" fill="#7cc46b"/></g></defs></svg>
<svg class="hand" id="hand" viewBox="0 0 64 64"><path d="M26 6c3 0 5 2 5 5v19l2-1c2-6 10-5 10 1l1-1c2-4 9-3 9 2v2c2-3 8-2 8 3v12c0 9-7 16-16 16h-6c-6 0-10-3-13-8L10 40c-2-4 2-8 6-5l5 5V11c0-3 2-5 5-5z" fill="#fff" stroke="#1d2b3a" stroke-width="3"/></svg>
<div class="yay" id="yay"><div class="stars"></div></div>
<div class="note">Sample only. Computer voice for now; the real game uses the rebbe's recording.</div>
<script>
const $=s=>document.querySelector(s);
let lastLine='', step=0;
function say(t){lastLine=t;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.85;u.pitch=1.1;speechSynthesis.speak(u);}catch(e){}return new Promise(r=>setTimeout(r,Math.max(1200,t.split(' ').length*420)));}
$('#again').onclick=()=>say(lastLine);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let actx;function tone(f,d=.15,type='sine',v=.15){try{actx=actx||new AudioContext();const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}
const chime=()=>{tone(660);setTimeout(()=>tone(880),110);setTimeout(()=>tone(1320,.25),220)};
const boop=()=>tone(220,.25,'triangle',.12);
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.remove('show'));$(id).classList.add('show');$('#next').classList.remove('show');}
$('#start').onclick=async()=>{show('#s1');await story();};
async function story(){
  const house=$('#house'),boy=$('#boy'),beis=$('#beis'),dot=$('#dagesh');
  await say("This is a bayis. A house.");
  await say("Mendy is home! Look, he is inside.");
  await say("Watch! The house turns into a letter.");
  beis.style.transition='stroke-dashoffset 2s ease';beis.style.strokeDashoffset=0;
  house.style.transition='opacity 1.6s';await wait(900);house.style.opacity=.12;
  boy.style.transition='opacity .8s';boy.style.opacity=0;
  dot.style.transition='r .6s';await wait(600);dot.setAttribute('r',18);
  await wait(900);
  await say("This is Beis. Mendy is the dot inside.");
  $('#story').style.transition='opacity .6s';$('#story').style.opacity=0;await wait(600);$('#story').style.display='none';
  const pl=$('#plain');pl.style.display='block';pl.style.animation='pop .5s';await wait(500);
  await say("Beis says b.");
  await say("Tap Beis!");
  // pl already set
  const tap=async()=>{pl.onclick=null;delete pl.dataset.ready;pl.style.animation='pulse .5s';chime();await say("Beis says b. Now, nobody home.");
    pl.style.animation='';pl.style.transition='opacity .3s';pl.style.opacity=0;await wait(300);pl.textContent='ב';pl.style.opacity=1;await wait(500);
    await say("No dot. Veis says v.");$('#next').classList.add('show');};
  pl.onclick=tap;pl.dataset.ready=1;pl.style.animation='wiggle 1.2s infinite';
}
$('#next').onclick=()=>{if(step===0){step=1;document.querySelectorAll('.dots i')[1].classList.add('on');show('#s2');detective();}};
/* detective game */
const deck=['b','v','b','v','v','b'];let i=0,stars=3,mistakes=0;
const glyph=k=>k==='b'?'בּ':'ב';
function newCard(){const m=$('#mid');m.innerHTML='';if(i>=deck.length)return finish();
  const c=document.createElement('div');c.className='card heb';c.dataset.k=deck[i];c.innerHTML=glyph(deck[i])+'<div class="ring"></div>';m.appendChild(c);drag(c);return c;}
function boxAt(x,y){for(const b of document.querySelectorAll('.box')){const r=b.getBoundingClientRect();if(x>r.left&&x<r.right&&y>r.top&&y<r.bottom)return b;}return null;}
function drag(c){let sx,sy,on=false;
  c.onpointerdown=e=>{if(demo)return;on=true;sx=e.clientX;sy=e.clientY;c.setPointerCapture(e.pointerId);c.classList.add('drag');c.style.transition='none';};
  c.onpointermove=e=>{if(!on)return;c.style.transform=`translate(${e.clientX-sx}px,${e.clientY-sy}px) scale(1.05)`;document.querySelectorAll('.box').forEach(b=>b.classList.toggle('hot',b===boxAt(e.clientX,e.clientY)));};
  c.onpointerup=e=>{if(!on)return;on=false;c.classList.remove('drag');document.querySelectorAll('.box').forEach(b=>b.classList.remove('hot'));drop(c,boxAt(e.clientX,e.clientY));};}
async function drop(c,b){
  const back=()=>{c.style.transition='transform .35s';c.style.transform='';};
  if(!b){back();return;}
  if(b.dataset.k===c.dataset.k){chime();b.classList.add('good');setTimeout(()=>b.classList.remove('good'),500);
    b.querySelector('.got').insertAdjacentHTML('beforeend','<span>'+glyph(c.dataset.k)+'</span>');i++;
    await say(c.dataset.k==='b'?'Yes! Someone home. Beis.':'Yes! Nobody home. Veis.');newCard();}
  else{boop();back();mistakes++;c.classList.add('why');
    await say(c.dataset.k==='b'?'Look! A dot. Someone is home. That is Beis.':'Look! No dot. Nobody home. That is Veis.');
    c.classList.remove('why');await say('Try again!');}
}
let demo=false;
async function detective(){
  const c=newCard();demo=true;
  await say("Watch me. Is anyone home?");
  c.classList.add('why');await say("A dot! Someone is home. Beis!");c.classList.remove('why');
  const h=$('#hand'),cr=c.getBoundingClientRect(),br=$('#bB').getBoundingClientRect();
  h.style.display='block';h.style.transition='none';h.style.left=(cr.left+cr.width/2-20)+'px';h.style.top=(cr.top+cr.height/2)+'px';await wait(400);
  const dx=br.left+br.width/2-(cr.left+cr.width/2),dy=br.top+br.height/2-(cr.top+cr.height/2);
  h.style.transition='transform 1.2s ease';c.style.transition='transform 1.2s ease';h.style.transform=`translate(${dx}px,${dy}px)`;c.style.transform=`translate(${dx}px,${dy}px)`;
  await wait(1300);h.style.display='none';h.style.transform='';demo=false;await drop(c,$('#bB'));
  await say("Now you! Drag each letter to its house.");
}
async function finish(){const n=mistakes===0?3:mistakes<3?2:1;const y=$('#yay');
  y.querySelector('.stars').innerHTML=[0,1,2].map(k=>`<svg viewBox="0 0 24 24"><path d="M12 2l3 7 7 .6-5.3 4.7 1.6 7.2L12 17.8 5.7 21.5l1.6-7.2L2 9.6 9 9z" fill="${k<n?'#ffc21a':'#dde6ee'}" stroke="#e0a400" stroke-width="1"/></svg>`).join('');
  y.classList.add('show');chime();await say("Great job! Beis says b. Veis says v.");await wait(800);y.classList.remove('show');
  $('#mid').innerHTML='<div style="font-size:22px;text-align:center">End of sample</div>';}
</script>
</body></html>
