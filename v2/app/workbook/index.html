<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block Builders Workbook</title>
<style>
:root{ --bg:#F6F1E7; --ink:#1F2A44; --soft:#5B6478; }
html,body{ margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
#cover{ min-height:100vh; display:grid; place-items:center; padding:24px 16px; box-sizing:border-box; text-align:center; }
#cover button{ font-size:24px; font-weight:800; padding:18px 34px; border-radius:18px; border:0; background:#2a6fdb; color:#fff; cursor:pointer; }
#cover p{ color:var(--soft); font-size:18px; }
</style>
<script>window.BB_MODE='boy'; window.BB_LIVE='all';</script>
<script src="data.js"></script>
<script src="player.js"></script>
</head>
<body>
<div id="cover"><div><p>Block Builders: my workbook</p><button type="button" id="open">📘 Open the workbook</button></div></div>
<script>
document.getElementById('open').addEventListener('click', function(){ BBX.openBook(); });
window.addEventListener('load', function(){ BBX.openBook(); });
</script>
</body>
</html>
