<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kriyah Unit 1</title>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js"}}</script>
</head><body>
<script type="module">
/* Kindergarten Kriyah, Unit 1 (Alef, Beis, Veis): the path of games in skill order.
   One glowing stone is his next game; a game opens when the one before it has 2 stars. Until the shared 2.0 path is in,
   this is where Unit 1 starts (stars are kept on this device and also sent to the shared path, see engine.js). */
import * as E from './engine.js';
const { THREE } = E;
E.buildPage({ home: false });
let ok = true;
try { E.initRenderer(); } catch (e) { ok = false; E.flatFallback(); }
if (ok) {
  E.buildWorld({ flowers: true }); E.initPointer(); E.setSway(.6);
  const save = E.loadSave();
  const stops = [], colors = [0xff7aa8, 0x46c3ff, 0xffcf3a, 0x7bd94a, 0xb388ff, 0xff9f1a, 0x00c2d1];
  const greyM = E.M(0xc9d2dc, { roughness: .4 }), greyIcon = E.M(0xaab4c0, { roughness: .5, clearcoat: .2 }), edgeM = E.M(0xffffff, { roughness: .3, clearcoat: .8 });
  const pebM = E.M(0xf1dcb0, { roughness: .7, clearcoat: 0 });
  /* little 3D pictures that say what each game is */
  function icon(kind) { const g = new THREE.Group();
    if (kind === 'story') { const h = E.house({ bushes: false }); h.scale.setScalar(.32); h.position.y = -.35; g.add(h); }
    else if (kind === 'detective') { const l = E.letter('beis', .85); g.add(l); }
    else if (kind === 'feel') { const l = E.letter('alef', .85, 'orange'); g.add(l); }
    else if (kind === 'hunt') { const lens = E.mesh(new THREE.TorusGeometry(.3, .07, 14, 32), E.M(0x2f7de1, { roughness: .2, clearcoat: 1 })); g.add(lens); g.add(E.mesh(new THREE.CircleGeometry(.3, 32), new THREE.MeshPhysicalMaterial({ color: 0xcfefff, transparent: true, opacity: .45, roughness: 0, clearcoat: 1 }), 0, 0, 0, false)); const hd = E.mesh(new THREE.CylinderGeometry(.06, .07, .45, 12), E.M(0x8a5a3c), .33, -.33, 0); hd.rotation.z = Math.PI / 4; g.add(hd); }
    else if (kind === 'mistake') { g.add(E.mesh(E.rbox(.8, .85, .08, .06), E.M(0xffd43b, { metalness: .4, roughness: .3 }), 0, 0, 0)); const l = E.letter('veis', .55); l.position.z = .12; g.add(l); }
    else if (kind === 'mastery') { const gold = E.goldDot(); g.add(E.mesh(new THREE.CylinderGeometry(.3, .12, .42, 24), gold, 0, .1, 0)); g.add(E.mesh(new THREE.CylinderGeometry(.08, .08, .2, 12), gold, 0, -.2, 0)); g.add(E.mesh(new THREE.CylinderGeometry(.22, .22, .08, 24), gold, 0, -.32, 0)); [-1, 1].forEach(s => { const h = E.mesh(new THREE.TorusGeometry(.12, .035, 8, 16, Math.PI), gold, s * .3, .14, 0); h.rotation.z = s * -Math.PI / 2; g.add(h); }); }
    else if (kind === 'bonus') { const cm = E.M(0xffffff, { roughness: .9, clearcoat: 0, emissive: 0xffffff, emissiveIntensity: .15 }); [[0, .15, .3], [.28, .1, .22], [-.28, .1, .22]].forEach(([x, y, r]) => g.add(E.mesh(new THREE.SphereGeometry(r, 16, 12), cm, x, y, 0))); const l = E.letter('beis', .4); l.position.set(0, -.35, .1); g.add(l); }
    return g; }
  E.GAMES.forEach((G, i) => {
    const open = E.unlocked(G.id), stars = E.best(G.id), s = new THREE.Group();
    const disc = E.mesh(new THREE.CylinderGeometry(.78, .86, .28, 40), open ? E.M(colors[i], { roughness: .25, clearcoat: 1 }) : greyM, 0, .14, 0); s.add(disc);
    s.add(E.mesh(new THREE.TorusGeometry(.8, .05, 10, 40), edgeM, 0, .29, 0)).rotation.x = 0; s.children[1].rotation.x = Math.PI / 2;
    const ic = icon(G.kind); if (!open) ic.traverse(o => { if (o.isMesh && o.material && o.material.opacity !== 0) o.material = greyIcon; }); ic.position.y = 1.05; s.add(ic);   /* a locked game shows its picture in grey */
    if (G.bonus && open) { const b = E.star3d(.18); b.position.set(.55, 1.5, 0); s.add(b); }
    const st = []; if (stars || (open && E.loadSave().games[G.id])) for (let k = 0; k < 3; k++) { const m = E.star3d(.14); m.material = k < stars ? E.goldDot() : E.M(0xdde6ee); m.position.set((k - 1) * .36, .55, .55); s.add(m); st.push(m); }
    s.userData = { G, open, stars, ic, disc };
    E.scene.add(s); stops.push(s);
  });
  const cur = stops.find(s => s.userData.open && s.userData.stars < E.PASS && !s.userData.G.bonus) || stops.slice().reverse().find(s => s.userData.open && !s.userData.G.bonus);
  const boy = E.mendy(); E.scene.add(boy);
  const ring = E.glowSprite('#fff7b0', 3.2, 0); E.scene.add(ring);
  const banner = new THREE.Group(); ['alef', 'beis', 'veis'].forEach((k, i) => { const l = E.letter(k, 1.25); l.position.x = (1 - i) * 1.35; banner.add(l); }); E.scene.add(banner);
  let pebbles = [];
  E.onLayout(p => {
    const P = p ? [[1, 3.4], [-.9, 2.2], [.95, .9], [-.9, -.4], [.95, -1.7], [-.9, -3.0], [.9, -4.4]] : [[4.6, 2.5], [3.05, 1.2], [1.5, 2.5], [0, 1.2], [-1.5, 2.5], [-3.05, 1.2], [-4.6, 2.5]];
    stops.forEach((s, i) => { s.position.set(P[i][0], 0, P[i][1]); s.scale.setScalar(p ? .85 : 1); });
    pebbles.forEach(m => E.scene.remove(m)); pebbles = [];
    for (let i = 0; i < P.length - 1; i++) for (let k = 1; k < 4; k++) { const a = P[i], b = P[i + 1], q = k / 4; const m = E.mesh(new THREE.CylinderGeometry(.16, .18, .06, 16), pebM, a[0] + (b[0] - a[0]) * q, .03, a[1] + (b[1] - a[1]) * q + Math.sin(q * Math.PI) * .25, false); E.scene.add(m); pebbles.push(m); }
    if (p) { E.camBase.set(0, 7.2, 10.8); E.camTarget.set(0, .4, -1.2); banner.position.set(0, 3.0, -5.6); banner.scale.setScalar(.8); }
    else { E.camBase.set(0, 6.4, 13.2); E.camTarget.set(0, .9, .4); banner.position.set(0, 2.9, -2.6); banner.scale.setScalar(1); }
    if (cur) { boy.position.copy(cur.position).add(new THREE.Vector3(p ? -.95 : -1.05, 0, .35)); boy.scale.setScalar(p ? .75 : .85); ring.position.copy(cur.position).add(new THREE.Vector3(0, .35, 0)); }
  });
  E.onFrame(t => {
    stops.forEach((s, i) => { const ic = s.userData.ic; ic.rotation.y = Math.sin(t * 1.2 + i) * .4; ic.position.y = 1.05 + Math.sin(t * 2 + i) * .06; });
    if (cur) { ring.material.opacity = .55 + Math.sin(t * 4) * .3; cur.userData.disc.scale.setScalar(1 + Math.sin(t * 4) * .04); boy.position.y = Math.abs(Math.sin(t * 3)) * .12; }
    banner.children.forEach((l, i) => l.rotation.y = Math.sin(t * .9 + i) * .25);
  });
  window.__info = () => ({ stops: stops.map(s => ({ id: s.userData.G.id, open: s.userData.open, stars: s.userData.stars, xy: E.toScreen(s.position.clone().add(new THREE.Vector3(0, .6, 0))) })), cur: cur && cur.userData.G.id });
  E.onPointer('down', async e => {
    const s = E.pickFrom(e, stops); if (!s) return;
    if (s.userData.open) { E.sfx.chime(); E.sparkle(s.position.clone().add(new THREE.Vector3(0, 1, .5)), 20); E.hop(s.userData.ic, .4); await E.wait(450); E.goGame(s.userData.G.id); }
    else { E.sfx.boop(); E.shake(s.userData.ic, .15); E.say('First play the glowing one!'); }
  });
  document.body.dataset.ready = 1;
  const firstTime = !Object.keys(save.games).length;
  E.say(firstTime ? 'Hi! Tap the glowing stone to start.' : cur && E.best(cur.userData.G.id) ? 'Play it again, or tap the next stone!' : 'Tap the glowing stone!');
}
</script>
</body></html>
