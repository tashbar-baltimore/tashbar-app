<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chumash &amp; Timeline Lab · Tashbar Learning 2.0</title>
<style>html,body{margin:0;background:#F6F4FF}</style>
<style id="tlk-css">
/* UiKit.html — THE BUTTON SYSTEM (HoS decisions 2026-11-23, "The Button System" page; docs/BUTTON-SYSTEM.md).
   ONE place for the look of every button and every piece of information a boy sees. Screens take their buttons from here
   (class "tlk" plus one kind, or the window.TLK helpers), so a screen that is redrawn still gets the same buttons.
   Loaded FIRST on the boy page by sgQuest_ (StaffGrid.js), so every other part can use it. It restyles nothing by itself:
   only elements that carry the tlk classes change. tests/lib/uikit.js checks it. No slash-slash in this file (HtmlService rule).

   THE RULES (plain words):
   - Two levels of button: MAIN (solid gold, at most one per screen, says what happens: Start, Buy it, Send) and QUIET (white, thin outline).
   - Every button floats a little (soft lift: solid color + a soft wide shadow) and settles onto the page when tapped. Hand pointer. Yellow ring with the keyboard.
   - Icon OR words, never both. Big buttons use words; round buttons use one icon. The play triangle only ever means "play a sound or video".
   - Round buttons, all the same size: X closes a pop-up (top right) or leaves a lesson (top left, asks first); the HOUSE leaves a full page (top left).
     K-3 boys get a bigger Home with the house and the word "Home" (the one exception to "icon or words"); grade 4 and up the round house.
   - Information is never a button: soft tint pills and boxes, no shadow, square-ish corners, one color per meaning on every page.
   - A question pop-up has a MAIN button that says what happens and a QUIET "Not now". No X. */
:root{
  --tlk-ink:#1E1B4B; --tlk-ink-2:#4B4778; --tlk-line:#D9D3F5; --tlk-white:#FFFFFF;
  --tlk-gold:#FBBF24; --tlk-gold-ink:#2A1600; --tlk-purple:#5B3FD0;
  --tlk-lift:0 6px 18px rgba(30,27,75,.14),0 1px 3px rgba(30,27,75,.10);
  --tlk-lift-gold:0 8px 20px rgba(217,119,6,.30),0 1px 3px rgba(30,27,75,.10);
  --tlk-lift-purple:0 8px 20px rgba(91,63,208,.28),0 1px 3px rgba(30,27,75,.10);
  --tlk-settled:0 1px 3px rgba(30,27,75,.14);
  --tlk-round:44px;
  /* information: one color per meaning, on every page */
  --tlk-money-bg:#D1FAE5; --tlk-money-fg:#065F46;
  --tlk-prog-bg:#E0F2FE;  --tlk-prog-fg:#075985;
  --tlk-now-bg:#FEF3C7;   --tlk-now-fg:#92400E;
  --tlk-rank-bg:#EDE9FE;  --tlk-rank-fg:#4C1D95;
  --tlk-lock-bg:#F1F5F9;  --tlk-lock-fg:#475569;
  --tlk-subj-bg:#FCE7F3;  --tlk-subj-fg:#9D174D;
}
/* ---------- buttons (two classes, so a screen's "footer buttons are links" style can never win over them) ---------- */
.tlk.tlk-main,.tlk.tlk-quiet,.tlk.tlk-x,.tlk.tlk-home,.tlk.tlk-back,.tlk.tlk-tool,.tlk.tlk-tile{
  -webkit-appearance:none;appearance:none;box-sizing:border-box;margin:0;cursor:pointer;text-decoration:none;font-family:inherit;line-height:1.15;
  -webkit-tap-highlight-color:transparent;transition:background-color .12s,color .12s,box-shadow .15s,transform .12s,border-color .12s;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;vertical-align:middle}
.tlk.tlk-main{min-height:52px;padding:0 26px;border-radius:14px;border:0;background:var(--tlk-gold);color:var(--tlk-gold-ink);font-weight:700;font-size:18px;box-shadow:var(--tlk-lift-gold)}
.tlk.tlk-quiet{min-height:52px;padding:0 22px;border-radius:14px;border:1.5px solid var(--tlk-line);background:var(--tlk-white);color:var(--tlk-ink);font-weight:600;font-size:17px;box-shadow:var(--tlk-lift)}
.tlk.tlk-x,.tlk.tlk-home,.tlk.tlk-back{width:var(--tlk-round);height:var(--tlk-round);min-width:var(--tlk-round);padding:0;border-radius:50%;border:1.5px solid var(--tlk-line);background:var(--tlk-white);color:var(--tlk-ink);box-shadow:var(--tlk-lift)}
.tlk.tlk-x svg{width:16px;height:16px;display:block}
.tlk.tlk-home svg{width:20px;height:20px;display:block}.tlk.tlk-back svg{width:20px;height:20px;display:block}
/* K-3 (HoS 2026-11-23): a bigger Home with the house AND the word, the one exception to "icon or words" (young boys need it bigger) */
.tlk.tlk-home.tlk-home-k3{width:auto;min-width:0;height:52px;padding:0 18px 0 14px;border-radius:16px;font-weight:700;font-size:17px;gap:8px}
.tlk.tlk-home.tlk-home-k3 svg{width:24px;height:24px}
/* BACK (HoS 2026-11-24): the same round button with an arrow; K-3 the bigger one with the arrow and the word "Back", like their Home */
.tlk.tlk-back.tlk-back-k3{width:auto;min-width:0;height:52px;padding:0 18px 0 14px;border-radius:16px;font-weight:700;font-size:17px;gap:8px}
.tlk.tlk-back.tlk-back-k3 svg{width:24px;height:24px}
.tlk.tlk-tool{width:48px;height:48px;min-width:48px;padding:0;border-radius:50%;border:0;background:var(--tlk-purple);color:#fff;font-size:20px;box-shadow:var(--tlk-lift-purple)}
.tlk.tlk-tool svg{width:22px;height:22px;display:block}
.tlk.tlk-tile{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;padding:0;overflow:hidden;border-radius:18px;border:1.5px solid var(--tlk-line);background:var(--tlk-white);color:var(--tlk-ink);text-align:left;box-shadow:var(--tlk-lift)}
.tlk.tlk-main.tlk-wide,.tlk.tlk-quiet.tlk-wide{width:100%}
.tlk.tlk-main.tlk-small,.tlk.tlk-quiet.tlk-small{min-height:44px;padding:0 16px;font-size:15px;border-radius:12px}
/* tapped: the shadow drops and the button settles onto the page */
.tlk:is(.tlk-main,.tlk-quiet,.tlk-x,.tlk-home,.tlk-back,.tlk-tool,.tlk-tile):active:not([disabled]){box-shadow:var(--tlk-settled);transform:translateY(2px)}
.tlk:is(.tlk-main,.tlk-quiet,.tlk-x,.tlk-home,.tlk-back,.tlk-tool,.tlk-tile):focus-visible{outline:3px solid #FDE047;outline-offset:3px}
.tlk:is(.tlk-main,.tlk-quiet)[disabled]{background:#E5E7EB;color:#9CA3AF;border-color:#E5E7EB;box-shadow:none;cursor:default}
/* where the out-buttons sit: X on a pop-up top right; X in a lesson and the HOUSE on a full page top left */
.tlk-at-tr{position:absolute;top:12px;right:12px;z-index:2}
.tlk-at-tl{position:absolute;top:12px;left:12px;z-index:2}
/* ---------- information: never a button ---------- */
.tlk-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;border:0;box-shadow:none;font-weight:600;font-size:14px;line-height:1.3;cursor:inherit;white-space:nowrap}
.tlk-box{display:inline-grid;gap:0;padding:8px 14px;border-radius:10px;border:0;box-shadow:none;text-align:center}
.tlk-box small{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
.tlk-box b{font-size:20px;font-weight:700}
.tlk-money{background:var(--tlk-money-bg);color:var(--tlk-money-fg)}
.tlk-prog{background:var(--tlk-prog-bg);color:var(--tlk-prog-fg)}
.tlk-now{background:var(--tlk-now-bg);color:var(--tlk-now-fg);text-transform:uppercase;font-size:12px;letter-spacing:.06em}
.tlk-rank{background:var(--tlk-rank-bg);color:var(--tlk-rank-fg)}
.tlk-lock{background:var(--tlk-lock-bg);color:var(--tlk-lock-fg)}
.tlk-subj{background:var(--tlk-subj-bg);color:var(--tlk-subj-fg)}
/* ---------- the question pop-up: a main button and a quiet "Not now", no X ---------- */
.tlk-ask{display:grid;gap:12px;justify-items:center;text-align:center}
.tlk-ask .tlk-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
@media (prefers-reduced-motion:reduce){.tlk:is(.tlk-main,.tlk-quiet,.tlk-x,.tlk-home,.tlk-back,.tlk-tool,.tlk-tile){transition:none}}
</style>
<script>
/* window.TLK: the button system as small helpers that return HTML, so every screen writes the same buttons.
   attrs = the screen's own attributes for its click handler, e.g. 'data-act="quit"'. No slash-slash in this file. */
(function(){
if(window.TLK) return;
var esc=function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var A=function(a){ return a?' '+a:''; };
/* the X and the house are drawn so their middle is exactly the middle of the circle */
var X_SVG='<svg viewBox="0 0 18 18" aria-hidden="true"><path d="M4 4l10 10M14 4L4 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';
var HOME_SVG='<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.25 8.75 10 2.75l6.75 6v7.5a1 1 0 0 1-1 1H12.6v-4.6H7.4v4.6H4.25a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>';
/* the back arrow: shaft 4.25-15.75 and head 4.75-15.25 around (10,10), so it sits exactly in the middle */
var BACK_SVG='<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.75 10H4.25M9.5 4.75 4.25 10l5.25 5.25" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
/* the fixed words (HoS 2026-11-23): one word for one moment, on every screen */
var WORDS={ start:'Start', next:'Next', back:'‹ Back', check:'Check', buyIt:'Buy it', send:'Send', notNow:'Not now',
  keepLearning:'Keep learning', leave:'Leave', leaveLesson:'Leave this lesson?', tryAgain:'Try again', money:'My money', canteenMoney:'canteen money',
  close:'Close', home:'Home', readToMe:'Read it to me' };
var KINDS={ money:1, prog:1, now:1, rank:1, lock:1, subj:1 };
window.TLK={ X_SVG:X_SVG, HOME_SVG:HOME_SVG, BACK_SVG:BACK_SVG, WORDS:WORDS, KINDS:KINDS,
  /* MAIN: the one thing to do now (words only) */
  main:function(text,attrs,extra){ return '<button type="button" class="tlk tlk-main'+(extra?' '+extra:'')+'"'+A(attrs)+'>'+esc(text)+'</button>'; },
  /* QUIET: every other choice (words only) */
  quiet:function(text,attrs,extra){ return '<button type="button" class="tlk tlk-quiet'+(extra?' '+extra:'')+'"'+A(attrs)+'>'+esc(text)+'</button>'; },
  /* X: closes a pop-up (place "tr") or leaves a lesson (place "tl"; the screen asks "Leave this lesson?" first) */
  x:function(attrs,place,label){ return '<button type="button" class="tlk tlk-x'+(place?' tlk-at-'+place:'')+'" aria-label="'+esc(label||WORDS.close)+'"'+A(attrs)+'>'+X_SVG+'</button>'; },
  /* HOUSE: leaves a full page (My map, My work, My profile), top left. young = a K-3 boy: the bigger button with the house and "Home".
     TLK.young(grade): true for K (0) through grade 3. */
  home:function(attrs,place,young){ return '<button type="button" class="tlk tlk-home'+(young?' tlk-home-k3':'')+(place===''?'':' tlk-at-'+(place||'tl'))+'" aria-label="'+WORDS.home+'"'+A(attrs)+'>'+HOME_SVG+(young?'<span>'+WORDS.home+'</span>':'')+'</button>'; },
  /* BACK (HoS 2026-11-24): back to the menu page he came from (only on a page he reached from another menu; never on the home or a pop-up).
     Grade 4+: round 44 px, the arrow only. young = a K-3 boy: the bigger button with the arrow and the word "Back". Top left, before the house. */
  back:function(attrs,place,young){ return '<button type="button" class="tlk tlk-back'+(young?' tlk-back-k3':'')+(place===''?'':' tlk-at-'+(place||'tl'))+'" aria-label="Back"'+A(attrs)+'>'+BACK_SVG+(young?'<span>Back</span>':'')+'</button>'; },
  young:function(grade){ var g=Number(grade); return grade!=null&&grade!==''&&!isNaN(g)&&g<=3; },
  /* TOOL: a round button with one icon (Read it to me, music, hint); its name shows on hold or hover */
  tool:function(icon,label,attrs){ return '<button type="button" class="tlk tlk-tool" aria-label="'+esc(label)+'" title="'+esc(label)+'"'+A(attrs)+'>'+icon+'</button>'; },
  /* INFORMATION: a soft pill or box; kind = money, prog, now, rank, lock or subj (never a button) */
  pill:function(kind,text){ return '<span class="tlk-pill tlk-'+(KINDS[kind]?kind:'prog')+'">'+esc(text)+'</span>'; },
  box:function(kind,label,value){ return '<span class="tlk-box tlk-'+(KINDS[kind]?kind:'prog')+'"><small>'+esc(label)+'</small><b>'+esc(value)+'</b></span>'; },
  /* a question pop-up's inside: title, a line, the main button and a quiet "Not now" (no X) */
  ask:function(o){ o=o||{}; return '<div class="tlk-ask">'+(o.icon?'<div aria-hidden="true" style="font-size:40px;line-height:1">'+o.icon+'</div>':'')+'<h2 style="margin:0">'+esc(o.title||'')+'</h2>'+(o.text?'<p style="margin:0">'+esc(o.text)+'</p>':'')+
    '<div class="tlk-actions">'+window.TLK.main(o.yes||WORDS.start,o.yesAttrs)+window.TLK.quiet(o.no||WORDS.notNow,o.noAttrs)+'</div></div>'; }
};
})();
</script>
<script>window.CLAB_STANDALONE=true;</script>

<body>
<script>
/* CHUMASH & TIMELINE LAB data (ChumashLab.html is the player). Its own curriculum, kept apart from the map.
   Word lists, pesukim and the prefix/suffix, trop and pasuk-workshop units come from the Chumash Learning Lab;
   pesukim that write out a Divine Name are left out. No slash-slash in this file (HtmlService rule). */
(function(){
function E(w,t,parts,ref){return {w,t,ref,parts:parts.split('|').map(x=>{const[k,r]=x.split(':');const[h,m]=r.split('=');return{k,h,m}})}}
const UNITS=[
 {id:'u1',title:'וְ and · הַ the',teach:[
   'A <b>prefix</b> is a letter stuck to the <b>front</b> of a word. It changes the meaning.',
   '<span class="heb">ו</span> in front of a word means <b>and</b>. It can look like <span class="heb">וְ · וּ · וַ · וָ</span>.',
   '<span class="heb">ה</span> in front of a word means <b>the</b>. Usually it has a patach <span class="heb">הַ</span> or a kamatz <span class="heb">הָ</span>.'],
  items:[E('הָאָרֶץ','the land','p:הָ=the|b:אֶרֶץ=land','בְּרֵאשִׁית א׳:א׳'),E('הַמַּיִם','the water','p:הַ=the|b:מַיִם=water','בְּרֵאשִׁית א׳:ז׳'),E('הָאוֹר','the light','p:הָ=the|b:אוֹר=light','בְּרֵאשִׁית א׳:ד׳'),
         E('וְהָאָרֶץ','and the land','p:וְ=and|p:הָ=the|b:אֶרֶץ=land','בְּרֵאשִׁית א׳:ב׳'),E('וְאַבְרָהָם','and Avraham','p:וְ=and|b:אַבְרָהָם=Avraham','בְּרֵאשִׁית י״ז:כ״ד'),E('וּבֵין','and between','p:וּ=and|b:בֵּין=between','בְּרֵאשִׁית א׳:ד׳')]},
 {id:'u2',title:'בְּ in · לְ to · כְּ like',teach:[
   '<span class="heb">בְּ</span> means <b>in</b>. <span class="heb">לְ</span> means <b>to</b> (or <b>for</b>). <span class="heb">כְּ</span> means <b>like</b>.',
   'These three usually have a sheva <span class="heb">ְ</span> under them.',
   'Remember them together: <span class="heb">בְּ</span> in, <span class="heb">לְ</span> to, <span class="heb">כְּ</span> like.'],
  items:[E('בְּאֶרֶץ','in the land of','p:בְּ=in|b:אֶרֶץ=land','בְּרֵאשִׁית ד׳:ט״ז'),E('לְאַבְרָם','to Avram','p:לְ=to|b:אַבְרָם=Avram','בְּרֵאשִׁית י״ב:י״ח'),E('לְאִשָּׁה','as a wife','p:לְ=to / for|b:אִשָּׁה=woman / wife','בְּרֵאשִׁית ב׳:כ״ב'),
         E('כְּגַן','like the garden of','p:כְּ=like|b:גַּן=garden','בְּרֵאשִׁית י״ג:י׳'),E('כְּחוֹל','like the sand of','p:כְּ=like|b:חוֹל=sand','בְּרֵאשִׁית ל״ב:י״ג'),E('בְּיָדוֹ','in his hand','p:בְּ=in|b:יָד=hand|s:וֹ=his','בְּרֵאשִׁית י״ט:ט״ז')]},
 {id:'u3',title:'בַּ in the · לַ to the · כַּ like the',teach:[
   'Sometimes the <span class="heb">ה</span> (the) <b>hides</b>! <span class="heb">בְּ + הַ</span> becomes <span class="heb">בַּ</span>.',
   'So <span class="heb">בַּ / בָּ</span> = <b>in the</b>, <span class="heb">לַ / לָ</span> = <b>to the</b>, <span class="heb">כַּ / כָּ</span> = <b>like the</b>.',
   'The clue: a <b>patach or kamatz</b> under the <span class="heb">ב ל כ</span> instead of a sheva.'],
  items:[E('בַּבֹּקֶר','in the morning','p:בַּ=in the|b:בֹּקֶר=morning','בְּרֵאשִׁית י״ט:כ״ז'),E('לָאוֹר','to the light','p:לָ=to the|b:אוֹר=light','בְּרֵאשִׁית א׳:ה׳'),E('בַּתֵּבָה','in the ark','p:בַּ=in the|b:תֵּבָה=ark','בְּרֵאשִׁית ח׳:א׳'),
         E('בַּשָּׂדֶה','in the field','p:בַּ=in the|b:שָׂדֶה=field','בְּרֵאשִׁית ד׳:ח׳'),E('וְלַחֹשֶׁךְ','and to the darkness','p:וְ=and|p:לַ=to the|b:חֹשֶׁךְ=darkness','בְּרֵאשִׁית א׳:ה׳'),E('וְכַחוֹל','and like the sand','p:וְ=and|p:כַ=like the|b:חוֹל=sand','בְּרֵאשִׁית כ״ב:י״ז')]},
 {id:'u4',title:'מִ from · מֵ from',teach:[
   '<span class="heb">מִ</span> or <span class="heb">מֵ</span> in front of a word means <b>from</b>.',
   'Often the next letter gets a dagesh: <span class="heb">מִמִּצְרַיִם</span>.',
   'Before letters like <span class="heb">א ה ח ע ר</span>, <span class="heb">מִ</span> becomes <span class="heb">מֵ</span>: <span class="heb">מֵאֶרֶץ</span> = from the land of.'],
  items:[E('מִמִּצְרַיִם','from Mitzrayim','p:מִ=from|b:מִצְרַיִם=Mitzrayim','בְּרֵאשִׁית י״ג:א׳'),E('מִבֵּית','from the house of','p:מִ=from|b:בַּיִת=house','בְּרֵאשִׁית כ׳:י״ג'),E('מִבְּאֵר','from the well of','p:מִ=from|b:בְּאֵר=well','בְּרֵאשִׁית כ״ח:י׳'),
         E('מֵעַל','from on top of','p:מֵ=from|b:עַל=on','בְּרֵאשִׁית א׳:ז׳'),E('מֵאֶרֶץ','from the land of','p:מֵ=from|b:אֶרֶץ=land','בְּרֵאשִׁית כ״א:כ״א'),E('וּמִבֵּית','and from the house of','p:וּ=and|p:מִ=from|b:בַּיִת=house','בְּרֵאשִׁית י״ב:א׳')]},
 {id:'u5',title:'הֲ asks a question',teach:[
   'A <span class="heb">ה</span> with a <b>chataf patach</b> <span class="heb">הֲ</span> turns the sentence into a <b>question</b>.',
   'Read it like: "Is…?" "Am I…?" "Isn\'t…?"',
   'Careful: <span class="heb">הַ</span> usually means "the." <span class="heb">הֲ</span> asks.','Before <span class="heb">א</span> or <span class="heb">ע</span>, the question <span class="heb">ה</span> can look like <span class="heb">הַ</span>: <span class="heb">הַאַתָּה</span> = are you?'],
  items:[E('הֲשֹׁמֵר','am I a guard? (question)','p:הֲ=question|b:שֹׁמֵר=guard','בְּרֵאשִׁית ד׳:ט׳'),E('הֲלֹא','isn\'t it? (question)','p:הֲ=question|b:לֹא=not','בְּרֵאשִׁית י״ג:ט׳'),E('הֲיֵשׁ','is there? (question)','p:הֲ=question|b:יֵשׁ=there is','בְּרֵאשִׁית כ״ד:כ״ג'),
         E('הַאַתָּה','are you? (question)','p:הַ=question|b:אַתָּה=you','בְּרֵאשִׁית כ״ז:כ״א')]},

 /* ---------------- the frame: top bar (out buttons on the left) and a body ---------------- */
 let root=null, NAV=null;
 function frame(title,sub,nav,body,right){
  /* nav: 'hub' = the house only (closes the lab); 'page' = Back + house; 'run' = the lesson X (asks first) */
  NAV=nav; const y=young(); const Q=T();
  const left=nav==='run'?Q.x('data-c="quit"','',T().WORDS.leaveLesson):nav==='page'?Q.back('data-c="back"','',y)+Q.home('data-c="close"','',y):Q.home('data-c="close"','',y);
  root.innerHTML=`<div class="clab-top">${left}<h1 dir="auto">${E(title)}${sub?`<small>${sub}</small>`:''}</h1>${right||''}</div><div class="clab-body"><div class="clab-wrap">${body}</div></div>`;
  root.querySelector('.clab-body').scrollTop=0;
 }
 const bodyEl=()=>root.querySelector('.clab-wrap');
 let BACK=null, QUIT=null;
 function onTop(e){ const b=e.target.closest('[data-c]'); if(!b||!root.contains(b)) return; const c=b.dataset.c;
  if(c==='close'){ snd('tap'); X.close(); }
  else if(c==='back'){ snd('tap'); (BACK||hub)(); }
  else if(c==='quit'){ snd('tap'); askLeave(); } }
 function askLeave(){ const m=document.createElement('div'); m.className='clab-modal'; m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true');
  m.innerHTML=`<div class="clab-card">${T().ask({title:T().WORDS.leaveLesson,text:'What you finished stays done.',yes:T().WORDS.keepLearning,yesAttrs:'data-m="stay"',no:T().WORDS.leave,noAttrs:'data-m="leave"'})}</div>`;
  root.appendChild(m); m.addEventListener('click',e=>{ const b=e.target.closest('[data-m]'); if(e.target===m||(b&&b.dataset.m==='stay')){ m.remove(); return; } if(b&&b.dataset.m==='leave'){ m.remove(); clearTimers(); (QUIT||BACK||hub)(); } }); }
 let TIMERS=[]; const later=(f,ms)=>{const t=setTimeout(f,ms);TIMERS.push(t);return t;}; function clearTimers(){ TIMERS.forEach(clearTimeout); TIMERS=[]; if(G&&G.iv){clearInterval(G.iv);} }

 const how=t=>`<div class="clab-how"><b>How to do it</b>${t}</div>`;
 const LEGEND='<div class="legend"><span class="lp">prefix (front)</span><span class="lb">base word / shoresh</span><span class="ls">suffix (end)</span></div>';
 const partsHTML=parts=>`<div class="parts">${parts.map(p=>`<span class="part ${p.k}"><span class="clab-he">${p.h}</span>${E(p.m)}</span>`).join('')}</div>`;
 function exHTML(ex){ if(!ex) return ''; return `<div class="clab-pas"><div class="l">${ex.cut[0]?'… ':''}${ex.w.map((w,i)=>i===ex.hi?`<mark>${w}</mark>`:w).join(' ')}${ex.cut[1]?' …':''}</div><div class="ref">${ex.ref}</div></div>`; }
 const pill=(k,t)=>T().pill(k,t);
 const tile=(cls,attrs,inner,dis)=>`<button type="button" class="tlk tlk-tile ${cls}" ${attrs}${dis?' disabled':''}>${inner}</button>`;

 /* ================= HUB ================= */
 const LABS=[
  {k:'sh',ic:'🌱',he:'שָׁרָשִׁים',t:'Shorashim',p:'The 200 shorashim that come up most in Bereishis, 10 at a time.'},
  {k:'ml',ic:'📖',he:'מִלִּים',t:'Milim',p:'The everyday words of Chumash, 10 at a time.'},
  {k:'ps',ic:'🧩',he:'אוֹתִיּוֹת הַשִּׁמּוּשׁ',t:'Prefixes & Suffixes',p:'The letters stuck to the front and the end of a word, and what they mean.'},
  {k:'tr',ic:'🛑',he:'טְעָמִים',t:'Stop Signs',p:'The trop stop signs, and how they break a pasuk into parts.'},
  {k:'pw',ic:'🛠️',he:'פָּסוּק',t:'Pasuk Workshop',p:'Put it all together: learn a real pasuk on your own, word by word.'},
  {k:'tl',ic:'⏳',he:'צִיר הַזְּמַן',t:'Timeline',p:'From Creation to today: which came first? In English or in Hebrew.'}];
 function counts(k){ const d=D(); if(k==='sh') return [P.done.sh.length,SHG.length,'groups']; if(k==='ml') return [P.done.ml.length,MLG.length,'groups']; if(k==='ps') return [P.done.ps.length,d.UNITS.length,'units'];
  if(k==='tr') return [P.done.tr.length,d.TUNITS.length,'units']; if(k==='pw') return [P.done.pw.length,d.WORK.length,'pesukim']; return [Object.keys(P.tl.done).length,4,'levels']; }
 function hub(){ clearTimers(); X.view='hub'; BACK=null;
  frame('Chumash & Timeline Lab','',' hub',`<div class="clab-card"><h2>Welcome to the Lab${me().name?', '+E(String(me().name).split(/\s+/)[0]):''}!</h2>
   <p>Here you learn the tools a talmid uses to learn Chumash on his own: shorashim, milim, prefixes and suffixes, and the trop. Then you use them on a real pasuk. And the Timeline shows when everything happened.</p>
   <p class="clab-mut">Pick a lab. Start at the first group or unit. Each one has a lesson, practice, a game and a quiz.</p></div>
   <div class="clab-grid">${LABS.map(l=>{const [d,n,u]=counts(l.k);return tile('clab-lab','data-lab="'+l.k+'"',`<span class="hd c-${l.k}"><span class="ic" aria-hidden="true">${l.ic}</span><span class="clab-he">${l.he}</span></span><span class="b"><b>${E(l.t)}</b><small>${E(l.p)}</small>${pill(d?'prog':'now',d?d+' of '+n+' '+u+' done':'Start here')}</span>`);}).join('')}</div>`);
  NAV='hub';
  bodyEl().querySelectorAll('[data-lab]').forEach(b=>b.onclick=()=>{ snd('tap'); const k=b.dataset.lab; if(k==='sh'||k==='ml') listLab(k); else if(k==='ps') psLab(); else if(k==='tr') trLab(); else if(k==='pw') pwLab(); else tlHome(); }); }

 /* a path of units: done ones, the next one open, later ones locked */
 function pathHTML(lab,n,label,peek){ const done=P.done[lab]; const cur=[...Array(n).keys()].find(i=>done.indexOf(i)<0); const reach=cur==null?n:cur;
  return `<div class="clab-path">${[...Array(n).keys()].map(i=>{const d=done.indexOf(i)>=0, open=d||i<=reach;
   return tile('clab-unit','data-u="'+i+'" aria-label="'+E(String(label(i)).replace(/<[^>]+>/g,''))+(d?', done':open?'':', locked')+'"',`<b>${label(i)}</b>${peek?`<span class="pk clab-he">${peek(i)}</span>`:''}${d?pill('prog','Done'):i===reach?pill('now','Up next'):open?'':pill('lock','Locked')}`,!open);}).join('')}</div>`; }
 const wireUnits=f=>bodyEl().querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{ snd('tap'); f(+b.dataset.u); });

 /* ================= ASK: one question of any kind; done(ok) when he taps Next ================= */
 function ask(box,Q,done,opt){ opt=opt||{};
  const fin=(ok,rightText)=>{ snd(ok?'right':'wrong'); if(opt.fast){ later(()=>done(ok),ok?350:900); return; }
   const extra=Q.parts?partsHTML(Q.parts):Q.x&&Q.x.ex&&!ok&&Q.kind!=='hunt'?exHTML(Q.x.ex):'';
   box.querySelector('.fbx').innerHTML=`<div class="clab-fb ${ok?'good':'bad'}">${ok?pick(['Yes!','Right!','You got it!','Beautiful!','Excellent!']):rightText}${Q.why?`<span style="font-weight:600">${Q.why}</span>`:''}${extra}</div><div class="clab-row clab-center">${T().main(T().WORDS.next,'data-a="nx"')}</div>`;
   const nx=box.querySelector('[data-a=nx]'); nx.onclick=()=>{ snd('tap'); done(ok); }; try{ nx.focus({preventScroll:true}); nx.scrollIntoView({block:'nearest'}); }catch(e){} };
  const head=(opt.head||'')+`<p class="clab-q">${Q.q||''}</p>`;
  const tail=how(Q.how||'Read it carefully, then tap your answer.')+'<div class="fbx" aria-live="polite"></div>';
  const lockAll=()=>box.querySelectorAll('.clab-opt,.piece,button.tw,.hk,[data-a=del],[data-a=chk],[data-a=undo]').forEach(b=>b.disabled=true);
  if(Q.kind==='spell'||Q.kind==='buildparts'){
   const items=Q.kind==='spell'?[...Q.tiles.map((t,i)=>({t,i})),...Q.extra.map(t=>({t,i:-1}))]:[...Q.x.parts.map((p,i)=>({t:p.h,p,i})),...Q.extra.map(p=>({t:p.h,p,i:-1}))];
   const tiles=shuffle(items); let built=[]; X.cur={Q,tiles};
   box.innerHTML=`${head}${Q.kind==='buildparts'?LEGEND:''}<div class="slots"></div><div class="bank">${tiles.map((t,j)=>`<button type="button" class="tlk tlk-tile piece ${t.p?t.p.k:''}" data-j="${j}">${t.t}${t.p?`<small>${E(t.p.m)}</small>`:''}</button>`).join('')}</div>
    <div class="clab-row clab-center">${T().quiet('Undo','data-a="undo"')}${T().main(T().WORDS.check,'data-a="chk"')}</div>${tail}`;
   const draw=()=>{ box.querySelector('.slots').innerHTML=built.map(j=>`<span class="piece ${tiles[j].p?tiles[j].p.k:''}">${tiles[j].t}</span>`).join(''); box.querySelectorAll('.bank .piece').forEach(b=>b.disabled=built.indexOf(+b.dataset.j)>=0); };
   box.querySelectorAll('.bank .piece').forEach(b=>b.onclick=()=>{ built.push(+b.dataset.j); snd('tap'); draw(); });
   box.querySelector('[data-a=undo]').onclick=()=>{ built.pop(); draw(); };
   box.querySelector('[data-a=chk]').onclick=()=>{ if(!built.length) return; let ok;
    if(Q.kind==='spell') ok=plainHeb(built.map(j=>tiles[j].t).join(''))===plainHeb(Q.right); else ok=built.length===Q.x.parts.length&&built.every((j,n)=>tiles[j].i===n);
    lockAll(); fin(ok,Q.kind==='spell'?`It is spelled <span class="clab-he" style="font-size:28px">${Q.right}</span>.`:`The word is <span class="clab-he" style="font-size:28px">${Q.x.w}</span>.`); };
   draw(); return; }
  if(Q.kind==='hunt'||Q.kind==='tap'){
   const toks=Q.kind==='hunt'?Q.ex.w.map((w,i)=>({w,a:i===Q.ex.hi})):Q.toks.map((t,i)=>({w:t.w,a:Q.ans[i]})); X.cur={Q,toks};
   box.innerHTML=`${head}<div class="pasuk">${Q.kind==='hunt'&&Q.ex.cut[0]?'<span class="tw">…</span>':''}${toks.map((t,i)=>`<button type="button" class="tw" data-i="${i}">${t.w}</button>`).join('')}${Q.kind==='hunt'&&Q.ex.cut[1]?'<span class="tw">…</span>':''}</div><p class="ref">${Q.kind==='hunt'?Q.ex.ref:Q.ref}</p>${tail}`;
   box.querySelectorAll('button.tw').forEach(b=>b.onclick=()=>{ const ok=toks[+b.dataset.i].a; box.querySelectorAll('button.tw').forEach(o=>{ o.disabled=true; if(toks[+o.dataset.i].a) o.classList.add('right'); }); if(!ok) b.classList.add('wrong'); fin(ok,Q.kind==='hunt'?'It is the word in green.':'The right word is in green.'); }); return; }
  if(Q.kind==='root'){
   const ch=shuffle(Q.roots); X.cur={Q,ch};
   box.innerHTML=`${opt.head||''}<p class="clab-q">Step 1: What is the <b>shoresh</b> of this word?</p><div class="clab-stage">${Q.word}</div><p class="ref" style="text-align:center">${Q.ref}</p>
    <div class="clab-opts s1">${ch.map((c,i)=>`<button type="button" class="tlk tlk-tile clab-opt he" data-i="${i}">${c}</button>`).join('')}</div><div class="s2"></div>${tail}`;
   box.querySelectorAll('.s1 .clab-opt').forEach(b=>b.onclick=()=>{ const ok1=ch[+b.dataset.i]===Q.right; box.querySelectorAll('.s1 .clab-opt').forEach(o=>{ o.disabled=true; if(ch[+o.dataset.i]===Q.right) o.classList.add('right'); }); if(!ok1) b.classList.add('wrong'); snd(ok1?'right':'wrong');
    const m=shuffle(Q.meanOpts);
    box.querySelector('.s2').innerHTML=`<p class="clab-q">${ok1?'Right! ':`The shoresh is <span class="clab-he">${Q.right}</span>. `}Step 2: What does <span class="clab-he">${Q.right}</span> mean?</p><div class="clab-opts s2o">${m.map((c,i)=>`<button type="button" class="tlk tlk-tile clab-opt" data-i="${i}">${E(c)}</button>`).join('')}</div>`;
    box.querySelectorAll('.s2o .clab-opt').forEach(b2=>b2.onclick=()=>{ const ok2=m[+b2.dataset.i]===Q.x.m; box.querySelectorAll('.s2o .clab-opt').forEach(o=>{ o.disabled=true; if(m[+o.dataset.i]===Q.x.m) o.classList.add('right'); }); if(!ok2) b2.classList.add('wrong');
     fin(ok1&&ok2,`<span class="clab-he">${Q.word}</span> comes from the shoresh <span class="clab-he">${Q.right}</span>, which means “${E(Q.x.m)}”.`); }); }); return; }
  if(Q.kind==='break'){
   const Pq=Q.P, want=Pq.t.map((_,i)=>!!Pq.s[i]&&i<Pq.t.length-1), on=new Set(); X.cur={Q,want};
   box.innerHTML=`${head}<div class="pasuk">${Pq.t.map((w,i)=>`<span class="tw">${w}</span>${i<Pq.t.length-1?`<button type="button" class="gap" data-i="${i}" aria-label="Break after word ${i+1}"></button>`:''}`).join('')}</div><p class="ref">${Pq.ref}</p>
    <div class="clab-row clab-center">${T().main(T().WORDS.check,'data-a="chk"')}</div>${tail}`;
   box.querySelectorAll('.gap').forEach(g=>g.onclick=()=>{ const i=+g.dataset.i; if(on.has(i)) on.delete(i); else on.add(i); g.classList.toggle('on'); snd('tap'); });
   box.querySelector('[data-a=chk]').onclick=()=>{ box.querySelector('[data-a=chk]').disabled=true; let ok=true;
    box.querySelectorAll('.gap').forEach(g=>{ const i=+g.dataset.i; g.disabled=true; g.classList.remove('on'); if(want[i]&&on.has(i)) g.classList.add('ok'); else if(want[i]){ g.classList.add('miss'); ok=false; } else if(on.has(i)){ g.classList.add('bad'); ok=false; } });
    const parts=[]; let cur=[]; Pq.t.forEach((w,i)=>{ cur.push(noTrop(w)); if(Pq.s[i]){ parts.push(cur.join(' ')); cur=[]; } }); if(cur.length) parts.push(cur.join(' '));
    fin(ok,`Not quite. The parts are:<div style="display:grid;gap:4px">${parts.map(p=>`<span class="clab-he" style="font-size:22px">${p}</span>`).join('')}</div>`); }; return; }
  /* tap one answer (also true/false, prefix or suffix, stop sign or not) */
  const ch=Q.keep?Q.opts:shuffle(Q.opts); X.cur={Q,ch};
  box.innerHTML=`${head}${Q.stage?`<div class="clab-stage ${Q.stageEn?'en':''}">${Q.stageRaw?Q.stage:E(Q.stage)}</div>`:''}${Q.html||''}
   <div class="clab-opts">${ch.map((c,i)=>`<button type="button" class="tlk tlk-tile clab-opt ${Q.he?'he':''}" data-i="${i}">${Q.raw?c:E(c)}</button>`).join('')}</div>${tail}`;
  box.querySelectorAll('.clab-opt').forEach(b=>b.onclick=()=>{ const ok=ch[+b.dataset.i]===Q.right; box.querySelectorAll('.clab-opt').forEach(o=>{ o.disabled=true; if(ch[+o.dataset.i]===Q.right) o.classList.add('right'); }); if(!ok) b.classList.add('wrong');
   fin(ok,Q.wrongText||`It is <span class="${Q.he?'clab-he':''}">${Q.raw?Q.right:E(Q.right)}</span>.`); });
 }

 /* a run of questions in the frame. mode 'mastery': each item right twice; 'quiz': score with a pass mark; 'set': a short game */
 function runQs(o){ /* o: {title, sub, back, items|qs, make, mode, pass, onPass, onEnd, endLabel} */
  BACK=o.back; QUIT=o.back; clearTimers();
  frame(o.title,o.sub||'','run','<div class="clab-card"><div class="clab-row" style="justify-content:space-between"><span class="cnt"></span></div><div class="clab-bar"><i style="width:0"></i></div><div class="qbox" style="display:grid;gap:14px"></div></div>');
  const box=bodyEl().querySelector('.qbox'), bar=bodyEl().querySelector('.clab-bar i'), cnt=bodyEl().querySelector('.cnt');
  const end=html=>{ box.innerHTML=html; bodyEl().querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{ snd('tap'); const a=b.dataset.a; if(a==='again') runQs(o); else if(a==='go'&&o.go) o.go(); else (o.back)(); }); };
  if(o.mode==='mastery'){ const need=new Map(o.items.map(x=>[x.id,2])); let queue=shuffle(o.items), right=0, total=o.items.length*2;
   const next=()=>{ const dn=[...need.values()].filter(v=>v===0).length; cnt.innerHTML=pill('prog',dn+' of '+o.items.length+' learned'); bar.style.width=(right/total*100)+'%';
    if(!queue.length){ snd('win'); o.onEnd&&o.onEnd(); end(`<p class="clab-q">You know them all! ★</p><div class="clab-row clab-center">${o.go?T().main(o.endLabel||'Take the quiz','data-a="go"'):''}${T().quiet('Back to the unit','data-a="bk"')}</div>`); return; }
    const x=queue.shift(); const Q=o.make(x);
    ask(box,Q,ok=>{ if(ok){ const n=need.get(x.id)-1; need.set(x.id,n); right++; if(n>0) queue.splice(Math.min(queue.length,3+rnd(3)),0,x); } else { right-=Math.min(right,2-need.get(x.id)); need.set(x.id,2); queue.splice(Math.min(queue.length,2),0,x); } next(); }); };
   next(); return; }
  const qs=o.qs; let i=0, c=0;
  const next=()=>{ bar.style.width=(i/qs.length*100)+'%'; cnt.innerHTML=o.mode==='quiz'?pill('now','Pass: '+o.pass+' of '+qs.length)+' '+pill('prog',c+' right'):pill('prog',c+' of '+qs.length+' right');
   if(i>=qs.length){ const ok=o.mode!=='quiz'||c>=o.pass; if(ok){ snd('win'); o.onPass&&o.onPass(c); } o.onEnd&&o.onEnd(c);
    end(`<div class="clab-stage en">${c} / ${qs.length}</div><p class="clab-q">${o.mode==='quiz'?(ok?'You passed! ★ The next one is open.':'Almost! Practice a little more and try again.'):c===qs.length?'Perfect!':'Good work!'}</p>
     <div class="clab-row clab-center">${o.mode==='quiz'&&!ok?T().main(T().WORDS.tryAgain,'data-a="again"'):o.mode!=='quiz'?T().main('Play again','data-a="again"'):''}${ok&&o.mode==='quiz'?T().main('Continue','data-a="bk"'):T().quiet('Back to the unit','data-a="bk"')}</div>`); return; }
   const Q=qs[i]; ask(box,Q,ok=>{ if(ok) c++; i++; next(); },{fast:o.fast,head:Q.tag?`<p style="text-align:center">${pill('subj',Q.tag)}</p>`:''}); };
  next(); }

 /* ================= SHORASHIM + MILIM ================= */
 let SHG=[], MLG=[];
 function groups(){ if(SHG.length) return; const d=D(); const ch=(a,n)=>a.reduce((g,x,i)=>{if(i%n===0)g.push([]);g[g.length-1].push(x);return g;},[]);
  const tag=g=>Object.assign(g.items,{label:g.label,parsha:true}); SHG=[...ch(d.sh,10),...(d.shp||[]).map(tag)]; MLG=[...ch(d.ml,10),...(d.mlp||[]).map(tag)]; }
 const LL={sh:{name:'Shorashim',he:'שָׁרָשִׁים',noun:'shorashim',one:'shoresh'},ml:{name:'Milim',he:'מִלִּים',noun:'words',one:'word'}};
 const G_=k=>k==='sh'?SHG:MLG, heOf=(k,x)=>k==='sh'?x.r:x.w, mainN=k=>G_(k).filter(g=>!g.parsha).length;
 const PARSHA_HE={Shelach:'פָּרָשַׁת שְׁלַח',Korach:'פָּרָשַׁת קֹרַח'};
 const gname=(k,g)=>{ const x=G_(k)[g]; return x&&x.parsha?x.label:'Group '+(g+1); };
 function listLab(k){ clearTimers(); const L=LL[k], Gs=G_(k), M=mainN(k); BACK=hub;
  const par=Gs.map((g,i)=>({g,i})).filter(o=>o.g.parsha);
  const learned=Gs.filter((_,i)=>P.done[k].indexOf(i)>=0).flat();
  frame(L.name+' Lab',`<span class="clab-he">${L.he}</span>`,'page',`<div class="clab-card"><div class="clab-teach">
    ${k==='sh'?'<p>A <b>shoresh</b> is the 3-letter root of a word. Many words grow from one shoresh: <span class="clab-he">אָמַר · וַיֹּאמֶר · לֵאמֹר</span> all come from <span class="clab-he">אמר</span>, “say”.</p><p>Know the shoresh and you can figure out hundreds of words in the Chumash on your own.</p>'
     :'<p>Some words come again and again in the Chumash: <span class="clab-he">כֹּל · אֶרֶץ · בַּיִת · יוֹם</span>. Learn them once and you will know them every time you see them.</p>'}
    <p>Each group of 10: <b>1. Meet</b> them, <b>2. Practice</b> until you know every one, <b>3.</b> play a <b>game</b>, then <b>4.</b> pass the <b>quiz</b>. Each quiz also reviews earlier groups, so you never forget them.</p></div>
    ${pathHTML(k,M,i=>'Group '+(i+1),i=>Gs[i].slice(0,4).map(x=>heOf(k,x)).join(' · '))}</div>
   ${par.length?`<div class="clab-card"><h2>${E(L.noun[0].toUpperCase()+L.noun.slice(1))} from the parsha</h2><p class="clab-mut">New ${L.noun} from the parsha, each with its pasuk. Open any time.</p>
    <div class="clab-path">${par.map(({g,i})=>tile('clab-unit','data-pu="'+i+'"',`<b>${E(g.label)}</b><span class="pk clab-he">${g.slice(0,4).map(x=>heOf(k,x)).join(' · ')}</span>${P.done[k].indexOf(i)>=0?pill('prog','Done'):pill('subj',PARSHA_HE[g.label.split(' ')[0]]?g.label.split(' ')[0]:'Parsha')}`)).join('')}</div></div>`:''}

     ${how('Look at the word. Which letters are stuck on the front (prefix)? Which letters are at the end (suffix)? The middle is the shoresh or base word. Tap the pieces from the front of the word: prefix, then base, then suffix.')}<div class="fbx"></div></div>`;
    const draw=()=>{ box.querySelector('.slots').innerHTML=built.map(j=>`<span class="piece ${tiles[j].p.k}">${tiles[j].p.h}</span>`).join(''); box.querySelectorAll('.bank .piece').forEach(b=>b.disabled=built.indexOf(+b.dataset.j)>=0); };
    box.querySelectorAll('.bank .piece').forEach(b=>b.onclick=()=>{ built.push(+b.dataset.j); snd('tap'); draw(); });
    box.querySelector('[data-a=undo]').onclick=()=>{ built.pop(); draw(); };
    box.querySelector('[data-a=wchk]').onclick=()=>{ if(!built.length) return; const ok=built.length===x.parts.length&&built.every((j,n)=>tiles[j].i===n); snd(ok?'right':'wrong');
     if(!ok){ box.querySelector('.fbx').innerHTML=`<div class="clab-fb bad">Not quite. This word has ${x.parts.length} pieces: ${x.parts.map(p=>`<span class="clab-he">${p.h}</span> (${E(p.m)})`).join(' + ')}. Try again.</div>`; built=[]; draw(); return; }
     box.querySelector('.fbx').innerHTML=`<div class="clab-fb good">Yes! ${x.parts.map(p=>E(p.m)).join(' + ')} = <b>${E(x.m)}</b></div><div class="clab-row clab-center">${T().main(T().WORDS.next,'data-a="wnx"')}</div>`;
     box.querySelectorAll('.bank .piece,[data-a=undo],[data-a=wchk]').forEach(b=>b.disabled=true); box.querySelector('[data-a=wnx]').onclick=()=>{ snd('tap'); done1(); }; };
    draw(); return; }
   const ch=shuffle([x.m,...shuffle(allM.filter(m=>m!==x.m&&!wordsOf(m).some(w=>wordsOf(x.m).indexOf(w)>=0))).slice(0,3)]);
   box.innerHTML=`<div class="clab-pas" style="gap:12px"><p class="clab-q">What does <span class="clab-trop" style="font-size:30px">${noTrop(Pq.t[cur])}</span> mean here?</p>
    ${x.parts.length?`${LEGEND}${partsHTML(x.parts)}`:''}<div class="clab-opts">${ch.map((c,i)=>`<button type="button" class="tlk tlk-tile clab-opt" data-i="${i}">${E(c)}</button>`).join('')}</div>
    ${how(x.parts.length?'The box shows the shoresh or base word and what it means. Which meaning fits this word in this pasuk?':'This word has no prefix or suffix. It is a name or a word you know from the Milim Lab. Which meaning fits?')}<div class="fbx"></div></div>`;
   box.querySelectorAll('.clab-opt').forEach(b=>b.onclick=()=>{ const ok=ch[+b.dataset.i]===x.m; snd(ok?'right':'wrong'); if(!ok){ b.classList.add('wrong'); b.disabled=true; box.querySelector('.fbx').innerHTML=`<div class="clab-fb bad">Not this one. ${x.parts.length?'Look at the box: '+x.parts.map(p=>E(p.m)).join(' + ')+'.':'Read the words around it: what would make sense here?'} Try again.</div>`; return; }
    done1(); }); };

 const FHE={"The Tower of Bavel was built 340 years after the Flood. Avraham was 48 years old then!": "מִגְדַּל בָּבֶל נִבְנָה 340 שָׁנָה אַחֲרֵי הַמַּבּוּל. אַבְרָהָם הָיָה אָז בֶּן 48!", "425 years passed from the time Avraham went Lech-Lecha until Matan Torah.": "425 שָׁנָה עָבְרוּ מִלֶּךְ לְךָ שֶׁל אַבְרָהָם עַד מַתַּן תּוֹרָה.", "Avraham was Yosef's great-grandfather: Avraham → Yitzchak → Yaakov → Yosef.": "אַבְרָהָם הָיָה סַבָּא רַבָּא שֶׁל יוֹסֵף: אַבְרָהָם ← יִצְחָק ← יַעֲקֹב ← יוֹסֵף.", "Yitzchak was 60 years old when Yaakov and Eisav were born.": "יִצְחָק הָיָה בֶּן 60 כְּשֶׁנּוֹלְדוּ יַעֲקֹב וְעֵשָׂו.", "Bnei Yisrael were in Mitzrayim for 210 years before Hashem took them out.": "בְּנֵי יִשְׂרָאֵל הָיוּ בְּמִצְרַיִם 210 שָׁנָה עַד שֶׁה׳ הוֹצִיא אוֹתָם.", "After 40 years in the midbar, Yehoshua brought Bnei Yisrael into Eretz Yisrael. Then came the Shoftim.": "אַחֲרֵי 40 שָׁנָה בַּמִּדְבָּר הֵבִיא יְהוֹשֻׁעַ אֶת בְּנֵי יִשְׂרָאֵל לְאֶרֶץ יִשְׂרָאֵל. אַחֲרָיו בָּאוּ הַשּׁוֹפְטִים.", "The first Bais Hamikdash stood for 410 years. The second stood for 420 years.": "בַּיִת רִאשׁוֹן עָמַד 410 שָׁנָה. בַּיִת שֵׁנִי עָמַד 420 שָׁנָה.", "Persia ruled first. Then Alexander of Greece took over the Persian empire.": "קֹדֶם מָשְׁלָה פָּרַס. אַחַר כָּךְ כָּבַשׁ אֲלֶכְּסַנְדֶּר מוּקְדוֹן אֶת מַלְכוּת פָּרַס.", "Purim happened when Persia ruled. Chanuka happened when Greece ruled, 217 years later.": "נֵס פּוּרִים הָיָה בִּזְמַן מַלְכוּת פָּרַס. נֵס חֲנֻכָּה הָיָה בִּזְמַן מַלְכוּת יָוָן, 217 שָׁנָה אַחַר כָּךְ.", "There are four galuyos: Bavel, Paras, Yavan and Edom. We are still in Galus Edom today.": "יֵשׁ אַרְבַּע גָּלֻיּוֹת: בָּבֶל, פָּרַס, יָוָן וֶאֱדוֹם. הַיּוֹם אֲנַחְנוּ עֲדַיִן בְּגָלוּת אֱדוֹם.", "Yosef was 17 years old when his brothers sold him.": "יוֹסֵף הָיָה בֶּן 17 כְּשֶׁאֶחָיו מָכְרוּ אוֹתוֹ.", "The Ten Makos came almost 200 years after Yaakov passed away.": "עֶשֶׂר הַמַּכּוֹת בָּאוּ כִּמְעַט 200 שָׁנָה אַחֲרֵי פְּטִירַת יַעֲקֹב.", "Nevuchadnetzar, king of Bavel, destroyed the first Bais Hamikdash on Tisha B'Av.": "נְבוּכַדְנֶצַּר מֶלֶךְ בָּבֶל הֶחֱרִיב אֶת בַּיִת רִאשׁוֹן בְּתִשְׁעָה בְּאָב.", "Only three years after Purim, the second Bais Hamikdash was built.": "רַק שָׁלֹשׁ שָׁנִים אַחֲרֵי פּוּרִים נִבְנָה בַּיִת שֵׁנִי.", "The Romans destroyed the second Bais Hamikdash 206 years after the miracle of Chanuka.": "הָרוֹמָאִים הֶחֱרִיבוּ אֶת בַּיִת שֵׁנִי 206 שָׁנָה אַחֲרֵי נֵס חֲנֻכָּה.", "Noach lived until Avraham was 58 years old!": "נֹחַ חַי עַד שֶׁאַבְרָהָם הָיָה בֶּן 58!", "We count the Omer for seven weeks, from Pesach until Shavuos, the day of Matan Torah.": "סוֹפְרִים אֶת הָעֹמֶר שִׁבְעָה שָׁבוּעוֹת, מִפֶּסַח עַד שָׁבוּעוֹת, יוֹם מַתַּן תּוֹרָה.", "Galus Bavel lasted 70 years, just as the navi Yirmiyahu said.": "גָּלוּת בָּבֶל נִמְשְׁכָה 70 שָׁנָה, כְּמוֹ שֶׁאָמַר יִרְמְיָהוּ הַנָּבִיא.", "From Avraham Avinu all the way to Shlomo Hamelech building the Bais Hamikdash.": "מֵאַבְרָהָם אָבִינוּ וְעַד שֶׁשְּׁלֹמֹה הַמֶּלֶךְ בָּנָה אֶת בֵּית הַמִּקְדָּשׁ.", "These are the four galuyos in order: Bavel, Paras (Purim), Yavan (Chanuka) and Edom.": "אֵלֶּה אַרְבַּע הַגָּלֻיּוֹת לְפִי הַסֵּדֶר: בָּבֶל, פָּרַס (פּוּרִים), יָוָן (חֲנֻכָּה) וֶאֱדוֹם.", "Purim was just 3 years before the second Bais Hamikdash was built.": "פּוּרִים הָיָה רַק 3 שָׁנִים לִפְנֵי שֶׁנִּבְנָה בַּיִת שֵׁנִי.", "A trick to remember: 3338 + 70 = 3408.": "דֶּרֶךְ לִזְכֹּר: 3338 + 70 = 3408.", "That was 1,959 years ago. We daven every day for the third Bais Hamikdash.": "זֶה הָיָה לִפְנֵי 1,959 שָׁנָה. אֲנַחְנוּ מִתְפַּלְּלִים כָּל יוֹם עַל בַּיִת שְׁלִישִׁי.", "Avraham was 48 at the Tower of Bavel and 75 when he went Lech-Lecha.": "אַבְרָהָם הָיָה בֶּן 48 בְּמִגְדַּל בָּבֶל וּבֶן 75 בְּלֶךְ לְךָ.", "Yaakov was 91 years old when Yosef was born.": "יַעֲקֹב הָיָה בֶּן 91 כְּשֶׁנּוֹלַד יוֹסֵף.", "Achashveirosh was the king of Persia.": "אֲחַשְׁוֵרוֹשׁ הָיָה מֶלֶךְ פָּרַס.", "Rashi was still alive during the First Crusade.": "רַשִׁ״י עוֹד הָיָה חַי בְּמַסַּע הַצְּלָב הָרִאשׁוֹן.", "Rav Chaim of Volozhin, a talmid of the Vilna Gaon, opened the famous Volozhin yeshiva.": "רַבִּי חַיִּים מִוּוֹלוֹזִ׳ין, תַּלְמִיד הַגְּרָ״א, פָּתַח אֶת יְשִׁיבַת וּוֹלוֹזִ׳ין הַמְּפֻרְסֶמֶת.", "The second Bais Hamikdash was built while Persia ruled. Greece took over later.": "בַּיִת שֵׁנִי נִבְנָה בִּזְמַן מַלְכוּת פָּרַס. יָוָן מָשְׁלָה אַחַר כָּךְ.", "Rav Yosef Karo was a small child when his family was forced out of Spain.": "רַבִּי יוֹסֵף קָארוֹ הָיָה יֶלֶד קָטָן כְּשֶׁמִּשְׁפַּחְתּוֹ גֹּרְשָׁה מִסְּפָרַד.", "After the Gemara was finished, the Gaonim in Bavel led Klal Yisrael.": "אַחֲרֵי שֶׁנִּגְמְרָה הַגְּמָרָא, הַגְּאוֹנִים בְּבָבֶל הִנְהִיגוּ אֶת כְּלַל יִשְׂרָאֵל.", "Bnei Yisrael stayed in the midbar for 40 years because of the Chet Hameraglim.": "בְּנֵי יִשְׂרָאֵל נִשְׁאֲרוּ בַּמִּדְבָּר 40 שָׁנָה בִּגְלַל חֵטְא הַמְּרַגְּלִים.", "Rabbi Yehuda Hanasi wrote down the Mishna so that the Torah Sheb'al Peh would not be forgotten.": "רַבִּי יְהוּדָה הַנָּשִׂיא כָּתַב אֶת הַמִּשְׁנָה כְּדֵי שֶׁהַתּוֹרָה שֶׁבְּעַל פֶּה לֹא תִּשָּׁכַח.", "We still use the Shulchan Aruch to learn halacha today.": "גַּם הַיּוֹם לוֹמְדִים הֲלָכָה מֵהַשֻּׁלְחָן עָרוּךְ.", "There were 10 generations from Noach to Avraham.": "הָיוּ 10 דּוֹרוֹת מִנֹּחַ עַד אַבְרָהָם.", "Avraham was 48 when he saw the Tower of Bavel. He did not join them.": "אַבְרָהָם הָיָה בֶּן 48 כְּשֶׁרָאָה אֶת מִגְדַּל בָּבֶל. הוּא לֹא הִצְטָרֵף אֲלֵיהֶם.", "The pasuk tells us: Avraham was 75 years old when he left Charan.": "הַפָּסוּק אוֹמֵר: אַבְרָהָם הָיָה בֶּן 75 כְּשֶׁיָּצָא מֵחָרָן.", "One year for each day that the Meraglim spied out the land.": "שָׁנָה אַחַת לְכָל יוֹם שֶׁהַמְּרַגְּלִים תָּרוּ אֶת הָאָרֶץ.", "We wait every day for Mashiach to come, the third Bais Hamikdash to be built, and Techias Hamesim.": "כָּל יוֹם אֲנַחְנוּ מְחַכִּים לְבִיאַת הַמָּשִׁיחַ, לְבִנְיַן בַּיִת שְׁלִישִׁי וְלִתְחִיַּת הַמֵּתִים.", "Noach was born in 1056 and lived until 2006, when Avraham was 58.": "נֹחַ נוֹלַד בִּשְׁנַת 1056 וְחַי עַד שְׁנַת 2006, כְּשֶׁאַבְרָהָם הָיָה בֶּן 58.", "Avraham lived until Yaakov was 15. Rashi says Yaakov cooked the lentil soup on the day Avraham passed away.": "אַבְרָהָם חַי עַד שֶׁיַּעֲקֹב הָיָה בֶּן 15. רַשִׁ״י אוֹמֵר שֶׁיַּעֲקֹב בִּשֵּׁל אֶת נְזִיד הָעֲדָשִׁים בַּיּוֹם שֶׁאַבְרָהָם נִפְטַר.", "Yitzchak was even still alive when Yosef was sold!": "יִצְחָק עוֹד הָיָה חַי אֲפִלּוּ כְּשֶׁיּוֹסֵף נִמְכַּר!", "Yosef was born 76 years after Avraham passed away.": "יוֹסֵף נוֹלַד 76 שָׁנָה אַחֲרֵי פְּטִירַת אַבְרָהָם.", "The hard work in Mitzrayim began only after Yosef and his brothers had passed away.": "הַשִּׁעְבּוּד בְּמִצְרַיִם הִתְחִיל רַק אַחֲרֵי שֶׁיּוֹסֵף וְאֶחָיו נִפְטְרוּ.", "From the Mishna to the Holocaust is more than 1,700 years.": "מֵהַמִּשְׁנָה עַד הַשּׁוֹאָה עָבְרוּ יוֹתֵר מִ-1,700 שָׁנָה.", "Chazal say that Daryavesh, who allowed the Bais Hamikdash to be built, was the son of Esther.": "חֲזַ״ל אוֹמְרִים שֶׁדָּרְיָוֶשׁ, שֶׁהִרְשָׁה לִבְנוֹת אֶת בֵּית הַמִּקְדָּשׁ, הָיָה בְּנָהּ שֶׁל אֶסְתֵּר.", "The pasuk in Melachim says it was 480 years. Your math matches the pasuk!": "הַפָּסוּק בִּמְלָכִים אוֹמֵר 480 שָׁנָה. הַחֶשְׁבּוֹן שֶׁלְּךָ מַתְאִים לַפָּסוּק!", "Matan Torah was 3,339 years ago, and we still learn the same Torah today!": "מַתַּן תּוֹרָה הָיָה לִפְנֵי 3,339 שָׁנָה, וְהַיּוֹם אֲנַחְנוּ עֲדַיִן לוֹמְדִים אֶת אוֹתָהּ תּוֹרָה!", "Noach was 600 years old when the Mabul came.": "נֹחַ הָיָה בֶּן 600 כְּשֶׁבָּא הַמַּבּוּל.", "Avraham was born 292 years after the Flood, and Noach was still alive!": "אַבְרָהָם נוֹלַד 292 שָׁנָה אַחֲרֵי הַמַּבּוּל, וְנֹחַ עוֹד הָיָה חַי!", "The second Bais Hamikdash was built 70 years after the first was destroyed, just as Yirmiyahu said.": "בַּיִת שֵׁנִי נִבְנָה 70 שָׁנָה אַחֲרֵי חֻרְבַּן בַּיִת רִאשׁוֹן, כְּמוֹ שֶׁאָמַר יִרְמְיָהוּ.", "Avraham was 100 years old and Sarah was 90 when Yitzchak was born.": "אַבְרָהָם הָיָה בֶּן 100 וְשָׂרָה בַּת 90 כְּשֶׁנּוֹלַד יִצְחָק.", "Yetzias Mitzrayim, Krias Yam Suf and Matan Torah were all in one year!": "יְצִיאַת מִצְרַיִם, קְרִיעַת יַם סוּף וּמַתַּן תּוֹרָה הָיוּ כֻּלָּם בְּשָׁנָה אַחַת!", "After 40 years in the midbar, Yehoshua led Bnei Yisrael into Eretz Yisrael.": "אַחֲרֵי 40 שָׁנָה בַּמִּדְבָּר הִכְנִיס יְהוֹשֻׁעַ אֶת בְּנֵי יִשְׂרָאֵל לְאֶרֶץ יִשְׂרָאֵל.", "Shlomo Hamelech built the first Bais Hamikdash 480 years after Yetzias Mitzrayim.": "שְׁלֹמֹה הַמֶּלֶךְ בָּנָה אֶת בַּיִת רִאשׁוֹן 480 שָׁנָה אַחֲרֵי יְצִיאַת מִצְרַיִם.", "Haman's plan was turned upside down. That is the idea of וְנַהֲפוֹךְ הוּא!": "הַתָּכְנִית שֶׁל הָמָן הִתְהַפְּכָה. זֶה הָרַעְיוֹן שֶׁל וְנַהֲפוֹךְ הוּא!", "The Chashmonaim found one jar of pure oil, and it burned for eight days.": "הַחַשְׁמוֹנָאִים מָצְאוּ פַּךְ אֶחָד שֶׁל שֶׁמֶן טָהוֹר, וְהוּא דָּלַק שְׁמוֹנָה יָמִים.", "The Romans destroyed the second Bais Hamikdash on Tisha B'Av. We are still in Galus Edom today.": "הָרוֹמָאִים הֶחֱרִיבוּ אֶת בַּיִת שֵׁנִי בְּתִשְׁעָה בְּאָב. הַיּוֹם אֲנַחְנוּ עֲדַיִן בְּגָלוּת אֱדוֹם."};

   <div class="clab-grid">${Object.entries(LEVELS).map(([k,Lv])=>`<div class="clab-card ${HEB()?'dir-rtl':''}"><h3>${Lv.shape} ${E(L2(Lv.name.en,Lv.name.he))} ${P.tl.done[k]?pill('prog',L2('Done','הוּשְׁלַם')):''}</h3><p class="clab-mut">${E(L2(Lv.what.en,Lv.what.he))}</p>
    <div class="clab-row">${T().main(u('qs'),'data-k="'+k+'" data-m="q"')}${T().quiet(u('game'),'data-k="'+k+'" data-m="g"')}</div></div>`).join('')}</div>`);
  const B=bodyEl(); B.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{ snd('tap'); P.tl.lang=b.dataset.lang; save(); tlHome(); });
  B.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ snd('tap'); if(b.dataset.m==='g') tlGame(b.dataset.k); else tlStart(b.dataset.k); }); }
 let S=null;
 function meetDates(k){ BACK=tlHome; QUIT=tlHome;
  frame(L2('The Important Dates','הַתַּאֲרִיכִים הַחֲשׁוּבִים'),'','run',`<div class="clab-card ${HEB()?'dir-rtl':''}"><div class="clab-teach">${E(L2('These are the Important Dates. Read each one out loud: the year, then what happened. Then cover the years with your hand and say them from memory. When you know them, start.','אֵלֶּה הַתַּאֲרִיכִים הַחֲשׁוּבִים. קְרָא כׇּל אֶחָד בְּקוֹל: הַשָּׁנָה, וּמָה קָרָה. אַחַר כָּךְ כַּסֵּה אֶת הַשָּׁנִים בְּיָדְךָ וֶאֱמֹר אוֹתָן בְּעַל פֶּה. כְּשֶׁאַתָּה יוֹדֵעַ אוֹתָן, הַתְחֵל.'))}</div>
   <div class="clab-wl dts">${DATES12.map(([y,key])=>`<div><b style="font-size:20px">${y}</b><span>${nm(key)}</span></div>`).join('')}</div>${thow('year')}<div class="clab-row clab-center">${T().main(T().WORDS.start,'data-a="go"')}</div></div>`);
  bodyEl().querySelector('[data-a=go]').onclick=()=>{ snd('tap'); tlStart(k,null,true); }; }
 function cardsIn(q){ const ks=[...(q.opts||[]),...(q.items||[])].filter(k=>typeof k==='string'&&PIC[k]); if(q.show) ks.push(q.show); if(q.ev){ const c=Object.keys(PIC).find(k=>PIC[k]===DPIC[q.ev]); if(c) ks.push(c); } return ks; }
 function tlStart(k,again,met){ clearTimers(); if(!again&&!met&&(k==='l3'||k==='dates')) return meetDates(k); const Lv=LEVELS[k], qs=again||Lv.build();
  const pool=uniq(qs.flatMap(cardsIn)).sort((a,b)=>PIC[a]-PIC[b]);
  S={k,Lv,qs,i:0,first:0,missed:[],pool,got:new Set()}; tlRender(); }
 const tlTop=()=>`<div class="clab-row" style="justify-content:space-between">${pill('subj',S.Lv.shape+' '+L2(S.Lv.name.en,S.Lv.name.he))}${pill('prog',(Math.min(S.i+1,S.qs.length))+' / '+S.qs.length)}</div><div class="clab-bar"><i style="width:${Math.round(S.i/S.qs.length*100)}%"></i></div>
   ${S.pool.length?`<div><p class="clab-mut" style="font-size:13px;font-weight:800">${E(u('tl'))} · ${S.got.size} / ${S.pool.length}</p><div class="tl-strip">${S.pool.map(k=>`<div class="tl-slot" title="${E(nameOf(k))}">${S.got.has(k)&&PICS[PIC[k]]?`<img src="/pics/${PICS[PIC[k]]}" alt="${E(nameOf(k))}">`:S.got.has(k)?'<span class="nopic" style="font-size:9px;border:0">✓</span>':''}</div>`).join('')}</div></div>`:''}`;
 function hintLines(q){ if(q.hint) return q.hint.map(h=>typeof h==='object'?L2(h.en,h.he):yearOf(h)?nameOf(h)+': '+yearOf(h):h); return (q.opts||q.items||[]).filter(n=>typeof n==='string'&&CY[n]).map(n=>nameOf(n)+': '+CY[n]); }
 function tlRender(){ if(S.i>=S.qs.length) return tlFinish(); const q=S.qs[S.i]; X.curTl=q; let tries=0, solved=false, order=[], typed='';
  BACK=tlHome; QUIT=tlHome;
  const optHTML=(o,i)=>{ const p=(typeof o==='string'&&!q.show)?picOf(o):0; const lab=label(o);
   return `<button type="button" class="tlk tlk-tile clab-opt ${p?'pic':''} ${HEB()?'he':''}" data-i="${i}">${p?imgHTML(p,'',''):''}<span>${lab}</span></button>`; };
  let body='';
  if(q.t==='pick') body=`<div class="clab-opts">${q.opts.map((o,i)=>optHTML(o,i)).join('')}</div>`;
  else if(q.t==='order'){ q.shown=q.shown||shuffle(q.items); body=`<div class="clab-opts">${q.shown.map((o,i)=>optHTML(o,i)).join('')}</div><div class="clab-row">${T().quiet(u('over'),'data-a="undo"')}</div>`; }
  else body=`<div class="numshow" aria-live="polite">?</div><div class="numpad">${[1,2,3,4,5,6,7,8,9,0].map(n=>T().quiet(String(n),'data-n="'+n+'"')).join('')}</div><div class="clab-row clab-center">${T().quiet('Delete','data-a="del"')}${T().main(T().WORDS.check,'data-a="chk"')}</div>`;
  let big=q.show?`<img class="bigpic" src="/pics/${PICS[PIC[q.show]]||''}" alt="${E(nameOf(q.show))}">`:'';
  if(q.show&&!PICS[PIC[q.show]]) big=`<div class="chips"><span class="chipx">${nm(q.show)}</span></div>`;
  if(q.ctx) big+=`<div class="chips">${q.ctx.map((k,i)=>`<span class="chipx">${q.num?(i+1)+'. ':''}${nm(k)}</span>`).join(q.num?'':' <span class="clab-mut">'+E(u('and'))+'</span> ')}</div>`;
  if(q.ev){ const p=DPIC[q.ev]; big=(p&&PICS[p]?`<img class="bigpic" src="/pics/${PICS[p]}" alt="">`:'')+`<div class="chips"><span class="chipx" style="font-size:22px">${nm(q.ev)}</span></div>`; }
  const pt=PARTS[q.part]||PARTS.first;
  frame(u('title'),'','run',`<div class="clab-card ${HEB()?'dir-rtl':''}">${tlTop()}<div>${pill('now',L2(pt.en,pt.he))}</div><p class="clab-q">${E(qtext(q.q))}</p>${big}
   <div>${T().quiet(u('dates'),'data-a="hint" aria-expanded="false"','tlk-small')}</div><div class="clab-how hb" hidden style="background:#E0F2FE;color:#075985">${hintLines(q).map(l=>`<div>${E(l)}</div>`).join('')}</div>
   ${body}${thow(q.part)}<div class="fbx" aria-live="polite"></div><div class="factbox"></div><div class="clab-row clab-center nxr"></div></div>`);
  const B=bodyEl(); const fb=(m,g)=>{ B.querySelector('.fbx').innerHTML=`<div class="clab-fb ${g?'good':'bad'}">${E(m)}</div>`; };
  B.querySelector('[data-a=hint]').onclick=e=>{ const hb=B.querySelector('.hb'); hb.hidden=!hb.hidden; e.currentTarget.textContent=hb.hidden?u('dates'):u('hide'); e.currentTarget.setAttribute('aria-expanded',String(!hb.hidden)); S.usedHint=true; };
  S.usedHint=false;
  const solve=()=>{ solved=true; if(tries===0&&!S.usedHint) S.first++; else S.missed.push(q); snd('right');
   const add=cardsIn(q).filter(k=>!S.got.has(k)); const keep=q.t==='order'?add:add.filter(k=>k===q.show||(q.ev&&PIC[k]===DPIC[q.ev])||(q.opts&&q.opts[q.ans]===k)); keep.forEach(k=>S.got.add(k));
   const pr=pick(UI_.praise); fb(L2(pr.en,pr.he),true);
   if(q.f) B.querySelector('.factbox').innerHTML=`<div class="fact"><b>${E(u('dyk'))}</b><div ${HEB()&&FHE[q.f]?'dir="rtl"':'style="direction:ltr;text-align:left"'}>${E(factOf(q.f))}</div></div>`;
   B.querySelector('.nxr').innerHTML=T().main(T().WORDS.next,'data-a="nx"'); const nx=B.querySelector('[data-a=nx]'); nx.onclick=()=>{ snd('tap'); S.i++; tlRender(); }; try{ nx.scrollIntoView({block:'nearest'}); }catch(e){} };
  if(q.t==='pick') B.querySelectorAll('.clab-opt').forEach(b=>b.onclick=()=>{ if(solved||b.classList.contains('wrong')) return; if(+b.dataset.i===q.ans){ b.classList.add('right'); B.querySelectorAll('.clab-opt').forEach(o=>o.disabled=true); solve(); } else { b.classList.add('wrong'); tries++; snd('wrong'); fb(u('wrong')+(['first','last','fl','mem','ba','between'].indexOf(q.part)>=0?' '+u('compare'):''),false); } });
  if(q.t==='order'){ const reset=()=>{ if(solved) return; order=[]; B.querySelectorAll('.clab-opt').forEach(o=>{ o.classList.remove('picked','wrong'); const n=o.querySelector('.num'); if(n) n.remove(); }); B.querySelector('.fbx').innerHTML=''; };
   B.querySelector('[data-a=undo]').onclick=reset;
   B.querySelectorAll('.clab-opt').forEach(b=>b.onclick=()=>{ if(solved||b.classList.contains('picked')) return; b.classList.add('picked'); order.push(+b.dataset.i); snd('tap'); b.insertAdjacentHTML('afterbegin',`<span class="num">${order.length}</span>`);
    if(order.length===q.items.length){ const ok=order.every((si,pos)=>q.shown[si]===q.items[pos]);
     if(ok){ B.querySelectorAll('.clab-opt').forEach(o=>{ o.classList.add('right'); o.disabled=true; }); B.querySelector('[data-a=undo]').disabled=true; solve(); }
     else { tries++; snd('wrong'); B.querySelectorAll('.clab-opt').forEach(o=>{ const si=+o.dataset.i, pos=order.indexOf(si); if(q.items[pos]!==q.shown[si]) o.classList.add('wrong'); }); fb(u('wrongOrder'),false); } } }); }
  if(q.t==='type'){ const show=()=>{ B.querySelector('.numshow').textContent=typed||'?'; };
   B.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{ if(solved||typed.length>=5) return; typed+=b.dataset.n; snd('tap'); show(); });
   B.querySelector('[data-a=del]').onclick=()=>{ typed=typed.slice(0,-1); show(); };
   B.querySelector('[data-a=chk]').onclick=()=>{ if(solved) return; if(!typed){ fb(u('needNum'),false); return; } const v=parseInt(typed,10);
    if(v===q.ans){ B.querySelectorAll('[data-n],[data-a=del],[data-a=chk]').forEach(b=>b.disabled=true); B.querySelector('.numshow').style.borderColor='#1f8a5b'; solve(); }
    else { tries++; snd('wrong'); typed=''; show(); fb(tries>=2&&['years','use','chal'].indexOf(q.part)>=0?u('subtract'):u('notYet'),false); } }; } }
 function tlFinish(){ const n=S.qs.length, f=S.first, k=S.k; if(f/n>=.8){ P.tl.done[k]=1; save(); } snd('win');
  const got=S.pool.filter(x=>S.got.has(x));
  const desc=q=>{ const ans=q.t==='pick'?label(q.opts[q.ans]):q.t==='order'?q.items.map(label).join(' → '):E(q.ans); return `<div class="clab-pas" style="font-size:15px"><b>${E(qtext(q.q))}</b>${q.ctx?`<div>${q.ctx.map(nm).join(' · ')}</div>`:q.ev?`<div>${nm(q.ev)}</div>`:''}<div style="color:#1f8a5b;font-weight:800">${ans}</div></div>`; };

   <h3>${E(u('built'))}</h3><div class="gpool">${got.map(x=>`<div class="tcard">${imgHTML(PIC[x],nameOf(x),'')}<div class="tn">${nm(x)}</div><div class="ty">${E(CY[x])}</div></div>`).join('')}</div>
   ${S.missed.length?`<h3>${E(u('practice'))}</h3><div style="display:grid;gap:8px;text-align:start">${S.missed.map(desc).join('')}</div>`:`<p><b>${E(u('perfect'))}</b></p>`}
   <div class="clab-row clab-center">${S.missed.length?T().main(L2('Practice these '+S.missed.length+' again','לְתַרְגֵּל אֶת '+S.missed.length+' אֵלֶּה שׁוּב'),'data-a="pr"'):T().main(u('again'),'data-a="ag"')}${T().quiet(L2('Pick a level','בְּחַר רָמָה'),'data-a="hm"')}</div></div>`);
  const B=bodyEl(); const pr=B.querySelector('[data-a=pr]'), ag=B.querySelector('[data-a=ag]');
  if(pr) pr.onclick=()=>tlStart(k,S.missed.map(q=>Object.assign({},q,{shown:null}))); if(ag) ag.onclick=()=>tlStart(k);
  B.querySelector('[data-a=hm]').onclick=tlHome; }
 /* the Timeline Game: tap the cards in order to build the whole timeline */
 let G=null;
 function gameItems(k){ if(k==='dates') return DATES12.map(([y,key,,p],i)=>({key,pic:p,year:y,rank:i,tie:y}));
  return CARDS.filter(c=>c[3]<=LEVELS[k].range).map(([key,,y,p])=>({key,pic:p,year:y.indexOf('Year')===0?'?':y,rank:p,tie:(y==='2448'||y.indexOf('–')>=0)?'card'+p:y})); }
 const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
