<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Meet the snake sound</title>
<!-- Kindergarten ABC, Unit 2, letter kit game 1: "Meet the letter" for s (v2/curriculum/k-abc/MAP.md). Look and feel: Esti 2026-11-23
     ("cute, cartoony, 3D, immersive... trace the letter, and as you trace it, it turns into an S").
     One skill: the sound of s (pure "sss") and its shape. The snake IS the letter: it grows along the s as the s is traced.
     Steps: watch the snake being drawn -> it turns into a golden letter -> mouth picture -> wiggle chant -> HE traces the s (the snake grows under his finger)
     -> is this the snake sound? -> find the snake letter (3D letters in the meadow) -> stars.
     No reading needed: every instruction is spoken; "hear it again" repeats it. The pure sound is made by the device, never the voice.
     All art is drawn in code (original). ?fast=1 is for the automatic test. -->
<style>
:root{ --sky:#8FD0FF; --sky-low:#E8F6FF; --go:#22B35E; --go-dark:#137A3D; --gold:#FFC83D; --ink:#1B2A47; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; margin:0; overflow:hidden; background:var(--sky-low); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
body{ touch-action:none; user-select:none; -webkit-user-select:none; }
#world{ position:fixed; inset:0; background:linear-gradient(180deg, var(--sky) 0%, var(--sky-low) 70%); }
#world canvas{ display:block; width:100%; height:100%; touch-action:none; }
.btn{ position:fixed; border:0; padding:0; border-radius:50%; cursor:pointer; display:grid; place-items:center; transition:transform .15s ease, opacity .35s ease; z-index:5; }
.btn:active{ transform:scale(.92); }
.btn:focus-visible{ outline:5px solid var(--gold); outline-offset:4px; }
.glass{ background:rgba(255,255,255,.75); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 10px 30px rgba(27,42,71,.22), inset 0 1px 0 rgba(255,255,255,.9); }
.go{ background:radial-gradient(circle at 35% 28%, #8BF5B4 0%, var(--go) 52%, var(--go-dark) 100%); box-shadow:0 14px 34px rgba(19,122,61,.45), inset 0 2px 0 rgba(255,255,255,.5); }
#again{ top:calc(16px + env(safe-area-inset-top, 0px)); left:calc(16px + env(safe-area-inset-left, 0px)); width:84px; height:84px; opacity:0; pointer-events:none; }
#again.on{ opacity:1; pointer-events:auto; } #again.on.wait{ opacity:.45; }
#again svg{ width:44px; height:44px; }
#dots{ position:fixed; top:calc(48px + env(safe-area-inset-top, 0px)); left:50%; transform:translateX(-50%); display:flex; gap:6px; z-index:5; padding:8px 12px; border-radius:999px; background:rgba(255,255,255,.55); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); opacity:0; transition:opacity .4s; }
#dots.on{ opacity:1; }
#dots i{ width:12px; height:12px; border-radius:50%; background:rgba(27,42,71,.18); display:block; transition:background .3s; }
#dots i.on{ background:var(--go); }
#start{ left:50%; top:50%; width:170px; height:170px; margin:-85px 0 0 -85px; animation:bob 1.6s ease-in-out infinite; }
#start svg{ width:84px; height:84px; margin-left:10px; }
#start[hidden]{ display:none !important; }
#next{ left:50%; bottom:calc(22px + env(safe-area-inset-bottom, 0px)); width:120px; height:120px; margin-left:-60px; opacity:0; pointer-events:none; }
#next.show{ opacity:1; pointer-events:auto; animation:bob 1.4s ease-in-out infinite; }
#next svg{ width:60px; height:60px; }
@keyframes bob{ 0%,100%{ transform:translateY(0) scale(1);} 50%{ transform:translateY(-8px) scale(1.05);} }
/* the mouth card */
#mouth{ position:fixed; left:50%; top:50%; width:min(62vmin,420px); aspect-ratio:1; transform:translate(-50%,-40%) scale(.8); opacity:0; pointer-events:none; transition:transform .5s cubic-bezier(.3,1.4,.5,1), opacity .4s; border-radius:40px; z-index:4; padding:6%; }
#mouth.on{ opacity:1; transform:translate(-50%,-50%) scale(1); }
#mouth svg{ width:100%; height:100%; }
.air path{ stroke-dasharray:8 10; animation:blow .6s linear infinite; }
@keyframes blow{ to{ stroke-dashoffset:-36; } }
/* listen: yes (snake) and no (X) */
#ask{ position:fixed; left:50%; bottom:calc(26px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); display:flex; gap:28px; z-index:5; opacity:0; pointer-events:none; transition:opacity .3s; }
#ask.on{ opacity:1; pointer-events:auto; }
#ask .btn{ position:static; width:132px; height:132px; }
#ask .btn svg{ width:84px; height:84px; }
.shake{ animation:shake .45s !important; }
@keyframes shake{ 0%,100%{ transform:none;} 20%,60%{ transform:translateX(-10px);} 40%,80%{ transform:translateX(10px);} }
.right{ box-shadow:0 0 0 8px rgba(34,179,94,.6), 0 10px 30px rgba(27,42,71,.22) !important; }
/* end */
#end{ position:fixed; left:50%; bottom:calc(30px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:18px; z-index:5; opacity:0; pointer-events:none; transition:opacity .4s; }
#end.on{ opacity:1; pointer-events:auto; }
.stars{ display:flex; gap:14px; padding:12px 20px; border-radius:999px; }
.stars svg{ width:min(16vmin,96px); height:min(16vmin,96px); }
.star{ transform:scale(0); } .star.pop{ animation:pop .45s cubic-bezier(.3,1.6,.5,1) forwards; }
@keyframes pop{ to{ transform:scale(1);} }
#replay{ position:static; width:96px; height:96px; }
#replay svg{ width:48px; height:48px; }
#nogl{ position:fixed; inset:0; display:none; place-items:center; z-index:9; background:var(--sky-low); }
#nogl.on{ display:grid; }
@media (prefers-reduced-motion: reduce){ #start, #next.show{ animation:none; } }
</style>

  /* ---------- find the snake letter: 3D letters stand in the meadow ---------- */
  var SETS = [['s', 'a', 't', 'm'], ['t', 's', 'm', 'a'], ['m', 'a', 's', 't']], EASY = [['s', 'm'], ['a', 's'], ['s', 't']];
  var candy = function (c) { return new T3.MeshPhysicalMaterial({ color: KW.col(c), roughness: 0.25, clearcoat: 1, clearcoatRoughness: 0.1, envMap: W.envTex, envMapIntensity: 0.8 }); };
  var LCOL = [0x4FA8FF, 0xFF7FAE, 0xFFB627, 0xB98CFF], findGroup = new T3.Group(), findLetters = [], findLocked = false; scene.add(findGroup);
  function clearFind() { while (findGroup.children.length) findGroup.remove(findGroup.children[0]); findLetters = []; }
  function slots(n) { var a = W.aspect;
    if (n === 2) return a < 1 ? [[0, 2.3, 0.5], [0, -0.4, 0.5]] : [[-2, 0.3, 0.6], [2, 0.3, 0.6]];
    if (a < 1) return [[-1.5, 2.3, 0.42], [1.5, 2.3, 0.42], [-1.5, -0.2, 0.42], [1.5, -0.2, 0.42]];
    return [[-4.4, 0.2, 0.55], [-1.5, 0.2, 0.55], [1.5, 0.2, 0.55], [4.4, 0.2, 0.55]]; }
  function buildRound() {
    clearFind(); findLocked = false; st.firstTry = true; var set = shuffle((st.easy ? EASY : SETS)[st.round]), sl = slots(set.length);
    set.forEach(function (k, i) { var L = KW.letter(W, k, candy(LCOL[(i + st.round) % 4])), s = sl[i][2]; L.position.set(sl[i][0], sl[i][1], 0.3); L.userData.s = s; L.scale.setScalar(0.001); findGroup.add(L); findLetters.push(L);
      W.tween(0.6 + i * 0.12, function (q) { L.scale.setScalar(Math.max(0.001, q * s)); }, 'back'); });
    R.run([st.round === 0 ? 'Find the snake letter!' : 'Find the snake letter again!']);
  }
  function letterOf(e) { var h = W.hits(e, findLetters); if (!h.length) return null; var o = h[0].object; while (o && !o.userData.key) o = o.parent; return o; }
  function findTap(e) {
    if (findLocked) return; var L = letterOf(e); if (!L) return; R.stop();
    if (L.userData.key === 's') {
      findLocked = true; A.chime([660, 880]); if (st.firstTry) st.stars++; W.burst(L.position.clone(), 24, 4);
      var y0 = L.position.y; R.run([function () { return W.tween(0.5, function (k) { L.position.y = y0 + Math.sin(k * Math.PI) * 0.8; L.rotation.y = k * Math.PI * 2; }); }, function () { A.hissStart(); return W.wait(0.9).then(A.hissStop); }, 'Yes!'])
        .then(function (ok) { if (!ok) return; st.round++; if (st.round < 3) buildRound(); else afterRounds(); });
    } else {
      st.firstTry = false; A.chime([330, 262]); var x0 = L.position.x;
      W.tween(0.45, function (k) { L.position.x = x0 + Math.sin(k * Math.PI * 6) * 0.15 * (1 - k); });
      var right = findLetters.filter(function (x) { return x.userData.key === 's'; })[0];
      R.run(['Not that one. Look for the curvy snake.', function () { return showGhost(right); }, KW.echo(function () { A.hissStart(); return W.wait(0.8).then(A.hissStop); })]);
    }
  }
  function showGhost(L) {   /* the snake appears inside the right letter for a moment */
    var g = KW.snake(W, curve, 0.44); g.grow(1); g.opacity(0.55); g.group.position.copy(L.position); g.group.position.z += 0.25; g.base = L.userData.s; g.group.scale.setScalar(L.userData.s); g.y = L.position.y; findGroup.add(g.group); st.ghost = (st.ghost || 0) + 1;
    return W.wait(1.6).then(function () { return W.tween(0.4, function (k) { g.opacity(0.55 * (1 - k)); }); }).then(function () { findGroup.remove(g.group); });
  }
  function afterRounds() {
    if (st.easy) st.stars = Math.min(st.stars, 2);   /* with extra help he can pass, but not with full stars */
    if (st.stars >= 2 || st.easy) return go(STEPS.indexOf('end'));
    st.easy = true; clearFind(); fullSnake();
    R.run(["Let's look one more time.", function () { letter.visible = true; letter.scale.setScalar(1); snake.opacity(0.5); return W.wait(0.3); }, 'See the snake inside the letter?', KW.echo(function () { A.hissStart(); return W.wait(1.2).then(A.hissStop); })])
      .then(function (ok) { if (!ok) return; letter.visible = false; snake.group.visible = false; st.round = 0; st.stars = 0; buildRound(); });
  }
  W.onResize = function () { if (st.name === 'find' && findLetters.length) { var sl = slots(findLetters.length); findLetters.forEach(function (L, i) { L.position.set(sl[i][0], sl[i][1], 0.3); L.userData.s = sl[i][2]; L.scale.setScalar(sl[i][2]); }); } };

  /* ---------- every frame ---------- */
  W.onFrame(function (dt, T) {
    if (st.name === 'trace' && T - lastMove > 0.18) A.hissStop();
    if (st.name === 'trace' && tracing && !down && !R.busy && T - lastProgress > 7) hint();
    startDot.visible = guide.visible && tk < 4; startDot.scale.setScalar((st.name === 'trace' && tk === 0 ? 1.1 : 0.7) * (0.85 + Math.sin(T * 5) * 0.2));
    dots.forEach(function (d, i) { d.scale.setScalar(0.3 + Math.sin(T * 4 - i * 0.35) * 0.05); });
    if (letter.visible) { letter.position.y = Math.sin(T * 1.6) * 0.07; letter.rotation.y += (Math.sin(T * 0.7) * 0.3 - letter.rotation.y) * 0.03; }
    if (!findLocked) findLetters.forEach(function (L, i) { L.rotation.y = Math.sin(T * 0.8 + i) * 0.25; });
  });

  /* for the automatic test: where things are on the screen */
  function midOf(L) { return KW.curveOf(KW.STROKES[L.userData.key][0]).getPointAt(0.5).multiplyScalar(L.userData.s).add(L.position); }
  st.screenOfTrace = function (i) { return W.screenOf(PTS[i].clone().add(stage.position)); };
  st.screenOfLetter = function (k) { var L = findLetters.filter(function (x) { return x.userData.key === k; })[0]; return L ? W.screenOf(midOf(L)) : null; };
  st.screenOfOther = function () { var L = findLetters.filter(function (x) { return x.userData.key !== 's'; })[0]; return L ? W.screenOf(midOf(L)) : null; };
  st.screenOfHead = function () { var w = new T3.Vector3(); snake.head.getWorldPosition(w); return W.screenOf(w); };
  st.letters = function () { return findLetters.map(function (L) { return L.userData.key; }); };
  st.isReady = function () { return !!W.ready; };

  /* start: one big play button (a tap is needed before sound can play) */
  A.preload(['Watch me draw the snake!', 'A snake! Listen.', 'Tap the snake to hear it again.', 'Watch! The snake turns into a letter!', 'This letter makes the snake sound.', 'Snake shape, snake sound!']);
  $('#start').onclick = function () { A.ctx(); $('#start').hidden = true; $('#again').classList.add('on'); dotsEl.classList.add('on'); W.phase = 'intro'; go(0); };
})();
</script>
</body>
</html>
