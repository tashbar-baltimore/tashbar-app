<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ABC worlds — look sample</title>
<!-- Kindergarten ABC 2.0, GRAPHICS SAMPLE (Esti 2026-11-24): "award-winning, premium kids' game graphics ... every letter gets its OWN little world".
     Two worlds to look at and play a little: ?w=s the snake's garden pond, ?w=a the apple orchard.
     In each: the friend says hi, shows how the letter is made (the picture grows along it), then the boy traces it with his finger, and celebrates.
     Not a finished game yet: Esti approves the look first. -->
<style>
:root{ --ink:#1F2A44; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; overflow:hidden; background:#7CC8FF; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; user-select:none; -webkit-user-select:none; }
#stage{ position:fixed; inset:0; }
.btn{ position:fixed; border:0; padding:0; border-radius:50%; cursor:pointer; display:grid; place-items:center; z-index:5; transition:transform .15s ease, opacity .35s ease;
  box-shadow:0 8px 0 rgba(0,0,0,.18), 0 14px 28px rgba(0,40,90,.35), inset 0 -6px 0 rgba(0,0,0,.12), inset 0 6px 10px rgba(255,255,255,.55); }
.btn:active{ transform:scale(.92); }
.btn svg{ width:56%; height:56%; filter:drop-shadow(0 2px 0 rgba(0,0,0,.18)); }
#again{ top:calc(16px + env(safe-area-inset-top,0px)); left:calc(16px + env(safe-area-inset-left,0px)); width:84px; height:84px; background:radial-gradient(circle at 35% 30%,#FFFFFF,#E3F1FF 60%,#B9DAFF); opacity:0; pointer-events:none; }
#again.on{ opacity:1; pointer-events:auto; } #again.wait{ opacity:.55; }
#home{ top:calc(16px + env(safe-area-inset-top,0px)); right:calc(16px + env(safe-area-inset-right,0px)); width:72px; height:72px; background:radial-gradient(circle at 35% 30%,#FFF6D8,#FFD36B 60%,#F5A623); }
#play{ left:50%; top:50%; width:150px; height:150px; margin:-75px 0 0 -75px; background:radial-gradient(circle at 35% 30%,#B8FFCE,#2EDB6A 55%,#109A45); animation:bob 1.5s ease-in-out infinite; }
#play svg{ margin-left:10%; }
#play.gone{ opacity:0; pointer-events:none; transform:scale(.4); }
#end{ position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); display:flex; gap:28px; z-index:5; opacity:0; pointer-events:none; transition:opacity .4s; }
#end.on{ opacity:1; pointer-events:auto; }
#end .btn{ position:relative; width:108px; height:108px; }
#replay{ background:radial-gradient(circle at 35% 30%,#FFFFFF,#E3F1FF 60%,#B9DAFF); }
#nextw{ background:radial-gradient(circle at 35% 30%,#FFE1F1,#FF7EB9 55%,#E0408A); animation:bob 1.5s ease-in-out infinite; }
#nextw img{ width:62%; height:62%; }
@keyframes bob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-8px) } }
#nogl{ position:fixed; inset:0; display:none; place-items:center; background:#7CC8FF; color:#fff; font-size:22px; text-align:center; padding:24px; }
@media (max-width:600px){ #again{ width:70px; height:70px; } #home{ width:60px; height:60px; } #play{ width:124px; height:124px; margin:-62px 0 0 -62px; } #end .btn{ width:92px; height:92px; } }
</style>
<script type="importmap">{ "imports": { "three": "./lib/three-r180/three.module.min.js" } }</script>
</head>
<body>
<div id="stage"></div>
<button class="btn" id="again" aria-label="hear it again"><svg viewBox="0 0 24 24"><path fill="#1F6FD6" d="M3 9v6h4l5 4V5L7 9H3z"/><path fill="none" stroke="#1F6FD6" stroke-width="2.2" stroke-linecap="round" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
<a class="btn" id="home" href="./" aria-label="all games"><svg viewBox="0 0 24 24"><path fill="#8A4B00" d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z"/></svg></a>
<button class="btn" id="play" aria-label="play"><svg viewBox="0 0 24 24"><path fill="#fff" d="M7 4.5v15l13-7.5z"/></svg></button>
<div id="end">
  <button class="btn" id="replay" aria-label="play again"><svg viewBox="0 0 24 24"><path fill="none" stroke="#1F6FD6" stroke-width="2.6" stroke-linecap="round" d="M19 12a7 7 0 1 1-2.1-5"/><path fill="#1F6FD6" d="M20.5 3.5v6h-6z"/></svg></button>
  <button class="btn" id="nextw" aria-label="the next world"><svg viewBox="0 0 24 24"><path fill="#fff" d="M5 10.5h9.5L11 7l2-2 7 7-7 7-2-2 3.5-3.5H5z"/></svg></button>
</div>
<div id="nogl">This computer cannot show the 3D world.</div>
<script type="module">
import { THREE, FAST, stage, tracer, runner, echo, audio, rnd, clamp, ease } from './kit3d.js';
import { worldS, worldA } from './worlds.js';

const which = (location.search.match(/[?&]w=([a-z])/) || [])[1] || 's';
const L = window.__look = { name: 'loading', world: which, ready: false };
let S;
try { S = stage(document.getElementById('stage')); } catch (e) { L.name = 'nogl'; L.err = String(e); document.getElementById('nogl').style.display = 'grid'; throw e; }
const W = which === 'a' ? worldA(S) : worldS(S);
const narrow = () => innerWidth / innerHeight < 0.8;
S.focus.target.copy(W.focus.target); S.focus.w = 8.2; S.focus.h = 6.4;
const setFocus = () => { S.focus.w = narrow() ? 4.7 : (W.focusW || 8.4); S.focus.h = narrow() ? 5 : 6.4; S.fit(); if (W.layout) W.layout(narrow()); }; setFocus(); addEventListener('resize', setFocus);
S.start();
const cam = S.camera, $ = id => document.getElementById(id), again = $('again');
const R = runner(again);
audio.preload(Object.values(W.lines));

/* camera: swoop in at the start, then a gentle living sway that follows the finger a little */
let camK = FAST ? 1 : 0; const from = W.camFrom.clone();
cam.position.copy(FAST ? S.camHome : from);
S.lookTarget = new THREE.Vector3(0, 2.4, 9);
S.tick(t => { const home = S.camHome, p = new THREE.Vector3().copy(home);
  p.x += Math.sin(t * 0.21) * 0.25 + S.pointer.x * 0.35; p.y += Math.sin(t * 0.27) * 0.12 + S.pointer.y * 0.18;
  cam.position.copy(from).lerp(p, ease.inOut(camK)); const tg = S.focus.target.clone(); tg.y += (1 - ease.inOut(camK)) * 1.5; cam.lookAt(tg);
  if (!T.down) S.lookTarget.set(S.pointer.x * 5, 2.4 + S.pointer.y * 3, 9); });

/* tracing: the picture grows under his finger */
const T = tracer(S, W.strokes, {
  onMove: T => { W.grow(T); W.soundStart(); const P = T.strokes[T.si][T.k]; if (P) S.lookTarget.copy(P).setZ(3); },
  onStroke: T => { W.soundStop(); audio.chime([784, 988]); },
  onUp: () => W.soundStop(),
  onFar: () => { if (S.t - lastNag > 3) { lastNag = S.t; R.run([W.lines.far]); } },
  onDone: () => { W.soundStop(); done(); }
  , startZ: W.name === 's' ? 1.0 : 0.3
});
let lastNag = -9;
S.tick(t => { if (T.on && T.down && t - T.lastMove > 0.2) W.soundStop();
  if (T.on && !T.down && !R.busy && t - T.lastProgress > 7) { T.lastProgress = t; hint(); } });
function hint() { /* show the way: a sparkle runs along the next part of the path */
  const P = T.strokes[T.si], k0 = T.k; let i = k0; const id = setInterval(() => { i += 2; if (i >= P.length || i > k0 + 40 || !T.on) return clearInterval(id); W.party.twinkle(P[i], 1); }, 40);
  R.run([T.k === 0 ? W.lines.far : W.lines.you]); }

/* taps on the friend: always a happy reaction and the letter's pure sound */
L.pokes = 0;
S.onTap(W.hero, () => { L.pokes++; W.poke(); if (W.name === 'a') W.sound(); });
S.renderer.domElement.addEventListener('pointerdown', e => { if (T.down) return; const h = S.pick(e); if (h) h.h.fn(h.point);
  else { /* tap a tree: it wiggles and sparkles */ } });

async function intro() {
  L.name = 'intro'; again.classList.add('on');
  if (!FAST) await S.tween(2200, e => camK = e, t => t); camK = 1;
  await W.appear();
  L.name = 'watch';
  await R.run([W.lines.hi, W.lines.watch]);
  await W.demo(); W.cheer(); await S.wait(1600);
  await R.run([echo(() => W.sound()), echo(() => S.wait(250)), echo(() => W.sound())]);
  await W.reset();
  L.name = 'trace'; T.reset(); T.on = true; T.lastProgress = S.t;
  R.run([W.lines.you]);
}
async function done() {
  L.name = 'cheer'; W.cheer(); await R.run([echo(() => S.wait(900)), W.lines.yay, echo(() => W.sound())]);
  L.name = 'end'; $('end').classList.add('on');
}
$('play').onclick = () => { audio.ctx(); $('play').classList.add('gone'); intro(); };
$('replay').onclick = async () => { $('end').classList.remove('on'); await W.reset(); L.name = 'trace'; T.reset(); T.on = true; T.lastProgress = S.t; R.run([W.lines.you]); };
$('nextw').onclick = () => { location.href = 'look.html?w=' + (which === 's' ? 'a' : 's') + (FAST ? '&fast=1' : ''); };

/* for the automatic test */
L.ready = true; L.t = () => S.t; L.tw = () => S.tweens.length; L.tier = () => S.tier; L.fps = () => S.fps;
L.progress = () => T.progress();
L.screenOfTrace = i => { let n = i; for (const P of T.strokes) { if (n < P.length) return S.toScreen(P[n]); n -= P.length; } const P = T.strokes[T.strokes.length - 1]; return S.toScreen(P[P.length - 1]); };
L.tracePoints = () => T.strokes.map(P => P.length);
L.heroScreen = () => S.toScreen(W.heroPos());
L.pose = k => { camK = 1; $('play').classList.add('gone'); if (k === 'all' || k === 'cheer') W.showAll(); if (k === 'cheer') W.cheer(); if (k === 'poke') { W.showAll(); W.poke(); } };
L.said = audio.said; L.audio = audio; L.drawn = () => S.renderer.info.render.triangles;
</script>
</body>
</html>
