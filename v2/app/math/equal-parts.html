<title>Equal parts</title>
<!-- Tashbar Math Ladder, rung FR1 "Equal parts" (a SAMPLE lesson for Mrs. Khaver; plan: v2/curriculum/math-ladder/).
     One skill: equal parts are the same size. Check by laying one part on the other, or by counting the squares.
     Same size, not the same shape. Two equal parts are halves; four equal parts are fourths.
     Order: the lesson (Ari and Yanky share a chocolate bar) -> a clap chant -> "Watch me" -> his turn: equal or not? ->
     Mistake Detective (Yanky says unequal parts are halves) -> he cuts food into equal parts -> a check with no hand -> stars.
     No reading needed: every instruction is spoken; the speaker button repeats it; the light bulb shows "How to do it".
     The 3D table and food are drawn here (three.js, MIT licence, lib/). Add ?fast=1 for the automatic test. -->
<style>
:root{ --bg:#F6F1E7; --ink:#1F2A44; --card:#FFFFFF; --line:#E4DCCB; --green:#1E9E5A; --gold:#F5B400; --red:#D9534F; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:none; }
#view{ position:fixed; inset:0; display:block; width:100%; height:100%; touch-action:none; }
.hud{ position:fixed; left:0; right:0; top:0; display:grid; grid-template-columns:96px 1fr 96px; justify-items:center; align-items:center; padding:10px 16px; pointer-events:none; z-index:3; }
.hud > *{ pointer-events:auto; }
.btn{ border:0; cursor:pointer; display:grid; place-items:center; border-radius:999px; min-width:72px; min-height:72px; background:var(--card); box-shadow:0 4px 0 var(--line), 0 6px 18px rgba(31,42,68,.12); }
.btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--line); }
.btn:focus-visible{ outline:4px solid #7FB3FF; outline-offset:3px; }
#again,#help{ width:84px; height:84px; visibility:hidden; transition:opacity .25s; }
#again svg,#help svg{ width:42px; height:42px; }
#again.wait{ opacity:.45; }
.dots{ display:flex; gap:7px; background:rgba(255,255,255,.8); padding:8px 12px; border-radius:999px; }
.dots i{ width:12px; height:12px; border-radius:50%; background:var(--line); display:block; transition:background .3s; }
.dots i.on{ background:var(--green); }
#start{ position:fixed; left:50%; top:50%; width:170px; height:170px; margin:-85px 0 0 -85px; background:var(--green); box-shadow:0 8px 0 #157A45, 0 14px 34px rgba(30,158,90,.4); animation:pulse 1.4s ease-in-out infinite; z-index:4; }
#start svg{ width:84px; height:84px; }
@keyframes pulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.07);} }
#hand{ position:fixed; width:84px; height:84px; margin:-6px 0 0 -26px; pointer-events:none; display:none; filter:drop-shadow(0 6px 6px rgba(0,0,0,.25)); z-index:6; transition:left .7s ease, top .7s ease; }
.bar{ position:fixed; left:0; right:0; bottom:22px; display:none; justify-content:center; gap:28px; z-index:4; }
.bar.show{ display:flex; }
.bar .btn{ width:112px; height:112px; }
.bar svg{ width:66px; height:66px; }
.shake{ animation:shake .45s; }
@keyframes shake{ 0%,100%{ transform:none;} 20%,60%{ transform:translateX(-10px);} 40%,80%{ transform:translateX(10px);} }
#howto{ position:fixed; right:16px; top:104px; width:min(330px,calc(100vw - 32px)); background:#FFFBEA; border:3px solid #F2D37A; border-radius:22px; padding:14px 16px; display:none; z-index:5; box-shadow:0 10px 30px rgba(0,0,0,.12); font-size:19px; line-height:1.35; }
#howto.show{ display:block; }
#howto b{ display:block; font-size:15px; letter-spacing:.06em; text-transform:uppercase; color:#9A6B00; margin-bottom:6px; }
#howto ol{ margin:0; padding-left:24px; display:grid; gap:6px; }
#howto .pic{ display:flex; gap:10px; align-items:center; margin-top:10px; }
#howto .pic svg{ width:120px; height:44px; flex:none; }
.end{ position:fixed; left:0; right:0; top:104px; display:none; flex-direction:column; align-items:center; gap:18px; z-index:4; }
.end.show{ display:flex; }
.stars{ display:flex; gap:14px; }
.stars svg{ width:min(18vmin,104px); height:min(18vmin,104px); }
.star{ transform:scale(0); }
.star.pop{ animation:pops .45s cubic-bezier(.3,1.6,.5,1) forwards; }
@keyframes pops{ to{ transform:scale(1);} }
.endrow{ position:fixed; left:0; right:0; bottom:24px; display:flex; justify-content:center; gap:28px; }
.endrow .btn{ width:104px; height:104px; }
.endrow svg{ width:46px; height:46px; }
#clapBtn{ position:fixed; left:50%; bottom:28px; width:132px; height:132px; margin-left:-66px; display:none; background:#FFF4D6; box-shadow:0 6px 0 #E8C36A, 0 10px 24px rgba(0,0,0,.12); z-index:4; }
#clapBtn.show{ display:grid; }
#clapBtn.beat{ animation:beat .25s ease-out; }
@keyframes beat{ 0%{ transform:scale(1.18);} 100%{ transform:scale(1);} }
#clapBtn svg{ width:84px; height:84px; }
#nogl{ position:fixed; inset:0; display:none; place-items:center; text-align:center; padding:24px; font-size:22px; }
.fast *{ animation-duration:.01s !important; transition-duration:.01s !important; animation-iteration-count:1 !important; }
@media (max-width:520px){ .bar .btn{ width:96px; height:96px; } .bar svg{ width:56px; height:56px; } #howto{ top:100px; font-size:17px; } }
</style>

<body>
<canvas id="view"></canvas>
<div class="hud">
  <button class="btn" id="again" aria-label="Hear it again"><svg viewBox="0 0 48 48"><path d="M8 18h8l11-9v30l-11-9H8z" fill="#1F2A44"/><path d="M33 16c3 2 5 5 5 8s-2 6-5 8M37 10c5 3 8 8 8 14s-3 11-8 14" stroke="#1F2A44" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg></button>

  <div class="pic"><svg viewBox="0 0 120 44"><rect x="4" y="8" width="52" height="28" rx="4" fill="#8B5A2B"/><rect x="64" y="8" width="52" height="28" rx="4" fill="#8B5A2B"/><path d="M60 2v40" stroke="#D9534F" stroke-width="3" stroke-dasharray="5 4"/></svg><span>Same size = equal parts</span></div></div>
<div class="end" id="end"><div class="stars" id="stars"></div>
  <div class="endrow">
    <button class="btn" id="replay" aria-label="Play again"><svg viewBox="0 0 48 48"><path d="M36 16 A14 14 0 1 0 38 28" stroke="#1F2A44" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M30 8 L38 16 L28 20Z" fill="#1F2A44"/></svg></button>
    <button class="btn" id="print" aria-label="Print this page"><svg viewBox="0 0 48 48"><rect x="12" y="6" width="24" height="12" rx="2" fill="none" stroke="#1F2A44" stroke-width="3.5"/><rect x="6" y="18" width="36" height="16" rx="4" fill="#1F2A44"/><rect x="12" y="28" width="24" height="14" rx="2" fill="#fff" stroke="#1F2A44" stroke-width="3.5"/></svg></button>
  </div></div>
<button class="btn" id="clapBtn" aria-label="Clap"><svg viewBox="0 0 64 64"><g fill="#F2C9A0" stroke="#B5742A" stroke-width="2.5" stroke-linejoin="round"><path d="M18 52 C10 44 8 34 12 24 L20 12 C22 9 26 10 25 14 L22 22 L32 8 C34 5 38 7 36 11 L30 22 L38 12 C40 9 44 11 42 15 L34 28 L40 22 C42 20 46 22 44 25 L34 42 C30 50 24 56 18 52Z"/></g><path d="M48 8 l4 -4 M54 16 l6 -2 M50 26 l6 2" stroke="#E8A13A" stroke-width="3" stroke-linecap="round"/></svg></button>
<div id="nogl">This computer cannot show the 3D lesson.</div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from './lib/RoomEnvironment.js';
import { RoundedBoxGeometry } from './lib/RoundedBoxGeometry.js';

const FAST = /[?&]fast=1/.test(location.search);
if (FAST) document.documentElement.classList.add('fast');
const $ = s => document.querySelector(s);
const W = window.__eq = { name: 'start', ready: false, said: [], misses: 0, checkRight: 0, checkAsked: 0, stars: 0, done: false, again: 0, help: 0, log: [] };
const wait = ms => new Promise(r => setTimeout(r, FAST ? 0 : ms));
const setName = n => { W.name = n; W.log.push(n); };

/* ---------------- the 3D kitchen table ---------------- */
const canvas = $('#view');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: FAST }); }
catch (e) { $('#nogl').style.display = 'grid'; $('#start').style.display = 'none'; throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.82; renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#F3E6D0');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 120);
scene.add(new THREE.HemisphereLight('#FFF6E8', '#C9B48E', 0.5));
const sun = new THREE.DirectionalLight('#FFF1DC', 1.8);
sun.position.set(-4, 12, 6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 5; sun.shadow.bias = -0.0004;
Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 30 }); scene.add(sun);

const std = (color, rough = 0.6, extra = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: rough }, extra));
{ /* wall with a window and a shelf of seforim, a wooden table with a white cloth and a blue stripe, and a cutting board */
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(70, 24), std('#F4E3C6', 0.95)); wall.position.set(0, 6, -9); scene.add(wall);
  const frame = new THREE.Mesh(new RoundedBoxGeometry(5, 3.6, 0.3, 3, 0.1), std('#FFFFFF', 0.5)); frame.position.set(-5, 5.2, -8.85); scene.add(frame);
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(4.4, 3), std('#BFE3FF', 0.4, { emissive: '#CFEAFF', emissiveIntensity: 0.6 })); glass.position.set(-5, 5.2, -8.68); scene.add(glass);
  const shelf = std('#B87842'); [3.4, 5.2].forEach(y => { const s = new THREE.Mesh(new RoundedBoxGeometry(4.4, 0.16, 0.9, 2, 0.05), shelf); s.position.set(5, y, -8.5); s.castShadow = true; scene.add(s); });
  const spines = ['#7A1F2B', '#1F3A6B', '#2E5D3A', '#5B2A6E', '#8A5A1E', '#1F3A6B', '#7A1F2B'];
  [3.48, 5.28].forEach((y, r) => { let x = 3.1; spines.forEach((c, i) => { const h = 1.0 + ((i * 7 + r * 3) % 4) * 0.08, w = 0.3 + (i % 3) * 0.05;
    const bk = new THREE.Mesh(new RoundedBoxGeometry(w, h, 0.7, 2, 0.03), std(c)); bk.position.set(x + w / 2, y + h / 2, -8.5); scene.add(bk); x += w + 0.05; }); });
  const table = new THREE.Mesh(new RoundedBoxGeometry(17, 0.6, 10, 3, 0.2), std('#B07A4A', 0.55)); table.position.set(0, -0.3, 0); table.receiveShadow = true; scene.add(table);
  const cloth = new THREE.Mesh(new THREE.BoxGeometry(14, 0.04, 8), std('#FFFFFF', 0.9)); cloth.position.set(0, 0.02, 0); cloth.receiveShadow = true; scene.add(cloth);
  [-3.4, 3.4].forEach(z => { const st = new THREE.Mesh(new THREE.BoxGeometry(14, 0.045, 0.28), std('#3D6FB6', 0.9)); st.position.set(0, 0.025, z); scene.add(st); });
  const board = new THREE.Mesh(new RoundedBoxGeometry(8.6, 0.22, 4.6, 3, 0.1), std('#D9A86C', 0.6)); board.position.set(0, 0.13, 0.2); board.receiveShadow = true; board.castShadow = true; scene.add(board);
}
const TOP = 0.24;   /* the board's top */

/* ---------------- food made of squares ---------------- */
const S = 1.06, FOOD = {
  bar:   { body: '#3A1C0C', top: '#4A2510', h: 0.42, name: 'chocolate bar' },
  cake:  { body: '#F0CF8E', top: '#9C5520', h: 0.72, name: 'honey cake' },
  kugel: { body: '#EAC77A', top: '#A8681F', h: 0.62, name: 'kugel' },
};
const cellGeo = {}; const geoFor = h => cellGeo[h] || (cellGeo[h] = new RoundedBoxGeometry(S - 0.07, h, S - 0.07, 3, 0.07));
const litMat = std('#FFD54A', 0.4, { emissive: '#FFB300', emissiveIntensity: 0.55 });
const redMat = std('#F07C74', 0.5, { emissive: '#D9534F', emissiveIntensity: 0.35 });
let item = null;
/* pieces(c, r) -> piece number; null = one whole */
function makeItem(kind, cols, rows, pieces) {
  const f = FOOD[kind], g = new THREE.Group(); g.position.y = TOP; scene.add(g);
  const it = { kind, cols, rows, g, cells: [], groups: [], cuts: new Set(), grooves: [] };
  const mats = [std(f.body, 0.55), std(f.body, 0.55), std(f.top, 0.45), std(f.body, 0.7), std(f.body, 0.55), std(f.body, 0.55)];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const m = new THREE.Mesh(geoFor(f.h), mats); m.castShadow = true; m.receiveShadow = true;
    m.position.set((c - (cols - 1) / 2) * S, f.h / 2, (r - (rows - 1) / 2) * S);
    m.userData = { c, r, base: mats }; it.cells.push({ c, r, m });
  }
  group(it, pieces || (() => 0)); fitTo(cols, rows);
  it.g.scale.setScalar(0.01); tween(380, k => it.g.scale.setScalar(Math.max(0.01, ease(k))));
  return it;
}
function group(it, pieces) {
  it.groups.forEach(gr => it.g.remove(gr)); it.groups = [];
  it.cells.forEach(cl => { cl.p = pieces(cl.c, cl.r); });
  const n = Math.max(...it.cells.map(cl => cl.p)) + 1;
  for (let i = 0; i < n; i++) { const gr = new THREE.Group(); gr.userData.cells = it.cells.filter(cl => cl.p === i); gr.userData.cells.forEach(cl => gr.add(cl.m)); it.g.add(gr); it.groups.push(gr); }
}
function dropItem() { const it = item; item = null; if (!it) return Promise.resolve(); clearGrooves(it);
  return tween(280, k => it.g.scale.setScalar(Math.max(0.001, 1 - k))).then(() => scene.remove(it.g)); }
const sizes = it => it.groups.map(gr => gr.userData.cells.length);
const centroid = gr => { const cs = gr.userData.cells; return { x: cs.reduce((a, c) => a + c.m.position.x, 0) / cs.length, z: cs.reduce((a, c) => a + c.m.position.z, 0) / cs.length }; };
function spread(it, amt, ms = 450) {
  const goals = it.groups.map(gr => { const c = centroid(gr); const sx = Math.abs(c.x) < 0.01 ? 0 : Math.sign(c.x), sz = Math.abs(c.z) < 0.01 ? 0 : Math.sign(c.z); return new THREE.Vector3(sx * amt, 0, sz * amt * 0.8); });
  const starts = it.groups.map(gr => gr.position.clone());
  if (amt) chop();
  return tween(ms, k => it.groups.forEach((gr, i) => gr.position.lerpVectors(starts[i], goals[i], ease(k))));
}
/* lay the smaller part on the bigger one; the left-over squares glow red */
function layOn(it) {
  const [a0, b0] = it.groups, big = sizes(it)[0] >= sizes(it)[1] ? a0 : b0, small = big === a0 ? b0 : a0;
  const bc = big.userData.cells, sc = small.userData.cells;
  const minC = cs => ({ c: Math.min(...cs.map(x => x.c)), r: Math.min(...cs.map(x => x.r)) });
  const mb = minC(bc), ms = minC(sc), dc = mb.c - ms.c, dr = mb.r - ms.r;
  const key = (c, r) => c + ',' + r, under = new Set(sc.map(x => key(x.c + dc, x.r + dr)));
  const left = bc.filter(x => !under.has(key(x.c, x.r))), match = !left.length && sc.length === bc.length;
  const from = small.position.clone(), to = big.position.clone().add(new THREE.Vector3(dc * S, FOOD[it.kind].h + 0.04, dr * S));
  return tween(900, k => { const e = ease(k); small.position.lerpVectors(from, to, e); small.position.y += Math.sin(Math.PI * e) * 1.4; })
    .then(() => { left.forEach(x => { x.m.material = redMat; }); return match; })
    .then(m => wait(900).then(() => m));
}
function liftOff(it) {
  const [a0, b0] = it.groups, small = sizes(it)[0] >= sizes(it)[1] ? b0 : a0, from = small.position.clone(), to = from.clone(); to.y = 0;
  const sgn = centroid(small).x >= 0 ? 1 : -1; to.x = sgn * 0.6; to.z = 0;
  it.cells.forEach(x => { x.m.material = x.m.userData.base; });
  return tween(700, k => { const e = ease(k); small.position.lerpVectors(from, to, e); small.position.y += Math.sin(Math.PI * e) * 1.2; });
}
/* count the squares in each part: they light up one by one, with the number above */
const numSprites = [];
function numSprite(n) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128; const x = cv.getContext('2d');
  x.fillStyle = '#FFFFFF'; x.beginPath(); x.arc(64, 64, 56, 0, 7); x.fill(); x.lineWidth = 8; x.strokeStyle = '#1F2A44'; x.stroke();
  x.fillStyle = '#1F2A44'; x.font = 'bold 72px system-ui,sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(String(n), 64, 68);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, toneMapped: false })); sp.scale.set(0.62, 0.62, 1); sp.renderOrder = 9; return sp;
}
const NUMW = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
const cap = s => s[0].toUpperCase() + s.slice(1);
async function countPart(it, gr) {
  const cs = gr.userData.cells.slice().sort((a, b) => a.r - b.r || a.c - b.c);
  for (let i = 0; i < cs.length; i++) { cs[i].m.material = litMat; plink(i);
    const sp = numSprite(i + 1); const p = new THREE.Vector3(); cs[i].m.getWorldPosition(p); sp.position.copy(p).setY(p.y + FOOD[it.kind].h / 2 + 0.45); scene.add(sp); numSprites.push(sp);
    await wait(330); }
  await say(cap(NUMW[cs.length]) + '.');
  numSprites.splice(0).forEach(sp => scene.remove(sp)); cs.forEach(x => { x.m.material = x.m.userData.base; });
}
async function countAll(it) { for (const gr of it.groups) await countPart(it, gr); }

  await judge({ kind: 'bar', cols: 5, rows: 2, pieces: (c) => (c < 2 ? 0 : 1), layable: true, intro: 'Equal parts, or not equal?' }, { counted: true });
  await cut({ kind: 'kugel', cols: 5, rows: 2, n: 2, intro: 'Cut the kugel into two equal parts.' }, { counted: true });
  await cut({ kind: 'bar', cols: 4, rows: 2, n: 4, intro: 'Cut the chocolate into four equal parts.' }, { counted: true });
  end();
}
function end() {
  const r = W.checkRight, stars = r >= 4 ? 3 : r >= 3 ? 2 : 1;
  W.stars = stars; W.done = true; setName('end'); dots(STEPS); task = null; showBar(null); setHow(null);
  const STAR = on => '<svg viewBox="0 0 100 100"><path d="M50 6l13 28 30 3-23 20 7 30-27-16-27 16 7-30L7 37l30-3z" fill="' + (on ? '#F5B400' : '#EDE6D6') + '" stroke="' + (on ? '#C48F00' : '#D8CFBC') + '" stroke-width="4" stroke-linejoin="round"/></svg>';
  $('#stars').innerHTML = [0, 1, 2].map(i => '<div class="star">' + STAR(i < stars) + '</div>').join('');
  $('#end').classList.add('show'); chime(true);
  document.querySelectorAll('.star').forEach((s, i) => setTimeout(() => s.classList.add('pop'), FAST ? 0 : 250 + i * 250));
  item = makeItem('cake', 4, 2, (c) => half(c, 0, 4)); spread(item, 0.3);
  play([stars === 3 ? 'You know equal parts! Same size, every time.' : 'Good work! Play again for more stars.', 'Tap the printer for a page to do at home.']);
}
$('#replay').onclick = () => { hush(); dropItem().then(learn); };
$('#print').onclick = () => { W.printed = true; location.href = 'equal-parts-print.html'; };

resize(); dots(0); frame();
item = makeItem('bar', 4, 2, null);
