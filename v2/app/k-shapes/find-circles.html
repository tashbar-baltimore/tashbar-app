<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Find the circles</title>
<!-- Kindergarten Shapes, Unit 1 "Meet the flat shapes" (v2/curriculum/k-shapes/MAP.md): know a circle (perfectly round, no corners) in any size; tell it from an oval and a half circle. K.G.2.
     Built on the shared 3D kit (kit.js): learn -> he taps / claps -> watch me -> he sorts -> find the mistake -> stars. ?fast=1 for the automatic test. -->
<link rel="stylesheet" href="kit.css">
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
</head>
<body>
<script type="module">
import { startGame, wrongFor, FAMILY } from './kit.js';

const PI = Math.PI;
startGame({
  id: 'circles',
  boxes: [{ paint: 'circle', accept: ['circle'] }],
  intro: ['Mendy is cleaning up his toys.', 'He needs all the circles.', "Let's learn about circles!"],
  lessons: [{ k: 'circle', word: 'circle', kind: 'circle', color: '#1F6FEB', rule: ['A circle is perfectly round, like a plate.'],
    chant: [['Round and round!', 3], ['No corners!', 3], ['Cir-cle!', 2]], turn: PI, turnLine: 'Watch. I turn it.', big: true }],
  set: [['c1', 'circle', 0, 1], ['ov', 'oval', 0.3, 1], ['c2', 'circle', 0, 0.75], ['se', 'semi', 0, 1],
        ['c3', 'circle', 0, 1.15], ['sq', 'square', 0.3, 1], ['c4', 'circle', 0, 0.62], ['hx', 'hex', 0, 1]],
  watchLine: "Here are Mendy's toys. Watch me find a circle.", yourTurn: 'Now you. Find all the other circles!',
  ask: 'Drag every circle into the box.', hint: 'Look for something perfectly round.', remember: 'Remember: a circle is round, with no corners.',
  yes: { c2: 'Yes! Small, but still a circle!', c3: 'Yes! Big, and still a circle!', c4: 'Yes! Small, still a circle!', b1: 'Yes! Still a circle!', b3: 'Yes! Still a circle!' },
  yesDefault: () => 'Yes! A circle!', allDone: 'You found all the circles!', wrong: wrongFor('circle'),
  bonus: [['b1', 'circle', 0, 0.8, 0], ['b2', 'oval', 1.4, 0.9, 2], ['b3', 'circle', 0, 1.05, 4]], bonusAsk: 'Find the real circles. Drag them in.',
  mistake: { friend: { name: 'Eli', shirt: '#2E7D5B', hair: '#2A1A12' }, icon: 'circle', piece: ['oval', 0, 1.1, '#1F6FEB'],
    claim: ['Eli says this is a circle.', 'He says it is round.'], ask: 'Is it a circle?', answer: false,
    explain: ['Look. It is long and squished.', 'A circle is perfectly round.'], right: ['Right! It is an oval, not a circle.', 'A circle is perfectly round.'] },
  endLine: 'You found every circle!', praise: 'Round and round, no corners. You are a circle expert!'
});
</script>
</body>
</html>
