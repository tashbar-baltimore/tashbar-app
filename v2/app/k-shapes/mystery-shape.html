<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mystery shape</title>
<!-- Kindergarten Shapes, Unit 3 "More shapes and tricky ones" (v2/curriculum/k-shapes/MAP.md): listen to clues (corners, sides, round) and find the one shape that fits them. K.G.4 (describe shapes by their parts).
     Built on the shared 3D kit (kit.js). ?fast=1 for the automatic test. -->
<link rel="stylesheet" href="kit.css">
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
</head>
<body>
<script type="module">
import { startGame, FAMILY } from './kit.js';
const PI = Math.PI;
startGame({
  id: 'mystery', world: 'sky', mode: 'clues', plain: true,   /* he counts corners and sides: plain one-colour shapes, nothing painted on them (K-CLARITY-RULES 1, 9) */
  boxes: [{ paint: 'star', accept: [], color: '#F5B400' }],
  intro: ['Mendy has a mystery game!', 'A shape tells you clues.', 'Listen, then find the shape!'],
  lessons: [{ k: 'circle', word: 'circle', short: true, color: '#1F6FEB', rule: ['Round, no corners.'] },
            { k: 'tri', word: 'triangle', short: true, color: '#E03A33' },
            { k: 'square', word: 'square', short: true, color: '#12A766', rule: ['Four sides the same.'] },
            { k: 'rect', word: 'rectangle', short: true, color: '#F0458E', rule: ['Two long sides, two short sides.'] },
            { k: 'hex', word: 'hexagon', short: true, color: '#F2A900' }],
  set: [['m1', 'circle', 0, 1], ['m2', 'tri', 0.3, 1], ['m3', 'kite', 0, 1], ['m4', 'square', PI / 4, 0.9],
        ['m5', 'hex', 0, 1], ['m6', 'semi', 0, 1], ['m7', 'rect', 0.2, 1], ['m8', 'oval', 0.4, 1]],
  clues: [
    { say: ['I am perfectly round.', 'I have no corners.'], accept: ['circle'] },
    { say: ['I have three corners.', 'I have three straight sides.'], accept: ['tri'] },
    { say: ['I have four sides.', 'All my sides are the same.'], accept: ['square'] },
    { say: ['I have six corners.', 'I have six straight sides.'], accept: ['hex'] },
    { say: ['I have two long sides.', 'And two short sides.'], accept: ['rect'] },
    { say: ['I am round, but squished.', 'I have no corners.'], accept: ['oval'] }
  ],
  watchLine: 'Watch me. Listen to the clue.', watchDone: 'The circle! It was round with no corners.', yourTurn: 'Now you. Listen to each clue!',
  ask: 'Listen to the clue.', hint: 'Listen to the clue again.', hint2: 'Here I am!', remember: 'Remember: count the corners.',
  yesDefault: o => 'Yes! I am the ' + FAMILY(o.k) + '!', allDone: 'You found every mystery shape!',
  wrong: o => ['That is a ' + FAMILY(o.k) + '.', 'Listen to the clue again.'],
  mistake: { friend: { name: 'Yaakov', shirt: '#6B8E23', hair: '#2A1A12' }, icon: 'dots4', piece: ['tri', 0, 1.15, '#E03A33'],
    claim: ['The clue was: I have four corners.', 'Yaakov picked this one.'], ask: 'Does it have four corners?', answer: false, prove: true,
    explain: ['Three corners! Not four.'], right: ['Right! It does not have four.', 'Three corners. It is a triangle.'] },
  endLine: 'You solved every mystery!', praise: 'You listened and counted. Shape detective!'
});
</script>
</body>
</html>
