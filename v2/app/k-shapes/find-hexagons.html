<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Find the hexagons</title>
<!-- Kindergarten Shapes, Unit 3 "More shapes and tricky ones" (v2/curriculum/k-shapes/MAP.md): know a hexagon (6 sides, 6 corners) in any turn or size; tell it from a pentagon and an octagon by counting. K.G.2, K.G.4.
     Built on the shared 3D kit (kit.js). ?fast=1 for the automatic test. -->
<link rel="stylesheet" href="kit.css">
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
</head>
<body>
<script type="module">
import { startGame, wrongFor } from './kit.js';
const PI = Math.PI;
startGame({
  id: 'hexagons', world: 'sky',
  boxes: [{ paint: 'hex', accept: ['hex'] }],
  intro: ['Mendy is tidying up the sky island.', 'He found a new shape!', "Let's learn about hexagons!"],
  lessons: [{ k: 'hex', word: 'hexagon', color: '#F2A900', rule: ['Six sides, six corners. Like a honeycomb!'],
    chant: [['Six sides!', 6], ['Six corners!', 6], ['Hex-a-gon!', 3]], turn: PI / 6, turnLine: 'Watch. I turn it.' }],
  set: [['h1', 'hex', 0, 1], ['pe', 'pent', 0, 1], ['h2', 'hex', PI / 6, 1], ['ci', 'circle', 0, 1],
        ['h3', 'hex', 0, 0.72], ['oc', 'oct', 0, 1], ['h4', 'hex', 0.3, 1.15], ['sq', 'square', 0.2, 1]],
  watchLine: "Here are Mendy's toys. Watch me find a hexagon.", yourTurn: 'Now you. Find all the other hexagons!',
  ask: 'Drag every hexagon into the box.', hint: 'Count the corners. Look for six.', remember: 'Remember: a hexagon has six corners.',
  yes: { h2: 'Yes! Turned, still a hexagon!', h3: 'Yes! Small, but still a hexagon!', h4: 'Yes! Big, and still a hexagon!',
    b1: 'Yes! Tipped over, still a hexagon!', b3: 'Yes! Tipped over, still a hexagon!' },
  yesDefault: () => 'Yes! A hexagon!', allDone: 'You found all the hexagons!', wrong: wrongFor('hexagon'),
  bonus: [['b1', 'hex', 0.5, 0.8, 0], ['b2', 'oct', 0.2, 0.9, 2], ['b3', 'hex', -0.4, 1, 4]], bonusAsk: 'Find the real hexagons. Count carefully!',
  mistake: { friend: { name: 'Avi', shirt: '#3C7A89', hair: '#5A3A22' }, icon: 'hex', piece: ['pent', 0, 1.15, '#F2A900'],
    claim: ['Avi says this is a hexagon.', 'He did not count the corners.'], ask: 'Is it a hexagon?', answer: false, prove: true,
    explain: ['Five corners! A hexagon has six.'], right: ['Right! It is not a hexagon.', 'Five corners. A hexagon has six.'] },
  endLine: 'You found every hexagon!', praise: 'Six sides, six corners. Hexagon expert!'
});
</script>
</body>
</html>
