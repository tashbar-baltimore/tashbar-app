<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Line them up</title>
<!-- Kindergarten Shapes, Unit 10 "Longer, shorter, taller" (v2/curriculum/k-shapes/MAP.md): compare lengths by lining things up from the same start,
     then say which is longer or shorter; compare towers standing on the floor (taller, shorter). K.MD.1, K.MD.2.
     Research: children must learn to line up from the same start before comparing (Szilagyi, Clements & Sarama, 2013). Built on the shared 3D kit. ?fast=1 for the test. -->
<link rel="stylesheet" href="kit.css">
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
</head>
<body>
<script type="module">
import { startGame } from './kit.js';
const C = { red: '#E03A33', blue: '#1F6FEB', yellow: '#F2A900', green: '#12A766', purple: '#7C4DFF', orange: '#FF7A1A' };
const it = (word, L, off) => ({ word, color: C[word], L, off });
const tw = (word, n) => ({ word, color: C[word], n });
startGame({
  id: 'lineup', world: 'snow', mode: 'measure', boxes: [],
  view: { wide: [[0, 6.4, 8.8], [0, 0.4, 0.6]], tall: [[0, 9.0, 9.4], [0, 0.3, 0.8]] }, mendyAt: { wide: [4.6, 0, -1.6] },
  intro: ['Mendy and Tatty are measuring.', 'Which is longer? Which is taller?', "Let's find out the fair way!"],
  measureLesson: { items: [it('red', 3.2, 1.6), it('blue', 4.0, 0)], first: 'Which pencil is longer?',
    rule: ['Line them up at the start.', 'Then look at the other end.'], chant: [['Line them up!', 3], ['Same start!', 2], ['Which is longer?', 3]] },
  rounds: [
    { kind: 'long', items: [it('green', 2.6, 1.2), it('yellow', 3.6, 0.3)], ask: 'longer' },
    { kind: 'long', items: [it('red', 3.0, 0.8), it('blue', 2.2, 2.0)], ask: 'longer', say: 'Two pencils. Which is longer?' },
    { kind: 'long', items: [it('purple', 3.4, 0), it('orange', 2.4, 1.5)], ask: 'shorter', say: 'Now find the shorter one.' },
    { kind: 'tall', items: [tw('green', 3), tw('blue', 5)], ask: 'taller', say: 'Two towers. Which is taller?' },
    { kind: 'tall', items: [tw('red', 4), tw('yellow', 2)], ask: 'shorter', say: 'Which tower is shorter?' },
    { kind: 'long', items: [it('orange', 2.0, 2.6), it('green', 2.8, 0.4)], ask: 'longer', say: 'Be careful! Which is longer?' }
  ],
  bonusRounds: [{ kind: 'long', items: [it('red', 2.4, 1.0), it('blue', 3.4, 0.2), it('yellow', 1.8, 2.4)], ask: 'the longest', say: 'Three pencils!' }],
  watchLine: 'Watch me line them up.', yourTurn: 'Now you. Line them up, then look!', hint2: 'Drag this one to the line.', remember: 'Remember: line them up at the start.',
  mistake: { friend: { name: 'Yisroel', shirt: '#4F6D7A', hair: '#2A1A12' }, icon: 'rectLong', measure: [it('red', 2.6, 1.8), it('blue', 3.4, 0)],
    claim: ['Yisroel says the red pencil is longer.', 'It sticks out more.'], ask: 'Is the red one longer?', answer: false,
    explain: ['They do not start together.', 'Line them up first!'], right: ['Right! They do not start together.'], after: 'Now we can see. The blue one is longer!' },
  endLine: 'You measured everything!', praise: 'Line them up, then look. Measuring expert!'
});
</script>
</body>
</html>
