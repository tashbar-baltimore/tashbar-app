<script type="module">
import { startGame } from './kit.js';
const BEADS = {
  red: { color: '#E03A33', word: 'red', note: 523 }, blue: { color: '#1F6FEB', word: 'blue', note: 659 },
  yellow: { color: '#F2A900', word: 'yellow', note: 784 }, green: { color: '#12A766', word: 'green', note: 587 },
  triB: { color: '#7C4DFF', word: 'triangle', note: 698, kind: 'tri' }, sqB: { color: '#FF7A1A', word: 'square', note: 523, kind: 'square' },

  drum: { color: '#C0392B', word: 'drum', note: 196, kind: 'drum' }, bell: { color: '#F5C542', word: 'bell', note: 1046 }
};
startGame({
  id: 'next', world: 'bakery', mode: 'pattern', boxes: [], beads: BEADS,
  view: { wide: [[0, 5.2, 8.6], [0, 1.2, 0.9]], tall: [[0, 7.6, 9.6], [0, 1.0, 0.6]] }, mendyAt: { wide: [-4.6, 0, 0.6] },
  patternLesson: { seq: ['red', 'blue', 'red', 'blue', 'red', 'blue'], first: 'Look at these beads.', say: 'Red, blue, red, blue, red, blue.',
    coreLine: 'Red, blue. That part repeats!', chant: [['Red, blue!', 2], ['Red, blue!', 2], ['A pattern!', 3]] },
  intro: ['Mendy is making bead strings.', 'They have patterns!', "Let's learn about patterns!"],
  rounds: [
    { seq: ['red', 'blue', 'red', 'blue', 'red', 'blue'], blanks: 1, tray: ['red', 'blue', 'yellow'], watchDone: 'Blue comes next!' },
    { seq: ['yellow', 'green', 'yellow', 'green', 'yellow', 'green'], blanks: 2, tray: ['green', 'yellow', 'red'], say: 'Look at the beads.' },
