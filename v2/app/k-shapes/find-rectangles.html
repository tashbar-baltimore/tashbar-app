<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Find the rectangles</title>
<!-- Kindergarten Shapes, Unit 1 "Meet the flat shapes" (v2/curriculum/k-shapes/MAP.md): know a rectangle (2 long sides, 2 short sides, 4 corners) standing up, lying down, long or small. K.G.2, K.G.4.
     Built on the shared 3D kit (kit.js): learn -> he taps / claps -> watch me -> he sorts -> find the mistake -> stars. ?fast=1 for the automatic test. -->
<link rel="stylesheet" href="kit.css">
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
</head>
<body>
<script type="module">
import { startGame, wrongFor, FAMILY } from './kit.js';

const PI = Math.PI;
startGame({
  id: 'rectangles',
  boxes: [{ paint: 'rect', accept: ['rect', 'rectLong', 'rectFat'] }],
  intro: ['Mendy is cleaning up his toys.', 'He needs all the rectangles.', "Let's learn about rectangles!"],
  lessons: [{ k: 'rect', word: 'rectangle', color: '#F0458E', rule: ['Two long sides. Two short sides.'],
    chant: [['Two long!', 2], ['Two short!', 2], ['Four corners!', 4], ['Rec-tan-gle!', 3]], turn: PI / 2, turnLine: 'Watch. I stand it up.' }],
  set: [['r1', 'rect', 0, 1], ['ci', 'circle', 0, 1], ['r2', 'rectLong', PI / 2, 1], ['tr', 'tri', 0, 1],
        ['r3', 'rect', 0.25, 0.72], ['le', 'lean', 0, 1], ['r4', 'rectLong', 0, 1], ['ov', 'oval', 0, 1]],
  watchLine: "Here are Mendy's toys. Watch me find a rectangle.", yourTurn: 'Now you. Find all the other rectangles!',
  ask: 'Drag every rectangle into the box.', hint: 'Look for two long sides and two short sides.', remember: 'Remember: two long sides, two short sides.',
  yes: { r2: 'Yes! Standing up, still a rectangle!', r3: 'Yes! Small, but still a rectangle!', r4: 'Yes! Long and thin, still a rectangle!',
    b1: 'Yes! Tipped over, still a rectangle!', b3: 'Yes! Tipped over, still a rectangle!' },
  yesDefault: () => 'Yes! A rectangle!', allDone: 'You found all the rectangles!', wrong: wrongFor('rectangle'),
  bonus: [['b1', 'rectFat', 0.5, 1, 0], ['b2', 'lean', 0.3, 1, 2], ['b3', 'rect', -1.2, 0.8, 4]], bonusAsk: 'Find the real rectangles. Drag them in.',
  mistake: { friend: { name: 'Shloimy', shirt: '#3B6E4F', hair: '#B8642A' }, icon: 'rect', piece: ['rectLong', PI / 2, 1.1, '#F0458E'],
    claim: ['Shloimy says this is not a rectangle.', 'He says it is standing up.'], ask: 'Is it a rectangle?', answer: true, prove: true,
    explain: ['Two long sides, two short sides. A rectangle!'], right: ['Yes! It is a rectangle.', 'Standing up, it is still a rectangle.'] },
  endLine: 'You found every rectangle!', praise: 'Two long, two short, four corners. Rectangle expert!'
});
</script>
</body>
</html>
