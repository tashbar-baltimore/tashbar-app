<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The shape sorter</title>
<!-- Kindergarten Shapes, Unit 1 "Meet the flat shapes" (v2/curriculum/k-shapes/MAP.md): all four flat shapes mixed: drag each one into its own box (circle, triangle, square, rectangle). The unit check. K.G.2, K.G.4.
     Built on the shared 3D kit (kit.js): learn -> he taps / claps -> watch me -> he sorts -> find the mistake -> stars. ?fast=1 for the automatic test. -->
<link rel="stylesheet" href="kit.css">
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
</head>
<body>
<script type="module">
import { startGame, wrongFor, FAMILY } from './kit.js';

const PI = Math.PI;
const fam = k => FAMILY(k);
startGame({
  id: 'sorter',
  boxes: [{ paint: 'circle', accept: ['circle'] }, { paint: 'tri', accept: ['tri', 'triTall', 'triRight', 'triWide', 'triSkinny'] },
          { paint: 'square', accept: ['square'] }, { paint: 'rect', accept: ['rect', 'rectLong', 'rectFat'] }],
  intro: ['Mendy has four toy boxes.', 'A circle box, a triangle box, a square box, a rectangle box.', "Let's remember our shapes!"],
  lessons: [{ k: 'circle', word: 'circle', short: true, color: '#1F6FEB', rule: ['Round, like a plate.'] },
            { k: 'tri', word: 'triangle', short: true, color: '#E03A33' },
            { k: 'square', word: 'square', short: true, color: '#12A766', rule: ['Four sides the same.'] },
            { k: 'rect', word: 'rectangle', short: true, color: '#F0458E', rule: ['Two long sides, two short sides.'] }],
  set: [['a1', 'circle', 0, 1], ['a2', 'tri', PI, 1], ['a3', 'square', PI / 4, 1], ['a4', 'rectLong', PI / 2, 1],
        ['a5', 'triTall', 0.3, 0.8], ['a6', 'rect', 0.2, 1], ['a7', 'circle', 0, 0.6], ['a8', 'square', 0.2, 0.7]],
  watchLine: 'Watch me put a shape in its box.', watchDone: 'A circle goes in the circle box!', yourTurn: 'Now you. Put each shape in its box!',
  ask: 'Drag each shape into its box.', hint: 'Look at the shape on each box.', hint2: 'This one goes in its box.', remember: 'Remember: count the corners.',
  yesDefault: o => 'Yes! A ' + fam(o.k) + '!', allDone: 'Every shape is in its box!',
  wrong: o => { const f = fam(o.k);
    if (f === 'square') { const a = ['That is a square.', 'Four sides the same. It goes in the square box.']; a.count = false; return a; }
    if (f === 'rectangle') { const a = ['That is a rectangle.', 'Two long, two short. It goes in the rectangle box.']; a.count = false; return a; }
    if (f === 'circle') return ['That is a circle. It has no corners.', 'It goes in the circle box.'];
    return ['That is a ' + f + '.', 'It goes in the ' + f + ' box.']; },
  bonus: [['b1', 'triRight', 0.8, 1, 0], ['b2', 'rectFat', 0, 0.9, 2], ['b3', 'circle', 0, 1.15, 4]], bonusAsk: 'Sort the tricky ones too.',
  mistake: { friend: { name: 'Tzvi', shirt: '#C46A1E', hair: '#3A2A1E' }, icon: 'tri', piece: ['square', PI / 4, 1.1, '#1F6FEB'], box: 2,
    claim: ['Tzvi put this in the triangle box.', 'He says it is a triangle.'], ask: 'Is it a triangle?', answer: false, prove: true,
    explain: ['Four corners! It is a square, not a triangle.'], right: ['Right! It is not a triangle.', 'Four sides the same. It is a square!'] },
  endLine: 'Every shape is in its box!', praise: 'Circle, triangle, square, rectangle. You know them all!'
});
</script>
</body>
</html>
