<title>Find the triangles</title>
<!-- Kindergarten Shapes: "Find the triangles" (a 3D SAMPLE for Esti). Standards K.G.2 (name shapes in any turn or size) and K.G.4 (sides and corners).
     One skill: know a triangle by its rule (3 straight sides, 3 corners), even when it is turned, tall, or small; tell it from shapes that are not triangles.
     Show, then try: a big 3D triangle; count its sides and corners together; turn it and shrink it ("still a triangle!") ->
     "Watch me" (a hand drags one triangle into Mendy's toy box) -> he drags every triangle into the box; a wrong shape is explained
     (its corners light up and are counted) and goes back -> find the mistake (Dovid says an upside-down triangle is not a triangle) -> stars.
     No reading needed: every instruction is spoken; the "hear it again" button repeats it. All shapes and the room are drawn here in 3D (three.js, MIT licence, lib/).
     Add ?fast=1 for the automatic test (no waiting for the voice or the motion). -->
<style>
:root{ --bg:#F6F1E7; --ink:#1F2A44; --card:#FFFFFF; --line:#E4DCCB; --green:#1E9E5A; --gold:#F5B400; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:none; }
#view{ position:fixed; inset:0; display:block; width:100%; height:100%; touch-action:none; }
.hud{ position:fixed; left:0; right:0; top:0; display:grid; grid-template-columns:96px 1fr 96px; justify-items:center; align-items:center; padding:10px 16px; pointer-events:none; }
.hud > *{ pointer-events:auto; }
.btn{ border:0; cursor:pointer; display:grid; place-items:center; border-radius:999px; min-width:72px; min-height:72px; background:var(--card); box-shadow:0 4px 0 var(--line), 0 6px 18px rgba(31,42,68,.12); }
.btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--line); }
#again{ width:84px; height:84px; visibility:hidden; transition:opacity .25s; }
#again svg{ width:40px; height:40px; }
#again.wait{ opacity:.45; }
.dots{ display:flex; gap:7px; background:rgba(255,255,255,.75); padding:8px 12px; border-radius:999px; }
.dots i{ width:12px; height:12px; border-radius:50%; background:var(--line); display:block; transition:background .3s; }
.dots i.on{ background:var(--green); }
#start{ position:fixed; left:50%; top:50%; width:170px; height:170px; margin:-85px 0 0 -85px; background:var(--green); box-shadow:0 8px 0 #157A45, 0 14px 34px rgba(30,158,90,.4); animation:pulse 1.4s ease-in-out infinite; }
#start svg{ width:84px; height:84px; }
@keyframes pulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.07);} }
#hand{ position:fixed; width:84px; height:84px; margin:-6px 0 0 -26px; pointer-events:none; display:none; filter:drop-shadow(0 6px 6px rgba(0,0,0,.25)); z-index:5; }
.judge{ position:fixed; left:0; right:0; bottom:22px; display:none; justify-content:center; gap:32px; z-index:4; }
.judge.show{ display:flex; }
.judge button{ width:116px; height:116px; }
.judge svg{ width:64px; height:64px; }
.shake{ animation:shake .45s; }
@keyframes shake{ 0%,100%{ transform:none;} 20%,60%{ transform:translateX(-10px);} 40%,80%{ transform:translateX(10px);} }
.end{ position:fixed; left:0; right:0; bottom:24px; display:none; flex-direction:column; align-items:center; gap:16px; z-index:4; }
.end.show{ display:flex; }
.stars{ display:flex; gap:14px; }
.stars svg{ width:min(18vmin,104px); height:min(18vmin,104px); }
.star{ transform:scale(0); }
.star.pop{ animation:pops .45s cubic-bezier(.3,1.6,.5,1) forwards; }
@keyframes pops{ to{ transform:scale(1);} }
#replay{ width:92px; height:92px; }
#replay svg{ width:44px; height:44px; }
#nogl{ position:fixed; inset:0; display:none; place-items:center; text-align:center; padding:24px; font-size:22px; }
.fast *{ animation-duration:.01s !important; transition-duration:.01s !important; animation-iteration-count:1 !important; }
</style>

<canvas id="view"></canvas>
<div class="hud">
  <button class="btn" id="again" aria-label="Hear it again"><svg viewBox="0 0 48 48"><path d="M8 18h8l11-9v30l-11-9H8z" fill="#1F2A44"/><path d="M33 16c3 2 5 5 5 8s-2 6-5 8M37 10c5 3 8 8 8 14s-3 11-8 14" stroke="#1F2A44" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg></button>

<svg id="hand" viewBox="-50 -60 100 110"><path d="M-10 0 L-10 -46 C-10 -56 6 -56 6 -46 L6 -22 L6 -26 C6 -34 20 -34 20 -26 L20 -20 C20 -28 34 -28 34 -20 L34 -14 C34 -22 46 -22 46 -14 L46 14 C46 36 30 46 12 46 L0 46 C-12 46 -18 38 -24 30 L-40 6 C-46 -2 -36 -10 -28 -4 L-10 10Z" fill="#FFFFFF" stroke="#1F2A44" stroke-width="4" stroke-linejoin="round"/></svg>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from './lib/RoomEnvironment.js';
import { RoundedBoxGeometry } from './lib/RoundedBoxGeometry.js';

const FAST = /[?&]fast=1/.test(location.search);
if (FAST) document.documentElement.classList.add('fast');
const $ = s => document.querySelector(s);
const W = window.__shp = { name: 'start', misses: 0, stars: 0, said: [], done: false, again: 0, found: 0, ready: false };
const wait = ms => new Promise(r => setTimeout(r, FAST ? 0 : ms));

/* ---------------- the 3D world ---------------- */
const canvas = $('#view');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: FAST }); }
catch (e) { $('#nogl').style.display = 'grid'; $('#start').style.display = 'none'; throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#F6EBDA');
scene.fog = new THREE.Fog('#F6EBDA', 22, 48);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);

scene.add(new THREE.HemisphereLight('#FFF6E8', '#C9B48E', 0.7));
const sun = new THREE.DirectionalLight('#FFF1DC', 2.2);
sun.position.set(-5, 11, 7); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 6; sun.shadow.bias = -0.0004;
Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 30 });
scene.add(sun);

/* floor, a round play rug, and Mendy's wooden toy box */
const floor = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshStandardMaterial({ color: '#E9D7B6', roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const rug = new THREE.Mesh(new THREE.CylinderGeometry(6.4, 6.4, 0.06, 96), new THREE.MeshStandardMaterial({ color: '#BFE0D2', roughness: 0.9 }));
rug.position.y = 0.03; rug.receiveShadow = true; scene.add(rug);
const rugRing = new THREE.Mesh(new THREE.TorusGeometry(5.9, 0.08, 12, 128), new THREE.MeshStandardMaterial({ color: '#FFFFFF', roughness: 0.8 }));
rugRing.rotation.x = Math.PI / 2; rugRing.position.y = 0.07; scene.add(rugRing);

const box = new THREE.Group(); scene.add(box);
const wood = new THREE.MeshStandardMaterial({ color: '#D49A5E', roughness: 0.55 });
const woodDark = new THREE.MeshStandardMaterial({ color: '#8A5A33', roughness: 0.7 });
const BX = { w: 3.0, d: 1.9, h: 0.95, t: 0.16 };
function plank(w, h, d, x, y, z, m) { const p = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, 0.05), m || wood); p.position.set(x, y, z); p.castShadow = true; p.receiveShadow = true; box.add(p); return p; }
plank(BX.w, 0.14, BX.d, 0, 0.07, 0, woodDark);
plank(BX.w, BX.h, BX.t, 0, BX.h / 2, -BX.d / 2 + BX.t / 2);
plank(BX.w, BX.h * 0.8, BX.t, 0, BX.h * 0.4, BX.d / 2 - BX.t / 2);
plank(BX.t, BX.h, BX.d, -BX.w / 2 + BX.t / 2, BX.h / 2, 0);
plank(BX.t, BX.h, BX.d, BX.w / 2 - BX.t / 2, BX.h / 2, 0);
/* a triangle painted on the front of the box: it is the triangle box */
{ const s = new THREE.Shape(); s.moveTo(-0.32, -0.24); s.lineTo(0.32, -0.24); s.lineTo(0, 0.3); s.closePath();
  const m = new THREE.Mesh(new THREE.ShapeGeometry(s), new THREE.MeshStandardMaterial({ color: '#FFFFFF', roughness: 0.6 }));
  m.position.set(0, BX.h * 0.4, BX.d / 2 + 0.005); box.add(m); }

/* ---------------- shapes: chunky glossy toy pieces ---------------- */
const KINDS = {
  tri:     { pts: [[-0.78, -0.62], [0.78, -0.62], [0, 0.72]], name: 'triangle', tri: true },
  triTall: { pts: [[-0.42, -0.82], [0.42, -0.82], [0.05, 0.86]], name: 'triangle', tri: true },
  triRight:{ pts: [[-0.62, -0.62], [0.66, -0.62], [-0.62, 0.66]], name: 'triangle', tri: true },
  square:  { pts: [[-0.6, -0.6], [0.6, -0.6], [0.6, 0.6], [-0.6, 0.6]], name: 'square' },
  rect:    { pts: [[-0.92, -0.46], [0.92, -0.46], [0.92, 0.46], [-0.92, 0.46]], name: 'rectangle' },
  circle:  { circle: 0.66, name: 'circle' },
  curvy:   { curvy: true, name: 'curvy' }
};
const COLORS = ['#E03A33', '#1F6FEB', '#F2A900', '#12A766', '#7C4DFF', '#FF7A1A', '#00A3B8', '#F0458E'];
function shapeOf(k) {
  const K = KINDS[k], s = new THREE.Shape();
  if (K.circle) { s.absarc(0, 0, K.circle, 0, Math.PI * 2, false); return { s, corners: [] }; }
  if (K.curvy) {   /* looks like a triangle, but its sides bulge out: NOT a triangle */
    const a = [-0.78, -0.62], b = [0.78, -0.62], c = [0, 0.74];
    s.moveTo(a[0], a[1]); s.quadraticCurveTo(0, -1.0, b[0], b[1]); s.quadraticCurveTo(0.78, 0.25, c[0], c[1]); s.quadraticCurveTo(-0.78, 0.25, a[0], a[1]);
    return { s, corners: [] };
  }
  K.pts.forEach((p, i) => i ? s.lineTo(p[0], p[1]) : s.moveTo(p[0], p[1])); s.closePath();
  return { s, corners: K.pts };
}
const DEPTH = 0.34, BEV = 0.09;
const shapes = [];
const cornerGeo = new THREE.SphereGeometry(0.11, 24, 16);
const cornerMat = new THREE.MeshStandardMaterial({ color: '#FFD23F', emissive: '#FFB000', emissiveIntensity: 1.4, roughness: 0.3 });
function makeShape(id, k, color, rotZ, scale) {
  const { s, corners } = shapeOf(k);
  const geo = new THREE.ExtrudeGeometry(s, { depth: DEPTH, bevelEnabled: true, bevelThickness: BEV, bevelSize: BEV, bevelSegments: 5, curveSegments: 48 });
  geo.translate(0, 0, -DEPTH / 2);
  const mat = new THREE.MeshPhysicalMaterial({ color, roughness: 0.32, clearcoat: 1, clearcoatRoughness: 0.15, envMapIntensity: 0.45, emissive: '#FFC400', emissiveIntensity: 0 });
  const mesh = new THREE.Mesh(geo, mat); mesh.castShadow = true; mesh.receiveShadow = true;
  const turn = new THREE.Group(); turn.rotation.z = rotZ; turn.add(mesh);
  const g = new THREE.Group(); g.add(turn); g.scale.setScalar(scale); scene.add(g);
  const marks = corners.map(p => { const m = new THREE.Mesh(cornerGeo, cornerMat); m.position.set(p[0], p[1], DEPTH / 2 + BEV + 0.02); m.scale.setScalar(0); mesh.add(m); return m; });
  const o = { id, k, isTri: !!KINDS[k].tri, g, turn, mesh, mat, marks, corners, scale, home: new THREE.Vector3(), phase: Math.random() * 6, inBox: false, busy: false, glow: false };
  mesh.userData.shape = o; shapes.push(o); return o;
}

/* ---------------- layout: wide screen = 2 rows of 4, tall phone = 3 rows of 3 ---------------- */
let tall = false;
const SLOTS_WIDE = [[-3.9, -2.6], [-1.3, -2.9], [1.3, -2.9], [3.9, -2.6], [-4.7, -0.2], [-2.3, 0.1], [2.3, 0.1], [4.7, -0.2]];
const SLOTS_TALL = [[-1.8, -4.2], [0, -4.4], [1.8, -4.2], [-1.8, -2.1], [0, -2.3], [1.8, -2.1], [-1.8, 0], [0, -0.2], [1.8, 0]];
const BOX_WIDE = new THREE.Vector3(0, 0, 2.3), BOX_TALL = new THREE.Vector3(0, 0, 2.6);
const VIEW = { wide: { pos: new THREE.Vector3(0, 8.6, 11.6), look: new THREE.Vector3(0, 0.2, -0.4) }, tall: { pos: new THREE.Vector3(0, 15, 7.2), look: new THREE.Vector3(0, 0, -1.1) },
  close: { pos: new THREE.Vector3(0, 2.7, 6.4), look: new THREE.Vector3(0, 2.05, 0.9) } };
let camMode = 'wide';
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
function viewFor(m) { if (m === 'close') { const v = VIEW.close; return tall ? { pos: v.pos.clone().multiplyScalar(1.55), look: v.look } : v; } return tall ? VIEW.tall : VIEW.wide; }
function boxAt() { return tall ? BOX_TALL : BOX_WIDE; }
function homeFor(i) { const s = (tall ? SLOTS_TALL : SLOTS_WIDE)[i]; return new THREE.Vector3(s[0], 0.92, s[1]); }
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h;
  const was = tall; tall = w / h < 0.95; camera.fov = tall ? 46 : 40; camera.updateProjectionMatrix();
  box.position.copy(boxAt());
  if (was !== tall) shapes.forEach(o => { if (o.slot != null) { o.home.copy(homeFor(o.slot)); if (!o.busy && !o.inBox) o.g.position.copy(o.home); } });
  const v = viewFor(camMode); camPos.copy(v.pos); camLook.copy(v.look);
}
addEventListener('resize', resize);

/* ---------------- motion ---------------- */
const tweens = [];
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function tween(ms, fn) { return new Promise(res => { if (FAST) { fn(1); return res(); } tweens.push({ t0: performance.now(), ms, fn, res }); }); }
function moveTo(o, to, ms, hop) {
  const a = o.g.position.clone(); o.busy = true;
  return tween(ms, k => { const e = ease(k); o.g.position.lerpVectors(a, to, e); if (hop) o.g.position.y += Math.sin(Math.PI * e) * hop; }).then(() => { o.busy = false; });
}
function camTo(mode, ms) {
  camMode = mode; const v = viewFor(mode), p0 = camPos.clone(), l0 = camLook.clone();
  return tween(ms, k => { const e = ease(k); camPos.lerpVectors(p0, v.pos, e); camLook.lerpVectors(l0, v.look, e); });
}
/* sparkles: little gold stars burst up and fade */
const sparks = [];
const sparkGeo = new THREE.OctahedronGeometry(0.09);
function burst(at, n) {
  if (FAST) return;
  for (let i = 0; i < (n || 22); i++) {
    const m = new THREE.Mesh(sparkGeo, new THREE.MeshStandardMaterial({ color: COLORS[i % COLORS.length], emissive: COLORS[i % COLORS.length], emissiveIntensity: .5, transparent: true }));
    m.position.copy(at); scene.add(m);
    sparks.push({ m, v: new THREE.Vector3((Math.random() - .5) * 5, 3 + Math.random() * 4, (Math.random() - .5) * 5), life: 1 });
  }
}

const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime, now = performance.now();
  for (let i = tweens.length - 1; i >= 0; i--) { const tw = tweens[i], k = Math.min(1, (now - tw.t0) / tw.ms); tw.fn(k); if (k >= 1) { tweens.splice(i, 1); tw.res(); } }
  shapes.forEach(o => {
    if (o.inBox || o.busy || o === dragging) return;
    if (!o.g.visible) return;
    o.g.position.y = o.home.y + Math.sin(t * 1.6 + o.phase) * 0.06;
    o.g.rotation.y = Math.sin(t * 0.7 + o.phase) * 0.28; o.g.rotation.x = -(tall ? 0.85 : 0.42);
    o.g.position.x = o.home.x; o.g.position.z = o.home.z;
  });
  shapes.forEach(o => { o.mat.emissiveIntensity = o.glow ? 0.4 + Math.sin(t * 5) * 0.25 : 0; });
  for (let i = sparks.length - 1; i >= 0; i--) { const s = sparks[i]; s.v.y -= 9 * dt; s.m.position.addScaledVector(s.v, dt); s.m.rotation.x += dt * 6; s.life -= dt * 0.9; s.m.material.opacity = Math.max(0, s.life); if (s.life <= 0) { scene.remove(s.m); sparks.splice(i, 1); } }
  const sway = FAST ? 0 : Math.sin(t * 0.25) * 0.25;
  camera.position.set(camPos.x + sway, camPos.y, camPos.z); camera.lookAt(camLook);
  if (handOn) placeHand();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* screen <-> world */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function toScreen(v) { const p = v.clone().project(camera); return { x: (p.x + 1) / 2 * innerWidth, y: (1 - p.y) / 2 * innerHeight }; }
function pick(cx, cy) {
  ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(shapes.filter(o => o.g.visible && !o.inBox).map(o => o.mesh), false);
  return hits.length ? hits[0].object.userData.shape : null;
}
const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -1.25), hitP = new THREE.Vector3();
function onPlane(cx, cy) { ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera); return ray.ray.intersectPlane(dragPlane, hitP) ? hitP.clone() : null; }
function overBox(p) { const b = boxAt(); return Math.abs(p.x - b.x) < BX.w / 2 + 0.35 && Math.abs(p.z - b.z) < BX.d / 2 + 0.45; }
/* for the automatic test */
W.shapePt = id => { const o = shapes.find(s => s.id === id); return toScreen(o.g.position); };
W.boxPt = () => toScreen(boxAt().clone().setY(1.25));
W.list = () => shapes.filter(o => o.g.visible && !o.inBox && o.slot != null).map(o => ({ id: o.id, k: o.k, tri: o.isTri }));

/* ---------------- sound ---------------- */
let AC = null;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(freqs, type, gap, len, vol) {
  const c = ac(); if (!c || FAST) return; const t = c.currentTime;
  freqs.forEach((f, i) => { const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0, t + i * gap); g.gain.linearRampToValueAtTime(vol, t + i * gap + .02); g.gain.exponentialRampToValueAtTime(.001, t + i * gap + len);
    o.connect(g); g.connect(c.destination); o.start(t + i * gap); o.stop(t + i * gap + len + .05); });
}
const chime = ok => ok ? tone([660, 880, 1320], 'sine', .1, .35, .14) : tone([330, 262], 'sine', .14, .3, .14);
const plink = () => tone([1046], 'triangle', 0, .18, .12);
const pop = () => tone([520, 780], 'triangle', .05, .12, .1);
function clap() {   /* a short hand-clap sound for the chant */
  const c = ac(); if (!c || FAST) return; const len = c.sampleRate * .12, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4);
  const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); src.buffer = b; f.type = 'bandpass'; f.frequency.value = 1400; f.Q.value = .8; g.gain.value = .5;
  src.connect(f); f.connect(g); g.connect(c.destination); src.start();
}
/* the chant: three claps while the three corners bounce */
function claps(o) { W.claps = (W.claps || 0) + 3; return [0, 1, 2].reduce((p, i) => p.then(() => { clap(); const m = o.marks[i]; m.scale.setScalar(1.6); return tween(320, k => m.scale.setScalar(1.6 - k * 0.45)); }), Promise.resolve()); }

/* ---------------- the voice: the school's teacher voice, else the device voice ---------------- */
const TTS = 'https:' + '/' + '/' + 'tts-q26c275eaa-uk.a.run.app', vcache = {}; let vtok = 0, audio = null;
function hush() { vtok++; try { if (audio) audio.pause(); } catch (e) {} audio = null; try { speechSynthesis.cancel(); } catch (e) {} }
function say(t) {
  W.said.push(t); if (FAST) return Promise.resolve();
  const my = vtok;
  return new Promise(done => {
    let fin = false; const end = () => { if (!fin) { fin = true; done(); } };
    setTimeout(end, t.length * 85 + 2500);
    const dev = () => { if (my !== vtok) return end(); try { const u = new SpeechSynthesisUtterance(t); u.rate = 0.9; u.pitch = 1.1; u.onend = end; u.onerror = end; speechSynthesis.speak(u); } catch (e) { end(); } };
    const playUrl = url => { if (my !== vtok) return end(); const a = new Audio(url); audio = a; a.onended = end; a.onerror = dev; const p = a.play(); if (p && p.catch) p.catch(dev); };
    if (vcache[t]) return playUrl(vcache[t]);
    Promise.race([
      fetch(TTS, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: t, voice: 'teacher' }) })
        .then(r => r.json()).then(j => { if (j && j.ok && j.url) { vcache[t] = j.url; return j.url; } throw new Error('tts'); }),
      new Promise((_, rej) => setTimeout(() => rej(new Error('slow')), 1800))
    ]).then(playUrl).catch(dev);
  });
}
function preload(lines) { if (FAST) return; lines.forEach(t => { if (!vcache[t]) fetch(TTS, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: t, voice: 'teacher' }) }).then(r => r.json()).then(j => { if (j && j.ok && j.url) vcache[t] = j.url; }).catch(() => {}); }); }
/* a script is a list of: "spoken line" | {wait:ms} | function */
let cur = [], runTok = 0, echoTok = 0, busy = false;
const againBtn = $('#again');
function play(script) {
  const my = ++runTok; echoTok++; cur = script; busy = true; againBtn.classList.add('wait'); hush();
  return script.reduce((p, s) => p.then(() => {
    if (my !== runTok) return;
    if (typeof s === 'string') return say(s);
    if (typeof s === 'function') return s();
    if (s.wait) return wait(s.wait);
  }), Promise.resolve()).then(() => { if (my === runTok) { busy = false; againBtn.classList.remove('wait'); } return my === runTok; });
}
againBtn.onclick = () => {
  W.again++; if (busy) return; const my = ++echoTok; hush();
  cur.filter(s => typeof s === 'string').reduce((p, s) => p.then(() => my === echoTok ? say(s) : null), Promise.resolve());
};

/* ---------------- progress dots ---------------- */
const STEPS = 5;   /* learn, watch, find, the mistake, done */
function dots(n) { $('#dots').innerHTML = Array.from({ length: STEPS }, (_, i) => '<i' + (i < n ? ' class="on"' : '') + '></i>').join(''); }

/* ---------------- the hand for "watch me" ---------------- */
const hand = $('#hand'); let handOn = null;
function placeHand() { const p = toScreen(handOn.g.position); hand.style.left = p.x + 'px'; hand.style.top = p.y + 'px'; }

/* ---------------- corner and side counting ---------------- */
function lightCorner(o, i) { plink(); const m = o.marks[i]; return tween(260, k => m.scale.setScalar(k * 1.15)); }
function clearCorners(o) { o.marks.forEach(m => m.scale.setScalar(0)); }
const tracer = new THREE.Mesh(new THREE.SphereGeometry(0.13, 24, 16), new THREE.MeshStandardMaterial({ color: '#FFFFFF', emissive: '#FFFFFF', emissiveIntensity: 1 }));
tracer.visible = false;
function traceSide(o, i) {   /* a glowing dot runs along one side */
  const a = o.corners[i], b = o.corners[(i + 1) % o.corners.length]; o.mesh.add(tracer); tracer.visible = true; plink();
  return tween(700, k => tracer.position.set(a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, DEPTH / 2 + BEV + 0.05));
}

/* ---------------- the pieces on the rug ---------------- */
/* slot 0 is the triangle he meets first; the rest are mixed: turned, tall, small triangles and shapes that are NOT triangles */
const SET = [
  ['t1', 'tri', 0, 1],              // the first triangle (shown, then the hand puts it away)
  ['sq', 'square', Math.PI / 4, 1], // a turned square: still a square, not a triangle
  ['t2', 'tri', Math.PI, 1],        // upside down
  ['cv', 'curvy', 0, 1],            // looks close, but curvy sides
  ['t3', 'triTall', 0.35, 1],       // tall and thin, tipped
  ['ci', 'circle', 0, 1],
  ['t4', 'triRight', -0.4, 0.62],   // small
  ['re', 'rect', 0.18, 0.95]
];
const LOOK = { square: ['That is a square.', 'Count the corners: one, two, three, four.', 'A triangle has three.'],
  rect: ['That is a rectangle.', 'Count the corners: one, two, three, four.', 'A triangle has three.'],
  circle: ['That is a circle.', 'A circle has no corners at all.'],
  curvy: ['Look closely. These sides are curvy.', 'A triangle has straight sides.'] };
const YES = { t2: 'Yes! Upside down is still a triangle!', t3: 'Yes! Tall and thin, still a triangle!', t4: 'Yes! Small, but still a triangle!' };

let allow = false, dragging = null, down = null;
function buildSet() {
  shapes.splice(0).forEach(o => scene.remove(o.g));
  SET.forEach((s, i) => { const o = makeShape(s[0], s[1], COLORS[i], s[2], s[3]); o.slot = i; o.home.copy(homeFor(i)); o.g.position.copy(o.home); o.g.visible = false; });
}
function inBoxSpot(n) { const b = boxAt(); return new THREE.Vector3(b.x - 0.75 + (n % 3) * 0.75, 0.32 + Math.floor(n / 3) * 0.16, b.z + (n % 2 ? 0.2 : -0.2)); }
function dropInBox(o) {
  o.inBox = true; const to = inBoxSpot(W.found++);
  const s0 = o.g.scale.x, s1 = Math.min(s0, 1) * 0.55;
  tween(520, k => o.g.scale.setScalar(s0 + (s1 - s0) * ease(k)));
  return moveTo(o, to, 520, 1.2).then(() => { o.g.rotation.set(-1.45, (W.found % 3 - 1) * 0.6, 0); burst(to.clone().setY(1.2)); pop(); });
}

/* dragging pieces */
canvas.addEventListener('pointerdown', e => {
  ac(); if (!allow) return;
  const o = pick(e.clientX, e.clientY); if (!o || o.busy) return;
  down = { o, x: e.clientX, y: e.clientY, moved: false }; try { canvas.setPointerCapture(e.pointerId); } catch (x) {}
});
canvas.addEventListener('pointermove', e => {
  if (!down) return;
  if (!down.moved && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) { down.moved = true; dragging = down.o; pop(); }
  if (dragging) { const p = onPlane(e.clientX, e.clientY); if (p) { dragging.g.position.set(p.x, 1.25, p.z); dragging.g.rotation.y = 0; } }
});
function release() {
  if (!down) return; const d = down; down = null;
  if (!d.moved) {   /* a tap: the piece does a happy spin */
    if (!d.o.busy) { pop(); const r0 = d.o.turn.rotation.y; d.o.busy = true; tween(600, k => { d.o.turn.rotation.y = r0 + ease(k) * Math.PI * 2; }).then(() => { d.o.turn.rotation.y = r0; d.o.busy = false; }); }
    return;
  }
  const o = dragging; dragging = null;
  if (onDrop) onDrop(o, overBox(o.g.position));
}
canvas.addEventListener('pointerup', release); canvas.addEventListener('pointercancel', release);
let onDrop = null;
function goHome(o) { return moveTo(o, o.home, 420, 0.4); }

/* ---------------- the game ---------------- */
function setName(n) { W.name = n; }
async function learn() {
  setName('learn'); dots(0); W.misses = 0; W.found = 0; allow = false; onDrop = null;
  $('#end').classList.remove('show');
  buildSet(); resize();
  const t1 = shapes[0]; t1.g.visible = true; t1.busy = true;
  const stagePos = new THREE.Vector3(0, 2.05, 0.9); t1.g.position.copy(stagePos); t1.g.rotation.set(0, 0, 0); t1.g.scale.setScalar(0.01);
  camTo('close', 10);
  tween(700, k => t1.g.scale.setScalar(Math.max(0.01, ease(k) * 1.25)));
  const ok = await play([
    'Mendy is cleaning up his toys.', 'He needs all the triangles.', "Let's learn about triangles!", { wait: 200 },
    'This is a triangle.', 'Count the sides with me.',
    () => traceSide(t1, 0), 'One.', () => traceSide(t1, 1), 'Two.', () => traceSide(t1, 2), 'Three sides!', () => { tracer.visible = false; },
    'Now count the corners.', () => lightCorner(t1, 0), 'One.', () => lightCorner(t1, 1), 'Two.', () => lightCorner(t1, 2), 'Three corners!',
    'Three straight sides, three corners. A triangle!',
    'Clap it with me!', 'Three sides!', () => claps(t1), 'Three corners!', () => claps(t1), 'Triangle!', () => { burst(t1.g.position, 30); chime(true); clearCorners(t1); return wait(400); },
    'Watch. I turn it upside down.', () => tween(1100, k => { t1.turn.rotation.z = ease(k) * Math.PI; }), 'Still a triangle!',
    'Now I make it small.', () => tween(800, k => t1.g.scale.setScalar(1.25 - ease(k) * 0.7)), 'Small, but still a triangle!',
    () => tween(600, k => { t1.turn.rotation.z = Math.PI * (1 - ease(k)); t1.g.scale.setScalar(0.55 + ease(k) * 0.45); })
  ]);
  if (ok) watch();
}
async function watch() {
  setName('watch'); dots(1);
  const t1 = shapes[0];
  await Promise.all([camTo('wide', 1300), moveTo(t1, t1.home, 1100, 0.6)]);
  t1.busy = false;
  shapes.slice(1).forEach((o, i) => { o.g.visible = true; o.g.scale.setScalar(0.01); setTimeout(() => { pop(); tween(420, k => o.g.scale.setScalar(Math.max(0.01, o.scale * ease(k)))); }, FAST ? 0 : i * 140); });
  await wait(1200);
  const ok = await play([
    "Here are Mendy's toys. Watch me find a triangle.",
    () => { handOn = t1; hand.style.display = 'block'; return wait(500); },
    () => { t1.busy = true; return moveTo(t1, new THREE.Vector3(t1.g.position.x, 1.25, t1.g.position.z), 400); },
    () => moveTo(t1, boxAt().clone().setY(1.25), 1300),
    () => { hand.style.display = 'none'; handOn = null; chime(true); return dropInBox(t1); },
    'Into the box!', 'Now you. Find all the other triangles!'
  ]);
  if (ok) find();
}
function find() {
  setName('find'); dots(2); allow = true; let left = shapes.filter(o => o.isTri && !o.inBox).length;
  const ask = ['Drag every triangle into the box.'];
  onDrop = (o, inBox) => {
    if (!inBox) { goHome(o); return; }
    if (o.isTri) {
      chime(true); left--; o.glow = false;
      dropInBox(o).then(() => {
        if (left === 0) { allow = false; onDrop = null; shapes.forEach(s => s.glow = false); play([YES[o.id] || 'Yes! A triangle!', 'You found all the triangles!', { wait: 300 }]).then(ok => { if (ok) mistake(); }); }
        else play([YES[o.id] || 'Yes! A triangle!']);
      });
      return;
    }
    W.misses++; chime(false);
    const lines = LOOK[o.k];
    goHome(o).then(() => {
      const steps = [lines[0]];
      if (o.marks.length) { steps.push(() => Promise.all(o.marks.map((m, i) => wait(i * 280).then(() => lightCorner(o, i)))).then(() => {})); }
      steps.push(...lines.slice(1), () => { clearCorners(o); });
      if (W.misses >= 2) steps.push(() => { shapes.forEach(s => { if (s.isTri && !s.inBox) s.glow = true; }); });
      play(steps);
    });
  };
  play(ask);
}
function mistake() {
  setName('mistake'); dots(3);
  const d = makeShape('dv', 'tri', '#3D8BFD', Math.PI, 1.5); d.slot = null; d.busy = true;
  d.g.position.set(0, 2.05, 0.9); d.g.scale.setScalar(0.01);
  camTo('close', 1000).then(() => tween(500, k => d.g.scale.setScalar(Math.max(0.01, ease(k) * 1.25))));
  const j = $('#judge'); let answered = false;
  const yes = j.querySelector('.yes'), no = j.querySelector('.no');
  yes.onclick = () => {
    if (answered) return; W.misses++; chime(false); yes.classList.remove('shake'); void yes.offsetWidth; yes.classList.add('shake');
    play(['Let us count the corners.', () => lightCorner(d, 0), 'One.', () => lightCorner(d, 1), 'Two.', () => lightCorner(d, 2), 'Three. It is a triangle!', 'Is Dovid right?']);
  };
  no.onclick = () => {
    if (answered) return; answered = true; j.classList.remove('show'); chime(true); clearCorners(d);
    play(['Right! Turned around, it is still a triangle.',
      () => tween(900, k => { d.turn.rotation.z = Math.PI * (1 - ease(k)); }),
      () => camTo('wide', 1000), () => dropInBox(d), { wait: 300 }]).then(ok => { if (ok) end(); });
  };
  play(['This is Dovid.', 'Dovid says this is not a triangle.', 'He says it is upside down.', 'Is Dovid right?', () => { j.classList.add('show'); }]);
  setTimeout(() => { if (!answered) j.classList.add('show'); }, FAST ? 0 : 14000);
}
function end() {
  const m = W.misses, stars = m === 0 ? 3 : m <= 2 ? 2 : 1;
  W.stars = stars; W.done = true; setName('end'); dots(STEPS);
  burst(boxAt().clone().setY(1.4), 60); chime(true);
  const STAR = on => '<svg viewBox="0 0 100 100"><path d="M50 6l13 28 30 3-23 20 7 30-27-16-27 16 7-30L7 37l30-3z" fill="' + (on ? '#F5B400' : '#EDE6D6') + '" stroke="' + (on ? '#C48F00' : '#D8CFBC') + '" stroke-width="4" stroke-linejoin="round"/></svg>';
  $('#stars').innerHTML = [0, 1, 2].map(i => '<div class="star">' + STAR(i < stars) + '</div>').join('');
  $('#end').classList.add('show');
  document.querySelectorAll('.star').forEach((s, i) => setTimeout(() => s.classList.add('pop'), FAST ? 0 : 250 + i * 250));
  play(['You found every triangle!', stars === 3 ? 'Three sides, three corners. You are a triangle expert!' : 'Great work! Play again for more stars.']);
}
$('#replay').onclick = () => { hush(); learn(); };

/* ---------------- start: the 3D room is already moving behind the play button ---------------- */
buildSet(); resize();
shapes.forEach(o => { o.g.visible = true; });
dots(0); frame(); W.ready = true;
preload(['Mendy is cleaning up his toys.', 'He needs all the triangles.', "Let's learn about triangles!", 'This is a triangle.', 'Count the sides with me.', 'One.', 'Two.', 'Three sides!', 'Now count the corners.', 'Three corners!']);
$('#start').onclick = () => { ac(); $('#start').style.display = 'none'; againBtn.style.visibility = 'visible'; learn(); };
</script>
</body>
</html>
