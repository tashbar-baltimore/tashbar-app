<title>Find the triangles</title>
<!-- Kindergarten Shapes: "Find the triangles" (a 3D SAMPLE for Esti). Standards K.G.2 (name shapes in any turn or size) and K.G.4 (sides and corners).
     One skill: know a triangle by its rule (3 straight sides, 3 corners), even when it is turned, tall, or small; tell it from shapes that are not triangles.
     Show, then try: a big 3D triangle; count its sides and corners together; turn it and shrink it ("still a triangle!") ->
     "Watch me" (a hand drags one triangle into Mendy's toy box) -> he drags every triangle into the box; a wrong shape is explained
     (its corners light up and are counted) and goes back -> find the mistake (Dovid says an upside-down triangle is not a triangle) -> stars.
     No reading needed: every instruction is spoken; the "hear it again" button repeats it. All shapes and the room are drawn here in 3D (three.js, MIT licence, lib/).
     Add ?fast=1 for the automatic test (no waiting for the voice or the motion). -->
<style>

@keyframes shake{ 0%,100%{ transform:none;} 20%,60%{ transform:translateX(-10px);} 40%,80%{ transform:translateX(10px);} }

    () => moveTo(t1, boxAt().clone().setY(1.25), 1300),
    () => { hand.style.display = 'none'; handOn = null; chime(true); return dropInBox(t1); },
    'Into the box!', 'Now you. Find all the other triangles!'
  ]);
  if (ok) find();
}
let idleT = null, idleN = 0, idleFn = null;
function idle() { clearTimeout(idleT); if (!idleFn) return; idleT = setTimeout(() => { if (!busy && allow) idleFn(++idleN); idle(); }, FAST ? 1e9 : 11000); }
function stopIdle() { clearTimeout(idleT); idleFn = null; idleN = 0; }
function pointAt(o) { handOn = o; hand.style.display = 'block'; return wait(1800).then(() => { hand.style.display = 'none'; handOn = null; }); }
W.idleNow = () => { if (idleFn) idleFn(++idleN); };
function find(bonus) {
  setName(bonus ? 'bonus' : 'find'); dots(2); allow = true; let left = shapes.filter(o => o.isTri && !o.inBox && o.g.visible).length;
  const ask = [bonus ? 'Find the tricky triangles. Drag them in.' : 'Drag every triangle into the box.']; task = ask;
  let helped = false;
  idleFn = n => { const t = shapes.find(x => x.isTri && !x.inBox && x.g.visible && !x.busy); if (!t) return;
    W.reminders = (W.reminders || 0) + 1;
    if (n === 1) play([...ask, 'Look for three straight sides.', () => pointAt(t)]);
    else play(['Here is a triangle. Count its corners.', () => pointAt(t), ...[0, 1, 2].flatMap(i => [() => lightCorner(t, i), NUM[i]]), () => clearCorners(t), 'Drag it into the box.']); };
  idle();
  onDrop = (o, inBox) => {
    idle();
    if (!inBox) { goHome(o); play(['Put it in the box.']); return; }
    if (o.isTri) {
      chime(true); left--;
      if (left === 0) { allow = false; onDrop = null; stopIdle(); }
      dropInBox(o).then(() => {
        if (left === 0) {
          const quick = !bonus && W.misses <= 1;
          play([YES[o.id] || 'Yes! A triangle!', 'You found all the triangles!', { wait: 300 }]).then(ok => { if (!ok) return; if (quick) bonusRound(); else mistake(); });
        } else play([YES[o.id] || 'Yes! A triangle!']);
      });
      return;
    }
    if (!bonus) W.misses++; chime(false);
    const lines = LOOK[o.k];
    goHome(o).then(() => {
      const steps = [lines[0]];
      if (o.marks.length) { steps.push('Count the corners.'); o.marks.forEach((m, i) => steps.push(() => lightCorner(o, i), ['One.', 'Two.', 'Three.', 'Four.', 'Five.', 'Six.'][i])); }
      steps.push(...lines.slice(1), () => { clearCorners(o); });
      /* struggling (2 misses): teach the rule again on a real triangle: count its corners together */
      if (W.misses >= 2 && !helped && !bonus) { const t = shapes.find(s => s.isTri && !s.inBox && s.g.visible); if (t) { helped = true;
        steps.push('Remember: a triangle has three corners.', 'Look at this one.', ...[0, 1, 2].flatMap(i => [() => lightCorner(t, i), NUM[i]]), () => wait(500), () => clearCorners(t)); } }
      steps.push(...ask);
      play(steps);
    });
  };
  play(ask);
}
/* quick learners: a bonus round of tricky pieces (not counted against the stars) */
function bonusRound() {
  W.bonus = true; setName('bonus');
  const BONUS_COLORS = ['#E03A33', '#00A3B8', '#F2A900'];
  const news = BONUS.map((b, i) => { const o = makeShape(b[0], b[1], BONUS_COLORS[i], b[2], b[3]); o.slot = b[4]; o.home.copy(homeFor(b[4])); o.g.position.copy(o.home); o.g.scale.setScalar(0.01); return o; });
  news.forEach((o, i) => setTimeout(() => { pop(); tween(420, k => o.g.scale.setScalar(Math.max(0.01, o.scale * ease(k)))); }, FAST ? 0 : 300 + i * 200));
  play(['Bonus round! You are so good at this.', 'Here come some tricky ones.', { wait: 500 }]).then(ok => { if (ok) find(true); });
}
function mistake() {
  setName('mistake'); dots(3); task = null; stopIdle();
  shapes.forEach(o => { if (!o.inBox) tween(300, k => o.g.scale.setScalar(Math.max(0.001, o.scale * (1 - k)))).then(() => { o.g.visible = false; }); });
  const d = makeShape('dv', 'tri', '#FF7A1A', Math.PI, 1.5); d.slot = null; d.busy = true;
  d.g.position.set(0.7, 2.05, 0.9); d.g.scale.setScalar(0.01);
  dovid.position.set(-1.3, 0, 0.6); dovid.rotation.y = 0.35; dovid.visible = true;
  camTo('close', 1000).then(() => tween(500, k => d.g.scale.setScalar(Math.max(0.01, ease(k) * 1.15))));
  const j = $('#judge'); let answered = false;
  const yes = j.querySelector('.nottri'), no = j.querySelector('.istri'); delete yes.dataset.cost;
  yes.onclick = () => {
    if (answered) return; if (!yes.dataset.cost) { W.misses++; yes.dataset.cost = '1'; } chime(false); yes.classList.remove('shake'); void yes.offsetWidth; yes.classList.add('shake');
    play(['Let us count the corners.', () => lightCorner(d, 0), 'One.', () => lightCorner(d, 1), 'Two.', () => lightCorner(d, 2), 'Three. It is a triangle!', 'Is it a triangle?']);
  };
  no.onclick = () => {
    if (answered) return; answered = true; j.classList.remove('show'); chime(true); clearCorners(d);
    play(['Yes! It is a triangle. Show Dovid the corners.', () => { task = ['Tap each corner.']; return tapCorners(d); }, () => { task = null; clearCorners(d); },
      'Turned around, it is still a triangle.', () => cheer(dovid),
      () => tween(900, k => { d.turn.rotation.z = Math.PI * (1 - ease(k)); }),
      () => { dovid.visible = false; return camTo('wide', 1000); }, () => dropInBox(d), { wait: 300 }]).then(ok => { if (ok) end(); });
  };
  play(['This is Dovid.', 'Dovid says this shape is not a triangle.', 'He says it is upside down.', 'What do you think? Is it a triangle?', () => { task = ['Is it a triangle? Tap your answer.']; j.classList.add('show'); }]);
  setTimeout(() => { if (!answered) j.classList.add('show'); }, FAST ? 0 : 14000);
  const nudge = () => setTimeout(() => { if (answered || W.name !== 'mistake') return; if (!busy) play(['Is it a triangle? Tap your answer.']); nudge(); }, FAST ? 1e9 : 13000); nudge();
}
function end() {
  const m = W.misses, stars = m === 0 ? 3 : m <= 2 ? 2 : 1;
  W.stars = stars; W.done = true; setName('end'); dots(STEPS);
  burst(boxAt().clone().setY(1.4), 60); chime(true); task = null; cheer(mendy).then(() => cheer(mendy));
  const STAR = on => '<svg viewBox="0 0 100 100"><path d="M50 6l13 28 30 3-23 20 7 30-27-16-27 16 7-30L7 37l30-3z" fill="' + (on ? '#F5B400' : '#EDE6D6') + '" stroke="' + (on ? '#C48F00' : '#D8CFBC') + '" stroke-width="4" stroke-linejoin="round"/></svg>';
  $('#stars').innerHTML = [0, 1, 2].map(i => '<div class="star">' + STAR(i < stars) + '</div>').join('');
  $('#end').classList.add('show');
  document.querySelectorAll('.star').forEach((s, i) => setTimeout(() => s.classList.add('pop'), FAST ? 0 : 250 + i * 250));
  play(['You found every triangle!', stars === 3 ? 'Three sides, three corners. You are a triangle expert!' : 'Great work! Play again for more stars.']);
}
$('#replay').onclick = () => { hush(); learn(); };

/* ---------------- start: the 3D room is already moving behind the play button ---------------- */
buildSet(); resize();
shapes.forEach(o => { o.g.visible = true; });
dots(0); frame(); W.ready = true;
preload(['Mendy is cleaning up his toys.', 'He needs all the triangles.', "Let's learn about triangles!", 'This is a triangle.', 'Count the sides with me.', 'One.', 'Two.', 'Three sides!', 'Now count the corners.', 'Three corners!']);
$('#start').onclick = () => { ac(); $('#start').style.display = 'none'; againBtn.style.visibility = 'visible'; learn(); };
</script>
