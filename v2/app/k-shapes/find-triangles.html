<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Find the triangles</title>
<!-- Kindergarten Shapes, Unit 1 "Meet the flat shapes" (v2/curriculum/k-shapes/MAP.md): know a triangle by its rule (3 straight sides, 3 corners), turned, tall, wide or small; tell it from look-alikes. K.G.2, K.G.4.
     Built on the shared 3D kit (kit.js): learn -> he taps / claps -> watch me -> he sorts -> find the mistake -> stars. ?fast=1 for the automatic test. -->
<link rel="stylesheet" href="kit.css">
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
</head>
<body>
<script type="module">
import { startGame, wrongFor, FAMILY } from './kit.js';

const PI = Math.PI;
startGame({
  id: 'triangles',
  boxes: [{ paint: 'tri', color: '#E03A33', accept: ['tri', 'triTall', 'triRight', 'triWide', 'triSkinny'] }],
  intro: ['Mendy is cleaning up his toys.', 'He needs all the triangles.', "Let's learn about triangles!"],
  lessons: [{ k: 'tri', word: 'triangle', color: '#E03A33', sideColors: ['#FFD23F', '#FFD23F', '#FFD23F'], rule: ['Three straight sides, three corners. A triangle!'],
    chant: [['Three sides!', 3, 'sides'], ['Three corners!', 3], ['Tri-an-gle!', 3]], turn: PI, turnLine: 'Watch. I turn it upside down.' }],
  set: [['t1', 'tri', 0, 1], ['sq', 'square', PI / 4, 1], ['t2', 'tri', PI, 1], ['cv', 'curvy', 0, 1],
        ['t3', 'triTall', 0.35, 1], ['ci', 'circle', 0, 1], ['t4', 'triWide', -0.2, 0.72], ['re', 'rect', 0.18, 0.95]],
  watchLine: "Here are Mendy's toys. Watch me find a triangle.", yourTurn: 'Now you. Find all the other triangles!',
  ask: 'Drag every triangle into the box.', hint: 'Look for three straight sides.', remember: 'Remember: a triangle has three corners.',
  yes: { t2: 'Yes! Upside down is still a triangle!', t3: 'Yes! Tall and thin, still a triangle!', t4: 'Yes! Small and wide, still a triangle!',
    tw: 'Yes! Tipped over, still a triangle!', tk: 'Yes! Skinny and tipped, still a triangle!' },
  yesDefault: () => 'Yes! A triangle!', allDone: 'You found all the triangles!', wrong: wrongFor('triangle'),
  bonus: [['tw', 'triRight', 0.6, 1, 0], ['hx', 'hex', 0.3, 0.95, 2], ['tk', 'triSkinny', -0.5, 1, 4]], bonusAsk: 'Find the tricky triangles. Drag them in.',
  mistake: { friend: { name: 'Dovid', shirt: '#2F4A8A', hair: '#1E1712', glasses: true }, icon: 'tri', piece: ['tri', PI, 1.15, '#FF7A1A'],
    claim: ['Dovid says this shape is not a triangle.', 'He says it is upside down.'], ask: 'Is it a triangle?', answer: true, prove: true,
    explain: ['Three corners! It is a triangle.'], right: ['Yes! It is a triangle.', 'Turned around, it is still a triangle.'] },
  endLine: 'You found every triangle!', praise: 'Three sides, three corners. You are a triangle expert!'
});
</script>
</body>
</html>
