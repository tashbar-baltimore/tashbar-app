<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tashbar Learning 2.0</title>
<style>
:root{ --bg:#F6F1E7; --ink:#1F2A44; --soft:#5B6478; --card:#FFFFFF; --line:#E4DCCB; --green:#1E9E5A; }
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
main{ min-height:100%; display:grid; place-items:center; padding:24px 16px; }
.card{ width:100%; max-width:520px; background:var(--card); border:2px solid var(--line); border-radius:24px; padding:32px 24px; text-align:center; }
h1{ margin:0 0 8px; font-size:32px; } p{ margin:8px 0; color:var(--soft); font-size:18px; line-height:1.4; }
.games{ display:none; margin-top:20px; }
.game{ display:flex; align-items:center; gap:16px; text-decoration:none; color:var(--ink); background:linear-gradient(#EAF4FF,#CFE6FF); border:2px solid #9CC8F5; border-radius:22px; padding:14px 18px; min-height:96px; box-shadow:0 6px 0 #8DB7E2; }
.game:active{ transform:translateY(4px); box-shadow:0 2px 0 #8DB7E2; }
@media (max-width:480px){ .card{ padding:28px 14px; } .game{ gap:10px; padding:12px; } .game .ab{ font-size:30px !important; min-width:0 !important; padding:8px !important; } .game .nm{ font-size:17px !important; } }
.game .ab{ white-space:nowrap; font:800 44px/1 "Noto Serif Hebrew","Times New Roman",serif; color:#1F5FFF; direction:rtl; background:#fff; border-radius:16px; padding:8px 12px; min-width:96px; }
.game .nm{ flex:1; min-width:0; text-align:left; font-size:20px; font-weight:700; } .game .nm small{ display:block; font-weight:400; color:var(--soft); font-size:15px; }
.game .go{ margin-left:auto; width:64px; height:64px; border-radius:50%; background:var(--green); display:grid; place-items:center; flex:none; }
.tag{ display:inline-block; background:var(--green); color:#fff; border-radius:999px; padding:4px 14px; font-weight:700; font-size:14px; margin-bottom:16px; }
</style>
</head>
<body>
<main><div class="card">
  <span class="tag">2.0</span>
  <h1>Tashbar Learning</h1>
  <p>The new, clean app is being built. Pieces appear here only after they are finished and approved.</p>
  <p id="wait">Boys: please use the regular app for now.</p>
  <div class="games" id="games">
    <a class="game" href="k-kriyah/index.html" aria-label="Kindergarten Kriyah: the Alef-Beis">
      <span class="ab">א ב ג</span>
      <span class="nm">Kindergarten Kriyah<small>The Alef-Beis, in 3D games</small></span>
      <span class="go"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z" fill="#fff"/></svg></span>
    </a>
  </div>
</div></main>
<script>
/* show a piece only once it is really in 2.0 (approved and put live) */
fetch('k-kriyah/units.js', { method: 'HEAD', cache: 'no-store' }).then(r => { if (r.ok) { document.getElementById('games').style.display = 'block'; document.getElementById('wait').textContent = 'Tap a game to start.'; } }).catch(() => {});
</script>
</body>
</html>
