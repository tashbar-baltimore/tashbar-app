<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Review — Kindergarten Numbers</title>
<!-- Kindergarten Numbers, Unit 5 REVIEW ROUND: 6 short mixed items from earlier units, so he never forgets (spaced review).
     Unit 1: a quick peek at 1-5. Unit 2: what comes next when counting. Unit 3: give Bubby a number (tap oranges onto her
     plate, counting out); count a scattered group. Unit 4: zero is none; a written number 0-5.
     It is practice: a miss gets help (look or count together) and he tries again; a second miss shows the answer.
     The first time each kind of item comes, a short demo shows how to answer. A boy who misses twice gets smaller numbers next;
     a quick boy gets a bonus count. -->
<link rel="stylesheet" href="frame.css"><link rel="stylesheet" href="unit5.css">
<style>
.stage{ grid-template-columns:.9fr 1.3fr; align-items:center; }
.left, .right{ display:flex; align-items:center; justify-content:center; height:100%; gap:14px; }
.right{ flex-direction:column; }
#flash.qcard{ width:min(36vw,56vh,400px); }
.ans{ width:min(56vw,640px); } .ans .hands2{ width:min(44vw,60vh,540px); margin:0 auto; } .ans[hidden]{ display:none; }
.bignum{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
.bignum svg{ height:70%; width:auto; overflow:visible; }
.ear{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; } .ear svg{ width:46%; }
.give{ display:flex; align-items:center; justify-content:space-around; gap:10px; }
.bowl, .plt{ position:relative; width:46%; aspect-ratio:1.1; border-radius:50%; display:flex; flex-wrap:wrap; align-content:center; justify-content:center; gap:2px; padding:8%; }
.bowl{ background:radial-gradient(ellipse at 50% 35%, #FFF6DD 0 52%, #E9B77A 54%, #C98B4B 100%); box-shadow:0 8px 0 #9C6430; }
.plt{ background:radial-gradient(ellipse at 50% 42%, #fff 0 55%, #C7D9EE 86%, #A9C1DE 100%); box-shadow:0 8px 0 rgba(40,70,140,.2); }
.og{ width:clamp(64px,10vh,84px); height:clamp(64px,10vh,84px); cursor:pointer; touch-action:none; transition:transform .15s; }
.og:active{ transform:scale(.9); }
.hero svg{ width:58%; margin:6% auto 0; display:block; }
@media (max-width:760px), (max-aspect-ratio:4/5){ .stage{ grid-template-columns:1fr; grid-template-rows:.7fr 1.3fr; } #flash.qcard{ width:min(64vw,28vh); } .ans{ width:94vw; } .ans .hands2{ width:84vw; } .give{ flex-direction:row; } .bowl, .plt{ width:49%; aspect-ratio:auto; min-height:150px; border-radius:30px; padding:2%; gap:0; } .og{ width:64px; height:64px; } }
</style>
</head>
<body>
<div id="game" class="locked"><div class="stage" id="stage">
  <div class="left"><div class="qcard flash" id="flash"><div class="cloth"><div class="eyes"><i></i><i></i></div></div></div></div>
  <div class="right"><div class="ans panel" id="aH"></div><div class="ans panel give" id="aG" hidden><div class="bowl" id="pile"></div><div class="plt" id="plt"></div></div>
    <button id="check" class="dim btn3d b-green" aria-label="Check"><svg viewBox="0 0 48 48"><path d="M10 25l9 9 19-20" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
</div></div>
<script src="kit.js"></script><script src="frame.js"></script><script src="unit5.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var H, R, done, plan, shown, easy = 0, seen = {};
  var EAR = '<div class="ear"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#2FB5E8"/><path d="M10 19h7l9-7v24l-9-7h-7z" fill="#fff"/><path d="M30 17c3 2 4 4.5 4 7s-1 5-4 7M34 12c4 3.5 6 8 6 12s-2 8.5-6 12" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg></div>';
  var OG = '<svg class="og" viewBox="0 0 100 100"><use href="#nkOrange"/></svg>';
  function cloth(open) { $('flash').classList.toggle('open', open); if (open) NK.sound.cloth(); }
  /* Bubby's plate: tap an orange in the bowl to give it; tap one on the plate to take it back */
  var G = { count: function () { return $('plt').querySelectorAll('.og').length; }, set: function (k) { $('pile').innerHTML = ''; $('plt').innerHTML = ''; for (var i = 0; i < 6; i++) (i < k ? $('plt') : $('pile')).insertAdjacentHTML('beforeend', OG); },
    lock: function (on) { $('aG').classList.toggle('locked', on); } };
  $('aG').addEventListener('pointerdown', function (e) {
    var o = e.target.closest('.og'); if (!o || $('aG').classList.contains('locked') || GAME.phase !== 'answer') return; e.preventDefault();
    (o.parentNode.id === 'pile' ? $('plt') : $('pile')).appendChild(o); NK.sound[o.parentNode.id === 'plt' ? 'pop' : 'back'](); ready();
  });
  function W() { return R.ans === 'give' ? G : H; }
  function ready() { var c = $('check'); var ok = W().count() > 0 || R.n === 0; c.classList.toggle('dim', !ok); c.classList.toggle('ready', ok && GAME.phase === 'answer'); }
  function taps(k) {
    if (R.ans !== 'give') return H.moves(k, '#aH');
    var c = G.count(), out = []; for (var i = 0; i < Math.abs(k - c); i++) out.push({ tap: (k > c ? '#pile' : '#plt') + ' .og >> nth=0' }); return out;
  }
  function hooks() { GAME.right = function () { return taps(R.n).concat([{ tap: '#check' }]); }; GAME.wrong = function () { return taps(R.n + 1).concat([{ tap: '#check' }]); }; }
  function put(html) { if (shown) shown.remove(); var d = document.createElement('div'); d.className = 'shown'; d.style.cssText = 'position:absolute;inset:0'; d.innerHTML = html || ''; $('flash').insertBefore(d, $('flash').firstChild); shown = d; return d; }
  function scattered(n) { var pts = [], t = 0; while (pts.length < n && t++ < 800) { var x = 14 + Math.random() * 72, y = 14 + Math.random() * 72; if (pts.every(function (q) { return Math.hypot(q[0] - x, q[1] - y) > 20; })) pts.push([x, y]); } return pts; }
  async function countTogether() {
    var items = shown.querySelectorAll('svg.q'); for (var i = 0; i < items.length; i++) { items[i].style.filter = 'drop-shadow(0 0 8px #FFD23D)'; await FR.say(FR.Word(i + 1) + (i === items.length - 1 ? '!' : ','), { noRepeat: true }); }
    items.forEach(function (x) { x.style.filter = ''; });
  }
  async function help(second) {
    if (R.type === 'count') { await FR.say("Let's count together. Touch each one."); await countTogether(); }
    else if (R.type === 'give') await FR.say(second ? FR.Word(R.n) + ' oranges. One, two... count them out.' : "Let's count the plate together.");
    else if (R.type === 'next') await FR.say("Let's look again. After " + FR.word(R.n - 1) + ' comes ' + (second ? FR.word(R.n) + '.' : '...?'));
    else if (R.type === 'zero') await FR.say("Let's look. Nothing there. That is zero!");
    else if (R.type === 'peek') { cloth(true); await FR.say("Let's look again."); if (R.L) await FR.showShape(shown.querySelector('.qcard') || shown, second); }
    else await FR.say("Let's look. That number is " + (second ? FR.word(R.n) + '.' : 'small.'));
  }
  async function check() {
    NK.unlock(); if (GAME.phase !== 'answer') return; var have = W().count(); if (!have && R.n !== 0) { FR.say('Show me first.'); return; }
    GAME.phase = 'busy'; FR.lock(true); W().lock(true);
    if (have === R.n) { cloth(true); await FR.yes($(R.ans === 'give' ? 'aG' : 'aH'), R.n === 0 ? 'Yes! Zero. None at all!' : FR.pick(['Yes!', 'Right!', 'You remember!'])); var d = done; done = null; d(R.misses === 0); return; }
    FR.oops($('check')); R.misses++;
    if (R.misses === 1) { await help(false); await FR.say('Try again!'); W().set(0); if (R.flash) { cloth(false); await FR.wait(400); await FR.say('Peek!', { noRepeat: true }); cloth(true); await FR.wait(1500); cloth(false); } }
    else { await help(true); W().set(R.n); await FR.wait(900); cloth(true); var d2 = done; done = null; d2(false); return; }
    GAME.phase = 'answer'; FR.lock(false); W().lock(false); ready(); hooks();
  }
  /* the first time each kind comes: a short demo of how to answer */
  var DEMO = {
    peek: async function (F) { await F.say('Peek, then tap the hand. One finger each tap.'); await F.handTo(H.hands[0].el, .5, .6); await F.handTap(); H.hands[0].set(1); NK.sound.pop(); await F.wait(300); H.set(0); F.handHide(); },
    give: async function (F) { await F.say('Tap an orange. It goes on Bubby\'s plate.'); var o = $('pile').querySelector('.og'); await F.handTo(o); await F.handTap(); $('plt').appendChild(o); NK.sound.pop(); await F.wait(300); G.set(0); F.handHide(); },
    zero: async function (F) { await F.say('None? Keep the hands closed. Then press check.'); await F.handTo($('check')); await F.wait(300); F.handHide(); },
    numeral: async function (F) { await F.say('A written number. Show it on the hands.'); }
  };
  var ITEMS = [
    { type: 'peek', make: function (F) { var n = easy ? F.pick([2, 3]) : F.pick([3, 4, 5]), c = F.card(n, 'dots'); c.style.cssText = 'position:absolute;inset:0;border:0;box-shadow:none;background:none'; put().appendChild(c); return { n: n, L: c.L, flash: true, line: 'Peek! How many dots?' }; } },
    { type: 'next', make: function (F) { var a = easy ? F.pick([1, 2]) : F.pick([3, 4, 5, 6]); put(EAR); return { n: a + 3, a: a }; } },
    { type: 'give', make: function (F) { var n = easy ? 2 : F.pick([3, 4]); put('<svg class="q" viewBox="0 0 100 100" style="position:absolute;width:50%;height:50%;left:50%;top:50%"><use href="#nkOrange"/></svg>'); return { n: n, ans: 'give', line: 'Bubby needs ' + F.word(n) + ' oranges. Give her ' + F.word(n) + '.' }; } },
    { type: 'count', make: function (F) { var n = easy ? 5 : F.pick([6, 7, 8]), h = ''; scattered(n).forEach(function (p) { h += '<svg class="q" viewBox="0 0 100 100" style="position:absolute;width:19%;height:19%;transform:translate(-50%,-50%);left:' + p[0] + '%;top:' + p[1] + '%"><use href="#nkApple"/></svg>'; }); put(h); return { n: n, line: 'How many apples? Count, then show me.' }; } },
    { type: 'zero', make: function (F) { put('<div style="position:absolute;inset:12%;border-radius:50%;background:radial-gradient(ellipse at 50% 42%, #fff 0 55%, #C7D9EE 86%, #A9C1DE 100%)"></div>'); return { n: 0, line: 'How many cookies on the plate?' }; } },
    { type: 'numeral', make: function (F) { var n = easy ? F.pick([1, 2, 3]) : F.pick([2, 3, 4, 5]); put('<div class="bignum">' + U5.num(n) + '</div>'); return { n: n, line: 'What number is this? Show me.' }; } }
  ];
  function play(F, it) {
    return new Promise(async function (res) {
      GAME.phase = 'busy'; F.lock(true); cloth(false); await F.wait(380);
      var r = it.make(F); r.type = it.type; r.ans = r.ans || 'hands'; r.misses = 0; R = r; if (easy > 0) easy--;
      $('aH').hidden = R.ans !== 'hands'; $('aG').hidden = R.ans !== 'give'; H.set(0); G.set(0); H.lock(true); G.lock(true); ready();
      if (DEMO[R.type] && !seen[R.type]) { seen[R.type] = true; await DEMO[R.type](F); }
      if (R.type === 'next') { await F.say('Count with me. What comes next?'); for (var k = R.a; k < R.a + 3; k++) await F.say(F.Word(k) + '…', { noRepeat: true }); NK.last = 'What comes after ' + F.word(R.n - 1) + '? Show me.'; await F.say('What comes next? Show me.', { noRepeat: true }); }
      else if (R.flash) { await F.say(R.line, { repeat: 'How many dots? Show me.' }); cloth(true); await F.wait(1300); cloth(false); await F.wait(380); }
      else { cloth(true); await F.say(R.line); }
      done = function (first) { if (R.misses >= 2) easy = 2; res(first); };
      GAME.phase = 'answer'; F.lock(false); W().lock(false); ready(); hooks();
    });
  }
  FR.game({
    id: 'u5-review', title: 'Review Time', rounds: 6,
    hero: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#fff" stroke="#3B2A7A" stroke-width="5"/><path d="M50 50 L50 22 M50 50 L70 60" stroke="#3B2A7A" stroke-width="6" stroke-linecap="round"/><path d="M14 30 A40 40 0 0 1 40 11" stroke="#22B45E" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M40 11 l-2 -8 M40 11 l-8 2" stroke="#22B45E" stroke-width="6" stroke-linecap="round"/></svg>',
    init: function (F) { H = U5.hands(0, true); $('aH').appendChild(H.el); H.onChange = ready; H.lock(true); $('check').addEventListener('click', check); },
    reset: function (F, again) { plan = ITEMS.slice(); if (!again) { easy = 0; seen = {}; } },
    demo: async function (F) { await F.say('Review time! Things we learned before.'); },
    endSay: function (s) { return s >= 2 ? 'Great remembering!' : 'Good try! We will practice these again.'; },
    round: function (F, i) { return play(F, plan[i]); },
    bonus: function (F) { return play(F, { type: 'count', make: function (F) { var n = F.pick([9, 10]), h = ''; scattered(n).forEach(function (p) { h += '<svg class="q" viewBox="0 0 100 100" style="position:absolute;width:17%;height:17%;transform:translate(-50%,-50%);left:' + p[0] + '%;top:' + p[1] + '%"><use href="#nkPear"/></svg>'; }); put(h); return { n: n, line: 'Bonus! So many pears. How many?' }; } }); }
  });
})();
</script>
</body>
</html>
