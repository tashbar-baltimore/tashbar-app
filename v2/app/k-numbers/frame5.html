<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fill the Frame — Kindergarten Numbers</title>
<!-- Kindergarten Numbers, Unit 4, game 1: FILL THE FRAME. Skill: show a number 0-5 on a five-frame.
     He sees the written number and hears it, then taps boxes to put counters in (tap again to take one out) and presses check.
     The five-frame shows each number against five ("Four: one box is empty"). First mistake: look again and fix it;
     second: the boxes to fill glow green, the extra ones glow red, and "Put one more in". -->
<link rel="stylesheet" href="frame.css">
<link rel="stylesheet" href="unit4.css">
<style>
.stage{ grid-template-columns:.8fr 1.4fr; align-items:center; }
.left, .right{ display:flex; align-items:center; justify-content:center; gap:16px; height:100%; }
.right{ flex-direction:column; }
#num{ width:min(26vw,52vh,300px); }
#ffw .ff{ width:min(54vw,90vh,640px); }
.hero{ display:flex; align-items:center; justify-content:center; }
.hero .ff{ width:92%; }
@media (max-width:760px), (max-aspect-ratio:4/5){ .stage{ grid-template-columns:1fr; grid-template-rows:.9fr 1fr; } #num{ width:min(44vw,30vh); } #ffw .ff{ width:96vw; } }
</style>
</head>
<body>
<div id="game" class="locked"><div class="stage" id="stage">
  <div class="left"><div id="numw"></div></div>
  <div class="right"><div id="ffw"></div>
    <button id="check" class="btn3d b-green" aria-label="Check"><svg viewBox="0 0 48 48"><path d="M10 25l9 9 19-20" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
</div></div>
<script src="kit.js"></script>
<script src="frame.js"></script>
<script src="unit4.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var FF, R, done, prev = -1, A = U4.adapt();
  var helping = false;   /* easier path: the voice counts along as he fills */
  function setNum(n) { var c = U4.numCard(n); c.id = 'num'; $('numw').innerHTML = ''; $('numw').appendChild(c); }
  function taps(m) { return FF.moves(m).map(function (i) { return { tap: '#ffw .box[data-b="' + i + '"]' }; }); }
  function hooks() { GAME.right = function () { return taps(R.n).concat([{ tap: '#check' }]); }; GAME.wrong = function () { return taps(R.n === 5 ? 4 : R.n + 1).concat([{ tap: '#check' }]); }; }
  function shape(n) { return n === 5 ? 'Five! The frame is full!' : n === 0 ? 'Zero! All the boxes are empty.' : FR.Word(n) + '! ' + FR.Word(5 - n) + (5 - n === 1 ? ' box is' : ' boxes are') + ' empty.'; }
  async function check() {
    NK.unlock(); if (GAME.phase !== 'answer') return; GAME.phase = 'busy'; FR.lock(true); FF.lock(true);
    var have = FF.count(), d;
    if (have === R.n) { $('num').style.opacity = ''; await FR.yes($('ffw'), shape(R.n)); if (R.misses) A.miss(); else A.hit(); d = done; done = null; d(R.misses === 0); return; }
    FR.oops($('ffw')); R.misses++; $('num').style.opacity = '';
    if (R.misses === 1) { await FR.say("Let's look again."); await U4.countWith(FF); await FR.say('This says ' + FR.word(R.n) + '. Fix the frame.'); }
    else { var k = R.n - have; FF.hint(R.n); await FR.say('You have ' + FR.word(have) + '. ' + (k > 0 ? 'Put ' + FR.word(k) + ' more in.' : 'Take ' + FR.word(-k) + ' out.')); }
    GAME.phase = 'answer'; FR.lock(false); FF.lock(false); hooks();
  }
  FR.game({
    id: 'u4-frame', title: 'Fill the Frame', rounds: 6,
    hero: '<div class="ff locked"><div class="box"><i class="ctr"></i></div><div class="box"><i class="ctr"></i></div><div class="box"><i class="ctr"></i></div><div class="box"></div><div class="box"></div></div>',
    init: function (F) { FF = U4.frame5(0, true); $('ffw').appendChild(FF.el); FF.lock(true); $('check').addEventListener('click', check);
      FF.onChange = function (c) { if (helping && GAME.phase === 'answer') { NK.hush(); NK.say(c === 0 ? 'Zero.' : FR.Word(c) + '.', { noRepeat: true }); } }; },
    demo: async function (F) {
      setNum(2); FF.set(0);
      await F.say('This is a five-frame. Five boxes.');
      await F.say('This says two. Watch me fill two.');
      for (var i = 0; i < 3; i++) { await F.handTo(FF.box(i)); await F.handTap(); FF.box(i).innerHTML = '<i class="ctr"></i>'; NK.sound.pop(); }
      await F.say('Oops, that is three. Take one out.');   /* show taking one out: tap a counter */
      await F.handTo(FF.box(2)); await F.handTap(); FF.box(2).innerHTML = ''; NK.sound.back();
      await F.handTo($('check')); await F.handTap(); await F.yes($('ffw'), 'Two! Three boxes are empty.');
    },
    reset: function () { A.reset(); },
    round: function (F, i) {
      return new Promise(async function (res) {
        /* the same numbers for everyone; after two misses he gets help: a starter counter and the voice counts along */
        var pool = i === 4 ? [0] : i < 3 ? [1, 2, 3] : [3, 4, 5], n; do { n = F.pick(pool); } while (n === prev && pool.length > 1); prev = n;
        helping = A.easy();
        R = { n: n, misses: 0 }; FF.set(n === 0 ? F.pick([1, 2]) : helping && n > 1 ? 1 : 0); FF.lock(true); setNum(n); GAME.phase = 'busy'; F.lock(true);
        await F.say(n === 0 ? 'This says zero. Show zero.' : 'This says ' + F.word(n) + '. Fill the frame.', { repeat: 'This says ' + F.word(n) + '. Fill the frame.' });
        if (n === 0) await F.say('Zero means none. Take them all out.');
        else if (helping && n > 1) await F.say('One is in. I will count with you.');
        done = res; GAME.phase = 'answer'; F.lock(false); FF.lock(false); hooks();
      });
    },
    /* bonus for a quick boy: the number shows for a moment, then hides. Fill it from memory. */
    bonus: async function (F) {
      var nums = F.shuffle([4, 5, 3]).slice(0, 2);
      for (var k = 0; k < nums.length; k++) {
        await new Promise(async function (res) {
          var n = nums[k]; helping = false; R = { n: n, misses: 0 }; FF.set(0); FF.lock(true); setNum(n); GAME.phase = 'busy'; F.lock(true);
          await F.say('Quick! Look: ' + F.word(n) + '. Remember it!', { repeat: 'Fill the frame with ' + F.word(n) + '.' });
          await F.wait(1200); $('num').style.opacity = '.08';
          done = res; GAME.phase = 'answer'; F.lock(false); FF.lock(false); hooks();
          await F.say('Now fill the frame!');
        });
      }
    }
  });
})();
</script>
</body>
</html>
