<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find the Mistake — Kindergarten Numbers</title>
<!-- Kindergarten Numbers, Unit 8 "Parts of 5": FIND THE MISTAKE. Ari made number bonds for Bubby's kugel plates, and one number is wrong
     ("Three and one make five!"). The plates show the truth. He taps the wrong circle; it empties, and he drags the right number card into it
     (one tool, the number bond, for the whole round: K clarity review 2026-11-27). Ari's picture stands by the bond, since "Ari says" it.
     A wrong circle: "That one is right. Count the plates." A wrong number: we count the slices together, the plate glowing. -->
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
<link rel="stylesheet" href="frame.css"><link rel="stylesheet" href="unit6.css"><link rel="stylesheet" href="kitchen8.css">
<style>
.bond{ position:relative; width:clamp(200px,30vh,250px); height:clamp(130px,19vh,160px); }
.bond svg.lines{ position:absolute; inset:0; width:100%; height:100%; }
.bc{ position:absolute; width:clamp(64px,9.5vh,80px); height:clamp(64px,9.5vh,80px); border-radius:50%; background:#fff; border:5px solid #FF8A3D; display:flex; align-items:center; justify-content:center; padding:8px; box-shadow:0 5px 0 rgba(0,0,0,.12); }
.bc svg{ height:100%; width:auto; } .bc{ cursor:pointer; } #src[hidden]{ display:none; } .bc.can{ box-shadow:0 0 0 6px rgba(255,201,61,.75), 0 5px 0 rgba(0,0,0,.12); }
#ari{ height:clamp(84px,13vh,110px); width:auto; align-self:flex-end; filter:drop-shadow(0 4px 4px rgba(0,0,0,.18)); } .bc.picked{ box-shadow:0 0 0 6px #FFC93D; } .bc.wrongc{ border-color:#FF5A4E; } .bc.empty{ border-style:dashed; background:#FFF6E8; } .bc.good{ box-shadow:0 0 0 6px #22B45E; } .bc.shake{ animation:shake .45s; }
#bw{ left:50%; top:0; transform:translateX(-50%); border-color:#2FB5E8; } #b0{ left:0; bottom:0; } #b1{ right:0; bottom:0; }
#src .numcard{ width:clamp(64px,8.5vh,76px); height:clamp(64px,8.5vh,76px); }
@media (max-width:760px), (max-aspect-ratio:4/5){ .ui{ flex-wrap:wrap; } #src{ order:3; width:100%; } #ari{ height:84px; } }
</style>
</head>
<body>
<div id="world"></div>
<div id="game" class="locked"><div class="stage s6" id="stage">
  <div class="ui" id="panel">
    <img id="ari" src="art/ari-talk.png" alt="Ari">
    <div class="bond"><svg class="lines" viewBox="0 0 100 64" preserveAspectRatio="none"><path d="M50 18 L16 48 M50 18 L84 48" stroke="#8A6A4A" stroke-width="2.5"/></svg>
      <div class="bc" id="bw"></div><div class="bc" id="b0"></div><div class="bc" id="b1"></div></div>
    <div class="srcs" id="src" hidden></div>
  </div>
</div></div>
<script src="kit.js"></script><script src="frame.js"></script><script src="unit5.js"></script>
<script type="module">
import { mount } from './kitchen8.js';
const $ = id => document.getElementById(id);
let K, R, done;
const band = () => [innerWidth < 760 ? 80 : 92, $('panel').getBoundingClientRect().top - 8];
const ID = { w: 'bw', 0: 'b0', 1: 'b1' };
function truth(c) { return c === 'w' ? R.a + R.b : c === 0 ? R.a : R.b; }
function hooks() {
  if (R.stage === 'find') { const ok = ['w', 0, 1].find(c => c !== R.bad); GAME.right = () => [{ tap: '#' + ID[R.bad] }]; GAME.wrong = () => [{ tap: '#' + ID[ok] }]; return; }
  const k = truth(R.bad), bad = k === 5 ? 4 : k + 1; GAME.right = () => [{ drag: ['#src .numcard[data-n="' + k + '"]', '#' + ID[R.bad]] }]; GAME.wrong = () => [{ drag: ['#src .numcard[data-n="' + bad + '"]', '#' + ID[R.bad]] }];
}
function open() { GAME.phase = 'answer'; FR.lock(false); hooks(); ['bw', 'b0', 'b1'].forEach(id => $(id).classList.toggle('can', R.stage === 'find')); }
function fill(id, n) { const c = $(id); c.classList.toggle('empty', n == null); c.innerHTML = n == null ? '' : U5.num(n); }
async function countAll() { const all = K.plates.flatMap(p => p.children); await K.bumpAll(all, i => FR.say(FR.Word(i + 1) + (i === all.length - 1 ? '!' : ','), { noRepeat: true })); }
async function pick(c) {
  NK.unlock(); if (GAME.phase !== 'answer' || R.stage !== 'find') return; GAME.phase = 'busy'; FR.lock(true); ['bw', 'b0', 'b1'].forEach(id => $(id).classList.remove('can')); const el = $(ID[c]);
  if (c === R.bad) { el.classList.add('wrongc'); NK.sound.yes(); await FR.say('Yes! That number is wrong.'); fill(ID[c], null); el.classList.remove('wrongc'); R.stage = 'fix'; $('src').hidden = false;
    open(); await FR.say('Put the right number in the empty circle.', { repeat: 'Count the plates. Drag the right number in.' }); return; }
  FR.oops(el); R.misses++; await FR.say('That one is right. Look at the plates.'); await countAll(); if (R.misses >= 2) $(ID[R.bad]).classList.add('wrongc'); await FR.say(R.misses >= 2 ? 'The red one is wrong. Tap it.' : 'Which number is wrong?'); open();
}
async function drop(card, slot) {
  if (GAME.phase !== 'answer' || R.stage !== 'fix' || slot.id !== ID[R.bad]) return; GAME.phase = 'busy'; FR.lock(true); K.glowPlate(-1); const k = truth(R.bad);
  if (+card.dataset.n === k) { fill(slot.id, k); K.sparkle(0, 0.4); await FR.yes(slot, 'Fixed! ' + FR.Word(R.a) + ' and ' + FR.word(R.b) + ' make ' + FR.word(R.a + R.b) + '.'); const d = done; done = null; d(R.misses === 0); return; }
  FR.oops(slot); R.misses++;
  if (R.bad === 'w') { await FR.say("Let's look. Count all the slices."); await countAll(); }
  else { const pl = K.plates[R.bad]; K.glowPlate(R.bad); await FR.say("Let's count the " + (R.bad ? 'blue' : 'peach') + ' plate.'); await K.bumpAll(pl.children, i => FR.say(FR.Word(i + 1) + (i === pl.children.length - 1 ? '!' : ','), { noRepeat: true })); }
  await FR.say('Put that number in the circle.'); open();
}
const PLAN = [[3, 1, 'w', 5], [2, 3, 1, 2], [1, 3, 'w', 3], [4, 1, 0, 3], [2, 2, 'w', 5], [1, 4, 1, 3]];   /* [part, part, the wrong circle, Ari's wrong number] */
function play(F, i) {
  return new Promise(async res => {
    const [a, b, bad, said] = PLAN[i]; R = { a, b, bad, misses: 0, stage: 'find' }; done = res; GAME.phase = 'busy'; F.lock(true);
    $('src').hidden = true; K.glowPlate(-1);
    K.setPlates(a, b); ['bw', 'b0', 'b1'].forEach(id => $(id).classList.remove('wrongc')); fill('bw', bad === 'w' ? said : a + b); fill('b0', bad === 0 ? said : a); fill('b1', bad === 1 ? said : b);
    const A = bad === 0 ? said : a, B = bad === 1 ? said : b, W = bad === 'w' ? said : a + b;
    await F.say('Ari says: ' + F.word(A) + ' and ' + F.word(B) + ' make ' + F.word(W) + '!');
    open(); await F.say('Look at the plates. Tap the wrong number.', { repeat: 'One number is wrong. Tap it.' });
  });
}
FR.game({
  id: 'u8-mistake', title: 'Find the Mistake', rounds: 6,
  hero: '<div class="hero6"><img src="art/ari-talk.png" alt=""></div>',
  init() {
    K = mount($('world'), { band });
    $('src').innerHTML = [0, 1, 2, 3, 4, 5].map(n => '<div class="numcard" data-n="' + n + '">' + U5.num(n) + '</div>').join('');
    FR.dragTap({ sources: '#src .numcard', targets: '.bc.empty', drop });
    $('bw').addEventListener('click', () => pick('w')); $('b0').addEventListener('click', () => pick(0)); $('b1').addEventListener('click', () => pick(1));
  },
  demo: async F => {
    R = { a: 2, b: 1, bad: 'w', stage: 'demo' }; K.setPlates(2, 1); fill('bw', 4); fill('b0', 2); fill('b1', 1);
    await F.say('Ari says two and one make four. Watch me check.'); await countAll(); await F.say('Three, not four! I tap the four.');
    await F.handTo($('bw')); await F.handTap(); fill('bw', null); $('src').hidden = false;
    await F.say('Then I put three in.'); await F.handDrag($('src').querySelector('.numcard[data-n="3"]'), $('bw')); fill('bw', 3); await F.say('Two and one make three.');
  },
  round: (F, i) => play(F, i),
  endSay: s => s >= 2 ? 'Ari says thank you! You fixed them all.' : 'Good looking! Let\'s play once more.'
});
</script>
</body>
</html>
