<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Review time — Kindergarten Numbers</title>
<!-- Kindergarten Numbers, Unit 7 REVIEW (Units 4-6 come back in the orchard): Dovid holds up a written number (0 to 10).
     He picks that many apples from the tree for Dovid's blanket, counting each one as it lands, then taps the check.
     The apples sit in rows of five, so six to ten show "five and some more". Zero: no apples at all. -->
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
<link rel="stylesheet" href="frame.css"><link rel="stylesheet" href="unit6.css">
</head>
<body>
<div id="world"></div>
<div id="game" class="locked"><div class="stage s6" id="stage">
  <div class="ui" id="panel">
    <div class="goal" id="goal"></div>
    <button id="check" class="bigbtn btn3d b-sun" aria-label="Check"><svg viewBox="0 0 48 48"><path d="M10 25l9 9 19-20" stroke="#2B2350" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div></div>
<script src="kit.js"></script><script src="frame.js"></script><script src="unit5.js"></script>
<script type="module">
import { mount } from './orchard7.js';
const $ = id => document.getElementById(id);
let O, R, done, busy = Promise.resolve();
const band = () => [innerWidth < 760 ? 80 : 92, $('panel').getBoundingClientRect().top - 8];
function moves(to) { const out = [], c = O.count(0); for (let k = c; k < to; k++) out.push({ tap: '.tspot[data-id="tree"]' }); for (let k = c; k > to; k--) out.push({ tap: '.tspot[data-id="a0-' + (k - 1) + '"]' }); return out; }
function hooks() { GAME.right = () => moves(R.n).concat([{ tap: '#check' }]); GAME.wrong = () => moves(R.n === 10 ? 9 : R.n + 1).concat([{ tap: '#check' }]); }
function open() { GAME.phase = 'answer'; FR.lock(false); hooks(); }
async function check() {
  NK.unlock(); if (GAME.phase !== 'answer') return; GAME.phase = 'busy'; FR.lock(true); await busy; const have = O.count(0);
  if (have === R.n) { O.sparkle(O.sides[0].g.position); await FR.yes($('check'), R.n === 0 ? 'Yes! Zero. No apples at all.' : R.n > 5 ? 'Yes! Five and ' + FR.word(R.n - 5) + ' more. ' + FR.Word(R.n) + '!' : 'Yes! ' + FR.Word(R.n) + '!');
    const d = done; done = null; d(R.misses === 0); return; }
  FR.oops($('check')); R.misses++; await FR.say("Let's look. Count with me.");
  for (let k = 0; k < have; k++) { const a = O.sides[0].apples[k]; await O.bump(a); await FR.say(FR.Word(k + 1) + (k === have - 1 ? '.' : ','), { noRepeat: true }); }
  await FR.say(have < R.n ? 'We need ' + FR.word(R.n) + '. Tap the tree.' : 'We need ' + FR.word(R.n) + '. Put some back.'); open();
}
const PLAN = [3, 7, 0, 5, 9, 6];
function play(F, i) {
  return new Promise(async res => {
    R = { n: PLAN[i], misses: 0 }; done = res; GAME.phase = 'busy'; F.lock(true); O.setApples(0, 0); $('goal').innerHTML = U5.num(R.n);
    await F.say(i === 0 ? 'Dovid shows a number.' : F.pick(['A new number!', 'Look at this number.', 'What number is this?']));
    open(); await F.say(R.n === 0 ? 'This is zero. Show me zero apples. Then check.' : 'Pick that many apples. Then tap the check.', { repeat: 'Tap the tree for each apple. Then tap the check.' });
  });
}
FR.game({
  id: 'u7-review', title: 'Review Time', rounds: 6,
  hero: '<div class="hero6"><img src="art/dovid-happy.png" alt=""></div>',
  init() {
    O = mount($('world'), { kids: ['dovid'], band, stack: true }); O.treeSpot();
    O.onTap = id => { if (GAME.phase !== 'answer') return;
      if (id === 'tree') busy = busy.then(async () => { if (O.count(0) >= 10) return; await O.drop(0); NK.say(FR.Word(O.count(0)) + '!', { noRepeat: true }); });
      else if (id.startsWith('a0-')) busy = busy.then(() => O.take(0)); };
    $('check').addEventListener('click', check);
  },
  demo: async F => {
    R = { n: 2, misses: 0 }; $('goal').innerHTML = U5.num(2); O.setApples(0, 0);
    await F.say('This is two. Watch me pick two.');
    for (let k = 1; k <= 2; k++) { await F.handTo(document.querySelector('.tspot[data-id="tree"]')); await F.handTap(); await O.drop(0); await F.say(F.Word(k) + '!', { noRepeat: true }); }
    await F.handTo($('check')); await F.handTap(); await F.say('Two apples. Two!'); O.setApples(0, 0);
  },
  round: (F, i) => play(F, i),
  endSay: s => s >= 2 ? 'You remember your numbers!' : 'Good work! Let\'s play once more.'
});
</script>
</body>
</html>
