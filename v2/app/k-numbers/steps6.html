<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Big Steps — Kindergarten Numbers</title>
<!-- Kindergarten Numbers, Unit 6 "The path game": BIG STEPS (MAP.md: "stand up and take N steps"). He stands up!
     The card shows footprints (how many steps) and an arrow (forward or back). The footprints light up one by one: "Step!",
     and he takes a real step for each. Then: where is Mendy now? He taps the stone; Mendy hops there saying each number.
     Forward is one more each step; back is one less. A slip: "Don't count Mendy's stone. Count each step." -->
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
<link rel="stylesheet" href="frame.css"><link rel="stylesheet" href="unit6.css">
<style>
.feet{ display:flex; align-items:center; gap:6px; padding:8px 12px; min-height:clamp(84px,12vh,112px); border-radius:24px; background:#fff; box-shadow:0 6px 0 #C9D8EE, 0 10px 18px rgba(30,40,90,.2); }
.feet svg{ width:clamp(40px,6vh,56px); height:auto; opacity:.35; transition:opacity .15s, transform .15s; } .feet svg.on{ opacity:1; transform:translateY(-4px); }
.feet .me{ height:clamp(70px,10vh,96px); width:auto; margin:0 6px; }   /* Mendy's picture starts the footprints: these are HIS steps */
.feet.back{ flex-direction:row-reverse; } .feet .dir{ width:clamp(36px,5vh,48px); opacity:1; }
@media (max-width:760px), (max-aspect-ratio:4/5){ .feet .me{ height:64px; margin:0 2px; } .feet{ min-height:80px; gap:3px; padding:6px 8px; } .feet svg{ width:34px; } .feet .dir{ width:30px; } }
</style>
</head>
<body>
<div id="world"></div>
<div id="game" class="locked"><div class="stage s6" id="stage">
  <div class="ui" id="panel"><div class="feet" id="feet"></div></div>
</div></div>
<script src="kit.js"></script><script src="frame.js"></script><script src="unit5.js"></script>
<script type="module">
import { mount } from './path6.js';
const $ = id => document.getElementById(id);
let P, M, R, done;
const band = () => [innerWidth < 760 ? 80 : 92, $('panel').getBoundingClientRect().top - 8];
const FOOT = '<svg viewBox="0 0 40 60"><ellipse cx="20" cy="36" rx="13" ry="20" fill="#3B2A7A"/><circle cx="9" cy="10" r="4.5" fill="#3B2A7A"/><circle cx="17" cy="6" r="4.5" fill="#3B2A7A"/><circle cx="25" cy="7" r="4" fill="#3B2A7A"/><circle cx="32" cy="12" r="3.5" fill="#3B2A7A"/></svg>';
const ARROW = d => '<svg class="dir" viewBox="0 0 48 48"><path d="' + (d > 0 ? 'M8 24h28M26 12l12 12-12 12' : 'M40 24H12M22 12 10 24l12 12') + '" stroke="' + (d > 0 ? '#22B45E' : '#FF8A3D') + '" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function feet(n, d) { const f = $('feet'); f.className = 'feet' + (d < 0 ? ' back' : ''); f.innerHTML = '<img class="me" src="art/mendy-idle.png" alt="Mendy">' + Array(n).fill(FOOT).join('') + ARROW(d); }
async function stepAlong(n) {   /* the footprints light one by one: he takes a real step for each */
  const fs = $('feet').querySelectorAll('svg:not(.dir)'); fs.forEach(x => x.classList.remove('on'));
  for (let i = 0; i < n; i++) { fs[i].classList.add('on'); NK.sound.pop(); await FR.say('Step!', { noRepeat: true }); await FR.wait(NK.fast ? 20 : 350); }
}
function hooks() { const k = R.to, bad = R.to - R.d;   /* the usual slip: counting Mendy's own stone */
  GAME.right = () => { P.focus(k, true); return [{ tap: '.stone[data-n="' + k + '"]' }]; };
  GAME.wrong = () => { P.focus(bad, true); return [{ tap: '.stone[data-n="' + bad + '"]' }]; }; }
function open() { GAME.phase = 'answer'; FR.lock(false); hooks(); }
async function walk(slow) { M.pose('happy'); await M.hop(R.to, async n => { P.glow(n, true); await FR.say(FR.Word(n) + (n === R.to ? '!' : ','), { noRepeat: true }); if (slow) await FR.wait(250); P.glow(n, false); }); M.pose('idle'); }
async function tap(n, el) {
  if (GAME.phase !== 'answer') return; GAME.phase = 'busy'; FR.lock(true);
  if (n === R.to) { await walk(false); P.petals(n); await FR.yes(el, R.d > 0 ? FR.pick(['Yes! Each step is one more.', 'Right! Great stepping!']) : FR.pick(['Yes! Each step back is one less.', 'Right! Back you go!'])); const d = done; done = null; d(R.misses === 0); return; }
  FR.oops(el); R.misses++;
  if (R.misses === 1) { await FR.say("Let's look. Don't count Mendy's stone. Count each step."); const back = M.n; await walk(true); await FR.wait(300); M.place(back); P.focus((R.from + R.to) / 2);
    await FR.say('Now you find that stone.'); }
  else { P.el(R.to).classList.add('hint'); await FR.say('It is ' + FR.word(R.to) + '. Tap the shining stone.'); }
  open();
}
const PLAN = [[0, 3, 1], [2, 4, 1], [5, 2, 1], [4, 3, 1], [8, 2, -1], [7, 3, -1]];   /* [start, steps, forward or back] */
function play(F, i) {
  return new Promise(async res => {
    const [a, n, d] = PLAN[i]; R = { from: a, n, d, to: a + n * d, misses: 0 }; done = res; GAME.phase = 'busy'; F.lock(true);
    for (let k = 0; k <= 10; k++) P.el(k).classList.remove('hint');
    M.place(a); P.focus((a + R.to) / 2); feet(n, d);
    if (i === 0) await F.say('Stand up! Step with me.');
    await F.say('Mendy is on ' + F.word(a) + '.');
    await F.say(d > 0 ? 'Take ' + F.word(n) + ' big steps forward!' : 'Take ' + F.word(n) + ' big steps back!');
    await stepAlong(n);
    open(); await F.say('Where will Mendy land? Tap that stone.', { repeat: 'Mendy is on ' + F.word(a) + '. ' + FR.Word(n) + ' steps. Where will he land?' });
  });
}
FR.game({
  id: 'u6-steps', title: 'Big Steps', rounds: 6,
  hero: '<div class="hero6"><img src="art/mendy-clap.png" alt=""></div>',
  init() { P = mount($('world'), { kids: ['mendy'], band }); M = P.kids.mendy; P.onStone = (n, el) => tap(n, el); feet(3, 1); },
  reset() { M.place(0); },
  demo: async F => {
    R = { from: 0, n: 3, d: 1, to: 3 }; M.place(0); P.focus(1.5); feet(3, 1);
    await F.say('Watch me. Mendy is on zero.'); await F.say('Three big steps!'); await stepAlong(3);
    await F.say('Where will Mendy land? Three steps from zero is three.'); await F.handTo(P.el(3)); await F.handTap(); await walk(false); P.petals(3); M.place(0);
  },
  round: (F, i) => play(F, i),
  endSay: s => s >= 2 ? 'Great big steps! Sit down now.' : 'Good stepping! Let\'s play once more.'
});
</script>
</body>
</html>
