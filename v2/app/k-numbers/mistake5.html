<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find the Mistake 6 to 10 — Kindergarten Numbers</title>
<!-- Kindergarten Numbers, Unit 5, game 5: FIND THE MISTAKE (6-10). Skill: check 6-10 on a ten-frame as five and some more.
     "Eli says nine!" (his two hands show nine). Thumbs up = right, thumbs down = a mistake; after a mistake he shows the
     right number on two big hands. Wrong judging: the rows light up, "A full row is five, and three more." -->
<link rel="stylesheet" href="frame.css"><link rel="stylesheet" href="unit5.css">
<style>
.stage{ grid-template-columns:1fr 1fr; align-items:center; }
.col{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; height:100%; }
#tfh{ width:min(44vw,520px); }
.says{ position:relative; display:flex; align-items:center; gap:12px; background:#fff; border-radius:30px; border:5px solid #fff; padding:10px 18px 10px 12px; box-shadow:0 8px 0 rgba(40,70,140,.14), 0 14px 22px rgba(40,70,140,.18); }
.says::after{ content:''; position:absolute; left:-18px; top:44%; border:12px solid transparent; border-right:18px solid #fff; }
.says .spk{ width:54px; height:54px; border-radius:50%; background:radial-gradient(circle at 50% 30%,#8BE0FF,#2FB5E8); display:flex; align-items:center; justify-content:center; }
.says .spk svg{ width:30px; height:30px; }
.says .hands2{ width:clamp(170px,32vh,300px); }
.thumbs button{ width:clamp(104px,17vh,140px) !important; }
.fixrow{ display:flex; align-items:center; gap:12px; } .fixrow[hidden], .thumbs[hidden]{ display:none; }
.fixrow .panel .hands2{ width:min(34vw,46vh,420px); }
@media (max-width:760px), (max-aspect-ratio:4/5){ .stage{ grid-template-columns:1fr; grid-template-rows:.7fr 1.3fr; } #tfh{ width:86vw; } .fixrow{ flex-direction:column; } .fixrow .panel .hands2{ width:74vw; } .says .hands2{ width:44vw; } }
</style>
</head>
<body>
<div id="game" class="locked"><div class="stage" id="stage">
  <div class="col"><div id="tfh"></div></div>
  <div class="col">
    <div class="says" id="says"><div class="spk"><svg viewBox="0 0 48 48"><path d="M8 18h8l11-9v30l-11-9H8z" fill="#fff"/><path d="M32 17c3 2 5 4.5 5 7s-2 5-5 7" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></svg></div><div id="claim"></div></div>
    <div class="thumbs" id="thumbs">
      <button class="btn3d b-green" id="up" aria-label="Right"><svg viewBox="0 0 64 64"><path d="M14 30h9v24h-9z" fill="#fff"/><path d="M27 30l9-17c2-4 9-3 8 3l-2 10h11c4 0 6 3 5 7l-4 17c-1 3-3 4-6 4H27z" fill="#fff"/></svg></button>
      <button class="btn3d b-sun" id="down" aria-label="A mistake"><svg viewBox="0 0 64 64" style="transform:rotate(180deg)"><path d="M14 30h9v24h-9z" fill="#2B2350"/><path d="M27 30l9-17c2-4 9-3 8 3l-2 10h11c4 0 6 3 5 7l-4 17c-1 3-3 4-6 4H27z" fill="#2B2350"/></svg></button>
    </div>
    <div class="fixrow" id="fixrow" hidden><div class="panel" id="hp"></div>
      <button id="check" class="dim btn3d b-green" aria-label="Check"><svg viewBox="0 0 48 48"><path d="M10 25l9 9 19-20" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
  </div>
</div></div>
<script src="kit.js"></script><script src="frame.js"></script><script src="unit5.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var T, C, H, R, done, easy = 0, cover = false;
  function ready() { var c = $('check'); c.classList.toggle('dim', H.count() === 0); c.classList.toggle('ready', H.count() > 0 && GAME.phase === 'answer'); }
  function hooks() {
    if (R.stage === 'judge') { var ok = R.claim === R.n; GAME.right = function () { return [{ tap: ok ? '#up' : '#down' }]; }; GAME.wrong = function () { return [{ tap: ok ? '#down' : '#up' }]; }; }
    else { GAME.right = function () { return H.moves(R.n, '#hp').concat([{ tap: '#check' }]); }; GAME.wrong = function () { return H.moves(R.claim, '#hp').concat([{ tap: '#check' }]); }; }
  }
  function some(n) { return n === 10 ? 'Two full rows. Ten!' : 'A full row is five, and ' + FR.word(n - 5) + ' more.'; }
  function finish(first) { var d = done; done = null; d(first); }
  function play(F, i, quick) {
    return new Promise(async function (res) {
      var n = easy > 0 ? F.pick([6, 7]) : F.pick([6, 7, 8, 9, 10]), right = quick ? i === 1 : [false, true, false, true, false, false][i];
      var claim = right ? n : easy > 0 ? n + 2 : (n === 10 ? 9 : n === 6 ? 7 : n + (Math.random() < .5 ? 1 : -1)); if (easy > 0) easy--;
      var who = F.NAMES[(i * 3 + (quick ? 2 : 5)) % F.NAMES.length];
      R = { n: n, claim: claim, who: who, misses: 0, stage: 'judge' }; T.set(n); C.set(claim); $('thumbs').hidden = false; $('fixrow').hidden = true; H.set(0);
      done = function (first) { if (R.misses >= 2 && !quick) easy = 2; res(first); }; GAME.phase = 'busy'; F.lock(true); $('tfh').style.visibility = '';
      if (quick) { await F.say(i === 0 ? 'Bonus! A quick peek.' : 'Peek!'); await F.wait(1500); $('tfh').style.visibility = 'hidden'; }
      await F.say(who + ' says: ' + F.word(claim) + '!', { repeat: who + ' says ' + F.word(claim) + '. Is ' + who + ' right?' });
      GAME.phase = 'answer'; F.lock(false); hooks();
      await F.say('Is ' + who + ' right?', { repeat: who + ' says ' + F.word(claim) + '. Is ' + who + ' right?' });
    });
  }
  async function look(whole) { $('tfh').style.visibility = ''; T.glow(true); await FR.say(whole ? some(R.n) + ' ' + FR.Word(R.n) + '!' : 'A full row is five.'); T.glow(false); }
  async function judge(sayRight) {
    NK.unlock(); if (GAME.phase !== 'answer' || R.stage !== 'judge') return; GAME.phase = 'busy'; FR.lock(true);
    var isRight = R.claim === R.n, who = R.who;
    if (sayRight === isRight) {
      if (isRight) { await FR.yes($('says'), 'Yes! ' + who + ' is right. ' + FR.Word(R.n) + '!'); finish(R.misses === 0); return; }
      NK.sound.yes(); await FR.say('Yes! ' + who + ' made a mistake.');
      R.stage = 'fix'; $('thumbs').hidden = true; $('fixrow').hidden = false; H.set(0); H.lock(false);
      GAME.phase = 'answer'; FR.lock(false); ready(); hooks(); await FR.say('Show the right number.', { repeat: 'Show the right number on two hands.' }); return;
    }
    FR.oops($('says')); R.misses++;
    await FR.say("Let's look again."); await look(R.misses > 1);
    if (R.misses > 1 && isRight) { await FR.say(who + ' is right.'); finish(false); return; }
    await FR.say('Is ' + who + ' right?');
    GAME.phase = 'answer'; FR.lock(false); hooks();
  }
  async function check() {
    NK.unlock(); if (GAME.phase !== 'answer' || R.stage !== 'fix') return; var have = H.count(); if (!have) { FR.say('Raise some fingers first.'); return; }
    GAME.phase = 'busy'; FR.lock(true); H.lock(true);
    if (have === R.n) { await FR.yes($('hp'), 'Yes! ' + FR.Word(R.n) + '. Thank you for helping ' + R.who + '!'); finish(R.misses === 0); return; }
    FR.oops($('hp')); R.misses++; await look(R.misses > 1);
    if (R.misses > 1) { var k = R.n - have; await FR.say(k > 0 ? 'Put ' + FR.word(k) + ' more up.' : 'Put ' + FR.word(-k) + ' down.'); } else await FR.say('Fix your fingers.');
    GAME.phase = 'answer'; FR.lock(false); H.lock(false); ready(); hooks();
  }
  FR.game({
    id: 'u5-mistake', bonusSay: '', title: 'Find the Mistake', rounds: 6,
    hero: '<div id="herotf"></div>',
    init: function (F) {
      var h = U5.frame(8, false); h.el.style.cssText = 'width:100%;margin-top:14%'; $('herotf').appendChild(h.el);
      T = U5.frame(0, false); $('tfh').appendChild(T.el); C = U5.hands(0, false); $('claim').appendChild(C.el);
      H = U5.hands(0, true); $('hp').appendChild(H.el); H.onChange = ready;
      $('up').addEventListener('click', function () { judge(true); }); $('down').addEventListener('click', function () { judge(false); }); $('check').addEventListener('click', check);
    },
    demo: async function (F) {
      R = { n: 8, claim: 9, who: 'Eli', misses: 0, stage: 'demo' }; T.set(8); C.set(9); $('thumbs').hidden = false; $('fixrow').hidden = true;
      await F.say('Eli says: nine!'); await F.say('Is Eli right? Watch me check.');
      T.glow(true); await F.say('A full row is five, and three more. Eight!'); T.glow(false);
      await F.say('Eight, not nine. A mistake!');
      await F.handTo($('down')); await F.handTap(); NK.sound.yes(); await F.say('Thumbs down means a mistake.');
      $('thumbs').hidden = true; $('fixrow').hidden = false; H.set(0); await F.say('Then show the right number. Tap the hands.');
      await F.handTo(H.hands[0].el, .5, .6); for (var t = 1; t <= 5; t++) { await F.handTap(); H.hands[0].set(t); NK.sound.pop(); }
      await F.handTo(H.hands[1].el, .5, .6); for (t = 1; t <= 4; t++) { await F.handTap(); H.hands[1].set(t); NK.sound.pop(); }
      await F.say('Oops, nine. Tap the arrow to put one down.');
      var dn = H.hands[1].el.querySelector('.fdown'); if (dn) await F.handTo(dn); await F.handTap(); H.hands[1].set(3); NK.sound.back();
      await F.handTo($('check')); await F.handTap(); await F.yes($('hp'), 'Eight! Thank you for helping Eli!'); H.set(0);
    },
    round: function (F, i) { return play(F, i, false); },
    bonus: async function (F) { cover = true; for (var b = 0; b < 2; b++) await play(F, b, true); cover = false; }
  });
})();
</script>
</body>
</html>
