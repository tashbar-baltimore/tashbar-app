<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find the Mistake — Kindergarten Numbers</title>
<!-- Kindergarten Numbers, Unit 7 "More, less, the same": FIND THE MISTAKE. Ari is learning too, and makes three kinds of mistakes:
     1. "Spread out" : Dovid's few apples are spread wide, Shmuel's many are close together. Ari says "Dovid has more!" He taps who really has more.
     2. "One more"   : Ari put out one more than Dovid's, but got it wrong. He fixes Shmuel's blanket (tree for more, tap an apple to take one), then check.
     3. "Numbers"    : Ari says "Four is more than six!" He taps the number that is really more.
     Every slip: we line the apples up together, and the leftovers show the answer. -->
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
<link rel="stylesheet" href="frame.css"><link rel="stylesheet" href="unit6.css">
<style>.cardrow{ display:flex; gap:clamp(14px,4vw,40px); align-items:center; } .cardrow .numcard{ cursor:pointer; } .cardrow[hidden], #check[hidden]{ display:none; }
.numcard.good{ box-shadow:0 0 0 6px #22B45E; } .numcard.shake{ animation:shake .45s; }
/* K clarity (rules 9, 11): Ari, who says the mistake, is big enough to see; the numbers he taps are big */
#panel .who img{ height:clamp(84px,14vh,130px); width:auto; } .cardrow .numcard{ width:clamp(110px,min(20vh,34vw),160px); height:clamp(110px,min(20vh,34vw),160px); }</style>
</head>
<body>
<div id="world"></div>
<div id="game" class="locked"><div class="stage s6" id="stage">
  <div class="ui" id="panel">
    <div class="who"><img src="art/ari-talk.png" alt=""></div>
    <div class="cardrow" id="cards" hidden><div class="numcard" id="c0" role="button"></div><div class="numcard" id="c1" role="button"></div></div>
    <button id="check" class="bigbtn btn3d b-sun" aria-label="Check" hidden><svg viewBox="0 0 48 48"><path d="M10 25l9 9 19-20" stroke="#2B2350" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div></div>
<script src="kit.js"></script><script src="frame.js"></script><script src="unit5.js"></script>
<script type="module">
import { mount } from './orchard7.js';
const $ = id => document.getElementById(id);
let O, R, done, busy = Promise.resolve();
const NAME = ['Dovid', 'Shmuel'];
const band = () => [innerWidth < 760 ? 80 : 92, $('panel').getBoundingClientRect().top - 8];
function more() { return O.count(0) > O.count(1) ? 0 : 1; }
function moves(to) { const out = [], c = O.count(1); for (let k = c; k < to; k++) out.push({ tap: '.tspot[data-id="tree"]' }); for (let k = c; k > to; k--) out.push({ tap: '.tspot[data-id="a1-' + (k - 1) + '"]' }); return out; }
function hooks() {
  if (R.kind === 'spread') { const m = more(); GAME.right = () => [{ tap: '.tspot[data-id="side' + m + '"]' }]; GAME.wrong = () => [{ tap: '.tspot[data-id="side' + (1 - m) + '"]' }]; return; }
  if (R.kind === 'fix') { GAME.right = () => moves(R.base + 1).concat([{ tap: '#check' }]); GAME.wrong = () => [{ tap: '#check' }]; return; }
  const m = R.n[0] > R.n[1] ? 0 : 1; GAME.right = () => [{ tap: '#c' + m }]; GAME.wrong = () => [{ tap: '#c' + (1 - m) }];
}
function open() { GAME.phase = 'answer'; FR.lock(false); hooks(); }
function finish() { const d = done; done = null; d(R.misses === 0); }
async function lineUp() {   /* we line them up together: partners join, the leftovers show who has more */
  await FR.say("Let's line them up."); const n = Math.min(O.count(0), O.count(1)); for (let k = 0; k < n; k++) await O.pair(k, k);
  const m = O.count(0) === O.count(1) ? -1 : more(); if (m >= 0) { O.glowSide(m, true); await FR.say(NAME[m] + ' has apples left over. ' + NAME[m] + ' has more!'); O.glowSide(m, false); } O.clearPairs(); O.setApples(0, O.count(0), R.how || 'row'); O.setApples(1, O.count(1), R.how || 'row');
}
async function side(k, el) {
  if (GAME.phase !== 'answer' || R.kind !== 'spread') return; GAME.phase = 'busy'; FR.lock(true); const m = more();
  if (k === m) { O.sparkle(O.sides[m].g.position); await FR.yes(el, 'Yes! Spread out is not more. ' + NAME[m] + ' has more.'); return finish(); }
  FR.oops(el); R.misses++; await FR.say('Look! Spread out does not mean more.'); await lineUp(); await FR.say('Now tap who has more.'); open();
}
async function check() {
  NK.unlock(); if (GAME.phase !== 'answer' || R.kind !== 'fix') return; GAME.phase = 'busy'; FR.lock(true); await busy;
  const w = R.base + 1, have = O.count(1);
  if (have === w) { O.sparkle(O.sides[1].g.position); await FR.yes($('check'), 'Fixed! ' + FR.Word(w) + ' is one more than ' + FR.word(R.base) + '.'); return finish(); }
  FR.oops($('check')); R.misses++; O.glowSide(0, true); await FR.say("Look. Dovid has " + FR.word(R.base) + '. One more is ' + FR.word(w) + '.'); O.glowSide(0, false);
  await FR.say(have < w ? 'Tap the tree for more.' : 'Tap an apple to take it back.'); open();
}
async function card(k) {
  NK.unlock(); if (GAME.phase !== 'answer' || R.kind !== 'nums') return; GAME.phase = 'busy'; FR.lock(true); const m = R.n[0] > R.n[1] ? 0 : 1, el = $('c' + k);
  O.setApples(0, R.n[0], 'row'); O.setApples(1, R.n[1], 'row');
  if (k === m) { await FR.yes(el, 'Yes! ' + FR.Word(R.n[m]) + ' is more. Thank you for helping Ari!'); return finish(); }
  FR.oops(el); R.misses++; await FR.say('Look at the apples.'); await lineUp(); O.setApples(0, 0); O.setApples(1, 0); await FR.say('Which number is more?'); open();
}
const PLAN = [{ kind: 'spread', n: [4, 6] }, { kind: 'fix', base: 4, put: 6 }, { kind: 'nums', n: [4, 6] }, { kind: 'spread', n: [6, 4] }, { kind: 'fix', base: 7, put: 7 }, { kind: 'nums', n: [9, 7] }];
function play(F, i) {
  return new Promise(async res => {
    R = Object.assign({ misses: 0 }, PLAN[i]); done = res; GAME.phase = 'busy'; F.lock(true);
    $('cards').hidden = R.kind !== 'nums'; $('check').hidden = R.kind !== 'fix'; O.unspot('side0'); O.unspot('side1'); O.unspot('tree'); O.clearPairs();
    if (R.kind === 'spread') {
      const few = R.n[0] < R.n[1] ? 0 : 1; R.how = 'row'; O.setApples(0, R.n[0], 'row'); O.setApples(1, R.n[1], 'row');
      O.spread(few, true); O.spread(1 - few, false); O.sideSpot(0); O.sideSpot(1); O.glowSide(few, true);
      await F.say('Ari says: ' + NAME[few] + ' has more! His are spread out.'); O.glowSide(few, false);
      open(); await F.say('Is Ari right? Tap who really has more.', { repeat: 'Tap who really has more.' });
    } else if (R.kind === 'fix') {
      O.setApples(0, R.base, 'row'); O.setApples(1, R.put, 'row'); O.treeSpot();
      await F.say('Ari gave Shmuel one more than Dovid. Oops!'); open();
      await F.say('Fix Shmuel\'s apples. Then tap the check.', { repeat: 'One more than ' + F.word(R.base) + '. Fix it, then check.' });
    } else {
      O.setApples(0, 0); O.setApples(1, 0); $('c0').innerHTML = U5.num(R.n[0]); $('c1').innerHTML = U5.num(R.n[1]);
      const lo = Math.min(...R.n), hi = Math.max(...R.n); await F.say('Ari says: ' + F.word(lo) + ' is more than ' + F.word(hi) + '!');
      open(); await F.say('Show Ari. Tap the number that is more.', { repeat: 'Which is more, ' + F.word(R.n[0]) + ' or ' + F.word(R.n[1]) + '?' });
    }
  });
}
FR.game({
  id: 'u7-mistake', title: 'Find the Mistake', rounds: 6,
  hero: '<div class="hero6"><img src="art/ari-talk.png" alt=""></div>',
  init() {
    O = mount($('world'), { kids: ['dovid', 'shmuel'], band, stack: true, tree: true });
    O.onTap = (id, el) => { if (GAME.phase !== 'answer') return; if (id.startsWith('side')) side(+id[4], el);
      else if (R.kind === 'fix' && id === 'tree') busy = busy.then(() => O.count(1) < 10 ? O.drop(1) : null);
      else if (R.kind === 'fix' && id.startsWith('a1-')) busy = busy.then(() => O.take(1)); };
    $('check').addEventListener('click', check); $('c0').addEventListener('click', () => card(0)); $('c1').addEventListener('click', () => card(1));
  },
  demo: async F => {
    R = { kind: 'demo', misses: 0 }; O.setApples(0, 2, 'row'); O.setApples(1, 3, 'row'); O.spread(0, true); O.spread(1, false);
    await F.say('Ari says Dovid has more. His are spread out. Watch me.'); await lineUp(); await F.say('Spread out is not more!');
  },
  round: (F, i) => play(F, i),
  endSay: s => s >= 2 ? 'Ari says thank you! You found every mistake.' : 'Good looking! Let\'s play once more.'
});
</script>
</body>
</html>
