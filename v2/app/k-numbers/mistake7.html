<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find the Mistake — Kindergarten Numbers</title>
<!-- Kindergarten Numbers, Unit 7 "More, less, the same": FIND THE MISTAKE. Ari is learning too, and makes three kinds of mistakes:
     1. "Spread out" : Dovid's few apples are spread wide, Shmuel's many are close together. Ari says "Dovid has more!" He taps who really has more.
     2. "One more"   : Ari put out one more than Dovid's, but got it wrong. He fixes Shmuel's blanket (the big apple button for more, tap an apple to take one), then check.
     3. "Numbers"    : Ari says "Four is more than six!" He taps the number that is really more.
     Every slip: we line the apples up together, and the leftovers show the answer. -->
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
<link rel="stylesheet" href="frame.css"><link rel="stylesheet" href="unit6.css">
<style>#add svg{ width:84%; height:84%; }   /* the big apple button: the apple fills it (one more apple) */</style>
<style>.cardrow{ display:flex; gap:clamp(14px,4vw,40px); align-items:center; } .cardrow .numcard{ cursor:pointer; } .cardrow[hidden], #check[hidden]{ display:none; }
.numcard.good{ box-shadow:0 0 0 6px #22B45E; } .numcard.shake{ animation:shake .45s; }
/* K clarity (rules 9, 11): Ari, who says the mistake, is big enough to see; the numbers he taps are big */
#panel .who img{ height:clamp(84px,14vh,130px); width:auto; transition:transform .2s; } #ari{ position:relative; }
/* when Ari says something, he grows and a speech bubble shows what he says (a blanket colour or a number: nothing to read) */
#ari.talk img{ transform:scale(1.25) translateY(-8px); }
.bub{ position:absolute; left:78%; bottom:62%; min-width:64px; height:64px; padding:6px 10px; border-radius:20px; background:#fff; display:flex; align-items:center; justify-content:center; gap:6px; box-shadow:0 4px 0 #C9D8EE, 0 8px 14px rgba(30,40,90,.25); z-index:3; }
.bub::after{ content:''; position:absolute; left:8px; bottom:-12px; border:10px solid transparent; border-top-color:#fff; border-left-width:4px; }
.bub[hidden]{ display:none; } .bub svg{ height:48px; width:auto; } .bub .chip{ width:52px; height:34px; border-radius:8px; } .cardrow .numcard{ width:clamp(110px,min(20vh,34vw),160px); height:clamp(110px,min(20vh,34vw),160px); }</style>
</head>
<body>
<div id="world"></div>
<div id="game" class="locked"><div class="stage s6" id="stage">
  <div class="ui" id="panel">
    <div class="who" id="ari"><img src="art/ari-talk.png" alt="Ari"><div class="bub" id="bub" hidden></div></div>
    <div class="cardrow" id="cards" hidden><div class="numcard" id="c0" role="button"></div><div class="numcard" id="c1" role="button"></div></div>
    <button id="add" hidden class="bigbtn btn3d b-white" aria-label="One more apple"><svg viewBox="0 0 48 48"><circle cx="20" cy="29" r="14" fill="#E8322B"/><path d="M20 15c0-4 2-7 5-8" stroke="#7A4A22" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="37" cy="12" r="10" fill="#22B45E"/><path d="M37 6.5v11M31.5 12h11" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/></svg></button>
    <button id="check" class="bigbtn btn3d b-sun" aria-label="Check" hidden><svg viewBox="0 0 48 48"><path d="M10 25l9 9 19-20" stroke="#2B2350" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div></div>
<script src="kit.js"></script><script src="frame.js"></script><script src="unit5.js"></script>
<script type="module">
import { mount } from './orchard7.js';
const $ = id => document.getElementById(id);
let O, R, done, busy = Promise.resolve();
const NAME = ['Dovid', 'Shmuel'];
const band = () => [innerWidth < 760 ? 80 : 92, $('panel').getBoundingClientRect().top - 8];
function more() { return O.count(0) > O.count(1) ? 0 : 1; }
function moves(to) { const out = [], c = O.count(1); for (let k = c; k < to; k++) out.push({ tap: '#add' }); for (let k = c; k > to; k--) out.push({ tap: '.tspot[data-id="a1-' + (k - 1) + '"]' }); return out; }
function hooks() {
  if (R.kind === 'spread') { const m = more(); GAME.right = () => [{ tap: '.tspot[data-id="side' + m + '"]' }]; GAME.wrong = () => [{ tap: '.tspot[data-id="side' + (1 - m) + '"]' }]; return; }
  if (R.kind === 'fix') { GAME.right = () => moves(R.base + 1).concat([{ tap: '#check' }]); GAME.wrong = () => [{ tap: '#check' }]; return; }
  const m = R.n[0] > R.n[1] ? 0 : 1; GAME.right = () => [{ tap: '#c' + m }]; GAME.wrong = () => [{ tap: '#c' + (1 - m) }];
}
function open() { GAME.phase = 'answer'; FR.lock(false); hooks(); O.choose(R.kind === 'spread'); }   /* tap a blanket: both blankets shine */
/* "which number": the apples wait under cloths until we check */
function hide() { O.cover(0, true); O.cover(1, true); O.setApples(0, R.n[0], 'row'); O.setApples(1, R.n[1], 'row'); }
function unhide() { O.cover(0, false); O.cover(1, false); }
/* Ari says something: he grows, and his bubble shows it */
async function ari(html, line) { $('bub').innerHTML = html; $('bub').hidden = false; $('ari').classList.add('talk'); await FR.say(line); $('ari').classList.remove('talk'); $('bub').hidden = true; }
const CHIP = i => '<i class="chip" style="background:' + (i ? '#3D8FE0' : '#FF8A3D') + '"></i>';
function finish() { const d = done; done = null; d(R.misses === 0); }
async function lineUp() {   /* we line them up together: partners join, the leftovers show who has more */
  await FR.say("Let's line them up."); const n = Math.min(O.count(0), O.count(1)); for (let k = 0; k < n; k++) await O.pair(k, k);
  const m = O.count(0) === O.count(1) ? -1 : more(); if (m >= 0) { O.glowSide(m, true); await FR.say(NAME[m] + ' has apples left over. ' + NAME[m] + ' has more!'); O.glowSide(m, false); } O.clearPairs(); O.setApples(0, O.count(0), R.how || 'row'); O.setApples(1, O.count(1), R.how || 'row');
}
async function side(k, el) {
  if (GAME.phase !== 'answer' || R.kind !== 'spread') return; GAME.phase = 'busy'; FR.lock(true); O.choose(false); const m = more();
  if (k === m) { O.sparkle(O.sides[m].g.position); await FR.yes(el, 'Yes! Spread out is not more. ' + NAME[m] + ' has more.'); return finish(); }
  FR.oops(el); R.misses++; await FR.say('Look! Spread out does not mean more.'); await lineUp(); await FR.say('Now tap the blanket with more.'); open();
}
async function check() {
  NK.unlock(); if (GAME.phase !== 'answer' || R.kind !== 'fix') return; GAME.phase = 'busy'; FR.lock(true); await busy;
  const w = R.base + 1, have = O.count(1);
  if (have === w) { O.sparkle(O.sides[1].g.position); await FR.yes($('check'), 'Fixed! ' + FR.Word(w) + ' is one more than ' + FR.word(R.base) + '.'); return finish(); }
  FR.oops($('check')); R.misses++;
  /* round 3 review: the help SHOWS how (as in One more, one less): Dovid's apples on Shmuel's blanket, one drops in, then his own apples come back */
  O.glowSide(0, true); await FR.say("Look. Dovid has " + FR.word(R.base) + '.'); O.glowSide(0, false);
  O.setApples(1, R.base, 'row'); O.glowSide(1, true); await FR.say('The same is ' + FR.word(R.base) + '.');
  await O.drop(1); await FR.say('One more is ' + FR.word(w) + '.'); await FR.wait(500); O.glowSide(1, false); O.setApples(1, have, 'row');
  await FR.say(have < w ? 'Tap the apple button for more.' : 'Tap an apple to take it back.'); open();
}
async function card(k) {
  NK.unlock(); if (GAME.phase !== 'answer' || R.kind !== 'nums') return; GAME.phase = 'busy'; FR.lock(true); const m = R.n[0] > R.n[1] ? 0 : 1, el = $('c' + k);
  unhide();
  if (k === m) { await FR.yes(el, 'Yes! ' + FR.Word(R.n[m]) + ' is more. Thank you for helping Ari!'); return finish(); }
  FR.oops(el); R.misses++; await FR.say('Look at the apples.'); await lineUp(); hide(); await FR.say('Which number is more?'); open();
}
const PLAN = [{ kind: 'spread', n: [4, 6] }, { kind: 'fix', base: 4, put: 6 }, { kind: 'nums', n: [4, 6] }, { kind: 'spread', n: [6, 4] }, { kind: 'fix', base: 7, put: 7 }, { kind: 'nums', n: [9, 7] }];
function play(F, i) {
  return new Promise(async res => {
    R = Object.assign({ misses: 0 }, PLAN[i]); done = res; GAME.phase = 'busy'; F.lock(true);
    $('cards').hidden = R.kind !== 'nums'; $('check').hidden = $('add').hidden = R.kind !== 'fix'; O.unspot('side0'); O.unspot('side1'); O.clearPairs(); O.choose(false); O.cover(0, false); O.cover(1, false);
    if (R.kind === 'spread') {
      const few = R.n[0] < R.n[1] ? 0 : 1; R.how = 'row'; O.setApples(0, R.n[0], 'row'); O.setApples(1, R.n[1], 'row');
      O.spread(few, true); O.spread(1 - few, false); O.sideSpot(0); O.sideSpot(1); O.glowSide(few, true);
      await ari(CHIP(few), 'Ari says: ' + NAME[few] + ' has more! His are spread out.'); O.glowSide(few, false);
      open(); await F.say('Is Ari right? Tap the blanket that really has more.', { repeat: 'Tap the blanket that really has more.' });
    } else if (R.kind === 'fix') {
      if (i === 1) {   /* the first time: watch me fix one */
        O.setApples(0, 2, 'row'); O.setApples(1, 4, 'row'); $('add').hidden = $('check').hidden = false;
        await F.say('Watch me. Dovid has two. One more is three.'); await F.handTo(document.querySelector('.tspot[data-id="a1-3"]')); await F.handTap(); await O.take(1);
        await F.say('Shmuel had four. I take one away. Three!'); await F.handTo($('check')); await F.handTap(); F.handHide(); await F.say('Now you!'); }
      O.setApples(0, R.base, 'row'); O.setApples(1, R.put, 'row');
      await ari(CHIP(1), 'Ari tried to give Shmuel one more than Dovid.'); O.glowSide(0, true); await F.say('Dovid has ' + F.word(R.base) + '. Oops! Shmuel has ' + F.word(R.put) + '.'); O.glowSide(0, false); open();
      await F.say('Fix Shmuel\'s apples. Then tap the check.', { repeat: 'One more than ' + F.word(R.base) + '. Fix it, then check.' });
    } else {
      if (i === 2) {   /* the first time: watch me check a number */
        const keep = R.n; R.n = [3, 5]; hide(); $('c0').innerHTML = U5.num(3); $('c1').innerHTML = U5.num(5);
        await F.say('Watch me. Three or five? Five comes later. Five is more!'); await F.handTo($('c1')); await F.handTap(); F.handHide();
        O.cover(0, false); O.cover(1, false); await F.say('See? Shmuel has more apples. Now you!'); R.n = keep; }
      hide(); $('c0').innerHTML = U5.num(R.n[0]); $('c1').innerHTML = U5.num(R.n[1]);
      const lo = Math.min(...R.n), hi = Math.max(...R.n); await ari(U5.num(lo), 'Ari says: ' + F.word(lo) + ' is more than ' + F.word(hi) + '!');
      open(); await F.say('Show Ari. Tap the number that is more.', { repeat: 'Which is more, ' + F.word(R.n[0]) + ' or ' + F.word(R.n[1]) + '?' });
    }
  });
}
FR.game({
  id: 'u7-mistake', title: 'Find the Mistake', rounds: 6,
  hero: '<div class="hero6"><img src="art/ari-talk.png" alt=""></div>',
  init() {
    O = mount($('world'), { kids: ['dovid', 'shmuel'], band, stack: true });
    $('add').addEventListener('click', () => { NK.unlock(); if (GAME.phase !== 'answer' || R.kind !== 'fix') return; busy = busy.then(() => O.count(1) < 10 ? O.drop(1) : null); });
    O.onTap = (id, el) => { if (GAME.phase !== 'answer') return; if (id.startsWith('side')) side(+id[4], el);
      else if (R.kind === 'fix' && id.startsWith('a1-')) busy = busy.then(() => O.take(1)); };
    $('check').addEventListener('click', check); $('c0').addEventListener('click', () => card(0)); $('c1').addEventListener('click', () => card(1));
  },
  demo: async F => {
    R = { kind: 'demo', misses: 0 }; O.setApples(0, 2, 'row'); O.setApples(1, 3, 'row'); O.spread(0, true); O.spread(1, false);
    await F.say('Dovid has the orange blanket. Shmuel has the blue one.');
    await F.say('Ari says Dovid has more. His are spread out. Watch me.'); await lineUp(); await F.say('Spread out is not more!');
  },
  round: (F, i) => play(F, i),
  endSay: s => s >= 2 ? 'Ari says thank you! You found every mistake.' : 'Good looking! Let\'s play once more.'
});
</script>
</body>
</html>
