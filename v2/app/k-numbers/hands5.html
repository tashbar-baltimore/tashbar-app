<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two Hands — Kindergarten Numbers</title>
<!-- Kindergarten Numbers, Unit 5, game 3: TWO HANDS. Skill: 6-10 on two hands, five and some more.
     A ten-frame flashes under the cloth; he raises the same number on two big hands (first hand all five, then the second)
     and on his own hands. First mistake: look again (one whole hand is five); second: "Eight is five and three. Put one down." -->
<link rel="stylesheet" href="frame.css"><link rel="stylesheet" href="unit5.css">
<style>
.stage{ grid-template-columns:1fr 1.2fr; align-items:center; }
.left, .right{ display:flex; align-items:center; justify-content:center; height:100%; gap:14px; }
.right{ flex-direction:column; }
#flash.qcard{ width:min(40vw,60vh,420px); display:flex; align-items:center; justify-content:center; }
#flash .tf{ width:88%; }
.right .panel .hands2{ width:min(46vw,64vh,560px); }
@media (max-width:760px), (max-aspect-ratio:4/5){ .stage{ grid-template-columns:1fr; grid-template-rows:.75fr 1.25fr; } #flash.qcard{ width:min(70vw,28vh); } .right .panel .hands2{ width:76vw; } .right .panel{ margin:0 auto; } }
</style>
</head>
<body>
<div id="game" class="locked"><div class="stage" id="stage">
  <div class="left"><div class="qcard flash" id="flash"><div class="cloth"><div class="eyes"><i></i><i></i></div></div></div></div>
  <div class="right"><div class="panel" id="hp"></div>
    <button id="check" class="dim btn3d b-green" aria-label="Check"><svg viewBox="0 0 48 48"><path d="M10 25l9 9 19-20" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
</div></div>
<script src="kit.js"></script><script src="frame.js"></script><script src="unit5.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var H, F5, R, done, plan, slow = 0, easy = 0;
  function cloth(open) { $('flash').classList.toggle('open', open); if (open) NK.sound.cloth(); }
  function ready() { var c = $('check'); c.classList.toggle('dim', H.count() === 0); c.classList.toggle('ready', H.count() > 0 && GAME.phase === 'answer'); }
  function hooks() { GAME.right = function () { return H.moves(R.n, '#hp').concat([{ tap: '#check' }]); }; GAME.wrong = function () { return H.moves(R.n === 10 ? 9 : R.n + 1, '#hp').concat([{ tap: '#check' }]); }; }
  async function check() {
    NK.unlock(); if (GAME.phase !== 'answer') return; var have = H.count(); if (!have) { FR.say('Raise some fingers first.'); return; }
    GAME.phase = 'busy'; FR.lock(true); H.lock(true);
    if (have === R.n) { cloth(true); await FR.yes($('hp'), R.misses ? 'Yes! ' + FR.Word(R.n) + '!' : 'Yes! ' + FR.Word(R.n) + ' is five and ' + FR.word(R.n - 5) + '.'); if (!R.misses) slow = Math.max(0, slow - 1); if (R.misses >= 2) easy = 2; var d = done; done = null; d(R.misses === 0); return; }
    FR.oops($('hp')); R.misses++; if (R.misses === 1) slow = Math.min(3, slow + 1);
    cloth(true); F5.glow(true);
    if (R.misses === 1) { await FR.say("Let's look again. One whole hand is five."); await FR.wait(700); cloth(false); F5.glow(false); await FR.say('Fix your fingers.'); }
    else { await FR.say(FR.Word(R.n) + ' is five and ' + FR.word(R.n - 5) + '. You have ' + FR.word(have) + '.'); var k = R.n - have; await FR.say(k > 0 ? 'Put ' + FR.word(k) + ' more up.' : 'Put ' + FR.word(-k) + ' down.'); F5.glow(false); }
    GAME.phase = 'answer'; FR.lock(false); H.lock(false); ready(); hooks();
  }
  FR.game({
    id: 'u5-hands', title: 'Two Hands', rounds: 6,
    hero: '<div id="herohands"></div>',
    init: function (F) {
      var hh = U5.hands(7, false); hh.el.style.cssText = 'width:100%;margin-top:6%'; $('herohands').appendChild(hh.el);
      H = U5.hands(0, true); $('hp').appendChild(H.el); H.onChange = ready; H.lock(true);
      F5 = U5.frame(0, false); $('flash').insertBefore(F5.el, $('flash').firstChild); $('check').addEventListener('click', check);
    },
    reset: function (F, again) { plan = F.shuffle([6, 7, 8, 9, 10]).concat([F.pick([6, 7, 8])]); if (!again) { slow = 0; easy = 0; } },
    demo: async function (F) {
      R = { n: 7, misses: 0 }; F5.set(7); H.set(0); cloth(false);
      await F.say('A ten-frame hides under the cloth.');
      await F.say('Peek, then show it on two hands. Watch me.');
      cloth(true); await F.wait(1400); cloth(false); await F.wait(400);
      await F.say('A full row and two more. Seven!');
      await F.say('Tap the hand. One finger goes up each tap.');
      await F.handTo(H.hands[0].el, .5, .6);
      for (var t = 1; t <= 5; t++) { await F.handTap(); H.hands[0].set(t); NK.sound.pop(); await F.wait(120); }
      await F.say('One whole hand is five.');
      await F.handTo(H.hands[1].el, .5, .6);
      for (var i = 1; i <= 3; i++) { await F.handTap(); H.hands[1].set(i); NK.sound.pop(); await F.wait(120); }
      await F.say('Oops, too many! Tap the arrow to put one down.');
      var dn = H.hands[1].el.querySelector('.fdown'); if (dn) await F.handTo(dn); await F.handTap(); H.hands[1].set(2); NK.sound.back();
      await F.handTo($('check')); await F.handTap(); cloth(true);
      await F.yes($('hp'), 'Five and two. Seven!');
      await F.say('Show me on your hands too!');
    },
    bonus: async function (F) { var ns = F.shuffle([7, 8, 9]); for (var b = 0; b < 2; b++) { plan[6 + b] = ns[b]; slow = -3; await this.round(F, 6 + b); } slow = 0; },
    round: function (F, i) {
      return new Promise(async function (res) {
        var n = easy > 0 && i < 6 ? FR.pick([6, 7]) : plan[i], longer = easy > 0 && i < 6 ? 500 : 0; if (easy > 0 && i < 6) easy--; R = { n: n, misses: 0 }; H.set(0); H.lock(true); GAME.phase = 'flash'; F.lock(true); ready();
        cloth(false); await F.wait(380); F5.set(n);
        await F.say('Peek!', { repeat: 'How many? Show me on two hands.' });
        cloth(true); await F.wait(1400 + slow * 150 + longer); cloth(false); await F.wait(380);
        done = res; GAME.phase = 'answer'; F.lock(false); H.lock(false); ready(); hooks();
        if (i < 2) await F.say('How many? Show me on two hands.');
      });
    }
  });
})();
</script>
</body>
</html>
