<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Match it! — Kindergarten Numbers</title>
<!-- Kindergarten Numbers, Unit 1, game 2: MATCH IT! Skill: the same amount looks different but is still the same (dice, fruit,
     Shabbos candles, fingers). He drags (or taps) each top card onto the bottom card with the same amount. Seeing, not counting:
     a mistake lights up the shape ("Two and one."), and a second mistake says the whole shape. -->
<link rel="stylesheet" href="frame.css">
<style>
.stage{ grid-template-rows:1fr auto 1fr; align-items:center; justify-items:center; }
.row3{ display:flex; gap:clamp(14px,4vw,56px); justify-content:center; width:100%; }
.row3 .qcard{ width:min(22vw,34vh,240px); transition:transform .2s, opacity .3s; }
.row3.src .qcard{ cursor:grab; }
.mid{ display:flex; align-items:center; gap:10px; opacity:.9; }
.mid svg{ width:64px; height:64px; }
.qcard.done.src{ opacity:.0; }
.qcard.done{ border-color:#7BE0A4; background:radial-gradient(circle at 50% 35%,#FFFFFF,#E3FBEB); }
.qcard .tick{ position:absolute; right:-10px; top:-10px; width:44px; height:44px; }
.hero .qcard{ position:absolute; width:46%; }
@media (max-width:760px), (max-aspect-ratio:4/5){ .stage{ grid-template-rows:none; grid-template-columns:1fr auto 1fr; } .row3{ flex-direction:column; gap:12px; width:auto; } .row3 .qcard{ width:min(40vw,25vh); border-radius:22px; } .mid{ transform:rotate(-90deg); } .mid svg{ width:36px; height:36px; } }
</style>
</head>
<body>
<div id="game" class="locked"><div class="stage" id="stage">
  <div class="row3 src" id="src"></div>
  <div class="mid"><svg viewBox="0 0 48 48"><path d="M24 6v32M12 26l12 12 12-12" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 6v32M12 26l12 12 12-12" stroke="#2FB5E8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="row3 tgt" id="tgt"></div>
</div></div>
<script src="kit.js"></script>
<script src="frame.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var PAIRS = [['dots', 'apple'], ['apple', 'fingers'], ['dots', 'candle'], ['candle', 'fingers'], ['fingers', 'dots'], ['orange', 'dots']];
  var NAME = { dots: ['dot', 'dots'], apple: ['apple', 'apples'], orange: ['orange', 'oranges'], candle: ['candle', 'candles'], fingers: ['finger', 'fingers'] };
  function nm(k, n) { return NAME[k][n === 1 ? 0 : 1]; }
  var easy = 0;
  var R;   /* this round: { nums, a, b, misses, left } */

  function deal(nums, a, b) {
    var src = $('src'), tgt = $('tgt'); src.innerHTML = ''; tgt.innerHTML = '';
    var order; do { order = FR.shuffle([0, 1, 2]); } while (order[0] === 0 && order[1] === 1);
    nums.forEach(function (n, i) { var c = FR.card(n, a); c.id = 's' + i; c.classList.add('src'); src.appendChild(c); });
    var spare = [1, 2, 3, 4, 5].filter(function (x) { return nums.indexOf(x) < 0 && Math.abs(x - nums[0]) <= 2; })[0] || [1, 2, 3, 4, 5].filter(function (x) { return nums.indexOf(x) < 0; })[0];
    var tn = nums.slice(); tn.push(spare); var to = FR.shuffle([0, 1, 2, 3]);
    to.forEach(function (k, i) { var c = FR.card(tn[k], b); c.id = 't' + i; tgt.appendChild(c); });
  }
  function hooks() {
    var open = [].slice.call(document.querySelectorAll('#src .qcard:not(.done)'));
    if (!open.length) { GAME.right = GAME.wrong = null; return; }
    var s = open[0], n = s.dataset.n, ts = [].slice.call(document.querySelectorAll('#tgt .qcard:not(.done)'));
    var good = ts.filter(function (t) { return t.dataset.n === n; })[0], bad = ts.filter(function (t) { return t.dataset.n !== n; })[0];
    GAME.right = function () { return [{ drag: ['#' + s.id, '#' + good.id] }]; };
    GAME.wrong = bad ? function () { return [{ drag: ['#' + s.id, '#' + bad.id] }]; } : null;
  }

  var done;
  async function drop(s, t) {
    if (GAME.phase !== 'answer') return; GAME.phase = 'busy'; FR.lock(true);
    var n = +s.dataset.n;
    if (s.dataset.n === t.dataset.n) {
      s.classList.add('done'); t.classList.add('done'); t.insertAdjacentHTML('beforeend', '<svg class="tick" viewBox="0 0 100 100"><use href="#nkStar"/></svg>');
      await FR.yes(t, FR.Word(n) + ' ' + nm(s.dataset.kind, n) + '. ' + FR.Word(n) + ' ' + nm(t.dataset.kind, n) + '. Same!');
      R.left--;
    } else {
      FR.oops(t); R.misses++; if (R.misses === 2) easy = 2;
      var tn = +t.dataset.n; await FR.say('That one has ' + FR.word(tn) + '.');
      if (R.misses === 1 || R.misses % 2 === 1) { await FR.say("Let's look again."); await FR.showShape(s, false); await FR.say('Find the same.'); }
      else { await FR.showShape(s, true); await FR.say('Now find ' + FR.word(n) + '.'); }
    }
    FR.lock(false); GAME.phase = 'answer'; hooks();
    if (R.left === 0 && done) { var d = done; done = null; d(R.misses === 0); }
  }

  FR.game({
    id: 'match', title: 'Match it!', rounds: 5, bonusSay: 'Bonus! Big numbers!',
    hero: '<div class="qcard dice" style="left:2%;top:10%;transform:rotate(-8deg)"><i class="dot" style="left:30%;top:30%"></i><i class="dot" style="left:70%;top:30%"></i><i class="dot" style="left:50%;top:70%"></i></div>' +
          '<div class="qcard" style="right:2%;top:22%;transform:rotate(7deg)"><svg class="q" viewBox="0 0 100 100" style="left:50%;top:28%"><use href="#nkApple"/></svg><svg class="q" viewBox="0 0 100 100" style="left:28%;top:70%"><use href="#nkApple"/></svg><svg class="q" viewBox="0 0 100 100" style="left:72%;top:70%"><use href="#nkApple"/></svg></div>',
    init: function (F) { F.dragTap({ sources: '#src .qcard', targets: '#tgt .qcard', drop: drop }); },
    demo: async function (F) {
      deal([2, 1, 3], 'dots', 'apple');
      await F.say('Look! Same amount, different things.');
      await F.say('Watch me find the same.');
      var t = [].filter.call(document.querySelectorAll('#tgt .qcard'), function (c) { return c.dataset.n === '2'; })[0];
      await F.handDrag($('s0'), t);
      $('s0').classList.add('done'); t.classList.add('done');
      await F.yes(t, 'Two dots. Two apples. Same!');
    },
    reset: function (F, again, slow) { easy = slow ? 5 : 0; },
    bonus: function (F) {
      return new Promise(function (res) {
        R = { nums: [3, 4, 5], misses: 0, left: 3 }; deal(F.shuffle([3, 4, 5]), 'fingers', 'candle');
        done = res; GAME.phase = 'answer'; F.lock(false); hooks(); F.say('Big numbers! Fingers and candles.');
      });
    },
    round: function (F, i) {
      return new Promise(function (res) {
        var pool = (i < 2 || easy > 0) ? [1, 2, 3] : FR.shuffle([1, 2, 3, 4, 5]).slice(0, 3); if (easy > 0) easy--;
        var nums = FR.shuffle(pool).slice(0, 3), pr = PAIRS[i % PAIRS.length];
        R = { nums: nums, misses: 0, left: 3 }; deal(nums, pr[0], pr[1]);
        done = res; GAME.phase = 'answer'; F.lock(false); hooks();
        F.say(i === 0 ? 'Drag each card to the same amount.' : 'Find the same amount.', { repeat: 'Drag each card to the same amount.' });
      });
    }
  });
})();
</script>
</body>
</html>
