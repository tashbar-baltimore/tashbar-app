<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Show Me 0 to 5 — Kindergarten Numbers</title>
<!-- Kindergarten Numbers, Unit 4 MASTERY CHECK: one item for each number 0-5, in mixed order, three ways:
     BUILD it on the five-frame (he hears it and sees the written number), SHOW it on the fingers (he sees the written number),
     and PLACE the written number on its group (drag the right number of three onto the group). No hints during the check;
     after a miss we look at the right answer together and go on. 5 of 6 = Unit 4 is done. -->
<link rel="stylesheet" href="frame.css">
<link rel="stylesheet" href="unit4.css">
<style>
.stage{ grid-template-columns:.8fr 1.4fr; align-items:center; }
.col{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; height:100%; }
#prompt .numcard{ width:min(22vw,44vh,250px); }
#prompt .qcard{ width:min(30vw,46vh,330px); }
#work .ff{ width:min(52vw,84vh,600px); }
.bighand{ background:radial-gradient(circle at 50% 35%,#FFFFFF,#EAF3FF); border-radius:36px; border:6px solid #fff; box-shadow:0 10px 0 rgba(40,70,140,.14); padding:8px; }
.bighand .fhand{ width:min(26vw,46vh,300px); aspect-ratio:170/230; }
.srcs{ display:flex; gap:clamp(12px,3vw,40px); }
.srcs .numcard{ width:min(15vw,24vh,170px); cursor:grab; }
#check[hidden]{ display:none; }
.hero{ display:flex; align-items:center; justify-content:center; }
.hero svg{ width:60%; height:auto; }
@media (max-width:760px), (max-aspect-ratio:4/5){ .stage{ grid-template-columns:1fr; grid-template-rows:.8fr 1.2fr; } #prompt .numcard{ width:min(36vw,22vh); } #prompt .qcard{ width:min(52vw,26vh); } #work .ff{ width:92vw; } .bighand .fhand{ width:min(44vw,30vh); } .srcs .numcard{ width:26vw; } }
</style>
</head>
<body>
<div id="game" class="locked"><div class="stage" id="stage">
  <div class="col" id="prompt"></div>
  <div class="col"><div id="work"></div>
    <button id="check" class="btn3d b-green" aria-label="Check"><svg viewBox="0 0 48 48"><path d="M10 25l9 9 19-20" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
</div></div>
<script src="kit.js"></script>
<script src="frame.js"></script>
<script src="unit4.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var KINDS = ['apple', 'dots', 'orange', 'candle', 'pear', 'dots'], plan, R, done, W;
  function end(right) { var d = done; done = null; d(right); }
  async function missed() {
    FR.oops($('work')); await FR.say("Let's look.");
    if (R.task === 'build') { W.set(R.n); await FR.say(R.n === 0 ? 'Zero: all empty.' : FR.Word(R.n) + ' on the frame.'); }
    else if (R.task === 'show') { W.set(R.n); await FR.say(R.n === 0 ? 'Zero: no fingers up.' : FR.Word(R.n) + ' fingers.'); }
    else await FR.say('That group has ' + FR.word(R.n) + '.');
    end(false);
  }
  async function check() {
    NK.unlock(); if (GAME.phase !== 'answer' || R.task === 'place') return; GAME.phase = 'busy'; FR.lock(true); W.lock(true);
    if (W.count() === R.n) { await FR.yes($('work'), FR.pick(['Yes!', 'Right!', 'Good!'])); end(true); } else await missed();
  }
  async function drop(s, t) {
    if (GAME.phase !== 'answer' || R.task !== 'place') return; GAME.phase = 'busy'; FR.lock(true);
    if (+s.dataset.n === R.n) { s.classList.add('done'); await FR.yes(t, FR.pick(['Yes!', 'Right!'])); end(true); } else await missed();
  }
  function hooks() {
    if (R.task === 'place') { var good = [].filter.call(document.querySelectorAll('.srcs .numcard'), function (c) { return +c.dataset.n === R.n; })[0], bad = [].filter.call(document.querySelectorAll('.srcs .numcard'), function (c) { return +c.dataset.n !== R.n; })[0];
      GAME.right = function () { return [{ drag: ['#' + good.id, '#target'] }]; }; GAME.wrong = function () { return [{ drag: ['#' + bad.id, '#target'] }]; }; return; }
    var sel = R.task === 'build' ? function (i) { return '#work .box[data-b="' + i + '"]'; } : function (i) { return '#work .fg[data-f="' + i + '"]'; };
    var mv = R.task === 'build' ? function (m) { return W.moves(m); } : function (m) { return FR.fingerMoves(W, m); };
    GAME.right = function () { return mv(R.n).map(function (i) { return { tap: sel(i) }; }).concat([{ tap: '#check' }]); };
    GAME.wrong = function () { return mv(R.n === 5 ? 4 : R.n + 1).map(function (i) { return { tap: sel(i) }; }).concat([{ tap: '#check' }]); };
  }
  FR.game({
    id: 'u4-check', title: 'Show Me 0 to 5', rounds: 6,
    hero: '<svg viewBox="0 0 100 100"><path d="M30 14h40v18c0 14-9 24-20 24S30 46 30 32z" fill="url(#nkGold)" stroke="#C26A00" stroke-width="4"/><path d="M30 20H18c0 12 6 18 14 18M70 20h12c0 12-6 18-14 18" fill="none" stroke="#C26A00" stroke-width="4"/><rect x="44" y="56" width="12" height="14" fill="url(#nkGold)" stroke="#C26A00" stroke-width="4"/><rect x="32" y="70" width="36" height="12" rx="4" fill="url(#nkGold)" stroke="#C26A00" stroke-width="4"/><circle cx="42" cy="26" r="4" fill="#fff" opacity=".9"/></svg>',
    init: function (F) { $('check').addEventListener('click', check); F.dragTap({ sources: '.srcs .numcard', targets: '#target', drop: drop }); },
    reset: function (F) { plan = F.shuffle([0, 1, 2, 3, 4, 5]); },
    demo: async function (F) { await F.say("Let's show what you know!"); await F.say('Build it, show it, or match it.'); },
    endSay: function (s) { return s >= 2 ? 'Unit four is done! You know zero to five!' : 'Good try! Let\'s practice and try again.'; },
    round: function (F, i) {
      return new Promise(async function (res) {
        var n = plan[i], task = ['build', 'show', 'place'][i % 3]; R = { n: n, task: task }; GAME.phase = 'busy'; F.lock(true);
        $('prompt').innerHTML = ''; $('work').innerHTML = ''; $('check').hidden = task === 'place';
        if (task === 'place') {
          var g = F.card(n, KINDS[i]); g.id = 'target'; $('prompt').appendChild(g);
          var others = F.shuffle([0, 1, 2, 3, 4, 5].filter(function (x) { return x !== n; })).slice(0, 2), opts = F.shuffle([n].concat(others)), box = document.createElement('div'); box.className = 'srcs';
          opts.forEach(function (x, k) { var c = U4.numCard(x); c.id = 'o' + k; box.appendChild(c); }); $('work').appendChild(box);
          done = res; GAME.phase = 'answer'; F.lock(false); hooks();
          await F.say('Drag the number that tells how many.', { repeat: 'Drag the number that tells how many.' });
          return;
        }
        var c = U4.numCard(n); $('prompt').appendChild(c);
        if (task === 'build') { W = U4.frame5(0, true); $('work').appendChild(W.el); }
        else { var b = document.createElement('div'); b.className = 'bighand'; W = F.fingers(0, true); b.appendChild(W.el); $('work').appendChild(b); }
        W.lock(false);
        done = res; GAME.phase = 'answer'; F.lock(false); hooks();
        await F.say(task === 'build' ? 'Build ' + F.word(n) + ' on the frame.' : 'Show this number on the fingers.', { repeat: task === 'build' ? 'Build ' + F.word(n) + ' on the frame.' : 'Show this number on the fingers.' });
      });
    }
  });
})();
</script>
</body>
</html>
