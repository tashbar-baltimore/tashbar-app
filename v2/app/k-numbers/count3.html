<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Touch and Count — Kindergarten Numbers</title>
<!-- Kindergarten Numbers, Unit 3, game 1: TOUCH AND COUNT. Skill: touch each thing once while saying the numbers in order,
     and the last number tells how many (Gelman & Gallistel's counting rules). He taps each siddur; it hops onto the shelf as the
     voice counts with him; then he shows how many on two hands and presses the check. A miss: we count the shelf together
     ("the last number!"); a second miss also says how to fix the fingers. Slow: a neat line up to 5. Quick: a bonus loose bunch of 9-10. -->
<link rel="stylesheet" href="frame.css">
<link rel="stylesheet" href="unit3.css">
</head>
<body>
<div id="game" class="locked"><div class="stage" id="stage">
  <div class="scene" id="scene"></div>
  <div class="panel"><div id="hands"></div>
    <button id="check" class="dim btn3d b-green" aria-label="Check"><svg viewBox="0 0 48 48"><path d="M10 25l9 9 19-20" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
</div></div>
<script src="kit.js"></script>
<script src="frame.js"></script>
<script src="unit3.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); }, U = U3, H, easy = 0, misses = 0;
  var PLAN = [3, 4, 5, 6, 7];
  FR.game({
    id: 'u3-touch', title: 'Touch and Count', rounds: 5,
    hero: '<svg viewBox="0 0 100 100"><use href="#u3Siddur"/></svg><svg viewBox="0 0 100 100"><use href="#u3Siddur"/></svg><svg viewBox="0 0 100 100"><use href="#u3Siddur"/></svg>',
    init: function (F) { U.addArt(); H = U.hands($('hands')); H.lock(true); },
    reset: function (F, again, slow) { easy = slow ? 3 : 0; misses = 0; },   /* he did not pass last time: start on the easier path */
    demo: async function (F) {
      U.clear(); var sh = document.createElement('div'); sh.className = 'shelf'; $('scene').appendChild(sh);
      var pts = U.line(3, 72), slots = U.line(3, 25), els = [0, 1, 2].map(function (i) { return U.put('siddur', pts[i], U.size(3), i, 'cnt'); });
      await F.say('Tatty needs the siddurim on the shelf.');
      await F.say('Watch me. Touch it, say it, move it.');
      for (var i = 0; i < 3; i++) { await F.handTo(els[i]); await F.handTap(); U.place(els[i], slots[i]); NK.sound.pop(); await F.say(F.Word(i + 1) + '!', { noRepeat: true }); }
      await F.say('Three! The last number tells how many.');
      for (i = 0; i < 3; i++) { var f = H.a.finger(i); await F.handTo(f, .5, .25); await F.handTap(); f.classList.remove('down'); NK.sound.pop(); }
      await F.handTo($('check')); await F.handTap();
      await F.yes($('hands'), 'Three siddurim!'); H.set(0);
    },
    round: async function (F, i) {
      var help = easy > 0, n = help ? F.pick([3, 4, 5]) : PLAN[i], line = help || i < 3; if (easy > 0) easy--;
      if (i === 2 && !help) { await U.silentDemo(F, 'siddur'); await F.say('Now you count by yourself!'); }
      if (i === 4 && !help) await F.say('New way! The books stay on the shelf.');
      /* the voice counts with him only in rounds 1-2, or as help after two misses; later he counts by himself (a soft pop per tap) */
      var first = await U.countRound(F, { n: n, kind: 'siddur', line: line, H: H, silent: !(i < 2 || help), stay: i === 4 && !help, intro: i < 3 || help || i === 4 });
      if (!first) { misses++; if (misses >= 2) { easy = 2; misses = 0; } } else misses = 0;
      return first;
    },
    bonus: async function (F) { await U.countRound(F, { n: F.pick([9, 10]), kind: 'siddur', line: false, H: H, silent: true }); }
  });
})();
</script>
</body>
</html>
