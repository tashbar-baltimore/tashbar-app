<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mendy's Mistake — Kindergarten Numbers</title>
<!-- Kindergarten Numbers, Unit 2, game 4: FIND THE MISTAKE. Skill: hear when the counting words are out of order.
     Mendy counts along the stones (the ball hops with each word). Did he skip a number, say one twice, or mix two up?
     He taps the stone where Mendy went wrong, or the thumbs up when Mendy counted right. Then we count it right together.
     Mistake: listen again (Mendy counts again); second time the stone glows and we say why. -->
<link rel="stylesheet" href="frame.css">
<link rel="stylesheet" href="u2.css">
<style>
.stage{ grid-template-rows:auto 1fr auto; }
.okrow{ display:flex; justify-content:center; }
#ok{ width:clamp(104px,16vh,136px); aspect-ratio:1; border-radius:50%; display:flex; align-items:center; justify-content:center; }
#ok svg{ width:60%; height:60%; position:relative; }
#path .u2stone.tapme{ cursor:pointer; }
</style>
</head>
<body>
<div id="game" class="locked"><div class="stage" id="stage">
  <div class="carrow" id="carrow"></div>
  <div id="path"></div>
  <div class="okrow"><button class="btn3d b-green" id="ok" aria-label="Mendy is right"><svg viewBox="0 0 64 64"><path d="M14 30h9v24h-9z" fill="#fff"/><path d="M27 30l9-17c2-4 9-3 8 3l-2 10h11c4 0 6 3 5 7l-4 17c-1 3-3 4-6 4H27z" fill="#fff"/></svg></button></div>
</div></div>
<script src="kit.js"></script>
<script src="frame.js"></script>
<script src="unit2.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var P, R, done;
  /* what Mendy says on each stone: one mistake (or none) */
  function words(len, kind, at) {
    var w = []; for (var i = 1; i <= len; i++) w.push(i);
    if (kind === 'skip') for (i = at; i < len; i++) w[i] = i + 2;
    if (kind === 'twice') { for (i = len - 1; i > at; i--) w[i] = w[i - 1]; w[at] = at; }
    if (kind === 'swap') { var t = w[at]; w[at] = w[at + 1]; w[at + 1] = t; }
    return w;
  }
  var PLAN = [{ len: 5, kind: 'skip', at: 3 }, { len: 5, kind: 'none' }, { len: 6, kind: 'twice', at: 3 }, { len: 7, kind: 'skip', at: 5 }, { len: 7, kind: 'swap', at: 2 }, { len: 8, kind: 'skip', at: 6 }];
  async function mendy(F) {
    P.reset(); await F.say(R.who + ' counts. Listen!', { noRepeat: true });
    for (var i = 0; i < R.w.length; i++) { P.place(i, true); await F.say(U2.Word(R.w[i]) + (i === R.w.length - 1 ? '.' : ','), { noRepeat: true }); }
    P.place(-1);
  }
  function hooks() {
    GAME.right = function () { return [{ tap: R.bad < 0 ? '#ok' : '#st' + R.bad }]; };
    GAME.wrong = function () { return [{ tap: R.bad < 0 ? '#st1' : (R.bad === 0 ? '#st1' : '#st0') }]; };
  }
  async function fixIt(F) {
    if (R.bad >= 0) { P.stones[R.bad].classList.add('lit'); await F.say(R.who + ' said ' + U2.word(R.w[R.bad]) + ' here.'); await F.say('This is ' + U2.word(R.bad + 1) + '.'); }
    await F.say("Let's count it right!"); P.reset(); await U2.countAlong(P, 0, R.w.length - 1);
  }
  async function pick(where) {
    NK.unlock(); if (GAME.phase !== 'answer') return; GAME.phase = 'busy'; FR.lock(true);
    if (where === R.bad) {
      var d = done; done = null;
      if (R.bad < 0) { await FR.yes($('ok'), 'Yes! ' + R.who + ' counted right!'); d(R.misses === 0); return; }
      NK.sound.yes(); await FR.say('Yes! You found it!'); await fixIt(FR); await FR.yes(P.stones[R.bad], 'Now it is right!'); d(R.misses === 0); return;
    }
    FR.oops(where < 0 ? $('ok') : P.stones[where]); R.misses++;
    if (R.misses === 1) { await FR.say("Let's look and listen again."); await mendy(FR); await FR.say('Where did ' + R.who + ' go wrong?'); GAME.phase = 'answer'; FR.lock(false); hooks(); return; }
    var d2 = done; done = null;
    await (R.bad < 0 ? FR.say(R.who + ' counted right this time.') : fixIt(FR)); d2(false);
  }
  FR.game({
    id: 'u2-mistake', title: "Mendy's Mistake", rounds: 6,
    hero: '<div class="u2stone" style="width:26%">' + U2.dots(3) + '</div><div class="u2stone" style="width:26%;box-shadow:0 7px 0 #C0392B,0 0 0 6px rgba(255,90,78,.45)">' + U2.dots(4) + '</div>',
    init: function () {
      document.addEventListener('pointerdown', function (e) { var s = e.target.closest('#path .u2stone'); if (s) { e.preventDefault(); pick(+s.dataset.i); } });
      $('ok').addEventListener('click', function () { pick(-1); });
    },
    demo: async function (F) {
      P = U2.path($('path'), { from: 1, to: 5 }); R = { who: 'Mendy', w: words(5, 'skip', 2), bad: 2, misses: 0 };
      await F.say('Mendy is counting. Did he make a mistake?');
      await mendy(F);
      await F.say('He said four on the three stone!');
      await F.handTo(P.stones[2]); await F.handTap(); NK.sound.yes();
      await fixIt(F); await F.say('No mistake? Tap thumbs up.');
    },
    round: function (F, i) {
      return new Promise(async function (res) {
        GAME.phase = 'busy'; F.lock(true); var pl = PLAN[i], who = F.NAMES[(i * 3) % F.NAMES.length];
        P = U2.path($('path'), { from: 1, to: pl.len }); P.stones.forEach(function (s) { s.classList.add('tapme'); });
        R = { who: who, w: words(pl.len, pl.kind, pl.at), bad: pl.kind === 'none' ? -1 : pl.at, misses: 0 };
        await mendy(F); done = res; GAME.phase = 'answer'; F.lock(false); hooks();
        NK.last = R.who + ' said: ' + R.w.map(U2.word).join(', ') + '.';
        await F.say('Tap where ' + who + ' went wrong.', { repeat: NK.last });
      });
    }
  });
})();
</script>
</body>
</html>
