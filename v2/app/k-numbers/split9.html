<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Split It — Kindergarten Numbers</title>
<!-- Kindergarten Numbers, Unit 9 "Parts of 6 to 10": SPLIT IT (seeing all the ways). A tray of fruit at the calm 3D market: the first ones are oranges,
     the rest are lemons. The orange arrow gives one more orange (one less lemon); the yellow arrow gives one more lemon. A number bond shows the two parts.
     "Find a new way to make eight!" He moves the split and taps the check; each new way joins the list ("five and three", "two and six" ...).
     A slip (a way we already have): "We have that one. Find a new way." -->
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
<link rel="stylesheet" href="frame.css"><link rel="stylesheet" href="unit6.css">
<style>
.b-orange{ --b:#FF8A1E; --b-l:#FFC08A; --b-d:#C85A10; } .b-lemon{ --b:#F5D10A; --b-l:#FFF08A; --b-d:#B89A00; }
#more svg, #less svg{ width:60%; height:60%; position:relative; }
.bond{ position:relative; flex-shrink:0; width:clamp(150px,22vh,190px); height:clamp(100px,15vh,124px); } .bond svg.lines{ position:absolute; inset:0; width:100%; height:100%; }
.bc{ position:absolute; width:clamp(54px,8vh,64px); height:clamp(54px,8vh,64px); border-radius:50%; background:#fff; border:5px solid #FF8A1E; display:flex; align-items:center; justify-content:center; padding:6px; }
.bc svg{ height:100%; width:auto; } #bw{ left:50%; top:0; transform:translateX(-50%); border-color:#2FB5E8; } #b0{ left:0; bottom:0; } #b1{ right:0; bottom:0; border-color:#F5D10A; }
.ways{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; max-width:240px; } .ways span{ display:flex; gap:4px; align-items:center; background:#fff; border-radius:14px; padding:3px 8px; box-shadow:0 3px 0 #C9D8EE; }
.ways span svg{ height:26px; width:auto; } .ways:empty{ display:none; }
@media (max-width:760px), (max-aspect-ratio:4/5){ .ui{ flex-wrap:wrap; width:min(100%,370px); } .bond{ order:-1; width:100%; max-width:220px; margin:0 calc(50% - 110px); } .ways{ order:5; width:100%; max-width:none; } }
</style>
</head>
<body>
<div id="world"></div>
<div id="game" class="locked"><div class="stage s6" id="stage">
  <div class="ui" id="panel">
    <button id="less" class="bigbtn btn3d b-lemon" aria-label="One more lemon"><svg viewBox="0 0 48 48"><path d="M30 10 16 24l14 14" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="bond"><svg class="lines" viewBox="0 0 100 64" preserveAspectRatio="none"><path d="M50 18 L16 48 M50 18 L84 48" stroke="#8A6A4A" stroke-width="2.5"/></svg>
      <div class="bc" id="bw"></div><div class="bc" id="b0"></div><div class="bc" id="b1"></div></div>
    <button id="more" class="bigbtn btn3d b-orange" aria-label="One more orange"><svg viewBox="0 0 48 48"><path d="M18 10l14 14-14 14" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="check" class="bigbtn btn3d b-sun" aria-label="Check"><svg viewBox="0 0 48 48"><path d="M10 25l9 9 19-20" stroke="#2B2350" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="ways" id="ways"></div>
  </div>
</div></div>
<script src="kit.js"></script><script src="frame.js"></script><script src="unit5.js"></script>
<script type="module">
import { mount } from './market9.js';
const $ = id => document.getElementById(id);
let K, R, done, found = {};
const band = () => [innerWidth < 760 ? 80 : 92, $('panel').getBoundingClientRect().top - 8];
function show() { K.setSplit(R.n, R.k); $('bw').innerHTML = U5.num(R.n); $('b0').innerHTML = U5.num(R.k); $('b1').innerHTML = U5.num(R.n - R.k); }
function list() { $('ways').innerHTML = (found[R.n] || []).map(k => '<span>' + U5.num(k) + '<b>+</b>' + U5.num(R.n - k) + '</span>').join(''); }
function target() { const f = found[R.n] || []; for (const k of [5, 1, 2, 3, 4, 6, 7, 8, 9]) if (k < R.n && !f.includes(k)) return k; return 1; }
function moves(to) { const out = []; for (let k = R.k; k < to; k++) out.push({ tap: '#more' }); for (let k = R.k; k > to; k--) out.push({ tap: '#less' }); return out; }
function hooks() { const f = found[R.n] || []; GAME.right = () => moves(target()).concat([{ tap: '#check' }]); GAME.wrong = () => moves(f.length ? f[0] : 0).concat([{ tap: '#check' }]); }
function open() { GAME.phase = 'answer'; FR.lock(false); hooks(); }
function step(d) { NK.unlock(); if (GAME.phase !== 'answer') return; const k = R.k + d; if (k < 0 || k > R.n) { NK.sound.oops(); return; } R.k = k; NK.sound.pop(); show(); }
/* a wrong split: the hand SHOWS one move to a new way (one more orange, or one more lemon), then he checks */
async function showHow(have) { let d = [1, -1].find(dd => { const k = R.k + dd; return k > 0 && k < R.n && !have.includes(k); }); if (!d) d = R.k < R.n / 2 ? 1 : -1;
  const btn = $(d > 0 ? 'more' : 'less'); await FR.say(d > 0 ? 'Watch. One more orange.' : 'Watch. One more lemon.'); await FR.handTo(btn); await FR.handTap(); FR.handHide();
  R.k += d; NK.sound.pop(); show(); await FR.say('A new way! Now tap the check.'); }
async function check() {
  NK.unlock(); if (GAME.phase !== 'answer') return; GAME.phase = 'busy'; FR.lock(true); const f = found[R.n] = found[R.n] || [], k = R.k, y = R.n - k;
  if (k === 0 || y === 0) { FR.oops($('check')); R.misses++; await FR.say("Let's look. We need oranges and lemons."); await showHow(f); open(); return; }
  if (f.includes(k)) { FR.oops($('check')); R.misses++; await FR.say("Let's look. We have that one already."); await showHow(f); open(); return; }
  f.push(k); list(); K.sparkle(-1, 0.4); await FR.yes($('check'), FR.Word(k) + ' and ' + FR.word(y) + ' make ' + FR.word(R.n) + '!'); const d = done; done = null; d(R.misses === 0);
}
const PLAN = [7, 7, 8, 8, 10, 10];
function play(F, i) {
  return new Promise(async res => {
    const n = PLAN[i]; R = { n, k: 0, misses: 0 }; done = res; GAME.phase = 'busy'; F.lock(true); show(); list();
    await F.say((found[n] || []).length ? 'Another way to make ' + F.word(n) + '!' : F.Word(n) + ' lemons. Turn some into oranges!');
    open(); await F.say('Find a new way. Then tap the check.', { repeat: 'Orange arrow: one more orange. Then check.' });
  });
}
FR.game({
  id: 'u9-split', title: 'Split It', rounds: 6,
  hero: '<div class="hero6"><img src="art/dovid-happy.png" alt=""></div>',
  init() {
    K = mount($('world'), { kids: ['mendy', 'dovid'], band });
    $('more').addEventListener('click', () => step(1)); $('less').addEventListener('click', () => step(-1)); $('check').addEventListener('click', check);
  },
  reset() { found = {}; },
  demo: async F => {
    R = { n: 6, k: 0, misses: 0 }; show(); found = {}; list();
    await F.say('Six lemons. Watch me split them.');
    for (let t = 0; t < 4; t++) { await F.handTo($('more')); await F.handTap(); R.k++; NK.sound.pop(); show(); }
    await F.say('Four oranges and two lemons. Four and two make six!');
    await F.handTo($('check')); await F.handTap(); K.sparkle(-1, 0.4); found = {};
  },
  round: (F, i) => play(F, i),
  endSay: s => s >= 2 ? 'So many ways to make a number!' : 'Good splitting! Let\'s play once more.'
});
</script>
</body>
</html>
