<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quick Facts — Kindergarten Numbers</title>
<!-- Kindergarten Numbers, Unit 11 (MAP.md "Quick facts": recall to build speed), in the sukkah.
     A short number fact within 5 (2 + 1, 4 − 1 ...) shows big. He shows the answer on his fingers and taps the check. Quick and short.
     The picture button (an eye) shows the fact as dots: plus puts dots together, minus crosses some out. A slip: the dots show, we count, he tries again. -->
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
<link rel="stylesheet" href="frame.css"><link rel="stylesheet" href="unit6.css"><link rel="stylesheet" href="hands-side.css">
<style>
.ui{ flex-wrap:wrap; }
.fact{ display:flex; align-items:center; gap:6px; background:#fff; border-radius:22px; padding:8px 14px; box-shadow:0 6px 0 #E3D3BE, 0 10px 18px rgba(60,40,20,.18); }
.fact .n{ height:clamp(58px,9vh,78px); display:flex; } .fact .n svg{ height:100%; width:auto; } .fact b{ font:900 clamp(34px,5.4vh,50px)/1 system-ui, sans-serif; color:#5A4A3A; }
.fact b.plus{ color:#22B45E; } .fact b.minus{ color:#FF6A3D; } .fact .q{ color:#8A7A6A; }
.pdots{ display:flex; gap:6px; align-items:center; min-height:30px; } .pdots i{ width:26px; height:26px; border-radius:50%; background:#3B7BD8; } .pdots i.b{ background:#22B45E; } .pdots i.x{ background:#ccc; position:relative; }
.pdots i.x::after{ content:''; position:absolute; left:-3px; right:-3px; top:11px; height:4px; background:#FF6A3D; transform:rotate(-35deg); border-radius:2px; } .pdots[hidden]{ display:none; }
#eye svg{ width:56%; height:56%; }
@media (max-width:760px), (max-aspect-ratio:4/5){ .ui{ width:min(100%,370px); } .fact{ width:100%; justify-content:center; } }
</style>
</head>
<body>
<div id="world"></div>
<div id="game" class="locked"><div class="stage s6" id="stage">
  <div class="ui" id="panel">
    <div class="fact" id="fact"></div>
    <div class="pdots" id="pic" hidden></div>
    <div id="hp"></div>
    <button id="eye" class="bigbtn btn3d b-white" aria-label="Show me the picture"><svg viewBox="0 0 48 48"><path d="M4 24c6-10 14-14 20-14s14 4 20 14c-6 10-14 14-20 14S10 34 4 24z" fill="none" stroke="#2B2350" stroke-width="4"/><circle cx="24" cy="24" r="7" fill="#2B2350"/></svg></button>
    <button id="check" class="bigbtn btn3d b-sun" aria-label="Check"><svg viewBox="0 0 48 48"><path d="M10 25l9 9 19-20" stroke="#2B2350" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div></div>
<script src="kit.js"></script><script src="frame.js"></script><script src="unit5.js"></script>
<script type="module">
import { mount } from './sukkah11.js';
const $ = id => document.getElementById(id);
let K, H, R, done;
const band = () => [innerWidth < 760 ? 80 : 92, $('panel').getBoundingClientRect().top - 8];
const ans = () => R.op === '+' ? R.a + R.b : R.a - R.b;
function fact(show) { $('fact').innerHTML = '<span class="n">' + U5.num(R.a) + '</span><b class="' + (R.op === '+' ? 'plus">+' : 'minus">−') + '</b><span class="n">' + U5.num(R.b) + '</span><b>=</b>' + (show ? '<span class="n">' + U5.num(ans()) + '</span>' : '<b class="q">?</b>'); }
function dots() { $('pic').hidden = false; $('pic').innerHTML = R.op === '+' ? '<i></i>'.repeat(R.a) + '<i class="b"></i>'.repeat(R.b) : '<i></i>'.repeat(R.a - R.b) + '<i class="x"></i>'.repeat(R.b); }
function hooks() { const k = ans(); GAME.right = () => FR.fingerTaps(H, k, '#hp').concat([{ tap: '#check' }]); GAME.wrong = () => FR.fingerTaps(H, k === 5 ? 4 : k + 1, '#hp').concat([{ tap: '#check' }]); }
function open() { GAME.phase = 'answer'; FR.lock(false); H.lock(false); hooks(); }
async function eye() { NK.unlock(); if (GAME.phase !== 'answer') return; R.helped = true; dots(); NK.sound.pop(); await FR.say(R.op === '+' ? 'Put them together.' : 'Cross some out.', { noRepeat: true }); }
async function check() {
  NK.unlock(); if (GAME.phase !== 'answer') return; GAME.phase = 'busy'; FR.lock(true); H.lock(true); const k = ans();
  if (H.count() === k) { fact(true); await FR.yes($('check'), FR.Word(R.a) + (R.op === '+' ? ' plus ' : ' minus ') + FR.word(R.b) + ' is ' + FR.word(k) + '!'); const d = done; done = null; d(R.misses === 0); return; }
  FR.oops($('check')); R.misses++; dots(); await FR.say("Let's look at the dots.");
  const left = [...$('pic').querySelectorAll('i:not(.x)')]; for (let j = 0; j < left.length; j++) { left[j].style.outline = '4px solid #FFC93D'; await FR.say(FR.Word(j + 1) + (j === left.length - 1 ? '.' : ','), { noRepeat: true }); }
  H.set(0); await FR.say('Show me again.'); open();
}
const PLAN = [[2, '+', 1], [3, '-', 1], [2, '+', 2], [4, '-', 2], [1, '+', 3], [5, '-', 2], [3, '+', 2], [4, '-', 3]];
function play(F, i) {
  return new Promise(async res => {
    const [a, op, b] = PLAN[i]; R = { a, op, b, misses: 0 }; done = res; GAME.phase = 'busy'; F.lock(true); H.set(0); H.lock(true); $('pic').hidden = true; fact(false); open();
    await F.say(F.Word(a) + (op === '+' ? ' plus ' : ' minus ') + F.word(b) + '?', { repeat: 'Show me on your fingers. The eye shows a picture.' });
  });
}
FR.game({
  id: 'u11-facts', title: 'Quick Facts', rounds: 8,
  hero: '<div class="hero6"><img src="art/avi-happy.png" alt=""></div>',
  init() { K = mount($('world'), { band }); K.showPlate(false); K.setBoys(3); H = FR.fingers(0, true); $('hp').appendChild(H.el); $('eye').addEventListener('click', eye); $('check').addEventListener('click', check); },
  demo: async F => {
    R = { a: 1, op: '+', b: 1 }; fact(false); await F.say('Quick facts! Watch me. One plus one?'); await F.say('Not sure? Tap the eye.'); await F.handTo($('eye')); await F.handTap(); dots();
    await F.say('One and one more. Two!'); await F.handTo(H.el, .5, .6); await F.handTap(); H.set(1); await F.handTap(); H.set(2); await F.handTo($('check')); await F.handTap(); F.handHide(); fact(true); H.set(0); $('pic').hidden = true;
  },
  round: (F, i) => play(F, i),
  endSay: s => s >= 2 ? 'So quick! You know your facts!' : 'Good work! Let\'s play once more.'
});
</script>
</body>
</html>
