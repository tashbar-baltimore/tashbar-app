<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find the Mistake — Kindergarten Numbers</title>
<!-- Kindergarten Numbers, Unit 12 (MAP.md "Find the mistake": Shmuli hopped wrong on the path; he fixes the hops), on the garden path.
     Shmuli does a fact by hopping: "Five plus three." He starts on five and hops, but too many, or he counts his own stone. The panel shows what he got, in red.
     The boy moves Shmuli to the stone where he should be (drag him, or tap him and then the stone). Shmuli hops there again from the start, counting on.
     A slip: "Let's look. Start on five. Hop three:" the stones light up as we count on, then another try. -->
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
<link rel="stylesheet" href="frame.css"><link rel="stylesheet" href="unit6.css">
<style>
.sent{ display:flex; align-items:center; gap:6px; background:#fff; border-radius:20px; padding:6px 12px; } .sent .n{ height:clamp(52px,8vh,68px); display:flex; } .sent .n svg{ height:100%; width:auto; }
.sent b{ font:900 clamp(30px,5vh,44px)/1 system-ui, sans-serif; color:#5A4A3A; } .sent b.plus{ color:#22B45E; } .sent b.minus{ color:#FF6A3D; } .sent .n.bad{ border-radius:12px; box-shadow:0 0 0 4px #FF6A3D; }
.chip{ width:clamp(80px,12vh,104px); height:clamp(80px,12vh,104px); } .chip img{ height:100%; width:auto; pointer-events:none; } .chip[hidden]{ display:none; }
@media (max-width:760px), (max-aspect-ratio:4/5){ .ui{ flex-wrap:wrap; width:min(100%,370px); } }
</style>
</head>
<body>
<div id="world"></div>
<div id="game" class="locked"><div class="stage s6" id="stage">
  <div class="ui" id="panel">
    <div class="sent" id="sent"></div>
    <div class="numcard chip" id="chip" hidden><img src="art/shmuli-idle.png" alt="Shmuli"></div>
  </div>
</div></div>
<script src="kit.js"></script><script src="frame.js"></script><script src="unit5.js"></script>
<script type="module">
import { mount } from './path6.js';
const $ = id => document.getElementById(id);
let P, A, R, done;
const band = () => [innerWidth < 760 ? 80 : 92, $('panel').getBoundingClientRect().top - 8];
const ans = () => R.op === '+' ? R.a + R.b : R.a - R.b;
function sent(c, bad) { $('sent').innerHTML = '<span class="n">' + U5.num(R.a) + '</span><b class="' + (R.op === '+' ? 'plus">+' : 'minus">−') + '</b><span class="n">' + U5.num(R.b) + '</span><b>=</b><span class="n' + (bad ? ' bad' : '') + '">' + (c === '' ? '<b>?</b>' : U5.num(c)) + '</span>'; }
function hooks() { const ok = ans(), bad = R.said; GAME.right = () => { P.focus(ok, true); return [{ drag: ['#chip', '.stone[data-n="' + ok + '"]'] }]; }; GAME.wrong = () => { P.focus(bad, true); return [{ drag: ['#chip', '.stone[data-n="' + bad + '"]'] }]; }; }
function open() { GAME.phase = 'answer'; FR.lock(false); hooks(); }
async function countOn() { const dir = R.op === '+' ? 1 : -1; for (let j = 1; j <= R.b; j++) { const n = R.a + dir * j; P.focus(n); P.glow(n, true); await FR.say(FR.Word(n) + (j === R.b ? '.' : ','), { noRepeat: true }); P.glow(n, false); } }
async function move(chip, stone) {
  if (GAME.phase !== 'answer') return; GAME.phase = 'busy'; FR.lock(true); const n = +stone.dataset.n, ok = ans();
  if (n === ok) { $('chip').hidden = true; A.place(R.a); A.show(true); P.focus(R.a, true); A.pose('happy'); await A.hop(ok, k => FR.say(FR.Word(k) + '!', { noRepeat: true })); A.pose('idle'); sent(ok, false); P.petals(ok);
    await FR.yes(stone, 'Fixed! ' + FR.Word(R.a) + (R.op === '+' ? ' plus ' : ' minus ') + FR.word(R.b) + ' is ' + FR.word(ok) + '.'); const d = done; done = null; d(R.misses === 0); return; }
  FR.oops(stone); R.misses++; await FR.say("Let's look. Start on " + FR.word(R.a) + '. ' + (R.op === '+' ? 'Hop ' : 'Back ') + FR.word(R.b) + ':');
  await countOn(); if (R.misses > 1) { P.el(ok).classList.add('hint'); setTimeout(() => P.el(ok).classList.remove('hint'), 2500); }
  await FR.say('Move Shmuli there.'); open();
}
const PLAN = [{ a: 5, op: '+', b: 3, said: 9 }, { a: 7, op: '-', b: 2, said: 6 }, { a: 4, op: '+', b: 4, said: 7 }, { a: 9, op: '-', b: 3, said: 5 }, { a: 6, op: '+', b: 2, said: 7 }, { a: 8, op: '-', b: 4, said: 3 }];   /* one hop too many, or he counted his own stone */
function play(F, i) {
  return new Promise(async res => {
    R = Object.assign({ misses: 0 }, PLAN[i]); done = res; GAME.phase = 'busy'; F.lock(true); $('chip').hidden = true; sent('', false);
    A.place(R.a); A.show(true); P.focus(R.a, true); await F.say('Shmuli does ' + F.word(R.a) + (R.op === '+' ? ' plus ' : ' minus ') + F.word(R.b) + '. Watch!');
    A.pose('happy'); await A.hop(R.said); A.pose('idle'); sent(R.said, true); await F.say(F.Word(R.said) + '? Oops! Shmuli hopped wrong.');
    A.show(false); $('chip').hidden = false; open(); await F.say('Move Shmuli where he should be.', { repeat: 'Start on ' + F.word(R.a) + '. ' + (R.op === '+' ? 'Hop ' : 'Back ') + F.word(R.b) + '. Move him there.' });
  });
}
FR.game({
  id: 'u12-mistake', title: 'Find the Mistake', rounds: 6,
  hero: '<div class="hero6"><img src="art/shmuli-idle.png" alt=""></div>',
  init() { P = mount($('world'), { kids: ['shmuli'], band }); A = P.kids.shmuli; A.lift = 1.1; A.show(false); FR.dragTap({ sources: '#chip', targets: '.p6layer .stone', drop: move }); },
  demo: async F => {
    R = { a: 2, op: '+', b: 2, said: 5 }; A.place(2); A.show(true); P.focus(3, true); sent('', false);
    await F.say('Shmuli does two plus two. Watch me check.'); await A.hop(5); sent(5, true); await F.say('Five? Start on two. Hop two: three, four.');
    A.show(false); $('chip').hidden = false; await F.handDrag($('chip'), P.el(4)); $('chip').hidden = true; A.place(4); A.show(true); sent(4, false); F.handHide();
    await F.say('Two plus two is four!'); A.show(false);
  },
  round: (F, i) => play(F, i),
  endSay: s => s >= 2 ? 'Shmuli says thank you! Great checking!' : 'Good checking! Let\'s play once more.'
});
</script>
</body>
</html>
