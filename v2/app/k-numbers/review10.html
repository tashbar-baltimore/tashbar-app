<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Review Time — Kindergarten Numbers</title>
<!-- Kindergarten Numbers, Unit 10 REVIEW (Units 7-9 come back at the bakery counter), three kinds in turn, each answered on two hands:
     1. One less (Unit 7): cupcakes on the plate; "five on the plate, one less?" A slip: one goes away and we count.
     2. Parts (Units 8-9): the tin has pink and blue; "six cupcakes, four are pink; how many blue?" A slip: we count the blue ones.
     3. One more (Units 6-7): the tin; "seven, one more?" A slip: one more drops in and we count. -->
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
<link rel="stylesheet" href="frame.css"><link rel="stylesheet" href="unit5.css"><link rel="stylesheet" href="unit6.css"><link rel="stylesheet" href="unit10.css">
</head>
<body>
<div id="world"></div>
<div id="game" class="locked"><div class="stage s6" id="stage">
  <div class="ui" id="panel">
    <div class="goal" id="goal"></div>
    <div id="hh"></div>
    <button id="check" class="bigbtn btn3d b-sun" aria-label="Check"><svg viewBox="0 0 48 48"><path d="M10 25l9 9 19-20" stroke="#2B2350" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div></div>
<script src="kit.js"></script><script src="frame.js"></script><script src="unit5.js"></script>
<script type="module">
import { mount } from './bakery10.js';
const $ = id => document.getElementById(id);
let K, H, R, done;
const band = () => [innerWidth < 760 ? 80 : 92, $('panel').getBoundingClientRect().top - 8];
const ans = () => R.kind === 'less' ? R.n - 1 : R.kind === 'more' ? R.n + 1 : R.n - R.pink;
function hooks() { GAME.right = () => H.moves(ans(), '#hh').concat([{ tap: '#check' }]); GAME.wrong = () => H.moves(ans() + 1, '#hh').concat([{ tap: '#check' }]); }
function open() { GAME.phase = 'answer'; FR.lock(false); H.lock(false); hooks(); }
const say = (list, end) => i => FR.say(FR.Word(i + 1) + (i === list.length - 1 ? end || '.' : ','), { noRepeat: true });
function setup() { if (R.kind === 'less') { K.setTin(0); K.setExtra(R.n); } else if (R.kind === 'more') { K.setExtra(0); K.setTin(R.n); } else { K.setExtra(0); K.setTin(R.n, { blueFrom: R.pink }); } }
async function check() {
  NK.unlock(); if (GAME.phase !== 'answer') return; GAME.phase = 'busy'; FR.lock(true); H.lock(true); const have = H.count(), k = ans();
  if (have === k) { const line = R.kind === 'less' ? 'Yes! One less than ' + FR.word(R.n) + ' is ' + FR.word(k) + '.' : R.kind === 'more' ? 'Yes! One more than ' + FR.word(R.n) + ' is ' + FR.word(k) + '.' : 'Yes! ' + FR.Word(R.pink) + ' and ' + FR.word(k) + ' make ' + FR.word(R.n) + '.';
    await FR.yes($('check'), line); const d = done; done = null; d(R.misses === 0); return; }
  FR.oops($('check')); R.misses++;
  if (R.kind === 'less') { await FR.say("Let's look. One goes away."); await K.dropExtra(); const ex = K.extras(); await K.bumpAll(ex, say(ex)); }
  else if (R.kind === 'more') { await FR.say("Let's look. One more comes."); await K.add(R.n); const all = K.cakes(); await K.bumpAll(all, say(all)); }
  else { await FR.say("Let's look. Count the blue ones."); const b = K.cakes().filter(c => c.userData.blue); await K.bumpAll(b, say(b)); }
  await FR.say(have < k ? 'Put up ' + FR.word(k - have) + ' more.' : 'Put ' + FR.word(have - k) + ' down.'); setup(); open();
}
const PLAN = [{ kind: 'less', n: 5 }, { kind: 'part', n: 6, pink: 4 }, { kind: 'more', n: 7 }, { kind: 'less', n: 4 }, { kind: 'part', n: 8, pink: 5 }, { kind: 'more', n: 9 }];
function play(F, i) {
  return new Promise(async res => {
    R = Object.assign({ misses: 0 }, PLAN[i]); done = res; GAME.phase = 'busy'; F.lock(true); H.set(0); H.lock(true); setup(); $('goal').innerHTML = U5.num(R.n);
    if (R.kind === 'less') await F.say(F.Word(R.n) + ' on the plate. One less is?');
    else if (R.kind === 'more') await F.say(F.Word(R.n) + ' in the tin. One more is?');
    else await F.say(F.Word(R.n) + ' cupcakes. ' + F.Word(R.pink) + ' are pink. How many blue?');
    open(); await F.say('Show me on two hands.', { repeat: R.kind === 'part' ? 'Count the blue cupcakes. Show me.' : 'Count them. Show me on two hands.' });
  });
}
FR.game({
  id: 'u10-review', title: 'Review Time', rounds: 6,
  hero: '<div class="hero6"><img src="art/mendy-happy.png" alt=""><img src="art/dovid-happy.png" alt=""></div>',
  init() { K = mount($('world'), { kids: ['mendy', 'dovid'], band }); H = U5.hands(0, true); $('hh').appendChild(H.el); $('check').addEventListener('click', check); },
  demo: async F => {
    R = { kind: 'demo' }; K.setExtra(0); K.setTin(3); $('goal').innerHTML = U5.num(3);
    await F.say('Review time! Watch me. Three in the tin.'); await F.say('One more?'); await K.add(3); await F.say('Four! I show four.');
    await F.handTo(H.el, .3, .6); for (let k = 1; k <= 4; k++) { await F.handTap(); H.set(k); NK.sound.pop(); } await F.handTo($('check')); await F.handTap(); F.handHide(); H.set(0);
  },
  round: (F, i) => play(F, i),
  endSay: s => s >= 2 ? 'You remember so much!' : 'Good work! Let\'s play once more.'
});
</script>
</body>
</html>
