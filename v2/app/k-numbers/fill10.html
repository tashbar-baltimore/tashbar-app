<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fill the Tin — Kindergarten Numbers</title>
<!-- Kindergarten Numbers, Unit 10 "Making 10" (v2/curriculum/k-numbers/MAP.md "Fill the ten"), at a calm 3D bakery counter.
     A muffin tin has ten cups in two rows of five (a real ten-frame). Some pink cupcakes are in it. He taps each empty cup and a blue cupcake drops in,
     until the tin is full. Then: "How many did you add?" He shows it on two hands and taps the check. Seven and three make ten!
     A slip: the empty cups light up one by one as we count them together, then another try. -->
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
<link rel="stylesheet" href="frame.css"><link rel="stylesheet" href="unit5.css"><link rel="stylesheet" href="unit6.css"><link rel="stylesheet" href="unit10.css"><link rel="stylesheet" href="hands-side.css">
</head>
<body>
<div id="world"></div>
<div id="game" class="locked"><div class="stage s6" id="stage">
  <div class="ui" id="panel">
    <div class="sum" id="sum"></div>
    <div id="hh" hidden></div>
    <button id="check" class="bigbtn btn3d b-sun" aria-label="Check" hidden><svg viewBox="0 0 48 48"><path d="M10 25l9 9 19-20" stroke="#2B2350" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div></div>
<script src="kit.js"></script><script src="frame.js"></script><script src="unit5.js"></script>
<script type="module">
import { mount } from './bakery10.js';
const $ = id => document.getElementById(id);
let K, H, R, done;
const band = () => [innerWidth < 760 ? 80 : 92, $('panel').getBoundingClientRect().top - 8];
/* the panel: pink part + blue part = 10, with "?" for the part he still needs */
function sum(a, b) { $('sum').innerHTML = '<span class="p pink">' + U5.num(a, '#FF5C9A') + '</span><span class="op">+</span><span class="p blue">' + (b == null ? '<b>?</b>' : U5.num(b, '#2F8FEF')) + '</span><span class="op">=</span><span class="p ten">' + U5.num(10) + '</span>'; }
function hooks() {
  if (R.step === 'fill') { GAME.right = () => { const i = K.firstEmpty(); return [{ tap: '.tspot[data-id="cup' + i + '"]' }]; }; GAME.wrong = null; return; }
  GAME.right = () => H.moves(10 - R.n, '#hh').concat([{ tap: '#check' }]); GAME.wrong = () => H.moves(10 - R.n + 1, '#hh').concat([{ tap: '#check' }]);
}
function open() { GAME.phase = 'answer'; FR.lock(false); H.lock(false); hooks(); }
async function cup(id) {
  if (GAME.phase !== 'answer' || R.step !== 'fill' || !id.startsWith('cup')) return; GAME.phase = 'busy';
  await K.add(+id.slice(3));
  if (K.count() < 10) { open(); return; }
  FR.lock(true); K.celebrate(); NK.sound.yay && NK.sound.yay(); await FR.say('Ten! The tin is full.');
  R.step = 'show'; $('hh').hidden = $('check').hidden = false; H.set(0);
  open(); await FR.say('How many blue did you add? Show me.', { repeat: 'Count the blue cupcakes. Show me on two hands.' });
}
async function check() {
  NK.unlock(); if (GAME.phase !== 'answer' || R.step !== 'show') return; GAME.phase = 'busy'; FR.lock(true); H.lock(true); const need = 10 - R.n, have = H.count();
  if (have === need) { sum(R.n, need); await FR.yes($('check'), FR.Word(R.n) + ' and ' + FR.word(need) + ' make ten!'); const d = done; done = null; d(R.misses === 0); return; }
  FR.oops($('check')); R.misses++;
  await FR.say("Let's look. Count the blue cupcakes."); const blues = K.cakes().filter(c => c.userData.blue);
  await K.bumpAll(blues, i => FR.say(FR.Word(i + 1) + (i === blues.length - 1 ? '.' : ','), { noRepeat: true }));
  await FR.say(have < need ? 'Put up ' + FR.word(need - have) + ' more.' : 'Put ' + FR.word(have - need) + ' down.'); open();
}
const PLAN = [7, 6, 8, 5, 9, 4];
function play(F, i) {
  return new Promise(async res => {
    const n = PLAN[i]; R = { n, step: 'fill', misses: 0 }; done = res; GAME.phase = 'busy'; F.lock(true); H.set(0); H.lock(true);
    $('hh').hidden = $('check').hidden = true; K.setTin(n); sum(n, null);
    await F.say(i === 0 ? F.Word(n) + ' pink cupcakes. Fill the tin to ten!' : F.pick([F.Word(n) + ' cupcakes. Fill it to ten!', F.Word(n) + ' in the tin. Make it ten!']));
    K.spots(true); open(); await F.say('Tap each empty cup.', { repeat: 'Tap an empty cup. Fill them all.' });
  });
}
FR.game({
  id: 'u10-fill', title: 'Fill the Tin', rounds: 6,
  hero: '<div class="hero6"><img src="art/mendy-happy.png" alt=""></div>',
  init() {
    K = mount($('world'), { kids: ['mendy', 'dovid'], band }); H = U5.hands(0, true); $('hh').appendChild(H.el);
    K.onTap = id => cup(id); $('check').addEventListener('click', check);
  },
  demo: async F => {
    R = { n: 8, step: 'demo' }; K.setTin(8); sum(8, null); $('hh').hidden = $('check').hidden = true;
    await F.say('Eight cupcakes. Ten cups. Watch me fill it.'); K.spots(true);
    for (const i of [8, 9]) { await F.handTo(document.querySelector('.tspot[data-id="cup' + i + '"]')); await F.handTap(); await K.add(i); }
    K.celebrate(); sum(8, 2); await F.say('I added two. Eight and two make ten!');
  },
  round: (F, i) => play(F, i),
  endSay: s => s >= 2 ? 'You fill to ten like a baker!' : 'Good baking! Let\'s play once more.'
});
</script>
</body>
</html>
