<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Review Time — Kindergarten Numbers</title>
<!-- Kindergarten Numbers, Unit 12 REVIEW (Units 9-11 come back at the Shabbos table), three kinds in turn, each answered on two hands:
     1. Parts of ten (Unit 9): a ten-frame shows seven; "seven is five and how many?" A slip: the full row lights up, we count the rest.
     2. Friends of ten (Unit 10): a ten-frame shows six; how many more make ten? A slip: the empty boxes light up as we count them.
     3. A fact within 5 (Unit 11): "three plus two?" A slip: the fact shows as dots and we count them. -->
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
<link rel="stylesheet" href="frame.css"><link rel="stylesheet" href="unit5.css"><link rel="stylesheet" href="unit6.css"><link rel="stylesheet" href="hands-side.css">
<style>#tf{ display:flex; } #tf .tf{ width:min(40vw,320px); } #tf[hidden], .fact[hidden], .pdots[hidden]{ display:none; } #tf .cell.lit{ box-shadow:inset 0 0 0 5px #FFC93D; }
.fact{ display:flex; align-items:center; gap:6px; background:#fff; border-radius:20px; padding:6px 12px; } .fact .n{ height:clamp(52px,8vh,68px); display:flex; } .fact .n svg{ height:100%; width:auto; }
.fact b{ font:900 clamp(30px,5vh,44px)/1 system-ui, sans-serif; color:#5A4A3A; } .fact b.plus{ color:#22B45E; } .fact b.minus{ color:#FF6A3D; } .fact .q{ color:#8A7A6A; }
.pdots{ display:flex; gap:6px; } .pdots i{ width:24px; height:24px; border-radius:50%; background:#3B7BD8; } .pdots i.b{ background:#22B45E; } .pdots i.x{ background:#ccc; outline:3px solid #FF6A3D; }
@media (max-width:760px), (max-aspect-ratio:4/5){ .ui{ flex-wrap:wrap; width:min(100%,370px); } #tf, .fact{ width:100%; justify-content:center; } #tf .tf{ width:220px; } }</style>
</head>
<body>
<div id="world"></div>
<div id="game" class="locked"><div class="stage s6" id="stage">
  <div class="ui" id="panel">
    <div id="tf" hidden></div>
    <div class="fact" id="fact" hidden></div>
    <div class="pdots" id="pic" hidden></div>
    <div id="hh"></div>
    <button id="check" class="bigbtn btn3d b-sun" aria-label="Check"><svg viewBox="0 0 48 48"><path d="M10 25l9 9 19-20" stroke="#2B2350" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div></div>
<script src="kit.js"></script><script src="frame.js"></script><script src="unit5.js"></script>
<script type="module">
import { mount } from './shabbos12.js';
const $ = id => document.getElementById(id);
let K, H, R, done, TF;
const band = () => [innerWidth < 760 ? 80 : 92, $('panel').getBoundingClientRect().top - 8];
const ans = () => R.kind === 'five' ? R.n - 5 : R.kind === 'ten' ? 10 - R.n : R.op === '+' ? R.a + R.b : R.a - R.b;
function hooks() { const k = ans(); GAME.right = () => H.moves(k, '#hh').concat([{ tap: '#check' }]); GAME.wrong = () => H.moves(k + 1, '#hh').concat([{ tap: '#check' }]); }
function open() { GAME.phase = 'answer'; FR.lock(false); H.lock(false); hooks(); }
const lit = async (from, to, start) => { for (let i = from; i < to; i++) { TF.cell(i).classList.add('lit'); await FR.say(FR.Word(start + i - from) + (i === to - 1 ? '.' : ','), { noRepeat: true }); } TF.el.querySelectorAll('.lit').forEach(c => c.classList.remove('lit')); };
async function check() {
  NK.unlock(); if (GAME.phase !== 'answer') return; GAME.phase = 'busy'; FR.lock(true); H.lock(true); const k = ans();
  if (H.count() === k) { const line = R.kind === 'five' ? 'Yes! ' + FR.Word(R.n) + ' is five and ' + FR.word(k) + '.' : R.kind === 'ten' ? 'Yes! ' + FR.Word(R.n) + ' and ' + FR.word(k) + ' make ten.' : 'Yes! It is ' + FR.word(k) + '.';
    await FR.yes($('check'), line); const d = done; done = null; d(R.misses === 0); return; }
  FR.oops($('check')); R.misses++;
  if (R.kind === 'five') { await FR.say("Let's look. The full row is five."); for (let i = 0; i < 5; i++) TF.cell(i).classList.add('lit'); await FR.say('Then:', { noRepeat: true }); TF.el.querySelectorAll('.lit').forEach(c => c.classList.remove('lit')); await lit(5, R.n, 1); }
  else if (R.kind === 'ten') { await FR.say("Let's look. Count the empty boxes."); await lit(R.n, 10, 1); }
  else { await FR.say("Let's look at the dots."); $('pic').hidden = false; $('pic').innerHTML = R.op === '+' ? '<i></i>'.repeat(R.a) + '<i class="b"></i>'.repeat(R.b) : '<i></i>'.repeat(R.a - R.b) + '<i class="x"></i>'.repeat(R.b);
    const left = [...$('pic').querySelectorAll('i:not(.x)')]; for (let j = 0; j < left.length; j++) { left[j].style.outline = '4px solid #FFC93D'; await FR.say(FR.Word(j + 1) + (j === left.length - 1 ? '.' : ','), { noRepeat: true }); } }
  H.set(0); await FR.say('Show me again.'); open();
}
const PLAN = [{ kind: 'five', n: 7 }, { kind: 'ten', n: 6 }, { kind: 'fact', a: 3, op: '+', b: 2 }, { kind: 'five', n: 9 }, { kind: 'ten', n: 8 }, { kind: 'fact', a: 5, op: '-', b: 3 }];
function play(F, i) {
  return new Promise(async res => {
    R = Object.assign({ misses: 0 }, PLAN[i]); done = res; GAME.phase = 'busy'; F.lock(true); H.set(0); H.lock(true); $('pic').hidden = true;
    const fr = R.kind !== 'fact'; $('tf').hidden = !fr; $('fact').hidden = fr; if (fr) TF.set(R.n); requestAnimationFrame(() => K.fit());
    if (R.kind === 'five') { await F.say(F.Word(R.n) + ' in the ten-frame.'); open(); await F.say(F.Word(R.n) + ' is five and how many? Show me.', { repeat: 'A full row is five. How many more?' }); }
    else if (R.kind === 'ten') { await F.say(F.Word(R.n) + ' in the ten-frame.'); open(); await F.say('How many more make ten? Show me.', { repeat: 'Count the empty boxes. Show me.' }); }
    else { $('fact').innerHTML = '<span class="n">' + U5.num(R.a) + '</span><b class="' + (R.op === '+' ? 'plus">+' : 'minus">−') + '</b><span class="n">' + U5.num(R.b) + '</span><b>=</b><b class="q">?</b>';
      open(); await F.say(F.Word(R.a) + (R.op === '+' ? ' plus ' : ' minus ') + F.word(R.b) + '? Show me.', { repeat: 'Show me on your fingers.' }); }
  });
}
FR.game({
  id: 'u12-review', title: 'Review Time', rounds: 6,
  hero: '<div class="hero6"><img src="art/mendy-happy.png" alt=""><img src="art/shmuli-happy.png" alt=""></div>',
  init() { K = mount($('world'), { band }); K.setCups(0, 0); TF = U5.frame(0, false); $('tf').appendChild(TF.el); H = U5.hands(0, true); $('hh').appendChild(H.el); $('check').addEventListener('click', check); },
  demo: async F => {
    R = { kind: 'demo' }; $('tf').hidden = false; $('fact').hidden = true; TF.set(6); await F.say('Review time! Watch me. Six in the ten-frame.');
    await F.say('A full row is five, and one more.'); await F.handTo(H.el, .3, .6); await F.handTap(); H.set(1); NK.sound.pop(); await F.handTo($('check')); await F.handTap(); F.handHide();
    await F.say('Six is five and one!'); H.set(0);
  },
  round: (F, i) => play(F, i),
  endSay: s => s >= 2 ? 'You remember so much!' : 'Good work! Let\'s play once more.'
});
</script>
</body>
</html>
