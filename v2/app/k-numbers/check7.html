<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Show Me: More and less — Kindergarten Numbers</title>
<!-- Kindergarten Numbers, Unit 7 MASTERY CHECK ("Show me"), from the map: compare groups up to 10 (scattered too),
     compare numbers 1-10, one more and one less. Two rounds of each. No line-up help until a slip. -->
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
<link rel="stylesheet" href="frame.css"><link rel="stylesheet" href="unit6.css">
<style>#same svg{ width:94%; height:94%; }   /* "the same": an apple, equals, an apple */</style>
<style>#add svg{ width:84%; height:84%; }   /* the big apple button: the apple fills it (one more apple) */</style>
<style>.cardrow{ display:flex; gap:clamp(14px,4vw,40px); align-items:center; } .cardrow .numcard{ cursor:pointer; } .cardrow[hidden], #check[hidden], #same[hidden], .goal[hidden]{ display:none; }</style>
</head>
<body>
<div id="world"></div>
<div id="game" class="locked"><div class="stage s6" id="stage">
  <div class="ui" id="panel">
    <button id="same" class="bigbtn btn3d b-white eq" aria-label="The same" hidden><svg viewBox="0 0 56 40"><circle cx="10" cy="22" r="8.5" fill="#E8322B"/><path d="M10 13.5c0-3 1.5-5 3.5-6" stroke="#7A4A22" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M22 17h12M22 27h12" stroke="#2B2350" stroke-width="5" stroke-linecap="round"/><circle cx="46" cy="22" r="8.5" fill="#E8322B"/><path d="M46 13.5c0-3 1.5-5 3.5-6" stroke="#7A4A22" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg></button>
    <div class="cardrow" id="cards" hidden><div class="numcard" id="c0" role="button"></div><div class="numcard" id="c1" role="button"></div></div>
    <div class="goal" id="goal" hidden></div>
    <button id="add" hidden class="bigbtn btn3d b-white" aria-label="One more apple"><svg viewBox="0 0 48 48"><circle cx="20" cy="29" r="14" fill="#E8322B"/><path d="M20 15c0-4 2-7 5-8" stroke="#7A4A22" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="37" cy="12" r="10" fill="#22B45E"/><path d="M37 6.5v11M31.5 12h11" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/></svg></button>
    <button id="check" class="bigbtn btn3d b-sun" aria-label="Check" hidden><svg viewBox="0 0 48 48"><path d="M10 25l9 9 19-20" stroke="#2B2350" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div></div>
<script src="kit.js"></script><script src="frame.js"></script><script src="unit5.js"></script>
<script type="module">
import { mount } from './orchard7.js';
const $ = id => document.getElementById(id);
let O, R, done, busy = Promise.resolve();
const NAME = ['Dovid', 'Shmuel'];
const band = () => [innerWidth < 760 ? 80 : 92, $('panel').getBoundingClientRect().top - 8];
const ICON = { 1: '<svg viewBox="0 0 48 48"><path d="M24 10v28M10 24h28" stroke="#22B45E" stroke-width="8" stroke-linecap="round"/></svg>', '-1': '<svg viewBox="0 0 48 48"><path d="M10 24h28" stroke="#FF8A3D" stroke-width="8" stroke-linecap="round"/></svg>' };
function moves(to) { const out = [], c = O.count(1); for (let k = c; k < to; k++) out.push({ tap: '#add' }); for (let k = c; k > to; k--) out.push({ tap: '.tspot[data-id="a1-' + (k - 1) + '"]' }); return out; }
function more() { const a = O.count(0), b = O.count(1); return a === b ? -1 : a > b ? 0 : 1; }
function hooks() {
  if (R.kind === 'groups') { const m = more(), ok = m < 0 ? '#same' : '.tspot[data-id="side' + m + '"]', bad = m < 0 ? '.tspot[data-id="side0"]' : '.tspot[data-id="side' + (1 - m) + '"]';
    GAME.right = () => [{ tap: ok }]; GAME.wrong = () => [{ tap: bad }]; return; }
  if (R.kind === 'nums') { const m = R.n[0] > R.n[1] ? 0 : 1; GAME.right = () => [{ tap: '#c' + m }]; GAME.wrong = () => [{ tap: '#c' + (1 - m) }]; return; }
  GAME.right = () => moves(R.base + R.d).concat([{ tap: '#check' }]); GAME.wrong = () => moves(R.base).concat([{ tap: '#check' }]);
}
function open() { GAME.phase = 'answer'; FR.lock(false); hooks(); O.choose(R.kind === 'groups'); }   /* tap a blanket: both blankets shine */
/* "which number": the apples wait under cloths until we check */
function hide() { O.cover(0, true); O.cover(1, true); O.setApples(0, R.n[0]); O.setApples(1, R.n[1]); }
function finish(el, line) { return FR.yes(el, line).then(() => { const d = done; done = null; d(R.misses === 0); }); }
async function lineUp() { const n = Math.min(O.count(0), O.count(1)); for (let k = 0; k < n; k++) await O.pair(k, k); const m = more(); if (m >= 0) { O.glowSide(m, true); await FR.say('Look! ' + NAME[m] + "'s apples are left over."); O.glowSide(m, false); } else await FR.say('Look! Every apple has a partner.'); O.clearPairs(); }
async function group(k, el) {
  if (GAME.phase !== 'answer' || R.kind !== 'groups') return; GAME.phase = 'busy'; FR.lock(true); O.choose(false); const m = more();
  if (k === m) return finish(el, m < 0 ? 'Yes! The same.' : 'Yes! ' + NAME[m] + ' has more.');
  FR.oops(el); R.misses++; await lineUp(); open();
}
async function card(k) {
  NK.unlock(); if (GAME.phase !== 'answer' || R.kind !== 'nums') return; GAME.phase = 'busy'; FR.lock(true); const m = R.n[0] > R.n[1] ? 0 : 1;
  if (k === m) return finish($('c' + k), 'Yes! ' + FR.Word(R.n[m]) + ' is more.');
  FR.oops($('c' + k)); R.misses++; O.cover(0, false); O.cover(1, false); await lineUp(); await FR.say(FR.Word(R.n[m]) + ' is more.'); hide(); open();
}
async function check() {
  NK.unlock(); if (GAME.phase !== 'answer' || R.kind !== 'build') return; GAME.phase = 'busy'; FR.lock(true); await busy; const w = R.base + R.d, have = O.count(1);
  if (have === w) return finish($('check'), 'Yes! ' + FR.Word(w) + ' is one ' + (R.d > 0 ? 'more' : 'less') + ' than ' + FR.word(R.base) + '.');
  FR.oops($('check')); R.misses++; await FR.say("Let's look. Dovid has " + FR.word(R.base) + '. One ' + (R.d > 0 ? 'more' : 'less') + ' is ' + FR.word(w) + '.');
  await FR.say(have < w ? 'Tap the apple button for more.' : 'Tap an apple to put it back.'); open();
}
const PLAN = [{ kind: 'groups', n: [7, 5] }, { kind: 'nums', n: [6, 9] }, { kind: 'build', base: 5, d: 1 }, { kind: 'groups', n: [6, 6] }, { kind: 'nums', n: [8, 3] }, { kind: 'build', base: 8, d: -1 }];
function play(F, i) {
  return new Promise(async res => {
    R = Object.assign({ misses: 0 }, PLAN[i]); done = res; GAME.phase = 'busy'; F.lock(true);
    $('same').hidden = R.kind !== 'groups'; $('cards').hidden = R.kind !== 'nums'; $('goal').hidden = $('check').hidden = $('add').hidden = R.kind !== 'build';
    O.unspot('side0'); O.unspot('side1'); O.clearPairs(); O.choose(false); O.cover(0, false); O.cover(1, false);
    if (R.kind === 'groups') { O.setApples(0, R.n[0], 'scatter'); O.setApples(1, R.n[1], 'scatter'); O.sideSpot(0); O.sideSpot(1); open();
      await F.say('Who has more? Tap his blanket.', { repeat: 'Tap the blanket with more. Or tap the same.' });
      $('same').classList.add('ready'); await F.say('Or the same? Tap this.', { noRepeat: true }); $('same').classList.remove('ready'); }
    else if (R.kind === 'nums') { hide(); $('c0').innerHTML = U5.num(R.n[0]); $('c1').innerHTML = U5.num(R.n[1]); open();
      await F.say('Which number is more?', { repeat: F.Word(R.n[0]) + ' or ' + F.word(R.n[1]) + '?' }); }
    else { O.setApples(0, R.base); O.setApples(1, 0); $('goal').innerHTML = ICON[R.d]; O.glowSide(0, true); await F.say('Dovid has ' + F.word(R.base) + '.'); O.glowSide(0, false); open();
      await F.say('Give Shmuel one ' + (R.d > 0 ? 'more' : 'less') + ' than Dovid.', { repeat: 'Tap the apple button. Then check.' }); }
  });
}
FR.game({
  id: 'u7-check', title: 'Show Me!', rounds: 6,
  hero: '<div class="hero6"><img src="art/shmuel-happy.png" alt=""></div>',
  init() {
    O = mount($('world'), { kids: ['dovid', 'shmuel'], band, stack: true });
    $('add').addEventListener('click', () => { NK.unlock(); if (GAME.phase !== 'answer' || R.kind !== 'build') return; busy = busy.then(() => O.count(1) < 10 ? O.drop(1) : null); });
    O.onTap = (id, el) => { if (GAME.phase !== 'answer') return; if (id.startsWith('side')) group(+id[4], el);
      else if (R.kind === 'build' && id.startsWith('a1-')) busy = busy.then(() => O.take(1)); };
    $('same').addEventListener('click', () => { NK.unlock(); group(-1, $('same')); }); $('c0').addEventListener('click', () => card(0)); $('c1').addEventListener('click', () => card(1)); $('check').addEventListener('click', check);
  },
  demo: async F => {   /* one quick look before the check */
    R = { kind: 'demo', misses: 0 }; O.setApples(0, 3, 'scatter'); O.setApples(1, 4, 'scatter');
    await F.say('Dovid has the orange blanket. Shmuel has the blue one.');
    await F.say('Show me what you know! Watch me first.'); await lineUp(); O.choose(true); await F.say('Shmuel has more. I tap his blanket.');
    O.sideSpot(1); await F.handTo(document.querySelector('.tspot[data-id="side1"]')); await F.handTap(); O.unspot('side1'); O.choose(false);
    O.setApples(0, 3, 'scatter'); O.setApples(1, 3, 'scatter'); $('same').hidden = false; await lineUp();
    await F.say('Three and three. The same! I tap the same button.'); await F.handTo($('same')); await F.handTap(); $('same').hidden = true;
    O.setApples(0, 0); O.setApples(1, 0); await F.say('Then numbers, and one more or one less.');
  },
  round: (F, i) => play(F, i),
  endSay: s => s >= 2 ? 'More, less, the same. Unit seven done!' : 'Good try! Let\'s practise and come back.',
  practice: 'pairs7.html'
});
</script>
</body>
</html>
