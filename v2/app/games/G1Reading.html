ns\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e');\n  window.__kit.last={id:Ls.id,ok:ok,stars:stars}; post({tlKDone:1, skill:Ls.id, ok:ok, stars:stars});\n  await say(ok===3?'You did it! Hop on the train to your next station!':'Great working! You are on the right trail.');\n  $('again').onclick=()=\u003elesson(Ls); $('menu2').onclick=menu; }\nfunction menu(){ EPOCH++; CUR=null; stopAudio(); $('track').hidden=true; $('home').hidden=true; $('h1').innerHTML='1st Grade Reading \u003csmall\u003e13 lessons in the new style\u003c/small\u003e';\n  view('\u003cdiv class=\"menu\"\u003e'+L.map((l,i)=\u003e'\u003cbutton class=\"lt\" type=\"button\" data-i=\"'+i+'\"\u003e'+(done[l.id]!=null?'\u003cspan class=\"done\"\u003e'+(done[l.id]===3?'⭐':'✓')+'\u003c/span\u003e':'')+'\u003cspan class=\"e\"\u003e'+l.e+'\u003c/span\u003e'+l.t+'\u003csmall\u003e'+l.sub+'\u003c/small\u003e\u003c/button\u003e').join('')+'\u003c/div\u003e');\n  cap.textContent='Pick a lesson. Each one talks to you.'; scene.querySelectorAll('.lt').forEach(b=\u003eb.onclick=()=\u003e{ tone(523,.1); lesson(L[+b.dataset.i]); }); }\n$('home').onclick=()=\u003e{ menu(); };\nwindow.__kit.lessons=L.map(l=\u003el.id); window.__kit.start=i=\u003elesson(L[i]);\nconst h=String(window.KL_OPEN||location.hash.slice(1)), hi=L.findIndex(l=\u003el.id===h); if(hi\u003e=0) lesson(L[hi]); else menu();\n})();\n\u003c/script\u003e\n";
