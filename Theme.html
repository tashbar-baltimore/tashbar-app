<!-- Tashbar design system — UPGRADE Phase 4 (2026-11-10): "Royal Gold". Added to every page by tlTheme_() in Theme.js, before </head>.
     One block per page type: boy (sign-in, home, lessons), staff (staff grid, sign-off, placement, old teacher page), canteen (kiosk). -->
<link id="theme-font" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&family=Andika:wght@400;700&display=swap">
<style id="theme-boy">
html:root[data-theme],html:root{--display:'Rubik',system-ui,sans-serif;--body:'Andika','Segoe UI',system-ui,sans-serif;
--ink:#1E1B4B;--soft:#4C4A7A;--card:#FFFFFF;--card2:#F5F3FF;--line:#DDD6FE;--amber:#F59E0B;--amber-ink:#78350F;--mint:#16A34A;--mint-l:#DCFCE7;--win:#FEF3C7;--coin:#FACC15;--coin-d:#CA8A04;--boss:#6D28D9;
--math:#2563EB;--read:#16A34A;--writ:#DC2626;--voc:#CA8A04;
--g-hero:linear-gradient(120deg,#1E1B4B 0%,#312E81 40%,#4338CA 75%,#6D28D9 100%);
--g-math:linear-gradient(135deg,#1E3A8A,#2563EB 60%,#38BDF8);--g-read:linear-gradient(135deg,#14532D,#16A34A 60%,#84CC16);--g-writ:linear-gradient(135deg,#7F1D1D,#DC2626 60%,#F97316);--g-voc:linear-gradient(135deg,#713F12,#CA8A04 60%,#FACC15);--g-boss:linear-gradient(135deg,#0F0A2E,#5B21B6 55%,#EAB308);
--shadow:0 12px 32px rgba(30,27,75,.16)}
html:root[data-theme] body,html:root body{background:radial-gradient(900px 500px at 0% 0%,#E0E7FF,transparent 60%),radial-gradient(800px 500px at 100% 0%,#EDE9FE,transparent 60%),radial-gradient(900px 600px at 100% 100%,#FEF9C3,transparent 60%),#F7F6FF;background-attachment:fixed}
html:root[data-theme] .nextup,html:root .nextup{background:linear-gradient(115deg,#B45309 0%,#EAB308 50%,#FDE047 100%)!important;color:#1E1B4B!important;box-shadow:0 16px 36px rgba(234,179,8,.35)!important}
html:root .nextup h2,html:root .nextup .t{color:#1E1B4B!important}
html:root[data-theme] .nextup small,html:root .nextup small{color:#7C2D12}
html:root[data-theme] .nextup .btn,html:root .nextup .btn{background:#1E1B4B;color:#FDE047}
.hero{box-shadow:0 20px 44px rgba(49,46,129,.4)!important;border:3px solid #EAB308}
.panel,.world,.jrow{border-radius:20px!important}
.btn{border-radius:14px!important;font-weight:800!important;font-family:var(--display)!important}
.btn.go{background:linear-gradient(180deg,#4338CA,#312E81)!important;color:#FDE047!important;box-shadow:0 5px 0 #1E1B4B!important}
.ocard{border:3px solid #EAB308}
.oband{background:linear-gradient(135deg,#312E81,#6D28D9)!important}
.stamp{font-family:var(--display)!important}
/* sign-in */
.si2{background:radial-gradient(900px 600px at 10% 0%,#4338CA,transparent 60%),radial-gradient(800px 600px at 100% 100%,#6D28D9,transparent 60%),#1E1B4B!important}
.si2 .hello,.si2 .brand2 h1,.si2 .brand2 .sub,.si2 .wt,.si2 .thought{color:#FEF3C7!important}
.si2 .brand2 .mark{background:#EAB308!important;color:#1E1B4B!important}
.si2 .pad2{--c:#4338CA!important;border:3px solid #EAB308!important}
.si2 .go2{background:linear-gradient(180deg,#FACC15,#EAB308)!important;color:#1E1B4B!important;box-shadow:0 5px 0 #A16207!important}
.si2 .go2:disabled{opacity:.55}
.si2 .wrow.gold{background:linear-gradient(135deg,#B45309,#EAB308)!important}
/* Phase 3 screens in the same colors */
.p3fc{background:radial-gradient(circle at 50% 30%,#FEFCE8,#FDE68A 45%,#6D28D9 130%)!important}
.p3lvl{color:#1E1B4B!important;text-shadow:0 6px 0 #EAB308!important}
.p3chip{border-color:#EAB308!important}
.tlgoal{background:rgba(67,56,202,.10)!important}
</style>
<style id="theme-staff">
:root{--navy:#1E1B4B;--navy2:#312E81;--gold:#EAB308;--gold2:#FEF3C7;--bg:#F7F6FF;--line:#DDD6FE;--ink:#1E1B4B;--soft:#4C4A7A;--pri:#312E81;--soft2:#EEF2FF}
body{font-family:'Andika','Segoe UI',system-ui,sans-serif!important;background:#F7F6FF}
h1,h2,h3,button,.btn{font-family:'Rubik','Segoe UI',system-ui,sans-serif}
</style>
<style id="theme-canteen">

body{font-family:'Andika','Segoe UI',system-ui,sans-serif!important;background:radial-gradient(900px 500px at 0% 0%,#E0E7FF,transparent 60%),radial-gradient(900px 600px at 100% 100%,#FEF9C3,transparent 60%),#F7F6FF!important}
h1,h2,h3,button{font-family:'Rubik','Segoe UI',system-ui,sans-serif}
</style>
