   Loaded by sgPage_ right AFTER StaffPlus (it uses window.SPX from StaffPlus). Server: StaffNotes.js.
   1. 📌 PICK A LESSON for a boy (or for his whole group): from his card, from any Kodesh lesson row, or for a group stuck together.
      He sees it on his home screen with one Start button (RebbePick.html). Done = he masters it, or passes the bechina.
   2. 📝 NOTES on the boy card: note, praise, concern, parent contact, goal. Staff only. A praise or goal can also go to him
      as a 🎉 shout-out (he sees it once, big, with confetti); the card shows when he saw it.
   3. 📅 THIS WEEK tab: every boy's week at a glance, who is shining, who needs a nudge, who is stuck on the same lesson,
      one-tap shout-outs, Print, Copy and Email the summary. Last week and earlier with the arrows.
   4. Badges on every grid: 📌 open picks and 📝 recent notes next to each name. A "My desk" card on the Today tab.
   No "double slash" in this file. */

/* ---------- data ---------- */
function loadDesk(){ run('sgDesk',S.token).then(r=>{ D.desk=r; render(); }).catch(()=>{}); }
function loadCat(){ if(D.cat||D.catBusy) return; D.catBusy=1; run('sgPickCatalog',S.token).then(r=>{ D.cat=r; D.catBusy=0; render(); }).catch(e=>{ D.catBusy=0; say(msg(e)); }); }
function loadNotes(sid,force){ const n=D.notes[sid]; if(n&&!force&&n.at>Date.now()-60000) return; D.notes[sid]=Object.assign({},n||{},{at:Date.now()}); run('sgNotes',S.token,sid).then(r=>{ D.notes[sid]={at:Date.now(),d:r}; if(S.card===sid) render(); }).catch(()=>{}); }
function loadWeek(back,force){ const w=D.wk[back]; if(w&&!force&&(w.busy||w.at>Date.now()-300000)) return; D.wk[back]=Object.assign({},w||{},{busy:1}); run('sgWeek',S.token,back).then(r=>{ D.wk[back]={at:Date.now(),d:r}; render(); }).catch(e=>{ D.wk[back]={at:Date.now(),err:msg(e)}; render(); }); }
function sinceT(){ if(D.sinceT) return D.sinceT; let t=0; try{ t=Number(localStorage.getItem('sd-since'))||0; }catch(e){} D.sinceT=t||Date.now()-86400000; return D.sinceT; }
function loadSince(){ run('sgSince',S.token,sinceT()).then(r=>{ D.since=r; render(); }).catch(()=>{}); }
function loadReady(){ run('sgBechinaReady',S.token).then(r=>{ D.ready=r; render(); }).catch(()=>{}); }
setInterval(()=>{ if(S.token&&S.d&&!document.hidden){ loadDesk(); if(SP.tab==='lk') loadReady(); if(SP.tab==='today') loadSince(); } },120000);

/* ---------- picks ---------- */
const picksOf=sid=>D.desk?D.desk.picks.filter(p=>p.sid===sid):[];
const openPicks=sid=>picksOf(sid).filter(p=>!p.done);
function pickBtn(sid,id,done){ if(done||!D.desk) return ''; const tb=`<button class="mkb ghost" data-sd="teach1" data-id="${E(sid)}" data-l="${E(id)}" title="Teach this lesson together (Teacher mode)">🧑‍🏫</button>`; const p=picksOf(sid).find(x=>x.id===id);
 return tb+(p?`<button class="mkb ghost" data-sd="unpick" data-id="${E(sid)}" data-l="${E(id)}" title="Picked by ${E(p.by)}">📌 Picked · undo</button>`:`<button class="mkb ghost" data-sd="pick" data-id="${E(sid)}" data-l="${E(id)}" title="He will see it on his home screen">📌 Pick for him</button>`); }
function doPick(sids,id,note,undo){ if(D.busy) return; D.busy=true; render();
 run('sgPick',S.token,sids,id,note||'',!!undo).then(r=>{ D.busy=false; D.desk=r; D.find=null; say(undo?'Pick removed.':sids.length>1?`Picked for ${sids.length} boys. They will see it on their home screen.`:`Picked. ${first(sids[0])} will see it on his home screen.`); render(); })
  .catch(e=>{ D.busy=false; say(msg(e)); render(); }); }
function suggestions(sid){ const out=[]; const K=SP.lk&&SP.lk.boys.find(b=>b.id===sid);
 if(K) SP.lk.tracks.forEach(t=>{ const c=K.cells[t[0]]; if(c&&c.now&&c.status!=='green') out.push([c.now,t[1]+': '+X.lkName(c.now)]); });
 return out.slice(0,6); }
function finderHTML(){ const F=D.find; if(!F) return ''; if(!D.cat){ loadCat(); return '<div class="sd-find">Loading every lesson…</div>'; }
 const q=(F.q||'').trim().toLowerCase(), words=q.split(/\s+/).filter(Boolean);
 const L=D.cat.lessons.filter(x=>(F.subj==='all'||(F.subj==='LK'?/^LK/.test(x[2]):x[2]===F.subj))&&(!words.length||words.every(w=>(x[1]+' '+x[0]).toLowerCase().includes(w)))).slice(0,40);
 const tn=k=>{ const m=/^LK:(\w+)/.exec(k); return m?((D.cat.tracks||{})[m[1]]||m[1]):(SUBJ.find(s=>s[0]===k)||[0,k])[1]; };
 const g=SP.grp&&SP.groups&&SP.groups.find(x=>x.id===SP.grp), sug=F.sids.length===1?suggestions(F.sids[0]):[];
 return `<div class="sd-find" role="dialog" aria-label="Pick a lesson"><b>📌 Pick a lesson for ${F.sids.length===1?E(boyName(F.sids[0])):F.sids.length+' boys'}</b>
  ${sug.length?`<div class="sug"><small style="align-self:center;color:var(--soft)">His next lessons:</small>${sug.map(s=>`<button data-sd="pickgo" data-l="${E(s[0])}">${E(s[1])}</button>`).join('')}</div>`:''}
  <input type="search" id="sd-fq" placeholder="Type a lesson name, e.g. fractions, Rashi, aleph" value="${E(F.q||'')}" autocomplete="off">
  <div class="sp-chips" style="margin-top:6px">${SUBJ.map(s=>`<button class="${F.subj===s[0]?'on':''}" data-sd="fsub" data-f="${s[0]}">${s[1]}</button>`).join('')}</div>
  <input type="text" id="sd-fn" placeholder="A word for him (optional), e.g. Try this before Shabbos!" value="${E(F.note||'')}" maxlength="160" style="margin-top:6px">
  ${F.sids.length===1&&g&&g.sids.indexOf(F.sids[0])>=0&&g.sids.length>1?`<label><input type="checkbox" id="sd-fall" ${F.all?'checked':''}> Pick it for everyone in ${E(g.name)} (${g.sids.length} boys)</label>`:''}
  <div class="res">${L.map(x=>`<button data-sd="pickgo" data-l="${E(x[0])}" ${D.busy?'disabled':''}><span>${E(x[1])}</span><small>${E(tn(x[2]))}${x[3]?' · Level '+x[3]:''}</small></button>`).join('')||'<p style="color:var(--soft);margin:6px">No lesson matches. Try another word.</p>'}</div>
  <div style="text-align:right;margin-top:8px"><button class="sd-btn ghost" data-sd="fclose">Cancel</button></div></div>`; }

/* ---------- boy card: picks + notes ---------- */
function compOf(sid){ return D.comp[sid]=D.comp[sid]||{kind:'note',text:'',toBoy:false}; }
function cardHTML(sid){ loadNotes(sid); const P=picksOf(sid), N=D.notes[sid]&&D.notes[sid].d, C=compOf(sid);
 let h=`<div class="sd-sec sd-picks"><h3>📌 Lessons picked for him <small>he sees them on his home screen</small></h3>`;
 h+=P.length?P.map(p=>`<div class="sd-pk ${p.done?'done':''}">${p.done?'✅':'⏳'}<span><b>${E(lessonName(p.id,p.name))}</b><br><small>${E(p.by)} · ${E(ago(p.at))}${p.note?' · “'+E(p.note)+'”':''}${p.done?' · done!':''}</small></span>${p.done?'':`<button class="sd-x" data-sd="unpick" data-id="${E(sid)}" data-l="${E(p.id)}" aria-label="Remove this pick">×</button>`}</div>`).join(''):'<p style="color:var(--soft);margin:0 0 6px">Nothing picked yet.</p>';
 h+=D.find&&D.find.card===sid?finderHTML():`<button class="sd-btn ghost" data-sd="find" data-id="${E(sid)}">＋ Pick a lesson for him</button>`;
 h+=`</div><div class="sd-sec sd-notes"><h3>📝 Notes <small>staff only; boys and parents never see these, except a shout-out you send</small></h3><div class="sd-comp">

function weekStats(w){ const B=w.boys.filter(b=>X.inGrp(b.id)); const nDays=w.days.filter(d=>ymdDay(d)<=new Date()).length||1;

 const jump=B.filter(b=>b.pa>=5&&(b.a+b.ka)>=b.pa*1.5&&(b.a+b.ka)-b.pa>=20).sort((a,b)=>((b.a+b.ka)/b.pa)-((a.a+a.ka)/a.pa)).slice(0,4);
 const nudge=B.filter(b=>b.days.filter(Boolean).length<=Math.max(0,Math.min(1,nDays-2))).sort((a,b)=>(a.last||0)-(b.last||0));
 const stuckMap={}; B.forEach(b=>(b.stuck||[]).forEach(s=>{ (stuckMap[s[0]]=stuckMap[s[0]]||[]).push(b); }));
 const stuck=Object.keys(stuckMap).map(id=>[id,stuckMap[id]]).sort((a,b)=>b[1].length-a[1].length).slice(0,8);
 return {B,act,nDays,sum,shine,jump,nudge,stuck}; }

 if(a==='teachx'){ D.teach=null; render(); return; }
 if(a==='teachgo'){ const T=D.teach; if(!T) return; D.busy=true; render(); run('sgTeachTogether',S.token,T.all&&T.grp?T.grp.sids:T.sids,T.l,T.min).then(r=>{ D.busy=false; D.teach=null; try{ if(typeof S!=='undefined') S.tmList=r; }catch(x){} const nb=(T.all&&T.grp?T.grp.sids:T.sids).length; say(`🧑‍🏫 Class started for ${nb} boy${nb===1?'':'s'} for ${T.min} minutes. End it any time in Teacher mode.`); render(); }).catch(err=>{ D.busy=false; say(msg(err)); render(); }); return; }
 if(a==='popx'){ D.pop=null; render(); return; }
 if(a==='popq'){ if(D.pop){ D.pop.text=b.dataset.t; D.focus='sd-pt'; render(); } return; }
 if(a==='popgo'){ const P=D.pop; if(!P||!P.text.trim()) return; D.busy=true; render(); run('sgNote',S.token,P.sid,P.star?'star':'praise',P.text,true).then(r=>{ D.busy=false; D.pop=null; D.notes[P.sid]={at:Date.now(),d:r}; say(`🎉 Sent! ${first(P.sid)} will see it on his home screen.`); loadDesk(); render(); }).catch(err=>{ D.busy=false; say(msg(err)); render(); }); return; }
},true);
document.addEventListener('input',e=>{ const t=e.target; if(!t||!t.id) return;
 if(t.id==='sd-fq'&&D.find){ D.find.q=t.value; D.focus='sd-fq'; render(); return; }
 if(t.id==='sd-fn'&&D.find){ D.find.note=t.value; return; }
 if(t.id==='sd-pt'&&D.pop){ D.pop.text=t.value; return; }
 if(t.id==='sd-cgt'&&D.cg){ D.cg.text=t.value; return; }
 if(t.id==='sd-repmsg'&&D.rep){ D.rep.msg=t.value; document.querySelectorAll('.sd-paper .msg').forEach(m=>{ m.textContent=t.value; }); document.querySelectorAll('.sd-paper .msgh').forEach(h=>{ h.style.display=t.value?'':'none'; }); return; }
 if(t.id.indexOf('sd-nt-')===0){ compOf(t.id.slice(6)).text=t.value; return; } });
document.addEventListener('change',e=>{ const t=e.target; if(!t) return;
 if(t.id==='sd-tall'&&D.teach){ D.teach.all=t.checked; const p=document.querySelector('.sd-pop'); if(p){ p.remove(); document.querySelector('.sd-shade')&&document.querySelector('.sd-shade').remove(); } render(); return; }
 if(t.id==='sd-cgk'&&D.cg){ D.cg.tk=t.value; return; }
 if(t.id==='sd-cgl'&&D.cg){ D.cg.tl=t.value; return; }
 if(t.id==='sd-fall'&&D.find){ D.find.all=t.checked; return; }
 if(t.dataset&&t.dataset.sdInc&&D.rep&&D.rep.inc){ D.rep.inc[t.dataset.sdInc]=t.checked?1:0; const l=t.closest('label'); if(l) l.classList.toggle('off',!t.checked); return; }
 if(t.dataset&&t.dataset.sdGk){ compOf(t.dataset.sdGk).tk=t.value; if(t.value) compOf(t.dataset.sdGk).toBoy=true; render(); return; }
 if(t.dataset&&t.dataset.sdGl){ compOf(t.dataset.sdGl).tl=t.value; return; }
 if(t.dataset&&t.dataset.sdChk){ compOf(t.dataset.sdChk).toBoy=t.checked; render(); return; }
 if(t.matches&&t.matches('[data-sd-sort]')){ D.wkSort=t.value; render(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(D.bs){ D.bs=null; render(); } else if(D.cg){ D.cg=null; render(); } else if(D.teach){ D.teach=null; render(); } else if(D.rep){ D.rep=null; render(); } else if(D.pop){ D.pop=null; render(); } else if(D.find){ D.find=null; render(); } } });
if(S.d&&S.d.boys) render();
})();
