<!-- HomePage.html — the front home page (sign-in screen), added 2026-11-11 (v46) at the Head of School's request.
     Only the code pad ("punch card") in the middle. Around it: the school logo, subjects flying across the screen, sparkles,
     and warm, encouraging messages. Joined to QuestPage by sgQuest_ (StaffGrid.js) the same way as SignOutBar and PathfinderCard.
     It replaces only the LOOK of vSignin(); the code pad keeps the same buttons (data-act pin/del/signin), so sign-in works as before.
     The moving background lives outside #app, so it does not restart every time a number is tapped.
     LOGO: the school logo is in HP_LOGO (a data: URL), shown on a white plaque with a gold ring. If it is emptied, a gold "T" crest shows. -->
<style id="hp-css">
body.hp-on{background:#1B1145!important}
body.hp-on{overflow-x:hidden}
body.hp-on .wrap{position:relative;z-index:1;padding:0!important;margin:0 auto!important;max-width:none!important}
#hpbg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;display:none;
 background:radial-gradient(900px 600px at 12% 8%,rgba(236,72,153,.45),transparent 60%),radial-gradient(900px 700px at 92% 95%,rgba(251,191,36,.42),transparent 60%),radial-gradient(800px 600px at 90% 5%,rgba(56,189,248,.35),transparent 60%),linear-gradient(140deg,#24125F 0%,#3B1D8F 45%,#5B21B6 75%,#7C2D92 100%)}
body.hp-on #hpbg{display:block}
/* SPEED 3 (Nov 15): this screen was choppy on phones and slow Chromebooks. Same look, drawn the cheap way: the glows are soft gradients (no live blur),
   the flying chips no longer blur what is behind them, the rainbow ring and the shine MOVE a ready-made picture instead of repainting the card every frame. */
#hpbg .glow{position:absolute;width:60vmax;height:60vmax;border-radius:50%;opacity:.35;animation:hpdrift 22s ease-in-out infinite alternate;will-change:transform}
#hpbg .g1{background:radial-gradient(closest-side,#F472B6 0%,rgba(244,114,182,.85) 55%,rgba(244,114,182,0) 100%);left:-20vmax;top:-20vmax}
#hpbg .g2{background:radial-gradient(closest-side,#FBBF24 0%,rgba(251,191,36,.85) 55%,rgba(251,191,36,0) 100%);right:-25vmax;bottom:-25vmax;animation-delay:-8s}
#hpbg .g3{background:radial-gradient(closest-side,#22D3EE 0%,rgba(34,211,238,.85) 55%,rgba(34,211,238,0) 100%);right:-10vmax;top:-30vmax;animation-delay:-14s;opacity:.22}
@keyframes hpdrift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#hpbg .st{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px rgba(255,255,255,.8);animation:hptw 3s ease-in-out infinite}
#hpbg .st.big{width:6px;height:6px;background:#FDE68A;box-shadow:0 0 12px 3px rgba(253,230,138,.9)}
@keyframes hptw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
#hpbg .fly{position:absolute;left:0;top:0;display:flex;align-items:center;gap:8px;padding:8px 16px 8px 10px;border-radius:999px;background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.28);color:#fff;font:700 clamp(15px,1.4vw,20px) var(--display,'Barlow'),sans-serif;white-space:nowrap;box-shadow:0 10px 30px rgba(20,0,60,.25);will-change:transform}

@keyframes hpB{0%{transform:translate(120vw,70vh) rotate(6deg)}50%{transform:translate(45vw,92vh) rotate(-6deg)}100%{transform:translate(-25vw,60vh) rotate(5deg)}}
@keyframes hpC{0%{transform:translate(-20vw,8vh) rotate(4deg)}50%{transform:translate(40vw,22vh) rotate(-5deg)}100%{transform:translate(120vw,40vh) rotate(6deg)}}
@keyframes hpD{0%{transform:translate(110vw,-10vh) rotate(-6deg)}50%{transform:translate(70vw,45vh) rotate(8deg)}100%{transform:translate(20vw,110vh) rotate(-4deg)}}
@keyframes hpE{0%{transform:translate(5vw,110vh) rotate(0)}50%{transform:translate(15vw,45vh) rotate(10deg)}100%{transform:translate(35vw,-15vh) rotate(-6deg)}}
@keyframes hpF{0%{transform:translate(90vw,115vh) rotate(0)}50%{transform:translate(80vw,50vh) rotate(-10deg)}100%{transform:translate(95vw,-15vh) rotate(8deg)}}
#hpbg .bub{position:absolute;max-width:min(300px,26vw);padding:16px 20px;border-radius:24px;background:rgba(255,255,255,.95);color:#3B0764;font:700 clamp(17px,1.6vw,23px)/1.3 var(--display,'Barlow'),sans-serif;text-align:center;box-shadow:0 18px 40px rgba(20,0,60,.35),0 0 0 4px rgba(253,230,138,.55);transition:opacity .6s,transform .6s;animation:hpbob 5s ease-in-out infinite}

#hpbg .bub::after{content:'';position:absolute;width:18px;height:18px;background:inherit;transform:rotate(45deg);bottom:-8px}
#hpbg .b1{left:6vw;top:16vh}#hpbg .b1::after{right:30px}
#hpbg .b2{left:8vw;bottom:14vh;animation-delay:-2s}#hpbg .b2::after{right:40px;top:-8px;bottom:auto}
#hpbg .b3{right:6vw;top:18vh;animation-delay:-1s}#hpbg .b3::after{left:30px}
#hpbg .b4{right:8vw;bottom:16vh;animation-delay:-3s}#hpbg .b4::after{left:40px;top:-8px;bottom:auto}
#hpbg .b5{left:3vw;top:46vh;animation-delay:-1.5s;background:#FEF3C7}#hpbg .b5::after{display:none}
#hpbg .b6{right:3vw;top:48vh;animation-delay:-2.5s;background:#E0F2FE}#hpbg .b6::after{display:none}
@keyframes hpbob{0%,100%{translate:0 0}50%{translate:0 -10px}}
.hp .thought{width:100%;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:18px;background:rgba(255,255,255,.12);border:1px solid rgba(253,230,138,.45);text-align:left;min-height:64px}

.hp{min-height:100vh;width:100vw;margin:0;padding:clamp(10px,2.4vh,30px) 16px;box-sizing:border-box;display:grid;place-items:center;text-align:center;color:#fff;position:relative}

.hp .crest.logo{width:min(360px,80vw,34vh);height:auto;padding:clamp(8px,1.4vh,14px) clamp(12px,1.8vh,20px);background:#fff;border-radius:22px;box-shadow:0 18px 40px rgba(20,0,60,.45),0 0 0 3px #E8C26A,0 0 0 7px rgba(255,255,255,.35)}

.hp .go2.signbtn:not(:disabled):active{transform:translateY(5px);box-shadow:0 2px 0 #6D28D9}
.hp .err2{min-height:1.2em;margin:4px 0 0;color:#BE123C;font:700 16px var(--body,'Barlow'),sans-serif}
.hp .busy2{margin:4px 0 0;color:#7C3AED;font:700 16px var(--body,'Barlow'),sans-serif}
.hp .shake{animation:hpshake .4s}
@keyframes hpshake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}

 #hpbg *,.hp *,.hp .card{animation:none!important;transition:none!important}

}
/* v157 (takeover3, HoS: "make sure everything is sharp"): pop-ups taller than the screen could not be read (top and bottom cut off, no scroll). Now they scroll and center only when they fit. */
.overlay{overflow-y:auto!important;overscroll-behavior:contain;overflow-anchor:none;align-items:start!important}
.overlay>.ocard{margin-block:auto}
/* the floating clock covered "Let's go!" on phones, and pop-up buttons on small screens */
@media (max-width:760px),(max-height:620px){body.hp-on #tlclock{display:none!important}}
@media (max-width:760px){body:has(.overlay) #tlclock{display:none!important}}
/* calmer sign-in screen: half the flying subject tags */
#hpbg .fly.alt{display:none}

.hp .crest.hl{width:min(400px,82vw,36vh);height:auto;padding:0;background:none;border-radius:22px;box-shadow:0 18px 40px rgba(20,0,60,.45)}
.hp .crest.hl::before{display:none}.hp .crest.hl{filter:drop-shadow(0 0 18px rgba(255,201,60,.35))}

<script>/* v162 speed (takeover3, HoS: "no 6-second waits"): sign-in in ONE trip to the server (msSignInFast in Speed.js) instead of three
   (code check, then msLoad, then ClassMode's tmMine). Same steps as QuestPage's pinGo; the class answer is handed to ClassMode
   (window.TL_PRE_TM). If the fast call fails for any reason, the old pinGo runs exactly as before. */
(function(){ if(typeof pinGo!=='function'||typeof run!=='function') return; var oldPinGo=pinGo;

  if(!r||!r.ok){ A.busy=false; SND.wrong(); A.err='That code didn\u2019t work. Try again.'; A.pin=''; return render(); }
  SRV.token=r.token; if(r.url) window.TL_APP_URL=r.url;

  return (r.load?Promise.resolve(r.load):run('msLoad',r.token)).then(function(d){
   SRV.states=d.states||{}; var me=(d.roster||[]).find(function(x){ return x.id===r.sid; })||{id:r.sid,name:r.name};

/* v164: with the app's address already known (it came with sign-in), these open at once instead of asking the server first */
