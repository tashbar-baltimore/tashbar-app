<title>Kindergarten Reading Lessons</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* TL-LESSON-KIT v1 (Little Explorers world). One bright single theme for K-1. Menu of 16 lessons; each lesson = 8 stations shown by the train. */
:root{
  --sky:#E8F6FF; --mat:#FFF6D8; --ink:#1F2A44; --sun:#FFC83D; --leaf:#2FBF71; --berry:#FF5D73; --sea:#3D8BFF; --grape:#8E5BFF;
  --card:#FFFFFF; --soft:#6B7A99;
  --f-head:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif; --f-body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:radial-gradient(circle at 15% 10%,#FFF9C4 0,transparent 35%),linear-gradient(180deg,var(--sky),var(--mat));color:var(--ink);font-family:var(--f-body);font-size:18px}
.wrap{max-width:980px;margin:0 auto;padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;min-height:100%;box-sizing:border-box}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-family:var(--f-head);font-weight:800;font-size:26px;margin:0;flex:1;min-width:200px}
.top h1 small{display:block;font-family:var(--f-body);font-size:13px;color:var(--soft);font-weight:600}
.pill{border:0;border-radius:999px;padding:8px 14px;font:800 15px var(--f-body);background:var(--card);color:var(--ink);box-shadow:0 3px 0 #d9d2b8;cursor:pointer}
.mode{display:inline-block;background:#FFE7EB;color:#b4233b;border-radius:10px;padding:2px 10px;font-weight:800;font-size:13px}
.track{position:relative;height:46px;background:var(--card);border-radius:24px;box-shadow:0 4px 0 #e6dfc2;display:flex;align-items:center;padding:0 16px}
.track .rail{position:absolute;left:24px;right:24px;top:50%;height:6px;background:repeating-linear-gradient(90deg,#c9b98a 0 14px,transparent 14px 22px);transform:translateY(-50%)}
.track .st{position:relative;flex:1;display:flex;justify-content:center}
.track .st i{width:16px;height:16px;border-radius:50%;background:#e8e2cc;border:3px solid #fff;box-shadow:0 0 0 2px #e8e2cc}
.track .st.done i{background:var(--leaf);box-shadow:0 0 0 2px var(--leaf)}
.train{position:absolute;top:2px;font-size:30px;transition:left .8s cubic-bezier(.5,1.6,.4,1);transform:translateX(-50%)}
.stage{flex:1;background:var(--card);border-radius:34px;box-shadow:0 10px 0 #eadfb8,0 20px 40px rgba(31,42,68,.12);padding:20px;display:flex;flex-direction:column;gap:14px;min-height:540px;position:relative;overflow:hidden}
.say{display:flex;align-items:center;gap:12px}
.spk{flex:0 0 auto;width:64px;height:64px;border-radius:50%;border:0;background:var(--sea);color:#fff;font-size:30px;cursor:pointer;box-shadow:0 5px 0 #2a63c0}
.spk.talk{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.cap{font:800 22px/1.3 var(--f-head);min-height:58px;display:flex;align-items:center}
.scene{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.row{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.g5{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.g5>div{display:flex;gap:4px}
.basket{position:relative;min-width:140px;min-height:110px;border-radius:0 0 60px 60px;background:linear-gradient(180deg,#F7C77B,#D9963E);border:6px solid #B87528;display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:center;gap:4px;padding:10px 10px 16px;box-sizing:border-box}
.basket.big{min-width:230px;min-height:140px;background:linear-gradient(180deg,#FFD98A,#E5A64A)}
.basket .lab{position:absolute;top:-30px;left:50%;transform:translateX(-50%);font:800 22px var(--f-head);background:var(--card);border-radius:12px;padding:0 10px;box-shadow:0 2px 0 #e6dfc2;white-space:nowrap}
.tapme{cursor:pointer}
.o{font-size:42px;line-height:1;display:inline-block;transition:transform .25s,filter .25s,opacity .4s;user-select:none}
.o.sm{font-size:30px}
.o.hl{transform:scale(1.35) translateY(-6px);filter:drop-shadow(0 0 8px #FFC83D)}
.o.lone{filter:drop-shadow(0 0 8px #FF5D73)}
.o.gone{opacity:.15;transform:scale(.7)}
.o.ghost{opacity:.18}
.o.pop{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:scale(0) translateY(-40px)}100%{transform:scale(1)}}
.o.fly{animation:fly 1.1s ease-out both}
@keyframes fly{0%{transform:translate(200px,-110px) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.o.flyaway{animation:flyaway 1.1s ease-in both}
@keyframes flyaway{100%{transform:translate(-220px,-140px) rotate(20deg);opacity:0}}
.tray{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:60px;padding:8px 14px;border-radius:20px;background:#F3F7FF}
.tray .o{cursor:pointer}
.plus,.eq{font:800 46px var(--f-head);color:var(--grape)}
.big-num{font:800 72px/1 var(--f-head);color:var(--berry)}
.card-num{font:800 96px/1 var(--f-head);color:var(--sea);background:#F3F7FF;border-radius:28px;padding:10px 30px}
.choices{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.ch{min-width:108px;height:108px;padding:0 10px;border-radius:30px;border:0;background:var(--sun);color:var(--ink);font:800 52px var(--f-head);box-shadow:0 7px 0 #D49A12;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ch.wide{font-size:38px;min-width:150px}
.ch small{font-size:12px;letter-spacing:1px;color:#7a5a00;max-width:100px;word-break:break-all;line-height:1.1}
.ch:active{transform:translateY(4px);box-shadow:0 3px 0 #D49A12}
.ch.no,.pic.no{opacity:.3;pointer-events:none}
.ch.yes{background:var(--leaf);color:#fff;box-shadow:0 7px 0 #1f8a51}
.pic{border:5px solid #E6E0CC;border-radius:26px;padding:10px 14px;background:#FFFDF5;cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:center;box-shadow:0 5px 0 #e6dfc2;min-width:96px;min-height:96px;font:inherit;color:inherit}
.pic .o{font-size:30px}
.pic.yes{border-color:var(--leaf);background:#E9FBF1}
.pic.huge .o{font-size:56px}
.pic.barpic{width:290px;max-width:86vw;justify-content:flex-start;padding-right:30px;box-sizing:border-box}
.frame{display:grid;grid-template-columns:repeat(5,60px);grid-template-rows:repeat(2,60px);gap:6px;background:#3D8BFF;padding:8px;border-radius:18px}
.frame>div{background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center}
.frame .o{font-size:38px}
.frame.mini{grid-template-columns:repeat(5,22px);grid-template-rows:repeat(2,22px);gap:3px;padding:4px;border-radius:8px}
.frame.mini .o{font-size:16px}
.frame .tapme{cursor:pointer}
.go{border:0;border-radius:28px;padding:16px 32px;font:800 28px var(--f-head);background:var(--leaf);color:#fff;box-shadow:0 7px 0 #1f8a51;cursor:pointer}
.go.alt{background:var(--sea);box-shadow:0 7px 0 #2a63c0}
.tiles{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:620px}
.tile{width:54px;height:54px;border-radius:14px;background:#FFF1C9;display:flex;align-items:center;justify-content:center;font:800 26px var(--f-head);box-shadow:0 3px 0 #e8d391}
.tile.q{background:#E7DEFF;color:var(--grape)}
.tile.hl{background:var(--sun);transform:translateY(-4px)}
.tile.ten{background:#D6F5E3}
.car{min-width:70px;height:62px;border-radius:14px 14px 8px 8px;background:var(--berry);color:#fff;display:flex;align-items:center;justify-content:center;font:800 32px var(--f-head);position:relative;box-shadow:0 4px 0 #c43a4f}
.car.q{background:var(--grape);box-shadow:0 4px 0 #6a3fd0}
.car.hl{transform:translateY(-6px)}
.car::after{content:"";position:absolute;bottom:-12px;left:10px;right:10px;height:14px;background:radial-gradient(circle at 10px 7px,#1F2A44 6px,transparent 7px),radial-gradient(circle at calc(100% - 10px) 7px,#1F2A44 6px,transparent 7px)}
.bar{height:30px;border-radius:15px 4px 4px 15px;position:relative;box-shadow:inset 0 -5px 0 rgba(0,0,0,.12)}
.bar::after{content:"";position:absolute;right:-18px;top:0;border-left:18px solid currentColor;border-top:15px solid transparent;border-bottom:15px solid transparent}
.bar.units{background-image:repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,255,255,.9) 22px 24px)!important}
.bars{display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.tower{display:flex;flex-direction:column-reverse;gap:2px;align-items:center;min-height:40px}
.tower i{width:44px;height:26px;border-radius:6px;display:block}
.bin{min-width:130px;min-height:120px;border-radius:20px;background:#F3F7FF;border:5px dashed #B9C7E6;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:4px;padding:8px;position:relative;cursor:pointer;font:inherit}
.bin .tag{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:34px;background:#fff;border-radius:14px;padding:0 6px}
.bin .o{font-size:28px}
.cell{position:relative;width:150px;height:150px}
.cell span{position:absolute;font-size:44px;line-height:1}
.spot{position:absolute;width:52px;height:52px;border-radius:50%;border:4px dashed var(--grape);background:rgba(142,91,255,.08);cursor:pointer}
.shelf{display:flex;flex-direction:column;gap:0;background:#C98B4A;padding:8px;border-radius:12px}
.shelf>div{height:72px;border-bottom:8px solid #8B5A2B;background:#F5E3C8;display:flex;align-items:flex-end;justify-content:center;gap:24px;padding:0 20px}
.shelf .o{font-size:46px}
.path{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.path .tile{position:relative}
.path .bun{position:absolute;top:-38px;font-size:34px;transition:none}
.night{background:linear-gradient(180deg,#1B2350,#3B3F8F);border-radius:24px;width:min(560px,92%);height:220px;position:relative}
.scatter{position:relative;width:min(360px,90%);height:230px;background:#F7FBFF;border-radius:24px}
.scatter .o{position:absolute}
.zaidy{font-size:76px}
.note{font-size:13px;color:var(--soft);text-align:center}
.burst{position:absolute;inset:0;pointer-events:none}
.start{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.start .hero{font-size:84px;letter-spacing:6px}
.start h2{font:800 40px/1.1 var(--f-head);margin:0;text-wrap:balance}
.start p{margin:0;color:var(--soft);max-width:52ch}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;width:100%}
.lt{border:0;border-radius:26px;background:#FFFDF5;box-shadow:0 6px 0 #e6dfc2;padding:14px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font:800 17px/1.15 var(--f-head);color:var(--ink);position:relative}
.lt .e{font-size:44px}
.lt small{font:600 12px var(--f-body);color:var(--soft)}
.lt .done{position:absolute;top:6px;right:10px;font-size:22px}
.svgsh{display:block}
button:focus-visible,.bin:focus-visible,.tapme:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
@media (max-width:560px){.path .tile{width:34px;height:40px;font-size:18px}.o{font-size:34px}.ch{min-width:84px;height:84px;font-size:40px}.ch.wide{font-size:28px;min-width:110px}.frame{grid-template-columns:repeat(5,46px);grid-template-rows:repeat(2,46px)}.frame .o{font-size:28px}.cap{font-size:18px}.basket.big{min-width:170px}.card-num{font-size:72px}.big-num{font-size:56px}.tile{width:44px;height:44px;font-size:21px}.car{min-width:54px;font-size:26px}.bin{min-width:120px}.stage{padding:14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ltr{display:inline-block;min-width:80px;font:900 72px var(--f-head);color:#1F2A44;line-height:1}
.ltr.big{font-size:120px;margin:0 16px}
.word{font:900 76px var(--f-head);letter-spacing:.06em;color:#1F2A44;background:#FFFDF5;border-radius:22px;padding:6px 26px;box-shadow:0 5px 0 #e6dfc2}
.word.sm{font-size:44px;letter-spacing:.02em}
.big1 .o{font-size:96px}.big1 small,.pic-w small{display:block;font:800 22px var(--f-head);color:#1F2A44}
.pic-w{flex-direction:column;min-width:150px;min-height:150px}
.pic-w .o{font-size:76px}
.pic .word{font-size:60px;box-shadow:none;background:transparent}
.wordb{min-width:auto}
</style>
<div class="wrap">
  <div class="top">
    <h1 id="h1">Kindergarten Reading <small>13 lessons in the new style · Little Explorers</small></h1>
    <span class="mode">Preview: nothing is saved to the school</span>
    <button class="pill" id="home" type="button" hidden>🏠 All lessons</button>
    <button class="pill" id="mute" type="button" aria-pressed="false">🔊 Voice on</button>
  </div>
  <div class="track" id="track" aria-label="Lesson progress" hidden><div class="rail"></div><div id="stations" style="display:contents"></div><div class="train" id="train" aria-hidden="true">🚂</div></div>
  <div class="stage" id="stage">
    <div class="say"><button class="spk" id="spk" type="button" aria-label="Say it again">🔊</button><div class="cap" id="cap" aria-live="polite"></div></div>
    <div class="scene" id="scene"></div>
    <canvas class="burst" id="burst"></canvas>
  </div>
  <p class="note">Every lesson: warm-up · story · mini-movie · we do it together · practice in 5+ kinds of games · real life · check · celebrate. Every instruction is spoken, so no reading is needed.</p>
</div>
<script>
(function(){
"use strict";
/* ================= KIT CORE ================= */
const FAST=/fast/.test(location.search)?0.04:1;
const STATIONS=['Warm-up','Story','Movie','Together','Practice','Real life','Check','Hooray'];
const TH=[{e:'🍎',n:'apples'},{e:'🐟',n:'fish'},{e:'🚗',n:'cars'},{e:'⚽',n:'balls'},{e:'⭐',n:'stars'},{e:'🍪',n:'cookies'},{e:'🐥',n:'chicks'},{e:'🎈',n:'balloons'},{e:'🍓',n:'strawberries'},{e:'🧸',n:'teddy bears'},{e:'🐞',n:'ladybugs'},{e:'🌷',n:'flowers'},{e:'🍩',n:'donuts'},{e:'🐸',n:'frogs'},{e:'🦋',n:'butterflies'},{e:'🍋',n:'lemons'}];
const $=id=>document.getElementById(id), scene=$('scene'), cap=$('cap');
let muted=false, lastLine='', themeI=Math.floor(Math.random()*TH.length), stars=0, MODE='help', BOT=null, BUSY=false;
window.__kit={bot:()=>BOT};
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const any=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function T(){ themeI=(themeI+1+Math.floor(Math.random()*4))%TH.length; return TH[themeI]; }
const wait=ms=>new Promise(r=>setTimeout(r,ms*FAST));
const helpOn=()=>MODE!=='check';
let voice=null; function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); voice=vs.find(v=>/en-US/i.test(v.lang)&&/female|samantha|google us/i.test(v.name))||vs.find(v=>/^en/i.test(v.lang))||null; }catch(e){} }
try{ speechSynthesis.onvoiceschanged=pickVoice; pickVoice(); }catch(e){}
function say(t){ lastLine=t; cap.textContent=t; const spk=$('spk');
  return new Promise(res=>{ const fb=setTimeout(()=>{ spk.classList.remove('talk'); res(); },Math.max(900,t.length*62)*FAST);
    if(muted||FAST<1||!('speechSynthesis' in window)) return;
    try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); if(voice) u.voice=voice; u.rate=.92; u.pitch=1.1; spk.classList.add('talk');
      u.onend=()=>{ clearTimeout(fb); spk.classList.remove('talk'); setTimeout(res,180); }; speechSynthesis.speak(u); }catch(e){} }); }
$('spk').onclick=()=>{ if(lastLine) say(lastLine); };
$('mute').onclick=()=>{ muted=!muted; $('mute').textContent=muted?'🔇 Voice off':'🔊 Voice on'; $('mute').setAttribute('aria-pressed',String(muted)); if(muted) try{ speechSynthesis.cancel(); }catch(e){} };
let AC=null; function tone(f,d,type){ if(FAST<1) return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(), g=AC.createGain(); o.type=type||'sine'; o.frequency.value=f; g.gain.setValueAtTime(.18,AC.currentTime); g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d); o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+d); }catch(e){} }
const chime=()=>{ tone(784,.18); setTimeout(()=>tone(1047,.3),140); }, soft=()=>tone(220,.25,'triangle'), plink=n=>tone(440+(n%12)*60,.12);
function station(i){ $('stations').innerHTML=STATIONS.map((s,k)=>'<div class="st'+(k<i?' done':'')+'" title="'+s+'"><i></i></div>').join(''); $('train').style.left='calc(24px + '+(i/(STATIONS.length-1))+' * (100% - 48px))'; }
function confetti(){ const c=$('burst'), x=c.getContext('2d'); c.width=c.offsetWidth; c.height=c.offsetHeight; const P=Array.from({length:120},()=>({x:c.width/2,y:c.height/2,vx:(Math.random()-.5)*14,vy:Math.random()*-14-4,r:4+Math.random()*6,c:any(['#FFC83D','#2FBF71','#FF5D73','#3D8BFF','#8E5BFF'])}));
  let t=0; (function f(){ x.clearRect(0,0,c.width,c.height); P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.45; x.fillStyle=p.c; x.fillRect(p.x,p.y,p.r,p.r); }); if(++t<90) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height); })(); }
/* drawing helpers */
const O=(e,cls)=>'<span class="o'+(cls?' '+cls:'')+'">'+e+'</span>';
const objs=(e,n,cls)=>Array.from({length:n},()=>O(e,cls)).join('');
function g5(e,n,cls){ let h='<div class="g5">'; for(let r=0;r<n;r+=5) h+='<div>'+objs(e,Math.min(5,n-r),cls)+'</div>'; return h+'</div>'; }
function scatter(e,n,id){ const cells=shuffle(Array.from({length:24},(_,i)=>i)).slice(0,n); return '<div class="scatter" id="'+(id||'sc')+'">'+cells.map(c=>'<span class="o" style="left:calc('+((c%6)*16+2+Math.random()*4)+'%);top:'+(Math.floor(c/6)*24+4+Math.random()*6)+'%">'+e+'</span>').join('')+'</div>'; }
function frame(n,e,id,o){ o=o||{}; let h='<div class="frame'+(o.mini?' mini':'')+'"'+(id?' id="'+id+'"':'')+'>'; for(let i=0;i<10;i++){ const e2=(o.e2&&i>=o.split)?o.e2:e; h+='<div data-i="'+i+'">'+(i<n?O(e2):(o.ghost?O('⚪','ghost'):''))+'</div>'; } return h+'</div>'; }
const lockAll=()=>scene.querySelectorAll('button,.pic,.ch,.bin,.spot').forEach(x=>x.onclick=null);
const view=h=>{ BOT=null; scene.innerHTML=h; };
async function countAloud(sel,start,step){ start=start||0; step=step||1; const os=[...scene.querySelectorAll(sel)]; for(let i=0;i<os.length;i++){ os[i].classList.add('hl'); plink(i); await say(String(start+step*(i+1))); os[i].classList.remove('hl'); } }
function numOpts(ans,lo,hi,extra){ const s=new Set([ans]); (extra||[]).forEach(v=>{ if(s.size<3&&v!==ans&&v>=lo&&v<=hi) s.add(v); }); let guard=0; while(s.size<3&&guard++<60){ const d=ans+any([-2,-1,1,2]); if(d>=lo&&d<=hi) s.add(d); } while(s.size<3) s.add(Math.max(...s)+1); return shuffle([...s]); }
function numRow(ans,lo,hi,dots,extra){ return '<div class="choices">'+numOpts(ans,lo,hi,extra).map(v=>'<button class="ch" type="button" data-v="'+v+'"'+(v===ans?' data-ok="1"':'')+' aria-label="'+v+'">'+v+(dots&&v<=10?'<small>'+'•'.repeat(v)+'</small>':'')+'</button>').join('')+'</div>'; }
async function wrongHelp(help,again){ BUSY=true; try{ await wrongHelp2(help,again); } finally { BUSY=false; } }
async function wrongHelp2(help,again){ if(helpOn()&&help){ if(typeof help==='string'){ await say('Let’s count together.'); await countAloud(help); } else await help(); await say(again||'Now try again.'); } else await say('Look again. Try once more.'); }
function pickNum(ans,help,again){ BOT=null; return new Promise(res=>{ let first=true; scene.querySelectorAll('.ch').forEach(b=>b.onclick=async()=>{ if(BUSY) return; if(+b.dataset.v===ans){ b.classList.add('yes'); chime(); scene.querySelectorAll('.ch').forEach(x=>x.onclick=null); res(first); } else { first=false; b.classList.add('no'); soft(); await wrongHelp(help,again||'Now tap the number.'); } }); }); }
async function numQ(html,prompt,ans,o){ o=o||{}; view(html+numRow(ans,o.lo==null?0:o.lo,o.hi==null?Math.max(10,ans+2):o.hi,o.dots&&MODE==='help',o.extra)); await say(prompt); return pickNum(ans,o.help,o.again); }
/* pick one picture: items [{h, ok, cls}] */

/* ================= RUNNER ================= */
let done={}; try{ done=JSON.parse(localStorage.getItem('kread-done')||'{}')||{}; }catch(e){}
async function play(spec,mode){ MODE=mode; const [kind,cfg]=spec; const c=Object.assign({},cfg||{}); if(c.intro) await say(c.intro); const r=await G[kind](c); BOT=null; const first=r[0], line=r[1]||'';
  if(first){ stars++; await say(any(PRAISE)+' '+line); } else await say(line+' Good trying!'); await wait(250); return first; }
async function lesson(Ls){ stars=0; $('track').hidden=false; $('home').hidden=false; $('h1').innerHTML=Ls.t+' <small>'+Ls.id+' · '+Ls.sub+'</small>';
  station(0); await say('Warm-up!'); for(const s of Ls.warm) await play(s,'help');
  station(1); await Ls.story();
  station(2); await say('Movie time! Watch and listen.'); await Ls.movie();
  station(3); await say('Now let’s do it together!'); for(const s of Ls.together) await play(s,'help');
  station(4); await say('Your turn to practice!'); for(const s of shuffle(Ls.practice.slice(0,5)).concat(shuffle(Ls.practice.slice(5)))) await play(s,'practice');
  station(5); await play(Ls.real,'practice');
  station(6); await say('Quick check. Do it all by yourself!'); let ok=0; for(const s of Ls.check) ok+=(await play(s,'check'))?1:0;
  station(7); confetti(); chime(); setTimeout(chime,400*FAST); done[Ls.id]=Math.max(done[Ls.id]||0,ok); try{ localStorage.setItem('kread-done',JSON.stringify(done)); }catch(e){}
  view('<div class="start" id="fin"><div class="hero">⭐🎉⭐</div><h2>You did it!</h2><p>'+(ok===3?'You know '+Ls.t+'!':'Great working! We will practice this again soon.')+' You earned '+stars+' stars.</p><div class="row" style="font-size:36px">'+'⭐'.repeat(Math.min(stars,16))+'</div><div class="row"><button class="go alt" id="again" type="button">↻ Play again</button><button class="go" id="menu2" type="button">🏠 More lessons</button></div></div>');
  window.__kit.last={id:Ls.id,ok:ok,stars:stars};
  await say(ok===3?'You did it! Hop on the train to your next station!':'Great working! You are on the right trail.');
  $('again').onclick=()=>lesson(Ls); $('menu2').onclick=menu; }
function menu(){ try{ speechSynthesis.cancel(); }catch(e){} $('track').hidden=true; $('home').hidden=true; $('h1').innerHTML='Kindergarten Reading <small>13 lessons in the new style · Little Explorers</small>';
  view('<div class="menu">'+L.map((l,i)=>'<button class="lt" type="button" data-i="'+i+'">'+(done[l.id]!=null?'<span class="done">'+(done[l.id]===3?'⭐':'✓')+'</span>':'')+'<span class="e">'+l.e+'</span>'+l.t+'<small>'+l.sub+'</small></button>').join('')+'</div>');
  cap.textContent='Pick a lesson. Each one talks to you.'; scene.querySelectorAll('.lt').forEach(b=>b.onclick=()=>{ tone(523,.1); lesson(L[+b.dataset.i]); }); }
$('home').onclick=()=>{ location.hash=''; location.reload(); };
window.__kit.lessons=L.map(l=>l.id); window.__kit.start=i=>lesson(L[i]);
const h=location.hash.slice(1), hi=L.findIndex(l=>l.id===h); if(hi>=0) lesson(L[hi]); else menu();
})();
</script>
