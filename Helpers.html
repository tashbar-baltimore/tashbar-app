<script>
/* ===== Helpers: boy-page helpers (v68, takeover builder, 2026-11-11). Loaded by msQuestTools after Shine.
   1. "Report a problem" flag on every question: 4 big set choices, no typing. Sends msReport. ===== */
(function(){
const R=[['wrong','✖️','The answer is wrong'],['confusing','❓','I don’t understand the question'],['broken','🖼️','The picture or sound doesn’t work'],['other','💬','Something else is wrong']];
try{ if(!document.getElementById('tl-help-css')){ const s=document.createElement('style'); s.id='tl-help-css'; s.textContent=`
.tlrep{flex:none;border:0;background:#FFF1F0;color:#B42318;border-radius:14px;min-width:48px;min-height:48px;font-size:20px;cursor:pointer;box-shadow:inset 0 0 0 2px #FDCDC8}
.tlrep:hover{background:#FEE4E2}
#tlrep-ov{position:fixed;inset:0;z-index:9999;background:rgba(20,18,50,.55);display:grid;place-items:center;padding:16px}
#tlrep-ov .bx{background:#fff;border-radius:26px;max-width:520px;width:100%;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.3);font-family:inherit}
#tlrep-ov h2{margin:0 0 6px;font-size:24px;color:#1E1B4B}#tlrep-ov p{margin:0 0 14px;color:#52525B}
#tlrep-ov .ch{display:grid;gap:10px}#tlrep-ov .ch button{display:flex;align-items:center;gap:12px;border:2px solid #E4E4E7;background:#fff;border-radius:18px;padding:14px 16px;font-weight:700;font-size:19px;font-family:inherit;color:#1E1B4B;min-height:60px;cursor:pointer;text-align:left}
#tlrep-ov .ch button:hover{border-color:#6D28D9;background:#F5F3FF}#tlrep-ov .ch i{font-style:normal;font-size:26px}
#tlrep-ov .x{margin-top:12px;width:100%;border:0;background:#F4F4F5;border-radius:14px;min-height:52px;font-weight:700;font-size:18px;font-family:inherit;cursor:pointer}
#tlrep-ov .ok{font-size:22px;font-weight:800;color:#067647;text-align:center;padding:18px 0}`; document.head.appendChild(s); } }catch(e){}
function cur(){ try{ if(typeof A==='undefined'||A.view!=='play'||!A.play) return null; const it=A.play.items&&A.play.items[A.play.i]; return it?{skill:A.play.id,phase:it.phase||'',item:String(it.q||'')}:null; }catch(e){ return null; } }
function add(){ try{ if(!cur()) return; document.querySelectorAll('.qrow').forEach(r=>{ if(!r.querySelector('.tlrep')){ const b=document.createElement('button'); b.type='button'; b.className='tlrep'; b.setAttribute('data-tlrep','open'); b.setAttribute('aria-label','Report a problem with this question'); b.title='Report a problem'; b.textContent='🚩'; r.appendChild(b); } }); }catch(e){} }
function close(){ const o=document.getElementById('tlrep-ov'); if(o) o.remove(); }
function open(){ const c=cur(); if(!c) return; close(); const o=document.createElement('div'); o.id='tlrep-ov'; o.setAttribute('role','dialog'); o.setAttribute('aria-label','Report a problem');
 o.innerHTML=`<div class="bx"><h2>🚩 What is wrong with this question?</h2><p>Tap one. Your rebbe will look at it.</p><div class="ch">${R.map(r=>`<button type="button" data-tlrep="send" data-r="${r[0]}"><i aria-hidden="true">${r[1]}</i>${r[2]}</button>`).join('')}</div><button type="button" class="x" data-tlrep="close">Never mind</button></div>`;
 o.dataset.skill=c.skill; o.dataset.phase=c.phase; o.dataset.item=c.item; document.body.appendChild(o); const f=o.querySelector('.ch button'); f&&f.focus(); }
function send(reason){ const o=document.getElementById('tlrep-ov'); if(!o) return; const p={skill:o.dataset.skill,phase:o.dataset.phase,item:o.dataset.item,reason};
 o.querySelector('.bx').innerHTML='<div class="ok">Thank you! 🙏<br><span style="font-size:17px;color:#52525B;font-weight:600">Your rebbe will look at it. Keep going!</span></div>';
 setTimeout(close,1600);
 try{ google.script.run.withFailureHandler(function(){}).msReport(SRV.token,p); }catch(e){} }
document.addEventListener('click',function(e){ const b=e.target.closest&&e.target.closest('[data-tlrep]'); if(!b) return; e.preventDefault(); e.stopPropagation(); const a=b.getAttribute('data-tlrep'); if(a==='open') open(); else if(a==='close') close(); else if(a==='send') send(b.dataset.r); },true);
document.addEventListener('keydown',function(e){ if(e.key==='Escape') close(); });
try{ new MutationObserver(()=>add()).observe(document.documentElement,{childList:true,subtree:true}); }catch(e){}
/* 2. v71: keep his work safe through a Wi-Fi drop. If a save fails, put the answers and pay rows back in the queue
   and try again (15 s, 30 s, 60 s, then every 2 min, and right away when the Wi-Fi comes back). The server already
   refuses pay it has seen before, so a retry can never pay twice. */
(function(){
 const _save=window.saveStudent; if(typeof _save!=='function'||typeof SRV==='undefined') return;
 let wait=0, timer=null, sid=null;
 function cl(x){ try{ return JSON.parse(JSON.stringify(x)); }catch(e){ return x; } }
 function retry(){ timer=null; try{ if(!SRV.token||!A.st||A.st.id!==sid) return; window.saveStudent(A.st,null); }catch(e){} }
 function later(){ if(timer) return; const d=[15,30,60,120][Math.min(wait,3)]*1000; wait++; timer=setTimeout(retry,d); }
 window.addEventListener('online',()=>{ if(sid&&!timer) return; if(timer){ clearTimeout(timer); timer=null; retry(); } });
 window.saveStudent=function(st,onDone){
  const before=SRV.states[st.id]!==undefined?cl(SRV.states[st.id]):undefined, ev=SRV.pendingEv.slice();
  return _save.call(this,st,function(r){
   if(!r){ SRV.pendingEv=ev.concat(SRV.pendingEv); if(before===undefined) delete SRV.states[st.id]; else SRV.states[st.id]=before; sid=st.id; later();
     try{ if(typeof toast==='function') toast('No Wi-Fi right now. Keep going! Your work is saved as soon as it is back.'); }catch(e){} }
   else { wait=0; if(timer){ clearTimeout(timer); timer=null; } sid=null; }
   onDone&&onDone(r); }); };
})();
/* 3. v74: the school goal on the home screen (refreshed every 10 minutes), with this month's most improved (first names). */
(function(){
 let G=null, at=0, busy=false;
 function get(){ if(busy||!SRV.token||Date.now()-at<600000) return; busy=true; try{ google.script.run.withSuccessHandler(function(r){ busy=false; at=Date.now(); G=r; try{ if(A.view==='hub') render(); }catch(e){} }).withFailureHandler(function(){ busy=false; at=Date.now(); }).msSchoolGoal(SRV.token); }catch(e){ busy=false; } }
 function card(){ get(); if(!G||!G.goal) return ''; const pct=Math.min(100,Math.round(G.total/G.goal*100)), e=s=>String(s).replace(/[&<>"]/g,'');
  return `<section class="sgoal"><span class="sgi" aria-hidden="true">🏫</span><div class="sgt"><b>School goal for ${e(G.month)}: ${G.goal} skills</b><div class="sgb"><i style="width:${pct}%"></i></div><small>${G.total} of ${G.goal} mastered by all the boys together${pct>=100?' · 🎉 We did it!':' · every skill you master helps'}${G.top&&G.top.length?` · 🌟 Most improved: ${G.top.map(e).join(', ')}`:''}</small></div></section>`; }
 const _find=window.tlFindLevelCard;
 window.tlFindLevelCard=function(st){ let h=''; try{ h=card(); }catch(e){} try{ h+=_find?_find(st):''; }catch(e){} return h; };
 try{ const s=document.createElement('style'); s.textContent=`.sgoal{display:flex;align-items:center;gap:14px;margin:14px 0;padding:12px 16px;border-radius:20px;background:linear-gradient(135deg,#FFF8E1,#FDECC8);border:2px solid #E3B341}.sgi{font-size:34px}.sgt{flex:1}.sgt b{color:#1E1B4B;font-size:17px}.sgt small{color:#6B5B2E;font-weight:600}.sgb{height:12px;border-radius:7px;background:#fff;margin:6px 0;overflow:hidden;box-shadow:inset 0 0 0 1px #E3B341}.sgb i{display:block;height:100%;background:linear-gradient(90deg,#E3B341,#2E9E6B)}`; document.head.appendChild(s); }catch(e){}
})();
window.TLHELP=1;
})();
</script>
