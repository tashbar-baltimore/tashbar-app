/* ===== Math Level 7 batch 1 (15 skills, Blueprint IDs MATH.*.L07.*) — K-8 curriculum chat, 2026-11-10. Gap Map batch #1.
 PASTE: inside the MathMore IIFE, on the line right AFTER the Level 6 block (the line "window.TLM6=Object.keys(L6).length;" and its closing "}")
 and BEFORE "window.TLM=...". Uses only page helpers RI, PICK, N, MX, TLB. All local names live inside this { } block.
 Does NOT touch the 4 Level 7 skills already in QuestPage.html (NUM.L07.01, ALG.L07.01, ALG.L07.02, ALG.L07.04). ===== */
{
const g7=(a,b)=>{ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a||1; };
const fx7=v=>{ const s=String(Number(Number(v).toFixed(6))); const p=s.split('.'); p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,','); return p.join('.'); };
const sg=v=>v<0?'−'+fx7(-v):fx7(v);
const pt=(x,y)=>`(${sg(x)}, ${sg(y)})`;
const nz=(lo,hi)=>{ let v=0; while(v===0) v=RI(lo,hi); return v; };
const n7=()=>PICK(TLB);
const FT7='Type a fraction like 3/4, or a mixed number like 1 1/4.';
const L7={
'MATH.OPS.L07.01':{name:'Division Pro',
how:['A boy who can divide big numbers by hand can split costs, pack boxes and check any answer. This is the last step to dividing anything.','8,736 ÷ 24: estimate first. 24 is close to 25, and 25 × 350 = 8,750, so the answer is near 350. 24 into 87 goes 3 times (72), 15 left. Bring down 3: 153. 24 into 153 goes 6 times (144), 9 left. Bring down 6: 96. 24 into 96 goes 4 times. Answer 364. Check: 364 × 24 = 8,736.','Build it with friendly chunks: 24 × 300 = 7,200. 8,736 − 7,200 = 1,536 left. 24 × 60 = 1,440, leaving 96. 24 × 4 = 96. Add the chunks: 300 + 60 + 4 = 364.'],
gen(){ const k=RI(0,3);
 if(k===0){ const d=RI(13,89), q=RI(102,899); return N(`${fx7(d*q)} ÷ ${d} = ?`, q, `Estimate first: round ${d} to ${Math.round(d/10)*10}. Then divide, multiply, subtract and bring down, one digit at a time.`); }
 if(k===1){ const d=RI(3,9), q=RI(1001,9999); return N(`${fx7(d*q)} ÷ ${d} = ?`, q, 'Start from the left. Divide, multiply, subtract, bring down the next digit. Repeat until every digit is used.'); }
 if(k===2){ const per=PICK([12,15,18,24]), boys=RI(5,30)*per+RI(1,per-1); return N(`${boys} boys are going on a trip. Each van holds ${per} boys. How many vans are needed so every boy has a seat?`, Math.ceil(boys/per), 'Divide. If there is a remainder, those boys still need seats, so you need one more van.', {unit:'vans'}); }
 const d=RI(12,48), q=RI(25,250), r=RI(1,d-1); return N(`What is the remainder when ${fx7(d*q+r)} is divided by ${d}?`, r, `Find how many whole ${d}s fit. Multiply back and subtract. What is left over is the remainder.`); }},
'MATH.OPS.L07.02':{name:'Decimal Pro',
how:['Shopping, measuring and science all use decimals. Now you will add, subtract, multiply and divide any decimals without a calculator.','1.5 ÷ 0.3: dividing by a decimal is hard, so move the point one place right in BOTH numbers: 15 ÷ 3 = 5. For 2.4 × 0.15: multiply 24 × 15 = 360. Count the places: 1 + 2 = 3, so the answer is 0.360, which is 0.36.','Think money: how many 30-cent stickers can you buy with $1.50? 150 cents ÷ 30 cents = 5. It is the same as 1.5 ÷ 0.3.'],
gen(){ const k=RI(0,4);
 if(k===0){ const A=RI(101,9999), B=RI(11,999); return N(`${fx7(A/100)} + ${fx7(B/1000)} = ?`, (A*10+B)/1000, 'Line up the decimal points. Fill the empty places with zeros, then add.'); }
 if(k===1){ const B=RI(101,999), w=Math.ceil(B/100)+RI(1,20); return N(`${w} − ${fx7(B/100)} = ?`, (w*100-B)/100, `A whole number has a hidden point at its end: write ${w} as ${w}.00, then subtract.`); }
 if(k===2){ const A=RI(12,95), B=RI(12,49); return N(`${fx7(A/10)} × ${fx7(B/100)} = ?`, A*B/1000, 'Multiply without the points. Count the decimal places in both numbers together and give the answer that many places.'); }
 if(k===3){ const q=RI(3,40), dd=RI(2,9); return N(`${fx7(q*dd/10)} ÷ ${fx7(dd/10)} = ?`, q, 'Move the point one place to the right in BOTH numbers so you divide by a whole number.'); }
 const c=RI(2,9), lb=PICK([0.5,1.5,2.5,0.25,0.75]); return N(`Apples cost $${c}.00 a pound. ${n7()} buys ${fx7(lb)} pounds. What does he pay, in dollars?`, c*lb, 'Price for one pound × number of pounds. Multiply without the point, then put the decimal places back.', {unit:'$'}); }},
'MATH.NUM.L07.02':{name:'GCF and LCM',
how:['Factors and multiples help you share things evenly and plan things that repeat. The GCF is the biggest number that goes into both numbers. The LCM is the smallest number both numbers go into.','GCF of 18 and 24: factors of 18 are 1, 2, 3, 6, 9, 18. Factors of 24 are 1, 2, 3, 4, 6, 8, 12, 24. The biggest one in both lists is 6. LCM of 4 and 6: count by 4s: 4, 8, 12. Count by 6s: 6, 12. The first number in both is 12.','Factor trees: 18 = 2 × 3 × 3 and 24 = 2 × 2 × 2 × 3. The GCF uses only what they share: 2 × 3 = 6. The LCM uses the most of each prime: 2 × 2 × 2 × 3 × 3 = 72.'],
gen(){ const k=RI(0,3); let m=RI(2,9), n=RI(2,9); while(m===n||g7(m,n)!==1){ m=RI(2,9); n=RI(2,9); } const g=RI(2,12), a=g*m, b=g*n;
 if(k===0) return N(`What is the GCF of ${a} and ${b}?`, g, 'List the factors of each number. Which is the biggest number in BOTH lists?');
 if(k===1){ let x=RI(2,12), y=RI(2,12); while(x===y){ y=RI(2,12); } return N(`What is the LCM of ${x} and ${y}?`, x*y/g7(x,y), `Count by ${Math.max(x,y)}s. Stop at the first number that ${Math.min(x,y)} also goes into.`); }
 if(k===2){ let x=PICK([6,8,10,12]), y=PICK([4,6,8,9,10,12,15]); while(x===y){ y=PICK([4,6,8,9,10,12,15]); } return N(`Cups come in packs of ${x} and plates come in packs of ${y}. What is the smallest number of cups and plates you can buy so the numbers are the same?`, x*y/g7(x,y), 'You need a number both pack sizes go into evenly. Find the least common multiple.', {unit:'of each'}); }
 let d=1; for(let f=2; f<g; f++){ if(g%f===0){ d=f; break; } }
 return MX(`Which shows ${a} + ${b} using the greatest common factor?`, [`${g}(${m} + ${n})`, `${d}(${a/d} + ${b/d})`, `${g}(${a} + ${b})`], `Find the GCF of ${a} and ${b}. Divide each number by it, and check that multiplying back gives ${a} and ${b}.`); }},
'MATH.FRAC.L07.01':{name:'Keep, Flip, Multiply',
how:['How many 3/4-cup scoops are in 6 cups? How many 1/2-hour learning sessions fit in 2 1/2 hours? Dividing fractions answers "how many fit?" and there is one short rule.','2/3 ÷ 1/6: KEEP 2/3, FLIP 1/6 to 6/1, MULTIPLY: 2/3 × 6/1 = 12/3 = 4. Check: 4 × 1/6 = 4/6 = 2/3. It works.','Ask "how many fit?": how many 1/6 pieces fit in 2/3? 2/3 is the same as 4/6, so 4 pieces of 1/6 fit. The answer is 4 again.'],
gen(){ const k=RI(0,2), a=RI(1,5), b=RI(a+1,8), c=RI(1,5), d=RI(c+1,9);
 if(k===0) return N(`${a}/${b} ÷ ${c}/${d} = ? ${FT7}`, (a/b)/(c/d), 'Keep the first fraction. Flip the second one upside down. Then multiply tops and bottoms, and simplify.');
 if(k===1){ const dd=PICK([2,3,4,8]), cc=1, t=RI(2,9); if(t%dd===0) return this.gen(); return N(`${n7()} has ${t*cc}/${dd} of a cup of oil. Each scoop holds 1/${dd} cup. How many scoops can he fill?`, t, 'How many 1/'+dd+' pieces fit? Keep, flip, multiply: the first amount × '+dd+'.', {unit:'scoops'}); }
 return MX(`Which is the same as ${a}/${b} ÷ ${c}/${d}?`, [`${a}/${b} × ${d}/${c}`, `${b}/${a} × ${c}/${d}`, `${a}/${b} × ${c}/${d}`], 'Keep the FIRST fraction as it is. Flip only the SECOND one.'); }},
'MATH.NUM.L07.03':{name:'Below Zero',
how:['Below zero shows up in cold weather, going down below the ground, and owing money. Numbers less than 0 are called negative numbers, and they have a minus sign.','On a number line, 0 is in the middle. 5 is 5 steps right of 0. −5 is 5 steps left of 0. 5 and −5 are opposites. The absolute value |−5| is 5, because −5 is 5 steps away from 0.','Think of a building with floors below the street. Floor 3 is 3 floors up and floor −3 is 3 floors down. Both are 3 floors away from the street, so |3| = |−3| = 3.'],
gen(){ const k=RI(0,4), a=nz(-50,50);
 if(k===0) return N(`What is the opposite of ${sg(a)}?`, -a, 'The opposite is the same distance from 0 on the other side. Change the sign.');
 if(k===1) return N(`|${sg(a)}| = ?`, Math.abs(a), 'Absolute value is how far a number is from 0. A distance is never negative.');
 if(k===2){ const h=RI(2,40); return N(`A diver is ${h} meters below sea level. Write his position as a number (above sea level is positive).`, -h, 'Below sea level is less than 0, so the number gets a minus sign.', {unit:'m'}); }
 if(k===3){ const t=RI(1,20); return N(`It is ${t} degrees below zero outside. Write the temperature as a number.`, -t, 'Below zero means less than 0. Write the number with a minus sign.', {unit:'°'}); }
 const b=RI(1,30); return N(`−(−${b}) = ?`, b, 'The opposite of the opposite takes you back to where you started.'); }},
'MATH.NUM.L07.04':{name:'Line Them Up',
how:['Is −8 more or less than −3? Many people say −8 is more, because 8 is bigger than 3. That is a trap. A number line always tells the truth.','On a number line, numbers get bigger as you go right. −8 is to the left of −3, so −8 < −3. Every negative number is less than 0, and every positive number is more than 0. In order: −7, −2, 0, 5.','Think of temperature: −8° is colder than −3°. Colder means less. The farther below zero, the smaller the number.'],
gen(){ const k=RI(0,3);
 if(k===0){ const a=RI(-20,-1), b=RI(-20,20); if(a===b) return this.gen(); const hi=Math.max(a,b), lo=Math.min(a,b); return MX(`Which is greater: ${PICK([0,1])?sg(a)+' or '+sg(b):sg(b)+' or '+sg(a)}?`, [sg(hi), sg(lo), 'They are equal'], 'Picture the number line. The number farther to the RIGHT is greater.'); }
 if(k===1){ const s=new Set(); while(s.size<3) s.add(RI(-15,15)); const v=[...s]; if(!v.some(x=>x<0)) return this.gen(); const up=[...v].sort((x,y)=>x-y), ab=[...v].sort((x,y)=>Math.abs(x)-Math.abs(y)||x-y), dn=[...up].reverse(); const ok=up.map(sg).join(', '); const W=[ab,dn,[up[1],up[0],up[2]],[up[0],up[2],up[1]]].map(o=>o.map(sg).join(', ')).filter((x,i,A)=>x!==ok&&A.indexOf(x)===i); return MX(`Put in order from least to greatest: ${v.map(sg).join(', ')}`, [ok, W[0], W[1]],'Start with the number farthest LEFT on the number line: the negative number farthest from 0.'); }
 if(k===2){ const a=RI(11,49), b=RI(11,49); if(a===b) return this.gen(); const x=-a/10, y=-b/10, hi=Math.max(x,y), lo=Math.min(x,y); return MX(`Which is greater: ${sg(x)} or ${sg(y)}?`, [sg(hi), sg(lo), 'They are equal'], 'With two negative numbers, the one CLOSER to 0 is greater.'); }
 const a=RI(1,15), b=RI(1,15); if(a===b) return this.gen(); const cold=-Math.max(a,b), warm=-Math.min(a,b); return MX(`Which is colder: ${PICK([0,1])?sg(cold)+'° or '+sg(warm)+'°':sg(warm)+'° or '+sg(cold)+'°'}?`, [sg(cold)+'°', sg(warm)+'°', 'Both are the same'], 'Colder means farther below zero, which is the smaller number.'); }},
'MATH.NUM.L07.05':{name:'Four Quadrants',
how:['When the grid goes past 0 to the left and down, you can map anything: a whole city, a game board, or a building with a basement. The grid now has four parts called quadrants.','The point (−3, 2): the first number says left or right. −3 means 3 LEFT. The second number says up or down. 2 means 2 UP. Quadrant I is top right (+, +), II is top left (−, +), III is bottom left (−, −), IV is bottom right (+, −).','Distance along one line: from (2, −3) to (2, 4), only the second number changes. From −3 up to 0 is 3 steps, and from 0 up to 4 is 4 more: 3 + 4 = 7 steps.'],
gen(){ const k=RI(0,3);
 if(k===0){ const a=RI(1,9), b=RI(1,9); if(a===b) return this.gen(); return MX(`Start at (0, 0). Go LEFT ${a} and UP ${b}. Which point is it?`, [pt(-a,b), pt(a,-b), pt(-b,a)], 'Left means the FIRST number is negative. Up means the SECOND number is positive. Write left-right first.'); }
 if(k===1){ const x=nz(-9,9), y=nz(-9,9); const q=x>0?(y>0?'I':'IV'):(y>0?'II':'III'); const all=['I','II','III','IV'].filter(z=>z!==q); return MX(`In which quadrant is the point ${pt(x,y)}?`, ['Quadrant '+q].concat(all.map(z=>'Quadrant '+z)), 'Look at the signs. First number: + is right, − is left. Second number: + is up, − is down. I is top right, then go around: II top left, III bottom left, IV bottom right.'); }
 if(k===2){ const x=nz(-9,9), y=nz(-9,9); if(Math.abs(x)===Math.abs(y)) return this.gen(); const ax=PICK(['x','y']); return ax==='x' ? MX(`Flip the point ${pt(x,y)} over the x-axis (the line across). Where does it land?`, [pt(x,-y), pt(-x,y), pt(-x,-y)], 'Flipping over the line across changes up to down. Only the SECOND number changes its sign.') : MX(`Flip the point ${pt(x,y)} over the y-axis (the line up and down). Where does it land?`, [pt(-x,y), pt(x,-y), pt(-x,-y)], 'Flipping over the line up and down changes left to right. Only the FIRST number changes its sign.'); }
 const x=nz(-8,8), y1=RI(-9,-1), y2=RI(1,9); return N(`How many steps is it from ${pt(x,y1)} to ${pt(x,y2)}?`, y2-y1, 'The first numbers are the same, so walk straight up. Count the steps up to 0, then from 0 up to the second point, and add.', {unit:'steps'}); }},
'MATH.ALG.L07.03':{name:'Percents',
how:['Percent means "out of 100". Sales, test scores and tzedakah all use percents, and now you will find the part or the whole every time.','30% of 80: 10% of 80 is 8 (divide by 10). 30% is 3 times that: 3 × 8 = 24. Whole from part: 15 is 25% of what number? 25% is one quarter, so the whole is 4 × 15 = 60.','Use a bar: draw a bar for the whole and split it into 10 equal boxes, each 10%. If the whole is 80, each box is 8. Three boxes, 30%, is 24.'],
gen(){ const k=RI(0,3), p=PICK([5,10,15,20,25,30,40,50,60,75]), w=RI(1,20)*20, part=p*w/100;
 if(k===0) return N(`What is ${p}% of ${w}?`, part, 'Find 10% first by dividing by 10 (or 1% by dividing by 100). Then build up to the percent you need.');
 if(k===1) return N(`${part} is ${p}% of what number?`, w, `${part} is only ${p} out of every 100. Find what 1% (or 5%, or 10%) is, then build up to 100%.`);
 if(k===2) return N(`What percent of ${w} is ${part}?`, p, `Write it as a fraction ${part}/${w}, then change it to "out of 100".`, {unit:'%'});
 const c=RI(2,12)*10, q=PICK([10,20,25,50]); return N(`A sefer costs $${c}. Today it is ${q}% off. How many dollars do you save?`, c*q/100, `The amount you save is ${q}% of $${c}. Find 10% first, then build up.`, {unit:'$'}); }},
'MATH.MEAS.L07.01':{name:'Convert with Ratios',
how:['Feet to inches, hours to minutes, pounds to ounces: you change units all the time. One idea, the ratio, does every conversion.','1 foot = 12 inches, so the ratio is 12 inches for every 1 foot. 5 feet = 5 × 12 = 60 inches. Going the other way, 48 inches ÷ 12 = 4 feet.','Make a ratio table. Feet: 1, 2, 3, 4. Inches: 12, 24, 36, 48. Find the number you have in one row, and read the answer in the other row.'],
gen(){ const U=[['feet','inches',12],['yards','feet',3],['hours','minutes',60],['gallons','quarts',4],['pounds','ounces',16],['meters','centimeters',100]]; const [big,small,f]=PICK(U), k=RI(0,3), v=RI(2,12);
 if(k===0) return N(`${v} ${big} = ? ${small}`, v*f, `1 ${big.replace(/s$/,'').replace('feet','foot')} is ${f} ${small}. Changing to the smaller unit gives more of them, so multiply.`, {unit:small});
 if(k===1) return N(`${v*f} ${small} = ? ${big}`, v, `Every ${f} ${small} make 1 of the bigger unit. Changing to the bigger unit gives fewer of them, so divide by ${f}.`, {unit:big});
 if(k===2){ const s=PICK([2,3,4,6]), t=PICK([30,90,120,150]); return N(`${n7()} walks ${s} miles every hour. How many miles does he walk in ${t} minutes?`, s*t/60, 'Change the minutes to hours first: 60 minutes is 1 hour. Then multiply by the miles for each hour.', {unit:'miles'}); }
 const ft=RI(2,6), inch=RI(1,11); return N(`${ft} feet ${inch} inch${inch===1?'':'es'} = ? inches`, ft*12+inch, 'Change the feet to inches first (1 foot = 12 inches). Then add the extra inches.', {unit:'inches'}); }},
'MATH.ALG.L07.05':{name:'Same Value, New Look',
how:['Two expressions can look different and still always give the same answer. Rewriting an expression in a simpler way makes algebra much faster.','Distribute: 3(x + 4) means 3 groups of (x + 4), which is 3x + 12. Combine like terms: in 2x + 5 + 4x there are two x terms, and 2x + 4x = 6x, so the answer is 6x + 5.','Check with a number: put x = 1 into 3(x + 4): 3 × 5 = 15. Put x = 1 into 3x + 12: 3 + 12 = 15. Same value, new look.'],
gen(){ const k=RI(0,3), a=RI(2,9), b=RI(2,9), p=RI(2,9), q=RI(2,9), c=RI(2,12);
 if(k===0){ if(a===b) return this.gen(); return MX(`Which is the same as ${a}(x + ${b})?`, [`${a}x + ${a*b}`, `${a}x + ${b}`, `x + ${a*b}`], `Multiply ${a} by EVERY term inside the parentheses: ${a} times x, and ${a} times ${b}.`); }
 if(k===1){ if(p===q||p*q===p+q) return this.gen(); return MX(`Which is the same as ${p}x + ${q}x?`, [`${p+q}x`, `${p*q}x`, `${p}x + ${q}`], `Both terms are x terms, so add their numbers: ${p} x's and ${q} more x's.`); }
 if(k===2){ if(q===c) return this.gen(); return MX(`Which is the same as ${p}x + ${c} + ${q}x?`, [`${p+q}x + ${c}`, `${p+q+c}x`, `${p}x + ${c+q}`], 'Only like terms combine. Add the x terms together. The plain number stays by itself.'); }
 const v=RI(1,9); return N(`What is the value of ${a}(x + ${b}) when x = ${v}?`, a*(v+b), `Put ${v} in place of x. Work inside the parentheses first, then multiply by ${a}.`); }},
'MATH.ALG.L07.06':{name:'One-Step Equations',
how:['An equation is a balance: both sides are worth the same. Solving it means finding the number that keeps it balanced. This is the key to all of algebra.','x + 7 = 12: to get x alone, undo the + 7 by subtracting 7 from BOTH sides: x = 5. 4x = 28: undo the × 4 by dividing both sides by 4: x = 7. Check: 4 × 7 = 28.','Think of a hidden box: something plus 7 makes 12. What fills the box? Count up from 7 to 12: that is 5.'],
gen(){ const k=RI(0,4), p=RI(2,20), v=RI(1,30);
 if(k===0) return N(`x + ${p} = ${v+p}. What is x?`, v, `Undo the + ${p}: subtract ${p} from both sides.`);
 if(k===1){ const m=RI(2,12), u=RI(2,12); return N(`${m}x = ${m*u}. What is x?`, u, `${m}x means ${m} times x. Undo it: divide both sides by ${m}.`); }
 if(k===2) return N(`x − ${p} = ${v}. What is x?`, v+p, `Undo the − ${p}: add ${p} to both sides.`);
 if(k===3){ const has=RI(3,15), more=RI(2,9); return N(`${n7()} has some seforim. He gets ${more} more and now has ${has+more}. Solve x + ${more} = ${has+more}. How many did he have at first?`, has, `Undo the + ${more}: subtract ${more} from ${has+more}.`, {unit:'seforim'}); }
 const t=RI(2,12); return MX(`x > ${t}. Which number could x be?`, [String(t+RI(1,5)), String(t), String(t-RI(1,t-1))], `"Greater than ${t}" means bigger than ${t}. ${t} itself does not count.`); }},
'MATH.GEO.L07.01':{name:'Area of Triangles',
how:['Floors, gardens and roofs come in many shapes. If you know the area of a triangle, you can find the area of almost any shape by cutting it into pieces.','A triangle with base 8 and height 5: a rectangle 8 by 5 has area 40. The triangle is exactly half of that rectangle, so 40 ÷ 2 = 20 square units. Area = base × height ÷ 2.','Cut and move: draw the triangle inside a rectangle with the same base and height. The two leftover corner pieces fit together into a triangle just like it. Two triangles make the rectangle, so one triangle is half.'],
gen(){ const k=RI(0,3);
 if(k===0){ const b=RI(2,20), h=RI(2,15); if((b*h)%2) return this.gen(); return N(`A triangle has a base of ${b} and a height of ${h}. What is its area?`, b*h/2, 'Multiply base × height, then take half, because a triangle is half of a rectangle.', {unit:'square units'}); }
 if(k===1){ const a=RI(3,16), b=RI(3,16); if((a*b)%2) return this.gen(); return N(`A right triangle has two short sides (legs) of ${a} cm and ${b} cm. What is its area?`, a*b/2, 'In a right triangle one leg is the base and the other is the height. Multiply them and take half.', {unit:'square cm'}); }
 if(k===2){ const w=RI(2,10)*2, h1=RI(3,10), h2=RI(2,8); return N(`A shape is a rectangle ${w} wide and ${h1} tall with a triangle on top. The triangle has base ${w} and height ${h2}. What is the total area?`, w*h1+w*h2/2, 'Cut it into two pieces. Find the rectangle (width × height) and the triangle (base × height ÷ 2), then add.', {unit:'square units'}); }
 const b=RI(3,15), h=RI(2,12); return N(`A parallelogram has a base of ${b} and a height of ${h}. What is its area?`, b*h, 'Cut the slanted end off and slide it to the other side: it becomes a rectangle. Base × height.', {unit:'square units'}); }},
'MATH.GEO.L07.02':{name:'Nets and Surface Area',
how:['To wrap a present or paint a box you need the area of every face. Unfolding the box flat into a net shows every face at once.','A box 4 by 3 by 2 has 6 faces in 3 matching pairs: top and bottom 4 × 3 = 12 each, front and back 4 × 2 = 8 each, two ends 3 × 2 = 6 each. Surface area = 12 + 12 + 8 + 8 + 6 + 6 = 52 square units.','Imagine cutting a cardboard box along its edges and laying it flat. Count each rectangle, find its area, and add them all up.'],
gen(){ const k=RI(0,3);
 if(k===0){ const l=RI(2,10), w=RI(2,8), h=RI(2,8); return N(`A box is ${l} long, ${w} wide and ${h} high. What is its surface area?`, 2*(l*w+l*h+w*h), 'There are 3 pairs of matching faces. Find length × width, length × height and width × height, add them, then double.', {unit:'square units'}); }
 if(k===1){ const s=RI(2,10); return N(`A cube has edges ${s} cm long. What is its surface area?`, 6*s*s, 'A cube has 6 faces, all the same square. Find one face (edge × edge), then multiply by 6.', {unit:'square cm'}); }
 if(k===2){ const l=RI(2,9), w=RI(2,7), d=PICK([2,4]); return N(`A box is ${l} units long, ${w} units wide and 1/${d} unit high. What is its volume? ${FT7}`, l*w/d, `Volume is length × width × height. Multiplying by 1/${d} is the same as dividing by ${d}.`, {unit:'cubic units'}); }
 const T=[['6 squares','Cube',['Square pyramid','Triangular prism']],['1 square and 4 triangles','Square pyramid',['Cube','Triangular prism']],['2 triangles and 3 rectangles','Triangular prism',['Square pyramid','Cube']]]; const r=PICK(T);
 return MX(`A net is made of ${r[0]}. What solid does it fold into?`, [r[1]].concat(r[2]), 'Every flat piece of the net becomes one face. Which solid has exactly those faces?'); }},
'MATH.STAT.L07.01':{name:'Mean, Median and Spread',
how:['To describe a whole group with numbers, you need its middle (the center) and how spread out it is. Coaches, doctors and storekeepers ask these questions every day.','Scores 7, 3, 9, 5, 6. Put them in order: 3, 5, 6, 7, 9. The median is the middle one: 6. The mean is the total shared equally: 30 ÷ 5 = 6. The range is biggest minus smallest: 9 − 3 = 6.','Line up boys from shortest to tallest. The boy in the very middle is the median. The difference between the tallest and the shortest is the range.'],
gen(){ const k=RI(0,3);
 if(k===0){ const c=PICK([5,7]), v=Array.from({length:c},()=>RI(1,40)); const s=[...v].sort((x,y)=>x-y); return N(`Find the median: ${v.join(', ')}`, s[(c-1)/2], 'Put the numbers in order from least to greatest first. Then find the one exactly in the middle.'); }
 if(k===1){ const c=RI(3,6), m=RI(3,20); const v=Array(c).fill(m); for(let i=0;i<c*2;i++){ const a=RI(0,c-1), b=RI(0,c-1), s=RI(1,3); if(a!==b&&v[a]-s>=1){ v[a]-=s; v[b]+=s; } } return N(`Find the mean: ${v.join(', ')}`, m, `Add all the numbers to find the total. Then divide by how many numbers there are (${c}).`); }
 if(k===2){ const c=RI(5,8), v=Array.from({length:c},()=>RI(1,60)); return N(`Find the range: ${v.join(', ')}`, Math.max(...v)-Math.min(...v), 'Find the biggest number and the smallest number. Subtract the smallest from the biggest.'); }
 const T=[['How many seforim does each boy in our class own?','How many seforim does Dovid own?','How many days are in a week?'],['How long does it take each boy in the yeshiva to get to school?','What time does Mincha start today?','How many legs does a chair have?'],['How many pages did each boy in the shiur learn this week?','How many pages are in this Chumash?','What is the name of our Rebbi?']]; const r=PICK(T);
 return MX('Which is a statistical question (one with answers that change from person to person)?', r, 'A statistical question collects many answers that are not all the same. Which question would get different answers from different boys?'); }},
'MATH.STAT.L07.02':{name:'Dot Plots, Histograms, Box Plots',
how:['One set of numbers can be shown three ways. Each picture answers a different question quickly, and you will learn to read them and pick the right one.','Dot plot: one dot for each boy, stacked over his number. Histogram: bars over groups such as 0–9 and 10–19; the height of a bar is how many fall in that group. Box plot: a box from the lower quartile to the upper quartile with a line at the median, and whiskers out to the smallest and largest values.','A box plot with 4, 8, 12, 15, 20: the median is 12. The middle half of the group is between 8 and 15, so its width (the interquartile range) is 15 − 8 = 7. The range is 20 − 4 = 16.'],
gen(){ const k=RI(0,3);
 if(k===0){ const c=[RI(0,4),RI(1,5),RI(1,5),RI(0,4),RI(0,3)]; const row=c.map((n,i)=>`${i+1} book${i?'s':''}: ${n?'•'.repeat(n):'(none)'}`).join(' · '); if(PICK([0,1])){ const i=RI(0,4); return N(`Dot plot of books read by each boy. ${row}. How many boys read ${i+1} book${i?'s':''}?`, c[i], 'Each dot is one boy. Count the dots over that number.', {unit:'boys'}); } return N(`Dot plot of books read by each boy. ${row}. How many boys are there in all?`, c.reduce((x,y)=>x+y,0), 'Each dot is one boy. Count every dot in the whole plot.', {unit:'boys'}); }
 if(k===1){ const h=[RI(2,9),RI(2,9),RI(2,9),RI(2,9)]; const lab=['0–9','10–19','20–29','30–39']; const txt=h.map((n,i)=>`${lab[i]} pages: ${n} boys`).join(' · '); return N(`Histogram of pages learned. ${txt}. How many boys learned 20 pages or more?`, h[2]+h[3], 'Find every bar that starts at 20 or above, and add their heights.', {unit:'boys'}); }
 if(k===2){ const mn=RI(1,10), q1=mn+RI(2,8), md=q1+RI(1,8), q3=md+RI(1,8), mx=q3+RI(2,10); if(PICK([0,1])) return N(`A box plot shows: smallest ${mn}, lower quartile ${q1}, median ${md}, upper quartile ${q3}, largest ${mx}. What is the interquartile range (the width of the box)?`, q3-q1, 'The box goes from the lower quartile to the upper quartile. Subtract: upper quartile − lower quartile.'); return N(`A box plot shows: smallest ${mn}, lower quartile ${q1}, median ${md}, upper quartile ${q3}, largest ${mx}. What is the range?`, mx-mn, 'The range uses the ends of the whiskers: largest − smallest.'); }
 const T=[['You want to see every single score as its own dot.','Dot plot',['Histogram','Box plot']],['You want bars that count how many scores fall in groups like 0–9 and 10–19.','Histogram',['Dot plot','Box plot']],['You want to see the median and where the middle half of the scores are.','Box plot',['Dot plot','Histogram']]]; const r=PICK(T);
 return MX(`${r[0]} Which display should you use?`, [r[1]].concat(r[2]), 'Dot plot = one dot per value. Histogram = bars for groups. Box plot = median and the middle half.'); }}
};

/* ===== Math Level 8 batch 2 (13 skills, Blueprint IDs MATH.*.L08.*) — K-8 curriculum chat, 2026-11-10. Gap Map batch #2.
 PASTE: inside the MathMore IIFE, on the line right AFTER the Level 7 block (the line "window.TLM7=Object.keys(L7).length;" and its closing "}")
 and BEFORE "window.TLM=...". Uses only page helpers RI, PICK, N, MX, TLB. All local names live inside this { } block.
 Does NOT touch MATH.ALG.L08.02 Percent Problems (already live). Same shape as Level 7: {name, how[3], gen()}.
 ONE optional field per skill, the same idea as Reading's re[3]: re[3] = re-teach screens (0 a different way, 1 a simpler step, 2 the skill underneath).
 If the lesson engine has no hook for re[] yet: after 2 misses show re[0], then re[1], then re[2] (Teaching Standard part 3). ===== */
{
const g8=(a,b)=>{ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a||1; };
const fx8=v=>{ const s=String(Number(Math.abs(Number(v)).toFixed(6))); const p=s.split('.'); p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,','); return (v<0?'−':'')+p.join('.'); };
const pn8=v=>v<0?'('+fx8(v)+')':fx8(v);
const fr8=(n,d,imp)=>{ if(d<0){ n=-n; d=-d; } const k=g8(n,d); n/=k; d/=k; const s=n<0?'−':''; n=Math.abs(n); if(d===1) return s+n; if(n>d&&!imp) return s+Math.floor(n/d)+' '+(n%d)+'/'+d; return s+n+'/'+d; };
const pf8=(n,d)=>{ const t=fr8(n,d); return t[0]==='−'?'('+t+')':t; };
const ex8=T=>{ let s=''; T.forEach(([c,v])=>{ if(c===0) return; const a=Math.abs(c), body=(v&&a===1)?v:fx8(a)+v; if(s==='') s=(c<0?'−':'')+body; else s+=(c<0?' − ':' + ')+body; }); return s||'0'; };
const sb8=b=>(b<0?'− ':'+ ')+Math.abs(b);
const nz8=(lo,hi)=>{ let v=0; while(v===0) v=RI(lo,hi); return v; };
const r3=v=>Math.round(v*1000)/1000;
const pi8=v=>Math.round(v*314)/100;
const uq8=a=>new Set(a).size===a.length;
const dec8=(n,d,m)=>{ let w=Math.floor(n/d), r=n%d, s=''; for(let i=0;i<m&&r;i++){ r*=10; s+=Math.floor(r/d); r%=d; } return w+'.'+s+(r?'…':''); };
const n8=()=>PICK(TLB);
const FT8='Type a fraction like 3/4, or a mixed number like 1 1/4.';
const FP8='Type a fraction like 3/8.';
const NG8='For a negative answer, write a minus sign first, like -7.';
const L8={
'MATH.NUM.L08.02':{name:'Sign Rules',
how:['What is −6 times −4? Negative numbers follow two short rules when you multiply and divide. Learn them once and you can use them for the rest of your life.','(−6) × 4: first multiply without the signs, 6 × 4 = 24. Different signs give a negative answer: −24. (−6) × (−4): same signs give a positive answer: 24. Division uses the same rules: (−24) ÷ (−6) = 4, and 24 ÷ (−6) = −4.','Watch the pattern: 3 × (−2) = −6, 2 × (−2) = −4, 1 × (−2) = −2, 0 × (−2) = 0. Each answer goes UP by 2. Keep going: (−1) × (−2) = 2. That is why a negative times a negative is positive.'],
re:['Think of money. Owing $5 is −5. Three boys who each owe $5 owe 3 × (−5) = −15 together. Taking away 3 of those debts is (−3) × (−5) = +15: taking away a debt leaves you better off.','One step at a time. (−4) × (−2): Step 1, forget the signs: 4 × 2 = 8. Step 2, count the minus signs: there are two. Two is even, so the answer is positive: 8.','The skill underneath (Integer Adventure): a negative number is to the left of 0. The opposite of −3 is 3, the same distance on the other side. Multiplying by −1 just gives the opposite: (−1) × 3 = −3.'],
gen(){ const k=RI(0,4);
 if(k===0){ const a=nz8(-12,12), b=nz8(-12,12); if(a>0&&b>0) return this.gen(); return N(`${pn8(a)} × ${pn8(b)} = ?`, a*b, `First multiply ${Math.abs(a)} × ${Math.abs(b)} without the signs. Then the sign: same signs give a positive answer, different signs give a negative answer. ${NG8}`); }
 if(k===1){ const q=nz8(-12,12), d=nz8(-12,12); if(q>0&&d>0) return this.gen(); return N(`${pn8(q*d)} ÷ ${pn8(d)} = ?`, q, `First divide ${Math.abs(q*d)} ÷ ${Math.abs(d)} without the signs. Then the sign: same signs give positive, different signs give negative. ${NG8}`); }
 if(k===2){ const v=[nz8(-6,6),nz8(-6,6),nz8(-5,5)]; if(!v.some(x=>x<0)) return this.gen(); return N(`${v.map(pn8).join(' × ')} = ?`, v[0]*v[1]*v[2], `Count the minus signs. An even count makes the answer positive, an odd count makes it negative. Then multiply the numbers without their signs. ${NG8}`); }
 if(k===3){ const d=RI(2,5), h=RI(2,8); return N(`The temperature drops ${d} degrees every hour for ${h} hours. Write the total change as a number (a drop is negative).`, -d*h, `A drop of ${d} each hour is −${d}. Multiply (−${d}) × ${h}. ${NG8}`, {unit:'°'}); }
 const a=RI(2,9), b=RI(2,9); const T=[[`(−${a}) × (−${b})`,'Positive'],[`(−${a}) × ${b}`,'Negative'],[`${a*b} ÷ (−${b})`,'Negative'],[`(−${a*b}) ÷ (−${a})`,'Positive']]; const r=PICK(T);
 return MX(`Is the answer to ${r[0]} positive or negative?`, [r[1], r[1]==='Positive'?'Negative':'Positive'], 'Look only at the signs. Two negatives make a positive. One negative makes a negative.'); }},
'MATH.NUM.L08.01':{name:'Rational Add-Ups',
how:['Temperatures, money owed and heights above and below the ground are all numbers that can be negative, and they can be whole numbers, decimals or fractions. Now you will add and subtract all of them.','−7 + 3: start at −7 on the number line and move 3 to the right: −4. 5 − 9: subtracting is adding the opposite, 5 + (−9): start at 5 and move 9 left: −4. 3 − (−4) = 3 + 4 = 7: taking away a negative moves you right. −2.5 + (−1.5): both negative, add the sizes and keep the minus: −4.','Use chips. A plus chip and a minus chip cancel (they make 0). −7 + 3: put out 7 minus chips and 3 plus chips. 3 pairs cancel and 4 minus chips are left: −4.'],
re:['Think of money. −7 + 3: you owe $7 and earn $3, so you still owe $4: −4. 3 − (−4): someone takes away a $4 debt, so you are $4 better off: 7.','A simpler step: whole numbers first. −5 + 2: start at −5 and move 2 to the right: −4, −3. The answer is −3. Once this is easy, do the same with decimals and fractions.','The skill underneath (Common Ground): to add fractions they need the same bottom number. 1/2 + 1/4 = 2/4 + 1/4 = 3/4. With negatives, rename the fractions first, then handle the signs.'],
gen(){ const k=RI(0,4);
 if(k===0){ const a=nz8(-20,20), b=nz8(-20,20); if(a>0&&b>0) return this.gen(); return N(`${fx8(a)} + ${pn8(b)} = ?`, a+b, `Start at ${fx8(a)} on the number line. Adding a positive number moves right; adding a negative number moves left. ${NG8}`); }
 if(k===1){ const a=RI(-15,15), b=nz8(-15,15); return N(`${fx8(a)} − ${pn8(b)} = ?`, a-b, `Change subtracting into adding the opposite: ${fx8(a)} − ${pn8(b)} is ${fx8(a)} + ${pn8(-b)}. Then add. ${NG8}`); }
 if(k===2){ const a=nz8(-99,99), b=nz8(-99,99); if((a>0&&b>0)||a%10===0||b%10===0) return this.gen(); const add=PICK([0,1]); const v=add?(a+b)/10:(a-b)/10; return N(`${fx8(a/10)} ${add?'+':'−'} ${pn8(b/10)} = ?`, r3(v), add?`Signs first: if both are negative, add the sizes and keep the minus. If only one is negative, subtract the sizes and keep the sign of the bigger one. ${NG8}`:`Subtracting is adding the opposite: change − ${pn8(b/10)} to + ${pn8(-b/10)}, then add. ${NG8}`); }
 if(k===3){ const P=[[2,4],[3,6],[2,3],[4,8],[3,4],[2,5],[4,6]]; const [d1,d2]=PICK(P), n1=nz8(-(d1-1),d1-1), n2=nz8(-(d2-1),d2-1); if(n1>0&&n2>0) return this.gen(); const L=d1*d2/g8(d1,d2), top=n1*L/d1+n2*L/d2; if(top===0) return this.gen(); const o=[fr8(top,L), fr8(-top,L), fr8(n1+n2,d1+d2)]; if(!uq8(o)) return this.gen();
  return MX(`${fr8(n1,d1)} + ${pf8(n2,d2)} = ?`, o, `Rename both fractions with the same bottom number (${L}). Then add the tops, minding the signs. Never add the bottoms.`); }
 const t=RI(1,12), up=RI(t+1,t+15); return N(`At night it was ${fx8(-t)}°. By noon it rose ${up} degrees. What was the temperature at noon?`, up-t, `Start at ${fx8(-t)} and move ${up} steps up. It takes ${t} steps just to reach 0; then keep going.`, {unit:'°'}); }},
'MATH.NUM.L08.03':{name:'Rational Times',
how:['A diver going down 1.5 meters a minute, or half of a debt: multiplying and dividing negative fractions and decimals uses the sign rules you know, plus the fraction and decimal skills you know.','(−2/3) × 3/4: sign first, one minus, so negative. Size: 2/3 × 3/4 = 6/12 = 1/2. Answer −1/2. (−1.5) × (−4): two minuses, positive. 1.5 × 4 = 6. Answer 6. (−3/4) ÷ 1/2: keep, flip, multiply: (−3/4) × 2 = −6/4 = −1 1/2.','Sign and size are two separate jobs. Job 1, the sign: count the minus signs (even = positive, odd = negative). Job 2, the size: multiply or divide as if there were no signs. Put them together at the end.'],
re:['Use money: (−0.25) × 4 is four debts of 25 cents: you owe $1, so −1. (−6) ÷ 2 is a $6 debt split by 2 brothers: each owes $3, so −3.','A simpler step: (−0.5) × 4. Size: 0.5 × 4 = 2. Sign: one minus, so negative. The answer is −2.','The skill underneath (Keep, Flip, Multiply): 3/4 ÷ 1/2 = 3/4 × 2/1 = 6/4 = 1 1/2. Keep the first fraction, flip the second, multiply.'],
gen(){ const k=RI(0,3);
 if(k===0){ const a=nz8(-95,95), b=nz8(-9,9); if((a>0&&b>0)||a%10===0) return this.gen(); return N(`${pn8(a/10)} × ${pn8(b)} = ?`, r3(a*b/10), `Sign first: same signs positive, different signs negative. Then multiply without the point and put back one decimal place. ${NG8}`); }
 if(k===1){ const q=nz8(-30,30), d=nz8(-9,9); if((q>0&&d>0)||Math.abs(d)===1||q%10===0) return this.gen(); return N(`${pn8(q*d/10)} ÷ ${pn8(d)} = ?`, r3(q/10), `Sign first: same signs positive, different signs negative. Then divide ${fx8(Math.abs(q*d/10))} ÷ ${Math.abs(d)}, keeping the point straight above. ${NG8}`); }
 const a=nz8(-5,5), b=RI(2,6), c=nz8(-5,5), d=RI(2,7); if((a>0&&c>0)||Math.abs(a)>=b||Math.abs(c)>=d) return this.gen();
 if(k===2){ const o=[fr8(a*c,b*d), fr8(-a*c,b*d), fr8(a*d,b*c)]; if(!uq8(o)) return this.gen(); return MX(`${pf8(a,b)} × ${pf8(c,d)} = ?`, o, 'Sign first: same signs positive, different signs negative. Then multiply the tops, multiply the bottoms, and simplify.'); }
 const o=[fr8(a*d,b*c), fr8(-a*d,b*c), fr8(a*c,b*d)]; if(!uq8(o)) return this.gen(); return MX(`${pf8(a,b)} ÷ ${pf8(c,d)} = ?`, o, 'Keep the first fraction, flip the second, multiply. Then the sign: same signs positive, different signs negative.'); }},
'MATH.NUM.L08.04':{name:'Ends or Repeats',
how:['Every fraction can be written as a decimal by dividing. Some decimals stop. Others repeat the same digits forever. You will learn to find both and to tell which one you will get.','3/8 means 3 ÷ 8. Write 3.000. 8 into 30 is 3 (24), 6 left. 8 into 60 is 7 (56), 4 left. 8 into 40 is 5, nothing left. 3/8 = 0.375, it ENDS. 2/3 means 2 ÷ 3: 3 into 20 is 6, 2 left, and 2 left again, forever. 2/3 = 0.666…, it REPEATS.','The shortcut: put the fraction in lowest terms and look at the bottom number. If it is made only of 2s and 5s multiplied together (2, 4, 5, 8, 10, 20, 25…), the decimal ends. Any other factor (3, 7, 11…) makes it repeat.'],
re:['Use money: 1/4 of a dollar is a quarter, $0.25, and it ends. Now split $1 among 3 boys: 33 cents each, with 1 cent left over. Cut that cent into 3 and there is always a little left. That is why 1/3 = 0.333… never ends.','A simpler step: 1/2. Divide 1 ÷ 2: 2 does not go into 1, so write 1.0. 2 goes into 10 five times with nothing left. 1/2 = 0.5, and it ends.','The skill underneath (Decimal Pro): dividing past the point. 3 ÷ 4: write 3.00. 4 into 30 is 7 (28), 2 left. 4 into 20 is 5. The answer is 0.75.'],
gen(){ const k=RI(0,3);
 if(k===0){ const d=PICK([2,4,5,8,10,20,25,40]), n=RI(1,d-1); if(g8(n,d)!==1) return this.gen(); return N(`Write ${n}/${d} as a decimal.`, n/d, `A fraction is a division: ${n} ÷ ${d}. Write ${n} as ${n}.000 and divide one digit at a time until nothing is left over.`); }
 if(k===1){ const d=PICK([3,4,5,6,7,8,9,11,12,15,16,20,25,30]), n=RI(1,d-1); if(g8(n,d)!==1) return this.gen(); let e=d; while(e%2===0) e/=2; while(e%5===0) e/=5;
  return MX(`When you divide to write ${n}/${d} as a decimal, does it end or repeat forever?`, e===1?['It ends','It repeats forever']:['It repeats forever','It ends'], `Look at the bottom number, ${d}. Break it into factors. Only 2s and 5s means it ends. Any other factor means it repeats.`); }
 if(k===2){ const d=PICK([3,6,9,11,12,15]), n=RI(1,d-1); if(g8(n,d)!==1) return this.gen(); const ok=dec8(n,d,6), n2=n+1<d?n+1:n-1; const o=[ok, dec8(n2,d,6), ok.replace('…','').slice(0,4)]; if(!uq8(o)) return this.gen();
  return MX(`Which decimal equals ${n}/${d}? (… means the digits keep going.)`, o, `Divide ${n} ÷ ${d}: write ${n} as ${n}.000000 and divide. When a remainder comes back that you already had, the digits will repeat.`); }
 const d=PICK([3,6,7,9,11,12]), n=RI(1,d-1); if(g8(n,d)!==1) return this.gen(); return N(`${n}/${d} as a decimal repeats forever. Round it to the nearest hundredth (2 places after the point).`, Math.round(n*100/d)/100, `Divide ${n} ÷ ${d} to 3 places after the point. Then look at the third digit: 5 or more rounds the second digit up, 4 or less leaves it.`); }},
'MATH.NUM.L08.05':{name:'Rational Stories',
how:['Real problems mix it all together: a diver going down, a debt being paid back, a recipe doubled. The math is what you know. The new skill is turning the story into the right number sentence.','A diver goes down 2.5 meters every minute for 4 minutes. Down is negative: −2.5 each minute. 4 minutes means multiply: (−2.5) × 4 = −10. He is at −10 meters, 10 meters below sea level.','Before you calculate, give every number in the story its sign. "Goes down 3" is −3. "Owes $10" is −10. "Earns $4" is +4. "Rises 6" is +6. Then decide: put together (add), take away (subtract), equal groups (multiply), or share (divide).'],
re:['Draw it: a number line standing up, like a thermometer or an elevator. Up is positive, down is negative. Mark where you start, then move.','A simpler step: write just the signed numbers first. "Starts at floor 2 and goes down 5" becomes 2 and −5. Now the number sentence is 2 + (−5) = −3.','The skill underneath (Rational Times): (−2.5) × 4 = −10. Sign first (one minus, so negative), then size (2.5 × 4 = 10).'],
gen(){ const k=RI(0,4), who=n8();
 if(k===0){ const r=PICK([1.5,2,2.5,3]), m=RI(2,8); return N(`A diver goes down ${fx8(r)} meters every minute. Where is he after ${m} minutes, compared with sea level? (Below sea level is negative.)`, -r*m, `Going down is negative: −${fx8(r)} each minute. Multiply (−${fx8(r)}) × ${m}. ${NG8}`, {unit:'m'}); }
 if(k===1){ const ch=RI(2,6), h=RI(2,6); return N(`Over ${h} hours the temperature changed by ${fx8(-ch*h)} degrees, the same amount each hour. What was the change each hour?`, -ch, `Share the total change equally: ${fx8(-ch*h)} ÷ ${h}. A negative divided by a positive is negative. ${NG8}`, {unit:'°'}); }
 if(k===2){ const owe=RI(10,40), pay=RI(2,8), wk=RI(2,6); if(pay*wk>=owe) return this.gen(); return N(`${who} owes his brother $${owe}, so his balance is −$${owe}. He pays back $${pay} each week for ${wk} weeks. What is his balance now?`, -owe+pay*wk, `Start at −${owe}. Each payment adds ${pay}. Add ${pay} × ${wk} to −${owe}. ${NG8}`, {unit:'$'}); }
 if(k===3){ const P=[[3,4],[2,3],[1,2],[3,8]], [p,q]=PICK(P), b=PICK([2,3,4,1.5,2.5]); return N(`A kugel recipe uses ${p}/${q} cup of oil. ${who} makes ${fx8(b)} batches. How many cups of oil does he need? ${FT8}`, p/q*b, `"${fx8(b)} batches" means multiply: ${p}/${q} × ${fx8(b)}.${b%1?` Write ${fx8(b)} as ${b*2}/2 first.`:''}`, {unit:'cups'}); }
 const up=RI(2,9), down=RI(up+2,up+12); return N(`An elevator starts on floor ${up}. It goes down ${down} floors. The street is floor 0 and the floors under the street are negative. Which floor is it on now?`, up-down, `Start at ${up} and go down ${down}. It takes ${up} floors to reach 0; keep counting down past 0. ${NG8}`); }},
'MATH.ALG.L08.01':{name:'Proportional Relationships',
how:['When one amount is always the same number times another, the two are proportional. Prices, recipes and maps all work this way, and one number, the constant, tells you everything.','A table: 2 notebooks cost $6, 3 cost $9, 5 cost $15. Divide each price by the number of notebooks: 6 ÷ 2 = 3, 9 ÷ 3 = 3, 15 ÷ 5 = 3. Always 3, so the constant of proportionality is 3, and the equation is y = 3x.','On a graph, a proportional relationship is a straight line that goes through (0, 0). The point where x = 1 shows the constant: the line through (1, 3) has y = 3x.'],
re:['Use a picture: 1 box holds 3 seforim. 2 boxes hold 6. 3 boxes hold 9. Every box adds the same 3. Seforim ÷ boxes is always 3. That 3 is the constant.','A simpler step: find the amount for ONE. If 4 notebooks cost $12, one notebook costs 12 ÷ 4 = $3. The amount for one is the constant.','The skill underneath (Four Quadrants): the point (2, 6) means go right 2 and up 6. For a proportional line every point has the same y ÷ x, here 6 ÷ 2 = 3.'],
gen(){ const k=RI(0,4);
 if(k===0){ const kk=PICK([2,3,4,5,6,1.5,2.5,0.5]), x=[RI(1,3)]; x.push(x[0]+RI(1,3)); x.push(x[1]+RI(1,4)); return N(`In this table y is proportional to x. x: ${x.join(', ')}. y: ${x.map(v=>fx8(kk*v)).join(', ')}. What is the constant of proportionality (y ÷ x)?`, kk, 'Pick any column and divide y by x. Check that another column gives the same number.'); }
 if(k===1){ const kk=RI(2,6), add=RI(1,5), prop=PICK([0,1]), x=[1,2,3,4], y=x.map(v=>prop?kk*v:kk*v+add);
  return MX(`Is this relationship proportional? x: ${x.join(', ')}. y: ${y.join(', ')}.`, prop?['Yes, y ÷ x is always the same','No, y ÷ x changes']:['No, y ÷ x changes','Yes, y ÷ x is always the same'], 'Divide y by x in every column. Proportional means you get the SAME number every time.'); }
 if(k===2){ const kk=RI(2,9); return MX(`Each box holds ${kk} seforim. Which equation gives y, the number of seforim in x boxes?`, [`y = ${kk}x`, `y = x + ${kk}`, `y = x ÷ ${kk}`], `For every 1 box there are ${kk} seforim. The seforim are always ${kk} times the boxes.`); }
 if(k===3){ const kk=PICK([1.5,2,2.5,3,4,0.5]), x=RI(2,8); return N(`A straight line goes through (0, 0) and (${x}, ${fx8(kk*x)}). What is y when x = 1?`, kk, `A proportional graph is a line through (0, 0). The y-value at x = 1 is the constant: divide ${fx8(kk*x)} ÷ ${x}.`); }
 const P=[[1,2,1,4],[1,2,1,3],[3,4,1,4],[1,3,1,6],[2,3,1,3],[3,4,1,2]]; const [a,b,c,d]=PICK(P); return N(`${n8()} walks ${a}/${b} of a mile every ${c}/${d} of an hour. How many miles does he walk in 1 hour? ${FT8}`, (a/b)/(c/d), `Miles in 1 hour = miles ÷ hours: ${a}/${b} ÷ ${c}/${d}. Keep, flip, multiply.`, {unit:'miles'}); }},
'MATH.ALG.L08.03':{name:'Expressions with Rationals',
how:['Algebra gets stronger when the numbers can be negative or fractions. You will expand, combine and factor expressions like −3(x − 4) and (1/2)x + (1/4)x.','Expand −3(x − 4): multiply −3 by EACH term. −3 × x = −3x. −3 × (−4) = +12. So −3x + 12. Combine (1/2)x + (1/4)x: add the numbers in front, 1/2 + 1/4 = 3/4, so (3/4)x. Factor 6x − 9: the biggest number in both is 3, so 3(2x − 3).','Check with a number: put x = 2 into −3(x − 4): −3 × (−2) = 6. Put x = 2 into −3x + 12: −6 + 12 = 6. Same answer, so they are the same expression.'],
re:['Think of an area picture: −3(x − 4) is a rectangle −3 tall, cut into two parts, x wide and −4 wide. The parts are −3x and +12. Add the parts: −3x + 12.','A simpler step: distribute a positive first. 2(x − 5) = 2x − 10. Now a negative: −2(x − 5): −2 times x is −2x, and −2 times −5 is +10. So −2x + 10.','The skill underneath (Same Value, New Look): 3(x + 4) = 3x + 12, and 2x + 5x = 7x. Rational Add-Ups gives you the signs.'],
gen(){ const k=RI(0,4);
 if(k===0){ const a=RI(2,9), b=nz8(-9,9); const o=[ex8([[-a,'x'],[-a*b,'']]), ex8([[-a,'x'],[a*b,'']]), ex8([[-a,'x'],[-b,'']])]; if(!uq8(o)) return this.gen(); return MX(`Which is the same as −${a}(${ex8([[1,'x'],[b,'']])})?`, o, `Multiply −${a} by EACH term inside. Watch the signs: −${a} times a negative number is positive.`); }
 if(k===1){ const p=nz8(-9,9), q=nz8(-9,9), c=nz8(-12,12), d=nz8(-12,12); if(p+q===0||c+d===0) return this.gen(); const e=ex8([[p,'x'],[c,'']])+' '+(q<0?'−':'+')+' '+(Math.abs(q)===1?'':Math.abs(q))+'x '+sb8(d); const o=[ex8([[p+q,'x'],[c+d,'']]), ex8([[p-q,'x'],[c+d,'']]), ex8([[p+q,'x'],[c-d,'']])]; if(!uq8(o)) return this.gen();
  return MX(`Which is the same as ${e}?`, o, 'Gather like terms. Add the x terms together (each sign stays with its term), then add the plain numbers together.'); }
 if(k===2){ const g=RI(2,9), m=RI(1,9), n=nz8(-9,9), neg=PICK([0,1]), s=neg?-1:1; if(g8(m,n)!==1) return this.gen(); const lead=(neg?'−':'')+g; const o=[lead+'('+ex8([[m,'x'],[n,'']])+')', lead+'('+ex8([[m,'x'],[-n,'']])+')', lead+'('+ex8([[g*m,'x'],[n,'']])+')']; if(!uq8(o)) return this.gen();
  return MX(`Factor: which is the same as ${ex8([[s*g*m,'x'],[s*g*n,'']])}?`, o, `Find the greatest common factor of both terms${neg?' and take out the minus sign too':''}. Divide each term by it, then multiply back to check.`); }
 if(k===3){ const P=[[1,2,1,4],[1,3,1,6],[2,3,1,6],[3,4,1,2],[1,2,1,3],[3,5,1,10]]; const [a,b,c,d]=PICK(P), sub=PICK([0,1]), L=b*d/g8(b,d), top=sub?a*L/b-c*L/d:a*L/b+c*L/d; const cf=(t,dd)=>{ const s=fr8(t,dd,1); return s==='0'?'0':s==='1'?'x':s==='−1'?'−x':'('+s+')x'; };
  const o=[cf(top,L), cf(sub?a-c:a+c, sub?Math.abs(b-d):b+d), cf(-top,L)]; if(!uq8(o)||o.includes('0')) return this.gen();
  return MX(`Which is the same as (${a}/${b})x ${sub?'−':'+'} (${c}/${d})x?`, o, `Both are x terms, so combine the numbers in front: ${a}/${b} ${sub?'−':'+'} ${c}/${d}. Give the fractions the same bottom number (${L}) first.`); }
 const a=nz8(-6,6), b=nz8(-9,9), x=nz8(-6,6); if(a>0&&x>0) return this.gen(); const lead=a===1?'':a===-1?'−':fx8(a);
 return N(`What is the value of ${lead}(x ${sb8(b)}) when x = ${fx8(x)}?`, a*(x+b), `Put ${pn8(x)} in place of x. Work inside the parentheses first, then multiply by ${fx8(a)}. Watch the signs. ${NG8}`); }},
'MATH.ALG.L08.04':{name:'Two-Step Equations',
how:['Most real problems take two steps to solve: a price for each item plus a fee, or a total shared after something is taken off. Two-step equations solve them all.','3x + 5 = 20. Undo in reverse order. First undo the + 5: subtract 5 from both sides: 3x = 15. Then undo the × 3: divide both sides by 3: x = 5. Check: 3 × 5 + 5 = 20. For −2x > 6: divide by −2 and FLIP the sign: x < −3.','Think of a gift wrapped twice. To open it, take off the outside paper first. In 3x + 5 = 20, the + 5 is the outside layer. Undo it first, then undo the × 3.'],
re:['Use a balance: 3 bags of x and 5 loose weights on one side, 20 weights on the other. Take 5 weights off each side: 3 bags balance 15. Share the 15 into 3 bags: each bag is 5.','A simpler step: do the two one-step equations separately. x + 5 = 20 gives x = 15. 3x = 15 gives x = 5. A two-step equation is just these two in a row.','The skill underneath (One-Step Equations): whatever you do to one side, do to the other side. x − 4 = 10: add 4 to both sides, x = 14.'],
gen(){ const k=RI(0,4);
 if(k===0){ const a=nz8(-9,9), x=nz8(-12,12), b=nz8(-20,20); if(Math.abs(a)===1) return this.gen(); return N(`${ex8([[a,'x'],[b,'']])} = ${fx8(a*x+b)}. What is x?`, x, `Undo in reverse order. First undo the ${sb8(b)}: ${b<0?'add '+(-b)+' to':'subtract '+b+' from'} both sides. Then divide both sides by ${fx8(a)}. ${NG8}`); }
 if(k===1){ const a=RI(2,6), x=nz8(-10,10)*a, b=nz8(-12,12); return N(`x/${a} ${sb8(b)} = ${fx8(x/a+b)}. What is x?`, x, `First undo the ${sb8(b)} on both sides. Then undo "divided by ${a}": multiply both sides by ${a}. ${NG8}`); }
 if(k===2){ const a=nz8(-6,6), b=nz8(-9,9), x=nz8(-9,9); if(Math.abs(a)===1||x+b===0) return this.gen(); return N(`${fx8(a)}(x ${sb8(b)}) = ${fx8(a*(x+b))}. What is x?`, x, `First divide both sides by ${fx8(a)}. Then undo the ${sb8(b)} inside the parentheses. ${NG8}`); }
 if(k===3){ const n=RI(2,6), p=RI(2,12), f=RI(1,9); return N(`${n8()} buys ${n} siddur covers, all the same price, and a $${f} bookmark. He pays $${n*p+f} in all. Solve ${n}x + ${f} = ${n*p+f}. What does one cover cost?`, p, `Take away the bookmark first: ${n*p+f} − ${f}. Then share what is left among the ${n} covers.`, {unit:'$'}); }
 const a=nz8(-5,5), x0=RI(-6,8), b=RI(-10,10); if(Math.abs(a)===1) return this.gen(); const neg=a<0, c=a*x0+b; let o=[`x ${neg?'<':'>'} ${fx8(x0)}`, `x ${neg?'>':'<'} ${fx8(x0)}`, `x ${neg?'<':'>'} ${fx8(-x0)}`]; if(!uq8(o)) o[2]=`x ${neg?'<':'>'} ${fx8(x0+1)}`;
 return MX(`Solve: ${ex8([[a,'x'],[b,'']])} > ${fx8(c)}`, o, neg?`Undo the plain number first, then divide both sides by ${fx8(a)}. Dividing by a NEGATIVE number flips the > sign around.`:`Undo the plain number first, then divide both sides by ${a}. The > sign stays the same.`); }},
'MATH.GEO.L08.01':{name:'Scale Drawings',
how:['Builders, map makers and architects draw big things small. A scale tells you how the small drawing matches the real thing, so you can read any plan or map.','A shul plan says 1 inch = 4 feet. A wall that is 3 inches long on the plan is 3 × 4 = 12 feet long in real life. Going the other way, a real 20-foot wall is 20 ÷ 4 = 5 inches on the plan.','Make a ratio table. Plan inches: 1, 2, 3, 4. Real feet: 4, 8, 12, 16. Find the number you have in one row and read the answer in the other row.'],
re:['Picture it: lay the plan on the floor of the real room. Every 1 inch on the paper stretches out to cover 4 feet of floor. 3 inches stretch to 3 × 4 feet.','A simpler step: start from 1. If 1 inch is 4 feet, then 2 inches is 8 feet. Count up by 4s if multiplying feels hard.','The skill underneath (Proportional Relationships): real length = scale × plan length, just like y = kx. The scale is the constant k.'],
gen(){ const k=RI(0,4);
 if(k===0){ const s=PICK([2,3,4,5,8,10]), d=RI(2,12); return N(`On a plan of the shul, 1 inch stands for ${s} feet. A wall is ${d} inches long on the plan. How long is the real wall?`, s*d, `Every 1 inch on the plan is ${s} real feet. Multiply the plan inches by ${s}.`, {unit:'feet'}); }
 if(k===1){ const s=PICK([2,4,5,10]), d=RI(2,12); return N(`A sukkah plan uses the scale 1 inch = ${s} feet. A real wall of the sukkah is ${s*d} feet long. How long is it on the plan?`, d, `Going from real to plan, find how many groups of ${s} feet fit: divide ${s*d} ÷ ${s}.`, {unit:'inches'}); }
 if(k===2){ const s=PICK([5,10,20,25,50]), d=RI(2,15); return N(`On a map, 1 cm stands for ${s} km. Two towns are ${d} cm apart on the map. How far apart are they really?`, s*d, `Each centimeter on the map is ${s} km. Multiply ${d} × ${s}.`, {unit:'km'}); }
 if(k===3){ const s=PICK([2,3,4,5,6]), d=RI(2,9); return N(`A table in the beis medrash is ${d} inches long in a drawing and ${s*d} feet long in real life. How many real feet does 1 inch stand for?`, s, `Find the amount for ONE inch: divide the real feet by the drawing inches, ${s*d} ÷ ${d}.`, {unit:'feet'}); }
 const s=PICK([2,3,4,5]), L=RI(2,10); return N(`A plan uses 1 inch = ${s} feet. A wall is ${2*L} inches long on it. The plan is redrawn smaller, at 1 inch = ${2*s} feet. How long is the wall on the new plan?`, L, `Find the real length first: ${2*L} × ${s} feet. Then change it to the new plan: divide by ${2*s}.`, {unit:'inches'}); }},
'MATH.GEO.L08.02':{name:'Circles',
how:['Wheels, round tables and the moon are circles. Two short formulas give the distance around a circle and the space inside it, using a special number called π (pi), about 3.14.','A round table has radius 3 feet (center to edge). The diameter is 2 × 3 = 6 feet (all the way across). Circumference (distance around) = π × diameter = 3.14 × 6 = 18.84 feet. Area (space inside) = π × radius × radius = 3.14 × 3 × 3 = 28.26 square feet.','Wrap a string around a round tray, then lay it straight. It is a little more than 3 times as long as the distance across. That "little more than 3" is π. So circumference = π × diameter.'],
re:['Picture the area: cut a circle into many thin pie slices and lay them in a row, points up and down. They form a shape like a rectangle, radius tall and half the circumference wide. Its area is π × radius × radius.','A simpler step: know the parts first. Radius = center to the edge. Diameter = all the way across = 2 × radius. If you have the diameter, the radius is half of it.','The skill underneath (Rational Times): multiplying a decimal. 3.14 × 4: multiply 314 × 4 = 1,256, then put back 2 places: 12.56.'],
gen(){ const k=RI(0,4), P='Use 3.14 for π.';
 if(k===0){ const r=RI(2,15); return N(`A round table in the sukkah has a radius of ${r} feet. What is its circumference (the distance around)? ${P}`, pi8(2*r), 'First find the diameter: 2 × radius. Then multiply the diameter by 3.14.', {unit:'feet'}); }
 if(k===1){ const d=RI(2,30); return N(`A wheel has a diameter of ${d} inches. How far is it around the wheel (the circumference)? ${P}`, pi8(d), 'Circumference = 3.14 × diameter. Multiply without the point, then put back 2 decimal places.', {unit:'inches'}); }
 if(k===2){ const r=RI(2,12); return N(`A round challah board has a radius of ${r} inches. What is its area? ${P}`, pi8(r*r), 'Area = 3.14 × radius × radius. Multiply the radius by itself first, then by 3.14.', {unit:'square inches'}); }
 if(k===3){ const d=RI(1,10)*2; return N(`A round rug has a diameter of ${d} feet. What is its area? ${P}`, pi8(d*d/4), `The area formula uses the RADIUS. Half of ${d} is the radius. Then 3.14 × radius × radius.`, {unit:'square feet'}); }
 const r=RI(2,15); return N(`It is ${fx8(pi8(2*r))} inches around a round tray. What is its radius? ${P}`, r, `Distance around = 3.14 × diameter, so divide ${fx8(pi8(2*r))} by 3.14 to get the diameter. The radius is half the diameter.`, {unit:'inches'}); }},
'MATH.GEO.L08.03':{name:'Angles, Area and Volume Problems',
how:['Angles fit together in ways that let you find a missing angle without a protractor. Then the area and volume formulas you know solve real building and packing problems.','Supplementary angles make a straight line: they add to 180°. If one is 130°, the other is 180 − 130 = 50°. Complementary angles make a right angle: they add to 90°. When two lines cross, the angles straight across (vertical angles) are equal. Volume of a prism = area of the base × length.','Draw it: a straight line is half a turn, 180°. The corner of a page is a right angle, 90°. When two lines cross, the angles across from each other match like a mirror.'],
re:['Use your arm: hold it straight out. That is a straight line, 180°. Bend it up to point at the ceiling: that quarter turn is 90°. Any two pieces that make the straight arm add to 180.','A simpler step: one fact at a time. Straight line: the angles add to 180. Right angle: they add to 90. Straight across from each other: they are equal.','The skill underneath (Nets and Surface Area): volume of a box = base area × height. A box 3 by 4 by 5: base 3 × 4 = 12, then 12 × 5 = 60 cubic units.'],
gen(){ const k=RI(0,5);
 if(k===0){ const a=RI(20,160); return N(`Two angles are supplementary (together they make a straight line, 180°). One is ${a}°. What is the other?`, 180-a, 'A straight line is 180°. Subtract the angle you know from 180.', {unit:'°'}); }
 if(k===1){ const a=RI(10,80); return N(`Two angles are complementary (together they make a right angle, 90°). One is ${a}°. What is the other?`, 90-a, 'A right angle is 90°. Subtract the angle you know from 90.', {unit:'°'}); }
 if(k===2){ const a=RI(20,160); if(a===90) return this.gen(); return PICK([0,1]) ? N(`Two straight lines cross and make four angles. One angle is ${a}°. What is the angle straight across from it (the vertical angle)?`, a, 'Vertical angles, straight across from each other, are always equal.', {unit:'°'}) : N(`Two straight lines cross and make four angles. One angle is ${a}°. What is the angle right next to it, on the same straight line?`, 180-a, 'Angles side by side on a straight line add up to 180°. Subtract from 180.', {unit:'°'}); }
 if(k===3){ const m=PICK([2,3,4,5]), x=RI(5,30), c=RI(1,20), other=180-(m*x+c); if(other<10) return this.gen(); return N(`Two angles are supplementary. One is (${m}x + ${c})° and the other is ${other}°. What is x?`, x, `Write the equation: ${m}x + ${c} + ${other} = 180. Subtract the plain numbers from 180, then divide by ${m}.`); }
 if(k===4){ const b=RI(2,10), h=RI(2,10), L=RI(2,12); if((b*h)%2) return this.gen(); return N(`A tent is a prism. Its front is a triangle with base ${b} feet and height ${h} feet. The tent is ${L} feet long. What is its volume?`, b*h/2*L, 'Volume of a prism = area of the base × length. The base is a triangle: base × height ÷ 2. Then multiply by the length.', {unit:'cubic feet'}); }
 const w=RI(6,15), h=RI(5,12), s=RI(2,Math.min(w,h)-2); return N(`A room is a rectangle ${w} feet by ${h} feet, with a square corner ${s} feet by ${s} feet cut out for a closet. What is the floor area of the room?`, w*h-s*s, 'Find the whole rectangle (length × width). Then take away the square corner (side × side).', {unit:'square feet'}); }},
'MATH.STAT.L08.01':{name:'Samples and Inference',
how:['You cannot ask every boy in a big school, but you can ask some of them, a sample. A fair sample lets you make a good guess about everyone, and compare two groups using their data.','To learn what the whole school thinks, pick boys at random from every grade, not just one class or one team. If 12 out of a random 40 boys want chess, that is 12/40 = 3/10. In a school of 400 boys, about 3/10 × 400 = 120 would want chess.','Picture a pot of soup. Stir it well and one spoonful tastes like the whole pot. A random sample is a well-stirred spoonful. A sample from only one corner (one class, one team) is not.'],
re:['Ask: could every boy in the whole group have been picked? Names drawn from a box with everyone\'s name in it: yes, fair. Only the boys on the hockey team: no, the rest were left out.','A simpler step for predicting: find the fraction in the sample. 6 out of 20 is 6/20 = 3/10. If the whole school is 200 boys, 3/10 of 200 = 60.','The skill underneath (Dot Plots, Histograms, Box Plots, and the mean): the mean is the total shared equally. 4, 6, 8: total 18, and 18 ÷ 3 = 6.'],
gen(){ const k=RI(0,4);
 if(k===0){ const T=[['The yeshiva wants to know which day the boys want for the Chanukah mesibah. Which sample is fairest?',['30 boys picked at random from every grade','The 30 boys in 8th grade','The first 30 boys who come into the office']],['To learn how long boys in the school spend on homework, which sample is fairest?',['Names drawn from a box with every boy\'s name in it','The boys in the chess club','Only boys who stay late for night seder']],['To find the favorite sport of boys in the whole school, which sample is fairest?',['20 boys picked at random from the whole school','The 20 boys on the hockey team','20 boys from one class']],['To learn which sefer the boys in the shiur want to learn next, which sample is fairest?',['Every 3rd boy on the shiur list','Only the boys at the front table','Only the boys who already own that sefer']]]; const r=PICK(T);
  return MX(r[0], r[1], 'A fair (random) sample gives every boy in the whole group the same chance to be picked. Which choice leaves nobody out?'); }
 if(k===1){ const s=PICK([20,25,40,50]), c=RI(2,s-2), m=PICK([4,5,8,10,20]); if((c*m)%1) return this.gen(); return N(`In a random sample of ${s} boys, ${c} want basketball at the Lag BaOmer outing. There are ${s*m} boys in the school. About how many boys in the whole school want basketball?`, c*m, `The whole school should match the sample. The school is ${m} times as big as the sample (${s*m} ÷ ${s}), so multiply ${c} × ${m}.`, {unit:'boys'}); }
 if(k===2){ const mk=m=>{ const v=Array(5).fill(m); for(let i=0;i<10;i++){ const a=RI(0,4), b=RI(0,4), s=RI(1,3); if(a!==b&&v[a]-s>=1){ v[a]-=s; v[b]+=s; } } return v; }; const ma=RI(8,20), mb=RI(4,ma-2), A=mk(ma), B=mk(mb);
  return N(`Pages learned by 5 boys in each shiur. Shiur Aleph: ${A.join(', ')}. Shiur Beis: ${B.join(', ')}. How many more pages is Aleph's mean than Beis's mean?`, ma-mb, 'Find each mean first: add the 5 numbers and divide by 5. Then subtract the smaller mean from the bigger one.', {unit:'pages'}); }
 if(k===3){ const A=Array.from({length:5},()=>RI(5,30)), B=Array.from({length:5},()=>RI(5,30)); const ra=Math.max(...A)-Math.min(...A), rb=Math.max(...B)-Math.min(...B); if(ra===rb) return this.gen();
  return MX(`Quiz scores. Class A: ${A.join(', ')}. Class B: ${B.join(', ')}. Which class's scores are more spread out (bigger range)?`, ra>rb?['Class A','Class B','Both the same']:['Class B','Class A','Both the same'], 'For each class find the range: biggest score − smallest score. The bigger range is more spread out.'); }
 const m=RI(8,20); return MX(`Two random samples of 10 boys each from 7th grade read a mean of ${m} and ${m+1} pages. What is the best conclusion?`, [`The whole 7th grade probably reads about ${m} or ${m+1} pages`, `Every 7th grader reads exactly ${m} pages`, 'The samples are wrong because they are not the same'], 'Random samples are close to the whole group but not exactly the same. A good guess is a range near both samples.'); }},
'MATH.STAT.L08.02':{name:'Probability',
how:['How likely is it to rain, or to pick the winning raffle ticket? Probability is a number from 0 (impossible) to 1 (certain) that says how likely something is.','A bag has 3 red and 5 blue marbles, 8 in all. The probability of picking red is 3 out of 8: 3/8. Two coins: list every outcome, HH, HT, TH, TT. Both heads is 1 of 4: 1/4. Or multiply the chances: 1/2 × 1/2 = 1/4.','On a line from 0 to 1: 0 is impossible, 1/2 is an even chance, 1 is certain. Close to 0 is unlikely, close to 1 is likely.'],
re:['List every outcome. A coin and a number cube: H1, H2, H3, H4, H5, H6, T1 … T6. That is 12 outcomes. Heads and a 6 is only H6, 1 of 12: 1/12.','A simpler step: one event. A bag has 2 red and 3 blue marbles, 5 in all. The chance of red is 2 out of 5: 2/5.','The skill underneath (Rational Times): multiplying fractions. 1/2 × 1/6 = 1/12. Multiply the tops, multiply the bottoms.'],
gen(){ const k=RI(0,5);
 if(k===0){ const c={red:RI(1,8),blue:RI(1,8),green:RI(1,8)}, col=PICK(['red','blue','green']), t=c.red+c.blue+c.green; return N(`A bag has ${c.red} red, ${c.blue} blue and ${c.green} green marbles. ${n8()} picks one without looking. What is the probability it is ${col}? ${FP8}`, c[col]/t, `Probability = ${col} marbles ÷ all the marbles. Add all the marbles to find the total first.`); }
 if(k===1){ const n=PICK([4,5,6,8,10]), m=RI(1,n-2); return N(`A spinner has ${n} equal parts numbered 1 to ${n}. What is the probability of spinning a number greater than ${m}? ${FP8}`, (n-m)/n, `Count the numbers greater than ${m} (from ${m+1} up to ${n}). Put that count over ${n}, the number of equal parts.`); }
 if(k===2){ const T=[['You flip two coins. What is the probability that both land heads?',1/4,'List the outcomes: HH, HT, TH, TT. How many are both heads? Or multiply 1/2 × 1/2.'],['You flip a coin and roll a number cube (1 to 6). What is the probability of heads and a 6?',1/12,'Multiply the two chances: heads is 1/2 and a 6 is 1/6.'],['You flip a coin and roll a number cube (1 to 6). What is the probability of tails and an even number?',1/4,'Multiply the two chances: tails is 1/2, and even (2, 4, 6) is 3/6.'],['You roll two number cubes (1 to 6). What is the probability that both show 6?',1/36,'Multiply the two chances: each cube is 1/6.'],['A spinner has 4 equal parts. You spin it twice. What is the probability of landing on the same part (part 1) both times?',1/16,'Multiply the two chances: each spin is 1/4.']]; const r=PICK(T); return N(`${r[0]} ${FP8}`, r[1], r[2]); }
 if(k===3){ const q=PICK([2,3,4,5,6,8]), m=RI(3,15); return N(`A spinner has ${q} equal parts and one of them is blue. If you spin it ${q*m} times, about how many times should it land on blue?`, m, `The chance of blue is 1/${q}. Multiply: 1/${q} × ${q*m}, which is ${q*m} ÷ ${q}.`, {unit:'times'}); }
 if(k===4){ const T=[['0','Impossible'],['1','Certain'],['1/2','Equally likely as not'],['0.05','Unlikely'],['0.95','Likely']]; const i=RI(0,4), r=T[i], w=T.filter((x,j)=>j!==i).map(x=>x[1]); const a=RI(0,3); let b=RI(0,3); while(b===a) b=RI(0,3);
  return MX(`An event has a probability of ${r[0]}. How likely is it?`, [r[1], w[a], w[b]], '0 means it can never happen and 1 means it always happens. 1/2 is right in the middle. Close to 0 is unlikely, close to 1 is likely.'); }
 const n=PICK([20,30,40,50,60]), h=RI(Math.round(n*0.3), Math.round(n*0.7)); return N(`A coin was flipped ${n} times and landed heads ${h} times. What is the experimental probability of heads? ${FP8}`, h/n, `Experimental probability = times it happened ÷ total tries: ${h} out of ${n}.`); }}
};

{
const g9=(a,b)=>{ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a||1; };
const fx9=v=>{ const s=String(Number(Math.abs(Number(v)).toFixed(6))); const p=s.split('.'); p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,','); return (v<0?'−':'')+p.join('.'); };

const ex9=T=>{ let s=''; T.forEach(([c,v])=>{ if(c===0) return; const a=Math.abs(c), body=(v&&a===1)?v:fx9(a)+v; if(s==='') s=(c<0?'−':'')+body; else s+=(c<0?' − ':' + ')+body; }); return s||'0'; };
const sb9=b=>(b<0?'− ':'+ ')+fx9(Math.abs(b));

const uq9=a=>new Set(a).size===a.length;
const pt9=(x,y)=>'('+fx9(x)+', '+fx9(y)+')';
const pi9=v=>Math.round(v*314)/100;
const sq9=n=>Number.isInteger(Math.sqrt(n));
const two9=()=>{ const a=PICK(TLB); let b=PICK(TLB); while(b===a) b=PICK(TLB); return [a,b]; };
const FT9='Type a fraction like 3/4, or a mixed number like 1 1/4.';

const TR9=[[3,4,5],[5,12,13],[8,15,17],[7,24,25],[6,8,10],[9,12,15],[20,21,29],[9,40,41],[12,16,20],[15,20,25]];
