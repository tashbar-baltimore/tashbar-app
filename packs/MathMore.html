<script>
/* ===== MathMore: Math K-8 Levels 4+ by Blueprint skill ID (TL-038, 2026-11-08, by CLAUDE) =====
Lives outside QuestPage.html so that page stays under the ~256 KB limit. Sent to the page by msQuestTools() (Photos.gs)
and run after start; Placement.gs plBuilt() also reads this file, so the Placement page shows these as "Lesson ready".
Same style as MK8 in QuestPage: 'ID':{name, how[3], gen()}. N(q,answer,hint,extra) typed; MX(q,[right,wrong,wrong],hint,extra) choice.
Anyone may add skills here: log it in HQ. Keep every helper inside this function (no new page-wide names). */
(function(){
const nm=()=>PICK(TLB);
const pr=()=>{ const a=PICK(TLB); let b=PICK(TLB); while(b===a) b=PICK(TLB); return [a,b]; };
const op=(r,w)=>{ const o=[String(r)]; w.forEach(x=>{ x=String(x); if(o.indexOf(x)<0) o.push(x); }); return o.slice(0,3); };
const nw=(r,w)=>op(r, w.concat([r+1,r-1,r+2,r+10,r-10,r*2+1]).filter(x=>x>=0&&x!==r));
const rep=(e,n)=>Array(Math.max(0,n)+1).join(e);
const rows=(e,r,c)=>Array(r).fill(rep(e,c)).join('\n');
const bar=(b,a,on,off)=>rep(on||'\u{1F7E6}',a)+rep(off||'⬜',b-a);
const r10=n=>Math.round(n/10)*10, r100=n=>Math.round(n/100)*100;
const X='×', D='÷', S='−';
const tm=(h,m)=>{ h=((h-1)%12)+1; return h+':'+(m<10?'0':'')+m; };
const L4={
'MATH.PV.L04.01':{name:'Round Up',
how:['To round to the nearest 10, look at the ones digit.','0 to 4 rounds down; 5 to 9 rounds up. 47 rounds to 50, 43 rounds to 40.','To round to the nearest 100, look at the tens digit: 238 rounds to 200, 262 rounds to 300.'],
gen(){ const k=RI(0,3);
if(k===0||k===3){ let n=k===0?RI(11,99):RI(101,989); if(n%10===0) n+=RI(1,9); const lo=Math.floor(n/10)*10, o=n%10;
 return N(`Round ${n} to the nearest 10.`, r10(n), `The ones digit is ${o}. 5 or more goes up to ${lo+10}; 4 or less goes down to ${lo}.`, {pic:`${lo}  ◀──  ${n}  ──▶  ${lo+10}`}); }
if(k===1){ let n=RI(101,949); if(n%100===0) n+=RI(1,99); const lo=Math.floor(n/100)*100, t=Math.floor(n/10)%10;
 return N(`Round ${n} to the nearest 100.`, r100(n), `Look at the tens digit, ${t}. 5 or more goes up to ${lo+100}; 4 or less goes down to ${lo}.`, {pic:`${lo}  ◀──  ${n}  ──▶  ${lo+100}`}); }
let n=RI(21,98); if(n%10===0) n+=3; const x=nm();
return N(`${x}'s shul has ${n} seforim on the shelf. About how many is that, to the nearest 10?`, r10(n), `Is ${n} closer to ${Math.floor(n/10)*10} or to ${Math.floor(n/10)*10+10}? Look at the ones digit.`, {pic:'\u{1F4DA}'}); }},
'MATH.OPS.L04.03':{name:'Good Guess',
how:['Round each number first, then add or subtract.','312 + 489 is about 300 + 500 = 800.','If your real answer is far from the estimate, check your work again.'],
gen(){ const k=RI(0,3);
if(k===0){ const a=RI(12,89), b=RI(12,89); return N(`Estimate ${a} + ${b} by rounding each number to the nearest 10.`, r10(a)+r10(b), `${a} is about ${r10(a)}. Now round ${b} and add the two round numbers.`); }
if(k===1){ const a=RI(320,899), b=RI(110,a-120); return N(`Estimate ${a} ${S} ${b} by rounding each number to the nearest 100.`, r100(a)-r100(b), `${a} is about ${r100(a)}. Round ${b} the same way, then subtract.`); }
if(k===2){ const a=RI(120,480), b=RI(120,480), s=a+b, kind=RI(0,2), x=nm(); const said=kind===0?s:kind===1?s+PICK([200,300,400]):s-PICK([200,100]);
 const est=r100(a)+r100(b); const right=kind===0?'Yes, it is close to the estimate':kind===1?'No, it is much too big':'No, it is much too small';
 return MX(`${x} added ${a} + ${b} and got ${said}. Is that answer reasonable?`, op(right,['Yes, it is close to the estimate','No, it is much too big','No, it is much too small']), `Round first: ${r100(a)} + ${r100(b)} = ${est}. Is ${said} close to ${est}?`); }
const a=RI(410,890), b=RI(110,a-150); const e=r100(a)-r100(b);
return MX(`Which is the best estimate for ${a} ${S} ${b}?`, op(e,[e+200,e-100>0?e-100:e+300,a-b+500]), `Round each number to the nearest hundred, then subtract.`); }},
'MATH.OPS.L04.04':{name:'Easy Times',
how:['Any number times 0 is 0. Any number times 1 stays the same.','Times 2 is a double: 2 × 7 = 7 + 7 = 14.','Times 10 puts a 0 on the end: 10 × 6 = 60. Times 5 is half of times 10.'],
gen(){ const f=PICK([0,1,2,5,10]), n=RI(1,10), k=RI(0,2);
const hint=f===0?'Zero groups of anything is nothing at all.':f===1?'One group of a number is just that number.':f===2?`Double it: ${n} + ${n}.`:f===5?`Times 10 is ${n*10}. Times 5 is half of that.`:`Put a 0 on the end of ${n}.`;
if(k===0) return N(`${f} ${X} ${n} = ?`, f*n, hint, (f===2||f===5)?{pic:rows('\u{1F7E1}',f,n)}:{});
if(k===1){ if(f===0) return N(`${nm()} has 0 boxes. Each box would hold ${n} pencils. How many pencils does he have?`, 0, hint);
 return N(`${nm()} has ${f} pack${f>1?'s':''} of pencils. Each pack has ${n} pencils. How many pencils?`, f*n, hint, f*n<=50?{pic:rows('✏️',f,n)}:{}); }
const g=PICK([2,5,10]); return N(`${g} ${X} ? = ${g*n}`, n, `Count by ${g}s until you reach ${g*n}. How many jumps did you make?`); }},
'MATH.OPS.L04.05':{name:'Times Tower 3-4-6',
how:['Times 3: double it, then add one more group. 3 × 7 = 14 + 7 = 21.','Times 4: double, then double again. 4 × 6: 12, then 24.','Times 6: times 3, then double. 6 × 7 = 21 + 21 = 42.'],
gen(){ const f=PICK([3,4,6]), n=RI(1,10), k=RI(0,2);
const hint=f===3?`Double ${n} is ${2*n}. Add one more ${n}.`:f===4?`Double ${n} is ${2*n}. Double it again.`:`3 ${X} ${n} is ${3*n}. Double it.`;
if(k===0) return N(`${f} ${X} ${n} = ?`, f*n, hint, {pic:rows('\u{1F535}',f,n)});
if(k===1) return N(`${nm()} sets up ${f} Shabbos tables. Each table gets ${n} challah roll${n>1?'s':''}. How many rolls?`, f*n, hint, {pic:rows('\u{1F956}',f,n)});
return N(`${n} ${X} ${f} = ?`, f*n, `Turn it around: ${n} ${X} ${f} is the same as ${f} ${X} ${n}. ${hint}`); }},
'MATH.OPS.L04.06':{name:'Times Tower 7-8-9',
how:['Times 9: times 10, then take away one group. 9 × 6 = 60 − 6 = 54.','Times 8: double three times. 8 × 3: 6, 12, 24.','Times 7: times 5 plus times 2. 7 × 6 = 30 + 12 = 42.'],
gen(){ const f=PICK([7,8,9]), n=RI(1,10), k=RI(0,2);
const hint=f===9?`10 ${X} ${n} = ${10*n}. Take away one ${n}.`:f===8?`Double ${n} three times: ${2*n}, ${4*n}, then double again.`:`5 ${X} ${n} = ${5*n} and 2 ${X} ${n} = ${2*n}. Add them.`;
if(k===0) return N(`${f} ${X} ${n} = ?`, f*n, hint, n<=8?{pic:rows('\u{1F7E3}',f,n)}:{});
if(k===1) return N(`There are ${f} rows in the beis medrash. Each row has ${n} shtenders. How many shtenders?`, f*n, hint);
return N(`${n} ${X} ${f} = ?`, f*n, `Turn it around: same as ${f} ${X} ${n}. ${hint}`); }},
'MATH.OPS.L04.01':{name:'Times Table Champion',
how:['Know your facts up to 10 × 10.','Use a fact you know: 7 × 8 is 7 × 4 doubled: 28 + 28 = 56.','Order does not matter: 6 × 9 = 9 × 6 = 54.'],
gen(){ const a=RI(2,10), b=RI(2,10), k=RI(0,2);
if(k===0) return N(`${a} ${X} ${b} = ?`, a*b, `Use a fact you know: ${a} ${X} ${b-1} = ${a*(b-1)}. Add one more ${a}.`);
if(k===1) return MX(`Which is ${a} ${X} ${b}?`, nw(a*b,[a*b+a,a*b-a,a+b,(a+1)*b]), `Count by ${a}s, ${b} times. Or use ${a} ${X} ${b-1} = ${a*(b-1)} and add ${a}.`);
const x=nm(); return N(`${x} lines up his chumashim in ${a} rows with ${b} in each row. How many chumashim?`, a*b, `${a} rows of ${b}: that is ${a} ${X} ${b}.`, a*b<=60?{pic:rows('\u{1F4D7}',a,b)}:{}); }},
'MATH.OPS.L04.07':{name:'Fair Shares',
how:['Sharing: 12 cookies shared by 3 boys. Deal them out: each boy gets 4.','Grouping: 12 cookies, 3 in each bag. How many bags? 4 bags.','Both are 12 ÷ 3 = 4.'],
gen(){ const d=RI(2,6), q=RI(2,8), t=d*q, k=RI(0,2);
if(k===0) return N(`${t} cookies are shared equally by ${d} boys. How many cookies does each boy get?`, q, `Deal the cookies out one at a time to each of the ${d} boys until they are all gone. Or think: ${d} ${X} ? = ${t}.`, {pic:rep('\u{1F36A}',t)});
if(k===1) return N(`${nm()} puts ${t} seforim on shelves, ${q} on each shelf. How many shelves does he fill?`, d, `Make groups of ${q} until all ${t} are used. Or think: ? ${X} ${q} = ${t}.`, {pic:rep('\u{1F4D8}',t)});
return N(`${t} ${D} ${d} = ?`, q, `Share ${t} into ${d} equal groups. Think: ${d} ${X} what = ${t}?`); }},
'MATH.OPS.L04.02':{name:'Missing Factor',
how:['Division asks a times question backwards.','24 ÷ 6 = ? means 6 × ? = 24.','6 × 4 = 24, so 24 ÷ 6 = 4.'],
gen(){ const a=RI(2,10), b=RI(1,10), k=RI(0,2);
if(k===0) return N(`${a} ${X} ? = ${a*b}`, b, `Count by ${a}s up to ${a*b}. How many jumps?`);
if(k===1) return N(`${a*b} ${D} ${a} = ?`, b, `Think: ${a} ${X} what = ${a*b}?`);
return MX(`Which times fact helps you solve ${a*b} ${D} ${a}?`, op(`${a} ${X} ${b} = ${a*b}`,[`${a} + ${b} = ${a+b}`,`${a*b} ${S} ${a} = ${a*b-a}`,`${a} ${X} ${a} = ${a*a}`]), `Division undoes times. Find the fact that has ${a} and ${a*b} in it.`); }},
'MATH.OPS.L04.08':{name:'Tens Times',
how:['3 × 40 means 3 groups of 4 tens.','3 × 4 tens = 12 tens = 120.','Do the small fact, then put a 0 on the end.'],
gen(){ const a=RI(2,9), t=RI(1,9)*10, k=RI(0,2);
const hint=`${a} ${X} ${t/10} = ${a*t/10}. Now put a 0 on the end: ${a} ${X} ${t/10} tens.`;
if(k===0) return N(`${a} ${X} ${t} = ?`, a*t, hint, a*t/10<=30?{pic:rows('\u{1F51F}',a,t/10)}:{});
if(k===1) return N(`${nm()} brings ${a} boxes of pencils to yeshiva. Each box has ${t} pencils. How many pencils?`, a*t, hint);
return N(`${t} ${X} ${a} = ?`, a*t, `Turn it around: ${a} ${X} ${t}. `+hint); }},
'MATH.OPS.L04.09':{name:'Four-Way Stories',
how:['Read the story. What happens first? What happens next?','Solve one step at a time: Moshe buys 3 packs of 4 pens (12), then gives 5 away: 12 − 5 = 7.','Check: does your answer make sense in the story?'],
gen(){ const k=RI(0,3), [x,y]=pr();
if(k===0){ const a=RI(2,6), b=RI(3,8), c=RI(1,a*b-1); return N(`${x} buys ${a} packs of markers with ${b} in each pack. He gives ${c} markers to ${y}. How many markers does ${x} have left?`, a*b-c, `Step 1: ${a} packs of ${b} is ${a} ${X} ${b}. Step 2: take away the ${c} he gave.`); }
if(k===1){ const d=RI(2,5), q=RI(3,8), t=d*q, g=RI(2,t-2), h=t-g; return N(`${x} has ${h} raisins and ${y} gives him ${g} more. He shares them all equally with ${d-1} friend${d>2?'s':''}, so ${d} boys in all. How many raisins does each boy get?`, q, `Step 1: ${h} + ${g} = how many raisins in all? Step 2: share that by ${d} boys.`); }
if(k===2){ const a=RI(3,8), b=RI(4,9), c=RI(2,9); return N(`For the siyum, ${x} sets up ${a} rows with ${b} chairs in each row. Then he adds ${c} more chairs. How many chairs in all?`, a*b+c, `Step 1: ${a} rows of ${b} is ${a} ${X} ${b}. Step 2: add the ${c} extra chairs.`); }
const p=RI(3,9), d=RI(2,5), T=p*d+RI(5,40); return N(`${x}'s sefer has ${T} pages. He learns ${p} pages a day for ${d} days. How many pages are left?`, T-p*d, `Step 1: ${p} pages for ${d} days is ${p} ${X} ${d}. Step 2: subtract that from ${T}.`); }},
'MATH.FRAC.L04.02':{name:'Fair Pieces',
how:['A fraction names equal parts of one whole.','The bottom number tells how many equal parts. The top number tells how many parts we mean.','3/4: the whole is cut into 4 equal parts and we take 3.'],
gen(){ const b=PICK([2,3,4,6,8]), a=RI(1,b-1), k=RI(0,2);
if(k===0) return MX('What fraction of the bar is blue?', op(`${a}/${b}`,[`${b}/${a}`,`${a}/${b-a}`,`${b-a}/${b}`,`1/${b}`]), `Count all the equal parts: that is the bottom. Count the blue parts: that is the top.`, {pic:bar(b,a)});
if(k===1) return N('How many equal parts is this whole bar cut into?', b, 'Count every box, blue and white. That number is the bottom of the fraction.', {pic:bar(b,a)});
const x=nm(); return MX(`${x} cut a challah into ${b} equal pieces and ate ${a}. What fraction of the challah did he eat?`, op(`${a}/${b}`,[`${b}/${a}`,`${b-a}/${b}`,`${a}/${b+1}`]), `The challah has ${b} equal pieces: that is the bottom. He ate ${a}: that is the top.`, {pic:bar(b,a,'\u{1F956}','⬜')}); }},
'MATH.FRAC.L04.01':{name:'Fraction Trail',
how:['Cut the line from 0 to 1 into equal jumps.','If there are 4 equal jumps, each jump is 1/4.','The dot 3 jumps from 0 is at 3/4.'],
gen(){ const b=PICK([2,3,4,6,8]), a=RI(1,b-1), k=RI(0,2);
let line='0 ├'; for(let i=1;i<b;i++) line+='──'+(i===a&&k!==1?'\u{1F534}':'┼'); line+='──┤ 1';
if(k===0) return MX('Where is the red dot?', op(`${a}/${b}`,[`${a}/${b-1}`,`${a}/${b+1}`,`${b}/${a}`,`1/${b}`]), `Count the equal jumps from 0 to 1: that is the bottom. Count the jumps from 0 to the dot: that is the top.`, {pic:line});
if(k===1) return N('The line from 0 to 1 is cut into equal jumps. How many jumps?', b, 'Count the spaces between the marks, not the marks themselves.', {pic:line});
return MX('Each jump on this line is what fraction?', op(`1/${b}`,[`1/${b-1}`,`1/${b+1}`,`${b}/1`]), `There are ${b} equal jumps from 0 to 1. One jump is 1 out of ${b}.`, {pic:line}); }},
'MATH.FRAC.L04.03':{name:'Same Size Shares',
how:['Equal fractions cover the same amount of the whole.','1/2 of a bar is the same as 2/4 of the same bar.','Cut every piece into 2: twice as many parts and twice as many shaded.'],
gen(){ const [a,b]=PICK([[1,2],[1,3],[2,3],[1,4],[3,4]]), m=b===2?PICK([2,3,4]):2, k=RI(0,2);
const two=`${a}/${b}:  `+[...Array(b)].map((_,i)=>i<a?rep('\u{1F7E6}',m):rep('⬜',m)).join('│')+`\n?/${b*m}:  `+bar(b*m,a*m);
if(k===0) return N(`${a}/${b} = ?/${b*m}`, a*m, `Each of the ${b} parts is cut into ${m} smaller parts. How many small parts are blue now?`, {pic:two});
if(k===1) return MX(`Which fraction is equal to ${a}/${b}?`, op(`${a*m}/${b*m}`,[`${a+m}/${b+m}`,`${a*m}/${b}`,`${a*m+1}/${b*m}`]), `Multiply the top and the bottom by the same number. Adding the same number does not work.`, {pic:bar(b,a)});
const eq=RI(0,1)===1, c=eq?a*m:a*m+1;
return MX(`Are ${a}/${b} and ${c}/${b*m} equal?`, op(eq?'Yes':'No',['Yes','No']), `Cut each of the ${b} parts into ${m}. Then ${a}/${b} becomes ${a*m}/${b*m}. Compare that with ${c}/${b*m}.`, {pic:bar(b,a)+'\n'+bar(b*m,c)}); }},
'MATH.FRAC.L04.04':{name:'Whole Numbers in Disguise',
how:['When the top and bottom are the same, it is 1 whole: 4/4 = 1.','A whole number over 1 is just that number: 3/1 = 3.','8/4 means 8 fourths. 4 fourths make 1 whole, so 8/4 = 2.'],
gen(){ const k=RI(0,3);
if(k===0){ const b=RI(2,8); return N(`${b}/${b} = ?`, 1, `All ${b} parts are blue. The whole bar is full.`, {pic:bar(b,b)}); }
if(k===1){ const n=RI(2,9); return N(`${n}/1 = ?`, n, `Each whole is cut into just 1 part. ${n} parts like that make ${n} wholes.`, {pic:rows('\u{1F7E6}',1,n)}); }
if(k===2){ const b=PICK([2,3,4]), w=RI(2,3); return N(`${w*b}/${b} = how many wholes?`, w, `Every ${b} parts make 1 whole bar. How many full bars do ${w*b} parts make?`, {pic:Array(w).fill(bar(b,b)).join('\n')}); }
const b=RI(2,8); return MX('Which fraction is equal to 1 whole?', op(`${b}/${b}`,[`1/${b}`,`${b}/1`,`${b+1}/${b}`]), 'One whole means the top and the bottom are the same.'); }},
'MATH.FRAC.L04.05':{name:'Fraction Face-Off',
how:['Same bottom: the bigger top is more. 3/5 > 2/5.','Same top: the bigger bottom means smaller pieces. 1/3 > 1/4.','Use > for greater than, < for less than, and = for the same.'],
gen(){ const k=RI(0,2);
if(k===0){ const b=PICK([3,4,5,6,8]); let a=RI(1,b-1), c=RI(1,b-1); const s=a>c?'>':a<c?'<':'=';
 return MX(`Which sign goes in the box?   ${a}/${b}  ☐  ${c}/${b}`, op(s,['>','<','=']), `The bottoms are the same, so the pieces are the same size. Compare the tops: ${a} and ${c}.`, {pic:bar(b,a)+'\n'+bar(b,c)}); }
if(k===1){ const t=RI(1,3); const bs=[3,4,6,8].filter(x=>x>t); let b=PICK(bs), d=PICK(bs); while(d===b) d=PICK(bs); const s=b<d?'>':b>d?'<':'=';
 return MX(`Which sign goes in the box?   ${t}/${b}  ☐  ${t}/${d}`, op(s,['>','<','=']), `The tops are the same. More pieces means smaller pieces. Which is bigger, a piece cut into ${b} or into ${d}?`, {pic:bar(b,t)+'\n'+bar(d,t)}); }
const [x,y]=pr(), b=RI(2,4), d=b+RI(1,4);
return MX(`${x} ate 1/${b} of a potato kugel. ${y} ate 1/${d} of the same size kugel. Who ate more?`, op(x,[y,'They ate the same']), `Cutting into ${b} makes bigger pieces than cutting into ${d}.`); }},
'MATH.MEAS.L04.01':{name:'Area by Squares',
how:['Area is how many unit squares cover a shape, with no gaps and no overlaps.','Count the squares inside: that is the area in square units.','A shape 3 squares long and 2 rows tall covers 6 square units.'],
gen(){ const k=RI(0,2);
if(k===0){ const r=RI(2,5), c=RI(2,7); return N('Each \u{1F7E9} is 1 square unit. What is the area of this rug?', r*c, `Count every square. Tip: count one row (${c}), then count by ${c}s for each row.`, {pic:rows('\u{1F7E9}',r,c)}); }
if(k===1){ const r1=RI(1,3), c1=RI(4,7), r2=RI(1,3), c2=RI(2,c1-1); return N('Each \u{1F7E8} is 1 square unit. What is the area of this shape?', r1*c1+r2*c2, `Split it into two rectangles. Top part: ${r1} row${r1>1?'s':''} of ${c1}. Bottom part: ${r2} row${r2>1?'s':''} of ${c2}. Add them.`, {pic:rows('\u{1F7E8}',r1,c1)+'\n'+rows('\u{1F7E8}',r2,c2)}); }
const r=RI(2,4), c=RI(3,6); return N(`${nm()} covers the sukkah floor with square mats. Each \u{1F7EB} is 1 square foot. What is the area of the floor in square feet?`, r*c, `Count every mat. ${r} rows with ${c} in each row.`, {pic:rows('\u{1F7EB}',r,c)}); }},
'MATH.MEAS.L04.02':{name:'Area by Multiplying',
how:['Count the squares in one row: that is the length.','Count the rows: that is the width.','Area = length × width. 4 rows of 6 is 24 square units.'],
gen(){ const l=RI(3,9), w=RI(2,6), k=RI(0,2);
if(k===0) return N(`This rectangle is ${l} squares long and ${w} rows wide. What is its area?`, l*w, `Area = length ${X} width = ${l} ${X} ${w}.`, l*w<=40?{pic:rows('\u{1F7E6}',w,l)}:{});
if(k===1) return N(`A table in the beis medrash is ${l} feet long and ${w} feet wide. What is its area in square feet?`, l*w, `Multiply length by width: ${l} ${X} ${w}.`);
return N(`A rectangle has an area of ${l*w} square inches. One side is ${l} inches. How long is the other side?`, w, `${l} ${X} ? = ${l*w}. Think of the division fact ${l*w} ${D} ${l}.`); }},
'MATH.MEAS.L04.03':{name:'Perimeter',
how:['Perimeter is the distance all the way around a shape.','Add every side: a 5 by 3 rectangle is 5 + 3 + 5 + 3 = 16.','For a square, all 4 sides are the same: multiply one side by 4.'],
gen(){ const k=RI(0,3);
if(k===0){ const l=RI(3,12), w=RI(2,9); const pic=[rep('\u{1F7EB}',Math.min(l,10))].concat(Array(Math.min(w,5)-2>0?Math.min(w,5)-2:0).fill('\u{1F7EB}'+rep('⬜',Math.min(l,10)-2)+'\u{1F7EB}'),[rep('\u{1F7EB}',Math.min(l,10))]).join('\n');
 return N(`${nm()} walks all the way around a garden ${l} meters long and ${w} meters wide. How many meters does he walk?`, 2*(l+w), `Add all 4 sides: ${l} + ${w} + ${l} + ${w}.`, {pic}); }
if(k===1){ const s=RI(2,12); return N(`A square challah board has sides of ${s} inches. What is its perimeter?`, 4*s, `A square has 4 equal sides: ${s} ${X} 4.`); }
if(k===2){ const n=RI(3,6), sd=[...Array(n)].map(()=>RI(2,12)); return N(`A shape has ${n} sides: ${sd.join(' cm, ')} cm. What is its perimeter in cm?`, sd.reduce((p,c)=>p+c,0), 'Add up every side. Go one side at a time.'); }

'MATH.PV.L05.01':{name:'Six-Digit Climb',

re:['A different way: read the number in two halves. 482,615 is "four hundred eighty-two THOUSAND, six hundred fifteen". The digit 8 is in the tens spot of the thousands half, so it means 80 thousand: 80,000.','A simpler step: use a smaller number. In 3,520 the 5 is in the hundreds place, so it is worth 500. Same idea, fewer digits.','The skill underneath (Tens Times): each place is 10 times the one to its right. 7 tens = 70, 7 hundreds = 700, 7 thousands = 7,000: one more zero each step.'],

 if(k===0){ let p=RI(1,5); let t5=0; while((s[5-p]==='0'||s[5-p]==='1')&&t5<50){ p=RI(1,5); t5++; } if(s[5-p]==='0'||s[5-p]==='1') return this.gen(); const dg=+s[5-p]; return ND5(`In ${fx5(n)}, what is the value of the digit ${dg} in the ${PL5[p]} place?`, dg*10**p, `The ${PL5[p]} place is worth ${fx5(10**p)}. Multiply the digit by that.`, `The ${dg} sits in the ${PL5[p]} place.\nOne ${PL1[p]} is ${fx5(10**p)}.\nMultiply ${dg} × ${fx5(10**p)}.\nNow type it.`); }
 if(k===1){ const parts=s.split('').map((c,i)=>+c*10**(5-i)).filter(v=>v); return ND5(`${parts.map(fx5).join(' + ')} = ?`, n, 'Each part fills one place. Write the digits in their places, and put 0 where a place is empty.', `Write one box for each place, hundred thousands down to ones.\nPut each part's first digit in its box.\nPut 0 in any empty box.\nNow type the number.`); }

'MATH.PV.L05.02':{name:'Round Anything',

'MATH.OPS.L05.03':{name:'Column Master',
how:['Big numbers can be added and subtracted with one trusty method: line them up and work column by column, from the ones on the right to the biggest place on the left.','345,268 + 127,595: ones 8 + 5 = 13, write 3 carry 1. Tens 6 + 9 + 1 = 16, write 6 carry 1. Hundreds 2 + 5 + 1 = 8. Keep going left: 472,863.','For subtraction, when the top digit is too small, borrow: take 1 from the next place to the left and make it 10 more here. 52,301 − 18,456: borrow carefully across the zero.'],
re:['A different way: estimate first. 345,268 + 127,595 is about 345,000 + 128,000 = 473,000. Your exact answer should be close to that.','A simpler step: practice with three digits. 468 + 275: 8 + 5 = 13 (write 3, carry 1), 6 + 7 + 1 = 14 (write 4, carry 1), 4 + 2 + 1 = 7. Answer 743.','The skill underneath (Six-Digit Climb): lining up by place matters. The ones go under the ones, the thousands under the thousands, or the answer is wrong.'],

 if(k===3){ const a=RI(1200,9800), b=RI(1200,9800); return ND5(`${a1}'s yeshiva collected ${fx5(a)} cans for recycling. ${b1}'s yeshiva collected ${fx5(b)} cans. How many cans in all?`, a+b, '"In all" means add.', add, {unit:'cans'}); }

'MATH.NUM.L05.01':{name:'Factor Hunt',
how:['Some numbers can be split into equal rows in many ways; others only one way. Finding factors is like being a detective who finds every way to build a rectangle of dots.','Factors of 12: 1 × 12, 2 × 6, 3 × 4. So the factors are 1, 2, 3, 4, 6, 12. A prime number has exactly two factors, 1 and itself (like 7). A composite number has more (like 12). Multiples of 4 are 4, 8, 12, 16… (the 4 times table).','Picture 12 dots: 1 row of 12, 2 rows of 6, 3 rows of 4. Every rectangle you can make shows a factor pair. 7 dots make only 1 row of 7, so 7 is prime.'],
re:['A different way: test each number from 1 up. Does it divide evenly, with nothing left over? Stop when the pairs start repeating.','A simpler step: is 2 a factor of 10? 10 ÷ 2 = 5 with nothing left over, so yes. Is 3 a factor of 10? 10 ÷ 3 leaves 1 over, so no.','The skill underneath (Missing Factor): 4 × ? = 20. The answer, 5, is a factor of 20, and so is 4.'],
gen(){ const k=RI(0,4); const fac=n=>{ const f=[]; for(let i=1;i<=n;i++) if(n%i===0) f.push(i); return f; };
 if(k===0){ const n=RI(11,99); const f=fac(n); const pr=f.length===2; return MD5(`Is ${n} prime or composite?`, pr?['prime','composite']:['composite','prime'], 'A prime number has only 2 factors: 1 and itself. Try dividing by 2, 3, 5 and 7.', `Try ${n} ÷ 2, ÷ 3, ÷ 5, ÷ 7.\nIf one divides evenly, ${n} has more factors.\nOnly 1 and ${n}? Then it is prime.\nNow tap it.`); }
 if(k===1){ const n=PICK([12,18,20,24,28,30,32,36,40,42,45,48,54,56,60,63,64,72,80,84,90,96]); const f=fac(n).filter(x=>x>1&&x<n); const yes=PICK(f); const no=[]; let t=0; while(no.length<3&&t<200){ t++; const x=RI(2,Math.min(n-1,20)); if(n%x&&!no.includes(x)) no.push(x); } if(no.length<3) return this.gen(); return MD5(`Which number is a factor of ${n}?`, [yes,...no].map(String), `A factor divides ${n} with nothing left over.`, `Divide ${n} by each choice.\nLook for the one with no remainder.\nNow tap it.`); }

 const p=PICK([3,7,11,13]), q=PICK([7,11,13,17,19]); const n=p*q; const sm=Math.min(...fac(n).filter(x=>x>1)); return ND5(`What is the smallest factor of ${n}, other than 1?`, sm, `Try dividing ${n} by 2, then 3, then 5, then 7… The first one that divides evenly is the answer.`, `Try ${n} ÷ 2. Then ÷ 3, ÷ 5, ÷ 7…\nStop at the first one with no remainder.\nNow type that number.`); }},

'MATH.OPS.L05.04':{name:'Times As Many',
how:['"Twice as tall", "three times as many": these are times comparisons. They are not about adding a little more; they are about multiplying.','Moshe has 6 stickers. Dovid has 4 times as many. Dovid has 4 groups of 6: 4 × 6 = 24 stickers. The other way: if 24 is 4 times as many as some number, that number is 24 ÷ 4 = 6.','Draw a bar for Moshe: one box of 6. Draw Dovid\'s bar: four boxes of 6 in a row. Four boxes of 6 = 24.'],
re:['A different way: say it as an equation. "24 is 4 times as many as 6" means 24 = 4 × 6. Find the missing number in the equation.','A simpler step: Yaakov has 2 marbles. Shmuel has 3 times as many. That is 2 + 2 + 2 = 6, or 3 × 2 = 6.','The skill underneath (Missing Factor): 5 × ? = 35 is the same as asking 35 ÷ 5. The answer is 7.'],
gen(){ const k=RI(0,4); const [a,b]=two5(); const x=RI(3,12), m=RI(2,9);
 if(k===0) return ND5(`${a} has ${x} stickers. ${b} has ${m} times as many stickers. How many stickers does ${b} have?`, m*x, `"${m} times as many" means ${m} groups of ${x}. Multiply.`, `${b} has ${m} groups of ${x}.\nMultiply ${m} × ${x}.\nNow type it.`, {unit:'stickers'});
 if(k===1) return ND5(`${a} read ${m*x} pages. That is ${m} times as many pages as ${b} read. How many pages did ${b} read?`, x, `${m*x} is ${m} groups of ${b}'s pages. Divide to find one group.`, `${m*x} is ${m} equal groups of ${b}'s pages.\nDivide ${m*x} ÷ ${m} to find one group.\nNow type it.`, {unit:'pages'});
 if(k===2) return ND5(`${m*x} is how many times as many as ${x}?`, m, `How many ${x}s fit into ${m*x}? Divide.`, `Ask: how many groups of ${x} make ${m*x}?\nDivide ${m*x} ÷ ${x}.\nNow type it.`);
 if(k===3){ const o=[`${m*x} = ${m} × ${x}`, `${m*x} = ${m} + ${x}`, `${m} = ${m*x} × ${x}`]; return MD5(`Which equation means "${m*x} is ${m} times as many as ${x}"?`, o, '"Times as many" means multiply.', `"Times as many" means multiply.\nThe bigger amount equals ${m} times the smaller.\nNow tap the matching equation.`); }
 return ND5(`${a} has ${x} marbles. ${b} has ${m} times as many. How many MORE marbles does ${b} have than ${a}?`, m*x-x, `First find ${b}'s marbles: ${m} × ${x}. Then subtract ${a}'s ${x}.`, `First find ${b}'s marbles: ${m} × ${x}.\nThen take away ${a}'s ${x} marbles.\nNow type the difference.`, {unit:'marbles'}); }},

'MATH.OPS.L05.05':{name:'Leftover Logic',
how:['When you divide in real life, the leftovers matter. Sometimes you need one more van for the leftover boys; sometimes the leftover cookies just stay on the plate. Thinking about what the remainder means is the real skill.','29 boys, 6 to a van: 29 ÷ 6 = 4 R5. Four vans carry 24 boys, but 5 boys are still waiting, so you need 5 vans. Packing 50 cookies, 8 to a box: 50 ÷ 8 = 6 R2, so 6 full boxes and 2 cookies left over.','Ask yourself: does the leftover need a place of its own (round up), get ignored (just full groups), or is it the answer itself (the remainder)?'],
re:['A different way: draw it. 29 boys in vans of 6: fill a van, fill another… after 4 vans, 5 boys are left. They need a van too.','A simpler step: 7 boys, 3 to a table. 7 ÷ 3 = 2 R1. Two full tables, and the 1 extra boy needs a third table.','The skill underneath (Long Division Lab): 50 ÷ 8 is 6 with 2 left over, because 6 × 8 = 48 and 50 − 48 = 2.'],
gen(){ const k=RI(0,4); const [a,b]=two5();
 if(k===0){ const g=RI(4,9); let n=RI(20,90); if(n%g===0) n++; return ND5(`${n} boys are going on a trip. Each van holds ${g} boys. How many vans are needed?`, Math.ceil(n/g), 'Divide, then think: the leftover boys still need a van.', `Divide ${n} ÷ ${g}.\nThe answer has a remainder: some boys are left over.\nThey need one more van, so add 1.\nNow type it.`, {unit:'vans'}); }
 if(k===1){ const g=RI(4,9); let n=RI(20,90); if(n%g===0) n++; return ND5(`${a} has ${n} cookies to pack, ${g} in each box. How many FULL boxes can ${a} make?`, Math.floor(n/g), 'Only full boxes count. The leftover cookies do not make a full box.', `Divide ${n} ÷ ${g}.\nKeep only the whole number part.\nThe leftover cookies do not fill a box.\nNow type it.`, {unit:'boxes'}); }
 if(k===2){ const g=RI(4,9); let n=RI(20,90); if(n%g===0) n++; return ND5(`${a} has ${n} cookies to pack, ${g} in each box. After filling as many boxes as he can, how many cookies are left over?`, n%g, 'The leftover is the remainder.', `Divide ${n} ÷ ${g}.\nMultiply the whole number by ${g}.\nTake that away from ${n}: that is what is left.\nNow type it.`, {unit:'cookies'}); }
 if(k===3){ const p=RI(3,6), e=RI(8,12), gv=RI(5,p*e-5); return ND5(`${a} buys ${p} packs of ${e} pencils. He gives ${gv} pencils to ${b}. How many pencils does ${a} have left?`, p*e-gv, 'Two steps: first find all the pencils, then take away the ones he gave.', `Step 1: ${p} packs × ${e} pencils.\nStep 2: take away the ${gv} he gave.\nNow type it.`, {unit:'pencils'}); }
 const g=RI(6,12); let n=RI(40,140); if(n%g===0) n++; return ND5(`Each shelf in the beis medrash holds ${g} seforim. There are ${n} seforim. How many shelves can be filled completely?`, Math.floor(n/g), 'Only completely filled shelves count.', `Divide ${n} ÷ ${g}.\nKeep only the whole number part.\nThe leftover seforim do not fill a shelf.\nNow type it.`, {unit:'shelves'}); }},

'MATH.FRAC.L05.03':{name:'Mixed Up',
how:['A mixed number like 2 3/4 has wholes and a part. An improper fraction like 11/4 has a top bigger than the bottom. They can name the very same amount, and switching between them is a handy trick.','2 3/4: each whole is 4 fourths, so 2 wholes = 8 fourths. Add the 3: 11/4. Going back: 11/4 → 11 ÷ 4 = 2 R3, so 2 3/4. To add 1 2/5 + 2 1/5: add wholes (3), add fifths (3/5): 3 3/5.','Picture pizzas cut in 4. Two whole pizzas plus 3 slices: count every slice, 4 + 4 + 3 = 11 slices, so 11/4.'],
re:['A different way: count by the bottom number. For 3 2/5, count fifths: 5, 10, 15 for three wholes, then 2 more: 17/5.','A simpler step: 1 1/2. One whole is 2 halves; add 1 half: 3/2.','The skill underneath (Same-Bottom Sums): 3/5 + 1/5 = 4/5. Add the tops, keep the bottom the same.'],
gen(){ const k=RI(0,3); const d=PICK([2,3,4,5,6,8]); const w=RI(1,5); const n=RI(1,d-1); if(k<2&&g5(n,d)!==1) return this.gen();
 if(k===0){ const imp=w*d+n; const o=[`${imp}/${d}`, `${w+n}/${d}`, `${w*n}/${d}`, `${imp}/${d*w}`]; if(new Set(o).size<4) return this.gen(); return MD5(`Write ${w} ${n}/${d} as an improper fraction.`, o, `Each whole is ${d}/${d}. ${w} wholes are ${w} × ${d} pieces. Add the ${n}.`, `Each whole is ${d} pieces of size 1/${d}.\nMultiply ${w} × ${d} for the wholes.\nAdd the ${n} extra pieces; keep ${d} on the bottom.\nNow tap it.`); }
 if(k===1){ const imp=w*d+n; const o=[`${w} ${n}/${d}`, `${w+1} ${n}/${d}`, `${n} ${w}/${d}`, `${w} ${d}/${imp}`]; if(new Set(o).size<4) return this.gen(); return MD5(`Write ${imp}/${d} as a mixed number.`, o, `How many whole ${d}s fit in ${imp}? The leftover is the fraction part.`, `Divide ${imp} ÷ ${d}.\nThe whole number answer is the wholes.\nThe remainder goes over ${d}.\nNow tap it.`); }
 if(k===2){ const w2=RI(1,4), n2=RI(1,d-1); if(n+n2>=d) return this.gen(); return ND5(`${w} ${n}/${d} + ${w2} ${n2}/${d} = ? ${FT5}`, w+w2+(n+n2)/d, 'Add the wholes. Add the tops of the fractions. Keep the bottom number.', `Add the wholes: ${w} + ${w2}.\nAdd the tops: ${n} + ${n2}; keep ${d} on the bottom.\nPut them together. Now type it.`); }
 const w2=RI(w+1,w+5), n2=RI(n,d-1); return ND5(`${w2} ${n2}/${d} − ${w} ${n}/${d} = ? ${FT5}`, (w2-w)+(n2-n)/d, 'Subtract the wholes. Subtract the tops. Keep the bottom number.', `Subtract the wholes: ${w2} − ${w}.\nSubtract the tops: ${n2} − ${n}; keep ${d} on the bottom.\nPut them together. Now type it.`); }},

'MATH.FRAC.L05.04':{name:'Tenths to Hundredths',
how:['A dime is one tenth of a dollar, and a penny is one hundredth. Tenths and hundredths are fractions with a secret: they can also be written as decimals, like money.','3/10 is the same as 30/100, because 3 dimes = 30 pennies. So 3/10 + 25/100 = 30/100 + 25/100 = 55/100. As a decimal, 55/100 = 0.55.','Picture a hundred grid. A tenth is one whole column of 10 squares. Three columns = 30 squares out of 100.'],
re:['A different way: think money. 4/10 of a dollar is 4 dimes, 40 cents. 40/100. And 0.4 = 0.40.','A simpler step: 1/10 = 10/100. Multiply the top and the bottom by 10.','The skill underneath (Fraction Twins): 2/5 = 4/10. Multiplying the top and bottom by the same number makes an equal fraction.'],
gen(){ const k=RI(0,4); const t=RI(1,9), h=RI(1,99);
 if(k===0) return ND5(`${t}/10 = ?/100. What number goes in the box?`, t*10, 'Tenths to hundredths: multiply the top and the bottom by 10.', `10 × 10 makes 100 on the bottom.\nDo the same to the top: ${t} × 10.\nNow type it.`);
 if(k===1){ if(t*10+h>=100) return this.gen(); return ND5(`${t}/10 + ${h}/100 = ? Type a fraction like 63/100.`, (t*10+h)/100, 'Change the tenths to hundredths first, then add the tops.', `Change ${t}/10 into hundredths: ${t} × 10 over 100.\nAdd it to ${h}/100: add the tops.\nKeep 100 on the bottom. Now type it.`); }
 if(k===2) return ND5(`Write ${h}/100 as a decimal.`, h/100, 'Hundredths fill two places after the decimal point.', `Hundredths take two places after the point.\nWrite 0, a point, then ${h<10?'0 and '+h:h}.\nNow type it.`);
 if(k===3) return ND5(`0.${t} = ?/100. What number goes in the box?`, t*10, '0.' + t + ' is ' + t + ' tenths. Each tenth is 10 hundredths.', `0.${t} means ${t} tenths.\nEach tenth is 10 hundredths: multiply ${t} × 10.\nNow type it.`);
 let a=RI(1,9)/10, b=RI(1,99)/100; if(Math.abs(a-b)<1e-9) return this.gen(); const A=String(a), B=String(b); const big=a>b?A:B, sm=a>b?B:A; return MD5(`Which decimal is greater: ${A} or ${B}?`, [big, sm], 'Write both with two places (add a 0 to tenths), then compare.', `Give both numbers two places after the point.\nCompare them like whole numbers of hundredths.\nNow tap the greater one.`); }},

'MATH.MEAS.L05.01':{name:'Convert Units',
how:['A yard stick is 3 feet long, and a foot is 12 inches. Converting means changing to a smaller (or bigger) unit without changing how much there really is.','5 feet = ? inches. Each foot is 12 inches, so 5 × 12 = 60 inches. Big unit to small unit: multiply. 3 hours 20 minutes = 3 × 60 + 20 = 200 minutes.','Make a table: 1 foot → 12 inches, 2 feet → 24, 3 feet → 36… Each row adds 12.'],
re:['A different way: think of a ruler. Lay 4 rulers (4 feet) end to end and count the inches: 12 + 12 + 12 + 12 = 48.','A simpler step: 2 kilograms = ? grams. 1 kilogram is 1,000 grams, so 2 kilograms = 2,000 grams.','The skill underneath (Multiply Mountain): 7 × 60 = 420. Converting is just multiplying by the size of the unit.'],
gen(){ const U=[['feet','inches',12],['yards','feet',3],['hours','minutes',60],['minutes','seconds',60],['kilograms','grams',1000],['kilometers','meters',1000],['liters','milliliters',1000],['pounds','ounces',16],['meters','centimeters',100],['yards','inches',36]];
 const [B,S,f]=PICK(U); const k=RI(0,2); const n=RI(2,f>=1000?9:12);
 if(k===0) return ND5(`${n} ${B} = ? ${S}`, n*f, `Each one of the ${B} is ${fx5(f)} ${S}. Multiply.`, `Each one is ${fx5(f)} ${S}.\nMultiply ${n} × ${fx5(f)}.\nNow type it.`, {unit:S});
 if(k===1){ const r=RI(2,f>=1000?999:f-1); return ND5(`${n} ${B} ${r} ${S} = ? ${S}`, n*f+r, `Change the ${B} to ${S} first, then add the extra ${r}.`, `Change ${n} ${B} to ${S}: ${n} × ${fx5(f)}.\nAdd the extra ${r} ${S}.\nNow type it.`, {unit:S}); }
 const [a]=two5(); const h=RI(1,3), m=PICK([10,15,20,25,30,40,45,50]); return ND5(`${a}'s shiur lasted ${h} ${h===1?'hour':'hours'} and ${m} minutes. How many minutes is that?`, h*60+m, `Each hour is 60 minutes. Change the hours to minutes, then add ${m}.`, `Change ${h} ${h===1?'hour':'hours'} to minutes: ${h} × 60.\nAdd the extra ${m} minutes.\nNow type it.`, {unit:'minutes'}); }},

};
Object.assign(L5,{
'MATH.MEAS.L05.02':{name:'Area and Perimeter Formulas',
how:['Building a fence? You need the perimeter, the distance around. Buying carpet? You need the area, the space inside. Two formulas do the work for any rectangle.','A rectangle 8 feet long and 5 feet wide. Perimeter = 8 + 5 + 8 + 5 = 26 feet (or 2 × 8 + 2 × 5). Area = length × width = 8 × 5 = 40 square feet. If the area is 40 and the length is 8, the width is 40 ÷ 8 = 5.','Perimeter walks around the edge: add all four sides. Area fills the inside with squares: rows times columns.'],
re:['A different way: draw it on graph paper. Count the squares inside for area; count the edges around for perimeter.','A simpler step: a 3 by 2 rectangle. Area: 3 × 2 = 6 squares. Perimeter: 3 + 2 + 3 + 2 = 10.','The skill underneath (Perimeter): the perimeter is the total length of all the sides. Add every side once.'],
gen(){ const k=RI(0,4); const l=RI(4,25), w=RI(2,l-1); const u=PICK(['feet','meters','inches','yards']);
 if(k===0) return ND5(`A rectangle is ${l} ${u} long and ${w} ${u} wide. What is its area?`, l*w, 'Area = length × width.', `Area means the squares inside.\nMultiply length × width: ${l} × ${w}.\nNow type it.`, {unit:'square '+u});
 if(k===1) return ND5(`A rectangle is ${l} ${u} long and ${w} ${u} wide. What is its perimeter?`, 2*l+2*w, 'Perimeter = add all four sides.', `Perimeter means the distance around.\nAdd all four sides: ${l} + ${w} + ${l} + ${w}.\nNow type it.`, {unit:u});
 if(k===2) return ND5(`A rectangle has an area of ${l*w} square ${u}. Its length is ${l} ${u}. What is its width?`, w, 'Area = length × width, so width = area ÷ length.', `Area = length × width.\nSo divide the area by the length: ${l*w} ÷ ${l}.\nNow type it.`, {unit:u});
 if(k===3) return ND5(`A rectangular garden has a perimeter of ${2*l+2*w} ${u}. Its length is ${l} ${u}. What is its width?`, w, 'Two lengths and two widths make the perimeter.', `Take away the two lengths: ${2*l+2*w} − ${2*l}.\nWhat is left is two widths.\nDivide by 2. Now type it.`, {unit:u});
 const s=RI(3,15); return ND5(`A square room is ${s} ${u} on each side. What is its area?`, s*s, 'A square is a rectangle with all sides equal: side × side.', `All four sides are ${s}.\nArea = side × side: ${s} × ${s}.\nNow type it.`, {unit:'square '+u}); }},

'MATH.GEO.L05.01':{name:'Angles and Protractors',
how:['Angles measure turns. A full turn is 360 degrees (360°). A square corner is 90°, and a straight line is 180°. A protractor is the ruler for angles.','A right angle (90°) is split into two angles. One is 35°. The other is 90° − 35° = 55°. On a protractor, if one side lines up with 20° and the other with 85°, the angle is 85° − 20° = 65°.','Angles smaller than a square corner are acute; exactly a square corner is right (90°); bigger than a square corner but less than a straight line is obtuse.'],
re:['A different way: think of a clock. From 12 to 3 is a quarter turn: 90°. From 12 to 6 is a half turn: 180°.','A simpler step: two angles make a straight line (180°). One is 100°. The other is 180° − 100° = 80°.','The skill underneath (Four-Sided Shapes): a rectangle has four right angles, four square corners of 90°.'],
gen(){ const k=RI(0,4);
 if(k===0){ const a=RI(10,80); return ND5(`Two angles together make a right angle (90°). One of them is ${a}°. How many degrees is the other angle?`, 90-a, 'The two parts add up to 90°. Subtract.', `The two angles add up to 90°.\nSubtract the one you know: 90 − ${a}.\nNow type the degrees.`, {unit:'degrees'}); }
 if(k===1){ const a=RI(20,160); return ND5(`Two angles sit side by side on a straight line (180°). One is ${a}°. How many degrees is the other?`, 180-a, 'Angles on a straight line add up to 180°.', `A straight line is 180°.\nSubtract the angle you know: 180 − ${a}.\nNow type the degrees.`, {unit:'degrees'}); }
 if(k===2){ const [nm,f]=PICK([['one quarter',4],['one half',2],['one third',3],['one sixth',6],['one twelfth',12],['three quarters',4/3]]); return ND5(`A wheel turns ${nm} of a full turn. How many degrees did it turn?`, 360/f, 'A full turn is 360°. Find that part of 360.', `A full turn is 360°.\nFind ${nm} of 360 (divide${nm.startsWith('three')?' by 4, then times 3':''}).\nNow type the degrees.`, {unit:'degrees'}); }
 if(k===3){ const a=PICK([RI(10,85),90,RI(95,175),180]); const kind=a<90?'acute':a===90?'right':a<180?'obtuse':'straight'; const o=[kind,...['acute','right','obtuse','straight'].filter(x=>x!==kind)]; return MD5(`What kind of angle is ${a}°?`, o, 'Less than 90° is acute, 90° is right, between 90° and 180° is obtuse, 180° is straight.', `Compare ${a}° with 90° and 180°.\nLess than 90: acute. Exactly 90: right.\nBetween 90 and 180: obtuse. 180: straight. Now tap it.`); }
 const s=RI(0,12)*10, e=s+RI(2,14)*5; if(e>180) return this.gen(); return ND5(`On a protractor, one side of an angle lines up with ${s}° and the other side lines up with ${e}°. How big is the angle?`, e-s, 'Find the distance between the two marks: subtract.', `The angle is the space between the two marks.\nSubtract: ${e} − ${s}.\nNow type the degrees.`, {unit:'degrees'}); }},

'MATH.GEO.L05.02':{name:'Lines and Symmetry',
how:['Look at railroad tracks: two lines that never meet. Look at the corner of a page: two lines meeting in a square corner. And fold a butterfly picture down the middle: both halves match. Lines and symmetry are everywhere.','Parallel lines never meet and stay the same distance apart. Perpendicular lines meet to make a right angle (90°). A line of symmetry folds a shape into two matching halves. A square has 4 lines of symmetry; a rectangle that is not a square has 2.','Try it with paper: fold a square in half 4 different ways (up, across and both corners) and each time the halves match.'],
re:['A different way: imagine a mirror on the line. If the reflection looks exactly like the other half, it is a line of symmetry.','A simpler step: the letter A. Fold it straight down the middle and the two sides match. So A has 1 line of symmetry.','The skill underneath (Angles and Protractors): perpendicular lines make a 90° angle, a square corner.'],
gen(){ const k=RI(0,3);
 if(k===0){ const [nm,n]=PICK([['a square',4],['a rectangle that is not a square',2],['an equilateral triangle (all sides equal)',3],['a regular hexagon (6 equal sides)',6],['an isosceles triangle with exactly 2 equal sides',1],['a triangle with no equal sides',0],['a regular pentagon (5 equal sides)',5]]); return ND5(`How many lines of symmetry does ${nm} have?`, n, 'Count each way you could fold it so the two halves match exactly.', `Imagine folding the shape so the halves match.\nTry straight up, across, and corner to corner.\nCount every fold that works. Now type it.`); }
 if(k===1){ const [def,ans]=PICK([['never meet and always stay the same distance apart','parallel'],['meet to make a square corner (a right angle)','perpendicular'],['cross each other but not at a square corner','intersecting, but not perpendicular']]); const o=[ans,...['parallel','perpendicular','intersecting, but not perpendicular'].filter(x=>x!==ans)]; return MD5(`Two lines ${def}. What are they called?`, o, 'Parallel: never meet. Perpendicular: meet at 90°.', `Ask: do the lines ever meet?\nIf they meet, is it a square corner?\nNow tap the right name.`); }
 if(k===2){ const r=[90,RI(20,70)]; r.push(180-r[0]-r[1]); const others=[]; while(others.length<2){ const a=RI(40,80), b=RI(40,80), c=180-a-b; const key=[a,b,c].sort((x,y)=>x-y).join(); if(c>0&&c!==90&&a!==90&&b!==90&&!others.some(o=>o.slice().sort((x,y)=>x-y).join()===key)) others.push([a,b,c]); } const f=t=>sh5(t).map(x=>x+'°').join(', '); return MD5(`Which triangle is a RIGHT triangle?`, [f(r),f(others[0]),f(others[1])].map((s,i)=>['Angles ','Angles ','Angles '][i]+s), 'A right triangle has one angle of exactly 90°.', `A right triangle has one square corner.\nLook for an angle of exactly 90°.\nNow tap that triangle.`); }
 const Y=['A','H','M','O','T','U','V','W','X','Y'], NO=['F','G','J','L','N','P','Q','R','S','Z']; const y=PICK(Y); const n=sh5(NO).slice(0,3); return MD5(`Which capital letter has a line of symmetry?`, [y,...n], 'Picture folding each letter. Do the two halves match?', `Picture a fold straight down or across each letter.\nCheck whether the two halves match.\nNow tap the letter that folds evenly.`); }},

'MATH.STAT.L05.01':{name:'Line Plots with Fractions',
how:['Scientists measure things and mark each result on a number line with an X. That is a line plot, and it shows at a glance which results happen most and how spread out they are.','Line plot of bean sprout heights (inches): 1/8: XX, 2/8: XXXX, 3/8: X. Most sprouts are 2/8 inch (4 X\'s). The tallest minus the shortest is 3/8 − 1/8 = 2/8 inch. All the 2/8-inch sprouts together: 4 × 2/8 = 8/8 = 1 inch.','Each X is one thing that was measured. Count the X\'s above a number to know how many had that measurement.'],
re:['A different way: turn the plot into a list. 1/4, 1/4, 2/4, 2/4, 2/4, 2/4, 3/4. Now answer from the list.','A simpler step: how many X\'s are above 3/4? Just count them.','The skill underneath (Same-Bottom Sums): 3/4 − 1/4 = 2/4. Same bottom: subtract the tops.'],
gen(){ const d=8; const vals=[]; const st=RI(1,4); for(let i=0;i<4;i++) vals.push(st+i); const cnt=vals.map(()=>RI(1,5)); const subj=PICK([['bean sprout heights','inches'],['rainfall each day','inches'],['lengths of ribbon scraps','inches'],['lengths of crayon pieces','inches']]);
 const plot=`Line plot of ${subj[0]} (${subj[1]}): `+vals.map((v,i)=>`${v}/${d}: ${'X'.repeat(cnt[i])}`).join(', ')+'.';
 const k=RI(0,3); const i=RI(0,3);
 if(k===0) return ND5(`${plot} How many measurements were ${vals[i]}/${d} ${subj[1]}?`, cnt[i], 'Each X is one measurement. Count the X\'s above that number.', `Find ${vals[i]}/${d} on the plot.\nCount the X's next to it.\nNow type the count.`);
 if(k===1){ const lo=vals.find((v,j)=>cnt[j]>0), hi=vals[3]; return ND5(`${plot} What is the difference between the largest and the smallest measurement? ${FT5}`, (hi-lo)/d, 'Biggest minus smallest. Same bottom: subtract the tops.', `Find the largest: ${hi}/${d}. Find the smallest: ${lo}/${d}.\nSubtract the tops: ${hi} − ${lo}; keep ${d} on the bottom.\nNow type it.`); }
 if(k===2) return ND5(`${plot} What is the total of all the ${vals[i]}/${d}-${subj[1].replace(/es$/,'')} measurements together? ${FT5}`, cnt[i]*vals[i]/d, 'Count the X\'s, then add that many copies of the fraction.', `Count the X's at ${vals[i]}/${d}: there are ${cnt[i]}.\nAdd ${vals[i]}/${d} that many times (multiply the top by ${cnt[i]}).\nNow type it.`);
 const mx=Math.max(...cnt); if(cnt.filter(c=>c===mx).length>1) return this.gen(); const j=cnt.indexOf(mx); return MD5(`${plot} Which measurement happened MOST often?`, [vals[j]+'/'+d,...vals.filter((v,x)=>x!==j).map(v=>v+'/'+d)], 'Look for the tallest stack of X\'s.', `Count the X's at each number.\nFind the number with the most X's.\nNow tap it.`); }},

'MATH.ALG.L05.01':{name:'Pattern from a Rule',
how:['A rule is like a recipe for numbers: "start at 3, add 4." Follow it and you get 3, 7, 11, 15… Even better, patterns hide secrets the rule never told you.','Rule: start at 3, add 4. The numbers are 3, 7, 11, 15, 19, 23. The 6th number is 23. The hidden secret: they are all odd, because odd + even (4) stays odd every time.','Make a table: position 1 → 3, position 2 → 7, position 3 → 11… Keep adding 4 until you reach the position you need.'],
re:['A different way: count the jumps. To get from the 1st number to the 6th, you make 5 jumps of 4: 5 × 4 = 20, and 3 + 20 = 23.','A simpler step: start at 2, add 2: 2, 4, 6, 8. The 4th number is 8.','The skill underneath (Number Patterns): 5, 10, 15, 20 goes up by 5 each time. Find what is added each step.'],
gen(){ const k=RI(0,4); const s=RI(1,15), a=RI(2,9), n=RI(5,8); const ord=['','1st','2nd','3rd','4th','5th','6th','7th','8th'];
 if(k===0) return ND5(`Rule: start at ${s}, add ${a} each time. What is the ${ord[n]} number?`, s+(n-1)*a, `Write the numbers: ${s}, ${s+a}, ${s+2*a}… Keep going until the ${ord[n]} one.`, `Write ${s}. Add ${a} to get the next number.\nKeep adding ${a}, counting each number.\nStop at the ${ord[n]} number. Now type it.`);
 if(k===1){ const m=PICK([2,3]), st=RI(1,4), nn=RI(4,6); return ND5(`Rule: start at ${st}, multiply by ${m} each time. What is the ${ord[nn]} number?`, st*m**(nn-1), 'Multiply by the same number each step.', `Write ${st}. Multiply by ${m} to get the next number.\nKeep multiplying, counting each number.\nStop at the ${ord[nn]} number. Now type it.`); }
 if(k===2){ const want=(s%2===1&&a%2===0)?'They are all odd.':(s%2===0&&a%2===0)?'They are all even.':'They switch between odd and even.'; const o=[want,...['They are all odd.','They are all even.','They switch between odd and even.'].filter(x=>x!==want)]; return MD5(`Rule: start at ${s}, add ${a} each time. Which is true about the numbers in the pattern?`, o, 'Write the first five numbers and look at whether each is odd or even.', `Write the first five: ${s}, ${s+a}, ${s+2*a}, ${s+3*a}, ${s+4*a}.\nMark each one odd or even.\nNow tap what you notice.`); }
 if(k===3){ const seq=[0,1,2,3].map(i=>s+i*a); const o=[`Add ${a}`, `Add ${a+1}`, `Multiply by ${a}`, `Add ${s}`]; if(new Set(o).size<4) return this.gen(); return MD5(`Pattern: ${seq.join(', ')}, … What is the rule?`, o, 'Find what is added from one number to the next.', `Subtract: ${seq[1]} − ${seq[0]}.\nCheck the next pair: ${seq[2]} − ${seq[1]}.\nThe same jump each time is the rule. Tap it.`); }
 const st=RI(40,100), b=RI(2,8), nn=RI(4,7); if(st-(nn-1)*b<0) return this.gen(); return ND5(`Rule: start at ${st}, subtract ${b} each time. What is the ${ord[nn]} number?`, st-(nn-1)*b, 'Take away the same amount each step.', `Write ${st}. Subtract ${b} to get the next number.\nKeep subtracting, counting each number.\nStop at the ${ord[nn]} number. Now type it.`); }}
});
Object.assign(GEN, L5);
window.TLM5=Object.keys(L5).length;
}
/* ===== Math Level 6 (22 skills, Blueprint IDs MATH.*.L06.*) — curriculum@ chat, 2026-11-09. From HQ drafts v2 + v3.
   PASTE: inside the MathMore IIFE, on the line right AFTER "Object.assign(GEN, L4);" and BEFORE "window.TLM=...".
   Uses only page helpers RI, PICK, N, MX, TLB. All local names live inside this { } block. ===== */
{
const g6=(a,b)=>{ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a||1; };
const fr=(n,d)=>{ const k=g6(n,d); n/=k; d/=k; if(d===1) return String(n); if(n>d){ const w=Math.floor(n/d), r=n%d; return w+' '+r+'/'+d; } return n+'/'+d; };
const fx=v=>{ const s=String(Number(Number(v).toFixed(6))); const p=s.split('.'); p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,','); return p.join('.'); };
const m2=c=>'$'+(c/100).toFixed(2);
const n6=()=>PICK(TLB);
const tf=(r,h)=>MX(r[0], [r[1]?'True':'False', r[1]?'False':'True'], h);
const FT='Type a fraction like 3/4, or a mixed number like 1 1/4.';
const L6={
'MATH.PV.L06.01':{name:'Power of Ten',
how:['Every place in a number is worth 10 times the place to its right. That lets you multiply and divide by 10, 100 and 1,000 in your head.','3.5 × 10 = 35: every digit moves one place LEFT. 3.5 × 100 = 350: two places left, and a zero fills the empty place. 450 ÷ 10 = 45: dividing moves digits RIGHT.','Picture a place-value chart: Tens | Ones . Tenths. 3.5 has 3 in Ones and 5 in Tenths. × 10 slides each digit one column left: 3 in Tens, 5 in Ones. That reads 35.'],
gen(){ const p=PICK([10,100,1000]), z=String(p).length-1, k=RI(0,2);
 if(k===2){ const each=RI(5,95)/100; return N(`A box holds ${fx(p)} pencils. Each pencil costs $${each.toFixed(2)}. What does the whole box cost, in dollars?`, Number((each*p).toFixed(4)), `Multiply the price of one by ${fx(p)}: move every digit ${z} place${z>1?'s':''} to the left.`, {unit:'$'}); }
 const b=RI(11,999)/Math.pow(10,RI(1,2));
 if(k===0) return N(`${fx(b)} × ${fx(p)} = ?`, Number((b*p).toFixed(4)), `Multiplying by ${fx(p)} moves every digit ${z} place${z>1?'s':''} to the LEFT. Where does each digit land?`);
 const n=RI(2,9999); return N(`${fx(n)} ÷ ${fx(p)} = ?`, Number((n/p).toFixed(6)), `Dividing by ${fx(p)} moves every digit ${z} place${z>1?'s':''} to the RIGHT. Count the places for each digit.`); }},
'MATH.PV.L06.02':{name:'Decimal Duel',
how:['Which is bigger, 0.8 or 0.75? Many people say 0.75 because it has more digits. That is a trap, and you will learn a quick way to always be right.','Line up the points and add zeros so both have the same number of places. 0.8 becomes 0.80. Now compare 80 and 75 like whole numbers: 0.8 is bigger.','Think money: 0.8 is 80 cents and 0.75 is 75 cents. 80 cents is more.'],
gen(){ const k=RI(0,2);
 if(k<2){ const w=k? RI(1,12):0, d=RI(3,9), s=(d-1)*10+RI(1,9); const big=(w+d/10).toFixed(1), small=(w+s/100).toFixed(2);
  return MX(`Which is bigger: ${PICK([0,1])?big+' or '+small:small+' or '+big}?`, [big, small, 'They are equal'], k?'Compare the whole-number part first. If it is the same, add zeros so both have the same number of places.':'Give both numbers the same number of places by adding zeros at the end. Then compare them like whole numbers.'); }
 const t=RI(2,8); const a=(t/10).toFixed(1), b=((t*10-RI(1,9))/100).toFixed(2), c=((t*100+RI(1,9))/1000).toFixed(3);
 const ok=[b,a,c].join(', '), w1=[a,b,c].join(', '), w2=[c,a,b].join(', ');
 return MX(`Put in order from least to greatest: ${[a,b,c].sort(()=>Math.random()-.5).join(', ')}`, [ok,w1,w2], 'Write all three with the same number of places (add zeros). Then order them like whole numbers.'); }},
'MATH.PV.L06.03':{name:'Decimal Rounding',
how:['Prices, distances and scores are often rounded so they are easy to use. One rule rounds any decimal correctly.','Round 4.768 to the nearest tenth: the tenths digit is 7; look at the digit just to its right, 6. 5 or more rounds up, so 4.8. To the nearest hundredth: look at 8, round up, 4.77. To the nearest whole number: look at 7, so 5.','Number line: 4.768 sits between 4.7 and 4.8. Halfway is 4.75. 4.768 is past halfway, so it is closer to 4.8.'],
gen(){ const k=RI(0,3);
 if(k===3){ const p=RI(2001,4999); if(p%10===0) return this.gen(); return N(`Gas costs $${(p/1000).toFixed(3)} a gallon. Round it to the nearest cent (two places after the point).`, Math.round(p/10)/100, 'Find the hundredths digit, the second digit after the point. Look only at the ONE digit right after it.', {unit:'$'}); }
 const n=RI(1001,99999); if(n%10===0) return this.gen(); const v=n/1000;
 const r=k===0?Math.round(n/1000):k===1?Math.round(n/100)/10:Math.round(n/10)/100;
 const place=['whole number','tenth','hundredth'][k];
 const hint=k===0?'Rounding to a whole number: look only at the tenths digit, the first digit after the point. Ignore the rest.':k===1?'The tenths digit is the first digit after the point. Look only at the ONE digit to its right: 5 or more rounds up, 4 or less stays.':'The hundredths digit is the SECOND digit after the point. Look only at the digit right after it.';
 return N(`Round ${v.toFixed(3)} to the nearest ${place}.`, r, hint); }},
'MATH.FRAC.L06.02':{name:'Decimal Dollars',
how:['Dollars and cents are decimals. If you can read $3.25 as a decimal and as a fraction, you understand money and every decimal.','$3.25 is 3 dollars and 25 hundredths of a dollar: 3 and 25/100. The first digit after the point is tenths, the second is hundredths. 7/100 is 0.07, with a zero holding the tenths place.','A dollar is 100 pennies, so one penny is 1/100 of a dollar. 47 pennies is 47/100 of a dollar, written 0.47.'],
gen(){ const k=RI(0,3);
 if(k===0){ const t=RI(1,99); return N(`Write ${t}/100 as a decimal.`, t/100, t<10?'Hundredths take TWO places after the point. The top number has one digit, so put a zero in the tenths place first.':'Hundredths take TWO places after the point. The two digits of the top number fill them.'); }
 if(k===1){ const t=RI(1,9); return N(`0.${t} is how many hundredths? (Type the top number of ?/100.)`, t*10, 'Add a zero at the end so there are two places after the point. Read those two digits as hundredths.'); }
 if(k===2){ const d=RI(1,20), c=RI(1,99); return N(`$${d}.${String(c).padStart(2,'0')} is ${d} dollars and how many hundredths of a dollar?`, c, 'The two digits after the point tell how many hundredths.'); }
 const b=RI(1,9), di=RI(0,9), p=RI(0,9); return N(`You have ${b} dollar bill${b>1?'s':''}, ${di} dime${di!==1?'s':''} and ${p} penn${p!==1?'ies':'y'}. Write the total in dollars.`, (b*100+di*10+p)/100, 'Dollars go before the point. Dimes are tenths (first place after the point). Pennies are hundredths (second place).', {unit:'$'}); }},
'MATH.OPS.L06.03':{name:'Point to Point',
how:['Adding decimals works exactly like adding money, with one rule: line up the decimal points. This is how you check a bill or a measurement.','4.7 + 2.35: write 4.70 above 2.35 with the points lined up. Hundredths 0+5=5. Tenths 7+3=10, write 0 carry 1. Ones 4+2+1=7. Answer 7.05.','Change to cents: 4.70 is 470 cents and 2.35 is 235 cents. 470 + 235 = 705 cents = 7.05.'],
gen(){ const k=RI(0,3);
 if(k===3){ const a=RI(150,999), b=RI(100,800), pay=PICK([2000,5000]); if(a+b>=pay) return this.gen(); return N(`${n6()} buys a sefer for ${m2(a)} and a pen for ${m2(b)}. He pays with a ${m2(pay).replace('.00','')} bill. How much change, in dollars?`, (pay-a-b)/100, 'Add the two prices first (line up the points). Then subtract that total from the bill.', {unit:'$'}); }
 const a=RI(11,999), b=RI(11,999), da=PICK([10,100]), db=da===10?100:PICK([10,100]);
 const A=a*(100/da), B=b*(100/db);
 if(k===0) return N(`${fx(a/da)} + ${fx(b/db)} = ?`, (A+B)/100, 'Line up the decimal points. Fill any empty place with a zero before you add.');
 if(k===1){ const w=RI(Math.ceil(B/100)+1, Math.ceil(B/100)+9); return N(`${w} − ${fx(b/db)} = ?`, (w*100-B)/100, 'A whole number has a hidden point at its end. Write it with zeros after the point, then subtract.'); }
 if(A<=B) return this.gen(); return N(`${fx(a/da)} − ${fx(b/db)} = ?`, (A-B)/100, 'Line up the points and fill zeros. When the top digit is smaller, regroup from the next place.'); }},
'MATH.OPS.L06.04':{name:'Decimal Times and Shares',
how:['Buying 4 items at $0.60 each, or splitting 7.2 liters into 4 jars: multiplying and dividing decimals is something you do every time you shop or measure.','2.5 × 0.3: ignore the points, 25 × 3 = 75. Count decimal places in both numbers: 1 + 1 = 2. Give the answer 2 places: 0.75. 7.2 ÷ 4: 72 tenths shared by 4 is 18 tenths = 1.8.','Money: 4 items at $0.60 is 4 × 60 cents = 240 cents = $2.40. So 4 × 0.6 = 2.4.'],
gen(){ const k=RI(0,3);
 if(k===0){ const w=RI(2,9), t=RI(1,9); return N(`${t/10} × ${w} = ?`, w*t/10, 'Multiply as if there were no decimal point. Then count the decimal places in the problem and give the answer that many places.'); }
 if(k===1){ const a=RI(11,49), b=RI(2,9); return N(`${fx(a/10)} × ${fx(b/10)} = ?`, Number((a*b/100).toFixed(4)), 'Count the decimal places in BOTH numbers and add them. Check: multiplying by a number less than 1 makes the answer smaller.'); }
 if(k===2){ const q=RI(11,49), d=RI(2,9); return N(`${fx(q*d/10)} ÷ ${d} = ?`, q/10, 'Divide as if there were no point. Then put the point in the answer straight above the point in the number you divided.'); }
 const kg=RI(11,39)/10, c=RI(2,6); return N(`Each bag of apples weighs ${fx(kg)} kg. How much do ${c} bags weigh?`, Number((kg*c).toFixed(4)), 'Equal bags means multiply. Multiply without the point, then put back one decimal place.', {unit:'kg'}); }},
'MATH.OPS.L06.05':{name:'Order Up',
how:['When a problem has more than one operation, everyone must do them in the same order or people get different answers. This is the rule the whole world agrees on.','3 + 4 × 5: multiply first, 4 × 5 = 20, then 3 + 20 = 23. With parentheses, (3 + 4) × 5: parentheses first, 7 × 5 = 35. Order: parentheses, then × and ÷ left to right, then + and − left to right.','3 + 4 × 5 means 3 plus four groups of 5. The groups are a bundle that has to be counted first: 20, plus 3 is 23.'],
gen(){ const k=RI(0,4), a=RI(2,20), b=RI(2,9), c=RI(2,9);
 if(k===0) return N(`${a} + ${b} × ${c} = ?`, a+b*c, 'Multiplication comes before addition. Find the multiplication and do it first.');
 if(k===1) return N(`(${a} + ${b}) × ${c} = ?`, (a+b)*c, 'Parentheses come first. Work inside them before anything else.');
 if(k===2){ const big=b*c+RI(1,20); return N(`${big} − ${b*c} ÷ ${c} = ?`, big-b, 'Division comes before subtraction. Do the division first.'); }
 if(k===3){ const d=RI(2,6); return N(`${b*d} ÷ ${d} + ${a} × ${c} = ?`, b+a*c, 'Do the division and the multiplication first, left to right. Add last.'); }
 const n=RI(2,6), p=RI(2,9), pen=RI(1,9); return N(`${n6()} buys ${n} notebooks at $${p} each and one pen for $${pen}. What does he spend?`, n*p+pen, 'Write one number sentence: notebooks × price, then add the pen. Multiply before you add.', {unit:'$'}); }},
'MATH.FRAC.L06.01':{name:'Common Ground',
how:['You cannot add halves and thirds until they are cut into the same-size pieces. Finding common ground lets you add and subtract any fractions, in cooking and building.','1/2 + 1/3: find a number both 2 and 3 go into: 6. 1/2 = 3/6 and 1/3 = 2/6. Add the tops, keep the bottom: 5/6. Subtract 3/4 − 1/6: bottom 12, 9/12 − 2/12 = 7/12.','Picture a pizza. Halves and thirds are different slices. Cut every slice into sixths: a half is 3 slices, a third is 2 slices, together 5 slices of 6.'],
gen(){ const P=[[2,3],[2,5],[3,4],[2,4],[3,6],[4,6],[2,8],[4,8],[3,5],[5,10],[4,12],[2,6],[6,8],[3,9]]; const [d1,d2]=PICK(P), n1=RI(1,d1-1), n2=RI(1,d2-1); const v1=n1/d1, v2=n2/d2;
 if(Math.abs(v1-v2)<1e-9) return this.gen();
 const add=v1+v2<=1.5? PICK([true,false]) : false; const big=v1>v2, a=big?[n1,d1]:[n2,d2], b=big?[n2,d2]:[n1,d1];
 if(add) return N(`${n1}/${d1} + ${n2}/${d2} = ? ${FT}`, v1+v2, 'Never add the bottom numbers. Find a number both bottoms go into, rename each fraction, then add the tops.');
 return N(`${a[0]}/${a[1]} − ${b[0]}/${b[1]} = ? ${FT}`, a[0]/a[1]-b[0]/b[1], 'Rename both fractions to a common bottom number, subtract the tops, then simplify if you can.'); }},
'MATH.FRAC.L06.05':{name:'Fraction Times Fraction',
how:['Half of a third of a pan of kugel is how much? Multiplying fractions answers questions like this, faster than any picture.','2/3 × 3/4: multiply tops, 2 × 3 = 6. Multiply bottoms, 3 × 4 = 12. 6/12 simplifies to 1/2. Mixed number: 1 1/2 × 2/3 → change 1 1/2 to 3/2, then 3/2 × 2/3 = 6/6 = 1.','Area model: cut a rectangle into 3 columns and shade 1. Cut it into 2 rows and shade 1 row of that. The double-shaded part is 1 of 6 pieces, so 1/2 × 1/3 = 1/6.'],
gen(){ const k=RI(0,2), a=RI(1,4), b=RI(a+1,6), c=RI(1,4), d=RI(c+1,9);
 if(k<2) return N(`${a}/${b} × ${c}/${d} = ? ${FT}`, a*c/(b*d), k?'After multiplying tops and bottoms, simplify: divide the top and bottom by the same number.':'Multiply the two tops together, then the two bottoms together.');
 const w=RI(1,3), n=RI(1,3), m=RI(n+1,5); return N(`${w} ${n}/${m} × ${c}/${d} = ? ${FT}`, (w+n/m)*c/d, 'Change the mixed number to an improper fraction first (whole × bottom + top), then multiply tops and bottoms.'); }},
'MATH.MEAS.L06.01':{name:'Volume',
how:['How much sand fits in a box, or water in a tank? That is volume. Builders, shippers and engineers rely on one formula.','Volume = length × width × height. A box 4 cm long, 3 cm wide and 2 cm high holds 4 × 3 × 2 = 24 cubic centimeters.','Build it in layers: the bottom layer is 4 × 3 = 12 cubes. The box is 2 layers high, so 12 + 12 = 24 cubes.'],
gen(){ const k=RI(0,2);
 if(k===2){ const l=PICK([30,40,50,60]), w=PICK([20,25,30]), h=PICK([20,30,40]); return N(`A fish tank is ${l} cm long, ${w} cm wide and ${h} cm high. How many cubic cm of water fill it?`, l*w*h, 'Find one layer first (length × width), then multiply by the height.', {unit:'cubic cm'}); }
 const l=RI(2,12), w=RI(2,9), h=RI(2,10); return N(`A box is ${l} long, ${w} wide and ${h} high. What is its volume?`, l*w*h, k?'Find one layer first (length × width), then multiply by the height.':'Volume multiplies all three measurements: length × width × height. Do not add them.', {unit:'cubic units'}); }},
'MATH.MEAS.L06.02':{name:'Metric Conversions',
how:['The metric system is built on tens, so converting is just moving digits, exactly like Power of Ten.','kilo means 1,000. centi means one hundredth. milli means one thousandth. 3.2 km to meters: × 1,000 = 3,200 m. 450 cm to meters: ÷ 100 = 4.5 m.','Ask: am I changing to a smaller unit or a bigger one? Smaller unit means more of them, so multiply. Bigger unit means fewer, so divide.'],
gen(){ const U=[['km','m',1000],['m','cm',100],['L','mL',1000],['kg','g',1000]]; const [big,small,f]=PICK(U);
 if(RI(0,4)===4){ const L=PICK([1,1.5,2,2.5,3]), cup=PICK([250,500]); return N(`A bottle holds ${L} L. How many ${cup} mL cups can you fill from it?`, L*1000/cup, 'Change liters to mL first (× 1,000). Then see how many cups fit.', {unit:'cups'}); }
 if(PICK([0,1])){ const v=RI(2,95)/10; return N(`${fx(v)} ${big} = ? ${small}`, Number((v*f).toFixed(4)), `${small} is the smaller unit, so there will be more of them: multiply. How many ${small} are in 1 ${big}?`, {unit:small}); }
 const v=RI(2,95)*(f/10); return N(`${fx(v)} ${small} = ? ${big}`, v/f, `${big} is the bigger unit, so there will be fewer of them: divide. How many ${small} are in 1 ${big}?`, {unit:big}); }},
'MATH.OPS.L06.01':{name:'Big Multiplier',
how:['Multiplying big numbers by hand is how you price jobs, count supplies and check a calculator. You will do it in steps that never fail.','47 × 36: first 47 × 6 = 282. Then 47 × 30 = 1,410 (47 × 3 = 141, add a zero). Add the rows: 282 + 1,410 = 1,692.','Area model: split 47 into 40 + 7 and 36 into 30 + 6. 40×30 = 1,200, 40×6 = 240, 7×30 = 210, 7×6 = 42. Add all four: 1,692.'],
gen(){ const k=RI(0,2);
 if(k===2){ const b=RI(12,36), e=PICK([12,24,36,48,144]); return N(`The school orders ${b} boxes with ${e} pencils in each box. How many pencils is that?`, b*e, 'Equal boxes means multiply. Multiply by the ones digit, then by the tens digit (start that row with a zero), then add.', {unit:'pencils'}); }
 const a=k?RI(101,499):RI(12,99), b=RI(12,69); return N(`${a} × ${b} = ?`, a*b, k?'Split the second number into tens and ones. Multiply by each part, then add.':'Multiply by the ones digit first. Then by the tens digit, writing a zero first because it is tens. Add the two rows.'); }},
'MATH.OPS.L06.02':{name:'Two-Digit Divisor',
how:['Dividing by a two-digit number is how you share a big count fairly, like packing 1,248 books into boxes of 24.','1,248 ÷ 24: estimate, 25 × 50 = 1,250, so near 50. 24 into 124 goes 5 times (120). Subtract: 4. Bring down 8: 48. 24 into 48 goes 2. Answer 52. Check: 52 × 24 = 1,248.','Build up with multiples: 24 × 50 = 1,200. That leaves 48, which is 24 × 2. So 50 + 2 = 52.'],
gen(){ const d=RI(12,64), q=RI(12,89);
 if(RI(0,3)===3){ const per=PICK([12,24,36,48]), bx=RI(15,60); return N(`${fx(per*bx)} pencils are packed ${per} to a box. How many boxes is that?`, bx, 'Estimate first by rounding the divisor, then multiply your answer back to check.', {unit:'boxes'}); }
 return N(`${fx(d*q)} ÷ ${d} = ?`, q, `Estimate first: round ${d} to ${Math.round(d/10)*10} and think how many times it fits. Multiply your answer by ${d} to check.`); }},
'MATH.FRAC.L06.03':{name:'Groups of Fractions',
how:['Cooks and builders often ask how many small fraction pieces fit into a whole amount, like how many 1/4-cup scoops fill 3 cups.','3 ÷ 1/4: every whole has 4 quarters. 3 wholes have 3 × 4 = 12 quarters. Check: 12 × 1/4 = 3.','Draw 3 bars. Cut each bar into 4 equal parts. Count all the parts: 12.'],
gen(){ const w=RI(2,9), d=RI(2,8);
 if(RI(0,2)===2) return N(`A ribbon ${w} m long is cut into pieces that are each 1/${d} m long. How many pieces?`, w*d, 'How many pieces this size fit in 1 meter? Do the same for every meter.', {unit:'pieces'});
 return N(`${w} ÷ 1/${d} = ? (How many 1/${d}s fit in ${w}?)`, w*d, 'How many pieces this size fit in one whole? Multiply that by the number of wholes.'); }},
'MATH.FRAC.L06.04':{name:'Share the Challah',
how:['Challahs are shared at the table, and the share is often a fraction. You will find exactly how much each boy gets.','3 challahs shared equally by 4 boys: cut every challah into 4 pieces. Each boy takes 1 piece from each challah, so 3 pieces of 1/4 = 3/4. Check: 4 × 3/4 = 3.','One challah shared by 4 boys is 1/4 each. We have 3 challahs, so 3 × 1/4 = 3/4.'],
gen(){ const b=RI(2,8), c=RI(1,b*3); if(c%b===0) return this.gen();
 return N(`${c} challah${c>1?'s are':' is'} shared equally by ${b} boys. How much does each boy get? ${FT}`, c/b, c>b?'Give each boy whole challahs first. Then cut what is left into as many pieces as there are boys.':'Cut each challah into as many pieces as there are boys. How many pieces does one boy get in all?', {unit:'challah'}); }},
'MATH.FRAC.L06.06':{name:'Split It Small',
how:['Sometimes you have only a piece of something and must share that piece. Splitting a piece makes smaller pieces, and you can name them exactly.','1/2 ÷ 3: half a challah shared by 3 boys. Cut the half into 3 parts. Cutting the whole challah that way gives 6 parts, so each part is 1/6. Check: 3 × 1/6 = 1/2.','Draw a bar and cut it in 2. Cut each half into 3 pieces, so the whole bar has 6 pieces. One of them is 1/6.'],
gen(){ const d=RI(2,8), n=RI(2,6);
 if(RI(0,2)===2) return N(`1/${d} of a pizza is left. ${n} boys share it equally. What fraction of the whole pizza does each boy get? ${FT}`, 1/(d*n), 'How many of the small pieces would fill the whole pizza? Multiply the bottom number by the number of boys.');
 return N(`1/${d} ÷ ${n} = ? ${FT}`, 1/(d*n), 'Splitting a piece into more parts makes each part smaller. How many small parts fill one whole? Multiply the bottom number by the number of parts.'); }},
'MATH.FRAC.L06.07':{name:'Fraction Stories',
how:['Fractions show up in recipes, races and building jobs. First decide what the story is doing, then calculate.','A recipe uses 2/3 cup of flour. Dovid makes half the recipe. "Half of" means multiply: 1/2 × 2/3 = 2/6 = 1/3 cup.','Name the operation from the words. "Altogether" means add. "Left" or "how much more" means subtract. "Of" means multiply.'],
gen(){ const k=RI(0,2), P=[[2,4],[2,3],[3,6],[4,8],[2,5],[3,4],[2,6],[5,10]], [d1,d2]=PICK(P), a=RI(1,d1-1), b=RI(1,d2-1), who=n6();
 if(k===0) return N(`A jug has ${a}/${d1} L of water and a bottle has ${b}/${d2} L. How much water altogether? ${FT}`, a/d1+b/d2, 'The story puts amounts together, so add. Give both fractions the same bottom number first.', {unit:'L'});
 if(k===1){ const x=a/d1, y=b/d2; if(Math.abs(x-y)<1e-9) return this.gen(); const [hi,lo]=x>y?[[a,d1],[b,d2]]:[[b,d2],[a,d1]]; return N(`A rope is ${hi[0]}/${hi[1]} m long. ${who} cuts off ${lo[0]}/${lo[1]} m. How much is left? ${FT}`, hi[0]/hi[1]-lo[0]/lo[1], 'The story takes some away, so subtract. Give both fractions the same bottom number first.', {unit:'m'}); }
 const p=RI(1,3), q=RI(p+1,5); return N(`${who} reads ${p}/${q} of ${a}/${d1} of a book. What fraction of the whole book is that? ${FT}`, p/q*a/d1, '"Of" means multiply. Multiply the tops, multiply the bottoms, then simplify.'); }},
'MATH.STAT.L06.01':{name:'Fair Shares from Data',
how:['When you share fairly, everyone ends up with the same amount. That fair-share number is the mean, one number that tells about a whole set.','Four boys read 3, 5, 6 and 10 pages. Add: 24. Share equally among 4: 24 ÷ 4 = 6. The mean is 6 pages. Check: 4 × 6 = 24.','Levelling: take from the tall stacks and give to the short ones until all are equal. 3, 5, 6, 10 becomes 6, 6, 6, 6.'],
gen(){ const c=RI(3,5), m=RI(4,15); const v=Array(c).fill(m); for(let i=0;i<c*2;i++){ const a=RI(0,c-1), b=RI(0,c-1), s=RI(1,3); if(a!==b&&v[a]-s>=1){ v[a]-=s; v[b]+=s; } }
 if(RI(0,3)===3) return N(`${c} boys collected ${v.map(x=>'$'+x).join(', ')} for tzedakah. If they shared the total equally, how much would each have?`, m, 'Add all the amounts to find the total. Then share it equally: divide by how many boys.', {unit:'$'});
 return N(`Find the mean (fair share): ${v.join(', ')}`, m, `Add the numbers to find the total. Then divide by how many numbers there are (${c}).`); }},
'MATH.ALG.L06.01':{name:'Write the Expression',
how:['Algebra is a short way to write a rule. A letter stands for a number you do not know yet, so you can write the rule once and use it again and again.','"5 more than a number n" is n + 5. "3 times a number n" is 3n. "Twice a number, then 3 less" is 2n − 3. If n = 10, then 2n − 3 = 20 − 3 = 17.','Use a table. Input n: 1, 2, 3. For "n + 5" the output is 6, 7, 8. The rule is the same in every row, and the expression is the rule.'],
gen(){ const k=RI(0,3), a=RI(2,9), b=RI(2,12), n=RI(2,9);
 if(k===0) return MX(`Which expression means "${b} less than ${a} times n"?`, [`${a}n − ${b}`, `${b} − ${a}n`, `${a}(n − ${b})`], '"Times n" is a number written right next to n. "Less than" takes away from what comes after it.');
 if(k===1) return MX(`Which expression means "${b} more than n"?`, [`n + ${b}`, `${b}n`, `n − ${b}`], '"More than" means add.');
 if(k===2){ if(a*n<=b) return this.gen(); return N(`Find the value of ${a}n − ${b} when n = ${n}.`, a*n-b, `Put ${n} in place of n. Do the times part first, then take away.`); }
 const st=RI(2,5), per=RI(2,4), mi=RI(3,10); return N(`A taxi charges $${st} to start plus $${per} for every mile: ${st} + ${per}m. What does a ${mi}-mile ride cost?`, st+per*mi, `Put ${mi} in place of m. Multiply first, then add the starting charge.`, {unit:'$'}); }},
'MATH.GEO.L06.01':{name:'The Coordinate Grid',
how:['A grid names any spot with two numbers, the way a map names a street and an avenue. Maps, games and building plans all use it.','The point (4, 3): the first number is how far RIGHT from 0, the second is how far UP. Start at (0, 0), go right 4, then up 3.','"Walk before you climb": walk along the ground first (the first number), then climb the stairs (the second number).'],
gen(){ const x=RI(1,9), y=RI(1,9), k=RI(0,3);
 if(k===0){ if(x===y) return this.gen(); return MX(`Start at (0, 0). Go right ${x} and up ${y}. Which point is it?`, [`(${x}, ${y})`, `(${y}, ${x})`, `(${x}, ${x})`], 'Write the "right" number first and the "up" number second.'); }
 if(k===1) return PICK([0,1]) ? N(`For the point (${x}, ${y}), how many units up from 0?`, y, 'Which number is the "up" number, the first or the second?') : N(`For the point (${x}, ${y}), how many units right from 0?`, x, 'Which number is the "right" number, the first or the second?');
 if(k===2){ const x2=RI(1,9), y2=RI(1,9); if(x2===x) return this.gen(); const P1=`(${x}, ${y})`, P2=`(${x2}, ${y2})`; return MX(`Which point is farther right: ${P1} or ${P2}?`, x>x2?[P1,P2]:[P2,P1], 'Compare only the FIRST numbers, the ones that say how far right. Which is bigger?'); }
 const y2=RI(1,9); if(y2===y) return this.gen(); return N(`A treasure is at (${x}, ${Math.min(y,y2)}). ${n6()} stands at (${x}, ${Math.max(y,y2)}). He walks straight down to it. How many steps?`, Math.abs(y-y2), 'The first numbers are the same, so only the "up" numbers change. How far apart are they?', {unit:'steps'}); }},
'MATH.ALG.L06.02':{name:'Two Patterns One Graph',
how:['Two patterns can grow at different speeds. Lining them up shows how one depends on the other, and that is how you predict what comes next.','A starts at 0 and adds 2: 0, 2, 4, 6. B starts at 0 and adds 4: 0, 4, 8, 12. Pair them: (0, 0), (2, 4), (4, 8), (6, 12). Every B number is double the A number.','Make a table with two rows, A and B. Fill in each step. Look down a column: B is always double A.'],
gen(){ const a=RI(2,10), b=RI(2,12), s=RI(2,8); if(a===b) return this.gen();
 if(RI(0,3)===3) return N(`Dovid saves $${a} each week and Moshe saves $${b} each week. Both start with $0. When Dovid has $${a*s}, how much does Moshe have?`, b*s, 'Count how many weeks it took Dovid. Moshe saved for the same number of weeks.', {unit:'$'});
 return N(`Both patterns start at 0. A adds ${a} each step and B adds ${b} each step. When A is ${a*s}, what is B?`, b*s, `Count how many jumps of ${a} it took A. B takes the same number of jumps of its own size.`); }},
'MATH.GEO.L06.02':{name:'Shape Families',
how:['Shapes belong to families, and a square belongs to several at once. Knowing the families lets you describe a shape in the fewest words.','Four-sided shapes are quadrilaterals. A parallelogram has 2 pairs of parallel sides. A rectangle is a parallelogram with 4 right angles. A rhombus is a parallelogram with 4 equal sides. A square has both, so it is a rectangle AND a rhombus AND a parallelogram.','Nested boxes: quadrilaterals, inside that parallelograms, inside that rectangles and rhombuses overlapping, with squares in the overlap. Ask: which boxes is this shape inside?'],
gen(){ const T=[['True or false: every square is a rectangle.',1,'A rectangle needs 4 right angles. Does a square have them?'],['True or false: every rectangle is a square.',0,'Does every rectangle have 4 equal sides? Picture a long, thin rectangle.'],['True or false: every rhombus is a parallelogram.',1,'A parallelogram needs 2 pairs of parallel sides. Check a rhombus.'],['True or false: every parallelogram is a rectangle.',0,'Does every parallelogram have 4 right angles? Picture one leaning over.'],['True or false: every square is a rhombus.',1,'A rhombus needs 4 equal sides. Does a square have them?'],['True or false: every rhombus is a square.',0,'Does every rhombus have right angles? Picture a diamond.'],['True or false: every rectangle is a quadrilateral.',1,'A quadrilateral is any shape with 4 sides.']];
 const k=RI(0,3);
 if(k===0) return N('How many pairs of parallel sides does a parallelogram have?', 2, 'Look at the opposite sides. How many pairs of opposite sides are there?', {unit:'pairs'});
 if(k===1) return MX(PICK(['A shape has 4 equal sides and 4 right angles. What is its most exact name?','A tile has 4 right angles and all 4 sides the same length. What is its most exact name?']), ['Square','Rhombus','Rectangle'], 'It has the property of a rectangle AND the property of a rhombus. Which family has both?');
 if(k===2) return MX('A tile has 4 equal sides, but its corners are not right angles. Which family is it in?', ['Rhombus','Square','Rectangle'], 'Without right angles it cannot be a square or a rectangle. Which family only needs 4 equal sides?');
 const r=PICK(T); return tf(r, r[2]); }}
};
