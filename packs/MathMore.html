const L9={
'MATH.NUM.L09.02':{name:'Root Finder',
how:['A square floor has an area of 49 square feet. How long is each side? Finding the number that was multiplied by itself is called taking a root. Roots open the door to the Pythagorean Theorem and to measuring almost anything.','√49 asks: what number times itself is 49? 7 × 7 = 49, so √49 = 7. ∛64 (the cube root) asks: what number times itself 3 times is 64? 4 × 4 × 4 = 64, so ∛64 = 4. If x² = 49, x can be 7 or −7, because (−7) × (−7) = 49 too.','Picture it: √49 is the side of a square made of 49 tiles, a 7 by 7 square. ∛64 is the edge of a cube made of 64 small blocks, 4 by 4 by 4.'],
re:['Work backward from the squares you know: 1, 4, 9, 16, 25, 36, 49, 64, 81, 100, 121, 144. For √81, find 81 in the list. It is 9 × 9, so √81 = 9.','A simpler step: square first. 6² means 6 × 6 = 36. Taking the square root goes backward: √36 = 6. A square and a root undo each other.','The skill underneath (Sign Rules): (−5) × (−5) = 25, a positive. So both 5 and −5 square to 25. But (−2) × (−2) × (−2) = −8, so ∛(−8) = −2.'],
gen(){ const k=RI(0,4);
 if(k===0){ const n=RI(2,15); return N(`√${n*n} = ?`, n, `Which number times itself makes ${n*n}? Make a guess and check it by multiplying it by itself.`); }
 if(k===1){ const n=nz9(-6,6); return N(`∛${pn9(n*n*n)} = ?`, n, `Which number times itself 3 times makes ${fx9(n*n*n)}? Try 2 × 2 × 2, 3 × 3 × 3 and so on. Three negatives multiplied make a negative. ${NG9}`); }
 if(k===2){ const n=RI(2,12); const o=[`x = ${n} or x = −${n}`, `x = ${n} only`, `x = ${n*n*2}`]; return MX(`x² = ${n*n}. What can x be?`, o, `Two numbers times themselves make ${n*n}: one positive and one negative. A negative times a negative is positive.`); }
 if(k===3){ const n=RI(2,10); return N(`x³ = ${n*n*n}. What is x?`, n, 'Find the number that times itself 3 times makes it. Try 2 × 2 × 2, then 3 × 3 × 3, and so on.'); }
 const b=RI(2,10), a=RI(1,b-1); if(g9(a,b)!==1) return this.gen(); return N(`√(${a*a}/${b*b}) = ? ${FP9}`, a/b, `Take the root of the top and the root of the bottom separately: √${a*a} on top, √${b*b} on the bottom.`); }},
'MATH.NUM.L09.04':{name:'Repeat to Fraction',
how:['You learned that 1/3 = 0.333…. Now go the other way: every repeating decimal is really a fraction, and there is a neat trick to find which one.','Find the fraction for 0.777…. Let x = 0.777…. Multiply by 10: 10x = 7.777…. Subtract the first line: 10x − x = 7.777… − 0.777…, so 9x = 7 and x = 7/9. With two repeating digits, like 0.272727…, multiply by 100 instead: 99x = 27, so x = 27/99 = 3/11.','The shortcut: one repeating digit goes over 9 (0.555… = 5/9). Two repeating digits go over 99 (0.454545… = 45/99 = 5/11). Then simplify.'],
re:['Start from what you know: 1/9 = 0.111…. So 2/9 = 0.222…, 3/9 = 0.333…, and 8/9 = 0.888…. The repeating digit is the top number over 9.','A simpler step: 0.444…. One digit repeats, so it is 4 over 9: 4/9. There is nothing to simplify.','The skill underneath (Ends or Repeats): dividing 4 ÷ 9 gives 0.444…, so 4/9 = 0.444…. This lesson runs that division backward.'],
gen(){ const k=RI(0,4);
 if(k===0){ const d=RI(1,8); return N(`Write 0.${d}${d}${d}… as a fraction. ${FP9}`, d/9, `One digit repeats, so put it over 9: ${d} over 9. Then simplify if you can.`); }
 const ab=RI(1,98); if(ab%11===0) return this.gen(); const s=String(ab).padStart(2,'0');
 if(k===1) return N(`Write 0.${s}${s}${s}… as a fraction in lowest terms. ${FP9}`, ab/99, `Two digits repeat, so put ${ab} over 99. Then divide the top and bottom by the same number to simplify.`, {lowest:true});
 if(k===2){ const o=[fr9(ab,99), fr9(ab,100), fr9(ab,9)]; if(!uq9(o)) return this.gen(); return MX(`Which fraction equals 0.${s}${s}${s}…?`, o, `Two digits repeat, so the fraction is ${ab} over 99, simplified. Over 100 would be a decimal that stops.`); }
 const w=RI(1,5), d=RI(1,8);
 if(k===3) return N(`Write ${w}.${d}${d}${d}… as a mixed number. ${FT9}`, w+d/9, `Keep the whole number ${w}. The repeating part 0.${d}${d}${d}… is ${d} over 9. Put them together.`);
 return N(`Let x = 0.${d}${d}${d}…. Then 10x = ${d}.${d}${d}${d}…. Subtract the two lines: 10x − x = 9x. What does 9x equal?`, d, `Subtract the decimals: ${d}.${d}${d}${d}… − 0.${d}${d}${d}…. All the repeating digits after the point cancel out.`); }},
'MATH.NUM.L09.01':{name:'Real or Not?',
how:['Every number you have met so far can be written as a fraction. But some numbers cannot, like √2 and π. They are called irrational. Knowing which is which completes the whole number line.','Rational means it can be written as a fraction of two whole numbers. 0.75 = 3/4, −5 = −5/1, 0.333… = 1/3 and √25 = 5 are all rational. √2 = 1.41421356… never ends and never repeats, so it cannot be a fraction: it is irrational. π = 3.14159… is irrational too.','A quick test for a square root: is the number under the root a perfect square (1, 4, 9, 16, 25, …)? Yes: rational. No: irrational. For a decimal: does it end or repeat? Yes: rational. Never ends and never repeats: irrational.'],
re:['Think of all numbers as one big family, the real numbers. The rational ones can be written as a fraction. The irrational ones have decimals that go on forever with no repeating pattern.','A simpler step: roots only. √9 = 3, a whole number, so it is rational. √8: no whole number times itself is 8 (2 × 2 = 4, 3 × 3 = 9), so √8 is irrational.','The skill underneath (Root Finder and Repeat to Fraction): √36 = 6, so the root of a perfect square is a whole number. 0.888… = 8/9, so a repeating decimal is a fraction.'],
gen(){ const k=RI(0,3), H='Can it be written as a fraction of two whole numbers? The root of a perfect square, a decimal that ends, and a decimal that repeats are rational. Anything else is irrational.';
 if(k===0){ const r=PICK([0,1]), x=r?PICK(RAT9):PICK(IRR9); return MX(`Is ${x} rational or irrational?`, r?['Rational','Irrational']:['Irrational','Rational'], H); }
 if(k===1){ const a=PICK(RAT9); let b=PICK(RAT9); while(b===a) b=PICK(RAT9); return MX('Which number is irrational?', [PICK(IRR9), a, b], H); }
 if(k===2){ const a=PICK(IRR9); let b=PICK(IRR9); while(b===a) b=PICK(IRR9); return MX('Which number is rational?', [PICK(RAT9), a, b], H); }
 const n=PICK([0,1])?Math.pow(RI(2,9),2):RI(2,60); return MX(`Is √${n} rational or irrational?`, sq9(n)?['Rational','Irrational']:['Irrational','Rational'], `Is ${n} a perfect square (a whole number times itself)? If yes, the root is a whole number. If no, the root is irrational.`); }},
'MATH.NUM.L09.03':{name:'Squeeze the Root',
how:['√30 never ends, so how big is it? You can squeeze an irrational number between numbers you know and find its spot on the number line, close enough to use.','√30: 5 × 5 = 25 and 6 × 6 = 36. 30 is between 25 and 36, so √30 is between 5 and 6. 30 is closer to 25 than to 36, so √30 is closer to 5. Try 5.5 × 5.5 = 30.25, a little too big, so √30 is a bit less than 5.5. It is about 5.5 to the nearest tenth (5.477…).','Number line picture: mark the perfect squares 25 and 36, with their roots 5 and 6 under them. Put 30 between them. Its root sits between 5 and 6, a little closer to 5.'],
re:['Use tiles: 30 tiles cannot make a perfect square. A 5 by 5 square uses 25 and leaves 5 over. A 6 by 6 square needs 36, which is 6 too many. So the side is a bit more than 5.','A simpler step: list the squares. 4² = 16, 5² = 25, 6² = 36, 7² = 49. To squeeze √40, find the two squares around 40: 36 and 49. So √40 is between 6 and 7.','The skill underneath (Real or Not?): √40 is irrational because 40 is not a perfect square, so its decimal never ends. That is why we estimate it.'],
gen(){ const k=RI(0,3), n=RI(3,150); if(sq9(n)) return this.gen(); const a=Math.floor(Math.sqrt(n));
 if(k===0) return MX(`√${n} is between which two whole numbers?`, [`${a} and ${a+1}`, `${a+1} and ${a+2}`, `${a-1} and ${a}`], `Find the perfect squares just below and just above ${n}. Their roots are the two whole numbers.`);
 if(k===1) return N(`√${n} is closest to which whole number?`, Math.round(Math.sqrt(n)), `Find the perfect squares on each side of ${n}: ${a*a} and ${(a+1)*(a+1)}. Which one is ${n} closer to? Its root is the answer.`);
 if(k===2) return N(`Round √${n} to the nearest tenth.`, Math.round(Math.sqrt(n)*10)/10, `First squeeze it between ${a} and ${a+1}. Then try tenths: multiply ${a}.5 × ${a}.5 to see if it is too big or too small, and adjust by tenths.`);
 const c=a+0.5; return MX(`Which is greater: √${n} or ${fx9(c)}?`, Math.sqrt(n)>c?[`√${n}`, fx9(c)]:[fx9(c), `√${n}`], `Square both: (√${n})² = ${n}, and ${fx9(c)} × ${fx9(c)} = ${fx9(c*c)}. The bigger square belongs to the bigger number.`); }},
'MATH.ALG.L09.03':{name:'Solve Linear Equations',
how:['Some equations have x on both sides, or need you to multiply out first. With one plan you can solve any of them, and even spot equations with no answer or with every answer.','5x + 3 = 2x + 18. Step 1, get the x terms on one side: take 2x from both sides: 3x + 3 = 18. Step 2, take 3 from both sides: 3x = 15. Step 3, divide by 3: x = 5. Check: 5 × 5 + 3 = 28 and 2 × 5 + 18 = 28. Both sides match.','Special cases: 2x + 5 = 2x + 1. Take 2x from both sides: 5 = 1. That is never true, so there is NO solution. 2(x + 3) = 2x + 6. Multiply out: 2x + 6 = 2x + 6. That is always true, so EVERY number works (infinitely many solutions).'],
re:['Use a balance: 5 bags of x and 3 weights on the left, 2 bags and 18 weights on the right. Take 2 bags off each side. Then take 3 weights off each side. 3 bags balance 15 weights, so each bag holds 5.','A simpler step: once the x terms are on one side, it is a two-step equation. 3x + 3 = 18: take away 3, then divide by 3. Moving the x terms together first just turns a harder equation into this one.','The skill underneath (Two-Step Equations): undo in reverse order and do the same thing to both sides. 4x − 2 = 10: add 2 to both sides, then divide by 4: x = 3.'],
gen(){ const k=RI(0,4);
 if(k===0){ const a=nz9(-9,9), c=nz9(-9,9), x=nz9(-10,10), b=nz9(-15,15); if(a===c) return this.gen(); const d=a*x+b-c*x; return N(`${ex9([[a,'x'],[b,'']])} = ${ex9([[c,'x'],[d,'']])}. What is x?`, x, `Get the x terms together on one side (do the same to both sides). Then move the plain numbers to the other side. Then divide by the number in front of x. ${NG9}`); }
 if(k===1){ const a=nz9(-5,5), b=nz9(-9,9), c=nz9(-6,6), x=nz9(-9,9); if(Math.abs(a)<2||a===c) return this.gen(); const d=a*(x+b)-c*x; return N(`${fx9(a)}(x ${sb9(b)}) = ${ex9([[c,'x'],[d,'']])}. What is x?`, x, `First multiply ${fx9(a)} by EACH term in the parentheses. Then get the x terms on one side and solve. ${NG9}`); }
 if(k===2){ const t=RI(0,2), m=RI(2,6), p=nz9(-8,8), L=`${m}(x ${sb9(p)})`; let R;
  if(t===0){ let c=m+nz9(-3,3); if(c===0) c=m+4; R=ex9([[c,'x'],[m*p+RI(-5,5),'']]); }
  else if(t===1) R=ex9([[m,'x'],[m*p+nz9(-5,5),'']]);
  else R=ex9([[m,'x'],[m*p,'']]);
  const A=['One solution','No solution','Infinitely many solutions']; return MX(`How many solutions does ${L} = ${R} have?`, [A[t], A[(t+1)%3], A[(t+2)%3]], 'Multiply out, then take the same x term away from both sides. If an x is left, there is one solution. If you get something false, like 5 = 1, there is none. If you get something always true, like 6 = 6, there are infinitely many.'); }
 if(k===3){ const d=RI(2,5), x=d*nz9(-8,8), b=nz9(-10,10); return N(`(1/${d})x ${sb9(b)} = ${fx9(x/d+b)}. What is x?`, x, `Undo the ${sb9(b)} first, on both sides. Then multiply both sides by ${d}, because (1/${d})x means x divided by ${d}. ${NG9}`); }
 const [A,B]=two9(), p=RI(2,9), q=p+RI(1,6), w=RI(2,10), b=RI(2,20), a=b+(q-p)*w;
 return N(`${A} has $${a} and saves $${p} a week. ${B} has $${b} and saves $${q} a week. Solve ${a} + ${p}x = ${b} + ${q}x. After how many weeks will they have the same amount?`, w, `Get the x terms on one side and the plain numbers on the other: ${a} − ${b} = ${q}x − ${p}x. Then divide.`, {unit:'weeks'}); }},
'MATH.FUNC.L09.01':{name:'What Is a Function?',
how:['A function is a rule that gives exactly ONE output for each input, like a machine: put a number in, get one number out. Functions are the main tool of all higher math.','Pairs (1, 4), (2, 7), (3, 10): every input has one output, so it is a function. Pairs (1, 4), (1, 6), (2, 8): the input 1 gives two outputs, 4 AND 6, so it is NOT a function. The rule y = 3x + 1 is a function: put in x = 2 and out comes 3 × 2 + 1 = 7.','Compare two functions by their rate of change: how much y grows when x goes up by 1. In y = 3x + 1 the rate is 3. In a table with x: 0, 1, 2 and y: 5, 9, 13, y grows by 4 each time, so the rate is 4. The table grows faster.'],
re:['Think of a machine with buttons: press B4 and you always get the same one thing. If B4 sometimes gave a pen and sometimes a pencil, the machine would be broken. A function never gives two outputs for the same input.','A simpler step: look only at the inputs (the first numbers). If no input appears twice, it is a function. If an input appears twice with different outputs, it is not.','The skill underneath (Slope): the rate of change is the slope. From (1, 5) to (3, 11), y goes up 6 while x goes up 2, so the slope is 6 ÷ 2 = 3.'],
gen(){ const k=RI(0,4);
 if(k===0){ const xs=[]; while(xs.length<4){ const v=RI(-5,9); if(!xs.includes(v)) xs.push(v); } xs.sort((p,q)=>p-q); const ys=xs.map(()=>RI(-5,15)); const f=PICK([0,1]); let P=xs.map((x,i)=>pt9(x,ys[i]));
  if(!f){ const i=RI(0,3); let y2=RI(-5,15); while(y2===ys[i]) y2=RI(-5,15); P.splice(RI(0,4),0,pt9(xs[i],y2)); }
  return MX(`Is this set of pairs a function? ${P.join(', ')}`, f?['Yes, it is a function','No, it is not a function']:['No, it is not a function','Yes, it is a function'], 'Look at the first number (the input) in each pair. If any input shows up twice with two different outputs, it is not a function.'); }
 if(k===1){ const m=nz9(-5,5), b=nz9(-10,10), x=RI(-6,6); return N(`The function rule is y = ${ex9([[m,'x'],[b,'']])}. What is y when x = ${fx9(x)}?`, m*x+b, `Put ${pn9(x)} in place of x. Multiply by ${fx9(m)} first, then ${b<0?'subtract '+(-b):'add '+b}. ${NG9}`); }
 if(k===2){ const ma=RI(1,9), ba=RI(-5,10), mb=RI(1,9), bb=RI(-5,10); if(ma===mb) return this.gen(); const ys=[0,1,2,3].map(x=>mb*x+bb).map(fx9).join(', ');
  return MX(`Function A: y = ${ex9([[ma,'x'],[ba,'']])}. Function B is this table: x: 0, 1, 2, 3 and y: ${ys}. Which function has the greater rate of change?`, mb>ma?['Function B','Function A','They are the same']:['Function A','Function B','They are the same'], 'For A, the rate of change is the number in front of x. For B, see how much y grows each time x goes up by 1. Compare the two numbers.'); }
 if(k===3){ const lin=PICK([0,1]), b=RI(-3,6); let ys; if(lin){ const m=nz9(-4,5); ys=[1,2,3,4].map(x=>m*x+b); } else ys=PICK([[1,2,3,4].map(x=>x*x+b),[2,4,8,16].map(v=>v+b),[1,8,27,64].map(v=>v+b)]);
  return MX(`Is this function linear (is its graph a straight line)? x: 1, 2, 3, 4 and y: ${ys.map(fx9).join(', ')}.`, lin?['Yes, it is linear','No, it is not linear']:['No, it is not linear','Yes, it is linear'], 'Find how much y changes each time x goes up by 1. The same change every time means linear. A change that grows or shrinks means not linear.'); }
 const m=nz9(-6,6), b=nz9(-9,9); return MX('Which rule is a linear function (a straight-line graph)?', [`y = ${ex9([[m,'x'],[b,'']])}`, `y = x² ${sb9(b)}`, `y = x³ ${sb9(-b)}`], 'A linear rule has x by itself, not squared (x²) and not cubed (x³).'); }},
'MATH.GEO.L09.01':{name:'Slide, Turn, Flip',
how:['When you slide, turn or flip a shape, it moves but keeps its exact size and shape. When you stretch or shrink it evenly, it keeps its shape but changes size. These moves explain when two shapes match.','Point (2, 3). Slide 4 right and 1 down: add 4 to x and take 1 from y: (6, 2). Flip over the x-axis: y changes sign: (2, −3). Flip over the y-axis: x changes sign: (−2, 3). Turn 180° around the origin: both change sign: (−2, −3). Turn 90° clockwise: (x, y) becomes (y, −x), so (3, −2). Dilate by scale factor 2 from the origin: multiply both by 2: (4, 6).','Slides, turns and flips make CONGRUENT shapes: exactly the same size and shape. A dilation makes a SIMILAR shape: the same shape and the same angles, but every length is multiplied by the scale factor.'],
re:['Use paper: trace a shape, then slide the paper, spin it on a pencil point, or flip it over. The tracing still fits the shape exactly, so the moved shape is congruent.','A simpler step: one number at a time. Moving right or left changes only x. Moving up or down changes only y. For (2, 3) moved 4 right: x becomes 2 + 4 = 6, and y stays 3.','The skill underneath (Four Quadrants and Scale Drawings): (−2, 3) means 2 left and 3 up from the origin. A scale factor of 2 doubles every length, just like a scale drawing.'],
gen(){ const k=RI(0,4);
 if(k===4){ const T=[['a slide 5 units to the right',0],['a flip over the y-axis',0],['a 90° turn around the origin',0],['a 180° turn around the origin',0],['a dilation with scale factor 3',1],['a dilation with scale factor 1/2',1]]; const r=PICK(T), A=['Congruent (same size and shape)','Similar but not congruent (same shape, new size)'];
  return MX(`A triangle is moved by ${r[0]}. How does the new triangle compare with the first one?`, r[1]?[A[1],A[0]]:[A[0],A[1]], 'Slides, turns and flips keep the size, so the shapes are congruent. A dilation changes the size but keeps the shape, so the shapes are similar.'); }
 if(k===3){ const s=RI(2,12), f=PICK([2,3,4,0.5,1.5]); return N(`A triangle has a side ${s} units long. It is dilated with a scale factor of ${fx9(f)}. How long is that side now?`, s*f, `A dilation multiplies every length by the scale factor: ${s} × ${fx9(f)}.`, {unit:'units'}); }
 const x=nz9(-6,6), y=nz9(-6,6); if(Math.abs(x)===Math.abs(y)) return this.gen(); let q, o, h;
 if(k===0){ const dx=nz9(-5,5), dy=nz9(-5,5); q=`Point ${pt9(x,y)} slides ${Math.abs(dx)} ${dx>0?'right':'left'} and ${Math.abs(dy)} ${dy>0?'up':'down'}. Where does it land?`; o=[pt9(x+dx,y+dy), pt9(x-dx,y-dy), pt9(x+dy,y+dx)]; h='Right or left changes only x: add for right, subtract for left. Up or down changes only y: add for up, subtract for down.'; }
 else if(k===1){ const ax=PICK(['x','y']); q=`Point ${pt9(x,y)} is flipped over the ${ax}-axis. Where does it land?`; o=ax==='x'?[pt9(x,-y), pt9(-x,y), pt9(y,x)]:[pt9(-x,y), pt9(x,-y), pt9(y,x)]; h='A flip over the x-axis changes the sign of y. A flip over the y-axis changes the sign of x.'; }
 else { const R={'180°':[-x,-y],'90° clockwise':[y,-x],'90° counterclockwise':[-y,x]}; const keys=Object.keys(R), t=PICK(keys); q=`Point ${pt9(x,y)} is turned ${t} around the origin (0, 0). Where does it land?`; o=[pt9(...R[t]), ...keys.filter(z=>z!==t).map(z=>pt9(...R[z]))]; h='180°: both numbers change sign. 90° clockwise: (x, y) becomes (y, −x). 90° counterclockwise: (x, y) becomes (−y, x).'; }
 if(!uq9(o)) return this.gen(); return MX(q, o, h); }},
'MATH.GEO.L09.02':{name:'Angle Facts',
how:['The three angles of every triangle, any shape or size, add up to exactly 180°. With that fact and a few facts about parallel lines, you can find missing angles anywhere.','A triangle has angles of 50° and 60°. The third is 180 − 50 − 60 = 70°. Two parallel lines cut by a third line (a transversal): corresponding angles (the same spot at each crossing) are equal. Alternate interior angles (between the parallel lines, on opposite sides) are equal. Same-side interior angles add up to 180°.','Tear the three corners off a paper triangle and put their points together: they make a straight line, 180°. That is why every triangle adds up to 180.'],
re:['Picture a ladder leaning across two parallel rails. It crosses both rails at the same slant, so the angles at the top crossing copy the angles at the bottom crossing.','A simpler step: the triangle first. Add the two angles you know, then subtract from 180. 40° and 90°: 40 + 90 = 130, and 180 − 130 = 50°.','The skill underneath (Angles, Area and Volume Problems): angles on a straight line add up to 180°, and vertical angles (straight across from each other) are equal.'],
gen(){ const k=RI(0,4);
 if(k===0||k===1){ const a=RI(20,110), b=RI(20,150-a); return k===0 ? N(`A triangle has angles of ${a}° and ${b}°. What is the third angle?`, 180-a-b, 'The three angles of a triangle add up to 180°. Add the two you know, then subtract from 180.', {unit:'°'}) : N(`A triangle has inside angles of ${a}° and ${b}°. What is the outside (exterior) angle at the third corner?`, a+b, 'The exterior angle equals the two far inside angles added together. (Or find the third inside angle and subtract it from 180.)', {unit:'°'}); }
 if(k===2){ const a=RI(30,150); if(a===90) return this.gen(); const T=[['corresponding',a,'Corresponding angles are in the same spot at each crossing, so they are equal.'],['alternate interior',a,'Alternate interior angles are between the parallel lines on opposite sides, and they are equal.'],['alternate exterior',a,'Alternate exterior angles are outside the parallel lines on opposite sides, and they are equal.'],['same-side interior',180-a,'Same-side interior angles are between the parallel lines on the same side, and they add up to 180°. Subtract from 180.']]; const r=PICK(T);
  return N(`Two parallel lines are cut by a transversal. One angle is ${a}°. What is the ${r[0]} angle that goes with it?`, r[1], r[2], {unit:'°'}); }
 if(k===3){ const M=PICK([[1,2,3],[1,1,2],[2,3,4],[1,2,6],[3,4,5],[1,4,7],[2,3,7],[1,3,5]]), s=M[0]+M[1]+M[2], f=m=>m===1?'x°':m+'x°';
  return N(`The angles of a triangle are ${f(M[0])}, ${f(M[1])} and ${f(M[2])}. What is x?`, 180/s, `Add the x terms: they make ${s}x, and that equals 180. Divide 180 by ${s}.`); }
 const v=2*RI(10,80); return N(`An isosceles triangle has a top angle of ${v}°. The two bottom angles are equal. How big is each bottom angle?`, (180-v)/2, `Take the top angle away from 180, then share what is left equally between the 2 bottom angles.`, {unit:'°'}); }},
'MATH.GEO.L09.03':{name:'Pythagorean Theorem',
how:['In every right triangle, the two short sides and the long side are tied together by one famous rule. With it you can find any missing side, check whether a corner is square, and measure distances on a map or grid.','The legs a and b make the square corner. The hypotenuse c is the long side across from it. a² + b² = c². Legs 6 and 8: 36 + 64 = 100, and √100 = 10, so c = 10. A missing leg: c = 13 and a = 5: 13² − 5² = 169 − 25 = 144, and √144 = 12.','Picture a square built on each side of the triangle. The two small squares together have exactly the same area as the big square on the long side. For 3, 4, 5: 9 + 16 = 25.'],
re:['Builders check a square corner this way: measure 3 feet along one wall and 4 feet along the other. If the distance between the two marks is exactly 5 feet, the corner is square.','A simpler step: square each number first, then add, then take the root. 3² = 9, 4² = 16, 9 + 16 = 25, √25 = 5.','The skill underneath (Root Finder and Angle Facts): √144 = 12 because 12 × 12 = 144. The hypotenuse is always across from the 90° angle, and it is always the longest side.'],
gen(){ const k=RI(0,5), t=PICK(TR9), m=t[2]<20?RI(1,2):1, a=t[0]*m, b=t[1]*m, c=t[2]*m;
 if(k===0) return N(`A right triangle has legs of ${a} and ${b}. How long is the hypotenuse (the long side)?`, c, 'Square both legs and add them: a² + b². Then take the square root.', {unit:'units'});
 if(k===1) return N(`A right triangle has a hypotenuse of ${c} and one leg of ${a}. How long is the other leg?`, b, 'Square the hypotenuse, square the leg you know, and SUBTRACT: c² − a². Then take the square root.', {unit:'units'});
 if(k===2){ const yes=PICK([0,1]), c2=yes?c:c+PICK([-1,1]); return MX(`A triangle has sides of ${a}, ${b} and ${c2}. Is it a right triangle?`, yes?['Yes, it is a right triangle','No, it is not a right triangle']:['No, it is not a right triangle','Yes, it is a right triangle'], 'Square the two shorter sides and add. If the total equals the longest side squared, it is a right triangle.'); }
 if(k===3){ if(a>12||b>12) return this.gen(); const x1=RI(-6,6), y1=RI(-6,6), sx=PICK([1,-1]), sy=PICK([1,-1]); return N(`What is the distance between ${pt9(x1,y1)} and ${pt9(x1+sx*a,y1+sy*b)}?`, c, 'Find how far apart they are across (the x numbers) and up and down (the y numbers). Those are the two legs. Then use a² + b² = c².', {unit:'units'}); }
 if(k===4){ if(c>30) return this.gen(); return N(`A ${c}-foot ladder leans against the wall of the beis medrash. Its foot is ${a} feet from the wall. How high up the wall does it reach?`, b, 'The ladder is the hypotenuse. Square the ladder, square the distance from the wall, subtract, then take the square root.', {unit:'feet'}); }
 const p=RI(2,12), q=RI(2,12); if(sq9(p*p+q*q)) return this.gen(); return N(`A right triangle has legs of ${p} and ${q}. How long is the hypotenuse? Round to the nearest tenth.`, Math.round(Math.sqrt(p*p+q*q)*10)/10, `Square both legs and add: ${p*p} + ${q*q}. The total is not a perfect square, so squeeze its root between two whole numbers and then find the tenths.`, {unit:'units'}); }},
'MATH.GEO.L09.04':{name:'Cylinders, Cones, Spheres',
how:['Cans, cones and balls are all around us. Three formulas give the space inside each one, and they all start with the circle area you already know: π × r × r.','Use 3.14 for π. Cylinder (a can): V = π × r × r × height. r = 3, h = 10: 3.14 × 9 × 10 = 282.6. Cone: one third of the cylinder with the same base and height: 282.6 ÷ 3 = 94.2. Sphere (a ball): V = 4/3 × π × r × r × r. r = 3: 4/3 × 3.14 × 27 = 113.04.','Picture filling them with water: a cone filled 3 times fills the cylinder with the same base and height. A cylinder is a stack of circles, each with area π × r × r.'],
re:['Think of a stack of round coins: the area of one coin times the height of the stack gives the volume of the cylinder. It is base area × height, the same idea as a box.','A simpler step: find the base area first. r = 2: 3.14 × 2 × 2 = 12.56. Then a cylinder 5 tall holds 12.56 × 5 = 62.8.','The skill underneath (Circles, Powers and Scientific Notation): circle area = 3.14 × r × r. r³ means r × r × r, so 3³ = 27.'],
gen(){ const k=RI(0,4), P='Use 3.14 for π.';
 if(k===0){ const r=RI(2,10), h=RI(2,20); return N(`A can (cylinder) has a radius of ${r} inches and a height of ${h} inches. What is its volume? ${P}`, pi9(r*r*h), 'Volume = 3.14 × r × r × height. Find the circle area on the bottom first, then multiply by the height.', {unit:'cubic inches'}); }
 if(k===1){ const r=RI(2,9), h=3*RI(1,8); return N(`A cone has a radius of ${r} cm and a height of ${h} cm. What is its volume? ${P}`, pi9(r*r*h/3), 'A cone is one third of a cylinder: 3.14 × r × r × height, then divide by 3.', {unit:'cubic cm'}); }
 if(k===2){ const r=RI(2,10); return N(`A ball (sphere) has a radius of ${r} inches. What is its volume? ${P} Round to the nearest whole number.`, Math.round(314*r*r*r/75), 'Volume = 4/3 × 3.14 × r × r × r. Find r × r × r first, multiply by 3.14, then by 4, then divide by 3.', {unit:'cubic inches'}); }
 if(k===3){ const d=2*RI(2,8), h=RI(2,15); return N(`A round water tank (a cylinder) is ${d} feet across (the diameter) and ${h} feet tall. What is its volume? ${P}`, pi9(d*d/4*h), `The formula uses the RADIUS, half of the diameter: ${d} ÷ 2. Then 3.14 × r × r × height.`, {unit:'cubic feet'}); }
 const V=3*RI(4,40); return N(`A cylinder holds ${V} cups of water. A cone has the same radius and the same height. How many cups does the cone hold?`, V/3, 'A cone holds one third of the cylinder with the same base and height. Divide by 3.', {unit:'cups'}); }},
'MATH.STAT.L09.01':{name:'Scatter Plots and Trend Lines',
how:['Do boys who learn more hours finish more pages? A scatter plot puts each pair of numbers on a graph so you can see the pattern, and a trend line lets you make predictions from it.','Points (1, 4), (2, 6), (3, 7), (4, 10), (5, 11): as x goes up, y goes up. That is a positive association. If y went down as x went up, that is a negative association. No pattern means no association. A trend line like y = 2x + 2 follows the points: at x = 6 it predicts y = 2 × 6 + 2 = 14.','The slope of the trend line tells the story: in y = 3x + 40 for (hours learned, test score), each extra hour adds about 3 points. The 40 is where the line starts when x = 0. A point far from all the others is an outlier.'],
re:['Picture the dots as a flock of birds. If the flock flies up to the right, the association is positive. Down to the right, negative. Scattered everywhere, no association.','A simpler step: read the points in order of x. Is y mostly getting bigger, mostly getting smaller, or jumping around? Bigger is positive, smaller is negative, jumping is none.','The skill underneath (Slope, and Dot Plots, Histograms, Box Plots): slope = change in y ÷ change in x. From (0, 5) to (2, 11), y goes up 6 while x goes up 2, so the slope is 3.'],
gen(){ const k=RI(0,4);
 if(k===0){ const t=RI(0,2); const xs=[]; while(xs.length<6){ const v=RI(1,10); if(!xs.includes(v)) xs.push(v); } xs.sort((p,q)=>p-q); let ys;

'MATH.STAT.L09.02':{name:'Two-Way Tables',
how:['When you ask boys two questions at once, like their grade and their favorite game, a two-way table sorts the answers so you can see whether the two things are connected.','7th grade: chess 12, basketball 8 (20 boys). 8th grade: chess 6, basketball 14 (20 boys). Fraction of the 7th graders who chose chess: 12/20 = 3/5. Fraction of the 8th graders: 6/20 = 3/10. 3/5 is much bigger than 3/10, so grade and choice are connected (there is an association).','Read a two-way table like a map: find the row, find the column, and read the box where they meet. A row total adds everything across that row. A column total adds everything down that column.'],
re:['Picture sorting cards into four piles: 7th-chess, 7th-basketball, 8th-chess and 8th-basketball. Each box of the table is just the count of one pile.','A simpler step: one row only. 7th grade: chess 12, basketball 8. The row total is 20. The chess part is 12 out of 20: 12/20 = 3/5.','The skill underneath (Samples and Inference, and Percents): a fraction of a group is the part ÷ the whole. 6 out of 20 is 6/20 = 3/10, which is 30%.'],

  const T=`7th grade: ${c1} ${a}, ${c2} ${b}. 8th grade: ${c1} ${c}, ${c2} ${d}.`; return MX(`${T} Is there an association between grade and choice?`, yes?['Yes, the two grades chose differently','No, both grades chose the same way']:['No, both grades chose the same way','Yes, the two grades chose differently'], `Find the fraction of each grade that chose ${c1}: the ${c1} number over that row's total. Very different fractions mean yes; equal fractions mean no.`); }

function cor9(xs,ys){ const n=xs.length, mx=xs.reduce((s,v)=>s+v,0)/n, my=ys.reduce((s,v)=>s+v,0)/n; let sxy=0,sxx=0,syy=0; for(let i=0;i<n;i++){ sxy+=(xs[i]-mx)*(ys[i]-my); sxx+=(xs[i]-mx)**2; syy+=(ys[i]-my)**2; } return syy?sxy/Math.sqrt(sxx*syy):0; }
