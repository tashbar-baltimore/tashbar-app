h').forEach(bt=\u003ebt.onclick=async()=\u003e{ if(BUSY) return; if(bt.dataset.v===ok){ bt.classList.add('yes'); scene.querySelector('.sign').textContent=ok; chime(); lockAll(); res(first); } else { first=false; bt.classList.add('no'); soft(); await wrongHelp(async()=\u003esay('Compare the tens first: '+Math.floor(a/10)+' tens and '+Math.floor(b/10)+' tens.'+(Math.floor(a/10)===Math.floor(b/10)?' Same tens, so compare the ones.':''))); } }); });\n  return [f,a+' '+(ok==='\u003e'?'is greater than':ok==='\u003c'?'is less than':'equals')+' '+b+'.']; };\nfunction chartH(hi,id){ const start=Math.max(1,Math.floor((hi-1)/10)*10-29); let h='\u003cdiv class=\"tiles\" id=\"'+(id||'hc')+'\" style=\"max-width:600px\"\u003e'; for(let v=start;v\u003cstart+50&&v\u003c=100;v++) h+='\u003cdiv class=\"tile\" data-v=\"'+v+'\" style=\"width:48px;height:40px;font-size:18px\"\u003e'+v+'\u003c/div\u003e'; return h+'\u003c/div\u003e'; }\nG.jump10=async c=\u003e{ const up=Math.random()\u003c.5, n=up?R(11,89):R(11,89), ans=up?n+10:n-10; const f=await numQ(chartH(Math.max(n,ans)+10),(up?'10 more than ':'10 less than ')+n+'?',ans,{lo:Math.max(0,ans-12),hi:ans+12,extra:[up?n+1:n-1,ans+(up?10:-10)],help:async()=\u003e{ const t=scene.querySelector('[data-v=\"'+n+'\"]'); if(t) t.classList.add('hl'); await say('On the chart, '+(up?'10 more is one row down':'10 less is one row up')+'. The tens change, the ones stay the same.'); const u=scene.querySelector('[data-v=\"'+ans+'\"]'); if(u) u.classList.add('hl'); }}); return [f,(up?'10 more than ':'10 less than ')+n+' is '+ans+'.']; };\nG.addTens=async c=\u003e{ const kind=Math.random()\u003c.5; const a=R(11,79), b=kind?R(1,2)*10:R(1,9); let A=a,B=b; if(!kind){ A=R(2,8)*10+R(0,3); B=R(1,9-A%10); } const ans=A+B;\n  const f=await numQ(rodsH(Math.floor(A/10),A%10,'r1')+eqH(A,'+',B,ans,true),A+' plus '+B+'?',ans,{lo:10,hi:99,extra:[ans+10,ans-10,ans+1],help:async()=\u003e{ await say(B%10===0?'Add tens to tens: '+Math.floor(A/10)+' tens plus '+(B/10)+' tens. The ones stay '+(A%10)+'.':'Add ones to ones: '+(A%10)+' plus '+B+'. The tens stay '+Math.floor(A/10)+'.'); }}); return [f,A+' + '+B+' = '+ans+'.']; };\nG.takeTens=async c=\u003e{ const a=R(3,9)*10, b=R(1,a/10-1)*10; const f=await numQ(rodsH(a/10,0,'r2')+eqH(a,'−',b,a-b,true),a+' minus '+b+'?',a-b,{lo:0,hi:90,extra:[a-b+10,a-b-10],help:async()=\u003e{ await say(a/10+' tens take away '+b/10+' tens is '+(a-b)/10+' tens: '+(a-b)+'.'); }}); return [f,a+' − '+b+' = '+(a-b)+'.']; };\nL.push(\n{id:'MATH.OPS.L02.08',t:'Balance Scale',e:'⚖️',sub:'true or false equations',\n warm:[['add20'],['double']],\n story:async()=\u003e{ await M('\u003cdiv class=\"row\"\u003e'+scaleTilt('4 + 3','5 + 2',0)+'\u003c/div\u003e'); await say('The equal sign is like a balance scale. Both sides must weigh the same!'); },\n movie:async()=\u003e{ await M('\u003cdiv class=\"row\"\u003e'+scaleTilt('4 + 3','5 + 2',0)+'\u003c/div\u003e\u003cdiv class=\"row\" style=\"font:800 34px var(--f-head)\"\u003e4 + 3 = 5 + 2\u003c/div\u003e'); await say('4 plus 3 is 7. 5 plus 2 is 7. Both sides are 7, so it balances. True!');\n   await M('\u003cdiv class=\"row\"\u003e'+scaleTilt('6 + 2','5 + 5',8)+'\u003c/div\u003e\u003cdiv class=\"row\" style=\"font:800 34px var(--f-head)\"\u003e6 + 2 = 5 + 5\u003c/div\u003e'); await say('6 plus 2 is 8. 5 plus 5 is 10. Not the same, so the scale tips. False!'); },\n together:[['balanceTF'],['balanceFill'],['balanceTF']],\n practice:[['balanceTF'],['balanceFill'],['missing20'],['factFam'],['balanceTF'],['add20'],['balanceFill'],['balanceTF']],\n real:['balanceTF',{intro:'Two shalach manos baskets must be fair. Do they balance?'}],\n check:[['balanceTF'],['balanceFill'],['balanceTF']]},\n{id:'MATH.OPS.L02.09',t:'Story Problems',e:'📜',sub:'word problems within 20',\n warm:[['add20'],['sub20']],\n story:async()=\u003e{ await M('\u003cdiv class=\"row\" style=\"font-size:60px\"\u003e🌟\u003c/div\u003e'); await say('Math hides in stories! Listen carefully and ask: are we putting together, or taking apart?'); },\n movie:async()=\u003e{ await M('\u003cdiv class=\"row\"\u003e'+objs('🍎',12)+'\u003c/div\u003e'); await say('There are 12 apples. The children eat 5. How many are left? Eat means take away.'); const os=scene.querySelectorAll('.o'); for(let i=0;i\u003c5;i++){ os[11-i].classList.add('gone'); await wait(200); } await say('12 minus 5 is 7. Seven apples left!');\n   await M('\u003cdiv class=\"row\"\u003e'+objs('📖',9)+'\u003cspan class=\"plus\"\u003evs\u003c/span\u003e'+objs('📖',6)+'\u003c/div\u003e'); await say('Moishy read 9 pages, Yossi read 6. How many MORE did Moishy read? Compare: 9 minus 6 is 3.'); },\n together:[['story1'],['story1'],['story1']],\n practice:[['story1'],['add20'],['sub20'],['story1'],['missing20'],['story1'],['blocks'],['story1']],\n real:['story1',{intro:'Real stories from our school day!'}],\n check:[['story1'],['story1'],['story1']]},\n{id:'MATH.PV.L02.01',t:'Tens and Ones',e:'🟦',sub:'tens and ones',\n warm:[['teen'],['tens']],\n story:async()=\u003e{ await M(rodsH(3,4)); await say('A rod is ten blocks stuck together. With rods and ones we can build any number!'); },\n movie:async()=\u003e{ await M(rodsH(2,0)+'\u003cdiv class=\"row\"\u003e\u003cspan class=\"big-num\"\u003e20\u003c/span\u003e\u003c/div\u003e'); await say('Two rods: 10, 20.'); await M(rodsH(2,5)+'\u003cdiv class=\"row\"\u003e\u003cspan class=\"big-num\"\u003e25\u003c/span\u003e\u003c/div\u003e'); await say('Add 5 ones: 21, 22, 23, 24, 25. 2 tens and 5 ones is 25. The 2 means two tens. The 5 means five ones.'); },\n together:[['tensOnes'],['buildTO'],['tensOnes']],\n practice:[['tensOnes'],['buildTO'],['tensObjects'],['teenSplit'],['tensOnes'],['buildTO'],['rowgap',{dlo:1,dhi:8}],['tensOnes']],\n real:['tensOnes',{intro:'Tzedakah coins: rolls of ten and single coins. How many?'}],\n check:[['tensOnes'],['buildTO'],['tensOnes']]},\n{id:'MATH.PV.L02.02',t:'Alligator Signs',e:'🐊',sub:'compare two-digit numbers',\n warm:[['moreNum'],['tensOnes']],\n story:a c/button\u003e').join('')+'\u003c/div\u003e');\n  await say('Which sign goes in the middle?'); return new Promise(res=\u003e{ let first=true; scene.querySelectorAll('.ch').forEach(bt=\u003ebt.onclick=async()=\u003e{ if(BUSY) return; if(bt.dataset.v===ok){ bt.classList.add('yes'); scene.querySelector('.sign').textContent=ok; chime(); lockAll(); res(first); } else { first=false; bt.classList.add('no'); soft(); await wrongHelp(help); } }); }); }\nfunction choiceText(opts,ok,prompt,help,pre){ view((pre||'')+'\u003cdiv class=\"choices\"\u003e'+opts.map(o=\u003e'\u003cbutton class=\"ch wide\" type=\"button\" data-v=\"'+o+'\"'+(o===ok?' data-ok=\"1\"':'')+'\u003e'+o+'\u003c/button\u003e').join('')+'\u003c/div\u003e'); return say(prompt).then(()=\u003enew Promise(res=\u003e{ let first=true; scene.querySelectorAll('.ch').forEach(bt=\u003ebt.onclick=async()=\u003e{ if(BUSY) return; if(bt.dataset.v===ok){ bt.classList.add('yes'); chime(); lockAll(); res(first); } else { first=false; bt.classList.add('no'); soft(); await wrongHelp(help); } }); })); }\nG.flash=async c=\u003e{ let f=true; const n=c.n||3; for(let i=0;i\u003cn;i++){ const add=Math.random()\u003c.5, a=add?R(2,9):R(11,18), b=add?R(2,9):R(2,a-9\u003e2?9:a-2), ans=add?a+b:a-b;\n    const ok=await numQ('\u003cdiv class=\"row\"\u003e'+O('⚡')+'\u003cspan class=\"note\" style=\"font-size:18px\"\u003e'+(i+1)+' of '+n+'\u003c/span\u003e\u003c/div\u003e'+eqH(a,add?'+':'−',b,ans,true),i?'Next!':'Fact Flash! Answer fast.',ans,{lo:0,hi:20,help:async()=\u003e{ await say(add?(a+' plus '+b+'. Make ten or use a double.'):(a+' minus '+b+'. Think: '+b+' plus what makes '+a+'?')); }}); if(!ok) f=false; }\n  return [f,'Fast facts!']; };\nG.oddEven=async c=\u003e{ const n=c.n||R(3,16), pic=MODE!=='check'; const pairs=Math.floor(n/2); const html=pic?'\u003cdiv class=\"row\" style=\"gap:12px\"\u003e'+Array.from({length:pairs},()=\u003e'\u003cspan style=\"display:inline-flex;flex-direction:column;gap:2px\"\u003e'+O('🧦','sm')+O('🧦','sm')+'\u
