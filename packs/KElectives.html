function me(){ try{ const st=A.st; if(!st||(ME&&ME.sid===st.id)) return; const sid=st.id; ME={sid:sid,grade:null};
  if(typeof run!=='function'||typeof SRV==='undefined'||!SRV.token) return;
  run('klMe',SRV.token).then(r=>{ if(!ME||ME.sid!==sid) return; ME={sid:sid,grade:(r&&typeof r.grade==='number')?r.grade:null}; try{ if(A.view==='hub'&&A.st&&A.st.id===sid&&on(A.st)) render(); }catch(e){} }).catch(()=>{}); }catch(e){} }
function doneMap(st){ const m={}; try{ const k=st&&st.kel; if(k&&typeof k==='object') IDS.forEach(id=>{ if(typeof k[id]==='number') m[id]=k[id]; }); }catch(e){} return m; }
try{ if(!document.getElementById('kel-css')){ const s=document.createElement('style'); s.id='kel-css'; s.textContent=`
.kelcard{margin:14px 0;border-radius:24px;background:linear-gradient(135deg,#FFF6D8,#E8F6FF);border:3px solid #FFC83D;display:flex;align-items:center;gap:16px;padding:16px 20px;color:#1F2A44;box-shadow:0 6px 0 #EADFB8}
.kelcard .ki{font-size:46px}.kelcard .kt{flex:1}.kelcard b{display:block;font-size:24px}.kelcard small{font-size:16px;opacity:.85}
.kelcard button{border:0;border-radius:18px;padding:14px 24px;font:inherit;font-weight:900;font-size:22px;background:#2FBF71;color:#fff;cursor:pointer;min-height:60px;box-shadow:0 5px 0 #1f8a51}
.kelov{position:fixed;inset:0;z-index:2147483000;background:#FFF6D8;display:flex;flex-direction:column}
.kelov .kelbar{display:flex;justify-content:flex-end;padding:6px 10px;background:#FFF6D8}
.kelov .kelxx{border:0;border-radius:14px;padding:10px 18px;font:inherit;font-weight:900;font-size:18px;background:#1F2A44;color:#fff;cursor:pointer;min-height:48px}
.kelov iframe{flex:1;width:100%;border:0;background:#E8F6FF}`; document.head.appendChild(s); } }catch(e){}
const _find=window.tlFindLevelCard;
window.tlFindLevelCard=function(st){ let h=''; try{ h=_find?_find(st):''; }catch(e){}
  try{ me(); if(st&&A.view==='hub'&&on(st)){ const d=doneMap(st), n=Object.keys(d).length;
    h+='<section class="kelcard" data-kelcard="1"><span class="ki" aria-hidden="true">🎨</span><span class="kt"><b>Think, Talk, Sing and Draw</b><small>40 lessons: logic puzzles, speaking and listening, music and art.'+(n?' You finished '+n+' of 40.':'')+'</small></span><button type="button" data-kel="open">Play</button></section>'; } }catch(e){}
  return h; };
function open(id){ close(true); const st=A&&A.st; const ov=document.createElement('div'); ov.className='kelov'; ov.id='kelov';
  ov.innerHTML='<div class="kelbar"><button class="kelxx" type="button" data-kel="close" aria-label="Close Think, Talk, Sing and Draw">✕ Done</button></div><iframe title="Think, Talk, Sing and Draw" sandbox="allow-scripts" allow="autoplay"></iframe>';
  document.body.appendChild(ov);
  const pre='\u003cscript>window.KL_DONE='+JSON.stringify(doneMap(st))+';window.KL_OPEN='+JSON.stringify(IDS.indexOf(id)>=0?id:'')+';'+(window.KL_FAST?'window.KL_FAST=1;':'')+'\u003c/scr'+'ipt>';
  ov.querySelector('iframe').srcdoc=pre+PAGE; }
function close(quiet){ const o=document.getElementById('kelov'); if(o) o.remove(); if(quiet) return; try{ if(qT){ clearTimeout(qT); qT=null; if(A.st&&typeof saveStudent==='function') saveStudent(A.st); } }catch(e){} try{ if(A.view==='hub') render(); }catch(e){} }
document.addEventListener('click',e=>{ const b=e.target&&e.target.closest&&e.target.closest('[data-kel]'); if(!b) return; const k=b.getAttribute('data-kel'); if(k==='open'){ e.preventDefault(); open(''); } else if(k==='close'){ e.preventDefault(); close(); } });
window.addEventListener('message',e=>{ try{ const d=e.data; if(!d||typeof d!=='object'||(d.tlK!==1&&d.tlKDone!==1)) return;
  const f=document.querySelector('#kelov iframe'); if(!f||e.source!==f.contentWindow) return;
  if(typeof A==='undefined'||!A.st||typeof saveStudent!=='function'||typeof SRV==='undefined') return;
  const skill=String(d.skill||''); if(IDS.indexOf(skill)<0) return;
  if(d.tlK===1){ const item=String(d.item||'').replace(/[^A-Za-z0-9 ()-]/g,'').slice(0,60)||'item', ph=d.phase==='check'?'check':'practice', first=!!d.first;
    SRV.pendingEv.push({at:Date.now(),student:A.st.id,skill:'KLESSON.'+skill,phase:ph,item:item,first:first,tries:first?1:2,hints:0,ms:0,ok:true});
    if(SRV.pendingEv.length>50) SRV.pendingEv.splice(0,SRV.pendingEv.length-50); }
  else { const ok=Math.max(0,Math.min(3,Math.round(Number(d.ok)||0))); const st=A.st; if(!st.kel||typeof st.kel!=='object') st.kel={}; st.kel[skill]=Math.max(Number(st.kel[skill])||0,ok); }
  clearTimeout(qT); qT=setTimeout(()=>{ qT=null; try{ saveStudent(A.st); }catch(x){} },2500);
}catch(err){ console.error('electives',err); } });
window.KEL={ has:id=>IDS.indexOf(String(id))>=0, open:id=>open(String(id||'')), list:()=>LIST.slice(), on:()=>{ try{ return on(A.st); }catch(e){ return false; } } };
})();
</script>
