\u003e'+['\u003c','=','\u003e'].map(s=\u003e'\u003cbutton class=\"ch\" type=\"button\" data-v=\"'+s+'\"'+(s===ok?' data-ok=\"1\"':'')+'\u003e'+s+'\u003c/button\u003e').join('')+'\u003c/div\u003e\u003cdiv class=\"note\" style=\"font-size:16px\"\u003e🐊 The alligator’s mouth eats the bigger number.\u003c/div\u003e');\n  await say('Which sign goes in the middle? The alligator’s mouth opens to the bigger number.'); const f=await new Promise(res=\u003e{ let first=true; scene.querySelectorAll('.ch').forEach(bt=\u003ebt.onclick=async()=\u003e{ if(BUSY) return; if(bt.dataset.v===ok){ bt.classList.add('yes'); scene.querySelector('.sign').textContent=ok; chime(); lockAll(); res(first); } else { first=false; bt.classList.add('no'); soft(); await wrongHelp(async()=\u003esay('Compare the tens first: '+Math.floor(a/10)+' tens and '+Math.floor(b/10)+' tens.'+(Math.floor(a/10)===Math.floor(b/10)?' Same tens, so compare the ones.':''))); } }); });\n  return [f,a+' '+(ok==='\u003e'?'is greater than':ok==='\u003c'?'is less than':'equals')+' '+b+'.']; };\nfunction chartH(hi,id){ const start=Math.max(1,Math.floor((hi-1)/10)*10-29); let h='\u003cdiv class=\"tiles\" id=\"'+(id||'hc')+'\" style=\"max-width:600px\"\u003e'; for(let v=start;v\u003cstart+50\u0026\u0026v\u003c=100;v++) h+='\u003cdiv class=\"tile\" data-v=\"'+v+'\" style=\"width:48px;height:40px;font-size:18px\"\u003e'+v+'\u003c/div\u003e'; return h+'\u003c/div\u003e'; }\nG.jump10=async c=\u003e{ const up=Math.random()\u003c.5, n=up?R(11,89):R(11,89), ans=up?n+10:n-10; const f=await numQ(chartH(Math.max(n,ans)+10),(up?'10 more than ':'10 less than ')+n+'?',ans,{lo:Math.max(0,ans-12),hi:ans+12,extra:[up?n+1:n-1,ans+(up?10:-10)],help:async()=\u003e{ const t=scene.querySelector('[data-v=\"'+n+'\"]'); if(t) t.classList.add('hl'); await say('On the chart, '+(up?'10 more is one row down':'10 less is one row up')+'. The tens change, the ones stay the same.'); const u=scene.querySelector('[data-v=\"'+ans+'\"]'); if(u) u.classList.add('hl data-v=\"34\"]'); if(a) a.classList.add('hl'); await say('Start at 34.'); const b=scene.querySelector('[data-v=\"44\"]'); if(b) b.classList.add('hl'); await say('Jump down one row: 44. That is 10 more. The tens went up, the ones stayed 4.'); const d=scene.querySelector('[data-v=\"24\"]'); if(d) d.classList.add('hl'); await say('Jump up one row from 34: 24. That is 10 less.'); },\n together:[['jump10'],['jump10'],['tensOnes']],\n practice:[['jump10'],['tensOnes'],['alligator'],['jump10'],['rowgap',{dlo:2,dhi:9}],['jump10'],['addTens'],['jump10']],\n real:['jump10',{intro:'Each day we learn 10 more pesukim. Yesterday we were at pasuk 23.'}],\n check:[['jump10'],['jump10'],['jump10']]},\n{id:'MATH.OPS.L02.10',t:'Add Tens',e:'➕🟦',sub:'add tens or ones to a two-digit number',\n warm:[['jump10'],['tensOnes']],\n story:async()=\u003e{ await M(rodsH(3,4)+eqH(34,'+',20,54,true)); await say('Adding big numbers is easy when you add tens to tens and ones to ones!'); },\n movie:async()=\u003e{ await M(rodsH(3,4)+eqH(34,'+',20,54,true)); await say('34 plus 20. Add 2 more rods: 3 tens and 2 tens is 5 tens. The 4 ones stay. 54!'); await M(rodsH(4,2)+eqH(42,'+',5,47,true)); await say('42 plus 5. Add 5 ones to the 2 ones: 7 ones. The 4 tens stay. 47!'); },\n together:[['addTens'],['addTens'],['jump10']],\n practice:[['addTens'],['jump10'],['tensOnes'],['addTens'],['buildTO'],['addTens'],['alligator'],['addTens']],\n real:['addTens',{intro:'The library has shelves of seforim. Add the new ones!'}],\n check:[['addTens'],['addTens'],['addTens']]},\n{id:'MATH.OPS.L02.11',t:'Take Tens',e:'➖🟦',sub:'subtract multiples of 10',\n warm:[['tens'],['jump10']],\n story:async()=\u003e{ await M(rodsH(7,0)); await say('7 rods is 70. What if we take some rods away?'); },\n movie:async()=\u003e{ await M(rodsH(7,0,'mv')+eqH(70,'−',30,40,true)); await say('70 minus 30. Take away 3 rods.'); const rs=scene.querySelectorAll('#mv .rod'); for(let i=0;i\u003c3;i++){ rs[6-i].style.opacity='.15'; await wait(300)
