k.'],['🐦','Birds have feathers and lay eggs.'],['🐢','Reptiles have dry scales. Amphibians, like frogs, live in water and on land.']],{real:'Sort the animals at the nature center.'}),\nmkS('SCI.ANIM.L03.01','Insects: Six Legs','🐜','insects and their parts','insects','variety',['🐜🐝🦋','Gavriel counts the legs on an ant: one, two, three, four, five, six! Every insect has six legs.'],\n [['🐜','Insects have six legs.'],['3️⃣','Insects have three body parts.'],['🕷️','A spider has eight legs, so it is not an insect.']],{real:'You are a bug detective in the yard.'}),\nmkS('SCI.ANIM.L03.02','Birds and Eggs','🪺','how birds hatch and grow','birds','insects',['🪺🥚','A mother bird sits on her eggs to keep them warm. One day: crack! A chick hatches out.'],\n [['🥚','All birds lay eggs.'],['🐣','Chicks hatch from the eggs.'],['🪶','All birds have feathers, but not all birds can fly.']],{real:'You see a nest in a tree.'}),\nmkS('SCI.ANIM.L03.03','Animals in Winter','🐻','sleep, migrate or adapt','winter','birds',['❄️🐻🦆','Winter is coming! The bear finds a den. The ducks fly south. The squirrel has a pantry full of nuts.'],\n [['😴','Some animals hibernate: they sleep all winter.'],['✈️','Some animals migrate to warmer places.'],['🧥','Some grow thick fur and stay.']],{real:'You are walking in the winter woods.'}),\nmkS('SCI.LIFE.L03.01','Seeds and Pollinators','🐝','bees help flowers make seeds','pollen','winter',['🐝🌸🍯','Buzz! A bee drinks nectar from a flower. Pollen sticks to its legs and it carries it to the next flower.'],\n [['🐝','Bees carry pollen from flower to flower.'],['🌸','Then the flower can make seeds and fruit.'],['🍯','Bees also make honey. Honey is kosher!']],{real:'You are visiting an orchard.'}),\nmkS('SCI.PLANT.L03.01','How Seeds Travel','🌬️','wind, water and animals','seedtravel','pollen',['🌼🌬️','Nissim blows on a dandelion. Whoosh! The seeds float away on tiny parachutes to grow somewhere new.'],\n [['🌬️','Some seeds fly on the wind.'],['🌊','Some float on water.'],['🐿️',
