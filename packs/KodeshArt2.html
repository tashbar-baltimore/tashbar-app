ַפֵּרוֹת עַד שֶׁיֵּצֵא הַשָּׁעַר.","(יָצָא הַשַּׁעַר, פּוֹסְקִין, וְאַף עַל פִּי שֶׁאֵין לָזֶה יֵשׁ לָזֶה).","הָיָה הוּא תְחִלָּה לַקּוֹצְרִים, פּוֹסֵק עִמּוֹ עַל הַגָּדִישׁ, וְעַל הֶעָבִיט שֶׁל עֲנָבִים, וְעַל הַמַּעֲטָן שֶׁל זֵיתִים, וְעַל הַבֵּיצִים שֶׁל יוֹצֵר, וְעַל הַסִּיד מִשֶּׁשִּׁקְּעוֹ בַכִּבְשָׁן.","וּפוֹסֵק עִמּוֹ עַל הַזֶּבֶל כָּל יְמוֹת הַשָּׁנָה.","רַבִּי יוֹסֵי אוֹמֵר, אֵין פּוֹסְקִין עַל הַזֶּבֶל אֶלָּא אִם כֵּן הָיְתָה לּוֹ זֶבֶל בָּאַשְׁפָּה.","וַחֲכָמִים מַתִּירִין.","וּפוֹסֵק עִמּוֹ כְשַׁעַר הַגָּבוֹהַּ.","רַבִּי יְהוּדָה אוֹמֵר, אַף עַל פִּי שֶׁלֹּא פָסַק עִמּוֹ כְשַׁעַר הַגָּבוֹהַּ, יָכוֹל לוֹמַר תֶּן לִי כָזֶה, אוֹ תֶּן לִי מְעוֹתָי"],"ref":"Mishnah Bava Metzia 5:7","heref":"","ver":"Torat Emet 357","lic":"Public Domain","B":["הָיָה הוּא תְּחִלָּה לַקּוֹצְרִים. וְיֵשׁ לוֹ גָּדִישׁ וַעֲדַיִן לֹא יָצָא הַשָּׁעַר","פּוֹסֵק עִמּוֹ. בְּאֵיזֶה שַׁעַר שֶׁיִּרְצֶה, דְּכֵיוָן דְּיֵשׁ לוֹ אֵין כָּאן רִבִּית, דְּמֵעַכְשָׁיו אוֹתוֹ גָּדִישׁ קָנוּי לוֹ. וְאַף עַל גַּב דְּלֹא מָשַׁךְ, כֵּיוָן דְּכִי אֵין לוֹ נַמִּי לֹא הֲוָה אֶלָּא אֲבַק רִבִּית דְּרַבָּנָן, כִּי יֵשׁ לוֹ לֹא גָּזוּר","עַל הֶעָבִיט. כְּלִי גָּדוֹל שֶׁצּוֹבְרִים בּוֹ אֶת הָעֲנָבִים לִפְנֵי דְרִיכָה וְהֵם מִתְחַמְּמִים לְהוֹצִיא יֵינָם יָפֶה. וְשֶׁל זֵיתִים קָרוּי מַעֲטָן","עַל הַבֵּיצִים שֶׁל יוֹצֵר. אִם הִכְנִיס עָפָר וַעֲשָׂאוֹ בֵּיצִים לַעֲשׂוֹת מֵהֶן קְדֵרוֹת, פּוֹסֵק עִמּוֹ עַל הַקְּדֵרוֹת בְּאֵיזֶה שַׁעַר שֶׁיִּרְצֶה, וְאַף עַל פִּי שֶׁלֹּא יָצָא הַשָּׁעַר","וְעַל הַסִּיד. פּוֹסֵק עִמּוֹ בְּאֵיזֶה שַׁעַר שֶׁיִּרְצֶה מִשֶּׁיְּשַׁקְּעֶנּוּ בְּכִבְשָׁן הָעֵצִים וְהָאֲבָנִים לִשְׂרֹף וְלַעֲשׂוֹת מֵהֶן סִיד","וַחֲכָמִים מַתִּירִין. אִיכָּא בֵּין חֲכָמִים לְתַנָּא קַמָּא, דְּתַנָּא קַמָּא כָּל יְמוֹת הַשָּׁנָה קָאָמַר. וּפָלֵיג עֲלֵיהּ רַבִּי יוֹסֵי וְאָמַר לֹא שְׁנָא יְמוֹת הַחַמָּה וְלֹא שְׁנָא יְמוֹת הַגְּשָׁמִים, עַד שֶׁיִּהְיֶה לוֹ לְמוֹכֵר זֶבֶל בָּאַשְׁפּוֹת. וַחֲכָמִים מַתִּירִין דַּוְקָא בִּימוֹת הַחַמָּה, שֶׁאַף עַל פִּי שֶׁאֵין לוֹ, יֵשׁ לַאֲחֵרִים, שֶׁהַכֹּל יֵשׁ לָהֶן זֶבֶל, שׁ   var WHAT = {
    '7': 'One may not set a price on produce until {shaar} comes out. Once it is out, one may set a price even if this seller has none, because others have it. If he was first among the reapers, he may set a price on {gadish}, on {avit}, on {maatan}, on {beitzim}, and on {sid} once he sank it in {kivshan}. He may set a price on manure all year. {ryosei} says: only if he has manure in {ashpah}; and {chachamim} allow it. He may set the price {gavoah}, the cheapest of the year. {ryehudah} says: even without that condition, the buyer can say "give me like this, or give me {meosai}."',
    '8': 'A man may lend {arisav} wheat for wheat {lezera} (to sow), but not {leechol} (to eat). For {rg} used to lend his sharecroppers wheat for wheat to sow: whether he lent when it was expensive and it got cheaper, or when it was cheap and it got more expensive, he took it back at the cheap price. Not because that is the law, but because he wanted {lehachmir} (to be strict) on himself.'
  };
  var ICON = { '7': 'board', '8': 'sack' };
  var BEN = {
    '7': [
      '"He was first among the reapers": he has a stack of grain, and the market price has not come out yet.',
      '"He may set a price with him" at any price he wants: since he has it, there is no {ribbis}, because from now that stack is bought for the buyer. And even though the buyer did not pull it (the act that makes it his), when the seller does not have it, it is only {avak} from the Rabbis; and when he has it, the Rabbis made no decree.',
      '"On the big vat": a big vessel where grapes are piled before they are trodden, so they warm up and give their wine well. For olives it is called {maatan}.',
      '"On the potter\'s clay balls": if he brought in earth and made it into balls to make pots, he may set a price with him on the pots at any price he wants, even though the market price has not come out.',
      '"And on the lime": he may set a price at any price he wants once he has sunk the wood and the stones into the kiln to burn them and make lime.',
      '"And the Sages allow": the Sages differ from the first, unnamed opinion. The first opinion says all the days of the year. {ryosei} disagrees and says: summer or rainy season, only if the seller has manure in the dung heaps. The Sages allow it only in the sunny season, because even if he has none, others have it: everyone has manure that rotted and broke down in the rainy season. But not in the rainy season. And the law is like the Sages.',
      '"At the high price": if the price drops below what it is now, you give me at the cheap price. "High" means cheap: one gives high piles of produce, many of them, for little money.',
      '"Give me like this, or give me my money": he did not pull it, so he can back out, and even the curse on one who backs out of a deal ("He Who punished...") does not apply, because he did not give the money to get the produce now but later, and meanwhile the price changed: a person usually means the cheap price. And the law is not like {ryehudah}.'
    ],
    '8': [
      '"Wheat for wheat, for seed": a {seah} for a {seah} is {mutar} to lend to {aris} only when he wants to sow it. The reason: where the sharecropper is the one who gives the seed, if he has no seed to sow the field, the owner would send him away. So when the sharecropper borrows from the owner and sows, and pays back wheat after wheat got expensive, this is not a loan. It is as if he goes into the field from now on the condition that the owner takes the seed first from the sharecropper\'s share, and the sharecropper takes the rest as pay for his work. On that condition he went in, to take less than other sharecroppers by the amount of the seed, and there is no {ribbis} here.',
      '"For {rg} was": that is, this is why {mishT} had to teach this: {rg} was strict, and if wheat got cheaper he took it back at the cheap price. The teaching tells us that this is not the law; he wanted {lehachmir} on himself.'
    ]

  /* ---------- the rules the models use (pure functions, tested) ---------- */
  /* 6:3 + 6:4 with Bartenura. job: 'walk' (donkey), 'plow' (cow), 'thresh' (cow).
     walk/plow: hired 'mt' or 'val', went the other one. thresh: hired 'beans' or 'grain', threshed the other.
     what (walk): 'slip' | 'heat' | 'climb' (overheated BECAUSE of the climb; only when he went up the mountain) | 'air' (died, not slipping, not heat).
     The question every time: did his change make it more likely? Yes -> liable; no -> exempt. */
  function routeRule(o) {
    if (o.job === 'walk') {
      if (o.what === 'air') return 'chayav';
      if (o.hired === 'mt') return o.what === 'slip' ? 'patur' : (o.what === 'heat' ? 'chayav' : null);
      return o.what === 'heat' ? 'patur' : 'chayav';           /* went up the mountain: slip or the climb -> liable */
    }
    if (o.job === 'plow') return o.hired === 'mt' ? 'patur' : 'chayav';
    if (o.job === 'thresh') return o.hired === 'beans' ? 'patur' : 'chayav';
    return null;
  }
  /* 6:3 middle + Bartenura on "harei shelcha lefanecha": got sick / taken for the king's work -> "here is yours" ONLY when he said
     "this donkey" AND it was hired for loads; riding, or "a donkey" -> he must give another animal. Died / broke a leg -> he must give a donkey. */
  function yoursRule(o) {
    if (o.what === 'died' || o.what === 'broke') return 'give';
    return (o.said === 'this' && o.use === 'load') ? 'yours' : 'give';
  }

     At the limit or more -> liable if it is hurt. Less -> exempt if it is hurt; he pays only for the extra hire (Bartenura). */
  function extraRule(o) { var lim = o.animal === 'camel' ? 1 : 3; return o.amt >= lim ? 'chayav' : 'patur'; }
