try{ if(typeof coreList==='function'){ const _cl=coreList; window.coreList=function(st,c){ if(c==='SS') return ((typeof tlWindow==='function'&&tlWindow(st,c))||[]).filter(id=>!HOLD(id)); return _cl(st,c); }; } }catch(e){}
try{ if(typeof tlPath==='function'){ const _tp=tlPath; window.tlPath=function(st,c){ const P=_tp(st,c); if(c!=='SS'||!P) return P; const Q=P.filter(id=>!HOLD(id)); return Q.length?Q:null; }; } }catch(e){} /* held skills never enter an SS window either */
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function done(st,id){ return !!(st&&st.skills&&st.skills[id]&&st.skills[id].m); }
function lvl(id){ const m=/\.L(\d\d)\./.exec(id); return m?+m[1]:0; }
try{ if(!document.getElementById('ss-css')){ const s=document.createElement('style'); s.id='ss-css'; s.textContent=`
.sspanel{margin:14px 0;border-radius:18px;background:#fff;border:2px solid #B45309;box-shadow:0 6px 18px rgba(180,83,9,.15);overflow:hidden;color:#1B2430}
.sspanel .sh{display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(135deg,#B45309,#0E7490);color:#fff}
.sspanel .sh b{font-size:20px}.sspanel .sh small{display:block;opacity:.92}.sspanel .si{font-size:30px}
.sspanel .sb{padding:12px 16px}.sspanel .snodes{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 10px}
.sspanel .lv{font-weight:800;color:#B45309;margin:2px 0 4px}.sspanel .mu{color:#55606E;margin:4px 0}
.ssnode{border:0;border-radius:14px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:48px}
.ssnode.done{background:#FDEBD3;color:#7C2D12}.ssnode.now{background:#B45309;color:#fff;box-shadow:0 0 0 4px rgba(14,116,144,.45)}.ssnode.locked{background:#EEF1F5;color:#8893A2;cursor:default}.ssnode.open{background:#E0F2F1;color:#0E5566}
.tlpic.ss-pre{white-space:pre-line;line-height:1.25}
.how .ss-hh{display:flex;align-items:center;gap:8px}.how .ss-hh .say{margin-left:auto}.how p.ss-exp{margin:4px 0 6px}
.fb.hint .say.ss-say{margin-left:8px;vertical-align:middle}`; document.head.appendChild(s); } }catch(e){}
/* placement: start index in ORDER (first skill at or above his placed Social Studies level); 0 when not placed */
function from(st){ try{ const p=st&&st.place&&(st.place.SS||st.place.SOC); const L=p&&+p.level; if(!L) return 0; const i=ORDER.findIndex(id=>lvl(id)>=L); return i<0?Math.max(0,ORDER.length-1):i; }catch(e){ return 0; } }
function panel(st){
 if(!st||!ORDER.length) return '';
 const f=from(st);
 const next=ORDER.slice(f).find(id=>!done(st,id));
 const at=next||ORDER[ORDER.length-1];
 const show=ORDER.slice(Math.max(0,ORDER.indexOf(at)-2)).slice(0,6);
 const nodes=show.map(id=>{ const s=done(st,id)?'done':id===next?'now':ORDER.indexOf(id)<f?'open':'locked'; return `<button class="ssnode ${s}" type="button" ${s==='locked'?'disabled':`data-ss="go" data-id="${id}"`} aria-label="${E(S[id].name)}${s==='done'?', mastered':s==='now'?', next':s==='open'?', open':', locked'}">${s==='done'?'✅':s==='now'?'▶':s==='open'?'📖':'🔒'} ${E(S[id].name)}</button>`; }).join('');
 return `<section class="sspanel"><div class="sh"><span class="si" aria-hidden="true">🗺️</span><div><b>Explorer Trail</b><small>Social Studies: maps, communities, history and government</small></div></div><div class="sb"><p class="lv">Social Studies Level ${lvl(at)}</p><div class="snodes">${nodes}</div><p class="mu">${next?`Next: <b>${E(S[next].name)}</b>`:'You finished every Social Studies lesson so far. More are coming!'}</p></div></section>`;
}
const _find=window.tlFindLevelCard;
window.tlFindLevelCard=function(st){ let h=''; try{ h=_find?_find(st):''; }catch(e){} try{ h+=panel(st); }catch(e){ console.error('SocialMore panel',e); } return h; };
document.addEventListener('click',function(e){
 const b=e.target.closest&&e.target.closest('[data-ss]'); if(!b) return;
 e.preventDefault(); e.stopPropagation();
 try{ if(b.dataset.ss==='go') return startMission('SS',b.dataset.id); }catch(err){ console.error('SocialMore',err); }
},true);
const sayBtn=(t,lab)=>`<button class="say ss-say" data-act="say" data-text="${E(t)}" aria-label="${lab}">🔊</button>`;
const J=a=>a.map(x=>String(x||'').trim()).filter(Boolean).map(x=>/[.!?:]$/.test(x)?x:x+'.').join(' ');
function flat(el){ return el?J(String(el.innerText||el.textContent||'').split(/\n+/)).replace(/\s+/g,' '):''; }
function pre(){ try{ if(typeof A==='undefined'||A.view!=='play'||!A.play||A.play.c!=='SS') return;
 document.querySelectorAll('.tlpic:not(.ss-pre)').forEach(el=>el.classList.add('ss-pre'));
 const p=A.play, it=p.items[p.i], card=document.querySelector('#app .qcard'); if(!card||!it) return;
 /* teach: keep the explanation ("how") on screen and read it + the How to do it steps aloud */
 const box=card.querySelector(':scope > .how:not(.ss-done)');
 if(box){ box.classList.add('ss-done'); const how=it.phase==='teach'&&typeof it.how==='string'?it.how:'';
  if(!box.querySelector('.say')){ const b=box.querySelector(':scope > b');
   if(how&&b&&box.textContent.indexOf(how)<0) b.insertAdjacentHTML('afterend',`<p class="ss-exp">${E(how)}</p>`);
   const steps=[...box.querySelectorAll('ol.htd li')].map(li=>li.textContent);
   const t=J([how].concat(steps))||flat(box);
   if(b){ const row=document.createElement('div'); row.className='ss-hh'; b.parentNode.insertBefore(row,b); row.appendChild(b); row.insertAdjacentHTML('beforeend',sayBtn(t,'Read the explanation aloud')); } } }
 /* re-teach after a miss: read it aloud too */
 card.querySelectorAll('.fb.hint').forEach(fb=>{ if(fb.querySelector('.ss-say')) return; const t=flat(fb); if(t) fb.insertAdjacentHTML('beforeend',sayBtn(t,'Read this aloud')); });
}catch(e){ console.error('SocialMore pre',e); } }
try{ new MutationObserver(pre).observe(document.documentElement,{childList:true,subtree:true}); }catch(e){}
window.TLSS_COUNT=ORDER.length;
})();
</script>
