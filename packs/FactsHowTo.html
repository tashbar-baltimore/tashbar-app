r on a sunny day?":"Cycle Circle!\nWet clothes on a line dry in the sun.\nWhere does water go when the sun heats it?\nNow tap it.","Dovid sees drops of water on the outside of his cold drink. Which step of the cycle is this like?":"Cycle Circle!\nSteam rising off hot soup is like evaporation.\nWarm air touched cold glass. What does cooling vapor do?\nNow tap it.","In the peg, which step is first?":"Cycle Circle!\nThe second step, Cloud, is condensation.\nSay the peg. What does Every stand for?\nNow tap it.","Clouds are made of:":"Cycle Circle!\nFog is a cloud near the ground.\nWhat does cooled vapor turn into?\nNow tap it.","Snow falling from a cloud is an example of:":"Cycle Circle!\nHail and rain also fall from clouds.\nSay the peg. Which step pours?\nNow tap it.","In the peg, Pours stands for:":"Cycle Circle!\nIn the peg, Cups stands for collection.\nPours starts with P. Which step starts with P?\nNow tap it.","Water goes up into the sky as:":"Cycle Circle!\nWater comes down as rain or snow.\nWhat invisible gas does heated water become?\nNow tap it.","Heating liquid water turns it into:":"Cycle Circle!\nCooling liquid water a lot turns it into ice.\nWhat happens to a pot of water that boils?\nNow tap it."},"s":"Ride the Cycle Circle.\nSay: Every Cloud Pours Cups.\nEvaporation, condensation, precipitation, collection."},"ELEC.FUSA.L06.01":{"q":{"Which number President was Abraham Lincoln?":"President Line-Up!\nThomas Jefferson was the 3rd President.\nSay the peg. Which number goes with Lincoln?\nNow tap it.","Which war did Lincoln lead the country through?":"President Line-Up!\nWashington led the army in the Revolutionary War.\nWhich war split the North and the South?\nNow tap it.","What did Jefferson buy from France in 1803?":"President Line-Up!\nAlaska was bought from Russia in 1867.\nListen again: which land doubled the country?\nNow tap it.","Which President is called the Father of His Country?":"President Line-Up!\nLincoln is remembered for keeping the country together.\nSay the peg. Who was number 1?\nNow tap it.","Which President was elected four times?":"President Line-Up!\nToday a President may serve only two terms.\nWho led during the Great Depression and World War II?\nNow tap it.","Put these Presidents in order by number: Lincoln, Washington, Jefferson.":"President Line-Up!\nSeasons go in order: winter, spring, summer.\nSay the peg. Who is number 1?\nTap them in order.","Jefferson was the 3rd President and Lincoln was the 16th. How many Presidents came in between them?":"President Line-Up!\nBetween the 1st and the 5th are three: 2nd, 3rd, 4th.\nList the numbers after 3, stopping before 16.\nType the number.","Which President loved nature and set aside land for national parks?":"President Line-Up!\nHis cousin Franklin served later.\nWhich President is the teddy bear named after?\nNow tap it.","A famous speech starts, \"Four score and seven years ago.\" Who gave it?":"President Line-Up!\nJefferson wrote the Declaration of Independence.\nThis speech came during the Civil War. Who led then?\nNow tap it.","Who was the 3rd President?":"President Line-Up!\nLincoln was the 16th President.\nSay the peg. Who is number 3?\nNow tap it.","Which President led during the Civil War?":"President Line-Up!\nWashington led the army in the Revolution.\nWho kept the country together from 1861 to 1865?\nNow tap it.","Who was the 1st President?":"President Line-Up!\nJohn Adams was the 2nd President.\nSay the peg. Who is number 1?\nNow tap it.","In the peg, who is number 3?":"President Line-Up!\nIn the peg, number 16 is Lincoln.\nSay the peg. Stop at number 3.\nNow tap it.","Whose face is on the one-dollar bill?":"President Line-Up!\nLincoln is on the five-dollar bill and the penny.\nNumber 1 President, $1 bill. Who?\nNow tap it.","How often is a President elected?":"President Line-Up!\nA senator is elected every 6 years.\nListen again: how many years did the lesson say?\nNow tap it."},"s":"Get the President Line-Up.\nSay: number 1 Washington, number 3 Jefferson, number 16 Lincoln."},"ELEC.FPAST.L06.01":{"q":{"What did Gutenberg's invention make?":"Invention Timeline!\nWatt's improved engine ran on steam.\nSay the peg. What did Gutenberg do?\nNow tap it.","What did James Watt improve?":"Invention Timeline!\nMorse made a code of dots and dashes.\nSay the peg. What did Watt do?\nNow tap it.","What was Morse code made of?":"Invention Timeline!\nBraille uses raised bumps you can feel.\nSay the peg. Morse tapped. What did he tap?\nNow tap it.","Who made cars cheap with the moving assembly line in 1913?":"Invention Timeline!\nWatt improved the steam engine.\nSay the peg. Who built?\nNow tap it.","Why was the printing press so important?":"Invention Timeline!\nThe light bulb let people work after dark.\nWhat happens when books cost less?\nNow tap it.","Put the inventions in time order: Ford's assembly line, Gutenberg's press, Morse's telegraph, Watt's steam engine.":"Invention Timeline!\nColumbus in 1492 came before Lincoln in 1861.\nSay the peg. Who comes first?\nTap them in order.","Morse's telegraph message was in 1844. Ford's assembly line was in 1913. How many years apart are they?":"Invention Timeline!\nFrom 1800 to 1850 is 50 years.\nTake 1844 away from 1913.\nType the number.","What did steam engines power?":"Invention Timeline!\nElectricity powers light bulbs.\nThink of the big machines of the 1800s.\nNow tap it.","A message comes: dot-dot-dot, dash-dash-dash, dot-dot-dot. Whose invention is this?":"Invention Timeline!\nA moving line building cars is Ford's idea.\nDots and dashes. Say the peg.\nNow tap it.","Who invented the printing press with movable type?":"Invention Timeline!\nMorse invented the telegraph code.\nSay the peg. Who printed?\nNow tap it.","Henry Ford is famous for:":"Invention Timeline!\nGutenberg is famous for printing.\nSay the peg. What did Ford do?\nNow tap it.","Which invention sent messages over wires with dots and dashes?":"Invention Timeline!\nThe printing press made many copies of books.\nSay the peg. Who tapped? What did he use?\nNow tap it.","In the peg, who tapped?":"Invention Timeline!\nIn the peg, Watt steamed.\nTap the table. Which name goes with tapping?\nNow tap it.","Before the printing press, books were:":"Invention Timeline!\nBefore the car, people traveled by horse.\nWhat did people do before printing machines?\nNow tap it.","What does an invention do?":"Invention Timeline!\nA recipe tells you how to cook a dish.\nWhy do inventors build new machines?\nNow tap it."},"s":"Build the Invention Timeline.\nSay: Gutenberg printed, Watt steamed, Morse tapped, Ford built."},"ELEC.FTECH.L06.01":{"q":{"How many simple machines are there?":"Machine Spotter!\nThere are eight planets.\nSay the peg and count the machines.\nNow tap it.","A seesaw is which simple machine?":"Machine Spotter!\nA flagpole rope uses a pulley.\nA bar rocks on a fulcrum. Say the peg.\nNow tap it.","An axe that splits wood is which simple machine?":"Machine Spotter!\nA jar lid that twists on is a screw.\nSay the peg. Which one splits?\nNow tap it.","A rope over a wheel that helps lift a flag up a pole is:":"Machine Spotter!\nA seesaw is a lever.\nSay the peg. Which one pulls?\nNow tap it.","A ramp that helps move a heavy box into a truck is also called:":"Machine Spotter!\nA slide at the park is a slope too.\nWhat is the science name for a ramp?\nNow tap it.","Put the steps in order to lift a rock with a lever: push down on the bar, slide the bar under the rock, put a log under the bar.":"Machine Spotter!\nTo ride a seesaw, sit down, then push off.\nWhat must be in place before you push?\nTap them in order.","Count the simple machines in this list: lever, apple, pulley, ramp, pillow, screw.":"Machine Spotter!\nIn wedge, book and wheel, two are machines.\nCheck each word against the peg.\nType the number.","A screw is really which simple machine wrapped around a rod?":"Machine Spotter!\nA wedge is two slopes back to back.\nThe threads slant like a slope going around.\nNow tap it.","Chaim turns a doorknob to open the latch. Which simple machine is a doorknob?":"Machine Spotter!\nA steering wheel turns a rod too.\nA big round knob turns a thin rod. Say the peg.\nNow tap it.","Which simple machine splits things apart?":"Machine Spotter!\nA pulley lifts loads with a rope.\nSay the peg. Which one splits?\nNow tap it.","A jar lid that twists on uses which simple machine?":"Machine Spotter!\nA doorknob is a wheel and axle.\nSay the peg. Which one twists?\nNow tap it.","Why do we use simple machines?":"Machine Spotter!\nA wagon helps carry heavy toys.\nIs lifting easier with a lever or without?\nNow tap it.","In the peg, what does the wedge do?":"Machine Spotter!\nIn the peg, the screw twists.\nSay the peg. Stop at wedge.\nNow tap it.","Which is easier: rolling a heavy barrel up a ramp, or lifting it straight up?":"Machine Spotter!\nWalking up a gentle hill is easier than climbing a wall.\nWhich way needs less force at a time?\nNow tap it.","In science, work means:":"Machine Spotter!\nEnergy is what lets you do work.\nPushing a cart across the room is work. What happened?\nNow tap it."},"s":"Be a Machine Spotter.\nSay: lever lifts, pulley pulls, ramp rolls, wedge splits, screw twists, wheel turns."},"ELEC.FNUM.L06.01":{"q":{"What number is X?":"Roman Ruler!\nV stands for 5.\nSay the peg. Which number is third?\nNow tap it.","What number is VII?":"Roman Ruler!\nXI is 10 + 1, which is 11.\nAdd the letters: V, then I, then I.\nNow tap it.","What number is IV?":"Roman Ruler!\nXL is 50 minus 10, which is 40.\nThe small letter is first, so subtract it.\nNow tap it.","What number is C?":"Roman Ruler!\nL stands for 50.\nSay the peg. Which number goes with C?\nNow tap it.","Put these Roman numerals in order from smallest to biggest: X, M, V, C, L.":"Roman Ruler!\n1, 10, 100 go from small to big.\nSay the peg in order. Match each letter.\nTap them in order.","What number is XXIII?":"Roman Ruler!\nXII is 10 + 1 + 1, which is 12.\nAdd each letter from left to right.\nType the number.","How do you write 9 in Roman numerals?":"Roman Ruler!\n4 is written with I before V.\nPut the 1 letter before the 10 letter.\nNow tap it.","What number is MD?":"Roman Ruler!\nMC is 1000 + 100, which is 1100.\nAdd M and D.\nType the number.","A building's cornerstone says MCMLX for its year. M is 1000, CM is 900, LX is 60. What year is it?":"Roman Ruler!\nMM is 2000, and MMV is 2005.\nAdd 1000, then 900, then 60.\nNow tap it.","What number is L?":"Roman Ruler!\nD stands for 500.\nSay the peg. Which number is fourth?\nNow tap it.","What number is XIV?":"Roman Ruler!\nXVI is 10 + 5 + 1, which is 16.\nX first. Then the I before V means subtract.\nNow tap it.","What number is M?":"Roman Ruler!\nC stands for 100.\nSay the peg. Which number is last?\nNow tap it.","In the peg, which letter stands for 500?":"Roman Ruler!\nIn the peg, Cows stands for 100.\nSay the peg. Which word comes right before Milk?\nNow tap it.","What number is III?":"Roman Ruler!\nII is 1 + 1, which is 2.\nAdd up each I.\nNow tap it.","Roman numerals use:":"Roman Ruler!\nMorse code uses dots and dashes.\nWhat are I, V and X?\nNow tap it."},"s":"Use the Roman Ruler.\nSay: I Value Xylophones Like Cows Do Milk.\nAdd the letters.\nA smaller one before a bigger one subtracts."},"ELEC.FWORLD.L07.01":{"q":{"What is the line of latitude at 0 degrees, around the middle of the Earth?":"Grid Guide!\nThe North Pole is at 90 degrees north.\nWhich line circles the middle, halfway between the poles?\nNow tap it.","Through which country does the prime meridian pass, at Greenwich?":"Grid Guide!\nThe equator passes through Brazil and Kenya.\nListen again: which town and country did the lesson name?\nNow tap it.","The United States is in which two hemispheres?":"Grid Guide!\nAustralia is in the Southern and Eastern Hemispheres.\nIs the U.S. north of the equator? West of Greenwich?\nNow tap it.","Lines of latitude run:":"Grid Guide!\nLongitude lines meet at the North and South Poles.\nSay the peg. Which way is flat?\nNow tap it.","What is the latitude of the North Pole?":"Grid Guide!\nThe equator sits at the start of latitude.\nLatitude counts up from the equator. How far up is the top?\nNow tap it.","Put these places in order from north to south: the equator, the North Pole, the South Pole, Baltimore.":"Grid Guide!\nCanada is north of Mexico.\nStart at the very top of the globe.\nTap them in order.","Latitude goes from 0 degrees at the equator to how many degrees at each pole?":"Grid Guide!\nA full circle is 360 degrees; half is 180.\nDivide a full circle, 360, by four.\nType the number.","Which hemisphere is Australia in, north or south of the equator?":"Grid Guide!\nCanada is far above the equator.\nOn a globe, is Australia above or below the middle line?\nNow tap it.","A ship's map says 0 degrees latitude. Where is the ship?":"Grid Guide!\nAt 0 degrees longitude, you are on the prime meridian.\nWhich line of latitude is at 0 degrees?\nNow tap it.","Lines that run from the North Pole to the South Pole are lines of:":"Grid Guide!\nLines like ladder rungs run east and west.\nSay the peg. Which one runs pole to pole?\nNow tap it.","The equator divides Earth into:":"Grid Guide!\nThe prime meridian makes the East and West halves.\nWhich halves are above and below the middle line?\nNow tap it.","What is at 0 degrees longitude?":"Grid Guide!\nThe equator is at 0 degrees latitude.\nWhich line runs through Greenwich, England?\nNow tap it.","In the peg, which lines are flat like a ladder?":"Grid Guide!\nIn the peg, longitude runs pole to pole.\nSay the peg. Which word starts it?\nNow tap it.","Places near the equator are usually:":"Grid Guide!\nPlaces near the poles stay cold most of the year.\nThe sun shines straight down at the middle. What does that do?\nNow tap it.","What do you get where two grid lines cross?":"Grid Guide!\nOn a chessboard, e4 names one square.\nWhere a row meets a column, what do you find?\nNow tap it."},"s":"Use the Grid Guide.\nSay: latitude is flat like a ladder; longitude is long from pole to pole.\nFind where they cross."},"ELEC.FNATURE.L07.01":{"q":{"Which layer of Earth do we live on?":"Layer Peel!\nThe deepest layer is the inner core.\nSay the peg. Which part is like the thin shell?\nNow tap it.","Which layer is the thickest?":"Layer Peel!\nThe crust is thin, like an eggshell.\nSay the peg. Which part is like the egg white?\nNow tap it.","What is the inner core made of?":"Layer Peel!\nThe outer core is melted metal that flows.\nListen again: is the inner core solid or liquid? What material?\nNow tap it.","Underground melted rock is magma. Once it flows out of a volcano, it has a new name. What flows down the side of an erupting volcano?":"Layer Peel!\nIce that melts becomes water.\nRead the question again. What do we call it outside?\nNow tap it.","Earth's crust is broken into giant moving pieces called:":"Layer Peel!\nA puzzle is made of pieces that fit together.\nThe pieces are flat and wide, like dishes. What are they called?\nNow tap it.","Put Earth's layers in order from the outside in.":"Layer Peel!\nAn onion: dry skin outside, then layers, then the center.\nStart with the thin skin we live on.\nTap them in order.","Earth's crust is about 25 miles thick under land, and the mantle is about 1,800 miles thick. How many miles thicker is the mantle?":"Layer Peel!\n500 minus 20 is 480.\nTake 25 away from 1,800.\nType the number.","What causes most earthquakes?":"Layer Peel!\nTwo books rubbing and slipping can jolt a table.\nWhich giant pieces of the crust can slip?\nNow tap it.","A scientist drills straight down from Baltimore. Which layer will he reach right under the crust?":"Layer Peel!\nUnder an eggshell is the egg white.\nSay the peg. What comes right after the shell?\nNow tap it.","Which is the hottest layer of Earth?":"Layer Peel!\nThe crust is cool enough to live on.\nWhich layer is at the very center?\nNow tap it.","What is the thin outer layer of Earth called?":"Layer Peel!\nThe mantle is the thick layer under it.\nSay the peg. Which part is the shell?\nNow tap it.","Melted rock that comes out of a volcano is called:":"Layer Peel!\nUnderground, melted rock has another name.\nOnce it pours out, what is it called?\nNow tap it.","In the peg, the yolk stands for:":"Layer Peel!\nIn the peg, the shell stands for the crust.\nSay the peg. Stop at the yolk.\nNow tap it.","What layer is right under the crust?":"Layer Peel!\nUnder a sandwich's top slice is the filling.\nTop is crust. What comes next, going down?\nNow tap it.","What happens to rock that gets very, very hot?":"Layer Peel!\nChocolate in a hot car turns gooey.\nWhat does great heat do to solid things?\nNow tap it."},"s":"Do the Layer Peel.\nSay: crust is the shell, mantle is the white, core is the yolk.\nOutside in: crust, mantle, outer core, inner core."},"ELEC.FUSA.L07.01":{"q":{"What are the first three words of the Constitution?":"Rights Rundown!\nThe Gettysburg Address starts with a different phrase.\nSay the peg. Which three words come first?\nNow tap it.","What are the first 10 amendments called?":"Rights Rundown!\nThe opening paragraph of the Constitution is the Preamble.\nSay the peg. What are the first 10 changes?\nNow tap it.","Which amendment protects freedom of religion and speech?":"Rights Rundown!\nThe Fifth Amendment protects a person from testifying against himself.\nWhich amendment comes before all the others?\nNow tap it.","What is the supreme law of the United States?":"Rights Rundown!\nThe Declaration announced independence in 1776.\nWhich document holds the rules of our government?\nNow tap it.","A change or addition to the Constitution is called an:":"Rights Rundown!\nA change to a recipe is an adjustment.\nThe Bill of Rights is the first 10 of these.\nNow tap it.","Put these in time order: the Bill of Rights is added, the Declaration of Independence, the Constitution is written.":"Rights Rundown!\nYou build a house, then add a porch.\nFreedom came first, then rules, then changes.\nTap them in order.","How many amendments are in the Bill of Rights?":"Rights Rundown!\nThe Constitution has 27 amendments in all today.\nSay the peg. How many first changes?\nType the number.","Which freedom does the First Amendment protect?":"Rights Rundown!\nThe Fourth Amendment protects homes from unfair searches.\nWhy may we daven freely in shul?\nNow tap it.","A newspaper prints a story the government dislikes. Which amendment protects the newspaper?":"Rights Rundown!\nFreedom of religion is in the same amendment.\nWhich amendment lists religion, speech and the press?\nNow tap it.","How does the Constitution begin?":"Rights Rundown!\nThe Declaration begins, \"When in the Course of human events.\"\nSay the peg. Which three words open it?\nNow tap it.","What is the Bill of Rights?":"Rights Rundown!\nThe Preamble is the opening paragraph.\nSay the peg. What are the first 10 changes?\nNow tap it.","Which amendment protects the freedom to practice our religion?":"Rights Rundown!\nThe Fifth Amendment protects people in court.\nReligion, speech, press: which amendment lists them?\nNow tap it.","In the peg, who wrote the rules?":"Rights Rundown!\nIn the peg, the first 10 changes are the Bill of Rights.\nSay the peg. Who wrote the rules?\nNow tap it.","To amend something means to:":"Rights Rundown!\nTo edit a story means to fix its mistakes.\nAn amendment is a change. What does amend mean?\nNow tap it.","The Constitution is like a:":"Rights Rundown!\nA game box has a rule sheet for the players.\nWhat does a game's rule sheet do for players?\nNow tap it."},"s":"Do the Rights Rundown.\nSay: We the People wrote the rules; the first 10 changes are the Bill of Rights."},"ELEC.FPAST.L07.01":{"q":{"Which ancient land built the great pyramids?":"Civ Snapshot!\nChina built a wall thousands of miles long.\nSay the peg. Who built?\nNow tap it.","Which civilization is known for early democracy?":"Civ Snapshot!\nRome built roads that stretched across its empire.\nSay the peg. Who voted?\nNow tap it.","What were Roman aqueducts for?":"Civ Snapshot!\nThe Great Wall of China kept out invaders.\nAqua means water. What would a water bridge carry?\nNow tap it.","Which civilization built the Great Wall?":"Civ Snapshot!\nEgypt built the pyramids.\nSay the peg. Who walled?\nNow tap it.","Egyptian picture writing is called:":"Civ Snapshot!\nCuneiform was wedge-shaped writing from Mesopotamia.\nEgyptians wrote with little pictures. What is it called?\nNow tap it.","Put these in order from oldest to newest: the Roman Empire at its biggest (about 117 CE), the Great Pyramid (about 2560 BCE), the first Olympic Games (776 BCE).":"Civ Snapshot!\n2000 BCE is older than 500 BCE.\nFind the biggest BCE year. That is the oldest.\nTap them in order.","The first Olympic Games were in 776 BCE. The Great Pyramid was built about 2560 BCE. About how many years before the Olympics was the pyramid built?":"Civ Snapshot!\n1000 BCE is 500 years before 500 BCE.\nTake 776 away from 2560.\nType the number.","Avraham Avinu came from Ur. Ur was a city in which ancient land, between two rivers?":"Civ Snapshot!\nEgypt grew up along the Nile River.\nMeso means middle; potamia means rivers.\nNow tap it.","Many English words, like aquarium and library, come from an ancient language. Which civilization spoke it?":"Civ Snapshot!\nHieroglyphics came from Egypt.\nWhich civilization spoke Latin?\nNow tap it.","In the peg, what did Rome do?":"Civ Snapshot!\nIn the peg, Greece voted.\nSay the peg. Stop at Rome.\nNow tap it.","Which civilization started the Olympic Games?":"Civ Snapshot!\nRome is famous for its roads.\nWhich civilization also gave us democracy?\nNow tap it.","What is a civilization?":"Civ Snapshot!\nA team is a group playing together.\nEgypt had cities, writing and laws. What was it?\nNow tap it.","In the peg, what did Greece do?":"Civ Snapshot!\nIn the peg, Egypt built.\nRaise your hand. Which word is that?\nNow tap it.","Which river flows through Egypt?":"Civ Snapshot!\nThe Amazon flows through Brazil.\nMoshe Rabbeinu was placed in a basket on which river?\nNow tap it.","Ancient means:":"Civ Snapshot!\nModern means from our time today.\nThousands of years ago: is that new?\nNow tap it."},"s":"Take a Civ Snapshot.\nSay: Egypt built, Greece voted, Rome paved, China walled."},"ELEC.FTECH.L07.01":{"q":{"Which travels faster?":"Flash then Boom!\nA cheetah is faster than a turtle.\nIn a storm, which comes first: flash or boom?\nNow tap it.","Why is there no sound in outer space?":"Flash then Boom!\nA drum skin shakes back and forth to make a beat.\nWhat does sound need to travel through?\nNow tap it.","What is an echo?":"Flash then Boom!\nA mirror bounces light back to you.\nShout at a cliff. What comes back?\nNow tap it.","You see lightning and hear thunder 5 seconds later. Why the wait?":"Flash then Boom!\nA runner far away waves before you hear his shout.\nSay the peg. Which one strolls?\nNow tap it.","What makes sound?":"Flash then Boom!\nLight comes from glowing things like the sun.\nHum and touch your throat. What do you feel?\nNow tap it.","Put the steps of hearing a drum in order: the sound reaches your ear, the drum is hit, the air carries the vibration, the drum skin vibrates.":"Flash then Boom!\nDomino one falls, pushes two, two pushes three.\nWhat has to happen before anything shakes?\nTap them in order.","Sound travels about 1,100 feet each second in air. How far does it go in 5 seconds?":"Flash then Boom!\n1,000 feet each second for 3 seconds is 3,000 feet.\nMultiply 1,100 by 5.\nType the number.","White sunlight shines through a prism. What comes out?":"Flash then Boom!\nMixing many paint colors makes brown.\nWhite light holds many colors. What happens when they spread out?\nNow tap it.","Astronauts working outside their ship use radios to talk. Why can they not just shout?":"Flash then Boom!\nA whale can call through water, which carries sound.\nWhat does sound travel through? Is any of it in space?\nNow tap it.","Which reaches you first in a storm?":"Flash then Boom!\nFireworks far away flash before you hear the pop.\nSay the peg. Which one zooms?\nNow tap it.","Sound cannot travel through:":"Flash then Boom!\nSound travels well through walls.\nWhich one has nothing at all to vibrate?\nNow tap it.","Sound bouncing back off a wall is called:":"Flash then Boom!\nLight bouncing off a mirror is a reflection.\nShout in an empty gym. What do you hear back?\nNow tap it.","In the peg, what does sound do?":"Flash then Boom!\nIn the peg, light zooms.\nSay the peg. Which word goes with sound?\nNow tap it.","What does a rubber band do to make sound?":"Flash then Boom!\nA guitar string hums while it shakes.\nWhat do you see the band doing while it buzzes?\nNow tap it.","Ripples spreading in a pond are:":"Flash then Boom!\nSound spreads out from a bell in every direction.\nWhat do we call those rings moving out?\nNow tap it."},"s":"Remember Flash then Boom.\nSay: light zooms, sound strolls.\nSound needs something to travel through."},"ELEC.FNUM.L07.01":{"q":{"How many meters are in a kilometer?":"Prefix Power!\nCenti means one hundredth of the base unit.\nKilo means a thousand. Kilometer means a thousand what?\nNow tap it.","How many centimeters make 1 meter?":"Prefix Power!\nA cent is one hundredth of a dollar.\nCenti means one hundredth. How many hundredths make one?\nNow tap it.","Which unit measures how much liquid is in a bottle?":"Prefix Power!\nGrams measure how heavy an apple is.\nMeters for length, grams for weight. What is left for liquid?\nNow tap it.","What does milli mean?":"Prefix Power!\nCenti means one hundredth.\nMilli is the smallest in the peg. Tiny or huge?\nNow tap it.","Put these in order from smallest to biggest: kilometer, millimeter, meter, centimeter.":"Prefix Power!\nPenny, dime, dollar: small to big.\nStart with the tiniest prefix in the peg.\nTap them in order.","How many grams are in 3 kilograms?":"Prefix Power!\n2 kilometers is 2,000 meters.\nMultiply 3 by 1,000.\nType the number.","Water freezes at 0 degrees Celsius. At what temperature does it boil?":"Prefix Power!\nIn Fahrenheit, water boils at 212.\nCelsius set freezing at 0. Which round number for boiling?\nNow tap it.","How many milliliters are in 2 liters?":"Prefix Power!\n3 meters is 3,000 millimeters.\nOne liter is 1,000 milliliters. Double it.\nType the number.","A runner's race is 5 kilometers. How many meters does he run?":"Prefix Power!\nA 2-kilogram bag holds 2,000 grams.\nMultiply 5 by what kilo means.\nNow tap it.","Which prefix means 1,000?":"Prefix Power!\nCenti means one hundredth.\nSay the peg. Which word starts it?\nNow tap it.","How many meters is 300 centimeters?":"Prefix Power!\n200 centimeters is 2 meters.\nDivide by 100.\nNow tap it.","Which unit measures mass, how heavy something is?":"Prefix Power!\nLiters measure liquid in a bottle.\nWhich unit is on a bag of flour?\nNow tap it.","In the peg, which word stands for centi?":"Prefix Power!\nIn the peg, Milk stands for milli.\nCenti starts with C. Find the C word.\nNow tap it.","About how long is one meter?":"Prefix Power!\nA centimeter is about as wide as a fingernail.\nTake a big step. About how long is that?\nNow tap it.","How many tens make 100?":"Prefix Power!\nTen ones make one ten.\nCount by tens to 100. How many counts?\nNow tap it."},"s":"Use Prefix Power.\nSay: King Henry Doesn't Usually Drink Chocolate Milk.\nKilo is 1,000; centi is a hundredth; milli is a thousandth."},"ELEC.FWORLD.L08.01":{"q":{"Which country has the most land?":"Size or Crowd!\nThe smallest country is less than one square mile.\nSay the peg. Which one is roomiest?\nNow tap it.","Which country has the most people?":"Size or Crowd!\nThe United States has about 340 million people.\nSay the peg. Which one is most crowded?\nNow tap it.","Which is the second largest country by land?":"Size or Crowd!\nBrazil is the largest country in South America.\nListen again: which northern neighbor did the lesson name?\nNow tap it.","Russia stretches across which two continents?":"Size or Crowd!\nEgypt lies mostly in Africa, with a little in Asia.\nMoscow is in Europe. Siberia is in which continent?\nNow tap it.","About how many people live in India?":"Size or Crowd!\nThe United States has about 340 million.\nIndia is the most crowded. Pick the biggest number.\nNow tap it.","Put these countries in order by land, largest first: the United States, Russia, Canada.":"Size or Crowd!\nAsia, Africa, Australia: big to small.\nRoomiest first. Who is second?\nTap them in order.","India has about 1,400 million people and the United States about 340 million. About how many million more does India have?":"Size or Crowd!\n500 minus 300 is 200.\nTake 340 away from 1,400.\nType the number.","Which country has the third most people?":"Size or Crowd!\nIndia and China are first and second.\nWhich country has about 340 million people?\nNow tap it.","A traveler crosses 11 time zones and is still in the same country. Which country could it be?":"Size or Crowd!\nThe United States has six time zones, with Alaska and Hawaii.\nOnly a giant country spans that many. Say the peg.\nNow tap it.","Which is the largest country by land?":"Size or Crowd!\nAustralia is a country and also a continent.\nSay the peg. Which country is roomiest?\nNow tap it.","Which country passed China in 2023 to have the most people?":"Size or Crowd!\nIndonesia has the fourth most people.\nSay the peg. Which country is most crowded?\nNow tap it.","Canada is famous for being:":"Size or Crowd!\nIndia is famous for having the most people.\nCanada is huge but not first. Where does it rank?\nNow tap it.","In the peg, which country is most crowded?":"Size or Crowd!\nIn the peg, Russia is roomiest.\nSay the peg. Stop at crowded.\nNow tap it.","Population means:":"Size or Crowd!\nArea means how much land a place covers.\nPopulation counts something. What?\nNow tap it.","Australia is very big. Does it have more people or fewer people than Texas?":"Size or Crowd!\nAlaska is the biggest state but has few people.\nBig land does not mean many people. What did the lesson say?\nNow tap it."},"s":"Think Size or Crowd.\nSay: Russia is roomiest, India is most crowded.\nArea is land; population is people."},"ELEC.FNATURE.L08.01":{"q":{"What does the heart do?":"System Check!\nThe lungs take in air.\nSay the peg. What does the heart do?\nNow tap it.","How many bones are in an adult skeleton?":"System Check!\nA year has 52 weeks.\nListen again: what number did the lesson give?\nNow tap it.","Which part is the boss of the nervous system?":"System Check!\nThe stomach is part of the digestive system.\nSay the peg. Which part bosses?\nNow tap it.","Which organ takes oxygen from the air into the body?":"System Check!\nThe heart moves blood, but it does not breathe.\nSay the peg. Which part breathes?\nNow tap it.","What is the largest organ of the body?":"System Check!\nThe liver is the largest organ inside the body.\nWhich organ wraps around the whole outside?\nNow tap it.","Put the path of food in order: the small intestine, the mouth, the stomach, the esophagus.":"System Check!\nA letter goes: mailbox, truck, post office, house.\nWhere does food go in first?\nTap them in order.","A heart beats about 70 times a minute. About how many beats is that in 10 minutes?":"System Check!\n60 times 10 is 600.\nMultiply 70 by 10.\nType the number.","Which system breaks food into nutrients the body can use?":"System Check!\nThe respiratory system brings in air.\nSay the peg. What does the stomach do?\nNow tap it.","After running, Dovid breathes fast and his heart pounds. Which two systems are working hard?":"System Check!\nEating lunch puts the digestive system to work.\nWhich systems hold the lungs and the heart?\nNow tap it.","In the peg, what do bones do?":"System Check!\nIn the peg, the lungs breathe.\nSay the peg. Stop at bones.\nNow tap it.","Which organ pumps blood?":"System Check!\nThe lungs fill with air.\nSay the peg. Which part pumps?\nNow tap it.","How many bones does an adult have?":"System Check!\nA baby has more pieces that later join together.\nRecall the number from the lesson.\nNow tap it.","In the peg, what do the lungs do?":"System Check!\nIn the peg, the heart pumps.\nSay the peg. Stop at lungs.\nNow tap it.","What gas do your lungs take in from the air?":"System Check!\nPlants take in carbon dioxide to make food.\nWhich gas do living things need from the air?\nNow tap it.","A system is:":"System Check!\nA team is a group of players who cooperate.\nWheels, chain and pedals together make what?\nNow tap it."},"s":"Do a System Check.\nSay: heart pumps, lungs breathe, bones hold, stomach breaks down, brain bosses."},"ELEC.FUSA.L08.01":{"q":{"How many years is a President's term?":"Term Tracker!\nA senator's term is 6 years.\nSay the peg. Which number goes with President?\nNow tap it.","How many members are in the House of Representatives?":"Term Tracker!\nThe Senate has 100 members, 2 per state.\nListen again: what number did the lesson give for the House?\nNow tap it.","How many electoral votes does a candidate need to win?":"Term Tracker!\nThe House has 435 members.\nMore than half of 538. Which number is that?\nNow tap it.","How long is a senator's term?":"Term Tracker!\nA member of the House serves 2 years.\nSay the peg. Which number goes with Senate?\nNow tap it.","How old must a citizen be to vote?":"Term Tracker!\nTo be President, you must be at least 35.\nIt is the age most boys finish high school.\nNow tap it.","Put these terms in order from shortest to longest: Senate, President, House.":"Term Tracker!\nA week, a month, a year: short to long.\nSay the peg. Find the smallest number.\nTap them in order.","A President can be elected to 2 terms of 4 years. What is the most years he can be elected to serve?":"Term Tracker!\nThree terms of 2 years is 6 years.\nMultiply the number of terms by the years in each.\nType the number.","Why do some states have more representatives than others?":"Term Tracker!\nEvery state, big or small, has exactly 2 senators.\nThe census counts something. That decides the House seats.\nNow tap it.","A candidate wins 280 electoral votes. Does he win?":"Term Tracker!\nA team needs more than half the votes to pick a captain.\nCompare 280 to the number needed.\nNow tap it.","How many senators does each state have?":"Term Tracker!\nThe House depends on how many people a state has.\nEvery state gets the same small number. How many?\nNow tap it.","How long is a term in the House of Representatives?":"Term Tracker!\nA President serves 4 years per term.\nSay the peg. Which number goes with House?\nNow tap it.","How many terms may a President be elected to?":"Term Tracker!\nSenators may serve as many terms as voters choose.\nWashington set the example. How many did he serve?\nNow tap it.","In the peg, how many years for the Senate?":"Term Tracker!\nIn the peg, the House gets 2.\nSay the peg. Stop at Senate.\nNow tap it.","In which month are national elections held?":"Term Tracker!\nIndependence Day is in July.\nListen again: which month did the lesson name?\nNow tap it.","What happens in an election?":"Term Tracker!\nA class can vote to choose a team captain.\nWhat do citizens do on Election Day?\nNow tap it."},"s":"Use the Term Tracker.\nSay: President 4, Senate 6, House 2.\nA President needs 270 electoral votes."},"ELEC.FPAST.L08.01":{"q":{"What were many explorers looking for?":"Sail Log!\nToday, ships carry oil and cars around the world.\nWhat did Europe want from Asia?\nNow tap it.","Where did Vasco da Gama reach by sailing around Africa?":"Sail Log!\nColumbus sailed west and reached the Caribbean islands.\nSay the peg. He went south, then east, to which land?\nNow tap it.","What did Magellan's expedition do first?":"Sail Log!\nColumbus crossed the Atlantic but did not circle the globe.\nSay the peg. Where did Magellan's ships go?\nNow tap it.","Which direction did Columbus sail to try to reach Asia?":"Sail Log!\nDa Gama sailed south and then east.\nSay the peg. Which way did Columbus go?\nNow tap it.","Which tool helped sailors find direction at sea?":"Sail Log!\nAn astrolabe measured the height of the sun and stars.\nWhich tool has a needle that swings north?\nNow tap it.","Put the voyages in time order: Magellan around the world (1519), Columbus to the Americas (1492), da Gama to India (1498).":"Sail Log!\n1903 came before 1969.\nFind the smallest year first.\nTap them in order.","Magellan's voyage left in 1519 and returned in 1522. How many years did it take?":"Sail Log!\nFrom 1804 to 1806 is 2 years.\nTake 1519 away from 1522.\nType the number.","Henry Hudson explored a river in 1609 that is now named after him. Which city sits at its mouth?":"Sail Log!\nThe Potomac River flows past our capital.\nWhich big city sits where the Hudson meets the sea?\nNow tap it.","A ship leaves Portugal, sails south along Africa, rounds its tip, and heads to India. Whose route is this?":"Sail Log!\nSailing west from Spain is Columbus's route.\nSay the peg. Who went south and east?\nNow tap it.","Whose expedition first sailed around the whole world?":"Sail Log!\nDa Gama reached India by sea.\nSay the peg. Who went all the way around?\nNow tap it.","Why did Europeans want a sea route to Asia?":"Sail Log!\nToday, ships bring us bananas from far away.\nWhat tasty goods came from Asia?\nNow tap it.","In what year did Columbus first reach the Americas?":"Sail Log!\nDa Gama reached India in 1498.\nSay the old rhyme about the ocean blue.\nNow tap it.","In the peg, who went all the way around?":"Sail Log!\nIn the peg, Columbus went west.\nSay the peg. Stop at around.\nNow tap it.","Which country paid for Columbus's voyage?":"Sail Log!\nDa Gama sailed for Portugal.\nColumbus sailed west from which country?\nNow tap it.","What is an expedition?":"Sail Log!\nA field trip is a short outing to learn.\nMagellan's trip lasted three years. What was it?\nNow tap it."},"s":"Keep a Sail Log.\nSay: Columbus west, da Gama south and east, Magellan all the way around."},"ELEC.FTECH.L08.01":{"q":{"Which part of a computer follows instructions and does the thinking?":"Computer Tour!\nThe screen shows pictures and words.\nSay the peg. Which part thinks?\nNow tap it.","How many bits make one byte?":"Computer Tour!\nA dozen is 12 eggs.\nListen again: how many bits did the lesson say?\nNow tap it.","Which keeps your files when the computer is turned off?":"Computer Tour!\nWriting on a whiteboard gets erased; a notebook keeps it.\nWhich memory empties without power? Pick the other.\nNow tap it.","A keyboard is an example of an:":"Computer Tour!\nA printer is an output device.\nSay the peg. Does the keyboard put information in or out?\nNow tap it.","Binary uses which digits?":"Computer Tour!\nOur normal numbers use ten digits.\nBinary means two. Which two digits?\nNow tap it.","Put the steps in order when you type a letter: the processor works on it, you press a key, the letter shows on the screen.":"Computer Tour!\nOrder pizza, the kitchen bakes it, it arrives.\nSay the peg. What happens first?\nTap them in order.","How many bits are in 4 bytes?":"Computer Tour!\n3 bytes is 24 bits.\nMultiply 4 by 8.\nType the number.","What happens to what is in RAM when the power goes out?":"Computer Tour!\nA drawing in sand washes away with the tide.\nRAM is short-term memory. What happens without power?\nNow tap it.","Moshe saves his report before the power goes out. Where is it kept safe?":"Computer Tour!\nA notebook keeps notes even after class ends.\nWhich part keeps files when the power is off?\nNow tap it.","In the peg, what does memory do?":"Computer Tour!\nIn the peg, the processor thinks.\nSay the peg. Stop at memory.\nNow tap it.","A computer screen is an:":"Computer Tour!\nA microphone is an input device.\nSay the peg. Does the screen take in or show?\nNow tap it.","A bit is:":"Computer Tour!\nA byte is a group of 8 of these.\nBinary is only 0s and 1s. What is one of them called?\nNow tap it.","In the peg, what does the screen do?":"Computer Tour!\nIn the peg, the keyboard puts information in.\nSay the peg. Stop at screen.\nNow tap it.","A printer is:":"Computer Tour!\nA mouse is input, because you send it moves.\nDoes paper come out of a printer or go in?\nNow tap it.","A list of instructions a computer follows is called a:":"Computer Tour!\nA recipe is a list of steps a cook follows.\nWhat do we call a computer's set of instructions?\nNow tap it."},"s":"Take the Computer Tour.\nSay: keyboard in, processor thinks, memory holds, screen shows.\n8 bits make a byte."},"ELEC.FNUM.L08.01":{"q":{"About how far is the Moon from Earth?":"Space Speedometer!\nThe Sun is about 93 million miles away.\nSay the peg. Which number goes with the Moon?\nNow tap it.","About how long does sunlight take to reach Earth?":"Space Speedometer!\nMoonlight reaches us in a little over 1 second.\nListen again: how many minutes did the lesson say?\nNow tap it.","About how far does light travel in one second?":"Space Speedometer!\nSound goes only about 1,100 feet each second.\nSay the peg. Which number goes with light?\nNow tap it.","Which is farther from Earth?":"Space Speedometer!\nA city across the ocean is farther than your street.\nSay the peg. Which number is bigger?\nNow tap it.","Put these from nearest to farthest from Earth: the Sun, a jet plane, the Moon.":"Space Speedometer!\nThe corner store is nearer than the next city.\nWhich one is still close to the ground?\nTap them in order.","The Moon is about 239,000 miles away. A trip there and back is about how many miles?":"Space Speedometer!\nTwice 100,000 is 200,000.\nAdd 239,000 two times.\nType the number.","Astronauts reached the Moon in about 3 days. Light gets there in about:":"Space Speedometer!\nSunlight takes about 8 minutes to reach us.\nThe Moon is much closer than the Sun. Seconds or minutes?\nNow tap it.","Light travels about 186,000 miles each second. About how many miles does it travel in 2 seconds?":"Space Speedometer!\nTwice 150,000 is 300,000.\nMultiply 186,000 by 2.\nType the number.","A news report says, \"The Sun is 93 million miles away.\" What does that mean about its light?":"Space Speedometer!\nLight from the Moon takes just over 1 second.\nRecall the lesson: how long does sunlight travel?\nNow tap it.","About how far away is the Sun?":"Space Speedometer!\nThe Moon is about 239,000 miles away.\nSay the peg. Which number goes with the Sun?\nNow tap it.","What is the fastest thing in the universe?":"Space Speedometer!\nA rocket is fast, but much slower than the winner.\nWhat do you see before you hear thunder?\nNow tap it.","The Moon's distance from Earth is about:":"Space Speedometer!\nThe Sun is about 93 million miles away.\nSay the peg. Which number goes with the Moon?\nNow tap it.","In the peg, which number goes with light?":"Space Speedometer!\nIn the peg, the Sun is 93 million.\nSay the peg. Stop at light.\nNow tap it.","Is the Moon closer to Earth than the Sun?":"Space Speedometer!\nA neighbor's house is closer than a city across the ocean.\nThousands of miles or millions of miles?\nNow tap it.","Speed tells:":"Space Speedometer!\nLength tells how long something is.\nA car going 60 miles per hour: what does that tell you?\nNow tap it."},"s":"Read the Space Speedometer.\nSay: Moon 239 thousand, Sun 93 million, light 186 thousand each second."},"ELEC.FWORLD.L09.01":{"q":{"Which sea is on the west coast of Eretz Yisrael?":"Land Locator!\nThe Red Sea touches the southern tip, at Eilat.\nSay the peg. Which sea is to the west?\nNow tap it.","What record does the Dead Sea hold?":"Land Locator!\nMount Everest holds the record for the tallest peak.\nSay the peg. Which word describes the Dead Sea?\nNow tap it.","Which river flows from the Kinneret into the Dead Sea?":"Land Locator!\nThe Nile flows north through Egypt.\nListen again: which river did the lesson name?\nNow tap it.","Which desert is in the south of Eretz Yisrael?":"Land Locator!\nThe Sinai desert is in Egypt, to the southwest.\nIts name starts with N.\nNow tap it.","Which country lies to the southwest, across the Sinai?":"Land Locator!\nJordan lies to the east, across the Jordan River.\nB'nei Yisrael crossed the Sinai to leave which land?\nNow tap it.","Put these from north to south: the Dead Sea, the Kinneret, the Negev desert.":"Land Locator!\nMaine is north of Maryland, which is north of Florida.\nSay the peg. Which one is up north?\nTap them in order.","The Dead Sea shore is about 1,400 feet below sea level. Yerushalayim is about 2,500 feet above sea level. How many feet higher is Yerushalayim?":"Land Locator!\nFrom 100 below to 200 above is 300 feet.\nAdd the feet below to the feet above.\nType the number.","Why do people float so easily in the Dead Sea?":"Land Locator!\nAn egg sinks in plain water but floats in very salty water.\nWhat is special about Dead Sea water?\nNow tap it.","A traveler walks down from Yerushalayim to the lowest place on land. Where is he going?":"Land Locator!\nMount Hermon, in the far north, is the highest spot.\nSay the peg. Which place is low?\nNow tap it.","The Kinneret is also called:":"Land Locator!\nThe Salt Sea is another name for the Dead Sea.\nRecall the lesson. What other name did it give?\nNow tap it.","Which sea has the lowest shore on land?":"Land Locator!\nThe Mediterranean is at sea level, on the west.\nSay the peg. Which sea is low?\nNow tap it.","Which river forms much of the border between Israel and Jordan?":"Land Locator!\nThe Rio Grande forms part of our border with Mexico.\nThe river shares a name with the country to the east.\nNow tap it.","In the peg, what is up north?":"Land Locator!\nIn the peg, the desert is down south.\nSay the peg. Stop at north.\nNow tap it.","Which is saltier?":"Land Locator!\nRain water is fresh, with no salt.\nWhich sea lets you float like a cork?\nNow tap it.","A place 100 feet below sea level is:":"Land Locator!\nA hill 300 feet above sea level is higher than the beach.\nBelow means under. Under what?\nNow tap it."},"s":"Use the Land Locator.\nSay: sea to the west, Dead Sea low in the east, Kinneret up north, desert down south."},"ELEC.FNATURE.L09.01":{"q":{"What is the symbol for oxygen?":"Symbol Code!\nThe symbol for carbon is C.\nSay the peg. Which letter goes with oxygen?\nNow tap it.","What is the symbol for gold?":"Symbol Code!\nSilver is Ag, from the Latin argentum.\nGold's Latin name is aurum. Take its first two letters.\nNow tap it.","What two elements make up water?":"Symbol Code!\nTable salt, NaCl, is sodium and chlorine.\nRead H2O: what do H and O stand for?\nNow tap it.","Which element has the symbol Fe?":"Symbol Code!\nAu stands for gold.\nSay the peg. Which metal is Fe?\nNow tap it.","How many elements are known today?":"Symbol Code!\nThere are 50 states in the United States.\nListen again: what number did the lesson give?\nNow tap it.","Put these in order from lightest to heaviest element: oxygen, hydrogen, iron, gold.":"Symbol Code!\nA feather, a book, a brick: light to heavy.\nStart with the lightest element of all.\nTap them in order.","How many atoms are in one molecule of water, H2O?":"Symbol Code!\nCO2 has 1 carbon and 2 oxygen atoms.\nCount the H atoms, then the O atom.\nType the number.","About what part of the air we breathe is nitrogen?":"Symbol Code!\nOxygen is the second biggest part of air.\nNitrogen is the biggest part. Pick the biggest choice under 100.\nNow tap it.","A chemist writes NaCl on a jar. What is in it?":"Symbol Code!\nH2O on a bottle would mean water.\nNa is sodium and Cl is chlorine. What do they make?\nNow tap it.","What is the symbol for hydrogen?":"Symbol Code!\nThe symbol for carbon is C.\nSay the peg. Which letter starts it?\nNow tap it.","Water's formula is:":"Symbol Code!\nCarbon dioxide is CO2.\nTwo hydrogens and one oxygen. Write it.\nNow tap it.","What is an element?":"Symbol Code!\nA compound is two or more elements joined.\nGold is pure gold all the way through. What is it?\nNow tap it.","In the peg, what is Au?":"Symbol Code!\nIn the peg, Fe is iron.\nSay the peg. Stop at Au.\nNow tap it.","What is the symbol for nitrogen?":"Symbol Code!\nCarbon takes its first letter: C.\nTake the first letter of nitrogen.\nNow tap it.","Everything is made of tiny:":"Symbol Code!\nA wall is made of many small bricks.\nWhat tiny particles make up all matter?\nNow tap it."},"s":"Crack the Symbol Code.\nSay: H for hydrogen, O for oxygen, C for carbon, Fe for iron, Au for gold.\nH2O is water."},"ELEC.FUSA.L09.01":{"q":{"Which purchase doubled the size of the United States in 1803?":"Growth Chart!\nAlaska was bought from Russia in 1867.\nSay the peg. Which name goes with 1803?\nNow tap it.","Which amendment ended slavery?":"Growth Chart!\nThe 19th Amendment gave women the vote in 1920.\nRecall the lesson: which numbered amendment did it name?\nNow tap it.","What was finished in 1869 with a golden spike?":"Growth Chart!\nThe Brooklyn Bridge opened in 1883.\nSay the peg. What goes with 1869?\nNow tap it.","From which country did the U.S. buy Alaska in 1867?":"Growth Chart!\nLouisiana was bought from France.\nWhich giant country is just across the sea from Alaska?\nNow tap it.","Which was the 50th state, in 1959?":"Growth Chart!\nAlaska became the 49th state earlier that same year.\nSay the peg. What goes with 1959?\nNow tap it.","Put these in time order: Hawaii becomes a state, the Louisiana Purchase, Alaska is bought, the Civil War ends.":"Growth Chart!\n1492 comes before 1776.\nSay the peg. Which year is smallest?\nTap them in order.","The country began with 13 states. Today there are 50. How many states joined later?":"Growth Chart!\nFrom 13 to 20 is 7 more.\nTake 13 away from 50.\nType the number.","Who was President during the Civil War?":"Growth Chart!\nJefferson made the Louisiana Purchase.\nWhich President kept the Union together?\nNow tap it.","A family in 1870 wants to cross the country fast. What new way can they use?":"Growth Chart!\nIn 1850, the same trip took months by wagon.\nSay the peg. What was new in 1869?\nNow tap it.","In what year did the Civil War end and slavery end?":"Growth Chart!\nThe railroad was finished in 1869.\nSay the peg. Which year says slavery ended?\nNow tap it.","What did the U.S. buy from France in 1803?":"Growth Chart!\nAlaska came from Russia.\nSay the peg. Which name goes with 1803?\nNow tap it.","Which state was bought from Russia?":"Growth Chart!\nLouisiana land was bought from France.\nSay the peg. What goes with 1867?\nNow tap it.","In the peg, what goes with 1959?":"Growth Chart!\nIn the peg, 1867 goes with Alaska.\nSay the peg. Stop at the last year.\nNow tap it.","Before 1803, the country's western edge was near:":"Growth Chart!\nAfter 1803, the land reached the Rocky Mountains.\nRecall the lesson: which river was the edge?\nNow tap it.","A territory is:":"Growth Chart!\nPuerto Rico is a territory today.\nAlaska was a territory before 1959. What was it not yet?\nNow tap it."},"s":"Read the Growth Chart.\nSay: 1803 Louisiana, 1865 slavery ended, 1867 Alaska, 1869 railroad, 1959 Hawaii."},"ELEC.FPAST.L09.01":{"q":{"Where did the Industrial Revolution begin?":"Factory Fast-Forward!\nThe Renaissance began in Italy.\nListen again: which country did the lesson name?\nNow tap it.","What fuel was burned to power most steam engines?":"Factory Fast-Forward!\nToday, many cars burn gasoline.\nWhich black rock was dug from mines to burn?\nNow tap it.","Where did many people move to find factory jobs?":"Factory Fast-Forward!\nToday, many people move to find new jobs too.\nSay the peg. Village to what?\nNow tap it.","Which industry was one of the first to use big machines?":"Factory Fast-Forward!\nToday, robots help build cars.\nWhich very old craft is about thread and weaving?\nNow tap it.","What did the Industrial Revolution change most?":"Factory Fast-Forward!\nThe printing press changed how books were made.\nSay the peg. Hand to what?\nNow tap it.","Put the peg in order: farm to factory, village to city, hand to machine.":"Factory Fast-Forward!\nSeasons go winter, spring, summer, fall.\nSay the peg. Which pair comes first?\nTap them in order.","A worker in 1830 worked 12 hours a day for 6 days. How many hours a week was that?":"Factory Fast-Forward!\n8 hours for 5 days is 40 hours.\nMultiply 12 by 6.\nType the number.","What new kind of transportation did steam power make possible?":"Factory Fast-Forward!\nLater, gasoline engines powered cars.\nWhich steam machine ran on metal tracks?\nNow tap it.","A town of 500 farmers becomes a city of 50,000 workers in 60 years, all near a cloth factory. What is happening?":"Factory Fast-Forward!\nWagons rolling west happened during the Gold Rush.\nSay the peg. Which big change moves farms to factories?\nNow tap it.","In the peg, villages became:":"Factory Fast-Forward!\nIn the peg, hands became machines.\nSay the peg. Stop at village.\nNow tap it.","What powered the early factories and trains?":"Factory Fast-Forward!\nToday, many factories run on electricity.\nWhich engine boils water to push pistons?\nNow tap it.","About when did the Industrial Revolution begin?":"Factory Fast-Forward!\nColumbus sailed in 1492.\nListen again: which year did the lesson give?\nNow tap it.","In the peg, farms became:":"Factory Fast-Forward!\nIn the peg, villages became cities.\nSay the peg. Stop at farm.\nNow tap it.","Why were machines faster than hand work?":"Factory Fast-Forward!\nA dishwasher cleans many plates at once.\nHow much thread could one machine spin?\nNow tap it.","Here, revolution means:":"Factory Fast-Forward!\nA breakthrough is a sudden new discovery.\nWas this revolution a war, or a change in work?\nNow tap it."},"s":"Hit the Factory Fast-Forward.\nSay: hand to machine, farm to factory, village to city."},"ELEC.FTECH.L09.01":{"q":{"Which is a renewable energy source?":"Renew Rule!\nSunlight comes back every morning.\nSay the peg. Which one comes back?\nNow tap it.","Coal, oil and natural gas are called:":"Renew Rule!\nWind and sunlight are called renewable sources.\nThey are dug or pumped from underground. What are they called?\nNow tap it.","What does a hydroelectric dam use to make electricity?":"Renew Rule!\nA wind turbine uses moving air.\nHydro means water. What spins the turbines?\nNow tap it.","Which energy source will run out one day?":"Renew Rule!\nThe wind blows again tomorrow.\nSay the peg. Which one runs out?\nNow tap it.","What do solar panels collect?":"Renew Rule!\nWind turbines collect moving air.\nSolar comes from the word for sun.\nNow tap it.","Put the steps of a coal power plant in order: steam spins a turbine, coal is burned, water boils into steam, the turbine makes electricity.":"Renew Rule!\nA kettle: heat it, the water boils, it whistles.\nWhat must happen before water can boil?\nTap them in order.","A solar panel makes 300 watts. How many watts do 5 panels make?":"Renew Rule!\n4 panels of 200 watts make 800 watts.\nMultiply 300 by 5.\nType the number.","Why are many people building wind and solar power?":"Renew Rule!\nSaving coins in a jar means you will not run out.\nSay the peg. What is special about sun and wind?\nNow tap it.","A town by a big river wants clean power that comes back every day. What could it build?":"Renew Rule!\nA windy hilltop is a good place for wind turbines.\nWhich power plant uses falling river water?\nNow tap it.","Which is a fossil fuel?":"Renew Rule!\nWind is renewable.\nSay the peg. Which one runs out?\nNow tap it.","In the peg, which sources come back?":"Renew Rule!\nIn the peg, the fuels from underground run out.\nSay the peg. What comes back?\nNow tap it.","Solar panels turn sunlight into:":"Renew Rule!\nA dam turns falling water into power.\nWhat powers lights and computers?\nNow tap it.","In the peg, what happens to coal, oil and gas?":"Renew Rule!\nIn the peg, the sun returns each day.\nSay the peg. Stop after gas.\nNow tap it.","Renewable means:":"Renew Rule!\nA library book can be borrowed again and again.\nThe Sun rises again each morning. What does that show?\nNow tap it.","What gives a car energy?":"Renew Rule!\nFood gives your body energy.\nWhat do we pump into a car at the station?\nNow tap it."},"s":"Use the Renew Rule.\nSay: sun, wind and water come back; coal, oil and gas run out."},"ELEC.FNUM.L09.01":{"q":{"About what percent of Earth's surface is water?":"Per-Hundred Picture!\nAbout 21 percent of the air is oxygen.\nSay the peg. Which number goes with water?\nNow tap it.","About what percent of Earth's water is salty?":"Per-Hundred Picture!\nAbout 78 percent of the air is nitrogen.\nSay the peg. Which number goes with salty?\nNow tap it.","About what percent of the air is oxygen?":"Per-Hundred Picture!\nAbout 71 percent of Earth is covered in water.\nSay the peg. Which number goes with oxygen?\nNow tap it.","What does percent mean?":"Per-Hundred Picture!\nA century is a hundred years.\nCent means hundred. So per cent means what?\nNow tap it.","Put these from smallest to biggest percent: nitrogen in air, oxygen in air, salty water on Earth.":"Per-Hundred Picture!\n3, 30, 300: small to big.\nSay the peg. Find the smallest number.\nTap them in order.","If 71 percent of Earth's surface is water, what percent is land?":"Per-Hundred Picture!\nIf 60 percent is water, 40 percent is not.\nTake 71 away from 100.\nType the number.","About what percent of the human body is water?":"Per-Hundred Picture!\nA watermelon is about 92 percent water.\nMore than half, but not almost all.\nNow tap it.","In a class of 20 boys, 50 percent wear glasses. How many boys is that?":"Per-Hundred Picture!\n50 percent of 30 is 15.\nHalf of 20 is how many?\nType the number.","A juice label says 100 percent juice. What does that mean?":"Per-Hundred Picture!\n50 percent full means half full.\n100 out of 100. How much is that?\nNow tap it.","About what percent of the air is nitrogen?":"Per-Hundred Picture!\nOxygen is the second biggest part of the air.\nSay the peg. Which number goes with nitrogen?\nNow tap it.","Percent means out of:":"Per-Hundred Picture!\nA centipede is named for its many legs.\nCent means hundred. Write it as a number.\nNow tap it.","Most of Earth's water is:":"Per-Hundred Picture!\nMost of the air is nitrogen.\nSay the peg. What does 97 go with?\nNow tap it.","In the peg, which number goes with nitrogen?":"Per-Hundred Picture!\nIn the peg, 21 goes with oxygen.\nSay the peg. Stop at nitrogen.\nNow tap it.","What is 50 percent of 100?":"Per-Hundred Picture!\n25 percent of 100 is 25.\nThis percent means half. What is half of 100?\nNow tap it.","Which percent equals one half?":"Per-Hundred Picture!\nOne quarter equals 25 percent.\nColor half of 100 squares. How many?\nNow tap it."},"s":"Draw a Per-Hundred Picture.\nPercent means out of 100.\nSay: 71 water, 97 salty, 78 nitrogen, 21 oxygen."},"ELEC.FWORLD.L10.01":{"q":{"Which climate zone lies near the equator?":"Zone Zoom!\nMaryland is in a mild zone with four seasons.\nSay the peg. What is the middle like?\nNow tap it.","Which biome is cold, flat and treeless?":"Zone Zoom!\nA rainforest is hot and wet all year.\nRecall the three biomes in the lesson. Which was cold?\nNow tap it.","What kind of trees fill the taiga?":"Zone Zoom!\nDeserts are home to cactus plants.\nIt is cold there. Which trees stay green all winter?\nNow tap it.","Which climate zone is Maryland in?":"Zone Zoom!\nHawaii is in the tropical zone.\nSay the peg. Maryland is between the middle and a pole.\nNow tap it.","Which biome gets the most rain?":"Zone Zoom!\nDeserts get less than 10 inches of rain a year.\nWhich biome has rain in its name?\nNow tap it.","Put these zones in order from the equator to the North Pole: polar, tropical, temperate.":"Zone Zoom!\nHot soup, warm tea, cold milk: hot to cold.\nStart at the middle of the globe.\nTap them in order.","A desert gets about 8 inches of rain a year. A rainforest gets about 80 inches. How many times more rain does the rainforest get?":"Zone Zoom!\n40 is 5 times 8.\nDivide 80 by 8.\nType the number.","What is the difference between weather and climate?":"Zone Zoom!\nOne good game is not the same as a whole season record.\nWhich word is about many years, and which about today?\nNow tap it.","A scientist finds no trees, frozen ground and short summers near the Arctic. Which biome is it?":"Zone Zoom!\nThick evergreen forests farther south are taiga.\nWhich biome is cold and has no trees?\nNow tap it.","Which zone surrounds the North and South Poles?":"Zone Zoom!\nThe tropical zone is near the equator.\nSay the peg. What is at the poles?\nNow tap it.","What is a biome?":"Zone Zoom!\nA coral reef region with its own fish is an ocean area.\nRainforest, desert, tundra: what are they all?\nNow tap it.","Which is the largest land biome?":"Zone Zoom!\nThe Sahara is the largest hot desert.\nRecall the lesson: which cold forest is the largest?\nNow tap it.","In the peg, what is it like at the poles?":"Zone Zoom!\nIn the peg, the middle is hot.\nSay the peg. Stop at the poles.\nNow tap it.","Why is it hot near the equator?":"Zone Zoom!\nA flashlight aimed straight down makes a small, bright spot.\nHow does sunlight strike the middle of the Earth?\nNow tap it.","Today it is rainy. Is that weather or climate?":"Zone Zoom!\nRainy most winters for decades describes a place's pattern.\nIs one rainy day a short time or many years?\nNow tap it."},"s":"Use Zone Zoom.\nSay: hot at the middle, mild in between, cold at the poles.\nA biome has its own climate, plants and animals."},"ELEC.FNATURE.L10.01":{"q":{"Which law says a moving object keeps moving unless a force stops it?":"Motion Moves!\nThe third law is about pushes and push-backs.\nSay the peg. Which law keeps things the same?\nNow tap it.","To speed up a full shopping cart as fast as an empty one, you need:":"Motion Moves!\nA light paper ball flies far with a tiny toss.\nMore mass in the cart. Say the second part of the peg.\nNow tap it.","A rocket pushes hot gas down. What happens to the rocket?":"Motion Moves!\nA swimmer pushes water back and moves forward.\nEvery push gets a push back. Which way is the push back?\nNow tap it.","Why do you lurch forward when a bus stops suddenly?":"Motion Moves!\nA cup on a tablecloth stays put when the cloth is yanked.\nSay the first part of the peg.\nNow tap it.","What is the formula for Newton's second law?":"Motion Moves!\nSpeed equals distance divided by time.\nForce equals which two things multiplied?\nNow tap it.","Put Newton's laws in order: action and reaction, inertia, F = m × a.":"Motion Moves!\nFirst, second, third: like gold, silver, bronze.\nSay the peg. Which law comes first?\nTap them in order.","A force pushes a 4-kilogram cart so it speeds up by 3 meters per second each second. How many newtons of force is that? (F = m × a)":"Motion Moves!\n2 kilograms times 5 is 10 newtons.\nMultiply 4 by 3.\nType the number.","On Earth, a falling object speeds up by about how much each second?":"Motion Moves!\nOn the Moon, gravity is about one sixth as strong.\nPick the one just under 10.\nNow tap it.","An astronaut floating in space throws a wrench forward. What happens to him?":"Motion Moves!\nA skater who pushes a friend rolls the other way.\nEvery push gets a push back. Which way does he go?\nNow tap it.","Which law says every action has an equal and opposite reaction?":"Motion Moves!\nThe first law is about inertia.\nSay the peg. Which part is about pushes?\nNow tap it.","Inertia means an object:":"Motion Moves!\nA hockey puck on smooth ice glides a long way.\nSay the first part of the peg.\nNow tap it.","Who wrote the three laws of motion in 1687?":"Motion Moves!\nEinstein came about 200 years later.\nThe laws are named after him.\nNow tap it.","In the peg, what does every push get?":"Motion Moves!\nIn the peg, things keep doing what they are doing.\nSay the peg. What is the last part?\nNow tap it.","What slows a rolling ball on the floor?":"Motion Moves!\nAir resistance slows a falling feather.\nSomething rubs against the ball. What force is that?\nNow tap it.","A force is a:":"Motion Moves!\nEnergy lets you do work.\nKicking a ball is a force. What did you do to it?\nNow tap it."},"s":"Remember Motion Moves.\nLaw 1: things keep doing what they are doing.\nLaw 2: F = m × a.\nLaw 3: every push gets a push back."},"ELEC.FUSA.L10.01":{"q":{"Many people want a toy, but stores have very few. What usually happens to its price?":"Market Mirror!\nAfter the season, piles of unsold coats go on sale.\nSay the peg. Is the toy scarce or plentiful?\nNow tap it.","What is inflation?":"Market Mirror!\nDeflation is when prices fall across the economy.\nRecall the lesson: what happens to prices?\nNow tap it.","What is the Federal Reserve?":"Market Mirror!\nThe Treasury Department makes our paper money.\nRecall the lesson: what kind of bank is it?\nNow tap it.","Farmers grow a huge crop of apples, more than people want. What happens to apple prices?":"Market Mirror!\nWhen snow shovels are scarce in a storm, they cost more.\nSay the peg. Are apples scarce or plentiful?\nNow tap it.","GDP measures:":"Market Mirror!\nPopulation counts the people in a place.\nProduct means things made. What does GDP add up?\nNow tap it.","Put these in order to show supply and demand: the price rises, a new game becomes very popular, stores run low on the game.":"Market Mirror!\nRain falls, the river rises, the dam opens.\nWhat makes people want it in the first place?\nTap them in order.","A $100 item rises in price by 3 percent from inflation. What is the new price in dollars?":"Market Mirror!\n5 percent more on $100 makes $105.\nAdd 3 percent of 100 to 100.\nType the number.","What does the government use taxes for?":"Market Mirror!\nDues in a club pay for its trips and supplies.\nWho pays for highways and fire trucks?\nNow tap it.","A store owner sees that everyone wants umbrellas on a rainy day and few are left. What might he do?":"Market Mirror!\nA baker with too many rolls at closing marks them down.\nSay the peg. Scarce goes which way?\nNow tap it.","In the peg, what happens to the price of something scarce?":"Market Mirror!\nIn the peg, plenty drops.\nSay the peg. Stop at scarce.\nNow tap it.","When there is inflation, a dollar buys:":"Market Mirror!\nIf bread costs more, the same money gets fewer loaves.\nIf prices go up, how far does your dollar go?\nNow tap it.","Who raises and lowers interest rates for the whole country?":"Market Mirror!\nCongress writes the tax laws.\nWhich central bank did the lesson name?\nNow tap it.","In the peg, what sets the price?":"Market Mirror!\nIn the peg, plenty goes down.\nSay the peg. What is at the end?\nNow tap it.","Demand means:":"Market Mirror!\nSupply means the amount of something available.\nWhich word is about wanting?\nNow tap it.","A haircut is a:":"Market Mirror!\nA loaf of bread is a thing you can hold.\nCan you hold a haircut, or is it work done for you?\nNow tap it."},"s":"Look in the Market Mirror.\nSay: scarce goes up, plenty goes down: supply and demand set the price."},"ELEC.FPAST.L10.01":{"q":{"When did World War I take place?":"War Years!\nThe Civil War lasted from 1861 to 1865.\nSay the peg. Which years go with the first war?\nNow tap it.","What attack brought the United States into World War II?":"War Years!\nFort Sumter began the Civil War in 1861.\nRecall the lesson: which place in Hawaii was attacked?\nNow tap it.","Where did the D-Day landings happen?":"War Years!\nPearl Harbor is in Hawaii.\nRecall the lesson: which beaches in France?\nNow tap it.","When did World War II end?":"War Years!\nWorld War I ended in 1918.\nSay the peg. What is the last year?\nNow tap it.","Which world organization was founded in 1945 to help keep peace?":"War Years!\nNATO was formed in 1949 as a defense alliance.\nWhich group of nations did the lesson name?\nNow tap it.","Put these in order: D-Day, World War I begins, Pearl Harbor is attacked, World War II ends.":"War Years!\n1776 comes before 1865.\nSay the peg. Find the earliest year.\nTap them in order.","World War II lasted from 1939 to 1945. How many years was that?":"War Years!\n1914 to 1918 is 4 years.\nTake 1939 away from 1945.\nType the number.","Who was President when Pearl Harbor was attacked?":"War Years!\nLincoln led during the Civil War.\nWhich President was elected four times?\nNow tap it.","A history book says, \"June 6, 1944: soldiers storm the beaches of France.\" What event is this?":"War Years!\nDecember 7, 1941 was Pearl Harbor.\nWhich day is named with just one letter?\nNow tap it.","When did World War II begin?":"War Years!\nWorld War I began in 1914.\nSay the peg. Which year starts the second war?\nNow tap it.","On what date was Pearl Harbor attacked?":"War Years!\nJune 6, 1944 was D-Day.\nRecall the lesson: which December date?\nNow tap it.","World War I took place from:":"War Years!\nWorld War II was from 1939 to 1945.\nSay the peg. Which years go with the first war?\nNow tap it.","How many years after World War I ended did World War II begin?":"War Years!\nFrom 1945 to 1950 is 5 years.\nTake 1918 away from 1939.\nNow tap it.","World War II ended in:":"War Years!\nWorld War I ended in 1918.\nRecall the lesson's short way to say the year.\nNow tap it.","A world war is a war:":"War Years!\nA civil war is fought inside one country.\nWhy is it called a world war?\nNow tap it."},"s":"Learn the War Years.\nSay: World War I, 1914 to 1918; World War II, 1939 to 1945."},"ELEC.FTECH.L10.01":{"q":{"Which force pushes an airplane up?":"Four Forces!\nWeight pulls the plane down toward the ground.\nSay the peg. Which force goes up?\nNow tap it.","What part of the airplane makes most of the lift?":"Four Forces!\nThe engines make thrust to push the plane forward.\nWhich part has the curved shape that air flows over?\nNow tap it.","Why can a rocket fly in space, where there is no air?":"Four Forces!\nA balloon let go zooms as air rushes out.\nEvery push gets a push back. What does the rocket push?\nNow tap it.","Which force slows an airplane down as it moves through the air?":"Four Forces!\nThrust pushes the plane forward.\nSay the peg. Which force goes back?\nNow tap it.","What gives an airplane its thrust?":"Four Forces!\nThe wings give the plane its lift.\nWhat roars and pushes the plane forward?\nNow tap it.","Put the four forces in the order of the peg.":"Four Forces!\nCompass order: north, east, south, west.\nSay the peg. Which force comes first?\nTap them in order.","The Wright brothers' first flight in 1903 went about 120 feet. A big jet's wingspan can be about 200 feet. How many feet longer is that wingspan?":"Four Forces!\n150 minus 100 is 50.\nTake 120 away from 200.\nType the number.","For an airplane to climb, which force must be bigger than its weight?":"Four Forces!\nTo speed up, thrust must beat drag.\nSay the peg. Which force goes up against weight?\nNow tap it.","A paper airplane with long wings is thrown hard. What does the throw give it?":"Four Forces!\nThe paper's long wings give it lift.\nSay the peg. Which force goes forward?\nNow tap it.","In the peg, which force goes down?":"Four Forces!\nIn the peg, lift goes up.\nSay the peg. Stop at down.\nNow tap it.","Who made the first powered airplane flight, in 1903?":"Four Forces!\nLindbergh flew alone across the Atlantic in 1927.\nWhich two brothers flew at Kitty Hawk?\nNow tap it.","What does a wing's curved shape help make?":"Four Forces!\nEngines make thrust.\nSay the peg. Wings make which force?\nNow tap it.","In the peg, which force goes back?":"Four Forces!\nIn the peg, thrust goes forward.\nSay the peg. Stop at back.\nNow tap it.","If weight is bigger than lift, the plane:":"Four Forces!\nIf lift wins, the plane climbs.\nWeight pulls down. If it wins, what happens?\nNow tap it.","When you wave a big book, what pushes back?":"Four Forces!\nIn a pool, water pushes back when you walk.\nWhat invisible stuff is all around you?\nNow tap it."},"s":"Learn the Four Forces.\nSay: lift up, weight down, thrust forward, drag back."},"ELEC.FNUM.L10.01":{"q":{"What is 10 to the 2nd power (10²)?":"Zero Counter!\n10 to the 4th is 10,000.\nSay the peg. How many zeros for the power 2?\nNow tap it.","How is 4,000 written in scientific notation?":"Zero Counter!\n6,000,000 is 6 × 10⁶.\nCount the zeros in 4,000.\nNow tap it.","How many zeros are in 10⁸?":"Zero Counter!\n10⁵ is 100,000, with five zeros.\nSay the peg. The power tells what?\nNow tap it.","What is 10⁶?":"Zero Counter!\n10³ is a thousand.\nSay the peg. Count the zeros.\nNow tap it.","Put these in order from smallest to biggest: 10⁹, 10², 10⁶, 10³.":"Zero Counter!\n1, 2, 3 grow bigger.\nFind the smallest power first.\nTap them in order.","Write 6 × 10³ as a regular number.":"Zero Counter!\n2 × 10³ is 2,000.\nWrite 6, then add three zeros.\nType the number.","About 8 billion people live on Earth. How is that written in scientific notation?":"Zero Counter!\nA million is 10⁶.\nCount the zeros in 8,000,000,000.\nNow tap it.","How many zeros are in one billion?":"Zero Counter!\nOne million has six zeros.\nWrite 1,000,000,000 and count the zeros.\nType the number.","A scientist writes that a tiny germ is 2 × 10⁻⁶ meters long. Is that tiny or huge?":"Zero Counter!\n10⁻³ is one thousandth.\nA negative power means divide. Big or small?\nNow tap it.","What is 10³?":"Zero Counter!\n10⁶ is a million.\nSay the peg. How many zeros for 3?\nNow tap it.","Write 5,000,000 in scientific notation.":"Zero Counter!\n3,000 is 3 × 10³.\nCount the zeros in 5,000,000.\nNow tap it.","In 10⁸, what does the 8 tell you?":"Zero Counter!\nIn 2³, the 3 says to multiply three 2s.\nSay the peg. What does the power tell?\nNow tap it.","In the peg, 10 to the 6th is:":"Zero Counter!\nIn the peg, 10 to the 3rd is 1,000.\nSay the peg. Stop at the 6th.\nNow tap it.","10⁴ = ?":"Zero Counter!\n10¹ is 10, with one zero.\nStart at 10³ and add one zero.\nNow tap it.","What is 45 × 10?":"Zero Counter!\n12 × 10 is 120.\nAdd one zero to the end of 45.\nNow tap it."},"s":"Use the Zero Counter.\nThe power tells the zeros.\nScientific notation: a number from 1 to 10 times a power of ten."},"ELEC.FWORLD.L11.01":{"q":{"Which river is usually listed as the longest in the world?":"River and Range!\nThe Amazon carries the most water of any river.\nSay the peg. Which river is long?\nNow tap it.","In which mountain range is Mount Everest?":"River and Range!\nThe Andes run down the west side of South America.\nSay the peg. Which range is high?\nNow tap it.","Which is the longest mountain range on land?":"River and Range!\nThe Alps run across Switzerland and nearby lands.\nSay the peg. Which range goes on and on?\nNow tap it.","Which river is the strongest, carrying the greatest flow of water?":"River and Range!\nThe Nile is the long one in the peg.\nSay the peg. Which river is strong?\nNow tap it.","Which old, worn-down mountain range runs through western Maryland?":"River and Range!\nThe Rockies run through Colorado, out west.\nWhich range lies along the eastern United States?\nNow tap it.","Put these rivers in order from longest to shortest: the Mississippi (about 2,300 miles), the Nile (about 4,100 miles), the Potomac (about 400 miles).":"River and Range!\n1,000 is bigger than 300.\nFind the biggest number of miles.\nTap them in order.","The Andes are about 4,300 miles long. The Rocky Mountains are about 3,000 miles long. How many miles longer are the Andes?":"River and Range!\n5,000 minus 2,000 is 3,000.\nTake 3,000 away from 4,300.\nType the number.","Into which sea does the Nile flow?":"River and Range!\nThe Mississippi flows into the Gulf of Mexico.\nThe Nile flows north. Which sea lies north of Egypt?\nNow tap it.","A climber wants to try the highest peaks on Earth. Which range should he visit?":"River and Range!\nFor the longest range, he would go to South America.\nSay the peg. Which range is high?\nNow tap it.","In the peg, what is the Amazon?":"River and Range!\nIn the peg, the Nile is long.\nSay the peg. Stop at the Amazon.\nNow tap it.","On which continent is the Nile?":"River and Range!\nThe Amazon is in South America.\nMitzrayim is on which continent?\nNow tap it.","Which mountains are the highest on Earth?":"River and Range!\nThe Andes are the longest range.\nSay the peg. Which range is high?\nNow tap it.","In the peg, which range goes on and on?":"River and Range!\nIn the peg, the Himalayas are high.\nSay the peg. Stop at on and on.\nNow tap it.","Which continent holds the Himalayas?":"River and Range!\nThe Nile flows through Africa.\nEverest is between Nepal and China. Which continent?\nNow tap it.","A mountain range is:":"River and Range!\nA string of islands in a row is called a chain too.\nMany mountains in a long line make what?\nNow tap it."},"s":"Learn River and Range.\nSay: Nile is long, Amazon is strong, Himalayas high, Andes go on and on."},"ELEC.FNATURE.L11.01":{"q":{"What is the pH of pure water?":"pH Ladder!\nLemon juice is about pH 2.\nSay the peg. Which number is neutral?\nNow tap it.","Lemon juice has a pH of about 2. Is it an acid or a base?":"pH Ladder!\nSoap has a pH of about 10.\nSay the peg. Is 2 below or above 7?\nNow tap it.","Baking soda in water has a pH of about 8. What is it?":"pH Ladder!\nVinegar has a pH of about 3.\nSay the peg. Is 8 below or above 7?\nNow tap it.","Which of these is most acidic?":"pH Ladder!\nThe lower the pH, the stronger the acid.\nFind the smallest pH number.\nNow tap it.","What does an acid usually taste like?":"pH Ladder!\nBases often taste bitter.\nSay the peg. What kind of acid?\nNow tap it.","Put these in order from most acidic to most basic: soap (pH 10), lemon juice (pH 2), water (pH 7).":"pH Ladder!\n1, 5, 9: low to high.\nFind the lowest pH first.\nTap them in order.","The pH scale runs from 0 up to what number?":"pH Ladder!\nA clock face runs from 1 to 12.\nNeutral 7 is the middle. Double it.\nType the number.","What happens when you mix an acid with a base?":"pH Ladder!\nHot and cold water mixed make warm water.\nLow and high pH meet. Where do they move?\nNow tap it.","A test strip shows pH 12 for a cleaner. What should you do?":"pH Ladder!\nBattery acid, near pH 1, is dangerous too.\nIs 12 near 7, or far above it?\nNow tap it.","A substance with pH 7 is:":"pH Ladder!\nA pH of 3 is acidic.\nSay the peg. What is exactly 7?\nNow tap it.","Soap feels slippery. It is probably:":"pH Ladder!\nVinegar tastes sour.\nSay the peg. What is slippery?\nNow tap it.","Vinegar has a pH of about 3. It is:":"pH Ladder!\nAmmonia has a pH of about 11.\nSay the peg. Is 3 below or above 7?\nNow tap it.","In the peg, what is above 7?":"pH Ladder!\nIn the peg, below 7 is sour acid.\nSay the peg. Stop at above 7.\nNow tap it.","Is pH 5 an acid or a base?":"pH Ladder!\npH 8 is just above neutral.\nIs 5 below 7 or above it?\nNow tap it.","On the pH scale, which number is lowest?":"pH Ladder!\nOn a thermometer, the bottom shows the coldest.\nWhere does the scale start?\nNow tap it."},"s":"Climb the pH Ladder.\nSay: below 7 is sour acid, 7 is neutral, above 7 is slippery base."},"ELEC.FUSA.L11.01":{"q":{"Which case established judicial review?":"Case File!\nBrown v. Board of Education was decided in 1954.\nSay the peg. Which case gave the Court its check?\nNow tap it.","What did Brown v. Board of Education end?":"Case File!\nMarbury v. Madison set up judicial review.\nSay the peg. Brown ended what?\nNow tap it.","Miranda warnings tell an arrested person about:":"Case File!\nGideon v. Wainwright gave poor defendants the right to a lawyer.\nSay the peg. What right did Miranda give?\nNow tap it.","What is judicial review?":"Case File!\nA veto is the President's power to reject a bill.\nSay the peg. What check did Marbury give the Court?\nNow tap it.","In what year was Brown v. Board of Education decided?":"Case File!\nMiranda v. Arizona was decided in 1966.\nRecall the lesson: which year went with Brown?\nNow tap it.","Put these cases in time order: Miranda v. Arizona, Marbury v. Madison, Brown v. Board of Education.":"Case
