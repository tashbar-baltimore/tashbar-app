Object.assign(D,{"ELEC.FWORLD.L01.01":{"q":{"Is the ocean land or water?":"Color Clue!\nA lake is blue on a map, so it is wet.\nThink: can you swim in the ocean?\nNow tap it.","Is a mountain land or water?":"Color Clue!\nA hill is made of ground, so it is dry.\nIs a mountain made of ground, or is it wet?\nNow tap it.","Which one flows: a river or a field?":"Color Clue!\nA stream moves along too, splashing over rocks.\nWhich one is wet and moving?\nNow tap it.","On a map, blue shows what: water, land, or a road?":"Color Clue!\nGreen on a map shows grass and fields.\nWhat color is it? What is that color for?\nNow tap it.","Which is land: a field or a deep lake?":"Color Clue!\nA beach is sand you can stand on.\nWhich one can you stand on without getting wet?\nNow tap it.","Put them from smallest to biggest: ocean, puddle, lake.":"Color Clue!\nA cup is small, and a bathtub is bigger.\nStart with the one you can step over.\nTap them in order.","An island is land with water all around it. Count the islands: 🏝️ 🏝️ 🏝️ 🏝️. How many islands?":"Color Clue!\nThree sheep: one, two, three.\nCount each island out loud.\nType the number.","An island has water all around it. Is an island land or water?":"Color Clue!\nOn a map, a green spot means ground.\nIs it blue or green on a map?\nNow tap it.","Abba says, \"We will swim in the lake.\" Is the lake land or water?":"Color Clue!\nWe ride bikes on the path, so the path is ground.\nWhere do you swim?\nNow tap it.","Which is water: an ocean or a hill?":"Color Clue!\nA pond is blue on a map.\nWhich one is blue on a map?\nNow tap it.","Which is land: a mountain or a lake?":"Color Clue!\nA valley is green or brown on a map.\nWhich one is green or brown?\nNow tap it.","What color is water on a map: blue or green?":"Color Clue!\nBrown on a map shows hills and mountains.\nThink of the sea. What color is it on a map?\nNow tap it.","On a globe, is there more water or more land?":"Color Clue!\nA fishbowl looks mostly blue, because it is mostly wet.\nLook at the globe. Is most of it blue?\nNow tap it.","Can you stand on a field: yes or no?":"Color Clue!\nA floor holds you up when you stand on it.\nDoes a field hold you up?\nNow tap it.","Is sand on a sunny day wet or dry?":"Color Clue!\nA towel after a bath feels wet.\nThink of warm sand in the sun. How does it feel?\nNow tap it."},"s":"Use the Color Clue.\nBlue is water.\nGreen and brown are land.\nAsk: can I stand on it?"},"ELEC.FNATURE.L01.01":{"q":{"How many seasons are in a year: four or two?":"Weather Watch!\nA week has seven days, and each day has a name.\nCount the seasons in the rhyme.\nNow tap it.","Which season is coldest: winter or summer?":"Weather Watch!\nHot cocoa warms us when the weather is freezing.\nIn which season do we wear mittens?\nNow tap it.","Which season is hottest: summer or winter?":"Weather Watch!\nIce pops melt fast on a very warm day.\nWhen do we go to the pool in short sleeves?\nNow tap it.","In which season do flowers start to grow: spring or winter?":"Weather Watch!\nIn the rhyme, glow goes with the sunny season.\nFind grow in the rhyme. Which season matches?\nNow tap it.","In which season do leaves fall off the trees: fall or summer?":"Weather Watch!\nIn winter, snow covers the bare branches.\nWhen do leaves turn red and orange?\nNow tap it.","Put the seasons in order, starting with winter.":"Weather Watch!\nDays go in order too: Sunday comes before Monday.\nStart with snow. What comes after?\nTap them in order.","How many seasons are in one year?":"Weather Watch!\nDays in a week: count them, Sunday to Shabbos.\nSay each season and count.\nType the number.","What do we wear in winter: a coat or sandals?":"Weather Watch!\nIn summer we wear a sun hat.\nThink of snow. What keeps you warm?\nNow tap it.","It is snowing, and the trees are bare. What season is it: winter or spring?":"Weather Watch!\nWarm rain and new buds mean things start growing.\nSnow comes first in the rhyme. Which season?\nNow tap it.","Which season comes after summer: fall or winter?":"Weather Watch!\nAfter winter comes spring, when things grow.\nSay the rhyme. What comes after glow?\nNow tap it.","In which season do new leaves and flowers grow: spring or fall?":"Weather Watch!\nIn summer, fruit gets big and ripe.\nWhich season goes with grow in the rhyme?\nNow tap it.","In which season do we swim and feel the strong sun: summer or fall?":"Weather Watch!\nIn winter we sled on snowy hills.\nWhich season goes with glow?\nNow tap it.","Which word in the rhyme goes with fall: blow or snow?":"Weather Watch!\nGlow goes with summer, when the sun shines.\nWhat does the wind do to fall leaves?\nNow tap it.","Is summer hot or cold?":"Weather Watch!\nIce cubes feel like a winter day.\nThink of the sun at the pool.\nNow tap it.","When white flakes fall from the sky, is it snowy or windy?":"Weather Watch!\nWhen drops of water fall, it is rainy.\nWhat are white flakes from the sky called?\nNow tap it."},"s":"Do a Weather Watch.\nLook at the sky, trees and clothes.\nSay: snow, grow, glow, blow.\nMatch the season."},"ELEC.FUSA.L01.01":{"q":{"What colors are on our flag: red, white and blue, or green and yellow?":"Flag Detective!\nA lemon is yellow and grass is green.\nLook at the flag. Name each color you see.\nNow tap it.","Where are the stars: in a blue box or on a green circle?":"Flag Detective!\nOn a clock, the numbers go around in a circle.\nLook at the corner of the flag. What shape and color?\nNow tap it.","Does the flag have stripes or dots?":"Flag Detective!\nA zebra has long lines, and a ladybug has round spots.\nLook at the long lines across the flag.\nNow tap it.","How many colors are on our flag: three or five?":"Flag Detective!\nA rainbow has many colors in a curve.\nName the flag colors and count them.\nNow tap it.","Put in order from fewest to most: 50 stars, 3 colors, 13 stripes.":"Flag Detective!\n1 cup is less than 2 cups.\nFind the smallest number first.\nTap them in order.","Our flag has red stripes and white stripes. Count these stripes: 🟥 ⬜ 🟥 ⬜ 🟥. How many stripes?":"Flag Detective!\nCount two hats: one, two. That makes two.\nTouch each stripe and count out loud.\nType the number.","What shapes are on our flag: stars or moons?":"Flag Detective!\nA ruler has little lines along its edge.\nLook at the blue box. What shapes do you see?\nNow tap it.","How many stars are on our flag: 50 or 10?":"Flag Detective!\nOur flag has 13 stripes, one for each first state.\nOne star for each state. How many states?\nNow tap it.","You see a flag with 50 stars and 13 stripes. Is it the flag of America or of Canada?":"Flag Detective!\nA flag with a red circle on white is Japan.\nWhich country has 50 states?\nNow tap it.","How many stripes are on our flag: 13 or 3?":"Flag Detective!\nOur flag has 50 stars, one for each state.\nSay the peg. How many stripes for the first states?\nNow tap it.","What color is the box with the stars: blue or red?":"Flag Detective!\nThe stripes are red and white.\nLook at the top corner. What color is behind the stars?\nNow tap it.","Our flag stands for which country: the United States or England?":"Flag Detective!\nA flag with a red maple leaf is Canada.\nWhose flag hangs outside our post office?\nNow tap it.","Stars stand for what: states or cities?":"Flag Detective!\nStripes stand for the first 13 parts of America.\nSay the peg. Stars for what?\nNow tap it.","Is there blue on our flag: yes or no?":"Flag Detective!\nIs there purple on a banana? It is yellow.\nLook at the corner with the stars.\nNow tap it.","Which shape has five tips: a star or a stripe?":"Flag Detective!\nA square has four sides that are the same.\nCount the tips on each shape.\nNow tap it."},"s":"Be a Flag Detective.\nLook at the colors and shapes.\nSay: 50 stars for 50 states, 13 stripes for the first 13."},"ELEC.FPAST.L01.01":{"q":{"Long ago, what gave light at night: a candle or a lamp with a bulb?":"Then and Now!\nLong ago, people washed clothes in a tub.\nLong ago there was no electricity. Which light needs none?\nNow tap it.","Long ago, how did people travel: by horse or by car on a highway?":"Then and Now!\nLong ago, children wrote with a feather pen and ink.\nThere were no cars long ago. What animal carried people?\nNow tap it.","Today, how can you talk to Zeidy far away right now: a phone or a letter?":"Then and Now!\nToday we cook on a stove, not over a fire.\nWhich one lets you hear Zeidy right now?\nNow tap it.","Which is from today: a car or a wagon?":"Then and Now!\nToday we turn on a light with a switch.\nWhich one has an engine?\nNow tap it.","Long ago, how did people get water: from a well or from a faucet?":"Then and Now!\nLong ago, people kept food cold with ice blocks.\nWhich one needs no pipes?\nNow tap it.","Put in order from long ago to today: train, airplane, horse.":"Then and Now!\nA candle came first, then a light bulb.\nWhich is oldest? Which is newest?\nTap them in order.","Long ago, people lit candles for light. Count the candles: 🕯️ 🕯️ 🕯️ 🕯️ 🕯️ 🕯️. How many candles?":"Then and Now!\nCount two lamps: one, two. That makes two.\nTouch each candle and count.\nType the number.","Which is from long ago: a feather pen or a computer screen?":"Then and Now!\nLong ago, people rode in wagons.\nWhich one needs no electricity?\nNow tap it.","Zeidy says, \"When I was small, we had no phone at home.\" Is that long ago or today?":"Then and Now!\nYesterday is just a short time back.\nWas Zeidy small many years before you?\nNow tap it.","Which is from today: a light bulb or a tall wax candle?":"Then and Now!\nToday we ride in cars, not wagons.\nWhich one needs electricity?\nNow tap it.","Long ago, what pulled the wagon: a horse or an engine?":"Then and Now!\nLong ago, people lit candles at night.\nWhich one is an animal?\nNow tap it.","Which is newer: a phone or a letter?":"Then and Now!\nA light bulb is newer than a candle.\nWhich one needs electricity?\nNow tap it.","The candle's partner today is the lamp or the horse?":"Then and Now!\nThe partner of the horse today is the car.\nBoth give light. Which one?\nNow tap it.","Does a candle need electricity: yes or no?":"Then and Now!\nA flashlight needs a battery to shine.\nYou light a candle with a match.\nNow tap it.","A pencil made today is old or new?":"Then and Now!\nA torn, faded book is old.\nIt was made today. Is that a long time back?\nNow tap it."},"s":"Think Then and Now.\nAsk: does it need electricity?\nOld things came first.\nNew things came later."},"ELEC.FTECH.L01.01":{"q":{"A window is made of glass or wood?":"Touch Test!\nA spoon is shiny, so it is made of metal.\nCan you see through a window?\nNow tap it.","Where does wood come from: trees or rocks?":"Touch Test!\nWool for warm sweaters comes from sheep.\nWood grows. What grows in a forest?\nNow tap it.","A key is made of metal or cloth?":"Touch Test!\nA towel is soft, so it is cloth.\nIs a key soft, or hard and shiny?\nNow tap it.","A shirt is made of cloth or glass?":"Touch Test!\nA cup you can see through is glass.\nIs a shirt soft or hard?\nNow tap it.","A table is made of wood or cloth?":"Touch Test!\nA pillow cover is soft, so it is cloth.\nIs the table hard? Did it come from a tree?\nNow tap it.","Put in order how a wooden chair is made: chair, tree, wood.":"Touch Test!\nSheep give wool, wool makes yarn, yarn makes a sweater.\nWhat grows first? What is made last?\nTap them in order.","Coins are made of metal. Count the coins: 🪙 🪙 🪙 🪙 🪙 🪙 🪙. How many coins?":"Touch Test!\nCount two keys: one, two.\nTouch each coin and count.\nType the number.","Which one can you see through: glass or a wooden board?":"Touch Test!\nClean water in a cup is clear too.\nWhich one lets light shine through?\nNow tap it.","Yossi's spoon is hard, cold and shiny. What is it made of: metal or cloth?":"Touch Test!\nA soft, warm blanket is made of cloth.\nHard, cold and shiny. Say the peg.\nNow tap it.","A pencil is made of wood or glass?":"Touch Test!\nA drinking cup you can see through is glass.\nIs a pencil clear, or did it come from a tree?\nNow tap it.","A coin is made of metal or cloth?":"Touch Test!\nA soft hat is made of cloth.\nIs a coin soft or shiny?\nNow tap it.","A jar you can see through is made of glass or wood?":"Touch Test!\nA wooden spoon came from a tree.\nCan you see the jam inside?\nNow tap it.","Which one is soft: cloth or metal?":"Touch Test!\nWood grows on trees.\nSay the peg. Which one is soft?\nNow tap it.","Is a pillow hard or soft?":"Touch Test!\nA rock is hard when you tap it.\nSqueeze a pillow. What happens?\nNow tap it.","Is a mirror shiny or rough?":"Touch Test!\nA puddle in the sun sparkles with light.\nDo you see a picture of the room in a mirror?\nNow tap it."},"s":"Do the Touch Test.\nHard, soft, shiny or clear?\nSay: wood grows, metal shines, glass is clear, cloth is soft."},"ELEC.FNUM.L01.01":{"q":{"How many days are in a week: seven or five?":"Day Train!\nCount the seasons: winter, spring, summer, fall makes four.\nSay the days and count each one.\nNow tap it.","Which day comes after Sunday: Monday or Friday?":"Day Train!\nAfter Tuesday comes Wednesday on the Day Train.\nRide the train from Sunday. Which car is next?\nNow tap it.","Which day is the day before Shabbos: Friday or Sunday?":"Day Train!\nThe day before Monday is Sunday.\nFind Shabbos on the train. Go back one car.\nNow tap it.","What is the seventh day: Shabbos or Tuesday?":"Day Train!\nThe first day is Sunday.\nCount to the last car on the Day Train.\nNow tap it.","Put the first three days of the week in order.":"Day Train!\nThursday, then Friday, then Shabbos at the end.\nStart the Day Train at the very front.\nTap them in order.","How many days are in a week?":"Day Train!\nA pair of shoes is two shoes.\nSay each day and count.\nType the number.","Which day comes after Wednesday: Thursday or Monday?":"Day Train!\nAfter Monday comes Tuesday.\nFind Wednesday. Which car is next?\nNow tap it.","Which day is our holy day of rest: Shabbos or Monday?":"Day Train!\nOn Friday we get ready, cook and clean.\nWhich day do we light candles for, and rest?\nNow tap it.","Today is Friday. What day is tomorrow: Shabbos or Thursday?":"Day Train!\nIf today is Monday, tomorrow is Tuesday.\nFind Friday. Which car comes next?\nNow tap it.","Which day is first in the week: Sunday or Shabbos?":"Day Train!\nShabbos is the last car of the train.\nWhich car is at the front of the Day Train?\nNow tap it.","Which day comes after Tuesday: Wednesday or Sunday?":"Day Train!\nAfter Thursday comes Friday.\nFind Tuesday. Go to the next car.\nNow tap it.","Which day comes after Thursday: Friday or Monday?":"Day Train!\nAfter Sunday comes Monday.\nFind Thursday. Which car is next?\nNow tap it.","Which car on the Day Train is Shabbos: the last car or the first car?":"Day Train!\nSunday is the front car of the train.\nShabbos is day seven. Where is seven?\nNow tap it.","Which day comes after Monday: Tuesday or Friday?":"Day Train!\nAfter Sunday comes Monday.\nSay: Sunday, Monday, and the next one.\nNow tap it.","Count: 1, 2, 3, 4, 5, 6. What number comes next: 7 or 10?":"Day Train!\nAfter 3 comes 4.\nCount up from 6 by one.\nNow tap it."},"s":"Ride the Day Train.\nSunday is first.\nShabbos is the seventh day.\nFind the day, then the next car."},"ELEC.FWORLD.L02.01":{"q":{"Which is round like a ball: a globe or a map?":"Map Explorer!\nA paper drawing of your street lies flat on a table.\nWhich one can you spin around?\nNow tap it.","On most maps, which way is up: north or south?":"Map Explorer!\nOn most maps, east is on the right side.\nSay the peg. Which word is at the top?\nNow tap it.","What tells you what the map pictures mean: the map key or the title?":"Map Explorer!\nA dictionary tells you what a word means.\nWhich part of the map explains the little pictures?\nNow tap it.","Which is flat: a map or a globe?":"Map Explorer!\nA ball is round, and a sheet of paper is flat.\nWhich one could lie flat on your desk?\nNow tap it.","On most maps, which way is down: south or east?":"Map Explorer!\nThe opposite of left is right.\nUp is north. What is the opposite of north?\nNow tap it.","Go around the compass like a clock, starting at the top: West, South, North, East.":"Map Explorer!\nA clock goes 12, then 3, then 6, then 9.\nStart at the top. Say the peg.\nTap them in order.","The main directions are north, south, east and west. How many main directions are there?":"Map Explorer!\nA triangle has three sides.\nSay each direction and count.\nType the number.","On a map key, a tiny tree means: a park or a school?":"Map Explorer!\nA tiny train track on a map key means a railroad.\nWhere do lots of trees grow in a town?\nNow tap it.","The shul is at the top of the map. Which way is the shul from the middle: north or south?":"Map Explorer!\nSomething on the right side of a map is east.\nWhich direction is at the top of most maps?\nNow tap it.","A round model of the whole Earth is called a globe or a map?":"Map Explorer!\nA toy car is a small model of a real car.\nWhich one is round like the Earth?\nNow tap it.","On most maps, which side is east: the right or the left?":"Map Explorer!\nOn a clock, the 3 is a quarter of the way around.\nStart at north on top. Go around like a clock.\nNow tap it.","What helps you find which way is north: a compass or a cup?":"Map Explorer!\nA thermometer tells how hot or cold it is.\nWhich tool has a needle that swings north?\nNow tap it.","In the peg, which word stands for east: Eat or Soggy?":"Map Explorer!\nNever is the word for north.\nEast starts with the letter E. Find it.\nNow tap it.","Is up on a map north or south?":"Map Explorer!\nOn a map, the right side is east.\nUp is the top. Which word goes with the top?\nNow tap it.","A map shows a place as seen from: above or under the ground?":"Map Explorer!\nA bird flying over a field sees the whole field.\nWhere would you be to see a whole town?\nNow tap it."},"s":"Be a Map Explorer.\nNorth is up on most maps.\nSay: Never Eat Soggy Waffles.\nUse the map key."},"ELEC.FNATURE.L02.01":{"q":{"Where does a bird live: in a nest or in a hive?":"Home Finder!\nA bear sleeps in a den all winter.\nWhich home is made of twigs in a tree?\nNow tap it.","Where do bees make honey: in a hive or in a den?":"Home Finder!\nA rabbit digs a burrow under the ground.\nWhich home has wax rooms full of honey?\nNow tap it.","Who digs a burrow under the ground: a rabbit or an eagle?":"Home Finder!\nA beaver builds a lodge of sticks in a pond.\nWhich animal digs with strong feet?\nNow tap it.","Where does a bear sleep in winter: a den, a nest, or a hive?":"Home Finder!\nA bird lays eggs in a nest.\nWhich home is a warm cave?\nNow tap it.","Where does a fish live: in the water or in a tree?":"Home Finder!\nA squirrel builds a nest high up in a tree.\nFish need to swim. Where can they swim?\nNow tap it.","Put the homes in the order the peg says them.":"Home Finder!\nIn the alphabet song, A, B, C come in order.\nSay the peg slowly. Which home comes first?\nTap them in order.","One nest has 3 eggs. Another nest has 2 eggs. How many eggs in all?":"Home Finder!\nTwo bees and two bees make four bees.\nCount the first nest, then keep counting.\nType the number.","Where does a beaver live: in a lodge or in a hive?":"Home Finder!\nBees build wax rooms for honey.\nWhich home is made of sticks in a pond?\nNow tap it.","Yossi sees a bird carrying twigs up a tree. What is it building: a nest or a burrow?":"Home Finder!\nA rabbit digs a tunnel in the dirt.\nTwigs in a tree make what kind of home?\nNow tap it.","Where does a bee live: in a hive or in a den?":"Home Finder!\nA fox rests in a den in the woods.\nSay the peg. Bee goes with what?\nNow tap it.","Who lives in a nest: a bird or a fish?":"Home Finder!\nA bee lives in a hive.\nWhich one can fly up to a tree?\nNow tap it.","A bear rests in a cave all winter. The cave is its: den or nest?":"Home Finder!\nA rabbit hides in a burrow.\nSay the peg. Bear goes with what?\nNow tap it.","In the peg, the sea is for a fish or a bear?":"Home Finder!\nThe hive is for a bee in the peg.\nWhich animal swims?\nNow tap it.","Is a nest up in a tree or down in a cave?":"Home Finder!\nA burrow is a tunnel under the dirt.\nWhere do birds fly up to?\nNow tap it.","Why do animals need homes: to stay safe or to go shopping?":"Home Finder!\nOur houses keep us dry when it rains.\nWhat does a home keep out?\nNow tap it."},"s":"Be a Home Finder.\nSay: nest for a bird, hive for a bee, den for a bear, the sea for a fish."},"ELEC.FUSA.L02.01":{"q":{"What is America's national bird: the bald eagle or the robin?":"Symbol Search!\nMaryland has its own state bird, the oriole.\nWhich big bird is in the peg?\nNow tap it.","What is special about the Liberty Bell: it has a crack, or it is made of glass?":"Symbol Search!\nThe White House is famous for its white paint.\nSay the peg. What happened to the Bell?\nNow tap it.","Who lives in the White House: the President or the mayor?":"Symbol Search!\nA king lives in a palace.\nWho leads the whole country?\nNow tap it.","What does the Statue of Liberty hold up high: a torch or a flag?":"Symbol Search!\nA lighthouse shines a bright light for ships.\nSay the peg. What is held high?\nNow tap it.","In which city is the Liberty Bell: Philadelphia or Baltimore?":"Symbol Search!\nThe White House is in Washington, D.C.\nListen to the teach again. Which city did it name?\nNow tap it.","Put the symbols in the order of the peg.":"Symbol Search!\nSeasons go in order: winter, spring, summer, fall.\nSay the peg slowly. What comes first?\nTap them in order.","Our flag has 13 stripes. Take away the 6 white stripes. How many red stripes are left?":"Symbol Search!\n10 take away 4 leaves 6.\nStart at 13. Count back the white stripes.\nType the number.","Where does the President live and work: the White House or the Liberty Bell?":"Symbol Search!\nA king lives in a palace.\nWhich one is a building you can live in?\nNow tap it.","On a coin you see a big bird with wide wings. Which American symbol is it: the bald eagle or a parrot?":"Symbol Search!\nOn a penny you see Abraham Lincoln.\nWhich bird is America's symbol?\nNow tap it.","Which symbol is cracked: the Liberty Bell or the White House?":"Symbol Search!\nThe Statue of Liberty holds a torch.\nWhich one rings?\nNow tap it.","Which bird is America's national bird: the bald eagle or the duck?":"Symbol Search!\nMaryland's state bird is the Baltimore oriole.\nWhich bird is in the peg?\nNow tap it.","What does the Statue of Liberty hold high: a torch or a hammer?":"Symbol Search!\nA lighthouse shines light for ships at night.\nWhich one gives light?\nNow tap it.","In the peg, what is high: the torch or the bell?":"Symbol Search!\nIn the peg, the eagle flies.\nReach up high. What do you hold?\nNow tap it.","A red stop sign stands for: stop or go?":"Symbol Search!\nA green light tells cars they may drive.\nWhat does a red sign at the corner tell cars?\nNow tap it.","What is the name of our country: the United States of America or Canada?":"Symbol Search!\nOur state is called Maryland.\nOur flag has 50 stars. Which country is that?\nNow tap it."},"s":"Go on a Symbol Search.\nSay: eagle flies, Bell is cracked, torch is high, White House is white."},"ELEC.FPAST.L02.01":{"q":{"Which came first: horses or airplanes?":"Travel Timeline!\nCandles came before light bulbs.\nSay the peg. Which one is near the start?\nNow tap it.","What does a train ride on: tracks or water?":"Travel Timeline!\nA boat floats on a lake.\nLook under a train. What are the long metal lines?\nNow tap it.","Who made the first airplane flight: the Wright brothers or two sailors?":"Travel Timeline!\nThomas Edison made a light bulb that worked well.\nListen again: which two brothers flew first?\nNow tap it.","Which is newer: a car or a horse?":"Travel Timeline!\nA train is newer than a wagon.\nSay the peg. Which comes later?\nNow tap it.","What makes a sailboat move: wind or tracks?":"Travel Timeline!\nA kite flies up when moving air pushes it.\nWhat pushes the big sails?\nNow tap it.","Put in order from older to newer: car, walking, airplane, train.":"Travel Timeline!\nCandle, lamp, light bulb: older to newer.\nSay the peg. Start with the oldest.\nTap them in order.","A wagon has 4 wheels. How many wheels do 2 wagons have?":"Travel Timeline!\nTwo bikes have two wheels each, so four wheels.\nCount 4 wheels, then 4 more.\nType the number.","Which one flies: an airplane or a train?":"Travel Timeline!\nA boat sails on the sea.\nWhich one has wings?\nNow tap it.","Zeidy rode a train to visit us. Then he flew home. Which is newer: the plane or the train?":"Travel Timeline!\nA car is newer than a horse.\nSay the peg. Which comes last?\nNow tap it.","Which came first: trains or airplanes?":"Travel Timeline!\nHorses came before cars.\nIn the peg, which comes earlier?\nNow tap it.","What carried people before cars: horses or rockets?":"Travel Timeline!\nBefore light bulbs, people used candles.\nWhich one is older?\nNow tap it.","Who flew the first airplane: the Wright brothers or Columbus?":"Travel Timeline!\nEdison worked on the light bulb.\nWhich two brothers flew in 1903?\nNow tap it.","In the peg, what comes right after train: car or horse?":"Travel Timeline!\nIn the peg, horse comes right after walk.\nSay the peg. Stop after train. What is next?\nNow tap it.","Did horses or cars come first?":"Travel Timeline!\nA letter came long before a phone.\nDid people ride animals before engines?\nNow tap it.","Zeidy is older than Abba. Who was born first: Zeidy or Abba?":"Travel Timeline!\nA big brother was born before his baby brother.\nOlder means born first.\nNow tap it."},"s":"Make a Travel Timeline.\nSay: walk, horse, train, car, plane.\nOlder to newer."},"ELEC.FTECH.L02.01":{"q":{"Which tool hits a nail: a hammer or a ruler?":"Tool Match!\nA saw cuts boards for building.\nWhich tool bangs?\nNow tap it.","Which tool cuts wood: a saw or a shovel?":"Tool Match!\nScissors cut paper with two blades.\nWhich tool has sharp teeth?\nNow tap it.","Which tool tells how long a pencil is: a ruler or a hammer?":"Tool Match!\nA scale tells how heavy something is.\nWhich tool has numbers along its edge?\nNow tap it.","Which tool digs a hole: a shovel, a saw, or a ruler?":"Tool Match!\nA rake gathers leaves into a pile.\nWhich tool scoops dirt?\nNow tap it.","Which tool cuts paper: scissors or a hammer?":"Tool Match!\nA saw cuts wood boards.\nWhich tool has two blades that snip?\nNow tap it.","Put the building steps in order: cut the board, measure the board, nail the board.":"Tool Match!\nFor a sandwich: get bread, add filling, close it.\nWhat must you know before you cut?\nTap them in order.","Abba has 2 hammers and 3 saws. How many tools is that?":"Tool Match!\n1 ruler and 2 shovels make 3 tools.\nCount the hammers, then keep counting.\nType the number.","Which tool turns a screw: a screwdriver or a ruler?":"Tool Match!\nA can opener opens cans.\nWhich tool has screw in its name?\nNow tap it.","Moshe wants to plant a tree. Which tool should he use first: a shovel or a ruler?":"Tool Match!\nTo cut a branch, use a saw.\nWhat does a tree need in the ground first?\nNow tap it.","Which tool measures: a ruler or a saw?":"Tool Match!\nA tape measure also shows inches.\nWhich tool has inch marks?\nNow tap it.","Which tool bangs nails: a hammer or a shovel?":"Tool Match!\nA screwdriver turns screws.\nSay the peg. Which one bangs?\nNow tap it.","Which tool cuts a wooden board: a saw or scissors?":"Tool Match!\nA knife cuts bread at the table.\nWhich tool has big sharp teeth for wood?\nNow tap it.","In the peg, which tool digs: the shovel or the hammer?":"Tool Match!\nIn the peg, the saw cuts.\nAct out scooping. Which tool is that?\nNow tap it.","A tool with a heavy head: hits or measures?":"Tool Match!\nA tool with numbers on its edge measures.\nWhat does a heavy head do to a nail?\nNow tap it.","A tool helps us: do a job or go to sleep?":"Tool Match!\nA spoon helps us eat soup.\nWhy do builders carry tools?\nNow tap it."},"s":"Play Tool Match.\nSay: hammer bangs, saw cuts, ruler measures, shovel digs.\nMatch the job."},"ELEC.FNUM.L02.01":{"q":{"How many months are in a year: 12 or 7?":"Month Ladder!\nA week has seven days.\nSay the peg. How many months in all?\nNow tap it.","Which month is first: January or June?":"Month Ladder!\nThe last month of the year is December.\nSay the peg. Which month starts the year?\nNow tap it.","Which month comes after January: February or May?":"Month Ladder!\nAfter March comes April.\nClimb one step up from January.\nNow tap it.","Which month ends the year: December or April?":"Month Ladder!\nJanuary starts the year.\nWhich month is the top step of the ladder?\nNow tap it.","Put these months in order: March, January, February.":"Month Ladder!\nDays go in order: Sunday, Monday, Tuesday.\nFind the month that starts the year.\nTap them in order.","How many months are in one year?":"Month Ladder!\nA week has seven days.\nSay all the months and count them.\nType the number.","Which month comes after June: July or March?":"Month Ladder!\nAfter April comes May.\nFind June. Climb one step.\nNow tap it.","Which month comes before December: November or October?":"Month Ladder!\nBefore March comes February.\nFind December. Step down one.\nNow tap it.","Pesach is often in April. Which month comes right before April: March or May?":"Month Ladder!\nRight before July is June.\nFind April. Go down one step.\nNow tap it.","Which month is first: January or December?":"Month Ladder!\nMay comes in spring.\nSay the peg. Which month starts?\nNow tap it.","Which month comes after April: May or March?":"Month Ladder!\nAfter July comes August.\nFind April. Climb one step.\nNow tap it.","Which month comes after September: October or June?":"Month Ladder!\nAfter November comes December.\nFind September. Climb one step.\nNow tap it.","Which month ends the year: December or January?":"Month Ladder!\nMay is in the middle of spring.\nSay the peg. Which month ends it?\nNow tap it.","Which comes after February: March or June?":"Month Ladder!\nAfter May comes June.\nSay the first three months.\nNow tap it.","Count: 9, 10, 11. What comes next: 12 or 20?":"Month Ladder!\nAfter 5 comes 6.\nCount up from 11 by one.\nNow tap it."},"s":"Climb the Month Ladder.\nJanuary starts the year.\nDecember ends it.\nFind the month, then step up or down."},"ELEC.FWORLD.L03.01":{"q":{"How many continents are there: seven or three?":"Continent Count!\nThere are five oceans on Earth.\nSay the names and count them.\nNow tap it.","Which continent do we live on: North America or Africa?":"Continent Count!\nBrazil is a country in South America.\nThe United States is on which continent?\nNow tap it.","Which continent is covered in ice: Antarctica or Australia?":"Continent Count!\nThe Sahara Desert in Africa is hot and dry.\nSay the peg. Which one is icy?\nNow tap it.","Which continent is the biggest: Asia, Europe, or Australia?":"Continent Count!\nThe Pacific is the biggest ocean.\nSay the peg. Which one is big?\nNow tap it.","Which continent is the smallest: Australia or Africa?":"Continent Count!\nRhode Island is the smallest state.\nSay the peg. Which one is little?\nNow tap it.","Put these from biggest to smallest: Australia, Asia, Africa.":"Continent Count!\nAn elephant, a dog, a mouse: big to small.\nFind the biggest. Then find the littlest.\nTap them in order.","How many continents have the word America in their name?":"Continent Count!\nEurope has just one word in its name.\nSay all seven names. Listen for America.\nType the number.","Egypt, called Mitzrayim in the Torah, is on which continent: Africa or Europe?":"Continent Count!\nJapan is a country in Asia.\nEgypt has the Nile River. Which continent?\nNow tap it.","Penguins live where it is icy, near the South Pole. Which continent is that: Antarctica or Asia?":"Continent Count!\nKangaroos live in Australia.\nSay the peg. Which continent is icy?\nNow tap it.","Baltimore is on which continent: North America or Asia?":"Continent Count!\nArgentina is a country in South America.\nBaltimore is in the United States. Which continent?\nNow tap it.","Which continent is around the South Pole: Antarctica or Europe?":"Continent Count!\nThe North Pole is in the icy Arctic Ocean.\nSay the peg. What is down south?\nNow tap it.","How many continents are on Earth: seven or nine?":"Continent Count!\nThere are five oceans.\nSay all the continent names and count.\nNow tap it.","In the peg, which continent is icy: Antarctica or Asia?":"Continent Count!\nIn the peg, Australia is little.\nShiver. Which continent makes you shiver?\nNow tap it.","Which continent is just south of North America: South America or Europe?":"Continent Count!\nCanada is just north of the United States.\nThe name gives a clue: north and south.\nNow tap it.","A continent is a giant piece of: land or water?":"Continent Count!\nAn ocean is a giant body of salty water.\nCan you walk across a continent?\nNow tap it."},"s":"Do a Continent Count.\nThere are seven.\nSay: big Asia first, little Australia last, icy Antarctica down south."},"ELEC.FNATURE.L03.01":{"q":{"Which part drinks water from the soil: the roots or the flower?":"Plant Parts Path!\nLeaves soak up sunlight to make food.\nWhich part is under the ground, in the wet soil?\nNow tap it.","Which part is like a straw: the stem or the leaf?":"Plant Parts Path!\nRoots hold the plant in place like anchors.\nWhich part carries water up the middle?\nNow tap it.","Which part makes food from sunlight: the leaves or the roots?":"Plant Parts Path!\nFlowers grow seeds for new plants.\nWhich green part spreads out to catch the sun?\nNow tap it.","Which part makes seeds: the flower, the root, or the stem?":"Plant Parts Path!\nThe stem carries water up like a straw.\nSay the peg to the end. What makes seeds?\nNow tap it.","An apple seed can grow into: an apple tree or a pine tree?":"Plant Parts Path!\nA sunflower seed grows a sunflower.\nWhat kind of plant did the seed come from?\nNow tap it.","Put the plant parts in order from the bottom up: flower, roots, leaves, stem.":"Plant Parts Path!\nA house goes floor, walls, then roof on top.\nBegin under the soil. Walk up the plant.\nTap them in order.","A plant has 6 leaves. 2 leaves fall off. How many leaves are left?":"Plant Parts Path!\n5 take away 2 leaves 3.\nStart at 6. Count back 2.\nType the number.","Why does a plant need roots: to hold it in the ground or to make it smell nice?":"Plant Parts Path!\nA tent needs pegs to stay down in the wind.\nWhat happens to a plant with no roots in a storm?\nNow tap it.","Dovid's plant has dry soil and droopy leaves. Which part needs water first: the roots or the flower?":"Plant Parts Path!\nLeaves need sunlight, so plants sit by a window.\nWhich part drinks the water from the soil?\nNow tap it.","Which part carries water up: the stem or the seed?":"Plant Parts Path!\nRoots pull water in from the soil.\nWhich part is like a straw?\nNow tap it.","Which part makes the plant's food: the leaves or the stem?":"Plant Parts Path!\nFlowers make seeds.\nWhich flat green parts catch the sunlight?\nNow tap it.","What grows into a new plant: a seed or a stem?":"Plant Parts Path!\nAn egg can hatch into a chick.\nWhat do flowers make for new plants?\nNow tap it.","In the peg, what do leaves do: make food or drink?":"Plant Parts Path!\nIn the peg, the stem lifts.\nSay the peg. Stop at leaves.\nNow tap it.","Which part is under the ground: roots or leaves?":"Plant Parts Path!\nA carrot is a root we can eat.\nWhich part hides in the dirt?\nNow tap it.","What do plants need to grow: water and sunlight, or toys?":"Plant Parts Path!\nA puppy needs food and water to grow.\nWhat do we give a plant on the windowsill?\nNow tap it."},"s":"Walk the Plant Parts Path.\nStart at the bottom.\nSay: roots drink, stem lifts, leaves make food, flowers make seeds."},"ELEC.FUSA.L03.01":{"q":{"What is the capital of Maryland: Annapolis or Baltimore?":"Maryland Map!\nThe capital of our country is Washington, D.C.\nSay the peg. Which city is the capital?\nNow tap it.","What is the biggest city in Maryland: Baltimore or Annapolis?":"Maryland Map!\nNew York City is the biggest city in the whole country.\nWhich city has the big harbor and our yeshiva?\nNow tap it.","What big water is in the middle of Maryland: the Chesapeake Bay or the Pacific Ocean?":"Maryland Map!\nThe Atlantic Ocean is east of Maryland.\nSay the peg. What is in the middle?\nNow tap it.","What is Maryland's state bird: the Baltimore oriole or the penguin?":"Maryland Map!\nThe bald eagle is the national bird.\nWhich bird shares a name with our biggest city?\nNow tap it.","The Star-Spangled Banner was written about a battle at Fort McHenry. Where is Fort McHenry: in Baltimore or in Texas?":"Maryland Map!\nThe Liberty Bell is in Philadelphia.\nWhich place has a big harbor in Maryland?\nNow tap it.","Put in order from biggest to smallest: Maryland, Baltimore, the United States.":"Maryland Map!\nA box holds a bag, and a bag holds a sandwich.\nWhich one holds all the others?\nTap them in order.","Maryland was one of the first states. How many stripes on our flag stand for the first states?":"Maryland Map!\nThere are 50 stars on the flag.\nCount the stripes on the flag.\nType the number.","Is Annapolis a city or a state?":"Maryland Map!\nMaryland is a state with many towns.\nAnnapolis is inside Maryland. What is it?\nNow tap it.","Dovid's family drives to the State House, where Maryland's leaders meet. Which city do they go to: Annapolis or Baltimore?":"Maryland Map!\nThe President works in Washington, D.C., our capital.\nLeaders meet in the capital. Which city is it?\nNow tap it.","Which city is the capital of Maryland: Annapolis or Ocean City?":"Maryland Map!\nOur country's capital is Washington, D.C.\nSay the peg. Which city is the capital?\nNow tap it.","Which is Maryland's biggest city: Baltimore or Frederick?":"Maryland Map!\nAnnapolis is Maryland's capital.\nSay the peg. Which city is biggest?\nNow tap it.","What bay is in Maryland: the Chesapeake Bay or the Hudson Bay?":"Maryland Map!\nFort McHenry sits by Baltimore's harbor.\nWhich bay did the lesson name?\nNow tap it.","In the peg, which city is the biggest: Baltimore or Annapolis?":"Maryland Map!\nIn the peg, the Bay is in the middle.\nSay the peg. Which one is the biggest?\nNow tap it.","Where do Maryland's leaders work: Annapolis or Baltimore?":"Maryland Map!\nOur country's leaders work in Washington, D.C.\nThe capital is where leaders work. Which city?\nNow tap it.","What do we call one part of our country: a state or a street?":"Maryland Map!\nA street is one road in a town.\nMaryland is one part of our country. What is it called?\nNow tap it."},"s":"Read the Maryland Map.\nSay: Annapolis is the capital, Baltimore is the biggest, the Bay is in the middle."},"ELEC.FPAST.L03.01":{"q":{"Who worked on the light bulb: Thomas Edison or the Wright brothers?":"Inventor Match!\nAlexander Graham Bell made the telephone.\nSay the peg. Who lit it?\nNow tap it.","What did Alexander Graham Bell make: the telephone or the car?":"Inventor Match!\nThe Wright brothers built an airplane.\nSay the peg. What did Bell ring?\nNow tap it.","What did Benjamin Franklin invent: the lightning rod or the light bulb?":"Inventor Match!\nEdison made a bulb that lasted many hours.\nFranklin studied storms. What keeps a house safe from them?\nNow tap it.","Who flew the first airplane: the Wright brothers, Edison, or Bell?":"Inventor Match!\nFranklin studied lightning with a kite.\nSay the peg. Who flew it?\nNow tap it.","What did Thomas Edison work on: the light bulb or the airplane?":"Inventor Match!\nBell worked on the telephone.\nSay the peg. What did Edison do?\nNow tap it.","Put the inventions in order from oldest to newest: airplane (1903), telephone (1876), light bulb (1879).":"Inventor Match!\n1950 came before 1990.\nFind the smallest year first.\nTap them in order.","How many Wright brothers flew the first airplane?":"Inventor Match!\nEdison was one man.\nCount the brothers' names.\nType the number.","Why was the telephone a big help: people could talk far away, or people could fly?":"Inventor Match!\nThe light bulb let people read at night.\nWhat do we do on a phone?\nNow tap it.","Shmuel's lamp lights up his room at night. Which inventor helped give us this: Edison or Bell?":"Inventor Match!\nWhen the phone rings, think of Bell.\nSay the peg. Who lit it?\nNow tap it.","Who made the telephone: Alexander Graham Bell or Benjamin Franklin?":"Inventor Match!\nEdison worked on the light bulb.\nSay the peg. Who rang it?\nNow tap it.","What did the Wright brothers do first: fly an airplane or light a bulb?":"Inventor Match!\nBell made the telephone ring.\nSay the peg. What did the Wrights do?\nNow tap it.","What is an inventor: someone who makes something new, or someone who sells shoes?":"Inventor Match!\nA baker is someone who bakes bread.\nEdison made a new kind of bulb. What is he?\nNow tap it.","In the peg, who rang it: Bell or Edison?":"Inventor Match!\nIn the peg, the Wrights flew it.\nRing ring. Which name goes with a ringing phone?\nNow tap it.","Edison goes with: the light bulb or the telephone?":"Inventor Match!\nThe Wrights go with the airplane.\nWhich one makes light?\nNow tap it.","What problem did the light bulb solve: dark nights or cold winters?":"Inventor Match!\nA coat solves the problem of cold.\nWhat does a bulb do when you switch it on?\nNow tap it."},"s":"Play Inventor Match.\nSay: Edison lit it, Bell rang it, the Wrights flew it.\nMatch the name."},"ELEC.FTECH.L03.01":{"q":{"Is a rock a solid or a liquid?":"Shape Shifter!\nJuice takes the shape of its cup.\nDoes a rock keep its shape?\nNow tap it.","Is milk a liquid or a solid?":"Shape Shifter!\nA block of wood keeps its shape.\nCan you pour milk?\nNow tap it.","Is the air in a balloon a gas or a solid?":"Shape Shifter!\nIce cubes are hard and keep their shape.\nDoes air spread out to fill the balloon?\nNow tap it.","Which one is a solid: an ice cube, water, or steam?":"Shape Shifter!\nA brick is hard and keeps its shape.\nWhich one stays the same shape?\nNow tap it.","What happens to an ice cube in the sun: it melts into a liquid, or it turns into a rock?":"Shape Shifter!\nButter in a hot pan turns runny.\nWhat happens to ice when it gets warm?\nNow tap it.","Put these in order as water heats up: steam, ice, water.":"Shape Shifter!\nA seed becomes a sprout, then a plant.\nStart frozen. What happens as it warms?\nTap them in order.","Count the liquids: milk, juice, rock, water, block. How many liquids?":"Shape Shifter!\nIn sand, oil and brick, only oil pours.\nSay each one. Can it pour?\nType the number.","What is steam: a gas or a solid?":"Shape Shifter!\nA spoon is a solid you can hold.\nDoes steam spread out into the air?\nNow tap it.","Ima's soup pot boils, and clouds rise from it. Those clouds are water as: a gas or a liquid?":"Shape Shifter!\nWater in the freezer turns into ice.\nDo the clouds spread out into the room?\nNow tap it.","Is juice a liquid or a gas?":"Shape Shifter!\nAir in a tire spreads all through it.\nCan you pour juice into a cup?\nNow tap it.","Is a wooden block a solid or a liquid?":"Shape Shifter!\nWater spills and spreads on the floor.\nDoes the block change shape in a cup?\nNow tap it.","Which one spreads out to fill a whole room: a gas or a solid?":"Shape Shifter!\nA liquid pours into the bottom of a cup.\nThink of the smell of cookies baking.\nNow tap it.","In the peg, what do liquids do: pour or keep their shape?":"Shape Shifter!\nIn the peg, gases spread everywhere.\nSay the peg. Stop at liquids.\nNow tap it.","Can you hold a pencil in your hand: yes or no?":"Shape Shifter!\nWater slips right through your fingers.\nDoes a pencil keep its shape?\nNow tap it.","Does air take up space: yes or no?":"Shape Shifter!\nA full suitcase has no room for more.\nWhat happens to a balloon when you blow air in?\nNow tap it."},"s":"Be a Shape Shifter detective.\nSay: solids keep their shape, liquids pour, gases spread everywhere."},"ELEC.FNUM.L03.01":{"q":{"How many minutes make an hour: 60 or 10?":"Time Ladder!\nSeven days make one week.\nSay the peg. Minutes make an hour.\nNow tap it.","How many hours are in a whole day: 24 or 12?":"Time Ladder!\nA week has seven days.\nDay and night together. Say the peg.\nNow tap it.","How many days are in a year: 365 or 100?":"Time Ladder!\nA week has seven days.\nA year is very long. Which number did the lesson say?\nNow tap it.","Which is longer: an hour or a minute?":"Time Ladder!\nA week is longer than a day.\nWhich one is made of many minutes?\nNow tap it.","Put in order from shortest to longest: day, minute, week, hour.":"Time Ladder!\nInch, foot, yard: short to long.\nStart with the quickest one.\nTap them in order.","Type how many months make a year.":"Time Ladder!\nA week has seven days.\nSay the months and count.\nType the number.","How many hours are in a day: 24 or 60?":"Time Ladder!\nAn hour has many minutes.\nSay the peg. Hours make a day.\nNow tap it.","Which is longer: a year or a week?":"Time Ladder!\nA month is longer than a week.\nWhich one has 12 months in it?\nNow tap it.","Chaim learns for 1 hour. How many minutes is that: 60 or 100?":"Time Ladder!\nHalf an hour is 30 minutes.\nSay the peg. Minutes make an hour.\nNow tap it.","How many minutes are in one hour: 60 or 24?":"Time Ladder!\nA day has many hours.\nSay the first part of the peg.\nNow tap it.","Which is shortest: a minute or a day?":"Time Ladder!\nA second is shorter than an hour.\nWhich one is over very fast?\nNow tap it.","How many days are in a week: 7 or 10?":"Time Ladder!\nA year has 12 months.\nSay the days, Sunday to Shabbos, and count.\nNow tap it.","In the peg, what do 24 hours make: a day or a week?":"Time Ladder!\nIn the peg, 60 minutes make an hour.\nSay the peg. Stop at 24 hours.\nNow tap it.","An hour is made of: minutes or years?":"Time Ladder!\nA week is made of days.\nWhich small unit is inside an hour?\nNow tap it.","Which hand shows the hour: the short hand or the long hand?":"Time Ladder!\nA ruler shows inches with small lines.\nWhich hand moves slowly?\nNow tap it."},"s":"Climb the Time Ladder.\nSay: 60 minutes make an hour, 24 hours make a day.\nSmall steps to big steps."},"ELEC.FWORLD.L04.01":{"q":{"How many oceans are there on Earth?":"Ocean Order!\nEarth has seven continents.\nCount the ocean names in the lesson.\nNow tap it.","Which ocean is the biggest?":"Ocean Order!\nThe biggest continent is Asia.\nSay the peg. Which ocean is the biggest?\nNow tap it.","Which ocean is at Maryland's shore?":"Ocean Order!\nCalifornia's beaches face the Pacific.\nSay the peg. Which ocean is at our shore?\nNow tap it.","Which is the smallest ocean?":"Ocean Order!\nThe smallest continent is Australia.\nSay the peg. Which ocean is the smallest?\nNow tap it.","Which ocean surrounds Antarctica?":"Ocean Order!\nThe Arctic Ocean is up at the North Pole.\nAntarctica is at the bottom. Which name means south?\nNow tap it.","Put the oceans in order from biggest to smallest: Arctic, Atlantic, Pacific.":"Ocean Order!\nAsia, Africa, Australia: big to small continents.\nFind the biggest first, the smallest last.\nTap them in order.","How many oceans does Earth have?":"Ocean Order!\nEarth has 7 continents.\nSay each ocean name and count.\nType the number.","What is ocean water like?":"Ocean Order!\nLemon juice tastes sour.\nThink of a day at the beach. How did the water taste?\nNow tap it.","A ship sails from Baltimore straight across to Africa. Which ocean does it cross?":"Ocean Order!\nA ship from California to Japan crosses the Pacific.\nWhich ocean lies between us and Africa?\nNow tap it.","Which ocean is the biggest and deepest?":"Ocean Order!\nThe biggest continent is Asia.\nSay the peg. Which one is the biggest?\nNow tap it.","Which ocean is around the North Pole?":"Ocean Order!\nThe coldest continent, Antarctica, is far south.\nThe North Pole is at the top. Which icy ocean?\nNow tap it.","Which one is NOT one of the five oceans?":"Ocean Order!\nMars is not a continent; it is a planet.\nSay all five ocean names. Which one is missing?\nNow tap it.","In the peg, which ocean is at our shore?":"Ocean Order!\nIn the peg, the Arctic is the smallest.\nSay the peg. Which ocean is at our shore?\nNow tap it.","Which ocean is west of the United States?":"Ocean Order!\nThe sun sets in the west each evening.\nMaryland faces east. Which ocean is on the other coast?\nNow tap it.","An ocean is a huge body of:":"Ocean Order!\nA desert is a huge area of dry land.\nWhat does beach water taste like?\nNow tap it."},"s":"Use Ocean Order.\nSay: Pacific is the biggest, Arctic is the smallest, Atlantic is at our shore.\nThere are five oceans."},"ELEC.FNATURE.L04.01":{"q":{"A robin has feathers. What group is it in?":"Group Clues!\nA dog has fur, so it is a mammal.\nLook for the clue: feathers. Say the peg.\nNow tap it.","A cow has hair and feeds its calf milk. What group is it in?":"Group Clues!\nA trout has fins and gills, so it is a fish.\nHair and milk are the clues. Say the peg.\nNow tap it.","A frog starts life in water as a tadpole. What group is it in?":"Group Clues!\nA snake has dry scales, so it is a reptile.\nWet skin, water then land. Say the peg.\nNow tap it.","A turtle has dry, scaly skin and lays eggs on land. What group is it in?":"Group Clues!\nA frog has wet skin, so it is an amphibian.\nDry scales are the clue.\nNow tap it.","A salmon has fins and breathes with gills. What group is it in?":"Group Clues!\nAn eagle has feathers, so it is a bird.\nFins are the clue. Say the peg.\nNow tap it.","Put a frog's life in order: frog, egg, tadpole.":"Group Clues!\nA chick hatches from its shell, then grows into a hen.\nWhat does it start as, in the water?\nTap them in order.","Count the mammals: cow, eagle, horse, salmon, sheep. How many are mammals?":"Group Clues!\nIn frog, dog and bee, only the dog has fur.\nCheck each one for fur or hair.\nType the number.","A whale lives in the sea but breathes air and feeds its baby milk. What group is it in?":"Group Clues!\nA penguin swims, but it has feathers, so it is a bird.\nBabies drink milk. Which group does that?\nNow tap it.","Dovid finds an animal with dry scales and no legs. What group is it in?":"Group Clues!\nAn animal with wet skin that hops is an amphibian.\nDry scales are the clue. Say the peg.\nNow tap it.","An owl has feathers and a beak. What group is it in?":"Group Clues!\nA goat has hair, so it is a mammal.\nFeathers are the clue.\nNow tap it.","A shark has fins and gills. What group is it in?":"Group Clues!\nA dolphin breathes air and gives milk, so it is a mammal.\nFins and gills are the clue.\nNow tap it.","A lizard has dry scales. What group is it in?":"Group Clues!\nA toad has wet, bumpy skin, so it is an amphibian.\nDry scales. Say the peg.\nNow tap it.","In the peg, fins mean:":"Group Clues!\nIn the peg, fur means mammal.\nSay the peg. Stop at fins.\nNow tap it.","An animal with feathers is a:":"Group Clues!\nAn animal with fur is a mammal.\nFeathers: which group grows them?\nNow tap it.","What covers a bird's body?":"Group Clues!\nA sheep is covered in wool.\nThink of a soft pillow stuffed from birds.\nNow tap it."},"s":"Look for Group Clues.\nFur: mammal. Feathers: bird.\nFins: fish. Dry scales: reptile.\nWet skin: amphibian."},"ELEC.FUSA.L04.01":{"q":{"How many states are in the United States?":"State Stats!\nOur flag has 13 stripes.\nCount the stars on the flag. One star for each state.\nNow tap it.","Which is the biggest state by land?":"State Stats!\nThe smallest state is Rhode Island.\nSay the peg. Which state is big?\nNow tap it.","Which state is made of islands in the Pacific Ocean?":"State Stats!\nAlaska is the biggest state.\nSay the peg. Which one is in the sea?\nNow tap it.","Which is the smallest state?":"State Stats!\nThe biggest state is Alaska.\nSay the peg. Which state is little?\nNow tap it.","Is Washington, D.C. a state?":"State Stats!\nPuerto Rico belongs to the United States but is not a state.\nWhat does the D.C. stand for?\nNow tap it.","Put these states in order from biggest to smallest: Rhode Island, Alaska, Texas.":"State Stats!\nAsia, Africa, Australia: big to small.\nFind the biggest and the smallest first.\nTap them in order.","How many states are there in our country?":"State Stats!\nThere are 13 stripes on the flag.\nCount the stars on our flag.\nType the number.","Which state is the second biggest?":"State Stats!\nThe biggest state is Alaska.\nThink of a very big state in the south.\nNow tap it.","Yaakov flies to a state made of islands with warm beaches in the Pacific. Where is he going?":"State Stats!\nA huge, cold state up north is Alaska.\nSay the peg. Which state is in the sea?\nNow tap it.","Which state is the biggest?":"State Stats!\nHawaii is made of islands.\nSay the peg. Which one is big?\nNow tap it.","How many states are in our country: 50, 48, or 13?":"State Stats!\nThe flag has 13 stripes for the first states.\nOne star for each state. How many stars?\nNow tap it.","Which state is made of islands?":"State Stats!\nMaryland has the Chesapeake Bay.\nSay the peg. Which state is in the sea?\nNow tap it.","In the peg, which state is little?":"State Stats!\nIn the peg, Hawaii is in the sea.\nPinch your fingers small. Which state is that?\nNow tap it.","What do the stars on the flag count?":"State Stats!\nThe 13 stripes count the first states.\nOne star for each what?\nNow tap it.","What is a state?":"State Stats!\nA continent is a giant piece of land.\nIs Maryland part of the United States?\nNow tap it."},"s":"Check the State Stats.\nSay: big Alaska, little Rhode Island, Hawaii in the sea, 50 in all."},"ELEC.FPAST.L04.01":{"q":{"In what year did Columbus sail across the ocean?":"Explorer Path!\nThe Wright brothers flew in 1903.\nSay the rhyme. Which year is in it?\nNow tap it.","Which ocean did Lewis and Clark reach?":"Explorer Path!\nLewis and Clark started near the Mississippi River.\nThey went all the way west. Which ocean is there?\nNow tap it.","Who was the first person to walk on the moon?":"Explorer Path!\nThe Wright brothers were the first to fly an airplane.\nWhich explorer went up in a rocket in 1969?\nNow tap it.","Which ocean did Columbus cross in 1492?":"Explorer Path!\nLewis and Clark reached the Pacific.\nSpain is east of us. Which ocean lies between?\nNow tap it.","What did Magellan's ships do first in history?":"Explorer Path!\nNeil Armstrong was the first to walk on the moon.\nMagellan's trip went in a giant circle. Around what?\nNow tap it.","Put the explorers in order by year: Neil Armstrong (1969), Columbus (1492), Lewis and Clark (1804).":"Explorer Path!\n1903 came before 1950.\nFind the smallest year first.\nTap them in order.","Columbus sailed in 1492 with the Nina, the Pinta and one more ship. How many ships in all?":"Explorer Path!\nLewis and Clark were two leaders.\nCount the two names, then add one more.\nType the number.","Lewis and Clark explored which part of America?":"Explorer Path!\nColumbus sailed west from Spain.\nWhere is the Pacific Ocean from Maryland?\nNow tap it.","Rocket ships, a moon walk, and the year 1969. Which explorer is this about?":"Explorer Path!\nShips with sails and 1492 are about Columbus.\nWho went to the moon?\nNow tap it.","Who sailed the ocean blue in 1492?":"Explorer Path!\nIn 1969 a man walked on the moon.\nSay the rhyme. Who sailed?\nNow tap it.","Who first walked on the moon, in 1969?":"Explorer Path!\nColumbus crossed the Atlantic Ocean.\nWhich explorer flew in a rocket?\nNow tap it.","Which explorers reached the Pacific Ocean by land in 1805?":"Explorer Path!\nColumbus traveled by ship across the Atlantic.\nTwo explorers went west by land. Who?\nNow tap it.","In the rhyme, what did Columbus sail?":"Explorer Path!\nIn 1969, Armstrong walked on the moon.\nSay the rhyme slowly. What did he sail?\nNow tap it.","Columbus traveled by:":"Explorer Path!\nArmstrong traveled by rocket.\nHe crossed an ocean. What floats?\nNow tap it.","What does an explorer do?":"Explorer Path!\nA builder makes houses.\nYou explore a new park. What do you do there?\nNow tap it."},"s":"Follow the Explorer Path.\nSay: in 1492 Columbus sailed the ocean blue.\nArmstrong walked on the moon in 1969."},"ELEC.FTECH.L04.01":{"q":{"What does a magnet pull?":"Pole Rule!\nA sponge soaks up water.\nWhich one is a metal a magnet can grab?\nNow tap it.","A north pole and a south pole come close. What happens?":"Pole Rule!\nTwo south poles push each other away.\nNorth and south are opposites. Say the Pole Rule.\nNow tap it.","Two north poles come close. What happens?":"Pole Rule!\nA north and a south pole snap together.\nThese are the same pole. Say the Pole Rule.\nNow tap it.","Which one will a magnet pick up?":"Pole Rule!\nA magnet can hold papers on a steel fridge.\nWhich one is made of steel?\nNow tap it.","Two south poles come close. What happens?":"Pole Rule!\nA south pole and a north pole pull together.\nBoth are south. Say the Pole Rule.\nNow tap it.","Put the steps in order to test if something is magnetic: hold the magnet near it, pick an object, see if it sticks.":"Pole Rule!\nTo test a lamp: find the switch, flip it, look.\nWhat do you need before you test?\nTap them in order.","A magnet has 2 poles. How many poles do 4 magnets have?":"Pole Rule!\n3 bikes have 2 wheels each: 6 wheels.\nCount by twos, once for each magnet.\nType the number.","What is inside a compass that helps it find north?":"Pole Rule!\nA thermometer has a liquid that rises when it is hot.\nWhat pulls the needle toward north?\nNow tap it.","Yossi drops steel pins on the rug. What can help him pick them up fast?":"Pole Rule!\nA broom sweeps up crumbs.\nWhat pulls steel things to it?\nNow tap it.","A magnet pulls things made of:":"Pole Rule!\nGlue sticks paper to paper.\nThink of what a fridge door is made of.\nNow tap it.","North pole near south pole: what happens?":"Pole Rule!\nSame poles push away.\nAre north and south opposites?\nNow tap it.","What are the two ends of a magnet called?":"Pole Rule!\nThe two ends of a battery are plus and minus.\nThe ends are named north and south. What are they called?\nNow tap it.","In the peg, what do opposites do?":"Pole Rule!\nIn the peg, same ones push away.\nSay the peg. Stop after opposites.\nNow tap it.","Will a magnet stick to a steel spoon?":"Pole Rule!\nA magnet does not grab a wooden spoon.\nIs the spoon made of steel?\nNow tap it.","A pull brings something:":"Pole Rule!\nA push sends a ball away from you.\nWhen you pull a wagon, does it come to you?\nNow tap it."},"s":"Use the Pole Rule.\nMagnets pull iron and steel.\nSay: opposites attract, same ones push away."},"ELEC.FNUM.L04.01":{"q":{"How many inches make one foot?":"Ruler Ladder!\n60 minutes make one hour.\nA ruler is one foot. How many inch marks does it have?\nNow tap it.","How many feet make one yard?":"Ruler Ladder!\n7 days make one week.\nLay rulers end to end until you reach a yardstick.\nNow tap it.","Which is longest: a mile, a yard, or a foot?":"Ruler Ladder!\nA week is longer than a day.\nWhich one takes about 20 minutes to walk?\nNow tap it.","Which is longer: a foot or an inch?":"Ruler Ladder!\nAn hour is longer than a minute.\nWhich one is made of 12 of the other?\nNow tap it.","Put in order from shortest to longest: yard, mile, inch, foot.":"Ruler Ladder!\nMinute, hour, day: short to long.\nStart with the smallest mark on a ruler.\nTap them in order.","How many inches are in 2 feet?":"Ruler Ladder!\n2 hours is 60 and 60 minutes.\nEach foot is 12 inches. Add two feet.\nType the number.","A pencil is about 7 ___ long.":"Ruler Ladder!\nA door is about 7 feet tall.\nIs a pencil shorter than a ruler?\nNow tap it.","How many inches are in one yard?":"Ruler Ladder!\n2 feet is 24 inches.\nAdd 12 inches three times.\nType the number.","Chaim's desk is 1 yard wide. How many feet is that?":"Ruler Ladder!\nA shelf 1 foot wide is 12 inches.\nSay the peg. Feet make a yard.\nNow tap it.","How many inches are in one foot?":"Ruler Ladder!\n60 minutes make an hour.\nCount the inch marks on a ruler.\nNow tap it.","How many feet are in a yard?":"Ruler Ladder!\n12 inches make a foot.\nSay the peg. Feet make a yard.\nNow tap it.","Which unit would you use for the distance from Baltimore to Annapolis?":"Ruler Ladder!\nWe measure a book in inches.\nIs the distance long, like a car ride?\nNow tap it.","In the peg, 3 feet make a:":"Ruler Ladder!\nIn the peg, 12 inches make a foot.\nSay the peg. What do 3 feet make?\nNow tap it.","A whole ruler is how long?":"Ruler Ladder!\nA yardstick is longer than a ruler.\nWhat is a ruler's length called?\nNow tap it.","Length tells:":"Ruler Ladder!\nWeight tells how heavy something is.\nMeasure from one end to the other. What are you finding?\nNow tap it."},"s":"Climb the Ruler Ladder.\nSay: 12 inches make a foot, 3 feet make a yard.\nA mile is very long."},"ELEC.FWORLD.L05.01":{"q":{"What is the capital of France?":"Capital Clue!\nThe capital of Italy is Rome.\nSay the peg. Which city goes with France?\nNow tap it.","What is the capital of the United States?":"Capital Clue!\nAnnapolis is the capital of Maryland.\nWhere do the President and Congress work?\nNow tap it.","What is the capital of Canada?":"Capital Clue!\nMaryland's capital is Annapolis, not Baltimore, the biggest city.\nSay the peg. Which city goes with Canada?\nNow tap it.","What is the capital of Japan?":"Capital Clue!\nThe capital of China is Beijing.\nSay the peg. Which city goes with Japan?\nNow tap it.","What is the capital of England?":"Capital Clue!\nThe capital of Germany is Berlin.\nSay the peg. Which city goes with England?\nNow tap it.","Put the countries in the order of the peg: Japan, France, Canada, England.":"Capital Clue!\nThe seasons rhyme goes winter, spring, summer, fall.\nSay the peg slowly. Which country is named first?\nTap them in order.","Look at this list: Tokyo, Texas, Paris, Alaska, Ottawa. How many are capitals of countries?":"Capital Clue!\nIn Maryland, Ohio and Rome, only Rome is a capital.\nCheck each name: is it a state or a city?\nType the number.","What is the capital of Mexico?":"Capital Clue!\nThe capital of Panama is Panama City.\nSome capitals share the country's name. Try that here.\nNow tap it.","Shimon's uncle flies to the capital of Japan. Which city does he land in?":"Capital Clue!\nA trip to the capital of France lands in Paris.\nSay the peg. Which city goes with Japan?\nNow tap it.","Which city is the capital of Canada?":"Capital Clue!\nAustralia's capital is Canberra, not Sydney.\nSay the peg. Which city goes with Canada?\nNow tap it.","London is the capital of which country?":"Capital Clue!\nParis is the capital of France.\nSay the peg. London goes with what?\nNow tap it.","What is a capital city?":"Capital Clue!\nA harbor city is where ships come in.\nOttawa is not Canada's biggest city. Why is it special?\nNow tap it.","In the peg, which city goes with Japan?":"Capital Clue!\nIn the peg, Paris goes with France.\nSay the peg. Stop at Japan.\nNow tap it.","How many capitals does a country usually have?":"Capital Clue!\nMaryland has Annapolis as its capital.\nOur country has Washington, D.C. Is there a second?\nNow tap it.","Which of these is a country?":"Capital Clue!\nMaryland is a state inside a country.\nWhich one has its own flag and leaders?\nNow tap it."},"s":"Use the Capital Clue.\nSay: Paris for France, London for England, Tokyo for Japan, Ottawa for Canada."},"ELEC.FNATURE.L05.01":{"q":{"How many planets go around our Sun?":"Planet Parade!\nThere are seven continents on Earth.\nCount the words in the peg.\nNow tap it.","Which planet is third from the Sun?":"Planet Parade!\nMercury is the first planet from the Sun.\nSay the peg. Which word is third?\nNow tap it.","Which planet is the biggest?":"Planet Parade!\nMercury is the smallest planet.\nWhich giant planet could hold over 1,000 Earths?\nNow tap it.","Which planet is closest to the Sun?":"Planet Parade!\nNeptune is the farthest planet from the Sun.\nSay the peg. Which word comes first?\nNow tap it.","Which planet is called the Red Planet?":"Planet Parade!\nNeptune looks deep blue.\nWhich planet comes right after Earth in the parade?\nNow tap it.","Put the first four planets in order from the Sun: Mars, Venus, Earth, Mercury.":"Planet Parade!\nDays in order: Sunday, Monday, Tuesday.\nSay the peg. Start closest to the Sun.\nTap them in order.","About how many days does it take Earth to go once around the Sun?":"Planet Parade!\nThe Moon goes around Earth in about a month.\nOne trip around the Sun is one year. How many days?\nType the number.","Which planet is famous for its big, bright rings?":"Planet Parade!\nJupiter is famous for its Great Red Spot.\nSay the peg. Which planet follows Jupiter?\nNow tap it.","A space probe flies out from Earth past Mars. Which planet will it reach next?":"Planet Parade!\nAfter Mercury comes Venus.\nSay the peg. What comes after Mars?\nNow tap it.","What is in the center of our solar system?":"Planet Parade!\nThe Moon goes around the Earth.\nWhat do all eight planets circle around?\nNow tap it.","Which planet is the farthest from the Sun?":"Planet Parade!\nMercury is closest to the Sun.\nSay the peg. Which word is last?\nNow tap it.","Which planet is the biggest of all?":"Planet Parade!\nMercury is the smallest planet.\nThink of the giant that holds over 1,000 Earths.\nNow tap it.","In the peg, which planet does Just stand for?":"Planet Parade!\nIn the peg, Very stands for Venus.\nJust starts with J. Which planet starts with J?\nNow tap it.","Which planet comes right after Venus?":"Planet Parade!\nRight after Mercury comes Venus.\nSay: Mercury, Venus, and then what?\nNow tap it.","What is the Sun?":"Planet Parade!\nThe Moon is a big rock that goes around Earth.\nIs the Sun a giant ball of glowing gas?\nNow tap it."},"s":"Watch the Planet Parade.\nSay: My Very Educated Mother Just Served Us Nachos.\nFirst letters = the planets in order."},"ELEC.FUSA.L05.01":{"q":{"Which branch makes the laws?":"Three Jobs!\nThe President signs laws and leads the country.\nSay the peg. Who makes?\nNow tap it.","What are the two parts of Congress?":"Three Jobs!\nThe Supreme Court has nine justices.\nOne part has 100 senators. What is the other?\nNow tap it.","How many justices sit on the Supreme Court?":"Three Jobs!\nEach state sends 2 senators to Congress.\nListen again: how many justices did the lesson name?\nNow tap it.","Who carries out the laws?":"Three Jobs!\nCongress is where laws are made.\nSay the peg. Who carries out?\nNow tap it.","Which branch explains what the laws mean?":"Three Jobs!\nThe President leads the army.\nSay the peg. Who explains?\nNow tap it.","Put the steps of a law in order: the President signs it, Congress votes on it, the courts explain it.":"Three Jobs!\nA recipe: write it, cook it, then taste it.\nSay the peg. Which job comes first?\nTap them in order.","Each state has 2 senators. There are 50 states. How many senators are there in all?":"Three Jobs!\n3 states with 2 senators each would have 6.\nMultiply 2 senators by the number of states.\nType the number.","Why are there three branches?":"Three Jobs!\nA seesaw needs weight on each side to balance.\nWhat if one branch had all the power?\nNow tap it.","Congress passes a new law about safe bike lanes. Who carries it out?":"Three Jobs!\nA law about taxes is also made by Congress.\nCongress made it. Say the peg: who carries out?\nNow tap it.","Congress makes the laws. Who carries them out?":"Three Jobs!\nOn a team, the coach makes plans and players carry them out.\nWho is the leader who carries out the laws?\nNow tap it.","What does the Supreme Court do?":"Three Jobs!\nCongress makes new laws.\nSay the peg. What does the Court do?\nNow tap it.","The Senate is part of which branch?":"Three Jobs!\nThe nine justices are part of the Court.\nSenators help make laws. Which branch makes laws?\nNow tap it.","In the peg, what does the Court do?":"Three Jobs!\nIn the peg, Congress makes.\nSay the peg. Stop at the Court.\nNow tap it.","Where does Congress meet?":"Three Jobs!\nThe President lives in the White House.\nIt is a domed building in Washington. What is it called?\nNow tap it.","Rules for a whole country are called:":"Three Jobs!\nRules for a game are called game rules.\nWhat does Congress make?\nNow tap it."},"s":"Learn the Three Jobs.\nSay: Congress makes, the President carries out, the Court explains."},"ELEC.FPAST.L05.01":{"q":{"In what year did America declare independence?":"Freedom Dates!\nIn 1787, leaders wrote the Constitution.\nSay the peg. Which year says free?\nNow tap it.","Who wrote most of the Declaration of Independence?":"Freedom Dates!\nGeorge Washington led the army in the war.\nListen again: whose name did the lesson give?\nNow tap it.","Who was the first President of the United States?":"Freedom Dates!\nAbraham Lincoln was the 16th President.\nWho led the army, then became President in 1789?\nNow tap it.","What holiday celebrates the Declaration of Independence?":"Freedom Dates!\nMemorial Day honors soldiers who died.\nOn what date was it signed?\nNow tap it.","Which country ruled America before 1776?":"Freedom Dates!\nBefore Texas joined, Mexico ruled it.\nThe colonists spoke English. Which country was that?\nNow tap it.","Put the Freedom Dates in order: Washington becomes President, the Constitution is written, independence is declared.":"Freedom Dates!\nColumbus in 1492 came before the airplane in 1903.\nSay the peg. Which year is smallest?\nTap them in order.","How many years passed from 1776 to 1789?":"Freedom Dates!\nFrom 1900 to 1910 is 10 years.\nTake 1776 away from 1789.\nType the number.","In which city was the Constitution written in 1787?":"Freedom Dates!\nFort McHenry is in Baltimore.\nWhich city has the Liberty Bell?\nNow tap it.","On July 4, Shmuel's town has fireworks. What happened on that date in 1776?":"Freedom Dates!\nOn Thanksgiving, families give thanks for food.\nSay the peg. What happened in 1776?\nNow tap it.","Who was the first President?":"Freedom Dates!\nThomas Jefferson wrote the Declaration.\nWho led the army and became President in 1789?\nNow tap it.","What document did America sign in 1776?":"Freedom Dates!\nIn 1787 they wrote the Constitution.\nSay the peg. In 1776, America said it was what?\nNow tap it.","In what year did Washington become President?":"Freedom Dates!\n1776 was the year of independence.\nSay the peg. Which year has the first President?\nNow tap it.","In the peg, which year goes with the rules?":"Freedom Dates!\nIn the peg, 1776 goes with free.\nSay the peg. Stop at the rules.\nNow tap it.","Which date do we celebrate as America's birthday?":"Freedom Dates!\nJanuary 1 starts the new year on the calendar.\nFireworks day. Which date is that?\nNow tap it.","Independence means:":"Freedom Dates!\nTeamwork means working together.\nAmerica did not want a faraway king. What did it want?\nNow tap it."},"s":"Learn the Freedom Dates.\nSay: 1776 free, 1787 the rules, 1789 the first President."},"ELEC.FTECH.L05.01":{"q":{"What does a circuit need for electricity to flow?":"Loop Check!\nWater in a pipe flows only if the pipe is not blocked.\nSay the peg. What must the path be?\nNow tap it.","What does a light switch do?":"Loop Check!\nA door opens and closes a room.\nFlip a switch. What happens to the loop?\nNow tap it.","Which one is a conductor?":"Loop Check!\nRubber covers wires to keep people safe.\nWhich one is a metal?\nNow tap it.","Which one is an insulator?":"Loop Check!\nPlastic around a cord blocks electricity.\nWhich one is used to cover wires for safety?\nNow tap it.","The wire in a circuit has a gap. What happens to the bulb?":"Loop Check!\nA broken bridge stops the cars.\nIs the loop complete? Say the peg.\nNow tap it.","Follow the flow around a simple circuit. Put the parts in order, starting at the battery.":"Loop Check!\nA race track goes start, curve, straight, finish.\nBegin at the battery. What does it push into?\nTap them in order.","A flashlight uses 2 batteries. How many batteries do 3 flashlights need?":"Loop Check!\n4 bikes with 2 wheels each need 8 wheels.\nCount by twos, once for each flashlight.\nType the number.","Why should you never touch an outlet with wet hands?":"Loop Check!\nA metal spoon carries heat from hot soup.\nDoes water help electricity flow?\nNow tap it.","Moshe builds a circuit, but the bulb will not light. The wires and bulb look fine. What should he check?":"Loop Check!\nIf a hose has a kink, check the hose path.\nSay the peg. What must be complete?\nNow tap it.","What is a circuit?":"Loop Check!\nA track is a path for a train.\nSay the peg. What shape must the path be?\nNow tap it.","Which material blocks electricity?":"Loop Check!\nCopper lets electricity flow.\nWhich one covers cords to keep us safe?\nNow tap it.","What does a battery do in a circuit?":"Loop Check!\nA pump moves water through a pipe.\nWhere does the power come from?\nNow tap it.","In the peg, what happens with no loop?":"Loop Check!\nA closed loop lets the bulb light.\nSay the peg. What comes after no loop?\nNow tap it.","How many wires make a simple loop with one battery and one bulb?":"Loop Check!\nA bike chain goes all the way around the gears.\nGo from the battery to the bulb, then back.\nNow tap it.","What can electricity do?":"Loop Check!\nGas in a car makes it drive.\nWhat happens when you switch on a lamp?\nNow tap it."},"s":"Do a Loop Check.\nSay: no loop, no flow.\nConductors let it flow; insulators block it."},"ELEC.FNUM.L05.01":{"q":{"How many commas are in one million, written 1,000,000?":"Comma Counter!\nOne thousand, 1,000, has one comma.\nCount the commas in 1,000,000.\nNow tap it.","About how many people live on Earth?":"Comma Counter!\nAbout 340 million people live in the United States.\nListen again: how many billion did the lesson say?\nNow tap it.","About how many people live in the United States?":"Comma Counter!\nAbout 6 million people live in Maryland.\nListen again: what number did the lesson give?\nNow tap it.","Which number is one thousand?":"Comma Counter!\nTen hundreds make this number.\nFind the number with three zeros and one comma.\nNow tap it.","Put in order from smallest to biggest: a million, a thousand, a billion, a hundred.":"Comma Counter!\n1, 10, 100: each one gets a zero.\nCount zeros. Fewest zeros comes first.\nTap them in order.","How many zeros are in one million (1,000,000)?":"Comma Counter!\nOne thousand, 1,000, has three zeros.\nCount each zero in 1,000,000.\nType the number.","About how many people live in Maryland?":"Comma Counter!\nAbout 340 million live in the whole country.\nMaryland is much smaller than the whole country.\nNow tap it.","Which is biggest: a billion, a million, or a thousand?":"Comma Counter!\nA thousand is bigger than a hundred.\nSay the peg. Which has more commas?\nNow tap it.","A newspaper says a city has 2,500,000 people. How do you say that?":"Comma Counter!\n1,500 is one thousand five hundred.\nCount the commas. Say the peg.\nNow tap it.","A billion has how many commas?":"Comma Counter!\nA million has two commas.\nSay the peg. Stop at billion.\nNow tap it.","Which is closest to the number of people on Earth?":"Comma Counter!\n340,000,000 is about the number for our country.\nWhich choice says about 8 billion?\nNow tap it.","Which number is one million?":"Comma Counter!\nA thousand has one comma.\nCount the commas in each choice.\nNow tap it.","In the peg, a million has how many commas?":"Comma Counter!\nIn the peg, a thousand has one comma.\nSay the peg. Stop at million.\nNow tap it.","How many hundreds make a thousand?":"Comma Counter!\nTen tens make a hundred.\nCount by hundreds until you reach 1,000.\nNow tap it.","Which place comes right after hundreds?":"Comma Counter!\nTens come right after ones.\nCount the places: ones, tens, hundreds. What is next?\nNow tap it."},"s":"Use the Comma Counter.\nSay: thousand has one comma, million has two, billion has three."},"ELEC.FWORLD.L06.01":{"q":{"What is the tallest mountain above sea level?":"Record Finder!\nThe longest mountain chain on land is the Andes.\nSay the peg. Which one goes up?\nNow tap it.","What is the largest hot desert in the world?":"Record Finder!\nThe Gobi is a cold desert in Asia.\nSay the peg. Which one dries out?\nNow tap it.","Where is the largest rainforest?":"Record Finder!\nThe largest coral reef is off Australia.\nSay the peg. Which place grows green?\nNow tap it.","What is the largest ocean on Earth?":"Record Finder!\nThe Amazon is the largest rainforest.\nSay the peg. Which one spreads wide?\nNow tap it.","On which continent is Mount Everest?":"Record Finder!\nThe Sahara is on the continent of Africa.\nNepal and China are neighbors there. Which continent?\nNow tap it.","Put in order from tallest to shortest: Mount Washington (6,288 feet), Mount Everest (about 29,000 feet), Mount Whitney (14,505 feet).":"Record Finder!\n5,000 is more than 900.\nFind the biggest number of feet first.\nTap them in order.","Mount Everest is about 29,000 feet tall. A jet flies at about 35,000 feet. How many feet higher is the jet?":"Record Finder!\n10,000 take away 3,000 is 7,000.\nTake 29,000 away from 35,000.\nType the number.","Which river carries the most water in the world?":"Record Finder!\nThe Nile is famous as one of the longest rivers.\nSay the peg. Which place grows green?\nNow tap it.","An explorer crosses miles of hot sand dunes in North Africa. Where is he?":"Record Finder!\nMiles of ice near the South Pole means Antarctica.\nSay the peg. Which place dries out?\nNow tap it.","Mount Everest is famous for being:":"Record Finder!\nThe Sahara is famous as the largest hot desert.\nSay the peg. What does Everest do?\nNow tap it.","Which desert is almost as big as the United States?":"Record Finder!\nThe Amazon is the largest rainforest.\nSay the peg. Which one dries out?\nNow tap it.","Which place is a huge rainforest in South America?":"Record Finder!\nThe Pacific is the widest ocean.\nSay the peg. Which one grows green?\nNow tap it.","In the peg, which place dries out?":"Record Finder!\nIn the peg, Everest goes up.\nSay the peg. Stop at dries out.\nNow tap it.","Which record does Mount Everest hold?":"Record Finder!\nThe Pacific holds the widest-ocean record.\nEverest goes up. What kind of record is that?\nNow tap it.","Which landform is very dry, with little rain?":"Record Finder!\nA rainforest gets rain almost every day.\nWhich place has sand and almost no rain?\nNow tap it."},"s":"Be a Record Finder.\nSay: Everest goes up, Sahara dries out, Amazon grows green, Pacific spreads wide."},"ELEC.FNATURE.L06.01":{"q":{"What do we call it when the sun turns water into vapor that rises?":"Cycle Circle!\nDrops forming on a cold cup show condensation.\nSay the peg. What is the first step?\nNow tap it.","How do clouds form?":"Cycle Circle!\nYour breath on a cold window makes a foggy spot.\nWhat happens to warm vapor when it gets cold up high?\nNow tap it.","Rain and snow falling from clouds is called:":"Cycle Circle!\nWater gathering in a lake is collection.\nSay the peg. What does the cloud do?\nNow tap it.","After it rains, water gathers in oceans, lakes and rivers. What is this step called?":"Cycle Circle!\nRising vapor from a puddle is evaporation.\nSay the peg. What is the last step?\nNow tap it.","What gives the water cycle its energy?":"Cycle Circle!\nA stove gives a pot of water heat.\nWhat warms the oceans every day?\nNow tap it.","Put the four steps of the water cycle in order.":"Cycle Circle!\nPlant parts go roots, stem, leaves, flower.\nSay the peg. Match each first letter.\nTap them in order.","Water boils at 212 degrees Fahrenheit and freezes at 32 degrees. How many degrees apart are they?":"Cycle Circle!\nFrom 50 to 80 is 30 degrees.\nTake 32 away from 212.\nType the number.","Why does a puddle disappea
