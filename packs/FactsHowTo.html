File!\nThe peg also lists them oldest first.\nSay the peg. Which case comes first?\nTap them in order.","How many years passed between Marbury v. Madison (1803) and Brown v. Board of Education (1954)?":"Case File!\nFrom 1900 to 1966 is 66 years.\nTake 1803 away from 1954.\nType the number.","How many justices must agree to decide a Supreme Court case?":"Case File!\nA 7-member board needs 4 votes for a majority.\nWhat is more than half of 9?\nNow tap it.","A police officer arrests a man and says, \"You have the right to remain silent.\" Which case requires this?":"Case File!\nBrown is about schools.\nSay the peg. Which case gave the right to stay silent?\nNow tap it.","Which case ended separate schools by race?":"Case File!\nMiranda is about the right to stay silent.\nSay the peg. Which case ended separate schools?\nNow tap it.","Marbury v. Madison gave the Supreme Court:":"Case File!\nCongress may declare war.\nSay the peg. What check did Marbury give?\nNow tap it.","What does the Supreme Court decide?":"Case File!\nCongress decides what new laws to write.\nRecall: the Court explains. What does it explain?\nNow tap it.","In the peg, what did Brown end?":"Case File!\nIn the peg, Marbury gave the Court its check.\nSay the peg. Stop at Brown.\nNow tap it.","Which branch got the power of judicial review?":"Case File!\nCongress has the power to make laws.\nJudicial means about judges. Which branch has judges?\nNow tap it.","In Brown v. Board, what does v. stand for?":"Case File!\nIn a game, one team plays against the other.\nWhich word means against?\nNow tap it."},"s":"Open the Case File.\nSay: Marbury gave the Court its check, Brown ended separate schools, Miranda gave the right to stay silent."},"ELEC.FPAST.L11.01":{"q":{"What was Sputnik?":"Race to Space!\nApollo 11 was the mission that landed on the Moon.\nSay the peg. What went up in 1957?\nNow tap it.","Who was the first human in space?":"Race to Space!\nJohn Glenn was the first American to orbit Earth, in 1962.\nSay the peg. Who goes with 1961?\nNow tap it.","When did the Berlin Wall fall?":"Race to Space!\nThe Soviet Union broke apart in 1991.\nSay the peg. Which year goes with the Wall?\nNow tap it.","Which two countries were the main rivals in the Cold War?":"Race to Space!\nIn World War II, America and Britain were allies.\nRecall the lesson: which two powers competed?\nNow tap it.","Which mission first landed men on the Moon?":"Race to Space!\nSputnik was a satellite with no people aboard.\nSay the peg. What happened in 1969?\nNow tap it.","Put these in time order: the Berlin Wall falls, Sputnik launches, Apollo 11 lands on the Moon, Gagarin flies in space.":"Race to Space!\n1950 comes before 1970.\nSay the peg. Which year is first?\nTap them in order.","The Berlin Wall stood from 1961 to 1989. How many years did it stand?":"Race to Space!\nFrom 1950 to 1970 is 20 years.\nTake 1961 away from 1989.\nType the number.","Why was it called the Cold War?":"Race to Space!\nA cold shoulder means ignoring someone without a fight.\nDid the two sides ever fight each other head-on?\nNow tap it.","A museum shows a shiny metal ball with four antennas from 1957. What is it?":"Race to Space!\nA gray chunk of painted concrete could be from Berlin.\nSay the peg. What goes with 1957?\nNow tap it.","In the peg, what happened in 1969?":"Race to Space!\nIn the peg, 1957 is the first satellite.\nSay the peg. Stop at 1969.\nNow tap it.","When did the Soviet Union break apart?":"Race to Space!\nThe Berlin Wall fell in 1989.\nAdd 2 to 1989.\nNow tap it.","Who was the first human in space, in 1961?":"Race to Space!\nAlan Shepard was the first American in space, weeks later.\nSay the peg. Who goes with 1961?\nNow tap it.","In the peg, which year goes with the Wall?":"Race to Space!\nIn the peg, 1961 goes with Gagarin.\nSay the peg. Stop at the Wall.\nNow tap it.","Who stepped onto the Moon second?":"Race to Space!\nGagarin was the first person in space, not on the Moon.\nArmstrong was first. Who followed him?\nNow tap it.","A rivalry is:":"Race to Space!\nTwo chess players in a final are opponents.\nWhat is it when two sides keep competing?\nNow tap it."},"s":"Run the Race to Space.\nSay: 1957 Sputnik, 1961 Gagarin, 1969 the Moon, 1989 the Wall fell."},"ELEC.FTECH.L11.01":{"q":{"What is data broken into to travel across the internet?":"Packet Path!\nA big piece of furniture is shipped in several boxes.\nSay the peg. What does chop it make?\nNow tap it.","What tells packets which computer to go to?":"Packet Path!\nA zip code helps mail reach the right town.\nSay the peg. Address it with what?\nNow tap it.","What do fiber-optic cables use to carry data?":"Packet Path!\nWi-Fi uses radio waves to reach your device.\nRecall the lesson: what travels inside the glass strands?\nNow tap it.","What does a router do?":"Packet Path!\nA mail sorter sends letters toward the right town.\nSay the peg. What does route it mean?\nNow tap it.","Wi-Fi sends data through the air using:":"Packet Path!\nFiber-optic cables use light.\nRecall the lesson: what kind of waves does Wi-Fi use?\nNow tap it.","Put the Packet Path in order: route it, rebuild it, chop it, address it.":"Packet Path!\nPack a box, label it, ship it, unpack it.\nSay the peg. What happens first?\nTap them in order.","A photo is chopped into 250 packets. 3 packets get lost and must be sent again. How many packets arrive the first time?":"Packet Path!\n100 packets minus 2 lost is 98.\nTake 3 away from 250.\nType the number.","Who invented the World Wide Web in 1989?":"Packet Path!\nBill Gates started Microsoft.\nRecall the lesson: who invented the web?\nNow tap it.","A message sent from Baltimore to Israel arrives in less than a second. How is that possible?":"Packet Path!\nA phone call reaches across the country instantly.\nWhat fast thing travels inside fiber-optic cables?\nNow tap it.","In the peg, what happens last?":"Packet Path!\nIn the peg, chopping comes first.\nSay the peg. Which step is last?\nNow tap it.","An IP address is like:":"Packet Path!\nA phone number tells a call where to ring.\nSay the peg. Address it: like what kind of address?\nNow tap it.","What carries much of the internet under the oceans?":"Packet Path!\nWi-Fi uses radio waves inside your house.\nRecall the lesson: which cables carry light under the sea?\nNow tap it.","In the peg, what comes right after chop it?":"Packet Path!\nIn the peg, rebuild it comes last.\nSay the peg. Stop after chop.\nNow tap it.","What does a packet need to reach the right computer?":"Packet Path!\nA pizza driver needs the house number.\nSay the peg. What do we give each packet?\nNow tap it.","A network is:":"Packet Path!\nA web of roads connects towns.\nThe internet connects computers. What does that make?\nNow tap it."},"s":"Follow the Packet Path.\nSay: chop it, address it, route it, rebuild it."},"ELEC.FNUM.L11.01":{"q":{"What is pi, rounded to two decimal places?":"Number Hall of Fame!\nThe square root of 2 is about 1.41.\nSay the peg. Which number goes with pi?\nNow tap it.","At sea level, water boils at how many degrees Celsius?":"Number Hall of Fame!\nNormal body temperature is about 37 degrees Celsius.\nSay the peg. Which number goes with boils?\nNow tap it.","The angles in a triangle add up to:":"Number Hall of Fame!\nThe angles in a square add up to 360 degrees.\nSay the peg. What does a triangle sum to?\nNow tap it.","At what temperature Celsius does water freeze?":"Number Hall of Fame!\nIn Fahrenheit, water freezes at 32.\nSay the peg. Which number goes with freezes?\nNow tap it.","Put these in order from smallest to biggest: a right angle, pi, a triangle's angle sum.":"Number Hall of Fame!\n3, 30, 300: small to big.\nFind the smallest number first.\nTap them in order.","A triangle has angles of 90 degrees and 50 degrees. How many degrees is the third angle?":"Number Hall of Fame!\nIf two angles are 60 and 60, the third is 60.\nAdd 90 and 50, then take that from 180.\nType the number.","A circle is 10 inches across. About how far is it around?":"Number Hall of Fame!\nA circle 2 feet across is about 6.28 feet around.\nMultiply 10 by pi.\nNow tap it.","Water boils at 212 degrees Fahrenheit and freezes at 32. How many degrees apart are boiling and freezing on the Celsius scale?":"Number Hall of Fame!\nIn Fahrenheit, the gap is 180 degrees.\nSubtract freezing from boiling, in Celsius.\nType the number.","A builder checks that a corner is square. How many degrees should it be?":"Number Hall of Fame!\nA straight line makes 180 degrees.\nA square corner is a right angle. How many degrees?\nNow tap it.","Which number is pi closest to?":"Number Hall of Fame!\nOne half is 0.5.\nSay the peg. Which number goes with pi?\nNow tap it.","Water freezes at 0 degrees Celsius. At what Celsius temperature does it boil?":"Number Hall of Fame!\nIn Fahrenheit, water boils at 212.\nSay the peg. Which number goes with boils?\nNow tap it.","The three angles of every triangle add up to:":"Number Hall of Fame!\nThe four angles of a rectangle add to 360.\nSay the peg. What does a triangle sum to?\nNow tap it.","In the peg, what sums to 180?":"Number Hall of Fame!\nIn the peg, water boils at 100.\nSay the peg. Which shape is at the end?\nNow tap it.","The distance around a circle is about how many times the distance across?":"Number Hall of Fame!\nA square's distance around is 4 times one side.\nRecall the string and the can. A little more than what?\nNow tap it.","In \"a 90-degree corner\", degrees measure:":"Number Hall of Fame!\nOn a hot day, degrees measure heat.\nIs a corner hot or cold, or is it a turn?\nNow tap it."},"s":"Visit the Number Hall of Fame.\nSay: pi is 3.14, water boils at 100, freezes at 0, a triangle sums to 180."},"ELEC.FWORLD.L12.01":{"q":{"What is the currency of Japan?":"Currency Code!\nMexico uses the peso.\nSay the peg. Which money goes with Japan?\nNow tap it.","What currency is used in Israel?":"Currency Code!\nRussia uses the ruble.\nSay the peg. Which money goes with Israel?\nNow tap it.","Which country has the largest economy?":"Currency Code!\nChina has the second largest economy.\nRecall the lesson: which country is first?\nNow tap it.","Many countries in Europe, such as France and Germany, share which currency?":"Currency Code!\nBritain uses the pound.\nSay the peg. Which money goes with much of Europe?\nNow tap it.","What is the currency of Britain?":"Currency Code!\nFrance once used the franc, before the euro.\nSay the peg. Which money goes with Britain?\nNow tap it.","Put these economies in order from largest to smaller: China, the United States, Japan.":"Currency Code!\nGold, silver, bronze: first to third.\nWhich is first? Which is second?\nTap them in order.","If 1 dollar buys 4 shekels, how many shekels does 25 dollars buy?":"Currency Code!\nAt 4 shekels a dollar, 10 dollars buy 40.\nMultiply 25 by 4.\nType the number.","What is an exchange rate?":"Currency Code!\nA recipe can tell how many cups make one quart.\nDollars into shekels: what tells you how many?\nNow tap it.","Yossi's family flies to Tokyo. What money will they need there?":"Currency Code!\nIn Paris they would use euros.\nSay the peg. Tokyo is in Japan.\nNow tap it.","What is the currency of the United States?":"Currency Code!\nMexico calls its money the peso.\nSay the peg. Which money goes with America?\nNow tap it.","In the peg, which currency goes with Britain?":"Currency Code!\nIn the peg, the yen goes with Japan.\nSay the peg. Stop at Britain.\nNow tap it.","Which country has the second largest economy?":"Currency Code!\nThe United States is first.\nRecall: who came right after the United States?\nNow tap it.","In the peg, which currency goes with Israel?":"Currency Code!\nIn the peg, the pound goes with Britain.\nSay the peg. Stop at Israel.\nNow tap it.","How many cents make one dollar?":"Currency Code!\nA dime is 10 cents.\nFour quarters make a dollar. Count the cents.\nNow tap it.","Currency means:":"Currency Code!\nA language is the words a country uses.\nDollars and shekels are examples. Of what?\nNow tap it."},"s":"Crack the Currency Code.\nSay: dollar for America, euro for much of Europe, yen for Japan, pound for Britain, shekel for Israel."},"ELEC.FNATURE.L12.01":{"q":{"What disease did Jenner's first vaccine protect against?":"Cure Clock!\nSalk's vaccine protected against polio.\nRecall the lesson: which disease?\nNow tap it.","What is pasteurization?":"Cure Clock!\nRefrigerators slow germs by keeping food cold.\nRecall the lesson: what is done to the milk?\nNow tap it.","What was penicillin?":"Cure Clock!\nA vaccine trains the body to fight a disease ahead of time.\nRecall the lesson: what kind of medicine kills bacteria?\nNow tap it.","Who developed the polio vaccine announced in 1955?":"Cure Clock!\nFleming discovered penicillin.\nSay the peg. Who goes with 1955?\nNow tap it.","Antibiotics like penicillin fight:":"Cure Clock!\nCasts help broken bones heal.\nRecall the lesson: an antibiotic kills what?\nNow tap it.","Put these in time order: Salk's polio vaccine, Jenner's smallpox vaccine, Fleming's penicillin, Pasteur's germ studies.":"Cure Clock!\nThe 1700s come before the 1800s, then the 1900s.\nSay the peg. Which year is earliest?\nTap them in order.","Penicillin was discovered in 1928. Salk's vaccine was announced in 1955. How many years apart are they?":"Cure Clock!\nFrom 1900 to 1920 is 20 years.\nTake 1928 away from 1955.\nType the number.","How does a vaccine work?":"Cure Clock!\nA fire drill trains people before a real fire.\nWhat does a drill do before the real thing?\nNow tap it.","A milk carton says pasteurized. What was done to the milk?":"Cure Clock!\nCanned soup is cooked inside the can for safety.\nSay the peg. What did Pasteur study?\nNow tap it.","Who discovered penicillin in 1928?":"Cure Clock!\nSalk is known for the polio vaccine.\nSay the peg. Who goes with 1928?\nNow tap it.","Who showed that germs cause disease?":"Cure Clock!\nJenner made the first vaccine.\nSay the peg. Who goes with germs?\nNow tap it.","In the peg, what happened in 1796?":"Cure Clock!\nIn the peg, 1928 is penicillin.\nSay the peg. Stop at 1796.\nNow tap it.","In the peg, whose discovery was penicillin?":"Cure Clock!\nIn the peg, Salk made the polio shot.\nSay the peg. Stop at penicillin.\nNow tap it.","Why do we wash our hands with soap?":"Cure Clock!\nWe cover food to keep flies away.\nWhat tiny things on our hands can make us sick?\nNow tap it.","Which is a healthy habit that prevents sickness?":"Cure Clock!\nGetting enough sleep helps the body fight germs.\nWhich habit removes germs?\nNow tap it."},"s":"Wind the Cure Clock.\nSay: 1796 Jenner's vaccine, 1860s Pasteur's germs, 1928 Fleming's penicillin, 1955 Salk's polio shot."},"ELEC.FUSA.L12.01":{"q":{"At what age can a citizen vote?":"Citizen Checklist!\nYou must be 35 to run for President.\nSay the peg. What age goes with voting?\nNow tap it.","What does a jury do?":"Citizen Checklist!\nA judge runs the courtroom and explains the law.\nRecall the lesson: what does the group of citizens decide?\nNow tap it.","How often is the census taken?":"Citizen Checklist!\nA President is elected every 4 years.\nSay the peg. Which number goes with the census?\nNow tap it.","By what date are federal income taxes usually due?":"Citizen Checklist!\nThe new year begins January 1.\nSay the peg. Which date goes with taxes?\nNow tap it.","Becoming a citizen after moving from another country is called:":"Citizen Checklist!\nFinishing school is called graduation.\nWhich word means becoming a citizen by choice?\nNow tap it.","Put the census years in order: 2020, 2000, 2010.":"Citizen Checklist!\n1980, 1990: count by tens.\nStart with the smallest year.\nTap them in order.","The last census was in 2020. In what year is the next one?":"Citizen Checklist!\nAfter 2000 came 2010.\nAdd 10 to 2020.\nType the number.","What document gives citizens their rights, like freedom of speech?":"Citizen Checklist!\nA passport lets you travel abroad.\nWhich document holds the Bill of Rights?\nNow tap it.","Shimon's father gets a letter from the court asking him to come and hear a case. What duty is this?":"Citizen Checklist!\nA form asking who lives in your home is a count.\nSay the peg. Which duty involves a trial?\nNow tap it.","Which duty helps decide how many representatives a state gets?":"Citizen Checklist!\nJury duty means hearing a trial.\nSay the peg. Which duty counts people?\nNow tap it.","In the peg, what happens at 18?":"Citizen Checklist!\nIn the peg, the census comes every 10 years.\nSay the peg. Stop at 18.\nNow tap it.","What is a duty of a citizen?":"Citizen Checklist!\nOwning a car is a choice, not a duty.\nSay the peg. Which choice is in it?\nNow tap it.","In the peg, when are taxes due?":"Citizen Checklist!\nIn the peg, the census comes every 10 years.\nSay the peg. Stop at taxes.\nNow tap it.","Which is a duty, not just a right?":"Citizen Checklist!\nFreedom of speech is a right you may use or not.\nWhich one are you called on to do?\nNow tap it.","A citizen is:":"Citizen Checklist!\nA member of a team plays for that team.\nBorn in America makes you what?\nNow tap it."},"s":"Run the Citizen Checklist.\nSay: vote at 18, serve on a jury, pay taxes by April 15, count in the census every 10 years."},"ELEC.FPAST.L12.01":{"q":{"What did Galileo use to study the sky?":"Science Stars!\nA microscope shows tiny things up close.\nSay the peg. Galileo looked up with what?\nNow tap it.","Which element did Marie Curie discover?":"Science Stars!\nOxygen was discovered in the 1770s.\nSay the peg. What did Curie find?\nNow tap it.","Which famous equation belongs to Einstein?":"Science Stars!\nF = m × a is Newton's second law.\nRecall the lesson: which equation links mass and energy?\nNow tap it.","Who described the law of universal gravitation in 1687?":"Science Stars!\nGalileo studied the sky with a telescope.\nSay the peg. Who found gravity?\nNow tap it.","What did Galileo see through his telescope?":"Science Stars!\nA microscope later showed germs in water.\nHe looked up at a giant planet. What circled it?\nNow tap it.","Put the scientists in time order: Einstein, Galileo, Curie, Newton.":"Science Stars!\nColumbus, Washington, Lincoln: oldest to newest.\nSay the peg. Who comes first?\nTap them in order.","Einstein's first relativity paper was in 1905. Newton's laws were in 1687. How many years apart are they?":"Science Stars!\nFrom 1700 to 1900 is 200 years.\nTake 1687 away from 1905.\nType the number.","Marie Curie was the first person to win two Nobel Prizes. In which two fields?":"Science Stars!\nEinstein won his Nobel Prize in physics alone.\nRecall the lesson: which two sciences?\nNow tap it.","In 1919, astronomers saw starlight bend near the Sun during an eclipse. Whose idea did this prove?":"Science Stars!\nJupiter's moons showed the first scientist was right to look up.\nSay the peg. Who bent light?\nNow tap it.","In the peg, who found radium?":"Science Stars!\nIn the peg, Newton found gravity.\nSay the peg. Stop at radium.\nNow tap it.","Who used a telescope to see Jupiter's moons?":"Science Stars!\nPasteur studied germs.\nSay the peg. Who looked up?\nNow tap it.","E = mc² connects:":"Science Stars!\nF = m × a connects force, mass and acceleration.\nRecall the lesson: what do E and m stand for?\nNow tap it.","In the peg, who bent light?":"Science Stars!\nIn the peg, Galileo looked up.\nSay the peg. Stop at bent light.\nNow tap it.","What keeps the Moon circling Earth?":"Science Stars!\nFriction slows a ball rolling on grass.\nWhat pulls the apple down? It pulls the Moon too.\nNow tap it.","What does a scientist do to test an idea?":"Science Stars!\nA chef tastes a new recipe to see if it works.\nHow do scientists check if an idea is true?\nNow tap it."},"s":"Meet the Science Stars.\nSay: Galileo looked up, Newton found gravity, Curie found radium, Einstein bent light."},"ELEC.FTECH.L12.01":{"q":{"What is the first stroke of a four-stroke engine?":"Four-Stroke Song!\nThe last stroke pushes used gases out.\nSay the peg. What does suck stand for?\nNow tap it.","Which stroke actually pushes the car forward?":"Four-Stroke Song!\nThe squeeze stroke packs the fuel and air tight.\nSay the peg. Which stroke goes bang?\nNow tap it.","What powers an electric car's motor?":"Four-Stroke Song!\nA gas car burns fuel in its engine.\nRecall the lesson: where does the electric current come from?\nNow tap it.","What is the last stroke, which pushes burned gases out?":"Four-Stroke Song!\nThe first stroke pulls fuel and air in.\nSay the peg. What does blow stand for?\nNow tap it.","What makes the spark in a gas engine?":"Four-Stroke Song!\nA lighter makes a flame for a candle.\nWhich part has spark in its name?\nNow tap it.","Put the four strokes in order.":"Four-Stroke Song!\nInhale, hold, exhale: breathing in order.\nSay the peg. Match each word to a stroke.\nTap them in order.","An engine turns 3,000 times per minute. How many turns is that in 2 minutes?":"Four-Stroke Song!\n1,500 turns a minute for 2 minutes is 3,000.\nMultiply 3,000 by 2.\nType the number.","How do brakes stop a car?":"Four-Stroke Song!\nRubbing your hands together makes heat.\nWhat force happens when two surfaces rub?\nNow tap it.","An electric car slows down, and its battery gains a little charge. What is the motor doing?":"Four-Stroke Song!\nA bike light powered by the wheel works this way.\nA spinning motor can also make electricity. What is that called?\nNow tap it.","In the peg, which stroke is squeeze?":"Four-Stroke Song!\nIn the peg, bang is the power stroke.\nSay the peg. Stop at squeeze.\nNow tap it.","Electric car motors use which two things to spin?":"Four-Stroke Song!\nGas engines use fuel and sparks.\nRecall the lesson: what spins an electric motor?\nNow tap it.","Which stroke burns the fuel?":"Four-Stroke Song!\nThe intake stroke pulls fuel in.\nSay the peg. Which stroke is the bang?\nNow tap it.","In the peg, which word means intake?":"Four-Stroke Song!\nIn the peg, the last word means exhaust.\nSay the peg. Which word comes first?\nNow tap it.","What lights the fuel in the power stroke?":"Four-Stroke Song!\nA diesel engine lights fuel just by squeezing it hot.\nRecall the lesson: what lit the squeezed fuel?\nNow tap it.","An engine turns energy into:":"Four-Stroke Song!\nA light bulb turns electricity into light.\nWhat does a car do when the engine runs?\nNow tap it."},"s":"Sing the Four-Stroke Song.\nSay: suck, squeeze, bang, blow.\nIntake, compression, power, exhaust."},"ELEC.FNUM.L12.01":{"q":{"Simple interest on $200 at 5 percent for one year is:":"Money Grows!\nSimple interest on 300 dollars at 2 percent is 6 dollars.\nFind 5 percent of 200. Multiply 200 by 0.05.\nNow tap it.","Why does compound interest grow faster than simple interest?":"Money Grows!\nA snowball rolling downhill picks up more snow each turn.\nSay the peg. Compound pays on what?\nNow tap it.","At 8 percent interest, about how many years until money doubles?":"Money Grows!\nAt 4 percent, 72 divided by 4 is 18 years.\nSay the peg. Divide 72 by 8.\nNow tap it.","Who pays you interest when you save?":"Money Grows!\nYou pay a landlord rent for using his apartment.\nWhere do you keep savings that earn interest?\nNow tap it.","Put these from fastest-growing to slowest at 6 percent for 10 years: simple interest, compound interest, no interest.":"Money Grows!\nA running stream fills a bucket faster than drips.\nSay the peg. Which pays on the pile?\nTap them in order.","Using the Rule of 72, at 9 percent, about how many years until money doubles?":"Money Grows!\nAt 12 percent, 72 divided by 12 is 6.\nDivide 72 by 9.\nType the number.","$100 grows by 10 percent compound interest each year. How much is it after 2 years?":"Money Grows!\n$200 at 10 percent becomes $220, then $242.\nAdd 10 percent, then 10 percent of the new total.\nNow tap it.","You borrow $500 at 4 percent simple interest for one year. How many dollars of interest do you owe?":"Money Grows!\n3 percent of 400 is 12.\nMultiply 500 by 0.04.\nType the number.","Dovid saves $1,000 at 6 percent, compounded. About when will it reach $2,000?":"Money Grows!\nAt 8 percent, money doubles in about 9 years.\nDivide 72 by 6.\nNow tap it.","In the peg, what pays on the pile?":"Money Grows!\nIn the peg, simple pays on the start.\nSay the peg. Stop at the pile.\nNow tap it.","At 12 percent, how many years to double, by the Rule of 72?":"Money Grows!\nAt 3 percent, it takes about 24 years.\nDivide 72 by 12.\nNow tap it.","Interest is:":"Money Grows!\nRent is money paid for using a home.\nRecall the lesson: interest is money paid for using what?\nNow tap it.","In the peg, what do you divide 72 by?":"Money Grows!\nIn the peg, simple pays on the start.\nSay the peg. Look at the last part.\nNow tap it.","What is 5 percent of $300?":"Money Grows!\n5 percent of $100 is $5.\nFind 5 out of every 100, three times.\nNow tap it.","Saving money means:":"Money Grows!\nA squirrel stores nuts for the winter.\nIf you save, when will you use the money?\nNow tap it."},"s":"Watch Money Grows.\nSay: simple pays on the start, compound pays on the pile, 72 divided by the rate doubles it."},"ELEC.FWORLD.L13.01":{"q":{"In what year was the United Nations founded?":"Global Groups!\nNATO was formed in 1949.\nRecall the lesson: right after which war ended?\nNow tap it.","Which country is a permanent member of the UN Security Council?":"Global Groups!\nJapan is not one of the permanent five.\nSay the peg. Which country is among the five?\nNow tap it.","What is NATO?":"Global Groups!\nThe European Union joins many European countries in trade.\nRecall the lesson: the countries promise to do what?\nNow tap it.","How many countries are members of the United Nations?":"Global Groups!\nThe European Union has 27 members.\nSay the peg. How many members?\nNow tap it.","Where is the United Nations headquarters?":"Global Groups!\nMany other UN offices are in Geneva, Switzerland.\nRecall the lesson: which American city?\nNow tap it.","Put these in time order: NATO is formed, the UN is founded, World War II begins.":"Global Groups!\n1900 comes before 1950.\nFind the earliest year.\nTap them in order.","How many permanent members does the UN Security Council have?":"Global Groups!\nThe Supreme Court has 9 justices.\nSay the peg and count the permanent countries.\nType the number.","What does a veto do in the Security Council?":"Global Groups!\nA President can veto a bill from Congress.\nRecall the lesson: what can each of the five do?\nNow tap it.","A news report says, \"Five nations hold permanent seats.\" Which group is this about?":"Global Groups!\nAn alliance to defend each other is NATO.\nSay the peg. Which UN group has permanent seats?\nNow tap it.","Which group was founded in 1945 to keep world peace?":"Global Groups!\nNATO came four years later.\nSay the peg. Which group keeps peace?\nNow tap it.","In the peg, how many members does the UN have?":"Global Groups!\nIn the peg, five seats are permanent.\nSay the peg. Stop at members.\nNow tap it.","Which country is NOT a permanent member of the Security Council?":"Global Groups!\nThe United Kingdom is one of the five.\nSay the peg. Which country is missing from it?\nNow tap it.","In the peg, which of these has a permanent seat?":"Global Groups!\nIn the peg, China has a permanent seat.\nSay the peg. Name the five.\nNow tap it.","Why was the United Nations founded?":"Global Groups!\nThe Red Cross helps people after disasters.\nIt was founded right after a terrible war. Why?\nNow tap it.","An organization is:":"Global Groups!\nA team plays together to win.\nThe UN is many countries together. What is it?\nNow tap it."},"s":"Meet the Global Groups.\nSay: UN keeps peace, 193 members; five permanent seats: US, UK, France, Russia, China."},"ELEC.FNATURE.L13.01":{"q":{"What is the name of our galaxy?":"Cosmic Address!\nAndromeda is the nearest large galaxy to ours.\nSay the peg. What is the third part of the address?\nNow tap it.","A light-year measures:":"Cosmic Address!\nA pound measures weight.\nRecall the lesson: not time, but what?\nNow tap it.","Which is the nearest star after the Sun?":"Cosmic Address!\nSirius is the brightest star in our night sky.\nRecall the lesson: which star is 4.2 light-years away?\nNow tap it.","Our Sun is best described as:":"Cosmic Address!\nJupiter is a huge ball of gas, but it is a planet.\nDoes the Sun make its own light, like the stars?\nNow tap it.","Put your Cosmic Address in order from smallest to largest: the universe, Earth, the Milky Way, the solar system.":"Cosmic Address!\nRoom, house, street, city: small to large.\nSay the peg. Start with home.\nTap them in order.","Proxima Centauri is about 4 light-years away. If you could travel at light speed, about how many years would the trip take?":"Cosmic Address!\nAt light speed, 10 light-years takes 10 years.\nA light-year is how far light goes in a year.\nType the number.","What is a black hole?":"Cosmic Address!\nA whirlpool pulls in anything that drifts too close.\nRecall the lesson: what cannot escape a black hole?\nNow tap it.","About how far does light travel in one year?":"Cosmic Address!\nLight goes about 186,000 miles in one second.\nRecall the lesson: millions, billions or trillions?\nNow tap it.","An astronomer sees light from a star 100 light-years away. When did that light leave the star?":"Cosmic Address!\nLight from a star 8 light-years away left 8 years ago.\nLight travels one light-year each year. Count back.\nNow tap it.","In the peg, which comes right after solar system?":"Cosmic Address!\nIn the peg, Earth is home.\nSay the peg. Stop after solar system.\nNow tap it.","A light-year is a unit of:":"Cosmic Address!\nAn hour is a unit of time.\nRecall the lesson: light-years measure what?\nNow tap it.","Our galaxy is called:":"Cosmic Address!\nOur star is called the Sun.\nSay the peg. What is the third part?\nNow tap it.","In the peg, the Milky Way is like your:":"Cosmic Address!\nIn the peg, Earth is like your home.\nSay the peg. Match the third parts.\nNow tap it.","Why does the Sun look bigger than other stars?":"Cosmic Address!\nA nearby streetlight looks brighter than a faraway one.\nA close light looks big. Is the Sun close or far?\nNow tap it.","Which makes its own light?":"Cosmic Address!\nThe Moon shines only by reflecting sunlight.\nWhich one glows by itself?\nNow tap it."},"s":"Learn your Cosmic Address.\nSay: Earth, solar system, Milky Way, universe.\nA light-year is a distance."},"ELEC.FUSA.L13.01":{"q":{"How many amendments does the Constitution have?":"Civics Countdown!\nThe Bill of Rights is the first 10.\nSay the peg. Which number goes with amendments?\nNow tap it.","The Star-Spangled Banner was written about a battle at which fort?":"Civics Countdown!\nFort Sumter is where the Civil War began.\nRecall the lesson: which fort, in our own city?\nNow tap it.","Who is Commander in Chief of the military?":"Civics Countdown!\nThe Chief Justice leads the Supreme Court.\nRecall the lesson: which leader commands the military?\nNow tap it.","How many justices are on the Supreme Court?":"Civics Countdown!\nThe Senate has 100 members.\nSay the peg. Which number goes with justices?\nNow tap it.","Who wrote The Star-Spangled Banner?":"Civics Countdown!\nThomas Jefferson wrote the Declaration of Independence.\nRecall the lesson: who watched the battle at Fort McHenry?\nNow tap it.","Put the peg numbers in order from smallest to largest: senators, justices, representatives, amendments.":"Civics Countdown!\n1, 10, 100: small to large.\nSay the peg. Which group is smallest?\nTap them in order.","How many voting members are in Congress in all: 100 senators plus 435 representatives?":"Civics Countdown!\n100 plus 400 is 500.\nAdd 100 and 435.\nType the number.","What is the supreme law of the land?":"Civics Countdown!\nThe Declaration announced independence in 1776.\nSay the peg. What is number 1?\nNow tap it.","A man studying for the citizenship test asks how many senators each state has. What do you tell him?":"Civics Countdown!\nEach state has at least 1 representative.\nDivide 100 senators by 50 states.\nNow tap it.","In the peg, how many representatives are there?":"Civics Countdown!\nIn the peg, there are 100 senators.\nSay the peg. Stop at representatives.\nNow tap it.","What is the national anthem?":"Civics Countdown!\nAmerica the Beautiful is a well-loved patriotic song.\nRecall the lesson: which song did Key write?\nNow tap it.","What is the date of Independence Day?":"Civics Countdown!\nFlag Day is June 14.\nRecall the lesson: which day is America's birthday?\nNow tap it.","In the peg, which number goes with justices?":"Civics Countdown!\nIn the peg, 27 goes with amendments.\nSay the peg. Stop at justices.\nNow tap it.","Why are there 100 senators?":"Civics Countdown!\n50 states times 1 governor each makes 50 governors.\nHow many states? How many senators each?\nNow tap it.","Civics is the study of:":"Civics Countdown!\nBiology is the study of living things.\nThe citizenship test checks this subject. What is it about?\nNow tap it."},"s":"Do the Civics Countdown.\nSay: 1 Constitution, 9 justices, 27 amendments, 100 senators, 435 representatives."},"ELEC.FPAST.L13.01":{"q":{"What tiny invention from 1947 is inside every computer chip?":"Tech Timeline!\nVacuum tubes were bigger switches used before it.\nSay the peg. What goes with 1947?\nNow tap it.","What did 1989 bring, by the peg?":"Tech Timeline!\nIn the peg, 1969 brought the Moon landing.\nSay the peg. What goes with 1989?\nNow tap it.","In what year did the touch-screen smartphone become popular?":"Tech Timeline!\nThe Web came in 1989.\nSay the peg. Which year is last?\nNow tap it.","Which event in the Tech Timeline happened first?":"Tech Timeline!\nThe phone is the newest in the peg.\nSay the peg. What comes first?\nNow tap it.","What does a transistor do?":"Tech Timeline!\nA light switch turns a lamp on and off.\nRecall the lesson: a transistor is a tiny what?\nNow tap it.","Put the Tech Timeline in order: the smartphone, the Web, the transistor, the Moon landing.":"Tech Timeline!\n1900, 1950, 2000: oldest to newest.\nSay the peg. Which year is earliest?\nTap them in order.","How many years passed from the transistor (1947) to the smartphone (2007)?":"Tech Timeline!\nFrom 1950 to 2000 is 50 years.\nTake 1947 away from 2007.\nType the number.","Computer chips today hold billions of what?":"Tech Timeline!\nA city holds millions of bricks in its buildings.\nRecall the lesson: what tiny switch is inside every chip?\nNow tap it.","A museum shows a giant computer from 1950 that fills a whole room. Why are computers so much smaller now?":"Tech Timeline!\nBig film cameras shrank when digital sensors arrived.\nSay the peg. Which tiny invention shrank the computer?\nNow tap it.","In the peg, what goes with 1969?":"Tech Timeline!\nIn the peg, 1989 goes with the Web.\nSay the peg. Stop at 1969.\nNow tap it.","What did the World Wide Web make easy?":"Tech Timeline!\nThe printing press made books easy to copy.\nRecall the lesson: what did the Web make easy to browse?\nNow tap it.","What is inside every computer chip?":"Tech Timeline!\nA battery stores electricity.\nSay the peg. What goes with 1947?\nNow tap it.","In the peg, which year goes with the Web?":"Tech Timeline!\nIn the peg, 2007 goes with the smartphone.\nSay the peg. Stop at the Web.\nNow tap it.","A transistor works like a tiny:":"Tech Timeline!\nA faucet controls how much water flows.\nOn means 1, off means 0. What turns things on and off?\nNow tap it.","A milestone in history is:":"Tech Timeline!\nA bar mitzvah is a milestone in a boy's life.\nThe transistor changed everything after it. What is it called?\nNow tap it."},"s":"Follow the Tech Timeline.\nSay: 1947 transistor, 1969 the Moon, 1989 the Web, 2007 the smartphone."},"ELEC.FTECH.L13.01":{"q":{"What is an algorithm?":"Smart Tech Check!\nA map shows where places are.\nSay the peg. What do algorithms follow?\nNow tap it.","How does AI learn?":"Smart Tech Check!\nA child learns what a dog looks like after seeing many dogs.\nSay the peg. AI learns from what?\nNow tap it.","What does encryption do?":"Smart Tech Check!\nA lock keeps a door shut to anyone without the key.\nSay the peg. What does encryption do to secrets?\nNow tap it.","An AI chatbot gives you a fact for a report. What should you do?":"Smart Tech Check!\nA good reporter confirms a story with a second source.\nSay the peg. What is the last step?\nNow tap it.","Which is the strongest password?":"Smart Tech Check!\nA lock with many dials is harder to crack.\nWhich choice would be hardest to guess?\nNow tap it.","Put the steps of an algorithm for making tea in order: pour water in the cup, boil water, add the tea bag.":"Smart Tech Check!\nGetting dressed: socks, then shoes.\nWhat must happen before you pour?\nTap them in order.","A code uses 4 digits, each from 0 to 9. How many possible codes are there?":"Smart Tech Check!\nWith 2 digits, there are 100 codes.\nMultiply 10 by itself four times.\nType the number.","Where is cloud storage really kept?":"Smart Tech Check!\nA library keeps books in one building for many readers.\nThe cloud is other computers. What are they called?\nNow tap it.","A website shows a lock icon next to its address. What does that mean?":"Smart Tech Check!\nA sealed envelope keeps a letter private.\nSay the peg. What protects secrets online?\nNow tap it.","In the peg, what does AI learn from?":"Smart Tech Check!\nIn the peg, algorithms follow steps.\nSay the peg. Stop at AI.\nNow tap it.","Why must people check AI answers?":"Smart Tech Check!\nA calculator gives wrong answers when you type wrong numbers.\nRecall the lesson: can AI be wrong?\nNow tap it.","A recipe is an example of an:":"Smart Tech Check!\nA secret code that scrambles messages is encryption.\nSay the peg. What follows steps?\nNow tap it.","In the peg, what scrambles secrets?":"Smart Tech Check!\nIn the peg, algorithms follow steps.\nSay the peg. Stop at secrets.\nNow tap it.","Which is an algorithm?":"Smart Tech Check!\nA list of steps to tie a shoe is one too.\nWhich choice is a list of steps?\nNow tap it.","If you give a computer wrong instructions, what happens?":"Smart Tech Check!\nA recipe with the wrong amount of salt makes bad soup.\nDoes a computer think for itself?\nNow tap it."},"s":"Do the Smart Tech Check.\nSay: algorithms follow steps, AI learns from examples, encryption scrambles secrets, always double-check."},"ELEC.FNUM.L13.01":{"q":{"What is the mean of 3, 5 and 7?":"Data Detective!\nThe mean of 1, 2 and 3 is 2.\nAdd the three numbers, then divide by 3.\nNow tap it.","What is the median of 2, 8, 5?":"Data Detective!\nThe median of 10, 30, 20 is 20.\nPut them in order first. Which is in the middle?\nNow tap it.","What is the probability a coin lands heads?":"Data Detective!\nA die rolls a 3 with probability 1/6.\nA coin has two sides. One of them is heads.\nNow tap it.","What is the mode of 4, 7, 7, 9?":"Data Detective!\nThe mode of 2, 2, 5 is 2.\nSay the peg. Which number shows up most?\nNow tap it.","Put these from least likely to most likely: the sun rising tomorrow, rolling a 6 on a die, flipping heads.":"Data Detective!\n0, 1/4, 1: small to large.\nWhich has the smallest chance?\nTap them in order.","Test scores are 80, 90 and 100. What is the mean?":"Data Detective!\nThe mean of 60 and 80 is 70.\nAdd the three scores, then divide by 3.\nType the number.","Ice cream sales and sunburns both rise in summer. Does ice cream cause sunburn?":"Data Detective!\nUmbrellas and wet streets go together because of rain.\nWhat hidden thing makes both go up?\nNow tap it.","What is the range of 3, 9, 15? (biggest minus smallest)":"Data Detective!\nThe range of 5, 6, 20 is 15.\nSubtract the smallest from the biggest.\nType the number.","A bag has 3 red marbles and 1 blue marble. What is the probability of picking blue?":"Data Detective!\nWith 2 red and 2 blue, blue is 2 out of 4.\nCount the blue marbles, then all the marbles.\nNow tap it.","In the peg, which measure is the middle?":"Data Detective!\nIn the peg, the mode is the most.\nSay the peg. Which one is the middle?\nNow tap it.","What is the mean of 10, 20 and 30?":"Data Detective!\nThe mean of 4 and 6 is 5.\nAdd them, then divide by 3.\nNow tap it.","A probability of 0 means the event is:":"Data Detective!\nA probability of 1 means it is certain.\nZero chance. Can it ever happen?\nNow tap it.","In the peg, what does the mean do?":"Data Detective!\nIn the peg, the mode is the most.\nSay the peg. Stop at mean.\nNow tap it.","Boys are 50, 55 and 60 inches tall. What is the median height?":"Data Detective!\nFor 4, 7, 9, the middle is 7.\nWhich height is in the middle of the line?\nNow tap it.","Which is an example of data?":"Data Detective!\nA list of test scores is data.\nWhich choice is numbers you could collect?\nNow tap it."},"s":"Be a Data Detective.\nSay: mean adds and divides, median is the middle, mode is the most.\nProbability runs from 0 to 1."}});
