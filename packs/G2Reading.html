'); },\n together:[['passageQ',{p:PASSAGES[3],qi:2,read:true}],['passageQ',{p:PASSAGES[3],qi:0,read:true}],['passageQ',{p:PASSAGES[3],qi:1,read:true}]],\n practice:[['passageQ',{p:PASSAGES[2],qi:0}],['passageQ',{p:PASSAGES[2],qi:1,read:true}],['passageQ',{p:PASSAGES[2],qi:2,read:true}],['charQ',{sp:STORYP[0]}],['passageQ',{p:PASSAGES[1],qi:0,read:true}],['passageQ',{p:PASSAGES[1],qi:2,read:true}],['wordHunt'],['settingQ',{sp:STORYP[3]}]],\n real:['passageQ',{p:PASSAGES[0],qi:0,intro:'Answer Bubby’s questions about Shabbos!'}],\n check:[['passageQ',{p:PASSAGES[0],qi:1}],['passageQ',{p:PASSAGES[0],qi:2,read:true}],['passageQ',{p:PASSAGES[1],qi:1}]]}\n];\n\n/* ================= 2nd GRADE READING (Level 3) ================= */\nL.length=0;\nfunction choiceText(opts,ok,prompt,help,pre){ view((pre||'')+'\u003cdiv class=\"choices\"\u003e'+opts.map(o=\u003e'\u003cbutton class=\"ch wide\" type=\"button\" data-v=\"'+o+'\"'+(o===ok?' data-ok=\"1\"':'')+' style=\"height:auto;min-height:64px;padding:8px 16px;font-size:22px\"\u003e'+o+'\u003c/button\u003e').join('')+'\u003c/div\u003e'); return say(prompt).then(()=\u003enew Promise(res=\u003e{ let first=true; scene.querySelectorAll('.ch').forEach(bt=\u003ebt.onclick=async()=\u003e{ if(BUSY) return; if(bt.dataset.v===ok){ bt.classList.add('yes'); chime(); lockAll(); res(first); } else { first=false; bt.classList.add('no'); soft(); await wrongHelp(help); } }); })); }\nconst TEAM2={oo:[['moon','🌙'],['spoon','🥄'],['boot','👢'],['zoo','🦁']],ow:[['cow','🐮'],['owl','🦉'],['crown','👑'],['clown','🤡']],ou:[['house','🏠'],['mouse','🐭'],['cloud','☁️'],['mouth','👄']],oi:[['coin','🪙'],['oil','🛢️'],['point','👉']],oy:[['boy','👦'],['toy','🧸'],['joy','😊']],aw:[['saw','🪚'],['paw','🐾'],['straw','🥤']]};\nconst RCTRL={ar:[['car','🚗'],['star','⭐'],['jar','🫙'],['shark','🦈']],or:[['corn','🌽'],['fork','🍴'],['horse','🐴'],['storm','⛈️']],er:[['letter','✉️'],['water','💧'],['flower','🌸']],ir:[['bird','🐦'],['girl','👧'],['shirt','👕']],ur:[['turtle','🐢'],['purse','👛'],['curl','➰']]};\nconst TEAM3={igh:[['night','🌃'],['light','💡'],['flight','✈️']],ie:[['pie','🥧'],['tie','👔']],y:[['fly','🪰'],['sky','🌌'],['cry','😢']],ey:[['happy','😀'],['baby','👶'],['puppy','🐶'],['bunny','🐰']],ew:[['new','🆕'],['screw','🔩'],['stew','🍲']],ue:[['glue','🧴'],['blue','🔵']]};\nconst TEAM3SHOW={ey:'y',y:'y'};\nfunction teamGames(bank,show,tag){ const keys=Object.keys(bank), lab=k=\u003e(show&&show[k])||k, pos=(w,k)=\u003ew.lastIndexOf(lab(k));\n  G[tag+'Find']=async c=\u003e{ const t=any(keys), w=any(bank[t]); const opts=shuffle([t].concat(shuffle(keys.filter(x=\u003elab(x)!==lab(t))).slice(0,2)));\n    const f=await pickQ('\u003cdiv class=\"row\"\u003e'+PIC(w[1],w[0])+WBIG(w[0])+'\u003c/div\u003e',opts.map(x=\u003e({h:BIGL(lab(x)),ok:x===t,label:lab(x)})),w[0]+'. Which letter team makes the vowel sound in '+w[0]+'?',async()=\u003e{ await say(w[0]+' has '+lab(t).split('').join(' ')+'.'); }); return [f,w[0]+' has '+lab(t)+'.']; };\n  G[tag+'Read']=async c=\u003e{ const t=any(keys), w=any(bank[t]); const others=shuffle(keys.filter(x=\u003ex!==t)).slice(0,2).map(x=\u003eany(bank[x]));\n    const f=await pickQ('\u003cdiv class=\"row\"\u003e'+WBIG(w[0])+'\u003c/div\u003e',shuffle([w].concat(others)).map(x=\u003e({h:PIC(x[1],x[0]),ok:x===w,label:x[0]})),'Read the word. Tap its picture.',async()=\u003e{ await say(lab(t).split('').join(' ')+' in '+w[0]+'.'); }); return [f,w[0]+'.']; };\n  G[tag+'Spell']=async c=\u003e{ const t=any(keys), w=any(bank[t]), i=pos(w[0],t), L2=lab(t); const shown=w[0].slice(0,i)+'_'.repeat(L2.length)+w[0].slice(i+L2.length); const opts=shuffle([t].concat(shuffle(keys.filter(x=\u003elab(x)!==L2)).slice(0,2)));\n    const f=await pickQ('\u003cdiv class=\"row\"\u003e'+PIC(w[1],w[0])+WBIG(shown)+'\u003c/div\u003e',opts.map(x=\u003e({h:BIGL(lab(x)),ok:x===t,label:lab(x)})),w[0]+'. Which letters fill the blank?',async()=\u003e{ await say(w[0]+' is spelled '+w[0].split('').join(', ')+'.'); }); return [f,w[0]+'.']; }; }\nteamGames(TEAM2,null,'vt2'); teamGames(RCTRL,null,'rc'); teamGames(TEAM3,TEAM3SHOW,'vt3');\nconst SYL3=[['picnic','pic','nic'],['napkin','nap','kin'],['tiger','ti','ger'],['robot','ro','bot'],['basket','bas','ket'],['pumpkin','pump','kin'],['music','mu','sic'],['paper','pa','per'],['lemon','lem','on'],['hotdog','hot','dog'],['seven','sev','en'],['open','o','pen']];\nG.split3=async c=\u003e{ const w=any(SYL3); const k=w[1].length; view('\u003cdiv class=\"row\" id=\"sw\" style=\"flex-wrap:nowrap;gap:2px\"\u003e'+w[0].split('').map((ch,i)=\u003e'\u003cspan style=\"font:800 40px var(--f-head)\"\u003e'+ch+'\u003c/span\u003e'+(i\u003cw[0].length-1?'\u003cbutton class=\"pic\" type=\"button\" data-i=\"'+(i+1)+'\"'+(i+1===k?' data-ok=\"1\"':'')+' style=\"min-width:16px;min-height:50px;padding:0 4px;border-width:3px;border-style:dashed\"\u003e|\u003c/button\u003e':'')).join('')+'\u003c/div\u003e');\n  await say(w[0]+'. Tap where it splits into syllables.'); const f=await new Promise(res=\u003e{ let first=true; scene.querySelectorAll('#sw .pic').forEach(b=\u003eb.onclick=async()=\u003e{ if(BUSY) return; if(+b.dataset.i===k){ b.classList.add('yes'); chime(); lockAll(); res(first); } else { first=false; b.classList.add('no'); soft(); await wrongHelp(async()=\u003esay(w[1]+', '+w[2]+'. Each syllable has one vowel sound.')); } }); }); return [f,w[1]+' | '+w[2]+'.']; };\nG.openClosed=async c=\u003e{ const w=any(SYL3), s=w[1], open=/[aeiou]$/.test(s); const f=await choiceText(['open: the vowel says its name','closed: the vowel is short'],open?'open: the vowel says its name':'closed: the vowel is short','In '+w[0]+', the first syllable is '+s+'. Is it open or closed?',async()=\u003esay(open?s+' ends with a vowel, so it is open: the vowel says its name.':s+' ends with a consonant, so it is closed: the vowel is short.'),'\u003cdiv class=\"row\"\u003e'+WBIG(w[1]+' | '+w[2])+'\u003c/div\u003e'); return [f,s+' is '+(open?'open':'closed')+'.']; };\nconst SOFT=[['city','c','s','🏙️'],['ice','c','s','🧊'],['face','c','s','😀'],['rice','c','s','🍚'],['pencil','c','s','✏️'],['cat','c','k','🐱'],['cake','c','k','🎂'],['cup','c','k','🥤'],['giraffe','g','j','🦒'],['gem','g','j','💎'],['orange','g','j','🍊'],['page','g','j','📄'],['goat','g','g','🐐'],['gift','g','g','🎁']];\nG.softHard=async c=\u003e{ const w=any(SOFT); const opts=w[1]==='c'?['s, like in sun','k, like in kite']:['j, like in jam','g, like in goat']; const ok=w[1]==='c'?(w[2]==='s'?opts[0]:opts[1]):(w[2]==='j'?opts[0]:opts[1]);\n  const f=await choiceText(opts,ok,'In '+w[0]+', what sound does the '+w[1]+' make?',async()=\u003esay(w[1]+' followed by e, i or y usually makes its soft sound. Otherwise it is hard.'),'\u003cdiv class=\"row\"\u003e'+PIC(w[3],w[0])+WBIG(w[0])+'\u003c/div\u003e'); return [f,'In '+w[0]+', '+w[1]+' says '+w[2]+'.']; };\nconst SILENT=[['knee','k','🦵'],['knife','k','🔪'],['knot','k','🪢'],['write','w','✍️'],['wrist','w','⌚'],['lamb','b','🐑'],['thumb','b','👍'],['comb','b','🪮']];\nG.silent=async c=\u003e{ const w=any(SILENT), i=w[0].indexOf(w[1]); view('\u003cdiv class=\"row\"\u003e'+PIC(w[2],w[0])+'\u003c/div\u003e\u003cdiv class=\"row\" id=\"sl\" style=\"flex-wrap:nowrap;gap:6px\"\u003e'+w[0].split('').map((ch,j)=\u003e'\u003cbutton class=\"pic\" type=\"button\" data-j=\"'+j+'\"'+(j===i?' data-ok=\"1\"':'')+' style=\"min-width:40px;min-height:64px;padding:4px 6px;font:800 34px var(--f-head)\"\u003e'+ch+'\u003c/button\u003e').join('')+'\u003c/div\u003e');\n  await say(w[0]+'. One letter is silent. Tap the letter you do not hear.'); const f=await new Promise(res=\u003e{ let first=true; scene.querySelectorAll('#sl .pic').forEach(b=\u003eb.onclick=async()=\u003e{ if(BUSY) return; if(+b.dataset.j===i){ b.classList.add('yes'); chime(); lockAll(); res(first); } else { first=false; b.classList.add('no'); soft(); await wrongHelp(async()=\u003esay('Say '+w[0]+' slowly. Which letter makes no sound?')); } }); }); return [f,'In '+w[0]+', the '+w[1]+' is silent.']; };\nconst PREF=[['un','happy','not happy'],['un','lock',  its own teaching */\nDP.peng={t:'Penguins',e:'🐧',parts:[\n {h:'Birds That Swim',about:'how penguins swim',s:['Penguins are birds, but they cannot fly.','They are great swimmers.','Their wings work like flippers in the water.']},\n {h:'Life in the Cold',about:'how penguins live in the cold',s:['Most penguins live in very cold places.','Thick fat and tight feathers keep them warm.','Penguins eat fish that they catch in the sea.']}],\n tells:['that penguins cannot fly','that they swim well','what their wings do','where they live','what keeps them warm','what they eat']};\nDP.camel3={t:'Camels in the Desert',e:'🐫',parts:[\n {h:'Made for the Desert',about:'a camel’s body',s:['Camels live in the hot, dry desert.','A camel’s hump stores fat for when food is hard to find.','Long eyelashes keep sand out of its eyes.']},\n {h:'Walking on Sand',about:'how camels travel',s:['Wide, flat feet stop a camel from sinking in soft sand.','A camel can walk for days without drinking water.','People ride camels across the desert.']}],\n tells:['where camels live','what the hump does','what the eyelashes do','what the feet do','how long it can walk with no water','what people do with camels'],\n q:[{ask:'what a camel’s feet do',part:1,trap:0}],\n ev:[{q:'How does a camel keep sand out of its eyes?',i:2,why:'Long eyelashes keep sand out. That sentence answers the question.'},{q:'Why doesn’t a camel sink in soft sand?',i:3,why:'Wide, flat feet stop it from sinking. That is the proof.'}],\n best:{q:'Why doesn’t a camel sink in soft sand?',i:3,trap:5,guess:'Camels are very, very light.'},\n two:{q:'Why are camels so good for a long desert trip?',i:[3,4],put:'Their feet don’t sink, and they can go days with no water. So they can travel far!'}};\nDP.owl3={t:'Night Hunters',e:'🦉',parts:[\n {h:'Hunting at Night',about:'how owls hunt',s:['Owls hunt at night.','Their big eyes help them see in the dark.','Their soft feathers make no sound when they fly.']},\n {h:'What Owls Eat',about:'an owl’s food
