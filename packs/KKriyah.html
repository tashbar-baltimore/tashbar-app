05b8\\u05e7\\u05b4\\u0596\\u05d9\\u05e2\\u05b7\", \"\\u05d5\\u05b7\\u05d9\\u05bc\\u05b9\\u05a3\\u05d0\\u05de\\u05b6\\u05e8\", \"\\u05de\\u05b7\\u0596\\u05d9\\u05b4\\u05dd\"]}]}, \"LK.KRI.L04.02.a\": {\"name\": \"Kriyah 4-2: Marks in the Chumash\", \"band\": \"3-4\", \"peg\": {\"kind\": \"picture\", \"show\": \"Marks are the tune, not stop signs.\", \"say\": \"Read Right Through: trop marks are the tune of the pasuk. Two pashtas: the first shows the beat. A meseg says hold a little and keep going.\"}, \"teach\": [{\"how\": \"Opener: a Chumash has small marks over and under the words, and now you will learn to read with them, like a real ba'al koreh. They are the trop, the tune of the pasuk. They are signs, not stop signs. You read right through them, word after word.\", \"q\": \"Marks 1. What are the little marks over and under these words?\", \"pic\": \"\\u05d5\\u05b7\\u05d9\\u05bc\\u05b9\\u05a5\\u05d0\\u05de\\u05b6\\u05e8 \\u05d0\\u05b1\\u05dc\\u05b9\\u05e7\\u05b4\\u0596\\u05d9\\u05dd \\u05d9\\u05b0\\u05d4\\u05b4\\u05a3\\u05d9 \\u05d0\\u0591\\u05d5\\u05b9\\u05e8 \\u05d5\\u05b7\\u05bd\\u05d9\\u05b0\\u05d4\\u05b4\\u05d9\\u05be\\u05d0\\u05bd\\u05d5\\u05b9\\u05e8\\u05c3\", \"o\": [\"trop, the tune of the pasuk\", \"mistakes made when it was printed\", \"extra letters that are not read\"]}, {\"how\": \"Look at tohu, the third word. It has the same mark two times: a pashta. When a word has two pashtas, the first one shows the beat.\", \"q\": \"Marks 2. Tohu has two pashtas. Which one shows its beat?\", \"pic\": \"\\u05d5\\u05b0\\u05d4\\u05b8\\u05d0\\u05b8\\u0597\\u05e8\\u05b6\\u05e5 \\u05d4\\u05b8\\u05d9\\u05b0\\u05ea\\u05b8\\u05a5\\u05d4 \\u05ea\\u05b9\\u0599\\u05d4\\u05d5\\u05bc\\u0599 \\u05d5\\u05b8\\u05d1\\u05b9\\u0594\\u05d4\\u05d5\\u05bc \\u05d5\\u05b0\\u05d7\\u05b9\\u0596\\u05e9\\u05c1\\u05b6\\u05da\\u05b0 \\u05e2\\u05b7\\u05dc\\u05be\\u05e4\\u05bc\\u05b0\\u05e0\\u05b5\\u05a3\\u05d9 \\u05ea\\u05b0\\u05d4\\u0591\\u05d5\\u05b9\\u05dd \\u05d5\\u05b0\\u05e8\\u05a3\\u05d5\\u05bc\\u05d7\\u05b7 \\u05d0\\u05b1\\u05dc\\u05b9\\u05e7\\u05b4\\u0594\\u05d9\\u05dd \\u05de\\u05b0\\u05e8\\u05b7\\u05d7\\u05b6\\u0596\\u05e4\\u05b6\\u05ea \\u05e2\\u05b7\\u05dc\\u05be\\u05e4\\u05bc\\u05b0\\u05e0\\u05b5\\u05a5\\u05d9 \\u05d4\\u05b7\\u05de\\u05bc\\u05b8\\u05bd\\u05d9\\u05b4\\u05dd\\u05c3\", \"o\": [\"the first one, TO-hu\", \"the second one, to-HU\", \"neither one of them\"]}, {\"how\": \"A meseg is a small straight line next to a vowel. In the middle of a word it says: hold this vowel a little, and keep going. On the LAST word of a pasuk, the same little line shows the beat, right before the two dots of sof pasuk.\", \"q\": \"Marks 3. Look at the last word of this pasuk. What does the little line under it show?\", \"pic\": \"\\u05d5\\u05b7\\u05d9\\u05b0\\u05db\\u05bb\\u05dc\\u05bc\\u059b\\u05d5\\u05bc \\u05d4\\u05b7\\u05e9\\u05c1\\u05bc\\u05b8\\u05de\\u05b7\\u05a5\\u05d9\\u05b4\\u05dd \\u05d5\\u05b0\\u05d4\\u05b8\\u05d0\\u05b8\\u0596\\u05e8\\u05b6\\u05e5 \\u05d5\\u05b0\\u05db\\u05c7\\u05dc\\u05be\\u05e6\\u05b0\\u05d1\\u05b8\\u05d0\\u05b8\\u05bd\\u05dd\\u05c3\", \"o\": [\"the beat of that word\", \"the end of the Chumash\", \"a missing letter\"]}], \"we\": [{\"q\": \"Together 1. Find hamayim with two pashtas in this pasuk. Where is its beat?\", \"pic\": \"\\u05d5\\u05b7\\u05d9\\u05bc\\u05b7\\u05a3\\u05e2\\u05b7\\u05e9\\u05c2 \\u05d0\\u05b1\\u05dc\\u05b9\\u05e7\\u05b4\\u05d9\\u05dd\\u05ae \\u05d0\\u05b6\\u05ea\\u05be\\u05d4\\u05b8\\u05e8\\u05b8\\u05e7\\u05b4\\u0592\\u05d9\\u05e2\\u05b7\\u0592 \\u05d5\\u05b7\\u05d9\\u05bc\\u05b7\\u05d1\\u05b0\\u05d3\\u05bc\\u05b5\\u0597\\u05dc \\u05d1\\u05bc\\u05b5\\u05a4\\u05d9\\u05df \\u05d4\\u05b7\\u05de\\u05bc\\u05b7\\u0599\\u05d9\\u05b4\\u05dd\\u0599 \\u05d0\\u05b2\\u05e9\\u05c1\\u05b6\\u05e8\\u0599 \\u05de\\u05b4\\u05ea\\u05bc\\u05b7\\u05a3\\u05d7\\u05b7\\u05ea \\u05dc\\u05b8\\u05e8\\u05b8\\u05e7\\u05b4\\u0594\\u05d9\\u05e2\\u05b7 \\u05d5\\u05bc\\u05d1\\u05b5\\u05a3\\u05d9\\u05df \\u05d4\\u05b7\\u05de\\u05bc\\u05b7\\u0594\\u05d9\\u05b4\\u05dd \\u05d0\\u05b2\\u05e9\\u05c1\\u05b6\\u0596\\u05e8 \\u05de\\u05b5\\u05e2\\u05b7\\u05a3\\u05dc \\u05dc\\u05b8\\u05e8\\u05b8\\u05e7\\u05b4\\u0591\\u05d9\\u05e2\\u05b7 \\u05d5\\u05b7\\u05bd\\u05d9\\u05b0\\u05d4\\u05b4\\u05d9\\u05be\\u05db\\u05b5\\u05bd\\u05df\\u05c3\", \"o\": [\"ha-MA-yim, at the first pashta\", \"ha-ma-YIM, at the second pashta\"], \"steps\": [\"Find hamayim: it has the same mark two times.\", \"Two pashtas? Look at the first one.\", \"Which part of the word is the first pashta on?\"]}, {\"q\": \"Together 2. Which mark ends every pasuk?\", \"pic\": \"\\u05d5\\u05b7\\u05d9\\u05bc\\u05b4\\u05e7\\u05b0\\u05e8\\u05b8\\u05a8\\u05d0 \\u05d0\\u05b1\\u05dc\\u05b9\\u05e7\\u05b4\\u05a4\\u05d9\\u05dd \\u05c0 \\u05dc\\u05b8\\u05d0\\u05d5\\u05b9\\u05e8\\u0599 \\u05d9\\u0594\\u05d5\\u05b9\\u05dd \\u05d5\\u05b0\\u05dc\\u05b7\\u05d7\\u05b9\\u0596\\u05e9\\u05c1\\u05b6\\u05da\\u05b0 \\u05e7\\u05b8\\u05a3\\u05e8\\u05b8\\u05d0 \\u05dc\\u05b8\\u0591\\u05d9\\u05b0\\u05dc\\u05b8\\u05d4 \\u05d5\\u05b7\\u05bd\\u05d9\\u05b0\\u05d4\\u05b4\\u05d9\\u05be\\u05e2\\u05b6\\u05a5\\u05e8\\u05b6\\u05d1 \\u05d5\\u05b7\\u05bd\\u05d9\\u05b0\\u05d4\\u05b4\\u05d9\\u05be\\u05d1\\u05b9\\u0596\\u05e7\\u05b6\\u05e8 \\u05d9\\u05a5\\u05d5\\u05b9\\u05dd \\u05d0\\u05b6\\u05d7\\u05b8\\u05bd\\u05d3\\u05c3\", \"o\": [\"sof pasuk, two dots like a colon\", \"a long line under the last word\", \"a dot inside the very last letter\"], \"steps\": [\"Look at the very end of the pasuk.\", \"After the last word there are two dots.\", \"They tell you the pasuk is over.\"]}], \"practice\": [{\"t\": \"type\", \"q\": \"Marks 4. How many trop marks does tohu have? Type the number.\", \"pic\": \"\\u05d5\\u05b0\\u05d4\\u05b8\\u05d0\\u05b8\\u0597\\u05e8\\u05b6\\u05e5 \\u05d4\\u05b8\\u05d9\\u05b0\\u05ea\\u05b8\\u05a5\\u05d4 \\u05ea\\u05b9\\u0599\\u05d4\\u05d5\\u05bc\\u0599 \\u05d5\\u05b8\\u05d1\\u05b9\\u0594\\u05d4\\u05d5\\u05bc \\u05d5\\u05b0\\u05d7\\u05b9\\u0596\\u05e9\\u05c1\\u05b6\\u05da\\u05b0 \\u05e2\\u05b7\\u05dc\\u05be\\u05e4\\u05bc\\u05b0\\u05e0\\u05b5\\u05a3\\u05d9 \\u05ea\\u05b0\\u05d4\\u0591\\u05d5\\u05b9\\u05dd \\u05d5\\u05b0\\u05e8\\u05a3\\u05d5\\u05bc\\u05d7\\u05b7 \\u05d0\\u05b1\\u05dc\\u05b9\\u05e7\\u05b4\\u0594\\u05d9\\u05dd \\u05de\\u05b0\\u05e8\\u05b7\\u05d7\\u05b6\\u0596\\u05e4\\u05b6\\u05ea \\u05e2\\u05b7\\u05dc\\u05be\\u05e4\\u05bc\\u05b0\\u05e0\\u05b5\\u05a5\\u05d9 \\u05d4\\u05b7\\u05de\\u05bc\\u05b8\\u05bd\\u05d9\\u05b4\\u05dd\\u05c3\", \"a\": \"2\", \"alt\": [\"two\"], \"kb\": \"num\"}, {\"t\": \"spotall\", \"q\": \"Marks 5. Tap every sentence that is true about trop marks.\", \"cells\": [{\"label\": \"they are the tune of the pasuk\", \"ok\": true}, {\"label\": \"you read right through them\", \"ok\": true}, {\"label\": \"they sit over and under words\", \"ok\": true}, {\"label\": \"they tell you to stop at every word\", \"ok\": false}, {\"label\": \"they are mistakes in the print\", \"ok\": false}]}, {\"t\": \"pairs\", \"q\": \"Marks 6. Match each mark to what it tells you.\", \"pairs\": [[\"sof pasuk\", \"the pasuk is over\"], [\"two pashtas\", \"the first one shows the beat\"], [\"a meseg in a word\", \"hold the vowel a little\"], [\"a makaf\", \"two words are glued\"]]}, {\"q\": \"Marks 7. In vay'hi at the end, the line by its first letter is a meseg. What does it say?\", \"pic\": \"\\u05d5\\u05b7\\u05d9\\u05bc\\u05b9\\u05a5\\u05d0\\u05de\\u05b6\\u05e8 \\u05d0\\u05b1\\u05dc\\u05b9\\u05e7\\u05b4\\u0596\\u05d9\\u05dd \\u05d9\\u05b0\\u05d4\\u05b4\\u05a3\\u05d9 \\u05d0\\u0591\\u05d5\\u05b9\\u05e8 \\u05d5\\u05b7\\u05bd\\u05d9\\u05b0\\u05d4\\u05b4\\u05d9\\u05be\\u05d0\\u05bd\\u05d5\\u05b9\\u05e8\\u05c3\", \"o\": [\"hold that vowel a little and keep going\", \"stop reading here and take a breath\", \"this is the end of the whole pasuk\"]}, {\"q\": \"Marks 9. Find lamayim, the last word. The little line under it shows the beat. Where is it?\", \"pic\": \"\\u05d5\\u05b7\\u05d9\\u05bc\\u05b9\\u05a3\\u05d0\\u05de\\u05b6\\u05e8 \\u05d0\\u05b1\\u05dc\\u05b9\\u05e7\\u05b4\\u0594\\u05d9\\u05dd \\u05d9\\u05b0\\u05d4\\u05b4\\u05a5\\u05d9 \\u05e8\\u05b8\\u05e7\\u05b4\\u0596\\u05d9\\u05e2\\u05b7 \\u05d1\\u05bc\\u05b0\\u05ea\\u05a3\\u05d5\\u05b9\\u05da\\u05b0 \\u05d4\\u05b7\\u05de\\u05bc\\u05b8\\u0591\\u05d9\\u05b4\\u05dd \\u05d5\\u05b4\\u05d9\\u05d4\\u05b4\\u05a3\\u05d9 \\u05de\\u05b7\\u05d1\\u05b0\\u05d3\\u05bc\\u05b4\\u0594\\u05d9\\u05dc \\u05d1\\u05bc\\u05b5\\u05a5\\u05d9\\u05df \\u05de\\u05b7\\u0596\\u05d9\\u05b4\\u05dd \\u05dc\\u05b8\\u05de\\u05b8\\u05bd\\u05d9\\u05b4\\u05dd\\u05c3\", \"o\": [\"mil'eil, early: law-MAW-yim\", \"milra, the end: law-maw-YIM\"]}, {\"q\": \"Marks 8. A boy sees the marks and stops at every word. What should he do?\", \"pic\": \"\\u05d5\\u05b7\\u05d9\\u05bc\\u05b7\\u05a7\\u05e8\\u05b0\\u05d0 \\u05d0\\u05b1\\u05dc\\u05b9\\u05e7\\u05b4\\u059b\\u05d9\\u05dd \\u05d0\\u05b6\\u05ea\\u05be\\u05d4\\u05b8\\u05d0\\u0596\\u05d5\\u05b9\\u05e8 \\u05db\\u05bc\\u05b4\\u05d9\\u05be\\u05d8\\u0591\\u05d5\\u05b9\\u05d1 \\u05d5\\u05b7\\u05d9\\u05bc\\u05b7\\u05d1\\u05b0\\u05d3\\u05bc\\u05b5\\u05a3\\u05dc \\u05d0\\u05b1\\u05dc\\u05b9\\u05e7\\u05b4\\u0594\\u05d9\\u05dd \\u05d1\\u05bc\\u05b5\\u05a5\\u05d9\\u05df \\u05d4\\u05b8\\u05d0\\u0596\\u05d5\\u05b9\\u05e8 \\u05d5\\u05bc\\u05d1\\u05b5\\u05a5\\u05d9\\u05df \\u05d4\\u05b7\\u05d7\\u05b9\\u05bd\\u05e9\\u05c1\\u05b6\\u05da\\u05b0\\u05c3\", \"o\": [\"keep reading, word after word\", \"stop at every single mark he sees\", \"skip all the words that have marks\"]}], \"check\": [{\"q\": \"Marks Check 1. Find ha'aretz with two pashtas. Where is its beat?\", \"pic\": \"\\u05d5\\u05b7\\u05d9\\u05bc\\u05b9\\u05a3\\u05d0\\u05de\\u05b6\\u05e8 \\u05d0\\u05b1\\u05dc\\u05b9\\u05e7\\u05b4\\u0597\\u05d9\\u05dd \\u05ea\\u05bc\\u05b7\\u05bd\\u05d3\\u05b0\\u05e9\\u05c1\\u05b5\\u05a4\\u05d0 \\u05d4\\u05b8\\u05d0\\u05b8\\u0599\\u05e8\\u05b6\\u05e5\\u0599 \\u05d3\\u05bc\\u05b6\\u0597\\u05e9\\u05c1\\u05b6\\u05d0 \\u05e2\\u05b5\\u059a\\u05e9\\u05c2\\u05b6\\u05d1 \\u05de\\u05b7\\u05d6\\u05b0\\u05e8\\u05b4\\u05a3\\u05d9\\u05e2\\u05b7 \\u05d6\\u05b6\\u0594\\u05e8\\u05b7\\u05e2 \\u05e2\\u05b5\\u05a3\\u05e5 \\u05e4\\u05bc\\u05b0\\u05e8\\u05b4\\u059e\\u05d9 \\u05e2\\u05b9\\u05a4\\u05e9\\u05c2\\u05b6\\u05d4 \\u05e4\\u05bc\\u05b0\\u05e8\\u05b4\\u05d9\\u0599 \\u05dc\\u05b0\\u05de\\u05b4\\u05d9\\u05e0\\u0594\\u05d5\\u05b9 \\u05d0\\u05b2\\u05e9\\u05c1\\u05b6\\u05a5\\u05e8 \\u05d6\\u05b7\\u05e8\\u05b0\\u05e2\\u05d5\\u05b9\\u05be\\u05d1\\u0596\\u05d5\\u05b9 \\u05e2\\u05b7\\u05dc\\u05be\\u05d4\\u05b8\\u05d0\\u05b8\\u0591\\u05e8\\u05b6\\u05e5 \\u05d5\\u05b7\\u05bd\\u05d9\\u05b0\\u05d4\\u05b4\\u05d9\\u05be\\u05db\\u05b5\\u05bd\\u05df\\u05c3\", \"o\": [\"haw-AW-retz, at the first pashta\", \"haw-aw-RETZ, at the second pashta\"]}, {\"q\": \"Marks Check 2. What does a meseg in the middle of a word tell you?\", \"pic\": \"\\u05d5\\u05b7\\u05d9\\u05bc\\u05b4\\u05e7\\u05b0\\u05e8\\u05b8\\u05a7\\u05d0 \\u05d0\\u05b1\\u05dc\\u05b9\\u05e7\\u05b4\\u059b\\u05d9\\u05dd \\u05dc\\u05b8\\u05bd\\u05e8\\u05b8\\u05e7\\u05b4\\u0596\\u05d9\\u05e2\\u05b7 \\u05e9\\u05c1\\u05b8\\u05de\\u05b8\\u0591\\u05d9\\u05b4\\u05dd \\u05d5\\u05b7\\u05bd\\u05d9\\u05b0\\u05d4\\u05b4\\u05d9\\u05be\\u05e2\\u05b6\\u05a5\\u05e8\\u05b6\\u05d1 \\u05d5\\u05b7\\u05bd\\u05d9\\u05b0\\u05d4\\u05b4\\u05d9\\u05be\\u05d1\\u05b9\\u0596\\u05e7\\u05b6\\u05e8 \\u05d9\\u05a5\\u05d5\\u05b9\\u05dd \\u05e9\\u05c1\\u05b5\\u05e0\\u05b4\\u05bd\\u05d9\\u05c3\", \"o\": [\"hold that vowel a little and keep going\", \"stop here and start the word again\", \"the word is over and a new one starts\"]}, {\"q\": \"Marks Check 3. What does the little line under the LAST word of a pasuk show?\", \"pic\": \"\\u05d5\\u05b7\\u05d9\\u05bc\\u05b9\\u05a3\\u05d0\\u05de\\u05b6\\u05e8 \\u05d0\\u05b1\\u05dc\\u05b9\\u05e7\\u05b4\\u0594\\u05d9\\u05dd \\u05d9\\u05b0\\u05d4\\u05b4\\u05a5\\u05d9 \\u05e8\\u05b8\\u05e7\\u05b4\\u0596\\u05d9\\u05e2\\u05b7 \\u05d1\\u05bc\\u05b0\\u05ea\\u05a3\\u05d5\\u05b9\\u05da\\u05b0 \\u05d4\\u05b7\\u05de\\u05bc\\u05b8\\u0591\\u05d9\\u05b4\\u05dd \\u05d5\\u05b4\\u05d9\\u05d4\\u05b4\\u05a3\\u05d9 \\u05de\\u05b7\\u05d1\\u05b0\\u05d3\\u05bc\\u05b4\\u0594\\u05d9\\u05dc \\u05d1\\u05bc\\u05b5\\u05a5\\u05d9\\u05df \\u05de\\u05b7\\u0596\\u05d9\\u05b4\\u05dd \\u05dc\\u05b8\\u05de\\u05b8\\u05bd\\u05d9\\u05b4\\u05dd\\u05c3\", \"o\": [\"the beat of that word\", \"that a new parsha starts\", \"a word to skip over\"]}]}, \"LK.KRI.L04.03.a\": {\"name\": \"Kriyah 4-3: Joined Words\", \"band\": \"3-4\", \"peg\": {\"kind\": \"picture\", \"show\": \"Dash up high = one word.\", \"say\": \"Glue Words: a makaf is a little dash up high. Read the glued words as one, with one beat.\"}, \"teach\": [{\"how\": \"Opener: glued words are everywhere in the Chumash, and reading them right makes your kriyah flow. See the little dash up high between two words? That is a makaf. It glues the words together. You read them as ONE word, with ONE beat.\", \"q\": \"Glue 1. In this pasuk, kee-tov is glued by a makaf. How do you read it?\", \"pic\": \"\\u05d5\\u05b7\\u05d9\\u05bc\\u05b7\\u05a7\\u05e8\\u05b0\\u05d0 \\u05d0\\u05b1\\u05dc\\u05b9\\u05e7\\u05b4\\u059b\\u05d9\\u05dd \\u05d0\\u05b6\\u05ea\\u05be\\u05d4\\u05b8\\u05d0\\u0596\\u05d5\\u05b9\\u05e8 \\u05db\\u05bc\\u05b4\\u05d9\\u05be\\u05d8\\u0591\\u05d5\\u05b9\\u05d1 \\u05d5\\u05b7\\u05d9\\u05bc\\u05b7\\u05d1\\u05b0\\u05d3\\u05bc\\u05b5\\u05a3\\u05dc \\u05d0\\u05b1\\u05dc\\u05b9\\u05e7\\u05b4\\u0594\\u05d9\\u05dd \\u05d1\\u05bc\\u05b5\\u05a5\\u05d9\\u05df \\u05d4\\u05b8\\u05d0\\u0596\\u05d5\\u05b9\\u05e8 \\u05d5\\u05bc\\u05d1\\u05b5\\u05a5\\u05d9\\u05df \\u05d4\\u05b7\\u05d7\\u05b9\\u05bd\\u05e9\\u05c1\\u05b6\\u05da\\u05b0\\u05c3\", \"o\": [\"as one word, with one beat\", \"as two words, with a stop between\", \"only the first word\"]}, {\"how\": \"In glued words, only the LAST word has a trop mark. The first word rides along with it.\", \"q\": \"Glue 2. In kee-tov, which word has the trop mark?\", \"pic\": \"\\u05d5\\u05b7\\u05d9\\u05bc\\u05  pasuk in two halves: up to the esnachta, then on to the end.\", \"q\": \"Half 2. Put the two halves of this pasuk in order.\", \"t\": \"order\", \"tiles\": [\"\\u05d5\\u05b7\\u05d9\\u05bc\\u05b9\\u05a5\\u05d0\\u05de\\u05b6\\u05e8 \\u05d0\\u05b1\\u05dc\\u05b9\\u05e7\\u05b4\\u0596\\u05d9\\u05dd \\u05d9\\u05b0\\u05d4\\u05b4\\u05a3\\u05d9 \\u05d0\\u0591\\u05d5\\u05b9\\u05e8\", \"\\u05d5\\u05b7\\u05bd\\u05d9\\u05b0\\u05d4\\u05b4\\u05d9\\u05be\\u05d0\\u05bd\\u05d5\\u05b9\\u05e8\\u05c3\"]}, {\"how\": \"Read each half smoothly the first time: eyes a little ahead, no stopping inside the half.\", \"q\": \"Half 3. How do you read a pasuk smoothly the first time?\", \"pic\": \"\\u05d5\\u05b7\\u05d9\\u05bc\\u05b9\\u05a5\\u05d0\\u05de\\u05b6\\u05e8 \\u05d0\\u05b1\\u05dc\\u05b9\\u05e7\\u05b4\\u0596\\u05d9\\u05dd \\u05d9\\u05b0\\u05d4\\u05b4\\u05a3\\u05d9 \\u05d0\\u0591\\u05d5\\u05b9\\u05e8 \\u05d5\\u05b7\\u05bd\\u05d9\\u05b0\\u05d4\\u05b4\\u05d9\\u05be\\u05d0\\u05bd\\u05d5\\u05b9\\u05e8\\u05c3\", \"o\": [\"half by half, resting at the esnachta\", \"word by word, stopping after each one\", \"as fast as you can, with no rests\"]}], \"we\": [{\"q\": \"Together 1. Which word has the esnachta in this pasuk?\", \"pic\": \"\\u05d5\\u05bc\\u05bd\\u05d6\\u05b0\\u05d4\\u05b7\\u059b\\u05d1 \\u05d4\\u05b8\\u05d0\\u05b8\\u05a5\\u05e8\\u05b6\\u05e5 \\u05d4\\u05b7\\u05d4\\u05b4\\u0596\\u05d5\\u05d0 \\u05d8\\u0591\\u05d5\\u05b9\\u05d1 \\u05e9\\u05c1\\u05b8\\u05a5\\u05dd \\u05d4\\u05b7\\u05d1\\u05bc\\u05b0\\u05d3\\u05b9\\u0596\\u05dc\\u05b7\\u05d7 \\u05d5\\u05b0\\u05d0\\u05b6\\u05a5\\u05d1\\u05b6\\u05df \\u05d4\\u05b7\\u05e9\\u05c1\\u05bc\\u05b9\\u05bd\\u05d4\\u05b7\\u05dd\\u05c3\", \"o\": [\"\\u05d8\\u0591\\u05d5\\u05b9\\u05d1\", \"\\u05d4\\u05b7\\u05d4\\u05b4\\u0596\\u05d5\\u05d0\", \"\\u05d4\\u05b8\\u05d0\\u05b8\\u05a5\\u05e8\\u05b6\\u05e5\"], \"steps\": [\"Look under the words for a little tent.\", \"It is near the middle of the pasuk.\", \"Check each choice for the tent.\"]}, {\"q\": \"Together 2. A boy stops after every word of this pasuk. What should he change?\", \"pic\": \"\\u05d5\\u05b7\\u05d9\\u05bc\\u05b4\\u05e7\\u05b0\\u05e8\\u05b8\\u05a7\\u05d0 \\u05d0\\u05b1\\u05dc\\u05b9\\u05e7\\u05b4\\u059b\\u05d9\\u05dd \\u05dc\\u05b8\\u05bd\\u05e8\\u05b8\\u05e7\\u05b4\\u0596\\u05d9\\u05e2\\u05b7 \\u05e9\\u05c1\\u05b8\\u05de\\u05b8\\u0591\\u05d9\\u05b4\\u05dd \\u05d5\\u05b7\\u05bd\\u05d9\\u05b0\\u05d4\\u05b4\\u05d9\\u05be\\u05e2\\u05b6\\u05a5\\u05e8\\u05b6\\u05d1 \\u05d5\\u05b7\\u05bd\\u05d9\\u05b0\\u05d4\\u05b4\\u05d9\\u05be\\u05d1\\u05b9\\u0596\\u05e7\\u05b6\\u05e8 \\u05d9\\u05a5\\u05d5\\u05b9\\u05dd \\u05e9\\u05c1\\u05b5\\u05e0\\u05b4\\u05bd\\u05d9\\u05c3\", \"o\": [\"read smoothly to the tent, rest, then on\", \"stop after every two words he reads\", \"read only the first half of the pasuk\"], \"steps\": [\"Find the esnachta, the little tent.\", \"Read up to it without stopping.\", \"Rest there, then read on to the end.\"]}], \"practice\": [{\"q\": \"Half 4. Which word has the esnachta?\", \"pic\": \"\\u05d5\\u05b7\\u05d9\\u05bc\\u05b7\\u05a7\\u05e8\\u05b0\\u05d0 \\u05d0\\u05b1\\u05dc\\u05b9\\u05e7\\u05b4\\u059b\\u05d9\\u05dd \\u05d0\\u05b6\\u05ea\\u05be\\u05d4\\u05b8\\u05d0\\u0596\\u05d5\\u05b9\\u05e8 \\u05db\\u05bc\\u05b4\\u05d9\\u05be\\u05d8\\u0591\\u05d5\\u05b9\\u05d1 \\u05d5\\u05b7\\u05d9\\u05bc\\u05b7\\u05d1\\u05b0\\u05d3\\u05bc\\u05b5\\u05a3\\u05dc \\u05d0\\u05b1\\u05dc\\u05b9\\u05e7\\u05b4\\u0594\\u05d9\\u05dd \\u05d1\\u05bc\\u05b5\\u05a5\\u05d9\\u05df \\u05d4\\u05b8\\u05d0\\u0596\\u05d5\\u05b9\\u05e8 \\u05d5\\u05bc\\u05d1\\u05b5\\u05a5\\u05d9\\u05df \\u05d4\\u05b7\\u05d7\\u05b9\\u05bd\\u05e9\\u05c1\\u05b6\\u05da\\u05b0\\u05c3\", \"o\": [\"\\u05db\\u05bc\\u05b4\\u05d9\\u05be\\u05d8\\u0591\\u05d5\\u05b9\\u05d1\", \"\\u05d0\\u05b6\\u05ea\\u05be\\u05d4\\u05b8\\u05d0\\u0596\\u05d5\\u05b9\\u05e8\", \"\\u05d5\\u05b7\\u05d9\\u05bc\\u05b7\\u05d1\\u05b0\\u05d3\\u05bc\\u05b5\\u05a3\\u05dc\"], \"h\": \"Look under the words for a little tent.\"}, {\"q\": \ \\u0591\\u05d9\\u05b4\\u05dd\", \"\\u05d5\\u05b7\\u05bd\\u05d9\\u05b0\\u05d4\\u05b4\\u05d9\\u05be\\u05e2\\u05b6\\u05a5\\u05e8\\u05b6\\u05d1 \\u05d5\\u05b7\\u05bd\\u05d9\\u05b0\\u05d4\\u05b4\\u05d9\\u05be\\u05d1\\u05b9\\u0596\\u05e7\\u05b6\\u05e8 \\u05d9\\u05a5\\u05d5\\u05b9\\u05dd \\u05e9\\u05c1\\u05b5\\u05e0\\u05b4\\u05bd\\u05d9\\u05c3\"]}, {\"q\": \"Half Check 3. Where may you rest when you read a pasuk smoothly?\", \"pic\": \"\\u05d5\\u05bc\\u05bd\\u05d6\\u05b0\\u05d4\\u05b7\\u059b\\u05d1 \\u05d4\\u05b8\\u05d0\\u05b8\\u05a5\\u05e8\\u05b6\\u05e5 \\u05d4\\u05b7\\u05d4\\u05b4\\u0596\\u05d5\\u05d0 \\u05d8\\u0591\\u05d5\\u05b9\\u05d1 \\u05e9\\u05c1\\u05b8\\u05a5\\u05dd \\u05d4\\u05b7\\u05d1\\u05bc\\u05b0\\u05d3\\u05b9\\u0596\\u05dc\\u05b7\\u05d7 \\u05d5\\u05b0\\u05d0\\u05b6\\u05a5\\u05d1\\u05b6\\u05df \\u05d4\\u05b7\\u05e9\\u05c1\\u05bc\\u05b9\\u05bd\\u05d4\\u05b7\\u05dd\\u05c3\", \"o\": [\"at the esnachta and at the sof pasuk\", \"after every single word you read\", \"in the middle of glued words\"]}]}, \"LK.KRI.L04.05.a\": {\"name\": \"Kriyah 4-5: Steady Pace\", \"band\": \"3-4\", \"peg\": {\"kind\": \"picture\", \"show\": \"Kings rest. Servants go.\", \"say\": \"Kings and Servants: a king mark says rest a tiny bit; a servant mark leads you on. Keep your rebbe's pace.\"}, \"teach\": [{\"how\": \"Opener: a steady pace makes the pasuk easy to follow for you and for everyone listening. Trop marks are kings and servants. A king, like tipcha or esnachta, says: rest a tiny bit. A servant, like mercha or munach, says: keep going to the next word.\", \"q\": \"Pace 1. Find boker. Its mark is a tipcha. King or servant?\", \"pic\": \"\\u05d5\\u05b7\\u05d9\\u05bc\\u05b4\\u05e7\\u05b0\\u05e8\\u05b8\\u05a8\\u05d0 \\u05d0\\u05b1\\u05dc\\u05b9\\u05e7\\u05b4\\u05a4\\u05d9\\u05dd \\u05c0 \\u05dc\\u05b8\\u05d0\\u05d5\\u05b9\\u05e8\\u0599 \\u05d9\\u0594\\u05d5\\u05b9\\u05dd \\u05d5\\u05b0\\u05dc\\u05b7\\u05d7\\u05b9\\u0596\\u05e9\\u05c1\\u05b6\\u05da\\u05b0 \\u05e7\\u05b8\\u05a3\\u05e8\\u05b8\\u05d0 \\u05dc\\u05b8\\u0591\\u05d9\\u05b0\\u05dc\\u05b8\\u05d4 \\u05d5\\u05b7\\u05bd\\u05d9\\u05b0\\u05d4\\u05b4\\u05d9\\u05be\\u05e2\\u05b6\\u05a5\\u05e8\\u05b6\\u05d1 \\u05d5\\u05b7\\u05bd\\u05d9\\u05b0\\u05d4\\u05b4\\u05d9\\u05be\\u05d1\\u05b9\\u0596\\u05e7\\u05b6\\u05e8 \\u05d9\\u05a5\\u05d5\\u05b9\\u05dd \\u05d0\\u05b6\\u05d7\\u05b8\\u05bd\\u05d3\\u05c3\", \"o\": [\"a king: rest a bit\", \"a servant: keep going\"]}, {\"how\": \"Mercha is a servant. It hurries you on to the next word, its king.\", \"q\": \"Pace 2. Find erev. Its mark is a mercha. King or servant?\", \"pic\": \"\\u05d5\\u05b7\\u05d9\\u05bc\\u05b4\\u05e7\\u05b0\\u05e8\\u05b8\\u05a8\\u05d0 \\u05d0\\u05b1\\u05dc\\u05b9\\u05e7\\u05b4\\u05a4\\u05d9\\u05dd \\u05c0 \\u05dc\\u05b8\\u05d0\\u05d5\\u05b9\\u05e8\\u0599 \\u05d9\\u0594\\u05d5\\u05b9\\u05dd \\u05d5\\u05b0\\u05dc\\u05b7\\u05d7\\u05b9\\u0596\\u05e9\\u05c1\\u05b6\\u05da\\u05b0 \\u05e7\\u05b8\\u05a3\\u05e8\\u05b8\\u05d0 \\u05dc\\u05b8\\u0591\\u05d9\\u05b0\\u05dc\\u05b8\\u05d4 \\u05d5\\u05b7\\u05bd\\u05d9\\u05b0\\u05d4\\u05b4\\u05d9\\u05be\\u05e2\\u05b6\\u05a5\\u05e8\\u05b6\\u05d1 \\u05d5\\u05b7\\u05bd\\u05d9\\u05b0\\u05d4\\u05b4\\u05d9\\u05be\\u05d1\\u05b9\\u0596\\u05e7\\u05b6\\u05e8 \\u05d9\\u05a5\\u05d5\\u05b9\\u05dd \\u05d0\\u05b6\\u05d7\\u05b8\\u05bd\\u05d3\\u05c3\", \"o\": [\"a servant: keep going\", \"a king: rest a bit\"]}, {\"how\": \"Your rebbe sets the pace. Read at his pace: not racing, not crawling. Your rebbe listens to you read a new perek and marks this skill himself. The app helps you practice.\", \"q\": \"Pace 3. Who sets the pace for reading a new perek?\", \"o\": [\"my rebbe\", \"the fastest boy\", \"no one\"]}], \"we\": [{\"q\": \"Together 1. Find vayomer, the first word. Its mark is a mercha. Keep going or rest?\", \"pic\": \"\\u05d5\\u05b7\\u05d9\\u05bc\\u05b9\\u05a5\\u05d0\\u05de\\u05b6\\u05e8 \\u05d0\\u05b1\\u05dc\\u05b9\\u05e7\\u05b4\\u0596\\u05d9\\u05dd \\u05d9\\u05b0\\u05d4\\u05b4\\u05a3\\u05d9 \\u05d0\\u0591\\u05d5\\u05b9\\u05e8 \\u05d5\\u05b7\\u05bd\\u05d9\\u05b0\\u05d4\\u05b4\\u05d9\\u05be\\u05d0\\u05bd\\u05d5\\u05b9\\u05e8\\u05c3\", \"o\": [\"keep going\", \"rest a tiny bit\"], \"steps\": [\"Mercha is a servant.\", \"A servant leads you on to the next word.\", \"So after vayomer, do you rest?\"]}, {\"q\": \"Together 2. Find or, with the esnachta. Keep going or rest?\", \"pic\": \"\\u05d5\\u05b7\\u05d9\\u05bc\\u05b9\\u05a5\\u05d0\\u05de\\u05b6\\u05e8 \\u05d0\\u05b1\\u05dc\\u05b9\\u05e7\\u05b4\\u0596\\u05d9\\u05dd \\u05d9\\u05b0\\u05d4\\u05b4\\u05a3\\u05d9 \\u05d0\\u0591\\u05d5\\u05b9\\u05e8 \\u05d5\\u05b7\\u05bd\\u05d9\\u05b0\\u05d4\\u05b4\\u05d9\\u05be\\u05d0\\u05bd\\u05d5\\u05b9\\u05e8\\u05c3\", \"o\": [\"rest a tiny bit\", \"keep going to the next word\"], \"steps\": [\"Esnachta is the little tent.\", \"It is the biggest king in the middle.\", \"Kings say: rest a tiny bit.\"]}], \"practice\": [{\"t\": \"sort\", \"q\": \"Pace 4. Sort each mark: a king or a servant?\", \"bins\": [{\"id\": \"K\", \"label\": \"a king: rest a tiny bit\"}, {\"id\": \"S\", \"label\": \"a servant: keep going\"}], \"items\": [{\"label\": \"esnachta\", \"bin\": \"K\"}, {\"label\": \"tipcha\", \"bin\": \"K\"}, {\"label\": \"zakef katon\", \"bin\": \"K\"}, {\"label\": \"mercha\", \"bin\": \"S\"}, {\"label\": \"munach\", \"bin\": \"S\"}]}, {\"q\": \"Pace 5. Your rebbe reads at a steady pace, and you are faster. What do you do?\", \"o\": [\"slow down to match my rebbe\", \"keep racing far ahead of him\", \"stop reading and wait\"]}, {\"t\": \"pairs\", \"q\": \"Pace 6. Match each mark to how it looks.\", \"pairs\": [[\"esnachta\", \"a little tent under a word\"], [\"zakef katon\", \"two dots up high\"], [\"sof pasuk\", \"two dots like a colon\"], [\"makaf\", \"a little dash up high\"]]}, {\"q\": \"Pace 7. Find yom near the end. Its mark is a mercha. What do you do after yom?\", \"pic\": \"\\u05d5\\u05b7\\u05d9\\u05bc\\u05b4\\u05e7\\u05b0\\u05e8\\u05b8\\u05a8\\u05d0 \\u05d0\\u05b1\\u05dc\\u05b9\\u05e7\\u05b4\\u05a4\\u05d9\\u05dd \\u05c0 \\u05dc\\u05b8\\u05d0\\u05d5\\u05b9\\u05e8\\u0599 \\u05d9\\u0594\\u05d5\\u05b9\\u05dd \\u05d5\\u05b0\\u05dc\\u05b7\\u05d7\\u05b9\\u0596\\u05e9\\u05c1\\u05b6\\u05da\\u05b0 \\u05e7\\u05b8\\u05a3\\u05e8\\u05b8\\u05d0 \\u05dc\\u05b8\\u0591\\u05d9\\u05b0\\u05dc\\u05b8\\u05d4 \\u05d5\\u05b7\\u05bd\\u05d9\\u05b0\\u05d4\\u05b4\\u05d9\\u05be\\u05e2\\u05b6\\u05a5\\u05e8\\u05b6\\u05d1 \\u05d5\\u05b7\\u05bd\\u05d9\\u05b0\\u05d4\\u05b4\\u05d9\\u05be\\u05d1\\u05b9\\u0596\\u05e7\\u05b6\\u05e8 \\u05d9\\u05a5\\u05d5\\u05b9\\u05dd \\u05d0\\u05b6\\u05d7\\u05b8\\u05bd\\u05d3\\u05c3\", \"o\": [\"keep going right into echad\", \"stop for a long, long time\", \"go back to the start of the pasuk\"]}, {\"q\": \"Pace 8. Which of these marks is a king?\", \"o\": [\"tipcha\", \"mercha\", \"munach\"]}, {\"q\": \"Pace 9. Which of these marks is a servant?\", \"o\": [\"mercha\", \"esnachta\", \"zakef katon\"]}], \"check\": [{\"q\": \"Pace Check 1. Find Elokim in this pasuk. Its mark is a tipcha. Keep going or rest?\", \"pic\": \"\\u05d5\\u05b7\\u05d9\\u05bc\\u05b9\\u05a5\\u05d0\\u05de\\u05b6\\u05e8 \\u05d0\\u05b1\\u05dc\\u05b9\\u05e7\\u05b4\\u0596\\u05d9\\u05dd \\u05d9\\u05b0\\u05d4\\u05b4\\u05a3\\u05d9 \\u05d0\\u0591\\u05d5\\u05b9\\u05e8 \\u05d5\\u05b7\\u05bd\\u05d9\\u05b0\\u05d4\\u05b4\\u05d9\\u05be\\u05d0\\u05bd\\u05d5\\u05b9\\u05e8\\u05c3\", \"o\": [\"rest a tiny bit\", \"keep going to the next word\"]}, {\"q\": \"Pace Check 2. Is munach a king or a servant?\", \"o\": [\"a servant\", \"a king\"]}, {\"q\": \"Pace Check 3. Is zakef katon, two dots up high, a king or a servant?\", \"o\": [\"a king\", \"a servant\"]}]}, \"LK.KRI.L04.06.a\": {\"name\": \"Kriyah 4-6: Self-Correction\", \"band\": \"3-4\", \"peg\": {\"kind\": \"picture\", \"show\": \"Hear it. Look. Read again.\", \"say\": \"Echo Check: listen to yourself. If a word sounds wrong, look at its letters and its mark, and read it again.\"}, \"teach\": [{\"how\": \"Opener: every good ba'al koreh fixes his own mistakes; that is how reading gets strong. Good readers listen to themselves. If a word sounds wrong, they stop, look again at its letters and its mark, and read it right. That is a fix, not a failure!\", \"q\": \"Fix 1. A boy reads boker as bo-KER. What should he fix?\", \"pic\": \"\\u05d5\\u05b7\\u05d9\\u05bc\\u05b4\\u05e7\\u05b0\\u05e8\\u05b8\\u05a8\\u05d0 \\u05d0\\u05b1\\u05dc\\u05b9\\u05e7\\u05b4\\u05a4\\u05d9\\u05dd \\u05c0 \\u05dc\\u05b8\\u05d0\\u05d5\\u05b9\\u05e8\\u0599 \\u05d9\\u0594\\u05d5\\u05b9\\u05dd \\u05d5\\u05b0\\u05dc\\u05b7\\u05d7\\u05b9\\u0596\\u05e9\\u05c1\\u05b6\\u05da\\u05b0 \\u05e7\\u05b8\\u05a3\\u05e8\\u05b8\\u05d0 \\u05dc\\u05b8\\u0591\\u05d9\\u05b0\\u05dc\\u05b8\\u05d4 \\u05d5\\u05b7\\u05bd\\u05d9\\u05b0\\u05d4\\u05b4\\u05d9\\u05be\\u05e2\\u05b6\\u05a5\\u05e8\\u05b6\\u05d1 \\u05d5\\u05b7\\u05bd\\u05d9\\u05b0\\u05d4\\u05b4\\u05d9\\u05be\\u05d1\\u05b9\\u0596\\u05e7\\u05b6\\u05e8 \\u05d9\\u05a5\\u05d5\\u05b9\\u05dd \\u05d0\\u05b6\\u05d7\\u05b8\\u05bd\\u05d3\\u05c3\", \"o\": [\"the beat: BO has the mark\", \"the letters of the word\", \"nothing: skip the word and go on\"]}, {\"how\": \"When you catch a mistake, go back to the start of that word, or of the glued pair, and read it again.\", \"q\": \"Fix 2. You catch a mistake in the middle of vay'hi-erev. Where do you start again?\", \"pic\": \"\\u05d5\\u05b7\\u05d9\\u05bc\\u05b4\\u05e7\\u05b0\\u05e8\\u05b8\\u05a8\\u05d0 \\u05d0\\u05b1\\u05dc\\u05b9\\u05e7\\u05b4\\u05a4\\u05d9\\u05dd \\u05c0 \\u05dc\\u05b8\\u05d0\\u05d5\\u05b9\\u05e8\\u0599 \\u05d9\\u0594\\u05d5\\u05b9\\u05dd \\u05d5\\u05b0\\u05dc\\u05b7\\u05d7\\u05b9\\u0596\\u05e9\\u05c1\\u05b6\\u05da\\u05b0 \\u05e7\\u05b8\\u05a3\\u05e8\\u05b8\\u05d0 \\u05dc\\u05b8\\u0591\\u05d9\\u05b0\\u05dc\\u05b8\\u05d4 \\u05d5\\u05b7\\u05bd\\u05d9\\u05b0\\u05d4\\u05b4\\u05d9\\u05be\\u05e2\\u05b6\\u05a5\\u05e8\\u05b6\\u05d1 \\u05d5\\u05b7\\u05bd\\u05d9\\u05b0\\u05d4\\u05b4\\u05d9\\u05be\\u05d1\\u05b9\\u0596\\u05e7\\u05b6\\u05e8 \\u05d9\\u05a5\\u05d5\\u05b9\\u05dd \\u05d0\\u05b6\\u05d7\\u05b8\\u05bd\\u05d3\\u05c3\", \"o\": [\"at the start of vay'hi-erev\", \"at the very start of the pasuk\", \"at the word after it\"]}, {\"how\": \"Your rebbe listens to you read and marks this skill himself. The app helps you practice catching mistakes.\", \"q\": \"Fix 3. What does a good reader do after a mistake?\", \"o\": [\"fixes it and keeps going\", \"stops reading for the day\", \"pretends it did not happen at all\"]}], \"we\": [{\"q\": \"Together 1. A boy reads kee-tov with a stop between kee and tov. What should he fix?\", \"pic\": \"\\u05d5\\u05b7\\u05d9\\u05bc\\u05b7\\u05a7\\u05e8\\u05b0\\u05d0 \\u05d0\\u05b1\\u05dc\\u05b9\\u05e7\\u05b4\\u059b\\u05d9\\u05dd \\u05d0\\u05b6\\u05ea\\u05be\\u05d4\\u05b8\\u05d0\\u0596\\u05d5\\u05b9\\u05e8 \\u05db\\u05bc\\u05b4\\u05d9\\u05be\\u05d8\\u0591\\u05d5\\u05b9\\u05d1 \\u05d5\\u05b7\\u05d9\\u05bc\\u05b7\\u05d1\\u05b0\\u05d3\\u05bc\\u05b5\\u05a3\\u05dc \\u05d0\\u05b1\\u05dc\\u05b9\\u05e7\\u05b4\\u0594\\u05d9\\u05dd \\u05d1\\u05bc\\u05b5\\u05a5\\u05d9\\u05df \\u05d4\\u05b8\\u05d0\\u0596\\u05d5\\u05b9\\u05e8 \\u05d5\\u05bc\\u05d1\\u05b5\\u05a5\\u05d9\\u05df \\u05d4\\u05b7\\u05d7\\u05b9\\u05bd\\u05e9\\u05c1\\u05b6\\u05da\\u05b0\\u05c3\", \"o\": [\"read kee-tov as one word\", \"read every word much louder\", \"skip kee and read only tov\"], \"steps\": [\"Find kee-tov in the pasuk.\", \"See the little dash up high between them?\", \"A makaf glues them: how do you read glued words?\"]}, {\"q\": \"Together 2. You hear yourself make a mistake. What comes first?\", \"o\": [\"stop and look at the word\", \"keep going without fixing it\", \"start the whole perek again\"], \"steps\": [\"You heard it: something sounded wrong.\", \"Before you fix it, you need to see it.\", \"Where do your eyes go?\"]}], \"practice\": [{\"q\": \"Fix 4. A boy reads vayomer as va-yo-MER. What should he fix?\", \"pic\": \"\\u05d5\\u05b7\\u05d9\\u05bc\\u05b9\\u05a5\\u05d0\\u05de\\u05b6\\u05e8 \\u05d0\\u05b1\\u05dc\\u05b9 .kricard{margin:14px 0;border-radius:24px;background:linear-gradient(135deg,#FFF6D8,#E8F6FF);border:3px solid #FFC83D;display:flex;align-items:center;gap:16px;padding:16px 20px;color:#1F2A44;box-shadow:0 6px 0 #EADFB8}
.kricard .ki{font-size:46px}.kricard .kt{flex:1}.kricard b{display:block;font-size:24px}.kricard small{font-size:16px;opacity:.85}
.kricard button{border:0;border-radius:18px;padding:14px 24px;font:inherit;font-weight:900;font-size:22px;background:#2FBF71;color:#fff;cursor:pointer;min-height:60px;box-shadow:0 5px 0 #1f8a51}
.kkov2{position:fixed;inset:0;z-index:2147483000;background:#FFF6D8;display:flex;flex-direction:column}
.kkov2 .kkbar{display:flex;justify-content:flex-end;padding:6px 10px;background:#FFF6D8}
.kkov2 .kkx{border:0;border-radius:14px;padding:10px 18px;font:inherit;font-weight:900;font-size:18px;background:#1F2A44;color:#fff;cursor:pointer;min-height:48px}
.kkov2 iframe{flex:1;width:100%;border:0;background:#E8F6FF}`; document.head.appendChild(s); } }catch(e){}
const _find=window.tlFindLevelCard;
window.tlFindLevelCard=function(st){ let h=''; try{ h=_find?_find(st):''; }catch(e){}
  try{ me(); if(st&&A.view==='hub'&&on(st)){ const d=doneMap(st), n=Object.keys(d).length;
    h+='<section class="kricard" data-kricard="1"><span class="ki" aria-hidden="true">🔤</span><span class="kt"><b>Kriyah</b><small>47 lessons: the Aleph-Beis, the nekudos, blending, Kriyah 3 and Kriyah 4.'+(n?' You finished '+n+' of 47.':'')+'</small></span><button type="button" data-kk2="open">Play</button></section>'; } }catch(e){}
  return h; };
function open(id){ close(true); const st=A&&A.st; const ov=document.createElement('div'); ov.className='kkov2'; ov.id='kkov2';
  ov.innerHTML='<div class="kkbar"><button class="kkx" type="button" data-kk2="close" aria-label="Close Kriyah">✕ Done</button></div><iframe title="Kriyah" sandbox="allow-scripts" allow="autoplay"></iframe>';
  document.body.appendChild(ov);
  const pre='\u003cscript>window.KL_DONE='+JSON.stringify(doneMap(st))+';window.KL_OPEN='+JSON.stringify(IDS.indexOf(id)>=0?id:'')+';'+(window.KL_FAST?'window.KL_FAST=1;':'')+'\u003c/scr'+'ipt>';
  ov.querySelector('iframe').srcdoc=pre+PAGE; }
function close(quiet){ const o=document.getElementById('kkov2'); if(o) o.remove(); if(quiet) return; try{ if(qT){ clearTimeout(qT); qT=null; if(A.st&&typeof saveStudent==='function') saveStudent(A.st); } }catch(e){} try{ if(A.view==='hub') render(); }catch(e){} }
document.addEventListener('click',e=>{ const b=e.target&&e.target.closest&&e.target.closest('[data-kk2]'); if(!b) return; const k=b.getAttribute('data-kk2'); if(k==='open'){ e.preventDefault(); open(''); } else if(k==='close'){ e.preventDefault(); close(); } });
window.addEventListener('message',e=>{ try{ const d=e.data; if(!d||typeof d!=='object'||(d.tlK!==1&&d.tlKDone!==1)) return;
  const f=document.querySelector('#kkov2 iframe'); if(!f||e.source!==f.contentWindow) return;
  if(typeof A==='undefined'||!A.st||typeof saveStudent!=='function'||typeof SRV==='undefined') return;
  const skill=String(d.skill||''); if(IDS.indexOf(skill)<0) return;
  if(d.tlK===1){ const item=String(d.item||'').replace(/[^A-Za-z0-9 ()-]/g,'').slice(0,60)||'item', ph=d.phase==='check'?'check':'practice', first=!!d.first;
    SRV.pendingEv.push({at:Date.now(),student:A.st.id,skill:'KLESSON.'+skill,phase:ph,item:item,first:first,tries:first?1:2,hints:0,ms:0,ok:true});
    if(SRV.pendingEv.length>50) SRV.pendingEv.splice(0,SRV.pendingEv.length-50); }
  else { const ok=Math.max(0,Math.min(3,Math.round(Number(d.ok)||0))); const st=A.st; if(!st.klk||typeof st.klk!=='object') st.klk={}; st.klk[skill]=Math.max(Number(st.klk[skill])||0,ok); }
  clearTimeout(qT); qT=setTimeout(()=>{ qT=null; try{ saveStudent(A.st); }catch(x){} },2500);
}catch(err){ console.error('K kriyah',err); } });
window.KK={ has:id=>IDS.indexOf(String(id))>=0, open:id=>open(String(id||'')), list:()=>LIST.slice(), on:()=>{ try{ return on(A.st); }catch(e){ return false; } } };
})();
</script>
