ubutz',true).t,90)+'\u003c/div\u003e'); await say('Kubutz under the letter, or Shuruk after it. Both say \"oo.\"'); }\n    const w=LOOKALIKE[v]; if(w&&VO.indexOf(w)\u003ci){ await M('\u003cdiv class=\"row\" dir=\"rtl\"\u003e'+HE(syl('beis',v).t,90)+HE(syl('beis',w).t,90)+'\u003c/div\u003e'); await say('Careful! '+V[1]+' is '+V[3]+'. '+VK[w][1]+' is '+VK[w][3]+'. Tap to go on.'); await tapGo('.row span'); } },\n  together:[['nkTap',{v}],['nkSays',{v}],['nkBuild',{v}]],\n  practice:kind.slice(0,5).map(k=\u003e[k,{v}]).concat([['nkSays',{v}],['nkRow',{v}],[kind[kind.length-1],{v}]]),\n  real:['nkSpot',{v,intro:'Davening time! Find the '+V[1]+' in the siddur line.'}],\n  check:[['nkSays',{v}],['nkSound',{v}],['nkSpot',{v}]]}; }\nconst L=VO.map(mkKri);\n\n/* KM2 = the app's KriyahMore L02 lessons (source text, reused, not retyped) */\nconst KM2={\"LK.KRI.L02.01.a\": {\"name\": \"Nekudos 5: Sheva\", \"teach\": [{\"how\": \"Sheva is two dots under the letter, one on top of the other. At the start of a word, Sheva gives the letter a very quick little sound: Sheva Beis, b'. In the middle of a word, Sheva is usually quiet, and it closes the sound before it. In many siddurim, a Sheva that is said out loud has a small line on top of the letter to help you.\", \"q\": \"This is a Sheva. Tap the letter with a Sheva under it.\", \"pic\": \"\\u05d1\\u05b0\\u05bc\", \"o\": [\"\\u05d1\\u05b0\\u05bc\", \"\\u05d1\\u05b5\\u05bc\", \"\\u05d1\\u05b6\\u05bc\"], \"re\": [\"Stand two dots up, one on top of the other. That is Sheva.\", \"Lay the two dots down side by side. That is Tzeirei.\", \"Sheva has two dots. Segol has three.\"]}, {\"how\": \"Do not mix up the dots. Sheva: two dots, one on top of the other. Tzeirei: two dots side by side. Segol: three dots.\", \"q\": \"Which one has a Sheva, two dots one on top of the other?\", \"o\": [\"\\u05de\\u05b0\", \"\\u05de\\u05b5\", \"\\u05de\\u05b6\"], \"re\": [\"Stand two dots up, one on top of the other. That is Sheva.\", \"Lay the two dots down side by side. That is Tzeirei.\", \"Sheva has two dots. Segol has three.\"]}, {\"how\": \"A Sheva can sit under any letter. Look for the two dots standing one on top of the other.\", \"q\": \"Which one has a Sheva under the Lamed?\", \"o\": [\"\\u05dc\\u05b0\", \"\\u05dc\\u05b5\", \"\\u05dc\\u05b6\"], \"re\": [\"Stand two dots up, one on top of the other. That is Sheva.\", \"Lay the two dots down side by side. That is Tzeirei.\", \"Sheva has two dots. Segol has three.\"]}], \"practice\": [{\"q\": \"Find the Sheva under the Nun.\", \"o\": [\"\\u05e0\\u05b0\", \"\\u05e0\\u05b5\", \"\\u05e0\\u05b6\"], \"h\": \"Sheva: two dots, one on top of the other.\", \"re\": [\"Stand two dots up, one on top of the other. That is Sheva.\", \"Lay the two dots down side by side. That is Tzeirei.\", \"Sheva has two dots. Segol has three.\"]}, {\"q\": \"Find the Sheva under the Daled.\", \"o\": [\"\\u05d3\\u05b0\", \"\\u05d3\\u05b5\", \"\\u05d3\\u05b7\"], \"h\": \"Look for two dots standing up, one over the other.\", \"re\": [\"Stand two dots up, one on top of the other. That is Sheva.\", \"Lay the two dots down side by side. That is Tzeirei.\", \"Sheva has two dots. Segol has three.\"]}, {\"q\": \"Which one has a Tzeirei, not a Sheva?\", \"o\": [\"\\u05d2\\u05b5\", \"\\u05d2\\u05b0\", \"\\u05d2\\u05b6\"], \"h\": \"Tzeirei has two dots lying side by side.\", \"re\": [\"Stand two dots up, one on top of the other. That is Sheva.\", \"Lay the two dots down side by side. That is Tzeirei.\", \"Sheva has two dots. Segol has three.\"]}, {\"q\": \"Which one has a Segol, not a Sheva?\", \"o\": [\"\\u05e8\\u05b6\", \"\\u05e8\\u05b0\", \"\\u05e8\\u05b5\"], \"h\": \"Segol has three dots.\", \"re\": [\"Stand two dots up, one on top of the other. That is Sheva.\", \"Lay the two dots down side by side. That is Tzeirei.\", \"Sheva has two dots. Segol has three.\"]}, {\"q\": \"Find the Sheva under the Shin.\", \"o\": [\"\\u05e9\\u05b0\\u05c1\", \"\\u05e9\\u05b5\\u05c1\", \"\\u05e9\\u05b6\\u05c1\"], \"h\": \"Two dots, one on top of the other.\", \"re\": [\"Stand two dots up, one on top of the other. That is Sheva.\", \"Lay the two dots down side by side. That is Tzeirei.\", \"Sheva has two dots. Segol has three.\"]}, {\"q\": \"Find the Sheva under the Kaf.\", \"o\": [\"\\u05db\\u05b0\\u05bc\", \"\\u05db\\u05b6\\u05bc\", \"\\u05db\\u05b5\\u05bc\"], \"h\": \"Two dots, one on top of the other.\", \"re\": [\"Stand two dots up, one on top of the other. That is Sheva.\", \"Lay the two dots down side by side. That is Tzeirei.\", \"Sheva has two dots. Segol has three.\"]}], \"check\": [{\"q\": \"Find the Sheva under the Mem.\", \"o\": [\"\\u05de\\u05b0\", \"\\u05de\\u05b6\", \"\\u05de\\u05b5\"], \"re\": [\"Stand two dots up, one on top of the other. That is Sheva.\", \"Lay the two dots down side by side. That is Tzeirei.\", \"Sheva has two dots. Segol has three.\"]}, {\"q\": \"Find the Sheva under the Tav.\", \"o\": [\"\\u05ea\\u05b0\\u05bc\", \"\\u05ea\\u05b5\\u05bc\", \"\\u05ea\\u05b6\\u05bc\"], \"re\": [\"Stand two dots up, one on top of the other. That is Sheva.\", \"Lay the two dots down side by side. That is Tzeirei.\", \"Sheva has two dots. Segol has three.\"]}, {\"q\": \"Which one has a Tzeirei, two dots side by side, and not a Sheva?\", \"o\": [\"\\u05dc\\u05b5\", \"\\u05dc\\u05b0\", \"\\u05dc\\u05b6\"], \"re\": [\"Stand two dots up, one on top of the other. That is Sheva.\", \"Lay the two dots down side by side. That is Tzeirei.\", \"Sheva has two dots. Segol has three.\"]}], \"re\": [\"Stand two dots up, one on top of the other. That is Sheva.\", \"Lay the two dots down side by side. That is Tzeirei.\", \"Sheva has two dots. Segol has three.\"]}, \"LK.KRI.L02.04.a\": {\"name\": \"Nekudos 9: The Chatafim, and Review\", \"teach\": [{\"how\": \"A Chataf is a nekudah with a Sheva right next to it, and it says its sound quickly. Chataf Patach is a Patach with a Sheva beside it: a quick \\\"ah.\\\" Chataf Segol is a Segol with a Sheva beside it: a quick \\\"eh.\\\" Chataf Kometz is a Kometz with a Sheva beside it: a quick \\\"aw.\\\" They usually come under Aleph, Hei, Ches and Ayin.\", \"q\": \"Which one has a Chataf Patach, a Patach with a Sheva beside it?\", \"pic\": \"\\u05d7\\u05b2\", \"o\": [\"\\u05d7\\u05b2\", \"\\u05d7\\u05b7\", \"\\u05d7\\u05b1\"], \"re\": [\"A Chataf always has the two Sheva dots next to it. Look for them.\", \"Lines: Kometz and Patach. One dot: Chirik under, Cholam on top.\", \"Two dots side by side: Tzeirei. Three dots: Segol or Kubutz.\"]}, {\"how\": \"Chataf Segol: three dots of Segol, with the two dots of Sheva beside them.\", \"q\": \"Which one has a Chataf Segol?\", \"o\": [\"\\u05d0\\u05b1\", \"\\u05d0\\u05b6\", \"\\u05d0\\u05b2\"], \"re\": [\"A Chataf always has the two Sheva dots next to it. Look for them.\", \"Lines: Kometz and Patach. One dot: Chirik under, Cholam on top.\", \"Two dots side by side: Tzeirei. Three dots: Segol or Kubutz.\"]}, {\"how\": \"Now you know the nekudos. For every one, ask two things: where is it, on top or under, and what shape is it: a line, dots, or a Vav?\", \"q\": \"Which one says \\\"haw\\\"?\", \"o\": [\"\\u05d4\\u05b8\", \"\\u05d4\\u05b7\", \"\\u05d4\\u05b9\"], \"re\": [\"A Chataf always has the two Sheva dots next to it. Look for them.\", \"Lines: Kometz and Patach. One dot: Chirik under, Cholam on top.\", \"Two dots side by side: Tzeirei. Three dots: Segol or Kubutz.\"]}], \"practice\": [{\"q\": \"Which one says \\\"zaw\\\"?\", \"o\": [\"\\u05d6\\u05b8\", \"\\u05d6\\u05b7\", \"\\u05d5\\u05b8\"], \"h\": \"Zayin has a crown. Kometz has a little leg: zaw.\", \"re\": [\"A Chataf always has the two Sheva dots next to it. Look for them.\", \"Lines: Kometz and Patach. One dot: Chirik under, Cholam on top.\", \"Two dots side by side: Tzeirei. Three dots: Segol or Kubutz.\"]}, {\"q\": \"Which one says \\\"yee\\\"?\", \"o\": [\"\\u05d9\\u05b4\", \"\\u05d9\\u05b5\", \"\\u05d9\\u05b6\"], \"h\": \"Yud is the smallest letter. One dot under it says yee.\", \"re\": [\"A Chataf always has the two Sheva dots next to it. Look for them.\", \"Lines: Kometz and Patach. One dot: Chirik under, Cholam on top.\", \"Two dots side by side: Tzeirei. Three dots: Segol or Kubutz.\"]}, {\"q\": \"Which one says \\\"koh\\\"?\", \"o\": [\"\\u05e7\\u05d5\\u05b9\", \"\\u05e7\\u05b8\", \"\\u05e7\\u05d5\\u05bc\"], \"h\": \"Kuf has a leg that drops down. A Vav with a dot on its head says \\\"oh.\\\"\", \"re\": [\"A Chataf always has the two Sheva dots next to it. Look for them.\", \"Lines: Kometz and Patach. One dot: Chirik under, Cholam on top.\", \"Two dots side by side: Tzeirei. Three dots: Segol or Kubutz.\"]}, {\"q\": \"Which one says \\\"tah\\\"?\", \"o\": [\"\\u05d8\\u05b7\", \"\\u05d8\\u05b8\", \"\\u05d7\\u05b7\"], \"h\": \"Tes is round like a basket. The flat line, Patach, says \\\"ah.\\\"\", \"re\": [\"A Chataf always has the two Sheva dots next to it. Look for them.\", \"Lines: Kometz and Patach. One dot: Chirik under, Cholam on top.\", \"Two dots side by side: Tzeirei. Three dots: Segol or Kubutz.\"]}, {\"q\": \"Which one has a Chataf Kometz, a Kometz with a Sheva beside it?\", \"o\": [\"\\u05d7\\u05b3\", \"\\u05d7\\u05b8\", \"\\u05d7\\u05b2\"], \"h\": \"Look for the little T of Kometz with the two Sheva dots next to it.\", \"re\": [\"A Chataf always has the two Sheva dots next to it. Look for them.\", \"Lines: Kometz and Patach. One dot: Chirik under, Cholam on top.\", \"Two dots side by side: Tzeirei. Three dots: Segol or Kubutz.\"]}, {\"q\": \"Which one says \\\"yoo\\\"?\", \"o\": [\"\\u05d9\\u05d5\\u05bc\", \"\\u05d9\\u05d5\\u05b9\", \"\\u05d9\\u05b4\"], \"h\": \"A Vav with a dot in its middle says \\\"oo.\\\"\", \"re\": [\"A Chataf always has the two Sheva dots next to it. Look for them.\", \"Lines: Kometz and Patach. One dot: Chirik under, Cholam on top.\", \"Two dots side by side: Tzeirei. Three dots: Segol or Kubutz.\"]}], \"check\": [{\"q\": \"Which one says \\\"kee\\\"?\", \"o\": [\"\\u05e7\\u05b4\", \"\\u05e7\\u05b5\", \"\\u05e7\\u05b8\"], \"re\": [\"A Chataf always has the two Sheva dots next to it. Look for them.\", \"Lines: Kometz and Patach. One dot: Chirik under, Cholam on top.\", \"Two dots side by side: Tzeirei. Three dots: Segol or Kubutz.\"]}, {\"q\": \"Which one says \\\"zeh\\\"?\", \"o\": [\"\\u05d6\\u05b6\", \"\\u05d6\\u05b5\", \"\\u05d6\\u05b7\"], \"re\": [\"A Chataf always has the two Sheva dots next to it. Look for them.\", \"Lines: Kometz and Patach. One dot: Chirik under, Cholam on top.\", \"Two dots side by side: Tzeirei. Three dots: Segol or Kubutz.\"]}, {\"q\": \"Which one says \\\"yaw\\\"?\", \"o\": [\"\\u05d9\\u05b8\", \"\\u05d9\\u05b7\", \"\\u05d9\\u05b9\"], \"re\": [\"A Chataf always has the two Sheva dots next to it. Look for them.\", \"Lines: Kometz and Patach. One dot: Chirik under, Cholam on top.\", \"Two dots side by side: Tzeirei. Three dots: Segol or Kubutz.\"]}], \"re\": [\"A Chataf always has the two Sheva dots next to it. Look for them.\", \"Lines: Kometz and Patach. One dot: Chirik under, Cholam on top.\", \"Two dots side by side: Tzeirei. Three dots: Segol or Kubutz.\"]}, \"LK.KRI.L02.02.a\": {\"name\": \"Blending 1: Closed Beats\", \"band\": \"K-2\", \"op\": \"Up to now every letter had its own nekudah. Today a letter at the END can stand with no nekudah. It closes the sound, like a door shutting: baw... s! bas.\", \"peg\": {\"kind\": \"train\", \"show\": \"Engine \\u00b7 caboose\", \"say\": \"Read like a train. The first letter with its nekudah is the engine: baw. The last letter is the caboose that closes the sound: bas.\"}, \"teach\": [{\"how\": \"Opener: Up to now every letter had its own nekudah. Today a letter at the end can stand with no nekudah. Beis with Patach says \\\"bah.\\\" Add a Tav at the end, with no dot: it closes the sound, \\\"s.\\\" Bah, s: bas. Bas means a daughter.\", \"q\": \"Which one says \\\"bas\\\"?\", \"o\": [\"\\u05d1\\u05b7\\u05bc\\u05ea\", \"\\u05d1\\u05b7\\u05bc\", \"\\u05ea\\u05b7\\u05bc\"]}, {\"how\": \"Read it in two moves. First the letter with its nekudah: Daled with Kometz, \\\"daw.\\\" Then let the last letter close it: Gimmel, \\\"g.\\\" Dawg! Dawg means a fish.\", \"q\": \"Which one says \\\"dawg\\\"?\", \"o\": [\"\\u05d3\\u05b8\\u05bc\\u05d2\", \"\\u05d2\\u05b8\\u05bc\\u05d3\", \"\\u05d3\\u05b8\\u05bc\"]}, {\"how\": \"Change only the last letter and you get a new word. Gan is a garden. Gam means also. Gal is a wave. Look at the caboose!\", \"q\": \"Which one says \\\"gam\\\"?\", \"o\": [\"\\u05d2\\u05b7\\u05bc\\u05dd\", \"\\u05d2\\u05b7\\u05bc\\u05df\", \"\\u05d2\\u05b7\\u05bc\\u05dc\"]}], \"we\": [{\"q\": \"Together: which one says \\\"layv,\\\" a heart?\", \"o\": [\"\\u05dc\\u05b5\\u05d1\", \"\\u05dc\\u05b7\\u05d1\", \"\\u05d1\\u05b5\\u05bc\\u05dc\"], \"steps\": [\"Find the Lamed with two dots side by side under it: Tzeirei, \\\"lay.\\\"\", \"The last letter is a Beis with no dot, so it is a Veis: \\\"v.\\\"\", \"Glue them: lay, v, layv.\"]}, {\"q\": \"Together: which one says \\\"nayr,\\\" a candle?\", \"o\": [\"\\u05e0\\u05b5\\u05e8\", \"\\u05e0\\u05b7\\u05e8\", \"\\u05e8\\u05b5\\u05df\"], \"steps\": [\"Nun with Tzeirei says \\\"nay.\\\"\", \"The Reish has no nekudah: it closes the sound, \\\"r.\\\"\", \"nay, r: nayr, a candle.\"]}], \"practice\": [{\"t\": \"pairs\", \"q\": \"Match each word to how it sounds.\", \"pairs\": [[\"\\u05d1\\u05b7\\u05bc\\u05ea\", \"bas\"], [\"\\u05d3\\u05b8\\u05bc\\u05d2\", \"dawg\"], [\"\\u05d9\\u05b8\\u05d3\", \"yawd\"], [\"\\u05e9\\u05b5\\u05c1\\u05dd\", \"shaym\"]], \"why\": \"Read the first letter with its nekudah, then let the last letter close the sound.\"}, {\"t\": \"spotall\", \"q\": \"Tap every word with a Patach, the flat line.\", \"cells\": [{\"label\": \"\\u05d1\\u05b7\\u05bc\\u05ea\", \"ok\": true}, {\"label\": \"\\u05d2\\u05b7\\u05bc\\u05df\", \"ok\": true}, {\"label\": \"\\u05e1\\u05b7\\u05dc\", \"ok\": true}, {\"label\": \"\\u05d3\\u05b8\\u05bc\\u05d2\", \"ok\": false}, {\"label\": \"\\u05dc\\u05b5\\u05d1\", \"ok\": false}], \"why\": \"Patach is a flat line: bas, gan, sal. Dawg has a Kometz, and layv has a Tzeirei.\"}, {\"t\": \"sort\", \"q\": \"Sort the words by their nekudah.\", \"bins\": [{\"id\": \"A\", \"label\": \"A line: ah or aw\"}, {\"id\": \"E\", \"label\": \"Two dots: ay\"}], \"items\": [{\"label\": \"\\u05d1\\u05b7\\u05bc\\u05ea\", \"bin\": \"A\"}, {\"label\": \"\\u05d3\\u05b8\\u05bc\\u05d2\", \"bin\": \"A\"}, {\"label\": \"\\u05d9\\u05b8\\u05d3\", \"bin\": \"A\"}, {\"label\": \"\\u05dc\\u05b5\\u05d1\", \"bin\": \"E\"}, {\"label\": \"\\u05e9\\u05b5\\u05c1\\u05dd\", \"bin\": \"E\"}, {\"label\": \"\\u05e2\\u05b5\\u05e5\", \"bin\": \"E\"}], \"why\": \"Lines under the letter, Patach and Kometz, say ah and aw. Two dots side by side, Tzeirei, say ay.\"}, {\"q\": \"Which one says \\\"aytz,\\\" a tree?\", \"o\": [\"\\u05e2\\u05b5\\u05e5\", \"\\u05e2\\u05b7\\u05e5\", \"\\u05e6\\u05b5\\u05d0\"], \"why\": \"Ayin with Tzeirei says \\\"ay.\\\" The final Tzadi closes it: aytz.\", \"h\": \"Ayin with Tzeirei says \\\"ay.\\\" The final Tzadi closes it: aytz.\"}, {\"t\": \"order\", \"q\": \"Read the word \\\"shaym\\\" step by step. Put the steps in order.\", \"tiles\": [\"Find the first letter: Shin\", \"Add its nekudah, Tzeirei: shay\", \"The Mem closes it: shaym\"], \"why\": \"Engine first, then its nekudah, then the caboose.\"}, {\"q\": \"Which one says \\\"min,\\\" from?\", \"o\": [\"\\u05de\\u05b4\\u05df\", \"\\u05de\\u05b7\\u05df\", \"\\u05e0\\u05b4\\u05dd\"], \"why\": \"Mem with Chirik is a quick \\\"mi.\\\" The final Nun closes it: min.\", \"h\": \"Mem with Chirik is a quick \\\"mi.\\\" The final Nun closes it: min.\"}], \"check\": [{\"q\": \"Which one says \\\"yawd,\\\" a hand?\", \"o\": [\"\\u05d9\\u05b8\\u05d3\", \"\\u05d3\\u05b8\\u05bc\\u05d9\", \"\\u05d9\\u05b7\\u05dd\"]}, {\"q\": \"Which one says \\\"sal,\\\" a basket?\", \"o\": [\"\\u05e1\\u05b7\\u05dc\", \"\\u05e9\\u05b7\\u05c1\\u05dc\", \"\\u05e1\\u05b7\\u05e8\"]}, {\"q\": \"Which one says \\\"shaym,\\\" a name?\", \"o\": [\"\\u05e9\\u05b5\\u05c1\\u05dd\", \"\\u05e9\\u05b7\\u05c1\\u05dd\", \"\\u05e9\\u05b5\\u05c1\\u05df\"]}]}, \"LK.KRI.L02.02.b\": {\"name\": \"Blending 2: Two-Beat Words\", \"band\": \"K-2\", \"op\": \"Clap your hands: zaw... hawv! Two claps, one word. Long words are just short beats glued together, and you already know every beat.\", \"peg\": {\"kind\": \"clap\", \"show\": \"Clap \\u00b7 clap\", \"say\": \"Every letter with a nekudah is one clap. Clap the beats, then say them fast: zaw, hawv, zawhawv.\"}, \"teach\": [{\"how\": \"Opener: Clap your hands: zaw... hawv! Each letter with a nekudah is one beat. Cover the end with your finger, read the first beat, then slide your finger and read the next. Zayin-Kometz, zaw. Hei-Kometz with the Veis closing it, hawv. Zawhawv means gold.\", \"q\": \"Which word says \\\"zaw-hawv,\\\" gold?\", \"o\": [\"\\u05d6\\u05b8\\u05d4\\u05b8\\u05d1\", \"\\u05d6\\u05b8\\u05d1\\u05b8\\u05d4\", \"\\u05d4\\u05b8\\u05d6\\u05b8\\u05d1\"]}, {\"how\": \"Two Segols in a row say \\\"eh, eh.\\\" Yud with Segol, yeh. Lamed with Segol, leh, and the Daled closes it: led. Yeh-led means a boy.\", \"q\": \"Which word says \\\"yeh-led\\\"?\", \"o\": [\"\\u05d9\\u05b6\\u05dc\\u05b6\\u05d3\", \"\\u05d9\\u05b8\\u05dc\\u05b7\\u05d3\", \"\\u05d3\\u05b6\\u05bc\\u05dc\\u05b6\\u05ea\"]}, {\"how\": \"Count the claps: a word with two nekudos has two beats. Say-fer: Samech with Tzeirei, Fei with Segol, closed by the Reish.\", \"q\": \"How many beats are in this word?\", \"pic\": \"\\u05e1\\u05b5\\u05e4\\u05b6\\u05e8\", \"o\": [\"2\", \"1\", \"4\"]}], \"we\": [{\"q\": \"Together: which word says \\\"leh-chem,\\\" bread?\", \"o\": [\"\\u05dc\\u05b6\\u05d7\\u05b6\\u05dd\", \"\\u05d7\\u05b6\\u05dc\\u05b6\\u05dd\", \"\\u05dc\\u05b7\\u05d7\\u05b7\\u05dd\"], \"steps\": [\"First beat: Lamed with Segol, \\\"leh.\\\"\", \"Second beat: Ches with Segol, \\\"cheh,\\\" and the Mem closes it: chem.\", \"Glue them fast: lechem.\"]}, {\"q\": \"Together: which word says \\\"gaw-mawl,\\\" a camel?\", \"o\": [\"\\u05d2\\u05b8\\u05bc\\u05de\\u05b8\\u05dc\", \"\\u05d2\\u05b8\\u05bc\\u05d3\\u05b8\\u05dc\", \"\\u05de\\u05b8\\u05d2\\u05b8\\u05dc\"], \"steps\": [\"Gimmel with Kometz: gaw.\", \"Mem with Kometz, and the Lamed closes it: mawl.\", \"gaw, mawl: gawmawl.\"]}], \"practice\": [{\"t\": \"pairs\", \"q\": \"Match each word to its beats.\", \"pairs\": [[\"\\u05d6\\u05b8\\u05d4\\u05b8\\u05d1\", \"zaw-hawv\"], [\"\\u05d7\\u05b8\\u05dc\\u05b8\\u05d1\", \"chaw-lawv\"], [\"\\u05db\\u05b6\\u05bc\\u05dc\\u05b6\\u05d1\", \"keh-lev\"], [\"\\u05e9\\u05b6\\u05c1\\u05de\\u05b6\\u05e9\\u05c1\", \"sheh-mesh\"]], \"why\": \"Read beat by beat: each letter with a nekudah is one clap, and the last letter closes it.\"}, {\"t\": \"sort\", \"q\": \"Sort the words by their sound.\", \"bins\": [{\"id\": \"K\", \"label\": \"aw, aw (two Kometz)\"}, {\"id\": \"S\", \"label\": \"eh, eh (two Segol)\"}], \"items\": [{\"label\": \"\\u05d6\\u05b8\\u05d4\\u05b8\\u05d1\", \"bin\": \"K\"}, {\"label\": \"\\u05d7\\u05b8\\u05dc\\u05b8\\u05d1\", \"bin\": \"K\"}, {\"label\": \"\\u05d2\\u05b8\\u05bc\\u05de\\u05b8\\u05dc\", \"bin\": \"K\"}, {\"label\": \"\\u05d9\\u05b6\\u05dc\\u05b6\\u05d3\", \"bin\": \"S\"}, {\"label\": \"\\u05db\\u05b6\\u05bc\\u05dc\\u05b6\\u05d1\", \"bin\": \"S\"}, {\"label\": \"\\u05e9\\u05b6\\u05c1\\u05de\\u05b6\\u05e9\\u05c1\", \"bin\": \"S\"}], \"why\": \"Kometz is the little T: aw. Segol is three dots: eh.\"}, {\"t\": \"order\", \"q\": \"Put the beats of \\\"zaw-hawv\\\" in reading order.\", \"tiles\": [\"\\u05d6\\u05b8\", \"\\u05d4\\u05b8\", \"\\u05d1\"], \"why\": \"Hebrew reads from right to left: zaw, then haw, then the Veis closes it.\"}, {\"t\": \"spotall\", \"q\": \"Tap every word whose two beats both say \\\"eh.\\\"\", \"cells\": [{\"label\": \"\\u05d9\\u05b6\\u05dc\\u05b6\\u05d3\", \"ok\": true}, {\"label\": \"\\u05dc\\u05b6\\u05d7\\u05b6\\u05dd\", \"ok\": true}, {\"label\": \"\\u05db\\u05b6\\u05bc\\u05dc\\u05b6\\u05d1\", \"ok\": true}, {\"label\": \"\\u05d6\\u05b8\\u05d4\\u05b8\\u05d1\", \"ok\": false}, {\"label\": \"\\u05e1\\u05b5\\u05e4\\u05b6\\u05e8\", \"ok\": false}], \"why\": \"Yeled, lechem and kelev have two Segols. Zawhawv has two Kometz, and sefer starts with a Tzeirei.\"}, {\"q\": \"Which word says \\\"daw-vawr,\\\" a thing?\", \"o\": [\"\\u05d3\\u05b8\\u05bc\\u05d1\\u05b8\\u05e8\", \"\\u05d1\\u05b8\\u05bc\\u05d3\\u05b8\\u05e8\", \"\\u05d3\\u05b8\\u05bc\\u05d1\\u05b7\\u05e8\"], \"why\": \"Daled with Kometz, daw. Veis with Kometz, and the Reish closes it: vawr.\", \"h\": \"Daled with Kometz, daw. Veis with Kometz, and the Reish closes it: vawr.\"}, {\"q\": \"Which word says \\\"sheh-mesh,\\\" the sun?\", \"o\": [\"\\u05e9\\u05b6\\u05c1\\u05de\\u05b6\\u05e9\\u05c1\", \"\\u05e9\\u05b6\\u05c1\\u05de\\u05b6\\u05df\", \"\\u05de\\u05b6\\u05e9\\u05b6\\u05c1\\u05e9\\u05c1\"], \"why\": \"Shin with Segol, sheh. Mem with Segol, and the Shin closes it: mesh.\", \"h\": \"Shin with Segol, sheh. Mem with Segol, and the Shin closes it: mesh.\"}], \"check\": [{\"q\": \"Which word says \\\"keh-lev,\\\" a dog?\", \"o\": [\"\\u05db\\u05b6\\u05bc\\u05dc\\u05b6\\u05d1\", \"\\u05dc\\u05b6\\u05db\\u05b6\\u05d1\", \"\\u05db\\u05b8\\u05bc\\u05dc\\u05b8\\u05d1\"]}, {\"q\": \"Which word says \\\"chaw-lawv,\\\" milk?\", \"o\": [\"\\u05d7\\u05b8\\u05dc\\u05b8\\u05d1\", \"\\u05d7\\u05b8\\u05dc\\u05b7\\u05d1\", \"\\u05dc\\u05b8\\u05d7\\u05b8\\u05d1\"]}, {\"t\": \"order\", \"q\": \"Put the beats of \\\"yeh-led\\\" in reading order.\", \"tiles\": [\"\\u05d9\\u05b6\", \"\\u05dc\\u05b6\", \"\\u05d3\"]}]}, \"LK.KRI.L02.03.a\": {\"name\": \"Blending 3: The Vav Has Three Jobs\", \"band\": \"K-2\", \"op\": \"Meet the busiest letter in the Aleph-Beis! The Vav has three jobs. Watch where its dot sits, and you will always know which job it is doing.\", \"peg\": {\"kind\": \"three hats\", \"show\": \"Dot on top \\u00b7 dot in the belly \\u00b7 nekudah under\", \"say\": \"Dot on its head: \\\"oh.\\\" Dot in its belly: \\\"oo.\\\" A nekudah under it: the letter Vav, \\\"v.\\\"\"}, \"teach\": [{\"how\": \"Opener: Meet the busiest letter! When a Vav has a dot on its head, it is not a \\\"v.\\\" It says \\\"oh.\\\" Yud, then Vav with a dot on top, then Mem: yohm. Yohm means a day.\", \"q\": \"Which word says \\\"yohm,\\\" a day?\", \"o\": [\"\\u05d9\\u05d5\\u05b9\\u05dd\", \"\\u05d9\\u05d5\\u05bc\\u05dd\", \"\\u05d9\\u05b8\\u05dd\"]}, {\"how\": \"When the dot sits in the Vav's belly, it says \\\"oo.\\\" Samech, a Vav with a dot in its belly, then Samech: soos. Soos means a horse.\", \"q\": \"Which word says \\\"soos,\\\" a horse?\", \"o\": [\"\\u05e1\\u05d5\\u05bc\\u05e1\", \"\\u05e1\\u05d5\\u05b9\\u05e1\", \"\\u05e1\\u05b8\\u05e1\"]}, {\"how\": \"When the Vav has its own nekudah under it, it is the letter Vav and says \\\"v.\\\" Vav with Kometz says \\\"vaw.\\\"\", \"q\": \"Which one is the letter Vav saying \\\"vaw\\\"?\", \"o\": [\"\\u05d5\\u05b8\", \"\\u05d5\\u05b9\", \"\\u05d5\\u05bc\"]}], \"we\": [{\"q\": \"Together: which word says \\\"tohv,\\\" good?\", \"o\": [\"\\u05d8\\u05d5\\u05b9\\u05d1\", \"\\u05d8\\u05d5\\u05bc\\u05d1\", \"\\u05d1\\u05bc\\u05d5\\u05b9\\u05d8\"], \"steps\": [\"Tes says \\\"t.\\\"\", \"The Vav has a dot on its head: \\\"oh.\\\"\", \"The Veis closes it: tohv.\"]}, {\"q\": \"Together: which word says \\\"hoo,\\\" he?\", \"o\": [\"\\u05d4\\u05d5\\u05bc\\u05d0\", \"\\u05d4\\u05d5\\u05b9\\u05d0\", \"\\u05d0\\u05d5\\u05bc\\u05d4\"], \"steps\": [\"Hei says \\\"h.\\\"\", \"The Vav has a dot in its belly: \\\"oo.\\\"\", \"The Aleph at the end has no nekudah, so it is quiet: hoo.\"]}], \"practice\": [{\"t\": \"sort\", \"q\": \"Sort the words: does the Vav say \\\"oh\\\" or \\\"oo\\\"?\", \"bins\": [{\"id\": \"O\", \"label\": \"oh: dot on top\"}, {\"id\": \"U\", \"label\": \"oo: dot in the belly\"}], \"items\": [{\"label\": \"\\u05d9\\u05d5\\u05b9\\u05dd\", \"bin\": \"O\"}, {\"label\": \"\\u05e7\\u05d5\\u05b9\\u05dc\", \"bin\": \"O\"}, {\"label\": \"\\u05d0\\u05d5\\u05b9\\u05e8\", \"bin\": \"O\"}, {\"label\": \"\\u05e1\\u05d5\\u05bc\\u05e1\", \"bin\": \"U\"}, {\"label\": \"\\u05e9\\u05c1\\u05d5\\u05bc\\u05e7\", \"bin\": \"U\"}, {\"label\": \"\\u05d4\\u05d5\\u05bc\\u05d0\", \"bin\": \"U\"}], \"why\": \"A dot on the head says \\\"oh,\\\" Cholam. A dot in the belly says \\\"oo,\\\" Shuruk.\"}, {\"t\": \"pairs\", \"q\": \"Match each word to how it sounds.\", \"pairs\": [[\"\\u05d0\\u05d5\\u05b9\\u05e8\", \"ohr\"], [\"\\u05e7\\u05d5\\u05b9\\u05dc\", \"kohl\"], [\"\\u05e9\\u05c1\\u05d5\\u05bc\\u05e7\", \"shook\"], [\"\\u05d3\\u05bc\\u05d5\\u05b9\\u05d3\", \"dohd\"]], \"why\": \"Watch where the Vav's dot sits: on top says \\\"oh,\\\" in the belly says \\\"oo.\\\"\"}, {\"t\": \"spotall\", \"q\": \"Tap every Vav that is the letter \\\"v.\\\"\", \"cells\": [{\"label\": \"\\u05d5\\u05b8\", \"ok\": true}, {\"label\": \"\\u05d5\\u05b6\", \"ok\": true}, {\"label\": \"\\u05d5\\u05b7\", \"ok\": true}, {\"label\": \"\\u05d5\\u05b9\", \"ok\": false}, {\"label\": \"\\u05d5\\u05bc\", \"ok\": false}], \"why\": \"A Vav with a nekudah under it is the letter \\\"v.\\\" With a dot on top or in the belly, it is a vowel.\"}, {\"q\": \"Which word says \\\"ohr,\\\" light?\", \"o\": [\"\\u05d0\\u05d5\\u05b9\\u05e8\", \"\\u05d0\\u05d5\\u05bc\\u05e8\", \"\\u05e8\\u05d5\\u05b9\\u05d0\"], \"why\": \"The Aleph is quiet, the Vav with a dot on top says \\\"oh,\\\" and the Reish closes it: ohr.\", \"h\": \"The Aleph is quiet, the Vav with a dot on top says \\\"oh,\\\" and the Reish closes it: ohr.\"}, {\"t\": \"order\", \"q\": \"Put the three Vavs in order: oh, then oo, then v.\", \"tiles\": [\"\\u05d5\\u05b9\", \"\\u05d5\\u05bc\", \"\\u05d5\\u05b8\"], \"why\": \"Dot on top: oh. Dot in the belly: oo. Nekudah under it: v.\"}, {\"q\": \"Which word says \\\"sho-fawr,\\\" a shofar?\", \"o\": [\"\\u05e9\\u05c1\\u05d5\\u05b9\\u05e4\\u05b8\\u05e8\", \"\\u05e9\\u05c1\\u05d5\\u05bc\\u05e4\\u05b8\\u05e8\", \"\\u05e9\\u05c1\\u05d5\\u05b9\\u05e4\\u05b7\\u05e8\"], \"why\": \"Shin with a Vav whose dot is on top: sho. Fei with Kometz, closed by the Reish: fawr.\", \"h\": \"Shin with a Vav whose dot is on top: sho. Fei with Kometz, closed by the Reish: fawr.\"}], \"check\": [{\"q\": \"Which word says \\\"kohl,\\\" a voice?\", \"o\": [\"\\u05e7\\u05d5\\u05b9\\u05dc\", \"\\u05e7\\u05d5\\u05bc\\u05dc\", \"\\u05dc\\u05d5\\u05b9\\u05e7\"]}, {\"q\": \"Which word says \\\"shook,\\\" a market?\", \"o\": [\"\\u05e9\\u05c1\\u05d5\\u05bc\\u05e7\", \"\\u05e9\\u05c1\\u05d5\\u05b9\\u05e7\", \"\\u05e7\\u05d5\\u05bc\\u05e9\\u05c1\"]}, {\"q\": \"Which Vav says \\\"oo\\\"?\", \"o\": [\"\\u05d5\\u05bc\", \"\\u05d5\\u05b9\", \"\\u05d5\\u05b8\"]}]}, \"LK.KRI.L02.03.b\": {\"name\": \"Blending 4: Quiet Letters\", \"band\": \"K-2\", \"op\": \"Shh! Some letters at the end of a word are shy. They are written, but they do not make a sound. Learn to spot them and your reading gets smooth.\", \"peg\": {\"kind\": \"finger on lips\", \"show\": \"Shh at the end\", \"say\": \"At the end of a word, an Aleph or a Hei with no nekudah says nothing. Put a finger on your lips: shh!\"}, \"teach\": [{\"how\": \"Opener: Shh! Some letters are shy. A Hei at the very end of a word, with no nekudah, is quiet. Mem with Kometz, then a quiet Hei: maw. Maw means what.\", \"q\": \"Which word says \\\"maw,\\\" what?\", \"o\": [\"\\u05de\\u05b8\\u05d4\", \"\\u05de\\u05b8\\u05dd\", \"\\u05d4\\u05b8\\u05dd\"]}, {\"how\": \"An Aleph with no nekudah is quiet too. Lamed with a dot on top, \\\"loh,\\\" then a quiet Aleph: loh. Loh means no.\", \"q\": \"Which word says \\\"loh,\\\" no?\", \"o\": [\"\\u05dc\\u05b9\\u05d0\", \"\\u05dc\\u05d5\\u05bc\", \"\\u05d0\\u05b9\\u05dc\"]}, {\"how\": \"After a Chirik or a Tzeirei, a Yud with no nekudah just helps the sound along. Mem, Chirik, Yud: mee. Mee means who.\", \"q\": \"Which word says \\\"mee,\\\" who?\", \"o\": [\"\\u05de\\u05b4\\u05d9\", \"\\u05d9\\u05b4\\u05dd\", \"\\u05de\\u05b7\\u05d9\"]}], \"we\": [{\"q\": \"Together: which word says \\\"Toh-raw\\\"?\", \"o\": [\"\\u05ea\\u05bc\\u05d5\\u05b9\\u05e8\\u05b8\\u05d4\", \"\\u05ea\\u05b8\\u05bc\\u05e8\\u05b8\\u05d4\", \"\\u05ea\\u05bc\\u05d5\\u05bc\\u05e8\\u05b8\\u05d4\"], \"steps\": [\"Tav with a dot, and a Vav with a dot on top: toh.\", \"Reish with Kometz: raw.\", \"The Hei at the end has no nekudah. Shh, it is quiet: Tohraw.\"]}, {\"q\": \"Together: which word says \\\"zeh,\\\" this?\", \"o\": [\"\\u05d6\\u05b6\\u05d4\", \"\\u05d6\\u05b8\\u05d4\", \"\\u05d4\\u05b6\\u05d6\"], \"steps\": [\"Zayin with Segol: zeh.\", \"Look at the Hei: no nekudah.\", \"It is quiet, so the word is just: zeh.\"]}], \"practice\": [{\"t\": \"spotall\", \"q\": \"Tap every word that ends with a quiet letter.\", \"cells\": [{\"label\": \"\\u05de\\u05b8\\u05d4\", \"ok\": true}, {\"label\": \"\\u05dc\\u05b9\\u05d0\", \"ok\": true}, {\"label\": \"\\u05d9\\u05b8\\u05e4\\u05b6\\u05d4\", \"ok\": true}, {\"label\": \"\\u05d1\\u05b8\\u05bc\\u05d0\", \"ok\": true}, {\"label\": \"\\u05d3\\u05b8\\u05bc\\u05d2\", \"ok\": false}, {\"label\": \"\\u05e1\\u05d5\\u05bc\\u05e1\", \"ok\": false}], \"why\": \"A Hei or an Aleph at the end with no nekudah is quiet: maw, loh, yawfeh, baw. Dawg and soos end with a letter you say.\"}, {\"t\": \"pairs\", \"q\": \"Match each word to how it sounds.\", \"pairs\": [[\"\\u05de\\u05b9\\u05e9\\u05b6\\u05c1\\u05d4\", \"Moh-sheh\"], [\"\\u05e9\\u05b8\\u05c2\\u05d3\\u05b6\\u05d4\", \"saw-deh\"], [\"\\u05e7\\u05b8\\u05e8\\u05b8\\u05d0\", \"kaw-raw\"], [\"\\u05d1\\u05b5\\u05bc\\u05d9\\u05ea\", \"bays\"]], \"why\": \"Quiet letters at the end make no sound. In bays the Yud helps the Tzeirei, and the Tav with no dot says \\\"s.\\\"\"}, {\"t\": \"sort\", \"q\": \"Sort: is the last letter quiet, or do you say it?\", \"bins\": [{\"id\": \"Q\", \"label\": \"Quiet at the end\"}, {\"id\": \"S\", \"label\": \"You say it\"}], \"items\": [{\"label\": \"\\u05d9\\u05b8\\u05e4\\u05b6\\u05d4\", \"bin\": \"Q\"}, {\"label\": \"\\u05d1\\u05b8\\u05bc\\u05d0\", \"bin\": \"Q\"}, {\"label\": \"\\u05d6\\u05b6\\u05d4\", \"bin\": \"Q\"}, {\"label\": \"\\u05dc\\u05b5\\u05d1\", \"bin\": \"S\"}, {\"label\": \"\\u05d9\\u05d5\\u05b9\\u05dd\", \"bin\": \"S\"}, {\"label\": \"\\u05d2\\u05b7\\u05bc\\u05df\", \"bin\": \"S\"}], \"why\": \"Aleph and Hei with no nekudah at the end are quiet. Veis, Mem and Nun at the end close the sound.\"}, {\"q\": \"Which word says \\\"yaw-feh,\\\" pretty?\", \"o\": [\"\\u05d9\\u05b8\\u05e4\\u05b6\\u05d4\", \"\\u05e4\\u05b8\\u05bc\\u05d9\\u05b6\\u05d4\", \"\\u05d9\\u05b8\\u05e4\\u05b7\\u05ea\"], \"why\": \"Yud with Kometz, yaw. Fei with Segol, feh. The Hei is quiet.\", \"h\": \"Yud with Kometz, yaw. Fei with Segol, feh. The Hei is quiet.\"}, {\"t\": \"order\", \"q\": \"Read \\\"Moh-sheh\\\" step by step. Put the steps in order.\", \"tiles\": [\"Mem with a dot on top: moh\", \"Shin with Segol: sheh\", \"The Hei is quiet: stop\"], \"why\": \"Read each beat, and stay quiet for the shy Hei at the end.\"}, {\"q\": \"Which word says \\\"baw,\\\" he came?\", \"o\": [\"\\u05d1\\u05b8\\u05bc\\u05d0\", \"\\u05d0\\u05b8\\u05d1\", \"\\u05d1\\u05b7\\u05bc\\u05ea\"], \"why\": \"Beis with Kometz says \\\"baw,\\\" and the Aleph at the end is quiet.\", \"h\": \"Beis with Kometz says \\\"baw,\\\" and the Aleph at the end is quiet.\"}], \"check\": [{\"q\": \"Which word says \\\"saw-deh,\\\" a field?\", \"o\": [\"\\u05e9\\u05b8\\u05c2\\u05d3\\u05b6\\u05d4\", \"\\u05e9\\u05b8\\u05c1\\u05d3\\u05b6\\u05d4\", \"\\u05d3\\u05b8\\u05bc\\u05e9\\u05b6\\u05c2\\u05d4\"]}, {\"q\": \"Which word says \\\"mee,\\\" who?\", \"o\": [\"\\u05de\\u05b4\\u05d9\", \"\\u05de\\u05b7\\u05d9\", \"\\u05d9\\u05b8\\u05dd\"]}, {\"q\": \"Which word says \\\"Moh-sheh\\\"?\", \"o\": [\"\\u05de\\u05b9\\u05e9\\u05b6\\u05c1\\u05d4\", \"\\u05de\\u05b9\\u05e9\\u05b6\\u05c2\\u05d4\", \"\\u05e9\\u05b9\\u05c1\\u05de\\u05b6\\u05d4\"]}]}, \"LK.KRI.L02.05.a\": {\"name\": \"Blending 5: The Dagesh in the Middle\", \"band\": \"K-2\", \"op\": \"Shabbos, challah, sukkah, Imma: some of the most special words we say have a strong dot hiding in the middle. Today you find out what it does.\", \"peg\": {\"kind\": \"hinge\", \"show\": \"Close \\u00b7 open\", \"say\": \"A dot inside a letter in the middle of a word works twice: it closes the first beat and opens the next. Shab, bos.\"}, \"teach\": [{\"how\": \"Opener: Shabbos, challah, sukkah, Imma: these special words all hide a strong dot in the middle. A dot inside a letter in the middle of a word is a Dagesh. It makes the letter work twice. Shin with Patach, \\\"shah.\\\" The Beis has a Dagesh: it closes \\\"shab\\\" and opens \\\"bos.\\\" Shabbos!\", \"q\": \"Which word says \\\"Shabbos\\\"?\", \"o\": [\"\\u05e9\\u05b7\\u05c1\\u05d1\\u05b8\\u05bc\\u05ea\", \"\\u05e9\\u05b8\\u05c1\\u05d1\\u05b7\\u05ea\", \"\\u05d1\\u05b8\\u05bc\\u05e9\\u05b7\\u05c1\\u05ea\"]}, {\"how\": \"Aleph with Chirik, \\\"i.\\\" The Mem has a Dagesh, so it closes \\\"im\\\" and opens \\\"maw.\\\" Im-maw: Imma!\", \"q\": \"Which word says \\\"Im-maw\\\"?\", \"o\": [\"\\u05d0\\u05b4\\u05de\\u05b8\\u05bc\\u05d0\", \"\\u05d0\\u05b7\\u05d1\\u05b8\\u05bc\\u05d0\", \"\\u05de\\u05b8\\u05d0\\u05b8\\u05d4\"]}, {\"how\": \"Samech with Kubutz, \\\"soo.\\\" The Kaf has a Dagesh, so it is a hard \\\"k,\\\" and it works twice: sook, kaw. Sukkah! Without the dot it would be a soft Chaf.\", \"q\": \"Which word says \\\"sook-kaw\\\"?\", \"o\": [\"\\u05e1\\u05bb\\u05db\\u05b8\\u05bc\\u05d4\", \"\\u05e1\\u05bb\\u05db\\u05b8\\u05d4\", \"\\u05db\\u05bb\\u05bc\\u05e1\\u05b8\\u05d4\"]}], \"we\": [{\"q\": \"Together: which word says \\\"chal-law,\\\" challah?\", \"o\": [\"\\u05d7\\u05b7\\u05dc\\u05b8\\u05bc\\u05d4\", \"\\u05d7\\u05b8\\u05dc\\u05b8\\u05d4\", \"\\u05dc\\u05b7\\u05d7\\u05b8\\u05d4\"], \"steps\": [\"Ches with Patach: chah.\", \"The Lamed has a Dagesh: it closes \\\"chal\\\" and opens \\\"law.\\\"\", \"The Hei at the end is quiet: challaw.\"]}, {\"q\": \"Together: which word says \\\"mit-taw,\\\" a bed?\", \"o\": [\"\\u05de\\u05b4\\u05d8\\u05b8\\u05bc\\u05d4\", \"\\u05de\\u05b7\\u05d8\\u05b8\\u05bc\\u05d4\", \"\\u05d8\\u05b4\\u05de\\u05b8\\u05bc\\u05d4\"], \"steps\": [\"Mem with Chirik: mi.\", \"The Tes has a Dagesh: mit, taw.\", \"The Hei is quiet: mittaw.\"]}], \"practice\": [{\"t\": \"spotall\", \"q\": \"Tap every word with a Dagesh in the middle.\", \"cells\": [{\"label\": \"\\u05e9\\u05b7\\u05c1\\u05d1\\u05b8\\u05bc\\u05ea\", \"ok\": true}, {\"label\": \"\\u05d7\\u05b7\\u05dc\\u05b8\\u05bc\\u05d4\", \"ok\": true}, {\"label\": \"\\u05e1\\u05bb\\u05db\\u05b8\\u05bc\\u05d4\", \"ok\": true}, {\"label\": \"\\u05d0\\u05b4\\u05de\\u05b8\\u05bc\\u05d0\", \"ok\": true}, {\"label\": \"\\u05d6\\u05b8\\u05d4\\u05b8\\u05d1\", \"ok\": false}, {\"label\": \"\\u05d9\\u05b6\\u05dc\\u05b6\\u05d3\", \"ok\": false}], \"why\": \"Shabbos, challah, sukkah and Imma each have a dot inside a middle letter. Zawhawv and yeled do not.\"}, {\"t\": \"pairs\", \"q\": \"Match each word to how it sounds. Look for the dot!\", \"pairs\": [[\"\\u05e1\\u05bb\\u05db\\u05b8\\u05bc\\u05d4\", \"sook-kaw\"], [\"\\u05e1\\u05bb\\u05db\\u05b8\\u05d4\", \"soo-chaw\"], [\"\\u05d7\\u05b7\\u05dc\\u05b8\\u05bc\\u05d4\", \"chal-law\"], [\"\\u05d7\\u05b8\\u05dc\\u05b8\\u05d4\", \"chaw-law\"]], \"why\": \"With a Dagesh the letter works twice and Kaf is hard. Without it the beat stays open and Kaf is a soft Chaf.\"}, {\"t\": \"sort\", \"q\": \"Sort the letters: hard sound or soft sound?\", \"bins\": [{\"id\": \"H\", \"label\": \"Hard: with a dot\"}, {\"id\": \"S\", \"label\": \"Soft: no dot\"}], \"items\": [{\"label\": \"\\u05d1\\u05bc\", \"bin\": \"H\"}, {\"label\": \"\\u05db\\u05bc\", \"bin\": \"H\"}, {\"label\": \"\\u05e4\\u05bc\", \"bin\": \"H\"}, {\"label\": \"\\u05d1\", \"bin\": \"S\"}, {\"label\": \"\\u05db\", \"bin\": \"S\"}, {\"label\": \"\\u05e4\", \"bin\": \"S\"}], \"why\": \"With a Dagesh: b, k, p. Without one: v, ch, f.\"}, {\"q\": \"Which word says \\\"ab-baw,\\\" Abba?\", \"o\": [\"\\u05d0\\u05b7\\u05d1\\u05b8\\u05bc\\u05d0\", \"\\u05d0\\u05b8\\u05d1\\u05b8\\u05d0\", \"\\u05d1\\u05b7\\u05bc\\u05d0\\u05b8\\u05d4\"], \"why\": \"Aleph with Patach, \\\"ah.\\\" The Beis has a Dagesh: ab, baw. The Aleph at the end is quiet.\", \"h\": \"Aleph with Patach, \\\"ah.\\\" The Beis has a Dagesh: ab, baw. The Aleph at the end is quiet.\"}, {\"t\": \"order\", \"q\": \"How does the Dagesh read \\\"Shabbos\\\"? Put the steps in order.\", \"tiles\": [\"Read Shin with Patach: shah\", \"The Dagesh letter closes it: shab\", \"The same letter opens the next beat: bos\"], \"why\": \"The Dagesh letter works twice: it closes one beat and opens the next.\"}, {\"q\": \"Which word says \\\"kis-say,\\\" a chair?\", \"o\": [\"\\u05db\\u05b4\\u05bc\\u05e1\\u05b5\\u05bc\\u05d0\", \"\\u05db\\u05b7\\u05bc\\u05e1\\u05b8\\u05bc\\u05d4\", \"\\u05e1\\u05b4\\u05db\\u05b8\\u05bc\\u05d4\"], \"why\": \"Kaf with Chirik, \\\"ki.\\\" The Samech has a Dagesh: kis, say. The Aleph is quiet.\", \"h\": \"Kaf with Chirik, \\\"ki.\\\" The Samech has a Dagesh: kis, say. The Aleph is quiet.\"}], \"check\": [{\"q\": \"Which word says \\\"sook-kaw\\\"?\", \"o\": [\"\\u05e1\\u05bb\\u05db\\u05b8\\u05bc\\u05d4\", \"\\u05e1\\u05bb\\u05db\\u05b8\\u05d4\", \"\\u05e1\\u05b8\\u05db\\u05b8\\u05d4\"]}, {\"q\": \"Which word has a Dagesh in the middle?\", \"o\": [\"\\u05d7\\u05b7\\u05dc\\u05b8\\u05bc\\u05d4\", \"\\u05d7\\u05b8\\u05dc\\u05b8\\u05d4\", \"\\u05d6\\u05b8\\u05d4\\u05b8\\u05d1\"]}, {\"q\": \"Which word says \\\"Im-maw\\\"?\", \"o\": [\"\\u05d0\\u05b4\\u05de\\u05b8\\u05bc\\u05d0\", \"\\u05d0\\u05b7\\u05d1\\u05b8\\u05bc\\u05d0\", \"\\u05de\\u05b4\\u05d9\"]}]}, \"LK.KRI.L02.06.a\": {\"name\": \"Blending 6: First Real Words\", \"band\": \"K-2\", \"op\": \"You have every tool now: closed beats, two beats, the Vav, quiet letters and the Dagesh. Time to read words you have never seen, like a real reader!\", \"peg\": {\"kind\": \"detective\", \"show\": \"Look \\u00b7 beats \\u00b7 glue\", \"say\": \"A brand-new word? Look at every nekudah, cut the word into beats, then glue the beats together.\"}, \"teach\": [{\"how\": \"Opener: You have every tool now. A word you have never seen is just beats you already know. Shin with Kometz, shaw. Lamed with a Vav that has a dot on top, closed by the Mem: lohm. Shaw-lohm: Shalom!\", \"q\": \"Which word says \\\"Shaw-lohm\\\"?\", \"o\": [\"\\u05e9\\u05b8\\u05c1\\u05dc\\u05d5\\u05b9\\u05dd\", \"\\u05e9\\u05b8\\u05c1\\u05dc\\u05d5\\u05bc\\u05dd\", \"\\u05dc\\u05b8\\u05e9\\u05c1\\u05d5\\u05b9\\u05dd\"]}, {\"how\": \"Aleph with Kometz, aw. Mem with Tzeirei, closed by a final Nun: mayn. Aw-mayn! We say it after every brachah we hear.\", \"q\": \"Which word says \\\"Aw-mayn\\\"?\", \"o\": [\"\\u05d0\\u05b8\\u05de\\u05b5\\u05df\", \"\\u05d0\\u05b8\\u05de\\u05b7\\u05df\", \"\\u05e0\\u05b8\\u05de\\u05b5\\u05d0\"]}, {\"how\": \"Mem with Chirik, \\\"mi.\\\" The Tzadi has a Sheva, so it closes the first beat: mitz. Vav with Kometz: vaw. The Hei is quiet. Mitz-vaw!\", \"q\": \"Which word says \\\"Mitz-vaw\\\"?\", \"o\": [\"\\u05de\\u05b4\\u05e6\\u05b0\\u05d5\\u05b8\\u05d4\", \"\\u05de\\u05b7\\u05e6\\u05b8\\u05bc\\u05d4\", \"\\u05e6\\u05b4\\u05d5\\u05b8\\u05bc\\u05d4\"]}], \"we\": [{\"q\": \"Together: which word says \\\"Av-raw-hawm\\\"?\", \"o\": [\"\\u05d0\\u05b7\\u05d1\\u05b0\\u05e8\\u05b8\\u05d4\\u05b8\\u05dd\", \"\\u05d0\\u05b7\\u05d1\\u05b0\\u05e8\\u05b8\\u05dd\", \"\\u05d0\\u05b7\\u05d4\\u05b2\\u05e8\\u05b9\\u05df\"], \"steps\": [\"Beat 1: Aleph with Patach, and the Beis has a Sheva, so it closes the beat: Av.\", \"Beat 2: Reish with Kometz: raw.\", \"Beat 3: Hei with Kometz, closed by the Mem: hawm. Avrawhawm!\"]}, {\"q\": \"Together: which word says \\\"Eh-mes,\\\" truth?\", \"o\": [\"\\u05d0\\u05b1\\u05de\\u05b6\\u05ea\", \"\\u05de\\u05b5\\u05d0\\u05ea\", \"\\u05d0\\u05b5\\u05de\\u05b8\\u05d4\"], \"steps\": [\"Aleph with a Chataf Segol: a quick \\\"eh.\\\"\", \"Mem with Segol, and the Tav with no dot says \\\"s\\\": mes.\", \"Ehmes means truth.\"]}], \"practice\": [{\"t\": \"pairs\", \"q\": \"Match each word to how it sounds.\", \"pairs\": [[\"\\u05e9\\u05b8\\u05c1\\u05dc\\u05d5\\u05b9\\u05dd\", \"Shaw-lohm\"], [\"\\u05d0\\u05b8\\u05de\\u05b5\\u05df\", \"Aw-mayn\"], [\"\\u05ea\\u05bc\\u05d5\\u05b9\\u05e8\\u05b8\\u05d4\", \"Toh-raw\"], [\"\\u05d7\\u05b6\\u05e1\\u05b6\\u05d3\", \"Cheh-sed\"]], \"why\": \"Look at every nekudah, cut the word into beats, then glue them together.\"}, {\"t\": \"order\", \"q\": \"Put the beats of \\\"Av-raw-hawm\\\" in reading order.\", \"tiles\": [\"\\u05d0\\u05b7\\u05d1\", \"\\u05e8\\u05b8\", \"\\u05d4\\u05b8\\u05dd\"], \"why\": \"Right to left: Av, raw, hawm.\"}, {\"t\": \"spotall\", \"q\": \"Tap every word that ends with a quiet Hei.\", \"cells\": [{\"label\": \"\\u05ea\\u05bc\\u05d5\\u05b9\\u05e8\\u05b8\\u05d4\", \"ok\": true}, {\"label\": \"\\u05de\\u05b4\\u05e6\\u05b0\\u05d5\\u05b8\\u05d4\", \"ok\": true}, {\"label\": \"\\u05d1\\u05b0\\u05bc\\u05e8\\u05b8\\u05db\\u05b8\\u05d4\", \"ok\": true}, {\"label\": \"\\u05e9\\u05b8\\u05c1\\u05dc\\u05d5\\u05b9\\u05dd\", \"ok\": false}, {\"label\": \"\\u05d0\\u05b8\\u05de\\u05b5\\u05df\", \"ok\": false}, {\"label\": \"\\u05d7\\u05b6\\u05e1\\u05b6\\u05d3\", \"ok\": false}], \"why\": \"Torah, mitzvah and brachah end with a Hei that has no nekudah. Shalom, amen and chesed end with a letter you say.\"}, {\"t\": \"sort\", \"q\": \"Sort the words: two beats or three beats?\", \"bins\": [{\"id\": \"2\", \"label\": \"Two beats\"}, {\"id\": \"3\", \"label\": \"Three beats\"}], \"items\": [{\"label\": \"\\u05e9\\u05b8\\u05c1\\u05dc\\u05d5\\u05b9\\u05dd\", \"bin\": \"2\"}, {\"label\": \"\\u05d0\\u05b8\\u05de\\u05b5\\u05df\", \"bin\": \"2\"}, {\"label\": \"\\u05d7\\u05b6\\u05e1\\u05b6\\u05d3\", \"bin\": \"2\"}, {\"label\": \"\\u05d0\\u05b7\\u05d1\\u05b0\\u05e8\\u05b8\\u05d4\\u05b8\\u05dd\", \"bin\": \"3\"}, {\"label\": \"\\u05d0\\u05b2\\u05d3\\u05b8\\u05de\\u05b8\\u05d4\", \"bin\": \"3\"}, {\"label\": \"\\u05d7\\u05b2\\u05e0\\u05bb\\u05db\\u05b8\\u05bc\\u05d4\", \"bin\": \"3\"}], \"why\": \"Clap one beat for each letter with a nekudah, a Chataf too. A Sheva that closes a beat is not a new clap.\"}, {\"q\": \"Which word says \\\"Baw-rooch\\\"?\", \"o\": [\"\\u05d1\\u05b8\\u05bc\\u05e8\\u05d5\\u05bc\\u05da\\u05b0\", \"\\u05d1\\u05b8\\u05bc\\u05e8\\u05b7\\u05da\\u05b0\", \"\\u05d1\\u05b0\\u05bc\\u05e8\\u05b8\\u05db\\u05b8\\u05d4\"], \"why\": \"Beis with Kometz, baw. Reish with a Vav that has a dot in its belly, roo. The final Chaf with a Sheva closes it: rooch.\", \"h\": \"Beis with Kometz, baw. Reish with a Vav that has a dot in its belly, roo. The final Chaf with a Sheva closes it: rooch.\"}, {\"q\": \"Which word says \\\"Cha-noo-kaw\\\"?\", \"o\": [\"\\u05d7\\u05b2\\u05e0\\u05bb\\u05db\\u05b8\\u05bc\\u05d4\", \"\\u05e1\\u05bb\\u05db\\u05b8\\u05bc\\u05d4\", \"\\u05d7\\u05b7\\u05dc\\u05b8\\u05bc\\u05d4\"], \"why\": \"Ches with a Chataf Patach, cha. Nun with Kubutz, noo. Kaf with a Dagesh and Kometz, kaw, and a quiet Hei.\", \"h\": \"Ches with a Chataf Patach, cha. Nun with Kubutz, noo. Kaf with a Dagesh and Kometz, kaw, and a quiet Hei.\"}], \"check\": [{\"q\": \"Which word says \\\"Shaw-lohm\\\"?\", \"o\": [\"\\u05e9\\u05b8\\u05c1\\u05dc\\u05d5\\u05b9\\u05dd\", \"\\u05e9\\u05c1\\u05d5\\u05bc\\u05dc\\u05b8\\u05dd\", \"\\u05dc\\u05b8\\u05e9\\u05c1\\u05d5\\u05b9\\u05dd\"]}, {\"q\": \"Which word says \\\"Av-raw-hawm\\\"?\", \"o\": [\"\\u05d0\\u05b7\\u05d1\\u05b0\\u05e8\\u05b8\\u05d4\\u05b8\\u05dd\", \"\\u05d0\\u05b7\\u05d1\\u05b0\\u05e8\\u05b8\\u05dd\", \"\\u05d0\\u05b7\\u05d4\\u05b2\\u05e8\\u05b9\\u05df\"]}, {\"q\": \"Which word says \\\"Mitz-vaw\\\"?\", \"o\": [\"\\u05de\\u05b4\\u05e6\\u05b0\\u05d5\\u05b8\\u05d4\", \"\\u05de\\u05b7\\u05e6\\u05b8\\u05bc\\u05d4\", \"\\u05e6\\u05b4\\u05d5\\u05b8\\u05bc\\u05d4\"]}]}, \"LK.KRI.L01.01.a\": {\"name\": \"Aleph-Beis 1: Aleph to Hei\", \"teach\": [{\"how\": \"Today you begin the Aleph-Beis, the letters of the Torah. Every pasuk, every bracha and every word of davening is made of these letters. Every Jewish boy for thousands of years started right here. The first letter is Aleph. Aleph makes no sound by itself. It waits for a nekudah to tell it what to say.\", \"q\": \"This letter is Aleph. Tap the Aleph.\", \"pic\": \"\\u05d0\", \"o\": [\"\\u05d0\", \"\\u05d2\", \"\\u05d3\"]}, {\"how\": \"This is Beis. Look in the middle: Beis has a dot inside it. Beis says \\\"b.\\\" Now take the dot away. Without the dot it is a different letter, Veis, and it says \\\"v.\\\" Dot inside: Beis, b. Empty inside: Veis, v.\", \"q\": \"This letter is Beis, with the dot. Tap the Beis.\", \"pic\": \"\\u05d1\\u05bc\", \"o\": [\"\\u05d1\\u05bc\", \"\\u05d1\", \"\\u05d4\"]}, {\"how\": \"Three more letters. Gimmel has a little foot that kicks out at the bottom. It says \\\"g.\\\" Daled has a flat roof with a corner that sticks out, and one leg. It says \\\"d.\\\" Hei looks like Daled with a second leg on the left side, and that leg does not touch the roof. Hei says \\\"h.\\\"\", \"q\": \"This letter is Daled. Tap the Daled.\", \"pic\": \"\\u05d3\", \"o\": [\"\\u05d3\", \"\\u05d4\", \"\\u05d2\"]}], \"practice\": [{\"q\": \"Which one is Gimmel?\", \"o\": [\"\\u05d2\", \"\\u05d3\", \"\\u05d1\"], \"h\": \"Gimmel has a little foot that kicks out at the bottom. Find the foot.\"}, {\"q\": \"Which one is Hei?\", \"o\": [\"\\u05d4\", \"\\u05d3\", \"\\u05d0\"], \"h\": \"Hei has two legs, and the left leg does not touch the roof. Daled has only one leg.\"}, {\"q\": \"Which one is Veis, with no dot?\", \"o\": [\"\\u05d1\", \"\\u05d1\\u05bc\", \"\\u05d2\"], \"h\": \"Look in the middle of each letter. Veis is empty inside. Beis has a dot.\"}, {\"q\": \"Which letter says \\\"v\\\"?\", \"o\": [\"\\u05d1\", \"\\u05d1\\u05bc\", \"\\u05d4\"], \"h\": \"No dot in the middle means Veis, and Veis says \\\"v.\\\"\"}, {\"q\": \"Which letter says \\\"g\\\"?\", \"o\": [\"\\u05d2\", \"\\u05d3\", \"\\u05d1\"], \"h\": \"Gimmel says \\\"g.\\\" Look for the letter with the little foot.\"}, {\"t\": \"order\", \"q\": \"Put the letters in Aleph-Beis order. Start with Aleph.\", \"tiles\": [\"\\u05d0\", \"\\u05d1\\u05bc\", \"\\u05d2\"], \"h\": \"Aleph comes first, then Beis, then Gimmel.\"}], \"check\": [{\"q\": \"Which one is Daled?\", \"o\": [\"\\u05d3\", \"\\u05d4\", \"\\u05d1\"]}, {\"q\": \"Which letter says \\\"h\\\"?\", \"o\": [\"\\u05d4\", \"\\u05d0\", \"\\u05d3\"]}, {\"t\": \"order\", \"q\": \"Put the letters in Aleph-Beis order. Start with Gimmel.\", \"tiles\": [\"\\u05d2\", \"\\u05d3\", \"\\u05d4\"]}]}, \"LK.KRI.L01.01.b\": {\"name\": \"Aleph-Beis 2: Vav to Yud\", \"teach\": [{\"how\": \"You already know six letters, from Aleph to Hei. Now come five more. Vav is a straight line standing tall, with a little head on top that bends to one side. Vav says \\\"v.\\\" Zayin looks almost the same, but its head sticks out on both sides, like a little crown. Zayin says \\\"z.\\\"\", \"q\": \"This letter is Zayin. Tap the Zayin.\", \"pic\": \"\\u05d6\", \"o\": [\"\\u05d6\", \"\\u05d5\", \"\\u05d3\"]}, {\"how\": \"Ches looks like Hei, but look at the left leg. In Hei, the left leg does not touch the roof. In Ches, both legs hold up the roof. Ches says \\\"ch,\\\" a sound from the back of the throat, like the start of Chanukah.\", \"q\": \"This letter is Ches. Tap the Ches.\", \"pic\": \"\\u05d7\", \"o\": [\"\\u05d7\", \"\\u05d4\", \"\\u05d3\"]}, {\"how\": \"Tes is round at the bottom, like a basket, and its right side curls in at the top. Tes says \\\"t.\\\" Yud is the smallest letter of all. It floats high, like a little flag. Yud says \\\"y.\\\"\", \"q\": \"This letter is Yud. Tap the Yud.\", \"pic\": \"\\u05d9\", \"o\": [\"\\u05d9\", \"\\u05d5\", \"\\u05d8\"]}], \"practice\": [{\"q\": \"Which one is Vav?\", \"o\": [\"\\u05d5\", \"\\u05d6\", \"\\u05d9\"], \"h\": \"Vav is a tall line with a little head that bends to one side. Zayin has a crown. Yud is short.\"}, {\"q\": \"Which one is Tes?\", \"o\": [\"\\u05d8\", \"\\u05d7\", \"\\u05d4\"], \"h\": \"Tes is round at the bottom, like a basket.\"}, {\"q\": \"Which letter says \\\"z\\\"?\", \"o\": [\"\\u05d6\", \"\\u05d5\", \"\\u05d9\"], \"h\": \"Zayin says \\\"z.\\\" Look for the little crown on top.\"}, {\"q\": \"Which letter says \\\"ch\\\"?\", \"o\": [\"\\u05d7\", \"\\u05d4\", \"\\u05d8\"], \"h\": \"Ches says \\\"ch.\\\" Both of its legs touch the roof.\"}, {\"q\": \"Which letter says \\\"y\\\"?\", \"o\": [\"\\u05d9\", \"\\u05d5\", \"\\u05d6\"], \"h\": \"Yud says \\\"y.\\\" It is the smallest letter.\"}, {\"t\": \"order\", \"q\": \"Put the letters in Aleph-Beis order. Start with Vav.\", \"tiles\": [\"\\u05d5\", \"\\u05d6\", \"\\u05d7\"], \"h\": \"Vav, then Zayin, then Ches.\"}], \"check\": [{\"q\": \"Which one is Ches?\", \"o\": [\"\\u05d7\", \"\\u05d4\", \"\\u05d3\"]}, {\"q\": \"Which letter says \\\"t\\\"?\", \"o\": [\"\\u05d8\", \"\\u05d3\", \"\\u05d7\"]}, {\"t\": \"order\", \"q\": \"Put the letters in Aleph-Beis order. Start with Ches.\", \"tiles\": [\"\\u05d7\", \"\\u05d8\", \"\\u05d9\"]}]}, \"LK.KRI.L01.02.a\": {\"name\": \"Aleph-Beis 3: Kaf to Mem\", \"teach\": [{\"how\": \"Kaf is round, like a cup lying on its side, open on the left. Kaf has a dot inside and says \\\"k.\\\" Without the dot it is Chaf, and it says \\\"ch,\\\" just like Ches. Remember Beis? Beis has a little corner sticking out at the bottom. Kaf is round all the way, with no corner.\", \"q\": \"This letter is Kaf, with the dot. Tap the Kaf.\", \"pic\": \"\\u05db\\u05bc\", \"o\": [\"\\u05db\\u05bc\", \"\\u05d1\\u05bc\", \"\\u05db\"]}, {\"how\": \"Lamed is the tallest letter. It reaches up above all the other letters, like a tall tower. Lamed says \\\"l.\\\"\", \"q\": \"This letter is Lamed. Tap the Lamed.\", \"pic\": \"\\u05dc\", \"o\": [\"\\u05dc\", \"\\u05d5\", \"\\u05d6\"]}, {\"how\": \"Mem has a round back and a little opening at the bottom, on the left side. Mem says \\\"m.\\\"\", \"q\": \"This letter is Mem. Tap the Mem.\", \"pic\": \"\\u05de\", \"o\": [\"\\u05de\", \"\\u05d8\", \"\\u05db\"]}], \"practice\": [{\"q\": \"Which one is Chaf, with no dot?\", \"o\": [\"\\u05db\", \"\\u05db\\u05bc\", \"\\u05d1\\u05bc\"], \"h\": \"Look in the middle. Chaf is empty inside. Kaf has a dot.\"}, {\"q\": \"Which letter says \\\"l\\\"?\", \"o\": [\"\\u05dc\", \"\\u05d5\", \"\\u05d9\"], \"h\": \"Lamed says \\\"l.\\\" It is the tallest letter.\"}, {\"q\": \"Which one is Kaf, with the dot?\", \"o\": [\"\\u05db\\u05bc\", \"\\u05d1\\u05bc\", \"\\u05db\"], \"h\": \"Kaf is round at the bottom, with no corner, and has a dot. Beis has a corner.\"}, {\"q\": \"Which letter says \\\"m\\\"?\", \"o\": [\"\\u05de\", \"\\u05d8\", \"\\u05dc\"], \"h\": \"Mem says \\\"m.\\\" Look for the little opening at the bottom.\"}, {\"q\": \"Which letter says \\\"k\\\"?\", \"o\": [\"\\u05db\\u05bc\", \"\\u05db\", \"\\u05d1\\u05bc\"], \"h\": \"Kaf with the dot says \\\"k.\\\" Without the dot it says \\\"ch.\\\"\"}, {\"t\": \"order\", \"q\": \"Put the letters in Aleph-Beis order. Start with Kaf.\", \"tiles\": [\"\\u05db\\u05bc\", \"\\u05dc\", \"\\u05de\"], \"h\": \"Kaf, then Lamed, then Mem.\"}], \"check\": [{\"q\": \"Which one is Mem?\", \"o\": [\"\\u05de\", \"\\u05d8\", \"\\u05db\"]}, {\"q\": \"Which one is Lamed?\", \"o\": [\"\\u05dc\", \"\\u05d6\", \"\\u05d5\"]}, {\"t\": \"order\", \"q\": \"Put the letters in Aleph-Beis order. Start with Yud.\", \"tiles\": [\"\\u05d9\", \"\\u05db\\u05bc\", \"\\u05dc\"]}]}, \"LK.KRI.L01.02.b\": {\"name\": \"Aleph-Beis 4: Nun to Fei\", \"teach\": [{\"how\": \"Nun looks like Gimmel, but it has no foot. Its bottom is flat and smooth. Nun says \\\"n.\\\" Samech is round and closed all the way around, like a circle. Samech says \\\"s.\\\"\", \"q\": \"This letter is Samech. Tap the Samech.\", \"pic\": \"\\u05e1\", \"o\": [\"\\u05e1\", \"\\u05de\", \"\\u05d8\"]}, {\"how\": \"Ayin has two arms reaching up, joined at the bottom. Like Aleph, Ayin makes no sound by itself. It waits for a nekudah.\", \"q\": \"This letter is Ayin. Tap the Ayin.\", \"pic\": \"\\u05e2\", \"o\": [\"\\u05e2\", \"\\u05d8\", \"\\u05e1\"]}, {\"how\": \"Pei has a mouth with a little tongue curling inside. With a dot, it is Pei and says \\\"p.\\\" Without the dot it is Fei and says \\\"f.\\\" Dot: Pei, p. No dot: Fei, f.\", \"q\": \"This letter is Pei, with the dot. Tap the Pei.\", \"pic\": \"\\u05e4\\u05bc\", \"o\": [\"\\u05e4\\u05bc\", \"\\u05e4\", \"\\u05db\\u05bc\"]}], \"practice\": [{\"q\": \"Which one is Nun?\", \"o\": [\"\\u05e0\", \"\\u05d2\", \"\\u05db\"], \"h\": \"Nun has a flat bottom with no foot. Gimmel has a foot.\"}, {\"q\": \"Which letter says \\\"f\\\"?\", \"o\": [\"\\u05e4\", \"\\u05e4\\u05bc\", \"\\u05d1\\u05bc\"], \"h\": \"Fei has no dot and says \\\"f.\\\" Pei has a dot and says \\\"p.\\\"\"}, {\"q\": \"Which one is Ayin?\", \"o\": [\"\\u05e2\", \"\\u05d8\", \"\\u05e1\"], \"h\": \"Ayin has two arms reaching up.\"}, {\"q\": \"Which letter says \\\"s\\\"?\", \"o\": [\"\\u05e1\", \"\\u05de\", \"\\u05d8\"], \"h\": \"Samech says \\\"s.\\\" It is round and closed all the way around.\"}, {\"q\": \"Which letter says \\\"p\\\"?\", \"o\": [\"\\u05e4\\u05bc\", \"\\u05e4\", \"\\u05db\\u05bc\"], \"h\": \"Pei with the dot says \\\"p.\\\"\"}, {\"t\": \"order\", \"q\": \"Put the letters in Aleph-Beis order. Start with Nun.\", \"tiles\": [\"\\u05e0\", \"\\u05e1\", \"\\u05e2\"], \"h\": \"Nun, then Samech, then Ayin.\"}], \"check\": [{\"q\": \"Which one is Fei, with no dot?\", \"o\": [\"\\u05e4\", \"\\u05e4\\u05bc\", \"\\u05db\"]}, {\"q\": \"Which letter says \\\"n\\\"?\", \"o\": [\"\\u05e0\", \"\\u05d2\", \"\\u05d5\"]}, {\"t\": \"order\", \"q\": \"Put the letters in Aleph-Beis order. Start with Samech.\", \"tiles\": [\"\\u05e1\", \"\\u05e2\", \"\\u05e4\\u05bc\"]}]}, \"LK.KRI.L01.02.c\": {\"name\": \"Aleph-Beis 5: Tzadi to Reish\", \"teach\": [{\"how\": \"Tzadi has a little arm on top, and its back bends down into a flat base. Tzadi says \\\"tz,\\\" like the end of the word \\\"cats.\\\"\", \"q\": \"This letter is Tzadi. Tap the Tzadi.\", \"pic\": \"\\u05e6\", \"o\": [\"\\u05e6\", \"\\u05e2\", \"\\u05d8\"]}, {\"how\": \"Kuf has a roof like Hei, and its left leg drops down below the line. Kuf says \\\"k,\\\" just like Kaf.\", \"q\": \"This letter is Kuf. Tap the Kuf.\", \"pic\": \"\\u05e7\", \"o\": [\"\\u05e7\", \"\\u05d4\", \"\\u05d7\"]}, {\"how\": \"Reish looks like Daled, but look at the corner. Daled has a sharp corner that sticks out. Reish has a smooth, round corner. Reish says \\\"r.\\\"\", \"q\": \"This letter is Reish. Tap the Reish.\", \"pic\": \"\\u05e8\", \"o\": [\"\\u05e8\", \"\\u05d3\", \"\\u05db\"]}], \"practice\": [{\"q\": \"Which one is Reish?\", \"o\": [\"\\u05e8\", \"\\u05d3\", \"\\u05d5\"], \"h\": \"Reish has a smooth, round corner. Daled has a sharp corner.\"}, {\"q\": \"Which one is Kuf?\", \"o\": [\"\\u05e7\", \"\\u05d4\", \"\\u05d7\"], \"h\": \"Kuf has a leg that goes down below the line.\"}, {\"q\": \"Which letter says \\\"tz\\\"?\", \"o\": [\"\\u05e6\", \"\\u05e1\", \"\\u05e2\"], \"h\": \"Tzadi says \\\"tz.\\\" It has a little arm on top and a flat base.\"}, {\"q\": \"Which letter says \\\"r\\\"?\", \"o\": [\"\\u05e8\", \"\\u05d3\", \"\\u05d4\"], \"h\": \"Reish says \\\"r.\\\" Find the round corner.\"}, {\"q\": \"Which one is Tzadi?\", \"o\": [\"\\u05e6\", \"\\u05e2\", \"\\u05d8\"], \"h\": \"Tzadi has a little arm on top and a flat base at the bottom.\"}, {\"t\": \"order\", \"q\": \"Put the letters in Aleph-Beis order. Start with Tzadi.\", \"tiles\": [\"\\u05e6\", \"\\u05e7\", \"\\u05e8\"], \"h\": \"Tzadi, then Kuf, then Reish.\"}], \"check\": [{\"q\": \"Which one is Daled, with the sharp corner?\", \"o\": [\"\\u05d3\", \"\\u05e8\", \"\\u05d4\"]}, {\"q\": \"Which of these letters says \\\"k\\\"?\", \"o\": [\"\\u05e7\", \"\\u05d7\", \"\\u05d4\"]}, {\"t\": \"order\", \"q\": \"Put the letters in Aleph-Beis order. Start with Pei.\", \"tiles\": [\"\\u05e4\\u05bc\", \"\\u05e6\", \"\\u05e7\"]}]}, \"LK.KRI.L01.02.d\": {\"name\": \"Aleph-Beis 6: Shin to Sav\", \"teach\": [{\"how\": \"Shin has three heads on top, like three branches. When the dot is on the right head, it is Shin and says \\\"sh.\\\" When the dot is on the left head, it is Sin and says \\\"s.\\\"\", \"q\": \"This letter is Shin, with the dot on the right. Tap the Shin.\", \"pic\": \"\\u05e9\\u05c1\", \"o\": [\"\\u05e9\\u05c1\", \"\\u05e9\\u05c2\", \"\\u05e2\"]}, {\"how\": \"Here is Sin, with the dot on the left head. Sin says \\\"s,\\\" just like Samech.\", \"q\": \"This letter is Sin, with the dot on the left. Tap the Sin.\", \"pic\": \"\\u05e9\\u05c2\", \"o\": [\"\\u05e9\\u05c2\", \"\\u05e9\\u05c1\", \"\\u05e6\"]}, {\"how\": \"Tav is the last letter of the Aleph-Beis. It has a roof and two legs, and the left leg has a little foot at the bottom. With a dot, it is Tav and says \\\"t.\\\" With no dot, it is Sav and says \\\"s.\\\"\", \"q\": \"This letter is Tav, with the dot. Tap the Tav.\", \"pic\": \"\\u05ea\\u05bc\", \"o\": [\"\\u05ea\\u05bc\", \"\\u05d7\", \"\\u05d4\"]}], \"practice\": [{\"q\": \"Which letter says \\\"sh\\\"?\", \"o\": [\"\\u05e9\\u05c1\", \"\\u05e9\\u05c2\", \"\\u05e1\"], \"h\": \"The dot on the right head makes Shin, and Shin says \\\"sh.\\\"\"}, {\"q\": \"Which one is Sav, with no dot?\", \"o\": [\"\\u05ea\", \"\\u05ea\\u05bc\", \"\\u05d7\"], \"h\": \"Look for the little foot, and no dot inside. That is Sav.\"}, {\"q\": \"Which one is Tav?\", \"o\": [\"\\u05ea\\u05bc\", \"\\u05d7\", \"\\u05d4\"], \"h\": \"Tav has a little foot at the bottom of its left leg, and a dot.\"}, {\"q\": \"Which one is Sin?\", \"o\": [\"\\u05e9\\u05c2\", \"\\u05e9\\u05c1\", \"\\u05e2\"], \"h\": \"Sin has its dot on the left head.\"}, {\"q\": \"Which of these letters says \\\"t\\\"?\", \"o\": [\"\\u05ea\\u05bc\", \"\\u05d7\", \"\\u05d4\"], \"h\": \"Tav with the dot says \\\"t.\\\" Look for the little foot.\"}, {\"t\": \"order\", \"q\": \"Put the letters in Aleph-Beis order. Start with Reish.\", \"tiles\": [\"\\u05e8\", \"\\u05e9\\u05c1\", \"\\u05ea\\u05bc\"], \"h\": \"Reish, then Shin, then Tav, the last letter.\"}], \"check\": [{\"q\": \"Which one is Shin?\", \"o\": [\"\\u05e9\\u05c1\", \"\\u05e9\\u05c2\", \"\\u05e2\"]}, {\"q\": \"Which of these letters says \\\"s\\\"?\", \"o\": [\"\\u05e9\\u05c2\", \"\\u05e9\\u05c1\", \"\\u05ea\\u05bc\"]}, {\"t\": \"order\", \"q\": \"Put the letters in Aleph-Beis order. Start with Kuf.\", \"tiles\": [\"\\u05e7\", \"\\u05e8\", \"\\u05ea\\u05bc\"]}]}, \"LK.KRI.L01.03.a\": {\"name\": \"Aleph-Beis 7: The Final Letters\", \"teach\": [{\"how\": \"Five letters change their shape when they come at the end of a word. They are called the final letters, the sofios. Nun sofis is a long straight line that drops down below the line. Chaf sofis is Chaf with its back stretched straight down, below the line too.\", \"q\": \"This letter is Nun sofis. Tap the Nun sofis.\", \"pic\": \"\\u05df\", \"o\": [\"\\u05df\", \"\\u05d5\", \"\\u05da\"]}, {\"how\": \"Mem sofis is closed all the way around, like a little box with square corners. Samech is round. Mem sofis is square.\", \"q\": \"This letter is Mem sofis. Tap the Mem sofis.\", \"pic\": \"\\u05dd\", \"o\": [\"\\u05dd\", \"\\u05e1\", \"\\u05de\"]}, {\"how\": \"Fei sofis and Tzadi sofis also drop down below the line. Fei sofis keeps the little tongue inside, like Fei. Tzadi sofis keeps the little arm on top, like Tzadi.\", \"q\": \"This letter is Tzadi sofis. Tap the Tzadi sofis.\", \"pic\": \"\\u05e5\", \"o\": [\"\\u05e5\", \"\\u05e3\", \"\\u05da\"]}], \"practice\": [{\"q\": \"Which one is Chaf sofis?\", \"o\": [\"\\u05da\", \"\\u05df\", \"\\u05e8\"], \"h\": \"Chaf sofis has a roof and a back that drops down below the line. Nun sofis is just one long line.\"}, {\"q\": \"Which one is Mem sofis?\", \"o\": [\"\\u05dd\", \"\\u05e1\", \"\\u05de\"], \"h\": \"Mem sofis is closed like a box, with square corners.\"}, {\"q\": \"Which one is Fei sofis?\", \"o\": [\"\\u05e3\", \"\\u05e5\", \"\\u05e4\"], \"h\": \"Fei sofis has the little tongue inside, and drops below the line.\"}, {\"q\": \"Nun sofis is the end-of-word shape of which letter?\", \"pic\": \"\\u05df\", \"o\": [\"\\u05e0\", \"\\u05d5\", \"\\u05d2\"], \"h\": \"Nun sofis belongs to Nun.\"}, {\"q\": \"Tap the final letter that belongs to Tzadi.\", \"pic\": \"\\u05e6\", \"o\": [\"\\u05e5\", \"\\u05e3\", \"\\u05da\"], \"h\": \"Look for the little arm on top, like Tzadi.\"}, {\"q\": \"Tap the final letter that belongs to Mem.\", \"pic\": \"\\u05de\", \"o\": [\"\\u05dd\", \"\\u05e1\", \"\\u05df\"], \"h\": \"Mem sofis is closed like a box.\"}], \"check\": [{\"q\": \"Which one is Tzadi sofis?\", \"o\": [\"\\u05e5\", \"\\u05e3\", \"\\u05df\"]}, {\"q\": \"Which one is Nun sofis?\", \"o\": [\"\\u05df\", \"\\u05d5\", \"\\u05d6\"]}, {\"q\": \"Tap the final letter that belongs to Chaf.\", \"pic\": \"\\u05db\", \"o\": [\"\\u05da\", \"\\u05df\", \"\\u05e3\"]}]}, \"LK.KRI.L01.04.a\": {\"name\": \"Aleph-Beis 8: The Whole Aleph-Beis\", \"teach\": [{\"how\": \"You have learned every letter of the Aleph-Beis, from Aleph to Tav. That is a real simcha! Today we review them all, and we practice the letters that look alike, so you never mix them up.\", \"q\": \"Find the first letter of the Aleph-Beis.\", \"o\": [\"\\u05d0\", \"\\u05e2\", \"\\u05ea\"]}, {\"how\": \"Letters that look alike: Beis has a corner at the bottom; Kaf is round. Daled has a sharp corner; Reish is round. Hei has a left leg that floats; Ches has both legs on the roof; Tav has a little foot.\", \"q\": \"Find the Tav, with the little foot.\", \"o\": [\"\\u05ea\\u05bc\", \"\\u05d7\", \"\\u05d4\"]}, {\"how\": \"Three closed-in letters: Samech is round and closed. Mem sofis is square and closed. Tes is open at the top.\", \"q\": \"Find the Samech, round and closed.\", \"o\": [\"\\u05e1\", \"\\u05dd\", \"\\u05d8\"]}], \"practice\": [{\"q\": \"Find the Reish.\", \"o\": [\"\\u05e8\", \"\\u05d3\", \"\\u05db\"], \"h\": \"Reish has a round corner. Daled has a sharp corner.\"}, {\"q\": \"Find the Beis.\", \"o\": [\"\\u05d1\\u05bc\", \"\\u05db\\u05bc\", \"\\u05e4\\u05bc\"], \"h\": \"Beis has a corner at the bottom, and a dot.\"}, {\"q\": \"Find the Gimmel.\", \"o\": [\"\\u05d2\", \"\\u05e0\", \"\\u05e6\"], \"h\": \"Gimmel has a little foot that kicks out.\"}, {\"q\": \"Find the Ches.\", \"o\": [\"\\u05d7\", \"\\u05d4\", \"\\u05ea\"], \"h\": \"Ches has both legs touching the roof, and no foot.\"}, {\"q\": \"Find the last letter of the Aleph-Beis.\", \"o\": [\"\\u05ea\\u05bc\", \"\\u05e9\\u05c1\", \"\\u05e8\"], \"h\": \"The Aleph-Beis ends with Tav.\"}, {\"t\": \"order\", \"q\": \"Put these letters in Aleph-Beis order. Start with Aleph.\", \"tiles\": [\"\\u05d0\", \"\\u05d4\", \"\\u05d8\", \"\\u05dc\"], \"h\": \"Aleph, then Hei, then Tes, then Lamed.\"}], \"check\": [{\"q\": \"Find the Vav.\", \"o\": [\"\\u05d5\", \"\\u05d6\", \"\\u05df\"]}, {\"q\": \"Find the Mem sofis.\", \"o\": [\"\\u05dd\", \"\\u05e1\", \"\\u05d8\"]}, {\"t\": \"order\", \"q\": \"Put these letters in Aleph-Beis order. Start with Lamed.\", \"tiles\": [\"\\u05dc\", \"\\u05e1\", \"\\u05e6\", \"\\u05ea\\u05bc\"]}]}, \"LK.KRI.L01.05.a\": {\"name\": \"Dot Letters 1: the House Letter and the Round Letter\", \"band\": \"K\", \"peg\": {\"kind\": \"picture\", \"show\": \"Dot inside: stop! No dot: flow.\", \"say\": \"Stop or Flow: a dot inside the house letter or the round letter is a stop sign. The sound stops quick. With no dot, the sound flows like the wind.\"}, \"teach\": [{\"how\": \"Opener: here is a real pasuk from the Torah, from the hungry years in Yosef's time: the famine was heavy in the land. Find the house letters. Peek inside each one.\", \"t\": \"type\", \"q\": \"Dots 1. How many house letters have a dot inside?\", \"pic\": \"\\u05d5\\u05b0\\u05d4\\u05b8\\u05e8\\u05b8\\u05e2\\u05b8\\u05d1 \\u05db\\u05bc\\u05b8\\u05d1\\u05b5\\u05d3 \\u05d1\\u05bc\\u05b8\\u05d0\\u05b8\\u05bd\\u05e8\\u05b6\\u05e5\\u05c3\", \"a\": \"1\", \"alt\": [\"one\"], \"kb\": \"num\"}, {\"how\": \"A house letter with a dot inside stops quick: b! Take the dot away and the sound flows: vvv.\", \"q\": \"Dots 1. Look at the first letter. What sound does it make?\", \"pic\": \"\\u05d1\\u05bc\\u05b8\\u05d0\\u05b8\\u05bd\\u05e8\\u05b6\\u05e5\", \"o\": [\"b\", \"v\", \"k\"]}, {\"how\": \"The round letter works the same way. A dot inside stops quick: k! No dot, and it flows, like clearing your throat: ch.\", \"t\": \"sort\", \"q\": \"Dots 1. Sort by the first letter: dot or no dot?\", \"bins\": [{\"id\": \"D\", \"label\": \"a dot inside\"}, {\"id\": \"N\", \"label\": \"no dot\"}], \"items\": [{\"label\": \"\\u05db\\u05bc\\u05b8\\u05d1\\u05b5\\u05d3\", \"bin\": \"D\"}, {\"label\": \"\\u05d1\\u05b8\\u05e0\\u05b8\\u05d9\\u05d5\", \"bin\": \"N\"}, {\"label\": \"\\u05d1\\u05bc\\u05b7\\u05db\\u05bc\\u05b6\\u05e1\\u05b6\\u05e3\", \"bin\": \"D\"}, {\"label\": \"\\u05db\\u05b7\\u05d9\\u05bc\\u05d5\\u05b9\\u05dd\", \"bin\": \"N\"}, {\"label\": \"\\u05db\\u05bc\\u05b4\\u05d9\", \"bin\": \"D\"}, {\"label\": \"\\u05d1\\u05b0\\u05e0\\u05b5\\u05d9\", \"bin\": \"N\"}]}], \"we\": [{\"q\": \"Dots 1. Which word starts with a round letter with a dot?\", \"o\": [\"\\u05db\\u05bc\\u05b4\\u05d9\", \"\\u05d0\\u05b8\\u05e0\\u05b9\\u05db\\u05b4\\u05d9\", \"\\u05d5\\u05b0\\u05d4\\u05b8\\u05e8\\u05b8\\u05e2\\u05b8\\u05d1\"], \"steps\": [\"The round letter is round on the right and open on the left.\", \"Look at the first letter of each word, on the right side.\", \"Find the round letter with a dot inside.\"]}, {\"t\": \"pairs\", \"q\": \"Dots 1. Match each word to the sound of its first letter.\", \"pairs\": [[\"\\u05db\\u05bc\\u05b8\\u05d1\\u05b5\\u05d3\", \"k\"], [\"\\u05d1\\u05bc\\u05b8\\u05d0\\u05b8\\u05bd\\u05e8\\u05b6\\u05e5\", \"b\"], [\"\\u05d1\\u05b8\\u05e0\\u05b8\\u05d9\\u05d5\", \"v\"], [\"\\u05db\\u05b7\\u05d9\\u05bc\\u05d5\\u05b9\\u05dd\", \"ch\"]], \"steps\": [\"Look at the first letter of each word, on the right side.\", \"Is it the house letter or the round letter?\", \"A dot inside stops the sound. No dot lets it flow.\"]}], \"practice\": [{\"t\": \"spotall\", \"q\": \"Dots 1. Tap every word whose first letter has a dot inside.\", \"cells\": [{\"label\": \"\\u05d1\\u05bc\\u05b7\\u05db\\u05bc\\u05b6\\u05e1\\u05b6\\u05e3\", \"ok\": true}, {\"label\": \"\\u05d1\\u05b8\\u05e0\\u05b8\\u05d9\\u05d5\", \"ok\": false}, {\"label\": \"\\u05db\\u05bc\\u05b4\\u05d9\", \"ok\": true}, {\"label\": \"\\u05db\\u05b7\\u05d9\\u05bc\\u05d5\\u05b9\\u05dd\", \"ok\": false}, {\"label\": \"\\u05d1\\u05bc\\u05b7\\u05de\\u05bc\\u05b4\\u05e7\\u05b0\\u05e0\\u05b6\\u05d4\", \"ok\": true}, {\"label\": \"\\u05d1\\u05b0\\u05e0\\u05b5\\u05d9\", \"ok\": false}]}, {\"t\": \"order\", \"q\": \"Dots 1. Build the word, piece by piece.\", \"pic\": \"\\u05db\\u05bc\\u05b8\\u05d1\\u05b5\\u05d3\", \"tiles\": [\"\\u05db\\u05bc\\u05b8\", \"\\u05d1\\u05b5\", \"\\u05d3\"]}, {\"t\": \"type\", \"q\": \"Dots 1. How many house letters here have no dot?\", \"pic\": \"\\u05d5\\u05bc\\u05d1\\u05b7\\u05d6\\u05bc\\u05b8\\u05d4\\u05b8\\u05bd\\u05d1\", \"a\": \"2\", \"alt\": [\"two\"], \"kb\": \"num\"}, {\"t\": \"sort\", \"q\": \"Dots 1. Sort the words by the sound of the first letter.\", \"bins\": [{\"id\": \"b\", \"label\": \"b\"}, {\"id\": \"v\", \"label\": \"v\"}, {\"id\": \"k\", \"label\": \"k\"}, {\"id\": \"ch\", \"label\": \"ch\"}], \"items\": [{\"label\": \"\\u05d1\\u05bc\\u05b7\\u05db\\u05bc\\u05b6\\u05e1\\u05b6\\u05e3\", \"bin\": \"b\"}, {\"label\": \"\\u05d1\\u05b8\\u05e0\\u05b8\\u05d9\\u05d5\", \"bin\": \"v\"}, {\"label\": \"\\u05db\\u05bc\\u05b4\\u05d9\", \"bin\": \"k\"}, {\"label\": \"\\u05db\\u05b7\\u05d9\\u05bc\\u05d5\\u05b9\\u05dd\", \"bin\": \"ch\"}, {\"label\": \"\\u05d1\\u05bc\\u05b7\\u05de\\u05bc\\u05b4\\u05e7\\u05b0\\u05e0\\u05b6\\u05d4\", \"bin\": \"b\"}, {\"label\": \"\\u05db\\u05bc\\u05b5\\u05df\", \"bin\": \"k\"}]}, {\"t\": \"pairs\", \"q\": \"Dots 1. Match each word to its first sound.\", \"pairs\": [[\"\\u05d1\\u05bc\\u05b7\\u05de\\u05bc\\u05b4\\u05e7\\u05b0\\u05e0\\u05b6\\u05d4\", \"b\"], [\"\\u05db\\u05bc\\u05b7\\u05d0\\u05b2\\u05e9\\u05c1\\u05b6\\u05e8\", \"k\"], [\"\\u05d1\\u05b0\\u05e0\\u05b5\\u05d9\", \"v\"], [\"\\u05db\\u05d5\\u05bc\\u05e9\\u05c1\", \"ch\"]]}, {\"t\": \"spotall\", \"q\": \"Dots 1. Tap words with a round letter that has no dot.\", \"cells\": [{\"label\": \"\\u05d0\\u05b8\\u05e0\\u05b9\\u05db\\u05b4\\u05d9\", \"ok\": true}, {\"label\": \"\\u05dc\\u05b8\\u05db\\u05b6\\u05dd\", \"ok\": true}, {\"label\": \"\\u05db\\u05bc\\u05b4\\u05d9\", \"ok\": false}, {\"label\": \"\\u05db\\u05bc\\u05b8\\u05d1\\u05b5\\u05d3\", \"ok\": false}, {\"label\": \"\\u05d1\\u05bc\\u05b7\\u05db\\u05bc\\u05b6\\u05e1\\u05b6\\u05e3\", \"ok\": false}]}], \"check\": [{\"q\": \"Dots 1. What sound does the first letter make?\", \"pic\": \"\\u05d1\\u05b8\\u05e0\\u05b8\\u05d9\\u05d5\", \"o\": [\"v\", \"b\", \"k\"]}, {\"t\": \"order\", \"q\": \"Dots 1. Build this word, piece by piece.\", \"pic\": \"\\u05d1\\u05bc\\u05b7\\u05db\\u05bc\\u05b6\\u05e1\\u05b6\\u05e3\", \"tiles\": [\"\\u05d1\\u05bc\\u05b7\", \"\\u05db\\u05bc\\u05b6\", \"\\u05e1\\u05b6\", \"\\u05e3\"]}, {\"q\": \"Dots 1. Which word starts with a round letter that flows?\", \"o\": [\"\\u05db\\u05b7\\u05d9\\u05bc\\u05d5\\u05b9\\u05dd\", \"\\u05db\\u05bc\\u05b4\\u05d9\", \"\\u05db\\u05bc\\u05b7\\u05d0\\u05b2\\u05e9\\u05c1\\u05b6\\u05e8\"]}]}, \"LK.KRI.L01.05.b\": {\"name\": \"Dot Letters 2: the Curly Letter and the Foot Letter\", \"band\": \"K\", \"peg\": {\"kind\": \"picture\", \"show\": \"Dot inside: stop! No dot: flow.\", \"say\": \"Stop or Flow: the curly letter and the foot letter follow the same rule. A dot inside stops the sound quick. With no dot, the sound flows out.\"}, \"teach\": [{\"how\": \"Opener: here is a real pasuk from the Torah: Yaakov blessed Pharaoh, and then he went out from before Pharaoh. The name Pharaoh is written two times. Find the curly letter in each one.\", \"t\": \"type\", \"q\": \"Dots 2. How many curly letters have no dot inside?\", \"pic\": \"\\u05d5\\u05b7\\u05d9\\u05b0\\u05d1\\u05b8\\u05e8\\u05b6\\u05da\\u05b0 \\u05d9\\u05b7\\u05e2\\u05b2\\u05e7\\u05b9\\u05d1 \\u05d0\\u05b6\\u05ea\\u05be\\u05e4\\u05bc\\u05b7\\u05e8\\u05b0\\u05e2\\u05b9\\u05d4 \\u05da\\u05b8\", \"ok\": true}, {\"label\": \"\\u05dc\\u05b0\\u05d0\\u05d5\\u05b9\\u05ea \\u05e2\\u05b7\\u05dc\\u05be\\u05d9\\u05b8\\u05d3\\u05b6\\u05bd\\u05da\\u05b8\", \"ok\": false}, {\"label\": \"\\u05d5\\u05bc\\u05d1\\u05b0\\u05db\\u05b8\\u05dc\\u05be\\u05e0\\u05b7\\u05e4\\u05b0\\u05e9\\u05c1\\u05b0\\u05da\\u05b8\", \"ok\": true}, {\"label\": \"\\u05d1\\u05bc\\u05b5\\u05d9\\u05df \\u05e2\\u05b5\\u05d9\\u05e0\\u05b6\\u05bd\\u05d9\\u05da\\u05b8\", \"ok\": false}, {\"label\": \"\\u05d5\\u05bc\\u05d1\\u05b0\\u05db\\u05b8\\u05dc\\u05be\\u05de\\u05b0\\u05d0\\u05b9\\u05d3\\u05b6\\u05bd\\u05da\\u05b8\", \"ok\": true}, {\"label\": \"\\u05d5\\u05b0\\u05e9\\u05c1\\u05b4\\u05e0\\u05bc\\u05b7\\u05e0\\u05b0\\u05ea\\u05bc\\u05b8\\u05dd \\u05dc\\u05b0\\u05d1\\u05b8\\u05e0\\u05b6\\u05bd\\u05d9\\u05da\\u05b8\", \"ok\": false}]}, {\"t\": \"type\", \"q\": \"Shema 7. How many words are in this quiet line? Type it.\", \"pic\": \"\\u05d1\\u05bc\\u05b8\\u05e8\\u05d5\\u05bc\\u05da\\u05b0 \\u05e9\\u05c1\\u05b5\\u05dd \\u05db\\u05bc\\u05b0\\u05d1\\u05d5\\u05b9\\u05d3 \\u05de\\u05b7\\u05dc\\u05b0\\u05db\\u05d5\\u05bc\\u05ea\\u05d5\\u05b9 \\u05dc\\u05b0\\u05e2\\u05d5\\u05b9\\u05dc\\u05b8\\u05dd \\u05d5\\u05b8\\u05e2\\u05b6\\u05d3:\", \"a\": \"6\", \"alt\": [\"six\"], \"kb\": \"num\"}, {\"t\": \"order\", \"q\": \"Shema 8. Put these pieces in order: hand, eyes, door.\", \"tiles\": [\"\\u05d5\\u05bc\\u05e7\\u05b0\\u05e9\\u05c1\\u05b7\\u05e8\\u05b0\\u05ea\\u05bc\\u05b8\\u05dd \\u05dc\\u05b0\\u05d0\\u05d5\\u05b9\\u05ea \\u05e2\\u05b7\\u05dc\\u05be\\u05d9\\u05b8\\u05d3\\u05b6\\u05bd\\u05da\\u05b8\", \"\\u05d5\\u05b0\\u05d4\\u05b8\\u05d9\\u05d5\\u05bc \\u05dc\\u05b0\\u05d8\\u05b9\\u05d8\\u05b8\\u05e4\\u05b9\\u05ea \\u05d1\\u05bc\\u05b5\\u05d9\\u05df \\u05e2\\u05b5\\u05d9\\u05e0\\u05b6\\u05bd\\u05d9\\u05da\\u05b8\", \"\\u05d5\\u05bc\\u05db\\u05b0\\u05ea\\u05b7\\u05d1\\u05b0\\u05ea\\u05bc\\u05b8\\u05dd \\u05e2\\u05b7\\u05dc\\u05be\\u05de\\u05b0\\u05d6\\u05bb\\u05d6\\u05d5\\u05b9\\u05ea \\u05d1\\u05bc\\u05b5\\u05d9\\u05ea\\u05b6\\u05bd\\u05da\\u05b8\"]}, {\"q\": \"Shema 9. Find the piece that means and with all your soul.\", \"pic\": \"\\u05d5\\u05b0\\u05d0\\u05b8\\u05d4\\u05b7\\u05d1\\u05b0\\u05ea\\u05bc\\u05b8 \\u05d0\\u05b5\\u05ea \\u05d4' \\u05d0\\u05b1\\u05dc\\u05b9\\u05e7\\u05b6\\u05bd\\u05d9\\u05da\\u05b8 \\u05d1\\u05bc\\u05b0\\u05db\\u05b8\\u05dc\\u05be\\u05dc\\u05b0\\u05d1\\u05b8\\u05d1\\u05b0\\u05da\\u05b8 \\u05d5\\u05bc\\u05d1\\u05b0\\u05db\\u05b8\\u05dc\\u05be\\u05e0\\u05b7\\u05e4\\u05b0\\u05e9\\u05c1\\u05b0\\u05da\\u05b8 \\u05d5\\u05bc\\u05d1\\u05b0\\u05db\\u05b8\\u05dc\\u05be\\u05de\\u05b0\\u05d0\\u05b9\\u05d3\\u05b6\\u05bd\\u05da\\u05b8:\", \"o\": [\"\\u05d5\\u05bc\\u05d1\\u05b0\\u05db\\u05b8\\u05dc\\u05be\\u05e0\\u05b7\\u05e4\\u05b0\\u05e9\\u05c1\\u05b0\\u05da\\u05b8\", \"\\u05d1\\u05bc\\u05b0\\u05db\\u05b8\\u05dc\\u05be\\u05dc\\u05b0\\u05d1\\u05b8\\u05d1\\u05b0\\u05da\\u05b8\", \"\\u05d5\\u05bc\\u05d1\\u05b0\\u05db\\u05b8\\u05dc\\u05be\\u05de\\u05b0\\u05d0\\u05b9\\u05d3\\u05b6\\u05bd\\u05da\\u05b8\"]}], \"check\": [{\"q\": \"Shema Check 1. Which words mean between your eyes?\", \"pic\": \"\\u05d5\\u05bc\\u05e7\\u05b0\\u05e9\\u05c1\\u05b7\\u05e8\\u05b0\\u05ea\\u05bc\\u05b8\\u05dd \\u05dc\\u05b0\\u05d0\\u05d5\\u05b9\\u05ea \\u05e2\\u05b7\\u05dc\\u05be\\u05d9\\u05b8\\u05d3\\u05b6\\u05bd\\u05da\\u05b8 \\u05d5\\u05b0\\u05d4\\u05b8\\u05d9\\u05d5\\u05bc \\u05dc\\u05b0\\u05d8\\u05b9\\u05d8\\u05b8\\u05e4\\u05b9\\u05ea \\u05d1\\u05bc\\u05b5\\u05d9\\u05df \\u05e2\\u05b5\\u05d9\\u05e0\\u05b6\\u05bd\\u05d9\\u05da\\u05b8:\", \"o\": [\"\\u05d1\\u05bc\\u05b5\\u05d9\\u05df \\u05e2\\u05b5\\u05d9\\u05e0\\u05b6\\u05bd\\u05d9\\u05da\\u05b8\", \"\\u05d5\\u05b0\\u05d4\\u05b8\\u05d9\\u05d5\\u05bc \\u05dc\\u05b0\\u05d8\\u05b9\\u05d8\\u05b8\\u05e4\\u05b9\\u05ea\", \"\\u05dc\\u05b0\\u05d0\\u05d5\\u05b9\\u05ea \\u05e2\\u05b7\\u05dc\\u05be\\u05d9\\u05b8\\u05d3\\u05b6\\u05bd\\u05da\\u05b8\"]}, {\"t\": \"order\", \"q\": \"Shema Check 2. Put these lines in Shema order.\", \"tiles\": [\"\\u05e9\\u05c1\\u05b0\\u05de\\u05b7\\u05e2 \\u05d9\\u05b4\\u05e9\\u05c2\\u05b0\\u05e8\\u05b8\\u05d0\\u05b5\\u05dc\", \"\\u05d1\\u05bc\\u05b8\\u05e8\\u05d5\\u05bc\\u05da\\u05b0 \\u05e9\\u05c1\\u05b5\\u05dd \\u05db\\u05bc\\u05b0\\u05d1\\u05d5\\u05b9\\u05d3 \\u05de\\u05b7\\u05dc\\u05b0\\u05db\\u05d5\\u05bc\\u05ea\\u05d5\\u05b9 \\u05dc\\u05b0\\u05e2\\u05d5\\u05b9\\u05dc\\u05b8\\u05dd \\u05d5\\u05b8\\u05e2\\u05b6\\u05d3\", \"\\u05d1\\u05bc\\u05b0\\u05db\\u05b8\\u05dc\\u05be\\u05dc\\u05b0\\u05d1\\u05b8\\u05d1\\u05b0\\u05da\\u05b8\"]}, {\"q\": \"Shema Check 3. Which word means new?\", \"pic\": \"\\u05e9\\u05c1\\u05b4\\u05d9\\u05e8\\u05b8\\u05d4 \\u05d7\\u05b2\\u05d3\\u05b8\\u05e9\\u05c1\\u05b8\\u05d4 \\u05e9\\u05c1\\u05b4\\u05d1\\u05bc\\u05b0\\u05d7\\u05d5\\u05bc \\u05d2\\u05b0\\u05d0\\u05d5\\u05bc\\u05dc\\u05b4\\u05d9\\u05dd \\u05dc\\u05b0\\u05e9\\u05c1\\u05b4\\u05de\\u05b0\\u05da\\u05b8 \\u05e2\\u05b7\\u05dc\\u05be\\u05e9\\u05c2\\u05b0\\u05e4\\u05b7\\u05ea \\u05d4\\u05b7\\u05d9\\u05bc\\u05b8\\u05dd \\u05d9\\u05b7\\u05bd\\u05d7\\u05b7\\u05d3 \\u05db\\u05bc\\u05bb\\u05dc\\u05bc\\u05b8\\u05dd \\u05d4\\u05d5\\u05b9\\u05d3\\u05d5\\u05bc \\u05d5\\u05b0\\u05d4\\u05b4\\u05de\\u05b0\\u05dc\\u05b4\\u05bd\\u05d9\\u05db\\u05d5\\u05bc \\u05d5\\u05b0\\u05d0\\u05b8\\u05de\\u05b0\\u05e8\\u05d5\\u05bc:\", \"o\": [\"\\u05d7\\u05b2\\u05d3\\u05b8\\u05e9\\u05c1\\u05b8\\u05d4\", \"\\u05e9\\u05c1\\u05b4\\u05d9\\u05e8\\u05b8\\u05d4\", \"\\u05d2\\u05b0\\u05d0\\u05d5\\u05bc\\u05dc\\u05b4\\u05d9\\u05dd\"]}]}, \"LK.KRI.L03.09.a\": {\"name\": \"Kriyah 3-9: Shemoneh Esrei\", \"band\": \"2\", \"peg\": {\"kind\": \"picture\", \"show\": \"Know where you are on the map.\", \"say\": \"Bracha Map: Shemoneh Esrei is like a map. First we praise, then we ask, and at the end we ask for peace. Know where you are, then read.\"}, \"teach\": [{\"how\": \"Opener: in Shemoneh Esrei we stand quietly, like servants before a King. The first bracha is about our Avos. It ends with the words Shield of Abraham.\", \"q\": \"Shemoneh Esrei 1. Which word means shield?\", \"pic\": \"\\u05d1\\u05bc\\u05b8\\u05e8\\u05d5\\u05bc\\u05da\\u05b0 \\u05d0\\u05b7\\u05ea\\u05bc\\u05b8\\u05d4 \\u05d4' \\u05de\\u05b8\\u05d2\\u05b5\\u05df \\u05d0\\u05b7\\u05d1\\u05b0\\u05e8\\u05b8\\u05d4\\u05b8\\u05dd:\", \"o\": [\"\\u05de\\u05b8\\u05d2\\u05b5\\u05df\", \"\\u05d0\\u05b7\\u05d1\\u05b0\\u05e8\\u05b8\\u05d4\\u05b8\\u05dd\", \"\\u05d1\\u05bc\\u05b8\\u05e8\\u05d5\\u05bc\\u05da\\u05b0\"]}, {\"how\": \"On a weekday we ask Hashem for what we need. The first asks go in this order: knowing, coming back to Hashem, being forgiven, being saved, being healed.\", \"t\": \"order\", \"q\": \"Shemoneh Esrei 2. Put these bracha ends in order.\", \"tiles\": [\"\\u05d7\\u05d5\\u05b9\\u05e0\\u05b5\\u05df \\u05d4\\u05b7\\u05d3\\u05bc\\u05b8\\u05bd\\u05e2\\u05b7\\u05ea\", \"\\u05d4\\u05b8\\u05e8\\u05d5\\u05b9\\u05e6\\u05b6\\u05d4 \\u05d1\\u05bc\\u05b4\\u05ea\\u05b0\\u05e9\\u05c1\\u05d5\\u05bc\\u05d1\\u05b8\\u05d4\", \"\\u05d7\\u05b7\\u05e0\\u05bc\\u05d5\\u05bc\\u05df \\u05d4\\u05b7\\u05de\\u05bc\\u05b7\\u05e8\\u05b0\\u05d1\\u05bc\\u05b6\\u05d4 \\u05dc\\u05b4\\u05e1\\u05b0\\u05dc\\u05bd\\u05d5\\u05b9\\u05d7\\u05b7\", \"\\u05d2\\u05bc\\u05d5\\u05b9\\u05d0\\u05b5\\u05dc \\u05d9\\u05b4\\u05e9\\u05c2\\u05b0\\u05e8\\u05b8\\u05d0\\u05b5\\u05dc\", \"\\u05e8\\u05d5\\u05b9\\u05e4\\u05b5\\u05d0 \\u05d7\\u05d5\\u05b9\\u05dc\\u05b5\\u05d9 \\u05e2\\u05b7\\u05de\\u05bc\\u05d5\\u05b9 \\u05d9\\u05b4\\u05e9\\u05c2\\u05b0\\u05e8\\u05b8\\u05d0\\u05b5\\u05dc\"]}, {\"how\": \"The first brachos praise Hashem. The middle brachos ask Hashem for what we need. Read each end and put it on the map.\", \"t\": \"sort\", \"q\": \"Shemoneh Esrei 3. Sort each end: praise or ask?\", \"bins\": [{\"id\": \"P\", \"label\": \"first part: we praise\"}, {\"id\": \"A\", \"label\": \"middle part: we ask\"}], \"items\": [{\"label\": \"\\u05de\\u05b8\\u05d2\\u05b5\\u05df \\u05d0\\u05b7\\u05d1\\u05b0\\u05e8\\u05b8\\u05d4\\u05b8\\u05dd\", \"bin\": \"P\"}, {\
