{ const F5={"ELEC.FWORLD.L05.01":{"name":"Countries and Capitals","task":"Make capital flash cards: the country on the front, the capital on the back. Quiz a friend.","teach":[{"how":"A country is a nation with its own leaders and borders. Its capital is the city where its government meets. Use the Capital Clue rhyme: Paris for France, London for England, Tokyo for Japan, Ottawa for Canada.","q":"What is the capital of France?","pic":"🗼","o":["Paris","London","Rome","Madrid"]},{"how":"Washington, D.C. is the capital of the United States. Congress, the President and the Supreme Court all work there.","q":"What is the capital of the United States?","pic":"🏛️","o":["Washington, D.C.","New York City","Baltimore","Philadelphia, Pennsylvania"]},{"how":"Canada is the big country north of the United States. Its capital is Ottawa, not Toronto, even though Toronto is bigger.","q":"What is the capital of Canada?","pic":"🍁","o":["Ottawa","Toronto","Montreal","Vancouver"]}],"practice":[{"q":"What is the capital of Japan?","pic":"🗾","h":"Say the peg.","o":["Tokyo","Beijing","Seoul","Paris"]},{"q":"What is the capital of England?","pic":"🕰️","h":"Big Ben clock tower.","o":["London","Paris","Dublin","Berlin"]},{"q":"Put the countries in the order of the peg: Japan, France, Canada, England.","h":"Say the peg out loud.","t":"order","tiles":["France","England","Japan","Canada"]},{"q":"Look at this list: Tokyo, Texas, Paris, Alaska, Ottawa. How many are capitals of countries?","h":"Two of these are states.","t":"num","a":3},{"q":"What is the capital of Mexico?","pic":"🌮","h":"The name repeats.","o":["Mexico City","Cancun","Rio de Janeiro","Lima"]},{"q":"Shimon's uncle flies to the capital of Japan. Which city does he land in?","pic":"✈️","h":"Say the peg.","o":["Tokyo","Kyoto","Osaka","Beijing"]}],"check":[{"q":"Which city is the capital of Canada?","h":"Not the biggest city.","o":["Ottawa","Toronto","Vancouver","Chicago"]},{"q":"London is the capital of which country?","h":"Say the peg.","o":["England","France","Japan","Mexico"]},{"q":"What is a capital city?","h":"Leaders meet there.","o":["the city where a government meets","always the biggest and oldest city in the country","any city near the ocean"]}],"re":[{"how":"Say the peg as a chant, two at a time: Paris for France, London for England, Tokyo for Japan, Ottawa for Canada. Say each pair three times.","q":"In the peg, which city goes with Japan?","o":["Tokyo","Ottawa","London","Paris"]},{"how":"Start at home: Annapolis is Maryland's capital. Washington, D.C. is our country's capital. Every country has its capital.","q":"How many capitals does a country usually have?","o":["one","five","fifty","none"]},{"how":"A country is a nation with its own land, leaders and flag. The United States, Canada and Mexico are three countries in North America.","q":"Which of these is a country?","o":["Mexico","Texas","Baltimore","Asia"]}]},"ELEC.FNATURE.L05.01":{"name":"The Solar System","task":"Make a planet parade with eight paper circles in order from the Sun. Make Jupiter the biggest.","teach":[{"how":"Our solar system has the Sun in the middle and eight planets going around it. Watch the Planet Parade from the Sun outward: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune. The first letters match: My Very Educated Mother Just Served Us Nachos.","q":"How many planets go around our Sun?","pic":"🪐","o":["8","9","7","12"]},{"how":"Earth is the third planet from the Sun. It is just right for life: not too hot and not too cold.","q":"Which planet is third from the Sun?","pic":"🌍","o":["Earth","Mars","Venus","Jupiter"]},{"how":"Jupiter is the biggest planet. More than 1,000 Earths could fit inside it!","q":"Which planet is the biggest?","pic":"🪐","o":["Jupiter","Mercury","Mars","Earth"]}],"practice":[{"q":"Which planet is closest to the Sun?","pic":"☀️","h":"My ...","o":["Mercury","Neptune","Earth","Venus"]},{"q":"Which planet is called the Red Planet?","pic":"🔴","h":"Its dusty ground looks red.","o":["Mars","Jupiter","Saturn","Neptune"]},{"q":"Put the first four planets in order from the Sun: Mars, Venus, Earth, Mercury.","h":"My Very Educated Mother.","t":"order","tiles":["Mercury","Venus","Earth","Mars"]},{"q":"About how many days does it take Earth to go once around the Sun?","h":"One year.","t":"num","a":365},{"q":"Which planet is famous for its big, bright rings?","pic":"🪐","h":"It comes after Jupiter.","o":["Saturn","Mars","Mercury","Earth"]},{"q":"A space probe flies out from Earth past Mars. Which planet will it reach next?","pic":"🛰️","h":"Just Served ...","o":["Jupiter","Venus","Mercury","Saturn"]}],"check":[{"q":"What is in the center of our solar system?","h":"All the planets go around it.","o":["the Sun","the Moon","Earth","Jupiter"]},{"q":"Which planet is the farthest from the Sun?","h":"Nachos.","o":["Neptune","Uranus","Saturn","Mercury"]},{"q":"Which planet is the biggest of all?","h":"Over 1,000 Earths fit inside.","o":["Jupiter","Saturn","Earth","Mars"]}],"re":[{"how":"Say the peg and march: My Very Educated Mother Just Served Us Nachos. Each first letter is a planet: M Mercury, V Venus, E Earth, M Mars, J Jupiter, S Saturn, U Uranus, N Neptune.","q":"In the peg, which planet does Just stand for?","o":["Jupiter","Saturn","Mars","Neptune"]},{"how":"Start with the inside three: Mercury, Venus, Earth. Earth is third, our home.","q":"Which planet comes right after Venus?","o":["Earth","Mercury","Saturn"]},{"how":"A planet is a big, round world that travels around the Sun. The Sun is a star, a giant ball of hot, glowing gas.","q":"What is the Sun?","o":["a star","a planet","a moon","a comet"]}]},"ELEC.FUSA.L05.01":{"name":"Three Branches of Government","task":"Draw three boxes: Congress, the President, the Supreme Court. Write each one's job inside.","teach":[{"how":"Our government has three branches, so no one part has too much power. Learn the Three Jobs: Congress makes, the President carries out, the Court explains. Congress makes the laws, the President carries them out, and the Supreme Court explains them.","q":"Which branch makes the laws?","pic":"🏛️","o":["Congress","the President","the Supreme Court","the army"]},{"how":"Congress has two parts: the Senate and the House of Representatives. Each state has 2 senators, so there are 100 senators.","q":"What are the two parts of Congress?","pic":"🏛️","o":["the Senate and the House","the Court and the Army","the President and the Mayor"]},{"how":"The Supreme Court is the highest court. Its nine justices decide what the Constitution and the laws mean.","q":"How many justices sit on the Supreme Court?","pic":"⚖️","o":["9","100","50","2"]}],"practice":[{"q":"Who carries out the laws?","h":"The leader of the country.","o":["the President","Congress","the Supreme Court","the governor of Maryland"]},{"q":"Which branch explains what the laws mean?","pic":"⚖️","h":"Judges.","o":["the Supreme Court","Congress","the President","the Department of Motor Vehicles"]},{"q":"Put the steps of a law in order: the President signs it, Congress votes on it, the courts explain it.","h":"Making comes before carrying out.","t":"order","tiles":["Congress votes on it","the President signs it","the courts explain it"]},{"q":"Each state has 2 senators. There are 50 states. How many senators are there in all?","h":"2 times 50.","t":"num","a":100},{"q":"Why are there three branches?","h":"They balance each other.","o":["so no one part has too much power","so the President can do anything at all he wants","so there are fewer laws"]},{"q":"Congress passes a new law about safe bike lanes. Who carries it out?","pic":"🚲","h":"Say the peg.","o":["the President and his helpers","the nine justices of the Supreme Court","the Senate only","the House only"]}],"check":[{"q":"Congress makes the laws. Who carries them out?","h":"Say the peg.","o":["the President","the Supreme Court","the Senate","a judge"]},{"q":"What does the Supreme Court do?","h":"Say the peg.","o":["explains what laws mean","makes new laws","leads the army","collects taxes from every family"]},{"q":"The Senate is part of which branch?","h":"Two parts: the Senate and the House.","o":["Congress","the Supreme Court","the President's office"]}],"re":[{"how":"Say the peg with three fingers: Congress makes, the President carries out, the Court explains. One finger for each branch.","q":"In the peg, what does the Court do?","o":["explains","makes","carries out"]},{"how":"One branch at a time. Congress is the people's lawmakers. They meet in the Capitol building in Washington, D.C.","q":"Where does Congress meet?","o":["the Capitol building","the White House","the Statue of Liberty in New York","Fort McHenry"]},{"how":"A government is the group that makes and carries out the rules for a country. Rules for a country are called laws.","q":"Rules for a whole country are called:","o":["laws","games","stories","recipes"]}]},"ELEC.FPAST.L05.01":{"name":"The Birth of America","task":"Make a timeline with the three Freedom Dates. Draw a picture for each one.","teach":[{"how":"America was once ruled by Britain. On July 4, 1776, America declared it was free. Learn the Freedom Dates: 1776 free, 1787 the rules, 1789 the first President.","q":"In what year did America declare independence?","pic":"📜","o":["1776","1492","1787","1969"]},{"how":"Thomas Jefferson wrote most of the Declaration of Independence. It says all people have rights, like life and liberty.","q":"Who wrote most of the Declaration of Independence?","pic":"🖋️","o":["Thomas Jefferson","George Washington","Abraham Lincoln","Benjamin Franklin"]},{"how":"George Washington led the American army in the Revolutionary War. In 1789 he became the first President of the United States.","q":"Who was the first President of the United States?","pic":"🇺🇸","o":["George Washington","Thomas Jefferson","Abraham Lincoln","Benjamin Franklin"]}],"practice":[{"q":"What holiday celebrates the Declaration of Independence?","pic":"🎆","h":"July 4, 1776.","o":["the Fourth of July","Thanksgiving","Labor Day","Presidents' Day in February"]},{"q":"Which country ruled America before 1776?","h":"They spoke English.","o":["Britain","France","Spain","Mexico"]},{"q":"Put the Freedom Dates in order: Washington becomes President, the Constitution is written, independence is declared.","h":"The smallest year comes first.","t":"order","tiles":["independence is declared","the Constitution is written","Washington becomes President"]},{"q":"How many years passed from 1776 to 1789?","h":"Subtract.","t":"num","a":13},{"q":"In which city was the Constitution written in 1787?","pic":"🔔","h":"The Liberty Bell city.","o":["Philadelphia","Baltimore","Boston","Washington, D.C."]},{"q":"On July 4, Shmuel's town has fireworks. What happened on that date in 1776?","h":"Freedom!","o":["America declared it was free","Columbus reached America","the Wright brothers made the first airplane flight","Washington was born"]}],"check":[{"q":"Who was the first President?","h":"1789.","o":["George Washington","Alexander Graham Bell","Thomas Jefferson","Abraham Lincoln"]},{"q":"What document did America sign in 1776?","h":"It declared freedom.","o":["the Declaration of Independence","the Constitution","the Bill of Rights","the Treaty of Paris with Great Britain and France"]},{"q":"In what year did Washington become President?","h":"Say the peg.","o":["1789","1776","1787","1800"]}],"re":[{"how":"Say the peg like a drumbeat: 1776 free, 1787 the rules, 1789 the first President. Three dates, three big steps.","q":"In the peg, which year goes with the rules?","o":["1787","1776","1789"]},{"how":"Just one date first: 1776. Say it like two numbers: seventeen, seventy-six. America's birthday is July 4.","q":"Which date do we celebrate as America's birthday?","o":["July 4","January 1","November 11"]},{"how":"Independence means being free to rule yourself. America wanted to make its own laws instead of being ruled by a faraway king.","q":"Independence means:","o":["being free to rule yourself","being ruled by a king","having no rules or laws at all, ever"]}]},"ELEC.FTECH.L05.01":{"name":"Electricity and Circuits","task":"With an adult, look inside a flashlight. Find the battery, the switch and the bulb.","teach":[{"how":"Electricity flows through a path called a circuit. The path must be a complete loop. Do a Loop Check: No loop, no flow. A battery pushes the electricity, wires carry it, and a bulb uses it.","q":"What does a circuit need for electricity to flow?","pic":"🔋","o":["a complete loop","a broken wire","a gap in the path"]},{"how":"A switch opens and closes the loop. When the switch is on, the loop is closed and the bulb lights.","q":"What does a light switch do?","pic":"💡","o":["opens and closes the circuit","makes the battery much bigger and stronger","changes the bulb color"]},{"how":"Some materials let electricity flow. They are called conductors, like copper wire. Others block it. They are called insulators, like rubber and plastic.","q":"Which one is a conductor?","pic":"🔌","o":["copper wire","a rubber glove","a plastic spoon","a wooden stick"]}],"practice":[{"q":"Which one is an insulator?","h":"It blocks electricity.","o":["rubber","copper","iron","silver"]},{"q":"The wire in a circuit has a gap. What happens to the bulb?","h":"No loop, no flow.","o":["it stays dark","it gets brighter","it turns blue","it lights twice"]},{"q":"Follow the flow around a simple circuit. Put the parts in order, starting at the battery.","h":"Start at the battery.","t":"order","tiles":["battery","first wire","bulb","wire back to the battery"]},{"q":"A flashlight uses 2 batteries. How many batteries do 3 flashlights need?","h":"2, three times.","t":"num","a":6},{"q":"Why should you never touch an outlet with wet hands?","pic":"⚠️","h":"Safety!","o":["water can carry electricity to you","because water makes the outlet cold and slippery","outlets are made of glass"]},{"q":"Moshe builds a circuit, but the bulb will not light. The wires and bulb look fine. What should he check?","h":"Loop Check!","o":["that the loop is closed","that the bulb is blue","that the wire is plastic"]}],"check":[{"q":"What is a circuit?","h":"A loop.","o":["a complete loop for electricity","a kind of battery that never runs out","a light bulb"]},{"q":"Which material blocks electricity?","h":"Insulators.","o":["plastic","copper","steel","aluminum"]},{"q":"What does a battery do in a circuit?","h":"It gives energy.","o":["pushes the electricity","blocks the electricity","turns the light off"]}],"re":[{"how":"Say the peg and draw a circle in the air: No loop, no flow. Then draw a circle with a gap: no light.","q":"In the peg, what happens with no loop?","o":["no flow","more flow","a big spark"]},{"how":"Just the battery and the bulb first. Run one wire from the battery to the bulb, and one wire back. That makes the loop.","q":"How many wires make a simple loop with one battery and one bulb?","o":["2","1","5"]},{"how":"Electricity is energy that can make lights shine and motors spin. It comes from batteries and from power plants.","q":"What can electricity do?","o":["make a light shine","make water wet","make a rock soft"]}]},"ELEC.FNUM.L05.01":{"name":"Big Numbers in Our World","task":"Look in an almanac or newspaper with Abba for a number in the millions. Read it out loud.","teach":[{"how":"Big numbers are easier to read with commas. Use the Comma Counter: Thousand has one comma, million has two, billion has three. 1,000 is a thousand. 1,000,000 is a million.","q":"How many commas are in one million, written 1,000,000?","pic":"🔢","o":["2","1","3","6"]},{"how":"About 8 billion people live on Earth today. A billion is a thousand millions!","q":"About how many people live on Earth?","pic":"🌍","o":["8 billion","8 million","8 thousand","800"]},{"how":"About 340 million people live in the United States. About 6 million live in Maryland.","q":"About how many people live in the United States?","pic":"🇺🇸","o":["340 million","340 thousand","34","3 billion"]}],"practice":[{"q":"Which number is one thousand?","h":"One comma.","o":["1,000","100","10,000","10"]},{"q":"Put in order from smallest to biggest: a million, a thousand, a billion, a hundred.","h":"Count the zeros.","t":"order","tiles":["a hundred","a thousand","a million","a billion"]},{"q":"How many zeros are in one million (1,000,000)?","h":"Count them.","t":"num","a":6},{"q":"About how many people live in Maryland?","h":"Millions, not billions.","o":["6 million","6 billion","600","60 thousand"]},{"q":"Which is biggest: a billion, a million, or a thousand?","h":"Three commas or two.","o":["a billion","a million","a thousand"]},{"q":"A newspaper says a city has 2,500,000 people. How do you say that?","pic":"📰","h":"Two commas.","o":["two and a half million","two and a half thousand","two hundred fifty","twenty-five billion"]}],"check":[{"q":"A billion has how many commas?","h":"Say the peg.","o":["3","2","1","9"]},{"q":"Which is closest to the number of people on Earth?","h":"Billions!","o":["8,000,000,000","8,000,000","80,000,000,000","8,000"]},{"q":"Which number is one million?","h":"Two commas.","o":["1,000,000","1,000","100,000","1,000,000,000"]}],"re":[{"how":"Say the peg and hold up fingers: Thousand has one comma, million has two, billion has three.","q":"In the peg, a million has how many commas?","o":["two","one","three"]},{"how":"Start with a thousand: 1,000. Ten hundreds make a thousand. Picture 1,000 pennies in a big jar.","q":"How many hundreds make a thousand?","o":["10","100","2","1,000"]},{"how":"Place value: each place is ten times bigger than the place to its right. Ones, tens, hundreds, thousands.","q":"Which place comes right after hundreds?","o":["thousands","tens","ones","ten thousands"]}]}};

{ const F6={"ELEC.FWORLD.L06.01":{"name":"World Record Places","task":"Make a World Records poster with four pictures: Everest, the Sahara, the Amazon and the Pacific.","teach":[{"how":"Some places on Earth hold world records. Be a Record Finder: Everest goes up, Sahara dries out, Amazon grows green, Pacific spreads wide. Mount Everest, in Asia, is the tallest mountain above sea level, about 29,000 feet high.","q":"What is the tallest mountain above sea level?","pic":"🏔️","o":["Mount Everest","Mount Kilimanjaro","Mount Washington","the Rocky Mountains"]},{"how":"The Sahara in North Africa is the largest hot desert in the world. It is almost as big as the whole United States.","q":"What is the largest hot desert in the world?","pic":"🏜️","o":["the Sahara","the Gobi","Death Valley","the Mojave"]},{"how":"The Amazon rainforest in South America is the largest rainforest in the world. The Amazon River flows through it and carries more water than any other river.","q":"Where is the largest rainforest?","pic":"🌳","o":["the Amazon, in South America","the Sahara Desert, in North Africa","Alaska","Antarctica"]}],"practice":[{"q":"What is the largest ocean on Earth?","pic":"🌊","h":"Say the peg.","o":["the Pacific","the Atlantic","the Indian","the Arctic"]},{"q":"On which continent is Mount Everest?","h":"It stands between Nepal and China.","o":["Asia","Africa","Europe","North America"]},{"q":"Put in order from tallest to shortest: Mount Washington (6,288 feet), Mount Everest (about 29,000 feet), Mount Whitney (14,505 feet).","h":"Compare the numbers.","t":"order","tiles":["Mount Everest","Mount Whitney","Mount Washington"]},{"q":"Mount Everest is about 29,000 feet tall. A jet flies at about 35,000 feet. How many feet higher is the jet?","h":"Subtract.","t":"num","a":6000},{"q":"Which river carries the most water in the world?","h":"It flows through the biggest rainforest.","o":["the Amazon","the Mississippi","the Nile","the Hudson"]},{"q":"An explorer crosses miles of hot sand dunes in North Africa. Where is he?","pic":"🐪","h":"Hot sand.","o":["the Sahara","the Amazon","Antarctica","the Pacific"]}],"check":[{"q":"Mount Everest is famous for being:","h":"It goes up.","o":["the tallest mountain above sea level","the biggest desert","the longest river","the coldest and largest island in the whole world"]},{"q":"Which desert is almost as big as the United States?","h":"North Africa.","o":["the Sahara","the Mojave","the Gobi","the Negev"]},{"q":"Which place is a huge rainforest in South America?","h":"Green!","o":["the Amazon","the Sahara","the Himalayas","the Gobi"]}],"re":[{"how":"Say the peg with motions: Everest goes up, Sahara dries out, Amazon grows green, Pacific spreads wide. Reach high, wipe your forehead, wave like trees, open your arms.","q":"In the peg, which place dries out?","o":["the Sahara","the Pacific","the Amazon","Everest"]},{"how":"One record at a time. Tallest: Mount Everest. Say it three times while you stand on your toes.","q":"Which record does Mount Everest hold?","o":["tallest mountain","biggest ocean","largest hot desert in Africa","longest river"]},{"how":"Landforms are shapes of the land: mountains are high, deserts are dry, rainforests are wet and full of trees.","q":"Which landform is very dry, with little rain?","o":["a desert","a rainforest","a lake","a swamp"]}]},"ELEC.FNATURE.L06.01":{"name":"The Water Cycle","task":"Make a water cycle in a bag: a little water in a zip bag taped to a sunny window. Watch it for three days.","teach":[{"how":"Water on Earth moves in a never-ending circle called the water cycle. Ride the Cycle Circle with: Every Cloud Pours Cups: evaporation, condensation, precipitation, collection. First, the sun heats water, and it rises as an invisible gas called water vapor. That is evaporation.","q":"What do we call it when the sun turns water into vapor that rises?","pic":"☀️","o":["evaporation","precipitation","collection","condensation"]},{"how":"High up, water vapor cools and turns back into tiny drops. The drops gather into clouds. That is condensation.","q":"How do clouds form?","pic":"☁️","o":["water vapor cools into tiny drops","the sun makes new water","wind blows sand and dust high into the sky"]},{"how":"When the drops in a cloud get big and heavy, they fall as rain, snow, sleet or hail. That is precipitation.","q":"Rain and snow falling from clouds is called:","pic":"🌧️","o":["precipitation","evaporation","condensation","collection"]}],"practice":[{"q":"After it rains, water gathers in oceans, lakes and rivers. What is this step called?","h":"Cups.","o":["collection","evaporation","condensation","precipitation"]},{"q":"What gives the water cycle its energy?","h":"It heats the water.","o":["the Sun","the Moon","the wind only","the soil"]},{"q":"Put the four steps of the water cycle in order.","h":"Every Cloud Pours Cups.","t":"order","tiles":["evaporation","condensation","precipitation","collection"]},{"q":"Water boils at 212 degrees Fahrenheit and freezes at 32 degrees. How many degrees apart are they?","h":"Subtract.","t":"num","a":180},{"q":"Why does a puddle disappear on a sunny day?","h":"The sun heats it.","o":["the water evaporates","the ground swallows it up forever","the puddle freezes and blows away"]},{"q":"Dovid sees drops of water on the outside of his cold drink. Which step of the cycle is this like?","pic":"🥤","h":"Vapor in the air cools.","o":["condensation","evaporation","precipitation","collection"]}],"check":[{"q":"In the peg, which step is first?","h":"Every.","o":["evaporation","collection","precipitation","condensation"]},{"q":"Clouds are made of:","h":"Condensation.","o":["tiny water drops","cotton","smoke","sand"]},{"q":"Snow falling from a cloud is an example of:","h":"Pours.","o":["precipitation","evaporation","condensation","collection"]}],"re":[{"how":"Say the peg and act it out: Every Cloud Pours Cups: evaporation, condensation, precipitation, collection. Rise up, puff into a cloud, rain down with your fingers, then cup your hands.","q":"In the peg, Pours stands for:","o":["precipitation","collection","evaporation","condensation"]},{"how":"Two steps first: water goes UP as vapor and comes DOWN as rain. Up, down, up, down.","q":"Water goes up into the sky as:","o":["vapor","rain","snow","hail"]},{"how":"Water can be a solid (ice), a liquid (water) or a gas (vapor). Heating turns a liquid into a gas. Cooling turns the gas back into a liquid.","q":"Heating liquid water turns it into:","o":["a gas","a solid","sand","salt"]}]},"ELEC.FUSA.L06.01":{"name":"Famous Presidents","task":"Look at a penny, a nickel and a quarter. Which Presidents are on them?","teach":[{"how":"Each President has a number in order. Get the President Line-Up: Number 1 Washington, number 3 Jefferson, number 16 Lincoln. Washington set the example of serving only two terms.","q":"Which number President was Abraham Lincoln?","pic":"🎩","o":["16th","1st","3rd","44th"]},{"how":"Abraham Lincoln led the country during the Civil War, 1861 to 1865. His Emancipation Proclamation, in 1863, began freeing enslaved people. He kept the United States together.","q":"Which war did Lincoln lead the country through?","pic":"⚔️","o":["the Civil War","the Revolutionary War","World War II","the War of 1812"]},{"how":"Thomas Jefferson, the 3rd President, bought the huge Louisiana Territory from France in 1803. It doubled the size of the country.","q":"What did Jefferson buy from France in 1803?","pic":"🗺️","o":["the Louisiana Territory","Alaska","the island of Hawaii and its beaches","Florida"]}],"practice":[{"q":"Which President is called the Father of His Country?","h":"Number 1.","o":["George Washington","Abraham Lincoln","Thomas Jefferson","Franklin D. Roosevelt"]},{"q":"Which President was elected four times?","h":"He led during World War II.","o":["Franklin D. Roosevelt","George Washington","Abraham Lincoln","John Quincy Adams of Massachusetts"]},{"q":"Put these Presidents in order by number: Lincoln, Washington, Jefferson.","h":"Say the peg.","t":"order","tiles":["Washington","Jefferson","Lincoln"]},{"q":"Jefferson was the 3rd President and Lincoln was the 16th. How many Presidents came in between them?","h":"The 4th through the 15th.","t":"num","a":12},{"q":"Which President loved nature and set aside land for national parks?","pic":"🏞️","h":"The teddy bear is named after him.","o":["Theodore Roosevelt","Abraham Lincoln","George Washington","Thomas Jefferson of Virginia"]},{"q":"A famous speech starts, \"Four score and seven years ago.\" Who gave it?","pic":"📜","h":"The Gettysburg Address, 1863.","o":["Abraham Lincoln","George Washington","Thomas Jefferson","Theodore Roosevelt"]}],"check":[{"q":"Who was the 3rd President?","h":"Say the peg.","o":["Thomas Jefferson","Abraham Lincoln","George Washington","Franklin D. Roosevelt"]},{"q":"Which President led during the Civil War?","h":"Number 16.","o":["Abraham Lincoln","Thomas Jefferson","George Washington","Theodore Roosevelt"]},{"q":"Who was the 1st President?","h":"Say the peg.","o":["George Washington","John Adams","Abraham Lincoln","Theodore Roosevelt"]}],"re":[{"how":"Say the peg and count: Number 1 Washington, number 3 Jefferson, number 16 Lincoln. Washington first, Jefferson third, Lincoln sixteenth.","q":"In the peg, who is number 3?","o":["Jefferson","Washington","Lincoln","Adams"]},{"how":"One President first: George Washington, number 1. He is on the one-dollar bill and the quarter.","q":"Whose face is on the one-dollar bill?","pic":"💵","o":["George Washington","Abraham Lincoln","Thomas Jefferson","Benjamin Franklin"]},{"how":"The President is the leader of the whole country. He is chosen by the people in an election every four years.","q":"How often is a President elected?","o":["every 4 years","every year","every 10 years","every month"]}]},"ELEC.FPAST.L06.01":{"name":"Inventions That Changed the World","task":"Tap your name in Morse code on the table for a friend. Can he decode it with a Morse chart?","teach":[{"how":"Some inventions changed how everyone lives. Build the Invention Timeline: Gutenberg printed, Watt steamed, Morse tapped, Ford built. Around 1450, Johannes Gutenberg built a printing press with movable letters. Books became cheap, and many more people could read.","q":"What did Gutenberg's invention make?","pic":"📚","o":["printed books","telephones","steam-powered trains","airplanes"]},{"how":"In the 1760s and 1770s, James Watt made the steam engine much better. Steam engines powered factories, trains and ships.","q":"What did James Watt improve?","pic":"🚂","o":["the steam engine","the printing press","the telephone","the light bulb"]},{"how":"In 1844, Samuel Morse sent messages over wires with his telegraph, using a code of dots and dashes called Morse code.","q":"What was Morse code made of?","pic":"📡","o":["dots and dashes","loud colorful pictures","colors","music notes"]}],"practice":[{"q":"Who made cars cheap with the moving assembly line in 1913?","pic":"🚗","h":"Ford built.","o":["Henry Ford","Thomas Edison","James Watt","Samuel Morse"]},{"q":"Why was the printing press so important?","h":"Gutenberg printed.","o":["books became cheap, so more people could read","it made horses and wagons go much faster on the roads","it lit up houses"]},{"q":"Put the inventions in time order: Ford's assembly line, Gutenberg's press, Morse's telegraph, Watt's steam engine.","h":"Say the peg.","t":"order","tiles":["Gutenberg's press","Watt's steam engine","Morse's telegraph","Ford's assembly line"]},{"q":"Morse's telegraph message was in 1844. Ford's assembly line was in 1913. How many years apart are they?","h":"Subtract.","t":"num","a":69},{"q":"What did steam engines power?","h":"Watt steamed.","o":["trains, ships and factories","books and pens","telephones, radios and televisions","pencils"]},{"q":"A message comes: dot-dot-dot, dash-dash-dash, dot-dot-dot. Whose invention is this?","pic":"📟","h":"Morse tapped.","o":["Samuel Morse","Henry Ford","Johannes Gutenberg","James Watt"]}],"check":[{"q":"Who invented the printing press with movable type?","h":"Say the peg.","o":["Johannes Gutenberg","Henry Ford","Samuel Morse","Alexander Graham Bell"]},{"q":"Henry Ford is famous for:","h":"Ford built.","o":["the moving assembly line","the printing press","the telegraph","the first electric light bulb and power plant"]},{"q":"Which invention sent messages over wires with dots and dashes?","h":"Morse tapped.","o":["the telegraph","the printing press","the steam engine","the assembly line"]}],"re":[{"how":"Say the peg and act it: Gutenberg printed, Watt steamed, Morse tapped, Ford built. Stamp a page, puff like a train, tap the table, turn a wrench.","q":"In the peg, who tapped?","o":["Morse","Ford","Watt","Gutenberg"]},{"how":"One invention at a time. The printing press: before it, every book was copied by hand. One book could take months!","q":"Before the printing press, books were:","o":["copied by hand","printed by computers","sent by email","made of plastic"]},{"how":"An invention is a new tool or machine that solves a problem. A big invention can change the way millions of people live.","q":"What does an invention do?","o":["solves a problem in a new way","makes every problem much worse than it was","nothing at all"]}]},"ELEC.FTECH.L06.01":{"name":"Simple Machines","task":"Hunt for simple machines at home. Find one of each of the six and list them.","teach":[{"how":"Simple machines make work easier. There are six. Be a Machine Spotter: Lever lifts, pulley pulls, ramp rolls, wedge splits, screw twists, wheel turns. A ramp is also called an inclined plane, and the wheel works with an axle.","q":"How many simple machines are there?","pic":"⚙️","o":["6","3","10","2"]},{"how":"A lever is a bar that rocks on a resting spot called a fulcrum. A seesaw is a lever.","q":"A seesaw is which simple machine?","pic":"🛝","o":["a lever","a pulley","a screw","a wedge"]},{"how":"A wedge is thick at one end and thin at the other. It splits things apart. An axe and a knife are wedges.","q":"An axe that splits wood is which simple machine?","pic":"🪓","o":["a wedge","a lever","a pulley","a ramp"]}],"practice":[{"q":"A rope over a wheel that helps lift a flag up a pole is:","h":"Pulley pulls.","o":["a pulley","a wedge","a screw","a ramp"]},{"q":"A ramp that helps move a heavy box into a truck is also called:","pic":"📦","h":"Ramp rolls.","o":["an inclined plane","a pulley","a screw","a wheel and axle with a handle"]},{"q":"Put the steps in order to lift a rock with a lever: push down on the bar, slide the bar under the rock, put a log under the bar.","h":"The bar must be under the rock first.","t":"order","tiles":["slide the bar under the rock","put a log under the bar","push down on the bar"]},{"q":"Count the simple machines in this list: lever, apple, pulley, ramp, pillow, screw.","h":"Use the peg.","t":"num","a":4},{"q":"A screw is really which simple machine wrapped around a rod?","h":"Look at the slanted threads.","o":["a ramp","a pulley","a lever","a wheel"]},{"q":"Chaim turns a doorknob to open the latch. Which simple machine is a doorknob?","pic":"🚪","h":"Wheel turns.","o":["a wheel and axle","a wedge","a pulley","an inclined plane, also called a ramp"]}],"check":[{"q":"Which simple machine splits things apart?","h":"Say the peg.","o":["a wedge","a pulley","a wheel and axle","a lever"]},{"q":"A jar lid that twists on uses which simple machine?","pic":"🫙","h":"Twists.","o":["a screw","a wedge","a lever","a pulley"]},{"q":"Why do we use simple machines?","h":"They help us.","o":["to make work easier","to make work harder","to make noise","to use more energy"]}],"re":[{"how":"Say the peg and act each one: Lever lifts, pulley pulls, ramp rolls, wedge splits, screw twists, wheel turns.","q":"In the peg, what does the wedge do?","o":["splits","lifts","twists","pulls"]},{"how":"Start with the lever and the ramp. A lever lifts with a bar. A ramp lets you roll something instead of lifting it.","q":"Which is easier: rolling a heavy barrel up a ramp, or lifting it straight up?","o":["rolling it up a ramp","lifting it straight up","throwing it up high"]},{"how":"Work means using force to move something. A push or a pull is a force.","q":"In science, work means:","o":["using force to move something","sitting very still and resting for hours","thinking hard"]}]},"ELEC.FNUM.L06.01":{"name":"Roman Numerals","task":"Find Roman numerals on a clock, a book chapter or a building. Write what number each one means.","teach":[{"how":"The ancient Romans wrote numbers with letters. Use the Roman Ruler: I Value Xylophones Like Cows Do Milk: 1, 5, 10, 50, 100, 500, 1000. So I is 1, V is 5, X is 10, L is 50, C is 100, D is 500 and M is 1000.","q":"What number is X?","pic":"🏛️","o":["10","5","50","100"]},{"how":"Put letters together and add them: VI is 5 + 1 = 6. XX is 10 + 10 = 20.","q":"What number is VII?","pic":"🔢","o":["7","6","12","70"]},{"how":"If a smaller letter comes BEFORE a bigger one, subtract it: IV is 5 − 1 = 4, and IX is 10 − 1 = 9.","q":"What number is IV?","pic":"➖","o":["4","6","15","1"]}],"practice":[{"q":"What number is C?","h":"Cows.","o":["100","50","500","1000"]},{"q":"Put these Roman numerals in order from smallest to biggest: X, M, V, C, L.","h":"Say the peg.","t":"order","tiles":["V","X","L","C","M"]},{"q":"What number is XXIII?","h":"10 + 10 + 1 + 1 + 1.","t":"num","a":23},{"q":"How do you write 9 in Roman numerals?","h":"One before ten.","o":["IX","VIIII","XI","IIX"]},{"q":"What number is MD?","h":"1000 + 500.","t":"num","a":1500},{"q":"A building's cornerstone says MCMLX for its year. M is 1000, CM is 900, LX is 60. What year is it?","pic":"🏢","h":"Add the parts.","o":["1960","1940","2160","1560"]}],"check":[{"q":"What number is L?","h":"Like.","o":["50","5","500","100"]},{"q":"What number is XIV?","h":"10 + (5 − 1).","o":["14","16","9","4"]},{"q":"What number is M?","h":"Milk.","o":["1000","100","500","10,000"]}],"re":[{"how":"Say the peg slowly, holding up a finger for each word: I Value Xylophones Like Cows Do Milk: 1, 5, 10, 50, 100, 500, 1000.","q":"In the peg, which letter stands for 500?","o":["D","C","M","L"]},{"how":"Start with just three: I is 1, V is 5, X is 10. Count with them: I, II, III, IV, V.","q":"What number is III?","o":["3","1","30","111"]},{"how":"Our numbers use the digits 0 to 9 in place value. Roman numerals use letters instead, and you add or subtract their values.","q":"Roman numerals use:","o":["letters","pictures","colors","music notes"]}]}};

{ const F7={"ELEC.FWORLD.L07.01":{"name":"Latitude, Longitude and Hemispheres","task":"Find Baltimore's latitude on a globe or map with Abba. (It is about 39 degrees north.)","teach":[{"how":"Mapmakers cover the globe with a grid of lines so any place can be found. Use the Grid Guide: Latitude is flat like a ladder; longitude is long from pole to pole. The equator is the latitude line at 0 degrees, around the middle of the Earth.","q":"What is the line of latitude at 0 degrees, around the middle of the Earth?","pic":"🌐","o":["the equator","the prime meridian","the North Pole","the International Date Line"]},{"how":"The prime meridian is the line of longitude at 0 degrees. It runs from the North Pole to the South Pole through Greenwich, England.","q":"Through which country does the prime meridian pass, at Greenwich?","pic":"🧭","o":["England","the United States","Japan","Brazil"]},{"how":"The equator splits Earth into the Northern and Southern Hemispheres. The prime meridian splits it into the Eastern and Western Hemispheres. A hemisphere is half a sphere.","q":"The United States is in which two hemispheres?","pic":"🗺️","o":["Northern and Western","Southern and Eastern","Northern and Eastern","Southern and Western"]}],"practice":[{"q":"Lines of latitude run:","h":"Flat like a ladder.","o":["east and west, like ladder rungs","from pole to pole","in small circles around one city and nowhere else","straight up into space"]},{"q":"What is the latitude of the North Pole?","h":"As far north as you can go.","o":["90 degrees north","0 degrees","180 degrees","45 degrees north"]},{"q":"Put these places in order from north to south: the equator, the North Pole, the South Pole, Baltimore.","h":"Baltimore is between the top and the middle.","t":"order","tiles":["the North Pole","Baltimore","the equator","the South Pole"]},{"q":"Latitude goes from 0 degrees at the equator to how many degrees at each pole?","h":"A quarter of a circle.","t":"num","a":90},{"q":"Which hemisphere is Australia in, north or south of the equator?","pic":"🦘","h":"It is below the equator.","o":["the Southern","the Northern","both equally"]},{"q":"A ship's map says 0 degrees latitude. Where is the ship?","pic":"🚢","h":"Zero latitude.","o":["on the equator","at the North Pole","at Greenwich, England","in Baltimore harbor"]}],"check":[{"q":"Lines that run from the North Pole to the South Pole are lines of:","h":"Long from pole to pole.","o":["longitude","latitude","the equator","temperature"]},{"q":"The equator divides Earth into:","h":"It runs around the middle.","o":["the Northern and Southern Hemispheres","the Eastern and Western Hemispheres and the poles","seven continents","five oceans"]},{"q":"What is at 0 degrees longitude?","h":"Greenwich.","o":["the prime meridian","the equator","the International Date Line","the North Pole"]}],"re":[{"how":"Say the peg and move your arms: Latitude is flat like a ladder; longitude is long from pole to pole. Hold your arms flat for latitude, then stretch them up and down for longitude.","q":"In the peg, which lines are flat like a ladder?","o":["latitude","longitude","both kinds","neither kind"]},{"how":"Just one line first: the equator. It is an imaginary belt around Earth's middle. Places near it are hot all year.","q":"Places near the equator are usually:","o":["hot all year","icy all year","dark all day","under the sea"]},{"how":"A grid is a set of crossing lines, like a tic-tac-toe board. Where two lines cross, you get an exact spot.","q":"What do you get where two grid lines cross?","o":["an exact spot","a new ocean","a mountain","a river"]}]},"ELEC.FNATURE.L07.01":{"name":"Earth's Layers and Volcanoes","task":"Peel a hard-boiled egg with Abba or Ima. Name the Earth layer for each part as you go.","teach":[{"how":"Earth is built in layers, a bit like a boiled egg. Do the Layer Peel: Crust is the shell, mantle is the white, core is the yolk. The crust is the thin rocky skin we live on.","q":"Which layer of Earth do we live on?","pic":"🥚","o":["the crust","the mantle","the outer core","the inner core"]},{"how":"Under the crust is the mantle, the thickest layer. It is hot rock that moves very slowly, like thick caramel.","q":"Which layer is the thickest?","pic":"🌋","o":["the mantle","the crust","the inner core","the outer core"]},{"how":"At the center is the core. The outer core is liquid metal. The inner core is solid metal and is the hottest part of Earth.","q":"What is the inner core made of?","pic":"🔥","o":["solid metal","liquid water","sand","ice"]}],"practice":[{"q":"Underground melted rock is magma. Once it flows out of a volcano, it has a new name. What flows down the side of an erupting volcano?","pic":"🌋","h":"It has a different name above ground.","o":["lava","ash","steam","sand"]},{"q":"Earth's crust is broken into giant moving pieces called:","h":"They slide very slowly.","o":["plates","pebbles","blocks of ice","layers of cake"]},{"q":"Put Earth's layers in order from the outside in.","h":"Shell, white, yolk.","t":"order","tiles":["crust","mantle","outer core","inner core"]},{"q":"Earth's crust is about 25 miles thick under land, and the mantle is about 1,800 miles thick. How many miles thicker is the mantle?","h":"Subtract.","t":"num","a":1775},{"q":"What causes most earthquakes?","h":"Plates.","o":["plates of the crust moving and slipping","the Moon and the Sun pulling hard on rocks every night","heavy rain","loud thunder"]},{"q":"A scientist drills straight down from Baltimore. Which layer will he reach right under the crust?","h":"Shell, then white.","o":["the mantle","the outer core","the inner core","the ocean"]}],"check":[{"q":"Which is the hottest layer of Earth?","h":"The very center.","o":["the inner core","the crust","the mantle","the outer core"]},{"q":"What is the thin outer layer of Earth called?","h":"The shell.","o":["the crust","the core","the mantle","the plate"]},{"q":"Melted rock that comes out of a volcano is called:","h":"Above ground.","o":["lava","magma","mantle","crust"]}],"re":[{"how":"Say the peg and picture a hard-boiled egg: Crust is the shell, mantle is the white, core is the yolk. Peel it in your mind, layer by layer.","q":"In the peg, the yolk stands for:","o":["the core","the crust","the mantle","the ocean"]},{"how":"Two layers first: the crust is on top, and the mantle is under it. Top, under. Crust, mantle.","q":"What layer is right under the crust?","o":["the mantle","the inner core","the sky","the ocean floor"]},{"how":"Rock can be solid or melted. Very hot rock melts into a thick liquid, like melted candle wax.","q":"What happens to rock that gets very, very hot?","o":["it melts","it freezes","it floats away","it turns to wood"]}]},"ELEC.FUSA.L07.01":{"name":"The Constitution and the Bill of Rights","task":"Read the First Amendment with Abba. Name the five freedoms it protects.","teach":[{"how":"The Constitution is the supreme law of the United States. It begins with three famous words: We the People. Use the Rights Rundown: We the People wrote the rules; the first 10 changes are the Bill of Rights.","q":"What are the first three words of the Constitution?","pic":"📜","o":["We the People","Four score and","Once upon a time","Hear ye, hear ye"]},{"how":"A change to the Constitution is called an amendment. The first 10 amendments, added in 1791, are called the Bill of Rights.","q":"What are the first 10 amendments called?","pic":"📜","o":["the Bill of Rights","the Declaration of Independence","the Pledge of Allegiance","the Preamble"]},{"how":"The First Amendment protects freedom of religion, speech, the press, gathering peacefully, and asking the government for change. That is why we may learn Torah and daven freely.","q":"Which amendment protects freedom of religion and speech?","pic":"🗽","o":["the First","the Tenth","the Fifth","the Second"]}],"practice":[{"q":"What is the supreme law of the United States?","h":"We the People.","o":["the Constitution","the Declaration of Independence","the Bill of Sale","a President's speech"]},{"q":"A change or addition to the Constitution is called an:","h":"There are 27 of them.","o":["amendment","agreement","announcement","anthem"]},{"q":"Put these in time order: the Bill of Rights is added, the Declaration of Independence, the Constitution is written.","h":"1776, 1787, 1791.","t":"order","tiles":["the Declaration of Independence","the Constitution is written","the Bill of Rights is added"]},{"q":"How many amendments are in the Bill of Rights?","h":"Say the peg.","t":"num","a":10},{"q":"Which freedom does the First Amendment protect?","h":"Torah, speech, press.","o":["freedom of religion","freedom from homework","freedom to drive at any age","freedom to skip taxes"]},{"q":"A newspaper prints a story the government dislikes. Which amendment protects the newspaper?","pic":"📰","h":"Freedom of the press.","o":["the First","the Tenth","the Twenty-Seventh","the Fifth"]}],"check":[{"q":"How does the Constitution begin?","h":"Three words.","o":["We the People","Liberty and justice for all","E Pluribus Unum","Four score and seven years ago"]},{"q":"What is the Bill of Rights?","h":"Say the peg.","o":["the first 10 amendments","the last 10 amendments","a list of taxes","a map of the states"]},{"q":"Which amendment protects the freedom to practice our religion?","h":"Number 1.","o":["the First","the Fifth","the Tenth","the Second"]}],"re":[{"how":"Say the peg with a fist for each part: We the People wrote the rules; the first 10 changes are the Bill of Rights.","q":"In the peg, who wrote the rules?","o":["We the People","the King of England","the Army","the Court"]},{"how":"One idea at a time: an amendment is a change. Amend means to fix or improve. The Constitution can be amended.","q":"To amend something means to:","o":["change or improve it","throw it away","read it aloud to the whole class","hide it"]},{"how":"Rules help a group live together fairly. A family has rules, a school has rules, and a country has laws. The Constitution is the rule book for our government.","q":"The Constitution is like a:","o":["rule book for the government","storybook","cookbook full of recipes for every holiday","phone book"]}]},"ELEC.FPAST.L07.01":{"name":"Ancient Civilizations","task":"Make a four-box poster: one picture each for Egypt, Greece, Rome and China.","teach":[{"how":"A civilization is a large group of people with cities, writing and laws. Take a Civ Snapshot: Egypt built, Greece voted, Rome paved, China walled. Ancient Egypt, Mitzrayim, built giant pyramids along the Nile River.","q":"Which ancient land built the great pyramids?","pic":"🔺","o":["Egypt","Greece","China","Rome"]},{"how":"Ancient Greece gave the world the idea of democracy, where citizens vote on laws. The city of Athens was famous for it. Greece also started the Olympic Games.","q":"Which civilization is known for early democracy?","pic":"🗳️","o":["Greece","Egypt","China","the Roman Empire"]},{"how":"Ancient Rome built thousands of miles of stone roads, and aqueducts: bridges that carried water to cities. Its language, Latin, gave us many English words.","q":"What were Roman aqueducts for?","pic":"🌉","o":["carrying water to cities","storing grain","keeping enemies far away from the walls","racing chariots"]}],"practice":[{"q":"Which civilization built the Great Wall?","pic":"🧱","h":"Walled.","o":["China","Rome","Egypt","Greece"]},{"q":"Egyptian picture writing is called:","h":"Pictures carved on walls.","o":["hieroglyphics","cuneiform","Latin","the Roman alphabet"]},{"q":"Put these in order from oldest to newest: the Roman Empire at its biggest (about 117 CE), the Great Pyramid (about 2560 BCE), the first Olympic Games (776 BCE).","h":"BCE years count down, so bigger BCE numbers are older.","t":"order","tiles":["the Great Pyramid","the first Olympic Games","the Roman Empire at its biggest"]},{"q":"The first Olympic Games were in 776 BCE. The Great Pyramid was built about 2560 BCE. About how many years before the Olympics was the pyramid built?","h":"Subtract the BCE years.","t":"num","a":1784},{"q":"Avraham Avinu came from Ur. Ur was a city in which ancient land, between two rivers?","h":"Between the Tigris and Euphrates.","o":["Mesopotamia","the Roman Empire","Greece","China"]},{"q":"Many English words, like aquarium and library, come from an ancient language. Which civilization spoke it?","pic":"📖","h":"Latin.","o":["Rome","Egypt","China","Mesopotamia"]}],"check":[{"q":"In the peg, what did Rome do?","h":"Roads.","o":["paved","voted","built","walled"]},{"q":"Which civilization started the Olympic Games?","pic":"🥇","h":"Athens and Olympia.","o":["Greece","Rome","China","Egypt"]},{"q":"What is a civilization?","h":"Cities, writing, laws.","o":["a large group with cities, writing and laws","a single small family living alone on a farm","a kind of mountain"]}],"re":[{"how":"Say the peg and act it: Egypt built, Greece voted, Rome paved, China walled. Stack blocks, raise your hand, smooth a road, build a wall.","q":"In the peg, what did Greece do?","o":["voted","built","paved","walled"]},{"how":"One at a time. Egypt: pyramids, the Nile, picture writing. Say it three times: pyramids, Nile, pictures.","q":"Which river flows through Egypt?","o":["the Nile","the Mississippi","the Amazon","the Thames"]},{"how":"Ancient means very, very old: thousands of years ago. Ancient people did not have electricity, cars or phones.","q":"Ancient means:","o":["very old","brand new","very small","very loud"]}]},"ELEC.FTECH.L07.01":{"name":"Light and Sound","task":"In the next storm, count the seconds from flash to boom. Every 5 seconds is about 1 mile away.","teach":[{"how":"Light and sound both travel, but light is much faster. Flash then Boom: Light zooms, sound strolls: you see the flash before you hear the boom. Light travels about 186,000 miles every second!","q":"Which travels faster?","pic":"⚡","o":["light","sound","a jet plane","a race car"]},{"how":"Sound is made by vibrations: tiny back-and-forth shakes. Sound needs something to travel through, like air or water. Empty space has no air, so there is no sound there.","q":"Why is there no sound in outer space?","pic":"🔇","o":["there is no air to carry it","it is too cold","it is too dark","the stars are much too loud for anyone to hear"]},{"how":"An echo is sound that bounces back off a hard surface, like a cliff or a big wall.","q":"What is an echo?","pic":"🏞️","o":["sound bouncing back","light bending","a kind of small mountain bird","a loud engine"]}],"practice":[{"q":"You see lightning and hear thunder 5 seconds later. Why the wait?","h":"Flash then boom.","o":["sound travels slower than light","thunder is so loud it needs time to warm up","thunder starts later","lightning is quiet"]},{"q":"What makes sound?","h":"Shakes.","o":["vibrations","bright colors of light","shadows","magnets"]},{"q":"Put the steps of hearing a drum in order: the sound reaches your ear, the drum is hit, the air carries the vibration, the drum skin vibrates.","pic":"🥁","h":"Start with the stick.","t":"order","tiles":["the drum is hit","the drum skin vibrates","the air carries the vibration","the sound reaches your ear"]},{"q":"Sound travels about 1,100 feet each second in air. How far does it go in 5 seconds?","h":"Multiply.","t":"num","a":5500},{"q":"White sunlight shines through a prism. What comes out?","pic":"🌈","h":"White light is all colors mixed.","o":["a rainbow of colors","a single thin beam of black light","a loud sound","darkness"]},{"q":"Astronauts working outside their ship use radios to talk. Why can they not just shout?","pic":"🛰️","h":"Sound needs air.","o":["space has no air to carry sound","helmets are too thick","the Sun is too loud and drowns them out","shouting is not allowed"]}],"check":[{"q":"Which reaches you first in a storm?","h":"Light zooms.","o":["the flash of lightning","the loud rolling boom of thunder","the rain","the wind"]},{"q":"Sound cannot travel through:","h":"Nothing to shake.","o":["empty space","air","water","wood"]},{"q":"Sound bouncing back off a wall is called:","h":"Hello ... hello ...","o":["an echo","a shadow","a rainbow","a vibration"]}],"re":[{"how":"Say the peg with your hands: Light zooms, sound strolls: you see the flash before you hear the boom. Zoom one hand fast, walk the other one slowly.","q":"In the peg, what does sound do?","o":["strolls","zooms","stops","flies"]},{"how":"Just sound first. Pluck a rubber band: it shakes, and you hear it. When it stops shaking, the sound stops.","q":"What does a rubber band do to make sound?","o":["it vibrates","it glows","it melts","it shrinks"]},{"how":"Energy moves in waves. Ripples in a pond are water waves. Light and sound travel as waves too.","q":"Ripples spreading in a pond are:","o":["waves","rocks","fish","clouds"]}]},"ELEC.FNUM.L07.01":{"name":"The Metric System","task":"Find three things at home labeled in grams, liters or meters. Write each label down.","teach":[{"how":"Most of the world, and all scientists, measure with the metric system. Its units go up and down by tens. Use Prefix Power: King Henry Doesn't Usually Drink Chocolate Milk: kilo, hecto, deka, unit, deci, centi, milli. Kilo means 1,000, so a kilometer is 1,000 meters.","q":"How many meters are in a kilometer?","pic":"📏","o":["1,000","100","10","10,000"]},{"how":"Centi means one hundredth. A centimeter is 1/100 of a meter, so 100 centimeters make 1 meter.","q":"How many centimeters make 1 meter?","pic":"📐","o":["100","10","1,000","1"]},{"how":"Meters measure length, liters measure liquid, and grams measure mass (how heavy). A big bottle of soda holds 2 liters.","q":"Which unit measures how much liquid is in a bottle?","pic":"🧴","o":["liters","meters","grams","degrees"]}],"practice":[{"q":"What does milli mean?","h":"The last word in the peg.","o":["one thousandth","one thousand","one hundred thousand","ten"]},{"q":"Put these in order from smallest to biggest: kilometer, millimeter, meter, centimeter.","h":"Say the peg backward.","t":"order","tiles":["millimeter","centimeter","meter","kilometer"]},{"q":"How many grams are in 3 kilograms?","h":"Kilo means 1,000.","t":"num","a":3000},{"q":"Water freezes at 0 degrees Celsius. At what temperature does it boil?","pic":"🌡️","h":"Celsius uses round numbers for water.","o":["100 degrees Celsius","212 degrees Celsius","50 degrees Celsius","1,000 degrees Celsius"]},{"q":"How many milliliters are in 2 liters?","h":"Milli means one thousandth.","t":"num","a":2000},{"q":"A runner's race is 5 kilometers. How many meters does he run?","pic":"🏁","h":"Kilo!","o":["5,000","500","50","50,000"]}],"check":[{"q":"Which prefix means 1,000?","h":"King.","o":["kilo","centi","milli","deci"]},{"q":"How many meters is 300 centimeters?","h":"100 centimeters make a meter.","o":["3","30","300","3,000"]},{"q":"Which unit measures mass, how heavy something is?","h":"Kilogram.","o":["grams","liters","meters","minutes"]}],"re":[{"how":"Say the peg like a march: King Henry Doesn't Usually Drink Chocolate Milk: kilo, hecto, deka, unit, deci, centi, milli. Each step to the right is ten times smaller.","q":"In the peg, which word stands for centi?","o":["Chocolate","Milk","Doesn't","Usually"]},{"how":"Start with one unit: a meter is about one big step, a little longer than a yard.","q":"About how long is one meter?","o":["one big step","one inch","one mile","the length of a long road"]},{"how":"Our counting is by tens: 10 ones make 10, 10 tens make 100, 10 hundreds make 1,000. Metric uses the same tens.","q":"How many tens make 100?","o":["10","100","1,000","5"]}]}};

{ const F8={"ELEC.FWORLD.L08.01":{"name":"Biggest Countries, Most People","task":"On a world map, color the five largest countries: Russia, Canada, the United States, China and Brazil.","teach":[{"how":"Countries can be big in land or big in people. Think Size or Crowd: Russia is roomiest, India is most crowded. Russia is the largest country by land. It spreads across Europe and Asia.","q":"Which country has the most land?","pic":"🗺️","o":["Russia","Canada","China","the United States"]},{"how":"India has the most people of any country, about 1.4 billion. In 2023 it passed China, which also has about 1.4 billion.","q":"Which country has the most people?","pic":"🏙️","o":["India","China","the United States","Russia"]},{"how":"Canada is the second largest country by land, right after Russia. Most Canadians live near the border with the United States, where it is warmer.","q":"Which is the second largest country by land?","pic":"🍁","o":["Canada","China","Brazil","Australia"]}],"practice":[{"q":"Russia stretches across which two continents?","h":"It is very far north and very wide.","o":["Europe and Asia","Africa and Asia","North and South America","Europe and Africa"]},{"q":"About how many people live in India?","h":"Billions.","o":["about 1.4 billion","about 14 million","about 140 thousand","about 400"]},{"q":"Put these countries in order by land, largest first: the United States, Russia, Canada.","h":"Say the peg.","t":"order","tiles":["Russia","Canada","the United States"]},{"q":"India has about 1,400 million people and the United States about 340 million. About how many million more does India have?","h":"Subtract.","t":"num","a":1060},{"q":"Which country has the third most people?","h":"Our own country.","o":["the United States","Russia","Canada","the United Kingdom of Great Britain"]},{"q":"A traveler crosses 11 time zones and is still in the same country. Which country could it be?","pic":"🕐","h":"Roomiest!","o":["Russia","Jamaica","Israel","Belgium"]}],"check":[{"q":"Which is the largest country by land?","h":"Say the peg.","o":["Russia","China","Canada","Brazil"]},{"q":"Which country passed China in 2023 to have the most people?","h":"Most crowded.","o":["India","Japan","Indonesia","Nigeria"]},{"q":"Canada is famous for being:","h":"After Russia.","o":["the second largest country by land","the most crowded country in the whole world","the smallest country","an island"]}],"re":[{"how":"Say the peg, stretching your arms wide and then squeezing in tight: Russia is roomiest, India is most crowded.","q":"In the peg, which country is most crowded?","o":["India","Russia","Canada","Brazil"]},{"how":"Two ideas first: area means how much land; population means how many people.","q":"Population means:","o":["how many people live there","how much land and water there is in all","how hot it is","how old it is"]},{"how":"A big country can have few people, and a small place can have many. Australia is huge, but it has fewer people than the state of Texas.","q":"Australia is very big. Does it have more people or fewer people than Texas?","pic":"🦘","o":["fewer people","more people","exactly the same"]}]},"ELEC.FNATURE.L08.01":{"name":"Body Systems","task":"Count your heartbeats for one minute while resting, then after 20 jumping jacks. Compare.","teach":[{"how":"The body has systems: groups of parts that work together. Do a System Check: Heart pumps, lungs breathe, bones hold, stomach breaks down, brain bosses. The heart pumps blood through the body about 100,000 times a day.","q":"What does the heart do?","o":["pumps blood","digests food","makes bones","breathes air"]},{"how":"An adult skeleton has 206 bones. Bones hold you up, protect your insides, and work with muscles so you can move.","q":"How many bones are in an adult skeleton?","o":["206","100","52","1,000"]},{"how":"The brain is the boss of the nervous system. It sends and receives messages through nerves, faster than you can blink.","q":"Which part is the boss of the nervous system?","o":["the brain","the stomach","the lungs","the bones"]}],"practice":[{"q":"Which organ takes oxygen from the air into the body?","h":"Breathe.","o":["the lungs","the heart","the stomach","the brain"]},{"q":"What is the largest organ of the body?","h":"It covers you.","o":["the skin","the heart","the brain","the liver"]},{"q":"Put the path of food in order: the small intestine, the mouth, the stomach, the esophagus.","h":"Start where you take a bite.","t":"order","tiles":["the mouth","the esophagus","the stomach","the small intestine"]},{"q":"A heart beats about 70 times a minute. About how many beats is that in 10 minutes?","h":"Multiply.","t":"num","a":700},{"q":"Which system breaks food into nutrients the body can use?","h":"Stomach.","o":["the digestive system","the skeletal system","the nervous system","the respiratory system"]},{"q":"After running, Dovid breathes fast and his heart pounds. Which two systems are working hard?","h":"Breathing and blood.","o":["the respiratory and circulatory systems","the digestive and skeletal systems","only the nervous system and the skin, nothing else at all"]}],"check":[{"q":"In the peg, what do bones do?","h":"Skeleton.","o":["hold","pump","breathe","boss"]},{"q":"Which organ pumps blood?","h":"Pumps.","o":["the heart","the lungs","the skin","the brain"]},{"q":"How many bones does an adult have?","h":"A little over 200.","o":["206","306","26","2,006"]}],"re":[{"how":"Say the peg, tapping a different place for each: Heart pumps, lungs breathe, bones hold, stomach breaks down, brain bosses.","q":"In the peg, what do the lungs do?","o":["breathe","pump","hold","boss"]},{"how":"One system first: breathing. Breathe in slowly: air fills your lungs. Breathe out: used air leaves.","q":"What gas do your lungs take in from the air?","o":["oxygen","smoke","steam","helium"]},{"how":"A system is a group of parts working together for one job. A bicycle is a system: wheels, chain and pedals work together.","q":"A system is:","pic":"🚲","o":["a group of parts working together","one single part that works all alone by itself","a kind of food","a type of bone"]}]},"ELEC.FUSA.L08.01":{"name":"Elections and Terms","task":"With Abba, look up which House district your home is in and how many representatives Maryland has.","teach":[{"how":"Americans choose their leaders in elections. Use the Term Tracker: President 4, Senate 6, House 2: years in each term. A President may be elected only twice, because of the 22nd Amendment.","q":"How many years is a President's term?","pic":"🗳️","o":["4","6","2","8"]},{"how":"The House of Representatives has 435 members. States with more people get more representatives. Every 10 years, the census counts the people.","q":"How many members are in the House of Representatives?","pic":"🏛️","o":["435","100","50","538"]},{"how":"The President is chosen by the Electoral College. There are 538 electors in all. A candidate needs 270, a majority, to win.","q":"How many electoral votes does a candidate need to win?","pic":"🗳️","o":["270","538","100","435"]}],"practice":[{"q":"How long is a senator's term?","h":"Say the peg.","o":["6 years","2 years","4 years","10 years"]},{"q":"How old must a citizen be to vote?","h":"The 26th Amendment set it.","o":["18","16","21","25"]},{"q":"Put these terms in order from shortest to longest: Senate, President, House.","h":"2, 4, 6.","t":"order","tiles":["House","President","Senate"]},{"q":"A President can be elected to 2 terms of 4 years. What is the most years he can be elected to serve?","h":"2 times 4.","t":"num","a":8},{"q":"Why do some states have more representatives than others?","h":"Census.","o":["they have more people","they have more land","they are older","they are closer to the ocean"]},{"q":"A candidate wins 280 electoral votes. Does he win?","h":"270 to win.","o":["yes, 280 is more than 270","no, he needs all 538 electoral votes from every state","no, he needs 435"]}],"check":[{"q":"How many senators does each state have?","h":"Equal for every state.","o":["2","1","10","50"]},{"q":"How long is a term in the House of Representatives?","h":"Say the peg.","o":["2 years","4 years","6 years","8 years"]},{"q":"How many terms may a President be elected to?","h":"The 22nd Amendment.","o":["2","1","3","4"]}],"re":[{"how":"Say the peg three times, holding up fingers: President 4, Senate 6, House 2: years in each term.","q":"In the peg, how many years for the Senate?","o":["6","4","2","8"]},{"how":"One number first: the President serves 4 years. Elections for President are every 4 years, in November.","q":"In which month are national elections held?","o":["November","July","January","September"]},{"how":"An election is when citizens vote to choose their leaders. Each vote is private, and the choice with the most votes wins.","q":"What happens in an election?","o":["citizens vote to choose leaders","the oldest person in the country automatically becomes leader","the army picks the leader"]}]},"ELEC.FPAST.L08.01":{"name":"The Age of Exploration","task":"Trace the three voyages on a world map with three colors. Add the year to each one.","teach":[{"how":"From the 1400s to the 1600s, European sailors searched for sea routes to Asia's spices and riches. Keep a Sail Log: Columbus west, da Gama south and east, Magellan all the way around.","q":"What were many explorers looking for?","pic":"🧭","o":["sea routes to Asia for spices and trade","new places to build big ski resorts in the mountains","gold mines on the Moon"]},{"how":"In 1498, Vasco da Gama of Portugal sailed south around Africa and then east to India. He opened a sea route to Asia.","q":"Where did Vasco da Gama reach by sailing around Africa?","pic":"⛵","o":["India","China","Brazil","Mexico"]},{"how":"Ferdinand Magellan's ships left Spain in 1519. Magellan died on the way, but one ship made it home in 1522. It was the first voyage all the way around the world.","q":"What did Magellan's expedition do first?","pic":"🌐","o":["sailed all the way around the world","reached the North Pole and planted a flag there","discovered Australia"]}],"practice":[{"q":"Which direction did Columbus sail to try to reach Asia?","h":"Say the peg.","o":["west","east","north","south"]},{"q":"Which tool helped sailors find direction at sea?","pic":"🧭","h":"Its needle swings north.","o":["the compass","the telephone","the clock tower","the printing press"]},{"q":"Put the voyages in time order: Magellan around the world (1519), Columbus to the Americas (1492), da Gama to India (1498).","h":"Compare the years.","t":"order","tiles":["Columbus to the Americas","da Gama to India","Magellan around the world"]},{"q":"Magellan's voyage left in 1519 and returned in 1522. How many years did it take?","h":"Subtract.","t":"num","a":3},{"q":"Henry Hudson explored a river in 1609 that is now named after him. Which city sits at its mouth?","h":"The Hudson River.","o":["New York City","Baltimore","Washington, D.C.","Boston"]},{"q":"A ship leaves Portugal, sails south along Africa, rounds its tip, and heads to India. Whose route is this?","h":"South and east.","o":["Vasco da Gama","Christopher Columbus","Magellan","Henry Hudson"]}],"check":[{"q":"Whose expedition first sailed around the whole world?","h":"All the way around.","o":["Magellan","Columbus","da Gama","Hudson"]},{"q":"Why did Europeans want a sea route to Asia?","h":"Pepper and cinnamon.","o":["to trade for spices and silk","to find snow","to escape the summer heat of Spain","to visit the Moon"]},{"q":"In what year did Columbus first reach the Americas?","h":"The rhyme.","o":["1492","1498","1519","1609"]}],"re":[{"how":"Say the peg and trace it on a globe: Columbus west, da Gama south and east, Magellan all the way around.","q":"In the peg, who went all the way around?","o":["Magellan","Columbus","da Gama","Hudson"]},{"how":"One explorer first: Columbus. He sailed west from Spain in 1492 with three ships and reached islands in the Caribbean.","q":"Which country paid for Columbus's voyage?","o":["Spain","Portugal","England","France"]},{"how":"An expedition is a long trip with a goal, like exploring or mapping. Explorers needed ships, food for months, and tools to find their way.","q":"What is an expedition?","o":["a long trip with a goal","a short nap","a kind of spice from India that tastes sweet","a ship's anchor"]}]},"ELEC.FTECH.L08.01":{"name":"How Computers Work","task":"With your teacher, use a binary chart to write the number 13 in 0s and 1s.","teach":[{"how":"Every computer takes in information, works on it, keeps it, and shows the result. Take the Computer Tour: Keyboard in, processor thinks, memory holds, screen shows. The processor, or CPU, follows millions of instructions every second.","q":"Which part of a computer follows instructions and does the thinking?","pic":"💻","o":["the processor (CPU)","the screen","the keyboard","the mouse pad under the mouse"]},{"how":"Computers store everything as numbers made of only 0s and 1s. This is called binary. Each 0 or 1 is a bit, and 8 bits make a byte.","q":"How many bits make one byte?","pic":"🔢","o":["8","2","10","100"]},{"how":"RAM is short-term memory: it holds what you are working on now and empties when the power turns off. Storage, like a hard drive, keeps your files even when the computer is off.","q":"Which keeps your files when the computer is turned off?","pic":"💾","o":["storage, like a hard drive","RAM","the screen","the little light on the power button"]}],"practice":[{"q":"A keyboard is an example of an:","pic":"⌨️","h":"Keyboard in.","o":["input device","output device","processor","screen"]},{"q":"Binary uses which digits?","h":"Two digits.","o":["only 0 and 1","0 through 9","only 1 and 2","letters A to Z"]},{"q":"Put the steps in order when you type a letter: the processor works on it, you press a key, the letter shows on the screen.","h":"Say the peg.","t":"order","tiles":["you press a key","the processor works on it","the letter shows on the screen"]},{"q":"How many bits are in 4 bytes?","h":"8 bits per byte.","t":"num","a":32},{"q":"What happens to what is in RAM when the power goes out?","h":"Short-term.","o":["it is erased","it is printed","it moves to the screen","it doubles"]},{"q":"Moshe saves his report before the power goes out. Where is it kept safe?","h":"Storage keeps it.","o":["in storage, on the drive","in RAM","on the keyboard","on the screen until the power returns"]}],"check":[{"q":"In the peg, what does memory do?","h":"Say the peg.","o":["holds","thinks","shows","types"]},{"q":"A computer screen is an:","pic":"🖥️","h":"Screen shows.","o":["output device","input device","processor","storage drive for files"]},{"q":"A bit is:","h":"The smallest piece of information.","o":["a single 0 or 1","8 bytes","a keyboard key","a small piece of the keyboard"]}],"re":[{"how":"Say the peg while you act it out: Keyboard in, processor thinks, memory holds, screen shows. Type, tap your head, hug a box, then frame a picture.","q":"In the peg, what does the screen do?","o":["shows","thinks","holds","types"]},{"how":"Start with in and out. Input goes into the computer: keyboard, mouse, microphone. Output comes out: screen, printer, speakers.","q":"A printer is:","pic":"🖨️","o":["output","input","storage","a processor"]},{"how":"A computer is a machine that follows instructions, called a program, very quickly. It cannot think on its own; it only does what the program says.","q":"A list of instructions a computer follows is called a:","o":["program","keyboard","screen","battery"]}]},"ELEC.FNUM.L08.01":{"name":"Distances and Speeds in Space","task":"Make a scale model: if Earth is a 1-inch marble, put the Moon about 30 inches away. Measure it out.","teach":[{"how":"Space distances are huge. Read the Space Speedometer: Moon 239 thousand, Sun 93 million, light 186 thousand each second. The Moon is about 239,000 miles from Earth.","q":"About how far is the Moon from Earth?","pic":"🌕","o":["239,000 miles","93 million miles","2,390 miles","186,000 miles"]},{"how":"The Sun is about 93 million miles away. That is so far that its light takes about 8 minutes to reach us.","q":"About how long does sunlight take to reach Earth?","pic":"☀️","o":["about 8 minutes","about 8 seconds","about 8 days","about 8 years"]},{"how":"Light is the fastest thing there is. It travels about 186,000 miles every second. It could circle Earth more than 7 times in one second.","q":"About how far does light travel in one second?","pic":"💡","o":["186,000 miles","186 miles","1,860,000 miles","18 miles"]}],"practice":[{"q":"Which is farther from Earth?","h":"Millions versus thousands.","o":["the Sun","the Moon","a satellite","a jet plane"]},{"q":"Put these from nearest to farthest from Earth: the Sun, a jet plane, the Moon.","h":"Jets fly about 7 miles up.","t":"order","tiles":["a jet plane","the Moon","the Sun"]},{"q":"The Moon is about 239,000 miles away. A trip there and back is about how many miles?","h":"Double it.","t":"num","a":478000},{"q":"Astronauts reached the Moon in about 3 days. Light gets there in about:","pic":"🚀","h":"Light is fastest.","o":["1 second","1 hour","3 days","1 year"]},{"q":"Light travels about 186,000 miles each second. About how many miles does it travel in 2 seconds?","h":"Double it.","t":"num","a":372000},{"q":"A news report says, \"The Sun is 93 million miles away.\" What does that mean about its light?","pic":"📰","h":"Far means it takes time.","o":["it takes about 8 minutes to reach us","it reaches us instantly","it takes a whole year and a day to reach us"]}],"check":[{"q":"About how far away is the Sun?","h":"Say the peg.","o":["93 million miles","239,000 miles","93 thousand miles","9 billion miles"]},{"q":"What is the fastest thing in the universe?","h":"Flash!","o":["light","sound","a rocket","a cheetah"]},{"q":"The Moon's distance from Earth is about:","h":"Thousands, not millions.","o":["239,000 miles","2,390 miles","23,900,000 miles","239 miles"]}],"re":[{"how":"Say the peg slowly and write the numbers in the air: Moon 239 thousand, Sun 93 million, light 186 thousand each second.","q":"In the peg, which number goes with light?","o":["186 thousand","239 thousand","93 million","8 minutes"]},{"how":"One distance first: the Moon. If you drove a car nonstop at 60 miles an hour, it would take about five and a half months to get there.","q":"Is the Moon closer to Earth than the Sun?","o":["yes, much closer","no, much farther","they are the same distance"]},{"how":"Speed tells how far something goes in a certain time, like miles per hour or miles per second.","q":"Speed tells:","pic":"🚗","o":["how far something goes in a certain time","how heavy something is and how much it weighs in pounds","what color it is"]}]}};
