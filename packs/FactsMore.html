{ const F9={"ELEC.FWORLD.L09.01":{"name":"Eretz Yisrael on the Map","task":"Draw a map of Eretz Yisrael. Label the Mediterranean, the Kinneret, the Jordan River, the Dead Sea and the Negev.","teach":[{"how":"Eretz Yisrael is a small land at the eastern edge of the Mediterranean Sea. Use the Land Locator: Sea to the west, Dead Sea low in the east, Kinneret up north, desert down south.","q":"Which sea is on the west coast of Eretz Yisrael?","pic":"🗺️","o":["the Mediterranean Sea","the Dead Sea","the Red Sea","the Caspian Sea, far to the north"]},{"how":"The shore of the Dead Sea is the lowest place on land on Earth, about 1,400 feet below sea level. Its water is so salty that people float easily.","q":"What record does the Dead Sea hold?","pic":"🧂","o":["lowest place on land","highest mountain","largest lake in the whole world","coldest sea"]},{"how":"The Jordan River flows south from the Kinneret, the Sea of Galilee, down into the Dead Sea.","q":"Which river flows from the Kinneret into the Dead Sea?","pic":"🏞️","o":["the Jordan River","the Nile","the Euphrates","the Mississippi"]}],"practice":[{"q":"Which desert is in the south of Eretz Yisrael?","pic":"🏜️","h":"Say the peg: desert down south.","o":["the Negev","the Sahara","the Gobi","the Mojave"]},{"q":"Which country lies to the southwest, across the Sinai?","h":"Mitzrayim.","o":["Egypt","Russia","Canada","Japan"]},{"q":"Put these from north to south: the Dead Sea, the Kinneret, the Negev desert.","h":"Say the peg.","t":"order","tiles":["the Kinneret","the Dead Sea","the Negev desert"]},{"q":"The Dead Sea shore is about 1,400 feet below sea level. Yerushalayim is about 2,500 feet above sea level. How many feet higher is Yerushalayim?","h":"Add the two.","t":"num","a":3900},{"q":"Why do people float so easily in the Dead Sea?","h":"Salt makes water heavier.","o":["the water is very salty","the water is very cold","the water is very shallow","there are big waves"]},{"q":"A traveler walks down from Yerushalayim to the lowest place on land. Where is he going?","h":"Lowest!","o":["the Dead Sea","the Kinneret","the Mediterranean coast","Mount Hermon"]}],"check":[{"q":"The Kinneret is also called:","h":"Up north.","o":["the Sea of Galilee","the Red Sea","the Dead Sea","the Mediterranean Sea"]},{"q":"Which sea has the lowest shore on land?","h":"Low in the east.","o":["the Dead Sea","the Red Sea","the Mediterranean Sea","the Sea of Galilee"]},{"q":"Which river forms much of the border between Israel and Jordan?","h":"Same name as the country.","o":["the Jordan River","the Nile","the Tigris","the Euphrates, far to the east"]}],"re":[{"how":"Say the peg and draw the land in the air: Sea to the west, Dead Sea low in the east, Kinneret up north, desert down south.","q":"In the peg, what is up north?","o":["the Kinneret","the desert","the Dead Sea","the Mediterranean Sea"]},{"how":"Start with two waters: the big Mediterranean Sea on the west coast, and the small, salty Dead Sea in the east.","q":"Which is saltier?","o":["the Dead Sea","the Mediterranean Sea","a fresh lake","rain water"]},{"how":"Sea level is the height of the ocean's surface. We measure land as feet above or below sea level.","q":"A place 100 feet below sea level is:","o":["lower than the ocean surface","higher than the ocean surface","under the ocean water"]}]},"ELEC.FNATURE.L09.01":{"name":"Elements and the Periodic Table","task":"Look at a periodic table. Find the five elements in the peg and color them.","teach":[{"how":"Everything is made of elements: pure substances that cannot be broken into simpler ones. There are 118 known elements, listed on the periodic table. Crack the Symbol Code: H for hydrogen, O for oxygen, C for carbon, Fe for iron, Au for gold.","q":"What is the symbol for oxygen?","pic":"⚗️","o":["O","Ox","Og","X"]},{"how":"Some symbols come from Latin names. Gold is Au, from the Latin aurum. Iron is Fe, from ferrum.","q":"What is the symbol for gold?","pic":"🥇","o":["Au","Go","Gd","G"]},{"how":"Water is a compound: two elements joined together. Its formula, H2O, means 2 hydrogen atoms and 1 oxygen atom.","q":"What two elements make up water?","pic":"💧","o":["hydrogen and oxygen","carbon dioxide and iron oxide","gold and silver","salt and sugar"]}],"practice":[{"q":"Which element has the symbol Fe?","h":"Latin ferrum.","o":["iron","fluorine","fermium","gold"]},{"q":"How many elements are known today?","h":"Over 100.","o":["118","92","50","1,000"]},{"q":"Put these in order from lightest to heaviest element: oxygen, hydrogen, iron, gold.","h":"The lightest element of all floats balloons.","t":"order","tiles":["hydrogen","oxygen","iron","gold"]},{"q":"How many atoms are in one molecule of water, H2O?","h":"2 + 1.","t":"num","a":3},{"q":"About what part of the air we breathe is nitrogen?","h":"Most of the air.","o":["about 78 percent","about 21 percent","about 1 percent","100 percent"]},{"q":"A chemist writes NaCl on a jar. What is in it?","pic":"🧂","h":"Sodium and chlorine.","o":["table salt","sugar","water","gold"]}],"check":[{"q":"What is the symbol for hydrogen?","h":"Say the peg.","o":["H","Hy","Hd","He"]},{"q":"Water's formula is:","h":"Hydrogen and oxygen.","o":["H2O","CO2","NaCl","O2"]},{"q":"What is an element?","h":"Gold and oxygen are examples.","o":["a pure substance that cannot be broken into simpler ones","a mixture of many different things stirred together in a big bowl","a kind of machine"]}],"re":[{"how":"Say the peg and write each symbol in the air: H for hydrogen, O for oxygen, C for carbon, Fe for iron, Au for gold.","q":"In the peg, what is Au?","o":["gold","iron","oxygen","carbon"]},{"how":"Start with the easy symbols, the first letter of the name: H hydrogen, O oxygen, C carbon, N nitrogen.","q":"What is the symbol for nitrogen?","o":["N","Ni","Nt","No"]},{"how":"Everything around you is made of tiny particles called atoms. An element has only one kind of atom.","q":"Everything is made of tiny:","o":["atoms","cells only","marbles","grains of sand"]}]},"ELEC.FUSA.L09.01":{"name":"America Grows","task":"Make a growth timeline with the five dates from the peg. Add a small drawing for each.","teach":[{"how":"The United States grew from 13 states to 50. Read the Growth Chart: 1803 Louisiana, 1865 slavery ended, 1867 Alaska, 1869 railroad, 1959 Hawaii. In 1803, President Jefferson bought the Louisiana Territory from France and doubled the country's size.","q":"Which purchase doubled the size of the United States in 1803?","pic":"🗺️","o":["the Louisiana Purchase","the Alaska Purchase","the Gadsden Purchase","the purchase of Florida from Spain"]},{"how":"The Civil War, from 1861 to 1865, was fought between the North and the South. After the North won, the 13th Amendment ended slavery in 1865.","q":"Which amendment ended slavery?","pic":"⚖️","o":["the 13th","the 1st","the 19th","the 26th"]},{"how":"In 1869, the first railroad across the whole country was finished in Utah with a golden spike. A coast-to-coast trip went from months to about a week.","q":"What was finished in 1869 with a golden spike?","pic":"🚂","o":["the first railroad across the country","the Erie Canal","the Brooklyn Bridge","the very first paved highway from coast to coast"]}],"practice":[{"q":"From which country did the U.S. buy Alaska in 1867?","pic":"🏔️","h":"Across the Bering Strait.","o":["Russia","Canada","France","England"]},{"q":"Which was the 50th state, in 1959?","pic":"🏝️","h":"Say the peg.","o":["Hawaii","Alaska","Texas","Arizona"]},{"q":"Put these in time order: Hawaii becomes a state, the Louisiana Purchase, Alaska is bought, the Civil War ends.","h":"Say the peg.","t":"order","tiles":["the Louisiana Purchase","the Civil War ends","Alaska is bought","Hawaii becomes a state"]},{"q":"The country began with 13 states. Today there are 50. How many states joined later?","h":"Subtract.","t":"num","a":37},{"q":"Who was President during the Civil War?","h":"Number 16.","o":["Abraham Lincoln","Thomas Jefferson","George Washington","Theodore Roosevelt"]},{"q":"A family in 1870 wants to cross the country fast. What new way can they use?","h":"1869.","o":["the transcontinental railroad","an airplane","a car on the new interstate highway system","a rocket"]}],"check":[{"q":"In what year did the Civil War end and slavery end?","h":"Say the peg.","o":["1865","1803","1869","1959"]},{"q":"What did the U.S. buy from France in 1803?","h":"Jefferson.","o":["the Louisiana Territory","Alaska","Hawaii","the island of Puerto Rico"]},{"q":"Which state was bought from Russia?","h":"1867.","o":["Alaska","Hawaii","Louisiana","Texas"]}],"re":[{"how":"Say the peg like a train schedule: 1803 Louisiana, 1865 slavery ended, 1867 Alaska, 1869 railroad, 1959 Hawaii.","q":"In the peg, what goes with 1959?","o":["Hawaii","Alaska","railroad","Louisiana"]},{"how":"One event first: the Louisiana Purchase. Picture the map: before 1803 the country ended near the Mississippi River; after, it reached the Rocky Mountains.","q":"Before 1803, the country's western edge was near:","o":["the Mississippi River","the far end of the Pacific Ocean","Hawaii","Alaska"]},{"how":"A territory is land that belongs to a country but is not yet a state. Many territories later became states.","q":"A territory is:","o":["land that is not yet a state","a big city with many tall buildings","a kind of river"]}]},"ELEC.FPAST.L09.01":{"name":"The Industrial Revolution","task":"Look at the label on your shirt. Where was it made? Find that country on a map.","teach":[{"how":"About 1760, a big change began in Britain called the Industrial Revolution. Hit the Factory Fast-Forward: Hand to machine, farm to factory, village to city. Machines began doing work that people once did by hand.","q":"Where did the Industrial Revolution begin?","pic":"🏭","o":["Britain","Japan","Brazil","Egypt"]},{"how":"Steam engines powered the new factories and trains. Coal was burned to boil the water for the steam.","q":"What fuel was burned to power most steam engines?","pic":"⛏️","o":["coal","sand","salt","sugar"]},{"how":"People moved from farms to cities to work in factories. Cities grew fast, but workers, even children, worked long hours. Later, laws limited child labor and made work safer.","q":"Where did many people move to find factory jobs?","pic":"🏙️","o":["to cities","to farms","to islands","to the mountains"]}],"practice":[{"q":"Which industry was one of the first to use big machines?","pic":"🧵","h":"Spinning and weaving.","o":["making cloth (textiles)","making cars","making computers and video screens","making rockets"]},{"q":"What did the Industrial Revolution change most?","h":"Say the peg.","o":["work moved from hands to machines","everyone stopped eating bread and drank only milk","the Moon got closer"]},{"q":"Put the peg in order: farm to factory, village to city, hand to machine.","h":"Say the peg.","t":"order","tiles":["hand to machine","farm to factory","village to city"]},{"q":"A worker in 1830 worked 12 hours a day for 6 days. How many hours a week was that?","h":"Multiply.","t":"num","a":72},{"q":"What new kind of transportation did steam power make possible?","pic":"🚂","h":"Tracks.","o":["railroads","airplanes","cars","electric scooters"]},{"q":"A town of 500 farmers becomes a city of 50,000 workers in 60 years, all near a cloth factory. What is happening?","h":"Farm to factory.","o":["the Industrial Revolution","the Stone Age","the age of ancient Rome and Greece","the Ice Age"]}],"check":[{"q":"In the peg, villages became:","h":"Say the peg.","o":["cities","farms","forests","islands"]},{"q":"What powered the early factories and trains?","h":"Coal and water.","o":["steam engines","solar panels","computers","wind-up springs"]},{"q":"About when did the Industrial Revolution begin?","h":"The 1700s.","o":["around 1760","around 1492","around 1969","around 2000"]}],"re":[{"how":"Say the peg with hand motions: Hand to machine, farm to factory, village to city. Three big changes.","q":"In the peg, farms became:","o":["factories","cities","machines","villages"]},{"how":"One change first: machines. One spinning machine could make as much thread as dozens of people spinning by hand.","q":"Why were machines faster than hand work?","o":["one machine could do the work of many people","machines never needed any fuel, oil or fixing at all","people were not allowed to work"]},{"how":"A revolution is a big change. The Industrial Revolution was not a war; it was a big change in how things were made.","q":"Here, revolution means:","o":["a big change","a war with soldiers","a spinning top","a song"]}]},"ELEC.FTECH.L09.01":{"name":"Energy Sources","task":"Ask Abba where your family's electricity comes from. Is it renewable?","teach":[{"how":"We get energy from many sources. Use the Renew Rule: Sun, wind and water come back; coal, oil and gas run out. Sources that come back are called renewable.","q":"Which is a renewable energy source?","pic":"🌬️","o":["wind","coal","oil","natural gas"]},{"how":"Coal, oil and natural gas are fossil fuels. They formed underground over a very long time, and once burned, they are gone.","q":"Coal, oil and natural gas are called:","pic":"🛢️","o":["fossil fuels","renewable fuels","solar fuels","water fuels"]},{"how":"A hydroelectric dam uses falling water to spin turbines and make electricity. Solar panels turn sunlight straight into electricity.","q":"What does a hydroelectric dam use to make electricity?","pic":"💧","o":["falling water","burning coal and oil","sunlight only","wind only"]}],"practice":[{"q":"Which energy source will run out one day?","h":"Say the peg.","o":["oil","sunlight","wind","falling water"]},{"q":"What do solar panels collect?","pic":"☀️","h":"Sol means sun.","o":["sunlight","wind","coal","water"]},{"q":"Put the steps of a coal power plant in order: steam spins a turbine, coal is burned, water boils into steam, the turbine makes electricity.","h":"Start with the fire.","t":"order","tiles":["coal is burned","water boils into steam","steam spins a turbine","the turbine makes electricity"]},{"q":"A solar panel makes 300 watts. How many watts do 5 panels make?","h":"Multiply.","t":"num","a":1500},{"q":"Why are many people building wind and solar power?","h":"Renew Rule.","o":["they are renewable and do not run out","they are made of coal and oil that never run out","they work only at night"]},{"q":"A town by a big river wants clean power that comes back every day. What could it build?","pic":"🏞️","h":"River!","o":["a hydroelectric dam","a large coal mine with many deep tunnels","an oil well","a gas station"]}],"check":[{"q":"Which is a fossil fuel?","h":"It runs out.","o":["natural gas","sunlight","wind","falling water"]},{"q":"In the peg, which sources come back?","h":"Say the peg.","o":["sun, wind and water","coal, oil and gas","only coal from deep mines","only oil"]},{"q":"Solar panels turn sunlight into:","h":"Power for lights.","o":["electricity","coal","water","wind"]}],"re":[{"how":"Say the peg and sort with your hands: Sun, wind and water come back; coal, oil and gas run out. Left hand for come back, right hand for run out.","q":"In the peg, what happens to coal, oil and gas?","o":["they run out","they come back","they grow","they melt"]},{"how":"One source first: the Sun. It rises every morning, so its energy keeps coming back. That is what renewable means.","q":"Renewable means:","o":["it comes back and will not run out","it runs out quickly and can never be used again","it is very old"]},{"how":"Energy is the power to do work: to move, heat or light something. Food gives your body energy; fuel gives a car energy.","q":"What gives a car energy?","pic":"⛽","o":["fuel","paint","its tires","its radio"]}]},"ELEC.FNUM.L09.01":{"name":"Percents in Our World","task":"Color a 10-by-10 grid: 71 squares blue for water and 29 green for land.","teach":[{"how":"Percent means out of 100. Draw a Per-Hundred Picture: 71 water, 97 salty, 78 nitrogen, 21 oxygen: out of every 100. About 71 percent of Earth's surface is covered by water.","q":"About what percent of Earth's surface is water?","pic":"🌍","o":["71 percent","29 percent","50 percent","97 percent"]},{"how":"About 97 percent of Earth's water is salty ocean water. Only a little is fresh water we can drink, and much of that is frozen in ice.","q":"About what percent of Earth's water is salty?","pic":"🌊","o":["97 percent","50 percent","3 percent","71 percent"]},{"how":"The air is about 78 percent nitrogen and 21 percent oxygen. The last 1 percent is other gases.","q":"About what percent of the air is oxygen?","pic":"💨","o":["21 percent","78 percent","50 percent","100 percent"]}],"practice":[{"q":"What does percent mean?","h":"Cent means hundred.","o":["out of 100","out of 10","out of 1,000","out of 12"]},{"q":"Put these from smallest to biggest percent: nitrogen in air, oxygen in air, salty water on Earth.","h":"21, 78, 97.","t":"order","tiles":["oxygen in air","nitrogen in air","salty water on Earth"]},{"q":"If 71 percent of Earth's surface is water, what percent is land?","h":"100 minus 71.","t":"num","a":29},{"q":"About what percent of the human body is water?","pic":"💧","h":"More than half.","o":["about 60 percent","about 6 percent","about 99 percent","about 16 percent"]},{"q":"In a class of 20 boys, 50 percent wear glasses. How many boys is that?","h":"50 percent is half.","t":"num","a":10},{"q":"A juice label says 100 percent juice. What does that mean?","pic":"🧃","h":"All of it.","o":["it is all juice","it is half juice","it has no juice","it has 100 cups"]}],"check":[{"q":"About what percent of the air is nitrogen?","h":"Say the peg.","o":["78 percent","21 percent","1 percent","97 percent"]},{"q":"Percent means out of:","h":"Cent.","o":["100","10","1,000","60"]},{"q":"Most of Earth's water is:","h":"97 percent.","o":["salty ocean water","fresh lake water","ice cubes in freezers","bottled water"]}],"re":[{"how":"Say the peg and count on a hundred-square chart: 71 water, 97 salty, 78 nitrogen, 21 oxygen: out of every 100.","q":"In the peg, which number goes with nitrogen?","o":["78","71","97","21"]},{"how":"Start with 50 percent: that is half. 25 percent is a quarter. 100 percent is the whole thing.","q":"What is 50 percent of 100?","o":["50","25","100","5"]},{"how":"A fraction like 1/2 can be written as a percent: 1/2 = 50 percent. Out of 100 squares, 50 are colored.","q":"Which percent equals one half?","o":["50 percent","12 percent","2 percent","100 percent"]}]}};
window.TL_FACT=window.TL_FACT||{}; Object.assign(window.TL_FACT,F9); }

{ const F10={"ELEC.FWORLD.L10.01":{"name":"Climate Zones and Biomes","task":"Pick one biome. Make a poster with its climate, two plants and two animals.","teach":[{"how":"Climate is the usual weather of a place over many years. Use Zone Zoom: Hot at the middle, mild in between, cold at the poles. The tropical zone lies near the equator, the temperate zones lie between, and the polar zones surround the poles.","q":"Which climate zone lies near the equator?","pic":"🌴","o":["tropical","polar","temperate","arctic"]},{"how":"A biome is a large area with its own climate, plants and animals. Rainforests are hot and wet; deserts are dry; the tundra is cold, flat and treeless.","q":"Which biome is cold, flat and treeless?","pic":"❄️","o":["tundra","rainforest","desert","grassland"]},{"how":"The taiga, also called the boreal forest, is the world's largest land biome. It is a cold forest of evergreen trees across Canada, Russia and northern Europe.","q":"What kind of trees fill the taiga?","pic":"🌲","o":["evergreens like pine and spruce","tall tropical palm trees by the beach","cactus plants","banana trees"]}],"practice":[{"q":"Which climate zone is Maryland in?","h":"Four seasons.","o":["temperate","tropical","polar","desert"]},{"q":"Which biome gets the most rain?","pic":"🌧️","h":"Its name says it.","o":["tropical rainforest","desert","tundra","temperate grassland prairie"]},{"q":"Put these zones in order from the equator to the North Pole: polar, tropical, temperate.","h":"Say the peg.","t":"order","tiles":["tropical","temperate","polar"]},{"q":"A desert gets about 8 inches of rain a year. A rainforest gets about 80 inches. How many times more rain does the rainforest get?","h":"Divide.","t":"num","a":10},{"q":"What is the difference between weather and climate?","h":"A short time versus a long time.","o":["weather is today; climate is the usual pattern over years","they are exactly the same","climate is only about rain and has nothing to do with temperature"]},{"q":"A scientist finds no trees, frozen ground and short summers near the Arctic. Which biome is it?","h":"Treeless and cold.","o":["tundra","taiga","rainforest","savanna"]}],"check":[{"q":"Which zone surrounds the North and South Poles?","h":"Cold.","o":["polar","tropical","temperate","equatorial"]},{"q":"What is a biome?","h":"Desert and tundra are examples.","o":["a large area with its own climate, plants and animals","a kind of weather balloon","a single very large tree growing in the middle of a forest"]},{"q":"Which is the largest land biome?","h":"Evergreens.","o":["the taiga","the tundra","the desert","the rainforest"]}],"re":[{"how":"Say the peg and move your hand down the globe: Hot at the middle, mild in between, cold at the poles.","q":"In the peg, what is it like at the poles?","o":["cold","hot","mild","rainy"]},{"how":"Start with the sun. Near the equator, sunlight hits straight down, so it is hot. Near the poles, it hits at a slant, so it is cold.","q":"Why is it hot near the equator?","o":["sunlight hits it most directly","it is closer to the Moon","the ocean water there boils every day"]},{"how":"Weather is what the air is like today: hot or cold, rainy or dry. Climate is the weather pattern over many years.","q":"Today it is rainy. Is that weather or climate?","o":["weather","climate","both the same","neither one"]}]},"ELEC.FNATURE.L10.01":{"name":"Newton's Laws of Motion","task":"Put a coin on a card on top of a cup. Flick the card away fast. Explain where the coin goes using inertia.","teach":[{"how":"Isaac Newton described how things move in three laws, published in 1687. Use Motion Moves: Things keep doing what they are doing; force equals mass times acceleration; every push gets a push back. Law 1, inertia: a resting ball stays still, and a moving one keeps moving, unless a force acts on it.","q":"Which law says a moving object keeps moving unless a force stops it?","pic":"🍎","o":["the first law (inertia)","the second law","the third law","the law of gravity only"]},{"how":"Law 2: force equals mass times acceleration, F = m × a. A heavier object needs more force to speed up by the same amount.","q":"To speed up a full shopping cart as fast as an empty one, you need:","pic":"🛒","o":["more force","less force","no force","the same force"]},{"how":"Law 3: for every action there is an equal and opposite reaction. When you jump off a boat onto a dock, you push the boat back.","q":"A rocket pushes hot gas down. What happens to the rocket?","pic":"🚀","o":["it goes up","it goes down","it stays still","it spins in place"]}],"practice":[{"q":"Why do you lurch forward when a bus stops suddenly?","pic":"🚌","h":"First law.","o":["your body keeps moving (inertia)","the bus pushes you forward","gravity pulls you forward toward the front window","the seat throws you"]},{"q":"What is the formula for Newton's second law?","h":"Force, mass, acceleration.","o":["F = m × a","E = mc²","a² + b² = c²","V = I × R"]},{"q":"Put Newton's laws in order: action and reaction, inertia, F = m × a.","h":"Say the peg.","t":"order","tiles":["inertia","F = m × a","action and reaction"]},{"q":"A force pushes a 4-kilogram cart so it speeds up by 3 meters per second each second. How many newtons of force is that? (F = m × a)","h":"Multiply.","t":"num","a":12},{"q":"On Earth, a falling object speeds up by about how much each second?","h":"Just under 10.","o":["9.8 meters per second","98 meters per second","1 meter per second","100 meters per second"]},{"q":"An astronaut floating in space throws a wrench forward. What happens to him?","pic":"🛰️","h":"Third law.","o":["he drifts backward","he stays perfectly still","he moves forward too"]}],"check":[{"q":"Which law says every action has an equal and opposite reaction?","h":"Push back.","o":["the third law","the first law","the second law","no law"]},{"q":"Inertia means an object:","h":"First law.","o":["keeps doing what it is doing unless a force acts","always slows down and stops by itself after a few seconds","always speeds up"]},{"q":"Who wrote the three laws of motion in 1687?","h":"The apple story.","o":["Isaac Newton","Albert Einstein","Galileo","Thomas Edison"]}],"re":[{"how":"Say the peg in three beats: Things keep doing what they are doing; force equals mass times acceleration; every push gets a push back.","q":"In the peg, what does every push get?","o":["a push back","nothing","a bigger push forward","a stop"]},{"how":"One law first: inertia. Roll a ball on the floor: it keeps rolling until the floor's friction slows it.","q":"What slows a rolling ball on the floor?","o":["friction","inertia","magnetism","light"]},{"how":"A force is a push or a pull. Forces can start motion, stop it, or change its direction.","q":"A force is a:","o":["push or pull","color","sound","kind of metal"]}]},"ELEC.FUSA.L10.01":{"name":"How the Economy Works","task":"Compare the price of one item at two stores, or in two months. Explain the difference with supply and demand.","teach":[{"how":"An economy is how people make, buy and sell goods and services. Look in the Market Mirror: Scarce goes up, plenty goes down: supply and demand set the price. When many people want something but there is little of it, the price rises.","q":"Many people want a toy, but stores have very few. What usually happens to its price?","pic":"🧸","o":["it goes up","it goes down","it stays exactly the same","it becomes free"]},{"how":"Inflation is when prices across the economy rise over time, so each dollar buys less than before.","q":"What is inflation?","pic":"📈","o":["prices rising over time","prices falling every single day forever","a bank closing","a new coin"]},{"how":"The Federal Reserve is the central bank of the United States. It raises or lowers interest rates to help keep prices steady and jobs plentiful.","q":"What is the Federal Reserve?","pic":"🏦","o":["the central bank of the United States","a national park in Wyoming with geysers","a branch of Congress","a kind of tax"]}],"practice":[{"q":"Farmers grow a huge crop of apples, more than people want. What happens to apple prices?","pic":"🍎","h":"Plenty.","o":["they go down","they go up","they double","they stay fixed by law"]},{"q":"GDP measures:","h":"Gross Domestic Product.","o":["the total value of goods and services a country makes","how many people live in a country and how old they are","how big a country is"]},{"q":"Put these in order to show supply and demand: the price rises, a new game becomes very popular, stores run low on the game.","h":"Demand comes first.","t":"order","tiles":["a new game becomes very popular","stores run low on the game","the price rises"]},{"q":"A $100 item rises in price by 3 percent from inflation. What is the new price in dollars?","h":"3 percent of 100 is 3.","t":"num","a":103},{"q":"What does the government use taxes for?","h":"Things we all share.","o":["roads, schools, the army and other services","buying candy for itself","nothing at all; it saves every dollar in a big box forever"]},{"q":"A store owner sees that everyone wants umbrellas on a rainy day and few are left. What might he do?","pic":"☂️","h":"Scarce.","o":["raise the price","give them all away","lower the price to zero"]}],"check":[{"q":"In the peg, what happens to the price of something scarce?","h":"Say the peg.","o":["it goes up","it goes down","it disappears","it stays the same"]},{"q":"When there is inflation, a dollar buys:","h":"Prices rise.","o":["less than before","more than before","exactly the same","nothing at all"]},{"q":"Who raises and lowers interest rates for the whole country?","h":"The central bank.","o":["the Federal Reserve","the Supreme Court in Washington, D.C.","the Post Office","the mayor"]}],"re":[{"how":"Say the peg with your hands moving up and down: Scarce goes up, plenty goes down: supply and demand set the price.","q":"In the peg, what sets the price?","o":["supply and demand","the weather","the President","the color of the store's sign out front"]},{"how":"Two words first: supply is how much there is; demand is how much people want.","q":"Demand means:","o":["how much people want something","how much there is of something","how heavy something is"]},{"how":"Money is what we trade for goods and services. Goods are things you can hold, like bread; services are work done for you, like a haircut.","q":"A haircut is a:","pic":"💈","o":["service","good","tax","loan"]}]},"ELEC.FPAST.L10.01":{"name":"The World Wars","task":"Ask a grandparent or older neighbor what they were told about World War II. Write three facts.","teach":[{"how":"Two huge wars in the 1900s involved much of the world. Learn the War Years: World War I, 1914 to 1918; World War II, 1939 to 1945.","q":"When did World War I take place?","pic":"🌍","o":["1914 to 1918","1939 to 1945","1861 to 1865","1775 to 1783"]},{"how":"The United States entered World War II after Japan attacked Pearl Harbor, Hawaii, on December 7, 1941.","q":"What attack brought the United States into World War II?","pic":"⚓","o":["Pearl Harbor","the Alamo","Gettysburg","the Battle of Bunker Hill"]},{"how":"On June 6, 1944, called D-Day, Allied soldiers landed on the beaches of Normandy, France. It began freeing Western Europe. The war ended in 1945, and the United Nations was founded that year.","q":"Where did the D-Day landings happen?","pic":"🏖️","o":["Normandy, France","Hawaii","London","the coast of California"]}],"practice":[{"q":"When did World War II end?","h":"Say the peg.","o":["1945","1918","1941","1939"]},{"q":"Which world organization was founded in 1945 to help keep peace?","pic":"🇺🇳","h":"Its headquarters is in New York.","o":["the United Nations","NASA","the Red Cross","the International Olympic Committee"]},{"q":"Put these in order: D-Day, World War I begins, Pearl Harbor is attacked, World War II ends.","h":"1914, 1941, 1944, 1945.","t":"order","tiles":["World War I begins","Pearl Harbor is attacked","D-Day","World War II ends"]},{"q":"World War II lasted from 1939 to 1945. How many years was that?","h":"Subtract.","t":"num","a":6},{"q":"Who was President when Pearl Harbor was attacked?","h":"Elected four times.","o":["Franklin D. Roosevelt","Abraham Lincoln","George Washington","Thomas Jefferson of Virginia"]},{"q":"A history book says, \"June 6, 1944: soldiers storm the beaches of France.\" What event is this?","pic":"📖","h":"Normandy.","o":["D-Day","Pearl Harbor","the end of World War I","the Civil War"]}],"check":[{"q":"When did World War II begin?","h":"Say the peg.","o":["1939","1914","1941","1945"]},{"q":"On what date was Pearl Harbor attacked?","h":"A date which will live in infamy.","o":["December 7, 1941","July 4, 1776","June 6, 1944","November 11, 1918"]},{"q":"World War I took place from:","h":"Say the peg.","o":["1914 to 1918","1939 to 1945","1914 to 1945","1900 to 1910"]}],"re":[{"how":"Say the peg twice, slowly: World War I, 1914 to 1918; World War II, 1939 to 1945. Notice: the second war began 21 years after the first ended.","q":"How many years after World War I ended did World War II begin?","o":["21","10","5","40"]},{"how":"One war first: World War II. It ended in 1945. People often say it ended in '45.","q":"World War II ended in:","o":["1945","1918","1965","1776"]},{"how":"A world war is a war in which many of the world's countries fight, on many continents at once.","q":"A world war is a war:","o":["fought by many countries on many continents","between two small towns over one field","fought only at sea"]}]},"ELEC.FTECH.L10.01":{"name":"How Flight Works","task":"Make two paper airplanes with different wings. Fly each three times and record which goes farther.","teach":[{"how":"An airplane flies because of four forces. Learn the Four Forces: Lift up, weight down, thrust forward, drag back. The wings make lift; gravity makes weight.","q":"Which force pushes an airplane up?","pic":"✈️","o":["lift","weight","thrust","drag"]},{"how":"A wing is curved on top. Air moving over it lowers the pressure above the wing, and the higher pressure below pushes it up. That is lift.","q":"What part of the airplane makes most of the lift?","pic":"🛩️","o":["the wings","the wheels","the tail lights","the windows"]},{"how":"Rockets fly by Newton's third law: they push hot gas down and back, and the gas pushes the rocket up and forward. That works even in space, with no air.","q":"Why can a rocket fly in space, where there is no air?","pic":"🚀","o":["it pushes gas out, and the gas pushes back","the stars and planets pull it along like magnets","space is full of wind"]}],"practice":[{"q":"Which force slows an airplane down as it moves through the air?","h":"Say the peg.","o":["drag","lift","thrust","weight"]},{"q":"What gives an airplane its thrust?","h":"Forward push.","o":["the engines","the wings","the passenger seats","the wheels"]},{"q":"Put the four forces in the order of the peg.","h":"Up, down, forward, back.","t":"order","tiles":["lift","weight","thrust","drag"]},{"q":"The Wright brothers' first flight in 1903 went about 120 feet. A big jet's wingspan can be about 200 feet. How many feet longer is that wingspan?","h":"Subtract.","t":"num","a":80},{"q":"For an airplane to climb, which force must be bigger than its weight?","h":"Up beats down.","o":["lift","drag","thrust","gravity"]},{"q":"A paper airplane with long wings is thrown hard. What does the throw give it?","pic":"📄","h":"Forward push.","o":["thrust","weight","drag","gravity"]}],"check":[{"q":"In the peg, which force goes down?","h":"Gravity.","o":["weight","lift","thrust","drag"]},{"q":"Who made the first powered airplane flight, in 1903?","h":"Orville and Wilbur.","o":["the Wright brothers","Charles Lindbergh","Neil Armstrong","Amelia Earhart and her navigator"]},{"q":"What does a wing's curved shape help make?","h":"Up.","o":["lift","drag only","thrust","weight"]}],"re":[{"how":"Say the peg and move your arms: Lift up, weight down, thrust forward, drag back.","q":"In the peg, which force goes back?","o":["drag","lift","thrust","weight"]},{"how":"Two forces first: lift and weight. If lift is bigger than weight, the plane goes up. If weight is bigger, it comes down.","q":"If weight is bigger than lift, the plane:","o":["comes down","goes up","stays level","speeds up"]},{"how":"Air is real stuff, even though you cannot see it. Wave a book quickly and you feel air push back.","q":"When you wave a big book, what pushes back?","pic":"📘","o":["air","light","sound","water"]}]},"ELEC.FNUM.L10.01":{"name":"Powers of Ten","task":"Find three huge numbers in a science book or almanac and write each one in scientific notation.","teach":[{"how":"Scientists write huge numbers with powers of ten. Use the Zero Counter: The power tells the zeros: 10 to the 3rd is 1,000, 10 to the 6th is a million.","q":"What is 10 to the 2nd power (10²)?","pic":"🔟","o":["100","20","1,000","12"]},{"how":"Scientific notation writes a number as a number from 1 to 10 times a power of ten. 3,000 = 3 × 10³. 5,000,000 = 5 × 10⁶.","q":"How is 4,000 written in scientific notation?","pic":"🔬","o":["4 × 10³","4 × 10⁴","40 × 10²","4 × 10"]},{"how":"Light travels about 300,000,000 meters per second. In scientific notation that is 3 × 10⁸ meters per second.","q":"How many zeros are in 10⁸?","pic":"💡","o":["8","10","6","80"]}],"practice":[{"q":"What is 10⁶?","h":"A million.","o":["1,000,000","1,000","60","10,000,000"]},{"q":"Put these in order from smallest to biggest: 10⁹, 10², 10⁶, 10³.","h":"A smaller power makes a smaller number.","t":"order","tiles":["10²","10³","10⁶","10⁹"]},{"q":"Write 6 × 10³ as a regular number.","h":"6 with 3 zeros.","t":"num","a":6000},{"q":"About 8 billion people live on Earth. How is that written in scientific notation?","pic":"🌍","h":"A billion has 9 zeros.","o":["8 × 10⁹","8 × 10⁶","8 × 10³","80 × 10⁹"]},{"q":"How many zeros are in one billion?","h":"Three commas.","t":"num","a":9},{"q":"A scientist writes that a tiny germ is 2 × 10⁻⁶ meters long. Is that tiny or huge?","pic":"🦠","h":"Negative powers make tiny numbers.","o":["tiny","huge","exactly one meter"]}],"check":[{"q":"What is 10³?","h":"Say the peg.","o":["1,000","30","100","10,000"]},{"q":"Write 5,000,000 in scientific notation.","h":"Count zeros.","o":["5 × 10⁶","5 × 10⁵","5 × 10⁷","50 × 10⁵"]},{"q":"In 10⁸, what does the 8 tell you?","h":"Zero Counter.","o":["how many zeros follow the 1","to add 8","to subtract 8","the number of tens to add together"]}],"re":[{"how":"Say the peg and count zeros on your fingers: The power tells the zeros: 10 to the 3rd is 1,000, 10 to the 6th is a million.","q":"In the peg, 10 to the 6th is:","o":["a million","a thousand","a billion","sixty"]},{"how":"Start small: 10¹ = 10, 10² = 100, 10³ = 1,000. Each time the power goes up by one, add one zero.","q":"10⁴ = ?","o":["10,000","1,000","40","100,000"]},{"how":"Multiplying by 10 adds a zero: 7 × 10 = 70, and 70 × 10 = 700.","q":"What is 45 × 10?","o":["450","4,500","45","55"]}]}};
window.TL_FACT=window.TL_FACT||{}; Object.assign(window.TL_FACT,F10); }

{ const F11={"ELEC.FWORLD.L11.01":{"name":"Great Rivers and Mountain Ranges","task":"Trace the Nile, the Amazon and the Mississippi on a world map. Mark where each one meets the sea.","teach":[{"how":"Rivers and mountain ranges shape where people live. Learn River and Range: Nile is long, Amazon is strong, Himalayas high, Andes go on and on. The Nile, in Africa, is usually listed as the world's longest river, about 4,100 miles.","q":"Which river is usually listed as the longest in the world?","pic":"🏞️","o":["the Nile","the Mississippi","the Hudson","the Thames"]},{"how":"The Himalayas, in Asia, are the highest mountains on Earth. Mount Everest is part of them.","q":"In which mountain range is Mount Everest?","pic":"🏔️","o":["the Himalayas","the Andes","the Rockies","the Appalachians"]},{"how":"The Andes, in South America, are the longest mountain range on land, about 4,300 miles.","q":"Which is the longest mountain range on land?","pic":"⛰️","o":["the Andes","the Himalayas","the Alps","the Rockies"]}],"practice":[{"q":"Which river is the strongest, carrying the greatest flow of water?","h":"Say the peg.","o":["the Amazon","the Nile","the Mississippi","the Danube"]},{"q":"Which old, worn-down mountain range runs through western Maryland?","h":"East coast mountains.","o":["the Appalachians","the Rockies","the Andes","the Sierra Nevada of California"]},{"q":"Put these rivers in order from longest to shortest: the Mississippi (about 2,300 miles), the Nile (about 4,100 miles), the Potomac (about 400 miles).","h":"Compare the miles.","t":"order","tiles":["the Nile","the Mississippi","the Potomac"]},{"q":"The Andes are about 4,300 miles long. The Rocky Mountains are about 3,000 miles long. How many miles longer are the Andes?","h":"Subtract.","t":"num","a":1300},{"q":"Into which sea does the Nile flow?","h":"North, past Cairo.","o":["the Mediterranean Sea","the Red Sea","the Dead Sea","the Arabian Sea near India"]},{"q":"A climber wants to try the highest peaks on Earth. Which range should he visit?","pic":"🥾","h":"High.","o":["the Himalayas","the Appalachians","the Andes","the Alps"]}],"check":[{"q":"In the peg, what is the Amazon?","h":"Say the peg.","o":["strong","long","high","short"]},{"q":"On which continent is the Nile?","h":"Egypt.","o":["Africa","South America","Asia","Europe"]},{"q":"Which mountains are the highest on Earth?","h":"High.","o":["the Himalayas","the Andes","the Appalachians","the Alps"]}],"re":[{"how":"Say the peg with motions: Nile is long, Amazon is strong, Himalayas high, Andes go on and on. Stretch, flex, reach up, then walk in place.","q":"In the peg, which range goes on and on?","o":["the Andes","the Himalayas","the Rockies","the Alps"]},{"how":"Two records first: the Nile is the longest river, and Everest, in the Himalayas, is the highest mountain.","q":"Which continent holds the Himalayas?","o":["Asia","Africa","Europe","Australia"]},{"how":"A river is fresh water flowing in a channel to a lake or the sea. A mountain range is a long chain of mountains.","q":"A mountain range is:","o":["a long chain of mountains","one small hill in the middle of a field","a river valley"]}]},"ELEC.FNATURE.L11.01":{"name":"Acids, Bases and pH","task":"With an adult, test vinegar, water and baking-soda water with red cabbage juice. Record the colors.","teach":[{"how":"Chemists measure acids and bases on the pH scale, from 0 to 14. Climb the pH Ladder: Below 7 is sour acid, 7 is neutral, above 7 is slippery base. Pure water is neutral.","q":"What is the pH of pure water?","pic":"💧","o":["7","0","14","1"]},{"how":"Acids taste sour. Lemon juice and vinegar are acids. Never taste chemicals in a lab!","q":"Lemon juice has a pH of about 2. Is it an acid or a base?","pic":"🍋","o":["an acid","a base","neutral","a metal"]},{"how":"Bases feel slippery and taste bitter. Soap and baking soda are bases.","q":"Baking soda in water has a pH of about 8. What is it?","pic":"🧼","o":["a base","an acid","neutral","a gas"]}],"practice":[{"q":"Which of these is most acidic?","h":"Lowest number.","o":["lemon juice (pH 2)","milk (pH 6.5)","water (pH 7)","liquid hand soap (pH 10)"]},{"q":"What does an acid usually taste like?","h":"Lemons.","o":["sour","sweet","salty","bitter"]},{"q":"Put these in order from most acidic to most basic: soap (pH 10), lemon juice (pH 2), water (pH 7).","h":"Low to high pH.","t":"order","tiles":["lemon juice","water","soap"]},{"q":"The pH scale runs from 0 up to what number?","h":"Twice 7.","t":"num","a":14},{"q":"What happens when you mix an acid with a base?","h":"Neutralize.","o":["they cancel each other toward neutral","they turn into gold","nothing at all ever happens, not even a fizz"]},{"q":"A test strip shows pH 12 for a cleaner. What should you do?","pic":"⚠️","h":"Far from 7.","o":["handle it carefully; it is a strong base","drink it; it is neutral","use it to make a pitcher of fresh lemonade"]}],"check":[{"q":"A substance with pH 7 is:","h":"The middle.","o":["neutral","acidic","basic","metallic"]},{"q":"Soap feels slippery. It is probably:","h":"Slippery.","o":["a base","an acid","neutral","a salt"]},{"q":"Vinegar has a pH of about 3. It is:","h":"Below 7.","o":["an acid","a base","neutral","a metal"]}],"re":[{"how":"Say the peg and move your hand up an imaginary ladder: Below 7 is sour acid, 7 is neutral, above 7 is slippery base.","q":"In the peg, what is above 7?","o":["slippery base","sour acid","neutral","plain tap water from the sink"]},{"how":"Start with the middle: 7 is neutral, like pure water. Every number below 7 is acid; every number above is base.","q":"Is pH 5 an acid or a base?","o":["an acid","a base","neutral"]},{"how":"A scale lines up numbers from low to high, like a thermometer or a ruler.","q":"On the pH scale, which number is lowest?","pic":"🌡️","o":["0","7","14","10"]}]},"ELEC.FUSA.L11.01":{"name":"Landmark Supreme Court Cases","task":"Read a one-page summary of one of these cases with your teacher. Write two sentences on why it matters.","teach":[{"how":"The Supreme Court decides what the Constitution means. Open the Case File: Marbury gave the Court its check, Brown ended separate schools, Miranda gave the right to stay silent. In Marbury v. Madison (1803), the Court said it can strike down laws that break the Constitution. This is called judicial review.","q":"Which case established judicial review?","pic":"⚖️","o":["Marbury v. Madison","Brown v. Board of Education","Miranda v. Arizona","Gideon v. Wainwright"]},{"how":"In Brown v. Board of Education (1954), the Court ruled that separating students into schools by race is unconstitutional.","q":"What did Brown v. Board of Education end?","pic":"🏫","o":["separate public schools by race","the right to vote","the whole Bill of Rights and all its amendments","taxes on tea"]},{"how":"In Miranda v. Arizona (1966), the Court said police must tell arrested people their rights, including the right to remain silent. These are the Miranda warnings.","q":"Miranda warnings tell an arrested person about:","pic":"🚓","o":["the right to remain silent","the right to a free car","his tax refund from the government this year","the weather"]}],"practice":[{"q":"What is judicial review?","h":"Marbury.","o":["the Court's power to strike down unconstitutional laws","the President's power to make laws","a teacher's yearly review of every student's grades and homework"]},{"q":"In what year was Brown v. Board of Education decided?","h":"The mid-1900s.","o":["1954","1803","1966","1776"]},{"q":"Put these cases in time order: Miranda v. Arizona, Marbury v. Madison, Brown v. Board of Education.","h":"1803, 1954, 1966.","t":"order","tiles":["Marbury v. Madison","Brown v. Board of Education","Miranda v. Arizona"]},{"q":"How many years passed between Marbury v. Madison (1803) and Brown v. Board of Education (1954)?","h":"Subtract.","t":"num","a":151},{"q":"How many justices must agree to decide a Supreme Court case?","h":"More than half.","o":["a majority, at least 5 of 9","all 9","only the Chief Justice, who decides alone","exactly 3"]},{"q":"A police officer arrests a man and says, \"You have the right to remain silent.\" Which case requires this?","h":"Silent.","o":["Miranda v. Arizona","Marbury v. Madison","Brown v. Board of Education","Plessy v. Ferguson"]}],"check":[{"q":"Which case ended separate schools by race?","h":"Say the peg.","o":["Brown v. Board of Education","Marbury v. Madison","Miranda v. Arizona","Gideon v. Wainwright"]},{"q":"Marbury v. Madison gave the Supreme Court:","h":"Its check.","o":["the power of judicial review","the power to declare war","the power to collect taxes","the power to elect the President"]},{"q":"What does the Supreme Court decide?","h":"It explains.","o":["what the Constitution and laws mean","which candidate wins every election for mayor in every city","what the weather will be"]}],"re":[{"how":"Say the peg, one finger per case: Marbury gave the Court its check, Brown ended separate schools, Miranda gave the right to stay silent.","q":"In the peg, what did Brown end?","o":["separate schools","the right to stay silent","judicial review","elections"]},{"how":"One case first: Marbury v. Madison, 1803. M for Marbury, M for Mighty: the Court got the mighty power to check laws.","q":"Which branch got the power of judicial review?","o":["the courts","Congress","the President","the states"]},{"how":"A court case has two sides. The name lists them with v., short for versus, meaning against.","q":"In Brown v. Board, what does v. stand for?","o":["versus","very","victory","vote"]}]},"ELEC.FPAST.L11.01":{"name":"The Cold War and the Space Race","task":"Look at a photo of Earth taken from the Moon with your teacher. Write what it shows.","teach":[{"how":"After World War II, the United States and the Soviet Union competed for power without fighting each other directly. This was the Cold War. Run the Race to Space: 1957 Sputnik, 1961 Gagarin, 1969 the Moon, 1989 the Wall fell. In 1957 the Soviets launched Sputnik, the first satellite.","q":"What was Sputnik?","pic":"🛰️","o":["the first satellite","the first airplane","a famous wall that divided Berlin","a submarine"]},{"how":"In 1961, Yuri Gagarin of the Soviet Union became the first human in space. In 1969, America's Apollo 11 landed Neil Armstrong and Buzz Aldrin on the Moon.","q":"Who was the first human in space?","pic":"🚀","o":["Yuri Gagarin","Neil Armstrong","John Glenn","Buzz Aldrin"]},{"how":"The Berlin Wall divided East and West Berlin from 1961. It fell in 1989, and the Soviet Union broke apart in 1991, ending the Cold War.","q":"When did the Berlin Wall fall?","pic":"🧱","o":["1989","1961","1945","2001"]}],"practice":[{"q":"Which two countries were the main rivals in the Cold War?","h":"East versus West.","o":["the United States and the Soviet Union","England and France","Japan and China","Canada and Mexico"]},{"q":"Which mission first landed men on the Moon?","pic":"🌕","h":"1969.","o":["Apollo 11","Sputnik","Gemini 3","Mercury 7"]},{"q":"Put these in time order: the Berlin Wall falls, Sputnik launches, Apollo 11 lands on the Moon, Gagarin flies in space.","h":"Say the peg.","t":"order","tiles":["Sputnik launches","Gagarin flies in space","Apollo 11 lands on the Moon","the Berlin Wall falls"]},{"q":"The Berlin Wall stood from 1961 to 1989. How many years did it stand?","h":"Subtract.","t":"num","a":28},{"q":"Why was it called the Cold War?","h":"No direct battle.","o":["the two powers never fought each other directly","it was fought only in the coldest winter months at the North Pole","it was about ice cream"]},{"q":"A museum shows a shiny metal ball with four antennas from 1957. What is it?","pic":"🏛️","h":"1957.","o":["a model of Sputnik","a Moon rock","the Liberty Bell","a piece of the Berlin Wall"]}],"check":[{"q":"In the peg, what happened in 1969?","h":"Apollo 11.","o":["the Moon landing","Sputnik","the Berlin Wall fell down","Gagarin flew"]},{"q":"When did the Soviet Union break apart?","h":"Two years after the Wall fell.","o":["1991","1957","1945","1969"]},{"q":"Who was the first human in space, in 1961?","h":"Soviet.","o":["Yuri Gagarin","Neil Armstrong","Buzz Aldrin","Alan Shepard"]}],"re":[{"how":"Say the peg like a countdown: 1957 Sputnik, 1961 Gagarin, 1969 the Moon, 1989 the Wall fell. Four dates, four big moments.","q":"In the peg, which year goes with the Wall?","o":["1989","1957","1961","1969"]},{"how":"One event first: the Moon landing, 1969, Apollo 11. Armstrong stepped out first; Aldrin followed him.","q":"Who stepped onto the Moon second?","o":["Buzz Aldrin","Neil Armstrong","Yuri Gagarin","John Glenn"]},{"how":"A rivalry is a competition between two sides. Teams can be rivals; so can countries.","q":"A rivalry is:","o":["a competition between two sides","a long, winding river through two countries","a peace treaty"]}]},"ELEC.FTECH.L11.01":{"name":"How the Internet Works","task":"Draw the Packet Path for a message from your home to a cousin far away. Label each step.","teach":[{"how":"The internet is a giant network of connected computers. The World Wide Web, the pages we browse, was invented by Tim Berners-Lee in 1989. Messages travel by the Packet Path: Chop it, address it, route it, rebuild it. Data is chopped into small packets, each with an address.","q":"What is data broken into to travel across the internet?","pic":"🌐","o":["packets","bricks","letters of the alphabet","pages"]},{"how":"Every device on the internet has an IP address, a number that tells packets where to go, like a street address.","q":"What tells packets which computer to go to?","pic":"📮","o":["an IP address","a password","the screen size","the keyboard"]},{"how":"Routers pass packets along the best path. Much of the internet travels through fiber-optic cables, which carry data as pulses of light, even under the oceans.","q":"What do fiber-optic cables use to carry data?","pic":"💡","o":["pulses of light","water","loud sound waves under the sea","air pressure"]}],"practice":[{"q":"What does a router do?","pic":"📶","h":"Route it.","o":["passes packets along toward their address","stores every photo you ever take forever and ever","prints documents"]},{"q":"Wi-Fi sends data through the air using:","h":"Wireless.","o":["radio waves","water","sound you can hear","smoke signals"]},{"q":"Put the Packet Path in order: route it, rebuild it, chop it, address it.","h":"Say the peg.","t":"order","tiles":["chop it","address it","route it","rebuild it"]},{"q":"A photo is chopped into 250 packets. 3 packets get lost and must be sent again. How many packets arrive the first time?","h":"Subtract.","t":"num","a":247},{"q":"Who invented the World Wide Web in 1989?","h":"A British scientist.","o":["Tim Berners-Lee","Thomas Edison","Bill Gates","Alexander Graham Bell"]},{"q":"A message sent from Baltimore to Israel arrives in less than a second. How is that possible?","pic":"⚡","h":"Light is fast.","o":["packets travel as light through cables at great speed","a fast jet plane carries a printed copy overnight, every night","a ship carries it"]}],"check":[{"q":"In the peg, what happens last?","h":"Say the peg.","o":["rebuild it","chop it","route it","address it"]},{"q":"An IP address is like:","h":"Where to go.","o":["a street address for a computer","a long secret password for every website you visit","a phone charger","a keyboard shortcut"]},{"q":"What carries much of the internet under the oceans?","h":"Light in glass.","o":["fiber-optic cables","only satellites floating far up in space","bicycles","pipes of water"]}],"re":[{"how":"Say the peg as you act it out: Chop it, address it, route it, rebuild it. Chop with your hand, write a label, toss it along, then put the pieces together.","q":"In the peg, what comes right after chop it?","o":["address it","route it","rebuild it","delete it"]},{"how":"Start with the address. Without an address, a letter cannot be delivered. Without an IP address, a packet cannot either.","q":"What does a packet need to reach the right computer?","o":["an address","a stamp","a color","a picture"]},{"how":"A network is a group of things connected together. Your school's computers are a small network; the internet connects networks all over the world.","q":"A network is:","o":["things connected together","one computer sitting all alone in a room","a fishing pole"]}]},"ELEC.FNUM.L11.01":{"name":"Famous Numbers in Science","task":"Measure a plate across and around with a string. Divide around by across. How close to pi do you get?","teach":[{"how":"Some numbers show up again and again in science and math. Visit the Number Hall of Fame: Pi is 3.14, water boils at 100, freezes at 0, a triangle sums to 180. Pi is the distance around any circle divided by the distance across it: about 3.14159.","q":"What is pi, rounded to two decimal places?","pic":"⭕","o":["3.14","2.71","1.41","9.81"]},{"how":"On the Celsius scale, water freezes at 0 degrees and boils at 100 degrees, at sea level.","q":"At sea level, water boils at how many degrees Celsius?","pic":"♨️","o":["100","0","212","37"]},{"how":"The three angles inside any triangle always add up to 180 degrees. A right angle is 90 degrees.","q":"The angles in a triangle add up to:","pic":"🔺","o":["180 degrees","360 degrees","90 degrees","100 degrees"]}],"practice":[{"q":"At what temperature Celsius does water freeze?","pic":"🧊","h":"Say the peg.","o":["0","100","32","10"]},{"q":"Put these in order from smallest to biggest: a right angle, pi, a triangle's angle sum.","h":"3.14, 90, 180.","t":"order","tiles":["pi","a right angle","a triangle's angle sum"]},{"q":"A triangle has angles of 90 degrees and 50 degrees. How many degrees is the third angle?","h":"180 minus the others.","t":"num","a":40},{"q":"A circle is 10 inches across. About how far is it around?","h":"Multiply by pi.","o":["about 31.4 inches","about 10 inches","about one hundred inches","about 3 inches"]},{"q":"Water boils at 212 degrees Fahrenheit and freezes at 32. How many degrees apart are boiling and freezing on the Celsius scale?","h":"Say the peg.","t":"num","a":100},{"q":"A builder checks that a corner is square. How many degrees should it be?","pic":"📐","h":"A right angle.","o":["90","180","45","360"]}],"check":[{"q":"Which number is pi closest to?","h":"Say the peg.","o":["3.14","31.4","0.314","314"]},{"q":"Water freezes at 0 degrees Celsius. At what Celsius temperature does it boil?","h":"Say the peg.","o":["100","212","50","1,000"]},{"q":"The three angles of every triangle add up to:","h":"Say the peg.","o":["180","90","360","270"]}],"re":[{"how":"Say the peg like a sports announcer: Pi is 3.14, water boils at 100, freezes at 0, a triangle sums to 180.","q":"In the peg, what sums to 180?","o":["a triangle","a circle","a square","water"]},{"how":"Start with pi. Wrap a string around a can, then stretch it out: it is a little more than 3 times as long as the can is wide.","q":"The distance around a circle is about how many times the distance across?","pic":"🥫","o":["3","2","10","1"]},{"how":"Degrees measure two different things: angles and temperature. The sentence tells you which.","q":"In \"a 90-degree corner\", degrees measure:","o":["an angle","temperature","speed","weight"]}]}};
window.TL_FACT=window.TL_FACT||{}; Object.assign(window.TL_FACT,F11); }

{ const F12={"ELEC.FWORLD.L12.01":{"name":"World Money and Economies","task":"Look up today's exchange rate for dollars to shekels with Abba. How many shekels is $20?","teach":[{"how":"Each country has its own money, called its currency. Crack the Currency Code: Dollar for America, euro for much of Europe, yen for Japan, pound for Britain, shekel for Israel.","q":"What is the currency of Japan?","pic":"💴","o":["the yen","the euro","the peso","the pound"]},{"how":"The shekel is the currency of Israel. The word comes from the shekel, a weight of silver in the Torah: Avraham Avinu paid 400 shekels of silver for the Cave of Machpelah.","q":"What currency is used in Israel?","pic":"🪙","o":["the shekel","the dollar","the yen","the ruble"]},{"how":"GDP measures the total value of everything a country produces. The United States has the largest economy in the world, and China has the second largest.","q":"Which country has the largest economy?","pic":"📊","o":["the United States","China","Japan","the United Kingdom of Great Britain"]}],"practice":[{"q":"Many countries in Europe, such as France and Germany, share which currency?","pic":"💶","h":"Say the peg.","o":["the euro","the pound","the yen","the dollar"]},{"q":"What is the currency of Britain?","pic":"💷","h":"Say the peg.","o":["the pound","the euro","the franc","the dollar"]},{"q":"Put these economies in order from largest to smaller: China, the United States, Japan.","h":"Recall the lesson.","t":"order","tiles":["the United States","China","Japan"]},{"q":"If 1 dollar buys 4 shekels, how many shekels does 25 dollars buy?","h":"Multiply.","t":"num","a":100},{"q":"What is an exchange rate?","h":"Trading money.","o":["how much one currency is worth in another","the price of a brand-new car at a dealership","a kind of bank account"]},{"q":"Yossi's family flies to Tokyo. What money will they need there?","pic":"✈️","h":"Japan.","o":["yen","euros","shekels","pesos"]}],"check":[{"q":"What is the currency of the United States?","pic":"💵","h":"Say the peg.","o":["the dollar","the euro","the pound","the yen"]},{"q":"In the peg, which currency goes with Britain?","h":"Say the peg.","o":["the pound","the shekel","the euro","the yen"]},{"q":"Which country has the second largest economy?","h":"Recall the lesson.","o":["China","Japan","Germany","India"]}],"re":[{"how":"Say the peg, tapping a coin for each: Dollar for America, euro for much of Europe, yen for Japan, pound for Britain, shekel for Israel.","q":"In the peg, which currency goes with Israel?","o":["the shekel","the yen","the pound","the euro"]},{"how":"Start at home: our currency is the dollar. A quarter is 25 cents, and 100 cents make a dollar.","q":"How many cents make one dollar?","o":["100","10","25","1,000"]},{"how":"Currency is the money a country uses: its coins and bills. When you travel, you trade your currency for the local one.","q":"Currency means:","o":["the money a country uses","a strong current flowing in a river","a type of bank building"]}]},"ELEC.FNATURE.L12.01":{"name":"Medicine Milestones","task":"Look at a milk carton at home. Find the word pasteurized and explain it to your family.","teach":[{"how":"Doctors and scientists have saved millions of lives. Wind the Cure Clock: 1796 Jenner's vaccine, 1860s Pasteur's germs, 1928 Fleming's penicillin, 1955 Salk's polio shot. In 1796 Edward Jenner made the first vaccine, against smallpox.","q":"What disease did Jenner's first vaccine protect against?","pic":"💉","o":["smallpox","polio","the common cold","measles"]},{"how":"In the 1860s, Louis Pasteur showed that tiny germs cause many diseases and spoil food. Heating milk to kill germs is called pasteurization, after him.","q":"What is pasteurization?","pic":"🥛","o":["heating food to kill germs","freezing food","adding lots of sugar to make it sweeter","drying fruit"]},{"how":"In 1928, Alexander Fleming discovered penicillin, the first antibiotic: a medicine that kills bacteria. In 1955, Jonas Salk's polio vaccine was announced safe and effective.","q":"What was penicillin?","pic":"💊","o":["the first antibiotic","a vaccine for polio","a vitamin found in fresh oranges","a kind of bandage"]}],"practice":[{"q":"Who developed the polio vaccine announced in 1955?","h":"Say the peg.","o":["Jonas Salk","Louis Pasteur","Edward Jenner","Alexander Fleming"]},{"q":"Antibiotics like penicillin fight:","h":"Recall the lesson.","o":["bacteria","viruses","broken bones","sunburn"]},{"q":"Put these in time order: Salk's polio vaccine, Jenner's smallpox vaccine, Fleming's penicillin, Pasteur's germ studies.","h":"Say the peg.","t":"order","tiles":["Jenner's smallpox vaccine","Pasteur's germ studies","Fleming's penicillin","Salk's polio vaccine"]},{"q":"Penicillin was discovered in 1928. Salk's vaccine was announced in 1955. How many years apart are they?","h":"Subtract.","t":"num","a":27},{"q":"How does a vaccine work?","h":"Practice for the body.","o":["it trains the body to fight a disease before it comes","it is a vitamin pill that you take every single morning","it cools a fever"]},{"q":"A milk carton says pasteurized. What was done to the milk?","pic":"🥛","h":"Pasteur.","o":["it was heated to kill germs","it was frozen solid","lots of sugar and chocolate were added"]}],"check":[{"q":"Who discovered penicillin in 1928?","h":"Say the peg.","o":["Alexander Fleming","Jonas Salk","Louis Pasteur","Thomas Edison of New Jersey"]},{"q":"Who showed that germs cause disease?","h":"1860s.","o":["Louis Pasteur","Edward Jenner","Jonas Salk","Isaac Newton"]},{"q":"In the peg, what happened in 1796?","h":"The first.","o":["Jenner's vaccine","Salk's polio shot","Fleming's penicillin","Pasteur's germs"]}],"re":[{"how":"Say the peg like a clock ticking: 1796 Jenner's vaccine, 1860s Pasteur's germs, 1928 Fleming's penicillin, 1955 Salk's polio shot.","q":"In the peg, whose discovery was penicillin?","o":["Fleming","Jenner","Pasteur","Salk"]},{"how":"One word first: germs. Germs are tiny living things, too small to see, that can make us sick. That is why we wash our hands.","q":"Why do we wash our hands with soap?","pic":"🧼","o":["to remove germs","to make them shiny","to cool them down"]},{"how":"Medicine is the science of keeping people healthy and treating sickness. Doctors use medicines, vaccines and good habits.","q":"Which is a healthy habit that prevents sickness?","o":["washing your hands","skipping sleep","staying up very late every single night"]}]},"ELEC.FUSA.L12.01":{"name":"Citizenship and Civic Duties","task":"Ask Abba or another adult what jury duty or voting was like for them. Write two things you learned.","teach":[{"how":"Citizens have rights and also duties. Run the Citizen Checklist: Vote at 18, serve on a jury, pay taxes by April 15, count in the census every 10 years.","q":"At what age can a citizen vote?","pic":"🗳️","o":["18","16","21","25"]},{"how":"A jury is a group of citizens who hear a trial and decide the facts. Serving on a jury is a citizen's duty.","q":"What does a jury do?","pic":"⚖️","o":["hears a trial and decides the facts","makes new laws","collects taxes from every family in the city","runs elections"]},{"how":"Every 10 years, the government counts everyone in the country. This is the census. It decides how many representatives each state gets.","q":"How often is the census taken?","pic":"📋","o":["every 10 years","every year","every 4 years","every 100 years"]}],"practice":[{"q":"By what date are federal income taxes usually due?","h":"Say the peg.","o":["April 15","July 4","January 1","December 31"]},{"q":"Becoming a citizen after moving from another country is called:","h":"A citizenship ceremony.","o":["naturalization","graduation","registration","a long summer vacation abroad"]},{"q":"Put the census years in order: 2020, 2000, 2010.","h":"Every 10 years.","t":"order","tiles":["2000","2010","2020"]},{"q":"The last census was in 2020. In what year is the next one?","h":"Add 10.","t":"num","a":2030},{"q":"What document gives citizens their rights, like freedom of speech?","pic":"📜","h":"Including the Bill of Rights.","o":["the Constitution","a driver's license","a library card","a phone book"]},{"q":"Shimon's father gets a letter from the court asking him to come and hear a case. What duty is this?","pic":"✉️","h":"A trial.","o":["jury duty","voting","paying taxes","the census"]}],"check":[{"q":"Which duty helps decide how many representatives a state gets?","h":"Counting.","o":["the census","jury duty","paying taxes","voting"]},{"q":"In the peg, what happens at 18?","h":"Say the peg.","o":["you can vote","you pay the census","you join the Supreme Court","you become President"]},{"q":"What is a duty of a citizen?","h":"Say the peg.","o":["serving on a jury when called","owning a car","living in a very big house with a pool"]}],"re":[{"how":"Say the peg, counting each part on a finger: Vote at 18, serve on a jury, pay taxes by April 15, count in the census every 10 years.","q":"In the peg, when are taxes due?","o":["by April 15","by July 4","by January 1","by December 31"]},{"how":"Rights and duties go together. A right is something you are free to do; a duty is something you should do for the country.","q":"Which is a duty, not just a right?","o":["serving on a jury","free speech","practicing your religion"]},{"how":"A citizen is a member of a country, with its rights and duties. People born in the United States are citizens.","q":"A citizen is:","o":["a member of a country","a visitor for one day","a kind of city building"]}]},"ELEC.FPAST.L12.01":{"name":"Great Scientists","task":"Pick one Science Star. Write five facts about that scientist and share them with your class.","teach":[{"how":"Great scientists changed how we see the world. Meet the Science Stars: Galileo looked up, Newton found gravity, Curie found radium, Einstein bent light. Around 1610, Galileo used a telescope to see Jupiter's moons.","q":"What did Galileo use to study the sky?","pic":"🔭","o":["a telescope","a microscope","a compass","a thermometer"]},{"how":"Marie Curie discovered the elements radium and polonium. She was the first person to win two Nobel Prizes, in physics and chemistry.","q":"Which element did Marie Curie discover?","pic":"⚗️","o":["radium","oxygen","gold","iron"]},{"how":"Albert Einstein's theory of relativity, from 1905 and 1915, changed physics. His equation E = mc² shows that mass and energy are related. In 1919, scientists saw starlight bend around the Sun, as he predicted.","q":"Which famous equation belongs to Einstein?","pic":"💡","o":["E = mc²","F = m × a","a² + b² = c²","pH = 7"]}],"practice":[{"q":"Who described the law of universal gravitation in 1687?","pic":"🍎","h":"Say the peg.","o":["Isaac Newton","Galileo","Albert Einstein","Marie Curie"]},{"q":"What did Galileo see through his telescope?","h":"Looked up.","o":["moons circling Jupiter","tiny germs swimming in a drop of pond water","atoms","radio waves"]},{"q":"Put the scientists in time order: Einstein, Galileo, Curie, Newton.","h":"Say the peg.","t":"order","tiles":["Galileo","Newton","Curie","Einstein"]},{"q":"Einstein's first relativity paper was in 1905. Newton's laws were in 1687. How many years apart are they?","h":"Subtract.","t":"num","a":218},{"q":"Marie Curie was the first person to win two Nobel Prizes. In which two fields?","pic":"📜","h":"Sciences.","o":["physics and chemistry","music and art","history, geography and mathematics","sports and cooking"]},{"q":"In 1919, astronomers saw starlight bend near the Sun during an eclipse. Whose idea did this prove?","pic":"🌘","h":"Bent light.","o":["Einstein's","Galileo's","Newton's","Curie's"]}],"check":[{"q":"In the peg, who found radium?","h":"Say the peg.","o":["Curie","Newton","Einstein","Galileo"]},{"q":"Who used a telescope to see Jupiter's moons?","h":"Looked up.","o":["Galileo","Einstein","Curie","Pasteur"]},{"q":"E = mc² connects:","h":"Einstein.","o":["mass and energy","sound and color","heat and cold","time and money"]}],"re":[{"how":"Say the peg, acting each part: Galileo looked up, Newton found gravity, Curie found radium, Einstein bent light. Look up, drop an apple, glow, then bend your arm.","q":"In the peg, who bent light?","o":["Einstein","Newton","Galileo","Curie"]},{"how":"One scientist first: Newton. He showed that the same gravity pulls an apple down and keeps the Moon in its orbit.","q":"What keeps the Moon circling Earth?","pic":"🌕","o":["gravity","wind","magnets","electricity"]},{"how":"A scientist asks questions, makes careful observations, tests ideas with experiments, and shares results.","q":"What does a scientist do to test an idea?","o":["runs an experiment","guesses and stops","asks a friend to decide"]}]},"ELEC.FTECH.L12.01":{"name":"Engines and Electric Cars","task":"With Abba, open the hood of a car (engine off and cool). Find the battery and the engine.","teach":[{"how":"Most gas car engines use a four-stroke cycle. Sing the Four-Stroke Song: Suck, squeeze, bang, blow: intake, compression, power, exhaust. First the piston pulls in fuel and air (intake), then squeezes it (compression).","q":"What is the first stroke of a four-stroke engine?","pic":"🚗","o":["intake","compression","power","exhaust"]},{"how":"In the power stroke, a spark lights the squeezed fuel and air. The burst pushes the piston down, turning the crankshaft and the wheels.","q":"Which stroke actually pushes the car forward?","pic":"⚙️","o":["power","intake","exhaust","compression"]},{"how":"Electric cars have no pistons. Their motors use magnets and electric current from a large battery to spin the wheels.","q":"What powers an electric car's motor?","pic":"🔋","o":["a large battery","gasoline","a coal-burning steam boiler","a sail"]}],"practice":[{"q":"What is the last stroke, which pushes burned gases out?","h":"Blow.","o":["exhaust","intake","compression","power"]},{"q":"What makes the spark in a gas engine?","h":"Its name says it.","o":["a spark plug","the radio","a battery charger","the steering wheel"]},{"q":"Put the four strokes in order.","h":"Suck, squeeze, bang, blow.","t":"order","tiles":["intake","compression","power","exhaust"]},{"q":"An engine turns 3,000 times per minute. How many turns is that in 2 minutes?","h":"Multiply.","t":"num","a":6000},{"q":"How do brakes stop a car?","h":"Rubbing.","o":["by friction on the wheels","by turning off the radio","by honking the horn very loudly many times"]},{"q":"An electric car slows down, and its battery gains a little charge. What is the motor doing?","h":"Regenerative braking.","o":["working like a generator","burning a little extra gasoline from the tank","turning into a sail"]}],"check":[{"q":"In the peg, which stroke is squeeze?","h":"Say the peg.","o":["compression","intake","power","exhaust"]},{"q":"Electric car motors use which two things to spin?","h":"Recall the lesson.","o":["magnets and electric current","gasoline, sparks and a hot exhaust pipe","wind and sails"]},{"q":"Which stroke burns the fuel?","h":"Bang.","o":["power","intake","compression","exhaust"]}],"re":[{"how":"Sing the peg and move your hand like a piston: Suck, squeeze, bang, blow: intake, compression, power, exhaust.","q":"In the peg, which word means intake?","o":["suck","squeeze","bang","blow"]},{"how":"One stroke first: power. The spark lights the fuel; the burst pushes the piston; the piston turns the wheels.","q":"What lights the fuel in the power stroke?","o":["a spark","a match","sunlight","a candle"]},{"how":"An engine turns energy into motion. Gas engines use the energy in fuel; electric motors use electricity.","q":"An engine turns energy into:","o":["motion","light","water","sound only"]}]},"ELEC.FNUM.L12.01":{"name":"Interest and the Rule of 72","task":"With Abba, look at a savings account rate. Use the Rule of 72 to estimate how long money takes to double.","teach":[{"how":"Interest is money paid for using money. A bank pays you interest on savings; you pay interest on a loan. Watch Money Grows: Simple pays on the start, compound pays on the pile, 72 divided by the rate doubles it. Simple interest on $100 at 5 percent is $5 each year.","q":"Simple interest on $200 at 5 percent for one year is:","pic":"🏦","o":["$10","$5","$20","$100"]},{"how":"Compound interest pays interest on the interest too, so savings grow faster each year. $100 at 10 percent becomes $110, then $121.","q":"Why does compound interest grow faster than simple interest?","pic":"📈","o":["it pays interest on the interest","it never pays anything","it is only paid on coins, never on paper bills"]},{"how":"The Rule of 72: divide 72 by the yearly interest rate to estimate how many years it takes money to double. At 6 percent, 72 ÷ 6 = 12 years.","q":"At 8 percent interest, about how many years until money doubles?","pic":"⏳","o":["9","8","72","16"]}],"practice":[{"q":"Who pays you interest when you save?","h":"A savings account.","o":["the bank","the grocery store","the post office","nobody"]},{"q":"Put these from fastest-growing to slowest at 6 percent for 10 years: simple interest, compound interest, no interest.","h":"Interest on interest wins.","t":"order","tiles":["compound interest","simple interest","no interest"]},{"q":"Using the Rule of 72, at 9 percent, about how many years until money doubles?","h":"72 ÷ 9.","t":"num","a":8},{"q":"$100 grows by 10 percent compound interest each year. How much is it after 2 years?","h":"110, then 10 percent more.","o":["$121","$120","$110","$200"]},{"q":"You borrow $500 at 4 percent simple interest for one year. How many dollars of interest do you owe?","h":"4 percent of 500.","t":"num","a":20},{"q":"Dovid saves $1,000 at 6 percent, compounded. About when will it reach $2,000?","pic":"💰","h":"Rule of 72.","o":["about 12 years","about 6 years","about 72 years","never"]}],"check":[{"q":"In the peg, what pays on the pile?","h":"Say the peg.","o":["compound interest","simple interest","no interest","a loan from a friend with no interest"]},{"q":"At 12 percent, how many years to double, by the Rule of 72?","h":"72 ÷ 12.","o":["6","12","72","24"]},{"q":"Interest is:","h":"Savings and loans.","o":["money paid for using money","a heavy kind of gold coin from long ago","a bank building"]}],"re":[{"how":"Say the peg slowly: Simple pays on the start, compound pays on the pile, 72 divided by the rate doubles it.","q":"In the peg, what do you divide 72 by?","o":["the rate","the years","the amount saved","100"]},{"how":"Start with percent: 5 percent of $100 is $5. 5 percent of $200 is $10. Percent means out of 100.","q":"What is 5 percent of $300?","o":["$15","$5","$30","$50"]},{"how":"Saving means keeping money for later. Banks keep savings safe and pay a little extra for using it.","q":"Saving money means:","pic":"🐿️","o":["keeping it for later","spending it right away","throwing it away"]}]}};
