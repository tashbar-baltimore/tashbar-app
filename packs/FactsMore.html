{ const F1={"ELEC.FWORLD.L01.01":{"name":"Land and Water","task":"Find three blue places and three green places on a globe or map. Show Abba or your rebbe.","teach":[{"how":"Our world has land and water. Land is the ground we walk on: fields, hills and mountains. Water is in oceans, lakes and rivers. Use the Color Clue on a map or a globe: Blue is water. Green and brown are land.","q":"Is the ocean land or water?","pic":"🌊","o":["water","land"]},{"how":"A mountain is very high land. A hill is lower land. Both are made of ground and rocks.","q":"Is a mountain land or water?","pic":"⛰️","o":["land","water"]},{"how":"A river is water that flows, like a long moving road of water. A lake is water with ground all around it.","q":"Which one flows: a river or a field?","pic":"🏞️","o":["a river","a field"]}],"practice":[{"q":"On a map, blue shows what: water, land, or a road?","pic":"🗺️","h":"Remember the Color Clue.","o":["water","land","a road"]},{"q":"Which is land: a field or a deep lake?","pic":"🌾","h":"Land is dry ground.","o":["a field","a deep lake"]},{"q":"Put them from smallest to biggest: ocean, puddle, lake.","h":"An ocean is the biggest water of all.","t":"order","tiles":["💧 puddle","🏞️ lake","🌊 ocean"]},{"q":"An island is land with water all around it. Count the islands: 🏝️ 🏝️ 🏝️ 🏝️. How many islands?","h":"Touch each island as you count.","t":"num","a":4},{"q":"An island has water all around it. Is an island land or water?","pic":"🏝️","h":"An island is dry ground in the sea.","o":["land","water"]},{"q":"Abba says, \"We will swim in the lake.\" Is the lake land or water?","h":"You swim in it.","o":["water","land"]}],"check":[{"q":"Which is water: an ocean or a hill?","h":"Water is wet.","o":["an ocean","a hill"]},{"q":"Which is land: a mountain or a lake?","h":"Land is ground.","o":["a mountain","a lake"]},{"q":"What color is water on a map: blue or green?","h":"Use the Color Clue.","o":["blue","green"]}],"re":[{"how":"Here is a way to remember. Blue is water. Green and brown are land. Look at a globe: most of it is blue, because our world has more water than land!","q":"On a globe, is there more water or more land?","pic":"🌍","o":["more water","more land"]},{"how":"Ask one question: Can I stand on it? If yes, it is land. If you would sink or swim, it is water.","q":"Can you stand on a field: yes or no?","o":["yes","no"]},{"how":"Wet or dry? Water is wet. Splash! Ground is dry, like sand on a sunny day.","q":"Is sand on a sunny day wet or dry?","o":["dry","wet"]}]},"ELEC.FNATURE.L01.01":{"name":"Four Seasons","task":"Draw one tree four times: in winter, spring, summer and fall. Show your rebbe.","teach":[{"how":"A year has four seasons: winter, spring, summer and fall. Each season has its own weather. Do a Weather Watch: look at the sky, the trees and what you wear. Here is a rhyme: Snow, grow, glow, blow: winter, spring, summer, fall.","q":"How many seasons are in a year: four or two?","pic":"🌳","o":["four","two"]},{"how":"Winter is the coldest season. Snow can fall, and we wear coats, hats and mittens.","q":"Which season is coldest: winter or summer?","pic":"❄️","o":["winter","summer"]},{"how":"Summer is the hottest season. The sun shines long and strong, and the days are long.","q":"Which season is hottest: summer or winter?","pic":"☀️","o":["summer","winter"]}],"practice":[{"q":"In which season do flowers start to grow: spring or winter?","pic":"🌷","h":"Grow is in the rhyme.","o":["spring","winter"]},{"q":"In which season do leaves fall off the trees: fall or summer?","pic":"🍂","h":"The leaves turn red and orange first.","o":["fall","summer"]},{"q":"Put the seasons in order, starting with winter.","h":"Say the rhyme: snow, grow, glow, blow.","t":"order","tiles":["❄️ winter","🌷 spring","☀️ summer","🍂 fall"]},{"q":"How many seasons are in one year?","h":"Winter, spring, summer, fall.","t":"num","a":4},{"q":"What do we wear in winter: a coat or sandals?","pic":"🧥","h":"Winter is cold.","o":["a coat","sandals"]},{"q":"It is snowing, and the trees are bare. What season is it: winter or spring?","h":"Snow is in the rhyme.","o":["winter","spring"]}],"check":[{"q":"Which season comes after summer: fall or winter?","h":"Snow, grow, glow, blow.","o":["fall","winter"]},{"q":"In which season do new leaves and flowers grow: spring or fall?","h":"Grow!","o":["spring","fall"]},{"q":"In which season do we swim and feel the strong sun: summer or fall?","h":"Glow means the sun shines.","o":["summer","fall"]}],"re":[{"how":"Say the rhyme again and act it out: Snow, grow, glow, blow: winter, spring, summer, fall. Snow falls down, flowers grow up, the sun glows, the wind blows the leaves.","q":"Which word in the rhyme goes with fall: blow or snow?","o":["blow","snow"]},{"how":"Just two seasons first: winter is cold, summer is hot. Ice is like winter. A warm oven is like summer.","q":"Is summer hot or cold?","o":["hot","cold"]},{"how":"Weather words come first: sunny, rainy, snowy, windy. Look outside: what is the weather today?","q":"When white flakes fall from the sky, is it snowy or windy?","o":["snowy","windy"]}]},"ELEC.FUSA.L01.01":{"name":"Our Flag","task":"Draw the American flag with crayons: red and white stripes and a blue box with stars. Show Abba.","teach":[{"how":"This is the flag of our country, the United States of America. People call it the Stars and Stripes. Be a Flag Detective: it has three colors, red, white and blue. Remember: 50 stars for 50 states, 13 stripes for the first 13.","q":"What colors are on our flag: red, white and blue, or green and yellow?","pic":"🇺🇸","o":["red, white and blue","green and yellow"]},{"how":"The stars are in a blue box in the corner. There is one star for each state.","q":"Where are the stars: in a blue box or on a green circle?","pic":"🇺🇸","o":["in a blue box","on a green circle"]},{"how":"The flag has red and white stripes. There are 13 stripes, for the first 13 parts of America long ago.","q":"Does the flag have stripes or dots?","pic":"🇺🇸","o":["stripes","dots"]}],"practice":[{"q":"How many colors are on our flag: three or five?","pic":"🇺🇸","h":"Red, white, blue.","o":["three","five"]},{"q":"Put in order from fewest to most: 50 stars, 3 colors, 13 stripes.","h":"Start with the smallest number.","t":"order","tiles":["3 colors","13 stripes","50 stars"]},{"q":"Our flag has red stripes and white stripes. Count these stripes: 🟥 ⬜ 🟥 ⬜ 🟥. How many stripes?","h":"Touch each one as you count.","t":"num","a":5},{"q":"What shapes are on our flag: stars or moons?","pic":"🇺🇸","h":"Look in the blue box.","o":["stars","moons"]},{"q":"How many stars are on our flag: 50 or 10?","h":"One star for each state.","o":["50","10"]},{"q":"You see a flag with 50 stars and 13 stripes. Is it the flag of America or of Canada?","h":"Stars and stripes!","o":["America","Canada"]}],"check":[{"q":"How many stripes are on our flag: 13 or 3?","h":"One stripe for each of the first states.","o":["13","3"]},{"q":"What color is the box with the stars: blue or red?","h":"Look at the corner.","o":["blue","red"]},{"q":"Our flag stands for which country: the United States or England?","h":"It is our flag.","o":["the United States","England"]}],"re":[{"how":"Say the peg with a clap: 50 stars for 50 states, 13 stripes for the first 13. Stars stand for states. Stripes stand for the first 13.","q":"Stars stand for what: states or cities?","o":["states","cities"]},{"how":"Just the colors first. Find red. Find white. Find blue. Three colors!","q":"Is there blue on our flag: yes or no?","o":["yes","no"]},{"how":"Shapes come first. A star has five tips. A stripe is a long band, like a ribbon.","q":"Which shape has five tips: a star or a stripe?","o":["a star","a stripe"]}]},"ELEC.FPAST.L01.01":{"name":"Long Ago and Today","task":"Ask Zeidy or Bubby what was different when they were small. Tell your class one thing.","teach":[{"how":"Long ago means many, many years before you were born. People lived without electricity. Think Then and Now: Long ago: candle, horse, letter. Today: lamp, car, phone.","q":"Long ago, what gave light at night: a candle or a lamp with a bulb?","pic":"🕯️","o":["a candle","a lamp with a bulb"]},{"how":"Long ago, people rode horses or rode in wagons pulled by horses. Today most people drive cars.","q":"Long ago, how did people travel: by horse or by car on a highway?","pic":"🐎","o":["by horse","by car on a highway"]},{"how":"Long ago, people wrote letters on paper to family far away. A letter could take weeks! Today we can call on the phone.","q":"Today, how can you talk to Zeidy far away right now: a phone or a letter?","pic":"☎️","o":["a phone","a letter"]}],"practice":[{"q":"Which is from today: a car or a wagon?","pic":"🚗","h":"Today has engines.","o":["a car","a wagon"]},{"q":"Long ago, how did people get water: from a well or from a faucet?","h":"Long ago there were no pipes in houses.","o":["from a well","from a faucet"]},{"q":"Put in order from long ago to today: train, airplane, horse.","h":"The oldest one is an animal.","t":"order","tiles":["🐎 horse","🚂 train","✈️ airplane"]},{"q":"Long ago, people lit candles for light. Count the candles: 🕯️ 🕯️ 🕯️ 🕯️ 🕯️ 🕯️. How many candles?","h":"Count each one.","t":"num","a":6},{"q":"Which is from long ago: a feather pen or a computer screen?","pic":"🪶","h":"Long ago there were no screens.","o":["a feather pen","a computer screen"]},{"q":"Zeidy says, \"When I was small, we had no phone at home.\" Is that long ago or today?","h":"Zeidy was small many years ago.","o":["long ago","today"]}],"check":[{"q":"Which is from today: a light bulb or a tall wax candle?","h":"Today we have electricity.","o":["a light bulb","a tall wax candle"]},{"q":"Long ago, what pulled the wagon: a horse or an engine?","h":"Long ago there were no engines.","o":["a horse","an engine"]},{"q":"Which is newer: a phone or a letter?","h":"Phones came later.","o":["a phone","a letter"]}],"re":[{"how":"Say the peg: Long ago: candle, horse, letter. Today: lamp, car, phone. Each old thing has a new partner that does the same job.","q":"The candle's partner today is the lamp or the horse?","o":["the lamp","the horse"]},{"how":"Ask one question: does it need electricity? If yes, it is probably from today.","q":"Does a candle need electricity: yes or no?","o":["no","yes"]},{"how":"Old and new. Old means it was made a long time ago. New means it was just made.","q":"A pencil made today is old or new?","o":["new","old"]}]},"ELEC.FTECH.L01.01":{"name":"What Is It Made Of?","task":"Find one thing made of wood, metal, glass and cloth at home. Tell Abba or Ima what each one is.","teach":[{"how":"Everything is made of something. Do the Touch Test: does it feel hard, soft, shiny or clear? Remember: Wood grows, metal shines, glass is clear, cloth is soft.","q":"A window is made of glass or wood?","pic":"🪟","o":["glass","wood"]},{"how":"Wood comes from trees. Tables, chairs and pencils are often made of wood.","q":"Where does wood come from: trees or rocks?","pic":"🌳","o":["trees","rocks"]},{"how":"Metal is hard, cold and shiny. Spoons, keys and coins are made of metal.","q":"A key is made of metal or cloth?","pic":"🔑","o":["metal","cloth"]}],"practice":[{"q":"A shirt is made of cloth or glass?","pic":"👕","h":"Cloth is soft.","o":["cloth","glass"]},{"q":"A table is made of wood or cloth?","pic":"🪑","h":"It comes from trees.","o":["wood","cloth"]},{"q":"Put in order how a wooden chair is made: chair, tree, wood.","h":"First it grows.","t":"order","tiles":["🌳 tree","🪵 wood","🪑 chair"]},{"q":"Coins are made of metal. Count the coins: 🪙 🪙 🪙 🪙 🪙 🪙 🪙. How many coins?","h":"Count each coin.","t":"num","a":7},{"q":"Which one can you see through: glass or a wooden board?","h":"Glass is clear.","o":["glass","a wooden board"]},{"q":"Yossi's spoon is hard, cold and shiny. What is it made of: metal or cloth?","h":"Metal shines.","o":["metal","cloth"]}],"check":[{"q":"A pencil is made of wood or glass?","pic":"✏️","h":"It comes from a tree.","o":["wood","glass"]},{"q":"A coin is made of metal or cloth?","pic":"🪙","h":"It is hard and shiny.","o":["metal","cloth"]},{"q":"A jar you can see through is made of glass or wood?","pic":"🫙","h":"Clear means see-through.","o":["glass","wood"]}],"re":[{"how":"Say the peg: Wood grows, metal shines, glass is clear, cloth is soft. Now touch things in your room and say which one each is.","q":"Which one is soft: cloth or metal?","o":["cloth","metal"]},{"how":"Just two first. Hard or soft? A rock is hard. A pillow is soft.","q":"Is a pillow hard or soft?","o":["soft","hard"]},{"how":"Look-and-feel words come first: shiny, clear, rough. Shiny things throw light back. Clear things let light through.","q":"Is a mirror shiny or rough?","o":["shiny","rough"]}]},"ELEC.FNUM.L01.01":{"name":"Days of the Week","task":"Make a Day Train with seven paper cars. Write one day on each car. Put Shabbos last.","teach":[{"how":"A week has seven days. Ride the Day Train: Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Shabbos. Shabbos is the seventh day, the last car on the Day Train.","q":"How many days are in a week: seven or five?","pic":"🚂","o":["seven","five"]},{"how":"Sunday is the first day of the week. After Sunday comes Monday.","q":"Which day comes after Sunday: Monday or Friday?","pic":"🚃","o":["Monday","Friday"]},{"how":"Friday is Erev Shabbos. We get ready for Shabbos on Friday.","q":"Which day is the day before Shabbos: Friday or Sunday?","pic":"🕯️","o":["Friday","Sunday"]}],"practice":[{"q":"What is the seventh day: Shabbos or Tuesday?","h":"It is the last car.","o":["Shabbos","Tuesday"]},{"q":"Put the first three days of the week in order.","h":"The week starts on the day after Shabbos.","t":"order","tiles":["Sunday","Monday","Tuesday"]},{"q":"How many days are in a week?","h":"Count the cars on the Day Train.","t":"num","a":7},{"q":"Which day comes after Wednesday: Thursday or Monday?","h":"Ride the train.","o":["Thursday","Monday"]},{"q":"Which day is our holy day of rest: Shabbos or Monday?","h":"The seventh day is a day of rest.","o":["Shabbos","Monday"]},{"q":"Today is Friday. What day is tomorrow: Shabbos or Thursday?","h":"Tomorrow is the next car.","o":["Shabbos","Thursday"]}],"check":[{"q":"Which day is first in the week: Sunday or Shabbos?","h":"The train starts here.","o":["Sunday","Shabbos"]},{"q":"Which day comes after Tuesday: Wednesday or Sunday?","h":"Ride the train.","o":["Wednesday","Sunday"]},{"q":"Which day comes after Thursday: Friday or Monday?","h":"It is Erev Shabbos.","o":["Friday","Monday"]}],"re":[{"how":"Say the peg: Shabbos is the seventh day, the last car on the Day Train. Count the cars: one Sunday, two Monday, all the way to seven, Shabbos.","q":"Which car on the Day Train is Shabbos: the last car or the first car?","o":["the last car","the first car"]},{"how":"Start small: Sunday, Monday, Tuesday. Say them three times.","q":"Which day comes after Monday: Tuesday or Friday?","o":["Tuesday","Friday"]},{"how":"Counting comes first. Count to seven: 1, 2, 3, 4, 5, 6, 7. A week has that many days.","q":"Count: 1, 2, 3, 4, 5, 6. What number comes next: 7 or 10?","o":["7","10"]}]}};

{ const F2={"ELEC.FWORLD.L02.01":{"name":"Maps and Globes","task":"Draw a map of your room from above. Write N at the top and add a map key.","teach":[{"how":"A globe is a round model of the whole Earth. A map is a flat picture of a place. Be a Map Explorer! On most maps, north is at the top. Go around the compass with: Never Eat Soggy Waffles: North, East, South, West.","q":"Which is round like a ball: a globe or a map?","pic":"🌍","o":["a globe","a map"]},{"how":"North is up on most maps. South is down. East is to the right. West is to the left.","q":"On most maps, which way is up: north or south?","pic":"🧭","o":["north","south"]},{"how":"A map key tells what the little pictures on a map mean. A tiny tree can mean a park.","q":"What tells you what the map pictures mean: the map key or the title?","pic":"🗺️","o":["the map key","the title"]}],"practice":[{"q":"Which is flat: a map or a globe?","h":"You can fold it.","o":["a map","a globe"]},{"q":"On most maps, which way is down: south or east?","h":"Up is north. Down is the opposite.","o":["south","east"]},{"q":"Go around the compass like a clock, starting at the top: West, South, North, East.","h":"Never Eat Soggy Waffles.","t":"order","tiles":["North","East","South","West"]},{"q":"The main directions are north, south, east and west. How many main directions are there?","h":"Count them.","t":"num","a":4},{"q":"On a map key, a tiny tree means: a park or a school?","h":"Trees grow in a park.","o":["a park","a school"]},{"q":"The shul is at the top of the map. Which way is the shul from the middle: north or south?","h":"Top means north.","o":["north","south"]}],"check":[{"q":"A round model of the whole Earth is called a globe or a map?","h":"It spins.","o":["a globe","a map"]},{"q":"On most maps, which side is east: the right or the left?","h":"Never Eat Soggy Waffles goes around like a clock.","o":["the right","the left"]},{"q":"What helps you find which way is north: a compass or a cup?","h":"Its needle swings to the north.","o":["a compass","a cup"]}],"re":[{"how":"Say the peg and turn as you say it: Never Eat Soggy Waffles: North, East, South, West. Face the top of the map. That is north.","q":"In the peg, which word stands for east: Eat or Soggy?","o":["Eat","Soggy"]},{"how":"Start with just two: up and down. On a map, up is north and down is south.","q":"Is up on a map north or south?","o":["north","south"]},{"how":"A map is a picture of a place from above, the way a bird would see it. Your room from above would show your bed and your desk.","q":"A map shows a place as seen from: above or under the ground?","o":["above","under the ground"]}]},"ELEC.FNATURE.L02.01":{"name":"Animal Homes","task":"Look outside for a nest, a hive or a hole in the ground. Draw what you find.","teach":[{"how":"Every animal needs a home to stay safe. Be a Home Finder! Nest for a bird, hive for a bee, den for a bear, the sea for a fish.","q":"Where does a bird live: in a nest or in a hive?","pic":"🐦","o":["in a nest","in a hive"]},{"how":"Bees live together in a hive. Inside, they build wax rooms and store honey.","q":"Where do bees make honey: in a hive or in a den?","pic":"🐝","o":["in a hive","in a den"]},{"how":"A burrow is a hole or tunnel under the ground. Rabbits dig burrows.","q":"Who digs a burrow under the ground: a rabbit or an eagle?","pic":"🐇","o":["a rabbit","an eagle"]}],"practice":[{"q":"Where does a bear sleep in winter: a den, a nest, or a hive?","pic":"🐻","h":"Say the peg.","o":["a den","a nest","a hive"]},{"q":"Where does a fish live: in the water or in a tree?","pic":"🐟","h":"Fish swim.","o":["in the water","in a tree"]},{"q":"Put the homes in the order the peg says them.","h":"Say the peg out loud.","t":"order","tiles":["nest","hive","den"]},{"q":"One nest has 3 eggs. Another nest has 2 eggs. How many eggs in all?","h":"Add the eggs.","t":"num","a":5},{"q":"Where does a beaver live: in a lodge or in a hive?","pic":"🦫","h":"Beavers build with sticks in the water.","o":["in a lodge","in a hive"]},{"q":"Yossi sees a bird carrying twigs up a tree. What is it building: a nest or a burrow?","h":"Birds build in trees.","o":["a nest","a burrow"]}],"check":[{"q":"Where does a bee live: in a hive or in a den?","h":"Honey!","o":["in a hive","in a den"]},{"q":"Who lives in a nest: a bird or a fish?","h":"Nests are up in trees.","o":["a bird","a fish"]},{"q":"A bear rests in a cave all winter. The cave is its: den or nest?","h":"Bear in a den.","o":["den","nest"]}],"re":[{"how":"Say the peg with motions: Nest for a bird, hive for a bee, den for a bear, the sea for a fish. Flap like a bird, buzz like a bee, stomp like a bear, swim like a fish.","q":"In the peg, the sea is for a fish or a bear?","o":["a fish","a bear"]},{"how":"Just two homes first: a nest is up in a tree, a den is down in a cave.","q":"Is a nest up in a tree or down in a cave?","o":["up in a tree","down in a cave"]},{"how":"Animals need homes to stay safe and warm and to keep their babies safe. A home keeps out rain, wind and danger.","q":"Why do animals need homes: to stay safe or to go shopping?","o":["to stay safe","to go shopping"]}]},"ELEC.FUSA.L02.01":{"name":"Symbols of America","task":"Find an eagle on a coin or on the back of a dollar bill. Show Abba where it is.","teach":[{"how":"A symbol is a picture that stands for something. America has symbols. Go on a Symbol Search! Eagle flies, Bell is cracked, torch is high, White House is white.","q":"What is America's national bird: the bald eagle or the robin?","pic":"🦅","o":["the bald eagle","the robin"]},{"how":"The Liberty Bell is a big old bell in Philadelphia. It has a famous crack.","q":"What is special about the Liberty Bell: it has a crack, or it is made of glass?","pic":"🔔","o":["it has a crack","it is made of glass"]},{"how":"The White House is in Washington, D.C. The President of the United States lives and works there.","q":"Who lives in the White House: the President or the mayor?","pic":"🏛️","o":["the President","the mayor"]}],"practice":[{"q":"What does the Statue of Liberty hold up high: a torch or a flag?","pic":"🗽","h":"Torch is high.","o":["a torch","a flag"]},{"q":"In which city is the Liberty Bell: Philadelphia or Baltimore?","pic":"🔔","h":"It is not our city.","o":["Philadelphia","Baltimore"]},{"q":"Put the symbols in the order of the peg.","h":"Say the peg.","t":"order","tiles":["eagle","bell","torch","White House"]},{"q":"Our flag has 13 stripes. Take away the 6 white stripes. How many red stripes are left?","h":"13 take away 6.","t":"num","a":7},{"q":"Where does the President live and work: the White House or the Liberty Bell?","h":"It is a house.","o":["the White House","the Liberty Bell"]},{"q":"On a coin you see a big bird with wide wings. Which American symbol is it: the bald eagle or a parrot?","pic":"🪙","h":"National bird.","o":["the bald eagle","a parrot"]}],"check":[{"q":"Which symbol is cracked: the Liberty Bell or the White House?","h":"Say the peg.","o":["the Liberty Bell","the White House"]},{"q":"Which bird is America's national bird: the bald eagle or the duck?","h":"Eagle flies.","o":["the bald eagle","the duck"]},{"q":"What does the Statue of Liberty hold high: a torch or a hammer?","h":"Torch is high.","o":["a torch","a hammer"]}],"re":[{"how":"Say the peg and act it out: Eagle flies, Bell is cracked, torch is high, White House is white. Flap, crack, reach up high, and stand tall like a house.","q":"In the peg, what is high: the torch or the bell?","o":["the torch","the bell"]},{"how":"A symbol stands for something. A red stop sign stands for stop. The eagle stands for America.","q":"A red stop sign stands for: stop or go?","o":["stop","go"]},{"how":"Our country is the United States of America. We live in it. Its capital is Washington, D.C.","q":"What is the name of our country: the United States of America or Canada?","o":["the United States of America","Canada"]}]},"ELEC.FPAST.L02.01":{"name":"How People Traveled","task":"Make a timeline strip with drawings: walking, a horse, a train, a car and a plane.","teach":[{"how":"Long ago, people walked or rode animals. Later came trains, then cars, then airplanes. Make a Travel Timeline: Walk, horse, train, car, plane: older to newer.","q":"Which came first: horses or airplanes?","pic":"🐎","o":["horses","airplanes"]},{"how":"Trains ride on metal tracks. Long ago, steam trains carried people across the whole country.","q":"What does a train ride on: tracks or water?","pic":"🚂","o":["tracks","water"]},{"how":"The airplane is newer. Two brothers, Orville and Wilbur Wright, made the first airplane flight in 1903.","q":"Who made the first airplane flight: the Wright brothers or two sailors?","pic":"✈️","o":["the Wright brothers","two sailors"]}],"practice":[{"q":"Which is newer: a car or a horse?","pic":"🚗","h":"Cars have engines.","o":["a car","a horse"]},{"q":"What makes a sailboat move: wind or tracks?","pic":"⛵","h":"It has sails.","o":["wind","tracks"]},{"q":"Put in order from older to newer: car, walking, airplane, train.","h":"People walked first.","t":"order","tiles":["walking","train","car","airplane"]},{"q":"A wagon has 4 wheels. How many wheels do 2 wagons have?","h":"4 and 4.","t":"num","a":8},{"q":"Which one flies: an airplane or a train?","h":"Up in the sky.","o":["an airplane","a train"]},{"q":"Zeidy rode a train to visit us. Then he flew home. Which is newer: the plane or the train?","h":"Say the peg.","o":["the plane","the train"]}],"check":[{"q":"Which came first: trains or airplanes?","h":"Say the peg.","o":["trains","airplanes"]},{"q":"What carried people before cars: horses or rockets?","h":"Older!","o":["horses","rockets"]},{"q":"Who flew the first airplane: the Wright brothers or Columbus?","h":"They were brothers.","o":["the Wright brothers","Columbus"]}],"re":[{"how":"Say the peg and move: Walk, horse, train, car, plane: older to newer. Walk in place, gallop, chug, vroom, zoom!","q":"In the peg, what comes right after train: car or horse?","o":["car","horse"]},{"how":"Two at a time: a horse is older than a car. A car is older than a plane.","q":"Did horses or cars come first?","o":["horses","cars"]},{"how":"Older means it came first, a long time ago. Newer means it came later.","q":"Zeidy is older than Abba. Who was born first: Zeidy or Abba?","o":["Zeidy","Abba"]}]},"ELEC.FTECH.L02.01":{"name":"Tools and Their Jobs","task":"With Abba, find three tools at home. Say what job each one does.","teach":[{"how":"A tool helps us do a job. Play Tool Match: Hammer bangs, saw cuts, ruler measures, shovel digs.","q":"Which tool hits a nail: a hammer or a ruler?","pic":"🔨","o":["a hammer","a ruler"]},{"how":"A saw has sharp teeth on its blade. It cuts wood when you push and pull it.","q":"Which tool cuts wood: a saw or a shovel?","pic":"🪚","o":["a saw","a shovel"]},{"how":"A ruler measures how long something is, in inches.","q":"Which tool tells how long a pencil is: a ruler or a hammer?","pic":"📏","o":["a ruler","a hammer"]}],"practice":[{"q":"Which tool digs a hole: a shovel, a saw, or a ruler?","h":"Shovel digs.","o":["a shovel","a saw","a ruler"]},{"q":"Which tool cuts paper: scissors or a hammer?","pic":"✂️","h":"Two blades.","o":["scissors","a hammer"]},{"q":"Put the building steps in order: cut the board, measure the board, nail the board.","h":"You cannot nail it before you cut it.","t":"order","tiles":["📏 measure the board","🪚 cut the board","🔨 nail the board"]},{"q":"Abba has 2 hammers and 3 saws. How many tools is that?","h":"2 and 3.","t":"num","a":5},{"q":"Which tool turns a screw: a screwdriver or a ruler?","pic":"🪛","h":"Its name tells you.","o":["a screwdriver","a ruler"]},{"q":"Moshe wants to plant a tree. Which tool should he use first: a shovel or a ruler?","pic":"🌱","h":"He needs a hole.","o":["a shovel","a ruler"]}],"check":[{"q":"Which tool measures: a ruler or a saw?","h":"Ruler measures.","o":["a ruler","a saw"]},{"q":"Which tool bangs nails: a hammer or a shovel?","h":"Bang!","o":["a hammer","a shovel"]},{"q":"Which tool cuts a wooden board: a saw or scissors?","h":"Sharp teeth.","o":["a saw","scissors"]}],"re":[{"how":"Say the peg and act it out: Hammer bangs, saw cuts, ruler measures, shovel digs. Bang, push and pull, slide, scoop!","q":"In the peg, which tool digs: the shovel or the hammer?","o":["the shovel","the hammer"]},{"how":"Look at the shape. A long flat edge with numbers measures. Sharp teeth cut. A heavy head hits.","q":"A tool with a heavy head: hits or measures?","o":["hits","measures"]},{"how":"A job is something that needs doing. A tool helps us do a job faster and better.","q":"A tool helps us: do a job or go to sleep?","o":["do a job","go to sleep"]}]},"ELEC.FNUM.L02.01":{"name":"Months of the Year","task":"Make a Month Ladder: write the 12 months on paper steps. Circle the month of your birthday.","teach":[{"how":"A year has 12 months. Climb the Month Ladder: January, February, March, April, May, June, July, August, September, October, November, December. January starts the year, December ends it: 12 months in all.","q":"How many months are in a year: 12 or 7?","pic":"📅","o":["12","7"]},{"how":"January is the first month. It comes in winter, right after December.","q":"Which month is first: January or June?","pic":"❄️","o":["January","June"]},{"how":"Months go in order like ladder steps. After January comes February, then March.","q":"Which month comes after January: February or May?","pic":"🪜","o":["February","May"]}],"practice":[{"q":"Which month ends the year: December or April?","h":"Say the peg.","o":["December","April"]},{"q":"Put these months in order: March, January, February.","h":"Say the months from the start.","t":"order","tiles":["January","February","March"]},{"q":"How many months are in one year?","h":"Say the peg.","t":"num","a":12},{"q":"Which month comes after June: July or March?","h":"Climb one step.","o":["July","March"]},{"q":"Which month comes before December: November or October?","h":"One step down.","o":["November","October"]},{"q":"Pesach is often in April. Which month comes right before April: March or May?","h":"One step down.","o":["March","May"]}],"check":[{"q":"Which month is first: January or December?","h":"It starts the year.","o":["January","December"]},{"q":"Which month comes after April: May or March?","h":"Climb up.","o":["May","March"]},{"q":"Which month comes after September: October or June?","h":"A fall month.","o":["October","June"]}],"re":[{"how":"Say the peg: January starts the year, December ends it: 12 months in all. Clap once for each month as you say them.","q":"Which month ends the year: December or January?","o":["December","January"]},{"how":"Learn three at a time: January, February, March. Then April, May, June.","q":"Which comes after February: March or June?","o":["March","June"]},{"how":"Counting to 12 helps: there is one month for each number from 1 to 12.","q":"Count: 9, 10, 11. What comes next: 12 or 20?","o":["12","20"]}]}};
window.TL_FACT=window.TL_FACT||{}; Object.assign(window.TL_FACT,F2); }

{ const F3={"ELEC.FWORLD.L03.01":{"name":"The Seven Continents","task":"Find all seven continents on a globe. Put your finger on the one we live on.","teach":[{"how":"A continent is a giant piece of land. Earth has seven continents: Asia, Africa, North America, South America, Antarctica, Europe and Australia. Do a Continent Count! Big Asia first, little Australia last, icy Antarctica down south.","q":"How many continents are there: seven or three?","pic":"🌍","o":["seven","three"]},{"how":"We live in North America. The United States, Canada and Mexico are all in North America.","q":"Which continent do we live on: North America or Africa?","pic":"🗺️","o":["North America","Africa"]},{"how":"Antarctica is at the bottom of the globe, around the South Pole. It is the coldest continent, covered in thick ice. Penguins live there.","q":"Which continent is covered in ice: Antarctica or Australia?","pic":"🐧","o":["Antarctica","Australia"]}],"practice":[{"q":"Which continent is the biggest: Asia, Europe, or Australia?","h":"Say the peg.","o":["Asia","Europe","Australia"]},{"q":"Which continent is the smallest: Australia or Africa?","pic":"🦘","h":"Little ... last.","o":["Australia","Africa"]},{"q":"Put these from biggest to smallest: Australia, Asia, Africa.","h":"Use the peg for the first and the last.","t":"order","tiles":["Asia","Africa","Australia"]},{"q":"How many continents have the word America in their name?","h":"Listen to all seven names.","t":"num","a":2},{"q":"Egypt, called Mitzrayim in the Torah, is on which continent: Africa or Europe?","pic":"🏜️","h":"The Nile River flows there.","o":["Africa","Europe"]},{"q":"Penguins live where it is icy, near the South Pole. Which continent is that: Antarctica or Asia?","h":"Icy, down south.","o":["Antarctica","Asia"]}],"check":[{"q":"Baltimore is on which continent: North America or Asia?","h":"The same as the United States.","o":["North America","Asia"]},{"q":"Which continent is around the South Pole: Antarctica or Europe?","h":"Icy, down south.","o":["Antarctica","Europe"]},{"q":"How many continents are on Earth: seven or nine?","h":"Count them.","o":["seven","nine"]}],"re":[{"how":"Say the peg: Big Asia first, little Australia last, icy Antarctica down south. Stretch wide for Asia, make yourself small for Australia, and shiver for Antarctica.","q":"In the peg, which continent is icy: Antarctica or Asia?","o":["Antarctica","Asia"]},{"how":"Start with home: we live on North America. The continent just below us is South America.","q":"Which continent is just south of North America: South America or Europe?","o":["South America","Europe"]},{"how":"Land and water first: a continent is very big land. The water between the continents is ocean.","q":"A continent is a giant piece of: land or water?","o":["land","water"]}]},"ELEC.FNATURE.L03.01":{"name":"Parts of a Plant","task":"Put a bean in a cup with a wet paper towel. Watch the root and stem come out this week.","teach":[{"how":"A plant has parts, and each part has a job. Walk the Plant Parts Path from the bottom up: Roots drink, stem lifts, leaves make food, flowers make seeds.","q":"Which part drinks water from the soil: the roots or the flower?","pic":"🌱","o":["the roots","the flower"]},{"how":"The stem holds the plant up and carries water from the roots up to the leaves, like a straw.","q":"Which part is like a straw: the stem or the leaf?","pic":"🌿","o":["the stem","the leaf"]},{"how":"Leaves are the plant's food makers. They use sunlight, air and water to make food.","q":"Which part makes food from sunlight: the leaves or the roots?","pic":"🍃","o":["the leaves","the roots"]}],"practice":[{"q":"Which part makes seeds: the flower, the root, or the stem?","pic":"🌻","h":"Say the peg.","o":["the flower","the root","the stem"]},{"q":"An apple seed can grow into: an apple tree or a pine tree?","pic":"🍎","h":"Seeds grow the same kind of plant.","o":["an apple tree","a pine tree"]},{"q":"Put the plant parts in order from the bottom up: flower, roots, leaves, stem.","h":"Start under the ground.","t":"order","tiles":["roots","stem","leaves","flower"]},{"q":"A plant has 6 leaves. 2 leaves fall off. How many leaves are left?","h":"6 take away 2.","t":"num","a":4},{"q":"Why does a plant need roots: to hold it in the ground or to make it smell nice?","h":"Roots go deep.","o":["to hold it in the ground","to make it smell nice"]},{"q":"Dovid's plant has dry soil and droopy leaves. Which part needs water first: the roots or the flower?","pic":"🪴","h":"Roots drink.","o":["the roots","the flower"]}],"check":[{"q":"Which part carries water up: the stem or the seed?","h":"Stem lifts.","o":["the stem","the seed"]},{"q":"Which part makes the plant's food: the leaves or the stem?","h":"Leaves make food.","o":["the leaves","the stem"]},{"q":"What grows into a new plant: a seed or a stem?","h":"Flowers make them.","o":["a seed","a stem"]}],"re":[{"how":"Say the peg and stand like a plant: Roots drink, stem lifts, leaves make food, flowers make seeds. Your feet are the roots, your body is the stem, your arms are the leaves, and your face to the sun is the flower.","q":"In the peg, what do leaves do: make food or drink?","o":["make food","drink"]},{"how":"Just two parts first: roots are under the ground, leaves are up in the sun.","q":"Which part is under the ground: roots or leaves?","o":["roots","leaves"]},{"how":"Plants are living things. Like all living things, they need water, air and food to grow. Plants also need sunlight.","q":"What do plants need to grow: water and sunlight, or toys?","o":["water and sunlight","toys"]}]},"ELEC.FUSA.L03.01":{"name":"Our State: Maryland","task":"Find Baltimore, Annapolis and the Chesapeake Bay on a map of Maryland with Abba.","teach":[{"how":"We live in Maryland, one of the 50 states. Read the Maryland Map: Annapolis is the capital, Baltimore is the biggest, the Bay is in the middle.","q":"What is the capital of Maryland: Annapolis or Baltimore?","pic":"🏛️","o":["Annapolis","Baltimore"]},{"how":"Baltimore is Maryland's biggest city. It has a big harbor where ships come in.","q":"What is the biggest city in Maryland: Baltimore or Annapolis?","pic":"🏙️","o":["Baltimore","Annapolis"]},{"how":"The Chesapeake Bay is a huge bay of water. It splits Maryland into two parts. Many fish live in it.","q":"What big water is in the middle of Maryland: the Chesapeake Bay or the Pacific Ocean?","pic":"🌊","o":["the Chesapeake Bay","the Pacific Ocean"]}],"practice":[{"q":"What is Maryland's state bird: the Baltimore oriole or the penguin?","pic":"🐦","h":"It has our city's name.","o":["the Baltimore oriole","the penguin"]},{"q":"The Star-Spangled Banner was written about a battle at Fort McHenry. Where is Fort McHenry: in Baltimore or in Texas?","pic":"🎵","h":"It guards our harbor.","o":["in Baltimore","in Texas"]},{"q":"Put in order from biggest to smallest: Maryland, Baltimore, the United States.","h":"A country holds states. A state holds cities.","t":"order","tiles":["the United States","Maryland","Baltimore"]},{"q":"Maryland was one of the first states. How many stripes on our flag stand for the first states?","pic":"🇺🇸","h":"One stripe for each first state.","t":"num","a":13},{"q":"Is Annapolis a city or a state?","h":"It is the capital of Maryland.","o":["a city","a state"]},{"q":"Dovid's family drives to the State House, where Maryland's leaders meet. Which city do they go to: Annapolis or Baltimore?","h":"Capital!","o":["Annapolis","Baltimore"]}],"check":[{"q":"Which city is the capital of Maryland: Annapolis or Ocean City?","h":"Say the peg.","o":["Annapolis","Ocean City"]},{"q":"Which is Maryland's biggest city: Baltimore or Frederick?","h":"Our city!","o":["Baltimore","Frederick"]},{"q":"What bay is in Maryland: the Chesapeake Bay or the Hudson Bay?","h":"Say the peg.","o":["the Chesapeake Bay","the Hudson Bay"]}],"re":[{"how":"Say the peg and draw it in the air: Annapolis is the capital, Baltimore is the biggest, the Bay is in the middle.","q":"In the peg, which city is the biggest: Baltimore or Annapolis?","o":["Baltimore","Annapolis"]},{"how":"One word first: a capital is the city where the leaders work. Maryland's leaders work in its capital.","q":"Where do Maryland's leaders work: Annapolis or Baltimore?","o":["Annapolis","Baltimore"]},{"how":"A state is a part of our country. Our country has 50 states. We live in the state of Maryland.","q":"What do we call one part of our country: a state or a street?","o":["a state","a street"]}]},"ELEC.FPAST.L03.01":{"name":"Great Inventors","task":"Invent something! Draw a new tool that solves a problem at home and explain it to your class.","teach":[{"how":"An inventor makes something new that was never made before. Play Inventor Match: Edison lit it, Bell rang it, the Wrights flew it.","q":"Who worked on the light bulb: Thomas Edison or the Wright brothers?","pic":"💡","o":["Thomas Edison","the Wright brothers"]},{"how":"Alexander Graham Bell made the first telephone in 1876. Now people could talk across a long distance.","q":"What did Alexander Graham Bell make: the telephone or the car?","pic":"☎️","o":["the telephone","the car"]},{"how":"Benjamin Franklin flew a kite in a storm to learn about lightning. He invented the lightning rod to keep houses safe.","q":"What did Benjamin Franklin invent: the lightning rod or the light bulb?","pic":"⚡","o":["the lightning rod","the light bulb"]}],"practice":[{"q":"Who flew the first airplane: the Wright brothers, Edison, or Bell?","pic":"✈️","h":"Say the peg.","o":["the Wright brothers","Edison","Bell"]},{"q":"What did Thomas Edison work on: the light bulb or the airplane?","h":"Say the peg.","o":["the light bulb","the airplane"]},{"q":"Put the inventions in order from oldest to newest: airplane (1903), telephone (1876), light bulb (1879).","h":"The smallest year is the oldest.","t":"order","tiles":["telephone (1876)","light bulb (1879)","airplane (1903)"]},{"q":"How many Wright brothers flew the first airplane?","h":"Orville and Wilbur.","t":"num","a":2},{"q":"Why was the telephone a big help: people could talk far away, or people could fly?","h":"Bell rang it.","o":["people could talk far away","people could fly"]},{"q":"Shmuel's lamp lights up his room at night. Which inventor helped give us this: Edison or Bell?","pic":"🛋️","h":"Lit it!","o":["Edison","Bell"]}],"check":[{"q":"Who made the telephone: Alexander Graham Bell or Benjamin Franklin?","h":"Ring!","o":["Alexander Graham Bell","Benjamin Franklin"]},{"q":"What did the Wright brothers do first: fly an airplane or light a bulb?","h":"Say the peg.","o":["fly an airplane","light a bulb"]},{"q":"What is an inventor: someone who makes something new, or someone who sells shoes?","h":"New!","o":["someone who makes something new","someone who sells shoes"]}],"re":[{"how":"Say the peg with sound effects: Edison lit it, Bell rang it, the Wrights flew it. Click, ring ring, zoom!","q":"In the peg, who rang it: Bell or Edison?","o":["Bell","Edison"]},{"how":"One at a time. Edison and the light bulb. Say it three times: Edison, light bulb.","q":"Edison goes with: the light bulb or the telephone?","o":["the light bulb","the telephone"]},{"how":"An invention is a new thing that solves a problem. Before the light bulb, nights were dark. The bulb solved that problem.","q":"What problem did the light bulb solve: dark nights or cold winters?","o":["dark nights","cold winters"]}]},"ELEC.FTECH.L03.01":{"name":"Solid, Liquid, Gas","task":"With Abba or Ima, watch an ice cube melt in a cup. Draw it as a solid and then as a liquid.","teach":[{"how":"Everything is a solid, a liquid or a gas. Be a Shape Shifter detective: Solids keep their shape, liquids pour, gases spread everywhere.","q":"Is a rock a solid or a liquid?","pic":"🪨","o":["a solid","a liquid"]},{"how":"A liquid flows and takes the shape of its container. Water, milk and juice are liquids.","q":"Is milk a liquid or a solid?","pic":"🥛","o":["a liquid","a solid"]},{"how":"A gas spreads out to fill any space. Air is a gas. Steam from a pot is water as a gas.","q":"Is the air in a balloon a gas or a solid?","pic":"🎈","o":["a gas","a solid"]}],"practice":[{"q":"Which one is a solid: an ice cube, water, or steam?","pic":"🧊","h":"Solids keep their shape.","o":["an ice cube","water","steam"]},{"q":"What happens to an ice cube in the sun: it melts into a liquid, or it turns into a rock?","h":"Heat melts ice.","o":["it melts into a liquid","it turns into a rock"]},{"q":"Put these in order as water heats up: steam, ice, water.","h":"Start with the coldest.","t":"order","tiles":["🧊 ice","💧 water","♨️ steam"]},{"q":"Count the liquids: milk, juice, rock, water, block. How many liquids?","h":"Which ones pour?","t":"num","a":3},{"q":"What is steam: a gas or a solid?","pic":"♨️","h":"It spreads out from the pot.","o":["a gas","a solid"]},{"q":"Ima's soup pot boils, and clouds rise from it. Those clouds are water as: a gas or a liquid?","pic":"🍲","h":"Hot water turns to steam.","o":["a gas","a liquid"]}],"check":[{"q":"Is juice a liquid or a gas?","pic":"🧃","h":"You pour it.","o":["a liquid","a gas"]},{"q":"Is a wooden block a solid or a liquid?","h":"It keeps its shape.","o":["a solid","a liquid"]},{"q":"Which one spreads out to fill a whole room: a gas or a solid?","h":"Like a smell in the air.","o":["a gas","a solid"]}],"re":[{"how":"Say the peg and act it out: Solids keep their shape, liquids pour, gases spread everywhere. Stand still, wiggle like water, then spread your arms wide.","q":"In the peg, what do liquids do: pour or keep their shape?","o":["pour","keep their shape"]},{"how":"Start with solid and liquid. A solid you can hold. A liquid flows through your fingers.","q":"Can you hold a pencil in your hand: yes or no?","o":["yes","no"]},{"how":"Everything around us is made of matter. Matter takes up space. A rock, milk and air all take up space.","q":"Does air take up space: yes or no?","o":["yes","no"]}]},"ELEC.FNUM.L03.01":{"name":"Time Facts","task":"Time one minute with Abba's watch. How many times can you hop in one minute?","teach":[{"how":"Time is measured in minutes, hours, days, weeks and years. Climb the Time Ladder, each step bigger: 60 minutes make an hour, 24 hours make a day.","q":"How many minutes make an hour: 60 or 10?","pic":"⏰","o":["60","10"]},{"how":"A day has 24 hours. That counts the day and the night together.","q":"How many hours are in a whole day: 24 or 12?","pic":"🌗","o":["24","12"]},{"how":"A year has 365 days. That is 52 weeks, or 12 months.","q":"How many days are in a year: 365 or 100?","pic":"📅","o":["365","100"]}],"practice":[{"q":"Which is longer: an hour or a minute?","h":"60 minutes make one of them.","o":["an hour","a minute"]},{"q":"Put in order from shortest to longest: day, minute, week, hour.","h":"Climb the Time Ladder.","t":"order","tiles":["minute","hour","day","week"]},{"q":"Type how many months make a year.","h":"January to December.","t":"num","a":12},{"q":"How many hours are in a day: 24 or 60?","h":"Day and night.","o":["24","60"]},{"q":"Which is longer: a year or a week?","h":"It has 365 days.","o":["a year","a week"]},{"q":"Chaim learns for 1 hour. How many minutes is that: 60 or 100?","h":"Say the peg.","o":["60","100"]}],"check":[{"q":"How many minutes are in one hour: 60 or 24?","h":"Say the peg.","o":["60","24"]},{"q":"Which is shortest: a minute or a day?","h":"Quick!","o":["a minute","a day"]},{"q":"How many days are in a week: 7 or 10?","h":"Day Train.","o":["7","10"]}],"re":[{"how":"Say the peg and tap the table: 60 minutes make an hour, 24 hours make a day. Minutes are small steps, hours are bigger steps, and a day is a big step.","q":"In the peg, what do 24 hours make: a day or a week?","o":["a day","a week"]},{"how":"Start with one fact: one hour is 60 minutes. A short class might last one hour.","q":"An hour is made of: minutes or years?","o":["minutes","years"]},{"how":"A clock shows time. The short hand shows the hour. The long hand shows the minutes.","q":"Which hand shows the hour: the short hand or the long hand?","o":["the short hand","the long hand"]}]}};

{ const F4={"ELEC.FWORLD.L04.01":{"name":"The Five Oceans","task":"On a globe, trace a path from Baltimore to Africa with your finger. Name the ocean you cross.","teach":[{"how":"Earth has five oceans: the Pacific, Atlantic, Indian, Southern and Arctic. Ocean water is salty. Use Ocean Order to remember three of them: Pacific is the biggest, Arctic is the smallest, Atlantic is at our shore.","q":"How many oceans are there on Earth?","pic":"🌊","o":["five","seven","three"]},{"how":"The Pacific Ocean is the biggest and deepest ocean. It is bigger than all the land on Earth put together!","q":"Which ocean is the biggest?","pic":"🐋","o":["the Pacific","the Atlantic","the Arctic"]},{"how":"The Atlantic Ocean lies between the Americas on one side and Europe and Africa on the other. Maryland's beaches are on the Atlantic.","q":"Which ocean is at Maryland's shore?","pic":"🏖️","o":["the Atlantic","the Pacific","the Indian"]}],"practice":[{"q":"Which is the smallest ocean?","pic":"🧊","h":"Say the peg.","o":["the Arctic","the Pacific","the Southern"]},{"q":"Which ocean surrounds Antarctica?","pic":"🐧","h":"Antarctica is in the far south.","o":["the Southern Ocean","the Arctic Ocean","the Indian Ocean"]},{"q":"Put the oceans in order from biggest to smallest: Arctic, Atlantic, Pacific.","h":"Use the peg for the first and the last.","t":"order","tiles":["Pacific","Atlantic","Arctic"]},{"q":"How many oceans does Earth have?","h":"Pacific, Atlantic, Indian, Southern, Arctic.","t":"num","a":5},{"q":"What is ocean water like?","h":"Do not drink it!","o":["salty","sweet like juice","fresh like rain"]},{"q":"A ship sails from Baltimore straight across to Africa. Which ocean does it cross?","pic":"🚢","h":"It is the ocean at our shore.","o":["the Atlantic","the Pacific","the Arctic"]}],"check":[{"q":"Which ocean is the biggest and deepest?","h":"Say the peg.","o":["the Pacific","the Indian","the Atlantic"]},{"q":"Which ocean is around the North Pole?","h":"It is the smallest.","o":["the Arctic","the Southern","the Indian"]},{"q":"Which one is NOT one of the five oceans?","h":"One of these is a sea, not an ocean.","o":["the Baltic Sea","the Indian Ocean","the Arctic Ocean"]}],"re":[{"how":"Say the peg three times, faster each time: Pacific is the biggest, Arctic is the smallest, Atlantic is at our shore. Pacific starts with P, like Plenty of water.","q":"In the peg, which ocean is at our shore?","o":["the Atlantic","the Arctic","the Pacific"]},{"how":"Just two oceans first: the Atlantic is east of the United States, and the Pacific is west of it.","q":"Which ocean is west of the United States?","o":["the Pacific","the Atlantic","the Indian"]},{"how":"An ocean is a huge body of salty water. A lake is smaller and usually fresh. Oceans cover most of the Earth.","q":"An ocean is a huge body of:","o":["salty water","fresh water","sand"]}]},"ELEC.FNATURE.L04.01":{"name":"Animal Groups","task":"Make a chart with five columns, one for each animal group. Add three animals to each column.","teach":[{"how":"Scientists sort animals into groups by their body covering and how they live. Look for Group Clues: Fur means mammal, feathers mean bird, fins mean fish, dry scales mean reptile, wet skin means amphibian.","q":"A robin has feathers. What group is it in?","pic":"🐦","o":["bird","mammal","fish"]},{"how":"Mammals have fur or hair, and their babies drink milk. A cow, a horse and even a whale are mammals.","q":"A cow has hair and feeds its calf milk. What group is it in?","pic":"🐄","o":["mammal","reptile","bird"]},{"how":"Amphibians start life in the water and later live on land too. Their skin is wet. Frogs are amphibians.","q":"A frog starts life in water as a tadpole. What group is it in?","pic":"🐸","o":["amphibian","mammal","fish"]}],"practice":[{"q":"A turtle has dry, scaly skin and lays eggs on land. What group is it in?","pic":"🐢","h":"Dry scales.","o":["reptile","amphibian","mammal"]},{"q":"A salmon has fins and breathes with gills. What group is it in?","pic":"🐟","h":"Fins!","o":["fish","reptile","bird"]},{"q":"Put a frog's life in order: frog, egg, tadpole.","h":"It starts very small in the water.","t":"order","tiles":["egg","tadpole","frog"]},{"q":"Count the mammals: cow, eagle, horse, salmon, sheep. How many are mammals?","h":"Mammals have hair, and their babies drink milk.","t":"num","a":3},{"q":"A whale lives in the sea but breathes air and feeds its baby milk. What group is it in?","pic":"🐋","h":"Milk is the clue.","o":["mammal","fish","amphibian"]},{"q":"Dovid finds an animal with dry scales and no legs. What group is it in?","h":"Dry scales.","o":["reptile","fish","amphibian"]}],"check":[{"q":"An owl has feathers and a beak. What group is it in?","pic":"🦉","h":"Feathers.","o":["bird","mammal","reptile"]},{"q":"A shark has fins and gills. What group is it in?","pic":"🦈","h":"Fins.","o":["fish","mammal","amphibian"]},{"q":"A lizard has dry scales. What group is it in?","pic":"🦎","h":"Dry scales.","o":["reptile","bird","fish"]}],"re":[{"how":"Say the peg and act each one: Fur means mammal, feathers mean bird, fins mean fish, dry scales mean reptile, wet skin means amphibian. Pet a dog, flap, swim, slither, hop.","q":"In the peg, fins mean:","o":["fish","bird","mammal"]},{"how":"Two groups first: birds have feathers, mammals have fur. Think of a feather pillow and a wool sweater.","q":"An animal with feathers is a:","o":["bird","mammal","reptile"]},{"how":"Body coverings come first: fur, feathers, scales, wet skin. Look at the outside of an animal to find the clue.","q":"What covers a bird's body?","o":["feathers","fur","scales"]}]},"ELEC.FUSA.L04.01":{"name":"The 50 States","task":"On a United States map, find Alaska, Rhode Island, Hawaii, Texas and Maryland.","teach":[{"how":"The United States has 50 states. Check the State Stats: Big Alaska, little Rhode Island, Hawaii in the sea, 50 in all.","q":"How many states are in the United States?","pic":"🇺🇸","o":["50","13","100"]},{"how":"Alaska is the biggest state by land. It is far in the north and very cold.","q":"Which is the biggest state by land?","pic":"🏔️","o":["Alaska","Texas","Rhode Island"]},{"how":"Hawaii is a state made of islands in the Pacific Ocean. It became the 50th state in 1959.","q":"Which state is made of islands in the Pacific Ocean?","pic":"🏝️","o":["Hawaii","Alaska","Maryland"]}],"practice":[{"q":"Which is the smallest state?","h":"Say the peg.","o":["Rhode Island","Texas","Pennsylvania"]},{"q":"Is Washington, D.C. a state?","pic":"🏛️","h":"D.C. stands for District of Columbia.","o":["no, it is a district","yes, it is the 51st state"]},{"q":"Put these states in order from biggest to smallest: Rhode Island, Alaska, Texas.","h":"Use the peg for the first and the last.","t":"order","tiles":["Alaska","Texas","Rhode Island"]},{"q":"How many states are there in our country?","h":"One star for each.","t":"num","a":50},{"q":"Which state is the second biggest?","pic":"🤠","h":"It is in the south, after Alaska.","o":["Texas","Rhode Island","Maryland"]},{"q":"Yaakov flies to a state made of islands with warm beaches in the Pacific. Where is he going?","pic":"✈️","h":"In the sea.","o":["Hawaii","Alaska","Rhode Island"]}],"check":[{"q":"Which state is the biggest?","h":"Say the peg.","o":["Alaska","Rhode Island","Texas"]},{"q":"How many states are in our country: 50, 48, or 13?","h":"Stars on the flag.","o":["50","48","13"]},{"q":"Which state is made of islands?","h":"In the Pacific.","o":["Hawaii","Texas","Alaska"]}],"re":[{"how":"Say the peg: Big Alaska, little Rhode Island, Hawaii in the sea, 50 in all. Stretch wide, pinch small, swim, then clap.","q":"In the peg, which state is little?","o":["Rhode Island","Hawaii","North Carolina"]},{"how":"One fact first: there are 50 states. Our flag shows it: one star for each state.","q":"What do the stars on the flag count?","o":["the number of states","the number of oceans","the number of presidents"]},{"how":"A state is a part of our country with its own capital and leaders. Maryland is our state, and Annapolis is its capital.","q":"What is a state?","o":["a part of our country","a big ocean","a kind of tool"]}]},"ELEC.FPAST.L04.01":{"name":"Famous Explorers","task":"Explore a park or your street. Draw a map of what you found, with a key.","teach":[{"how":"An explorer travels to find new places. Follow the Explorer Path. A famous rhyme helps: In 1492 Columbus sailed the ocean blue. He sailed west from Spain across the Atlantic and reached the Americas.","q":"In what year did Columbus sail across the ocean?","pic":"⛵","o":["1492","1776","1969"]},{"how":"Lewis and Clark explored the western land of America from 1804 to 1806. They traveled all the way to the Pacific Ocean.","q":"Which ocean did Lewis and Clark reach?","pic":"🧭","o":["the Pacific","the Atlantic","the Arctic"]},{"how":"In 1969, Neil Armstrong became the first person to walk on the moon. He said, \"That's one small step for man, one giant leap for mankind.\"","q":"Who was the first person to walk on the moon?","pic":"🌕","o":["Neil Armstrong","Columbus","Alexander Graham Bell"]}],"practice":[{"q":"Which ocean did Columbus cross in 1492?","h":"He sailed west from Spain.","o":["the Atlantic","the Pacific","the Indian"]},{"q":"What did Magellan's ships do first in history?","pic":"🌐","h":"They went all the way around.","o":["sail all the way around the world","walk on the moon with Neil Armstrong","find the North Pole"]},{"q":"Put the explorers in order by year: Neil Armstrong (1969), Columbus (1492), Lewis and Clark (1804).","h":"The smallest year came first.","t":"order","tiles":["Columbus (1492)","Lewis and Clark (1804)","Neil Armstrong (1969)"]},{"q":"Columbus sailed in 1492 with the Nina, the Pinta and one more ship. How many ships in all?","h":"Two named ships and one more.","t":"num","a":3},{"q":"Lewis and Clark explored which part of America?","h":"They went to the Pacific.","o":["the West","the South Pole","Europe"]},{"q":"Rocket ships, a moon walk, and the year 1969. Which explorer is this about?","pic":"🚀","h":"The moon!","o":["Neil Armstrong","Lewis and Clark","Columbus"]}],"check":[{"q":"Who sailed the ocean blue in 1492?","h":"Say the rhyme.","o":["Columbus","Neil Armstrong","Lewis and Clark"]},{"q":"Who first walked on the moon, in 1969?","h":"Moon!","o":["Neil Armstrong","Lewis and Clark","Christopher Columbus"]},{"q":"Which explorers reached the Pacific Ocean by land in 1805?","h":"They walked and paddled west.","o":["Lewis and Clark","Columbus","Neil Armstrong and his crew"]}],"re":[{"how":"Say the rhyme and row your arms like oars: In 1492 Columbus sailed the ocean blue. Then add: 1969, the moon walk.","q":"In the rhyme, what did Columbus sail?","o":["the ocean blue","a tiny river","a rocket into space"]},{"how":"One explorer at a time. Columbus: ships, 1492, the Atlantic. Say it: ships, 1492, Atlantic.","q":"Columbus traveled by:","o":["ship","rocket","car"]},{"how":"To explore means to travel to a new place to learn about it. You explore when you walk in a new park and look around.","q":"What does an explorer do?","o":["travel to new places to learn about them","stay home every single day and never leave","sell food in a store"]}]},"ELEC.FTECH.L04.01":{"name":"Magnets","task":"Walk around your kitchen with a magnet. List five things it sticks to and five it does not.","teach":[{"how":"A magnet pulls things made of iron or steel. Every magnet has two ends called poles: north and south. The Pole Rule: Opposites attract, same ones push away.","q":"What does a magnet pull?","pic":"🧲","o":["iron nails","wooden blocks","plastic toys"]},{"how":"If you put a north pole near a south pole, they pull together. That is called attract.","q":"A north pole and a south pole come close. What happens?","pic":"🧲","o":["they attract","they push apart","nothing at all happens"]},{"how":"If two north poles come close, they push each other away. That is called repel.","q":"Two north poles come close. What happens?","pic":"🧲","o":["they push apart","they stick together","they melt"]}],"practice":[{"q":"Which one will a magnet pick up?","pic":"📎","h":"It must be iron or steel.","o":["a steel paper clip","a wooden pencil and an eraser","a paper cup"]},{"q":"Two south poles come close. What happens?","h":"Same ones push away.","o":["they push apart","they snap together","they turn into north poles"]},{"q":"Put the steps in order to test if something is magnetic: hold the magnet near it, pick an object, see if it sticks.","h":"You need something to test first.","t":"order","tiles":["pick an object","hold the magnet near it","see if it sticks"]},{"q":"A magnet has 2 poles. How many poles do 4 magnets have?","h":"2 for each magnet.","t":"num","a":8},{"q":"What is inside a compass that helps it find north?","pic":"🧭","h":"Earth acts like a giant magnet.","o":["a magnet","a battery","a light bulb"]},{"q":"Yossi drops steel pins on the rug. What can help him pick them up fast?","h":"Steel!","o":["a magnet","a sponge","a cup of water"]}],"check":[{"q":"A magnet pulls things made of:","h":"Metal like a nail.","o":["iron or steel","wood or plastic or glass","paper"]},{"q":"North pole near south pole: what happens?","h":"Opposites attract.","o":["attract","repel","turn hot and glow"]},{"q":"What are the two ends of a magnet called?","h":"North and south.","o":["poles","handles","corners"]}],"re":[{"how":"Say the peg and use your hands: Opposites attract, same ones push away. Clap hands together for opposites, push them apart for the same.","q":"In the peg, what do opposites do?","o":["attract","push away","fall down"]},{"how":"Just one test first: does a magnet stick to a steel spoon? Steel is a magnet's friend.","q":"Will a magnet stick to a steel spoon?","o":["yes","no"]},{"how":"A push moves something away. A pull brings something closer. Magnets can push or pull without touching.","q":"A pull brings something:","o":["closer","farther away","higher"]}]},"ELEC.FNUM.L04.01":{"name":"Measuring Length","task":"Measure your bed with a ruler. Write its length in feet and in inches.","teach":[{"how":"We measure length in inches, feet, yards and miles. Climb the Ruler Ladder: 12 inches make a foot, 3 feet make a yard. A ruler is one foot long.","q":"How many inches make one foot?","pic":"📏","o":["12","10","3"]},{"how":"3 feet make a yard. A yardstick is three rulers long.","q":"How many feet make one yard?","pic":"📏","o":["3","12","5"]},{"how":"A mile is a long distance: 5,280 feet. Walking a mile takes about 20 minutes.","q":"Which is longest: a mile, a yard, or a foot?","pic":"🛣️","o":["a mile","a yard","a foot"]}],"practice":[{"q":"Which is longer: a foot or an inch?","h":"12 of one makes the other.","o":["a foot","an inch"]},{"q":"Put in order from shortest to longest: yard, mile, inch, foot.","h":"Start with the tiny one on a ruler.","t":"order","tiles":["inch","foot","yard","mile"]},{"q":"How many inches are in 2 feet?","h":"12 and 12.","t":"num","a":24},{"q":"A pencil is about 7 ___ long.","pic":"✏️","h":"It fits in your hand.","o":["inches","feet","miles"]},{"q":"How many inches are in one yard?","h":"3 feet, 12 inches each.","t":"num","a":36},{"q":"Chaim's desk is 1 yard wide. How many feet is that?","h":"Say the peg.","o":["3","12","36"]}],"check":[{"q":"How many inches are in one foot?","h":"Ruler!","o":["12","3","36"]},{"q":"How many feet are in a yard?","h":"Yardstick.","o":["3","12","10"]},{"q":"Which unit would you use for the distance from Baltimore to Annapolis?","pic":"🚗","h":"It is far.","o":["miles","inches","feet"]}],"re":[{"how":"Say the peg and stretch: 12 inches make a foot, 3 feet make a yard. Hold up a ruler: that is a foot. Three rulers: a yard.","q":"In the peg, 3 feet make a:","o":["yard","mile","inch"]},{"how":"Start with the ruler. A whole ruler is 1 foot. Each small number on it is 1 inch.","q":"A whole ruler is how long?","o":["1 foot","1 mile","1 inch"]},{"how":"Length tells how long something is, from one end to the other. You can measure with a ruler, or even with paper clips.","q":"Length tells:","o":["how long something is","how heavy something is","what color it is"]}]}};
