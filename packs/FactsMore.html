{ const F13={"ELEC.FWORLD.L13.01":{"name":"World Organizations","task":"Find the United Nations building in New York on a map. List the five permanent Security Council members.","teach":[{"how":"Countries work together in world organizations. Meet the Global Groups: UN keeps peace, 193 members; five permanent seats: US, UK, France, Russia, China. The United Nations was founded in 1945, right after World War II, and its headquarters is in New York City.","q":"In what year was the United Nations founded?","pic":"🇺🇳","o":["1945","1918","1776","1989"]},{"how":"The UN Security Council has five permanent members, each able to block a decision with a veto: the United States, the United Kingdom, France, Russia and China.","q":"Which country is a permanent member of the UN Security Council?","pic":"🌐","o":["China","Brazil","Germany","India"]},{"how":"NATO, founded in 1949, is an alliance of countries in North America and Europe that promise to defend each other.","q":"What is NATO?","pic":"🛡️","o":["a defense alliance of North American and European countries","a kind of money","a worldwide sports league with teams from every single continent"]}],"practice":[{"q":"How many countries are members of the United Nations?","h":"Say the peg.","o":["193","50","100","27"]},{"q":"Where is the United Nations headquarters?","pic":"🏙️","h":"An American city.","o":["New York City","Paris","Geneva","Washington, D.C."]},{"q":"Put these in time order: NATO is formed, the UN is founded, World War II begins.","h":"1939, 1945, 1949.","t":"order","tiles":["World War II begins","the UN is founded","NATO is formed"]},{"q":"How many permanent members does the UN Security Council have?","h":"Say the peg.","t":"num","a":5},{"q":"What does a veto do in the Security Council?","h":"Block.","o":["lets one permanent member block a decision","lets every member country leave the meeting early to go home","prints new money"]},{"q":"A news report says, \"Five nations hold permanent seats.\" Which group is this about?","pic":"📰","h":"Veto power.","o":["the UN Security Council","NATO","the European Union","the International Olympic Committee"]}],"check":[{"q":"Which group was founded in 1945 to keep world peace?","h":"UN.","o":["the United Nations","NATO","the European Union","the Red Cross"]},{"q":"In the peg, how many members does the UN have?","h":"Say the peg.","o":["193","50","100","5"]},{"q":"Which country is NOT a permanent member of the Security Council?","h":"Say the peg.","o":["Germany","France","Russia","China"]}],"re":[{"how":"Say the peg, counting the five on one hand: UN keeps peace, 193 members; five permanent seats: US, UK, France, Russia, China.","q":"In the peg, which of these has a permanent seat?","o":["France","Canada","Japan","Brazil"]},{"how":"One group first: the United Nations. Founded in 1945, in New York, to keep peace and help nations work together.","q":"Why was the United Nations founded?","o":["to help keep world peace","to run the Olympic Games every four years","to print money"]},{"how":"An organization is a group of people or countries working together for a goal. A school, a shul and the UN are all organizations.","q":"An organization is:","o":["a group working together for a goal","a single person working all alone at home","a type of food"]}]},"ELEC.FNATURE.L13.01":{"name":"Stars and Galaxies","task":"On a clear night, find the Big Dipper with Abba. Use it to find the North Star.","teach":[{"how":"Our Sun is a star, one of billions in our galaxy, the Milky Way. Learn your Cosmic Address: Earth, solar system, Milky Way, universe: home, street, city, world.","q":"What is the name of our galaxy?","pic":"🌌","o":["the Milky Way","Andromeda","the Big Dipper","Orion"]},{"how":"A light-year is the distance light travels in one year: about 6 trillion miles. Light-years measure distance, not time. Some places, called black holes, have gravity so strong that not even light can escape.","q":"A light-year measures:","pic":"✨","o":["distance","time","brightness","weight"]},{"how":"The nearest star to Earth, after our Sun, is Proxima Centauri, about 4.2 light-years away. Its light takes over four years to reach us.","q":"Which is the nearest star after the Sun?","pic":"⭐","o":["Proxima Centauri","the North Star, Polaris","Sirius","Betelgeuse"]}],"practice":[{"q":"Our Sun is best described as:","pic":"☀️","h":"It shines by itself.","o":["a medium-sized star","a giant planet made of gas","a moon","a comet"]},{"q":"Put your Cosmic Address in order from smallest to largest: the universe, Earth, the Milky Way, the solar system.","h":"Say the peg.","t":"order","tiles":["Earth","the solar system","the Milky Way","the universe"]},{"q":"Proxima Centauri is about 4 light-years away. If you could travel at light speed, about how many years would the trip take?","h":"One light-year per year.","t":"num","a":4},{"q":"What is a black hole?","pic":"🕳️","h":"Gravity.","o":["a place where gravity is so strong that light cannot escape","a hole in the ground","a large, very dark storm cloud floating between the planets in space"]},{"q":"About how far does light travel in one year?","h":"Trillions.","o":["about 6 trillion miles","about 6 million miles","about 600 miles","about 6 billion miles"]},{"q":"An astronomer sees light from a star 100 light-years away. When did that light leave the star?","pic":"🔭","h":"One year per light-year.","o":["about 100 years ago","just now","100 seconds ago","exactly 100 days ago last spring"]}],"check":[{"q":"In the peg, which comes right after solar system?","h":"Say the peg.","o":["the Milky Way","the universe","Earth","the Moon"]},{"q":"A light-year is a unit of:","h":"Not time.","o":["distance","time","speed","light color"]},{"q":"Our galaxy is called:","h":"Say the peg.","o":["the Milky Way","the Solar System","the Sun","Andromeda"]}],"re":[{"how":"Say your Cosmic Address like the address on a letter: Earth, solar system, Milky Way, universe: home, street, city, world.","q":"In the peg, the Milky Way is like your:","o":["city","home","street","world"]},{"how":"One idea first: the Sun is a star. It looks bigger and brighter than other stars only because it is so much closer to us.","q":"Why does the Sun look bigger than other stars?","o":["it is much closer to us","it is the biggest star of all","it is a planet"]},{"how":"A star is a giant ball of hot, glowing gas that makes its own light. Planets do not make light; they reflect it.","q":"Which makes its own light?","o":["a star","a planet","a moon","an asteroid"]}]},"ELEC.FUSA.L13.01":{"name":"The Citizenship Test","task":"Visit or look up Fort McHenry with your family. Read the first verse of The Star-Spangled Banner together.","teach":[{"how":"People who become citizens take a civics test about America. Do the Civics Countdown: 1 Constitution, 9 justices, 27 amendments, 100 senators, 435 representatives. The Constitution has 27 amendments today.","q":"How many amendments does the Constitution have?","pic":"📜","o":["27","10","50","100"]},{"how":"The national anthem is The Star-Spangled Banner. Francis Scott Key wrote it in 1814 after watching the battle at Fort McHenry, in Baltimore.","q":"The Star-Spangled Banner was written about a battle at which fort?","pic":"🎵","o":["Fort McHenry, in Baltimore","Fort Knox, in Kentucky","the Alamo, in Texas","Fort Sumter, in South Carolina"]},{"how":"The Constitution is the supreme law of the land. Independence Day is July 4. The President is Commander in Chief of the military.","q":"Who is Commander in Chief of the military?","pic":"🎖️","o":["the President","the Chief Justice","the Speaker of the House","a general chosen by the army"]}],"practice":[{"q":"How many justices are on the Supreme Court?","h":"Say the peg.","o":["9","7","12","100"]},{"q":"Who wrote The Star-Spangled Banner?","h":"1814, Baltimore.","o":["Francis Scott Key","George Washington","Thomas Jefferson","Benjamin Franklin"]},{"q":"Put the peg numbers in order from smallest to largest: senators, justices, representatives, amendments.","h":"9, 27, 100, 435.","t":"order","tiles":["justices","amendments","senators","representatives"]},{"q":"How many voting members are in Congress in all: 100 senators plus 435 representatives?","h":"Add.","t":"num","a":535},{"q":"What is the supreme law of the land?","h":"Say the peg.","o":["the Constitution","the Declaration of Independence","a state law","the Pledge of Allegiance"]},{"q":"A man studying for the citizenship test asks how many senators each state has. What do you tell him?","pic":"📚","h":"100 senators, 50 states.","o":["2","1","10","50"]}],"check":[{"q":"In the peg, how many representatives are there?","h":"Say the peg.","o":["435","100","27","9"]},{"q":"What is the national anthem?","h":"Fort McHenry.","o":["The Star-Spangled Banner","America the Beautiful","Yankee Doodle","the Pledge of Allegiance"]},{"q":"What is the date of Independence Day?","h":"1776.","o":["July 4","June 14","November 11","January 1"]}],"re":[{"how":"Say the peg, counting up: 1 Constitution, 9 justices, 27 amendments, 100 senators, 435 representatives.","q":"In the peg, which number goes with justices?","o":["9","27","100","435"]},{"how":"One number first: 100 senators, because each of the 50 states has 2.","q":"Why are there 100 senators?","o":["50 states times 2 each","one senator for every big city in the country","there is no reason"]},{"how":"Civics is the study of citizens' rights and duties, and of how the government works.","q":"Civics is the study of:","o":["how government works and citizens' rights and duties","how plants grow in a garden and why their leaves change color","how to cook"]}]},"ELEC.FPAST.L13.01":{"name":"Modern Tech Milestones","task":"Ask a grandparent which new invention amazed them most when they were young. Write it down.","teach":[{"how":"The last 80 years changed daily life more than ever. Follow the Tech Timeline: 1947 transistor, 1969 the Moon, 1989 the Web, 2007 the smartphone. The transistor, invented at Bell Labs in 1947, is a tiny electronic switch inside every computer chip.","q":"What tiny invention from 1947 is inside every computer chip?","pic":"🔌","o":["the transistor","the light bulb","the steam engine","the telegraph"]},{"how":"In 1989, Tim Berners-Lee proposed the World Wide Web, which made the internet easy to browse with links.","q":"What did 1989 bring, by the peg?","pic":"🌐","o":["the Web","the transistor","the smartphone","the Moon landing"]},{"how":"In 2007, the first popular smartphone with a touch screen was released. Soon, phones became small computers. Like every tool, they must be used wisely.","q":"In what year did the touch-screen smartphone become popular?","pic":"📱","o":["2007","1989","1969","1947"]}],"practice":[{"q":"Which event in the Tech Timeline happened first?","h":"Say the peg.","o":["the transistor","the Moon landing","the Web","the smartphone"]},{"q":"What does a transistor do?","h":"A tiny switch.","o":["switches electric signals on and off","makes sound louder only","cools the whole computer down with a big fan"]},{"q":"Put the Tech Timeline in order: the smartphone, the Web, the transistor, the Moon landing.","h":"Say the peg.","t":"order","tiles":["the transistor","the Moon landing","the Web","the smartphone"]},{"q":"How many years passed from the transistor (1947) to the smartphone (2007)?","h":"Subtract.","t":"num","a":60},{"q":"Computer chips today hold billions of what?","pic":"💾","h":"Tiny switches.","o":["transistors","light bulbs","batteries","wires as thick as pencils"]},{"q":"A museum shows a giant computer from 1950 that fills a whole room. Why are computers so much smaller now?","pic":"🏛️","h":"1947.","o":["tiny transistors replaced big parts","computers do less now","people stopped using computers for anything important"]}],"check":[{"q":"In the peg, what goes with 1969?","h":"Apollo 11.","o":["the Moon","the Web","the transistor","the smartphone"]},{"q":"What did the World Wide Web make easy?","h":"Links.","o":["browsing linked pages on the internet","sending paper letters across the country by horse","printing books"]},{"q":"What is inside every computer chip?","h":"1947.","o":["transistors","water","sand grains you can see","tiny light bulbs"]}],"re":[{"how":"Say the peg like a countdown: 1947 transistor, 1969 the Moon, 1989 the Web, 2007 the smartphone.","q":"In the peg, which year goes with the Web?","o":["1989","1969","2007","1947"]},{"how":"One invention first: the transistor. Think of it as a tiny light switch: on means 1, off means 0. Billions of them do a computer's math.","q":"A transistor works like a tiny:","o":["switch","battery","speaker","screen"]},{"how":"A milestone is a big moment after which things are never the same. The light bulb, the airplane and the computer were milestones.","q":"A milestone in history is:","o":["a big moment that changes what comes after","a small stone by the side of a road and nothing else","a kind of dance"]}]},"ELEC.FTECH.L13.01":{"name":"AI and Digital Smarts","task":"Write an algorithm, step by step, for a daily task. Have a friend follow it exactly. Did it work?","teach":[{"how":"Modern technology runs on clever instructions. Do the Smart Tech Check: Algorithms follow steps, AI learns from examples, encryption scrambles secrets, always double-check. An algorithm is a step-by-step set of instructions, like a recipe.","q":"What is an algorithm?","pic":"⚙️","o":["step-by-step instructions","a robot that walks and talks like a person","a computer screen","a password"]},{"how":"Artificial intelligence, or AI, learns patterns from many examples. It can be very helpful, but it can also make mistakes, so people must check its answers.","q":"How does AI learn?","pic":"💻","o":["from many examples","by itself, with no data","by sleeping","from magnets"]},{"how":"Encryption scrambles information so only someone with the right key can read it. It protects passwords and bank information online.","q":"What does encryption do?","pic":"🔐","o":[
