'READ.COMP.L05.03':{name:'Text Structures',
teach:[
{how:`Every article is built like a house, and the plan of the house is called its structure. When you know the plan, you know where to look and what the author wants to show you. Two plans are very common. Compare and contrast tells how two things are alike and different. Problem and solution tells about a problem and how it was fixed. Read Two Ways to Get to Yeshiva. It holds up two ways, the bus and walking, and tells how they are alike and different.`, q:'What is the structure of "Two Ways to Get to Yeshiva"?', pic:T5.yeshiva, o:['compare and contrast','problem and solution','steps in order']},
{how:`Clue words show the plan. Compare and contrast uses words like both, alike, but and different. "Both arrive before Shacharis" shows how the boys are alike. "But on rainy days" shows a difference.`, q:'Which clue word shows a DIFFERENCE?', pic:'"The bus is warmer, but walking keeps you strong."', o:['but','warmer','keeps']},
{how:`Problem and solution has a problem first, then a fix. Clue words are problem, so, plan, fixed and solved. Press the speaker and listen to The Leak in the Shul Roof. The problem is the leak. The plan is the car wash.`, p:'rl5_roof', q:'What is the PROBLEM in "The Leak in the Shul Roof"?', pic:T5.roof, o:['the roof leaked when it rained','the boys wanted a car wash','the gabbai hung a sign']},
],
practice:[
{q:'What is the SOLUTION in "The Leak in the Shul Roof"?', pic:T5.roof, o:['the boys ran a car wash to pay for a new roof','they put buckets on the floor','the carpet began to smell'], h:'The solution is the plan that fixed the problem for good. Find the words "came up with a plan".'},
{q:'In "Two Ways to Get to Yeshiva," how are the boys ALIKE?', pic:T5.yeshiva, o:['both arrive before Shacharis','both ride the bus','both get wet shoes'], h:'Look for the word both. It shows what is the same.'},
{q:'In "Two Ways to Get to Yeshiva," how are the boys DIFFERENT?', pic:T5.yeshiva, o:['Dovid rides the bus; Shimon walks with his father','Dovid walks; Shimon rides the bus','they live on different streets'], h:'Read the paragraph about Dovid, then the one about Shimon. How does each one get there?'},
{q:'The buckets did not fix the leak. Why?', pic:T5.roof, o:['the buckets filled up fast','the buckets were too heavy to carry','the rav took the buckets away'], h:'A real solution ends the problem. Read what happened to the buckets.'},
{q:'Which words are clues for problem and solution?', o:['problem, plan, fixed','both, alike, different','first, next, last'], h:'Problem and solution tells what went wrong and how it was fixed. Which group has a fixing word?'},
{q:'A new text. What is its structure?', pic:T5.lunch, o:['problem and solution','compare and contrast','steps in order'], h:'Find what went wrong (the noise). Then find what fixed it (the bell). Problem, then fix.'},
],
check:[
{q:'What is the structure of this text?', pic:T5.bikes, o:['compare and contrast','problem and solution','steps in order'], h:'Look for both and but. Is it two things side by side, or a problem being fixed?'},
{q:'In the lunchroom text, what is the solution?', pic:T5.lunch, o:['a bell that means one minute of quiet','boys shouting to talk','louder announcements'], h:'The solution is the idea that made the room quiet enough to hear. Find "came up with an idea".'},
{q:'Bikes and scooters: which sentence shows a DIFFERENCE?', pic:T5.bikes, o:['A scooter is lighter, so it is easier to carry.','Both have wheels.','Both need a helmet.'], h:'Both shows what is the same. Look for a sentence about only one of them.'},
],
re:[
{how:`A new way: ask the house question. Is the author holding up two things side by side? That is compare and contrast. Is the author telling about something that went wrong and how it got fixed? That is problem and solution.`, q:'Two things side by side, or something that went wrong?', pic:T5.bikes, o:['two things side by side: compare and contrast','something went wrong: problem and solution']},
{how:`A simpler step: one tiny story. Find the problem first, then the fix.`, q:'What is the problem?', pic:'Ari could not reach the top shelf, so he stood on a step stool.', o:['Ari could not reach the top shelf','Ari stood on a step stool','the shelf was full']},
{how:`The skill underneath: What Happened Next (Level 5). Before you find the plan of a text, know the order of events and what caused what. Steps in order use first, next, then and last.`, q:'What is the structure of this text?', pic:T5.challah, o:['steps in order','compare and contrast','problem and solution']},
]},

'READ.COMP.L05.04':{name:'Read the Picture',
teach:[
{how:`Not every answer is in the words. Some are in a chart, a diagram or a timeline, and good readers read those pictures too. A chart puts facts in rows, a diagram labels the parts of something, and a timeline puts events in time order. Learn to read them, and you can find an answer in seconds. To read a chart, read the title first, find the row you need, then read across. In this chart, find 4th grade and read across.`, q:'How much tzedakah did 4th grade collect?', pic:T5.chart, o:['$60','$45','$52']},
{how:`A diagram is a picture with labels. Each label names one part and tells what it is. Find the label you need and read it.`, q:'In the diagram, what is the schach?', pic:T5.diagram, o:['the roof, made of branches or bamboo','the sides of the sukkah','where we eat our meals']},
{how:`A timeline lists events in time order, from top to bottom. Find the event, then read its time on the left. Earlier things are higher up.`, q:'At what time is candle lighting?', pic:T5.timeline, o:['4:20','4:00','4:30']},
],
practice:[
{q:'Which class collected the MOST tzedakah?', pic:T5.chart, o:['4th grade','6th grade','3rd grade'], h:'Read down the Money column and find the biggest number. Then read across to its class.'},
{q:'Which class collected the LEAST?', pic:T5.chart, o:['5th grade','3rd grade','4th grade'], h:'Read down the Money column and find the smallest number. Then read across.'},
{q:'In the timeline, what happens right after the challah goes into the oven?', pic:T5.timeline, o:['The boys shower and get dressed','Candle lighting','Shopping for Shabbos food'], h:'Find 2:00. Then move down one line to the next event.'},
{q:'In the diagram, which part is label 2?', pic:T5.diagram, o:['the walls','the schach','the table'], h:'Find the line that starts with 2 and read its name.'},
{q:'How much more did 6th grade collect than 3rd grade?', pic:T5.chart, o:['$7','$52','$45'], h:'Find both rows: 6th grade has $52 and 3rd grade has $45. Subtract: 52 minus 45.'},
{q:'A new picture: a bar graph. On which day were the most pages learned?', pic:T5.bars, o:['Monday','Sunday','Wednesday'], h:'Find the longest bar. Its number is the biggest. Then read the day on the left.'},
],
check:[
{q:'In the camp timeline, what happens at 9:30?', pic:T5.camp, o:['Swimming','Breakfast','Learning group'], h:'Find 9:30 on the left side and read across.'},
{q:'Which comes FIRST in the day?', pic:T5.camp, o:['Shacharis','Lunch','Baseball game'], h:'The top of a timeline comes first. Read the top line.'},
{q:'How many pages were learned on Tuesday?', pic:T5.bars, o:['2','3','5'], h:'Find Tuesday. Read the number at the end of its bar.'},
],
re:[
{how:`A new way: use your finger as a ruler. Put it on the row you need, then slide it across to the answer. That way your eyes cannot jump to the wrong row.`, q:'Slide across the row for 5th grade. What does it say?', pic:T5.chart, o:['$38','$60','$45']},
{how:`A simpler step: a chart with only two rows. Find the row, read across.`, q:'How many boys came to the shiur on Monday?', pic:'Boys at shiur\nSunday — 12\nMonday — 15', o:['15','12','27']},
{how:`The skill underneath: Text Tools (Level 3). Titles, headings and captions tell you what a page is about. On a chart, diagram or timeline, read the title first.`, q:'What does the title tell you this chart is about?', pic:T5.chart, o:['tzedakah each class collected this month','how many boys are in each class','what the boys bought']},
]},

'READ.VOC.L05.01':{name:'Same and Opposite',
teach:[
{how:`Words have partners. Some partners mean the same thing, like big and large. They are called synonyms. Some partners mean the opposite, like early and late. They are called antonyms. Knowing word partners helps you understand a hard word and pick the best word when you write. To find a synonym, swap the word in the sentence. If the sentence still means the same thing, it is a synonym.`, q:'Which word means the SAME as big?', o:['large','tiny','loud']},
{how:`To find an antonym, flip the meaning. Ask: what is the opposite? The opposite of full is empty.`, q:'Which word means the OPPOSITE of full?', o:['empty','heavy','round']},
{how:`Use the sentence to help. Read it with each choice. "The shul was silent during Kol Nidrei" means nobody made a sound. Which word could take its place?`, q:'"The shul was silent during Kol Nidrei." Which word means the SAME as silent?', o:['quiet','noisy','crowded']},
],
practice:[
{q:'Which word means the SAME as glad?', o:['happy','sad','tired'], h:'Swap it in: "I am glad to see you." Which word keeps the same meaning?'},
{q:'Which word means the OPPOSITE of early?', o:['late','soon','first'], h:'Flip it. If you are not early, you are...?'},
{q:'"The boys began to learn." Which word means the SAME as began?', o:['started','finished','stopped'], h:'Swap each word into the sentence. Which one still means the same?'},
{q:'"Yosef was brave in the dark." Which word is the OPPOSITE of brave?', o:['afraid','strong','bold'], h:'Brave means you are not scared. What is the opposite?'},
{q:'Which pair are synonyms?', o:['quick and fast','hot and cold','up and down'], h:'Synonyms mean the SAME. Which two words mean the same thing?'},
{q:'A new sentence. Which word in it is the OPPOSITE of give?', pic:'"Please take one cookie, and give the rest to your brother."', o:['take','rest','please'], h:'Give means hand something to someone. Find the word in the sentence that means the opposite: get something.'},
],
check:[
{q:'Which word means the SAME as shut?', o:['close','open','push'], h:'Swap it in: "Please shut the door." Which word means the same?'},
{q:'Which word is the OPPOSITE of heavy?', o:['light','big','strong'], h:'Flip it. Something not heavy is...?'},
{q:'Which pair are antonyms?', o:['win and lose','big and large','glad and happy'], h:'Antonyms are OPPOSITES. Which two words mean opposite things?'},
],
re:[
{how:`A new way: same-side or flip-side. Same-side words stand next to each other because they mean the same. Flip-side words face each other because they mean the opposite.`, q:'Tall and short. Same-side or flip-side?', o:['flip-side: opposites','same-side: the same']},
{how:`A simpler step: one easy word. Think of the word that means the opposite.`, q:'The opposite of hot is...', o:['cold','warm','sunny']},
{how:`The skill underneath: Dictionary Detective (Level 4). A dictionary tells what a word means. When you know the meaning, you can find its same and its opposite.`, q:'A dictionary says: "enormous: very, very big." Which word means the SAME as enormous?', o:['huge','small','short']},
]},

'READ.LIT.L05.01':{name:'Summarize the Story',
teach:[
{how:`When a friend asks, "What was the story about?" you do not read him the whole thing. You give a summary: the most important parts, short and in order, in your own words. A good summary lets someone know the story in a few sentences. Use five words to build it: Somebody, Wanted, But, So, Then. Press the speaker and listen to The Lost Siddur. Somebody: Yaakov. Wanted: his new siddur from Zeidy. But: it went missing.`, p:'rl5_siddur', q:'In "The Lost Siddur," what was the problem (the BUT)?', pic:T5.siddur, o:["Yaakov's new siddur went missing",'Yaakov forgot to daven','Yaakov lost his knapsack']},
{how:`Now the So: what did they do about it? The rebbe asked the class to help, and the boys split up to search.`, q:'What is the SO part of the summary?', pic:T5.siddur, o:['the class split up to search','Yaakov went to recess','Zeidy gave him a siddur']},
{how:`Then: how did it end? Nosson found it at the lost-and-found, and Yaakov thanked the first grader. Now put the parts together into a short summary, and leave out small details like the color of the cover.`, q:'Which is the best summary of "The Lost Siddur"?', pic:T5.siddur, o:["Yaakov's siddur from Zeidy went missing. The class searched, Nosson found it at the lost-and-found, and Yaakov thanked the boy who had brought it there.",'The siddur had a blue cover with a gold name.','Two boys checked the beis medrash and two boys checked the lunchroom.']},
],
practice:[
{q:'Which detail is too small to go in a summary?', pic:T5.siddur, o:['the siddur had a blue cover','the siddur went missing','Nosson found it'], h:'A summary keeps only what changes the story. Would the story change if the cover were red?'},
{q:'Who is the SOMEBODY in this story?', pic:T5.siddur, o:['Yaakov','the first grader','Zeidy'], h:'The Somebody is the main character: the one the story is mostly about.'},
{q:'How does the story end (the THEN)?', pic:T5.siddur, o:['Yaakov thanks the boy and writes his name inside','Yaakov goes out for recess','the rebbe gets angry'], h:'Read the last two paragraphs. What happens at the very end?'},
{q:'Put the summary in order. What comes FIRST?', pic:T5.siddur, o:['the siddur goes missing','Nosson finds the siddur','Yaakov thanks the first grader'], h:'A summary follows the story in order. Which of these happened earliest?'},
{q:'Why is "Yaakov looked under the desk" NOT needed in a short summary?', pic:T5.siddur, o:['it is a small step, and the summary already says they searched','it is not in the story','it is the ending'], h:'Ask: does the summary need this, or is it already covered by a bigger idea?'},
{q:'A new story. Which is the best summary?', pic:T5.lulav, o:["Menachem left his lulav and esrog on the bus, so he borrowed the shul's extra set, shook it with everyone and returned it.",'Menachem has an older brother.','The shul was full on Sukkos.'], h:'Use Somebody, Wanted, But, So, Then. Which choice has the problem AND how it was solved?'},
],
check:[
{q:'In this story, what did Meir WANT?', pic:T5.snow, o:['to build a snowman','to drink cocoa','to shovel snow'], h:'Read what Meir wanted in the morning, before Abba asked him to help.'},
{q:'What is the BUT?', pic:T5.snow, o:['Abba asked him to help shovel for Mr. Rubin','it was Thursday night','Mr. Rubin waved from the window'], h:'The But is what got in the way of what he wanted.'},
{q:'Which is the best summary?', pic:T5.snow, o:["Meir wanted to build a snowman but first helped shovel Mr. Rubin's walk. Mr. Rubin thanked him with cocoa, a hat and a carrot, and Meir built the snowman in his yard.",'Meir drank hot cocoa.','The first snow fell on a Thursday night.'], h:'A good summary has the beginning, the problem and the ending, in a few words.'},
],
re:[
{how:`A new way: a five-finger summary. Hold up a finger for each word: Somebody, Wanted, But, So, Then. Fill in one short phrase per finger, and you have your summary.`, q:'Which finger is "Nosson found the siddur"?', pic:T5.siddur, o:['Then: how it ended','Somebody: who it is about','Wanted: what he wanted']},
{how:`A simpler step: a tiny story. Say it in one sentence with only the most important parts.`, q:'Which one sentence sums it up?', pic:'Dani spilled grape juice on the tablecloth. He got a towel and wiped it up. Then he said sorry to Abba.', o:['Dani spilled grape juice, cleaned it up and said sorry.','Dani got a towel.','The tablecloth was white.']},
{how:`The skill underneath: Moral of the Story (Level 4). A summary tells what happened. A moral tells the lesson. Knowing both helps you see what really matters in a story.`, q:'What is the lesson of "The Lost Siddur"?', pic:T5.siddur, o:['returning something lost is a real mitzvah','siddurim have blue covers','recess is too short']},
]},

'READ.LIT.L05.02':{name:"Who's Telling?",
teach:[
{how:`Every story has a storyteller, called the narrator. Sometimes the narrator is a boy inside the story, telling what happened to him. Sometimes the narrator is outside the story, telling about someone else. Knowing who is telling helps you know whose thoughts and feelings you are hearing. If the narrator says I, me and my, he is in the story. That is first person. Read this story: "I had never been so nervous."`, q:'Who is telling this story?', pic:T5.first, o:['a boy in the story, telling about himself','someone outside the story','Abba']},
{how:`If the narrator says he, him, his or uses a name, he is outside the story, telling about someone else. That is third person. Read the same story told about Chaim.`, q:'Who is telling this story?', pic:T5.third, o:['someone outside the story, telling about Chaim','Chaim himself',"Chaim's father"]},
{how:`Clue words tell you fast. First person: I, me, my, we. Third person: he, him, his, they, or a name. Find the clue word in the sentence.`, q:'"My hands shook as I held the shofar." Which word is a first-person clue?', o:['My','hands','shofar']},
],
practice:[
{q:'Is this first person or third person?', pic:T5.first, o:['first person','third person'], h:'Look for I, me or my. Do you see them?'},
{q:'Is this first person or third person?', pic:T5.third, o:['third person','first person'], h:'Look for he, his or a name like Chaim. Is the narrator telling about someone else?'},
{q:'"Chaim could see his father smiling." Which word is a third-person clue?', o:['his','could','smiling'], h:'Third-person clues are he, him, his, they, or a name. Find one of those.'},
{q:'Who is telling this letter?', pic:T5.letter, o:['Benny, about himself','Abba, about Benny','the counselor'], h:'A letter is signed at the bottom. Who signed it? Does he say I and my?'},
{q:'In the first-person story, whose feelings do you hear?', pic:T5.first, o:["the boy's own feelings","Abba's feelings",'everyone in the room'], h:'In first person, the narrator tells what HE felt. Find "I had never been so nervous".'},
{q:'A new story. Who is telling it?', pic:T5.gemara, o:['someone outside the story (third person)','Reuven himself (first person)','Eli (first person)'], h:'Look for clue words. Does the story say I and my, or he, his and names?'},
],
check:[
{q:'Is this first person or third person?', pic:'We set up the sukkah in the backyard. My brother hung the decorations, and I held the ladder.', o:['first person','third person'], h:'Look for we, my or I.'},
{q:'Is this first person or third person?', pic:'Ezra set up the sukkah in the backyard. His brother hung the decorations, and he held the ladder.', o:['third person','first person'], h:'Look for he, his or a name.'},
{q:'Which sentence is told in first person?', o:['I finished my homework before supper.','He finished his homework before supper.','Moshe finished his homework before supper.'], h:'First person uses I or my. Which sentence does?'},
],
re:[
{how:`A new way: the camera test. If the camera is on the narrator's head, looking out through his eyes, it is first person. If the camera is across the room, watching someone, it is third person.`, q:'"I could see Abba smiling at me." Where is the camera?', o:["on the narrator's head: first person",'across the room: third person']},
{how:`A simpler step: one word only. Is it a first-person word or a third-person word?`, q:'Which is a first-person word?', o:['I','he','they']},
{how:`The skill underneath: Character Clues (Level 4). You learn about a character from what he does, says and feels. In first person, the narrator gives you his own clues.`, q:'"My hands shook as I held the shofar." What does this clue show about the boy?', pic:T5.first, o:['he was nervous','he was angry','he was sleepy']},
]},

'READ.FLU.L05.01':{name:'Stamina Reader',
teach:[
{how:`A strong runner does not stop after one block. He keeps going, mile after mile. A strong reader is the same: he can read a long story without getting lost or giving up. That is called reading stamina, and it lets you read whole books on your own. Here is how: read one part, stop, and check in. Ask: who, where, and what just happened? Then keep going. Press the speaker and listen to Part 1 of The Long Ride to Zeidy. Check in: what just happened?`, p:'rl5_ride', q:'Check in after Part 1: what just happened?', pic:T5.ride1, o:['the car got a flat tire on the highway','they arrived at Zeidy','Avi fell asleep']},
{how:`A check-in also asks: what is the problem now? Problems keep you reading, because you want to know how they end. In Part 2, the bolt is stuck and Shabbos is coming.`, q:'Check in after Part 2: what was Shmuel worried about?', pic:T5.ride2, o:['getting to Zeidy before Shabbos','losing the red-car game','that Zeidy was sick']},
{how:`When your mind wanders, don't give up. Go back to the last thing you remember and reread from there. Keep the whole story in your head as you go.`, q:'Check in after Part 3: how did the story end?', pic:T5.ride3, o:['they arrived before Shabbos and Zeidy said Hashem sent help','the car broke down again','they stayed home for Shabbos']},
],
practice:[
{q:'Part 1: why did Abba say there was plenty of time?', pic:T5.ride1, o:['the drive was four hours and Shabbos began at 4:30','Zeidy lived next door','they left on Thursday'], h:'Find the times in Part 1: how long the drive is and when Shabbos begins.'},
{q:'Part 2: how did the truck driver help?', pic:T5.ride2, o:['he turned the stuck bolt with a strong wrench','he drove them to Zeidy','he gave them a new car'], h:'Reread the paragraph that starts "Just then."'},
{q:'Part 2: what did Shmuel do to help Abba?', pic:T5.ride2, o:['he held the bag of bolts','he drove the truck','he counted red cars'], h:'Avi handed the tools. Find what Shmuel did.'},
{q:'Part 3: what did Shmuel do on the rest of the drive?', pic:T5.ride3, o:['he said Tehillim softly','he fell asleep','he changed a tire'], h:'Check in at the start of Part 3. Who slept, and what did Shmuel do?'},
{q:'Whole story: put these in order. What happened SECOND?', pic:T5.ride, o:['a truck driver helped with the stuck bolt','they heard a loud bang','Zeidy waved from the porch'], h:'Use your check-ins: Part 1 the bang, Part 2 the truck driver, Part 3 Zeidy.'},
{q:'A new idea: you are reading a long chapter and realize you lost track. What should you do?', o:['go back to the last part you remember and reread from there','skip to the end','close the book'], h:'A stamina reader does not give up. He goes back to where he still understood.'},
],
check:[
{q:"Part 1: how many red cars had Shmuel counted by eleven o'clock?", pic:T5.ride1, o:['forty-two','four','thirty'], h:'Reread the part about the red-car game.'},
{q:"Part 3: what time did they reach Zeidy's street?", pic:T5.ride3, o:['3:20','4:30',"eleven o'clock"], h:"Check in at Part 3. Find the time they turned onto Zeidy's street."},
{q:'Whole story: what does Zeidy mean by "Today He sent it in a truck"?', pic:T5.ride, o:['Hashem sent help through the truck driver','Zeidy bought a truck','the truck was a present'], h:'Think back to Part 2. Who came in a truck, and what did he do?'},
],
re:[
{how:`A new way: picture a movie. After each part, play it in your head like a short movie. If you can see it, you understood it. If the movie is blank, reread that part.`, q:'Play Part 2 in your head. What do you see?', pic:T5.ride2, o:['Abba changing a tire by the highway with help from a truck driver','the family eating Shabbos dinner','Avi asleep in the car']},
{how:`A simpler step: one short part, one check-in.`, q:'What happened in this part?', pic:'Avi dropped his ball. It rolled under the car. Shmuel reached under and got it back for him.', o:["Shmuel got Avi's ball back from under the car",'Avi kicked the ball','the car drove away']},
{how:`The skill underneath: Chapter Reader (Level 4). A chapter book is read part by part. Know what each chapter told you before you start the next one.`, q:'Which part tells about the flat tire?', pic:T5.ride, o:['Part 1','Part 2','Part 3']},
]}
};

/* ===== Reading Level 6 batch 8 (6 skills) — K-8 curriculum chat (curriculum@), 2026-11-10. Gap Map batch #8.
 Skills: READ.COMP.L06.02 Feature Finder · READ.VOC.L06.02 Figure It Out · READ.COMP.L06.03 Two Big Ideas ·
 READ.LIT.L06.01 Compare Characters · READ.COMP.L06.04 Point and Proof · READ.COMP.L06.05 Two Sources.
 NOT touched (already built): READ.COMP.L06.01 Read Between the Lines, READ.VOC.L06.01 Root Power.
 Names, descriptions, prerequisites: GAP MAP hidden tab "Sheet2".
 PASTE: in ReadMore.html, inside the IIFE, as its own { } block. Put it right AFTER the Reading Level 5 batch 7 block
 (window.TLR5B7 ... }) if that block is already installed; otherwise right AFTER the Reading Level 4 batch 6 block
 (the { } block that ends window.TLR4B6=Object.keys(R4).length; } ). Either way BEFORE "TL-042: long picture text ...".
 Uses only R and PASS (both already defined there). Everything else stays inside this { } block. Local names are new
 (T6, R6) and do not clash with Levels 1-4 (P, R, PG, R2, SW2, SWF, swAll, swPick, swMix, swItem, card, B, T3, RW, BW,
 SN, R3, T4, R4, PW, PS, BIG) or with a Level 5 block (any T5/R5 names stay inside their own block). New PASS keys:
 rl6_siyum, rl6_brothers.
 Same shape as Level 4 batch 6: 'ID':{name, teach[3], practice[6], check[3], re[3]}. First option is the right one
 (the page shuffles). Opener = teach[0].how. Transfer = practice[5]. re[3] = re-teach: a different way, a simpler
 step, the skill underneath (names the prerequisite). Read-aloud reads q only. Every answer is a tap; nothing typed.
 Bold words in the nonfiction pages are shown in CAPITAL letters (the picture text cannot show bold). ===== */
{
const T6={
torah:`How a Sefer Torah Is Written
Contents: 1. The Sofer · 2. The Klaf · 3. The Ink and the Quill · 4. Checking Every Letter · Glossary
1. The Sofer
A sefer Torah is written by hand, letter by letter, by a scribe called a SOFER. Many sofrim go to the mikvah before they begin. Before he writes Hashem's Name, the sofer says that he is writing it for its holiness. A sofer must know thousands of halachos about how each letter is shaped.
2. The Klaf
The Torah is written on KLAF, parchment made from the skin of a kosher animal. The klaf is soaked, scraped and dried until it is smooth. Then the sofer scratches thin lines across it, so that every line of writing is straight.
[Picture: a sofer holding a feather quill over a sheet of klaf.]
Caption: A sofer writes with a quill made from a turkey or goose feather.
3. The Ink and the Quill
The ink is deep black and does not fade. The sofer dips his quill into it and forms each letter slowly and carefully. A whole sefer Torah has 304,805 letters. Writing all of them can take a year or more.
4. Checking Every Letter
When the writing is done, every letter is checked by a trained checker, and today a computer checks it too. If even one letter is missing, or two letters touch, the sefer Torah may not be used until it is fixed.
Glossary
klaf — parchment for writing a sefer Torah
sofer — a scribe who writes sifrei Torah, tefillin and mezuzos`,
tefillin:`How Tefillin Are Made
Contents: 1. The Batim · 2. The Parshiyos · 3. The Retzuos · Glossary
1. The Batim
The BATIM are the black boxes of the tefillin. Each one is made from the thick hide of a kosher animal. It is soaked, pressed into shape and dried, and it must be perfectly square.
2. The Parshiyos
Inside the batim are the PARSHIYOS, four sections of the Torah written by a sofer on klaf. In the tefillin worn on the head, they are written on four separate pieces. In the tefillin worn on the arm, they are written on one piece.
[Picture: four tiny rolled scrolls beside an open box.]
Caption: The head tefillin hold four small scrolls, each in its own room.
3. The Retzuos
The RETZUOS are the leather straps that hold the tefillin in place. They must be black on the outside.
Glossary
batim — the boxes of the tefillin
parshiyos — sections of the Torah
retzuos — the straps of the tefillin`,
light:`Keepers of the Light
Contents: 1. Why Lighthouses? · 2. The Keeper's Night · Glossary
1. Why Lighthouses?
Long ago, ships had no radar and no maps on a screen. At night, a captain could not see the rocks near the shore, and many ships crashed and sank. So people built tall towers on the coast, with a bright light at the top. When a captain saw the light, he knew to stay away from the rocks. Each lighthouse flashed in its own pattern, so a captain could tell which lighthouse he was passing.
2. The Keeper's Night
A man called the KEEPER lived in or near the lighthouse. Every evening before sunset, he climbed the long winding stairs and lit the lamp. All night he climbed up again and again to trim the wick and add oil. In the morning he polished the giant glass LENS until it sparkled, because a dirty lens makes a weak light. In a storm, he could not rest at all.
[Picture: a tall white tower on a rocky shore.]
Caption: Many lighthouses have more than 100 steps.
Today most lighthouses run by themselves, with electric lamps and no keeper.
Glossary
keeper — the man who took care of a lighthouse
lens — a large curved glass that makes the light strong`,
siyum:`The Night Before the Siyum
The night before his class siyum, Eliezer could not sleep. His thoughts buzzed like bees in a jar. Tomorrow he would stand in front of the whole yeshiva and read the last lines of Maseches Berachos.
He tiptoed downstairs. The kitchen was as quiet as an empty shul. Abba was sitting at the table with a Gemara, the lamp glowing like a small moon above the page.
"Can't sleep?" Abba asked. Eliezer shook his head. "What if I get mixed up? My memory is a sieve tonight."
Abba smiled and pulled out a chair. "Let's learn it together." They read the last lines once, twice, three times. Abba's voice was a steady rope, and Eliezer held on to it. Slowly the words began to feel like old friends.
In the morning the beis medrash was packed. The rebbe nodded, and Eliezer began. His voice shook for a moment, then grew as strong as a drum. When he finished, the room burst into singing. The boys danced around him in a circle, and Abba's face was the sun itself.
Afterwards they ate cake and drank grape juice. "You were a lion up there," said his friend Shaul.
Eliezer laughed. He did not feel like a lion. He felt like a boy who had learned something with his father, and that was even better.`,
bees:`The Busy Beehive
A beehive may look like a quiet box, but inside, tens of thousands of bees are hard at work. Two things make a hive amazing: the way the bees share the work, and the way they turn flowers into honey.
Every bee has a job. Young worker bees clean the cells of the honeycomb and feed the baby bees. Older workers build new comb out of wax that comes from their own bodies. Guard bees stand at the door and chase away bees from other hives. The oldest workers fly out to gather food. No bee gives orders to the others, yet every job gets done.
Making honey takes a long time. A forager bee visits hundreds of flowers on one trip and sips their sweet nectar. Back at the hive, it passes the nectar to a house bee, which stores it in a wax cell. Then the bees fan their wings over the cells to dry out the nectar. Slowly it thickens into honey. When the honey is ready, the bees seal each cell with a cap of wax. One bee makes only about a twelfth of a teaspoon of honey in its whole life, so a single jar holds the work of hundreds of bees.
Chazal teach that even though a bee is not kosher, its honey is kosher. Every spoonful is a small wonder of Hashem's world.`,
ant:`Lessons from the Ant
Shlomo HaMelech wrote in Mishlei, "Go to the ant, you lazy one; see its ways and become wise." People who study ants have found two things that make them special.
First, ants are very strong for their size. One ant can lift an object many times heavier than its own body. If a boy were that strong, he could lift a car over his head.
Second, ants work together. When one ant finds food, it leaves a scent trail on the way home, and other ants follow the trail to the food. When a crumb is too big for one ant, several ants grab it and carry it together. In winter, the colony lives on the food it stored all summer, with no one telling it what to do.`,
tzitzis:`Tzitzis have four corners. Each corner has strings tied in knots.

We wear tzitzis every day. Looking at them reminds us of all the mitzvos.`,
brothers:`Two Brothers and One Chanukah Party
Every year, the boys of the Gold family run a Chanukah party for the old men at the Beis Avos home. This year, Abba gave the job to Yechiel and Baruch.
Yechiel is twelve. He likes lists. On Sunday he sat at his desk and wrote down everything they would need: two menorahs, a box of candles, forty doughnuts, napkins and song sheets. He checked each item twice.
Baruch is ten. He does not like lists. He likes people. While Yechiel was writing, Baruch was on the phone with Zeidy. "What songs did you sing when you were a boy?" he asked. He learned the words to three old Chanukah songs.
On the night of the party, Yechiel's plan worked perfectly. The candles were lit on time, the doughnuts were on the plates, and every man had a song sheet.
But it was Baruch who made the room come alive. He sat next to Mr. Feld, who had not smiled all year, and started singing one of Zeidy's old songs. Mr. Feld's eyes opened wide. He began to sing too, and soon the whole room was singing.
Walking home in the cold, Baruch said, "Your list was amazing." Yechiel laughed. "Your singing was better." Abba put an arm around each of them. "A party needs a planner and a heart," he said. "Tonight it had both."`,
shuls:`Zeidy's Shul and Our Shul
Zeidy davened in a tiny wooden shul in a farm town. It had one room, a creaky floor and a wood stove in the corner. Only twelve men came on a weekday, so everyone knew everyone.
Our shul in the city is big and made of stone. It has bright lights, a library full of seforim, and hundreds of men on Shabbos. It is so big that some men sit far from the bimah.
But in both shuls, the same Torah is read, and every boy learns to answer "Amen" loudly.`,
camp:`At camp, Moshe and Ezra shared a bunk. Moshe woke up early every morning, made his bed neatly and was the first one at Shacharis. Ezra liked to sleep late, and his bed was always a mess. But on the night of the big rainstorm, when the tent leaked, both boys jumped up together, moved everyone's bags to a dry corner, and laughed about it in the morning.`,
swim:`Every Boy Should Learn to Swim
I believe every boy should learn to swim, and I have three good reasons.
First, swimming keeps you safe. Every summer, families go to lakes, pools and the beach. A boy who can swim knows what to do if he falls into deep water. He can stay calm, float on his back and reach the side.
Second, swimming makes you strong. When you swim, you use your arms, your legs and your lungs all at the same time. A boy who swims every week builds a strong heart and does not get tired as quickly. He will have more energy for learning and for playing ball with his friends.
Third, our Chachamim teach that it is a father's job to teach his son to swim. The Gemara in Maseches Kiddushin says that a father should teach his son to swim, along with Torah and a trade. If Chazal made it part of a father's job, it must be very important.
Some boys say swimming lessons are boring. But the lessons only last a few weeks, and the skill lasts a whole life.
So ask your Abba to sign you up this summer. Your body, your safety and the words of Chazal all agree.`,
garden:`Our Yeshiva Should Plant a Garden
Our yeshiva has an empty patch of dirt behind the building. I think we should turn it into a garden.
A garden would teach us about Hashem's world. We could watch a seed grow into a plant and learn the brachos on the fruits and vegetables we grow.
A garden would also help others. We could give the vegetables to families who need food for Shabbos.
Finally, a garden is good for our bodies. Digging and weeding is hard work in the fresh air.
Some people say a garden costs too much money. But seeds are cheap, and Mr. Adler's hardware store has offered us free tools.`,
shofar1:`Text 1: How a Shofar Is Made
A shofar is made from the horn of a kosher animal, most often a ram. A cow's horn may not be used. First, the craftsman boils the horn and pulls out the hard bone that fills the inside, so the horn is hollow. Next, he heats the horn until it is soft and gently shapes it. Then he drills a small hole at the narrow end to make the mouthpiece. Finally, he sands and polishes the shofar and tests its sound. The wide end of the horn is called the bell, and that is where the sound comes out. A good shofar can last for many years.`,
shofar2:`Text 2: When We Hear the Shofar
On Rosh Hashanah, it is a mitzvah to hear the shofar. The baal tokea blows three kinds of sounds. A tekiah is one long blast. Shevarim are three medium blasts, like a person sighing. A teruah is nine very short blasts, like a person crying. During the month of Elul, many shuls blow the shofar every morning after davening, to wake us up to do teshuvah before Rosh Hashanah. A ram's horn also reminds us of the ram that Avraham Avinu brought instead of Yitzchak. The whole shul stands quietly and listens, so that no one misses a single sound.`,
matzah:`Text 1: At the Matzah Bakery
At a matzah bakery, the men work very fast. They mix flour and water, roll the dough into thin circles, poke rows of holes in it, and slide it into a very hot oven. From the moment the water touches the flour until the matzah is in the oven, no more than eighteen minutes may pass, so the dough never has time to rise.

Text 2: Why We Eat Matzah
On Pesach we eat matzah to remember how we left Mitzrayim. The Jewish people left in such a hurry that their dough had no time to rise. It baked into flat matzah on their backs as they walked. That is why, all through Pesach, we eat no chametz.`
};
T6.shofar=T6.shofar1+'\n\n'+T6.shofar2;

'READ.VOC.L06.02':{name:'Figure It Out',
teach:[
{how:`Writers paint pictures with words. Sometimes they compare two things that are not really alike, to help you feel what they mean. A comparison with the word like or as is called a SIMILE: "His thoughts buzzed like bees in a jar." A comparison that says one thing IS another is called a METAPHOR: "My memory is a sieve." Once you can figure them out, stories come alive. Press the speaker and listen to The Night Before the Siyum. Eliezer's thoughts buzzed like bees in a jar. Bees in a jar fly around and cannot get out, so his mind was busy and could not rest.`, p:'rl6_siyum', q:'What does "His thoughts buzzed like bees in a jar" tell you about Eliezer?', o:['his mind was busy and could not settle','there were bees in his room','he was hungry']},
{how:`How to tell them apart: look for the words like or as. If you find one of them in the comparison, it is a simile. "The kitchen was as quiet as an empty shul" uses as, so it is a simile.`, q:'Which sentence is a simile?', o:['The kitchen was as quiet as an empty shul.','My memory is a sieve tonight.',"Abba's voice was a steady rope."]},
{how:`A metaphor says one thing IS another. To figure it out, ask: what is special about the second thing? A sieve is full of holes, and water runs right out. So "My memory is a sieve" means he is afraid everything will fall out of his head.`, q:'Eliezer says, "My memory is a sieve tonight." What does he mean?', o:['he is afraid he will forget things','he is helping to cook','his memory is very strong']},
],
practice:[
{q:'Is this a simile or a metaphor?', pic:'"the lamp glowing like a small moon above the page"', o:['a simile, because it uses like','a metaphor, because it says the lamp is a moon'], h:'Look for the word like or as. Do you see one?'},
{q:'What does "Abba\'s voice was a steady rope" mean?', pic:T6.siyum, o:["Abba's voice helped Eliezer hold on and not get lost",'Abba was holding a rope','Abba spoke very loudly'], h:'What do you do with a rope when you are afraid of falling? Read the next words: "Eliezer held on to it."'},

{q:'"Abba\'s face was the sun itself." What does this show?', pic:T6.siyum, o:['Abba was glowing with joy','Abba was sunburned','Abba was far away'], h:'The sun is bright and warm. The boys were dancing. How did Abba feel?'},
{q:'Which sentence is a metaphor?', pic:T6.siyum, o:['"You were a lion up there."','The kitchen was as quiet as an empty shul.','His thoughts buzzed like bees in a jar.'], h:'A metaphor has no like or as. It says one thing IS another.'},
{q:'A new story. What does "his legs were jelly" mean?', pic:'After the long hike up the mountain, Yosef sat down on a rock. His legs were jelly. He drank his water as fast as a fire hose.', o:['his legs were weak and wobbly','he spilled jelly on his legs','his legs were very strong'], h:'What is jelly like when you shake it? After a long hike, how would his legs feel?'},
],
check:[
{q:'Which sentence is a simile?', o:['The new sefer smelled as fresh as rain.','The new sefer was a treasure chest.','The new sefer had a blue cover.'], h:'Look for the word like or as in a comparison.'},
{q:'What does the metaphor mean?', pic:'On the first snowy morning, the yard was a white blanket.', o:['snow covered the whole yard','someone left a blanket outside','the yard was warm'], h:'What does a blanket do to a bed? Now think about the snow and the yard.'},
{q:'Read the story. "Slowly the words began to feel like old friends." What does it mean?', pic:T6.siyum, o:['the words became familiar and easy for him','he met some old friends','the words disappeared'], h:'You know old friends very well. After reading the lines three times, how well did he know them?'},
],

{how:`A new way: the two-thing test. Every simile or metaphor compares two things. Name the two things, then ask: what do they share? That shared part is the meaning.`, q:'"His voice was as strong as a drum." A voice and a drum: what do they share?', o:['both are loud and steady','both are round','both are made of wood']},

]},

{how:`Some articles carry more than one big idea, like a truck carrying two loads. To understand the whole article, you need to find each big idea and the details that hold it up. Often the author tells you the big ideas near the beginning. In The Busy Beehive, the first paragraph says: the way bees share the work, and the way they turn flowers into honey. Those are the two big ideas.`, q:'What are the two big ideas of The Busy Beehive?', pic:T6.bees, o:['bees share the work, and bees turn nectar into honey','bees can sting, and bees are yellow','bees live in boxes, and honey is sweet']},

{how:`Two characters in one story are like two different tools in one toolbox: each does something the other cannot. When you compare characters, you ask two questions: How are they alike? How are they different? Look at what each one likes, does and says. In Two Brothers and One Chanukah Party, Yechiel likes lists, and Baruch likes people. That is a big difference.`, q:'How are Yechiel and Baruch DIFFERENT?', pic:T6.brothers, o:['Yechiel likes lists; Baruch likes people','Yechiel is younger than Baruch','only Baruch went to the party']},

'READ.COMP.L06.04':{name:'Point and Proof',
teach:[
{how:`An author who wants to convince you is like a lawyer in a beis din: he makes points, and he must prove each one with reasons or evidence. A point with no proof is only an opinion. Today you learn to match each point to its proof, so you can judge whether an author really convinced you. In Every Boy Should Learn to Swim, the main point is in the very first sentence.`, q:"What is the author's main point?", pic:T6.swim, o:['every boy should learn to swim','swimming lessons are boring','lakes are dangerous']},
{how:`Each paragraph holds one point and its reasons. The paragraph that starts "First, swimming keeps you safe" gives its reason right after: a boy who can swim knows what to do in deep water.`, q:'Which reason supports the point "swimming keeps you safe"?', pic:T6.swim, o:['a boy who can swim knows what to do in deep water','swimming uses your arms and legs','the lessons last only a few weeks']},
{how:`Proof comes in different kinds: a reason, a fact, or a teaching from someone who knows. In the third paragraph, the proof is a teaching from the Gemara.`, q:'What kind of proof does the author give in the third paragraph?', pic:T6.swim, o:['a teaching from the Gemara','a story about his brother','a number from a chart']},
],
practice:[
{q:'Which reason supports the point "swimming makes you strong"?', pic:T6.swim, o:['a boy who swims every week builds a strong heart','families go to the beach','the Gemara teaches it'], h:'Find the paragraph that starts "Second, swimming makes you strong."'},
{q:'The Gemara in Kiddushin is proof for which point?', pic:T6.swim, o:["it is a father's job to teach his son to swim",'swimming keeps you safe','swimming makes you strong'], h:'Find the word Kiddushin. Read the sentence just before it.'},
{q:'Some boys say lessons are boring. How does the author answer them?', pic:T6.swim, o:['the lessons are short, but the skill lasts a lifetime','he agrees that lessons are boring','he says boys can skip lessons'], h:'Read the paragraph that starts "Some boys say."'},
{q:'Which sentence is a reason, not the main point?', pic:T6.swim, o:['You use your arms, your legs and your lungs at the same time.','Every boy should learn to swim.','I have three good reasons.'], h:'The main point is what the author wants you to believe. A reason tells WHY.'},
{q:'Which NEW reason would also support "swimming keeps you safe"?', pic:T6.swim, o:['A swimmer can help a friend who is in trouble in the water.','Swimsuits come in many colors.','Pools are wet.'], h:'A reason for safety must be about staying out of danger.'},

{how:`When you want to learn about something, one book rarely tells you everything. A good researcher reads two sources and puts them together, like two halves of a map. First, notice what each text tells you. Then combine them into one answer that is bigger than either text alone. Here are two texts about the shofar. Text 1 is about making a shofar.`, q:'Which text tells how a shofar is made?', pic:T6.shofar, o:['Text 1','Text 2','both texts']},

const T7={
walk:`The Long Walk Home
The yeshiva bus broke down two miles from home, and the driver said the next bus would not come for an hour. Dovid and his little brother Nachum decided to walk.
At first the sky was gray and heavy. A cold wind howled through the bare trees and bit at their ears. Nachum trudged behind, dragging his feet through the slush. Every car that roared past splashed icy water at their boots. "We'll never get there," Nachum moaned. The street seemed to stretch on forever.
Then Dovid had an idea. "Let's chazzer the mishnayos we learned today," he said. "One mishnah for every block." Nachum groaned, but he started. By the third block, his voice was louder. By the fifth block, the two brothers were singing the words to the tune their rebbe used.
Suddenly the clouds split open, and a golden stripe of sunlight spilled across the snow. The puddles sparkled like silver coins. Nachum skipped ahead, laughing, and pointed at their own front door.
Inside, the kitchen was warm and smelled of fresh challah. Abba listened as Nachum proudly said every mishnah by heart. "Two miles in the cold," Abba said, "and you turned it into a siyum on the sidewalk."
Nachum grinned. "It was the shortest long walk ever."`,
dentist:`Shmuel sat in the dentist's waiting room. The clock on the wall ticked loudly. The plastic chair was hard and cold. Every time the door creaked open, Shmuel's stomach twisted into a knot.`,
shabbos:`The Shabbos table glowed with candlelight. The smell of warm challah filled the room. Zeidy's voice rose in a sweet zemer, and the boys joined in, smiling at one another.`,
bagel:`Why Is a Bagel Chewy?
Have you ever wondered why a bagel is so chewy, when a roll is soft? The answer is hidden in the way a bagel is made.
Step 1: The Dough
The baker mixes flour, water, yeast and a little salt. Bagel dough is much stiffer than bread dough, because it has less water. Stiff dough makes a dense bagel.
Step 2: The Shape
The baker rolls each piece of dough into a rope and joins the ends to make a ring. Then the rings rest in a cold refrigerator all night. The cold slows the yeast down, so the flavor grows stronger.
Step 3: The Boil
Here is the secret. Before baking, every bagel is dropped into a pot of boiling water for about a minute. The hot water cooks the outside right away and seals it. That is what makes the crust shiny and chewy.
Step 4: The Bake
Last, the bagels go into a hot oven until they turn golden brown.
A Problem at the Bakery
Long ago, bakers boiled every bagel by hand, one at a time. It was slow, hot work, and a baker could make only a few hundred bagels in a morning. Today many bakeries use a machine with a moving belt that carries the bagels through the water, so thousands can be boiled in an hour.
So the next time you eat a bagel, think of the cold night, the bubbling pot and the hot oven. A chewy bagel takes patience.`,
snow:`Clearing the Path
Last winter, a big storm buried the path to our shul under two feet of snow. Many of the older men could not get to Shacharis.
The boys of the yeshiva had an idea. Before davening, twenty boys came with shovels and cleared the whole path in thirty minutes.
Now, every time it snows, the boys shovel first and daven second. Not one man has missed Shacharis because of snow since.`,
library:`Our Yeshiva Needs a Lending Library
by Avrohom, Grade 6
Our yeshiva should open a lending library where boys can borrow seforim and books to take home. I have three reasons.
First, a library would help boys learn more at home. Last month I asked the twenty-four boys in my class how many Mishnayos they have at home for chazzering. Eleven boys said they have none. A library would give every boy the seforim he needs.
Second, a library would save families money. A new set of Mishnayos with English costs about $40. If the yeshiva buys one set and lends it out, many families can use it for free.
Third, lending seforim is a big mitzvah. The Gemara in Kesubos says that a person who writes seforim and lends them to others has a reward that lasts forever. Our library would let every boy share in that mitzvah.
Some people say boys will lose the seforim. But we can keep a sign-out sheet, and each boy can return his sefer by Friday.
Also, a library would make our yeshiva the most famous yeshiva in the whole world.
Please help us start a lending library this year. Bring one sefer from home that you no longer use, and together we will fill the shelves.`,
fish:`Our class should get a fish tank. First, caring for fish teaches responsibility: last year, the boys in Rebbe Katz's class took turns feeding their fish every day for the whole year. Second, watching fish is calming. Our school nurse, Mr. Stern, says boys come back to class calmer after a few quiet minutes of watching fish. Also, fish are the smartest pets in the world.`,
helmet:`Every Boy Should Wear a Helmet
Every boy should wear a helmet when he rides a bike. A helmet protects your head if you fall. Doctors say that helmets prevent many serious head injuries. In our town, the police give a free ice pop to every boy they see riding with a helmet, so wearing one even pays! Also, boys who wear helmets ride faster than everyone else.
Some boys say helmets are hot. But new helmets have air holes, and you get used to one in a day.`
};

teach:[
{how:`Writers choose every word on purpose, the way a painter chooses colors. "Walked" and "trudged" both mean going on foot, but "trudged" makes you feel that the walker is tired and heavy. The words an author picks set the feeling of the whole story. Learn to notice them, and you will feel what the author wants you to feel. Press the speaker and listen to The Long Walk Home. Look at this line: "Nachum trudged behind, dragging his feet through the slush."`, p:'rl7_walk', q:'Which word shows that Nachum was tired and did not want to walk?', o:['trudged','behind','boots']},
{how:`The feeling a piece of writing gives you is called its MOOD. Find it by collecting the strong words. At the start of the story: gray, heavy, howled, bit, slush, icy, moaned. Put them together and the mood is gloomy and cold.`, q:'What is the mood at the beginning of the story?', pic:T7.walk, o:['gloomy and cold','cheerful and excited','calm and sleepy']},
{how:`Moods can change, and the words change with them. Near the end the author uses golden, sparkled, skipped, laughing, warm. Those words make the end feel bright and happy. When the words change, the mood changes.`, q:'Which words make the end of the story feel cheerful?', pic:T7.walk, o:['golden, sparkled, skipped, laughing','gray, heavy, howled','slush, icy, roared']},

{how:`Now look at how the middle is built. The author uses Step 1, Step 2, Step 3, Step 4. Steps in order are called a SEQUENCE. Each step section explains one part of making a bagel, in the order the baker does it.`, q:'Why did the author build the middle as Step 1 to Step 4?', pic:T7.bagel, o:['to show the steps of making a bagel in order','to compare bagels and rolls','to tell a story about one baker']},
{how:`Even one sentence can have a big job. In Step 3, the sentence "Here is the secret" tells you that this section answers the question from the first paragraph. The sentences after it explain the secret.`, q:'The author writes "Here is the secret." Which question does Step 3 answer?', pic:T7.bagel, o:['why a bagel is chewy','how long bagels bake','who made the first bagel']},

'READ.COMP.L07.04':{name:'Claim Spotter',
teach:[
{how:`An argument is like a train. The engine is the CLAIM: the main thing the author wants you to believe. The cars behind it are the REASONS, and each reason should carry EVIDENCE: a fact, a number, an example or a teaching. A Claim Spotter follows the whole train and checks every car, so nobody can fool him with words that sound strong but prove nothing. In Avrohom's article, the claim is in the first sentence.`, q:"What is Avrohom's main claim?", pic:T7.library, o:['our yeshiva should open a lending library','boys lose seforim','a set of Mishnayos costs about $40']},
{how:`Now check a car. Avrohom's first reason is that a library would help boys learn more at home. His evidence is a survey: he asked the boys in his class, and eleven of twenty-four have no Mishnayos at home. That is real evidence, a number he found out.`, q:'What evidence supports the reason "a library would help boys learn more at home"?', pic:T7.library, o:['eleven of twenty-four boys have no Mishnayos at home','a set costs about $40','boys can return seforim by Friday']},
{how:`A Claim Spotter also catches a claim with NO support. Ask of every claim: where is the proof? "A library would make our yeshiva the most famous yeshiva in the whole world" has no reason, no fact and no example. It is an unsupported claim, a car with nothing inside.`, q:'Which claim has NO reason or evidence to support it?', pic:T7.library, o:['the library would make our yeshiva the most famous in the world','a library would save families money','a library would help boys learn more at home']},
],
practice:[
{q:'What evidence supports the reason that a library would save families money?', pic:T7.library, o:['a new set of Mishnayos costs about $40, and one set can be shared','eleven boys have no Mishnayos at home','the Gemara in Kesubos'], h:'Find the paragraph that starts "Second."'},
{q:'What kind of evidence does Avrohom give for his third reason?', pic:T7.library, o:['a teaching from the Gemara','a survey of his class','a price'], h:'Find the paragraph that starts "Third." Where does the proof come from?'},
{q:'Some people say boys will lose the seforim. How does Avrohom answer them?', pic:T7.library, o:['a sign-out sheet, and every sefer comes back by Friday','he agrees that a library is a bad idea','he says seforim are cheap'], h:'Read the paragraph that starts "Some people say."'},
{q:'Which sentence is a reason, not the main claim?', pic:T7.library, o:['A library would save families money.','Our yeshiva should open a lending library.','Please help us start a lending library this year.'], h:'The main claim is what he wants to happen. A reason tells WHY.'},
{q:'Which NEW piece of evidence would best support the first reason?', pic:T7.library, o:['In another yeshiva, boys who borrowed seforim chazzered twice as often.','The library shelves could be painted blue.','Avrohom likes to read.'], h:'The first reason is about learning more at home. Which fact shows that?'},
{q:'A new argument. Which claim is NOT supported?', pic:T7.fish, o:['fish are the smartest pets in the world','caring for fish teaches responsibility','watching fish is calming'], h:'Check each claim for proof. Which one has no example, fact or person who says so?'},
],
check:[
{q:'What is the main claim?', pic:T7.helmet, o:['every boy should wear a helmet on a bike','helmets are hot','the police give free ice pops'], h:'The main claim is what the author wants every boy to do. Read the first sentence.'},
{q:'Which claim is NOT supported by any reason or evidence?', pic:T7.helmet, o:['boys who wear helmets ride faster than everyone else','a helmet protects your head if you fall','wearing a helmet even pays'], h:'Check each claim for proof. Which one stands alone with nothing to back it up?'},
{q:'What evidence supports the claim that a helmet protects your head?', pic:T7.helmet, o:['doctors say helmets prevent many serious head injuries','the police give free ice pops','new helmets have air holes'], h:'Find the sentence right after "A helmet protects your head if you fall."'},
],
re:[
{how:`A new way: a ladder. The top rung is the claim. The middle rung is a reason. The bottom rung, holding everything up, is the evidence. Build the ladder from the top down.`, q:'Claim: we need a library. Reason: it saves money. Which is the evidence on the bottom rung?', pic:T7.library, o:['a set of Mishnayos costs about $40','we need a library','Avrohom is in Grade 6']},
{how:`A simpler step: one sentence, one claim, one reason. The word because usually comes right before the reason.`, q:'What is the claim?', pic:'Shimon should be the class gabbai, because he comes to Shacharis early every day.', o:['Shimon should be the class gabbai','he comes to Shacharis early','every day']},
{how:`The skill underneath: Point and Proof (Level 6). A claim is a point, and evidence is proof. First find the point, then find the proof that goes with it.`, q:'What is the point, and what is the proof?', pic:'We should plant a garden, because it would give food to families who need it.', o:['point: plant a garden; proof: it would give food to families','point: give food to families; proof: plant a garden']},
]}
};

const T8={
bike1:`Text 1: A Bike Path for Willow Street
The town council voted last night to build a bike path along Willow Street. The path will run for two miles, from the park to the shopping center, and it will pass right by the Willow Street Yeshiva. It will cost $400,000, and most of the money will come from a state grant. To make room for the path, the town will remove 12 of the 200 parking spaces on the street. Officer Levy of the town police said that last year, 9 boys on bikes were hurt on Willow Street. "A safe path will protect our boys," he said. Work will begin in the spring and should take about four months.`,
bike2:`Text 2: A Letter from a Shopkeeper
To the editor: For thirty years I have run Gold's Seforim Store on Willow Street. Now the town wants to take away 12 parking spaces right in front of my door. Twelve spaces may not sound like many, but many of my customers are older men who cannot walk far. Before Yom Tov, when men come to buy machzorim and esrog boxes, every space is full. Where will they park? I am not against bikes. My own grandsons ride to yeshiva every day. But the town should build the path on Maple Street, one block away, where there are no stores. Then the boys would be safe, and my customers could still reach my door. — Mr. Chaim Gold`,
day:`Text 1: Notice from the Menahel
Starting after Sukkos, the yeshiva day will end at 5:00 instead of 4:30. The extra half hour will be used for a new Mishnayos chabura. Buses will leave at 5:15.

Text 2: From a Boy's Journal
Our day is getting longer! At first I groaned, because I like to play ball after school. But then Rebbi told us we will finish a whole seder of Mishnayos by Pesach, and we will make a siyum with a barbecue. Now I can't wait.`,
shtender:`The Wobbly Shtender
Naftali liked to do things fast. He ate fast, packed fast and ran everywhere. So when Zeidy, who had been a carpenter for fifty years, offered to help him build a shtender for his bar mitzvah, Naftali grabbed the saw and started cutting right away.
"Measure first," Zeidy said quietly.
"I can see where it goes," said Naftali. In one hour, the shtender was done. He set his Gemara on it, and the whole thing tipped sideways. One leg was shorter than the others.
Naftali's face turned red. He wanted to throw it in the garbage.
Zeidy picked up a piece of wood and showed him the rings inside it. "Every ring is one year," he said. "This tree took sixty years to grow strong. Good things are not rushed."
The next Sunday, Naftali started again. He measured every board twice. He sanded each edge until it was smooth. When a corner did not fit, he took it apart and tried again instead of forcing it. The work took four Sundays.
When it was finished, Naftali leaned his whole weight on it. It did not move at all.
At his bar mitzvah, he gave the shtender to the shul, so that every boy could learn on it.
A week later, his little cousin Yehuda was racing through a puzzle and getting angry. Naftali sat down next to him. "Slow down," he said, smiling. "Good things are not rushed."`,
change:`The Extra Dollar
After Shacharis, Moshe stopped at Kaplan's Bakery for a roll that cost one dollar. He paid with a five-dollar bill, and Mr. Kaplan gave him back five dollars instead of four. Moshe noticed right away. Nobody else saw. He could buy a drink with it.
Then he remembered his rebbe saying, "Hashem sees what nobody else sees." Moshe turned around and gave the dollar back. Mr. Kaplan smiled and put a warm rugelach in his bag.
On the way to yeshiva, Moshe felt lighter than he had all week.`,
rain:`The Rainy Sunday
YAAKOV
For two weeks I had waited for Sunday. Abba promised to take me and my cousin Eli, who is visiting from Eretz Yisrael, to the zoo. When I woke up, rain was pounding on the window. My stomach sank. The whole day was ruined. I stomped down to breakfast and did not say good morning to anyone.
Eli was standing at the window, grinning from ear to ear. I could not understand it. Didn't he care that our trip was cancelled?
ELI
When I woke up and heard the rain, I ran to the window. At home in Eretz Yisrael, no rain falls all summer. Every winter, the whole country waits and davens for it. When the first rain comes, people stand outside and let it fall on their faces. My Abba always says, "Rain is a bracha."
So when I saw this rain, I felt like it was a present. But then I saw Yaakov's face. He looked like he had lost something.
YAAKOV
After breakfast, Eli asked if we could put on our boots and go outside. I thought he was crazy, but I went. We jumped in puddles and raced paper boats down the gutter. Eli told me how the farmers near his home cheer when it rains.
By lunchtime, my socks were soaked and I was laughing. The zoo could wait. Maybe the rain was a present after all.`,
game:`The Last Out
DOVI
Last inning, and Shimmy hit a high ball right to me. I reached up, and it bounced off my glove. Two runs scored, and we lost. I wanted to disappear.
SHIMMY
I hit that ball as hard as I could. When Dovi dropped it, my team cheered, but I looked over at him. He was staring at the ground. I remembered last week, when I struck out three times. I walked over and said, "That was a really hard catch. Nobody could have made it."`,
town:`How Cedar Falls Got Its Yeshiva
Long ago, Cedar Falls was a small town on the east side of the Cedar River. Only a few Jewish families lived there. They had a shul, but no yeshiva, so the boys had to take a long train ride every day to learn Torah in the city.
In 1952, an engineer named Mr. Shimon Klein designed a new bridge across the river. Before the bridge, the west side of the river was only farms. After the bridge, families could live on the west side and reach the shul in ten minutes. Land on the west side was cheap, so many young Jewish families moved there.
As the community grew, the shul became too crowded. On Shabbos, men stood in the hallway to daven. The rav of the shul, Rabbi Weiss, had an idea: "Our boys should not have to ride a train to learn. Let us build a yeshiva right here."
The idea spread. Mr. Klein, who had built the bridge, drew the plans for the yeshiva for free. Families gave what they could, one dollar or one hundred dollars. In 1958, the Cedar Falls Yeshiva opened with 40 boys.
Once the yeshiva opened, even more families wanted to move to Cedar Falls, so that their sons could learn close to home. Today the yeshiva has 400 boys, and the town has six shuls.
A bridge, a rav's idea and a few generous families changed a whole town.`,
camp:`A New Rule at Camp Ohr
Last summer, Rabbi Stern, the head counselor, noticed that boys were staying up too late and falling asleep in learning. He made a new rule: lights out at 10:00. At first some boys complained. But after a week, the boys were awake and sharp during morning seder. The learning got so strong that the camp made a siyum on Maseches Megillah. The next summer, other camps copied Rabbi Stern's rule.`,
pantry:`Chessed Night at the Food Pantry
Every Thursday night, the boys of Shiur Gimmel volunteer at the yeshiva's food pantry. They pack boxes of PROVISIONS, the food and supplies that families need for Shabbos.
Reb Yossi, who runs the pantry, is METICULOUS. He checks every box twice, lines up every can with its label facing out, and writes down every item in his notebook. Nothing is ever out of place.
This week, the boys found that the pantry's STOCK was running low. The shelves that are usually packed with cans were almost bare. Reb Yossi was worried. "If we do not get more food, some families will have an empty Shabbos table," he said.
At first, Mordechai was RELUCTANT to help with the extra work, but by the end of the night he was the most eager boy in the room. He had an idea: each boy would ask his neighbors to give one bag of food.
By Sunday, the boys had collected more than 300 cans. One BENEVOLENT neighbor, Mr. Rosen, even drove a whole van of groceries to the pantry. He said that doing good for others was the best way to spend a Sunday.
The old pantry building is DILAPIDATED. Its roof leaks, its paint is peeling, and one window is broken. But inside, the shelves were full again, and Reb Yossi was smiling.
"You see," he told the boys, "a small idea can fill a big shelf."`,
stock:`Dictionary

1. a supply of goods kept ready to use or give out
2. a soup made by boiling bones or vegetables in water
3. a share in owning a company
Sentence: This week, the boys found that the pantry's stock was running low.`,

draft:`Dictionary
draft (noun)
1. a first try at writing something, before it is finished
2. a flow of cold air into a room
3. a drawing of a plan
Sentence: Close the window; there is a cold draft blowing on my Gemara.`,
train:`On the yeshiva trip to the train museum, the guide showed the boys an old steam engine. "This engine was OBSOLETE by 1960," he said. "Newer diesel trains had replaced it, and no railroad used steam engines anymore."`

'READ.COMP.L08.01':{name:'Side by Side',
teach:[
{how:`Two writers can look at the same topic and tell it very differently, like two cameras on two sides of the same street. A wise reader puts the texts side by side and asks three questions: What do both texts say? What does only one say? How does each writer use the facts? Today you learn to compare two texts on one topic, so no single writer can do your thinking for you. Text 1 is a news report. Text 2 is a letter from a shopkeeper. Both are about the same bike path.`, q:'What topic do BOTH texts write about?', pic:T8.bike, o:['the plan to build a bike path on Willow Street','how to fix a flat tire on a bike','a new seforim store that is opening']},
{how:`Start with the shared facts. A fact is shared when both texts say it, even in different words. Text 1 says the town will remove 12 of the 200 parking spaces. Text 2 says the town wants to take away 12 parking spaces. That fact is in both.`, q:'Which fact is in BOTH texts?', pic:T8.bike, o:['12 parking spaces will be removed','the path will cost $400,000','9 boys on bikes were hurt last year']},
{how:`Now look at how each writer USES the same fact. Text 1 says 12 of the 200 spaces, which makes the number sound small. Text 2 says 12 spaces right in front of my door, where older customers park, which makes it sound big. Same fact, different picture.`, q:'How does Text 2 make the 12 parking spaces seem?', pic:T8.bike, o:['like a big loss for his customers','like a very small change','like good news for his store']},
],
practice:[
{q:'Which fact is ONLY in Text 1?', pic:T8.bike, o:['last year, 9 boys on bikes were hurt on Willow Street','12 parking spaces will be removed','the path should be built on Maple Street'], h:'Text 1 is the news report. Look for a fact the shopkeeper never mentions, like a number about the boys.'},
{q:'What does Text 1 mostly focus on?', pic:T8.bike, o:['safety, cost and the facts of the plan','the needs of older customers','what happens in the store before Yom Tov'], h:'Notice the numbers in Text 1: miles, dollars, boys hurt, months. What are they mostly about?'},
{q:'What does Text 2 mostly focus on?', pic:T8.bike, o:['how losing parking will hurt his customers','how much the path will cost','when the work will begin'], h:'Mr. Gold talks about the people who come to his store. What worries him?'},
{q:'Why do the two texts present the plan so differently?', pic:T8.bike, o:['each writer has a different purpose: one reports, one argues for his store','one writer got the number of spaces wrong','they are about two different streets'], h:'Ask who wrote each text and why. A reporter tells what happened. A letter tries to convince.'},
{q:'Do the two writers disagree about whether the boys need a safe place to ride?', pic:T8.bike, o:['no; both want the boys safe, but they disagree about where the path should go','yes; Mr. Gold says bikes should be banned','yes; Text 1 says boys should not ride bikes'], h:'Find the sentence "I am not against bikes." Then find what Mr. Gold suggests instead.'},
{q:'Two new texts. What does ONLY Text 2 tell?', pic:T8.day, o:['how a boy felt about the change, and what made him glad','that the day will end at 5:00','that buses will leave at 5:15'], h:'Text 1 gives the facts of the plan. Text 2 is a journal. What does a journal add that a notice does not?'},
],
check:[
{q:'Which fact is in BOTH texts?', pic:T8.day, o:['the yeshiva day is getting longer','buses will leave at 5:15','there will be a siyum with a barbecue'], h:'Find something the Menahel says that the boy also says, even in different words.'},
{q:'How do the two texts present the same change differently?', pic:T8.day, o:['Text 1 gives plain facts; Text 2 shows feelings and a reason to be glad','Text 1 is excited; Text 2 is angry','both texts only list times'], h:'Notice the times in Text 1 and the feelings in Text 2.'},
{q:'Mr. Gold wants the path on Maple Street. Which fact from Text 1 could make the town keep it on Willow Street?', pic:T8.bike, o:['9 boys on bikes were hurt on Willow Street last year','the work should take about four months','work will begin in the spring'], h:'Why does the town want the path on Willow Street? Look for the reason Officer Levy gives.'},
],
re:[
{how:`A new way: a check chart. Make two columns in your head, Text 1 and Text 2. For each fact, put a check in every column where you find it. A fact with two checks is shared. A fact with one check shows what that writer chose to stress.`, q:'Where does the fact about machzorim and esrog boxes get a check?', pic:T8.bike, o:['only Text 2','only Text 1','both texts']},
{how:`A simpler step: two sentences about the same thing. Ask: what does each one stress?`, q:'What does Text B stress that Text A does not?', pic:'Text A: The trip to the zoo costs $20 and leaves at 9:00.\nText B: The zoo trip will be the best day of the year. We will see lions!', o:['how exciting the trip will be','the cost of the trip','the time the bus leaves']},

]},

'READ.LIT.L08.01':{name:'Theme Tracker',
teach:[
{how:`A theme is the big lesson a story teaches about life. It is not told all at once. It grows through the story like a plant: a seed at the beginning, a stem in the middle, and fruit at the end. Today you learn to track a theme from start to finish, so you understand what a story really means. Press the speaker and listen to The Wobbly Shtender. At the beginning, Naftali rushes and the shtender tips over. That is the seed: rushing leads to trouble.`, p:'rl8_shtender', q:'What is the theme of The Wobbly Shtender?', o:['good work takes patience','wood is easy to cut','a shtender must be tall']},
{how:`In the middle, a character often says the lesson out loud, or something happens that teaches it. Zeidy shows Naftali the rings in a piece of wood and says, "Good things are not rushed."`, q:'How does the middle of the story develop the theme?', pic:T8.shtender, o:['Zeidy uses the rings in the wood to show that strong things take time','Naftali throws the shtender in the garbage','Naftali finishes in one hour']},
{how:`At the end, look at how the main character has changed. If he now lives by the lesson, and even teaches it, the theme is complete.`, q:'How does the end of the story show the theme?', pic:T8.shtender, o:['Naftali works slowly, then teaches Yehuda to slow down','Naftali rushes through a puzzle','Zeidy builds a new shtender']},
],
practice:[
{q:'Which detail from the BEGINNING shows the opposite of the theme?', pic:T8.shtender, o:['Naftali grabbed the saw and started cutting right away','He measured every board twice','It did not move at all'], h:'The beginning is before Zeidy teaches the lesson. Find what Naftali did before he learned anything.'},
{q:'Why does the author include the leg that is shorter than the others?', pic:T8.shtender, o:['to show what happens when you rush','to show that Zeidy made a mistake','to show that the wood was bad'], h:'Who cut the wood without measuring? What happened because of it?'},
{q:'Which detail shows Naftali beginning to change?', pic:T8.shtender, o:['When a corner did not fit, he took it apart and tried again','He wanted to throw it in the garbage','In one hour, the shtender was done'], h:'Look in the part about the next Sunday. What did he do differently?'},
{t:'order', q:'Put the steps of the theme in the order they happen in the story.', pic:T8.shtender, tiles:['Naftali rushes and the shtender tips over','Zeidy shows him the rings in the wood','Naftali takes four Sundays to build it right','Naftali tells Yehuda to slow down'], h:'Start with the first try, then Zeidy\'s lesson, then the second try, then the very end with Yehuda.'},
{q:'Why does the author repeat the words "Good things are not rushed" at the end?', pic:T8.shtender, o:['to show that Naftali now believes the lesson and passes it on','to show that Naftali forgot the lesson','because Zeidy is speaking again'], h:'Who says the words the first time? Who says them at the end?'},
{q:'A new story. What theme grows through this story?', pic:T8.change, o:['be honest even when no one is watching','bakeries sell good rugelach','always buy a drink after Shacharis'], h:'Find what Moshe remembers his rebbe saying. What does it teach?'},
],
check:[
{q:'Where does the test of the theme begin?', pic:T8.change, o:['Mr. Kaplan gives Moshe one dollar too much','Moshe feels lighter','Moshe gets a rugelach'], h:'The seed is the problem at the beginning that tests the character. What happened at the counter?'},
{q:'How does the end complete the theme?', pic:T8.change, o:['Moshe gives back the dollar and feels lighter','Moshe buys a drink with the dollar','Mr. Kaplan never finds out'], h:'Read the last sentences. What did Moshe do, and how did he feel?'},
{q:'Which sentence best shows how the theme develops across the WHOLE story?', pic:T8.shtender, o:['Naftali learns from a failed shtender and Zeidy\'s words that good work takes patience, then teaches it to others.','Naftali builds a shtender.','Zeidy was a carpenter for fifty years.'], h:'A good answer covers the beginning, the middle and the end, not just one detail.'},
],
re:[
{how:`A new way: a theme ladder. Picture three rungs: Beginning, Middle, End. On each rung, put one thing that happens about the lesson. Read the ladder from bottom to top and watch the theme climb.`, q:'Which goes on the MIDDLE rung?', pic:T8.shtender, o:['Zeidy says "Good things are not rushed"','the shtender tips over','Naftali gives the shtender to the shul']},
{how:`A simpler step: a very short story. Find the lesson first, then find where it shows up.`, q:'What is the theme?', pic:'Ari wanted to stop learning to ride his bike after he fell. Abba said, "Try once more." Ari tried again and again. By Friday, he rode all the way around the block.', o:['keep trying even when it is hard','bikes are dangerous','Friday is a good day to ride']},
