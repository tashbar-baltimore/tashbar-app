teach:[

'READ.PHON.L02.04':{name:'Ending Smart',
teach:[
{how:'A tiny ending can change what a word means. Add -s and you have more than one: cat, cats. Add -ing and it is happening now: jumping. Add -ed and it already happened: jumped. Read the word first, then the ending.', q:'Read the words. Tap the word that matches the picture.', pic:'🐱🐱', o:['cats','cat','cast']},

'READ.VOC.L02.01':{name:'Word Sort',

function swMix(w){ const out=[], vow='aeiou';
 for(let i=0;i<w.length-1;i++){ const s=w.slice(0,i)+w[i+1]+w[i]+w.slice(i+2); if(s!==w) out.push(s); }
 for(let i=0;i<w.length;i++) if(vow.includes(w[i])) for(const v of vow) if(v!==w[i]) out.push(w.slice(0,i)+v+w.slice(i+1));
 const bad=new Set([w].concat(swAll,['was','saw','tow','ton','own','won','no','on','of','do','to','so','go','he','ho','hi','a','i','an','in','is','it','at','as','us','up','am','be','by','me','my','we','os','od','fo','yb']));
 const u=[...new Set(out)].filter(s=>!bad.has(s)); const r=[]; while(r.length<2&&u.length) r.push(u.splice(Math.floor(Math.random()*u.length),1)[0]);
 return r; }

const T3={
cow:`At noon, Zev and Ben took a walk out of town. A brown cow stood by the road. "Look at its big round snout!" said Ben. The cow gave a loud moo. Then it lay down on the soft grass.`,
farm:`Zev and Ben went to a big farm. In the barn, a hen sat on its nest. Zev fed the hens corn from a cart. The hens ran for the corn. Then a bird sat on the cart and gave a chirp.`,
cabin:`Zev and Ben went to a little cabin by the lake. On the table was a purple candle and a basket of lemons. "Who left them here?" said Ben. Then a man came out with a kettle. "They are for you," he said with a smile. "It is a gift."`,
zoo:`Zev and Ben went to the city zoo with Dad. In a big cage, a giraffe ate leaves from a tree. A little lamb gave a soft bleat. Ben knelt down to see the mice. "I know that one," said Zev. "It is the giraffe from my book!"`,
mitten:`It was a cold day, and the snow was deep. Zev and Ben made a snowman by the fence. When they went in, Zev had one cold hand. "My mitten is gone!" he said. "Where can it be?" The boys went back out. They looked by the snowman. They looked by the gate. Then Ben saw a red tip in the snow by the fence. He dug it out. "Is this it?" he asked. "Yes!" said Zev with a big grin. "Thank you, Ben!"`,
garden:`Ben and Zev had a garden in the yard. In the spring, they dug rows in the dirt. Zev put in corn seeds. Ben put in pumpkin seeds. Each day, they gave the seeds a drink from the hose. Soon, little green shoots came up. "Look!" said Ben. "They are growing!" By the end of the summer, the corn stood tall. A big pumpkin sat by the fence. "What will we do with it?" asked Zev. Ben gave a big grin. "We will bring it to the shul for Sukkos!"`,
boot:`Zev's boot came untied on the way to shul. He bent down to retie it. At lunch, he spilled his cup of milk. Zev did not get upset. He cleaned it up and refilled his cup at the sink.`,
tower:`The Tall Tower
Zev wanted to build a tall tower with his blocks. He put one block on top of the next, up and up. Then the tower fell down! Zev was upset, but he did not quit. He looked at the tower and had an idea. This time he made the bottom wide, with lots of blocks. Then he built up. The new tower stood tall and did not fall. Zev smiled. "If at first it does not work, try a new way!"`,
cookie:`The Last Cookie
Ben had one cookie left in his lunch bag. It was a big chocolate chip cookie. Zev sat next to him. Zev had no snack. He had left it at home. Ben looked at his cookie, and then at Zev. He snapped the cookie in two and gave Zev half. "Thank you!" said Zev. The two boys ate the cookie and smiled. Half a cookie with a friend was better than a whole cookie alone.`,
coin:`The Lost Coin
Ben found a shiny coin on the steps of the shul. He wanted to keep it. Then he thought, "Someone lost this. It is not mine." Ben asked the men in the shul, "Did anyone lose a coin?" An old man looked in his pocket. "It is mine!" he said. "Thank you!" Ben gave it back. The man smiled and shook his hand. Ben felt good inside.`,
owls:`Owls
An owl is a bird that hunts at night. Its big eyes help it see in the dark. An owl can turn its head far around. Its soft feathers let it fly with no sound. In the day, an owl sleeps in a tree.`,
ants:`Ants
Ants live in big groups. They dig tunnels under the ground. Some ants find food and bring it back. Other ants take care of the eggs. Ants work hard to help the whole group.`,
snow:`Snow is made of little bits of ice. Each bit is called a flake. When it is very cold, snow falls from the clouds. Snow can cover the ground like a white blanket. Boys can sled on it.`,
turtles:`A turtle has a hard shell on its back. When it is scared, it pulls its head into its shell. Some turtles live in ponds. Others live on land. Turtles move slowly, but they can live a long time.`,
beaver2:`Beavers
Part 1: A beaver has big, sharp front teeth. It chews around a tree until the tree falls down. Then it cuts the tree into sticks.
Part 2: A beaver drags the sticks into a stream. It packs them with mud to make a dam. Behind the dam, it builds a home of sticks and mud.`,
bees:`Bees
Part 1: Bees live in a hive. A hive can have many bees in it. One big bee lays all the eggs.
Part 2: Worker bees fly from plant to plant. They drink a sweet juice from the plants. Back at the hive, they turn the juice into honey.`,
frogs:`Frogs
▶ From Egg to Frog
A frog starts as a tiny egg in a pond. The egg hatches into a ${B('tadpole')}. A tadpole has a tail and lives in the water.
▶ Growing Legs
Little by little, the tadpole grows back legs, then front legs. Its tail gets shorter and shorter.
▶ Life on Land
At last, the young frog hops out of the pond. Now it can live on land and in water.
🐸 Caption: This tadpole has grown its back legs.
Word box: tadpole — a baby frog that lives in water.`,
beavers:`Beavers
▶ Big Teeth
A beaver has big front teeth. They never stop growing. A beaver chews on trees to keep its teeth short.
▶ Building a Dam
A beaver cuts down trees with its teeth. It drags the sticks into a stream and packs them with mud. This makes a ${B('dam')}.
▶ A Safe Home
Behind the dam, the beaver builds a home called a ${B('lodge')}. The door is under the water, so other animals cannot get in.
🦫 Caption: A beaver lodge. The door is under the water.
Word box: dam — a wall that holds back water. lodge — a beaver's home of sticks and mud.`,
camels:`Camels
▶ The Hump
A camel has a ${B('hump')} on its back. The hump stores fat. When there is no food, the camel's body uses the fat.
▶ Made for Sand
A camel has wide feet, so it does not sink in the sand. Long lashes keep sand out of its eyes.
▶ Going Without Water
A camel can go many days with no drink. Then it can drink a lot at one time.
🐪 Caption: Wide feet help a camel walk on sand.
Word box: hump — a big bump on a camel's back.`,
seed:`How a Seed Grows
▶ Planting
First, you put a seed in the dirt. Then you give it water.
▶ Roots and Shoots
The seed splits open. A root grows down to drink water from the soil. A green shoot grows up toward the sun.
▶ Why Plants Need Sun
A plant needs sun because its leaves use sunlight to make food. So a plant in the dark gets weak.`,
dam:`How Beavers Build a Dam
▶ Cutting Trees
First, a beaver chews around a tree trunk with its sharp teeth. Then the tree falls down.
▶ Building
Next, the beaver drags the logs and sticks into the stream. It packs mud between them so no water can get through.
▶ Why a Dam?
Beavers build dams because the water behind a dam gets deep. Deep water keeps the beaver safe, because the door to its lodge is under the water.`,
birds:`Why Do Birds Fly South?
▶ Cold Is Coming
In the fall, the days get shorter and colder. Bugs and seeds are hard to find.
▶ The Long Trip
So many birds fly south, where it is warm. They fly in a big group shaped like a V. Flying in a V helps them save their strength.
▶ Coming Back
In the spring, the birds fly back north because there is lots of food again.`

{q:RW, pic:'📖', o:['book','boot','back'], h:'Look at the middle: o and o. The picture word ends with k. Try the long oo sound first; if it is not a word, try the short one, like in look: b-oo-k.'},
{q:RW, pic:'☁️', o:['cloud','clap','club'], h:'Look for o and u together in the middle. They say "ow": cl-ou-d.'},
{q:RW, pic:'❄️', o:['snow','snap','sniff'], h:'Look at the end: o and w. Try "ow" first. That is not a word, so try the name of o: sn-ow.'},
{q:RW, pic:'🧸', o:['toy','top','tub'], h:'Look at the end: o and y together say "oi", like in boy: t-oy.'},
{q:RW, pic:'🐾', o:['paw','pay','pan'], h:'Look at the end: a and w together say "aw". (a and y together say the name of a.)'},
{q:'Read the tiny tale. What did the cow do at the end?', pic:T3.cow, o:['it lay down','it ran away','it ate a book'], h:'Find the word "Then" and read that sentence again.'},
],
check:[
{t:'order', q:BW, pic:'🥄', tiles:['s','p','oo','n'], h:'The middle sound is the team o-o.'},
{t:'order', q:BW, pic:'👄', tiles:['m','ou','th'], h:'The middle sound is the team o-u. The end is the tongue sound, t-h.'},
{q:'Read the sentences. Which picture matches?', pic:'Ben has a toy. It is a brown owl.', o:['🦉','🐄','🐾'], h:'Read the last word slowly: o-w-l.'},
],
re:[
{how:`A new way: sound houses. Every team lives in the house of its sound. moon and spoon live in the long "oo" house. book and foot live in the short "oo" house, like look. cow and cloud live in the "ow" house. snow lives in the house of long o. coin and boy live in the "oi" house. saw and paw live in the "aw" house. Find the team, then find its house.`, q:'Which word lives in the "oi" house?', o:['boy','bow','bay']},
{how:`One team at a time. oi and oy always say the sound in boy, so start there. Find the team first: b, then oy. Say each part, then blend.`, q:RW, pic:'👦', o:['boy','bay']},
{how:`Go back to what you know: two letters, one sound. r-ai-n is rain. b-oa-t is boat. tr-ee is tree. The new teams work the same way. Find the two letters first, then blend.`, q:RW, pic:'⛵', o:['boat','bat','but']},
]},

'READ.PHON.L03.02':{name:'Bossy R',
teach:[
{how:`When the letter r stands right after a vowel, it is bossy: it grabs the vowel and changes its sound. a plus r says "ar", like a car. o plus r says "or", like a fork. e-r, i-r and u-r all say the same sound, "er". Here is how it works. c-a-t is cat. Swap the t for r: c-ar. Now r grabs the a, and it says "ar": car.`, q:RW, pic:'🚗', o:['car','cat','cab']},
{how:`o plus bossy r says "or". f-or-k is fork. c-or-n is corn. h-or-n is horn.`, q:RW, pic:'🌽', o:['corn','coin','can']},
{how:`e-r, i-r and u-r all say "er". h-er-d is herd. b-ir-d is bird. t-ur-n is turn. Three spellings, one sound.`, q:RW, pic:'🐦', o:['bird','bid','bed']},
],
practice:[
{q:RW, pic:'⭐', o:['star','stop','stab'], h:'Look at the end: a and r together say "ar": st-ar.'},
{q:RW, pic:'🍴', o:['fork','frog','fog'], h:'In frog, r comes before the o. In the picture word, o comes first, then r: f-or-k. o plus r says "or".'},
{q:RW, pic:'👕', o:['shirt','shut','shot'], h:'Look for i and r together after sh. They say "er": sh-ir-t.'},
{q:RW, pic:'🌿', o:['fern','fan','fin'], h:'Look for e and r together. e plus bossy r says "er": f-er-n.'},
{q:RW, pic:'🦈', o:['shark','sharp','shack'], h:'Both start with sh-ar. Look at the last letter: the picture word ends with k.'},
{q:'Read the tiny tale. What did Zev feed the hens?', pic:T3.farm, o:['corn','bread','grass'], h:'Find the word "fed" and read that sentence again.'},
],
check:[
{t:'order', q:BW, pic:'📯', tiles:['h','or','n'], h:'The middle sound is o plus bossy r.'},
{t:'order', q:BW, pic:'🛒', tiles:['c','ar','t'], h:'The middle sound is a plus bossy r.'},
{q:'Read the sentences. Which picture matches?', pic:'Zev has a horn. He gave it a toot.', o:['📯','🍴','🌽'], h:'Read the word after "has a": h-or-n.'},
],
re:[
{how:`A new way: think of r as a magnet. When r comes right after a vowel, it pulls on the vowel and the sound bends. a in cat says "a", but a-r in car says "ar". o in hot says "o", but o-r in horn says "or". Find the vowel with r right after it, and read the two letters as one sound.`, q:RW, pic:'🍴', o:['fork','fog']},
{how:`Just ar for now. Read the pairs: cat, car. bat, bar. fat, far. The only change is the last letter. When it is r, the a says "ar".`, q:RW, pic:'🚗', o:['car','cat']},
{how:`Read the word without the r first. Cover the r in star: s-t-a, then put r back. The r grabs the a: st-ar, star. Short vowel first, then let r be the boss.`, q:RW, pic:'⭐', o:['star','stab']},
]},

'READ.PHON.L03.01':{name:'Syllable Splitter',
teach:[
{how:`Big words are just small parts stuck together. You already split words like rabbit and napkin. Today you get the full set of tools: how to split a word with only one consonant in the middle, and how to read endings like -ble and -dle. Every part has one vowel sound. Watch: robot. Find the vowels: o and o. One consonant, b, sits between them. Try the snip BEFORE the b: ro | bot. ro ends with a vowel, so o says its name. Read ro, read bot, blend: robot.`, q:RW, pic:'🤖', o:['robot','rocket','ribbon']},
{how:`If the first try is not a word, flex. cabin: snip before the b: ca | bin, "kay-bin". That is not a word! Move the snip after the b: cab | in. Now a is short: cabin. lemon works the same way: lem | on.`, q:SN, pic:'cabin', o:['cab | in','ca | bin','c | abin']},
{how:`A word that ends in a consonant plus l-e: count back three letters from the end and snip there. table ends in b-l-e, so ta | ble. ta ends with a vowel, so a says its name. The -le part says "ul", and the e is quiet. can | dle is candle. lit | tle is little. pur | ple is purple.`, q:RW, pic:'🕯️', o:['candle','camel','candy']},
],
practice:[
{q:RW, pic:'🍋', o:['lemon','melon','lime'], h:'Read the first part: l-e-m, "lem". (le | mon, "lee-mon", is not a word, so the snip goes after the m: lem | on.)'},
{q:SN, pic:'table', o:['ta | ble','tab | le','t | able'], h:'It ends in b-l-e. Count back three letters from the end and snip there.'},
{q:RW, pic:'🐢', o:['turtle','tumble','turnip'], h:'The first part has bossy r: t-ur. Then look at the end, t-l-e: tur | tle.'},
{q:RW, pic:'🐅', o:['tiger','tiny','timber'], h:'One consonant in the middle, g. Snip before it: ti | ger. ti ends with a vowel, so i says its name.'},
{q:SN, pic:'wagon', o:['wag | on','wa | gon'], h:'Try wa | gon: "way-gon" is not a word. Move the snip after the g and read again.'},
{q:'Read the tiny tale. What was on the table?', pic:T3.cabin, o:['a candle and lemons','a robot','a turtle'], h:'Find the word "table" and read that sentence again.'},
],
check:[
{q:SN, pic:'puzzle', o:['puz | zle','pu | zzle','puzz | le'], h:'It ends in z-l-e. Count back three letters and snip there.'},
{q:RW, pic:'🍼', o:['bottle','bottom','button'], h:'Look at the end: t-l-e. Snip three letters back: bot | tle.'},
{t:'order', q:'Build the word for the picture. Tap the parts in order.', pic:'🐫', tiles:['cam','el'], h:'One consonant in the middle. ca | mel is not a word, so the snip goes after the m.'},
],
re:[
{how:`A new way: open and closed doors. A part that ends with a vowel is an open door: the vowel walks out and says its name, like ro in robot and ti in tiger. A part that ends with a consonant is a closed door: the vowel stays inside and is short, like cab in cabin and lem in lemon.`, q:'Which part is an open door, where the vowel says its name?', o:['ti','tig','tin']},
{how:`A simpler step: here the snip is already made. Read each part, then push them together. ro | bot, robot. ti | ger, tiger. ta | ble, table.`, q:'Read the parts. Tap the picture.', pic:'ti | ger', o:['🐅','🤖','🕯️']},
{how:`The skill underneath: Two-Part Words. Two consonants in the middle? Snip between them: rab | bit, nap | kin, bas | ket. When that feels easy, go back to words with one consonant in the middle.`, q:RW, pic:'🐰', o:['rabbit','ribbon','robot']},
]},

'READ.PHON.L03.03':{name:'Tricky Spellings',
teach:[
{how:`English has a few tricks. Sometimes c says "s" and g says "j". Sometimes a letter is there but stays quiet. Once you know where the tricks hide, they cannot fool you. First trick, soft c. In cat, c comes before a and says "k". In face, c comes before e and says "s". The rule: c before e, i or y says "s". r-i-c-e is rice. c-i-t-y is city.`, q:RW, pic:'🍚', o:['rice','rich','ride']},
{how:`Soft g. In gum, g comes before u and says "g". In gem, g comes before e and says "j". g before e, i or y usually says "j". If "j" does not make a word, try "g": g-i-f-t, "jift" is not a word, so it is gift.`, q:RW, pic:'💎', o:['gem','gum','get']},
{how:`Quiet letters. k before n is quiet: kn-ee, knee. w before r is quiet: wr-i-s-t, wrist. b after m at the end is quiet: th-u-mb, thumb. Find the quiet letter, skip it, and read the rest.`, q:RW, pic:'👍', o:['thumb','thump','tub']},
],
practice:[
{q:RW, pic:'🧊', o:['ice','ink','itch'], h:'Look at c-e at the end. c before e says "s", and the e makes i say its name.'},
{q:RW, pic:'🦒', o:['giraffe','grab','gift'], h:'g before i says "j". Read on: g-i-r-a-ff-e.'},
{q:RW, pic:'🔪', o:['knife','kite','nice'], h:'Look at the start: k-n. The k is quiet, so it starts with "n". Then i-f-e: the e makes i say its name.'},
{q:RW, pic:'🔧', o:['wrench','bench','ranch'], h:'Look at the start: w-r. The w is quiet: r-e-n-ch.'},
{q:RW, pic:'🏙️', o:['city','kitty','cozy'], h:'k always says "k". c before i says "s": c-i-t-y.'},
{q:'Read the tiny tale. What did the giraffe eat?', pic:T3.zoo, o:['leaves','rice','corn'], h:'Find the word "giraffe" and read that sentence again.'},
],
check:[
{t:'order', q:BW, pic:'🙂', tiles:['f','a','c','e'], h:'c before e says "s". The e at the end makes a say its name.'},
{t:'order', q:BW, pic:'🪢', tiles:['kn','o','t'], h:'The k in front of n is quiet, but you still write it.'},
{q:'Read the sentences. What did Dad give Zev?', pic:'Zev hurt his knee. Dad gave him ice.', o:['ice','rice','a gem'], h:'Find "Dad gave him" and read the next word: c before e says "s".'},
],
re:[
{how:`A new way: soft-makers and quiet signs. e, i and y are soft-makers. When one of them stands right after c or g, c and g get soft: c says "s" and g says "j". The quiet letters, k in kn, w in wr and b in mb, wear a "shh" sign: you see them, but you do not say them.`, q:'Read the words. Which one has a soft c?', o:['face','cat','cup']},
{how:`Soft c only. Read the pairs: cap and face, cup and rice. When c comes before a, o or u, it says "k". When c comes before e or i, it says "s".`, q:RW, pic:'🍚', o:['rice','rock']},
{how:`The skill underneath: the hard sounds you know. cat, cup, got, gum: c says "k" and g says "g". Now look at the letter after c or g. If it is e, i or y, that is where c and g can turn soft.`, q:RW, pic:'☕', o:['cup','cap','cut']},
]},

'READ.FLU.L03.01':{name:'Fluent Flyer',
teach:[
{how:`You can already read smoothly. Now you will read like a storyteller. Good readers change their voice: they stop at a period, their voice goes up at a question mark, they sound excited at an exclamation mark, and they use a new voice when someone talks. When you read like that, the story comes alive. Press the speaker on the story and listen to how the voice changes. Follow each word with your eyes.`, p:'rl3_storm', q:'Listen and follow along. What fell in the yard?', o:['a big branch','a tree','the gate']},
{how:`Look at the marks. A period means stop and drop your voice. A question mark means your voice goes up at the end. An exclamation mark means strong and excited. Quotation marks mean someone is talking, so use his voice.`, q:'How should this line sound?', pic:'"Look at the sky!" said Ben.', o:['excited','calm','asking']},
{how:`Good readers read in scoops, a few words at a time, not one word at a time: "Dark clouds rolled in / over the town." A comma is a short rest.`, q:'Where should you take a short rest?', pic:'Rain fell down in sheets, and the trees bent low.', o:['at the comma, after "sheets"','after "Rain"','after "the"']},
],
practice:[
{q:'How should this line sound?', pic:'"Is it safe now?" asked Zev.', o:['asking','excited','calm'], h:'Look at the mark at the end of what he said. A question mark means your voice goes up.'},
{q:'How should this line sound?', pic:'"My mitten is gone!" he said.', o:['upset and strong','calm and sleepy','asking'], h:'An exclamation mark means strong. Think: how do you feel when you lose a mitten?'},
{q:'Read the story in smooth scoops. Where did Ben find the mitten?', pic:T3.mitten, o:['in the snow by the fence','in his coat','in the shed'], h:'Find the word "saw" and read that sentence again.'},
{q:'Read the story again, a little faster. Whose mitten was it?', pic:T3.mitten, o:['Zev','Ben','Dad'], h:'Find "My mitten is gone!" Who said it?'},
{q:'Read it one more time, like a storyteller. How did Zev feel at the end?', pic:T3.mitten, o:['glad','sad','angry'], h:'Read the last two lines. What did Zev say, and how did he grin?'},
{q:'Which way of reading sounds like a storyteller?', o:['in scoops, with the voice going up at a question','one word at a time, all the same','as fast as you can, with no stops'], h:'A storyteller reads in scoops and lets the marks change his voice.'},
],
check:[
{q:'How should this line sound?', pic:'"What will we do with it?" asked Zev.', o:['asking','excited','angry'], h:'Look at the mark at the end of what he said.'},
{q:'Read the story by yourself. What did Zev plant?', pic:T3.garden, o:['corn seeds','pumpkin seeds','roses'], h:'Find "Zev put in" and read that sentence.'},
{q:'Read the story. Where will they bring the pumpkin?', pic:T3.garden, o:['to the shul for Sukkos','to the lake','to the farm'], h:'Read the last sentence.'},
],
re:[
{how:`A new way: echo reading. Press the speaker on the story and listen to one sentence. Then read that same sentence in your head and make your voice do the same thing. One sentence at a time, all the way through.`, p:'rl3_storm', q:'Listen again. What did Dad do?', o:['smiled and gave them a hug','ran outside','shut the gate']},
{how:`A simpler step: a short story, read three times. The marks are your road signs. Period: stop. Question mark: voice up. Exclamation mark: strong.`, q:'Read it three times. What did Ben ask?', pic:'Ben got a bike. "Can I ride it?" he asked. "Yes!" said Dad. Ben rode down the path.', o:['if he could ride it','for a snack','where Dad was']},
{how:`The skill underneath: if a word slowed you down, sound it out with the tools you know: vowel teams like oo and ow, bossy r like ar and or, soft c like in ice. Then read the whole sentence again, smoothly.`, q:'Which tool helps you read this word?', pic:'storm', o:['bossy r: o and r say "or"','soft c','a quiet letter']},
]},

'READ.VOC.L03.01':{name:'Prefix Start',
teach:[
{how:`A tiny part at the front of a word can change its whole meaning. These front parts are called prefixes. Today you learn two of them, un and re, and you will be able to figure out lots of new words by yourself. un means "not" or "the opposite". Cover un in unlock and read lock. Unlock is the opposite of lock: you open it. Unhappy means not happy.`, q:'What does this word mean?', pic:'unhappy', o:['not happy','happy again','very happy']},
{how:`re means "again". Cover re in refill and read fill. Refill means fill again. Reread means read again. Retell means tell again.`, q:'What does this word mean?', pic:'refill', o:['fill again','not fill','fill a lot']},
{how:`Careful: not every word that starts with un or re has a prefix. Cover un in unpack: pack is a word, so un is a prefix. Cover un in under: "der" is not a word, so under has no prefix. The rule: cover it. If a real word is left, it is a prefix.`, q:'Which word has a prefix?', o:['unpack','under','uncle']},
],
practice:[
{q:'Read the sentence. Tap the word that fits.', pic:'Ben got home from camp. He had to ___ his bag.', o:['unpack','repack','pack'], h:'He is home, so he takes his things out: the opposite of pack. Which prefix means the opposite?'},
{q:'What does this word mean?', pic:'retell', o:['tell again','not tell','tell a lot'], h:'Cover re and read the word that is left: tell. re means again.'},
{q:'Read the sentence. Tap the word that fits.', pic:'Zev drank his milk. Then he ___ his cup with more milk.', o:['refilled','unfilled','spilled'], h:'He fills it a second time. Which prefix means again?'},
{q:'Which word has a prefix?', o:['unlock','uncle','under'], h:'Cover un in each word. Is the part that is left a real word?'},
{q:'Read the sentence. Tap the word that fits.', pic:'The gate was locked. Dad had to ___ it.', o:['unlock','relock','lock'], h:'The gate is locked already. Dad needs the opposite of lock.'},
{q:'Read the tiny tale. What did Zev do with his cup?', pic:T3.boot, o:['he filled it again','he broke it','he gave it away'], h:'Find the word "refilled". Cover re: filled. re means again.'},
],
check:[
{q:'Which word means "not kind"?', o:['unkind','rekind','kindest'], h:'Which prefix means not?'},
{q:'Which word means "fill again"?', o:['refill','unfill','filling'], h:'Which prefix means again?'},
{q:'Read the sentence. What does retie mean?', pic:'Ben\'s lace came untied, so he had to retie it.', o:['tie again','not tie','cut it'], h:'Cover re and read the word left. re means again.'},
],
re:[
{how:`A new way: two machines. Put a word into the un machine and it comes out meaning the opposite: lock becomes unlock, pack becomes unpack. Put a word into the re machine and the action happens again: read becomes reread, fill becomes refill.`, q:'This word came out of the re machine. What does it mean?', pic:'reread', o:['read again','not read','read fast']},
{how:`A simpler step: just un for now. A zip that is shut, then open: zip, unzip. A happy face, then a sad face: happy, unhappy. un means not, or the opposite.`, q:'Which word means the opposite of zip?', o:['unzip','rezip','zipper']},
{how:`The skill underneath: Ending Smart. You know parts that go at the END of a word: jump, jumped, jumping. A prefix is a part that goes at the FRONT. Build it the same way: the prefix, then the base word.`, t:'order', q:'Build the word that means "the opposite of pack". Tap the parts in order.', tiles:['un','pack']},
]},

'READ.LIT.L03.01':{name:'Retell It',
teach:[
{how:`When you finish a good story, can you tell it to a friend in a few sentences? Good readers can. They tell the beginning, the middle and the end, and they tell the lesson: what the story teaches us. Then every story gives you something to keep. Read the story. The beginning is how it starts: Zev built a tall tower, and it fell.`, q:'Read the story. What happened at the beginning?', pic:T3.tower, o:['Zev built a tower, and it fell','The new tower stood tall','Zev smiled']},
{how:`The middle is what the character does about the problem: Zev did not quit, and he made the bottom wide. The end is how it turns out: the new tower stood tall. Retell it with three words to help you: First... Then... At the end...`, t:'order', q:'Put the story in order.', pic:T3.tower, tiles:['Zev built a tall tower, and it fell.','He made the bottom wide.','The new tower stood tall.']},
{how:`The lesson is what the character learned. Look at what he says at the end, or at how things turned out. Zev says, "If at first it does not work, try a new way!" That is the lesson.`, q:'What is the lesson of the story?', pic:T3.tower, o:['If something does not work, try a new way','Blocks are fun','Towers always fall']},
],
practice:[
{q:'Read the story. What happened at the beginning?', pic:T3.cookie, o:['Ben had one cookie, and Zev had no snack','Ben gave Zev half','The boys smiled'], h:'The beginning is how the story starts. Read the first four sentences again.'},
{q:'Read the story. What happened in the middle?', pic:T3.cookie, o:['Ben broke the cookie and gave Zev half','Zev left his snack at home','The boys smiled'], h:'The middle is what the character does about the problem. Find the word "snapped".'},
{q:'Read the story. What happened at the end?', pic:T3.cookie, o:['The boys ate the cookie and smiled','Ben had one cookie left','Zev had no snack'], h:'The end is how it turns out. Read the last two sentences.'},
{t:'order', q:'Put the story in order.', pic:T3.cookie, tiles:['Zev had no snack.','Ben gave Zev half his cookie.','The boys ate and smiled.'], h:'What had to happen first, before anything else could happen?'},
{q:'Read the story. What is the lesson?', pic:T3.cookie, o:['Sharing with a friend is better than keeping it all','Cookies are good','Always bring a snack'], h:'Think about what Ben did and how it turned out. Read the last sentence again.'},
{q:'Which retell is best?', pic:T3.cookie, o:['First Zev had no snack. Then Ben gave him half his cookie. At the end they ate and smiled. Sharing is better.','Ben and Zev smiled.','They ate. Ben had a cookie. Zev had no snack.'], h:'A good retell has the beginning, the middle and the end, in order, and the lesson.'},
],
check:[
{t:'order', q:'Put the story in order.', pic:T3.coin, tiles:['Ben found a coin.','Ben asked who lost it.','Ben gave it back to the old man.'], h:'What came first? What came last?'},
{q:'Read the story. What is the lesson?', pic:T3.coin, o:['When you find something someone lost, give it back','Coins are shiny','Keep what you find'], h:'Think about what Ben did and how he felt at the end.'},
{q:'Which retell is best?', pic:T3.coin, o:['First Ben found a coin. Then he asked who lost it. At the end he gave it back and felt good. Give back what is lost.','Ben gave a coin back.','An old man went to shul. Ben found a coin.'], h:'A good retell has the beginning, the middle and the end, in order, and the lesson.'},
],
re:[
{how:`A new way: a story train. The first car is the beginning, the second car is the middle, the third car is the end. The caboose at the back is the lesson.`, q:'Read the story. Which car of the train is this: "The new tower stood tall"?', pic:T3.tower, o:['the end','the beginning','the middle']},
{how:`A simpler step: start with just two parts, how the story starts and how it ends. Then add the middle.`, q:'Read the story. How does it end?', pic:T3.cookie, o:['The boys ate the cookie and smiled','Zev had no snack','Ben had one cookie']},
{how:`The skill underneath: Story Parts. First find WHO is in the story, WHERE it happens and WHAT happens. Then put the WHAT in order.`, q:'Read the story. Who is in the story?', pic:T3.tower, o:['Zev','Ben','Dad']},
]},

'READ.COMP.L03.01':{name:'Main Topic',
teach:[
{how:`Every page you read is about something. That something is the main topic. If a friend asks, "What was it about?", you can answer in a few words, like "owls". Today you learn three clues that find the main topic fast. Clue 1: the word that keeps coming back. On this page, "owl" comes back again and again.`, q:'Read the page. Which word keeps coming back?', pic:T3.owls, o:['owl','night','tree']},
{how:`Clue 2: the title and the first sentence often tell you the topic right away.`, q:'Read the title and the first sentence. What is the page about?', pic:T3.owls, o:['owls','eyes','trees']},
{how:`Clue 3: topic or detail? "An owl's eyes" is in only one sentence, so it is a detail. "Birds" is too big: the page is not about all birds. "Owls" fits every sentence, so it is the main topic.`, q:'Read the page. What is the main topic?', pic:T3.owls, o:['owls','an owl\'s eyes','birds']},
],
practice:[
{q:'Read the page. What is the main topic?', pic:T3.ants, o:['ants','tunnels','food'], h:'Tunnels and food are each in only one sentence, so they are details. Find the word that comes back again and again.'},
{q:'Read the page. Which sentence tells a detail about ants?', pic:T3.ants, o:['They dig tunnels under the ground.','Bees live in a hive.','Snow is made of ice.'], h:'A detail tells one small fact about the topic. Which sentence is on the page and about ants?'},
{q:'Read the page. What is the main topic?', pic:T3.snow, o:['snow','clouds','sleds'], h:'Clouds and sleds are each in only one sentence. Which word fits every sentence?'},
{q:'Read the page. Which title fits best?', pic:T3.snow, o:['All About Snow','Sleds','Cold Clouds'], h:'The best title fits every sentence, not just one.'},
{q:'Read the page. What is the main topic?', pic:T3.turtles, o:['turtles','ponds','animals'], h:'Ponds is in only one sentence. Animals is too big: the page is about one kind of animal.'},

'READ.COMP.L03.02':{name:'Text Tools',
teach:[
{how:`Books that teach true facts come with tools, like a toolbox for your eyes. A heading tells you what a part is about. A caption tells you about a picture. A bold word is extra important, and the book tells you what it means. Today you learn to use these tools to find what you need, fast. First, headings. A heading is like a sign on a door: it tells you what is in that part. On this page the headings have a ▶ in front.`, q:'Read the page. Under which heading can you read about frog legs?', pic:T3.frogs, o:['Growing Legs','From Egg to Frog','Life on Land']},
{how:`Captions. A caption sits next to a picture and tells you what the picture shows.`, q:'Read the page. What does the caption tell you?', pic:T3.frogs, o:['The tadpole has grown its back legs','Frogs live on land','Eggs are tiny']},
{how:`Bold words. A bold word looks darker and thicker. It is important. Look for its meaning in the sentence, or in the word box.`, q:'Read the page. What is a tadpole?', pic:T3.frogs, o:['a baby frog that lives in water','a kind of fish','a frog\'s egg']},
],
practice:[
{q:'Read the page. Under which heading can you read about the beaver\'s home?', pic:T3.beavers, o:['A Safe Home','Big Teeth','Building a Dam'], h:'Read each heading. Which one sounds like it is about a home?'},
{q:'Read the page. What does the caption tell you?', pic:T3.beavers, o:['The door of the lodge is under the water','Beavers have big teeth','A dam holds back water'], h:'Find the words next to the picture, after "Caption".'},
{q:'Read the page. What is a dam?', pic:T3.beavers, o:['a wall that holds back water','a beaver\'s home','a big tooth'], h:'dam is in bold. Look in the word box.'},
{q:'Read the page. Which words are in bold?', pic:T3.beavers, o:['dam and lodge','beaver and teeth','stream and mud'], h:'Bold words look darker and thicker than the other words.'},
{q:'You want to know why a beaver\'s teeth do not get too long. Under which heading would you look?', pic:T3.beavers, o:['Big Teeth','Building a Dam','A Safe Home'], h:'Read each heading. Which part is about teeth?'},
{q:'Which tool helps you most to find out what a lodge is?', pic:T3.beavers, o:['the word box','the title','the heading "Big Teeth"'], h:'lodge is a bold word. Where does the page tell you what bold words mean?'},
],
check:[
{q:'Read the page. Under which heading would you read why a camel does not sink?', pic:T3.camels, o:['Made for Sand','The Hump','Going Without Water'], h:'Read each heading. Where would sinking in sand fit?'},
{q:'Read the page. Which sentence is the caption?', pic:T3.camels, o:['Wide feet help a camel walk on sand.','A camel has a hump on its back.','A camel can go many days with no drink.'], h:'A caption sits next to the picture.'},
{q:'Read the page. What is a hump?', pic:T3.camels, o:['a big bump on a camel\'s back','a camel\'s foot','a drink of water'], h:'hump is in bold. Look in the word box.'},
],
re:[
{how:`A new way: the page is a house. The title is the roof. Headings are signs on the doors: they tell you what is in each room. A caption is a label on a picture. Bold words are gold: they are important, and the word box tells you what they mean.`, q:'Which tool is like a sign on a door, telling you what is in that part?', o:['a heading','a caption','a bold word']},
{how:`A simpler step: one tool at a time. This page has just two parts. Read the headings first.`, q:'Read the page. Under which heading can you read about a dog\'s bed?', pic:'Dogs\n▶ What Dogs Eat\nA dog eats meat and dog food. It drinks lots of water.\n▶ How Dogs Sleep\nA dog sleeps a lot. It likes to curl up in a soft bed.', o:['How Dogs Sleep','What Dogs Eat']},

]},

'READ.COMP.L03.03':{name:'Read to Learn',
teach:[
{how:`Some questions are easy to find: who, what, where. HOW and WHY questions make you think. A WHY question asks for a reason: the answer often comes after "because" or "so". A HOW question asks for the steps or the way something happens: look for first, next, then and last. Learn this and you can learn anything from a book. Here is a HOW question. The step words "First" and "Then" show you the answer.`, q:'Read the page. How does a seed start to grow?', pic:T3.seed, o:['you put it in the dirt and give it water','you put it in the dark','you pick its leaves']},
{how:`Here is a WHY question. Find "because" and read what comes after it.`, q:'Read the page. Why does a plant need sun?', pic:T3.seed, o:['its leaves use sunlight to make food','the sun makes it wet','the sun scares bugs']},
{how:`Use the tools. A heading can take you straight to the right part. Then find "because" or the step words.`, q:'You have a WHY question about the sun. Which heading should you read?', pic:T3.seed, o:['Why Plants Need Sun','Planting','Roots and Shoots']},
],
practice:[
{q:'Read the page. How does a beaver cut down a tree?', pic:T3.dam, o:['it chews around the trunk with its teeth','it pushes it','it digs under it'], h:'Find the heading "Cutting Trees". Read the sentence with "First".'},
{q:'Read the page. Why does a beaver pack mud between the sticks?', pic:T3.dam, o:['so no water can get through','to eat the mud','to make it soft'], h:'Find the word "so" in the "Building" part. Read what comes after it.'},
{q:'Read the page. Why do beavers build dams?', pic:T3.dam, o:['the water behind the dam gets deep','they like sticks','the sun is hot'], h:'Find "because" under "Why a Dam?".'},
{t:'order', q:'Read the page. Put the steps in order.', pic:T3.dam, tiles:['The beaver chews the tree.','It drags the logs into the stream.','It packs mud between them.'], h:'Look for the step words: First, Then, Next.'},
{q:'Read the page. Which sentence tells why deep water keeps a beaver safe?', pic:T3.dam, o:['Deep water keeps the beaver safe, because the door to its lodge is under the water.','Next, the beaver drags the logs and sticks into the stream.','First, a beaver chews around a tree trunk with its sharp teeth.'], h:'A WHY answer often comes after "because". Find the sentence with "safe" and "because".'},
{q:'Which one is a WHY question?', o:['Why do beavers build dams?','Where do beavers live?','What is a lodge?'], h:'A WHY question asks for a reason.'},
],
check:[
{q:'Read the page. Why do many birds fly south?', pic:T3.birds, o:['it is warm there, and food is hard to find up north','they like to fly in a V','it is spring'], h:'Read the first two parts. Look for "So".'},
{q:'Read the page. How do the birds fly on the long trip?', pic:T3.birds, o:['in a big group shaped like a V','one by one, far apart','very low, over the water'], h:'Find the heading "The Long Trip".'},
{q:'Read the page. Why do the birds come back in the spring?', pic:T3.birds, o:['there is lots of food again','it is fall','they are tired'], h:'Find "because" under "Coming Back".'},
],
re:[
{how:`A new way: two keys. The WHY key opens doors marked "because" and "so". The HOW key opens doors marked "first", "next", "then" and "by". Pick the key for the question, then look for its words on the page.`, q:'Which word helps you answer a WHY question?', o:['because','first','where']},

{how:`The skill underneath: Ask and Answer and Text Tools. Find the heading first. Then find the exact sentence that answers. Then answer.`, q:'Read the page. Which sentence tells why a plant needs sun?', pic:T3.seed, o:['A plant needs sun because its leaves use sunlight to make food.','First, you put a seed in the dirt.','A green shoot grows up toward the sun.']},
]}
};

PASS.rl4_menorah={title:"Zeidy's Menorah", text:`Every winter, Zeidy takes his old silver menorah down from the closet. It belonged to his own grandfather, long ago, in a town across the ocean.
Before Chanukah, Yaakov helps him polish it. They rub and rub until each branch shines like a mirror.
On the first night, the family gathers by the window. Zeidy says the brachos slowly and carefully. Then he lets Yaakov light the shamash. The little flames flicker and dance.
"Do you know why we put it by the window?" asks Zeidy. Yaakov nods. "So everyone who walks by can see the miracle." Zeidy smiles. "Exactly. A small light can reach very far."`};
const T4={
shabbos:`Getting Ready for Shabbos
On Friday afternoon, the whole house is busy. Yehuda sets the table carefully: a white cloth, the silver becher, and the challah cover he decorated in second grade. Abba polishes the candlesticks. The smell of chicken soup drifts out of the kitchen. At last, everything is ready. Yehuda puts on his Shabbos shirt and walks to shul with Abba. The street is quiet and peaceful. "I love this moment," says Abba. "It feels like the whole week was getting ready for it."`,
sukkah:`Building the Sukkah
On the day after Yom Kippur, Abba and the boys start building the sukkah. Menachem carries the wooden boards from the garage. Abba screws them together with a drill. The hardest part is the roof. It must be made of things that grew from the ground, like branches or bamboo. Menachem climbs the ladder slowly, holding each mat with both hands. "Not too thick," Abba reminds him. "At night we should still see a few stars." When they finish, Menachem lies on the floor and looks up. Between the bamboo, he can see a tiny patch of blue sky.`,
test:`The Big Test
On Thursday, Avraham had a big Chumash test. He was so worried that he could not sit still. "You have ants in your pants," Abba laughed. That night Avraham studied until he knew every word by heart. In the morning, the test was a breeze. When the rebbe handed it back with a smile, Avraham was on cloud nine.`,
borrow:`The Borrowed Chumash
Shimon borrowed a Chumash from his friend Akiva. He promised to give it back on Sunday. On Sunday, Shimon wanted to play ball instead. "I can bring it tomorrow," he thought. But then he pictured Akiva at night, looking for his Chumash to review for a test. Shimon put down the ball, took the Chumash, and walked to Akiva's house. Akiva was so relieved. "You saved me!" he said. Walking home, Shimon felt proud. Keeping his word felt better than any game.`,
model:`The Slow Builder
Before Sukkos, Reuven and Gavriel each built a model sukkah for the class contest. Gavriel worked fast. He glued the walls in five minutes and ran outside to play. Reuven worked slowly. He measured each stick twice and let the glue dry. The next morning, Gavriel's sukkah had fallen over. Reuven's stood straight and strong. "How did you do it?" asked Gavriel. Reuven smiled. "I took my time."`,
umbrella:`It began to pour on the way home from yeshiva. Ari had an umbrella. Nosson did not. Ari could have run home dry. Instead, he walked slowly so Nosson could stand under the umbrella too. Both boys got a little wet, but they laughed the whole way.`,
bus:`Thank You, Mr. Katz
Every morning, Mr. Katz the bus driver waited for Eli, even when Eli was late. One day, Eli thought, "He always helps me, but I never say anything." That night, Eli made a card. It said, "Thank you for always waiting for me." The next morning, he gave it to Mr. Katz. The bus driver read it twice, and his eyes shone. "In thirty years of driving," he said, "this is the first card I ever got." Eli sat down with a warm feeling. A few kind words had made the whole day bright for both of them.`,
newboy:`The New Boy
On the first day of school, a new boy named Tzvi stood alone by the fence. He held his lunch bag tightly and looked at the ground. Most boys ran past him to the ball game. Naftali stopped. "Do you want to play?" he asked. Tzvi shook his head. "I don't know anyone." Naftali sat down next to him. "Then you know me now," he said, and he shared his pretzels. The next day, Tzvi joined the game. He kicked the ball so hard that everyone cheered.`,
window:`The Broken Window
Pinchas was playing ball in the yard when his throw went wild. Crash! The ball went through Mr. Levi's kitchen window. The other boys ran away. Pinchas's heart was pounding, but he walked to Mr. Levi's door and knocked. "I am sorry," he said. "I broke your window. I will pay for it from my allowance." Mr. Levi looked at him for a long moment. Then he smiled. "Not many boys would come back," he said. "You can help me fix it on Sunday."`,
zeidy:`Every Friday, Gedalya goes to Zeidy's house after school. He takes out the garbage, sweeps the porch and carries in the groceries. Zeidy never asks him. Gedalya just does it. "Why do you work so hard?" asks his friend. Gedalya shrugs. "Zeidy did so much for us. Now it is my turn."`,
seat:`The Last Seat
The bus for the class trip was full. Only one seat was left, by the window. Dovid and Yisrael reached it at the same time. Dovid had wanted a window seat all week. He looked at Yisrael, who was holding his stomach. "You take it," said Dovid. "You feel sick on long rides, right?" Yisrael nodded and sat down. "Thanks, Dovid. You always notice things." Dovid squeezed into the back next to the cooler. He did not mind.`,
ch1:`Chapter 1: A Box on the Table
Two days before Sukkos, Abba came home with a small white box. Inside, wrapped in soft flax, was a yellow esrog. "It is the nicest one I ever had," said Abba. Shmuel was nine. He could not stop looking at it. Abba put the box on the high shelf in the dining room. "No one touches it until Yom Tov," he said.`,
ch2:`Chapter 2: The Empty Shelf
The next morning, Shmuel came down for breakfast. The box was on the shelf, but the lid was open. The esrog was gone! Shmuel felt his face get hot. Who could have taken it? He looked under the table and behind the chairs. Then he saw a trail of flax on the floor. It led to the back porch.`,
ch3:`Chapter 3: The Helper
On the porch sat Shmuel's little brother, Dovid, who was four. He held the esrog in both hands. "I am making it a bed," Dovid said. He had put it in a shoebox with a towel. Shmuel did not yell. He sat down next to Dovid. "That is a kind bed," he said softly. "But an esrog is very easy to hurt. Let's give it back to Abba together." At the Sukkos table, Abba thanked both boys: Dovid for caring, and Shmuel for being gentle.`
};

'READ.FLU.L04.01':{name:'Smooth Passage',
teach:[
{how:`A smooth reader is like a good driver: he does not stop at every word, and he does not crash through the stop signs. Today you learn three habits that make a longer passage sound smooth: read every word right, read in scoops, and fix a word that does not make sense. Then a whole page of a real book will feel easy. Press the speaker and listen to a smooth reader. Follow each word with your eyes.`, p:'rl4_menorah', q:'Listen and follow along. Who helps Zeidy polish the menorah?', o:['Yaakov','Abba','Zeidy\'s grandfather']},
{how:`Habit 1: read every word right. A long word is not hard if you break it into parts you know. carefully: care, then -ful, then -ly. Read each part, then blend: care-ful-ly, carefully.`, q:PW, pic:'carefully', o:['care | ful | ly','car | ef | ully','ca | reful | ly']},
{how:`Habit 2: listen to yourself. If a sentence does not make sense, a word went wrong. Stop, go back, and read that word again, letter by letter. Habit 3: read in scoops, stopping at commas and periods.`, q:'Yaakov read this. What should he do?', pic:'"They rub and rub until each branch shines like a mister."', o:['go back and fix the word that does not make sense','keep going and skip it','start the whole story over']},
],

'READ.VOC.L04.02':{name:'Dictionary Detective',
teach:[
{how:`Sometimes you meet a word, and the sentence gives no clue. Then a detective goes to his best tool: a dictionary, or the glossary at the back of a book. Today you learn to find any word fast. Words in a dictionary are in ABC order. If two words start with the same letter, look at the second letter. sefer, shofar, siddur all start with s. Next letters: e, h, i. So sefer comes first.`, q:BIG, o:['sefer','shofar','siddur']},
{how:`At the top of each dictionary page are two guide words: the first word and the last word on that page. Every word on the page comes between them in ABC order. Guide words lamp and lion: lemon fits, because la- comes before le-, and le- comes before li-.`, q:'Guide words: lamp — lion. Which word would be on this page?', pic:'lamp — lion', o:['lemon','lunch','kite']},
{how:`Many words have more than one meaning. The dictionary numbers them. Read every meaning, then pick the one that fits YOUR sentence. A glossary is a small dictionary at the back of a book, with only the hard words from that book.`, q:'Which meaning fits the sentence?', pic:'bat\n1. a wooden stick for hitting a ball\n2. a small animal that flies at night\n\nSentence: The bat flew out of the dark barn.', o:['a small animal that flies at night','a wooden stick for hitting a ball']},
],
practice:[
{q:BIG, o:['candle','chair','challah'], h:'All three start with c. Look at the second letter: a comes before h. Then compare chair and challah letter by letter.'},
{q:'Guide words: pickle — plum. Which word would be on this page?', pic:'pickle — plum', o:['pillow','pond','peach'], h:'Compare letter by letter. pi-c comes before pi-l, and pi comes before pl. The word must come after pickle and before plum.'},
{q:'Which meaning fits the sentence?', pic:'ring\n1. a band worn on a finger\n2. the sound a bell makes\n\nSentence: We heard the ring of the school bell.', o:['the sound a bell makes','a band worn on a finger'], h:'Read the sentence again. Did they see it or hear it?'},
{q:'Use the glossary. Where was Shmuel standing?', pic:'Glossary\nbimah — the raised table in shul where the Torah is read\nmenorah — a lamp with branches for Chanukah lights\nsukkah — a hut with a roof of branches, used on Sukkos\n\nSentence: Shmuel stood near the bimah.', o:['near the raised table where the Torah is read','near a lamp with branches','inside a hut'], h:'Find bimah in the glossary. It starts with b, so it is first. Read its meaning.'},
{t:'order', q:'Put the words in ABC order. Tap them in order.', pic:'shul   sukkah   siddur', tiles:['shul','siddur','sukkah'], h:'All start with s. Look at the second letter: h, then i, then u.'},
{q:'Read the sentence and the dictionary entry. What was the key made of?', pic:"Yosef found an old brass key in Zeidy's desk.\n\nbrass\n1. a yellow metal\n2. the horns and trumpets in a band", o:['a yellow metal','horns','trumpets'], h:'Read both meanings. Which one can a key be made of?'},
],
check:[
{q:BIG, o:['lamp','light','lulav'], h:'All start with l. Look at the second letter.'},
{q:'Guide words: tea — tiger. Which word would be on this page?', pic:'tea — tiger', o:['thumb','toast','table'], h:'It must come after tea and before tiger. Look at the second letter.'},
{q:'Which meaning fits the sentence?', pic:'light\n1. not heavy\n2. what lets us see, like the sun or a lamp\n\nSentence: The box of seforim was so light that Dovi carried it alone.', o:['not heavy','what lets us see'], h:'Dovi carried it alone. Was it easy to lift? Read the sentence again.'},
],
re:[
{how:`A new way: the dictionary is a long street, and every word has a house in ABC order. The guide words are the street signs at each end of the block. A word lives on the block only if it comes after the first sign and before the last sign.`, q:'The signs say cake — cup. Which word lives on this block?', pic:'cake — cup', o:['clock','dog','bake']},
{how:`A simpler step: first letters only. Say the ABC song in your head and find which first letter comes earliest.`, q:BIG, o:['apple','grape','plum']},
{how:`The skill underneath: Clue Hunter. Before you open a dictionary, look for clues in the sentence. Often the sentence tells you enough. Use the dictionary only when the clues are not enough.`, q:'Use the clues. What does damp mean?', pic:'The towel was still damp, so Avi hung it in the sun to dry.', o:['a little wet','very hot','torn']},
]},

'READ.VOC.L04.03':{name:'Literal or Not',
teach:[
{how:`Some groups of words do not mean what they say. If your friend says, "This homework is a piece of cake," there is no cake! He means it is very easy. A phrase like that is called an expression. When words mean exactly what they say, they are literal. Knowing the difference keeps you from getting fooled, and it makes stories much more fun.`, q:'What does the expression mean?', pic:'"This homework is a piece of cake," said Shmuel.', o:['very easy','a dessert','very hard']},
{how:`The test: can it really happen, just as the words say? Abba cut the cake into eight pieces. Yes, that can really happen, so it is literal.`, q:'Is this literal or an expression?', pic:'Abba cut the cake into eight pieces.', o:['literal: it really happened','an expression']},
{how:`To find what an expression means, use the clues around it, just like with a hard word. Dovi was nervous before his siyum. He had butterflies in his stomach. The clue "nervous" tells you: he felt jumpy inside.`, q:'What does the expression mean?', pic:'Dovi was so nervous before his siyum that he had butterflies in his stomach.', o:['he felt nervous and jumpy inside','he ate butterflies','he was very hungry']},
],
practice:[
{q:'What does "lending a hand" mean here?', pic:'Yehuda helped his friend carry the heavy box. "Thanks for lending a hand!" said his friend.', o:['helping','giving away his hand','clapping'], h:'Look at what Yehuda did right before. What is his friend thanking him for?'},
{q:'Is this literal or an expression?', pic:'Abba told Moshe to keep an eye on his little brother.', o:['an expression','literal: it really happened'], h:'Can you really put your eye on someone? Abba means: watch him carefully.'},
{q:'What does "break the ice" mean here?', pic:'The rebbe said, "Let\'s break the ice," and told a funny story to the new boys.', o:['help everyone feel relaxed','smash a block of ice','make the room cold'], h:'There is no ice in the room. What did the funny story do for the new boys?'},
{q:'Is this literal or an expression?', pic:'Zeidy planted beans in the garden.', o:['literal: it really happened','an expression'], h:'Can a person really plant beans? Then the words mean just what they say.'},
{q:'What does "in the blink of an eye" mean here?', pic:'When the bell rang for recess, the boys were out the door in the blink of an eye.', o:['very fast','very slowly','with their eyes shut'], h:'How long does a blink take? Think about how fast the boys went.'},
{q:'Read the story. How did Avraham feel at the end?', pic:T4.test, o:['very happy','sleepy','worried'], h:'Find "on cloud nine." Look at what happened right before it: the rebbe smiled.'},
],
check:[
{q:'Read the story. What does "the test was a breeze" mean?', pic:T4.test, o:['the test was easy','the test was windy','the test was outside'], h:'He studied until he knew every word. So how did the test go?'},
{q:'Which sentence uses an expression?', o:['Avraham had ants in his pants.','Avraham studied at night.','The rebbe handed back the test.'], h:'Which one does not mean exactly what the words say?'},
{q:'What does "in hot water" mean here?', pic:'Shmuel was in hot water after he forgot his homework again.', o:['in trouble','in a bath','very warm'], h:'What happens when you forget homework again? There is no real water here.'},
],
re:[
{how:`A new way: the picture test. Make a picture in your head of exactly what the words say. If the picture is silly, like animals falling from the sky, it is an expression. If the picture is normal, it is literal.`, q:'Picture it: "It is raining cats and dogs." What does it mean?', o:['it is raining very hard','animals are falling from the sky']},
{how:`A simpler step: one sentence. Could this really happen, just as the words say?`, q:'Is this literal or an expression?', pic:'Dovi drank a cup of milk.', o:['literal','an expression']},
{how:`The skill underneath: Clue Hunter. An expression is like a hard word. Look at the words around it for clues.`, q:'Use the clues. What does "I am beat" mean?', pic:'After running the whole race, Moshe was so tired that he said, "I am beat."', o:['I am very tired','I lost a game','I was hit']},
]},

'READ.LIT.L04.01':{name:'Moral of the Story',
teach:[
{how:`Many stories carry a gift inside: a lesson you can take into your own life. That lesson is called the moral, or the central message. It is not one small detail. It is a big idea that fits anyone. Read The Borrowed Chumash. Shimon wanted to play, but he kept his word, and he felt proud. The moral: keep your promises, even when it is hard.`, q:'Read the story. What is the moral?', pic:T4.borrow, o:['Keep your promises, even when it is hard','Playing ball is fun','Always borrow a Chumash']},
{how:`Clue 1: look at what the main character chooses when it is hard. Clue 2: look at how he feels at the end, or what he learns. Shimon chose to bring the Chumash back, and at the end he felt proud.`, q:'Read the story. How did Shimon feel at the end?', pic:T4.borrow, o:['proud','sad','angry']},
{how:`A moral is for everyone. A detail belongs only to this story. "Shimon walked to Akiva's house" is a detail. "Keeping your word matters" is a moral: it fits your life too.`, q:'Which one is a moral, not just a detail?', o:['Keeping your word matters','Shimon walked to Akiva\'s house','Akiva had a test']},
],
practice:[
{q:'Read the story. What did Reuven do differently from Gavriel?', pic:T4.model, o:['he worked slowly and carefully','he worked very fast','he ran out to play'], h:'Find "Reuven worked slowly" and read the next sentence.'},
{q:'Read the story. What happened the next morning?', pic:T4.model, o:["Gavriel's sukkah fell over, but Reuven's stood strong",'both sukkahs fell over','both sukkahs stood strong'], h:'Read the sentences that start with "The next morning".'},
{q:'Read the story. What is the moral?', pic:T4.model, o:['Careful, patient work lasts','Fast is always best','Sukkahs are fun to build'], h:'Whose sukkah lasted, and why? Read what Reuven says at the end.'},
{q:'Which one is a detail, not the moral?', pic:T4.model, o:['Reuven measured each stick twice','Taking your time pays off','Patient work lasts'], h:'A detail is one small thing from this story. A moral is a lesson for anyone.'},
{q:'Which saying fits the story best?', pic:T4.model, o:['Slow and steady does the job right','The early bird gets the worm','Two heads are better than one'], h:'Which saying is about taking your time?'},
{q:'Read the story. What is the moral?', pic:T4.umbrella, o:['Sharing with a friend is worth getting a little wet','Rain is fun','Always carry an umbrella'], h:'What did Ari choose to do, and how did both boys feel?'},
],
check:[
{q:'Read the story. What did Eli do?', pic:T4.bus, o:['he made a thank-you card for Mr. Katz','he drove the bus','he came early every day'], h:'Find "That night, Eli made" and read that sentence.'},
{q:'Read the story. What is the moral?', pic:T4.bus, o:['Thank the people who help you','Buses are slow','It is fine to be late'], h:'Think about what Eli chose to do and how Mr. Katz felt.'},
{q:'Read the story. Which clue shows the moral best?', pic:T4.bus, o:["Mr. Katz's eyes shone when he read the card",'Mr. Katz drove for thirty years','Eli sat down on the bus'], h:'Look for the moment that shows why saying thank you matters.'},
],
re:[
{how:`A new way: ask "So what?" When the story ends, ask: what did the main character learn that I could use tomorrow? Your answer is the moral.`, q:'Read the story. What could YOU do tomorrow because of this story?', pic:T4.borrow, o:['keep my word, even if I want to do something else','borrow more seforim','play ball on Sunday']},
{how:`A simpler step: a very short story. Find what the boy chose, and how it turned out.`, q:'What is the lesson?', pic:'Moshe told Abba the truth about the broken cup. Abba thanked him for being honest. Moshe felt light and happy.', o:['Telling the truth is the right thing to do','Cups break easily','Abba is tall']},
{how:`The skill underneath: Retell It. Before you look for the moral, retell the story: beginning, middle, end. The moral is often hiding in the end.`, t:'order', q:'Put The Slow Builder in order. Tap the sentences in order.', pic:T4.model, tiles:['Both boys built a model sukkah.','Gavriel rushed, but Reuven worked slowly.',"Only Reuven's sukkah stood the next morning."]},
]},

'READ.LIT.L04.02':{name:'Character Clues',
teach:[
{how:`The people in a story are called characters, and they are like real people. They have traits, what they are like inside: kind, brave, shy, honest. And they have reasons for what they do. Authors rarely say "Naftali was kind." They SHOW it, with what he does and says. Today you learn to read those clues like a detective. Naftali stopped, sat down next to Tzvi, and shared his pretzels. Those actions show he is kind.`, q:'Read the story. Which word describes Naftali?', pic:T4.newboy, o:['kind','lazy','rude']},
{how:`Watch the body clues too. Tzvi held his bag tightly and looked at the ground. That shows how he felt inside.`, q:'Read the story. How did Tzvi feel on the first day?', pic:T4.newboy, o:['shy and nervous','proud','angry']},
{how:`To find a character's reason, ask WHY, then look at what he says. Tzvi says, "I don't know anyone." That is his reason.`, q:'Read the story. Why did Tzvi not want to play at first?', pic:T4.newboy, o:['he did not know anyone','he was hungry','he did not like ball']},
],
practice:[
{q:'Read the story. Which word describes Pinchas?', pic:T4.window, o:['honest','sneaky','lazy'], h:'Look at what Pinchas did after the other boys ran away. What does that show about him?'},
{q:'Read the story. Which clue shows that Pinchas was scared?', pic:T4.window, o:['His heart was pounding.','He knocked on the door.','The ball went through the window.'], h:'Look for a clue about his body.'},
{q:"Read the story. Why did Pinchas go to Mr. Levi's door?", pic:T4.window, o:['to say sorry and pay for the window','to get his ball back','to ask for a snack'], h:'Read what Pinchas says at the door.'},
{q:'Read the story. How was Pinchas different from the other boys?', pic:T4.window, o:['he came back and owned up; they ran away','he ran away first','he was not playing'], h:'Find what the other boys did. Then find what Pinchas did.'},
{q:'Read the story. Why did Mr. Levi smile?', pic:T4.window, o:['he was pleased that Pinchas came back to tell the truth','he liked broken windows','he wanted the ball'], h:'Read what Mr. Levi says right after he smiles.'},
{q:'Read the story. Which trait fits Gedalya, and why?', pic:T4.zeidy, o:["helpful, because he wants to repay Zeidy's kindness",'lazy, because he shrugs','bossy, because Zeidy never asks'], h:'Look at what he does every Friday. Then read what he says about why.'},
],
check:[
{q:'Read the story. Which word describes Dovid?', pic:T4.seat, o:['thoughtful','selfish','careless'], h:'Look at what Dovid did with the seat, and what he noticed.'},
{q:'Read the story. Why did Dovid give Yisrael the seat?', pic:T4.seat, o:['he knew Yisrael feels sick on long rides','he did not like windows','the rebbe told him to'], h:'Read what Dovid says to Yisrael.'},
{q:'Read the story. Which clue from Yisrael tells us about Dovid?', pic:T4.seat, o:['"You always notice things."','Yisrael was holding his stomach.','Yisrael sat down.'], h:'Find what Yisrael says about Dovid.'},
],
re:[
{how:`A new way: a detective's notebook with three lines. He DID ... He SAID ... So he is ... Fill the first two lines from the story. The third line is the trait.`, q:'Naftali DID: sat down and shared. Naftali SAID: "Then you know me now." So Naftali is ...', pic:T4.newboy, o:['friendly','shy','angry']},
{how:`A simpler step: one sentence, one action. What does the action show?`, q:'What is Avi like?', pic:'Avi gave his last cookie to his little brother.', o:['generous','greedy','scared']},
{how:`The skill underneath: Moral of the Story. What a character does often teaches the story's lesson. Find what the main character chose, then ask what lesson it teaches.`, q:'Read The New Boy. What lesson does Naftali teach us?', pic:T4.newboy, o:['Notice a boy who is alone, and be his friend','Always play ball','Bring pretzels to school']},
]},

'READ.FLU.L04.02':{name:'Chapter Reader',
teach:[
{how:`A chapter book is a long story cut into parts called chapters. You read one or two chapters a day, so the story lasts several days. The trick is to keep the story in your head between days: who is in it, what the problem is, and what has happened so far. Today you read a whole chapter book, The Missing Esrog. Read Chapter 1. The main things: Abba brought home a special esrog, and he put it on a high shelf.`, q:'Read Chapter 1. What did Abba bring home?', pic:T4.ch1, o:['an esrog in a box','a lulav','a sefer']},
{how:`Before you start the next chapter, say the story so far in one sentence. A good "story so far" has the main things, not the small details.`, q:'Which sentence is the best "story so far" after Chapter 1?', pic:T4.ch1, o:['Abba bought a special esrog and put it on a high shelf until Yom Tov.','Shmuel is nine.','The box was white.']},
{how:`Chapter titles are hints. They tell you what the next chapter is about. Use the title to guess what will happen, then read to check.`, q:'The next chapter is called "The Empty Shelf." What will probably happen?', o:['something will be missing from the shelf','Abba will build a new shelf','the boys will eat breakfast outside']},
],
practice:[
{q:'Read Chapter 2. What was the problem?', pic:T4.ch2, o:['the esrog was gone','the box was broken','Shmuel was late'], h:'Find the sentence that ends with "gone!"'},
{q:'Read Chapter 2. What clue did Shmuel find?', pic:T4.ch2, o:['a trail of flax on the floor','muddy footprints','a note'], h:'Read the last two sentences of the chapter.'},
{t:'order', q:'Put the events from Chapters 1 and 2 in order.', pic:T4.ch12, tiles:['Abba put the box on a high shelf.','Shmuel saw that the esrog was gone.','Shmuel found a trail of flax.'], h:'Chapter 1 comes first. In Chapter 2, what did Shmuel see before he found the clue?'},
{q:'Read Chapter 3. Who took the esrog?', pic:T4.ch3, o:["Dovid, Shmuel's little brother",'Abba','a cat'], h:'Find who was sitting on the porch.'},
{q:'Read Chapter 3. Why did Dovid take the esrog?', pic:T4.ch3, o:['he wanted to make it a bed','he wanted to eat it','he wanted to hide it from Abba'], h:'Read what Dovid says.'},
{q:'Think about the whole book. How did Shmuel change from Chapter 2 to Chapter 3?', pic:T4.book, o:['he went from upset to calm and gentle','he went from happy to angry','he did not change'], h:'In Chapter 2 his face got hot. In Chapter 3, read how he talks to Dovid.'},
],
check:[
{t:'order', q:'Put the whole book in order.', pic:T4.book, tiles:['Abba brought home a special esrog.','The esrog went missing.','Shmuel found Dovid making it a bed.','Abba thanked both boys.'], h:'Use the chapter titles. What happened in Chapter 1, then 2, then 3?'},
{q:'Which chapter tells how the problem was solved?', pic:T4.book, o:['Chapter 3','Chapter 1','Chapter 2'], h:'Find the chapter where Shmuel finds the esrog.'},
{q:'Why did Abba thank Shmuel?', pic:T4.book, o:['for being gentle with Dovid','for buying the esrog','for opening the window'], h:'Read the last sentence of the book.'},
],
re:[
{how:`A new way: a chapter map. Draw three boxes in your head, one for each chapter. In each box, put the ONE most important thing that happened. Press the speaker to hear the whole book.`, p:'rl4_esrog', q:'Fill the chapter map. What goes in the box for Chapter 2?', o:['The esrog is missing.','Abba buys an esrog.','Abba thanks the boys.']},
{how:`A simpler step: one chapter at a time. Read just Chapter 1. Who is in it?`, q:'Read Chapter 1. Who is in it?', pic:T4.ch1, o:['Shmuel and Abba','Shmuel and Dovid','Dovid and Abba']},
{how:`The skill underneath: Smooth Passage and Character Clues. Read each chapter smoothly, and watch what each character does and says. Those clues keep the story clear from day to day.`, q:'Read Chapter 3. Which word describes Dovid?', pic:T4.ch3, o:['caring','mean','lazy']},
]}
};

const T5={
yeshiva:`Two Ways to Get to Yeshiva
Dovid and Shimon live on the same street, but they get to yeshiva in two different ways.
Dovid rides the yeshiva bus. It stops at the corner at 7:40 every morning. The bus is warm in winter, and Dovid uses the ride to review Mishnayos with his friend. But when the bus is late, Dovid has to wait in the cold, and there is nothing he can do about it.
Shimon walks with his father. They leave at 7:30 and walk eight blocks together. On the way, Abba quizzes him on the parsha, and they say good morning to the neighbors. Walking keeps Shimon's legs strong. But on rainy days, Shimon arrives with wet shoes.
The two boys are alike in some ways too. Both arrive before Shacharis. Both use the trip to learn something. And both are happy to see their friends when they get there.
So which way is better? Each one has something good. The bus is warmer, but walking keeps you strong. In the end, the best trip to yeshiva is one where you learn along the way.`,
roof:`The Leak in the Shul Roof
Last winter, our shul had a big problem. Every time it rained, water dripped from the ceiling onto the seats near the aron kodesh. The men put buckets on the floor, but the buckets filled up fast, and the carpet began to smell.
The gabbai called a meeting. "We need to fix the roof," he said, "but a new roof costs $9,000, and the shul has only $2,000."
The boys of the shul came up with a plan. They would run a car wash every Sunday until the spring. Each car would cost $10. Their fathers helped with hoses and soap, and the rav came out to wash the first car himself.
Week after week, the boys washed cars in the shul parking lot. Neighbors from all over town drove in. Some of them gave extra money because they liked to see boys doing chessed for their shul.
By Pesach, the boys had raised $7,000. The roofer came, pulled off the old shingles and put on a strong new roof. The next time it rained, the seats stayed dry.
The gabbai hung a sign by the door: "This roof was built by our boys."`,
lunch:`The lunchroom at our yeshiva was so noisy that nobody could hear the announcements. Boys had to shout just to talk to the boy next to them. So the menahel came up with an idea. He put a small bell at the front of the room. When the bell rings, everyone stops talking for one minute to listen. Now every boy hears the announcements, and lunch is calmer too.`,
bikes:`Bikes and scooters are both fun ways to ride around the block. Both have wheels, and both need a helmet. But a bike has pedals and a seat, and a scooter does not. A bike can go much faster and farther. A scooter is lighter, so it is easier to carry up the stairs.`,
challah:`First, Abba mixes flour, water, yeast and a little sugar. Next, he kneads the dough and lets it rise for an hour. Then he braids it into challos. Last, he bakes them until they are golden.`,
chart:`Chart: Tzedakah Collected This Month
Class — Money
3rd grade — $45
4th grade — $60

6th grade — $52`,
timeline:`Timeline: Erev Shabbos at the Katz House
12:00 — Shopping for Shabbos food
2:00 — Challah goes into the oven
4:00 — The boys shower and get dressed
4:20 — Candle lighting
4:30 — Abba and the boys walk to shul`,

[Picture: a small hut with a leafy roof, a table inside.]
1 → Schach: the roof, made of branches or bamboo
2 → Walls: the sides of the sukkah
3 → Decorations: hanging fruit and pictures
4 → Table: where we eat our meals`,
bars:`Bar graph: Pages of Mishnayos Learned

camp:`Timeline: A Day at Camp
7:30 — Shacharis

2:00 — Baseball game`,
siddur:`The Lost Siddur
On Rosh Chodesh, Yaakov brought his new siddur to yeshiva. It had a blue cover with his name stamped in gold. It was a birthday gift from his Zeidy.
After Shacharis, Yaakov went out for recess. When he came back, the siddur was gone from his desk. He looked under the desk, in his knapsack and on the shelf. It was nowhere.
Yaakov's eyes filled with tears. "Zeidy gave it to me," he told his rebbe.
The rebbe did not get angry. He asked the whole class to help. The boys split up. Two boys checked the beis medrash. Two boys checked the lunchroom. Yaakov and his friend Nosson checked the hallway.
Nosson noticed something blue on top of the lost-and-found box near the office. He ran over. It was the siddur! A first grader had found it on the floor near the door and had brought it there.
Yaakov hugged his siddur. Then he went to find the first grader and thanked him. "You did a real mitzvah," he said. "You returned something that was lost."
That night, Yaakov wrote his name inside the cover in big letters, so that if the siddur ever got lost again, anyone could bring it back to him.`,
lulav:`On the first morning of Sukkos, Menachem got to shul and saw that he had left his lulav and esrog on the bus. He felt terrible, because he wanted to shake them with everyone. His older brother whispered that the shul keeps an extra set for anyone who needs one. Menachem borrowed the extra set, shook it with the whole shul, and returned it with a big thank-you.`,
snow:`The first snow fell on a Thursday night. In the morning, Meir wanted to build a snowman, but Abba asked him to help shovel the walk for their old neighbor, Mr. Rubin. Meir was disappointed, but he picked up a shovel. When they finished, Mr. Rubin invited them in for hot cocoa. Then he gave Meir an old hat and a carrot. Meir built a big snowman right in Mr. Rubin's front yard, and Mr. Rubin waved at it from his window all day.`,
first:`I had never been so nervous. My hands shook as I held the shofar. I took a deep breath, pressed my lips to it and blew. A long, clear tekiah filled the room. From the back row, I could see Abba smiling at me.`,
third:`Chaim had never been so nervous. His hands shook as he held the shofar. He took a deep breath, pressed his lips to it and blew. A long, clear tekiah filled the room. From the back row, Chaim could see his father smiling at him.`,
letter:`Dear Abba,
Camp is great! Yesterday we went on a long hike. My feet hurt, but I saw a deer drinking from the lake. My counselor says I am the best swimmer in my bunk. I miss your Shabbos zemiros.
Love, Benny`,
gemara:`Reuven sat down with his new Gemara. He ran his finger along the first line and read the words slowly. His chavrusa, Eli, leaned over to help him with a hard word. Reuven smiled. He was finally learning Gemara, just like his big brothers.`,
ride1:`The Long Ride to Zeidy — Part 1
On Friday morning, the Weiss family packed the car to drive to Zeidy for Shabbos. Zeidy lived four hours away, and Shabbos began at 4:30. "If we leave at nine, we will have plenty of time," Abba said.
Shmuel sat by the window with his little brother Avi. They played a game of counting red cars. By eleven o'clock, Shmuel had counted forty-two.
Then they heard a loud bang. The car shook. Abba pulled slowly onto the side of the highway. He got out and walked around the car. "A flat tire," he said.`,
ride2:`The Long Ride to Zeidy — Part 2
Abba opened the trunk and took out the spare tire and the jack. Shmuel held the bag of bolts so none would roll away. Avi handed Abba the tools one by one.
It was hard work. One bolt was stuck tight, and Abba could not turn it. Shmuel looked at his watch and began to worry. What if they did not reach Zeidy before Shabbos?
Just then, a big truck pulled over behind them. The driver jumped down with a long, strong wrench. "Let me help," he said. With one hard push, the stuck bolt turned. Ten minutes later, the spare tire was on.
Abba shook the driver's hand. "Thank you," he said. "You have saved our Shabbos."`,
ride3:`The Long Ride to Zeidy — Part 3
The rest of the drive was quiet. Avi fell asleep. Shmuel watched the clock on the dashboard and said Tehillim softly.
At 3:20, they turned onto Zeidy's street. Zeidy was standing on the porch in his Shabbos suit, waving with both hands. There was still more than an hour before Shabbos.
That night at the Shabbos table, Zeidy asked the boys about the trip. Shmuel told him about the bang, the stuck bolt and the truck driver.
Zeidy smiled. "Hashem sends help in many ways," he said. "Today He sent it in a truck."`
};
