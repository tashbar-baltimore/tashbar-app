]},

'READ.LIT.L08.02':{name:'Whose View',
teach:[
{how:`Point of view is how a character sees what happens. Two characters can live through the same moment and feel opposite things, like two boys looking at one coin from two sides. Authors show this by letting each character tell his own part, or by showing what each one thinks and says. Today you learn to contrast two points of view, which helps you understand people better too. Press the speaker and listen to The Rainy Sunday. When the rain comes, Yaakov feels the day is ruined.`, p:'rl8_rain', q:'How does Yaakov feel when he sees the rain?', o:['upset, because the zoo trip is ruined','happy, because rain is a bracha','scared of the thunder']},
{how:`Now the same rain from the other side. Eli comes from Eretz Yisrael, where no rain falls all summer, so rain feels like a present to him. A character's past shapes how he sees things.`, q:'Why does Eli see the rain so differently?', pic:T8.rain, o:['in Eretz Yisrael rain is rare and everyone davens for it','Eli did not want to go to the zoo','Eli likes to stay indoors']},
{how:`Notice HOW the author shows two views. The story is split into parts, with a name on top of each part. Each boy tells his own part and says I. So the reader gets to see inside both heads.`, q:'How does the author let us see both points of view?', pic:T8.rain, o:['each boy tells his own part of the story','a narrator outside the story tells everything','Abba tells the whole story']},
],
practice:[
{q:'What does the reader understand that Yaakov does not understand at first?', pic:T8.rain, o:['why Eli is grinning at the rain','that the zoo is closed','that Abba is angry'], h:'In his first part Yaakov says "I could not understand it." Then read Eli\'s part. What does it explain?'},
{q:'Which words show Yaakov\'s point of view at the start?', pic:T8.rain, o:['"The whole day was ruined."','"Rain is a bracha."','"I felt like it was a present."'], h:'Look only in the first part, the one with YAAKOV on top.'},

'READ.COMP.L08.02':{name:'Idea Links',
teach:[
{how:`In real life, nothing happens alone. A person has an idea, the idea leads to an event, and the event changes people. Seeing these links is like pulling one string and watching what else moves. Today you learn how people, events and ideas affect each other in a text. In How Cedar Falls Got Its Yeshiva, one bridge set off a whole chain. After the bridge, families could live on the west side and reach the shul in ten minutes.`, q:'What did the new bridge make possible?', pic:T8.town, o:['families could live on the west side and reach the shul quickly','boys could take the train to the city','the farms could grow more food']},
{how:`A person can cause events. Look for a name and what that person did. Mr. Klein designed the bridge, and later he drew the plans for the yeshiva for free. One person affected two big events.`, q:'How did Mr. Klein affect the town?', pic:T8.town, o:['he designed the bridge and drew the yeshiva plans','he was the rav of the shul','he moved the yeshiva to the city']},
{how:`An idea can change people too. Rabbi Weiss's idea was that the boys should learn close to home. The idea spread, families gave money, and a yeshiva was built.`, q:'What did Rabbi Weiss\'s idea lead to?', pic:T8.town, o:['the community built a yeshiva in Cedar Falls','the bridge was built','the shul was closed']},
],

{q:'Why did so many young families move to the west side?', pic:T8.town, o:['the land was cheap, and the bridge made the shul close','the farms were for sale','the yeshiva was already there'], h:'Read the paragraph about the bridge. Find two reasons: what the land cost and how far the shul was.'},
{q:'What problem was caused by the community growing?', pic:T8.town, o:['the shul became too crowded','the bridge broke','the train stopped running'], h:'Read the paragraph that starts "As the community grew."'},

{q:'How did the opening of the yeshiva affect the town?', pic:T8.town, o:['even more families moved there so their sons could learn close to home','families moved away','the shul closed'], h:'Read the paragraph that starts "Once the yeshiva opened."'},

'READ.VOC.L08.02':{name:'Context Master',
teach:[
{how:`Strong readers do not stop when they meet a hard word. They become detectives. The words around it are clues: sometimes the author explains the word, gives examples, or uses an opposite. When the clues are not enough, a dictionary settles it. Today you learn to use all these tools, so no word can stop you. In Chessed Night at the Food Pantry, look at PROVISIONS. Right after the comma, the author explains it: the food and supplies that families need.`, q:'What does PROVISIONS mean?', pic:T8.pantry, o:['food and supplies','cardboard boxes','volunteers']},
{how:`An example clue: sometimes the author does not define the word but shows it. Reb Yossi checks every box twice, lines up every can, and writes down every item. Those examples show what METICULOUS means.`, q:'What does METICULOUS mean?', pic:T8.pantry, o:['very careful about every small detail','very tired','very fast']},
{how:`A dictionary can list several meanings for one word. Read every meaning, then try each one in the sentence. The one that makes sense is the right one. Shelves of cans running low are about a supply, not soup.`, q:'Which meaning of STOCK fits the sentence?', pic:T8.stock, o:['meaning 1: a supply of goods kept ready to use','meaning 2: a soup made from bones or vegetables','meaning 3: a share in owning a company']},
],
practice:[
{q:'What does RELUCTANT mean?', pic:T8.pantry, o:['not wanting to do something','very excited','very strong'], h:'Find the word but after RELUCTANT. By the end he was eager. Reluctant is the opposite of eager.'},
{q:'What does DILAPIDATED mean?', pic:T8.pantry, o:['old and falling apart','brand new','very big'], h:'Read the sentence right after DILAPIDATED. A leaking roof, peeling paint, a broken window: what do they show?'},
{q:'The root BENE means good. Use the root and the clues. What does BENEVOLENT mean?', pic:T8.pantry, o:['kind and wanting to do good','very rich','angry'], h:'Read what Mr. Rosen did and what he said about doing good for others. Then remember: bene means good.'},
{q:'Which kind of clue helps you with RELUCTANT?', pic:T8.pantry, o:['an opposite clue, with the word but','a meaning right after a comma','a dictionary entry'], h:'The word but often signals an opposite. Which word in that sentence is the opposite of reluctant?'},
{q:'Which meaning of BARE fits the sentence?', pic:T8.bare, o:['meaning 2: empty; having nothing on it','meaning 1: not covered by clothing','meaning 3: only just enough'], h:'Try each meaning in the sentence about the shelves. Which one makes sense for shelves?'},
{q:'A new text. What does OBSOLETE mean?', pic:T8.train, o:['no longer used, because something newer replaced it','very fast','brand new'], h:'Read the guide\'s next sentence. What happened to steam engines after diesel trains came?'},
],
check:[
{q:'What does TIMID mean?', pic:'The new boy in shiur was TIMID. He spoke so quietly that no one could hear him, and he hid behind his Gemara when the rebbe called on him.', o:['shy and easily scared','loud and bold','very tall'], h:'Look at the examples: speaking quietly, hiding behind his Gemara. What kind of boy acts like that?'},
{q:'What does TACITURN mean?', pic:'Yosef was usually TACITURN, but at the siyum he talked and laughed for an hour.', o:['quiet; not talking much','funny','hungry'], h:'The word but signals an opposite. At the siyum he talked for an hour. What is he usually like?'},
{q:'Which meaning of DRAFT fits the sentence?', pic:T8.draft, o:['meaning 2: a flow of cold air into a room','meaning 1: a first try at writing','meaning 3: a drawing of a plan'], h:'The sentence says cold and window. Try each meaning in the sentence.'},
],

{how:`The skill underneath: Root Power (Level 6). A root you know can unlock a long word. BENE means good, and SPECT means look.`, q:'Which word probably means "a person who does good for others"?', o:['benefactor','spectator','telephone']},
]}

const T9={
watch:`The Watch in Zeidy's Drawer
Chapter 1: Today
Shimon was looking for a rubber band in Zeidy's desk when he found it: a silver pocket watch, its hands frozen at ten past three. On the back, tiny letters said "Bava Kamma, 1966."
"Zeidy, what is this?"
Zeidy took the watch gently, the way he held a sefer. "A watch like this waits for the right boy," he said, and he put it back in the drawer.
Chapter 2: Sixty Years Ago
In a small beis medrash, a thin boy named Leibel closed his Gemara. He had just finished Maseches Bava Kamma, the first boy in his class to do it. His rebbe, Reb Hirsch, reached into his coat and pressed something cold into Leibel's hand. It was a silver watch, ticking softly.
"Every minute you learn is a treasure," Reb Hirsch said. "Let this remind you."
Leibel carried that watch every day for fifty years, until one morning it stopped.
Chapter 3: Today
Shimon could not stop thinking about the watch. He was learning Bava Kamma himself, and he was almost finished. Quietly, he took the watch to Mr. Adler, the watchmaker on Main Street.
"It needs a new spring," Mr. Adler said. "Forty dollars, and three weeks."
Shimon emptied his savings jar. Every afternoon after seder, he stopped at the shop to check on the watch.
Chapter 4: The Siyum
At Shimon's siyum, the whole family crowded into the dining room. When the singing stopped, Shimon handed Zeidy a small box. Inside, the silver watch was ticking.
Zeidy's eyes filled with tears. He held the watch for a long moment. Then he pressed it into Shimon's hand.
"I told you," he said. "It was waiting for the right boy."`,
diary:`Camp Diary
Sunday: The bus ride took five hours. I don't know anybody in my bunk, and I miss home.
Monday: A boy named Yitzy showed me how to throw a curve ball. We learned Mishnayos together after lunch.
Tuesday: Yitzy and I won the relay for our team. I think this summer will be good after all.`,
speech:`Gavriel's Speech
Every year, the eighth grade runs a chessed sale to buy seforim for a yeshiva in Eretz Yisrael. This year, Gavriel was chosen to speak to the parents.
He was nervous. He wrote his first try in one sitting: "Our class is cheap. We never spend money on ourselves, so we can give it away." His rebbe read it and smiled. "Cheap and thrifty mean almost the same thing," Rebbi said, "but one is an insult and one is a compliment. Which do you want to say about your class?"
Gavriel crossed out cheap and wrote thrifty.
Next he wrote: "Mr. Feld is a stubborn man. When the sale almost failed last year, he would not give up." Rebbi tapped the word. "Stubborn sounds like he will not listen to anyone. Is that what you mean?" Gavriel thought for a moment, then wrote determined.
In the third paragraph, he described how the boys trudged from door to door in the snow. "Good," said Rebbi. "Trudged tells me they were tired but kept going. Walked would tell me nothing."
Finally, Gavriel wrote: "A sefer is to a yeshiva boy as water is to a plant." Rebbi nodded. "That is an analogy. A plant needs water to grow, and a boy needs seforim to grow in Torah."
On the night of the sale, Gavriel's voice was steady. When he finished, the parents did not just clap. They applauded for a full minute, and the sale raised more money than ever before.
Afterward, Rebbi put a hand on his shoulder. "You see? The right word is not just correct. It is exactly correct."`,
card:`Avi's rebbe wrote on his report card: "Avi is a confident speaker who shares his ideas in class."
At dinner, Avi's older brother joked, "Confident? He's arrogant! He thinks he knows everything."
Abba laughed. "Your rebbe chose his word carefully," he said.`
};

'READ.LIT.L09.02':{name:'Long Book Builder',
teach:[
{how:`A long book is built like a house: the chapters are its rooms, and each room has a job. Some chapters move the story forward. Some jump back in time to explain. Some plant a hint about what will happen later. Today you learn to see how a longer story is built and why the author built it that way, so you can follow any book, however long. Press the speaker and listen to The Watch in Zeidy's Drawer. Look at the chapter titles: Chapter 2 jumps back sixty years.`, p:'rl9_watch', q:'Which chapter jumps back in time?', o:['Chapter 2: Sixty Years Ago','Chapter 1: Today','Chapter 4: The Siyum']},
{how:`A jump back in time is called a FLASHBACK. Authors use it to explain something in the present. Leibel, the boy in Chapter 2, is Zeidy himself, sixty years younger. The flashback shows how he got the watch, so we understand why it matters so much to him.`, q:'Why did the author put the flashback in Chapter 2?', pic:T9.watch, o:['to explain why the watch is so precious to Zeidy','to tell what Shimon ate for breakfast','to end the story']},
{how:`A hint early in a story about what will happen later is called FORESHADOWING. In Chapter 1, Zeidy says, "A watch like this waits for the right boy." At the very end, the watch goes to Shimon.`, q:'Which line from Chapter 1 foreshadows the ending?', pic:T9.watch, o:['"A watch like this waits for the right boy."','"Zeidy, what is this?"','Shimon was looking for a rubber band.']},
],

'READ.VOC.L09.01':{name:'Shades of Meaning',

{how:`Two words can mean almost the same thing and still feel very different, like two shades of the same color. Cheap and thrifty both describe someone who spends little money, but one is an insult and one is a compliment. Today you learn to hear these shades, and to solve analogies that compare two pairs of things, so you can say exactly what you mean. Press the speaker and listen to Gavriel's Speech. Watch how his rebbe helps him choose each word.`, p:'rl9_speech', q:'Why did Gavriel change cheap to thrifty?', o:['thrifty says the same thing in a positive way','thrifty means spending a lot','cheap was spelled wrong']},
{how:`A word has a dictionary meaning and a feeling. The feeling is called its CONNOTATION. Stubborn and determined both mean not giving up, but stubborn feels negative and determined feels positive.`, q:'Which word gives Mr. Feld a POSITIVE shade?', pic:T9.speech, o:['determined','stubborn','pushy']},
{how:`An ANALOGY compares two pairs: A is to B as C is to D. First find how the first pair is connected, then find the pair connected the same way. A sefer is to a yeshiva boy as water is to a plant: each one helps the other grow.`, q:'Complete the analogy: a sefer is to a yeshiva boy as water is to a ____.', pic:T9.speech, o:['plant','bucket','cloud']},
],

{q:'All three words mean wanting to find things out. Which one has a NEGATIVE shade?', pic:'curious · inquisitive · nosy', o:['nosy','curious','inquisitive'], h:'Which word would you NOT want someone to call you? It means poking into other people\'s business.'},
{t:'order', q:'Put the words in order from mildest to strongest.', pic:'Words about heat: hot · scorching · warm', tiles:['warm','hot','scorching'], h:'Which word is pleasant? Which one would burn you? Put the pleasant one first.'},

{t:'write', q:'Find a paragraph you wrote, or write five short sentences about your morning. Rewrite it so the sentences vary: join at least two short sentences, start one sentence with a time or action phrase, and keep one short sentence for punch. Write in the box, or on paper and take a photo. Then tick each box.', min:0, checks:['I joined at least two short sentences.','I started one sentence with a time or action phrase.','I kept one short sentence for punch.','I read it aloud to hear the rhythm.']},
{q:'Read this new paragraph. Which revision varies the sentences best?', pic:WT7.camp, o:['The canoe tipped, and cold water rushed in. Yisroel grabbed the side while Dov grabbed his paddle. They swam to shore.','The canoe tipped over. The water rushed in. Yisroel grabbed the side. Dov grabbed his paddle. They swam.','The canoe tipped and the water rushed in and Yisroel grabbed the side and Dov grabbed his paddle and they swam to shore.'], h:'Varied does not mean all long or all short. Look for a mix of joined sentences and one short sentence, without a long chain of and.'},

check:[
{q:'Which paragraph has the most varied sentences?', o:['The storm hit at night. Thunder shook the windows, and the lights flickered twice. Then, silence.','The storm hit. Thunder shook. Lights flickered. It was quiet.','The storm hit and thunder shook and the lights flickered and then it was quiet.'], h:'Look for a mix of sentence lengths and starts. All short sounds choppy, and one long chain of and is a run-on.'},
{q:'Which word joins these ideas best? ___ he was tired, Moshe kept learning.', o:['Although','Because','Unless'], h:'Being tired would make you stop, but he kept going. You need a word that shows a surprise or a contrast.'},
{q:'Which sentence starts with a time phrase?', o:['Before Mincha, the boys set up the chairs.','The boys set up the chairs.','Chairs were set up by the boys.'], h:'A time phrase tells when, like before, after or at noon. It comes first and is followed by a comma.'},
],
re:[
{how:'A new way: think of music. If every note is the same length, the song is dull. A good song mixes long notes and short beats. Sentences work the same way.', q:'In the music idea, what makes a song interesting?', o:['mixing long notes and short beats','playing every note the same length','playing only one note']},
{how:'A simpler step: just join two short sentences with and, but or so, and put a comma before the joining word.', q:'Join them: The rain stopped. We went outside.', o:['The rain stopped, so we went outside.','The rain stopped we went outside.','The rain. Stopped so we went.']},
{how:'The skill underneath: Conjunction Kit (Language Arts Level 6). Joining words like because, although, when and unless let you build longer sentences that show how ideas connect.', q:'Which joining word shows a reason?', o:['because','although','unless']},
]},

'WRIT.ESSAY.L07.03':{name:'Show, Don\'t Tell',
teach:[
{how:'Telling says how someone feels: Pinchas was scared. Showing lets the reader feel it too: Every crack of a twig made him hold his breath. Today you learn to show with sensory details (what a character sees, hears, smells, tastes and touches) and with actions that reveal feelings. When you show, your reader lives inside the story instead of just hearing about it.', q:'What does showing do that telling does not?', o:['It lets the reader feel what the character feels.','It names the feeling with one word.','It makes the story shorter.']},
{how:'Telling would say: Yaakov was nervous before his bar mitzvah leining. Showing proves the feeling with the body and actions, without naming it.', q:'Which detail shows that Yaakov was nervous?', pic:WT7.show, o:['His heart thumped so loudly he was sure the whole shul could hear it.','He looked down at the parchment.','He gripped the yad.']},
{how:'Sensory details use the five senses. Read this camp story and look for a detail for the sense of smell.', q:'Which detail appeals to the sense of smell?', pic:WT7.night, o:['The air smelled of pine and wet grass.','Somewhere outside, an owl hooted, and the screen door creaked in the wind.','The bunkhouse was pitch black.']},
],
practice:[
{q:'Which detail from the camp story appeals to the sense of hearing?', pic:WT7.night, o:['the screen door creaked in the wind','pitch black','pine and wet grass'], h:'Go through the senses one at a time. Black is something you see and pine is something you smell. Which detail is a sound?'},
{q:'Which sentence SHOWS that Pinchas felt relieved at the end?', pic:WT7.night, o:['Pinchas let out a long breath and smiled into the dark.','Pinchas pulled his sleeping bag up to his chin.','Every crack of a twig made him hold his breath.'], h:'Relief comes when fear ends. Look near the end for an action that shows the fear going away.'},
{q:'Telling: Eli was excited. Which sentence shows it instead?', o:['Eli bounced on his toes and kept checking the window for the bus.','Eli was very, very excited.','Eli felt a lot of excitement.'], h:'Showing uses actions or senses and does not name the feeling. Which choice never uses the feeling word?'},
{t:'order', q:'Put this showing scene in order. Tap the sentences in order.', tiles:['The smell of fresh challah drifted from the kitchen.','Mendy followed it down the hall, his stomach rumbling.','He peeked around the door and saw the golden loaves cooling on the rack.'], h:'Follow the senses in the order Mendy meets them: first he smells it, then he walks toward it, then he sees it.'},
{t:'write', q:'Pick a feeling: nervous, proud, excited or relieved. Write a short scene (5 to 7 sentences) that SHOWS the feeling without ever naming it. Use at least three different senses and one action that reveals the feeling. Write in the box, or on paper and take a photo. Then tick each box.', min:0, checks:['I never named the feeling word.','I used at least three different senses.','I included an action that shows the feeling.','My scene has a clear beginning and end.']},
{q:'Read this new scene. Which detail appeals to the sense of touch?', pic:WT7.snow, o:['The cold stung his cheeks','the snow squeaked under his boots','he grinned at his brother'], h:'Touch is something you feel on your skin. Squeaked is a sound and grinned is something you see. Which detail is felt?'},
],
check:[
{q:'Which sentence is SHOWING, not telling?', o:['Dovid\'s face turned red, and he stared at his shoes.','Dovid was embarrassed.','Dovid felt bad.'], h:'Telling names the feeling. Showing gives clues the reader can see. Which choice gives clues without a feeling word?'},
{q:'Which sense does this detail use? The soup tasted salty and warm.', o:['taste','sight','hearing'], h:'Ask which part of the body notices this. Salty is noticed in the mouth.'},
{q:'Why does a writer show instead of tell?', o:['So the reader experiences the scene himself.','So the story has fewer details.','So the reader does not need to imagine anything.'], h:'Think about what the reader does with a showing sentence. Does he just hear about it, or feel it himself?'},
],
re:[
{how:'A new way: be a detective, not a reporter. A reporter says, He was angry. A detective finds the clues: clenched fists, a slammed door, a red face. Give your reader clues.', q:'In the detective idea, which is a clue that shows anger?', o:['a slammed door','the word angry','a quiet smile']},
{how:'A simpler step: start with just one sense. Close your eyes and ask: what would I hear here?', q:'Which detail is a sound at the Shabbos table?', o:['the clink of the Kiddush cup','the white tablecloth','the warm challah']},
{how:'The skill underneath: Story with Dialogue (Writing Level 5). You already used dialogue and description. Showing is description at full power, with every sense and every action working to reveal feeling.', q:'In a story, what are the exact words a character says called?', o:['dialogue','description','the setting']},
]}
};

intro:'When someone gets hurt, the first few minutes matter most, and an ambulance may still be far away. A boy who knows what to do can make the difference. Every seventh grader should learn basic first aid, because it can save a life, it builds calm and confidence, and it is easy to learn.',
b1:'First, first aid can save a life. Doctors teach that pressing hard on a bleeding cut slows the bleeding. This means that a boy who knows just that one step can keep someone safe until the ambulance comes.',

const WR8={
'WRIT.ESSAY.L08.01':{name:'Five-Paragraph Argument',
teach:[
{how:'You already know how to quote evidence and explain it. Now you will use that to win over a real reader, like your principal or your parents. A five-paragraph argument has an introduction that ends with your claim, three body paragraphs that each give one reason with evidence and an explanation, and a conclusion that says the claim again and asks the reader to act. A clear plan makes your argument hard to say no to.', q:'How many body paragraphs does a five-paragraph argument have?', o:['three','one','five']},
{how:'The introduction starts with a hook. Then it gives the claim: what you want, and the reasons why. Read this introduction.', q:'Which sentence states the claim?', pic:WT8.intro, o:['Every seventh grader should learn basic first aid, because it can save a life, it builds calm and confidence, and it is easy to learn.','When someone gets hurt, the first few minutes matter most, and an ambulance may still be far away.','A boy who knows what to do can make the difference.']},
{how:'Each body paragraph has three steps: the reason, the evidence, and then an explanation of how the evidence proves the reason. Read this body paragraph.', q:'Which sentence explains how the evidence proves the reason?', pic:WT8.b1, o:['This means that a boy who knows just that one step can keep someone safe until the ambulance comes.','First, first aid can save a life.','Doctors teach that pressing hard on a bleeding cut slows the bleeding.']},
],
practice:[
{q:'Which sentence is the hook of this introduction?', pic:WT8.intro, o:['When someone gets hurt, the first few minutes matter most, and an ambulance may still be far away.','Every seventh grader should learn basic first aid, because it can save a life, it builds calm and confidence, and it is easy to learn.','A boy who knows what to do can make the difference.'], h:'The hook comes first and pulls the reader in with a picture or a question. The claim comes at the end. Look at the very first sentence.'},
{q:'Which sentence gives the reason for this body paragraph?', pic:WT8.b2, o:['Second, first aid builds calm and confidence.','A boy who has practiced the steps knows what to do instead of panicking.','When his little brother falls off a bike, he stays steady, checks the injury and helps.'], h:'The reason is the first step of a body paragraph. It often starts with a word like First, Second or Finally. The other sentences prove it.'},
{q:'The claim is: Every seventh grader should learn basic first aid. Which is the best reason for the third body paragraph?', o:['A basic first aid course takes only a few hours to learn.','Bandages come in many colors.','My cousin went to camp last summer.'], h:'A reason must help prove the claim, that boys should learn first aid. Which one gives the reader a reason to agree?'},
{t:'order', q:'Put the five paragraphs of this argument about swimming in order. Tap them in order.', tiles:['Every summer, boys head to the lake or the pool. Every boy should learn to swim, because it keeps him safe, it is great exercise and it is fun.','First, swimming keeps a boy safe in the water.','Second, swimming is great exercise for the whole body.','Finally, swimming is fun to do with friends and family.','Safe, strong and happy: that is a boy who can swim. Ask your parents to sign you up for lessons this summer.'], h:'The introduction ends with the claim. Then come the three reasons: First, Second, Finally. The conclusion says the claim again and asks the reader to act.'},
{t:'write', q:'Choose a claim you believe, like: our class should have a chessed project every month, every boy should learn to swim, or our school should have a longer recess. Plan and write five paragraphs: an introduction with a hook and your claim, three body paragraphs that each give a reason, evidence and an explanation, and a conclusion that asks the reader to act. Write in the box, or on paper and take a photo. Then tick each box.', min:0, checks:['My introduction has a hook and ends with my claim.','I have three body paragraphs, each with one reason.','Each body paragraph has evidence and explains how it proves the reason.','My conclusion says my claim again and asks the reader to act.']},
{q:'Read this conclusion from a new argument. Which sentence states the claim again?', pic:WT8.garden, o:['Our school should plant a vegetable garden this spring.','Let\'s ask the principal for one sunny corner of the yard.','Growing our own vegetables would teach us patience, give us fresh food for lunch and make our yard beautiful.'], h:'The claim says what the writer wants to happen. One sentence lists the reasons and one asks the reader to act. Find the one that says what should happen.'},
],
check:[
{q:'In a five-paragraph argument, where does the claim usually go?', o:['at the end of the introduction','in the middle of the second body paragraph','after the conclusion'], h:'The introduction hooks the reader first and then tells him what you want. Think about where the hook ends.'},
{q:'A body paragraph begins: Second, swimming keeps a boy strong. What should come next?', o:['evidence, then an explanation of how it proves the reason','a brand-new reason','the conclusion'], h:'Each body paragraph has three steps: reason, evidence, explanation. The reason is already there. What is the next step?'},
{q:'Which is the strongest last sentence for the conclusion of an argument?', o:['Ask the principal to start a first aid course this year.','That is all I have to say.','The end.'], h:'A strong conclusion asks the reader to do something about the claim. Which sentence asks for action?'},

{how:'The skill underneath: Quote and Explain (Writing Level 7). In every body paragraph you give evidence and then explain how it proves your reason, just the way you learned to quote and explain.', q:'After you give a piece of evidence, what comes next?', o:['an explanation of how it proves your point','a new topic','the title']},

'WRIT.ESSAY.L08.03':{name:'Explain It All',
teach:[
{how:'You can already write a three-part piece. Now you will explain a big topic in several sections. An informative essay has an introduction that tells what the reader will learn, body sections with headings, and a conclusion. Headings are like signs in a building: they tell the reader where he is. Words like next, finally and as a result show how one idea leads to the next. This is how good textbooks and manuals teach.', q:'What does a heading do in an informative essay?', o:['It tells the reader what the next section is about.','It ends the essay.','It gives the writer\'s opinion.']},
{how:'The introduction tells the reader what he will learn, often by naming the parts. Read this essay.', q:'Which sentence tells what the essay will explain?', pic:WT8.bread, o:['It passed through three stages: the farm, the mill and the bakery.','Every Friday, fresh challah waits on the Shabbos table.','But that loaf took a long trip to get there.']},
{how:'Each heading matches what its section explains. Words like Next and Finally link the sections in order. Look at the section about crushing the grain.', q:'Which heading is over the section about crushing grain into flour?', pic:WT8.bread, o:['At the Mill','On the Farm','At the Bakery']},
],
practice:[
{q:'Under which heading would you add this fact: Bakers brush the challah with egg so it shines?', pic:WT8.bread, o:['At the Bakery','At the Mill','On the Farm'], h:'Match the fact to the section it explains. Ask yourself where the challah is being made.'},
{q:'Which word in the essay shows that the mill comes after the farm?', pic:WT8.bread, o:['Next','Heavy','soft'], h:'Transition words link one section to the next and show order. Look at the first word of the mill section.'},
{q:'An essay about penguins has a section headed Keeping Warm. Which detail belongs there?', o:['Thick feathers and a layer of fat hold in their body heat.','Penguins eat fish and squid.','Penguins cannot fly.'], h:'Every detail in a section must match its heading. Which fact is about staying warm?'},
{t:'order', q:'Put the parts of this essay about how a letter travels in order. Tap them in order.', tiles:['Have you ever wondered how a letter crosses the country in a few days? It makes three stops along the way.','At the Post Office: a clerk weighs the letter and makes sure it has a stamp.','At the Sorting Center: next, machines read the address and sort the letter by city.','On the Mail Route: finally, a mail carrier drops it into the right mailbox.','From one mailbox to another, every letter is carried by many careful hands.'], h:'The introduction tells what you will learn. The sections follow the order things happen, with words like next and finally. The conclusion wraps up.'},
{t:'write', q:'Choose something you know well, like how a sukkah is put up, how a bicycle is fixed, or how a baseball game is played. Write an informative essay: an introduction that tells what the reader will learn, at least two body sections, each with a heading and facts, and a conclusion. Use words like next, finally or as a result to link your ideas. Write in the box, or on paper and take a photo. Then tick each box.', min:0, checks:['My introduction tells the reader what he will learn.','I have at least two sections, each with a heading.','Every fact matches the heading it is under.','I used linking words, and my conclusion wraps up.']},
{q:'Read this new essay. One section has no heading. Which heading fits it best?', pic:WT8.storm, o:['After the Storm','Before the Storm','Buying a New Sled'], h:'A heading must match what its section explains. The other two sections tell what happens before and during the storm. When does this last section happen?'},
],
check:[
{q:'What should the introduction of an informative essay do?', o:['Tell the reader what he will learn.','Give every fact at once.','Argue that the reader is wrong.'], h:'The introduction is a map for the reader. It tells what is coming, and the sections give the facts.'},
{q:'Which linking words show that one idea causes another?', o:['as a result','also','for example'], h:'Look for the words that show cause and effect: one thing happens, and so another thing happens.'},
{q:'Which is the best conclusion for the essay about bread?', o:['From a tiny seed to a braided loaf, every challah is the work of many hands.','Wheat is a kind of grass.','Next, the grain goes to a mill.'], h:'A conclusion wraps up the whole essay. It does not add a new fact or start a new section. Which choice sums up the trip?'},
],

{how:'A simpler step: match one fact to one heading. Read the fact, then ask: which section is this about?', q:'An essay about a car trip has the headings Packing, On the Road and Arriving. Where does this fact go: We loaded the suitcases into the trunk.', o:['Packing','On the Road','Arriving']},
{how:'The skill underneath: Three-Part Piece (Writing Level 6) and Idea Links (Reading Level 8). An informative essay is a three-part piece with more body sections, and linking words show how one idea leads to another, just as you traced how ideas affect each other when you read.', q:'In a three-part piece, what does the introduction do?', o:['It grabs the reader and tells the main idea.','It gives the last word.','It lists every detail.']},
]}

],

const LR2={
'LANG.GRAM.L02.01':{name:'One or Many',
teach:[
{how:'Hello, word builder! A naming word can mean one thing or many things. One cat. Two cats. To show many, we usually add s to the end of the word. Knowing this helps you say and write exactly how many you mean.', q:'One cat, two of them. Which word fits? Cats, or cat?', pic:'🐱🐱', o:['cats','cat']},
{how:'Some words end in s, x, sh or ch. For those words, add es, so you can hear the extra part at the end: box, boxes. Dish, dishes.', q:'One box, two of them. Which word fits? Boxes, or boxs?', pic:'📦📦', o:['boxes','boxs']},
{how:'Look at the picture first. Only one thing? Keep the word just as it is. More than one? Add s or es.', q:'Look at the picture. Which word fits? Apples, or apple?', pic:'🍎🍎🍎', o:['apples','apple']},
],
practice:[
{q:'One dog, three of them. Which word fits? Dogs, or dog?', pic:'🐶🐶🐶', o:['dogs','dog'], h:'Count the dogs. More than one? Add s to the end of dog.'},
{q:'One dish, two of them. Which word fits? Dishes, or dishs?', pic:'🍽️🍽️', o:['dishes','dishs'], h:'Dish ends in sh. Words that end in sh get es. Say it slowly: dish-es.'},
{q:'Which word means just one? Hats, or hat?', o:['hat','hats'], h:'A word for many has an s at the end. Find the word with no s.'},
{q:'One fox, two of them. Which word fits? Foxes, or foxs?', pic:'🦊🦊', o:['foxes','foxs'], h:'Fox ends in x. Words that end in x get es. Say it slowly: fox-es.'},
{t:'write', q:'Get a pencil and paper, or write in the box. Draw two balls and write balls. Draw two boxes and write boxes. Take a photo of your paper. Then tick each box.', min:0, checks:['⚽ I wrote balls with an s.','📦 I wrote boxes with es.','✏️ My letters are neat.']},
{q:'Abba lit two of them for Shabbos. Which word fits? Candles, or candle?', pic:'🕯️🕯️', o:['candles','candle'], h:'Two means more than one. Add s to the end of candle.'},
],
check:[
{q:'One bus, two of them. Which word fits? Buses, or buss?', pic:'🚌🚌', o:['buses','buss'], h:'Bus ends in s. Words that end in s get es. Say it slowly: bus-es.'},
{q:'One book, five of them. Which word fits? Books, or book?', pic:'📕📕📕📕📕', o:['books','book'], h:'Five means more than one. Add s to the end of book.'},
{q:'One lunch, two of them. Which word fits? Lunches, or lunchs?', o:['lunches','lunchs'], h:'Lunch ends in ch. Words that end in ch get es. Say it slowly: lunch-es.'},
],
re:[
{how:'A new way: listen. Say the word for many out loud. Do you hear an extra part at the end, like box-es? Then write es. No extra part, like cat-s? Then write just s.', q:'Say it out loud: one glass, two of them. Which word fits? Glasses, or glasss?', o:['glasses','glasss']},
{how:'A simpler step: just count. One thing gets no s. Two or more things get an s.', q:'How many stars? Two stars, or one star?', pic:'⭐⭐', o:['two stars','one star']},
{how:'The skill underneath: Naming Words (Language Arts Level 1). A naming word names a person, a place or a thing. Naming words are the words that get s or es for many.', q:'Which one is a naming word? Hat, run, or big?', o:['hat','run','big']},
]},

'LANG.GRAM.L02.02':{name:'Describing Words',
teach:[
{how:'Describing words tell what something is like: its color, its size, its shape, or how it feels. A red ball. A big dog. A soft pillow. Describing words paint a picture in the reader\'s head, so your writing comes alive!', q:'The red ball. Which word describes the ball? Red, or ball?', pic:'🔴', o:['red','ball']},
{how:'Ask the question: what kind? The tall tree. What kind of tree? A tall tree. The word that answers what kind is the describing word.', q:'The tall tree. What kind of tree? Tall, or tree?', pic:'🌳', o:['tall','tree']},
{how:'Describing words can also tell how something tastes, feels or sounds: a sweet apple, a soft hat, a loud shofar.', q:'The sweet apple. Which word tells how it tastes? Sweet, or apple?', pic:'🍎', o:['sweet','apple']},
],

{t:'write', q:'Pick something in your room. Draw it, and write two describing words about it, like soft and blue. Write in the box, or on paper and take a photo. Then tick each box.', min:0, checks:['👀 I wrote a word for how it looks.','✋ I wrote a word for how it feels or sounds.','✏️ My words tell what my thing is like.']},
{q:'Read the sentence. Which word describes the shofar? Loud, woke, or up?', pic:'The loud shofar woke us up.', o:['loud','woke','up'], h:'Ask: what kind of shofar? Woke is an action word.'},
],
check:[
{q:'The round plate. Which word describes the plate? Round, or plate?', pic:'🍽️', o:['round','plate'], h:'Ask: what kind of plate? The word that answers is the describing word.'},
{q:'Which one is a describing word? Big, jump, or eat?', o:['big','jump','eat'], h:'Jump and eat are things you do. Which word tells what something is like?'},
{q:'Pick the best describing word for an ice cube. Cold, or hot?', pic:'🧊', o:['cold','hot'], h:'Think about holding an ice cube in your hand. How does it feel?'},
],

{how:'A simpler step: just colors. Every color word is a describing word.', q:'Which word is a color word? Blue, or sit?', o:['blue','sit']},
{how:'The skill underneath: Action Words (Language Arts Level 1). Action words tell what someone does. Describing words are different: they tell what something is like.', q:'Which word is an action word? Run, red, or big?', o:['run','red','big']},
]},

'LANG.GRAM.L02.03':{name:'Then and Now',
teach:[
{how:'Action words can tell WHEN something happens. Now: I jump. Before, like yesterday: I jumped. Later, like tomorrow: I will jump. Picking the right one tells the reader exactly when, like a little clock inside your sentence!', q:'Yesterday I did it. Which words fit? I jumped, or I will jump?', o:['I jumped','I will jump']},
{how:'To tell about before, we often add ed to the end of the action word: play, played. Clue words like yesterday and last week tell you it already happened.', q:'Last week we did it. Which word fits? Played, or play?', pic:'Last week we ___ ball.', o:['played','play']},
{how:'To tell about later, put the word will in front of the action word: will go, will help. Clue words like tomorrow and next week tell you it has not happened yet.', q:'Tomorrow we will do it. Which words fit? Will go, or went?', pic:'Tomorrow we ___ to the park.', o:['will go','went']},
],
practice:[
{q:'Yesterday Avi did it. Which words fit? Cleaned, or will clean?', pic:'Yesterday Avi ___ his room.', o:['cleaned','will clean'], h:'Yesterday means before. Add ed to the action word: clean, cleaned.'},
{q:'Tomorrow Dovi will do it. Which words fit? Will help, or helped?', pic:'Tomorrow Dovi ___ his Zeidy.', o:['will help','helped'], h:'Tomorrow means later. Put will in front of the action word.'},
{q:'Eli is doing it right now. Which word fits? Kicks, or kicked?', pic:'Right now Eli ___ the ball.', o:['kicks','kicked'], h:'Right now means now. An action word for now has no ed.'},
{q:'Last night we did it. Which words fit? Played, or will play?', pic:'Last night we ___ a game.', o:['played','will play'], h:'Last night already happened. Add ed to the action word: play, played.'},
{t:'write', q:'Write a sentence about something you did yesterday. Use an action word that ends in ed, like: I played ball. Write in the box, or on paper and take a photo. Then tick each box.', min:0, checks:['🕒 My sentence tells about yesterday.','➕ My action word ends in ed.','🔠 I started with a big letter and ended with a period.']},
{q:'Read the three sentences. Which one tells about later? I will help Rebbi, I helped Zeidy, or I help Abba?', pic:'Today I help Abba.\nYesterday I helped Zeidy.\nTomorrow I will help Rebbi.', o:['I will help Rebbi','I helped Zeidy','I help Abba'], h:'Later means it has not happened yet. Look for the word will.'},
],
check:[
{q:'Yesterday Shmuel did it. Which words fit? Missed, or will miss?', pic:'Yesterday Shmuel ___ the bus.', o:['missed','will miss'], h:'Yesterday already happened. Add ed to the action word: miss, missed.'},
{q:'Next week we will do it. Which words fit? Will walk, or walked?', pic:'Next week we ___ to Zeidy\'s house.', o:['will walk','walked'], h:'Next week has not happened yet. Put will in front of the action word.'},
{q:'Which word is a clue for BEFORE? Yesterday, or tomorrow?', o:['yesterday','tomorrow'], h:'Before means it already happened. Which day already happened?'},
],
re:[
{how:'A new way: a time line. Point behind you for yesterday: add ed. Point at yourself for now. Point in front of you for tomorrow: put will in front.', q:'Point in front of you, to tomorrow. Which words fit? Will jump, or jumped?', o:['will jump','jumped']},
{how:'A simpler step: one word, with ed or without. If it already happened, add ed.', q:'It already happened. Which word fits? Walked, or walk?', o:['walked','walk']},
{how:'The skill underneath: Action Words (Language Arts Level 1). First find the action word, the word that tells what someone does. Then change it to show when.', q:'Eli kicks the ball. Which one is the action word? Kicks, or ball?', pic:'Eli kicks the ball.', o:['kicks','ball']},
]},

'LANG.MECH.L02.01':{name:'Asking or Telling',
teach:[
{how:'Every sentence ends with a mark that tells you how to say it. A telling sentence ends with a period, a little dot. An asking sentence ends with a question mark. A sentence with a big feeling ends with an exclamation mark. The right mark helps the reader hear your voice!', q:'This sentence asks about cake. Which mark goes at the end? A question mark, or a period?', pic:'Do you like cake', o:['? a question mark','. a period']},
{how:'Asking sentences often start with words like who, what, where, when, can, do or is. When you see one of these words at the start, check for a question.', q:'Which one is an asking sentence? Where is my hat, or my hat is red?', o:['Where is my hat?','My hat is red.']},
{how:'A sentence with a big feeling, like surprise or joy, ends with an exclamation mark. It looks like a tall line with a dot under it.', q:'Which one shows a big feeling? We won, or we sat?', o:['We won!','We sat.']},
],
practice:[
{q:'This sentence tells about the sun. Which mark goes at the end? A period, or a question mark?', pic:'The sun is hot', o:['. a period','? a question mark'], h:'It tells you something. It does not ask. Telling sentences end with a period.'},
{q:'This sentence starts with Can. Which mark goes at the end? A question mark, or a period?', pic:'Can you help me', o:['? a question mark','. a period'], h:'It starts with Can, an asking word. Asking sentences end with a question mark.'},
{q:'This sentence shows surprise about snow. Which mark goes at the end? An exclamation mark, or a period?', pic:'Look, it is snowing', o:['! an exclamation mark','. a period'], h:'Surprise is a big feeling. Big feelings end with an exclamation mark.'},
{q:'Which one asks with the right mark: the one that ends with a question mark, or the one that ends with a period?', pic:'Is it Shabbos today', o:['Is it Shabbos today?','Is it Shabbos today.'], h:'It starts with Is, an asking word. Look at the very end of each one.'},
{t:'write', q:'Write one telling sentence and one asking sentence about your yeshiva. Write in the box, or on paper and take a photo. Then tick each box.', min:0, checks:['⚫ My telling sentence ends with a period.','❓ My asking sentence ends with a question mark.','🔠 Each sentence starts with a big letter.']},
{q:'Rebbi asked a question. Which mark goes at the end of Rebbi\'s words? A question mark, or a period?', pic:'Rebbi asked: What day is it today\nDovi said: Today is Sunday', o:['? a question mark','. a period'], h:'Rebbi asked, so his words are a question. They start with What, an asking word.'},
],
check:[
{q:'This sentence starts with Where. Which mark goes at the end? A question mark, or a period?', pic:'Where is the bus', o:['? a question mark','. a period'], h:'It starts with Where, an asking word.'},
{q:'This sentence tells about a new sefer. Which mark goes at the end? A period, or a question mark?', pic:'I like my new sefer', o:['. a period','? a question mark'], h:'It tells you something. Telling sentences end with a period.'},
{q:'This sentence shows a big feeling about a rainbow. Which mark goes at the end? An exclamation mark, or a question mark?', pic:'Wow, a rainbow', o:['! an exclamation mark','? a question mark'], h:'Wow shows surprise. Big feelings end with an exclamation mark.'},
],
re:[
{how:'A new way: listen to your voice. When you ask, your voice goes up at the end. When you tell, it stays flat. When you are excited, it gets loud.', q:'Say the sentence in the box. Does your voice go up at the end, like asking? Yes, it asks, or no, it tells?', pic:'Is it time for lunch', o:['yes, it asks','no, it tells']},
{how:'A simpler step: just two marks. An asking sentence gets a question mark. A telling sentence gets a period.', q:'An asking sentence gets which mark? A question mark, or a period?', o:['? a question mark','. a period']},
{how:'The skill underneath: My First Sentence (Writing Level 1). Every sentence starts with a big letter and ends with a mark.', q:'Where does the end mark go? At the end, or at the start?', o:['at the end','at the start']},
]},

'LANG.MECH.L02.02':{name:'Proper Names',

{how:'Some words are special names: a person\'s name, like Avi, the days of the week, like Sunday, and the months, like March. Special names always start with a big, capital letter, even in the middle of a sentence. The big letter shows the reader: this is a name!', q:'Which one is written the right way? Sunday with a big S, or sunday with a small s?', o:['Sunday','sunday']},

{q:'Read what Zeidy said. Which word needs a big letter? June, or visit?', pic:'Zeidy said, "I will visit in june."', o:['june','visit'], h:'Look for the name of a month. Visit is an action word, not a name.'},

check:[
{q:'Which one is written the right way? Tuesday with a big T, or tuesday with a small t?', o:['Tuesday','tuesday'], h:'Days of the week are special names. They start with a big letter.'},

{how:'The skill underneath: Asking or Telling (Language Arts Level 2). A sentence starts with a big letter and ends with a mark. Now add one more rule: names get a big letter too.', q:'Where does every sentence get a big letter? At the start, or at the end?', o:['at the start','at the end']},

'LANG.MECH.L02.03':{name:'Pattern Speller',
teach:[

{how:'After a short vowel, the k sound at the end of a word is often spelled ck: duck, back, sock.', q:'Which one spells duck? Duck with c and k, or duk?', pic:'🦆', o:['duck','duk']},

'LANG.MECH.L09.01':{name:'Punctuation Pro',
teach:[
{how:'Punctuation is like the signs on a road: it tells the reader where to pause, stop or turn. Today you learn two strong marks. A dash (—) makes a sharp break, to add a surprise or an explanation. An ellipsis (...) shows a trailing pause, or words left out of a quotation. Used well, they make your writing sound like real speech.', q:'Which mark makes a sharp break in a sentence?', o:['a dash —','an ellipsis ...','a comma ,']},
{how:'Use a dash to set off a surprising or important part, or to explain what came before: We forgot one thing — the tickets!', q:'Which mark belongs in the blank?', pic:'Shimon packed everything for the trip ___ except his tefillin.', o:['—','...','?']},
{how:'Use an ellipsis to show a pause in speech or thought, or to show that words were left out of a quotation.', q:'Which sentence uses an ellipsis to show a pause?', o:['"Well... I think I left it at home," Ari said.','"Well — I left it at home!" Ari said.','"Well, I left it at home," Ari said.']},
],
practice:[
{q:'Which mark fits best in the blank?', pic:'The answer was simple ___ review every day.', o:['—','...','?'], h:'The second part explains the first with a sharp break. Which mark sets off an explanation?'},
{q:'Which mark fits best in the blank?', pic:'"I wonder ___ maybe we should ask the rebbe."', o:['...','—','!'], h:'The speaker slows down and pauses to think. Which mark shows a soft, trailing pause?'},
{q:'Words were left out of a quotation. Which mark shows where?', pic:'Original: "Learn every day, even when you are tired, and you will grow." Short: "Learn every day ___ and you will grow."', o:['...','—','()'], h:'When you leave words out of a quote, an ellipsis marks the gap.'},
{t:'order', q:'Build the sentence with a dash. Tap the parts in order.', tiles:['Only one thing could stop us','—','the snow.'], h:'Say the main idea first. Then the dash. Then the surprise.'},
{t:'write', q:'Write three sentences about a Yom Tov or a trip: one with a dash that adds a surprise, one with an ellipsis that shows someone pausing, and one quotation with words left out. Write in the box, or on paper and take a photo. Then tick each box.', min:0, checks:['I used a dash for a sharp break.','I used an ellipsis for a pause.','I used an ellipsis to show words left out.']},
{q:'In a story, Yossi is cut off suddenly in the middle of speaking. Which line shows that best?', o:['"Wait, I need to tell you about the —"','"Wait, I need to tell you about the..."','"Wait, I need to tell you about the."'], h:'A sudden cut-off is a sharp break. A voice that fades slowly is a different mark.'},

check:[

]},

 var SW={"skills": ["LANG.MECH.L02.03", "READ.LV.L02.01", "READ.LV.L02.02", "READ.PHON.L02.03"], "map": [["The skill underneath: Sound It Out (Language Arts Level 1) and Magic E (Reading Level 2). Say each sound slowly, and remember that a quiet e at the end makes the vowel say its name.", "The skill underneath: Sound It Out (Language Arts Level 1) and Silent E (Reading Level 2). Say each sound slowly, and remember that a quiet e at the end makes the vowel say its name."], ["Magic e: an e at the end is quiet, but it makes the vowel say its name. Kit becomes kite. Cap becomes cape.", "Silent e: an e at the end is quiet, but it makes the vowel say its name. Kit becomes kite. Cap becomes cape."], ["\ud83c\udf82 I put a magic e on cake.", "\ud83c\udf82 I put a silent e on cake."], ["Magic E", "Silent E"], ["oa says the name of o: b-oa-t, boat. g-oa-t, goat. It is the same long sound you heard with Magic E.", "oa says the name of o: b-oa-t, boat. g-oa-t, goat. It is the same long sound you heard with Silent E."], ["Two letters the same? Split between them: rab | bit, rabbit. A part can have Magic E: cup | cake, cupcake.", "Two letters the same? Split between them: rab | bit, rabbit. A part can have Silent E: cup | cake, cupcake."]], "expect": 18};
 var MAP=[], LAST={};
 function rx(n){ return new RegExp('(^|[^A-Za-z])'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![A-Za-z])','g'); }
 function fem(t){ return String(t).replace(/\bHimself\b/g,'Herself').replace(/\bhimself\b/g,'herself').replace(/\bHe\b/g,'She').replace(/\bhe\b/g,'she').replace(/\bHis\b/g,'Her').replace(/\bhis\b/g,'her').replace(/\bhim\b/g,'her'); }

"The Lost Siddur\nOn Rosh Chodesh, Yaakov brought his new siddur to yeshiva. It had a blue cover with his name stamped in gold. It was a birthday gift from his Zeidy.\nAfter Shacharis, Yaakov went out for recess. When he came back, the siddur was gone from his desk. He looked under the desk, in his knapsack and on the shelf. It was nowhere.\nYaakov's eyes filled with tears. \"Zeidy gave it to me,\" he told his rebbe.\nThe rebbe did not get angry. He asked the whole class to help. The boys split up. Two boys checked the beis medrash. Two boys checked the lunchroom. Yaakov and his friend Nosson checked the hallway.\nNosson noticed something blue on top of the lost-and-found box near the office. He ran over. It was the siddur! A first grader had found it on the floor near the door and had brought it there.\nYaakov hugged his siddur. Then he went to find the first grader and thanked him. \"You did a real mitzvah,\" he said. \"You returned something that was lost.\"\nThat night, Yaakov wrote his name inside the cover in big letters, so that if the siddur ever got lost again, anyone could bring it back to him.",
"The Lost Siddur\nOn Rosh Chodesh, Meshulam brought his new siddur to yeshiva. It had a blue cover with his name stamped in gold. It was a birthday gift from his Saba.\nAfter Shacharis, Meshulam went out for recess. When he came back, the siddur was gone from his desk. He looked under the desk, in his knapsack and on the shelf. It was nowhere.\nMeshulam's eyes filled with tears. \"Saba gave it to me,\" he told his rebbe.\nThe rebbe did not get angry. He asked the whole class to help. The boys split up. Two boys checked the beis medrash. Two boys checked the lunchroom. Meshulam and his friend Ariel checked the hallway.\nAriel noticed something blue on top of the lost-and-found box near the office. He ran over. It was the siddur! A first grader had found it on the floor near the door and had brought it there.\nMeshulam hugged his siddur. Then he went to find the first grader and thanked him. \"You did a real mitzvah,\" he said. \"You returned something that was lost.\"\nThat night, Meshulam wrote his name inside the cover in big letters, so that if the siddur ever got lost again, anyone could bring it back to him.",
