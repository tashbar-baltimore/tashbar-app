 air in a balloon. Matter like that is a ____.","a":"gas","alt":["a gas","gases"],"kb":"abc","h":"Think back to Solids, Liquids and Gases.","pic":"🌦️","why":"A gas! Its tiny bits are far apart and spread out to fill any space."},{"t":"num","q":"Review: most of the air is nitrogen, N₂, and oxygen, O₂. How many atoms are in one N₂ molecule and one O₂ molecule together?","a":4,"h":"Think back to Atoms Join Up. Read the little numbers.","pic":"🌦️","why":"N₂ has 2 atoms and O₂ has 2 atoms. 2 + 2 = 4."}],"check":[{"q":"Where is the air pressure the lowest?","o":["on a high mountaintop","at the seashore","in a low valley"],"h":"Where is the least air stacked above?","pic":"🌦️"},{"t":"num","q":"A barometer read 1,020 millibars on Sunday and 1,004 on Monday. By how many millibars did it fall?","a":16,"h":"Subtract Monday from Sunday.","pic":"🌦️"},{"t":"order","q":"Put the places in order, highest air pressure to lowest.","tiles":["a beach by the sea","a town on a hill","a mountain village","the top of a tall mountain"],"h":"Start where the most air is stacked above.","pic":"🌦️"}],"re":[{"t":"pairs","q":"Game: match each air word to its meaning.","pairs":[["air pressure","the push of air on things"],["barometer","a tool that measures air pressure"],["altitude","how high up a place is"]],"h":"Which word is a tool?","pic":"🌦️"},{"t":"sort","q":"Simpler: more air stacked above, or less?","bins":[{"id":"M","label":"more air above"},{"id":"L","label":"less air above"}],"items":[{"label":"the beach","bin":"M"},{"label":"a basement","bin":"M"},{"label":"a deep valley","bin":"M"},{"label":"a mountaintop","bin":"L"},{"label":"the top of a tall tower","bin":"L"},{"label":"a plane high in the sky","bin":"L"}],"h":"Is it low down, or high up?","pic":"🌦️"},{"t":"spotall","q":"Back to basics: tap every true thing about a gas.","cells":[{"label":"it spreads out to fill its space","ok":true},{"label":"its bits are far apart","ok":true},{"label":"you can squeeze it smaller","ok":true},{"label":"it keeps its own shape","ok":false},{"label":"its bits are packed tight","ok":false}],"h":"Think back to Solids, Liquids and Gases.","pic":"🌦️"}]},"SCI.SKY.L08.02":{"name":"High Runs to Low","band":"5-6","teach":[{"how":"Step 1. Air always moves from high pressure toward low pressure, like air rushing out of an open balloon. That moving air is wind. The bigger the difference, the stronger the wind.","q":"Air moves from where the pressure is high to where it is low. What do we call that moving air?","o":["wind","fog","frost"],"h":"Think of a flag flapping.","pic":"🌦️","why":"A balloon has high pressure inside. Let go of the neck, and the air rushes out toward the lower pressure around it."},{"how":"Step 2. The sun heats land faster than water. Warm air over the hot land rises, and that leaves lower pressure there.","q":"On a sunny day, which warms up faster?","o":["the land","the sea","they warm the same"],"h":"By noon, is the sidewalk hot, or the lake?","pic":"🌦️","why":"A sidewalk is hot by noon, while the lake is still cool. Water takes much longer to warm up, and to cool down."},{"how":"Step 3. By day, cool air from over the water flows in to fill the low over the land: a sea breeze. At night the land cools faster, so the breeze turns around: a land breeze.","q":"On a sunny afternoon at the shore, which way does the breeze blow?","o":["from the sea to the land","from the land to the sea","straight up into space"],"h":"Where is the high pressure: over the cool sea, or the hot land?","pic":"🌦️","why":"A wind is named for where it comes FROM. A sea breeze comes from the sea."}],"we":[{"q":"At 3 in the afternoon, Yonatan sees the flag on the pier stream out toward the land. Which way is the wind blowing?","o":["from the sea toward the land","from the land toward the sea"],"steps":["A flag streams out the way the wind blows.","It streams toward the land.","So the air is moving…"],"pic":"🌦️"},{"q":"At night, the land cools faster than the lake. Where is the air pressure higher now?","o":["over the cooler land","over the warmer lake"],"steps":["Cool air sinks and presses harder.","At night, the land is the cooler side.","So the high pressure is…"],"pic":"🌦️"}],"practice":[{"t":"sort","q":"Sort them: a sea breeze, or a land breeze?","bins":[{"id":"S","label":"sea breeze: from the water"},{"id":"L","label":"land breeze: from the land"}],"items":[{"label":"a sunny afternoon at the shore","bin":"S"},{"label":"cool air rushing in off the water","bin":"S"},{"label":"the land is hotter than the sea","bin":"S"},{"label":"a clear night by the shore","bin":"L"},{"label":"air flowing out over the water","bin":"L"},{"label":"the land is cooler than the sea","bin":"L"}],"h":"High Runs to Low! Which side is cooler, with the higher pressure?","pic":"🌦️","why":"By day the land is hotter, so air flows in from the sea. At night the land is cooler, so air flows out from the land."},{"t":"order","q":"Put the sea breeze in order.","tiles":["the sun heats the land","warm air over the land rises","the pressure over the land drops","cool air flows in from the sea"],"h":"What does the sun do first?","pic":"🌦️","why":"Heat makes the air over the land rise. That leaves low pressure, and cool air from the sea rushes in to fill it."},{"t":"num","q":"A high-pressure area reads 1,030 millibars and a low nearby reads 990. What is the difference in millibars?","a":40,"h":"Take the low reading away from the high one.","pic":"🌦️","why":"1,030 − 990 = 40 millibars. A big difference like that makes strong winds."},{"t":"pairs","q":"Match each weather tool to what it measures.","pairs":[["wind vane","which way the wind comes from"],["anemometer","how fast the wind blows"],["barometer","air pressure"]],"h":"One of them has spinning cups.","pic":"🌦️","why":"A wind vane turns to face the wind. An anemometer spins faster in stronger wind. A barometer reads air pressure."},{"t":"type","q":"Review: the tool that measures air pressure is called a ____.","a":"barometer","alt":["a barometer","barometers"],"kb":"abc","h":"Think back to the skill before this one.","pic":"🌦️","why":"A barometer! Falling pressure often warns of clouds and storms."},{"t":"spotall","q":"Review: tap every temperature at which water is frozen solid.","cells":[{"label":"−10 °C","ok":true},{"label":"−3 °C","ok":true},{"label":"−20 °C","ok":true},{"label":"5 °C","ok":false},{"label":"25 °C","ok":false}],"h":"Think back to Temperature and Thermometers. Where does water start to freeze?","pic":"🌦️","why":"Water freezes at 0 °C. Every temperature below zero keeps it frozen solid."}],"check":[{"q":"Wind blows from where to where?","o":["from high pressure to low","from low pressure to high","from the clouds to the ground"],"h":"Think of air rushing out of a balloon.","pic":"🌦️"},{"t":"num","q":"The low over the hot land reads 1,008 millibars. Over the cool sea it is 1,014. How many millibars higher is the sea side?","a":6,"h":"Subtract the land reading from the sea reading.","pic":"🌦️"},{"t":"order","q":"Put the land breeze at night in order.","tiles":["the sun goes down","the land cools off fast","the air over the land sinks and presses harder","cool air flows out over the sea"],"h":"What has to happen before the land can cool?","pic":"🌦️"}],"re":[{"t":"pairs","q":"Game: match each breeze word to its meaning.","pairs":[["sea breeze","wind from the water, by day"],["land breeze","wind from the land, at night"],["wind","air moving from high to low"]],"h":"Which one blows at night?","pic":"🌦️"},{"t":"sort","q":"Simpler: which gets hot fast in the sun, and which stays cool?","bins":[{"id":"F","label":"heats up fast"},{"id":"S","label":"heats up slowly"}],"items":[{"label":"a sidewalk","bin":"F"},{"label":"a sandy path","bin":"F"},{"label":"a parked car","bin":"F"},{"label":"a pond","bin":"S"},{"label":"a lake","bin":"S"},{"label":"a big pot of water","bin":"S"}],"h":"Is it made of water, or not?","pic":"🌦️"},{"t":"type","q":"Back to basics: air that moves from place to place is called the ____.","a":"wind","alt":["winds","breeze","a breeze"],"kb":"abc","h":"What pushes a sailboat across a lake?","pic":"🌦️"}]},"SCI.SKY.L08.03":{"name":"When Air Masses Meet","band":"5-6","teach":[{"how":"Step 1. An air mass is a giant body of air, bigger than many states, the same all through. It takes on the place where it formed: over an ocean, humid; over land, dry; near the poles, cold; near the middle of the earth, warm.","q":"An air mass that formed over a warm ocean is warm and…","o":["humid","dry","frozen"],"h":"What does air pick up when it sits over water for days?","pic":"🌦️","why":"Air that sits over warm water for days soaks up water vapor, like a sponge."},{"how":"Step 2. A front is the edge where two air masses meet. The weather changes fast along a front. On a map, a cold front is a blue line with triangles. A warm front is a red line with half-circles.","q":"Where two different air masses meet, the edge between them is called a…","o":["front","fence","field"],"h":"Think of the line where two teams face each other.","pic":"🌦️","why":"The two air masses do not mix easily, like oil and vinegar in a jar."},{"how":"Step 3. Heavy cold air shoves under warm air and lifts it up fast. The rising air builds tall clouds: short, strong storms, then cool, clear air. A warm front slides up slowly: long, gentle rain, then warmer air.","q":"A cold front pushes in. What happens to the warm air in its way?","o":["it is pushed up fast","it sinks under the ground","it turns into snow"],"h":"Cold air is heavy. Where does it go: over, or under?","pic":"🌦️","why":"Fast lifting builds tall thunderclouds. Slow sliding builds flat, layered clouds."}],"we":[{"q":"On the weather map, Mordechai sees a blue line with triangles heading toward town. What is coming?","o":["a cold front","a warm front"],"steps":["Look at the color and the shapes.","Blue with triangles is one kind of front.","So the map shows…"],"pic":"🌦️"},{"q":"After a short, strong storm, Ahuva feels the air turn cool and dry, and the sky clears. Which front just passed?","o":["a cold front","a warm front"],"steps":["Which front brings a short, strong storm?","After it, the air turns cooler and drier.","So the front was…"],"pic":"🌦️"}],"practice":[{"t":"sort","q":"Sort them: cold front, or warm front?","bins":[{"id":"C","label":"cold front"},{"id":"W","label":"warm front"}],"items":[{"label":"blue line with triangles","bin":"C"},{"label":"short, strong thunderstorms","bin":"C"},{"label":"cooler air afterward","bin":"C"},{"label":"red line with half-circles","bin":"W"},{"label":"long, gentle rain","bin":"W"},{"label":"warmer, muggy air afterward","bin":"W"}],"h":"Who Is Pushing In? Heavy cold air shoves; warm air slides.","pic":"🌦️","why":"Cold fronts lift warm air fast: quick storms, then cooler air. Warm fronts slide in slowly: long rain, then warmer air."},{"t":"pairs","q":"Match each air mass to where it formed.","pairs":[["cold and dry","over frozen land near the pole"],["warm and humid","over a warm ocean"],["hot and dry","over a desert"]],"h":"Ask two things: warm or cold place? Water or land?","pic":"🌦️","why":"An air mass takes on its birthplace: warm or cold from how far it is from the poles, humid or dry from water or land below it."},{"t":"spotall","q":"Tap every thing that often happens as a cold front passes.","cells":[{"label":"the wind shifts","ok":true},{"label":"tall clouds build up","ok":true},{"label":"a burst of heavy rain","ok":true},{"label":"a week of gentle drizzle","ok":false},{"label":"the air turns much warmer","ok":false}],"h":"Who Is Pushing In? Fast lifting makes what kind of clouds?","pic":"🌦️","why":"A cold front lifts air fast: tall clouds, a burst of rain and a shift in the wind. Afterward it gets cooler, not warmer."},{"t":"num","q":"Before the cold front it was 24 °C. After it passed it was 15 °C. How many degrees did it drop?","a":9,"h":"Subtract the after reading from the before reading.","pic":"🌦️","why":"24 − 15 = 9 degrees. Cold fronts can drop the temperature fast."},{"t":"type","q":"Review: a breeze that blows in from the water on a sunny afternoon is a ____ breeze.","a":"sea","alt":["sea breeze","a sea breeze","lake","lake breeze"],"kb":"abc","h":"Think back to the skill before this one. Where is the cool air by day?","pic":"🌦️","why":"A sea breeze! By day the land is hot, so cool air flows in from the water."},{"t":"order","q":"Review: put the steps in order: how rising air makes rain.","tiles":["warm air carries water vapor up","the air cools high up","the vapor turns into cloud droplets","the drops grow heavy and fall"],"h":"Think back to The Water Cycle. What has to happen before a cloud forms?","pic":"🌦️","why":"Rising air cools. Cool vapor turns into droplets, clouds form, and heavy drops fall as rain."}],"check":[{"q":"On a weather map, which sign shows a warm front?","o":["a red line with half-circles","a blue line with triangles","a green line with stars"],"h":"Warm is red. What shapes ride on the red line?","pic":"🌦️"},{"t":"num","q":"A cold front moves 30 kilometers each hour. How far does it move in 4 hours?","a":120,"h":"Multiply the distance each hour by the hours.","pic":"🌦️"},{"t":"spotall","q":"Tap every sign that a warm front is on its way.","cells":[{"label":"thin, high clouds spread in","ok":true},{"label":"a long, steady rain","ok":true},{"label":"it gets warmer after","ok":true},{"label":"sudden hail and thunder","ok":false},{"label":"a sharp chill after","ok":false}],"h":"Who Is Pushing In? Warm air slides up slowly.","pic":"🌦️","chk":true}],"re":[{"t":"pairs","q":"Game: match each front word to its meaning.","pairs":[["air mass","a giant body of air, the same all through"],["front","the edge where two air masses meet"],["humid","full of water vapor"]],"h":"Which word is an edge?","pic":"🌦️"},{"t":"sort","q":"Simpler: which air is heavier, and which is lighter?","bins":[{"id":"H","label":"heavier: it sinks"},{"id":"L","label":"lighter: it rises"}],"items":[{"label":"cold air","bin":"H"},{"label":"air over ice","bin":"H"},{"label":"air in a freezer","bin":"H"},{"label":"warm air","bin":"L"},{"label":"air over a hot stove","bin":"L"},{"label":"air in a hot attic","bin":"L"}],"h":"Is it cold, or warm?","pic":"🌦️"},{"t":"type","q":"Back to basics: when water vapor cools and turns back into tiny drops, it is called ____.","a":"condensation","alt":["condensing","condense","condenses"],"kb":"abc","h":"Think back to The Water Cycle. Picture drops on a cold cup.","pic":"🌦️"}]},"SCI.SKY.L08.04":{"name":"Be the Forecaster","band":"5-6","teach":[{"how":"Step 1. On a weather map, H marks high pressure: sinking air and mostly fair weather. L marks low pressure: rising air, clouds, and often rain or snow.","q":"On a weather map, what does a big blue H stand for?","o":["an area of high pressure","a place called Highland","heavy hail"],"h":"Think back to air pressure.","pic":"🌦️","why":"Forecasters watch where the H’s and L’s are moving, like pieces on a game board."},{"how":"Step 2. Here, most weather moves from west to east, carried by strong winds high up. So to see tomorrow’s weather, look at what is west of you today.","q":"In our part of the world, weather usually moves in which direction?","o":["from west to east","from east to west","from south to north"],"h":"Look West! Where does tomorrow’s weather come from?","pic":"🌦️","why":"If it is raining in Ohio today, Baltimore may get rain tomorrow. Ohio is west of us."},{"how":"Step 3. A chance of rain tells how likely rain is, out of 100. 70% means rain is likely: about 7 times out of 10, days like this bring rain. 20% means probably dry.","q":"The forecast says “70% chance of rain.” What does that mean?","o":["rain is likely, 7 out of 10","it will rain 70 minutes","70 drops will fall"],"h":"A percent is out of 100.","pic":"🌦️","why":"A forecast is a careful prediction, not a promise. The chance number tells how sure the forecaster is."}],"we":[{"q":"Binyamin sees an L over Chicago, west of Baltimore, moving east. What should Baltimore expect soon?","o":["clouds and rain","a sunny, dry day"],"steps":["L means low pressure: rising air.","Weather here moves west to east.","So the low is bringing Baltimore…"],"pic":"🌦️"},{"q":"Raizy’s forecast card says 20% chance of rain. Can the class plan the picnic outside?","o":["yes, rain is unlikely","no, it will surely rain"],"steps":["20% is out of 100.","That is only 2 times out of 10.","So rain is…"],"pic":"🌦️"}],"practice":[{"t":"pairs","q":"Match each map sign to its meaning.","pairs":[["H","high pressure: fair weather"],["L","low pressure: clouds and rain"],["blue line with triangles","a cold front"]],"h":"Look West! Then read each sign like a forecaster.","pic":"🌦️","why":"H is high pressure and fair skies. L is low pressure and wet weather. A blue line with triangles is a cold front."},{"t":"sort","q":"Sort them: good day for the outdoor trip, or keep a backup plan?","bins":[{"id":"G","label":"good to go"},{"id":"B","label":"keep a backup plan"}],"items":[{"label":"10% chance of rain","bin":"G"},{"label":"a high moving in","bin":"G"},{"label":"a rising barometer","bin":"G"},{"label":"80% chance of rain","bin":"B"},{"label":"a low moving in","bin":"B"},{"label":"a cold front arriving that afternoon","bin":"B"}],"h":"Ask of each card: fair weather, or wet weather?","pic":"🌦️","why":"Low chances, highs and rising pressure mean fair weather. High chances, lows and fronts mean rain."},{"t":"num","q":"The forecast shows a high of 18 °C and a low of 7 °C. How many degrees apart are they?","a":11,"h":"Subtract the low from the high.","pic":"🌦️","why":"18 − 7 = 11 degrees between the warmest and coolest part of the day."},{"t":"spotall","q":"Tap every sign on this map that wet weather may be coming.","cells":[{"label":"an L moving toward us","ok":true},{"label":"a cold front to the west","ok":true},{"label":"a falling barometer","ok":true},{"label":"an H sitting over us","ok":false},{"label":"a rising barometer","ok":false}],"h":"Look West! Which signs mean rising air?","pic":"🌦️"},{"t":"type","q":"Review: the edge where a cold air mass and a warm air mass meet is called a ____.","a":"front","alt":["a front","fronts","weather front"],"kb":"abc","h":"Think back to the skill before this one.","pic":"🌦️","why":"A front! The weather changes fast along it."},{"t":"num","q":"Review: on Sunday the barometer read 1,012 millibars. By Tuesday it had risen 9 more. What does it read now?","a":1021,"h":"Think back to Air Has Weight. Add the rise.","pic":"🌦️","why":"1,012 + 9 = 1,021 millibars. Rising pressure often means fair weather is coming."}],"check":[{"q":"Which forecast is the best day to dry the laundry outside?","o":["sunny, 10% chance of rain","cloudy, 60% chance of rain","stormy, 90% chance of rain"],"h":"Which day has the lowest chance of rain?","pic":"🌦️"},{"t":"num","q":"The forecast gives a 30% chance of rain. Out of 10 days like this, on about how many does rain fall?","a":3,"h":"30 out of 100 is how many out of 10?","pic":"🌦️"},{"t":"order","q":"A storm is over Chicago on Sunday. Put the cities in the order it will likely reach them.","tiles":["Chicago","Cleveland","Pittsburgh","Baltimore"],"h":"Look West! Weather here moves from west to east.","pic":"🌦️","why":"Chicago is farthest west, then Cleveland, then Pittsburgh, then Baltimore. The storm marches east."}],"re":[{"t":"pairs","q":"Game: match each forecast word to its meaning.","pairs":[["forecast","a careful guess about coming weather"],["chance of rain","how likely rain is, out of 100"],["high and low","the warmest and coolest of the day"]],"h":"Which one is about temperature?","pic":"🌦️"},{"t":"sort","q":"Simpler: a sign of fair weather, or wet weather?","bins":[{"id":"F","label":"fair weather"},{"id":"W","label":"wet weather"}],"items":[{"label":"a big H on the map","bin":"F"},{"label":"a rising barometer","bin":"F"},{"label":"5% chance of rain","bin":"F"},{"label":"a big L on the map","bin":"W"},{"label":"a falling barometer","bin":"W"},{"label":"90% chance of rain","bin":"W"}],"h":"Is the air sinking, or rising?","pic":"🌦️"},{"t":"spotall","q":"Back to basics: tap every sentence about WEATHER, not climate.","cells":[{"label":"it will snow tomorrow","ok":true},{"label":"today is windy and cool","ok":true},{"label":"this afternoon brings rain","ok":true},{"label":"deserts are dry all year","ok":false},{"label":"summers here are usually hot","ok":false}],"h":"Think back to Weather Around the World. One day, or many years?","pic":"🌦️"}]}};
 var PAGE={"SCI.SKY.L08.01":{"big":"We cannot see the air, and we cannot hold it. So how can air be heavy?","intro":"Air is made of tiny bits, and they have weight. Miles of air are stacked above us, and all of it presses on everything from every side. That push is air pressure. High up, less air is stacked above, so the pressure is lower. A barometer measures air pressure: falling pressure often means storms, and rising pressure often means fair weather.","words":[["air pressure","The push of the air on everything around it.","i_press"],["barometer","A tool that measures air pressure.","i_baro"],["altitude","How high up a place is.","i_alt"]],"dyk":"The air pressing on a spot the size of a small button weighs about 1 kilogram. Across a whole tabletop, that is many tons of push, balanced by air pushing up from below.","story":{"title":"The Puffy Pretzel Bag","text":"In the fall, Uncle Peretz drove Nachman and his sister Sarah up a winding mountain road to see the red and orange leaves. At the bottom, Sarah packed a sealed bag of pretzels for later. Near the top, Nachman pulled it out of the snack box. It was round and tight as a drum. “Who blew up our pretzels?” he asked."},"predict":{"q":"What will happen to the puffy bag on the way back down the mountain?","o":["it will flatten back down","it will pop wide open","it will stay just as puffy"],"reveal":"It flattened! Down low, more air is stacked above, and the air outside pressed the bag back in. Nobody had blown into it at all. Uncle Peretz smiled. “The air was holding the bag in all along. Up high, it just had less to push with.” Sarah opened it at the bottom, and the pretzels were fine."},"checks":[{"q":"Which tool measures air pressure?","o":["a barometer","a ruler","a scale for fruit"],"h":"Its name ends in “meter”."}],"nif":{"text":"The air around us is heavy, yet it presses evenly from every side, so we can walk and breathe in comfort. Hashem set this balance with perfect care, and we never even feel it."}},"SCI.SKY.L08.02":{"big":"On a hot day at the lake, a cool breeze blows in off the water. At night it turns around. Why?","intro":"Air moves from high pressure to low pressure, and moving air is wind. The sun heats land faster than water. By day, warm air rises over the land, and cool air flows in from the water: a sea breeze. At night the land cools faster, and the breeze turns around: a land breeze. A wind is named for where it comes from.","words":[["wind","Air moving from high pressure to low pressure.","i_wind"],["sea breeze","A daytime wind that blows from the water to the land.","i_sea"],["land breeze","A nighttime wind that blows from the land to the water.","i_land"]],"dyk":"Some of the strongest winds on earth blow far above the clouds, in fast rivers of air called the jet stream. They often move faster than cars on a highway.","story":{"title":"The Flag on the Pier","text":"Every summer, Yonatan and his cousin Elisheva stay with Bobby at a bungalow colony by a big lake. A little blue flag flies at the end of the pier. On a hot afternoon, Yonatan noticed it streaming out toward the bungalows. After Maariv that night, he walked down the path with a flashlight to check on it."},"predict":{"q":"After dark, which way will the flag on the pier stream?","o":["out over the lake","still toward the bungalows","straight up at the sky"],"reveal":"Out over the lake! At night the land cooled faster than the water, so the breeze turned around and blew from the land. Elisheva wrote it in her notebook: day, from the lake; night, from the land. Bobby laughed. “Forty summers I sat on this porch, and I never knew the flag was a weather tool!”"},"checks":[{"q":"Which way does a sea breeze blow?","o":["from the water to the land","from the land to the water","from the clouds to the sea"],"h":"A wind is named for where it comes from."}],"nif":{"text":"Land and water warm at different speeds, and from that small difference the breeze is born, cooling the shore on hot afternoons. Even the wind follows the order Hashem placed in the world."}},"SCI.SKY.L08.03":{"big":"Why can a hot, sticky afternoon turn into a stormy evening and then a cool, clear morning?","intro":"An air mass is a giant body of air that is the same all through: warm or cold, humid or dry, from the place where it formed. A front is the edge where two air masses meet. A cold front shoves under warm air and lifts it fast: short, strong storms, then cooler, drier air. A warm front slides up slowly: long, gentle rain, then warmer air.","words":[["air mass","A giant body of air that is the same all through.","i_mass"],["front","The edge where two air masses meet.","i_front"],["humid","Full of water vapor; it feels sticky.","i_humid"]],"dyk":"A strong cold front can drop the temperature by 10 degrees Celsius or more in just a few hours.","story":{"title":"The Sukkah and the Storm","text":"A few days before Sukkos, Mordechai and his sister Ahuva helped Grandpa Yossi put up the sukkah walls. The air was hot and sticky, and their shirts stuck to their backs. Grandpa Yossi listened to the weather on his little radio. “A cold front is coming tonight,” he said. “Let’s tie the walls down tight, and the schach can wait until tomorrow.”"},"predict":{"q":"After the cold front passes, what will the next morning feel like?","o":["cooler and drier","hotter and stickier","exactly the same"],"reveal":"Cooler and drier! That evening the wind swung around, tall dark clouds rolled in, and a short, heavy storm drummed on the sukkah walls. The walls held. In the morning the sky was clear and the air was crisp. Ahuva took a deep breath. “It feels like a whole new season.” They laid the schach in the cool sunshine."},"checks":[{"q":"What is a front?","o":["the edge where two air masses meet","a kind of thick cloud","a wind that blows at night"],"h":"Think of where two teams face each other."}],"nif":{"text":"Great masses of air meet, and from their meeting come clouds and rain that water the fields and fill the rivers. Rain is one of the great gifts, and we daven for it in its time."}},"SCI.SKY.L08.04":{"big":"Nobody can see the future. So how can a forecaster tell us to bring an umbrella tomorrow?","intro":"Forecasters read signs. On a weather map, H marks high pressure and fair weather, and L marks low pressure and wet weather. Fronts are drawn as lines. Here, weather usually moves from west to east, so look west to see what is coming. A chance of rain tells how likely rain is, out of 100.","words":[["forecast","A careful prediction of the weather to come.","i_fore"],["high and low","On a map, H is high pressure and L is low pressure.","i_hl"],["chance of rain","How likely rain is, out of 100.","i_chance"]],"dyk":"Twice every day, weather balloons are let go from hundreds of places around the world. They rise about 30 kilometers high and radio back the air pressure, the temperature and the wind.","story":{"title":"The Morning Weather Report","text":"Every Monday, Binyamin and his friend Yisroel give the weather on the school’s morning announcements. On Sunday night they called Aunt Tzipora, who checks the weather for her job at the airport. “Look at the map,” she said. “There is a big L over Chicago, and it is heading east.” Binyamin wrote it down. Yisroel found Chicago, then Baltimore."},"predict":{"q":"What should the boys tell the school for Wednesday?","o":["bring an umbrella","a hot, dry day","snow for sure"],"reveal":"Bring an umbrella! The low was moving east, toward Baltimore, and lows bring clouds and rain. On Wednesday it poured. Two kindergarten boys came to the office in rain boots to say thank you for the warning. Yisroel grinned. “We didn’t make the rain. We just looked west.”"},"checks":[{"q":"On a weather map, what does a big L mean?","o":["low pressure: clouds and rain","a large, sunny area","a long, calm night"],"h":"Think back to air pressure."}],"nif":{"text":"People can study the signs and make a good forecast, but no one can promise tomorrow’s weather. We plan carefully, and we trust in Hashem, who sends every wind and every drop of rain."}}};
 var TEACH={"SCI.SKY.L08.01":{"theme":"lab","hook":"A sealed bag of pretzels puffs up on a mountain road. Nobody blew into it. What happened?","big":"Air has weight and presses from every side. Higher up, the pressure is lower. A barometer measures it.","remember":"A gas is made of tiny bits that spread out to fill its space.","intro":["Step 1: air is made of tiny bits, and they have weight.","Step 2: all the air stacked above us presses on things: air pressure.","Step 3: higher up, less air is above, so the pressure is lower.","Step 4: a barometer measures it. Falling: storms. Rising: fair."],"ex":[{"q":"Seashore or mountaintop: where is the pressure higher?","steps":["Feel the Air Stack!","The seashore has the most air above it.","More air above means more pressure."],"a":"the seashore"},{"q":"The barometer fell from 1,016 to 1,001. Fair or stormy?","steps":["Feel the Air Stack!","Falling pressure means rising air.","Rising air builds clouds."],"a":"stormy"}],"oops":{"q":"Air is invisible, so does it weigh nothing?","wrong":"Yes, air weighs nothing.","right":"No, air has weight.","why":"You cannot see air, but its tiny bits have weight. All the air above us presses hard on everything."},"idea":["Feel the Air Stack! Picture a tall pile of air on top of you. Taller pile, bigger push.","Barometer falling, storm calling. Barometer rising, sunny skies rising."],"try":{"q":"A barometer is rising fast. What weather is likely?","o":["clearing skies","a big storm","heavy snow"],"a":"clearing skies","steps":["Rising pressure means sinking air.","Sinking air clears the clouds, so…"]},"joke":"Why did the barometer quit the team? It could not take the pressure!"},"SCI.SKY.L08.02":{"theme":"lab","hook":"On a hot afternoon a cool breeze blows in off the lake. At night it blows the other way. Why?","big":"Wind blows from high pressure to low. Land heats and cools faster than water, so shore breezes turn around.","remember":"Air pressure is the push of the air. A barometer measures it.","intro":["Step 1: wind is air moving from high pressure to low.","Step 2: the sun heats land faster than water.","Step 3: by day, cool air flows from the water to the land: a sea breeze.","Step 4: at night it turns around: a land breeze."],"ex":[{"q":"Hot land, cool lake, 2 in the afternoon. Which way is the breeze?","steps":["High Runs to Low!","Cool lake air presses harder: high.","It flows to the hot land."],"a":"from the lake to the land"},{"q":"1,024 millibars here, 1,000 there. Which way does the air move?","steps":["High Runs to Low!","1,024 is the high.","Air flows toward 1,000."],"a":"toward the 1,000 side"}],"oops":{"q":"Is a sea breeze a wind that blows toward the sea?","wrong":"Yes, it blows to the sea.","right":"No, it blows from the sea.","why":"A wind is named for where it comes FROM. A sea breeze comes from the sea, a north wind from the north."},"idea":["High Runs to Low! Like water running downhill, air runs from high pressure to low.","Land is fast: fast to heat, fast to cool. Water is slow."],"try":{"q":"A clear night by the lake. Which way does the breeze blow?","o":["from the land to the lake","from the lake to the land","straight down"],"a":"from the land to the lake","steps":["At night the land is cooler.","Cool air is the high, so it flows…"]},"joke":"What did the land say to the sea breeze at night? “My turn to blow!”"},"SCI.SKY.L08.03":{"theme":"lab","hook":"A hot, sticky day, a sudden storm, and then a cool, clear morning. Who flipped the switch?","big":"Air masses are giant bodies of air. Fronts are where they meet. Cold fronts bring short storms; warm fronts bring long rain.","remember":"Air moves from high pressure to low pressure.","intro":["Step 1: an air mass is giant and the same all through.","Step 2: it takes on its birthplace: ocean humid, land dry, poles cold.","Step 3: a front is the edge where two air masses meet.","Step 4: cold front: fast lift, short storms. Warm front: slow slide, long rain."],"ex":[{"q":"Air from over the frozen north. What is it like?","steps":["Who Is Pushing In?","North and frozen: cold.","Over land: dry."],"a":"cold and dry"},{"q":"A red line with half-circles. What follows it?","steps":["Who Is Pushing In?","Red with half-circles: a warm front.","Warm air slides in slowly."],"a":"long rain, then warmer air"}],"oops":{"q":"Does a cold front bring a week of slow drizzle?","wrong":"Yes, cold fronts are slow.","right":"No, cold fronts are fast.","why":"Cold air shoves under warm air and lifts it fast. That makes short, strong storms. Slow drizzle comes with a warm front."},"idea":["Who Is Pushing In? Cold air is a bulldozer; warm air is a slide.","Blue triangles show the way the cold air moves."],"try":{"q":"Tall thunderclouds and a sudden downpour. Which front?","o":["a cold front","a warm front","no front at all"],"a":"a cold front","steps":["Tall clouds mean fast lifting.","Fast lifting comes from…"]},"joke":"Why did the cold front never wait in line? It always pushes its way in!"},"SCI.SKY.L08.04":{"theme":"lab","hook":"How can anyone tell us to bring an umbrella tomorrow when nobody can see the future?","big":"Read the map: H fair, L wet, fronts as lines. Look west. A chance of rain is out of 100.","remember":"A cold front brings short, strong storms.","intro":["Step 1: H means high pressure and fair weather; L means low and wet.","Step 2: here, weather moves from west to east.","Step 3: look west to see tomorrow.","Step 4: a chance of rain is out of 100: 80% likely, 10% unlikely."],"ex":[{"q":"An H over Ohio moving east. Baltimore tomorrow?","steps":["Look West!","Ohio is west of us.","H brings fair weather."],"a":"fair weather"},{"q":"40% chance of rain. How many days in 10 like it?","steps":["40 out of 100.","That is 4 out of 10.","Rain on about 4."],"a":"about 4"}],"oops":{"q":"Does a 30% chance mean it rains 30% of the day?","wrong":"Yes, 30% of the hours.","right":"No, it is how likely rain is.","why":"30% means that on about 3 of 10 days like this, rain falls. It says nothing about how long it rains."},"idea":["Look West! What is west today is here tomorrow.","H is for Happy skies; L is for Lots of clouds."],"try":{"q":"An L sits over Pittsburgh, moving east. What should Baltimore expect?","o":["rain soon","clear skies all week","snow in summer"],"a":"rain soon","steps":["Pittsburgh is west of us.","A low brings…"]},"joke":"Why did the forecaster bring a ladder to work? To check on the high pressure!"}};
 var LABI={"SCI.SKY.L08.01":{"kind":"plot","title":"The Barometer Diary","goal":"Plot each day’s barometer reading on the graph. Then read the line: what weather is coming?","levels":[995,1000,1005,1010,1015,1020,1025],"days":["Sun","Mon","Tue","Wed","Thu"],"weeks":[["Week 1",[1020,1015,1010,1000,995],"S"],["Week 2",[995,1000,1010,1015,1025],"F"]]},"SCI.SKY.L08.02":{"kind":"arrow","title":"Which Way, Breeze?","goal":"For each place, tap the WARMER side first. Then tap the arrow that shows which way the breeze blows.","scenes":[["shoreday","A sunny afternoon at the lake","the lake","the land","R"],["shorenight","A clear night at the lake","the lake","the land","L"],["parking","Noon in July","a shady park","a hot parking lot","R"],["field","A sunny afternoon in the country","a sunny wheat field","a cool forest","L"]]},"SCI.SKY.L08.03":{"kind":"timeline","title":"Front Timeline","goal":"A front is passing over the town. Put each card on the timeline: before the front, as it passes, or after.","slots":[["B","before"],["P","as it passes"],["A","after"]],"fronts":[["cold","The cold front",[["a quick, heavy downpour","P","downpour"],["cool, dry, clear air","A","cool, clear"],["warm, muggy air","B","muggy"],["tall dark clouds and thunder","P","thunder"]]],["warm","The warm front",[["warm, humid air","A","warm, humid"],["cool air, thin high clouds","B","thin clouds"],["low gray clouds and long drizzle","P","drizzle"]]]]},"SCI.SKY.L08.04":{"kind":"branch","title":"Plan the Sundays","goal":"Mamme wants to plan three Sunday outings. Read the weather signs, then choose the plan.","nodes":[{"day":"Sunday 1","sign":"H","clue":"A big H sits right over us. The barometer is rising. Chance of rain: 5%.","q":"Zoo trip, or stay in?","o":[["Go to the zoo!",1,"Great call! Sinking air and clear skies: a sunny day at the zoo."],["Stay in, it may storm",0,"Look again: an H, a rising barometer and 5% all mean fair weather."]]},{"day":"Sunday 2","sign":"L","clue":"An L is over Ohio, moving east toward us. Chance of rain: 80%.","q":"A hike in the park, or the science museum?","o":[["the hike in the park",0,"Look West! The low in Ohio was heading right for us. It poured at noon."],["the science museum",1,"Smart! The low arrived by noon and it poured, but you were dry inside."]]},{"day":"Sunday 3","sign":"F","clue":"A cold front will reach us at 2 in the afternoon. The morning is warm and sunny.","q":"When should the picnic be?","o":[["late in the afternoon",0,"That is just when the cold front brings its short, strong storm. Go early!"],["in the morning, home by noon",1,"Perfect timing! The storm hit at 2, and you were already home."]]}]}};
 var PIC={"SCI.SKY.L08.01|Air is made of tiny bits, and they have weight. What do we call the push of all that air on everything around us?":"stack","SCI.SKY.L08.01|As you climb a tall mountain, what happens to the air pressure?":"mountain","SCI.SKY.L08.01|Which tool measures air pressure?":"baro","SCI.SKY.L08.01|Nachman’s sealed pretzel bag puffed up near the top of the mountain. Why?":"bag","SCI.SKY.L08.01|Sarah’s barometer has dropped all morning. What weather may be coming?":"barodrop","SCI.SKY.L08.01|Sort them: higher air pressure, or lower air pressure?":"sorthl","SCI.SKY.L08.01|Match each barometer reading to the weather it often brings.":"dials3","SCI.SKY.L08.01|Tap every true thing about air.":"cube","SCI.SKY.L08.01|At the seashore the barometer reads 1,015 millibars. On the mountaintop it reads 875. How many millibars lower is the mountaintop?":"twobaro","SCI.SKY.L08.01|Review: air spreads out to fill its whole space, like the air in a balloon. Matter like that is a ____.":"balloon","SCI.SKY.L08.01|Review: most of the air is nitrogen, N₂, and oxygen, O₂. How many atoms are in one N₂ molecule and one O₂ molecule together?":"airmol","SCI.SKY.L08.01|Where is the air pressure the lowest?":"heights","SCI.SKY.L08.01|A barometer read 1,020 millibars on Sunday and 1,004 on Monday. By how many millibars did it fall?":"barodrop","SCI.SKY.L08.01|Put the places in order, highest air pressure to lowest.":"placecards","SCI.SKY.L08.01|Game: match each air word to its meaning.":"stack","SCI.SKY.L08.01|Simpler: more air stacked above, or less?":"tower","SCI.SKY.L08.01|Back to basics: tap every true thing about a gas.":"syringe","SCI.SKY.L08.02|Air moves from where the pressure is high to where it is low. What do we call that moving air?":"balloonout","SCI.SKY.L08.02|On a sunny day, which warms up faster?":"landsea","SCI.SKY.L08.02|On a sunny afternoon at the shore, which way does the breeze blow?":"seabreeze","SCI.SKY.L08.02|At 3 in the afternoon, Yonatan sees the flag on  // ---- Whiteboard kit (house style of this unit: WHITEBOARD MARKER: a white board in a brushed-aluminum frame, bold marker lines in blue, red, green, orange, purple and black, diagonal marker-hatch fills, faint ghost smudges, a marker tray with two markers and an eraser). Original SVG, drawn in code. ----
 // Every drawer: (u, opt) => svg string; u = unique suffix so ids never clash. Weather, maps, tools and places only: no people, no faces, no body parts. No Hebrew letters.
 var mB='#1D5BB8', mR='#D33A36', mG='#1E8A4C', mK='#262A30', mO='#E07B12', mP='#7445B8', mS='#5B6672', wB='#FDFEFE', wF='#C3CAD1', wF2='#8E979F';
 var HC={b:mB,r:mR,g:mG,o:mO,p:mP,k:mS};
 var CF='font-family="\'Marker Felt\', \'Chalkboard SE\', \'Comic Neue\', \'Comic Sans MS\', \'Trebuchet MS\', Arial, sans-serif" font-weight="700"';
 function f1(n){ return (+n).toFixed(1); }
 function rn(s){ var x=Math.sin(s*91.345)*47453.5453; return x-Math.floor(x); }
 function ln(c,w){ return ' stroke="'+(c||mK)+'" stroke-width="'+(w||2.4)+'" stroke-linejoin="round" stroke-linecap="round"'; }
 function pg(u,label,body,o){ o=o||{}; var w=o.w||240,h=o.h||160;
  var pats=''; Object.keys(HC).forEach(function(k){ pats+='<pattern id="h'+k+u+'" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0 V6" stroke="'+HC[k]+'" stroke-width="1.6" opacity=".5"/></pattern>'; });
  var ghost=''; for(var i=0;i<3;i++){ var x=rn(i*5.3+u.length)*w*.8, y=rn(i*2.9+3)*h*.75+14; ghost+='<path d="M'+f1(x)+' '+f1(y)+' q'+f1(20+rn(i)*20)+' '+f1(-4+rn(i+1)*8)+' '+f1(50+rn(i+2)*30)+' 0" stroke="#9AA6B2" stroke-width="'+f1(6+rn(i+3)*6)+'" opacity=".06" fill="none" stroke-linecap="round"/>'; }
  return '<svg class="sciart g7wc-art" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+label+'" xmlns="http://www.w3.org/2000/svg"><defs>'+pats+
   '<filter id="mk'+u+'" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="1" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale=".9"/></filter>'+
   '<linearGradient id="wb'+u+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="'+wB+'"/><stop offset="1" stop-color="#EEF2F5"/></linearGradient>'+
   '<linearGradient id="al'+u+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCE1E6"/><stop offset="1" stop-color="#A9B1B9"/></linearGradient>'+
   '<clipPath id="wc'+u+'"><rect x="6" y="6" width="'+(w-12)+'" height="'+(h-12)+'" rx="2"/></clipPath>'+
   '</defs><rect width="'+w+'" height="'+h+'" rx="6" fill="url(#al'+u+')"/><rect x="2.5" y="2.5" width="'+(w-5)+'" height="'+(h-5)+'" rx="5" fill="none" stroke="'+wF2+'" stroke-width="1.4"/>'+
   '<g clip-path="url(#wc'+u+')"><rect width="'+w+'" height="'+h+'" fill="url(#wb'+u+')"/>'+ghost+'<path d="M'+f1(w*.55)+' 6 L'+f1(w*.72)+' 6 L'+f1(w*.42)+' '+(h-6)+' L'+f1(w*.36)+' '+(h-6)+' Z" fill="#FFFFFF" opacity=".55"/><g filter="url(#mk'+u+')" fill="none">'+body.split('#HU#').join(u)+'</g></g>'+
   (o.tray===false?'':'<rect x="'+f1(w*.56)+'" y="'+(h-8)+'" width="26" height="5" rx="2.5" fill="'+mB+'"/><rect x="'+f1(w*.56+20)+'" y="'+(h-8)+'" width="6" height="5" rx="1" fill="#E8ECEF"/><rect x="'+f1(w*.56+30)+'" y="'+(h-8)+'" width="26" height="5" rx="2.5" fill="'+mR+'"/><rect x="'+f1(w*.56+50)+'" y="'+(h-8)+'" width="6" height="5" rx="1" fill="#E8ECEF"/><rect x="'+f1(w*.15)+'" y="'+(h-10)+'" width="30" height="7" rx="2" fill="#4A5059"/><rect x="'+f1(w*.15)+'" y="'+(h-5)+'" width="30" height="2.4" fill="#9AA3AD"/>')+
   '</svg>'; }
 function H(k){ return 'url(#h'+k+'#HU#)'; }
 function tx(x,y,t,sz,c,anc){ return '<text x="'+x+'" y="'+y+'" '+CF+' font-size="'+(sz||10)+'" fill="'+(c||mK)+'" stroke="none" text-anchor="'+(anc||'middle')+'">'+t+'</text>'; }
 function ttl(t,c){ return tx(14,22,t,11.5,c||mB,'start')+'<path d="M14 26 q'+f1(t.length*3)+' 2.5 '+f1(t.length*6.2)+' 0"'+ln(c||mB,1.6)+'/>'; }
 function arrow(x1,y1,x2,y2,c,w){ c=c||mK; w=w||2.4; var a=Math.atan2(y2-y1,x2-x1); return '<path d="M'+f1(x1)+' '+f1(y1)+' L'+f1(x2)+' '+f1(y2)+'"'+ln(c,w)+'/><path d="M'+f1(x2-9*Math.cos(a-.5))+' '+f1(y2-9*Math.sin(a-.5))+' L'+f1(x2)+' '+f1(y2)+' L'+f1(x2-9*Math.cos(a+.5))+' '+f1(y2-9*Math.sin(a+.5))+'"'+ln(c,w)+'/>'; }
 function carrow(x1,y1,cx,cy,x2,y2,c,w){ c=c||mK; w=w||2.4; var a=Math.atan2(y2-cy,x2-cx); return '<path d="M'+x1+' '+y1+' Q'+cx+' '+cy+' '+x2+' '+y2+'"'+ln(c,w)+'/><path d="M'+f1(x2-9*Math.cos(a-.5))+' '+f1(y2-9*Math.sin(a-.5))+' L'+x2+' '+y2+' L'+f1(x2-9*Math.cos(a+.5))+' '+f1(y2-9*Math.sin(a+.5))+'"'+ln(c,w)+'/>'; }
 function lbl(x,y,t,sz,c){ var w=t.length*(sz||10)*.56+8; return '<rect x="'+f1(x-w/2)+'" y="'+f1(y-(sz||10)-1)+'" width="'+f1(w)+'" height="'+f1((sz||10)+6)+'" rx="4" fill="#FFFFFF" opacity=".92"/>'+tx(x,y,t,sz,c); }
 function q(x,y,sz,c){ return tx(x,y,'?',sz||18,c||mP); }
 function box(x,y,w,h,c,fill,r){ return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(r==null?5:r)+'" fill="'+(fill||'none')+'"'+ln(c||mK,2)+'/>'; }
 function sun(x,y,r,c){ c=c||mO; var b='<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+H('o')+'"'+ln(c,2.2)+'/>'; for(var i=0;i<8;i++){ var a=i*Math.PI/4; b+='<path d="M'+f1(x+Math.cos(a)*(r+4))+' '+f1(y+Math.sin(a)*(r+4))+' L'+f1(x+Math.cos(a)*(r+9))+' '+f1(y+Math.sin(a)*(r+9))+'"'+ln(c,2)+'/>'; } return b; }
