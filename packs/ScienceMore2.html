d":"5-6","teach":[{"how":"Step 1. Fungi, like mushrooms, molds and yeast, are not plants. They have no green leaves, so they cannot make their own food from sunlight.","q":"A mushroom grows in a forest and has no green at all. Why is it not a plant?","o":["it cannot make its own food","it grows in dark and shady places","it is softer than every plant"],"h":"Plants make food with green leaves. What does a mushroom lack?","pic":"🌱","why":"Plants use a green stuff called chlorophyll to make food. Fungi have none, so they must get food another way."},{"how":"Step 2. Fungi feed by breaking down dead things: fallen logs, old leaves and stale bread. They are nature’s recyclers, called decomposers.","q":"Then how does a mushroom on a fallen log get its food?","o":["it breaks down the dead wood","it catches flies with sticky hairs","it drinks rain through its cap"],"h":"What is the log made of, and is it alive?","pic":"🌱","why":"As fungi break down a log, its goodness goes back into the soil, where new plants can use it."},{"how":"Step 3. Yeast is a tiny fungus. It eats the sugar in the dough and gives off carbon dioxide gas. Bubbles of gas puff the dough up.","q":"Why does challah dough rise when yeast is mixed in?","o":["yeast gives off gas bubbles","the oven blows hot air into it","the flour soaks up the eggs"],"h":"Look at the holes inside a slice of challah.","pic":"🌱","why":"Each bubble is trapped in the stretchy dough, so the whole dough grows bigger."}],"we":[{"q":"Dovid sees fuzzy green spots on a slice of old bread. What are they?","o":["mold, a kind of fungus","new little wheat leaves"],"steps":["Old bread is food that nobody ate.","Fungi feed by breaking down old things.","Fuzzy spots on old food are..."],"pic":"🌱"},{"q":"Babbi mixes yeast with warm water and a spoon of sugar. Why the sugar?","o":["it is food for the yeast","it turns the yeast green"],"steps":["Yeast is alive.","It cannot make its own food.","So the sugar is..."],"pic":"🌱"}],"practice":[{"t":"sort","q":"Sort them: a plant, or a fungus?","bins":[{"id":"P","label":"a plant"},{"id":"F","label":"a fungus"}],"items":[{"label":"a mushroom","bin":"F"},{"label":"yeast","bin":"F"},{"label":"mold on an orange","bin":"F"},{"label":"a fern","bin":"P"},{"label":"a wheat plant","bin":"P"},{"label":"a moss","bin":"P"}],"h":"Who Makes the Food? Ask it of each card.","pic":"🌱","why":"Fern, wheat and moss are green and make food. Mushrooms, yeast and mold cannot."},{"t":"pairs","q":"Match each fungus to what it does.","pairs":[["yeast","puffs up challah dough"],["mold","grows on old food"],["a mushroom","breaks down a fallen log"]],"h":"One lives in the kitchen bowl, one on old food, one in the forest.","pic":"🌱","why":"Yeast makes bubbles, mold feeds on old food, and mushrooms help rot fallen wood."},{"t":"spotall","q":"Tap every safe, smart thing to do with fungi.","cells":[{"label":"throw out bread with mold on it","ok":true},{"label":"buy mushrooms from a store","ok":true},{"label":"use warm water for yeast, not boiling","ok":true},{"label":"pick wild mushrooms and taste them","ok":false},{"label":"eat bread with fuzzy spots on it","ok":false}],"h":"Ask of each card: could it make someone sick?","pic":"🌱","why":"Many wild mushrooms are poisonous and look just like safe ones. Mold can make you sick. Boiling water kills yeast."},{"t":"num","q":"Each batch of challah dough needs 7 grams of yeast. How many grams for 4 batches?","a":28,"h":"Grams for one batch × batches.","pic":"🌱","why":"7 × 4 = 28 grams. A little yeast goes a long way, because it keeps growing in the dough."},{"t":"num","q":"Review: 14 of 20 seeds sprouted. What percent sprouted?","a":70,"h":"Think back to the germination test: sprouted ÷ planted × 100.","pic":"🌱","why":"14 ÷ 20 = 0.7, and 0.7 × 100 = 70%."},{"t":"sort","q":"Review: sort them: gives off oxygen, or gives off carbon dioxide?","bins":[{"id":"O","label":"gives off oxygen"},{"id":"C","label":"gives off carbon dioxide"}],"items":[{"label":"a leaf in sunlight","bin":"O"},{"label":"a tree in the daytime","bin":"O"},{"label":"pondweed in sunlight","bin":"O"},{"label":"rising challah dough","bin":"C"},{"label":"a person breathing out","bin":"C"},{"label":"a burning candle","bin":"C"}],"h":"Think back to Plants and Air. Which ones are green and in the light?","pic":"🌱","why":"Green leaves in light give off oxygen. Yeast, breathing and burning give off carbon dioxide."}],"check":[{"q":"Which one is NOT a fungus?","o":["a fern","yeast","a mushroom"],"h":"Who Makes the Food? Find the one that does.","pic":"🌱"},{"t":"order","q":"Order what happens to a fallen log.","tiles":["a tree falls in the forest","fungi grow into the wood","the log turns soft and crumbles","new plants grow in the rich soil"],"h":"The tree has to fall first.","pic":"🌱"},{"t":"num","q":"Dovid uses 3 cups of warm water for 2 loaves. How many cups for 6 loaves?","a":9,"h":"How many times bigger is 6 loaves than 2 loaves?","pic":"🌱"}],"re":[{"t":"pairs","q":"Game: match each fungus word to its meaning.","pairs":[["fungus","cannot make its own food"],["decomposer","breaks down dead things"],["chlorophyll","the green stuff that helps make food"]],"h":"Which word is about rotting? Which is about green?","pic":"🌱"},{"t":"sort","q":"Simpler: makes its own food, or cannot?","bins":[{"id":"M","label":"makes its own food"},{"id":"C","label":"cannot"}],"items":[{"label":"a tree","bin":"M"},{"label":"grass","bin":"M"},{"label":"a fern","bin":"M"},{"label":"a mushroom","bin":"C"},{"label":"mold","bin":"C"},{"label":"yeast","bin":"C"}],"h":"Is it green?","pic":"🌱"},{"t":"spotall","q":"Back to basics: tap every thing a green leaf uses to make food.","cells":[{"label":"sunlight","ok":true},{"label":"water","ok":true},{"label":"carbon dioxide","ok":true},{"label":"sugar from a bag","ok":false},{"label":"soil","ok":false}],"h":"Think back to Leaves Make Food: light, water, and a gas.","pic":"🌱"}]},"SCI.PLANT.L07.04":{"name":"Plant Families","band":"5-6","teach":[{"how":"Step 1. Plants in one family have flowers, fruits and seeds that are built alike, even when the plants are very different sizes.","q":"Scientists put plants into families. What do they mostly look at?","o":["flowers, fruits and seeds","how tall each one grows","what color its leaves are"],"h":"Which parts stay the same in every garden?","pic":"🌱","why":"Size and color change with weather and soil, but flower and seed shapes stay the same, so they are better clues."},{"how":"Step 2. Look for the family clue. A pod means the bean family. A grain on a grassy stalk means the grass family.","q":"Peas, lentils and peanuts all grow in pods. Which family are they in?","o":["the bean family","the grass family","the rose family"],"h":"Find the Family Clue! What is the clue here?","pic":"🌱","why":"Peanuts grow underground, but they grow in pods, so they belong to the bean family, not with the nut trees."},{"how":"Step 3. Families can surprise you. Apples, pears, cherries, almonds and even strawberries are all in the rose family.","q":"Which one is in the same family as an apple?","o":["a pear","a potato","a cucumber"],"h":"Picture the core inside each one.","pic":"🌱","why":"Their flowers all have five petals around a ring of thin stalks: the rose family’s clue."}],"we":[{"q":"Eliezer helps Opa stack the shelves in his grocery. Corn, rice and oats go together. Which family?","o":["the grass family","the citrus family"],"steps":["Each one is a grain.","Grains grow on grassy stalks.","So the family is..."],"pic":"🌱"},{"q":"Opa holds up an etrog, a lemon and an orange. Which family?","o":["the citrus family","the squash family"],"steps":["Each has a thick, oily, sweet-smelling peel.","Inside, the fruit is in juicy wedges.","That is the..."],"pic":"🌱"}],"practice":[{"t":"sort","q":"Sort them: grass family, or bean family?","bins":[{"id":"G","label":"grass family"},{"id":"B","label":"bean family"}],"items":[{"label":"wheat","bin":"G"},{"label":"barley","bin":"G"},{"label":"rice","bin":"G"},{"label":"chickpeas","bin":"B"},{"label":"lentils","bin":"B"},{"label":"green beans","bin":"B"}],"h":"Find the Family Clue! A grain, or a pod?","pic":"🌱","why":"Wheat, barley and rice are grains on grassy stalks. Chickpeas, lentils and beans grow in pods."},{"t":"pairs","q":"Match each food to its family.","pairs":[["cucumber","squash family"],["tomato","potato family"],["almond","rose family"],["lemon","citrus family"]],"h":"Look at each one’s seeds and peel.","pic":"🌱","why":"Cucumbers are squashes, tomatoes share flowers with potatoes, almonds are in the rose family, and lemons are citrus."},{"t":"spotall","q":"Tap every member of the squash family.","cells":[{"label":"a cucumber","ok":true},{"label":"a pumpkin","ok":true},{"label":"a watermelon","ok":true},{"label":"a pear","ok":false},{"label":"a peanut","ok":false}],"h":"Squash family fruits grow on long, creeping vines.","pic":"🌱","why":"Cucumbers, pumpkins and watermelons grow on vines and are full of flat seeds."},{"t":"num","q":"Opa’s shelf has 12 apples, 8 pears, 15 strawberries and 10 lemons. How many are in the rose family?","a":35,"h":"Leave out the ones from another family.","pic":"🌱","why":"Apples, pears and strawberries are rose family: 12 + 8 + 15 = 35. Lemons are citrus."},{"t":"type","q":"Review: mushrooms are not plants, so they are in no plant family at all. Type the name of their own group: ____.","a":"fungi","alt":["fungus","a fungus","the fungi"],"kb":"abc","h":"Think back to Not a Plant.","pic":"🌱","why":"Mushrooms, molds and yeast are fungi. They cannot make their own food."},{"t":"sort","q":"Review: sort them: spores, seeds in cones, or seeds in fruit?","bins":[{"id":"S","label":"spores"},{"id":"C","label":"seeds in cones"},{"id":"F","label":"seeds in fruit"}],"items":[{"label":"a moss","bin":"S"},{"label":"a fern","bin":"S"},{"label":"a pine","bin":"C"},{"label":"a cedar tree","bin":"C"},{"label":"a pea plant","bin":"F"},{"label":"a lemon tree","bin":"F"}],"h":"Think back to Flowering or Not? Ask the three questions.","pic":"🌱","why":"Mosses and ferns use spores. Pines and cedars keep seeds in cones. Peas and lemons grow seeds inside fruit."}],"check":[{"q":"A new plant has pods full of round seeds. Which family is it in?","o":["the bean family","the citrus family","the grass family"],"h":"Find the Family Clue!","pic":"🌱"},{"t":"num","q":"In a garden, 6 of the 24 plants are in the squash family. What percent is that?","a":25,"h":"Part ÷ whole × 100.","pic":"🌱"},{"t":"spotall","q":"Tap every food in the rose family.","cells":[{"label":"a cherry","ok":true},{"label":"a peach","ok":true},{"label":"an almond","ok":true},{"label":"a potato","ok":false},{"label":"a pumpkin","ok":false}],"h":"Which ones grow on trees with five-petal blossoms?","pic":"🌱","chk":true}],"re":[{"t":"pairs","q":"Game: match the clue to the family.","pairs":[["a pod","the bean family"],["a grain on a grassy stalk","the grass family"],["juicy wedges inside a peel","the citrus family"]],"h":"Ask: what does each family’s fruit look like?","pic":"🌱"},{"t":"sort","q":"Simpler: does it grow as a grain, or as a fruit?","bins":[{"id":"G","label":"a grain"},{"id":"F","label":"a fruit"}],"items":[{"label":"wheat","bin":"G"},{"label":"oats","bin":"G"},{"label":"corn","bin":"G"},{"label":"an apple","bin":"F"},{"label":"an orange","bin":"F"},{"label":"a melon","bin":"F"}],"h":"Is it a small, hard kernel?","pic":"🌱"},{"t":"spotall","q":"Back to basics: tap every food made from a grain.","cells":[{"label":"bread","ok":true},{"label":"oatmeal","ok":true},{"label":"a bowl of rice","ok":true},{"label":"an apple","ok":false},{"label":"a carrot","ok":false}],"h":"Think back to wheat: what is made from ground grain?","pic":"🌱"}]}};
 var PAGE={"SCI.PLANT.L07.01":{"big":"Does every plant grow from a seed?","intro":"No! Plants come in four big groups. Mosses have no tubes and no seeds. Ferns have tubes but still use spores. Cone plants keep bare seeds in cones. Flowering plants grow seeds inside a fruit. Ask three questions: tubes? seeds? flowers?","words":[["spore","A tiny speck, smaller than dust, that grows into a new moss or fern.","i_spore"],["cone","The woody holder where a pine keeps its seeds.","i_cone"],["tubes","Thin pipes inside a stem that carry water up.","i_tubes"]],"dyk":"Most kinds of plants in the world are flowering plants: grass, wheat, apple trees, roses, even the tiny duckweed floating on a pond.","story":{"title":"The Shabbos Afternoon Walk","text":"After the seudah, Abba and Yehuda walked down to the shady path by the creek. A soft green carpet covered the rocks. Feathery ferns leaned over the water. Pine cones crunched under their shoes, and wild roses bloomed by the gate. “Four plants,” said Abba, “and four different ways of making new plants.”"},"predict":{"q":"Which of the four plants Yehuda saw makes no seeds at all?","o":["the ferns and the moss","the pine trees","the wild roses"],"reveal":"The ferns and the moss! They use spores instead. Abba flipped a fern leaf to show the brown spore dots, and Yehuda counted 40 dots before he lost track."},"checks":[{"q":"Where does a pine tree keep its seeds?","o":["in its cones","inside a fruit","in spore dots"],"h":"Look under the scales."}],"nif":{"text":"A fern spore is smaller than a speck of dust, yet it holds everything needed to grow a whole new fern. Hashem packed each kind of plant with its own way to fill the world with green."}},"SCI.PLANT.L07.02":{"big":"What does a seed need to wake up, and how can we test it fairly?","intro":"A seed is a sleeping baby plant with a packed lunch. Water, warmth and air wake it up: it germinates. To find out what a seed needs, run a fair test: change only one thing, keep everything else the same, then count the sprouts and turn them into a percent.","words":[["germinate","When a seed wakes up and starts to grow.","i_germ"],["variable","The one thing you change in a fair test.","i_var"],["control","The setup you leave as usual, to compare with.","i_ctrl"]],"dyk":"Most seeds sprout just fine in the dark. A seed has enough packed food to grow its first root and shoot before it ever sees the sun.","story":{"title":"Two Jars on the Windowsill","text":"For the school science fair, Chananya and his sister Malka set up two jars of bean seeds on damp paper towels. One jar went on the sunny windowsill. The other went into the dark closet, next to Ima’s Pesach dishes. “Which jar will sprout first?” asked Malka."},"predict":{"q":"What will happen to the seeds in the dark closet?","o":["they sprout about as well","they do not sprout at all","they sprout but turn blue"],"reveal":"They sprouted about as well! Most seeds do not need light to wake up, only water, warmth and air. Once their leaves open, though, the closet seedlings turned pale. Malka moved them to the window to catch up."},"checks":[{"q":"In a fair test, how many things do you change?","o":["only one","two or three","everything"],"h":"Change One Thing!"}],"nif":{"text":"A dry seed can wait quietly for a long time, and then, with a little water, it bursts into life. Hashem placed a ready-to-grow plant and its first meal inside every tiny seed."}},"SCI.PLANT.L07.03":{"big":"If a mushroom grows in the ground, why is it not a plant?","intro":"Fungi, like mushrooms, molds and yeast, have no green leaves, so they cannot make their own food. Instead they break down dead things and return them to the soil. One tiny fungus, yeast, eats sugar and gives off gas bubbles that make challah rise.","words":[["fungi","Living things like mushrooms, mold and yeast that cannot make their own food.","i_fungi"],["decomposer","A living thing that breaks down dead things.","i_decomp"],["yeast","A tiny fungus that puffs up dough with gas bubbles.","i_yeast"]],"dyk":"The mushroom you see is only a small part of the fungus. Most of it is a web of thin threads hidden in the soil or wood.","story":{"title":"Erev Shabbos at Babbi’s","text":"Dovid and his cousin Esther came early on Friday to help Babbi bake challah. Babbi stirred yeast into warm water with a spoon of sugar. “Watch closely,” she said. “This yeast is alive.” After a few minutes, the top of the cup turned foamy. They mixed the dough, covered the bowl, and waited…"},"predict":{"q":"What will the dough look like in an hour?","o":["much bigger and puffy","smaller and dry","the same as before"],"reveal":"Much bigger! The yeast ate sugar and gave off bubbles of gas that puffed the dough up. Esther poked it, and it slowly sighed back down. Babbi said that was the sign it was ready to braid."},"checks":[{"q":"Why can a mushroom not make its own food?","o":["it has no green leaves","it lives in the dark","it is too small"],"h":"What do plants use to make food?"}],"nif":{"text":"Without fungi, fallen leaves and logs would pile up forever. Hashem made tiny recyclers that turn what is old into rich soil for new life, and even help us bake challah for Shabbos."}},"SCI.PLANT.L07.04":{"big":"How can an almond and a strawberry be cousins?","intro":"Scientists sort plants into families by their flowers, fruits and seeds, not by their size or color. Look for the family clue: a pod means the bean family, a grain on a grassy stalk means the grass family, juicy wedges in a peel mean the citrus family.","words":[["family","A group of plants with flowers, fruits and seeds built alike.","i_family"],["pod","A case that holds a row of seeds, like a pea pod.","i_pod"],["grain","The small, hard seed of a grass plant, like wheat or rice.","i_grain"]],"dyk":"Plants in the bean family have little bumps on their roots where helpful bacteria live. Together they put rich food back into the soil, so farmers plant beans to feed the next crop.","story":{"title":"Opa’s Grocery","text":"On Sunday, Eliezer helped Opa stock his little grocery store. “Today we sort by family,” said Opa, handing him a crate of apples, a box of strawberries and a bag of almonds. Eliezer laughed. “Those are not a family, Opa. One is a fruit, one is a berry, and one is a nut!”"},"predict":{"q":"Are apples, strawberries and almonds in the same plant family?","o":["yes, all in the rose family","no, three different families","only the apples and almonds"],"reveal":"Yes! All three are in the rose family. Their blossoms all have five petals around a ring of thin stalks. Eliezer gave the strawberries a new sign: “Rose Family, Aisle 2.”"},"checks":[{"q":"A plant’s seeds grow in a pod. Which family is it?","o":["the bean family","the rose family","the grass family"],"h":"Find the Family Clue!"}],"nif":{"text":"Thousands of kinds of plants, and each one has its own family pattern in its flowers and seeds. Hashem made every kind of plant with its own pattern, an order we can still see in every garden."}}};
 var TEACH={"SCI.PLANT.L07.01":{"theme":"lab","hook":"Not every plant grows from a seed! Three questions sort every plant you will ever meet.","big":"Plants come in four groups: mosses, ferns, cone plants and flowering plants.","remember":"Flowers turn into fruit, and fruit holds the seeds.","intro":["Step 1: plants make new plants with seeds or with spores.","Step 2: mosses have no tubes; ferns have tubes. Both use spores.","Step 3: cone plants keep bare seeds in cones.","Step 4: flowering plants grow seeds inside a fruit."],"ex":[{"q":"A plant has tubes and spores. Which group?","steps":["Tubes? Yes.","Seeds? No, it uses spores.","Tubes but spores: it is a fern."],"a":"a fern"},{"q":"A plant has tubes, seeds and flowers. Which group?","steps":["Tubes? Yes.","Seeds? Yes.","Flowers? Yes: seeds inside fruit."],"a":"a flowering plant"}],"oops":{"q":"Is a pine cone a fruit?","wrong":"Yes, it holds seeds.","right":"No, it is a cone.","why":"A fruit grows from a flower. Pines have no flowers; their seeds sit bare on the scales of a cone."},"idea":["Ask Three Questions like a detective: tubes? seeds? flowers?","Moss is a sponge; a fern is a straw; a pine is a box of seeds; an apple is a lunchbox."],"try":{"q":"Which group makes seeds inside a fruit?","o":["flowering plants","ferns","mosses"],"a":"flowering plants","steps":["Fruit grows from a flower.","So the group is…"]},"joke":"Why did the fern skip the party? It did not want to spore everyone with its stories!"},"SCI.PLANT.L07.02":{"theme":"lab","hook":"Two jars, one question, and a fair way to find the answer.","big":"Seeds need water, warmth and air to germinate. A fair test changes one thing.","remember":"A seed grows a root first, then a shoot.","intro":["Step 1: a seed wakes up with water, warmth and air.","Step 2: change only one thing; keep the rest the same.","Step 3: the control is the setup left as usual.","Step 4: percent sprouted = sprouted ÷ planted × 100."],"ex":[{"q":"You test warmth. What changes?","steps":["Change One Thing!","The thing you test is warmth.","So only the warmth changes."],"a":"only the warmth"},{"q":"9 of 10 seeds sprouted. What percent?","steps":["9 ÷ 10 = 0.9.","0.9 × 100 = 90.","Add the % sign."],"a":"90%"}],"oops":{"q":"Do seeds need sunlight to sprout?","wrong":"Yes, every plant needs light.","right":"Most seeds do not.","why":"A seed lives on its packed food at first. It needs light later, once its leaves open."},"idea":["A seed is a backpacker with a packed lunch, waiting for rain.","A fair race: same track, same start, only the runners change."],"try":{"q":"What is the one thing you change in a fair test called?","o":["the variable","the control","the result"],"a":"the variable","steps":["It is the thing you test.","It varies, so it is the…"]},"joke":"Why was the bean so calm before the test? It knew it would sprout ahead!"},"SCI.PLANT.L07.03":{"theme":"lab","hook":"It grows in the forest, but it is not a plant. Meet the fungi!","big":"Fungi cannot make their own food; they break down dead things. Yeast makes dough rise.","remember":"Green leaves make food from sunlight, water and air.","intro":["Step 1: fungi have no green, so they cannot make food.","Step 2: they feed by breaking down dead things: decomposers.","Step 3: yeast eats sugar and gives off gas bubbles.","Step 4: stay safe: never taste wild mushrooms or moldy food."],"ex":[{"q":"Mold grows on an old orange. What is it doing?","steps":["Mold is a fungus.","Fungi feed on old, dead things.","So it is breaking down the orange."],"a":"breaking it down for food"},{"q":"Why is warm water used for yeast?","steps":["Yeast is alive.","Cold slows it down; boiling kills it.","Warm water wakes it up."],"a":"to wake it up"}],"oops":{"q":"Is a mushroom a plant because it grows from the ground?","wrong":"Yes, it grows like a plant.","right":"No, it is a fungus.","why":"It has no green leaves and cannot make its own food. That makes it a fungus."},"idea":["Fungi are the forest’s clean-up crew.","Yeast is a tiny baker’s helper that breathes out bubbles."],"try":{"q":"What gas makes challah dough puff up?","o":["carbon dioxide","oxygen","steam from the oven"],"a":"carbon dioxide","steps":["Yeast eats sugar.","It gives off a gas called…"]},"joke":"Why did the mushroom get invited to every simcha? Because he was a fun-gi!"},"SCI.PLANT.L07.04":{"theme":"lab","hook":"An almond and a strawberry are cousins? Let’s find the family clues.","big":"Plants are sorted into families by their flowers, fruits and seeds.","remember":"Grains like wheat are the seeds of grass plants.","intro":["Step 1: families share flowers, fruits and seeds.","Step 2: find the clue: pod, grain, wedges, vine, core.","Step 3: size and color do not count.","Step 4: some cousins surprise you: almonds and strawberries."],"ex":[{"q":"A plant grows long vines with big, seedy fruit. Which family?","steps":["Find the clue: a creeping vine.","Big fruit full of flat seeds.","That is the squash family."],"a":"the squash family"},{"q":"A tiny clover and a tall carob tree both grow pods. Same family?","steps":["Size does not count.","Both have the same clue: pods.","So both are in the bean family."],"a":"yes, the bean family"}],"oops":{"q":"Is a peanut in the nut tree family?","wrong":"Yes, it is called a nut.","right":"No, it is in the bean family.","why":"Peanuts grow in pods underground. The pod is the family clue, not the name."},"idea":["Families are like cousins who share the same smile: here, the flower and seed.","Grocery detective: sort the shelves by pod, grain, wedge and vine."],"try":{"q":"Which family grows grains on grassy stalks?","o":["the grass family","the rose family","the citrus family"],"a":"the grass family","steps":["Wheat, rice and oats are grains.","They grow on grassy stalks, so…"]},"joke":"Why did the pea pod call a family meeting? Everyone needed to be in the same pod!"}};
 var LABI={"SCI.PLANT.L07.01":{"kind":"key","title":"The Plant Key Walk","goal":"A mystery plant from the walk! Answer each question about it, one at a time, and the key leads you to its group.","plants":[["fern","Mystery plant A: tall feathery leaves with brown dots underneath.",[1,0]],["moss","Mystery plant B: a soft, low green carpet on a wet rock.",[0]],["pine","Mystery plant C: needles, woody cones, never a flower.",[1,1,0]],["rose","Mystery plant D: a bush with pink blossoms that turn into red hips full of seeds.",[1,1,1]]],"qs":["Does it have tubes inside to carry water?","Does it make seeds?","Does it have flowers and fruit?"],"ends":{"0":"MOSS: no tubes, so it stays low and soaks up water.","10":"FERN: tubes, but it makes spores.","110":"CONE PLANT: bare seeds in cones.","111":"FLOWERING PLANT: seeds inside a fruit."}},"SCI.PLANT.L07.02":{"kind":"sprout","title":"Sprout Lab","goal":"Run a fair test. Pick ONE thing to change in the test jar, guess what happens, then watch 10 seeds for 5 days.","vars":[["water","Water",["dry","damp","under water"],1],["warm","Warmth",["fridge","room","cozy warm"],1],["light","Light",["dark closet","windowsill"],1]]},"SCI.PLANT.L07.03":{"kind":"diff","title":"One Week Later","goal":"The same kitchen counter, Sunday and the next Sunday. Spot the 4 changes the fungi made!","spots":[["bread","Fuzzy mold grew on the old bread. Mold is a fungus feeding on it. Into the trash!"],["dough","The dough rose high. Yeast ate the sugar and gave off gas bubbles."],["orange","A blue-green mold grew on the orange. Fungi break down old fruit."],["pot","A little mushroom popped up in the plant pot, feeding on old bits of wood in the soil."]]},"SCI.PLANT.L07.04":{"kind":"graph","title":"Family Shelf Graph","goal":"Opa’s new crates came in! Tap each crate’s family to stack it on the graph. Then answer the question.","fams":[["rose","rose family"],["bean","bean family"],["grass","grass family"],["citrus","citrus family"]],"crates":[["apples","rose"  var SK={"SCI.SKY.L07.01":{"name":"Gravity Pulls Everything","band":"5-6","teach":[{"how":"Step 1. Gravity is a pull between ANY two things that have mass, which means stuff. The earth pulls you, and you pull the earth too, just very weakly.","q":"Which things pull on each other with gravity?","o":["every two things that have mass","only the earth and things that fall","only very large planets and stars"],"h":"Even you and your desk are part of the answer.","pic":"🚀","why":"Your pull on a desk is far too tiny to feel. The earth is so huge that its pull is the one we notice."},{"how":"Step 2. More mass means a stronger pull. Being closer also means a stronger pull. Twice as far away, the pull drops to one quarter.","q":"Planet A has much more mass than planet B. On which one is the pull of gravity stronger?","o":["planet A","planet B","both pull the same"],"h":"Big and Close! Which one has more stuff in it?","pic":"🚀","why":"Jupiter has far more mass than the earth, so it pulls much harder. Far out in space, every pull grows weak."},{"how":"Step 3. Mass is how much stuff is in you. Weight is how hard gravity pulls on that stuff. Your mass stays the same everywhere; your weight changes.","q":"An astronaut flies from the earth to the moon. What changes?","o":["his weight changes, his mass stays","his mass changes, his weight stays","both his mass and his weight stay"],"h":"Is he made of less stuff on the moon?","pic":"🚀","why":"The moon pulls more weakly than the earth, so he weighs less there. He is still made of exactly the same stuff."}],"we":[{"q":"Gedalya lifts a box of books, then a box of pillows the same size. Which box does the earth pull on harder?","o":["the box of books","the box of pillows"],"steps":["Both boxes are the same size.","One is packed with heavy stuff.","More mass means a stronger pull, so..."],"pic":"🚀"},{"q":"A space probe flies farther and farther from the earth. What happens to the earth’s pull on it?","o":["it gets weaker","it gets stronger"],"steps":["Gravity depends on mass and distance.","The earth’s mass stays the same.","The distance grows, so the pull..."],"pic":"🚀"}],"practice":[{"t":"sort","q":"Sort them: a stronger pull, or a weaker pull?","bins":[{"id":"S","label":"a stronger pull"},{"id":"W","label":"a weaker pull"}],"items":[{"label":"standing on giant Jupiter","bin":"S"},{"label":"standing on the earth","bin":"S"},{"label":"very close to the sun","bin":"S"},{"label":"standing on the small moon","bin":"W"},{"label":"far out in deep space","bin":"W"},{"label":"on a tiny rock in space","bin":"W"}],"h":"Big and Close! Ask: lots of mass? Close by?","pic":"🚀","why":"Jupiter, the earth and the sun have lots of mass close by. The moon and a tiny rock have little mass, and deep space is far from everything."},{"t":"pairs","q":"Match each gravity word to its meaning.","pairs":[["mass","how much stuff something has"],["weight","how hard gravity pulls on it"],["gravity","the pull between things with mass"]],"h":"One word is the stuff, one is the pull on the stuff, one is the pull itself.","pic":"🚀","why":"Mass stays the same; weight depends on where you are; gravity is the pull itself."},{"t":"spotall","q":"Tap every thing that would make the pull between two balls STRONGER.","cells":[{"label":"give one ball more mass","ok":true},{"label":"move the balls closer","ok":true},{"label":"give both balls more mass","ok":true},{"label":"move the balls farther apart","ok":false},{"label":"paint the balls a new color","ok":false}],"h":"Only two things matter for gravity. Check each card for them.","pic":"🚀","why":"More mass or less distance makes the pull stronger. Color has nothing to do with gravity."},{"t":"sort","q":"Sort them: does it change on the moon, or stay the same?","bins":[{"id":"C","label":"changes on the moon"},{"id":"K","label":"stays the same"}],"items":[{"label":"how much you weigh","bin":"C"},{"label":"how high you can jump","bin":"C"},{"label":"how fast a dropped ball speeds up","bin":"C"},{"label":"how much stuff you are made of","bin":"K"},{"label":"how many marbles are in a bag","bin":"K"},{"label":"how long your ruler is","bin":"K"}],"h":"The moon’s pull is weaker. Which cards depend on the pull?","pic":"🚀"},{"t":"type","q":"Review: the moon’s pull makes the oceans bulge, so the sea rises and falls each day. Type the name of this rising and falling: ____.","a":"tides","alt":["tide","the tides"],"kb":"abc","h":"Think back to the beach lesson: high and low...","pic":"🚀","why":"The tides! The moon’s gravity pulls on the oceans. That is gravity working across the space between the moon and the earth."},{"t":"num","q":"Review: Earth is planet number 3 from the sun and Jupiter is number 5. How many planets are in between them?","a":1,"h":"Count the numbers that come between 3 and 5.","pic":"🚀","why":"Only planet number 4, Mars, sits between them. Mars is smaller than the earth, so its pull is weaker."}],"check":[{"q":"Why do we feel the earth’s pull but not the pull of a big building nearby?","o":["the earth has far more mass","the building is too far away","buildings do not have gravity"],"h":"Big and Close! Compare how much stuff is in each one.","pic":"🚀"},{"t":"num","q":"At 1 step away, two balls pull with a strength of 100. Twice as far away, the pull drops to one quarter. How strong is the pull at 2 steps?","a":25,"h":"One quarter of the pull: divide by 4.","pic":"🚀","why":"100 ÷ 4 = 25. Twice as far means one quarter of the pull, so gravity fades fast with distance."},{"t":"num","q":"At 1 step away a pull is 64. How strong is it 2 steps away, if twice as far means one quarter?","a":16,"h":"Divide by 4.","pic":"🚀"}],"re":[{"t":"pairs","q":"Game: match each place to its pull.","pairs":[["on giant Jupiter","a much stronger pull than at home"],["on the earth","the pull we are used to"],["on the small moon","a much weaker pull than at home"]],"h":"Which one has the most mass? The least?","pic":"🚀"},{"t":"sort","q":"Simpler: lots of mass, or a little mass?","bins":[{"id":"L","label":"lots of mass"},{"id":"A","label":"a little mass"}],"items":[{"label":"the earth","bin":"L"},{"label":"the sun","bin":"L"},{"label":"a giant planet","bin":"L"},{"label":"a feather","bin":"A"},{"label":"a pencil","bin":"A"},{"label":"a paper clip","bin":"A"}],"h":"Which ones are huge?","pic":"🚀"},{"t":"spotall","q":"Back to basics: tap every thing gravity does here on the earth.","cells":[{"label":"pulls a dropped cup to the floor","ok":true},{"label":"brings you down after a jump","ok":true},{"label":"makes water run downhill","ok":true},{"label":"pushes smoke up the chimney","ok":false},{"label":"lifts a kite into the wind","ok":false}],"h":"Think back to Gravity Pulls Down: which way does it pull?","pic":"🚀"}]},"SCI.SKY.L07.02":{"name":"Falling Together","band":"5-6","teach":[{"how":"Step 1. Gravity speeds up every falling thing in the same way. Without air in the way, a heavy thing and a light thing fall together and land together.","q":"A heavy hammer and a light marble are dropped together from a ladder. Which lands first?","o":["they land together","the heavy hammer lands first","the light marble lands first"],"h":"Air hardly slows either one. Does gravity pick favorites?","pic":"🚀","why":"The earth pulls the hammer harder, but the hammer is also harder to get moving. The two effects balance out exactly."},{"how":"Step 2. Air pushes up against anything falling through it. This push is called air resistance. Wide, light things, like a feather or a parachute, get slowed down a lot.","q":"So why does a feather float down so slowly?","o":["the air pushes up against it","gravity pulls it more weakly","feathers are lighter than air"],"h":"What is all around the feather as it falls?","pic":"🚀","why":"A feather is wide and very light, so the air’s push is almost as big as gravity’s pull. A marble cuts through the air easily."},{"how":"Step 3. A dropped thing starts slow and keeps speeding up. Near the earth, it gains about 10 meters per second of speed every second.","q":"Each second, a falling stone speeds up by about 10 meters per second. How fast is it going after 2 seconds?","o":["20 meters per second","10 meters per second","40 meters per second"],"h":"Add 10 for each second.","pic":"🚀","why":"After 1 second: 10. After 2 seconds: 20. It falls faster and faster until it lands."}],"we":[{"q":"At the museum, Refoel watches a coin and a feather drop inside a tall tube with all the air pumped out. What happens?","o":["they fall side by side","the coin lands far ahead"],"steps":["The tube has no air inside.","No air means no air resistance.","Gravity speeds everything up the same, so..."],"pic":"🚀"},{"q":"Bracha drops one flat sheet of paper and one sheet squashed into a ball. Which reaches the floor first?","o":["the squashed ball","the flat sheet of paper"],"steps":["Both sheets have the same mass.","One shape is wide and catches air.","The air slows the wide one more, so..."],"pic":"🚀"}],"practice":[{"t":"sort","q":"Sort them: air slows it a lot, or air hardly slows it?","bins":[{"id":"A","label":"air slows it a lot"},{"id":"H","label":"air hardly slows it"}],"items":[{"label":"an open parachute","bin":"A"},{"label":"a falling maple seed","bin":"A"},{"label":"a flat sheet of paper","bin":"A"},{"label":"a steel ball","bin":"H"},{"label":"a small rock","bin":"H"},{"label":"a hammer","bin":"H"}],"h":"Take Away the Air! Ask: wide and light, or small and heavy?","pic":"🚀","why":"Wide, light things catch lots of air. Small, heavy things cut through it, so they fall almost as if there were no air."},{"t":"order","q":"A skydiver jumps from a plane. Put the fall in order.","tiles":["he jumps and starts speeding up","the air pushes back harder and harder","he opens his parachute","he floats down slowly and lands"],"h":"What must happen first, before any air can push?","pic":"🚀","why":"He speeds up, air resistance grows, the parachute catches lots of air, and he drifts down gently."},{"t":"spotall","q":"Tap every true thing about a room with all its air pumped out.","cells":[{"label":"a feather drops like a stone","ok":true},{"label":"a coin and a feather land together","ok":true},{"label":"nothing slows a falling thing","ok":true},{"label":"heavy things fall faster there","ok":false},{"label":"things float instead of falling","ok":false}],"h":"Gravity is still there. What is missing?","pic":"🚀","why":"With no air, nothing pushes back, so everything falls together. Gravity still pulls, so nothing floats."},{"t":"num","q":"A dropped stone falls about 5 meters by 1 second, 20 meters by 2 seconds, and 45 meters by 3 seconds. How many meters does it fall during the 3rd second alone?","a":25,"h":"Where is it at 3 seconds? Where was it at 2 seconds? Subtract.","pic":"🚀","why":"45 − 20 = 25 meters. In the 1st second it fell 5, in the 2nd 15, in the 3rd 25: it keeps speeding up."},{"t":"spotall","q":"Review: tap every change that makes gravity’s pull STRONGER.","cells":[{"label":"more mass","ok":true},{"label":"a shorter distance","ok":true},{"label":"a bigger planet","ok":true},{"label":"a longer distance","ok":false},{"label":"a smaller moon","ok":false}],"h":"Think back to Gravity Pulls Everything. Big and Close!","pic":"🚀","why":"More mass and less distance both make gravity stronger. Farther away or less mass makes it weaker."},{"t":"type","q":"Review: the moon has no air at all. An astronaut there drops a hammer and a feather. Type how they fall: ____.","a":"together","alt":["at the same time","side by side","the same"],"kb":"abc","h":"No air, no air resistance. Think back to The Moon Up Close.","pic":"🚀","why":"Together! With no air on the moon, nothing slows the feather, so it falls just like the hammer."}],"check":[{"q":"A bowling ball and a tennis ball are dropped from a low bridge. What happens?","o":["they land almost together","the bowling ball lands far sooner","the tennis ball lands far sooner"],"h":"Both are round and cut through air easily.","pic":"🚀"},{"t":"order","q":"Order these from slowest falling to fastest falling.","tiles":["an open parachute","a flat sheet of paper","a crumpled ball of paper","a steel marble"],"h":"Which one catches the most air?","pic":"🚀"},{"t":"num","q":"A dropped ball gains about 10 meters per second of speed each second. How fast is it falling after 3 seconds?","a":30,"h":"Add 10 for each second.","pic":"🚀"}],"re":[{"t":"pairs","q":"Game: match each fall to the reason.","pairs":[["a feather drifts slowly","air pushes up on it"],["a feather drops fast in the tube","there is no air inside"],["a coin drops fast in the room","air hardly slows it"]],"h":"Where is there air, and how much does it slow each one?","pic":"🚀"},{"t":"sort","q":"Simpler: wide and light, or small and heavy?","bins":[{"id":"W","label":"wide and light"},{"id":"S","label":"small and heavy"}],"items":[{"label":"a parachute","bin":"W"},{"label":"a leaf","bin":"W"},{"label":"an open umbrella","bin":"W"},{"label":"a marble","bin":"S"},{"label":"a stone","bin":"S"},{"label":"a metal key","bin":"S"}],"h":"Picture each one. Does it spread out?","pic":"🚀"},{"t":"spotall","q":"Back to basics: tap every thing that is missing on the moon.","cells":[{"label":"air to breathe","ok":true},{"label":"wind","ok":true},{"label":"air resistance","ok":true},{"label":"gravity","ok":false},{"label":"rocks and dust","ok":false}],"h":"Think back to The Moon Up Close: what does the moon NOT have?","pic":"🚀"}]},"SCI.SKY.L07.03":{"name":"Orbits: Falling Around","band":"5-6","teach":[{"how":"Step 1. Anything thrown sideways falls in a curve. The faster you throw it sideways, the farther it goes before gravity brings it down.","q":"Naftali throws a ball harder and harder, straight out. What happens each time?","o":["it lands farther away","it lands closer to him","it lands in the same spot"],"h":"A faster throw covers more ground before it drops.","pic":"🚀","why":"Gravity pulls the ball down at the same rate each time. A faster ball just travels farther sideways while it falls."},{"how":"Step 2. The earth is round. If a ball goes sideways fast enough, the ground curves away as fast as the ball falls. It keeps falling around the earth. That path is an orbit.","q":"Picture a giant launcher on a tall mountain that can throw super fast. Why could a fast enough ball never land?","o":["the round earth curves away under it","gravity stops pulling on it","it goes up so high it floats"],"h":"Sideways Plus Down! The earth is not flat.","pic":"🚀","why":"An orbit is not floating. It is falling all the time, while moving sideways so fast that it never hits the ground."},{"how":"Step 3. The moon moves sideways very fast, and the earth’s gravity keeps bending its path. The earth orbits the sun the same way.","q":"What keeps the moon going around the earth instead of flying off into space?","o":["the earth’s gravity","the sun’s light pushing it","air holding it in place"],"h":"There is no air in space. What pull is left?","pic":"🚀","why":"Without gravity, the moon would fly off in a straight line. Too slow, and it would fall in. Just right, and it circles."}],"we":[{"q":"Yosef Chaim spins a ball on a string around his head. The string snaps. Where does the ball go?","o":["straight off in a line","around and around in a circle"],"steps":["The string was pulling the ball inward.","Now nothing pulls it inward.","So it stops curving and flies..."],"pic":"🚀"},{"q":"A launcher throws a ball much faster than an orbit needs. What happens?","o":["it escapes into space","it crashes near the mountain"],"steps":["Faster means it goes farther before falling.","Much too fast, gravity cannot bend it all the way around.","So instead of circling, it..."],"pic":"🚀"}],"practice":[{"t":"pairs","q":"Match each launch speed to what the ball does.","pairs":[["slow","lands near the mountain"],["faster","lands far away"],["just right","circles the earth in an orbit"],["much too fast","escapes into space"]],"h":"Sideways Plus Down! Each speed goes a bit farther.","pic":"🚀","why":"Speed decides it: slow crashes nearby, faster crashes far off, just right orbits, too fast escapes."},{"t":"sort","q":"Sort them: what orbits the earth, or what orbits the sun?","bins":[{"id":"E","label":"orbits the earth"},{"id":"S","label":"orbits the sun"}],"items":[{"label":"the moon","bin":"E"},{"label":"the space station","bin":"E"},{"label":"a weather satellite","bin":"E"},{"label":"the earth","bin":"S"},{"label":"Mars","bin":"S"},{"label":"Jupiter","bin":"S"}],"h":"Ask of each card: which big thing is it circling?","pic":"🚀","why":"The moon and our machines circle the earth. The earth and the other planets circle the sun."},{"t":"spotall","q":"Tap every true thing about an orbit.","cells":[{"label":"it is falling all the time","ok":true},{"label":"it needs fast sideways speed","ok":true},{"label":"gravity bends the path","ok":true},{"label":"it means gravity has stopped","ok":false},{"label":"it only works with air","ok":false}],"h":"Sideways Plus Down! Which cards fit both parts?","pic":"🚀","why":"An orbit is falling around: fast sideways speed plus gravity bending the path. Space has no air, and gravity never stops."},{"t":"num","q":"The space station circles the earth about once every 90 minutes. How many times does it go around in 6 hours?","a":4,"h":"How many minutes are in 6 hours? Then divide by 90.","pic":"🚀","why":"6 hours = 360 minutes, and 360 ÷ 90 = 4 trips. That is about 16 trips every single day."},{"t":"num","q":"Review: in a tall tube with no air, a coin and a feather are dropped together. The coin lands after 2 seconds. After how many seconds does the feather land?","a":2,"h":"Think back to Falling Together. No air, no air resistance.","pic":"🚀","why":"2 seconds. With no air, the feather falls exactly like the coin. Gravity speeds them up the same."},{"t":"spotall","q":"Review: tap every thing that takes about one year.","cells":[{"label":"the earth going around the sun once","ok":true},{"label":"all four seasons passing by","ok":true},{"label":"from one Pesach to the next Pesach","ok":true},{"label":"the earth spinning around once","ok":false},{"label":"the moon going from new to full","ok":false}],"h":"Think back to A Year Around the Sun. Which one is only a day?","pic":"🚀","why":"One trip around the sun takes a year: four seasons, Pesach to Pesach. One spin is a day; new moon to full moon is about two weeks."}],"check":[{"q":"Why does the space station not fall down to the earth?","o":["it moves sideways fast enough","there is no gravity up there","its engines keep pushing it up"],"h":"Sideways Plus Down! It IS falling. Why does it miss?","pic":"🚀"},{"t":"order","q":"Order the launches from slowest to fastest.","tiles":["lands near the mountain","lands far from the mountain","circles the earth in an orbit","escapes into space"],"h":"The slowest one barely gets away from the mountain.","pic":"🚀"},{"t":"num","q":"The moon takes about 27 days to orbit the earth once. About how many days for 2 orbits?","a":54,"h":"Days for one orbit × 2.","pic":"🚀"}],"re":[{"t":"pairs","q":"Game: match each orbit to what is in the middle.","pairs":[["the moon’s orbit","the earth"],["the earth’s orbit","the sun"],["the orbits of Jupiter’s big moons","Jupiter"]],"h":"Who is circling whom?","pic":"🚀"},{"t":"sort","q":"Simpler: does its path curve, or go straight?","bins":[{"id":"C","label":"its path curves"},{"id":"S","label":"it goes straight"}],"items":[{"label":"a ball thrown across the yard","bin":"C"},{"label":"the moon around the earth","bin":"C"},{"label":"the space station around the earth","bin":"C"},{"label":"a toy car rolling on a flat floor","bin":"S"},{"label":"a sled sliding on flat ice","bin":"S"},{"label":"a puck gliding on a table","bin":"S"}],"h":"Which ones bend down or around?","pic":"🚀"},{"t":"spotall","q":"Back to basics: tap every true thing about the earth’s trip around the sun.","cells":[{"label":"one trip takes about a year","ok":true},{"label":"the trip brings the seasons","ok":true},{"label":"the sun is in the middle","ok":true},{"label":"one trip takes one day","ok":false},{"label":"the sun goes around the earth","ok":false}],"h":"Think back to A Year Around the Sun.","pic":"🚀"}]},"SCI.SKY.L07.04":{"name":"Satellites at Work","band":"5-6","teach":[{"how":"Step 1. A satellite is anything that orbits a bigger thing. The moon is a natural satellite of the earth. People also launch machines into orbit: man-made satellites.","q":"What is a satellite?","o":["anything that orbits a bigger thing","a rocket that takes off from the earth","a star that shines at night"],"h":"Think back: what does the moon do around the earth?","pic":"🚀","why":"Thousands of machine satellites circle the earth right now, each one falling around the earth like the moon."},{"how":"Step 2. Satellites have jobs. Weather satellites photograph clouds and storms. Some carry phone and TV signals. Space telescopes look out at the stars.","q":"A weather satellite takes pictures from high above. What can it show?","o":["clouds and storms from above","what is inside a closed house","what time it is in Baltimore"],"h":"Picture looking down at the earth from very high up.","pic":"🚀","why":"From high up, a satellite can see a storm the size of a whole state and watch where it moves."},{"how":"Step 3. GPS satellites send out time signals. A phone hears at least 4 of them, works out how far away each one is, and finds its own spot on the map.","q":"Ima’s map app knows where her car is. How do GPS satellites help?","o":["the phone times signals from several satellites","one satellite follows each car with a camera","the satellites ask the phone where it is"],"h":"Follow the Signal! What travels from space to the phone?","pic":"🚀","why":"Each signal tells the phone how far that satellite is. Several distances meet at only one spot: the car."}],"we":[{"q":"Avigail sees a satellite dish on a roof that never moves. How can it keep pointing at the same satellite?","o":["the satellite circles once a day, with the earth","the satellite stands perfectly still in empty space"],"steps":["The earth spins once each day.","This satellite orbits once each day too.","They turn together, so to the dish it seems to..."],"pic":"🚀"},{"q":"Shmuel sees a bright dot glide across the night sky without blinking. It crosses in about 5 minutes. What could it be?","o":["the space station","a far-off star in its pattern"],"steps":["Stars stay in their patterns.","This dot moves quickly across the sky.","Something low and fast in orbit, like..."],"pic":"🚀"}],"practice":[{"t":"pairs","q":"Match each satellite to its job.","pairs":[["a weather satellite","photographs clouds and storms"],["a GPS satellite","sends time signals for maps"],["a phone satellite","passes calls far away"],["a space telescope","looks out at far-off stars"]],"h":"Follow the Signal! What does each one send or see?","pic":"🚀","why":"Each satellite has one main job: weather pictures, map signals, phone calls, or views of the stars."},{"t":"sort","q":"Sort them: needs satellites, or works without them?","bins":[{"id":"N","label":"needs satellites"},{"id":"W","label":"works without them"}],"items":[{"label":"a GPS map in a car","bin":"N"},{"label":"a weather map of a storm from above","bin":"N"},{"label":"a live call from a ship far out at sea","bin":"N"},{"label":"a flashlight","bin":"W"},{"label":"a kitchen timer","bin":"W"},{"label":"a bicycle bell","bin":"W"}],"h":"Follow the Signal! Does it get a signal from space?","pic":"🚀","why":"GPS, storm pictures and far-off calls depend on satellites. A flashlight, a timer and a bell work all on their own."},{"t":"order","q":"Put a satellite’s trip to work in order.","tiles":["engineers build and test it","a rocket carries it up","it reaches orbit and opens its panels","it starts sending signals down"],"h":"What has to happen before anything can fly?","pic":"🚀","why":"Build, launch, reach orbit and open the solar panels, then start working."},{"t":"num","q":"A GPS satellite circles the earth twice every day. How many times does it circle in one week?","a":14,"h":"Trips each day × days in a week.","pic":"🚀","why":"2 × 7 = 14 trips in a week. GPS satellites are high up, so they circle more slowly than the space station."},{"t":"type","q":"Review: the curved path the moon follows around the earth is called its ____.","a":"orbit","alt":["an orbit","its orbit"],"kb":"abc","h":"Think back to Falling Around.","pic":"🚀","why":"An orbit: the path of something falling around a bigger thing, moving sideways fast enough to keep missing it."},{"t":"sort","q":"Review: sort them: falls fast, or falls slowly because of air?","bins":[{"id":"F","label":"falls fast"},{"id":"A","label":"falls slowly because of air"}],"items":[{"label":"a dropped wrench","bin":"F"},{"label":"a dropped spoon","bin":"F"},{"label":"a falling acorn","bin":"F"},{"label":"a balloon with no string","bin":"A"},{"label":"a floating dandelion seed","bin":"A"},{"label":"an open parachute","bin":"A"}],"h":"Think back to Falling Together. Take Away the Air!","pic":"🚀","why":"Small, heavy things cut through the air. Wide or light things, like a parachute or a seed, are slowed a lot."}],"check":[{"q":"Why do satellites carry big flat panels like wings?","o":["to make power from sunlight","to flap and steer in the wind","to keep the satellite cool"],"h":"There is no wind in space. What shines there all the time?","pic":"🚀"},{"t":"sort","q":"Sort these jobs: done from orbit, or done on the ground?","bins":[{"id":"O","label":"done from orbit"},{"id":"G","label":"done on the ground"}],"items":[{"label":"photographing a hurricane from above","bin":"O"},{"label":"sending GPS time signals","bin":"O"},{"label":"passing a call across an ocean","bin":"O"},{"label":"measuring rain in a backyard cup","bin":"G"},{"label":"checking a thermometer on the porch","bin":"G"},{"label":"reading a map on paper","bin":"G"}],"h":"Does the job need to be high above the earth?","pic":"🚀","chk":true},{"t":"num","q":"A satellite sends a picture every 15 minutes. How many pictures does it send in 3 hours?","a":12,"h":"How many minutes in 3 hours? Divide by 15.","pic":"🚀"}],"re":[{"t":"pairs","q":"Game: match each thing to how it orbits.","pairs":[["the moon","a natural satellite of the earth"],["a weather satellite","a machine satellite of the earth"],["the earth","a planet that orbits the sun"]],"h":"Which one did people build?","pic":"🚀"},{"t":"sort","q":"Simpler: a natural satellite, or a machine satellite?","bins":[{"id":"N","label":"a natural satellite"},{"id":"M","label":"a machine satellite"}],"items":[{"label":"the moon","bin":"N"},{"label":"Mars’s small moons","bin":"N"},{"label":"Jupiter’s big moons","bin":"N"},{"label":"the space station","bin":"M"},{"label":"a GPS satellite","bin":"M"},{"label":"a space telescope","bin":"M"}],"h":"Was it built by people?","pic":"🚀"},{"t":"spotall","q":"Back to basics: tap every true thing about the earth’s spin.","cells":[{"label":"one spin takes about 24 hours","ok":true},{"label":"the spin gives us day and night","ok":true},{"label":"the sun seems to rise in the east","ok":true},{"label":"one spin takes a whole year","ok":false},{"label":"the earth stands still","ok":false}],"h":"Think back to The Earth Spins.","pic":"🚀"}]}};
 var PAGE={"SCI.SKY.L07.01":{"big":"Does the earth pull on you, and do you pull on the earth?","intro":"Yes! Gravity is a pull between any two things that have mass. More mass makes a stronger pull, and being closer makes it stronger too. Mass is how much stuff you have; weight is how hard gravity pulls on it. Your mass is the same everywhere, but your weight changes from place to place.","words":[["gravity","The pull between any two things that have mass.","i_grav"],["mass","How much stuff something is made of. It stays the same everywhere.","i_mass"],["weight","How hard gravity pulls on something. It changes from place to place.","i_weight"]],"dyk":"You pull on the earth with your own gravity, and the earth pulls back on you just as hard. The earth is so huge that your tug barely moves it, while its tug keeps your feet on the ground.","story":{"title":"Moving Day","text":"The moving truck pulled up early on Sunday. Gedalya and his sister Chaya carried boxes while Tatty packed the truck. Gedalya grabbed a box marked BOOKS and nearly fell over. Chaya lifted a box marked PILLOWS with one hand. “Same size box,” said Gedalya. “Why is mine so much harder?”"},"predict":{"q":"Why does the earth pull harder on the box of books?","o":["it has more mass inside","it is closer to the ground","books are made of metal"],"reveal":"More mass! The books pack much more stuff into the same box, so the earth pulls on them harder. That pull is their weight. Tatty put the heavy boxes on the bottom of the truck."},"checks":[{"q":"What stays the same when you travel to the moon?","o":["your mass","your weight","how high you jump"],"h":"Are you made of less stuff there?"}],"nif":{"text":"One quiet pull holds the oceans in their place, keeps the moon by our side, and keeps every house and tree on the ground. Hashem made one pull that keeps the whole world in order."}},"SCI.SKY.L07.02":{"big":"If gravity pulls harder on heavy things, why don’t they fall faster?","intro":"Gravity speeds up every falling thing in the same way, so without air a heavy thing and a light thing fall together. Air pushes up against falling things: air resistance. Wide, light things, like a feather or a parachute, are slowed the most. A falling thing gains about 10 meters per second of speed every second.","words":[["air resistance","The push of air against something moving through it.","i_airres"],["vacuum","A space with all the air taken out.","i_vac"],["parachute","A wide cloth that catches lots of air and slows a fall.","i_chute"]],"dyk":"An astronaut on the moon once dropped a hammer and a feather at the same moment. With no air on the moon, they hit the dusty ground together.","story":{"title":"The Tallest Tube","text":"On Chol Hamoed, Pop took Refoel and his cousin Bracha to the science museum. In the middle of the hall stood a clear tube taller than a sukkah. Inside were a coin and a feather. A sign said: PUMP OUT THE AIR, THEN PRESS DROP. Refoel pumped until the pump stopped. Bracha held her finger over the button."},"predict":{"q":"With the air pumped out, what will the feather do?","o":["fall right next to the coin","float slowly to the bottom","stay floating at the top"],"reveal":"It fell right next to the coin! With no air in the tube, nothing pushed back on the feather. They hit the bottom with one soft click. “Again!” said Refoel, and Pop let the air back in to try it the normal way."},"checks":[{"q":"Why does a feather fall slowly in a normal room?","o":["the air pushes up on it","gravity does not pull it","it is lighter than air"],"h":"What was missing in the tube?"}],"nif":{"text":"Gravity treats every falling thing the same, and the air gently slows the leaves, seeds and snowflakes. Hashem set the rules of falling so that seeds can drift and rain can land softly."}},"SCI.SKY.L07.03":{"big":"Why doesn’t the moon fall down to the earth?","intro":"Anything thrown sideways falls in a curve. Throw it faster and it lands farther away. Because the earth is round, something moving sideways fast enough keeps falling but never lands: the ground curves away beneath it. That is an orbit. The moon orbits the earth, and the earth orbits the sun.","words":[["orbit","The curved path of something falling around a bigger thing.","i_orbit"],["speed","How fast something moves.","i_speed"],["escape","To go so fast that gravity cannot pull it back.","i_escape"]],"dyk":"The space station travels about 8 kilometers every second. That is fast enough to circle the whole earth in about an hour and a half.","story":{"title":"The Backyard Pitch","text":"After school, Naftali pitched to his brother Yosef Chaim in the backyard. Dod Shmuel watched from the porch. “Throw it harder,” said Dod Shmuel. The ball flew farther before it dropped. “Now picture a launcher on top of a giant mountain, so fast it could…” He stopped and smiled. “What do you think would happen?”"},"predict":{"q":"What would a super-fast ball from the mountain do?","o":["keep falling around the earth","fly up and float away","stop in the air and drop"],"reveal":"It would keep falling around the earth! The round earth curves away under it as fast as it falls. Naftali looked up at the moon. “So the moon is falling too?” “All the time,” said Dod Shmuel."},"checks":[{"q":"What keeps the moon on its curved path?","o":["the earth’s gravity","the sun’s light","the air around it"],"h":"There is no air in space."}],"nif":{"text":"The moon has circled the earth all through our history, never crashing and never flying off. Hashem set the moon’s speed and the earth’s pull just right, so the moon keeps its path for us."}},"SCI.SKY.L07.04":{"big":"What are all those machines circling the earth, and what do they do for us?","intro":"A satellite is anything that orbits a bigger thing. The moon is a natural satellite. People also launch machine satellites into orbit. Weather satellites photograph storms, GPS satellites send time signals so maps know where you are, and other satellites pass calls or look at the stars. A satellite that orbits once a day stays over one spot.","words":[["satellite","Anything that orbits a bigger thing.","i_sat"],["GPS","Satellites that send time signals so a map can find your spot.","i_gps"],["solar panel","A flat panel that makes power from sunlight.","i_panel"]],"dyk":"Some satellites are so high that one orbit takes exactly as long as one spin of the earth. They seem to hang still above one spot, so a dish on a roof can aim at them all day.","story":{"title":"Rain or Shine?","text":"On Thursday night, Avigail and her brother Shmuel planned the Sunday picnic with Ima. “Will it rain?” asked Shmuel. Avigail opened the weather map. A swirl of white clouds was moving across the map, slowly, toward Baltimore. “That picture,” said Ima, “was taken from space.”"},"predict":{"q":"Who took the picture of the clouds?","o":["a weather satellite in orbit","a plane flying over the clouds","a camera on a tall building"],"reveal":"A weather satellite, high above the earth! It sends a new picture every few minutes. By Friday the swirl had moved past. The picnic was on."},"checks":[{"q":"What is a satellite?","o":["anything that orbits a bigger thing","any rocket that takes off","a star that moves"],"h":"Think of the moon."}],"nif":{"text":"People learned the rules of orbits and built machines that follow them, high above our heads. Hashem gave people the wisdom to learn His world and use it to help one another."}}};
 var TEACH={"SCI.SKY.L07.01":{"theme":"lab","hook":"You pull on the earth, and the earth pulls on you. Who wins the tug?","big":"Gravity pulls any two things with mass. More mass or less distance makes it stronger.","remember":"Gravity pulls things down toward the earth.","intro":["Step 1: gravity pulls between any two things with mass.","Step 2: more mass makes a stronger pull.","Step 3: being closer makes a stronger pull.","Step 4: mass stays the same; weight is the pull and can change."],"ex":[{"q":"Planet A has more mass than planet B. Which pulls harder?","steps":["Big and Close!","Same distance, so look at mass.","More mass: stronger pull."],"a":"planet A"},{"q":"A pull is 40 at 1 step. How strong at 2 steps?","steps":["Twice as far.","Twice as far means one quarter.","40 ÷ 4 = 10."],"a":"10"}],"oops":{"q":"Is there no gravity in space?","wrong":"Yes, things float up there.","right":"No, gravity reaches far out.","why":"Gravity gets weaker with distance, but it never stops. It is what keeps the moon circling the earth."},"idea":["Big and Close! More stuff, or nearer, means a stronger pull.","Mass is the stuff in the box; weight is how hard the earth tugs the box."],"try":{"q":"What stays the same on the moon?","o":["your mass","your weight","your jump height"],"a":"your mass","steps":["Are you made of less stuff there?","No, so the same thing is your…"]},"joke":"Why did the astronaut bring a scale to the moon? He wanted to lose weight without trying!"},"SCI.SKY.L07.02":{"theme":"lab","hook":"A hammer and a feather. Which one wins the race to the ground?","big":"Without air, everything falls together. Air resistance slows wide, light things.","remember":"There is no air on the moon.","intro":["Step 1: gravity speeds every falling thing the same way.","Step 2: air pushes back: air resistance.","Step 3: wide, light things are slowed the most.","Step 4: a falling thing gains about 10 m/s every second."],"ex":[{"q":"A brick and a marble are dropped together. Which lands first?","steps":["Take Away the Air!","Air hardly slows either one.","So they land together."],"a":"together"},{"q":"How fast is a dropped stone going after 4 seconds?","steps":["It gains about 10 each second.","4 seconds × 10.","About 40 meters per second."],"a":"40 m/s"}],"oops":{"q":"Do heavy things always fall faster?","wrong":"Yes, heavy means fast.","right":"No, not without air.","why":"Gravity speeds everything the same. Only the air makes some things, like feathers, fall slower."},"idea":["Take Away the Air! Then every race to the ground is a tie.","A parachute is a big air-catcher."],"try":{"q":"What slows a falling feather?","o":["air resistance","weak gravity","its color"],"a":"air resistance","steps":["In a tube with no air, it falls fast.","So what slows it in a room?"]},"joke":"Why did the feather lose the race in the kitchen? It got too caught up in the air!"},"SCI.SKY.L07.03":{"theme":"lab","hook":"The moon is falling right now. Why does it never land?","big":"An orbit is falling around: fast sideways speed plus gravity.","remember":"The earth goes around the sun once a year.","intro":["Step 1: anything thrown sideways falls in a curve.","Step 2: faster sideways means it lands farther away.","Step 3: fast enough, the round earth curves away: an orbit.","Step 4: much too fast, it escapes into space."],"ex":[{"q":"A launch is a little too slow for an orbit. What happens?","steps":["Sideways Plus Down!","Gravity bends it down too soon.","It lands far away."],"a":"it lands far away"},{"q":"The space station takes 90 minutes per orbit. How many in 3 hours?","steps":["3 hours = 180 minutes.","180 ÷ 90 = 2.","2 orbits."],"a":"2"}],"oops":{"q":"Does the space station float because there is no gravity?","wrong":"Yes, there is no gravity up there.","right":"No, it is falling around.","why":"Gravity up there is almost as strong as on the ground. The station is falling all the time, but moves sideways so fast that it keeps missing the earth."},"idea":["Sideways Plus Down! Fast sideways, falling down: that makes a circle.","An orbit is a fall that never lands."],"try":{"q":"What does an orbit need besides gravity?","o":["fast sideways speed","air to hold it up","a long rope"],"a":"fast sideways speed","steps":["Gravity pulls it down.","It misses the earth because it moves…"]},"joke":"Why did the moon skip dinner? It was already full!"},"SCI.SKY.L07.04":{"theme":"lab","hook":"Thousands of machines circle above you. What are they all doing?","big":"Satellites orbit the earth and do jobs: weather, maps, calls and stars.","remember":"The earth spins once about every 24 hours.","intro":["Step 1: a satellite is anything that orbits a bigger thing.","Step 2: machine satellites have jobs.","Step 3: GPS phones hear at least 4 satellites.","Step 4: one orbit a day keeps a satellite over one spot."],"ex":[{"q":"Which satellite helps plan a picnic?","steps":["Follow the Signal!","A picnic needs to know about rain.","Rain clouds: a weather satellite."],"a":"a weather satellite"},{"q":"A satellite sends a picture every 10 minutes. How many in 1 hour?","steps":["1 hour = 60 minutes.","60 ÷ 10 = 6.","6 pictures."],"a":"6"}],"oops":{"q":"Does a satellite need fuel to keep circling?","wrong":"Yes, or it would fall.","right":"No, it keeps falling around.","why":"Once it has its sideways speed, gravity keeps bending its path. Small engines only fix its path now and then."},"idea":["Follow the Signal! Space, to satellite, to your map.","A satellite is a helper falling around the earth."],"try":{"q":"What does a GPS satellite send down?","o":["time signals","photos of cars","phone calls"],"a":"time signals","steps":["The phone works out how far each one is.","For that it needs…"]},"joke":"Why did the satellite get good marks? It always stayed in orbit and never lost its signal!"}};
 var LABI={"SCI.SKY.L07.01":{"kind":"pull","title":"The Pull-o-Meter","goal":"Two balls, one pull. Use the + and − buttons to change their mass and the distance. Can you hit each target?","targets":[["Make the pull as STRONG as it can be.","max"],["Make the pull as WEAK as it can be.","min"],["Make the pull exactly 2 bars, using big mass.","two"]]},"SCI.SKY.L07.02":{"kind":"drop","title":"The Drop Tower","goal":"Pick two things, choose air or no air, guess the winner, then drop them!","things":[["feather","a feather",1],["coin","a coin",0],["hammer","a hammer",0],["paper","a flat paper",1],["ball","a paper ball",0]]},"SCI.SKY.L07.03":{"kind":"launch","title":"The Mountain Launcher","goal":"Set the launch speed and fire. Find the speed that makes an orbit, then the speed that escapes!","res":["It curved down and landed near the mountain.","Faster! It landed far from the mountain.","Faster still! It landed on the far side of the earth.","ORBIT! The earth curves away as fast as it falls. It keeps going around.","ESCAPE! Too fast for gravity to bend it all the way around."]},"SCI.SKY.L07.04":{"kind":"memory","title":"Satellite Memory","goal":"Flip two cards at a time. Match each satellite to its job!","cards":[["wx","weather satellite","clouds and storms"],["gps","GPS satellite","time signals for maps"],["tel","space telescope","far-off stars"],["iss","space station","a home for astronauts"]]}};

 // ---- Retro poster kit (house style of this unit: RETRO SPACE-TRAVEL POSTER: flat shapes, sunburst rays, a slightly off-register print shadow, bold condensed capitals). Original SVG, drawn in code. ----
 // Every drawer: (u, opt) => svg string; u = unique suffix so ids never clash. No people, no faces, no body parts. No Hebrew letters.
 var CR='#F3E6C8', CR2='#EAD8B0', NV='#1F2A44', TL='#1F6F78', TL2='#5FA8A8', CO='#E4613D', MU='#F0B23A', SKC='#9CC9C9', PL='#6B4E71', SA='#D9A066', GR='#7DA35A', WH='#FFF8EC', MO='#D8D2C0';
 var FF='font-family="Futura, \'Trebuchet MS\', \'Arial Black\', Arial, sans-serif" font-weight="800"';
 function rn(s){ var x=Math.sin(s*91.345)*47453.5453; return x-Math.floor(x); }
 function f1(n){ return (+n).toFixed(1); }
 function rays(u,cx,cy,n,c,op){ var b='', R=320; for(var i=0;i<n;i++){ var a1=(i*2)*Math.PI/n, a2=(i*2+1)*Math.PI/n; b+='M'+cx+' '+cy+' L'+f1(cx+R*Math.cos(a1))+' '+f1(cy+R*Math.sin(a1))+' L'+f1(cx+R*Math.cos(a2))+' '+f1(cy+R*Math.sin(a2))+' Z'; } return '<path d="'+b+'" fill="'+(c||CR2)+'" opacity="'+(op==null?.7:op)+'"/>'; }
 function pg(u,label,body,o){ o=o||{}; var w=o.w||240,h=o.h||150;
  return '<svg class="sciart g6go-art" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+label+'" xmlns="http://www.w3.org/2000/svg"><defs>'+
   '<clipPath id="gocl'+u+'"><rect x="5" y="5" width="'+(w-10)+'" height="'+(h-10)+'" rx="7"/></clipPath>'+
   '<filter id="gogr'+u+'"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .12  0 0 0 0 .16  0 0 0 0 .27  0 0 0 .07 0"/></filter>'+
   '</defs><rect width="'+w+'" height="'+h+'" rx="10" fill="'+NV+'"/><g clip-path="url(#gocl'+u+')"><rect width="'+w+'" height="'+h+'" fill="'+(o.bg||CR)+'"/>'+(o.ray?rays(u,o.ray[0],o.ray[1],o.ray[2]||18,o.rc,o.ro):'')+body+'<rect width="'+w+'" height="'+h+'" filter="url(#gogr'+u+')"/></g>'+
   '<rect x="5" y="5" width="'+(w-10)+'" height="'+(h-10)+'" rx="7" fill="none" stroke="'+NV+'" stroke-width="1.2"/></svg>'; }
 // off-register print shadow: same shape drawn 2px down-right in a dark tint, then the shape
 function sh(shape,dx){ dx=dx==null?2:dx; return '<g transform="translate('+dx+' '+dx+')" opacity=".28">'+shape.replace(/fill="[^"]*"/g,'fill="'+NV+'"').replace(/stroke="[^"]*"/g,'stroke="'+NV+'"')+'</g>'+shape; }
 function txt(x,y,t,sz,c,anc,ls){ return '<text x="'+x+'" y="'+y+'" '+FF+' font-size="'+(sz||9)+'" fill="'+(c||NV)+'" text-anchor="'+(anc||'middle')+'" letter-spacing="'+(ls==null?1.2:ls)+'">'+t+'</text>'; }
 function band(x,y,w,t,c,tc){ return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="14" rx="2" fill="'+(c||NV)+'"/>'+txt(x+w/2,y+10,t,8,tc||CR,'middle',1.6); }
 function circ(cx,cy,r,c,st){ return '<circle cx="'+f1(cx)+'" cy="'+f1(cy)+'" r="'+f1(r)+'" fill="'+c+'"'+(st?' stroke="'+st+'" stroke-width="1.4"':'')+'/>'; }

 var SK={"SCI.ANIM.L07.01":{"name":"Backbone or Not","band":"5-6","teach":[{"how":"Step 1. A backbone is a row of small bones down an animal’s back. An animal with a backbone is a vertebrate. Fish, frogs, snakes, birds and dogs all have one.","q":"What is a vertebrate?","o":["an animal with a backbone","any animal that lives in water","an animal with fur and four legs"],"h":"Think of the row of small bones down a fish’s back.","pic":"🐾","why":"The small bones in a backbone are called vertebrae. That is where the name vertebrate comes from."},{"how":"Step 2. An animal with no backbone is an invertebrate. Here “in” means “not”. Worms, snails, insects, spiders and jellyfish are all invertebrates.","q":"A worm, a snail and a jellyfish have no backbone. What are they called?","o":["invertebrates","vertebrate animals","mammals"],"h":"The first word means “with a backbone”. You need the opposite.","pic":"🐾","why":"In-vertebrate means not a vertebrate. These animals have no row of back bones at all."},{"how":"Step 3. Invertebrates win by far. Out of every 20 kinds of animals, about 19 have no backbone. Many, like insects and spiders, wear a hard shell outside instead.","q":"Most kinds of animals in the world have…","o":["no backbone at all","a backbone like ours","fur on their backs"],"h":"Think how many kinds of bugs there are.","pic":"🐾","why":"There are more kinds of beetles alone than all the kinds of vertebrates put together."}],"we":[{"q":"Pinchas finds a long row of small bones in the Shabbos fish. Is a fish a vertebrate?","o":["yes, it has a backbone","no, it lives in water"],"steps":["A vertebrate has a backbone.","The row of bones runs down its back.","So the fish is…"],"pic":"🐾"},{"q":"Miriam finds a snail in the garden. It has a hard shell but no bones inside. Vertebrate or invertebrate?","o":["invertebrate","vertebrate"],"steps":["A shell is not a backbone.","No bones inside means no backbone.","So the snail is…"],"pic":"🐾"}],"practice":[{"t":"sort","q":"Sort them: backbone, or no backbone?","bins":[{"id":"V","label":"vertebrate: backbone"},{"id":"I","label":"invertebrate: no backbone"}],"items":[{"label":"a salmon","bin":"V"},{"label":"a frog","bin":"V"},{"label":"a robin","bin":"V"},{"label":"an earthworm","bin":"I"},{"label":"a jellyfish","bin":"I"},{"label":"a ladybug","bin":"I"}],"h":"Find the Backbone! Picture a row of bones down its back.","pic":"🐾","why":"Fish, frogs and birds have backbones. Worms, jellyfish and ladybugs have none."},{"t":"pairs","q":"Match each animal to what holds its body up.","pairs":[["a dog","bones inside, with a backbone"],["a beetle","a hard skeleton on the outside"],["a jellyfish","the water around it"]],"h":"Some skeletons are inside, some are outside, and some animals have none.","pic":"🐾","why":"A dog has bones inside. A beetle wears its skeleton outside, like armor. A jellyfish is held up by the water."},{"t":"spotall","q":"Tap every invertebrate.","cells":[{"label":"an octopus","ok":true},{"label":"a spider","ok":true},{"label":"a starfish","ok":true},{"label":"a lizard","ok":false},{"label":"a pigeon","ok":false}],"h":"Find the Backbone! Tap only the ones with none.","pic":"🐾","why":"An octopus, a spider and a starfish have no backbone. A lizard and a pigeon do."},{"t":"sort","q":"Sort them: vertebrate, or invertebrate?","bins":[{"id":"V","label":"vertebrate"},{"id":"I","label":"invertebrate"}],"items":[{"label":"a shark","bin":"V"},{"label":"a bat","bin":"V"},{"label":"a snake","bin":"V"},{"label":"a bee","bin":"I"},{"label":"a squid","bin":"I"},{"label":"a sea star","bin":"I"}],"h":"Check each one for a backbone.","pic":"🐾"},{"t":"type","q":"Review: grass and trees make their own food from sunlight. A living thing that makes its own food is a ____.","a":"producer","alt":["a producer","producers"],"kb":"abc","h":"Think back to Producers and Consumers.","pic":"🐾","why":"A producer! Every food chain starts with one. Animals, with a backbone or without, are consumers."},{"t":"num","q ve groups: fish, amphibians, reptiles, birds and mammals. Each group has a clue of its own. Only birds have feathers. Only mammals have hair and feed their babies milk.","q":"Which clue tells you for sure that an animal is a bird?","o":["it has feathers","it lays eggs","it has a backbone"],"h":"Many animals lay eggs. Which clue belongs to birds alone?","pic":"🐾","why":"Snakes and fish lay eggs too, and every vertebrate has a backbone. Only birds have feathers."},{"how":"Step 2. Look at the skin. Fish have wet scales and fins. Amphibians, like frogs, have moist, smooth skin. Reptiles, like snakes and turtles, have dry scales.","q":"Which group has moist skin and starts life in the water, breathing with gills?","o":["amphibians","reptiles","mammals"],"h":"Think of a tadpole.","pic":"🐾","why":"Frogs and salamanders start as swimmers with gills, then grow lungs. Their eggs have no shell, so they are laid in water."},{"how":"Step 3. Check the breath and the babies. Fish breathe water with gills. Mammals breathe air with lungs and feed their babies milk. Birds and mammals also keep their bodies warm on their own.","q":"A whale lives in the sea and has fins. Why is it a mammal, not a fish?","o":["it breathes air; its baby drinks milk","it is much bigger than any fish","it can swim far down into the deep sea"],"h":"Skin, Breath, Babies! Check how it breathes.","pic":"🐾","why":"A whale comes up to breathe through a blowhole and feeds its calf milk. Those are mammal clues, even in the ocean."}],"we":[{"q":"Tzvi holds up a card with a bat. It flies, but it has fur and feeds its babies milk. Which group?","o":["mammals","birds"],"steps":["Flying is not a group clue.","Fur and milk: which group has both?","So the bat belongs with the…"],"pic":"🐾"},{"q":"Dina’s card shows a penguin. It cannot fly, but it has feathers and lays eggs. Which group?","o":["birds","mammals"],"steps":["Flying is not the clue here.","Feathers belong to one group alone.","So the penguin belongs with the…"
