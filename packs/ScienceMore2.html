","pic":"🐾"}]},"SCI.ANIM.L07.03":{"name":"Insect or Spider?","band":"5-6","teach":[{"how":"Step 1. Every insect has 6 legs and a body in 3 parts: the head, the thorax in the middle, and the abdomen at the back. All 6 legs grow from the thorax.","q":"An insect’s body has three parts. What are they called, front to back?","o":["head, thorax, abdomen","head, middle, back end","top, middle, bottom"],"h":"The middle part has a science name of its own.","pic":"🐾","why":"The head has the eyes and the two feelers. The thorax holds the legs and wings. The abdomen holds the parts that digest food."},{"how":"Step 2. A spider is not an insect. It has 8 legs and only 2 body parts. It has no feelers and no wings. Spiders belong to a group called arachnids, with ticks and scorpions.","q":"A spider has 8 legs. How many body parts does it have?","o":["two","three","six"],"h":"Count the round parts in the drawing.","pic":"🐾","why":"A spider’s head and middle are joined into one front part. All 8 legs grow from that front part."},{"how":"Step 3. Insects, spiders, centipedes and crabs are all arthropods: “jointed legs”. They have a hard skeleton on the outside, called an exoskeleton. To grow, they shed it and grow a new one.","q":"Insects and spiders wear their skeleton outside and have legs that bend at joints. What is this big group called?","o":["arthropods","amphibians","mammals"],"h":"The name means “jointed legs”.","pic":"🐾","why":"An arthropod’s armor cannot stretch. A growing grasshopper splits out of its old shell, and a new, bigger one hardens."}],"we":[{"q":"Meir finds a bug in the sukkah with 6 legs, 3 body parts and 2 feelers. Insect or spider?","o":["insect","spider"],"steps":["Count the legs: 6.","Count the parts: 3.","6 legs and 3 parts make it…"],"pic":"🐾"},{"q":"Henny sees a little creature in a web with 8 legs and 2 body parts. Insect or spider?","o":["spider","insect"],"steps":["Count the legs: 8.","Count the parts: 2.","8 legs and 2 parts make it…"],"pic":"🐾"}],"practice":[{"t":"sort","q":"Sort them: insect, arachnid, or another arthropod?","bins":[{"id":"I","label":"insect: 6 legs"},{"id":"S","label":"arachnid: 8 legs"},{"id":"O","label":"another arthropod"}],"items":[{"label":"an ant","bin":"I"},{"label":"a grasshopper","bin":"I"},{"label":"a tick","bin":"S"},{"label":"a scorpion","bin":"S"},{"label":"a centipede","bin":"O"},{"label":"a millipede","bin":"O"}],"h":"Count Legs, Count Parts! Count each one’s legs first.","pic":"🐾","why":"Ants and grasshoppers have 6 legs. Ticks and scorpions have 8. Centipedes and millipedes have many more."},{"t":"pairs","q":"Match each body part to what grows from it.","pairs":[["the head","the eyes and two feelers"],["the thorax","6 legs and the wings"],["the abdomen","nothing: it holds the food parts"]],"h":"Start in the middle: where do the legs grow?","pic":"🐾","why":"Eyes and feelers are on the head. Legs and wings grow from the thorax. The abdomen holds the parts that digest food."},{"t":"spotall","q":"Tap every true thing about spiders.","cells":[{"label":"they have 8 legs","ok":true},{"label":"they have 2 body parts","ok":true},{"label":"many spin silk","ok":true},{"label":"they have 2 feelers","ok":false},{"label":"they have wings","ok":false}],"h":"Count Legs, Count Parts! Picture one in its web.","pic":"🐾","why":"Spiders have 8 legs, 2 body parts, and many spin silk. They have no feelers and no wings."},{"t":"num","q":"Henny counts 4 spiders and 5 beetles on the sukkah wall. How many legs is that in all?","a":62,"h":"Spiders: 4 × 8. Beetles: 5 × 6. Then add.","pic":"🐾","why":"4 × 8 = 32 and 5 × 6 = 30, so 32 + 30 = 62 legs."},{"t":"pairs","q":"Review: match each animal to its vertebrate group.","pairs":[["a toad","amphibians"],["a sparrow","birds"],["a goat","mammals"]],"h":"Think back to the Five Groups. Skin, Breath, Babies!","pic":"🐾","why":"A toad has moist skin, a sparrow has feathers, and a goat has fur and feeds its kids milk."},{"t":"type","q":"Review: an insect has no backbone at all. An animal with no backbone is called an ____.","a":"invertebrate","alt":["invertebrates","an invertebrate"],"kb":"abc","h":"Think back to Backbone or Not.","pic":"🐾","why":"An invertebrate! Every insect and every spider is an invertebrate."}],"check":[{"q":"A creature has 8 legs, 2 body parts and no feelers. What is it?","o":["an arachnid","an insect","a centipede"],"h":"Count Legs, Count Parts! Which group has 8 legs?","pic":"🐾"},{"t":"order","q":"Put a grasshopper’s body parts in order, front to back.","tiles":["head","thorax","abdomen"],"h":"Which part has the eyes?","pic":"🐾"},{"t":"num","q":"A centipede has 1 pair of legs on each body section. This one has 15 sections. How many legs does it have?","a":30,"h":"A pair is 2.","pic":"🐾"}],"re":[{"t":"pairs","q":"Game: match each creature to its legs.","pairs":[["a beetle","6 legs"],["a tick","8 legs"],["a millipede","dozens of legs"]],"h":"Count them in your head, one side at a time.","pic":"🐾"},{"t":"sort","q":"Simpler: count the legs. 6 or 8?","bins":[{"id":"6","label":"6 legs"},{"id":"8","label":"8 legs"}],"items":[{"label":"a fly","bin":"6"},{"label":"a moth","bin":"6"},{"label":"a bee","bin":"6"},{"label":"a spider","bin":"8"},{"label":"a tick","bin":"8"},{"label":"a scorpion","bin":"8"}],"h":"Picture each one and count its legs.","pic":"🐾"},{"t":"spotall","q":"Back to basics: tap every insect.","cells":[{"label":"a ladybug","ok":true},{"label":"a butterfly","ok":true},{"label":"an ant","ok":true},{"label":"a spider","ok":false},{"label":"a worm","ok":false}],"h":"Think back to Insects: Six Legs.","pic":"🐾"}]},"SCI.ANIM.L07.04":{"name":"Groups Inside Groups","band":"5-6","teach":[{"how":"Step 1. Scientists sort living things like a set of boxes, one inside another. Animals is a big box. Inside it is a smaller box, vertebrates. Inside that is mammals.","q":"Scientists sort living things into groups inside groups. Which of these groups is the biggest?","o":["animals","vertebrates","mammals"],"h":"Which group holds the other two?","pic":"🐾","why":"Every mammal is a vertebrate, and every vertebrate is an animal. But not every animal is a mammal."},{"how":"Step 2. The smaller the box, the more alike the members. All animals are very different. Mammals share more. House cats share almost everything. One kind of living thing is called a species.","q":"In which group are the members MOST alike?","o":["house cats","all mammals","all animals"],"h":"Which box is the smallest?","pic":"🐾","why":"A whale and a mouse are both mammals, but they are very different. Two house cats are alike in almost every way."},{"how":"Step 3. Every species gets a science name of two words, the same in every country. The first word names a small group of close relatives; the second names the kind. A lion is Panthera leo.","q":"A house cat’s science name is Felis catus. How many words are in a science name?","o":["two","three","one"],"h":"Look at the name again, word by word.","pic":"🐾","why":"Scientists all over the world use the same name, so nobody mixes up which animal they mean."}],"we":[{"q":"Elchanan sorts a robin: living thing, then animal, then vertebrate. Which box comes next?","o":["birds","fish"],"steps":["A robin has feathers.","Feathers belong to one group.","So the next box is…"],"pic":"🐾"},{"q":"Yaakov says: “Every vertebrate is a mammal.” Is he right?","o":["no, think of a frog","yes, every single one"],"steps":["Mammals is a smaller box inside vertebrates.","Is there a vertebrate outside the mammal box?","A frog has a backbone but no fur, so…"],"pic":"🐾"}],"practice":[{"t":"order","q":"Put the boxes in order, biggest to smallest.","tiles":["living things","animals","vertebrates","mammals","house cats"],"h":"Each box must fit inside the one before it.","pic":"🐾","why":"Living things holds animals, animals holds vertebrates, vertebrates holds mammals, and mammals holds house cats."},{"t":"sort","q":"Sort them: inside the mammal box, or outside it?","bins":[{"id":"IN","label":"inside the mammal box"},{"id":"OUT","label":"outside the mammal box"}],"items":[{"label":"a bat","bin":"IN"},{"label":"a dolphin","bin":"IN"},{"label":"a goat","bin":"IN"},{"label":"an eagle","bin":"OUT"},{"label":"a gecko","bin":"OUT"},{"label":"a snail","bin":"OUT"}],"h":"Big Box, Small Box! Look for fur and milk.","pic":"🐾","why":"Bats, dolphins and goats have hair and feed their young milk. An eagle is a bird, a gecko a reptile, and a snail an invertebrate."},{"t":"spotall","q":"A box says ARTHROPODS. Tap every animal that fits inside it.","cells":[{"label":"a grasshopper","ok":true},{"label":"a spider","ok":true},{"label":"a centipede","ok":true},{"label":"an earthworm","ok":false},{"label":"a snail","ok":false}],"h":"Jointed legs and a skeleton on the outside.","pic":"🐾","why":"Grasshoppers, spiders and centipedes have jointed legs and an outside skeleton. Earthworms and snails have no legs at all."},{"t":"num","q":"A nature club has 40 animal pictures. 12 show vertebrates. How many pictures go in the invertebrate box?","a":28,"h":"Every animal fits in just one of the two boxes.","pic":"🐾","why":"40 − 12 = 28. Every animal is either a vertebrate or an invertebrate."},{"t":"num","q":"Review: a moth has 6 legs and a tick has 8. How many legs do 3 moths and 2 ticks have in all?","a":34,"h":"Count Legs, Count Parts! Multiply, then add.","pic":"🐾","why":"3 × 6 = 18 and 2 × 8 = 16, so 18 + 16 = 34 legs."},{"t":"type","q":"Review: frogs, toads and salamanders start life in water with gills. Their vertebrate group is called ____.","a":"amphibians","alt":["amphibian","the amphibians"],"kb":"abc","h":"Think back to The Five Vertebrate Groups.","pic":"🐾","why":"Amphibians! Moist skin, gills first and lungs later."}],"check":[{"q":"Which of these is TRUE about groups inside groups?","o":["every bird is a vertebrate","every vertebrate is a bird","every animal is a bird"],"h":"Big Box, Small Box! Which box sits inside which?","pic":"🐾"},{"t":"order","q":"Put these boxes in order, smallest to biggest.","tiles":["lions","the cat family","mammals","vertebrates"],"h":"Start with the box that holds just one kind.","pic":"🐾"},{"t":"num","q":"The cat family has about 40 kinds. Mammals have about 6,000 kinds. How many times as many kinds is that?","a":150,"h":"Divide the bigger number by the smaller one.","pic":"🐾"}],"re":[{"t":"pairs","q":"Game: match each animal to the smallest box shown.","pairs":[["a dolphin","mammals"],["a trout","fish"],["a gecko","reptiles"]],"h":"Check skin, breath and babies.","pic":"🐾"},{"t":"sort","q":"Simpler: inside the animal box, or outside it?","bins":[{"id":"A","label":"inside: an animal"},{"id":"N","label":"outside: not an animal"}],"items":[{"label":"a squirrel","bin":"A"},{"label":"a beetle","bin":"A"},{"label":"a jellyfish","bin":"A"},{"label":"an oak tree","bin":"N"},{"label":"a mushroom","bin":"N"},{"label":"a rock","bin":"N"}],"h":"Does it move about and eat its food?","pic":"🐾"},{"t":"spotall","q":"Back to basics: tap every animal with BOTH kosher signs.","cells":[{"label":"a cow","ok":true},{"label":"a sheep","ok":true},{"label":"a goat","ok":true},{"label":"a camel","ok":false},{"label":"a horse","ok":false}],"h":"Think back to Kosher Signs: check the hooves, then the chewing.","pic":"🐾"}]}};
 var PAGE={"SCI.ANIM.L07.01":{"big":"A fish, a worm and a snail are all animals. What makes the fish different?","intro":"The fish has a backbone: a row of small bones down its back. Animals with a backbone are vertebrates. Animals with no backbone are invertebrates. Most kinds of animals are invertebrates, and many of them, like insects and spiders, wear a hard skeleton on the outside instead.","words":[["vertebrate","An animal with a backbone, like a fish, a bird or a dog.","i_vert"],["invertebrate","An animal with no backbone, like a worm, a snail or a bee.","i_invert"],["backbone","A row of small bones, called vertebrae, down an animal’s back.","i_spine"]],"dyk":"A jellyfish has no bones, no shell and no hard parts at all. Out of the water it flops flat. In the sea, the water holds it up.","story":{"title":"The Fish Bones","text":"On Friday morning, Pinchas and his sister Miriam helped Grandma cook the Shabbos fish. When Grandma lifted the salmon, Pinchas saw a long row of tiny bones down its middle. Later, in the garden, Miriam held up a snail on one hand and a wriggly worm on the other. “Do these have bones too?” she asked."},"predict":{"q":"Does the worm have a backbone like the fish?","o":["no, it has no bones at all","yes, a tiny one deep inside","only after it grows up"],"reveal":"No bones at all! A worm is soft all the way through, and the snail has only its shell. They are invertebrates. Grandma laughed. “Good thing, too. Imagine picking bones out of a worm!”"},"checks":[{"q":"What do we call an animal with a backbone?","o":["a vertebrate","an invertebrate","an insect"],"h":"Think of the fish, not the worm."}],"nif":{"text":"From the tiny worm to the great whale, every creature has the body it needs: a backbone for some, a shell or armor for others. Hashem made each one just right for its life."}},"SCI.ANIM.L07.02":{"big":"A whale swims like a fish, and a bat flies like a bird. So why is neither one what it looks like?","intro":"Vertebrates come in five groups: fish, amphibians, reptiles, birds and mammals. To sort an animal, check three clues. Skin: wet scales, moist skin, dry scales, feathers or fur. Breath: gills or lungs. Babies: eggs in water, eggs with shells on land, or babies born alive and fed milk.","words":[["amphibian","A vertebrate with moist skin that starts life in water, like a frog.","i_amph"],["reptile","A vertebrate with dry scales that lays eggs on land, like a turtle.","i_rept"],["mammal","A vertebrate with hair that feeds its babies milk, like a goat.","i_mamm"]],"dyk":"A blue whale is the biggest animal that ever lived, and it is a mammal. Its baby drinks hundreds of liters of milk every day.","story":{"title":"The Rainy-Day Card Club","text":"It rained all Sunday, so Tzvi and his sister Dina spread their animal cards over the kitchen table. Daddy drew five boxes on a big paper: FISH, AMPHIBIANS, REPTILES, BIRDS, MAMMALS. The cards flew into place, until Tzvi held up three: a whale, a bat and a penguin. “These are the tricky ones,” said Daddy."},"predict":{"q":"Where does the whale card go?","o":["in the mammals box","in the fish box, it swims","in a new box of its own"],"reveal":"In the mammals box! A whale breathes air with lungs and feeds its baby milk. The bat went with the mammals too, and the penguin, with its feathers and eggs, went with the birds. Dina made a new sign for the table: CHECK THE CLUES, NOT THE LOOKS."},"checks":[{"q":"Which group feeds its babies milk?","o":["mammals","birds","reptiles"],"h":"Think of a calf and its mother."}],"nif":{"text":"Fish swim, birds fly, and mammals feed their young with milk. Hashem gave every group of animals its own wonders, and each one fills its place in the world."}},"SCI.ANIM.L07.03":{"big":"A spider is small, it crawls, and it lives in corners. So why isn’t it an insect?","intro":"Insects have 6 legs and 3 body parts: head, thorax and abdomen. Spiders have 8 legs and 2 body parts, so they are arachnids, like ticks and scorpions. Insects, spiders, centipedes and crabs are all arthropods: they have jointed legs and a hard skeleton on the outside.","words":[["insect","A small animal with 6 legs and 3 body parts, like an ant.","i_insect"],["arachnid","An animal with 8 legs and 2 body parts, like a spider.","i_arach"],["arthropod","An animal with jointed legs and its skeleton on the outside.","i_arthro"]],"dyk":"There are more kinds of insects than of all other animals put together. Scientists keep finding new ones every year.","story":{"title":"Who Lives in the Sukkah?","text":"When the family put up the sukkah, Meir and his cousin Henny found guests already there. A line of ants marched along the wall, a beetle hid under a board, and in the top corner hung a silky web with its owner in the middle. “Bugs, all of them,” said Meir. Aunt Rochel smiled. “Count their legs before you decide.”"},"predict":{"q":"Is the web-maker in the corner an insect?","o":["no, it has 8 legs","yes, every small crawler is","only if it has wings"],"reveal":"No! Henny counted 8 legs and 2 body parts: a spider, an arachnid. The ants and the beetle had 6 legs and 3 parts each, so they were insects. Meir gently carried the spider, web and all, to the bushes outside."},"checks":[{"q":"How many legs does an insect have?","o":["6","8","10"],"h":"Think of the ants on the wall."}],"nif":{"text":"A spider spins silk that is very strong for its weight, and an ant can carry many times its own weight. Hashem put great wisdom into even the smallest creatures."}},"SCI.ANIM.L07.04":{"big":"There are more kinds of living things than anyone can count. How do scientists keep them all in order?","intro":"Scientists sort living things into groups inside groups, like boxes inside boxes. Animals is a big box. Inside it are vertebrates, inside those are mammals, and inside those is the cat family. The smaller the box, the more alike its members. One kind is a species, and it gets a two-word science name.","words":[["species","One kind of living thing, like the house cat.","i_species"],["group","A box of living things that share the same clues.","i_box"],["science name","A two-word name for a species, the same everywhere.","i_name"]],"dyk":"The science name of the lion is Panthera leo. A scientist in Japan and a scientist in Brazil both use those same two words.","story":{"title":"The Library Shelves","text":"Mommy helps at the school library on Tuesdays, and today Elchanan and his brother Yaakov came along. A cart was piled high with new nature books. “Animal books go in this room,” said Mommy, “then the birds bookcase, then the owls shelf.” Yaakov grinned. “It’s like boxes inside boxes!”"},"predict":{"q":"Where should a new book about barn owls go?","o":["the owls shelf, in the birds case","the first shelf right by the door","any open shelf with space left"],"reveal":"The owls shelf, inside the birds bookcase, inside the animal room! Each step made the space smaller and the books more alike. That is just how scientists sort living things."},"checks":[{"q":"Which box is inside the vertebrates box?","o":["mammals","animals","living things"],"h":"Which one is smaller?"}],"nif":{"text":"The Torah tells that Adam gave a name to every animal. When we learn the order in the world of creatures, we see how wisely Hashem made every one."}}};
 var TEACH={"SCI.ANIM.L07.01":{"theme":"lab","hook":"A fish and a worm both wiggle. Only one of them has bones. Which one?","big":"Vertebrates have a backbone; invertebrates do not. Most kinds of animals are invertebrates.","remember":"Bones hold our body up and help us move.","intro":["Step 1: a backbone is a row of small bones down the back.","Step 2: with a backbone = vertebrate.","Step 3: no backbone = invertebrate (\"in\" means \"not\").","Step 4: about 19 of every 20 kinds of animals are invertebrates."],"ex":[{"q":"A pigeon. Vertebrate or invertebrate?","steps":["Find the Backbone!","A bird has bones down its back.","So it is a vertebrate."],"a":"vertebrate"},{"q":"A ladybug. Vertebrate or invertebrate?","steps":["Find the Backbone!","Its hard shell is outside; no bones inside.","So it is an invertebrate."],"a":"invertebrate"}],"oops":{"q":"Is a snail a vertebrate because it has a hard shell?","wrong":"Yes, hard means bones.","right":"No, a shell is not a backbone.","why":"A shell is a house on the outside. A vertebrate has a row of bones inside, down its back."},"idea":["Find the Backbone! Picture the animal, then picture a row of bones down its back.","In-vertebrate: \"in\" means \"not\", like in \"invisible\"."],"try":{"q":"An octopus has no bones at all. What is it?","o":["an invertebrate","a vertebrate animal","a fish"],"a":"an invertebrate","steps":["No bones means no backbone.","No backbone means…"]},"joke":"Why did the worm never play the backbone game? It just didn’t have the spine for it!"},"SCI.ANIM.L07.02":{"theme":"lab","hook":"A whale swims, a bat flies and a penguin waddles. Which one is a bird?","big":"Five vertebrate groups. Sort by skin, breath and babies, not by looks.","remember":"Feathers, fur and scales cover different animals.","intro":["Step 1: five groups: fish, amphibians, reptiles, birds, mammals.","Step 2: skin: wet scales, moist skin, dry scales, feathers, fur.","Step 3: breath: gills or lungs.","Step 4: babies: eggs in water, eggs on land, or born alive with milk."],"ex":[{"q":"Moist skin, gills when young, lungs later. Which group?","steps":["Skin, Breath, Babies!","Moist skin, and gills that turn to lungs.","That is the frog group."],"a":"amphibians"},{"q":"Fur, lungs, babies fed milk. Which group?","steps":["Skin, Breath, Babies!","Fur and milk.","That is the mammal group."],"a":"mammals"}],"oops":{"q":"Is a bat a bird because it flies?","wrong":"Yes, it has wings.","right":"No, it is a mammal.","why":"A bat has fur and feeds its babies milk. Flying is not a group clue: penguins are birds that cannot fly."},"idea":["Skin, Breath, Babies! Three clues, one group.","Check the clues, not the looks."],"try":{"q":"Dry scales, lungs, leathery eggs on land. Which group?","o":["reptiles","amphibians","fish"],"a":"reptiles","steps":["Dry scales, not moist skin.","Eggs on land, not in water, so…"]},"joke":"Why did the bat join the mammal club? Because the bird club said, “Show us one feather!”"},"SCI.ANIM.L07.03":{"theme":"lab","hook":"The spider in the corner is not an insect. Can you count why?","big":"Insects: 6 legs, 3 parts. Arachnids: 8 legs, 2 parts. Both are arthropods.","remember":"An insect has six legs.","intro":["Step 1: insect = 6 legs, 3 parts (head, thorax, abdomen).","Step 2: legs and wings grow from the thorax.","Step 3: arachnid = 8 legs, 2 parts, no feelers.","Step 4: arthropods = jointed legs + a skeleton outside."],"ex":[{"q":"6 legs, 3 parts, 2 feelers, 2 wings. What is it?","steps":["Count Legs, Count Parts!","6 legs and 3 parts.","That is an insect."],"a":"an insect"},{"q":"8 legs, 2 parts, no feelers. What is it?","steps":["Count Legs, Count Parts!","8 legs and 2 parts.","That is an arachnid."],"a":"an arachnid"}],"oops":{"q":"Is every small crawling bug an insect?","wrong":"Yes, a bug is a bug.","right":"No, count the legs first.","why":"Spiders and ticks have 8 legs, and centipedes have many more. Only animals with 6 legs and 3 body parts are insects."},"idea":["Count Legs, Count Parts! 6 and 3 is an insect; 8 and 2 is an arachnid.","Arthro-pod means \"jointed leg\"."],"try":{"q":"A tick has 8 legs and 2 body parts. What is it?","o":["an arachnid","an insect","a small mammal"],"a":"an arachnid","steps":["Count Legs, Count Parts!","8 legs and 2 parts make it…"]},"joke":"Why did the spider get a computer? To check its web site!"},"SCI.ANIM.L07.04":{"theme":"lab","hook":"So many kinds of creatures. How do you find one? Open the right box!","big":"Groups inside groups: the smaller the box, the more alike. One kind = a species with a two-word name.","remember":"Kosher land animals have both signs.","intro":["Step 1: groups sit inside bigger groups, like boxes.","Step 2: animals > vertebrates > mammals > the cat family.","Step 3: the smaller the box, the more alike the members.","Step 4: one kind is a species, with a two-word science name."],"ex":[{"q":"A dolphin. Animals, then vertebrates, then…?","steps":["Big Box, Small Box!","It breathes air and feeds its calf milk.","So the next box is mammals."],"a":"mammals"},{"q":"Panthera leo. How many words in the science name?","steps":["Read it word by word.","Panthera, then leo.","2 words."],"a":"2"}],"oops":{"q":"If every cat is a mammal, is every mammal a cat?","wrong":"Yes, they are the same box.","right":"No, cats are a smaller box.","why":"The cat box sits inside the mammal box. Goats, bats and whales are mammals too, but not cats."},"idea":["Big Box, Small Box! Start big, then step into smaller boxes.","A small box always fits inside a bigger one, never the other way."],"try":{"q":"Which box holds the most kinds?","o":["animals","mammals","house cats"],"a":"animals","steps":["Big Box, Small Box!","The biggest box is…"]},"joke":"Why did the owl book get the best shelf? Because it knew exactly whooo it belonged with!"}};

 var SK={"SCI.MATT.L08.01":{"name":"Tiny Building Blocks","band":"5-6","teach":[{"how":"Step 1. All matter is made of atoms: tiny bits far too small to see, even with a strong magnifier. A gold ring, a drop of water and the air are all atoms.","q":"Everything around us is made of tiny bits, far too small to see. What are they called?","o":["atoms","cells","crumbs"],"h":"Cells are only in living things. You need the bits of ALL matter.","pic":"🔬","why":"Atoms are so tiny that one drop of water holds more of them than anyone could ever count."},{"how":"Step 2. An element is a substance made of just one kind of atom. Gold, copper, iron and oxygen are elements. Scientists know of 118 elements.","q":"A ring of pure gold has only one kind of atom in it. What is a substance with only one kind of atom called?","o":["an element","a mixture","a molecule"],"h":"Pure means nothing else is mixed in.","pic":"🔬","why":"Pure gold has only gold atoms. Melt copper into it, and it is not one element anymore."},{"how":"Step 3. Each element has a symbol of one or two letters, and the first letter is always a capital. H is hydrogen, C is carbon. Some come from old Latin names: Fe is iron.","q":"Every element has a short symbol. What is the symbol for oxygen?","o":["O","Ox","Og"],"h":"A symbol starts with a capital letter, often the first letter of the name.","pic":"🔬","why":"Scientists in every country use the same symbols, so a chart in any language can be read."}],"we":[{"q":"Baruch looks at Grandpa’s copper wire under a strong microscope. He still sees no atoms. Why not?","o":["atoms are far too small to see","copper has no atoms in it"],"steps":["All matter is made of atoms.","Copper is matter, so it has atoms.","So the atoms are there, but…"],"pic":"🔬"},{"q":"Chana reads a label: water is made of hydrogen atoms and oxygen atoms. Is water an element?","o":["no, it has two kinds of atoms","yes, it is one pure thing"],"steps":["An element has only one kind of atom.","Count the kinds in ugh a filter","the sand stays in the filter paper","let the salty water dry up in the sun","scrape up the dry salt"],"h":"Think back to Mixtures and Solutions. What gets caught first?","pic":"🔬","why":"The filter catches the sand. Then the water dries up and leaves the salt behind."}],"check":[{"q":"Which of these is an element?","o":["copper","salt water","sugar"],"h":"Which one has only one kind of atom?","pic":"🔬"},{"t":"num","q":"Table salt is made of sodium atoms and chlorine atoms. How many kinds of atoms are in table salt?","a":2,"h":"Count the kinds named, not the atoms.","pic":"🔬"},{"t":"order","q":"Put these in order, biggest to smallest.","tiles":["a copper pot","a copper wire","a tiny copper grain","one copper atom"],"h":"Start with the one you could cook in.","pic":"🔬"}],"re":[{"t":"pairs","q":"Game: match each atom word to its meaning.","pairs":[["atom","a tiny bit of matter, too small to see"],["element","a substance with one kind of atom"],["symbol","a short letter name for an element"]],"h":"Which word is the tiny bit itself?","pic":"🔬"},{"t":"sort","q":"Simpler: one kind of atom, or more than one?","bins":[{"id":"O","label":"one kind"},{"id":"M","label":"more than one kind"}],"items":[{"label":"pure silver","bin":"O"},{"label":"oxygen gas","bin":"O"},{"label":"neon in a sign","bin":"O"},{"label":"lemonade","bin":"M"},{"label":"soup","bin":"M"},{"label":"sand","bin":"M"}],"h":"Is it pure, or a mix of many things?","pic":"🔬"},{"t":"spotall","q":"Back to basics: tap every true thing about the tiny bits that make up matter.","cells":[{"label":"they are too small to see","ok":true},{"label":"in a solid they are packed close","ok":true},{"label":"in a gas they spread far apart","ok":true},{"label":"they are as big as sand grains","ok":false},{"label":"only living things have them","ok":false}],"h":"Think back to Solids, Liquids and Gases.","pic":"🔬"}]},"SCI.MATT.L08.02":{"name":"Atoms Join Up","band":"5-6","teach":[{"how":"Step 1. Atoms can join together. A group of atoms joined tight is a molecule. Two oxygen atoms joined make one oxygen molecule, the kind we breathe.","q":"When two or more atoms hold on to each other, what do they make?","o":["a molecule","an element","a mixture"],"h":"Think of beads tied together on one string.","pic":"🔬","why":"Most of the oxygen in the air is in pairs: two oxygen atoms holding on to each other."},{"how":"Step 2. A formula shows the atoms in one molecule. A small number counts the atom just before it. No number means 1. So H₂O has 2 hydrogen atoms and 1 oxygen atom.","q":"Water is H₂O. What does the small 2 tell you?","o":["there are 2 hydrogen atoms","there are 2 water drops","there are 2 oxygen atoms"],"h":"Read the Little Numbers! Which letter is the 2 right after?","pic":"🔬","why":"H₂O: the 2 sits after H, so 2 hydrogens. O has no number, so 1 oxygen."},{"how":"Step 3. A compound is two or more kinds of atoms joined together. Water (H₂O) and carbon dioxide (CO₂) are compounds. A compound can act very different from its elements.","q":"What do we call a substance made of two or more KINDS of atoms joined together?","o":["a compound","an element","a solution"],"h":"Two or more kinds, joined.","pic":"🔬","why":"Sodium is a soft, dangerous metal and chlorine is a poison gas. Joined together, they make plain table salt."}],"we":[{"q":"Gavriel builds CO₂ with clay balls: 1 black carbon and 2 red oxygens. How many atoms in all?","o":["3","2"],"steps":["C has no small number, so 1.","O₂ means 2 oxygens.","1 + 2 =…"],"pic":"🔬"},{"q":"Devorah builds O₂: two red oxygen balls, and nothing else. Element or compound?","o":["element: one kind of atom","compound: two atoms"],"steps":["Count the KINDS of atoms, not the atoms.","Both balls are oxygen.","One kind means…"],"pic":"🔬"}],"practice":[{"t":"num","q":"Ammonia is NH₃. How many atoms are in one molecule of ammonia?","a":4,"h":"Read the Little Numbers! No number means 1.","pic":"🔬","why":"N has no number, so 1 nitrogen. H₃ means 3 hydrogens. 1 + 3 = 4."},{"t":"sort","q":"Sort them: element, or compound?","bins":[{"id":"E","label":"element: one kind of atom"},{"id":"C","label":"compound: two or more kinds"}],"items":[{"label":"O₂","bin":"E"},{"label":"N₂","bin":"E"},{"label":"H₂","bin":"E"},{"label":"H₂O","bin":"C"},{"label":"CO₂","bin":"C"},{"label":"NaCl","bin":"C"}],"h":"Count the different capital letters in each formula.","pic":"🔬","why":"O₂, N₂ and H₂ each have one kind of atom. H₂O, CO₂ and NaCl each have two kinds."},{"t":"pairs","q":"Match each formula to what is in one molecule.","pairs":[["H₂O","2 hydrogen, 1 oxygen"],["CO₂","1 carbon, 2 oxygen"],["CH₄","1 carbon, 4 hydrogen"]],"h":"Read the Little Numbers! Each number belongs to the letter before it.","pic":"🔬","why":"H₂O is 2 H + 1 O. CO₂ is 1 C + 2 O. CH₄ (the gas in a stove) is 1 C + 4 H."},{"t":"spotall","q":"Tap every true thing about compounds.","cells":[{"label":"they have two or more kinds of atoms","ok":true},{"label":"their atoms are joined together","ok":true},{"label":"they can act very different from their elements","ok":true},{"label":"they have only one kind of atom","ok":false},{"label":"a magnet pulls their atoms apart","ok":false}],"h":"Think of table salt, made from a metal and a gas.","pic":"🔬","why":"A compound has two or more kinds of atoms joined tight. Salt acts nothing like sodium or chlorine."},{"t":"type","q":"Review: a substance made of only one kind of atom is called an ____.","a":"element","alt":["an element","elements"],"kb":"abc","h":"Think back to Tiny Building Blocks.","pic":"🔬","why":"An element! Gold, copper and oxygen are elements: one kind of atom each."},{"t":"num","q":"Review: 25 grams of sugar dissolve in 175 grams of water. How much does the sugar water weigh, in grams?","a":200,"h":"Think back to Nothing Is Lost. Does any sugar disappear?","pic":"🔬","why":"25 + 175 = 200 grams. Dissolved sugar is still there, just in tiny pieces."}],"check":[{"q":"Which formula shows a molecule with exactly 3 atoms?","o":["H₂O","O₂","CH₄"],"h":"Count the atoms in each: add the little numbers, and count 1 where there is none.","pic":"🔬"},{"t":"num","q":"How many hydrogen atoms are in 2 molecules of water?","a":4,"h":"One water molecule has how many hydrogens? Now double it.","pic":"🔬"},{"t":"order","q":"Put these molecules in order, fewest atoms to most.","tiles":["O₂","H₂O","NH₃","CH₄"],"h":"Count the atoms in each one first.","pic":"🔬"}],"re":[{"t":"pairs","q":"Game: match each joining word to its meaning.","pairs":[["molecule","a group of atoms joined together"],["formula","letters and numbers that show the atoms"],["compound","two or more kinds of atoms joined"]],"h":"Which word is written with letters and numbers?","pic":"🔬"},{"t":"num","q":"Simpler: count the balls. A model has H, H and O joined. How many atoms is that?","a":3,"h":"Count each letter once.","pic":"🔬"},{"t":"pairs","q":"Back to basics: match each symbol to its element.","pairs":[["O","oxygen"],["N","nitrogen"],["Na","sodium"]],"h":"One of these comes from an old Latin name.","pic":"🔬"}]},"SCI.MATT.L08.03":{"name":"Physical or Chemical?","band":"5-6","teach":[{"how":"Step 1. In a physical change, the stuff changes its shape, size or state, but it is still the same stuff. Melting, freezing, cutting and dissolving are physical changes.","q":"Shlomo crushes a cracker into crumbs. What kind of change is that?","o":["a physical change","a chemical change","no change at all"],"h":"Is it still cracker, just in smaller bits?","pic":"🔬","why":"Every crumb is still cracker. Nothing new was made."},{"how":"Step 2. In a chemical change, atoms trade partners and make a NEW substance. Cooking, burning and rusting are chemical changes. The new stuff is hard to turn back.","q":"A pancake in the pan turns brown and smells new. What kind of change is that?","o":["a chemical change","a physical change","a change of state"],"h":"Did something NEW form?","pic":"🔬","why":"The browning is new stuff made by the heat. You cannot un-brown a pancake."},{"how":"Step 3. Look for signs of new stuff: a new gas (bubbles), a new color, heat or light given off, a new solid forming, or a new smell.","q":"Which of these is a sign that a chemical change may be happening?","o":["bubbles of a new gas appear","it gets cut in half","ice slowly turns to water"],"h":"Look for New Stuff! Which one makes something that was not there?","pic":"🔬","why":"Careful: boiling water bubbles too, but that is only water turning to steam. Bubbles count when a NEW gas forms."}],"we":[{"q":"Mima drops baking soda into vinegar. It fizzes hard and gives off a new gas. Physical or chemical?","o":["chemical","physical"],"steps":["Look for New Stuff!","Fizzing here means a new gas.","A new substance means…"],"pic":"🔬"},{"q":"Rus melts chocolate chips for the pancakes. Later the chocolate hardens again. Physical or chemical?","o":["physical","chemical"],"steps":["Is it still chocolate?","It changed state, then changed back.","Same stuff means…"],"pic":"🔬"}],"practice":[{"t":"sort","q":"Sort them: physical change, or chemical change?","bins":[{"id":"P","label":"physical: same stuff"},{"id":"C","label":"chemical: new stuff"}],"items":[{"label":"ice melting","bin":"P"},{"label":"paper torn in two","bin":"P"},{"label":"a glass cup breaking","bin":"P"},{"label":"toast burning","bin":"C"},{"label":"a bike chain rusting","bin":"C"},{"label":"an egg frying","bin":"C"}],"h":"Look for New Stuff! Ask of each card: is it still the same stuff?","pic":"🔬","why":"Melting, tearing and breaking only change shape or state. Burning, rusting and frying make new substances."},{"t":"spotall","q":"Tap every sign that a new substance formed.","cells":[{"label":"a new color appears","ok":true},{"label":"heat or light is given off","ok":true},{"label":"a new gas bubbles out","ok":true},{"label":"it changes shape","ok":false},{"label":"it is cut into pieces","ok":false}],"h":"Which clues show something NEW, not just a new shape?","pic":"🔬","why":"A new color, heat or light, and a new gas are signs of a chemical change. Shape changes are physical."},{"t":"pairs","q":"Match each kitchen change to the sign you see.","pairs":[["baking soda in vinegar","fizzing gas"],["a cut apple left out","turns brown"],["the stove’s gas flame","light and heat"]],"h":"Picture each one. What do your eyes see happen?","pic":"🔬","why":"The fizz is new gas, the brown is a new substance on the apple, and the flame gives off light and heat."},{"t":"order","q":"Put the pancake night in order.","tiles":["mix the flour, eggs and milk","pour the batter in the hot pan","bubbles rise and pop on top","flip it: the bottom is brown"],"h":"What has to happen before anything goes in the pan?","pic":"🔬","why":"Mixing is physical. In the hot pan, gas bubbles form and the bottom browns: chemical changes."},{"t":"num","q":"Review: rust has the formula Fe₂O₃. How many atoms does that formula show?","a":5,"h":"Think back to Atoms Join Up. Add the little numbers.","pic":"🔬","why":"Fe₂ is 2 iron atoms and O₃ is 3 oxygen atoms. 2 + 3 = 5."},{"t":"type","q":"Review: when salt spreads into water in tiny pieces you cannot see, we say it ____.","a":"dissolves","alt":["dissolved","dissolve","dissolving"],"kb":"abc","h":"Think back to Mixtures and Solutions.","pic":"🔬","why":"It dissolves! That is a physical change: you can get the salt back by drying the water."}],"check":[{"q":"Which of these is a chemical change?","o":["milk going sour","water freezing","a log cut in two"],"h":"Which one makes new stuff with a new smell?","pic":"🔬"},{"t":"num","q":"At pancake night Shlomo counts 7 changes. 3 are physical. How many are chemical?","a":4,"h":"Take the physical ones away from all the changes.","pic":"🔬"},{"t":"sort","q":"Sort them: same stuff, or new stuff?","bins":[{"id":"S","label":"same stuff"},{"id":"N","label":"new stuff"}],"items":[{"label":"steam from the kettle","bin":"S"},{"label":"a snowman melting","bin":"S"},{"label":"chopped carrots","bin":"S"},{"label":"burnt toast","bin":"N"},{"label":"a rusty nail","bin":"N"},{"label":"bread baking in the oven","bin":"N"}],"h":"Look for New Stuff! Check each card for a sign.","pic":"🔬","chk":true}],"re":[{"t":"pairs","q":"Game: match each word to its meaning.","pairs":[["physical change","same stuff, new shape or state"],["chemical change","a new substance forms"],["sign of a reaction","bubbles, color, heat or light"]],"h":"Which one makes something new?","pic":"🔬"},{"t":"sort","q":"Simpler: can you easily get it back, or not?","bins":[{"id":"B","label":"easy to get back"},{"id":"N","label":"cannot get it back"}],"items":[{"label":"frozen juice","bin":"B"},{"label":"melted butter","bin":"B"},{"label":"salt in water","bin":"B"},{"label":"a burnt match","bin":"N"},{"label":"a fried egg","bin":"N"},{"label":"a baked cake","bin":"N"}],"h":"Could you freeze, melt or dry it back the way it was?","pic":"🔬"},{"t":"spotall","q":"Back to basics: tap every change that can go back again.","cells":[{"label":"ice melting into water","ok":true},{"label":"water freezing into ice","ok":true},{"label":"chocolate hardening","ok":true},{"label":"toast burning","ok":false},{"label":"an egg frying","ok":false}],"h":"Think back to Heat Changes Things.","pic":"🔬"}]},"SCI.MATT.L08.04":{"name":"Count Both Sides","band":"5-6","teach":[{"how":"Step 1. In a chemical change, no atom is made and no atom is lost. The same atoms let go of old partners and join new ones, like building blocks built into a new shape.","q":"In a chemical change, what happens to the atoms?","o":["they join new partners","they vanish into thin air","brand new atoms are made"],"h":"Can an atom just disappear?","pic":"🔬","why":"The atoms in a burning log do not vanish. They go into the air as gas and stay behind as ash."},{"how":"Step 2. An equation has an arrow. Before the arrow are the starting substances; after it are the new ones. Count Both Sides! Each kind of atom has the same count on both sides.","q":"Before a reaction there are 6 atoms. How many atoms are there after it?","o":["6","fewer than 6","more than 6"],"h":"No atom is made, and no atom is lost.","pic":"🔬","why":"The arrow means “turns into”. The atoms are only rearranged, so the count stays the same."},{"how":"Step 3. A big number in front counts whole molecules. 2 H₂O means two water molecules: that is 4 hydrogen atoms and 2 oxygen atoms in all.","q":"Hydrogen burns: 2 H₂ + O₂ → 2 H₂O. What does the big 2 in front of H₂O mean?","o":["2 whole water molecules","2 hydrogen atoms only","2 drops of oxygen"],"h":"A big number in front counts something bigger than one atom.","pic":"🔬","why":"Small numbers count atoms inside one molecule. Big numbers in front count molecules."}],"we":[{"q":"Ari counts C + O₂ → CO₂. Left side: 1 carbon, 2 oxygens. What does the right side have?","o":["1 carbon, 2 oxygens","2 carbons, 1 oxygen"],"steps":["Count Both Sides!","CO₂: C has no number; O has a 2.","So the right side has…"],"pic":"🔬"},{"q":"Yitzchak looks at 2 H₂O. How many hydrogen atoms is that in all?","o":["4","2"],"steps":["The big 2 means 2 molecules.","Each H₂O has 2 hydrogens.","2 × 2 =…"],"pic":"🔬"}],"practice":[{"t":"num","q":"Stove gas burns: CH₄ + 2 O₂ → CO₂ + 2 H₂O. How many oxygen atoms are on the LEFT side?","a":4,"h":"The big 2 means 2 molecules of O₂.","pic":"🔬","why":"2 O₂ is 2 × 2 = 4 oxygen atoms. Check the right: CO₂ has 2, and 2 H₂O has 2. Also 4!"},{"t":"sort","q":"Sort them: true about a chemical change, or a mix-up?","bins":[{"id":"T","label":"true"},{"id":"X","label":"a mix-up"}],"items":[{"label":"the same atoms are there after","bin":"T"},{"label":"atoms join new partners","bin":"T"},{"label":"in a sealed jar, the mass stays the same","bin":"T"},{"label":"atoms disappear when wood burns","bin":"X"},{"label":"new atoms appear from nowhere","bin":"X"},{"label":"a gas weighs nothing at all","bin":"X"}],"h":"Count Both Sides! Would the atom count change?","pic":"🔬","why":"Atoms are never made or lost; they rearrange. Even gas has mass, so a sealed jar keeps its weight."},{"t":"pairs","q":"Match each reaction to what it makes.","pairs":[["iron + oxygen","rust"],["baking soda + vinegar","carbon dioxide bubbles"],["hydrogen + oxygen","water"]],"h":"Which one happens to a bike left out in the rain?","pic":"🔬","why":"Iron and oxygen make rust. Baking soda and vinegar fizz out carbon dioxide. Hydrogen and oxygen make water."},{"t":"spotall","q":"Tap every equation where both sides have the same atoms.","cells":[{"label":"C + O₂ → CO₂","ok":true},{"label":"2 H₂ + O₂ → 2 H₂O","ok":true},{"label":"N₂ + 3 H₂ → 2 NH₃","ok":true},{"label":"H₂ + O₂ → H₂O","ok":false},{"label":"C + O₂ → CO","ok":false}],"h":"Count Both Sides! Check the oxygen first.","pic":"🔬","why":"In the last two, 2 oxygens go in but only 1 comes out. Atoms cannot vanish, so those are not right."},{"t":"type","q":"Review: when a new substance forms, like rust on a bike chain, we call it a ____ change.","a":"chemical","alt":["a chemical change","chemical change"],"kb":"abc","h":"Think back to the skill before this one: same stuff, or new stuff?","pic":"🔬","why":"A chemical change! New stuff formed, and a new color shows it."},{"t":"num","q":"Review: glucose, a sugar, is C₆H₁₂O₆. How many atoms are in one molecule of glucose?","a":24,"h":"Think back to Atoms Join Up. Add all three little numbers.","pic":"🔬","why":"6 carbon + 12 hydrogen + 6 oxygen = 24 atoms."}],"check":[{"t":"num","q":"CH₄ + 2 O₂ → CO₂ + 2 H₂O. How many hydrogen atoms are on the RIGHT side?","a":4,"h":"Look only at 2 H₂O. Multiply.","pic":"🔬"},{"q":"Aunt Faigy’s sealed fizz bag weighs 310 grams before it fizzes. What does it weigh after?","o":["310 grams","less than 310 grams","more than 310 grams"],"h":"The bag is sealed. Can any atom get out?","pic":"🔬"},{"t":"order","q":"Put the sealed fizz-bag test in order.","tiles":["weigh the sealed bag","tip the vinegar onto the baking soda","watch it fizz and puff up","weigh it again"],"h":"What must you do before anything mixes?","pic":"🔬"}],"re":[{"t":"pairs","q":"Game: match each part of an equation to its meaning.","pairs":[["the arrow →","“turns into”"],["the small 2 in O₂","2 atoms in one molecule"],["the big 2 in 2 H₂O","2 whole molecules"]],"h":"Small numbers sit low, after a letter. Big ones sit in front.","pic":"🔬"},{"t":"num","q":"Simpler: one oxygen molecule, O₂, splits into O and O. How many oxygen atoms are there after?","a":2,"h":"Count the O’s after the split.","pic":"🔬"},{"t":"num","q":"Back to basics: a sealed jar holds 500 grams of ice. All the ice melts. How many grams does the jar hold now?","a":500,"h":"Think back to Nothing Is Lost.","pic":"🔬"}]}};
 var PAGE={"SCI.MATT.L08.01":{"big":"A gold ring, a glass of water and the air in a balloon look nothing alike. What are they all made of?","intro":"All matter is made of atoms: tiny bits, far too small to see. A substance with only one kind of atom is an element, like gold, copper or oxygen. Scientists know of 118 elements, and each one has a short symbol: O for oxygen, C for carbon, Fe for iron.","words":[["atom","A tiny bit of matter, far too small to see.","i_atom"],["element","A substance made of only one kind of atom, like gold.","i_elem"],["symbol","The short letter name of an element, like O for oxygen.","i_sym"]],"dyk":"If an apple grew as big as the whole earth, each of its atoms would only be about as big as a grape.","story":{"title":"Grandpa’s Workbench","text":"Grandpa fixes old clocks at a little workbench by the window. On Sunday, Baruch and his sister Chana sat beside him. A coil of copper wire, a few gold-colored screws and a tiny brass gear lay on the felt. “Everything on this table is made of the same tiny bits,” said Grandpa. Baruch squinted. “I don’t see any bits.”"},"predict":{"q":"Could Baruch see the atoms with Grandpa’s strongest magnifier?","o":["no, atoms are far too small","yes, if he looks very closely","only on the shiny metal parts"],"reveal":"No! Even the best magnifier shows only the shiny metal. Atoms are so small that a special machine is needed to see them at all. Chana laughed. “So the bits are everywhere, and we never see one?” Grandpa nodded. “Just like time. You can’t see it, but the clocks still count it.”"},"checks":[{"q":"What do we call a substance with only one kind of atom?","o":["an element","a mixture","a formula"],"h":"Think of the pure gold ring."}],"nif":{"text":"Every rock, river and star is built from the same tiny atoms, set together in perfect order. When we learn how small and how many they are, we see the greatness of the Borei Olam who made them all."}},"SCI.MATT.L08.02":{"big":"There are only about a hundred elements. So how can there be so many different things in the world?","intro":"Atoms join together into molecules. A formula shows what is inside one molecule: H₂O means 2 hydrogen atoms and 1 oxygen atom. When two or more KINDS of atoms join, they make a compound, and a compound can act very different from the elements it came from.","words":[["molecule","A group of atoms joined together.","i_mol"],["formula","Letters and small numbers that show the atoms in a molecule.","i_form"],["compound","Two or more kinds of atoms joined together.","i_comp"]],"dyk":"Table salt is made from sodium, a soft metal that reacts wildly with water, and chlorine, a poison gas. Joined together, they make the salt we put on our food.","story":{"title":"The Clay Model Afternoon","text":"It was a snowy Sunday, too cold to go out, so Uncle Shimshon set up the dining room table with balls of colored clay and a box of toothpicks. “Red is oxygen, white is hydrogen, black is carbon,” he said. Gavriel and his sister Devorah began to build. Gavriel stuck two white balls onto one red one. “What did I make?”"},"predict":{"q":"Two white hydrogens on one red oxygen. What is it?","o":["a model of water, H₂O","a model of air, O₂","a model of stove gas"],"reveal":"Water! Two hydrogens and one oxygen make H₂O. Devorah made a black carbon with two red oxygens: CO₂, the gas we breathe out. By the end of the afternoon the table was covered in little clay molecules, and Uncle Shimshon had made a giant one that he called “the Shimshon molecule”."},"checks":[{"q":"In H₂O, how many hydrogen atoms are there?","o":["2","1","3"],"h":"Read the small number after the H."}],"nif":{"text":"With about a hundred kinds of atoms, the world is filled with countless different things: water, wood, bread and air. Like letters that form endless words, Hashem made a small set of building blocks enough for all of creation."}},"SCI.MATT.L08.03":{"big":"Melting butter and frying an egg both happen in a hot pan. Why can you get one back and not the other?","intro":"In a physical change, the stuff changes its shape, size or state, but it stays the same stuff: melting, freezing, cutting, dissolving. In a chemical change, atoms trade partners and make NEW stuff: cooking, burning, rusting. Signs of new stuff are a new gas, a new color, heat or light, a new solid, or a new smell.","words":[["physical change","A change of shape, size or state; still the same stuff.","i_phys"],["chemical change","A change that makes a new substance.","i_chem"],["reaction","Another name for a chemical change.","i_react"]],"dyk":"The bubbles in pancake batter come from a chemical change. The baking powder makes a gas, and the gas puffs the pancake up as it cooks.","story":{"title":"Melava Malka Pancakes","text":"On Motzei Shabbos, Mima made pancakes for melava malka. Shlomo and his cousin Rus were the helpers. Rus melted chocolate chips in a little pot, and Shlomo watched the first pancake in the pan. Tiny bubbles rose and popped on top. “Now flip it!” said Mima. The bottom was golden brown. “Can we make it pale again?” asked Shlomo."},"predict":{"q":"Can the brown pancake ever turn back into pale batter?","o":["no, new stuff was made","yes, if it cools down slowly","yes, if you add more milk"],"reveal":"No! Cooking made new substances, so it is a chemical change. But Rus’s chocolate was different: it melted, cooled and hardened again, still chocolate. That is a physical change. Mima smiled. “One more sign of a chemical change: the whole house smells wonderful.”"},"checks":[{"q":"Which one is a chemical change?","o":["toast burning","butter melting","ice cracking"],"h":"Look for new stuff."}],"nif":{"text":"Flour, eggs and milk turn into warm pancakes, and a seed turns soil and water into fruit. Hashem set up the laws of change so that new and good things can come from simple ones."}},"SCI.MATT.L08.04":{"big":"When a fizzing drink goes flat or a log burns away, where do the atoms go?","intro":"In a chemical change, atoms are never made and never lost. They only let go of old partners and join new ones. In an equation, the arrow means “turns into”. Count Both Sides: each kind of atom has the same number before the arrow and after it. A big number in front counts whole molecules.","words":[["equation","A line that shows what goes in and what comes out of a reaction.","i_eq"],["rearrange","To put the same pieces together in a new way.","i_rearr"],["balanced","The same number of each atom on both sides.","i_bal"]],"dyk":"When a big log burns, the ashes weigh much less than the log. The rest of the atoms did not vanish; they flew up into the air as gases and water vapor.","story":{"title":"The Science Fair Bag","text":"At the school science fair, Ari and his friend Yitzchak had the busiest table. Aunt Faigy had helped them weigh a zipper bag with a spoon of baking soda in one corner and a little cup of vinegar standing inside. “Watch the scale,” said Ari. Yitzchak tipped the cup through the plastic, and the bag fizzed and puffed up like a pillow."},"predict":{"q":"The bag puffed up with gas. What did the scale show after?","o":["the same weight as before","less, because gas is light","more, because it got bigger"],"reveal":"The same! No atom could get out of the sealed bag, so the mass stayed the same. Then Yitzchak opened the zipper, the gas floated away, and the scale went down a little. “The atoms didn’t vanish,” said Ari. “They just left the bag.”"},"checks":[{"q":"In a chemical change, atoms are…","o":["rearranged, not lost","lost in the air for good","made new each time"],"h":"Count Both Sides."}],"nif":{"text":"Nothing in Hashem’s world is wasted: every atom stays and finds a new place. It reminds us to take care of what we are given and not waste it."}}};
 var TEACH={"SCI.MATT.L08.01":{"theme":"lab","hook":"A gold ring and the air in a balloon are made of the same kind of tiny bits. What are they?","big":"All matter is made of atoms. An element has only one kind of atom, and each element has a symbol.","remember":"Solids, liquids and gases are made of tiny bits.","intro":["Step 1: all matter is made of atoms, far too small to see.","Step 2: one kind of atom only = an element.","Step 3: about 118 elements are known.","Step 4: each has a symbol; the first letter is a capital (O, C, Fe)."],"ex":[{"q":"Pure copper wire. Element or not?","steps":["Zoom to the Atom!","Inside: only copper atoms.","One kind, so it is an element."],"a":"an element"},{"q":"Sugar: carbon, hydrogen and oxygen. Element or not?","steps":["Zoom to the Atom!","Inside: three kinds of atoms.","More than one kind, so it is not an element."],"a":"not an element"}],"oops":{"q":"Is salt water an element because it looks clear?","wrong":"Yes, it looks pure.","right":"No, it has many kinds of atoms.","why":"Looks do not tell you. Salt water has water and salt, and each of those has more than one kind of atom."},"idea":["Zoom to the Atom! Picture zooming in until you see the atoms. One kind? Element.","Symbols are like short nicknames: O for oxygen, C for carbon."],"try":{"q":"Pure silver has only silver atoms. What is it?","o":["an element","a mixture","a compound"],"a":"an element","steps":["Zoom to the Atom!","Only one kind of atom means…"]},"joke":"Why can’t you trust atoms? Because they make up everything!"},"SCI.MATT.L08.02":{"theme":"lab","hook":"Two hydrogens and one oxygen walk into a model kit. What do they make?","big":"Atoms join into molecules. A formula counts them. Two or more kinds joined make a compound.","remember":"An element has only one kind of atom.","intro":["Step 1: atoms join together into molecules.","Step 2: a formula shows the atoms in one molecule.","Step 3: a small number counts the atom before it; no number means 1.","Step 4: two or more kinds joined = a compound."],"ex":[{"q":"CO₂. How many atoms?","steps":["Read the Little Numbers!","C: no number, so 1. O₂: 2.","1 + 2 = 3."],"a":"3"},{"q":"N₂. Element or compound?","steps":["Count the kinds of capital letters.","Only N.","One kind: an element."],"a":"element"}],"oops":{"q":"Is O₂ a compound because it has two atoms?","wrong":"Yes, two atoms make a compound.","right":"No, both atoms are oxygen.","why":"A compound needs two or more KINDS of atoms. O₂ has two atoms of one kind, so it is an element."},"idea":["Read the Little Numbers! Each small number belongs to the letter right before it.","Count kinds for compound; count atoms for the total."],"try":{"q":"NH₃. How many atoms in one molecule?","o":["4","3","2"],"a":"4","steps":["N has no number: 1.","H₃: 3. Add them…"]},"joke":"Why did the oxygen atom go to the party with a friend? Because O₂ is more fun than O alone!"},"SCI.MATT.L08.03":{"theme":"lab","hook":"Melted chocolate can harden again. A fried egg can never go back. Why?","big":"Physical change: same stuff, new shape or state. Chemical change: new stuff forms. Look for the signs.","remember":"Some changes can go back again, like ice and water.","intro":["Step 1: physical change = same stuff, new shape, size or state.","Step 2: chemical change = atoms trade partners; new stuff forms.","Step 3: signs: new gas, new color, heat or light, new solid, new smell.","Step 4: careful: boiling bubbles are only steam, not new stuff."],"ex":[{"q":"Wet clothes dry on the line. Physical or chemical?","steps":["Look for New Stuff!","The water only went into the air.","Same stuff: physical."],"a":"physical"},{"q":"A silver cup turns dark over time. Physical or chemical?","steps":["Look for New Stuff!","A new color formed on the metal.","New stuff: chemical."],"a":"chemical"}],"oops":{"q":"Is boiling water a chemical change because it bubbles?","wrong":"Yes, bubbles are a sign.","right":"No, it is still water.","why":"The bubbles are steam, which is water as a gas. Bubbles count only when a NEW gas forms."},"idea":["Look for New Stuff! Same stuff = physical; new stuff = chemical.","The five signs: gas, color, heat or light, new solid, smell."],"try":{"q":"A cut apple turns brown in the air. What kind of change?","o":["chemical","physical","no change"],"a":"chemical","steps":["Look for New Stuff!","A new color means…"]},"joke":"What did the pancake say to the frying pan? “You really know how to change me!”"},"SCI.MATT.L08.04":{"theme":"lab","hook":"A log burns down to a little ash. Did most of its atoms just vanish?","big":"Atoms are never made or lost in a reaction; they rearrange. Count both sides of the arrow.","remember":"In a closed container, mass stays the same.","intro":["Step 1: no atom is made, and no atom is lost.","Step 2: the arrow means \"turns into\".","Step 3: big number in front = whole molecules.","Step 4: count each kind of atom on both sides; the counts match."],"ex":[{"q":"C + O₂ → CO₂. Oxygens on each side?","steps":["Count Both Sides!","Left: O₂ = 2. Right: CO₂ = 2.","2 and 2: they match."],"a":"2 and 2"},{"q":"3 H₂O. How many hydrogens?","steps":["The big 3 means 3 molecules.","Each has 2 hydrogens.","3 × 2 = 6."],"a":"6"}],"oops":{"q":"The ash weighs less than the log, so atoms were lost?","wrong":"Yes, burning destroys atoms.","right":"No, they went into the air.","why":"Most of the atoms left as gases and water vapor. Catch them all, and the mass would match."},"idea":["Count Both Sides! Left of the arrow, right of the arrow: each kind must match.","Small number = atoms inside. Big number = molecules."],"try":{"q":"2 O₂. How many oxygen atoms?","o":["4","2","3"],"a":"4","steps":["The big 2 means 2 molecules.","Each O₂ has 2, so…"]},"joke":"Why did the atom keep counting the equation? It wanted to make sure nobody was left out!"}};
 var LABI={"SCI.MATT.L08.01":{"kind":"meter","title":"The Atom-Kind Meter","goal":"Grandpa has a pretend meter that counts the KINDS of atoms in a sample. Guess first: element or not? Then read the meter!","samples":[["gold","a gold ring",1],["water","a drop of water",2],["copper","copper wire",1],["salt","table salt",2],["sugar","a sugar cube",3],["helium","helium in a balloon",1]]},"SCI.MATT.L08.02":{"kind":"build","title":"Molecule Builder","goal":"Tap the atom buttons to build each molecule on the card. Check when the count is right!","targets":[["water","water, H₂O",{"H":2,"O":1}],["co2","carbon dioxide, CO₂",{"C":1,"O":2}],["o2","oxygen, O₂",{"O":2}],["nh3","ammonia, NH₃",{"N":1,"H":3}],["ch4","stove gas, CH₄",{"C":1,"H":4}]],"atoms":[["H","hydrogen"],["O","oxygen"],["C","carbon"],["N","nitrogen"]]},"SCI.MATT.L08.03":{"kind":"signs","title":"Sign Spotter","goal":"Six kitchen changes. Tap every sign you see, then call it: physical or chemical?","signs":[["gas","new gas"],["color","new color"],["heat","heat or light"],["solid","new solid"],["none","no new stuff"]],"events":[["butter","butter melting in the pan",["none"],"P"],["batter","pancake batter in the hot pan",["gas","color"],"C"],["fizz","baking soda in vinegar",["gas"],"C"],["apple","a cut apple left out",["color"],"C"],["sugar","sugar stirred into tea",["none"],"P"],["flame","the stove’s gas flame",["heat"],"C"]]},"SCI.MATT.L08.04":{"kind":"scale","title":"The Balance Scale","goal":"Atoms go in on the left. Choose how many molecules come out on the right until the scale balances!","eqs":[["C + O₂ → ? CO₂",{"C":1,"O":2},"CO₂",{"C":1,"O":2},1],["2 H₂ + O₂ → ? H₂O",{"H":4,"O":2},"H₂O",{"H":2,"O":1},2],["N₂ + 3 H₂ → ? NH₃",{"N":2,"H":6},"NH₃",{"N":1,"H":3},2],["2 Mg + O₂ → ? MgO",{"Mg":2,"O":2},"MgO",{"Mg":1,"O":1},2]]}};
 var PIC={"SCI.MATT.L08.01|Everything around us is made of tiny bits, far too small to see. What are they called?":"zoom","SCI.MATT.L08.01|A ring of pure gold has only one kind of atom in it. What is a substance with only one kind of atom called?":"ring","SCI.MATT.L08.01|Every element has a short symbol. What is the symbol for oxygen?":"tiles","SCI.MATT.L08.01|Baruch looks at Grandpa’s copper wire under a strong microscope. He still sees no atoms. Why not?":"scope","SCI.MATT.L08.01|Chana reads a label: water is made of hydrogen atoms and oxygen atoms. Is water an element?":"drop","SCI.MATT.L08.01|Sort them: an element, or more than one kind of atom?":"bench","SCI.MATT.L08.01|Match each element to its symbol.":"tiles3","SCI.MATT.L08.01|Tap every element.":"spotel","SCI.MATT.L08.01|Grandpa’s chart shows 118 elements. Chana has learned 9 of them so far. How many are left for her to learn?":"chart","SCI.MATT.L08.01|Review: juice and milk take the shape of the cup they are poured into. Matter that flows and takes its container’s shape is a ____.":"cups","SCI.MATT.L08.01|Review: put the steps in order to get sand and salt out of salty, sandy water.":"filter","SCI.MATT.L08.01|Which of these is an element?":"trio","SCI.MATT.L08.01|Table salt is made of sodium atoms and chlorine atoms. How many kinds of atoms are in table salt?":"salt","SCI.MATT.L08.01|Put these in order, biggest to smallest.":"zoom","SCI.MATT.L08.01|Game: match each atom word to its meaning.":"tiles","SCI.MATT.L08.01|Simpler: one kind of atom, or more than one?":"bench2","SCI.MATT.L08.01|Back to basics: tap every true thing about the tiny bits that make up matter.":"particles","SCI.MATT.L08.02|When two or more atoms hold on to each other, what do they make?":"join","SCI.MATT.L08.02|Water is H₂O. What does the small 2 tell you?":"water","SCI.MATT.L08.02|What do we call a substance made of two or more KINDS of atoms joined together?":"saltjoin","SCI.MATT.L08.02|Gavriel builds CO₂ with clay balls: 1 black carbon and 2 red oxygens. How many atoms in all?":"co2","SCI.MATT.L08.02|Devorah builds O₂: two red oxygen balls, and nothing else. Element or compound?":"o2","SCI.MATT.L08.02|Ammonia is NH₃. How many atoms are in one molecule of ammonia?":"nh3","SCI.MATT.L08.02|Sort them: element, or compound?":"formulas","SCI.MATT.L08.02|Match each formula to what is in one molecule.":"three","SCI.MATT.L08.02|Tap every true thing about compounds.":"saltjoin","SCI.MATT.L08.02|Review: a substance made of only one kind of atom is called an ____.":"ring","SCI.MATT.L08.02|Review: 25 grams of sugar dissolve in 175 grams of water. How much does the sugar water weigh, in grams?":"sugarscale","SCI.MATT.L08.02|Which formula shows a molecule with exactly 3 atoms?":"formulas","SCI.MATT.L08.02|How many hydrogen atoms are in 2 molecules of water?":"twowater","SCI.MATT.L08.02|Put these molecules in order, fewest atoms to most.":"beads","SCI.MATT.L08.02|Game: match each joining word to its meaning.":"join","SCI.MATT.L08.02|Simpler: count the balls. A model has H, H and O joined. How many atoms is that?":"water","SCI.MATT.L08.02|Back to basics: match each symbol to its element.":"tiles3b","SCI.MATT.L08.03|Shlomo crushes a cracker into crumbs. What kind of change is that?":"crumbs","SCI.MATT.L08.03|A pancake in the pan turns brown and smells new. What kind of change is that?":"pancake","SCI.MATT.L08.03|Which of these is a sign that a chemical change may be happening?":"signs","SCI.MATT.L08.03|Mima drops baking soda into vinegar. It fizzes hard and gives off a new gas. Physical or chemical?":"fizz","SCI.MATT.L08.03|Rus melts chocolate chips for the pancakes. Later the chocolate hardens again. Physical or chemical?":"choc","SCI.MATT.L08.03|Sort them: physical change, or chemical change?":"sortchg","SCI.MATT.L08.03|Tap every sign that a new substance formed.":"signs","SCI.MATT.L08.03|Match each kitchen change to the sign you see.":"kitchen3","SCI.MATT.L08.03|Put the pancake night in order.":"pan","SCI.MATT.L08.03|Review: rust has the formula Fe₂O₃. How many atoms does that formula show?":"rust","SCI.MATT.L08.03|Review: when salt spreads into water in tiny pieces you cannot see, we say it ____.":"stir","SCI.MATT.L08.03|Which of these is a chemical change?":"sour","SCI.MATT.L08.03|At pancake night Shlomo counts 7 changes. 3 are physical. How many are chemical?":"tally","SCI.MATT.L08.03|Sort them: same stuff, or new stuff?":"kettle","SCI.MATT.L08.03|Game: match each word to its meaning.":"signs","SCI.MATT.L08.03|Simpler: can you easily get it back, or not?":"back","SCI.MATT.L08.03|Back to basics: tap every change that can go back again.":"icewater","SCI.MATT.L08.04|In a chemical change, what happens to the atoms?":"blocks","SCI.MATT.L08.04|Before a reaction there are 6 atoms. How many atoms are there after it?":"arrow","SCI.MATT.L08.04|Hydrogen burns: 2 H₂ + O₂ → 2 H₂O. What does the big 2 in front of H₂O mean?":"bigtwo","SCI.MATT.L08.04|Ari counts C + O₂ → CO₂. Left side: 1 carbon, 2 oxygens. What does the right side have?":"co2eq","SCI.MATT.L08.04|Yitzchak looks at 2 H₂O. How many hydrogen atoms is that in all?":"twowater","SCI.MATT.L08.04|Stove gas burns: CH₄ + 2 O₂ → CO₂ + 2 H₂O. How many oxygen atoms are on the LEFT side?":"methane","SCI.MATT.L08.04|Sort them: true about a chemical change, or a mix-up?":"truth","SCI.MATT.L08.04|Match each reaction to what it makes.":"makes","SCI.MATT.L08.04|Tap every equation where both sides have the same atoms.":"eqcards","SCI.MATT.L08.04|Review: when a new substance forms, like rust on a bike chain, we call it a ____ change.":"rust","SCI.MATT.L08.04|Review: glucose, a sugar, is C₆H₁₂O₆. How many atoms are in one molecule of glucose?":"glucose","SCI.MATT.L08.04|CH₄ + 2 O₂ → CO₂ + 2 H₂O. How many hydrogen atoms are on the RIGHT side?":"methane","SCI.MATT.L08.04|Aunt Faigy’s sealed fizz bag weighs 310 grams before it fizzes. What does it weigh after?":"bag","SCI.MATT.L08.04|Put the sealed fizz-bag test in order.":"bagsteps","SCI.M  function pg(u,label,body,o){ o=o||{}; var w=o.w||240,h=o.h||160;

 function tx(x,y,t,sz,c,anc){ return '<text x="'+x+'" y="'+y+'" '+CF+' font-size="'+(sz||10)+'" fill="'+(c||kW)+'" text-anchor="'+(anc||'middle')+'">'+t+'</text>'; }
 function ttl(t,c){ return tx(14,22,t,11,c||kY,'start')+'<path d="M14 26 q'+f1(t.length*3)+' 3 '+f1(t.length*6.4)+' 0"'+ln(c||kY,1.4)+' fill="none"/>'; }
 function ball(x,y,r,el){ var c=EL[el]||[kW,kDk]; return '<circle cx="'+f1(x)+'" cy="'+f1(y)+'" r="'+r+'" fill="'+c[0]+'" fill-opacity=".9"'+ln(kW,1.4)+'/><path d="M'+f1(x-r*.45)+' '+f1(y-r*.35)+' q'+f1(r*.25)+' '+f1(-r*.3)+' '+f1(r*.6)+' '+f1(-r*.3)+'" stroke="'+kW+'" stroke-width="1.2" opacity=".7" fill="none"/>'+(r>=7?tx(x,y+r*.36,el,r*(el.length>1?.82:1),c[1]):''); }
 function mol(x,y,s,at,bd){ var b=''; (bd||[]).forEach(function(p){ var a=at[p[0]], c=at[p[1]]; b+='<path d="M'+f1(x+a[0]*s)+' '+f1(y+a[1]*s)+' L'+f1(x+c[0]*s)+' '+f1(y+c[1]*s)+'"'+ln(kW,3*s>2?3:2)+'/>'; });
  at.forEach(function(a){ b+=ball(x+a[0]*s,y+a[1]*s,(a[3]||10)*s,a[2]); }); return b; }

 };

 function arrow(x1,y1,x2,y2,c,w){ c=c||kW; w=w||2.2; var a=Math.atan2(y2-y1,x2-x1); return '<path d="M'+f1(x1)+' '+f1(y1)+' L'+f1(x2)+' '+f1(y2)+'"'+ln(c,w)+'/><path d="M'+f1(x2-9*Math.cos(a-.45))+' '+f1(y2-9*Math.sin(a-.45))+' L'+f1(x2)+' '+f1(y2)+' L'+f1(x2-9*Math.cos(a+.45))+' '+f1(y2-9*Math.sin(a+.45))+'"'+ln(c,w)+' fill="none"/>'; }

 function bubbles(x,y,n,s){ var b=''; for(var i=0;i<n;i++) b+='<circle cx="'+f1(x+(rn(i+s)-.5)*30)+'" cy="'+f1(y-rn(i*2+s)*34)+'" r="'+f1(2+rn(i*3+s)*3.4)+'"'+ln(kBl,1.3)+'/>'; return b; }
