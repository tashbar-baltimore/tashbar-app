 var SK={"SCI.MATT.L07.01":{"name":"Mirrors and Reflection","band":"5-6","teach":[{"how":"Light travels in straight lines until it hits something. A mirror sends it bouncing back. That bounce is called reflection.","q":"What do we call light bouncing off a surface?","o":["reflection","refraction","absorption"],"h":"Think of a ball bouncing off a wall.","pic":"🔬","why":"The light hits the surface and turns back, the way a ball turns back off a wall."},{"how":"The Bounce Rule: light leaves a mirror at the same angle it came in. We measure both angles from the normal, a line straight out of the mirror.","q":"A ray hits a mirror at 30° from the normal. At what angle does it leave?","o":["30°","60°","90°"],"h":"Use the Bounce Rule on the drawing.","pic":"🔬","why":"Angle in equals angle out, both measured from the normal."},{"how":"A smooth mirror sends all the rays off together, so you see a clear picture. A rough wall scatters the rays every which way.","q":"Why can you see your face in a mirror but not in a white wall?","o":["its surface is smooth and even","a wall soaks up every bit of light","a mirror makes light of its own"],"h":"Look at the two surfaces in the drawing.","pic":"🔬","why":"Smooth surfaces keep the rays in order; rough ones scatter them, so no picture forms."}],"we":[{"q":"Ovadia aims a flashlight at a mirror, 50° from the normal. Where does the beam go?","o":["out at 50° on the other side","straight back into the flashlight"],"steps":["Find the normal: the line straight out of the mirror.","The beam comes in at 50°.","Bounce Rule: angle in equals angle out."],"pic":"🔬"},{"q":"Rivka sees AMBULANCE written backward on the front of a van. Why?","o":["so it reads the right way in a mirror","because the van company spells it backward"],"steps":["A mirror swaps left and right.","A driver ahead sees the van in a mirror.","Backward writing, swapped once, reads..."],"pic":"🔬"}],"practice":[{"t":"sort","q":"Sort them: smooth (a clear picture), or rough (scattered light)?","bins":[{"id":"S","label":"smooth: clear picture"},{"id":"R","label":"rough: scattered"}],"items":[{"label":"a still pond","bin":"S"},{"label":"a polished spoon","bin":"S"},{"label":"a shiny car door","bin":"S"},{"label":"a bedsheet","bin":"R"},{"label":"a brick wall","bin":"R"},{"label":"a paper towel","bin":"R"}],"h":"Ask: could you see your face in it?","pic":"🔬","why":"Only a smooth surface sends the rays back together, so only it shows a picture."},{"t":"num","q":"A laser hits a mirror at 42° from the normal. At what angle does it bounce off, in degrees?","a":42,"h":"Angle in, angle out.","pic":"🔬","why":"The Bounce Rule: the angle out matches the angle in."},{"t":"pairs","q":"Match each tool to how it uses a mirror.","pairs":[["a periscope","see over a tall wall"],["a car side mirror","see cars behind you"],["a round store mirror","see around the aisle corner"]],"h":"Think where each one is used.","pic":"🔬","why":"Each tool bends your line of sight with a bounce."},{"t":"spotall","q":"Tap every true thing about a flat mirror.","cells":[{"label":"left and right swap","ok":true},{"label":"it keeps your size","ok":true},{"label":"writing looks backward","ok":true},{"label":"up and down flip","ok":false},{"label":"the mirror makes the light","ok":false}],"h":"Picture yourself waving with your right hand.","pic":"🔬","why":"A flat mirror swaps left and right only; it keeps size and does not make light."},{"t":"order","q":"Put the light’s trip through a periscope in order.","tiles":["light leaves something over the wall","it hits the top mirror","it travels down the tube","it hits the bottom mirror","it reaches whoever is looking"],"h":"Start on the far side of the wall.","pic":"🔬","why":"Two mirrors at 45° turn the light down and then out again."},{"t":"type","q":"Type the word: the line straight out of a mirror, used to measure angles, is the ____.","a":"normal","alt":["the normal"],"kb":"abc","h":"It is the dashed line in the drawing.","pic":"🔬","why": h color bends a different amount. Red bends least. Violet bends most.","q":"In a prism, which color bends the most?","o":["violet","red","yellow"],"h":"Look at the bottom of the color fan.","pic":"🔬","why":"Each color slows a little differently in glass, so each one bends a different amount."},{"how":"Each raindrop acts like a tiny prism. To see a rainbow, the sun must be behind you and the rain in front of you.","q":"Hillel wants to see a rainbow after a late storm. Where should the sun be?","o":["behind his back","right in front of him","straight over his head"],"h":"Look at the drawing: sun, then rain.","pic":"🔬","why":"Sunlight goes past you into the raindrops, bends, splits, and comes back toward you."}],"we":[{"q":"Tova puts a straw in a glass of water. It looks broken at the water line. Why?","o":["light bends as it leaves the water","the straw truly snapped in the water"],"steps":["Light from the straw starts in water.","It crosses into air at a slant.","It changes speed, so it..."],"pic":"🔬"},{"q":"A beam goes from air into glass straight on, at 0°. What happens?","o":["it slows but does not bend","it bends a lot to the side"],"steps":["Bending needs a slant.","Straight on means no slant.","So the beam..."],"pic":"🔬"}],"practice":[{"t":"order","q":"Order the colors from the one that bends least to the one that bends most.","tiles":["red","orange","yellow","green","blue","indigo","violet"],"h":"Use the memory peg ROY G BIV.","pic":"🔬","why":"Red slows the least in glass, so it bends the least; violet slows the most."},{"t":"sort","q":"Sort them: is the light bending, or bouncing?","bins":[{"id":"B","label":"bending (refraction)"},{"id":"R","label":"bouncing (reflection)"}],"items":[{"label":"a straw looks broken in water","bin":"B"},{"label":"a pool looks shallower than it is","bin":"B"},{"label":"eyeglasses make print clear","bin":"B"},{"label":"you see your face in a spoon","bin":"R"},{"label":"a bike reflector glows at night","bin":"R"},{"label":"a still ","o":["a whistle at 900 Hz","a deep horn at 90 Hz","a low rumble at 40 Hz"],"h":"Compare the Hz numbers.","pic":"🔬","why":"The most vibrations per second gives the highest pitch."}],"we":[{"q":"Shimon presses a guitar string down, making it shorter. What happens to the pitch?","o":["it gets higher","it gets deeper"],"steps":["A shorter string vibrates faster.","Faster vibration means more Hz.","More Hz means..."],"pic":"🔬"},{"q":"On a wave drawing, the waves get taller but stay the same width. What changed?","o":["the sound got louder","the sound got higher"],"steps":["Taller waves mean bigger vibrations.","Same width means same speed.","Bigger vibrations mean..."],"pic":"🔬"}],"practice":[{"t":"sort","q":"Sort them: does it change the pitch, or the volume?","bins":[{"id":"P","label":"pitch"},{"id":"V","label":"volume"}],"items":[{"label":"tightening a guitar string","bin":"P"},{"label":"pressing a string to make it shorter","bin":"P"},{"label":"using a thinner string","bin":"P"},{"label":"plucking a string harder","bin":"V"},{"label":"turning the speaker knob up","bin":"V"},{"label":"standing farther away","bin":"V"}],"h":"Fast or Big? Speed changes one, size changes the other.","pic":"🔬","why":"Speed of vibration sets the pitch; size of vibration sets the volume."},{"t":"pairs","q":"Match each sound to its frequency.","pairs":[["a low hum","100 Hz"],["a middle note","440 Hz"],["a squeaky whistle","3,000 Hz"]],"h":"The higher the sound, the more Hz.","pic":"🔬","why":"More vibrations each second means a higher sound."},{"t":"num","q":"A string vibrates 220 times each second. Tighten it until the frequency doubles. What is the new frequency in Hz?","a":440,"h":"Double means times 2.","pic":"🔬","why":"Doubling the frequency makes the same note one octave higher."},{"t":"spotall","q":"Tap every change that makes a string’s pitch higher.","cells":[{"label":"make it tighter","ok":true},{"label":"make it shorter","ok":true},{"label":"use a thinner string","ok":true},{"lab hing that is vibrating to make a sound.","cells":[{"label":"a plucked string","ok":true},{"label":"a drum skin just after a hit","ok":true},{"label":"a ringing bell","ok":true},{"label":"a book lying still","ok":false},{"label":"a closed, quiet door","ok":false}],"h":"Sound always starts with a shake.","pic":"🔬"}]},"SCI.MATT.L07.04":{"name":"Lightning, Then Thunder","band":"5-6","teach":[{"how":"Light reaches you almost at once. Sound in air travels about 340 meters each second. So you see the flash before you hear the boom.","q":"About how far does sound travel through air in one second?","o":["about 340 meters","about 3 meters","about 34,000 meters"],"h":"Look at the scale bar under the storm.","pic":"🔬","why":"Sound in air covers about 340 meters every second, far slower than light."},{"how":"Distance = speed × time. Thunder 5 seconds after the flash means 340 × 5 = 1,700 meters, about 1.7 kilometers.","q":"Thunder arrives 2 seconds after the flash. About how far away was the lightning?","o":["680 meters","170 meters","2 kilometers"],"h":"Speed × Time.","pic":"🔬","why":"340 meters each second for 2 seconds is 680 meters."},{"how":"An echo is sound that bounces back. It travels there AND back, so the distance to the wall is half the whole trip.","q":"Why do we divide by 2 when we use an echo to find a distance?","o":["the sound went there and back","echoes are half as loud","sound is slower on the way back"],"h":"Trace the arrows in the drawing.","pic":"🔬","why":"The sound covered the distance twice, once each way."}],"we":[{"q":"On a trip, Saba sees a far-off hammer hit a post. The bang comes 3 seconds later. About how far is the hammer?","o":["about 1,020 meters","about 3,400 meters"],"steps":["Sound in air: about 340 meters each second.","Time: 3 seconds.","340 × 3 ="],"pic":"🔬"},{"q":"Leah shouts toward a cliff. The echo comes back in 2 seconds. How far is the cliff?","o":["340 meters","680 meters"],"steps":["The whole trip: 340 × 2 = 680 meters.","That trip went there and back.","Half of 680 is..."],"pic":"🔬"}],"practice":[{"t":"num","q":"Thunder comes 4 seconds after the flash. About how many meters away is the lightning? (Sound: 340 m each second.)","a":1360,"h":"Speed × Time.","pic":"🔬","why":"340 × 4 = 1,360 meters."},{"t":"pairs","q":"Match each material to how fast sound moves through it.","pairs":[["air","about 340 m/s"],["water","about 1,500 m/s"],["steel","about 6,000 m/s"]],"h":"Sound moves faster when the particles are packed tighter.","pic":"🔬","why":"Particles packed close pass the vibration along faster."},{"t":"order","q":"Put the storm math steps in order.","tiles":["see the flash and start counting","stop counting at the boom","multiply the seconds by 340","say the answer in meters"],"h":"Start with your eyes on the sky.","pic":"🔬","why":"Time first, then speed × time."},{"t":"spotall","q":"Tap every true sentence about a storm far away.","cells":[{"label":"the flash arrives almost at once","ok":true},{"label":"the boom takes time to arrive","ok":true},{"label":"a longer count means a farther storm","ok":true},{"label":"thunder travels faster than the flash","ok":false},{"label":"sound can cross empty space","ok":false}],"h":"Think: which one is the speed champion?","pic":"🔬","why":"Light is almost instant; sound needs about 3 seconds for each kilometer."},{"t":"type","q":"Type the word: a sound that bounces back to you is an ____.","a":"echo","alt":["an echo"],"kb":"abc","h":"Shout at a canyon wall and listen.","pic":"🔬","why":"The wall reflects the sound wave back, the way a mirror reflects light."},{"t":"num","q":"Sonar: a ship’s ping goes down to the sea floor and back in 2 seconds. Sound in water: 1,500 m each second. How deep is the sea, in meters?","a":1500,"h":"There and back? Halve the whole trip.","pic":"🔬","why":"1,500 × 2 = 3,000 meters for the round trip, so the floor is 1,500 meters down."}],"check":[{"q":"Ezra counts 6 seconds from flash to boom. About how far away is the storm?","o":["about 2 kilometers","about 6 kilometers","about 20 meters"],"h":"Speed × Time, then change to kilometers.","pic":"🔬"},{"t":"num","q":"An echo from a canyon wall comes back in 4 seconds. How far away is the wall, in meters? (Sound: 340 m each second.)","a":680,"h":"Whole trip first, then halve it.","pic":"🔬"},{"t":"order","q":"Order the storms from the closest to the farthest.","tiles":["boom 1 second after the flash","boom 3 seconds after the flash","boom 7 seconds after the flash","boom 12 seconds after the flash"],"h":"Fewer seconds, closer storm.","pic":"🔬"}],"re":[{"t":"pairs","q":"Game: match the echo time to the distance to the wall.","pairs":[["a 2-second echo","340 m to the wall"],["a 4-second echo","680 m to the wall"],["a 6-second echo","1,020 m to the wall"]],"h":"Halve the trip.","pic":"🔬"},{"t":"sort","q":"Simpler: did the sound go one way, or there and back?","bins":[{"id":"O","label":"one way"},{"id":"B","label":"there and back"}],"items":[{"label":"thunder from a storm","bin":"O"},{"label":"a far-off hammer bang","bin":"O"},{"label":"a shout off a cliff","bin":"B"},{"label":"a ship’s sonar ping","bin":"B"},{"label":"a bat’s click off a moth","bin":"B"}],"h":"Did it bounce off something?","pic":"🔬"},{"t":"sort","q":"Back to basics: seen first, or heard a little later?","bins":[{"id":"S","label":"seen first"},{"id":"H","label":"heard later"}],"items":[{"label":"the lightning flash","bin":"S"},{"label":"a far-off hammer hitting","bin":"S"},{"label":"the thunder","bin":"H"},{"label":"the bang of that hammer","bin":"H"}],"h":"Light is the speed champion.","pic":"🔬"}]}};
 var PAGE={"SCI.MATT.L07.01":{"big":"How does a mirror send light exactly where it goes?","intro":"Light zooms in straight lines. When it hits a smooth mirror, it bounces off by one exact rule: the angle going out matches the angle coming in. Learn that rule, and you can aim light around corners, read backward signs, and even build a periscope.","words":[["reflection","Light bouncing off a surface.","i_bounce"],["normal","A line straight out of the mirror. We measure angles from it.","i_normal"],["periscope","A tube with two mirrors for seeing over things.","i_periscope"]],"dyk":"Astronauts left mirror panels on the moon. Scientists still bounce laser beams off them to measure how far away the moon is!","story":{"title":"The Periscope Mission","text":"Tante Bracha handed Ovadia a tall juice carton and two pocket mirrors. “Build a periscope,” she said, “and you can see over the backyard fence without climbing anything.” Ovadia cut a window near the top and one near the bottom, slid a mirror behind each, and tilted them…"},"predict":{"q":"How should Ovadia tilt each mirror?","o":["at 45 degrees","flat, at 0 degrees","straight up, at 90 degrees"],"reveal":"At 45 degrees! Light comes in level, hits the top mirror, and turns straight down the tube. The bottom mirror turns it level again, right toward Ovadia. Two bounces, one sneaky view."},"checks":[{"q":"A ray hits a mirror at 25° from the normal. What is the angle going out?","o":["25°","50°","65°"],"h":"Use the Bounce Rule."}],"nif":{"text":"You see anything at all only because light bounces off it and into your eyes. Hashem made a world where light carries pictures to us every single moment, and it never runs out."}},"SCI.MATT.L07.02":{"big":"Why does light bend, and how does that paint a rainbow?","intro":"Light slows down when it goes from air into water or glass. If it crosses at a slant, the slowdown turns its path: refraction. Each color bends a little differently, so a prism or a raindrop can fan white sunlight into every color of the rainbow.","words":[["refraction","Light bending as it passes into a new material.","i_bend"],["prism","A clear triangle of glass that splits light into colors.","i_prism"],["spectrum","The fan of colors inside white light.","i_spectrum"]],"dyk":"A diamond sparkles because it slows light more than almost anything else, so light bends and bounces around inside before it escapes.","story":{"title":"The Coin That Appears","text":"At the kitchen table, Savta set a coin in the bottom of an empty mug. Hillel leaned back until the rim just hid the coin. “Don’t move your head,” Savta said, and she slowly poured in water…"},"predict":{"q":"What happened to the coin?","o":["it came into view","it disappeared even more","it floated to the top"],"reveal":"The coin came into view! Light from the coin bent as it left the water, and the bent rays reached Hillel over the rim. Nothing moved except the light."},"checks":[{"q":"Light goes from air into water at a slant. What happens?","o":["it slows and bends","it speeds up and stops","it turns into sound"],"h":"Think of the coin trick."}],"nif":{"text":"Hashem made every tiny raindrop able to split sunlight into colors. The Torah tells us that after the Mabul, the rainbow became a sign of Hashem’s promise to Noach."}},"SCI.MATT.L07.03":{"big":"What makes one sound high and another sound loud?","intro":"Every sound is a vibration. How FAST it vibrates sets the pitch: faster means higher. How BIG it vibrates sets the volume: bigger means louder. Scientists count vibrations per second in hertz and measure loudness in decibels.","words":[["pitch","How high or low a sound is.","i_pitch"],["frequency","How many vibrations happen each second, in hertz (Hz).","i_freq"],["volume","How loud a sound is, measured in decibels (dB).","i_vol"]],"dyk":"Blue whales hum notes so low that people cannot hear them: below 20 Hz. Other whales can hear them from far across the ocean!","story":{"title":"The Kitchen Glass Band","text":"Zeidy was coming for supper, and Bentzion and his sister Tova wanted to play him a tune. They lined up four glasses, poured in different amounts of water, and grabbed a wooden spoon to tap them…"},"predict":{"q":"Which glass sings the lowest note when tapped?","o":["the fullest glass","the emptiest glass","they all sound the same"],"reveal":"The fullest glass! More water makes the glass heavier to shake, so it vibrates more slowly. Slower vibration means lower pitch. Zeidy asked for an encore."},"checks":[{"q":"A sound wave gets more vibrations each second. What do you hear?","o":["a higher pitch","a louder sound","a quieter sound"],"h":"Fast or Big?"}],"nif":{"text":"The same air carries a whisper and a thunderclap, a low hum and a high whistle. Hashem gave us ears that can tell thousands of sounds apart, all at once."}},"SCI.MATT.L07.04":{"big":"How can a sound tell you exactly how far away something is?","intro":"Light reaches you almost at once, but sound in air needs about one second to cross 340 meters. So: distance = speed × time. Count the seconds between a flash and its boom, and you can measure a storm. Listen for an echo, and you can measure a canyon.","words":[["speed of sound","About 340 meters each second in air.","i_speed"],["echo","Sound that bounces back to you.","i_echo"],["sonar","Using echoes in water to measure depth.","i_sonar"]],"dyk":"Bats find moths in the dark by clicking and listening for the echo. The faster the echo comes back, the closer the moth!","story":{"title":"The Canyon Echo","text":"On a family trip to Eretz Yisrael, Leah and Ezra stood at the edge of a giant crater in the Negev. Ezra cupped his hands and shouted “Shalom!” toward the far wall. Leah started her stopwatch. Exactly 2 seconds later: “…lom!”"},"predict":{"q":"About how far away is the crater wall?","o":["about 340 meters","about 680 meters","about 2 kilometers"],"reveal":"About 340 meters. In 2 seconds the sound went 680 meters, but that was there AND back. Half the trip is 340 meters. Ezra wants to shout again; Leah says once was enough."},"checks":[{"q":"Thunder comes 3 seconds after the flash. About how far away is the storm?","o":["about 1 kilometer","about 3 kilometers","about 100 meters"],"h":"Speed × Time."}],"nif":{"text":"Light is so fast it could circle the whole earth more than seven times in one second. Sound is slower, and Hashem made that slowness useful: it tells us how far away a storm is."}}};
 var TEACH={"SCI.MATT.L07.01":{"theme":"lab","hook":"Want to aim light around a corner? You only need one rule.","big":"Light leaves a mirror at the same angle it hits it.","remember":"Light travels in straight lines.","intro":["Light travels in straight lines.","A mirror bounces it back: reflection.","Draw the normal, a line straight out of the mirror.","Angle in equals angle out. That is the Bounce Rule."],"ex":[{"q":"A ray hits a mirror 35° from the normal. Angle out?","steps":["Find the normal.","The angle in is 35°.","Bounce Rule: out matches in."],"a":"35°"},{"q":"Why is AMBULANCE written backward on a van?","steps":["Drivers see it in a mirror.","A mirror swaps left and right.","Backward swapped once reads forward."],"a":"so it reads right in a mirror"}],"oops":{"q":"Is the angle measured from the mirror’s surface?","wrong":"Yes, from the glass.","right":"No, from the normal.","why":"The normal sticks straight out. Measure from it, and in always equals out."},"idea":["A pool ball bounces off the cushion the same way.","Smooth surfaces keep rays together; rough ones scatter them."],"try":{"q":"A ray comes in at 15°. What angle goes out?","o":["15°","30°","75°"],"a":"15°","steps":["Find the normal.","Out matches in."]},"joke":"Why did the mirror get good grades? It always reflected on its work."},"SCI.MATT.L07.02":{"theme":"lab","hook":"A mug, a coin and some water can make a coin appear out of nowhere.","big":"Light bends when it changes speed at a slant.","remember":"White light has all the colors inside it.","intro":["Light is slower in water and glass.","At a slant, the slowdown bends its path.","That bending is refraction.","Each color bends a different amount, so white light fans out."],"ex":[{"q":"Why does a straw look broken in water?","steps":["Light from the straw starts in water.","It leaves into air at a slant.","It speeds up and bends."],"a":"refraction at the water line"},{"q":"Which color bends the most in a prism?","steps":["Red bends least.","Each color bends a bit more.","The last color in ROY G BIV bends most."],"a":"violet"}],"oops":{"q":"Does light bend when it goes straight into water, at 0°?","wrong":"Yes, water always bends light.","right":"No, it only slows down.","why":"Bending needs a slant. Straight on, the whole beam slows together."},"idea":["A shopping cart rolling from floor onto carpet at a slant turns, too.","Every raindrop is a tiny prism."],"try":{"q":"Where must the sun be to see a rainbow?","o":["behind you","in front of you","right overhead"],"a":"behind you","steps":["Rain must be in front.","Sunlight must reach the rain."]},"joke":"Why was the prism so popular? It brought out everyone’s true colors."},"SCI.MATT.L07.03":{"theme":"lab","hook":"Four glasses of water can play a tune. Here’s why.","big":"Fast vibrations sound high; big vibrations sound loud.","remember":"Every sound is made by something vibrating.","intro":["Every sound is a vibration.","Fast or Big? Ask that every time.","Faster vibrations: higher pitch, measured in hertz (Hz).","Bigger vibrations: louder sound, measured in decibels (dB)."],"ex":[{"q":"A string goes from 200 Hz to 400 Hz. Higher or lower?","steps":["400 is more vibrations each second.","More vibrations is faster.","Faster is a higher pitch."],"a":"higher"},{"q":"You pluck a string harder. What changes?","steps":["Harder makes the string swing farther.","That is a bigger vibration.","Bigger means louder."],"a":"the volume"}],"oops":{"q":"Does a louder sound always have a higher pitch?","wrong":"Yes, loud means high.","right":"No, they are separate.","why":"A big drum can be loud and low. Pitch is speed; volume is size."},"idea":["On a wave drawing, close-together waves are high, tall waves are loud.","Tight, short, thin strings sing higher."],"try":{"q":"You tighten a string. What happens to the pitch?","o":["it goes up","it goes down","it stays the same"],"a":"it goes up","steps":["Tighter vibrates faster.","Faster means higher."]},"joke":"Why did the guitar string need a break? It was under too much tension!"},"SCI.MATT.L07.04":{"theme":"lab","hook":"Count after a flash, and you can measure a storm in meters.","big":"Distance = speed × time; for an echo, halve the trip.","remember":"Light travels much faster than sound.","intro":["Light arrives almost at once.","Sound in air: about 340 meters each second.","Speed × Time gives the distance.","Echo? The sound went there and back, so halve it."],"ex":[{"q":"Thunder 3 seconds after the flash. How far?","steps":["Speed: 340 meters each second.","Time: 3 seconds.","340 × 3 = 1,020."],"a":"about 1,020 meters"},{"q":"An echo returns in 6 seconds. How far is the wall?","steps":["Whole trip: 340 × 6 = 2,040.","There and back, so halve it.","2,040 ÷ 2 = 1,020."],"a":"about 1,020 meters"}],"oops":{"q":"An echo takes 2 seconds. Is the wall 680 meters away?","wrong":"Yes, 340 × 2.","right":"No, 340 meters.","why":"680 meters is the whole trip. The wall is halfway: 340."},"idea":["About 3 seconds for every kilometer is a quick rule.","Sound moves faster in water and steel than in air."],"try":{"q":"Thunder 5 seconds after the flash. About how far?","o":["1,700 meters","340 meters","5,000 meters"],"a":"1,700 meters","steps":["340 × 5."]},"joke":"Why is thunder never first in line? It always shows up a few seconds late."}};

 var PIC={"SCI.MATT.L07.01|What do we call light bouncing off a surface?":"bounce","SCI.MATT.L07.01|A ray hits a mirror at 30° from the normal. At what angle does it leave?":"bounce","SCI.MATT.L07.01|Why can you see your face in a mirror but not in a white wall?":"smoothrough","SCI.MATT.L07.01|Ovadia aims a flashlight at a mirror, 50° from the normal. Where does the beam go?":"bounce","SCI.MATT.L07.01|Rivka sees AMBULANCE written backward on the front of a van. Why?":"mirrorword","SCI.MATT.L07.01|Sort them: smooth (a clear picture), or rough (scattered light)?":"smoothrough","SCI.MATT.L07.01|A laser hits a mirror at 42° from the normal. At what angle does it bounce off, in degrees?":"bounce","SCI.MATT.L07.01|Match each tool to how it uses a mirror.":"periscope","SCI.MATT.L07.01|Tap every true thing about a flat mirror.":"mirrorword","SCI.MATT.L07.01|Put the light’s trip through a periscope in order.":"periscope","SCI.MATT.L07.01|Type the word: the line straight out of a mirror, used to measure angles, is the ____.":"bounce0","SCI.MATT.L07.01|Which surface gives the clearest reflection?":"smoothrough","SCI.MATT.L07.01|A ray leaves a mirror at 65° from the normal. At what angle did it come in, in degrees?":"bounce","SCI.MATT.L07.01|Order the steps to aim a beam at a target with one mirror.":"bounce","SCI.MATT.L07.01|Game: match the surface to what light does.":"smoothrough","SCI.MATT.L07.01|Simpler: a ray goes in at 20°. How many degrees does it come out at?":"bounce","SCI.MATT.L07.01|Back to basics: is this how light behaves?":"bounce","SCI.MATT.L07.02|What do we call light bending as it passes from air into water?":"straw","SCI.MATT.L07.02|In a prism, which color bends the most?":"prism","SCI.MATT.L07.02|Hillel wants to see a rainbow after a late storm. Where should the sun be?":"rainbow","SCI.MATT.L07.02|Tova puts a straw in a glass of water. It looks broken at the water line. Why?":"straw","SCI.MATT.L07.02|A beam goes from air into glass straight on, at 0°. What h  var BW='#EAF3FF', BY='#FFD54A', BC='#7FE0FF', BL='#B9D3F5', BF='font-family="Barlow, Arial, sans-serif" font-weight="700" letter-spacing=".6"';

 }
 function tx(x,y,t,sz,anc,col){ return '<text x="'+x+'" y="'+y+'" '+BF+' font-size="'+(sz||8)+'" fill="'+(col||BW)+'" text-anchor="'+(anc||'start')+'">'+t+'</text>'; }
 function fig(n){ return '<g><rect x="186" y="132" width="46" height="11" fill="#143C70" stroke="'+BW+'" stroke-opacity=".6" stroke-width=".7"/>'+tx(209,140.5,'FIG. '+n,6.5,'middle')+'</g>'; }
 function ray(x1,y1,x2,y2,u,col,w){ return '<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="'+(col||BY)+'" stroke-width="'+(w||2.4)+'" stroke-linecap="round" marker-end="url(#g6ar'+u+')"/>'; }
 function arc(cx,cy,r,a1,a2,col){ var p1=[cx+r*Math.sin(a1),cy-r*Math.cos(a1)],p2=[cx+r*Math.sin(a2),cy-r*Math.cos(a2)]; return '<path d="M'+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+' A'+r+' '+r+' 0 0 '+(a2>a1?1:0)+' '+p2[0].toFixed(1)+' '+p2[1].toFixed(1)+'" fill="none" stroke="'+(col||BC)+'" stroke-width="1.4"/>'; }
 function hatch(x1,x2,y){ var h=''; for(var x=x1;x<=x2;x+=7) h+='<line x1="'+x+'" y1="'+y+'" x2="'+(x-6)+'" y2="'+(y+7)+'" stroke="'+BW+'" stroke-opacity=".7" stroke-width=".9"/>'; return h; }

 D.bounce=function(u,o){ o=o||{}; var a=(o.ang||35)*Math.PI/180, cx=120, cy=112, L=88;
  var ix=cx-L*Math.sin(a), iy=cy-L*Math.cos(a), ox=cx+L*Math.sin(a), oy=cy-L*Math.cos(a);
  var b='<line x1="38" y1="'+cy+'" x2="202" y2="'+cy+'" stroke="'+BW+'" stroke-width="3"/>'+hatch(44,202,cy+1)+
   '<line x1="'+cx+'" y1="'+cy+'" x2="'+cx+'" y2="18" stroke="'+BW+'" stroke-width="1.3" stroke-dasharray="4 3"/>'+
   (o.nolabel?'':tx(cx+4,24,'NORMAL',7))+tx(40,cy+20,'MIRROR',7)+
   '<line x1="'+ix.toFixed(1)+'" y1="'+iy.toFixed(1)+'" x2="'+cx+'" y2="'+cy+'" stroke="'+BY+'" stroke-width="2.4" stroke-linecap="round"/>'+
   ray(ix+(cx-ix)*0.22,iy+(cy-iy)*0.22,ix+(cx-ix)*0.32,iy+(cy-iy)*0.32,u)+
   arc(cx,cy,30,-a,0)+(o.out===false?'':('<line x1="'+cx+'" y1="'+cy+'" x2="'+ox.toFixed(1)+'" y2="'+oy.toFixed(1)+'" stroke="'+BY+'" stroke-width="2.4" stroke-linecap="round"/>'+ray(cx+(ox-cx)*0.72,cy+(oy-cy)*0.72,cx+(ox-cx)*0.82,cy+(oy-cy)*0.82,u)+arc(cx,cy,34,0,a)));
  var la=o.nums?(o.ang+'°'):'IN', lb=o.nums?(o.ang+'°'):'OUT';
  var h2=a/2, lx=50*Math.sin(h2), ly=cy-50*Math.cos(h2)+3;
  b+=tx(cx-lx,ly,la,8,'middle',BC)+(o.out===false?tx(cx+lx,ly,'?',11,'middle',BC):tx(cx+lx,ly,lb,8,'middle',BC))+fig(1);
  return bp(u,o.nums?('A light ray hits a mirror at '+o.ang+' degrees from the normal'):'A light ray bouncing off a flat mirror, with the normal line and the angles in and out marked',b); };
 D.bounce0=function(u){ return D.bounce(u,{nolabel:true}); };
 D.smoothrough=function(u){ var b='';
  b+=tx(60,22,'SMOOTH',8,'middle')+tx(180,22,'ROUGH',8,'middle')+'<line x1="120" y1="14" x2="120" y2="136" stroke="'+BW+'" stroke-opacity=".35" stroke-dasharray="3 3"/>';
  b+='<line x1="18" y1="112" x2="104" y2="112" stroke="'+BW+'" stroke-width="3"/>'+hatch(24,104,113);
  [0,1,2].forEach(function(i){ var x=30+i*14; b+='<line x1="'+x+'" y1="40" x2="'+(x+22)+'" y2="112" stroke="'+BY+'" stroke-width="1.2" stroke-opacity=".75"/>'+ray(x+22,112,x+44,40,u,BY,1.8); });
  var rp='M136 112 L146 104 L154 114 L164 102 L172 112 L182 100 L192 113 L202 104 L212 112 L222 106';
  b+='<path d="'+rp+'" fill="none" stroke="'+BW+'" stroke-width="2.4" stroke-linejoin="round"/>';
  [[150,108,134,52],[168,104,186,46],[188,106,222,70],[206,108,196,48]].forEach(function(r,i){ var sx=[146,164,182,200][i]; b+='<line x1="'+sx+'" y1="40" x2="'+r[0]+'" y2="'+r[1]+'" stroke="'+BY+'" stroke-width="1.2" stroke-opacity=".75"/>'+ray(r[0],r[1],r[2],r[3],u,BY,1.8); });
  b+=tx(60,132,'RAYS STAY TOGETHER',6.5,'middle',BL)+tx(180,132,'RAYS SCATTER',6.5,'middle',BL);
  return bp(u,'Parallel light rays bouncing together off a smooth surface, and scattering off a rough surface',b); };
 D.periscope=function(u){ var b='';

 var SK={"SCI.LAND.L07.01":{"name":"Layers of the Earth","band":"5-6","teach":[{"how":"Step 1. The earth has four main layers, like a ball cut in half. From the outside in: crust, mantle, outer core, inner core.","q":"Start at the ground under your feet and dig straight down. Which layer are you digging through first?","o":["the crust","the mantle","the inner core"],"h":"It is the outside layer, the one we live on.","pic":"🔬","why":"The crust is the thin, rocky skin on the outside. Every other layer lies under it."},{"how":"Step 2. The crust and mantle are rock. The two cores are mostly iron and nickel. The outer core is liquid. The inner core is solid.","q":"Which layer is liquid: melted metal that flows?","o":["the outer core","the crust","the inner core"],"h":"Two layers are made of metal. Only one of them flows.","pic":"🔬","why":"The outer core is hot enough to melt metal. The inner core is even hotter, but the weight above squeezes it solid."},{"how":"Step 3. The deeper you go, the hotter it gets. The inner core is about 5,400°C, about as hot as the surface of the sun.","q":"As you go deeper inside the earth, what happens to the temperature?","o":["it gets hotter","it gets colder","it stays the same"],"h":"Miners say the deepest mines feel like an oven.","pic":"🔬","why":"Heat deep inside cannot easily escape through thousands of kilometers of rock above it."}],"we":[{"q":"Feter Gavriel cuts a hard-boiled egg in half. Which part is like the earth’s crust?","o":["the thin shell","the round yolk"],"steps":["The crust is the outside layer.","It is very thin next to the rest.","On an egg, the thin outside part is..."],"pic":"🔬"},{"q":"Akiva names the layers from the center out. Which layer comes right after the inner core?","o":["the outer core","the crust on the outside"],"steps":["Start at the very center: the inner core.","Move one layer outward.","The next layer still has “core” in its name..."],"pic":"🔬"}],"practice":[{"t":"order","q":"Order the layers from the inerals. The crust is made of rocks, so it is made of minerals too."}],"check":[{"q":"Which layer is the thinnest?","o":["the crust","the mantle","the outer core"],"h":"Compare it to an eggshell.","pic":"🔬"},{"t":"num","q":"The crust here is 30 km thick, and the mantle 2,900 km. How deep is the top of the outer core, in km?","a":2930,"h":"Add the layers above it.","pic":"🔬"},{"t":"order","q":"Order these from coolest to hottest.","tiles":["a hot summer day","lava from a volcano","the outer core","the inner core"],"h":"The deeper it comes from, the hotter.","pic":"🔬"}],"re":[{"t":"pairs","q":"Game: match the egg part to the earth layer.","pairs":[["the shell","the crust"],["the white","the mantle"],["the yolk","the core"]],"h":"Outside to inside on both.","pic":"🔬"},{"t":"sort","q":"Simpler: near the surface, or deep inside?","bins":[{"id":"N","label":"near the surface"},{"id":"D","label":"deep inside"}],"items":[{"label":"soil and rocks","bin":"N"},{"label":"the ocean floor","bin":"N"},{"label":"a mountain","bin":"N"},{"label":"liquid metal","bin":"D"},{"label":"the hottest heat","bin":"D"},{"label":"the inner core","bin":"D"}],"h":"Could a person ever reach it?","pic":"🔬"},{"t":"spotall","q":"Back to basics: tap every mineral.","cells":[{"label":"quartz","ok":true},{"label":"salt","ok":true},{"label":"gold","ok":true},{"label":"a plastic cup","ok":false},{"label":"a wooden spoon","ok":false}],"h":"Minerals are natural solids, not made in a factory or grown.","pic":"🔬"}]},"SCI.LAND.L07.02":{"name":"Volcanoes","band":"5-6","teach":[{"how":"Step 1. Deep under a volcano, rock melts into a hot liquid called magma. Once it pours out onto the surface, we call it lava.","q":"What do we call melted rock while it is still underground?","o":["magma","lava","steam"],"h":"It has not come out onto the surface yet.","pic":"🔬","why":"Same melted rock, two names: magma underground, lava above ground."},{"how":"Step 2. Magma is lighter than the solid rock around it, so it rises, lik g and breaking things."},{"t":"pairs","q":"Match each earthquake word to its meaning.","pairs":[["epicenter","the spot on the surface above the slip"],["fault","a crack where rocks slip"],["seismometer","a tool that records shaking"]],"h":"Look for clues inside each word.","pic":"🔬","why":"Seismo- means shaking, and -meter means a tool that measures."},{"t":"spotall","q":"Tap every smart thing to do after the shaking stops.","cells":[{"label":"expect smaller aftershocks","ok":true},{"label":"check around for broken things","ok":true},{"label":"leave the beach for high ground","ok":true},{"label":"stand under a hanging lamp","ok":false},{"label":"light a match to look around","ok":false}],"h":"Shaking can come back, and a coast can flood.","pic":"🔬","why":"Aftershocks often follow, and near the sea a quake can send a big wave."},{"t":"num","q":"Magnitude 4 shakes 10 times more than magnitude 3. How many times more does magnitude 5 shake than magnitude 3?","a":100,"h":"Count the steps up, then multiply by 10 for each.","pic":"🔬","why":"Two steps up: 10 × 10 = 100 times the shaking."},{"t":"type","q":"Review: melted rock that pours out of a volcano onto the surface is called ____.","a":"lava","alt":["the lava"],"kb":"abc","h":"Think back to the Volcanoes lesson: is it under the ground or on it?","pic":"🔬","why":"Underground it is magma; once it reaches the surface it is lava."}],"check":[{"q":"You are outside when the ground starts shaking. Where should you go?","o":["an open spot","close beside a tall tree","next to a tall brick wall"],"h":"What could fall on you?","pic":"🔬"},{"t":"num","q":"How many times stronger is the shaking of a magnitude 7 earthquake than a magnitude 4?","a":1000,"h":"Three steps up.","pic":"🔬"},{"t":"order","q":"Order the safety steps when shaking starts indoors.","tiles":["drop to your hands and knees","cover under a sturdy table","hold on until it stops","check around for damage"],"h":"Three words come first.","pic":"🔬"}],"re":[{"t":"pairs","q":"Game: match the safety word to what you do.","pairs":[["Drop","get down low"],["Cover","get under a sturdy table"],["Hold on","grip the table until it stops"]],"h":"Down, under, grip.","pic":"🔬"},{"t":"sort","q":"Simpler: does it make the ground shake, or not?","bins":[{"id":"Y","label":"makes the ground shake"},{"id":"N","label":"does not"}],"items":[{"label":"plates of rock slipping","bin":"Y"},{"label":"magma pushing up under a volcano","bin":"Y"},{"label":"a gentle breeze","bin":"N"},{"label":"a cloud drifting by","bin":"N"}],"h":"Ask: does it move rock?","pic":"🔬"},{"t":"spotall","q":"Back to basics: tap every true thing about waves.","cells":[{"label":"they carry energy","ok":true},{"label":"they spread out from where they start","ok":true},{"label":"sound travels as waves","ok":true},{"label":"they carry rocks far away","ok":false},{"label":"they can only move in water","ok":false}],"h":"Think of a stone dropped in a pond.","pic":"🔬"}]},"SCI.LAND.L07.04":{"name":"Moving Ground, Measured Today","band":"5-6","teach":[{"how":"Step 1. The earth’s crust is cracked into about a dozen giant pieces called plates. They fit together like a puzzle and ride on the hot mantle.","q":"The crust is broken into giant pieces that fit together like a puzzle. What are the pieces called?","o":["plates","craters","vents"],"h":"Think of a puzzle, or dishes stacked in a pile.","pic":"🔬","why":"The plates rest on soft, hot rock in the upper mantle, so they can slide along."},{"how":"Step 2. GPS stations are bolted to solid rock. Satellites tell each one its spot to within a few millimeters. Year after year, the spots shift.","q":"How do scientists measure that the plates are moving today?","o":["GPS stations","looking at a globe","a long kitchen ruler"],"h":"It works with signals from satellites.","pic":"🔬","why":"Signals from many satellites pin down each station’s exact place, so even a tiny shift shows up."},{"how":"Step 3. Distance = speed × time. Most plates move about 2 to 10 cm each year, about as fast as fingernails grow.","q":"A plate moves 5 cm each year. How far does it move in 10 years?","o":["50 cm","15 cm","5 cm"],"h":"Speed × Time.","pic":"🔬","why":"5 cm each year for 10 years is 5 × 10 = 50 cm."}],"we":[{"q":"Two plates push straight into each other. What happens to the ground there?","o":["it crumples up into mountains","it opens up into a wide, deep gap"],"steps":["Push means the pieces squeeze together.","Squeezed rock has to go somewhere.","It folds upward into..."],"pic":"🔬"},{"q":"Zevulun’s camp GPS station moved 3 cm this year. How far will it move in 100 years at the same speed?","o":["300 cm, which is 3 meters","3 cm, the same as one year"],"steps":["Speed: 3 cm each year.","Time: 100 years.","3 × 100 = ..."],"pic":"🔬"}],"practice":[{"t":"sort","q":"Sort the boundaries: push together, pull apart, or slide past?","bins":[{"id":"P","label":"push together"},{"id":"A","label":"pull apart"},{"id":"S","label":"slide past"}],"items":[{"label":"mountains slowly rising","bin":"P"},{"label":"one plate diving under another","bin":"P"},{"label":"a crack opening with lava","bin":"A"},{"label":"a new ridge on the ocean floor","bin":"A"},{"label":"a road split and shifted sideways","bin":"S"},{"label":"a long, straight fault line","bin":"S"}],"h":"Push, Pull or Slide? Picture each one with your two hands.","pic":"🔬","why":"Pushing builds up, pulling opens a gap, and sliding shifts things sideways."},{"t":"pairs","q":"Match each place to what its plates are doing.","pairs":[["the Himalaya mountains","pushing together"],["Iceland","pulling apart"],["the Dead Sea valley","sliding past each other"]],"h":"Tall mountains, a split island, a long valley.","pic":"🔬","why":"The Himalayas are squeezed up, Iceland is pulled open, and the Dead Sea valley lies on a sliding fault."},{"t":"spotall","q":"Tap every thing that happens where plates meet.","cells":[{"label":"earthquakes","ok":true},{"label":"volcanoes","ok":true},{"label":"mountains rising","ok":true},{"label":"the tides","ok":false},{"label":"rainbows","ok":false}],"h":"Which ones come from rock moving or melting?","pic":"🔬","why":"Where plates meet, rock gets stuck, squeezed or melted: quakes, volcanoes and mountains."},{"t":"num","q":"A GPS station moves 4 cm each year. How many cm will it move in 25 years?","a":100,"h":"Speed × Time.","pic":"🔬","why":"4 × 25 = 100 cm, which is exactly 1 meter."},{"t":"order","q":"Order these from the slowest to the fastest.","tiles":["a moving plate","a growing blade of grass","a crawling snail","a boy walking"],"h":"A plate needs a whole year to go a few centimeters.","pic":"🔬","why":"A plate: cm per year. Grass: cm per day. A snail: cm per minute. Walking: meters per second."},{"t":"type","q":"Review: the tool that records an earthquake’s shaking is a ____.","a":"seismometer","alt":["seismograph","a seismometer","a seismograph"],"kb":"abc","h":"Think back to the Earthquakes lesson: seismo- means shaking.","pic":"🔬","why":"A seismometer measures shaking; its paper or screen record shows each wave."}],"check":[{"q":"In the middle of the Atlantic Ocean, two plates pull apart. What fills the gap?","o":["rising magma that hardens","only ocean water","sand blown from the beach"],"h":"What comes up from below?","pic":"🔬"},{"t":"num","q":"Iceland is pulling apart about 2 cm each year. How many cm wider will it get in 30 years?","a":60,"h":"Speed × Time.","pic":"🔬"},{"t":"order","q":"Order the GPS steps that show a plate is moving.","tiles":["bolt a station to solid rock","record its spot this year","record its spot again next year","compare the two spots"],"h":"Set it up before you measure.","pic":"🔬"}],"re":[{"t":"pairs","q":"Game: match the boundary to what it builds.","pairs":[["push together","mountains"],["pull apart","new crust and ridges"],["slide past","long faults and earthquakes"]],"h":"Squeeze up, open up, shift over.","pic":"🔬"},{"t":"sort","q":"Simpler: does the ground move fast, or very slowly?","bins":[{"id":"F","label":"fast"},{"id":"W","label":"very slowly"}],"items":[{"label":"a plate drifting","bin":"W"},{"label":"mountains rising","bin":"W"},{"label":"the ground in an earthquake","bin":"F"},{"label":"rock slipping at a fault","bin":"F"}],"h":"Plates creep; quakes jerk.","pic":"🔬"},{"t":"spotall","q":"Back to basics: tap every place that is high land.","cells":[{"label":"a mountain top","ok":true},{"label":"a tall hill","ok":true},{"label":"a high ridge","ok":true},{"label":"a valley floor","ok":false},{"label":"a deep lake","ok":false}],"h":"High land goes up, up, up.","pic":"🔬"}]}};
 var PAGE={"SCI.LAND.L07.01":{"big":"What is under your feet, all the way down to the center of the earth?","intro":"Dig straight down and you would pass four layers: the thin rocky crust, the thick hot mantle, the liquid metal outer core, and the solid metal inner core. Each layer is hotter than the one above it.","words":[["crust","The thin, rocky outside layer we live on.","i_crust"],["mantle","The thick layer of hot rock under the crust.","i_mantle"],["core","The metal center: a liquid outer core and a solid inner core.","i_core"]],"dyk":"The deepest hole people ever drilled goes down about 12 kilometers, and it still did not get through the crust!","story":{"title":"The Egg at the Shabbos Table","text":"At the Shabbos seudah, Feter Gavriel held up half of a hard-boiled egg. “Akiva, this egg is a model of the earth,” he said. “A thin shell, a thick white, and a round yolk in the middle.” Akiva’s sister Shira leaned in for a closer look…"},"predict":{"q":"If the earth were the size of this egg, how thick would its crust be?","o":["even thinner than the shell","as thick as the white","as big as the yolk"],"reveal":"Even thinner than the shell! The crust is only a thin skin around the earth. Shira said she would never look at an egg the same way again."},"checks":[{"q":"Which layer is solid metal at the very center?","o":["the inner core","the crust","the mantle"],"h":"Think of the yolk."}],"nif":{"text":"Every mine, every well and every mountain sits on the thin crust. Hashem built a whole world under our feet that no person has ever visited, and it holds us up every moment."}},"SCI.LAND.L07.02":{"big":"How does solid rock turn into a glowing river of lava?","intro":"Deep below, rock gets so hot it melts into magma. Magma is lighter than the rock around it, so it rises and collects in a chamber. When the pressure gets too great, it bursts out of the vent as lava. Runny lava flows; sticky lava explodes.","words":[["magma","Melted rock under the ground.","i_magma"],["lava","Melted rock that has come out onto the surface.","i_lava"],["vent","The pipe that magma rises through.","i_vent"]],"dyk":"When lava cools, it hardens into new rock. On Hawaii’s Big Island, lava flows that reach the sea have added brand-new land.","story":{"title":"Runny or Sticky?","text":"On Chol Hamoed, Menachem and his cousin Yocheved built two model volcanoes on Uncle Refael’s porch. They filled one with plain water and the other with thick, sticky syrup. Then they each blew air into the bottom of their volcano through a long straw…"},"predict":{"q":"Which volcano will burst with a big splatter?","o":["the sticky syrup one","the plain water one","both exactly the same"],"reveal":"The sticky one! The thick syrup trapped the air until it burst out in a big splat. The water let the bubbles slip out gently. Real volcanoes work the same way. Uncle Refael handed out paper towels."},"checks":[{"q":"Melted rock that has poured out onto the surface is called…","o":["lava","magma","ash"],"h":"Is it above the ground now?"}],"nif":{"text":"Lava that cools turns into new rock, and in time it breaks down into rich soil where farms grow. Hashem made even the fire inside the earth a source of blessing."}},"SCI.LAND.L07.03":{"big":"Why does the ground shake, and how do we stay safe when it does?","intro":"Plates of rock press against each other and get stuck. Stress builds until they suddenly slip, sending seismic waves through the ground. Scientists measure the shaking with seismometers. And everyone can learn three life-saving words: Drop, Cover, Hold On.","words":[["fault","A crack in the crust where rocks slip.","i_fault"],["epicenter","The spot on the surface right above the slip.","i_epi"],["seismometer","A tool that records how the ground shakes.","i_seismo"]],"dyk":"Seismometers are so sensitive that they can feel a big earthquake on the other side of the world, just minutes after it happens.","story":{"title":"Breakfast at Bubby’s","text":"Nissim was visiting his Bubby in California. Just as he poured his cereal, the spoons began to rattle and the hanging lamp swung back and forth. Bubby put down her coffee and looked right at him…"},"predict":{"q":"What should Nissim do right away?","o":["drop, cover and hold on","run to look out the window","stand still under the lamp"],"reveal":"Drop, cover, and hold on! Nissim and Bubby ducked under the sturdy kitchen table and held on. The shaking stopped in a few seconds. Only one cup broke, and Bubby said it was an old one anyway."},"checks":[{"q":"What should you stay away from during an earthquake?","o":["windows and tall shelves","a sturdy table","an open field"],"h":"What could fall or break?"}],"nif":{"text":"The ground feels perfectly still almost all the time, even though the plates under it never stop pressing. Chazal gave us a special bracha to say when we feel an earthquake, to remember Whose strength holds the world steady."}},"SCI.LAND.L07.04":{"big":"If the ground is moving right now, how can anyone tell?","intro":"The crust is cracked into giant plates. They push together, pull apart, or slide past each other, a few centimeters each year. That is far too slow to feel, but GPS stations bolted to rock measure it to the millimeter. Distance = speed × time.","words":[["plate","One of the giant pieces of the earth’s crust.","i_plate"],["boundary","The place where two plates meet.","i_bound"],["GPS station","A post bolted to rock that knows its exact spot.","i_gps"]],"dyk":"Iceland sits right where two plates pull apart. A deep crack there is slowly getting wider, and divers swim through it between the two plates!","story":{"title":"The Post on the Hill","text":"On a camp hike, Zevulun’s counselor Moshe stopped by a short metal post bolted into the rock, with a white dome on top. “This little station knows exactly where it is,” Moshe said. “And every year, it ends up a tiny bit somewhere else.”"},"predict":{"q":"About how far does that station move in one year?","o":["about 3 centimeters","about 3 meters","about 3 kilometers"],"reveal":"About 3 centimeters, about as fast as fingernails grow. Slow, but GPS catches every millimeter. Zevulun decided the hill was not running away anytime soon."},"checks":[{"q":"About how fast do plates move?","o":["a few centimeters a year","a few meters a day","a few kilometers a minute"],"h":"About as fast as fingernails grow."}],"nif":{"text":"Whole countries ride on these plates, so slowly that no one feels it, yet GPS can measure it. Hashem runs the world with perfect order, down to the last centimeter."}}};
 var TEACH={"SCI.LAND.L07.01":{"theme":"lab","hook":"If you could dig to the center of the earth, what would you pass? Four layers, one step at a time.","big":"The earth has four layers: crust, mantle, outer core, inner core.","remember":"Rocks are made of minerals.","intro":["Step 1: the crust is the thin, rocky skin we live on.","Step 2: the mantle is thick, hot rock under it.","Step 3: the outer core is liquid metal; the inner core is solid metal.","Step 4: the deeper you go, the hotter it gets."],"ex":[{"q":"A drill goes down through the crust. Which layer is next?","steps":["Start at the surface: the crust.","Go one layer down.","The thick, hot rock there is the mantle."],"a":"the mantle"},{"q":"Which core is liquid?","steps":["Both cores are metal.","The inner core is squeezed solid.","So the other one flows."],"a":"the outer core"}],"oops":{"q":"Is the hottest layer liquid?","wrong":"Yes, hottest means melted.","right":"No, the inner core is solid.","why":"The weight of everything above squeezes it solid, even though it is the hottest layer."},"idea":["A hard-boiled egg: shell, white, yolk.","A peach: thin skin, thick fruit, hard pit in the middle."],"try":{"q":"Which layer do we live on?","o":["the crust","the mantle","the outer core"],"a":"the crust","steps":["Start at the surface.","The outside layer is…"]},"joke":"Why was the inner core so popular? It was the center of attention!"},"SCI.LAND.L07.02":{"theme":"lab","hook":"A mountain with a river of fire inside it? Let’s follow the magma up, step by step.","big":"Magma rises, pressure builds, and lava bursts out.","remember":"Heat can melt a solid into a liquid.","intro":["Step 1: deep down, rock melts into magma.","Step 2: magma is lighter, so it rises into a chamber.","Step 3: gas pressure pushes it out of the vent as lava.","Step 4: Flow or Blow? Runny lava flows; sticky lava blows out."],"ex":[{"q":"Melted rock flows down a slope. Magma or lava?","steps":["Where is it now?","It is on the surface.","Above the ground, it is called lava."],"a":"lava"},{"q":"A volcano blasts ash high into the sky. Runny or sticky lava?","steps":["A blast means trapped gas.","Which lava traps gas?","The thick, sticky kind."],"a":"sticky lava"}],"oops":{"q":"Are lava and magma different stuff?","wrong":"Yes, two different things.","right":"No, same rock, two names.","why":"Magma underground, lava above ground. Only the place changes."},"idea":["A shaken bottle of seltzer with the cap on acts like sticky lava.","Warm honey flows; cold honey hardly moves."],"try":{"q":"Where does magma collect before an eruption?","o":["the magma chamber","the crater","the ash cloud"],"a":"the magma chamber","steps":["It waits underground.","In a big pocket of rock."]},"joke":"What did one volcano say to the other? I lava you!"},"SCI.LAND.L07.03":{"theme":"lab","hook":"Three words can keep you safe in an earthquake. First, let’s see why the ground shakes.","big":"Plates stick, then slip, and seismic waves shake the ground.","remember":"A wave carries energy from place to place.","intro":["Step 1: plates press together and get stuck.","Step 2: stress builds until the rock suddenly slips.","Step 3: seismic waves spread out and shake the ground.","Step 4: shaking starts? Drop, Cover, Hold On."],"ex":[{"q":"Magnitude 6 compared with magnitude 4. How much stronger is the shaking?","steps":["Each step up is 10 times stronger.","From 4 to 6 is two steps.","10 × 10 = 100."],"a":"100 times stronger"},{"q":"You are in class when the shaking starts. What first?","steps":["Drop down low.","Cover under your desk.","Hold on until it stops."],"a":"drop, cover, hold on"}],"oops":{"q":"Should you run outside the moment the shaking starts?","wrong":"Yes, get out fast.","right":"No: drop, cover, hold on.","why":"Running on a shaking floor makes you fall, and things fall near doors and walls."},"idea":["Push two rough bricks past each other: stuck, stuck, then a sudden jerk.","A stone in a pond: rings spread out like seismic waves."],"try":{"q":"What is the spot on the surface right above the slip?","o":["the epicenter","the crater","the summit"],"a":"the epicenter","steps":["It is on the surface.","Right above where the rock slipped."]},"joke":"Why did the seismometer win an award? It always picked up on the little things!"},"SCI.LAND.L07.04":{"theme":"lab","hook":"The ground under your house is not where it was last year. Here is how we know.","big":"Plates move a few centimeters a year: they push, pull or slide.","remember":"Mountains are high land; valleys are low land.","intro":["Step 1: the crust is cut into about a dozen plates.","Step 2: Push, Pull or Slide? Every boundary does one.","Step 3: GPS stations measure the motion to the millimeter.","Step 4: distance = speed × time."],"ex":[{"q":"A plate moves 6 cm a year. How far in 10 years?","steps":["Speed: 6 cm each year.","Time: 10 years.","6 × 10 = 60."],"a":"60 cm"},{"q":"Two plates pull apart under the ocean. What forms?","steps":["Pulling apart makes a gap.","Magma rises into the gap.","It cools into new crust: a ridge."],"a":"a new ridge"}],"oops":{"q":"We cannot feel the plates moving. So are they standing still?","wrong":"Yes, nothing moves.","right":"No, GPS shows them moving.","why":"A few centimeters a year is far too slow to feel, but GPS measures it exactly."},"idea":["Plates move about as fast as fingernails grow.","Push two rugs together and they wrinkle up like mountains."],"try":{"q":"Two plates push together. What can rise?","o":["mountains","a deep gap","a new ocean"],"a":"mountains","steps":["Push means squeeze.","Squeezed ground folds up."]},"joke":"Why did the two plates stop arguing? They finally saw eye to eye at the boundary!"}};
 var LABI={"SCI.LAND.L07.01":{"kind":"label","title":"Label the Earth","goal":"Tap a name card, then tap its layer in the cut-away earth. Label all four layers!","names":["crust","mantle","outer core","inner core"],"shuffle":[2,0,3,1]},"SCI.LAND.L07.02":{"kind":"comic","title":"Eruption Comic","goal":"The comic panels got mixed up! Tap them in order, from the first panel to the last.","panels":[["p1","Deep down, rock melts into magma."],["p2","Magma rises and fills the chamber."],["p3","Gas pressure builds and builds."],["p4","Boom! Lava bursts out of the vent."]],"shuffle":[2,0,3,1]},"SCI.LAND.L07.03":{"kind":"find","title":"Safe Spot Hunt","goal":"The shaking just started! Tap every danger in the room, and find the one safe spot.","spots":[["table","safe","The sturdy table! Drop, cover, and hold on under it."],["window","danger","Glass can break. Stay away from windows."],["shelf","danger","A tall bookcase can tip over. Keep away."],["lamp","danger","A hanging lamp can swing and fall. Do not stand under it."],["frame","danger","A picture frame can drop off the wall."]]},"SCI.LAND.L07.04":{"kind":"gps","title":"GPS Tracker","goal":"Pick a station and a number of years. Guess how far it moves, then check!","stations":[["Iceland",2],["Camp hill",3],["Ocean island",7]],"years":[1,10,50,100]}};

 var SK={"SCI.PLANT.L07.01":{"name":"Flowering or Not?","band":"5-6","teach":[{"how":"Step 1. Every plant makes new plants in one of two ways: with seeds, or with spores. Mosses and ferns use spores, tiny specks that blow in the wind.","q":"A moss and a fern make no seeds at all. How do they make new plants?","o":["with tiny spores","with seeds in cones","with seeds inside fruit"],"h":"They are as small as dust and ride on the wind.","pic":"🌱","why":"A spore is far smaller than a seed and carries no packed food, so one fern sends out huge numbers of them."},{"how":"Step 2. Mosses have no tubes, so they stay tiny and low in damp places. Ferns have tubes inside, so they can grow tall, but they still use spores.","q":"Which group has tubes inside to carry water, but still no seeds?","o":["ferns","mosses","pine trees"],"h":"It can grow tall, yet it has brown spore dots.","pic":"🌱","why":"Tubes carry water up from the roots. Without tubes, a moss soaks up water like a sponge, so it stays short."},{"how":"Step 3. Seed plants come in two kinds. Cone plants, like pines, keep bare seeds in cones. Flowering plants grow their seeds inside a fruit.","q":"A pine tree and an apple tree both make seeds. Where does the pine tree keep its seeds?","o":["in its cones","inside sweet fruit","in spore dots"],"h":"Look for the woody, scaly things hanging on its branches.","pic":"🌱","why":"A pine has no flowers and no fruit. Its seeds sit on the scales of its cones until the wind carries them off."}],"we":[{"q":"On a Shabbos walk, Yehuda finds a soft green carpet on a damp rock. It has no flowers and is shorter than a coin is wide. What is it?","o":["a moss","a pine tree"],"steps":["It is very short and low.","It grows in a damp, shady place.","No tubes, no seeds: it must be..."],"pic":"🌱"},{"q":"Abba turns over a fern leaf and shows Yehuda rows of brown dots underneath. What is inside the dots?","o":["spores","tiny cones"],"steps":["Ferns make no seeds.","They need another way to start new ferns.","The dots are packed with..."],"pic":"🌱"}],"practice":[{"t":"sort","q":"Sort them: makes seeds, or makes spores?","bins":[{"id":"S","label":"makes seeds"},{"id":"P","label":"makes spores"}],"items":[{"label":"an apple tree","bin":"S"},{"label":"a pine tree","bin":"S"},{"label":"a rose bush","bin":"S"},{"label":"a fern","bin":"P"},{"label":"moss on a rock","bin":"P"},{"label":"a tall tree fern","bin":"P"}],"h":"Spore plants never flower and never make cones.","pic":"🌱","why":"Apple, pine and rose all make seeds. Mosses and ferns, even a tall tree fern, make spores."},{"t":"pairs","q":"Match each plant group to what it has.","pairs":[["mosses","no tubes and no seeds"],["ferns","tubes, but only spores"],["cone plants","bare seeds in cones"],["flowering plants","seeds inside a fruit"]],"h":"Each group adds one more part than the one before.","pic":"🌱","why":"Moss: no tubes. Fern: tubes. Pine: tubes and seeds. Flowering plant: tubes, seeds, flowers and fruit."},{"t":"order","q":"Order them from the fewest of these parts to the most: tubes, seeds, flowers.","tiles":["a moss","a fern","a pine","an apple tree"],"h":"Count the three parts for each plant.","pic":"🌱","why":"Moss: none of them. Fern: tubes. Pine: tubes and seeds. Apple tree: all three."},{"t":"spotall","q":"Tap every true thing about spores.","cells":[{"label":"they are tiny, like dust","ok":true},{"label":"the wind can carry them","ok":true},{"label":"ferns and mosses make them","ok":true},{"label":"they grow inside apples","ok":false},{"label":"pine cones are made of them","ok":false}],"h":"Where did we find spores, and how small are they?","pic":"🌱","why":"Spores are dust-small, ride the wind, and come from mosses and ferns. Apples hold seeds; pine cones hold seeds too."},{"t":"type","q":"Review: a grain of wheat can grow a whole new wheat plant. Type what a grain of wheat is: a ____.","a":"seed","alt":["a seed","seeds"],"kb":"abc","h":"Think back to the wheat lesson: what does a farmer plant?","pi er","ok":true},{"label":"a watermelon","ok":true},{"label":"a leaf","ok":false},{"label":"a root","ok":false}],"h":"Which ones did a flower turn into?","pic":"🌱"}]},"SCI.PLANT.L07.02":{"name":"The Germination Experiment","band":"5-6","teach":[{"how":"Step 1. A seed is a sleeping baby plant with a packed lunch. It wakes up, or germinates, when it gets water, warmth and air.","q":"A dry bean sits in a jar for a whole year and does nothing. Which three things wake it up?","o":["water, warmth and air","sunlight, sugar and soil","darkness, wind and salt"],"h":"A seed is not hungry for light yet. What does a sleeper need?","pic":"🌱","why":"Water swells the seed, warmth lets it work, and air gives it oxygen to use its packed food."},{"how":"Step 2. In a fair test you change only ONE thing and keep everything else the same. The jar you leave as usual is the control.","q":"Chananya wants to test if seeds need light to sprout. What must stay the same in both jars?","o":["everything but light","the light, so both are dark","just the color of each jar"],"h":"Change One Thing! Which one thing is he testing?","pic":"🌱","why":"If two things change at once, you cannot tell which one made the difference."},{"how":"Step 3. Count the results and turn them into a percent: seeds that sprouted ÷ seeds planted × 100.","q":"In Chananya’s jar, 18 of 20 seeds sprouted. What percent is that?","o":["90%","18%","20%"],"h":"Sprouted ÷ planted × 100.","pic":"🌱","why":"18 ÷ 20 = 0.9, and 0.9 × 100 = 90%."}],"we":[{"q":"Malka keeps bean seeds under water for a week. Most never sprout. What were they missing?","o":["air","water"],"steps":["Germination needs water, warmth and air.","Under water, there is plenty of water.","So the missing one is..."],"pic":"🌱"},{"q":"Chananya puts one jar in the fridge and one on the kitchen counter. Which jar is the control?","o":["the counter jar, kept as usual","the fridge jar, which was changed"],"steps":["The control is the jar you leave as usual.","Seeds usually
