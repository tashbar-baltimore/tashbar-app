 var SK={"SCI.PLANT.L08.01":{"name":"Built from Cells","band":"5-6","teach":[{"how":"Step 1. Every living thing is built from cells. A cell is the smallest part that is alive all by itself. Most cells are far too small to see without a microscope.","q":"Every living thing is built from tiny living units. What are they called?","o":["cells","atoms","seeds"],"h":"Robert Hooke named them after small rooms.","pic":"🔬","why":"Atoms are even smaller, but an atom is not alive. A cell can take in food, grow and make more cells."},{"how":"Step 2. Some living things are just one cell: a bacterium, an amoeba, a yeast cell. Others are many-celled, like a tree or a fish. Their cells work together, and each kind has its own job.","q":"Some living things are just one single cell. Which of these is only one cell?","o":["a bacterium","an oak tree","a goldfish"],"h":"Which one can only be seen under a microscope?","pic":"🔬","why":"A tree has leaf cells, root cells and wood cells. Each kind is built for its own job, like players on a team."},{"how":"Step 3. New cells come only from other cells. A cell grows, copies what is inside it, and splits into two new cells. Each of those can split again: 1, 2, 4, 8.","q":"Where do new cells come from?","o":["from a cell that splits","from water and sunlight","from dust in the air"],"h":"Only living things can make living things.","pic":"🔬","why":"Careful experiments with sealed jars showed it: living things come only from living things."}],"we":[{"q":"Hillel looked at a thin slice of cork under Zaidy Moshe’s microscope. He saw rows of tiny boxes. What were they?","o":["cells","grains of sand"],"steps":["Cork comes from the bark of a tree.","A tree is a living thing, built from…","So the tiny boxes are…"],"pic":"🔬"},{"q":"One bacterium splits in two every 20 minutes. How many are there after 40 minutes?","o":["4","2"],"steps":["After 20 minutes: 1 becomes 2.","After 40 minutes: each of the 2 splits again.","2 + 2 makes…"],"pic":"🔬"}],"practice":[{"t":"sort","q":"Sort them: one cell, or many cells?","bins":[{"id":"O","label":"just one cell"},{"id":"M","label":"many cells"}],"items":[{"label":"a bacterium","bin":"O"},{"label":"an amoeba","bin":"O"},{"label":"a yeast cell","bin":"O"},{"label":"an oak tree","bin":"M"},{"label":"a goldfish","bin":"M"},{"label":"a mushroom","bin":"M"}],"h":"Zoom to the Smallest! Could you see it without a microscope?","pic":"🔬","why":"Bacteria, amoebas and yeast are each a whole living thing in one cell. Trees, fish and mushrooms are built from many cells working together."},{"t":"pairs","q":"Match each cell word to its meaning.","pairs":[["cell","the smallest living part"],["one-celled","a whole living thing in one cell"],["many-celled","built from many cells working together"]],"h":"Zoom to the Smallest! Which word is about just one?","pic":"🔬","why":"A cell is the smallest living part. A one-celled living thing is one cell. A many-celled one is built from many."},{"t":"spotall","q":"Tap every true thing about cells.","cells":[{"label":"every living thing is made of them","ok":true},{"label":"new cells come from cells","ok":true},{"label":"most are too small to see by eye","ok":true},{"label":"rocks are made of cells","ok":false},{"label":"a cell is the same as an atom","ok":false}],"h":"Zoom to the Smallest! Which cards are about living things?","pic":"🔬","why":"Cells build every living thing, they come from other cells, and most need a microscope. Rocks are not alive, and an atom is not a cell."},{"t":"num","q":"A yeast cell splits into 2. Then each new cell splits, and then each splits once more. How many cells after 3 splits?","a":8,"h":"Double it three times: 1, then 2, then…","pic":"🔬","why":"1 → 2 → 4 → 8. Every split doubles the number of cells."},{"t":"type","q":"Review: the tiny openings on the underside of a leaf are called ____.","a":"stomata","alt":["stoma","stomates"],"kb":"abc","h":"Think back to Leaves Up Close.","pic":"🔬","why":"Stomata! Each one is opened and closed by two guard cells. Now you know: guard cells are cells."},{"t":"num","q":"Review: a pond has algae, duckweed, a frog and a fish. How many of them are producers that make their own food?","a":2,"h":"Think back to Producers and Consumers.","pic":"🔬","why":"Algae and duckweed make their own food from sunlight. The frog and the fish eat. 2 producers."}],"check":[{"q":"What is the smallest part of a living thing that is alive by itself?","o":["a cell","an atom","a leaf"],"h":"It is alive, and it is tiny.","pic":"🔬"},{"t":"order","q":"Put these four in size order, starting with the tiniest.","tiles":["an atom","a cell","a leaf","a whole tree"],"h":"Start with the one that is not alive at all.","pic":"🔬"},{"t":"num","q":"Robert Hooke first named cells in the year 1665. How many years later came the year 2000?","a":335,"h":"Subtract 1665 from 2000.","pic":"🔬"}],"re":[{"t":"pairs","q":"Game: match each part to the bigger thing it builds.","pairs":[["atoms","a cell"],["cells","a leaf"],["leaves, stems and roots","a whole plant"]],"h":"Start with the very smallest.","pic":"🔬"},{"t":"sort","q":"Simpler: alive, or never alive?","bins":[{"id":"A","label":"alive"},{"id":"N","label":"never alive"}],"items":[{"label":"a bacterium","bin":"A"},{"label":"a mushroom","bin":"A"},{"label":"a blade of grass","bin":"A"},{"label":"a rock","bin":"N"},{"label":"a raindrop","bin":"N"},{"label":"a metal spoon","bin":"N"}],"h":"Ask: can it grow and make more of itself?","pic":"🔬"},{"t":"spotall","q":"Back to basics: tap every thing all living things do.","cells":[{"label":"grow","ok":true},{"label":"need food or energy","ok":true},{"label":"make more living things","ok":true},{"label":"rust","ok":false},{"label":"melt in the sun","ok":false}],"h":"Think back to What Living Things Need.","pic":"🔬"}]},"SCI.PLANT.L08.02":{"name":"Using the Microscope","band":"5-6","teach":[{"how":"Step 1. Know the parts. You look into the eyepiece at the top. The objective lenses sit just above the slide. The slide lies on the stage, and a light shines up through it.","q":"On a microscope, which part do you look into?","o":["the eyepiece","the stage clips","the light below"],"h":"It sits at the very top.","pic":"🔬","why":"Light has to pass THROUGH the sample, so the slice must be very thin."},{"how":"Step 2. Total magnification = eyepiece × objective. A 10× eyepiece with a 4× lens shows 4 × 10 = 40×. With a 10× lens, it shows 100×.","q":"The eyepiece makes things look 10 times bigger. The objective lens makes them 40 times bigger. What is the total magnification?","o":["400 times","50 times","4,000 times"],"h":"Times the Lenses! Do not add them.","pic":"🔬","why":"The objective makes a bigger picture, and then the eyepiece makes THAT picture bigger again. So we multiply."},{"how":"Step 3. Start with the lowest power. Focus with the big knob and center what you want to see. Then click to a higher lens and sharpen it with the small knob.","q":"Which lens should you start with when you look at a new slide?","o":["the lowest power lens","the highest power lens","no lens at all"],"h":"Which one shows the widest view?","pic":"🔬","why":"Low power shows a wide view, so your sample is easy to find. High power shows only a tiny spot of it."}],"we":[{"q":"Ezra uses a 10× eyepiece and a 10× objective lens. What is the total magnification?","o":["100×","20×"],"steps":["Times the Lenses!","Multiply: 10 × 10.","So the onion cells look…"],"pic":"🔬"},{"q":"Ovadia sees only a gray blur on high power. What should he do first?","o":["go back to low power and focus","turn up the light even brighter"],"steps":["Low power shows a wide view.","It is easy to find the cells there.","So first he should…"],"pic":"🔬"}],"practice":[{"t":"pairs","q":"Match each microscope part to its job.","pairs":[["eyepiece","the lens you look into"],["stage","the flat shelf that holds the slide"],["focus knob","makes the picture sharp"]],"h":"Times the Lenses! Start at the top and work down.","pic":"🔬","why":"You look through the eyepiece, the slide sits on the stage, and the knobs sharpen the picture."},{"t":"order","q":"Put the steps for looking at a slide in order.","tiles":["place the slide on the stage","start with the lowest lens","focus with the big knob","turn to a higher lens and sharpen"],"h":"Low power always comes before high power.","pic":"🔬","why":"Slide first, low power, big knob, then high power with the small knob. Small steps, sharp picture."},{"t":"sort","q":"Sort them: good on a microscope slide, or not?","bins":[{"id":"G","label":"good for a slide"},{"id":"N","label":"not good"}],"items":[{"label":"a thin slice of onion skin","bin":"G"},{"label":"a drop of pond water","bin":"G"},{"label":"a thin leaf from a water plant","bin":"G"},{"label":"a whole apple","bin":"N"},{"label":"a thick chunk of wood","bin":"N"},{"label":"a pebble","bin":"N"}],"h":"Times the Lenses! Can light shine through it?","pic":"🔬","why":"Light must pass up through the sample. Thin skins, single drops and thin leaves let it through. Thick things block it."},{"t":"num","q":"A school microscope has a 15× eyepiece. With the 40× lens, what is the total magnification?","a":600,"h":"Times the Lenses! Multiply the two numbers.","pic":"🔬","why":"15 × 40 = 600. The cells look 600 times bigger."},{"t":"type","q":"Review: with his telescope, Galileo saw 4 tiny moons circling the planet ____.","a":"Jupiter","alt":["jupiter","planet Jupiter"],"kb":"abc","h":"Think back to Telescopes and Lenses.","pic":"🔬","why":"Jupiter! A telescope uses lenses for things far away. A microscope uses lenses for things tiny and close."},{"t":"spotall","q":"Review: in Ezra’s pond-water slide, tap every living thing that is just ONE cell.","cells":[{"label":"an amoeba","ok":true},{"label":"a paramecium","ok":true},{"label":"a bacterium","ok":true},{"label":"a water snail","ok":false},{"label":"a tadpole","ok":false}],"h":"Think back to Built from Cells.","pic":"🔬","why":"Amoebas, paramecia and bacteria are one cell each. A snail and a tadpole are built from many cells."}],"check":[{"q":"What is the total magnification with a 10× eyepiece and a 4× lens?","o":["40×","14×","4×"],"h":"Times the Lenses! Multiply.","pic":"🔬"},{"t":"spotall","q":"Tap every part of a microscope.","cells":[{"label":"eyepiece","ok":true},{"label":"objective lens","ok":true},{"label":"stage","ok":true},{"label":"focus knob","ok":true},{"label":"thermometer","ok":false},{"label":"magnet","ok":false}],"h":"Picture the tool from top to bottom.","pic":"🔬","chk":true},{"t":"num","q":"A small microscope has a 5× eyepiece and a 40× objective lens. What is the total magnification?","a":200,"h":"Times the Lenses! Multiply the two numbers.","pic":"🔬"}],"re":[{"t":"sort","q":"Game: low power, or high power?","bins":[{"id":"L","label":"low power"},{"id":"H","label":"high power"}],"items":[{"label":"a wide view","bin":"L"},{"label":"easy to find the sample","bin":"L"},{"label":"use the big knob","bin":"L"},{"label":"a close-up of one cell","bin":"H"},{"label":"only a tiny spot shows","bin":"H"},{"label":"use only the small knob","bin":"H"}],"h":"Which one shows more of the slide?","pic":"🔬"},{"t":"spotall","q":"Simpler: tap every thing that makes a picture look bigger.","cells":[{"label":"an eyepiece","ok":true},{"label":"an objective lens","ok":true},{"label":"a magnifying glass","ok":true},{"label":"a flat mirror","ok":false},{"label":"a glass slide","ok":false}],"h":"Which ones are curved glass?","pic":"🔬"},{"t":"pairs","q":"Back to basics: match each lens tool to what it helps us see.","pairs":[["telescope","far-away stars"],["microscope","tiny cells"],["magnifying glass","a bug on a leaf"]],"h":"Think back to Telescopes and Lenses.","pic":"🔬"}]},"SCI.PLANT.L08.03":{"name":"Plant Cell or Animal Cell?","band":"5-6","teach":[{"how":"Step 1. Every cell has three basic parts: a cell membrane around the outside, jelly-like cytoplasm inside, and a nucleus, which holds the cell’s instructions.","q":"Plant cells and animal cells both have a thin outer layer that lets things in and out. What is it called?","o":["the cell membrane","the stiff cell wall","a green chloroplast"],"h":"It is thin and bendy.","pic":"🔬","why":"The membrane is thin and bendy, like a sandwich bag. It lets food and water in and sends waste out."},{"how":"Step 2. Plant cells have three extras. Box: a stiff cell wall outside the membrane. Green: chloroplasts that make food from sunlight. Tank: one big vacuole full of water.","q":"Which part do plant cells have, but animal cells do not?","o":["a stiff cell wall","a nucleus","some cytoplasm jelly"],"h":"Why is celery so crunchy?","pic":"🔬","why":"Cell walls are why celery crunches, and why a tall tree can stand without any bones."},{"how":"Step 3. Animal cells have a membrane, cytoplasm and a nucleus, but no cell wall and no chloroplasts. Without a wall, they are often round or uneven.","q":"An animal cell has no stiff wall. What shape is it usually?","o":["round or uneven","a neat box shape","a long green tube"],"h":"Without a wall, what keeps a cell boxy?","pic":"🔬","why":"Animals eat their food, so their cells do not need chloroplasts to make it."}],"we":[{"q":"Rivka looks at a cell with green dots and a stiff, boxy edge. Plant or animal?","o":["a plant cell","an animal cell"],"steps":["Box, Green, Tank!","Box: a stiff edge. Green: the dots.","So the cell comes from…"],"pic":"🔬"},{"q":"Yehoshua’s celery went droopy on the counter. Which part of its cells lost water?","o":["the big vacuole","the nucleus"],"steps":["The vacuole is the cell’s water tank.","A full tank pushes out on the wall.","When it empties, the stalk droops. So…"],"pic":"🔬"}],"practice":[{"t":"sort","q":"Sort them: only in plant cells, or in both kinds?","bins":[{"id":"P","label":"only plant cells"},{"id":"B","label":"both plant and animal"}],"items":[{"label":"a cell wall","bin":"P"},{"label":"chloroplasts","bin":"P"},{"label":"one big vacuole","bin":"P"},{"label":"a nucleus","bin":"B"},{"label":"a cell membrane","bin":"B"},{"label":"cytoplasm","bin":"B"}],"h":"Box, Green, Tank! Which three are the extras?","pic":"🔬","why":"The three extras of a plant cell are the wall, the chloroplasts and the big vacuole. Every cell has a nucleus, a membrane and cytoplasm."},{"t":"pairs","q":"Match each plant-cell extra to what it is like.","pairs":[["cell wall","a strong cardboard box"],["chloroplast","a tiny solar kitchen"],["vacuole","a water tank"]],"h":"Box, Green, Tank! Ask what each one does.","pic":"🔬","why":"The wall holds the shape, chloroplasts make food from light, and the vacuole stores water."},{"t":"spotall","q":"Tap every clue that a cell comes from a PLANT.","cells":[{"label":"it has a stiff wall","ok":true},{"label":"it has green chloroplasts","ok":true},{"label":"it has one big vacuole","ok":true},{"label":"it has a nucleus","ok":false},{"label":"it is round, with no wall","ok":false}],"h":"Box, Green, Tank! Which clues are the extras?","pic":"🔬","why":"A wall, chloroplasts and a big vacuole belong to plants. A nucleus is in both kinds, and a round cell with no wall is an animal cell."},{"t":"num","q":"Rivka counted 9 chloroplasts in one leaf cell. About how many in 6 cells like it?","a":54,"h":"Multiply 9 by 6.","pic":"🔬","why":"9 × 6 = 54 chloroplasts, all busy making food."},{"t":"order","q":"Review: put the steps for a new slide in order.","tiles":["lay the slide on the stage","click the 4× lens into place","turn the big knob until it is clear","switch to 40× and use the small knob"],"h":"Think back to Using the Microscope.","pic":"🔬","why":"Always low power first, then high power with the small knob."},{"t":"type","q":"Review: making food from sunlight, water and carbon dioxide is called ____.","a":"photosynthesis","alt":["photo synthesis"],"kb":"abc","h":"Think back to How Plants Build Themselves.","pic":"🔬","why":"Photosynthesis! And now you know WHERE it happens: inside the chloroplasts."}],"check":[{"q":"Which part makes food inside a leaf cell?","o":["the chloroplasts","the stiff cell wall","the vacuole"],"h":"Which part is green?","pic":"🔬"},{"t":"order","q":"Put the droopy-celery fix in order.","tiles":["the stalk sits in cold water","water moves into the cells","each vacuole fills up","the stalk stands crisp again"],"h":"Start with what Tante Raizel did.","pic":"🔬"},{"t":"sort","q":"Sort the cell sketches: plant cell, or animal cell?","bins":[{"id":"P","label":"plant cell"},{"id":"A","label":"animal cell"}],"items":[{"label":"boxy, with green dots","bin":"P"},{"label":"a stiff wall and a big tank","bin":"P"},{"label":"a leaf cell full of green","bin":"P"},{"label":"round, with no wall","bin":"A"},{"label":"no chloroplasts and no wall","bin":"A"},{"label":"a cell from a frog","bin":"A"}],"h":"Box, Green, Tank!","pic":"🔬","chk":true}],"re":[{"t":"pairs","q":"Game: match each cell part to where you find it.","pairs":[["cell membrane","around the outside of every cell"],["nucleus","near the middle, holding the instructions"],["cytoplasm","the jelly that fills the cell"]],"h":"Start with the outside.","pic":"🔬"},{"t":"sort","q":"Simpler: does it have a cell wall?","bins":[{"id":"Y","label":"has a cell wall"},{"id":"N","label":"no cell wall"}],"items":[{"label":"an oak leaf cell","bin":"Y"},{"label":"an onion skin cell","bin":"Y"},{"label":"a grass cell","bin":"Y"},{"label":"a frog cell","bin":"N"},{"label":"a fish cell","bin":"N"},{"label":"a bird cell","bin":"N"}],"h":"Is it from a plant, or an animal?","pic":"🔬"},{"t":"spotall","q":"Back to basics: tap every thing a plant uses to make its food.","cells":[{"label":"sunlight","ok":true},{"label":"water","ok":true},{"label":"carbon dioxide from the air","ok":true},{"label":"soil eaten by the roots","ok":false},{"label":"milk","ok":false}],"h":"Think back to How Plants Build Themselves.","pic":"🔬"}]},"SCI.PLANT.L08.04":{"name":"Cell Parts at Work","band":"5-6","teach":[{"how":"Step 1. Think of a cell as a busy city. The nucleus is the city office. It holds the instructions for everything the cell does and makes.","q":"Which cell part is the control center that holds the cell’s instructions?","o":["the nucleus","the vacuole","the cytoplasm"],"h":"It is often near the middle of the cell.","pic":"🔬","why":"Before a cell splits in two, it copies its instructions, so each new cell gets a full set."},{"how":"Step 2. Mitochondria are the power plants. They release the energy stored in food, so the cell can do its work. Plant AND animal cells both have them.","q":"Which part releases energy from food, like a power plant?","o":["the mitochondria","the cell membrane","the nucleus"],"h":"Picture a tiny, bean-shaped power plant.","pic":"🔬","why":"Plants make food in their chloroplasts, and then they still need mitochondria to use that food."},{"how":"Step 3. The cell membrane is the gate. It lets food, water and air in and sends waste out. The cytoplasm is the jelly where the work happens. The vacuole stores water.","q":"Which part is the gate that decides what goes in and out of the cell?","o":["the cell membrane","the strong cell wall","the nucleus"],"h":"It is thin and bendy.","pic":"🔬","why":"A plant cell’s wall is a strong fence outside the gate. It holds the shape, but the membrane does the choosing."}],"we":[{"q":"Bentzion’s cell model needs a power plant. Which part should he label?","o":["the mitochondria","the vacuole"],"steps":["Give It a Job!","Which part releases energy from food?","So the power plant is…"],"pic":"🔬"},{"q":"Leah asks: which part makes the food in a leaf cell?","o":["the chloroplasts","the nucleus"],"steps":["Give It a Job!","Food from sunlight is made in the green parts.","So the solar kitchen is…"],"pic":"🔬"}],"practice":[{"t":"pairs","q":"Match each cell part to its city job.","pairs":[["nucleus","the city office"],["mitochondria","the power plant"],["cell membrane","the gate with a guard"]],"h":"Give It a Job! Ask what each part does all day.","pic":"🔬","why":"The nucleus holds the instructions, the mitochondria release energy, and the membrane guards the gate."},{"t":"sort","q":"Sort the jobs: nucleus, or mitochondria?","bins":[{"id":"N","label":"nucleus"},{"id":"M","label":"mitochondria"}],"items":[{"label":"holds the instructions","bin":"N"},{"label":"tells the cell when to split","bin":"N"},{"label":"copies its instructions before a split","bin":"N"},{"label":"releases energy from food","bin":"M"},{"label":"works hardest in a busy muscle cell","bin":"M"},{"label":"powers the cell’s work","bin":"M"}],"h":"Give It a Job! Office work, or power work?","pic":"🔬","why":"The nucleus is the office: instructions and splitting. Mitochondria are the power plants: energy for work."},{"t":"spotall","q":"Tap every job the cell membrane does.","cells":[{"label":"lets water in","ok":true},{"label":"lets food in","ok":true},{"label":"sends waste out","ok":true},{"label":"makes food from sunlight","ok":false},{"label":"stores the instructions","ok":false}],"h":"Give It a Job! Think of the gate with a guard.","pic":"🔬","why":"The membrane is the gate: water and food in, waste out. Food-making is the chloroplast’s job, and the instructions stay in the nucleus."},{"t":"num","q":"Bentzion’s cell model has 1 nucleus, 3 mitochondria and 12 chloroplasts. How many parts is that in all?","a":16,"h":"Add all three numbers.","pic":"🔬","why":"1 + 3 + 12 = 16 parts."},{"t":"type","q":"Review: the stiff box around a plant cell, outside the membrane, is the cell ____.","a":"wall","alt":["cell wall","a wall"],"kb":"abc","h":"Think back to Plant Cell or Animal Cell?","pic":"🔬","why":"The cell wall! It holds a plant cell’s shape. Animal cells have none."},{"t":"num","q":"Review: a cell splits into 2, and every new cell keeps splitting, 4 times in all. How many cells are there now?","a":16,"h":"Think back to Built from Cells. Keep doubling.","pic":"🔬","why":"1 → 2 → 4 → 8 → 16. Four splits make 16 cells."}],"check":[{"q":"A cell’s mitochondria stop working. What happens?","o":["it runs out of energy","it suddenly turns bright green","it grows a stiff new wall"],"h":"What job do they do?","pic":"🔬"},{"t":"order","q":"Follow a bit of sugar through a cell. Put the steps in order.","tiles":["it passes the cell membrane","it floats in the cytoplasm","a mitochondrion releases its energy","the cell uses the energy to work"],"h":"Start at the gate.","pic":"🔬"},{"t":"num","q":"Leah’s cell model shows 12 chloroplasts and 3 mitochondria. How many more chloroplasts than mitochondria?","a":9,"h":"Take the smaller number from the bigger one.","pic":"🔬"}],"re":[{"t":"pairs","q":"Game: match each part to its everyday look-alike.","pairs":[["cell wall","a strong fence"],["chloroplast","a solar panel"],["cytoplasm","a bowl of clear jelly"]],"h":"Which one is green?","pic":"🔬"},{"t":"sort","q":"Simpler: an outside part, or an inside part?","bins":[{"id":"O","label":"on the outside"},{"id":"I","label":"inside"}],"items":[{"label":"cell wall","bin":"O"},{"label":"cell membrane","bin":"O"},{"label":"nucleus","bin":"I"},{"label":"mitochondria","bin":"I"},{"label":"vacuole","bin":"I"},{"label":"chloroplasts","bin":"I"}],"h":"Which parts make the edge?","pic":"🔬"},{"t":"spotall","q":"Back to basics: tap every part that BOTH plant and animal cells have.","cells":[{"label":"a nucleus","ok":true},{"label":"a cell membrane","ok":true},{"label":"cytoplasm","ok":true},{"label":"mitochondria","ok":true},{"label":"a cell wall","ok":false},{"label":"chloroplasts","ok":false}],"h":"Think back to Plant Cell or Animal Cell?","pic":"🔬"}]}};
 var PAGE={"SCI.PLANT.L08.01":{"big":"A blade of grass, a goldfish and a giant oak tree look nothing alike. What are they all built from?","intro":"Every living thing is built from cells. A cell is the smallest part that is alive by itself. Some living things are just one cell, like a bacterium or an amoeba. Others, like a tree or a fish, are built from many cells that work together, each kind with its own job. New cells come only from cells that split in two.","words":[["cell","The smallest part of a living thing that is alive by itself.","i_cell"],["one-celled","A whole living thing that is just one cell.","i_one"],["many-celled","A living thing built from many cells working together.","i_many"]],"dyk":"Some cells are big: the yolk of a chicken egg is one single cell! But most cells are so small that hundreds of them could fit across the dot over this letter i.","story":{"title":"The Little Rooms in the Cork","text":"After Havdalah, Zaidy Moshe brought his old brass microscope down from the shelf. Hillel and his sister Tova had saved the cork from the Shabbos wine bottle. Zaidy carefully shaved off a slice so thin they could almost see through it, and laid it on a glass slide. Hillel put his eye to the eyepiece and turned the knob."},"predict":{"q":"What will Hillel see in the thin slice of cork?","o":["rows of tiny empty boxes","a smooth, solid gray sheet","tiny bugs moving around"],"reveal":"Rows of tiny empty boxes! “In the year 1665, a scientist named Robert Hooke saw just this,” said Zaidy Moshe. “The boxes looked like little rooms, so he called them cells.” Tova took a turn. “They are empty now,” Zaidy explained, “only the walls are left. But once, every one of them was a living cell in the bark of a tree.”"},"checks":[{"q":"Who first named cells, after looking at cork?","o":["Robert Hooke","Galileo","Isaac Newton"],"h":"Think back to Zaidy Moshe’s story."}],"nif":{"text":"Every living thing, from a single yeast cell to a giant whale, is built from cells, and each one is busy and full of order. Hashem’s wisdom is hidden even in the smallest places."}},"SCI.PLANT.L08.02":{"big":"An onion skin looks plain and see-through. How can it turn into rows of tiny bricks?","intro":"A microscope uses lenses to make tiny things look big. You look into the eyepiece at the top. The objective lens sits just above the slide, which lies on the stage over a light. Total magnification = eyepiece × objective, so a 10× eyepiece with a 40× lens shows 400×. Always start on low power, then switch up and use the small knob.","words":[["eyepiece","The lens at the top of a microscope that you look into.","i_eye"],["objective lens","The lens just above the slide. You can switch between a few of them.","i_obj"],["magnification","How many times bigger something looks.","i_mag"]],"dyk":"The best school microscopes make things look about 1,000 times bigger. To see much smaller things, scientists use electron microscopes, which can make things look hundreds of thousands of times bigger.","story":{"title":"The Blurry Science Fair","text":"Ezra and his friend Ovadia were getting ready for the science fair. Ovadia’s Savta Miriam lent them her microscope, and Ezra peeled a thin skin from an onion that Ima was cutting for the Shabbos soup. They laid it on a slide, clicked straight to the strongest lens, and looked. All they saw was a gray blur. “Maybe onions have no cells,” said Ovadia."},"predict":{"q":"What should the boys do to see the onion cells?","o":["start again on low power","add a much thicker piece of onion","turn the light all the way off"],"reveal":"Start again on low power! Savta Miriam added one drop of iodine stain, then showed them: low power, big knob, center the cells, then click to 40× and use only the small knob. Rows of brick-shaped cells popped into view, each with a dark dot: the nucleus. Ovadia laughed. “The onion was there all along. We were just zoomed in on nothing!”"},"checks":[{"q":"A 10× eyepiece and a 40× lens. What is the total magnification?","o":["400×","50×","4,000×"],"h":"Times the Lenses!"}],"nif":{"text":"A thin onion skin looks plain, yet under the lens it is rows of neat little cells. The more closely we look at Hashem’s world, the more wonders we find."}},"SCI.PLANT.L08.03":{"big":"A leaf cell and a frog cell sit side by side under a microscope. How can you tell which is which?","intro":"Every cell has a cell membrane around it, jelly-like cytoplasm inside, and a nucleus that holds its instructions. Plant cells have three extras. Box: a stiff cell wall. Green: chloroplasts that make food from sunlight. Tank: one big vacuole full of water. Animal cells have none of the three, so they are often round or uneven.","words":[["cell wall","A stiff layer outside the membrane of a plant cell.","i_wall"],["chloroplast","A green part of a plant cell that makes food from sunlight.","i_chloro"],["vacuole","A storage tank in a cell. In plant cells it is big and full of water.","i_vac"]],"dyk":"The stiff walls of plant cells are made of cellulose, the strongest building stuff in the plant world. Paper and cotton are made mostly of cellulose.","story":{"title":"The Droopy Celery","text":"On Friday morning, Yehoshua and his sister Rivka were helping Tante Raizel make the Shabbos salad. A bunch of celery had been left on the counter all night, and the stalks flopped over like wet noodles. “Into the trash?” asked Yehoshua. Tante Raizel smiled, trimmed the ends, and stood the stalks in a jar of cold water."},"predict":{"q":"What will the celery look like after a few hours in the water?","o":["crisp and standing up again","even floppier and softer than before","covered in green slime"],"reveal":"Crisp again! Water moved into the celery’s cells and filled each big vacuole, like filling a water balloon inside a box. The full tanks pushed out on the stiff walls, and the stalks stood tall. Rivka crunched a piece. “Box and Tank, working together!”"},"checks":[{"q":"Which part do animal cells NOT have?","o":["a cell wall","a nucleus","a cell membrane"],"h":"Box, Green, Tank!"}],"nif":{"text":"A wilted plant drinks, and in a few hours every tiny tank fills and the stalk stands tall again. Hashem built even a stalk of celery with care."}},"SCI.PLANT.L08.04":{"big":"A single cell is busier than a whole city. Who runs it, who powers it, and who guards the gate?","intro":"Each part of a cell has a job. The nucleus is the office that holds the instructions. Mitochondria are the power plants that release energy from food. The cell membrane is the gate. The cytoplasm is the jelly where the work happens. In plant cells, chloroplasts make food, the vacuole stores water, and the wall holds the shape.","words":[["nucleus","The control center that holds the cell’s instructions.","i_nuc"],["mitochondria","The power plants that release energy from food.","i_mito"],["cytoplasm","The jelly that fills the cell, where the work happens.","i_cyto"]],"dyk":"A busy muscle cell can have thousands of mitochondria, because moving takes a lot of energy.","story":{"title":"The Shoebox City","text":"For the school science night, Bentzion and his cousin Leah built a plant cell with Feter Chaim. A shoebox was the wall, clear plastic wrap was the membrane, and a big plum was the nucleus. Green peas became chloroplasts, a water balloon was the vacuole, and a handful of beans were the mitochondria. Feter Chaim tapped the beans."},"predict":{"q":"“If these beans stopped working in a real cell,” asked Feter Chaim, “what would happen?”","o":["the cell would run out of energy","the whole cell would turn bright blue","nothing at all would change"],"reveal":"It would run out of energy! The beans stand for mitochondria, the power plants. Without them, the food in the cell is stuck and no work gets done. Leah wrote a sign for the box: “Every part has a job. Every job matters.” Bentzion added a smaller sign: “Even the jelly!”"},"checks":[{"q":"Which part is the gate of the cell?","o":["the cell membrane","the big vacuole tank","the nucleus"],"h":"Give It a Job!"}],"nif":{"text":"Inside every cell, many parts work together, each at its own job, and the cell lives. Hashem made the world so that small parts, working together, do great things."}}};
 var TEACH={"SCI.PLANT.L08.01":{"theme":"lab","hook":"Everything alive, from a blade of grass to a whale, is built from the same tiny thing. What is it?","big":"Every living thing is made of cells. Some are one cell; most are many. New cells come from cells that split.","remember":"Living things grow, need food and make more living things.","intro":["Step 1: a cell is the smallest part that is alive by itself.","Step 2: some living things are one cell; others are many cells.","Step 3: in a many-celled living thing, each kind of cell has a job.","Step 4: new cells come only from cells that split in two."],"ex":[{"q":"A paramecium is a whole living thing in one cell. One-celled or many-celled?","steps":["Zoom to the Smallest!","The whole living thing is one cell.","One cell, one living thing."],"a":"one-celled"},{"q":"2 cells each split, then split again. How many now?","steps":["Zoom to the Smallest!","First split: 2 become 4.","Second split: 4 become 8."],"a":"8 cells"}],"oops":{"q":"Is an atom the smallest living thing?","wrong":"Yes, atoms are alive.","right":"No, a cell is the smallest living thing.","why":"Atoms are smaller, but they are not alive. A cell is the smallest thing that is alive by itself."},"idea":["Zoom to the Smallest! Keep zooming in until you reach the smallest part that is still alive.","Split, split, split: 1, 2, 4, 8, 16."],"try":{"q":"A bacterium splits 3 times. How many cells are there?","o":["8","6","3"],"a":"8","steps":["1 → 2 → 4…","One more split makes…"]},"joke":"Why did the cell cross the microscope? To get to the other slide!"},"SCI.PLANT.L08.02":{"theme":"lab","hook":"An onion skin looks plain. Under a microscope it turns into rows of tiny bricks. How?","big":"Know the parts. Total magnification = eyepiece × objective. Start low, then go high.","remember":"A lens is curved glass that bends light.","intro":["Step 1: look through the eyepiece; the slide sits on the stage.","Step 2: the objective lens is just above the slide.","Step 3: total magnification = eyepiece × objective.","Step 4: start on low power, then switch up and use the small knob."],"ex":[{"q":"10× eyepiece, 4× objective. What is the total?","steps":["Times the Lenses!","Multiply 10 × 4.","The picture is 40 times bigger."],"a":"40×"},{"q":"Only a blur on 40×. What first?","steps":["Low power shows a wide view.","Find and center the sample there.","Then switch up."],"a":"go back to low power"}],"oops":{"q":"Is a 10× eyepiece with a 40× lens the same as 50×?","wrong":"Yes, add them: 50×.","right":"No, multiply them: 400×.","why":"The eyepiece makes the objective’s picture bigger again, so the two multiply."},"idea":["Times the Lenses! Eyepiece times objective.","Low power and the big knob first. High power and the small knob last."],"try":{"q":"A 5× eyepiece and a 10× objective. What is the total?","o":["50×","15×","510×"],"a":"50×","steps":["Times the Lenses!","5 × 10 makes…"]},"joke":"What did the onion cell say under the microscope? “Stop staring, you are making me tear up!”"},"SCI.PLANT.L08.03":{"theme":"lab","hook":"A leaf cell and a frog cell sit side by side. How can you tell which is which?","big":"Both have a membrane, cytoplasm and a nucleus. Plants add a wall, chloroplasts and a big vacuole.","remember":"Total magnification = eyepiece × objective.","intro":["Step 1: every cell has a membrane, cytoplasm and a nucleus.","Step 2: Box: plant cells have a stiff cell wall.","Step 3: Green: plant cells have chloroplasts.","Step 4: Tank: plant cells have one big vacuole."],"ex":[{"q":"A boxy cell with a big clear tank. Plant or animal?","steps":["Box, Green, Tank!","Boxy edge: a wall.","Big clear tank: a vacuole."],"a":"plant"},{"q":"A round cell with no wall and no green. Plant or animal?","steps":["Box, Green, Tank!","No box, no green, no tank.","Round and soft."],"a":"animal"}],"oops":{"q":"Do all plant cells have chloroplasts?","wrong":"Yes, every plant cell is green.","right":"No, only cells that get light do.","why":"Root cells and onion bulb cells grow in the dark, so they have no chloroplasts. They still have a wall."},"idea":["Box, Green, Tank! The three plant extras.","Animal cells: no box, no green, no big tank."],"try":{"q":"A cell has a stiff wall but no green. Plant or animal?","o":["plant","animal","neither"],"a":"plant","steps":["Box, Green, Tank!","A wall is a plant extra, so…"]},"joke":"Why did the plant cell never get lost? It always stayed inside its walls!"},"SCI.PLANT.L08.04":{"theme":"lab","hook":"A tiny cell is busier than a whole city. Who runs it?","big":"Each part has a job: office, power plant, gate, kitchen, tank and fence.","remember":"Plant cells have a wall, chloroplasts and a big vacuole.","intro":["Step 1: the nucleus is the office with the instructions.","Step 2: mitochondria are the power plants.","Step 3: the membrane is the gate; the cytoplasm is the jelly where work happens.","Step 4: in plants, chloroplasts make food, the vacuole stores water, the wall holds the shape."],"ex":[{"q":"Which part stores water?","steps":["Give It a Job!","Storing water is a tank’s job.","The tank is the vacuole."],"a":"the vacuole"},{"q":"Which part lets food in?","steps":["Give It a Job!","Letting things in is a gate’s job.","The gate is the membrane."],"a":"the cell membrane"}],"oops":{"q":"Do plant cells skip mitochondria because they have chloroplasts?","wrong":"Yes, plants need only chloroplasts.","right":"No, plants have both.","why":"Chloroplasts make the food; mitochondria release its energy. A plant needs both jobs done."},"idea":["Give It a Job! Name each part by the job it does.","Office, power plant, gate, kitchen, tank, fence."],"try":{"q":"Which part holds the instructions?","o":["the nucleus","the vacuole","the cell wall"],"a":"the nucleus","steps":["Give It a Job!","The office keeps the instructions, so…"]},"joke":"Why did the mitochondria win an award? They were the most powerful workers in the cell!"}};
 var LABI={"SCI.PLANT.L08.01":{"kind":"grow","title":"Split and Count","goal":"Make a guess: how many cells after the splits? Then tap Split! and watch every cell double.","rounds":[[1,3,[6,8,9]],[3,2,[9,6,12]],[1,5,[32,10,25]]]},"SCI.PLANT.L08.02":{"kind":"focus","title":"Focus the Slide","goal":"The eyepiece is 10×. Pick the lens that gives the total you need, then turn the knobs until the picture is sharp.","eye":10,"lenses":[4,10,40],"sharp":5,"tasks":[["onion","Show the onion cells at 40× total.",4,1],["onion","Now show the same cells at 400× total.",40,8],["pond","Show the pond-water slide at 100× total.",10,2]]},"SCI.PLANT.L08.03":{"kind":"find","title":"Mystery Slides","goal":"Tap every part you can find in the drawing. Then decide: plant cell, or animal cell?","names":{"wall":"cell wall","green":"chloroplasts","tank":"big vacuole","nuc":"nucleus","mem":"cell membrane"},"slides":[["onion","Slide 1: thin skin from an onion bulb","P",["wall","tank","nuc"],"Onion bulbs grow underground in the dark, so these cells have no chloroplasts. The stiff walls still show it: a plant!"],["leaf","Slide 2: a leaf from a pond plant","P",["wall","green","tank","nuc"],"Walls, green chloroplasts and big tanks. Box, Green, Tank! A plant."],["frog","Slide 3: cells from a frog","A",["mem","nuc"],"No wall, no green, no big tank. Round, soft cells: an animal."]]},"SCI.PLANT.L08.04":{"kind":"strike","title":"Cell City on Strike","goal":"One part of the cell stops working. What goes wrong? Choose, then see.","cards":[["mito","The mitochondria are closed today.",[["the cell loses its shape",0],["the cell runs out of energy",1],["the cell turns blue",0]],"No power plant, no energy: the cell’s work stops."],["mem","The gate is stuck shut: the membrane lets nothing through.",[["no food or water can get in",1],["the cell makes extra food",0],["the cell grows a second wall",0]],"A shut gate means no food and no water. The cell cannot last long."],["chloro","The leaf is kept in the dark all week.",[["the cell loses its instructions",0],["the cell splits faster",0],["no new food is made",1]],"Chloroplasts need light to make food. In the dark, no new food is made."],["nuc","The office is closed: the nucleus stops working.",[["the cell gets more energy",0],["the cell cannot make new parts or split",1],["the vacuole turns green",0]],"Without its instructions, the cell cannot build new parts or split."]]}};
 var PIC={"SCI.PLANT.L08.01|Every living thing is built from tiny living units. What are they called?":"building","SCI.PLANT.L08.01|Some living things are just one single cell. Which of these is only one cell?":"onemany","SCI.PLANT.L08.01|Where do new cells come from?":"divide","SCI.PLANT.L08.01|Hillel looked at a thin slice of cork under Zaidy Moshe’s microscope. He saw rows of tiny boxes. What were they?":"cork","SCI.PLANT.L08.01|One bacterium splits in two every 20 minutes. How many are there after 40 minutes?":"split","SCI.PLANT.L08.01|Sort them: one cell, or many cells?":"sortone","SCI.PLANT.L08.01|Match each cell word to its meaning.":"words3","SCI.PLANT.L08.01|Tap every true thing about cells.":"lens","SCI.PLANT.L08.01|A yeast cell splits into 2. Then each new cell splits, and then each splits once more. How many cells after 3 splits?":"yeast","SCI.PLANT.L08.01|Review: the tiny openings on the underside of a leaf are called ____.":"stoma","SCI.PLANT.L08.01|Review: a pond has algae, duckweed, a frog and a fish. How many of them are producers that make their own food?":"pond","SCI.PLANT.L08.01|What is the smallest part of a living thing that is alive by itself?":"building","SCI.PLANT.L08.01|Put these four in size order, starting with the tiniest.":"sizes","SCI.PLANT.L08.01|Robert Hooke first named cells in the year 1665. How many years later came the year 2000?":"hooke","SCI.PLANT.L08.01|Game: match each part to the bigger thing it builds.":"sizes","SCI.PLANT.L08.01|Simpler: alive, or never alive?":"alivenot","SCI.PLANT.L08.01|Back to basics: tap every thing all living things do.":"sprout","SCI.PLANT.L08.02|On a microscope, which part do you look into?":"scope","SCI.PLANT.L08.02|The eyepiece makes things look 10 times bigger. The objective lens makes them 40 times bigger. What is the total magnification?":"mult","SCI.PLANT.L08.02|Which lens should you start with when you look at a new slide?":"lenses3","SCI.PLANT.L08.02|Ezra uses a 10× eyepiece and a 10× object  // ---- Pencil-sketch kit (house style of this unit: PENCIL SKETCH in a LAB NOTEBOOK: cream notebook paper with pale blue rules and a red margin line, a strip of tape,

 // Original SVG, drawn in code. Every drawer: (u, opt) => svg string; u = unique suffix so ids never clash. Cells, tools, plants and kitchen things only:
 // no people, no faces, no body parts. No Hebrew letters.
 var gK='#3A3A3E', gM='#6F6F75', gL='#A7A7AD', cG='#4E8A3A', cB='#3C70A6', cO='#B98428', cR='#B1546A', cV='#775CA3', pP='#FBF7EC', pR='#CFDDEA', pM='#E2A3A3';
 var HC={k:gM,g:cG,b:cB,o:cO,r:cR,v:cV};
 var CF='font-family="\'Patrick Hand\', \'Segoe Print\', \'Bradley Hand\', \'Comic Neue\', \'Comic Sans MS\', \'Trebuchet MS\', sans-serif"';
 function f1(n){ return (+n).toFixed(1); }
 function rn(s){ var x=Math.sin(s*91.345)*47453.5453; return x-Math.floor(x); }
 function ln(c,w){ return ' stroke="'+(c||gK)+'" stroke-width="'+(w||1.8)+'" stroke-linejoin="round" stroke-linecap="round"'; }
 function pats(u,sz){ var s=''; Object.keys(HC).forEach(function(k){ s+='<pattern id="h'+k+u+'" width="'+sz+'" height="'+sz+'" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 V'+sz+'" stroke="'+HC[k]+'" stroke-width="1" opacity=".55"/></pattern>'; });
  return s+'<pattern id="hx'+u+'" width="'+sz+'" height="'+sz+'" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 V'+sz+' M0 0 H'+sz+'" stroke="'+gM+'" stroke-width=".9" opacity=".55"/></pattern>'; }
 function pg(u,label,body,o){ o=o||{}; var w=o.w||240,h=o.h||160, rules='';
  for(var y=24;y<h-4;y+=14) rules+='<path d="M0 '+y+' H'+w+'" stroke="'+pR+'" stroke-width=".7"/>';
  return '<svg class="sciart g7cu-art" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+label+'" xmlns="http://www.w3.org/2000/svg"><defs>'+pats(u,4)+
   '<filter id="pc'+u+'" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.3"/></filter>'+
   '<radialGradient id="pv'+u+'" cx=".5" cy=".45" r=".75"><stop offset=".6" stop-color="'+pP+'"/><stop offset="1" stop-color="#EFE6CF"/></radialGradient></defs>'+
   '<rect width="'+w+'" height="'+h+'" rx="4" fill="url(#pv'+u+')"/>'+rules+'<path d="M18 0 V'+h+'" stroke="'+pM+'" stroke-width=".9"/>'+
   (o.tape===false?'':'<rect x="'+(w-58)+'" y="-4" width="56" height="15" fill="#E9DDB2" opacity=".75" transform="rotate(8 '+(w-30)+' 4)"/>')+
   '<g filter="url(#pc'+u+')" fill="none">'+body.split('#HU#').join(u)+'</g><rect x=".5" y=".5" width="'+(w-1)+'" height="'+(h-1)+'" rx="4" fill="none" stroke="#D9CFB4"/></svg>'; }
 function H(k){ return 'url(#h'+k+'#HU#)'; }
 function sk(d,c,w,fill){ return '<path d="'+d+'" fill="'+(fill||'none')+'"'+ln(c,w)+'/><path d="'+d+'" fill="none"'+ln(c||gK,(w||1.8)*.55)+' opacity=".35" transform="translate(.9 .6)"/>'; }
 function tx(x,y,t,sz,c,anc){ return '<text x="'+x+'" y="'+y+'" '+CF+' font-size="'+(sz||10)+'" fill="'+(c||gK)+'" stroke="none" text-anchor="'+(anc||'middle')+'">'+t+'</text>'; }
