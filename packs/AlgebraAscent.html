['$\\\\varphi(ab) = \\\\varphi(a)\\\\varphi(b)$', 'Kernel is a normal subgroup', '$G/\\\\ker\\\\varphi \\\\cong \\\\text{im}\\\\,\\\\varphi$', '$|G| = |\\\\ker| \\\\cdot |\\\\text{im}|$'] },\n{ id:'MATH.ALG.L16.08', t:'Proof Workshop', g:'proof', peg:{ n:'One Axiom per Line', l:'Write what you assume, then each line uses one definition or axiom, ending with exactly what you want.' },\n  hook:{ q:'In a group, can there be two different identity elements?', o:['No, the identity is unique', 'Yes', 'Only in big groups'], why:'We prove it: if $e$ and $e\\\\prime$ are identities, $e = ee\\\\prime = e\\\\prime$.' },\n  mv:[['College algebra exams ask for proofs. Short ones, built from the axioms.', 'Prove: the identity is unique'], ['Start with what you are given. Suppose e and e prime are both identities.', 'Suppose $e$ and $e\\\\prime$ are identities.'],\n    ['Use each axiom once, in a clear line. e is an identity, so e e prime is e prime.', '$ee\\\\prime = e\\\\prime$'], { p:'And since $e\\\\prime$ is an identity, $ee\\\\prime = ?$', o:['$e$', '$e\\\\prime$', '$e^2$'], fb:'An identity on the right leaves $e$ unchanged.' },\n    ['So e equals e e prime equals e prime. Done. End exactly where you aimed.', '$e = ee\\\\prime = e\\\\prime$'], ['Common trap: groups need not commute. Move parentheses, never swap order.', 'associativity yes, commutativity no']],\n  rt:['Picture it: a proof is a chain where each link is one allowed move. A missing link breaks the chain.', 'Story: Avraham writes his proofs like directions to shul: start here, one turn at a time, arrive exactly at the door.'],\n  sheet:['Assume, then one axiom per line', 'Never swap order in a group (only regroup)', '$(ab)^{-1} = b^{-1}a^{-1}$', 'Show both directions for \"if and only if\"'] },\n\n/* ---------------- L17 Summit Ridge ---------------- */\n{ id:'MATH.ALG.L17.01', t:'Units and Zero Divisors', g:'ring', srt:'ring', peg:{ n:'gcd 1 Means Unit', l:'In $\\\\Z_n$: a is a unit if $\\\\gcd(a, n) = 1$; otherwise (a not 0) it is a zero divisor.' },\n  hook:{ q:'In $\\\\Z_6$, $2 \\\\cdot 3 = ?$', o:['$0$', '$6$', '$5$'], why:'$6 \\\\equiv 0$: two nonzero numbers multiply to 0. Those are zero divisors.' },\n  mv:[['A ring has addition and multiplication, like the integers.', 'rings: $\\\\Z$, $\\\\Z_n$, polynomials, matrices'], ['A unit has a multiplicative inverse.', 'unit: $ab = 1$ for some $b$'],\n    ['A zero divisor is a nonzero element that multiplies with something nonzero to give zero.', 'in $\\\\Z_6$: $2 \\\\cdot 3 = 0$'], { p:'In $\\\\Z_{10}$, is 4 a unit or a zero divisor?', o:['zero divisor ($4 \\\\cdot 5 = 0$)', 'unit', 'neither'], fb:'$\\\\gcd(4, 10) = 2 \\\\ne 1$.' },\n    ['In Z n every nonzero element is one or the other, decided by the gcd.', '$\\\\gcd = 1$: unit. otherwise: zero divisor']],\n  rt:['Picture it: in $\\\\Z_{12}$, multiples of 3 land only on 0, 3, 6, 9; they can never reach 1, so 3 has no inverse.', 'Story: Shira checks each number in $\\\\Z_{15}$ with one question: does it share a factor with 15?'],\n  sheet:['Unit: has an inverse. Zero divisor: $ab = 0$, $a, b \\\\ne 0$', '$\\\\Z_n$: unit iff $\\\\gcd(a, n) = 1$', 'Number of units: $\\\\varphi(n)$'] },\n{ id:'MATH.ALG.L17.02', t:'Fields of Primes', g:'field', peg:{ n:'Prime Means Field', l:'$\\\\Z_p$ for prime p is a field: every nonzero element has an inverse. Divide by multiplying by the inverse.' },\n  hook:{ q:'In $\\\\Z_7$, can you divide by 3?', o:['Yes: multiply by $3^{-1} = 5$', 'No, never', 'Only if the answer is whole'], why:'7 is prime, so every nonzero element has an inverse.' },\n  mv:[['A field is a ring where you can divide by anything except zero.', 'fields: $\\\\Q$, $\\\\R$, $\\\\C$, $\\\\Z_p$'], ['For a prime p, Z p is a field.', '$\\\\Z_p$: every nonzero $a$ has $a^{-1}$'],\n    ['Solve 3x plus 4 equals 2 in Z 7. Subtract 4: 3x equals 5.', '$3x \\\\equiv 5$'], { p:'Multiply by $3^{-1} = 5$: $x = ?$', o:['$4$', '$1$', '$\\\\frac{5}{3}$'], fb:'$5 \\\\cdot 5 = 25 \\\\equiv 4$.' },\n    ['Composite modulus? Not a field: it has zero divisors.', '$\\\\Z_6$ is not a field']],\n  rt:['Picture it: in $\\\\Z_7$, the multiples of 3 visit all 7 residues, so one of them is 1.', 'Story: Rafael solves linear equations in $\\\\Z_{11}$ for a coding-theory class exactly like ordinary algebra, with inverses in place of fractions.'],\n  sheet:['$\\\\Z_n$ is a field iff n is prime', 'Divide = multiply by the inverse', 'Every finite field has $p^k$ elements'] },\n{ id:'MATH.ALG.L17.03', t:'Polynomials over Z_p', g:'pirr', srt:'pirr', peg:{ n:'Test Every Element', l:'Over $\\\\Z_p$, find roots by testing all p elements. Degree 2 or 3 with no roots: irreducible.' },\n  hook:{ q:'Does $x^2 + 1$ have a root in $\\\\Z_5$?', o:['Yes: $x = 2$ and $x = 3$', 'No', 'Only $x = 1$'], why:'$2^2 + 1 = 5 \\\\equiv 0$ and $3^2 + 1 = 10 \\\\equiv 0$.' },\n  mv:[['Over Z p there are only p numbers. So find roots by testing them all.', 'test $0, 1, \\\\ldots, p - 1$'], ['x squared plus 1 over Z 3: 0 gives 1, 1 gives 2, 2 gives 5 which is 2. No roots.', '$x^2 + 1$ over $\\\\Z_3$: no roots'],\n    ['A quadratic or cubic with no roots cannot factor. It is irreducible.', 'degree 2 or 3, no roots: irreducible'], { p:'So $\\\\Z_3[x]/(x^2 + 1)$ is...', o:['a field with 9 elements', 'not a ring', 'a field with 3 elements'], fb:'Irreducible of degree 2 over $\\\\Z_3$: a field with $3^2 = 9$ elements.' },\n    ['Careful: degree 4 can factor into two quadratics with no roots at all.', 'degree 4: no roots is not enough']],\n  rt:['Picture it: make a table of $f(0), f(1), \\\\ldots$ mod p. Roots are where the table shows 0.', 'Story: Netanel builds a 9-element field for a cryptography project from an irreducible quadratic over $\\\\Z_3$.'],\n  sheet:['Roots: test all elements of $\\\\Z_p$', 'deg 2 or 3 with no roots: irreducible', '$\\\\Z_p[x]/(f)$ irreducible deg n: field of $p^n$ elements'] },\n{ id:'MATH.ALG.L17.04', t:'Ideals and Quotients', g:'ideal', srt:'ideal', peg:{ n:'Maximal Gives a Field', l:'$R/I$ is a field iff I is maximal; an integral domain iff I is prime. In $\\\\Z$, $(a, b) = (\\\\gcd(a, b))$.' },\n  hook:{ q:'All multiples of 6 together form an ideal $6\\\\Z$. Is 6 + 6 still in it?', o:['Yes', 'No', 'Only sometimes'], why:'Ideals are closed under addition and under multiplying by anything in the ring.' },\n  mv:[['An ideal is a subset you can quotient by: closed under adding, and swallowing multiplication.', '$I$: $a + b \\\\in I$, $ra \\\\in I$'], ['Z mod n Z is Z with all multiples of n squashed to 0.', '$\\\\Z/n\\\\Z = \\\\Z_n$'],\n    ['In Z, every ideal is generated by one number: the ideal of a and b is generated by their gcd.', '$(12, 18) = (6)$'], { p:'$\\\\Z/7\\\\Z$ is a field. So $(7)$ is...', o:['maximal', 'not prime', 'the whole ring'], fb:'Quotient is a field exactly when the ideal is maximal.' },\n    ['Prime ideals give integral domains. Maximal ideals give fields.', 'prime: domain. maximal: field']],\n  rt:['Picture it: the quotient ring treats everything in I as 0, the way a clock treats 12 as 0.', 'Story: Akiva tests an ideal by building the quotient and asking: does it have zero divisors? Can I divide?'],\n  sheet:['$R/I$ field $\\\\iff$ I maximal', '$R/I$ domain $\\\\iff$ I prime', '$\\\\Z$: $(a, b) = (\\\\gcd)$, maximal ideals $(p)$', '$|\\\\Z_p[x]/(f)| = p^{\\\\deg f}$'] },\n{ id:'MATH.ALG.L17.05', t:'Field Extensions', g:'ext', peg:{ n:'Degrees Multiply', l:'$[\\\\Q(\\\\alpha) : \\\\Q]$ = degree of the minimal polynomial of $\\\\alpha$. Towers: $[L : K][K : F] = [L : F]$.' },\n  hook:{ q:'What is the smallest-degree polynomial with rational coefficients that has $\\\\sqrt{2}$ as a root?', o:['$x^2 - 2$', '$x - \\\\sqrt{2}$', '$x^4 - 4$'], why:'$x - \\\\sqrt{2}$ does not have rational coefficients. $x^2 - 2$ is the minimal polynomial.' },\n  mv:[['Adjoin square root of 2 to the rationals. Every element looks like a plus b root 2.', '$\\\\Q(\\\\sqrt{2}) = \\\\{a + b\\\\sqrt{2}\\\\}$'], ['Its degree is 2, the degree of the minimal polynomial x squared minus 2.', '$[\\\\Q(\\\\sqrt{2}) : \\\\Q] = 2$'],\n    ['Towers multiply. Adjoin root 2, then root 3: 2 times 2 is 4.', '$[\\\\Q(\\\\sqrt{2}, \\\\sqrt{3}) : \\\\Q] = 4$'], { p:'$[\\\\Q(\\\\root{3}{2}) : \\\\Q] = ?$', o:['$3$', '$2$', '$6$'], fb:'Minimal polynomial $x^3 - 2$ (Eisenstein), degree 3.' },\n    ['If you adjoin something already there, the degree does not grow.', '$\\\\sqrt{8} = 2\\\\sqrt{2} \\\\in \\\\Q(\\\\sqrt{2})$']],\n  rt:['Picture it: $\\\\Q(\\\\sqrt{2})$ is a 2-dimensional vector space over $\\\\Q$ with basis $1, \\\\sqrt{2}$.', 'Story: Gavriel builds number systems like floors of a building. Each floor\\'s height multiplies the total.'],\n  sheet:['$[\\\\Q(\\\\alpha):\\\\Q] = \\\\deg$ minimal polynomial', 'Tower law: degrees multiply', 'Eisenstein proves irreducibility'] },\n{ id:'MATH.ALG.L17.06', t:'Galois Groups', g:'gal', peg:{ n:'The Group That Shuffles the Roots', l:'The Galois group permutes the roots of a polynomial while respecting algebra. In characteristic 0, its order is the degree of the splitting field.' },\n  hook:{ q:'$x^2 - 2$ has roots $\\\\sqrt{2}$ and $-\\\\sqrt{2}$. Algebraically, can you tell them apart over $\\\\Q$?', o:['No: swapping them is a symmetry', 'Yes, one is positive', 'Only with a calculator'], why:'Over $\\\\Q$, the swap $\\\\sqrt{2} \\\\to -\\\\sqrt{2}$ preserves every rational equation: an automorphism.' },\n  mv:[['Galois theory studies the symmetries of a polynomial\\'s roots.', '$\\\\text{Gal}(L/\\\\Q)$'], ['For x squared minus 2, the only symmetries are: do nothing, or swap the two roots.', '$\\\\text{Gal} \\\\cong \\\\Z_2$'],\n    ['For a splitting field in characteristic 0, the size of the group equals the degree of the extension.', '$|\\\\text{Gal}(L/\\\\Q)| = [L : \\\\Q]$'], { p:'Splitting field of $x^3 - 2$ has degree 6. Its Galois group is...', o:['$S_3$', '$\\\\Z_3$', '$\\\\Z_2$'], fb:'Order 6, permuting 3 roots, not abelian: $S_3$.' },\n    ['Cyclotomic fields: the Galois group of Q zeta n is the unit group of Z n.', '$\\\\text{Gal}(\\\\Q(\\\\zeta_n)/\\\\Q) \\\\cong (\\\\Z/n\\\\Z)^\\\\times$']],\n  rt:['Picture it: the three cube roots of 2 sit at the corners of a triangle in the complex plane; the Galois group acts like all 6 symmetries of the triangle.', 'Story: Yaakov finds that the quintic has no formula because its Galois group, $S_5$, is not solvable. That is the famous payoff.'],\n  sheet:['Gal = automorphisms fixing the base field', 'Char 0, splitting field: $|\\\\text{Gal}| = [L:K]$', '$\\\\text{Gal}(\\\\Q(\\\\zeta_n)/\\\\Q) \\\\cong (\\\\Z/n\\\\Z)^\\\\times$', 'Solvable by radicals $\\\\iff$ Gal solvable'] },\n{ id:'MATH.ALG.L17.07', t:'Sylow', g:'syl', peg:{ n:'One mod p, Divides m', l:'$|G| = p^k m$ with $p \\\\nmid m$: the number of Sylow p-subgroups $n_p$ divides m and $n_p \\\\equiv 1$ (mod p). $n_p = 1$ means normal.' },\n  hook:{ q:'A group has order 15. Must it have a subgroup of order 5?', o:['Yes (Sylow)', 'No', 'Only if cyclic'], why:'Sylow guarantees subgroups of order $p^k$ for the top power of each prime.' },\n  mv:[['Lagrange says subgroup orders divide the group order. Sylow says some must exist.', '$|G| = p^k m \\\\Rightarrow$ a subgroup of order $p^k$ exists'], ['The number of them, n p, divides m and is 1 mod p.', '$n_p \\\\mid m$, $n_p \\\\equiv 1$ (mod p)'],\n    ['Order 15: n 5 divides 3 and is 1 mod 5: only 1. n 3 divides 5 and is 1 mod 3: only 1.', '$n_5 = 1$, $n_3 = 1$'], { p:'Both Sylow subgroups are normal and intersect trivially. So a group of order 15 is...', o:['cyclic, $\\\\Z_{15}$', '$S_3$', 'not determined'], fb:'$G \\\\cong \\\\Z_3 \\\\times \\\\Z_5 \\\\cong \\\\Z_{15}$.' },\n    ['This is how qualifying exams prove that no simple group of a given order exists.', 'no simple group of order pq']],\n  rt:['Picture it: Sylow p-subgroups are the biggest p-chunks inside the group; Sylow counts how many such chunks there can be.', 'Story: Mordechai uses Sylow on a qual problem: order 35, so $n_5 = n_7 = 1$, both normal, and the group is cyclic.'],\n  sheet:['Sylow p-subgroups exist (order $p^k$)', '$n_p \\\\mid m$ and $n_p \\\\equiv 1$ (mod p)', '$n_p = 1 \\\\iff$ normal', 'All Sylow p-subgroups are conjugate'] },\n{ id:'MATH.ALG.L17.08', t:'Finite Abelian Groups', g:'fab', peg:{ n:'Partition Each Exponent', l:'Number of abelian groups of order $n = p_1^{e_1}\\\\cdots$ is the product of partition counts $p(e_1)p(e_2)\\\\cdots$.' },\n  hook:{ q:'How many ways can you write 3 as a sum of positive whole numbers (order does not matter)?', o:['3: 3, 2+1, 1+1+1', '2', '4'], why:'Partitions of 3: three of them.' },\n  mv:[['Every finite abelian group is a product of cyclic groups of prime power order.', '$G \\\\cong \\\\Z_{p^a} \\\\times \\\\Z_{q^b} \\\\times \\\\ldots$'], ['For order 8 equals 2 cubed: the partitions of 3 give Z 8, Z 4 cross Z 2, and Z 2 three times.', '$\\\\Z_8$, $\\\\Z_4 \\\\times \\\\Z_2$, $\\\\Z_2^3$'],\n    ['For several primes, count partitions of each exponent and multiply.', '$72 = 2^3 \\\\cdot 3^2$: $p(3)p(2) = 3 \\\\cdot 2 = 6$'], { p:'How many abelian groups of order $36 = 2^2 3^2$?', o:['$4$', '$2$', '$9$'], fb:'$p(2) \\\\cdot p(2) = 2 \\\\cdot 2 = 4$.' },\n    ['Invariant factor form lists them as Z d 1 cross Z d 2 with each d dividing the next.', '$\\\\Z_6 \\\\times \\\\Z_6$, $\\\\Z_2 \\\\times \\\\Z_{18}$, $\\\\Z_3 \\\\times \\\\Z_{12}$, $\\\\Z_{36}$']],\n  rt:['Picture it: each prime power is a pile of blocks; a partition says how to split that pile into cyclic stacks.', 'Story: Binyamin lists all abelian groups of order 100 in under a minute: $p(2)p(2) = 4$.'],\n  sheet:['$G \\\\cong \\\\prod \\\\Z_{p^a}$ (elementary divisors)', 'Count: $\\\\prod p(e_i)$', 'Invariant factors: $d_1 \\\\mid d_2 \\\\mid \\\\ldots$'] },\n\n/* ---------------- L18 The Summit ---------------- */\n{ id:'MATH.ALG.L18.01', t:'Structure Theorem', g:'struct', srt:'struct', peg:{ n:'gcd Times lcm', l:'$\\\\Z_m \\\\times \\\\Z_n \\\\cong \\\\Z_{\\\\gcd(m, n)} \\\\times \\\\Z_{\\\\text{lcm}(m, n)}$. Cyclic exactly when $\\\\gcd = 1$. Over a PID, f.g. modules split into cyclic pieces.' },\n  hook:{ q:'Is $\\\\Z_2 \\\\times \\\\Z_3$ cyclic?', o:['Yes: it is $\\\\Z_6$', 'No', 'Only as a set'], why:'$(1, 1)$ has order $\\\\text{lcm}(2, 3) = 6$.' },\n  mv:[['A finitely generated module over a PID is a direct sum of cyclic modules.', '$M \\\\cong R^r \\\\oplus R/(d_1) \\\\oplus \\\\ldots \\\\oplus R/(d_k)$'], ['For Z, that is the classification of finitely generated abelian groups.', '$\\\\Z^r \\\\times \\\\Z_{d_1} \\\\times \\\\ldots$'],\n    ['Two cyclic factors merge into gcd and lcm.', '$\\\\Z_m \\\\times \\\\Z_n \\\\cong \\\\Z_{\\\\gcd} \\\\times \\\\Z_{\\\\text{lcm}}$'], { p:'$\\\\Z_4 \\\\times \\\\Z_6$ in invariant factor form?', o:['$\\\\Z_2 \\\\times \\\\Z_{12}$', '$\\\\Z_{24}$', '$\\\\Z_4 \\\\times \\\\Z_6$ only'], fb:'gcd 2, lcm 12.' },\n    ['Same theorem over a polynomial ring gives the rational canonical form of a matrix.', '$k[x]$-modules give canonical forms']],\n  rt:['Picture it: break each factor into prime powers, then regroup the biggest powers into one factor and the rest into another.', 'Story: Ezra recognizes the Jordan form problem on his qual as the structure theorem over $\\\\C[x]$.'],\n  sheet:['$\\\\Z_m \\\\times \\\\Z_n \\\\cong \\\\Z_{\\\\gcd} \\\\times \\\\Z_{\\\\text{lcm}}$', 'Cyclic iff $\\\\gcd(m, n) = 1$', 'PID: $M \\\\cong R^r \\\\oplus \\\\bigoplus R/(d_i)$, $d_1 \\\\mid d_2 \\\\mid \\\\ldots$'] },\n{ id:'MATH.ALG.L18.02', t:'Exact Sequences', g:'exact', peg:{ n:'Image Equals Kernel', l:'Exact at each spot: image of the incoming map = kernel of the outgoing map. In $0 \\\\to A \\\\to B \\\\to C \\\\to 0$, $C \\\\cong B/A$.' },\n  hook:{ q:'In $0 \\\\to A \\\\to B$, exactness at A means the map $A \\\\to B$ is...', o:['one-to-one', 'onto', 'zero'], why:'The image of $0 \\\\to A$ is 0, so the kernel of $A \\\\to B$ is 0: injective.' },\n  mv:[['A sequence of maps is exact
