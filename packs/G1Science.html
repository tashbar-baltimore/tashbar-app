, and shadows are short.'],['🌇','The sun sets in the west, and shadows are long.']],{real:'You are walking to shul in the morning.'}),\nmkS('SCI.SKY.L02.01','The Moon Changes Shape','🌙','the moon through the month','moon','skypat',['🌒🌓🌕','Baruch looks at the moon every night. First it is a thin sliver, then half, then a full circle! Our Jewish months follow the moon.'],\n [['🌒','After Rosh Chodesh, we see a thin crescent.'],['🌓','The moon grows to half.'],['🌕','In the middle of the month, the moon is full. Then it gets smaller again.']],{real:'It is the night of Kiddush Levana.'}),\nmkS('SCI.SKY.L02.02','Stars Without Number','⭐','the sun is a star','stars','moon',['✨👴','Hashem took Avraham Avinu outside and said: look at the stars. Can you count them? So will your children be!'],\n [['⭐','Stars are giant balls of light, very, very far away.'],['☀️','The sun is a star too, the one closest to us.'],['✨','On Motzei Shabbos we look for three stars.']],{real:'It is Motzei Shabbos. Look at the sky.'}),\nmkS('SCI.SKY.L02.03','The Four Seasons','🍂','fall, winter, spring, summer','seasons','stars',['🍂❄️🌸☀️','Every year has four seasons: fall, winter, spring and summer. Each one has its own weather and its own Yomim Tovim!'],\n [['🍂','Fall: leaves fall, and we sit in the sukkah.'],['❄️','Winter: it is cold, and we light the menorah.'],['🌸','Spring: flowers bloom, and Pesach comes.'],['☀️','Summer: it is hot and the days are long.']],{real:'Pack for a trip in each season.'}),\nmkS('SCI.LAND.L02.01','Where Water Is','🌊','oceans, rivers and lakes','water','seasons',['🌊🏞️🚰','Water is everywhere! The ocean is salty. Rivers and lakes are fresh. Most of our earth is covered with water.'],\n [['🌊','Oceans are big and salty.'],['🏞️','Rivers and lakes are usually fresh water.'],['🚰','We drink clean fresh water.']],{real:'You are at the beach with your family.'}),\nmkS('SCI.LAND.L02.02','Clouds and Rain','🌧️','the water cycle','rain','water',['☀️☁️🌧️','A puddle dries up in the sun. Whe
