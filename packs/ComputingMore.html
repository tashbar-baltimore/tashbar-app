    var acc = yw.length ? Math.round(good / yw.length * 100) : 0;
    return { wpm: wpm, acc: acc, words: yw.length, good: good };
  }
  function paint() {
    var tw = st.target.split(' '), yw = st.ta.value.split(/\s+/), n = st.ta.value.trim() ? yw.length : 0, html = [];
    var last = /\s$/.test(st.ta.value) ? n : n - 1;
    for (var i = 0; i < tw.length && i < n + 40; i++) {
      var c = i < last ? (yw[i] === tw[i] ? 'ok' : 'bad') : (i === Math.max(last, 0) ? 'cur' : '');
      html.push('<span class="' + c + '">' + esc(tw[i]) + '</span>');
    }
    st.pass.innerHTML = html.join(' ');
    var cur = st.pass.querySelector('.cur'); if (cur && cur.scrollIntoView) { var top = cur.offsetTop - st.pass.offsetTop - 40; st.pass.scrollTop = Math.max(0, top); }
    var mins = st.t0 ? (Date.now() - st.t0) / 60000 : 0, s = score(st.target, st.ta.value, mins);
    var left = st.t0 ? Math.max(0, st.limit - (Date.now() - st.t0)) : st.limit;
    st.sTime.textContent = Math.floor(left / 60000) + ':' + ('0' + Math.floor(left % 60000 / 1000)).slice(-2);
    st.sWpm.textContent = st.t0 && mins > 0.05 ? s.wpm : '–'; st.sAcc.textContent = s.words ? s.acc + '%' : '–';
  }
  function finish() {
    clearInterval(timer); timer = null; st.ta.disabled = true;
    var mins = st.limit / 60000, s = score(st.target, st.ta.value, mins), g = st.g;
    var passed = !st.practice && s.wpm >= g.wpm && s.acc >= g.acc;
    var tip = s.acc < g.acc ? 'Your accuracy is below the goal. Slow down a little and type each word right; speed will follow.'
      : s.wpm < g.wpm ? 'Your accuracy is good. Now build speed: practice short runs without looking down, and add a minute at a time.'
      : 'Both numbers reached the goal. Well done!';
    var r = { id: st.id, wpm: s.wpm, acc: s.acc, minutes: mins, passed: passed, practice: !!st.practice };
    st.res.innerHTML = '<p>Speed: <b>' + s.wpm + '</b> words a minute (goal ' + g.wpm + ')<br>Accuracy: <b>' + s.acc + '%</b> (goal ' + g.acc + '%)</p>' +
      (st.practice ? '<p>This was a practice run.</p>' : (passed ? '<p class="y">You passed ' + esc(g.name) + '!</p>' : '<p class="n">Not yet. You can try again.</p>')) + '<p>' + tip + '</p>';
    var again = el('button', 'tlt-btn', 'Try again'); again.onclick = function () { open(st.id, { practice: st.practice, minutes: st.forceMin }); };
    st.res.appendChild(again);
    if (passed && g.cert) {
      var pr = el('button', 'tlt-btn', 'Print my certificate'); pr.onclick = function () { window.print(); }; st.res.appendChild(pr);
      st.cert.innerHTML = '<h1>Tashbar Typing Certificate</h1><p style="font-size:22px">' + esc(g.name) + '</p><div class="ln"></div><p>(write your name)</p>' +
        '<p style="font-size:20px">' + s.wpm + ' words a minute with ' + s.acc + '% accuracy, held for ' + mins + ' minutes</p><p>' + new Date().toLocaleDateString() + '</p>';
    }
    try { if (typeof TL_TYPETEST.onResult === 'function') TL_TYPETEST.onResult(r); } catch (e) { }
    TL_TYPETEST.last = r;
  }
  function close() { clearInterval(timer); timer = null; if (ov && ov.parentNode) ov.parentNode.removeChild(ov); ov = null; }
  function open(id, opt) {
    opt = opt || {}; var g = GOALS[id]; if (!g) return false; close();
    if (!document.getElementById('tlt-css')) { var sEl = el('style'); sEl.id = 'tlt-css'; sEl.textContent = css; document.head.appendChild(sEl); }
    var minutes = opt.minutes || (opt.practice ? 1 : g.min);
    st = { id: id, g: g, practice: !!opt.practice, forceMin: opt.minutes, limit: minutes * 60000, t0: 0 };
    st.target = passage(g, Math.ceil((g.wpm + 30) * minutes) + 40, (Date.now() / 1000) | 0);
    ov = el('div', 'tlt-ov'); ov.setAttribute('data-elec', 'typetest');
    var box = el('div', 'tlt-box'); ov.appendChild(box);
    var h = el('div', 'tlt-h', '<b>⌨️ ' + esc(g.name) + (st.practice ? ': practice' : ': typing test') + '</b>');
    var x = el('button', 'tlt-x', 'Close'); x.onclick = close; h.appendChild(x); box.appendChild(h);
    box.appendChild(el('div', 'tlt-goal', 'Goal: ' + g.wpm + ' words a minute with ' + g.acc + '% right, for ' + minutes + (minutes === 1 ? ' minute' : ' minutes') + '. Type the words below. The clock starts with your first key. Eyes on the words, not the keys!'));
    var stats = el('div', 'tlt-stats');
    stats.innerHTML = '<div class="tlt-stat"><span>Time left</span><b class="t">0:00</b></div><div class="tlt-stat"><span>Words a minute</span><b class="w">–</b></div><div class="tlt-stat"><span>Accuracy</span><b class="a">–</b></div>';
    box.appendChild(stats); st.sTime = stats.querySelector('.t'); st.sWpm = stats.querySelector('.w'); st.sAcc = stats.querySelector('.a');
    st.pass = el('div', 'tlt-pass'); box.appendChild(st.pass);
    st.ta = el('textarea', 'tlt-ta'); st.ta.setAttribute('aria-label', 'Type the words here'); st.ta.setAttribute('autocomplete', 'off'); st.ta.setAttribute('spellcheck', 'false'); st.ta.setAttribute('autocapitalize', 'off');
    box.appendChild(st.ta);
    st.res = el('div', 'tlt-res'); box.appendChild(st.res);
    st.cert = el('div', 'tlt-cert'); ov.appendChild(st.cert);
    st.ta.addEventListener('input', function () {
      if (!st.t0 && st.ta.value.length) { st.t0 = Date.now(); timer = setInterval(function () { paint(); if (Date.now() - st.t0 >= st.limit) finish(); }, 250); }
      paint();
    });
    document.body.appendChild(ov); paint(); st.ta.focus(); return true;
  }
  window.TL_TYPETEST = { open: open, close: close, goals: GOALS, score: score, onResult: null, last: null };
})();
