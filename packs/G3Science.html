rip takes about 29 and a half days, a Jewish month.']],{real:'Track the moon for a month in your notebook.'}),\nmkS('SCI.SKY.L04.04','Star Patterns and the Seasons','✨','constellations and the mazalos','stars3','phases',['✨🥄','On a clear winter night, Chana’s Abba points out Orion the hunter. In the summer, Orion is gone, and other star patterns appear!'],\n [['✨','A constellation is a group of stars that forms a picture.'],['🌍','As the earth goes around the sun, we see different constellations each season.'],['🐑','Each Jewish month has a mazal. Nissan’s mazal is Taleh, the lamb.']],{real:'Find constellations on a camping trip.'}),\nmkS('SCI.LAND.L04.01','Temperature and Thermometers','🌡️','measure and record the weather','temp','stars3',['🌡️📊','Tzvi reads the thermometer every morning and writes it on a chart. After a month, he sees a pattern!'],\n [['🌡️','A thermometer measures temperature in degrees.'],['🧊','Water freezes at 32 degrees Fahrenheit.'],['♨️','Water boils at 212 degrees Fahrenheit.']],{real:'Fill in the class weather chart.'}),\nmkS('SCI.LAND.L04.02','The Water Cycle','💧','evaporation, condensation, precipitation','cycle3','temp',['☀️☁️🌧️','The same water has been going around and around since the six days of creation: up into the sky and back down again!'],\n [['♨️','Evaporation: the sun heats water and it rises as vapor.'],['☁️','Condensation: the vapor cools and makes clouds.'],['🌧️','Precipitation: rain or snow falls back down.']],{real:'Explain to your brother where rain comes from.'}),\nmkS('SCI.LAND.L04.03','Thunder and Lightning','⚡','storms and safety','storm','cycle3',['⚡🌩️','Flash! Boom! A storm rolls over Baltimore. Ovadia counts the seconds between the flash and the boom.'],\n [['⚡','Lightning is a giant spark of electricity.'],['🌩️','Thunder is the boom it makes. We see the flash first because light is faster than sound.'],['🏠','When thunder roars, go indoors. And there are special brachos on lightning and thunder!']],{real:'A storm starts during recess. What do you do?'}),\nmkS('SCI.LAND.L04.04','Weather Around the World','🌎','different climates','climate','storm',['🌎🏜️🧊','Right now it might be snowing in Antarctica, blazing hot in the Sahara, and raining in the Amazon, all at the same time!'],\n [['🏜️','Deserts are hot and dry.'],['🧊','The poles are freezing cold.'],['🌧️','In Eretz Yisrael, rain falls mostly in the winter, so in winter we ask Hashem for tal umatar.']],{real:'Pack for trips to three different climates.'}),\nmkS('SCI.ANIM.L04.01','From Caterpillar to Butterfly','🦋','metamorphosis','butterfly','climate',['🐛🦋','A tiny caterpillar munches leaves for weeks, then wraps itself up. When it comes out, it is a butterfly! That is metamorphosis.'],\n [['🥚','It starts as a tiny egg on a leaf.'],['🐛','The caterpillar eats and grows.'],['🫘','Inside the chrysalis, it changes into a butterfly.']],{real:'Your class is raising butterflies.'}),\nmkS('SCI.ANIM.L04.02','From Tadpole to Frog','🐸','an amphibian life cycle','frog','butterfly',['🐸💧','In the spring, the pond is full of tiny black tadpoles with tails. A few weeks later, they hop out as frogs!'],\n [['🥚','Frogs lay eggs in the water.'],['🐟','Tadpoles breathe with gills and swim with tails.'],['🐸','They grow legs and lungs and become frogs.']],{real:'You find tadpoles in a pond.'}),\nmkS('SCI.ANIM.L04.03','The Camel, Built for the Desert','🐫','adaptations','camel','frog',['🐫🏜️','Rivka gave water to Eliezer’s ten camels. Camels can go for days without water, because Hashem built them for the desert!'],\n [['🟫','The hump stores fat for energy, not water.'],['👣','Wide feet keep it from sinking in sand.'],['👁️','Long eyelashes and closing nostrils keep out sand.']],{real:'Design an animal for the desert.'}),\nmkS('SCI.ANIM.L04.04','Built for the Cold','🐻‍❄️','surviving the freezing cold','cold','camel',['🐻‍❄️🧊','How does a polar bear swim in icy water? Thick fur, and a thick layer of fat under its skin!'],\n [['🐻‍❄️','Thick fur and fat keep polar animals warm.'],['🐳','Whales and seals have blubber.'],['🦊','White fur helps an arctic fox hide in the snow.']],{real:'Compare cold animals in a chart.'}),\nmkS('SCI.PLANT.L04.01','Leaves Make Food','🍃','photosynthesis','photo','cold',['🍃☀️','A leaf is a tiny food factory! It uses sunlight, water and air to make sugar for the plant.'],\n [['☀️','Photosynthesis means making food with light.'],['💨','Leaves take in carbon dioxide from the air.'],['🫁','They give off oxygen, which we breathe.']],{real:'Explain why the plant on the windowsill grows.'}),\nmkS('SCI.PLANT.L04.02','Why Leaves Change Color','🍁','chlorophyll and fall colors','fall3','photo',['🍁🍂','In the fall, the trees on Yitzchak’s street turn red, orange and yellow. Where did those colors come from?'],\n [['🟩','Green chlorophyll fills leaves in summer.'],['🍂','In fall, the green fades and hidden colors show.'],['🌲','Evergreens keep their needles all year.']],{real:'Collect fall leaves on a nature walk.'}),\nmkS('SCI.PLANT.L04.03','Rings Inside a Tree','🌳','reading tree rings','rings','fall3',['🪵🎯','A big tree fell in the park. Baruch counts the rings in the stump: 85 rings! The tree was 85 years old.'],\n [['🗓️','Each ring is one year of growth.'],['📏','Wide rings mean good years. Thin rings mean dry years.'],['🪵','The bark protects the trunk.']],{real:'Count the rings on a tree stump.'}),\nmkS('SCI.PLANT.L04.04','Gardens and Farms in the Torah','🌾','Shivas HaMinim and the mitzvos of the land','torahag','rings',['🌾🍇🫒','Eretz Yisrael is praised for seven special species, and the Torah gives farmers special mitzvos!'],\n [['🍇','The Shivas HaMinim: wheat, barley, grapes, figs, pomegranates, olives and dates.'],['🌾','Peah: leave the corner of the field for the poor. Shmitah: let the land rest every seventh year.'],['🧺','Orlah: no fruit from a young tree for three years. Bikkurim: bring first fruits to the Beis Hamikdash.']],{real:'Plan a farm in Eretz Yisrael that keeps the mitzvos.'}),\nmkS('SCI.BODY.L04.01','Food and Energy','🍽️','a balanced plate','energy','torahag',['🍽️🏃','Eliezer has a big soccer game today. What breakfast will give him energy that lasts?'],\n [['🍽️','A balanced plate has grains, protein, fruits, vegetables and dairy.'],['⚡','Healthy foods give long-lasting energy.'],['💧','Water keeps your body working.']],{real:'Plan a healthy lunch for a school trip.'}),\nmkS('SCI.BODY.L04.02','Teeth','🦷','baby teeth, grown-up teeth and brushing','teeth','energy',['🦷🪥','Menachem’s front tooth is wiggly! Soon a grown-up tooth will grow in. He needs to take good care of it.'],\n [['🦷','Kids have 20 baby teeth. Adults have 32.'],['🥤','Sugar feeds germs that make cavities.'],['🪥','Brush for 2 minutes, twice a day.']],{real:'Make a tooth-care chart for your family.'}),\nmkS('SCI.BODY.L04.03','Germs and Staying Healthy','🦠','germs and good habits','germs','teeth',['🦠🧼','Germs are too tiny to see, but they can make us sick. Good habits stop them from spreading!'],\n [['🧼','Scrub your hands with soap for 20 seconds.'],['💪','Sneeze into your elbow.'],['😴','Sleep and healthy food help your body fight germs.']],{real:'Half the class has a cold. What can you do?'}),\nmkS('SCI.BODY.L04.04','Heart and Exercise','❤️','pulse and fitness','pulse','germs',['✋💓','Put two fingers on your wrist. Feel that beat? That is your pulse. Now run in place for a minute, and feel it again!'],\n [['❤️','The heart is a muscle that pumps blood.'],['💓','Your pulse is your heartbeat.'],['🏃','Exercise makes your heart stronger.']],{real:'Run a pulse experiment in gym class.'}),\nmkS('SCI.MATT.L04.01','Gravity Pulls Down','🍎','the force of gravity','gravity','pulse',['🍎⬇️','Pinchas drops his apple at lunch. Down it goes, every single time! Gravity pulls everything toward the earth.'],\n [['🌍','Gravity is a force that pulls things toward the earth.'],['⬇️','It keeps us on the ground.'],['🌙','The moon has less gravity, so you could jump very high there.']],{real:'Test which falls first, in a fair test.'}),\nmkS('SCI.MATT.L04.02','Friction','🧊','the force that slows things','friction','gravity',['🧊👟','Zevulun slides on ice, whoosh! On the carpet, he stops fast. The difference is friction.'],\n [['🧱','Friction slows things when they rub together.'],['🧊','Smooth surfaces have little friction.'],['🔥','Friction makes heat: rub your hands and feel it!']],{real:'Find the best surface for a toy car race.'}),\nmkS('SCI.MATT.L04.03','Simple Machines','⚙️','levers, pulleys, ramps and more','machines','friction',['⚙️🪣','How do you lift a heavy bucket of water from a well? A pulley! Simple machines make work easier.'],\n [['⚖️','A lever, like a seesaw.'],['🎡','A wheel and axle, like a wagon.'],['🪣','A pulley, a ramp, a wedge and a screw.']],{real:'Find simple machines around the school.'}),\nmkS('SCI.MATT.L04.04','Ramps and Rolling','📐','a fair ramp test','ramps','machines',['📐⚽','Bentzion and Levi build ramps from books. Which ramp makes the ball roll fastest? Time to test it fairly!'],\n [['📐','Steeper ramps make things roll faster.'],['⚖️','In a fair test, change only one thing.'],['📊','Time it, repeat it, and record the results.']],{real:'Run a ramp race in class.'}),\nmkS('SS.GEO.L04.01','Maryland on the Map','🗺️','our state and its neighbors','mdmap',null,['🗺️🦅','Nachman finds Maryland on the map of the United States. It is small, but it has mountains, the Chesapeake Bay and the ocean!'],\n [['🏛️','Annapolis is the capital of Maryland.'],['🏙️','Baltimore is its biggest city.'],['🌊','The Chesapeake Bay cuts through the middle.']],{real:'Plan a trip across Maryland.'}),\nmkS('SS.GEO.L04.02','Map Scale and Distance','📏','turning inches into miles','scale','mdmap',['📏🗺️','The map shows shul and school just 2 inches apart. But how far is it really? The map scale tells us!'],\n [['📏','A map scale shows real distance.'],['🧮','If 1 inch is 1 mile, 3 inches is 3 miles.'],['🗺️','Measure with a ruler, then use the scale.']],{special:'mapTap',sp:{},real:'Find the distance to Zeidy’s
