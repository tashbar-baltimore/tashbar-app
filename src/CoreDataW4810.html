(function () {
  var LESSONS = {
  'WRIT.ESSAY.L09.04':{name:'Big Idea, Many Parts',
  teach:[
    {how:'SYNTHESIS means weaving several sources into ONE piece. Akiva has three sources for a Beacon article. 1) The library log: since lunch hours began, visits rose from about 20 to about 60 boys a day. 2) Yoni’s interview with Mr. Adler, the librarian: “By 12:15 every seat is taken, and some boys read on the floor.” 3) The office fact sheet: the library has 30 seats. Step 1: find THE BIG IDEA, the one point all the sources share. It is bigger than ONE DETAIL, and it is not A NEW TOPIC.', q:'Which sentence is the big idea all three sources share?', o:['The lunch-time library has quickly become popular, and it is running out of room.','The library has 30 seats.','Our school should have a longer lunch.']},
    {how:'Step 2: group the details into CATEGORIES. A category is a group of details that belong together, from ANY source. One category = one body paragraph. For the library: Who comes, What they read, What the room needs. A detail from the log and a detail from the interview can sit in the same paragraph. Go from broad to narrow: the big idea, then categories, then details.', q:'The log also says most visitors are in grades 6–8. Which category does that detail belong in?', o:['Who comes','What they read','What the room needs']},
    {how:'The common mistake is planning SOURCE BY SOURCE: paragraph 1 = the log, paragraph 2 = the interview, paragraph 3 = the fact sheet. That is three summaries, not a synthesis: the reader must do the connecting himself. Another mistake is A LIST OF FACTS: every detail, with no groups. A strong plan is BY CATEGORY: each paragraph is named for an idea, and the sources work together inside it.', q:'Which plan is grouped by category?', o:['Paragraph 1: who comes. Paragraph 2: what they read. Paragraph 3: what the room needs.','Paragraph 1: the log. Paragraph 2: the interview. Paragraph 3: the fact sheet.','One long paragraph with every fact from all three sources.']}
  ],
  practice:[
    {t:'sort', q:'Akiva’s library piece. Sort each detail into its category. (The source is in brackets.)', bins:[{id:'W',label:'👦 Who comes, and how many'},{id:'R',label:'📚 What they read'},{id:'N',label:'🪑 What the room needs'}],
      items:[{label:'Visits rose from about 20 to about 60 boys a day. (log)',bin:'W'},{label:'Most visitors are in grades 6–8. (log)',bin:'W'},{label:'History books are borrowed most, then science. (log)',bin:'R'},{label:'Boys ask him for history books most of all. (Mr. Adler)',bin:'R'},{label:'Some boys read on the floor. (Mr. Adler)',bin:'N'},{label:'The library has only 30 seats. (fact sheet)',bin:'N'}],

    {t:'sort', q:'Sneaky ones! Sort each plan for the library piece.', bins:[{id:'C',label:'✅ By category'},{id:'S',label:'⚠️ Mistake: source by source'},{id:'L',label:'⚠️ Mistake: a list of facts'}],
      items:[{label:'Paragraph 1: who comes. Paragraph 2: what they read.',bin:'C'},{label:'Paragraph 1: what the log says. Paragraph 2: what Mr. Adler says.',bin:'S'},{label:'Every fact from all three sources, one after another, with no groups.',bin:'L'},{label:'Paragraph 1: the interview, from start to finish.',bin:'S'},{label:'Paragraph 1: the boys. Paragraph 2: the room.',bin:'C'}],
      h:'Named for an idea? Named for a source? Or no groups at all?'},
    {t:'order', q:'Put the steps for planning a synthesis in order. Tap the steps in order.', tiles:['Read all three sources.','Find the big idea they share.','Group the details into categories.','Write one body paragraph for each category.'],

    {t:'sort', q:'Topic: the Sunday father-son learning program. Sort each sentence.', bins:[{id:'B',label:'💡 The big idea'},{id:'D',label:'🔹 One detail'},{id:'T',label:'🚫 A new topic'}],
      items:[{label:'The Sunday program is growing fast, and it needs more room.',bin:'B'},{label:'The sign-in log shows 95 father-son pairs (190 people) last Sunday.',bin:'D'},{label:'The beis medrash seats 120 people.',bin:'D'},{label:'Rabbi Rosen says some pairs now learn in the hallway.',bin:'D'},{label:'Our school should start a Shabbos choir.',bin:'T'}],
      h:'Does it cover all three sources? Only one fact? Or something the sources never talk about?'},
    {t:'write', q:'Your turn to write. Topic: the lunch-time library (or a topic your rebbe gives). Write the big idea in one sentence. Then name two categories. Under each, list one detail from two different sources.', min:0, checks:['💡 I wrote one big idea that all the sources share.','🗂️ I named two categories, not two sources.','🔗 Each category has details from two different sources.'], h:'Start with the point all the sources share. Then ask: which details belong together?'}
  ],
  check:[
    {q:'Gavriel has three sources on the city’s new park. The fact sheet: three ball fields and only four trees. The ranger: the park is busiest from 4 to 6. A families’ survey: shade is the top request. He writes: “The new park is busy every afternoon, but it needs more shade.” What is this sentence?', o:['the big idea','one detail','a new topic'], h:'Does it fit all three sources, only one, or none?'},
    {q:'Eli plans a piece on the shul’s new sefarim room from three sources: the gabbai’s interview, the sign-out log, and a fact sheet. His plan: paragraph 1, everything the gabbai said; paragraph 2, everything in the log; paragraph 3, everything in the fact sheet. Name his plan.', o:['source by source','by category','a list of facts'], h:'Is each paragraph named for an idea, or for where the facts came from?'},

    {how:'The skill underneath: Explain It All (Level 8). An informative piece has sections, and each section has one main topic. Now each section draws on several sources.', q:'In an informative essay, each body section has…', o:['one main topic','every fact you found','one source']}
  ]},

  'WRIT.PARA.L09.03':{name:'Well-Chosen Facts',
  teach:[
    {how:'You planned by category. Now fill each paragraph. Three sources may give you fifteen true facts, but one paragraph has room for two or three. Choose A TELLING FACT: it proves THIS paragraph’s point, and it shows it clearly with a number, a comparison, or an exact example. Akiva’s point: the lunch-time library is running out of room.', q:'Which is a telling fact for that point?', o:['The log shows about 60 boys a day, and the room has 30 seats.','Mr. Adler says the library gets pretty busy.','The library opened twenty years ago.']},
    {how:'Leave out two kinds of true facts. TRUE BUT WEAK: it points the right way, but it is vague, with no number and no example. “It gets pretty busy” is true but weak. OFF THE POINT: true, and about the library, but it does not prove THIS point. “The library opened twenty years ago” is off the point. Some off-the-point facts belong in another paragraph; move them there. Cutting a true fact is not wasting it: it makes the telling facts stand out.', q:'Point: the library is running out of room. “History books are borrowed most.” What is this fact for that point?', o:['off the point','true but weak','a telling fact']},
    {how:'Best of all: telling facts from DIFFERENT SOURCES that point the same way. That is the top of the evidence ladder: several careful sources that agree. The log’s count plus Mr. Adler’s exact example beats two numbers from the log alone.', q:'Which pair makes the strongest paragraph?', o:['The log: about 60 boys a day for 30 seats. Mr. Adler: some boys read on the floor.','The log: about 60 boys a day. The log: about 300 boys a week.','Mr. Adler: it gets busy. The fact sheet: the carpet is blue.']}
  ],
  practice:[
    {t:'sort', q:'Point: the Sunday father-son program needs a bigger room. Sort each true fact.', bins:[{id:'T',label:'🎯 A telling fact'},{id:'W',label:'🌫️ True but weak'},{id:'O',label:'↪️ Off the point'}],
      items:[{label:'Sign-in log: 95 pairs (190 people) came last Sunday, to a room that seats 120.',bin:'T'},{label:'Rabbi Rosen: 35 pairs had to learn in the hallway last Sunday.',bin:'T'},{label:'A father says it can feel a little crowded.',bin:'W'},{label:'Fact sheet: the program began two years ago.',bin:'O'},{label:'Rabbi Rosen: the pairs learn Chumash and Gemara.',bin:'O'}],
      h:'Does it prove THIS point? Then: is it clear, with a number or an exact example?'},
    {t:'pairs', q:'Match each label to what it means.', pairs:[['A telling fact','Proves this point clearly, with a number or an exact example'],['True but weak','Points the right way, but it is vague'],['Off the point','True, but it proves a different point']],
      h:'Ask two questions: does it prove this point? Is it clear?'},
    {t:'spotall', q:'Point: the school’s bike rack is too small. Tap every TELLING fact.', cells:[{label:'Yoni counted 40 bikes for 12 spaces on Monday.',ok:true},{label:'Gavriel’s photo shows six bikes chained to the fence.',ok:true},{label:'Mr. Gross: bikes block the side door most mornings.',ok:true},{label:'Some boys say parking a bike is hard.',ok:false},{label:'The rack was painted green last summer.',ok:false}],
      h:'Look for a number, a comparison, or an exact example that proves THIS point.'},
    {t:'sort', q:'Sneaky ones! Benny edits a paragraph. Sort each choice he made.', bins:[{id:'G',label:'✅ Good choice'},{id:'M',label:'⚠️ Mistake'}],
      items:[{label:'He cut a fact that was true but weak.',bin:'G'},{label:'He kept a fact only because it was true, though it was off the point.',bin:'M'},{label:'He kept two telling facts from two different sources.',bin:'G'},{label:'He used five numbers from the log and skipped a telling example from the interview.',bin:'M'},{label:'He moved an off-the-point fact to the paragraph where it belongs.',bin:'G'}],
      h:'Being true is not enough. Does it prove this point clearly?'},
    {t:'order', q:'Build the paragraph. Tap the sentences in order.', tiles:['The Sunday program needs a bigger room.','The sign-in log shows 95 pairs (190 people) last Sunday, in a room that seats 120.','Rabbi Rosen adds to that count: 35 pairs had to learn in the hallway.','So a bigger room would give every pair a seat and a sefer.'],
      h:'Start with the point the facts prove. Watch for a word that needs a sentence before it.'},
    {t:'spotall', q:'New point: the Chanukah toy drive grew this year. Tap every PAIR of telling facts from two different sources.', cells:[{label:'Office tally: 140 toys, up from 85. + Rabbi Rosen: 32 families got toys, up from 20.',ok:true},{label:'Rabbi Rosen: 32 families, up from 20. + Gavriel’s chart: twice as many donors as last year.',ok:true},{label:'Office tally: 140 toys, up from 85. + Office tally: 70 boxes, up from 40.',ok:false},{label:'Office tally: 140 toys, up from 85. + A parent: people were generous.',ok:false},{label:'Rabbi Rosen: 32 families, up from 20. + The boxes were wrapped in blue paper.',ok:false}],
      h:'Both facts must be telling, and they must come from two different sources.'},
    {t:'write', q:'Your turn to write. Point: the lunch-time library needs more seats (or a point your rebbe gives). Write the paragraph with two telling facts from two different sources. Then name one true fact you left out, and say why.', min:0, checks:['🎯 I used two telling facts.','🔗 They come from two different sources.','✂️ I named a true fact I cut, and why.'], h:'Ask of each fact: does it prove THIS point, and is it clear?'}
  ],
  check:[
    {q:'Gavriel’s paragraph point: the new crosswalk on Cedar Avenue has made the walk to school safer. From the city fact sheet: “Near-misses at that corner fell from 12 to 2 in one year.” What is this fact for his point?', o:['a telling fact','true but weak','off the point'], h:'Does it prove this point? Is it clear, with a number or an exact example?'},
    {q:'Same point: the crosswalk has made the walk safer. A parent says: “The corner feels a lot safer now.” What is this fact for his point?', o:['true but weak','a telling fact','off the point'], h:'Ask both questions: does it prove THIS point? Is it clear?'},
    {t:'order', q:'Point: the new park needs more shade. Build the paragraph. Tap the sentences in order.', tiles:['The new park needs more shade.','The city fact sheet lists only four trees in the whole park.','With so few trees, it is no surprise that shade was the top request in the families’ survey.','So more trees would give families the shade they asked for.'], h:'Start with the point the facts prove. Watch for words that need a sentence before them.'}
  ],
  re:[
    {how:'A new way: packing for a Shabbaton. Your bag has room for a few things. You pack what the trip truly needs, not everything that is in your closet. A paragraph is the bag; telling facts are what you pack.', q:'Packing only what the trip needs is like choosing…', o:['telling facts','every true fact','off-the-point facts']},
    {how:'A simpler step: ask two questions of each fact. 1) Does it prove THIS point? If not, it is off the point. 2) Is it clear, with a number or an exact example? If not, it is true but weak.', q:'A fact points the right way but has no number and no example. It is…', o:['true but weak','a telling fact','off the point']},
    {how:'The skill underneath: Evidence Ladder (Level 9). Several careful sources that agree are the top rung. That is why telling facts from two sources beat two from one.', q:'The top rung of the evidence ladder is…', o:['several careful sources that agree','one story','an expert’s opinion']}
  ]},

  'WRIT.PARA.L09.04':{name:'Varied Transitions',
  teach:[
    {how:'In a synthesis your sources talk to each other, and TRANSITIONS show the reader how. In Grade 7, glue words linked a claim to its reasons. Now they link SOURCE TO SOURCE and PARAGRAPH TO PARAGRAPH. Job 1, the sources AGREE: “Similarly,” or “Both sources agree that”. Job 2, the sources DIFFER, or the next idea pulls the other way: “In contrast,” or “However,”.', q:'The log says history books are borrowed most. Mr. Adler says boys ask him for history books most. Which transition joins them?', o:['Similarly,','In contrast,','However,']},
    {how:'Job 3, one source ADDS something new on top: “Building on this,” or “One source adds that”. “Building on this,” is also a strong way to open a new paragraph that grows out of the last one. Links like these tie the whole piece together. That is called COHESION. Agree = the same fact again; Add = a new fact on the same point.', q:'The log counts about 60 boys a day. Mr. Adler adds a new fact on the same point: some boys read on the floor. Which transition joins them?', o:['One source adds that','In contrast,','Similarly,']},
    {how:'The mistake: “also … also … also”. Every link sounds the same, and the reader cannot tell if the sources agree, differ, or add. Choose each transition by its JOB, and vary them. A wrong-job transition is a mistake too: “Similarly,” between two sources that disagree.', q:'Which paragraph has varied, precise transitions?', o:['The log shows about 60 boys a day. However, the room has only 30 seats. Building on this, Mr. Adler says some boys read on the floor.','The log shows about 60 boys a day. Also, the room has only 30 seats. Also, Mr. Adler says some boys read on the floor.','The log shows about 60 boys a day. Similarly, the room has only 30 seats. In contrast, Mr. Adler says some boys read on the floor.']}
  ],
  practice:[
    {t:'sort', q:'Sort each transition by its job.', bins:[{id:'A',label:'🤝 The sources agree'},{id:'D',label:'↔️ The sources differ'},{id:'N',label:'➕ One source adds something new'}],
      items:[{label:'Similarly,',bin:'A'},{label:'Both sources agree that',bin:'A'},{label:'In contrast,',bin:'D'},{label:'However,',bin:'D'},{label:'Building on this,',bin:'N'},{label:'One source adds that',bin:'N'}],
      h:'Do the two sources say the same thing, pull different ways, or does one go further?'},
    {t:'pairs', q:'Topic: the Sunday father-son program. Match each pair of sources to the transition that fits.', pairs:[['The log and Rabbi Rosen both say it doubled.','Both sources agree that'],['The log counts 95 pairs; the fact sheet planned for 50.','In contrast,'],['The log counts pairs; Rabbi Rosen goes further and tells what they learn.','Building on this,']],
      h:'Same, different, or one goes further?'},
    {t:'spotall', q:'Tap every sentence where the transition does the RIGHT job.', cells:[{label:'The log says history is borrowed most. Similarly, Mr. Adler says boys ask for history most.',ok:true},{label:'The log shows about 60 boys a day. However, the fact sheet lists only 30 seats.',ok:true},{label:'Yoni counted 40 bikes for 12 spaces. Building on this, Mr. Gross says bikes block the side door.',ok:true},{label:'The log says history is borrowed most. In contrast, Mr. Adler says boys ask for history most.',ok:false},{label:'Both sources agree that the rack is too small. However, Yoni’s count shows 40 bikes for 12 spaces.',ok:false}],
      h:'First decide: same, different, or more? Then check the transition’s job.'},
    {t:'sort', q:'Sneaky ones! Sort each paragraph.', bins:[{id:'G',label:'✅ Precise, right job'},{id:'R',label:'⚠️ Mistake: also … also'},{id:'W',label:'⚠️ Mistake: wrong job'}],
      items:[{label:'Both sources agree that the rack is full. Building on this, Mr. Gross adds that bikes block the door.',bin:'G'},{label:'The rack is full. Also, bikes block the door. Also, boys park at the fence.',bin:'R'},{label:'Yoni counts 40 bikes. In contrast, Gavriel’s photo shows too many bikes as well.',bin:'W'},{label:'The log and Rabbi Rosen agree it grew. However, the room seats only 120.',bin:'G'},{label:'The program grew. Also, pairs learn Gemara. Also, the room is full.',bin:'R'}],
      h:'Are the links all the same word? Does each link fit what the sources do?'},
    {t:'order', q:'Build the paragraph. Tap the sentences in order.', tiles:['The lunch-time library is too crowded.','The log shows about 60 boys a day.','However, the room seats only 30 of those 60 boys.','Building on this, Mr. Adler says some boys without seats read on the floor.'],
      h:'Start with the point. A transition needs the sentence it links to.'},
    {t:'pairs', q:'Fix the “also … also” draft. Match each “Also” to a precise transition.', pairs:[['Also (Rabbi Rosen says the same as the log)','Similarly,'],['Also (the fact sheet says the opposite)','In contrast,'],['Also (a new paragraph grows from the last one)','Building on this,']],
      h:'What does the second idea do: agree, differ, or build further?'},
    {t:'write', q:'Your turn to write. Use the library sources (or three of your own). Write four sentences that join the sources. Use three different transitions, each doing its right job, and no “also”.', min:0, checks:['🤝 I used a transition for sources that agree.','↔️ I used a transition for sources that differ, or for one that adds.','🚫 I used no “also … also”, and each transition fits its job.'], h:'Before each link, ask: do the sources agree, differ, or does one add something new?'}
  ],
  check:[
    {q:'Gavriel’s park piece. The ranger says the park is busiest from 4 to 6. The families’ survey says the same: most families come in the late afternoon. Which transition joins the two sources?', o:['Similarly,','In contrast,','However,'], h:'Do the two sources say the same thing, or pull different ways?'},
    {q:'Same piece. The city fact sheet says the new pool will open in June. The ranger says it will not open until July. Which transition joins the two sources?', o:['However,','Similarly,','Building on this,'], h:'Same, different, or does one go further?'},
    {t:'order', q:'Build the sentence that joins two park sources. Tap the tiles in order.', tiles:['The ranger counts 200 visitors a day;','in contrast,','the city’s fact sheet','expected only 80.'], h:'A transition sits between the two sources it joins.'}
  ],
  re:[
    {how:'A new way: road signs. “Same road ahead” is like Similarly,. “Sharp turn” is like However,. “Road keeps climbing” is like Building on this,. A driver who sees only “Road” on every sign is lost. That is “also … also”.', q:'A “sharp turn” sign is like…', o:['However,','Similarly,','Building on this,']},
    {how:'A simpler step: put the two sources side by side and say one word: SAME, DIFFERENT or MORE. Same: Similarly,. Different: In contrast,. More: One source adds that.', q:'The two sources say the same thing. Use…', o:['Similarly,','In contrast,','One source adds that']},
    {how:'The skill underneath: Glue Words (Level 7). Each glue word has a job: In addition adds a reason, As a result shows a result, For example brings proof. The job must match the connection.', q:'“As a result” shows…', o:['a result','an example','one more reason']}
  ]},

  'WRIT.PARA.L09.05':{name:'Implications',
  teach:[
    {how:'Your body paragraphs gave the facts. The conclusion answers the reader’s last question: SO WHAT? It says what the information MEANS and why it MATTERS. That is AN IMPLICATION. Akiva’s library piece showed about 60 boys a day, history and science read most, and only 30 seats.', q:'Which ending gives an implication?', o:['The boys have shown they want to read at lunch, so a room this small is turning eager readers away.','The log shows 60 boys, the boys read history and science, and there are 30 seats.','Our school should also build a new gym.']},
    {how:'Two endings miss. A SUMMARY LIST repeats the facts one by one; the reader already read them. A NEW TOPIC starts something the piece never discussed. One more trap: A WILD GUESS goes far past the facts (“soon the whole city will read at lunch”). An implication grows straight out of the facts.', q:'“Soon every school in the country will copy our library.” What is this ending?', o:['a wild guess','an implication','a summary list']},
    {how:'Build an implication in three moves. Move 1: say the big idea in new words. Move 2: “This means…”: what the facts show together. Move 3: “This matters because…”: who it affects, or what could happen next. Stay close to your sources.', q:'Which move says who it affects, or what could happen next?', o:['This matters because','This means','the big idea in new words']}
  ],
  practice:[
    {t:'sort', q:'Library piece. Sort each possible last sentence.', bins:[{id:'I',label:'💡 An implication'},{id:'S',label:'📋 A summary list'},{id:'N',label:'🚫 A new topic'}],
      items:[{label:'This means the boys’ love of reading has outgrown one small room.',bin:'I'},{label:'This matters because a boy who finds no seat may stop coming.',bin:'I'},{label:'The log shows 60 boys; Mr. Adler sees boys on the floor; there are 30 seats.',bin:'S'},{label:'In short: visits rose, history is popular, and seats are few.',bin:'S'},{label:'The lunchroom also needs new tables.',bin:'N'}],
      h:'Does it repeat the facts, leave the topic, or say what they mean?'},
    {t:'pairs', q:'Match each ending to its name.', pairs:[['Says what the facts mean and why it matters','An implication'],['Repeats the facts one by one','A summary list'],['Goes far past what the facts show','A wild guess']],
      h:'Does it add meaning, repeat, or stretch too far?'},
    {t:'spotall', q:'Big idea: the Sunday father-son program is growing fast and needs more room. Tap every ending that gives an implication.', cells:[{label:'This means fathers and sons want more learning time together than the shul planned for.',ok:true},{label:'This matters because pairs in the hallway can hardly hear each other learn.',ok:true},{label:'The log says 95 pairs (190 people), the room seats 120, and some learn in the hallway.',ok:false},{label:'Soon every shul in the world will start a Sunday program.',ok:false},{label:'The shul’s kitchen also needs a new oven.',ok:false}],
      h:'An implication says what the facts mean, stays close to them, and stays on the topic.'},
    {t:'sort', q:'Sneaky ones! Is each one careful, or a wild guess?', bins:[{id:'C',label:'✅ Careful implication'},{id:'W',label:'⚠️ Mistake: a wild guess'}],
      items:[{label:'With 40 bikes for 12 spaces, some boys who ride may soon walk instead.',bin:'C'},{label:'With 40 bikes for 12 spaces, no boy will ever ride a bike again.',bin:'W'},{label:'Since the toy drive grew, more families will have a brighter Chanukah.',bin:'C'},{label:'Since the toy drive grew, it will soon be the biggest in the country.',bin:'W'}],
      h:'Does it grow straight out of the facts, or jump far past them?'},
    {t:'order', q:'Build the conclusion in its three moves. Tap the sentences in order.', tiles:['The lunch-time library has become a place the boys truly want to be.','This means one small room can no longer hold their love of reading.','This matters because a boy who finds no seat today may not come back tomorrow.'],
      h:'Which sentence says the big idea in new words? Which says what it means? Which says why it matters?'},
    {t:'sort', q:'Toy drive piece. Big idea: the drive grew this year. Sort each last sentence.', bins:[{id:'I',label:'💡 An implication'},{id:'S',label:'📋 A summary list'},{id:'W',label:'🎈 A wild guess'}],
      items:[{label:'This means our giving now reaches more families who need it.',bin:'I'},{label:'This matters because the drive can plan for even more families next year.',bin:'I'},{label:'The tally says 140 toys, up from 85, for 32 families.',bin:'S'},{label:'Toys went up, families went up, and the lobby was full.',bin:'S'},{label:'Next year every family in the city will get toys from us.',bin:'W'}],
      h:'Meaning close to the facts? The facts again? Or far past them?'},
    {t:'write', q:'Your turn to write. Write the conclusion for the library piece (or your own synthesis). Use the three moves. Do not list the facts again, and do not start a new topic.', min:0, checks:['💡 I said the big idea in new words.','➡️ I wrote what it means: “This means…”.','❗ I wrote why it matters, close to my facts.'], h:'Ask the reader’s last question: so what? Then answer it.'}
  ],
