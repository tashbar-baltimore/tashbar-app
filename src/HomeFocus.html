<script>
/* HomeFocus.html (Head of School 2026-11-17: "the front page is still very busy ... where do I go? what do I do? ... make it exciting but not busy").
   Display only: changes no data, money or mastery. Works on top of HomeLayout (the organized home).
   1. THREE DOORS: the home shows only the top (name, bank, the big Start here button) and three big doors: Learn, Play, My Stuff.
      A door opens just that part of the home, with a big "Back home" button. Every boy starts at the doors after signing in.
   2. BRIGHT POP-UPS: every pop-up opens on a soft bright frosted sky instead of the dark navy cover.
   3. ALIVE: subject tiles, game tiles and buttons lift and shine when touched or pointed at.
   4. The greeting shows the whole first name.
   If HomeLayout is not on the page, the doors do not appear and the home shows as before. Respects reduced motion.
   No double slash in this file (HtmlService rule). */
(function(){
if(typeof render!=='function'||typeof A==='undefined') return;
const HF=window.HF=window.HF||{};
if(HF.on) return; HF.on=true;
HF.door=HF.door||'home'; HF.who=HF.who||'';
const DOORS=[
 {k:'lib',sel:'.hlx-lib',ico:'📚',name:'Learn',sub:'All your subjects and lessons',bg:'linear-gradient(150deg,#6366F1,#8B5CF6 55%,#EC4899)'},
 {k:'games',sel:'.hlx-games',ico:'🎮',name:'Play',sub:'Games where every right answer counts',bg:'linear-gradient(150deg,#F97316,#F59E0B 55%,#EAB308)'},
 {k:'mine',sel:'.hlx-mine',ico:'🎒',name:'My Stuff',sub:'Store, bank, trophies and more',bg:'linear-gradient(150deg,#10B981,#14B8A6 55%,#0EA5E9)'}];
function css(){ if(document.getElementById('hf-css')) return; const s=document.createElement('style'); s.id='hf-css'; s.textContent=`
body.hf-on.hf-home .hlx-lib,body.hf-on.hf-home .hlx-games,body.hf-on.hf-home .hlx-mine{display:none!important}
body.hf-on.hf-lib .hlx-games,body.hf-on.hf-lib .hlx-mine,body.hf-on.hf-games .hlx-lib,body.hf-on.hf-games .hlx-mine,body.hf-on.hf-mine .hlx-lib,body.hf-on.hf-mine .hlx-games{display:none!important}
body.hf-on:not(.hf-home) .hf-doors,body.hf-on:not(.hf-home) .hf-kl{display:none}
.hf-kl{display:flex;align-items:center;gap:18px;margin:22px 0 0;padding:20px 24px;border-radius:28px;background:linear-gradient(120deg,#FEF08A,#FDBA74 55%,#F9A8D4);box-shadow:0 10px 0 rgba(234,88,12,.25),0 18px 34px rgba(234,88,12,.2);animation:hfin .6s cubic-bezier(.2,1.4,.4,1) both}
.hf-kl .ic{font-size:72px;line-height:1;animation:hfbob 3s ease-in-out infinite}
.hf-kl .tx{flex:1;display:flex;flex-direction:column;gap:4px;color:#7C2D12}.hf-kl b{font:900 36px/1 var(--display,'Barlow'),sans-serif}.hf-kl small{font:700 18px var(--body,'Nunito'),sans-serif}
.hf-kl button{border:0;border-radius:999px;padding:16px 34px;background:linear-gradient(180deg,#4ADE80,#16A34A);color:#fff;font:900 26px var(--display,'Barlow'),sans-serif;cursor:pointer;box-shadow:0 6px 0 #15803D}
.hf-kl button:active{transform:translateY(5px);box-shadow:0 1px 0 #15803D}
.hf-doors{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin:22px 0 10px}
@media (max-width:820px){.hf-doors{grid-template-columns:1fr}}
.hf-door{position:relative;overflow:hidden;border:0;border-radius:30px;min-height:230px;padding:26px 24px;color:#fff;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;box-shadow:0 14px 0 rgba(30,27,75,.18),0 22px 40px rgba(30,27,75,.18);transition:transform .18s ease,box-shadow .18s ease;animation:hfin .6s cubic-bezier(.2,1.4,.4,1) both}
.hf-door:nth-child(2){animation-delay:.08s}.hf-door:nth-child(3){animation-delay:.16s}
@keyframes hfin{0%{transform:translateY(30px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
.hf-door:hover{transform:translateY(-6px) rotate(-.5deg)}
.hf-door:active{transform:translateY(6px);box-shadow:0 6px 0 rgba(30,27,75,.18)}
.hf-door:focus-visible{outline:5px solid #1E1B4B;outline-offset:5px}
.hf-door .ico{position:absolute;top:18px;right:20px;font-size:96px;line-height:1;filter:drop-shadow(0 8px 10px rgba(0,0,0,.18));animation:hfbob 3s ease-in-out infinite}
.hf-door:nth-child(2) .ico{animation-delay:.5s}.hf-door:nth-child(3) .ico{animation-delay:1s}
@keyframes hfbob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
.hf-door b{font:900 44px/1 var(--display,'Barlow'),sans-serif;text-shadow:0 3px 0 rgba(0,0,0,.15)}
.hf-door small{font:700 17px var(--body,'Nunito'),sans-serif;opacity:.95}
.hf-door .cnt{align-self:flex-start;margin-top:8px;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.55);border-radius:999px;padding:5px 14px;font:800 15px var(--body,'Nunito'),sans-serif}
.hf-door::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-18deg);animation:hfshine 5s ease-in-out infinite}
.hf-door:nth-child(2)::after{animation-delay:1.6s}.hf-door:nth-child(3)::after{animation-delay:3.2s}
@keyframes hfshine{0%,70%{left:-60%}100%{left:130%}}
.hf-back{display:none;margin:18px 0 6px;border:0;border-radius:999px;padding:14px 28px;background:#fff;color:#1E1B4B;font:900 20px var(--display,'Barlow'),sans-serif;cursor:pointer;box-shadow:0 6px 0 #C7D2FE,0 10px 22px rgba(30,27,75,.12)}
.hf-back:active{transform:translateY(4px);box-shadow:0 2px 0 #C7D2FE}
body.hf-on:not(.hf-home) .hf-back{display:inline-flex;align-items:center;gap:10px;width:auto;align-self:flex-start}
html body .overlay{background:radial-gradient(800px 420px at 50% 110%,rgba(253,224,71,.45),rgba(253,224,71,0) 60%),rgba(240,249,255,.72)!important;backdrop-filter:blur(10px) saturate(1.2)!important}
html body .overlay .ocard{animation:hfpop .45s cubic-bezier(.2,1.5,.4,1) both}
@keyframes hfpop{0%{transform:scale(.85);opacity:0}100%{transform:none;opacity:1}}
.hlx-card,.hptile,.hlx-rec{transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}
.hlx-card:hover,.hptile:hover,.hlx-rec:hover{transform:translateY(-5px) scale(1.015);filter:saturate(1.15) brightness(1.04)}
.hlx-card:active,.hptile:active,.hlx-rec:active{transform:translateY(2px) scale(.99)}
.hpbar .hello b{max-width:none!important;overflow:visible!important;text-overflow:clip!important;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.hf-door,.hf-door .ico,.hf-door::after,html body .overlay .ocard{animation:none!important}.hf-door:hover,.hlx-card:hover,.hptile:hover,.hlx-rec:hover{transform:none}}
`; document.head.appendChild(s); }
function count(sel,inner){ try{ const s=document.querySelector(sel); return s?s.querySelectorAll(inner).length:0; }catch(e){ return 0; } }
function doorsHtml(){ const n={lib:count('.hlx-lib','.hlx-card'),games:count('.hlx-games','.hptile,button'),mine:count('.hlx-mine','button')};
 const c={lib:n.lib?n.lib+' subjects':'',games:n.games?n.games+' games':'',mine:'Store · Bank · Trophies'};
 return DOORS.map(d=>`<button type="button" class="hf-door" data-hf="${d.k}" style="background:${d.bg}" aria-label="${d.name}: ${d.sub}"><span class="ico" aria-hidden="true">${d.ico}</span><b>${d.name}</b><small>${d.sub}</small>${c[d.k]?`<span class="cnt">${c[d.k]}</span>`:''}</button>`).join(''); }
function decorate(){
 const top=document.querySelector('.hlx-top'), ok=A.view==='hub'&&!!A.st&&!!top&&!!document.querySelector('.hlx-lib');
 document.body.classList.toggle('hf-on',ok);
 if(!ok) return;
 css();
 const who=String(A.st.id||''); if(who!==HF.who){ HF.who=who; HF.door='home'; }
 ['home','lib','games','mine'].forEach(k=>document.body.classList.toggle('hf-'+k,HF.door===k));
 if(!document.querySelector('.hf-doors')){ const w=document.createElement('div'); w.className='hf-doors'; w.innerHTML=doorsHtml(); top.insertAdjacentElement('afterend',w); }
 try{ const kOn=!!(window.KL&&KL.on&&KL.on()); let kb=document.querySelector('.hf-kl');
  if(kOn&&!kb){ kb=document.createElement('div'); kb.className='hf-kl'; kb.innerHTML='<span class="ic" aria-hidden="true">🍎</span><span class="tx"><b>Kindergarten Math</b><small>16 lessons that talk to you: count, add, shapes and more.</small></span><button type="button" data-kl="open">Play ▶</button>'; const dd=document.querySelector('.hf-doors'); if(dd) dd.insertAdjacentElement('beforebegin',kb); }
  else if(!kOn&&kb) kb.remove(); }catch(e){}
 if(!document.querySelector('.hf-back')){ const b=document.createElement('button'); b.type='button'; b.className='hf-back'; b.dataset.hf='home'; b.innerHTML='<span aria-hidden="true">🏠</span> Back home'; top.insertAdjacentElement('afterend',b); }
}
function go(k){ HF.door=k; try{ if(typeof SND!=='undefined'&&SND.tap) SND.tap(); }catch(e){} decorate(); try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); } }
document.addEventListener('click',e=>{ const b=e.target&&e.target.closest&&e.target.closest('[data-hf]'); if(!b) return; e.preventDefault(); e.stopPropagation(); go(b.dataset.hf); },true);
HF.render0=HF.render0||render;
render=function(){ const r=HF.render0.apply(this,arguments); try{ decorate(); }catch(e){ console.error('HomeFocus',e); } setTimeout(()=>{ try{ decorate(); }catch(e){} },60); return r; };
try{ decorate(); }catch(e){}
})();
</script>
