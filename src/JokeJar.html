/* ---------- sound: drumroll + ba-dum-tss (quiet; off when the boy turned sound off) ---------- */
let AC = null;
function ac(){ try { if (window.SND && SND.on === false) return null; AC = AC || (window.SND && SND.ctx) || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; } catch (e) { return null; } }
function noise(c, t, dur, vol, hp){ const n = c.createBufferSource(), b = c.createBuffer(1, Math.ceil(c.sampleRate * dur), c.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  n.buffer = b; const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 1000; const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur); n.connect(f); f.connect(g); g.connect(c.destination); n.start(t); n.stop(t + dur + .02); }
function tom(c, t, f0, vol){ const o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * .55, t + .18); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + .22); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + .25); }
function drumroll(sec){ const c = ac(); if (!c) return; const t0 = c.currentTime; for (let x = 0; x < sec; x += .045) noise(c, t0 + x, .05, .025 + .07 * (x / sec), 1800); }
function badumtss(){ const c = ac(); if (!c) return; const t = c.currentTime + .02; tom(c, t, 210, .32); tom(c, t + .16, 150, .34); noise(c, t + .34, .7, .22, 5000); }

/* ---------- the joke card ---------- */

    '<div class="jj-half jj-bot"><p class="jj-at' + (ans === s.a ? '' : ' hid') + '">' + E(ans) + '</p><small>' + (mini ? 'flip me' : '🙃 Upside down!') + '</small></div></div>';
}

/* keep the saved pop-up in step, so a redraw of the page shows the same stage */

  if (card && JS.stage === 2) { const at = card.querySelector('.jj-at'); if (at) { at.textContent = JS.a; at.classList.remove('hid'); } } }

function show(p){
  if (!J.length || typeof overlay !== 'function') return;
  const j = pick(p); if (!j) return;
  jcss();
  const b = book(); b.seen = (b.seen || []).filter(x => x !== j.id).concat(j.id); b.got = b.got || []; if (b.got.indexOf(j.id) < 0) b.got.push(j.id); save(b);
  const same = J.filter(x => x && x.id !== j.id && x.a !== j.a && x.band === j.band), other = shuffle((same.length >= 2 ? same : J.filter(x => x && x.id !== j.id && x.a !== j.a)).slice()).slice(0, 2).map(x => x.a);
  JS = { id: j.id, q: j.q, a: j.a, opts: shuffle([j.a].concat(other)), pick: null, stage: 1 };

function guess(i){ if (!JS || JS.stage !== 1) return; JS.pick = i; JS.stage = 2; paint(); try { if (window.SND && SND.tap) SND.tap(); } catch (e) {} const f = document.querySelector('#jj-ctl .btn.go'); f && f.focus(); }
function finish(card){ if (!JS || JS.stage === 3) return; JS.stage = 3;
  const ok = JS.pick >= 0 && JS.opts[JS.pick] === JS.a; const b = book(); b.cracked = b.cracked || []; if (ok && b.cracked.indexOf(JS.id) < 0) b.cracked.push(JS.id); save(b);
  if (card) { card.classList.remove('spin'); card.style.transform = ''; card.style.transition = ''; card.classList.add('flipped', 'done'); }
  badumtss(); paint(); if (ok) { try { confetti(); } catch (e) {} }
  const v = document.querySelector('#jj-ctl .jj-votes .btn'); if (v) { try { v.focus({ preventScroll: true }); } catch (e) {} }

  if (JS.stage !== 2) return; const card = document.getElementById('jj-card'); if (!card || still()) return finish(card);
  if (JS.busy) return; JS.busy = 1; drumroll(1); card.classList.add('spin'); setTimeout(() => { JS.busy = 0; finish(card); }, 1120); }
/* spin the card with a finger: drag sideways, let go past a quarter turn and it flips */
let drag = null, swallow = 0;
document.addEventListener('pointerdown', e => { const card = e.target.closest && e.target.closest('#jj-card'); if (!card || !JS || JS.stage !== 2 || JS.busy || still()) return;
  drag = { card, x: e.clientX, a: 0, id: e.pointerId }; try { card.setPointerCapture(e.pointerId); } catch (er) {} card.style.animation = 'none'; card.style.transition = 'none'; });
document.addEventListener('pointermove', e => { if (!drag || e.pointerId !== drag.id) return; drag.a = Math.max(0, Math.min(180, Math.abs(e.clientX - drag.x) * 1.1)); drag.card.style.transform = 'rotate(' + drag.a + 'deg)'; });
function endDrag(e){ if (!drag || (e && e.pointerId !== drag.id)) return; const d = drag; drag = null; if (d.a < 8) { d.card.style.transform = ''; d.card.style.animation = ''; return; }
  swallow = Date.now(); d.card.style.transition = 'transform .45s cubic-bezier(.3,1.4,.5,1)';
  if (d.a >= 70) { drumroll(.4); d.card.style.transform = 'rotate(180deg)'; setTimeout(() => finish(d.card), 460); } else { d.card.style.transform = 'rotate(0deg)'; setTimeout(() => { d.card.style.transition = ''; d.card.style.animation = ''; }, 460); } }
document.addEventListener('pointerup', endDrag); document.addEventListener('pointercancel', endDrag);
document.addEventListener('click', e => { if (swallow && Date.now() - swallow < 400) { swallow = 0; e.stopPropagation(); e.preventDefault(); } }, true);   /* a finger spin is not a tap (and never closes the pop-up) */

}, true);

const prev = window.p3Ans;
