<script>
/* MasteryReview.html — the Head of School's TEACHING RULE in the app (DECISION 2026-11-17 1005-ET, HQ "00 TEACHING RULE").
   Stage A, rabbikhaver cloud builder 1, 2026-11-17. Loaded LAST (after HomeLayout) by msQuestToolsBody_ (Photos.js) and Speed.js.
   1. "Frequent review and cumulative practice that revisits old skills ... until the skill is AUTOMATIC":
      every mastered skill gets a spaced review schedule (1, 3, 7, 14, 30, 60 days). A first-try, unrushed right answer moves it on;
      a miss brings it back tomorrow. After 3 clean spaced reviews the skill counts as AUTOMATIC.
   2. Cumulative practice inside every lesson: each normal lesson gets 2 review items from EARLIER mastered skills (due ones first),
      in a different activity kind when the skill has one. They are added as PRACTICE items, so the lesson's own mastery check
      (its 3 check items) is unchanged.
   3. Quick review: a short session of up to 8 due items from many skills, its own finish: it never touches mastery or fails.
   4. Library: a "Keep it strong" card and an "automatic" count.
   Evidence: every answer is recorded exactly as today (same fields), under the item's own skill_id. No money code: the server pays
   as today. B'Simcha and teacher-made lessons are left out. State: st.mr = {skill: [level, dueDay, lastKind]} (small).
   SWITCH: window.MR_LIVE = true -> every boy (HoS 2026-11-17); false -> TEST- boys only. No double slash in this file. */
(function(){
if(typeof render!=='function'||typeof startMission!=='function'||typeof A==='undefined'||typeof buildMission!=='function') return;
window.MR_LIVE=true;   /* HoS 2026-11-17: "turn everything on for everyone" */
const on=()=>{ try{ return !!A.st&&(window.MR_LIVE===true||/^TEST-/.test(String(A.st.id||''))); }catch(e){ return false; } };
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS=[1,3,7,14,30,60], AUTO=3, DAY=86400000;
const today=()=>{ const d=new Date(); return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/DAY); };
const skip=id=>/^(SIM|TCH)\./.test(String(id))||/^TCH/.test(String(id));
const WOR=id=>{ const p=String(id).split('.')[0]; const w=p==='LANG'?'WRIT':(p==='HEB'?'LK':p); return (typeof WORLD!=='undefined'&&WORLD[w])?w:'LK'; };
const NM=id=>String((typeof skillName==='function'?skillName(id):id)||id).replace(/^[^:]{0,26}:\s*/,'').replace(/\bLevels?\s*\d+\s*·?\s*/gi,'');
function mr(){ const st=A.st; if(!st) return {}; st.mr=st.mr||{}; return st.mr; }
/* every mastered skill gets a schedule (first review the day after it was mastered) */
function sync(){ try{ const st=A.st, M=mr(), t=today(); Object.keys(st.skills||{}).forEach(id=>{ const s=st.skills[id]; if(!s||!s.m||skip(id)||M[id]) return;
  const at=Number(s.at)||Date.now(); M[id]=[0,Math.max(Math.floor(at/DAY)+DAYS[0],t-30),'']; }); }catch(e){ console.error('MasteryReview sync',e); } }
const due=()=>{ const M=mr(), t=today(); return Object.keys(M).filter(id=>M[id][1]<=t&&(BANK_ALL[id]||(typeof GEN!=='undefined'&&GEN[id]))).sort((a,b)=>M[a][1]-M[b][1]); };
const autoN=()=>{ const M=mr(); return Object.keys(M).filter(id=>M[id][0]>=AUTO).length; };
/* one review item from a skill: not a teach item, a different kind than last time when possible */
function pick(id){ try{ const all=buildMission(id).filter(x=>x&&x.phase!=='teach'&&x.t!=='write'); if(!all.length) return null; const last=(mr()[id]||[])[2];
  const other=all.filter(x=>(x.t||'mc')!==last); const pool=other.length?other:all; const it=pool[Math.floor(Math.random()*pool.length)];
  it.phase='practice'; it.skill=id; it.mr=1; return it; }catch(e){ return null; } }
function record(p){ try{ if(!p||!p.items) return {n:0,ok:0,auto:[]}; const M=mr(), t=today(); let n=0, ok=0; const auto=[];
  p.items.forEach((it,k)=>{ if(!it||!it.mr) return; const r=p.results[k]; if(!r) return; const id=it.skill; const row=M[id]||[0,t,''];
   n++; const clean=!!r.ok&&r.tries===1&&!(p.mrFast&&p.mrFast[k]);
   if(clean){ ok++; const was=row[0]; row[0]=Math.min(DAYS.length,row[0]+1); row[1]=t+DAYS[Math.min(row[0],DAYS.length-1)]; if(was<AUTO&&row[0]>=AUTO) auto.push(id); }
   else { row[0]=Math.max(0,row[0]-1); row[1]=t+1; }
   row[2]=it.t||'mc'; M[id]=row; }); return {n,ok,auto}; }catch(e){ console.error('MasteryReview record',e); return {n:0,ok:0,auto:[]}; } }
/* ---------- 2. cumulative review inside every normal lesson ---------- */
const _sm=startMission;
startMission=function(c,id,kind){ const r=_sm.apply(this,arguments); try{ const p=A.play;
  if(on()&&p&&p.id===id&&(kind==='skill'||!kind)&&!skip(id)&&!p.mrDone){ p.mrDone=1; sync();
   let src=due().filter(x=>x!==id); if(src.length<2){ const M=mr(); src=src.concat(Object.keys(M).filter(x=>x!==id&&src.indexOf(x)<0&&WOR(x)===WOR(id)).sort((a,b)=>M[a][1]-M[b][1])); }
   const add=[]; for(const s of src){ if(add.length>=2) break; const it=pick(s); if(it) add.push(it); }
   if(add.length){ const pr=p.items.map((x,k)=>x.phase==='practice'?k:-1).filter(k=>k>=0); let at=pr.length?pr[Math.floor(pr.length/2)]:p.items.findIndex(x=>x.phase==='check'); if(at<0) at=p.items.length;
    p.items.splice(at,0,...add); render(); } } }catch(e){ console.error('MasteryReview lesson',e); } return r; };
window.startMission=startMission;
/* rushed answers (the same 1.5 s rule as the lesson page) never count as "automatic" */
if(typeof answer==='function'){ const _an=answer; answer=function(){ try{ const p=A.play; if(p&&p.items&&p.items[p.i]&&p.items[p.i].mr&&!p.tries){ p.mrFast=p.mrFast||{}; p.mrFast[p.i]=Date.now()-(p.shownAt||0)<1500; } }catch(e){} return _an.apply(this,arguments); }; window.answer=answer; }
/* ---------- 3. quick review session ---------- */
function quick(){ if(!on()) return; sync(); const ids=due(); const items=[]; for(const id of ids){ if(items.length>=8) break; const it=pick(id); if(it) items.push(it); }
 if(items.length<8){ for(const id of ids){ if(items.length>=8) break; const it=pick(id); if(it&&!items.some(x=>x.q===it.q)) items.push(it); } }
 if(!items.length){ try{ overlay('<div class="oe">⚡</div><h2>All your skills are fresh!</h2><p>Nothing needs a review right now. Learn something new, and it will come back here to stay strong.</p><button class="btn go big" data-act="closeov">OK</button>'); }catch(e){} return; }
 const c=WOR(items[0].skill); const st=A.st;
 A.play={shownAt:Date.now(),cool:0,c,id:items[0].skill,kind:'mrreview',title:'Quick review: keep it strong',items,i:0,results:[],fb:null,tried:[],order:[],text:'',ticks:[],tries:0,combo:0,best:0,misses:0,t0:Date.now(),replay:true,mrDone:1};
 A.view='play'; try{ if(typeof SND!=='undefined'&&SND.tap) SND.tap(); }catch(e){} render(); scrollTo(0,0);
 overlay('<div class="oe">🔁</div><h2>Quick review</h2><p>'+items.length+' questions from skills you already learned. Answer carefully: right the first time, without rushing, makes a skill <b>automatic</b>.</p><button class="btn go big" data-act="closeov">Let’s go</button>'); }
window.tlMasteryQuick=quick;
if(typeof finish==='function'){ const _fin=finish; finish=function(){ const p=A.play, st=A.st;
  try{ if(on()&&p&&p.kind==='mrreview'){ const R=record(p);
    const rows=p.results.filter(Boolean).map(x=>({at:Date.now(),student:st.id,skill:x.skill,phase:x.phase,item:x.q,first:!!x.first&&!x.pending,tries:x.tries||1,hints:0,ms:0,ok:!!x.ok&&!x.pending}));
    SRV.pendingEv=SRV.pendingEv.concat(rows); try{ saveStudent(st,()=>{}); }catch(e){}
    A.play=null; A.view='hub'; try{ if(typeof SND!=='undefined'&&SND.win) SND.win(); }catch(e){}
    const au=R.auto.length?'<p class="mr-auto">⚡ Now automatic: <b>'+R.auto.map(id=>E(NM(id))).join(', ')+'</b></p>':'';
    overlay('<div class="oe">'+(R.ok===R.n?'🏆':'💪')+'</div><h2>'+(R.ok===R.n?'Every one strong!':'Review done!')+'</h2><p><b>'+R.ok+' of '+R.n+'</b> right the first time. '+(R.ok<R.n?'The ones you missed come back tomorrow, so they get strong too.':'Those skills will come back later, to stay strong.')+'</p>'+au+'<button class="btn go big" data-act="closeov">Back home</button>');
    return; } }catch(e){ console.error('MasteryReview finish',e); }
  let R=null; try{ if(on()&&p&&p.items&&p.items.some(x=>x&&x.mr)) R=record(p); }catch(e){}
  const was=!!(p&&st&&st.skills&&st.skills[p.id]&&st.skills[p.id].m);
  const out=_fin.apply(this,arguments);
  try{ if(on()&&p&&st&&!was&&st.skills[p.id]&&st.skills[p.id].m&&!skip(p.id)){ mr()[p.id]=[0,today()+DAYS[0],'']; } if(R&&R.auto.length&&A.res) A.res.mrAuto=R.auto; }catch(e){}
  return out; }; window.finish=finish; }
/* ---------- the lesson page: a small tag on review items ---------- */
if(typeof vPlay==='function'){ const _vp=vPlay; vPlay=function(){ const h=_vp.apply(this,arguments); try{ const p=A.play, it=p&&p.items&&p.items[p.i]; if(on()&&it&&it.mr){ const k=h.indexOf('<div class="qcard">'); if(k>=0) return h.slice(0,k+19)+'<div class="mr-tag">🔁 Quick review: '+E(NM(it.skill))+'</div>'+h.slice(k+19); } }catch(e){} return h; }; window.vPlay=vPlay; }
/* ---------- 4. the Library: keep it strong ---------- */
function css(){ if(document.getElementById('mr-css')) return; const s=document.createElement('style'); s.id='mr-css'; s.textContent=`
.mr-tag{display:inline-block;margin:0 0 10px;background:#ECFDF5;color:#065F46;border:2px solid #6EE7B7;border-radius:999px;padding:4px 12px;font:800 14px system-ui,sans-serif}
#mr-card{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:14px 0 4px;padding:14px 18px;border-radius:22px;background:linear-gradient(135deg,#10B981,#0EA5E9);color:#fff;box-shadow:0 10px 22px rgba(14,165,233,.25)}
#mr-card .ic{font-size:44px}#mr-card .tx{flex:1;min-width:220px}#mr-card b{display:block;font:900 22px/1.15 system-ui,sans-serif}#mr-card small{font:700 15px system-ui;opacity:.95}
#mr-card button{min-height:56px;border:0;border-radius:18px;padding:0 22px;font:900 19px system-ui;background:#fff;color:#065F46;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15)}
#mr-card button:hover{transform:translateY(-2px)}
#mr-card.calm{background:linear-gradient(135deg,#ECFDF5,#E0F2FE);color:#065F46;box-shadow:none;border:2px solid #A7F3D0}#mr-card.calm button{display:none}
.mr-auto{background:#FEF9C3;border-radius:12px;padding:8px 12px;font-weight:700}
@media (max-width:700px){#mr-card b{font-size:18px}}
`; document.head.appendChild(s); }
function card(){ try{ if(!on()||A.view!=='hub') return; const lib=document.getElementById('hlx-lib'); if(!lib) return; css(); sync();
  const n=due().length, a=autoN(), m=Object.keys(mr()).length; let el=document.getElementById('mr-card');
  const html=n?'<span class="ic" aria-hidden="true">🔁</span><span class="tx"><b>Keep it strong! '+n+' skill'+(n===1?' is':'s are')+' ready for a quick review</b><small>About 5 minutes. Right the first time, without rushing, makes a skill automatic. ⚡ '+a+' of '+m+' learned skills are automatic.</small></span><button type="button" data-mr="go">Start quick review ▶</button>'
   :(m?'<span class="ic" aria-hidden="true">⚡</span><span class="tx"><b>All your skills are fresh!</b><small>⚡ '+a+' of '+m+' learned skills are automatic. Learned skills come back here on their own, to stay strong.</small></span>':'');
  if(!html){ if(el) el.remove(); return; }
  if(!el){ el=document.createElement('div'); el.id='mr-card'; const after=lib.querySelector('.hlx-stats'); if(after) after.after(el); else lib.prepend(el); }
  el.className=n?'':'calm'; if(el.innerHTML!==html) el.innerHTML=html;
  const stats=lib.querySelector('.hlx-stats'); if(stats&&!stats.querySelector('.mr-a')){ const s=document.createElement('span'); s.className='mr-a'; stats.appendChild(s); } const sa=stats&&stats.querySelector('.mr-a'); if(sa) sa.innerHTML='⚡ <b>'+a+'</b> skills automatic';
 }catch(e){ console.error('MasteryReview card',e); } }
const _r=render; render=function(){ const r=_r.apply(this,arguments); try{ if(on()&&A.view==='hub'){ setTimeout(card,30); setTimeout(card,420); setTimeout(card,900); } }catch(e){} return r; };
document.addEventListener('click',e=>{ const b=e.target.closest&&e.target.closest('[data-mr="go"]'); if(!b||!on()) return; e.preventDefault(); e.stopPropagation(); quick(); },true);
window.tlMastery={sync,due,autoN,record,DAYS,AUTO};
try{ if(on()) render(); }catch(e){}
})();
</script>
