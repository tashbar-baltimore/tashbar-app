    c45f_postcard: { title: "A Postcard from Bnei Brak", text: "Dear Avrumi,\nWe landed on Monday, tired and hungry, and Bubby met us at the door with soup, kugel, and a hug that lasted a whole minute.\nYesterday we went up to Yerushalayim, to the Kosel, early in the morning, before the sun was hot. Abba stood there for a long time without saying a word.\nWrite soon, and tell me about the map!\nYour cousin,\nMeir" },
    c45f_attic: { title: "One Box a Year", text: "NARRATOR: Yehuda climbs the ladder and pushes open the square door in the ceiling.\nYEHUDA: A trunk with leather straps. A hatbox.\nZEIDY: Yehuda! Did you choose?\nYEHUDA: Yes, Zeidy! I chose!\nNARRATOR: He turns the key. The lock gives a rusty little crunch." },
    c45f_shul: { title: "The Lost Siddur (a play)", text: "NARRATOR: Friday night. The shul is empty. Shimon walks back in, looking under every bench.\nSHIMON: Where is it? Where is my siddur?\nREB DOV: Slowly, Shimon. Slowly. What does it look like?\nSHIMON: Blue, with my name in gold!\nNARRATOR: Reb Dov smiles and lifts a blue siddur from the shelf." },
    c45f_map: { title: "How to Read an Old Map", text: "First, look for the date. Many old maps have a date in a corner, sometimes written in small, curly letters.\nSecond, find the compass rose. On most maps, north is at the top. But not on all of them!\nThird, read the key. Without the key, the symbols are just scribbles." },
    c45f_bees: { title: "Three Things About Bees", text: "Good morning. My report is about honeybees, and I have three things to tell you.\nFirst, a bee visits about one hundred flowers on every trip.\nSecond, bees talk to each other by dancing. A bee that finds food dances in a little circle.\nThird, and this is the most surprising: a bee makes only a tiny drop of honey in its whole life, about one twelfth of a teaspoon." },
    c45f_atticpoem: { title: "The Attic", text: "Up the ladder, through the square,\ninto dusty, quiet air,\nwhere the boxes, stacked and old,\nkeep the stories no one told.\nEvery box a locked-up door.\nEvery lid a \"Tell me more!\"" },
    c45f_rain: { title: "Rain on the Sukkah", text: "The rain came tapping on the schach,\nit drummed, it dripped, it tapped right back,\nand all of us, with bowls of soup,\nran laughing in a dripping group\ninto the kitchen, warm and dry,\nto wait until it passed us by." },
    c45f_candles: { title: "Zeidy's Words", text: "Children, look at the candles. Each one is small. One small flame does not light a whole street. But we do not light one candle and stop. We add. Every night, one more." },
    c45f_siyum: { title: "A Siyum Speech", text: "Rabbosai, one minute, please. When our class started this perek, it looked so long. Twenty dapim! But we learned one daf. And then one more. And then one more. Tonight, we finished. Remember this, boys: a big job is just a lot of small jobs, one after the other." },
    c45f_museum: { title: "Dear Science Museum", text: "I drew the plan three times. I tested every part by itself. Every part worked.\nThen I put all the parts together, and the machine flooded the kitchen.\nNot a little. A lot. The water ran under the refrigerator, across the floor, and into my sister's slippers. My mother was very patient. My sister was less patient." },
    c45f_cake: { title: "Dear Baking Contest", text: "Dear Baking Contest,\nI followed the recipe exactly. I measured every cup. I set the timer.\nThe cake came out tall, golden and perfect.\nThen my little brother found it.\nI am writing to ask: do you give a prize for half a cake?\nSincerely,\nEli Mizrahi" },
    c45f_fastslow: { title: "Fast and Slow", text: "TZVI HIRSCH: I'm fast!\nYEHUDA: I'm slow.\nTZVI HIRSCH: I run ahead.\nYEHUDA: I stop to look.\nTZVI HIRSCH: I shout the answer.\nYEHUDA: I check the book.\nBOTH: Fast and slow, and slow and fast:\nwe each need the other, first to last." },
    c45f_brothers: { title: "Big and Small (a poem for two voices)", text: "BIG BROTHER: I carry the groceries.\nLITTLE BROTHER: I carry the bread.\nBIG BROTHER: I say the brachos loud and clear.\nLITTLE BROTHER: I say them softly instead.\nBIG BROTHER: I'm tall.\nLITTLE BROTHER: I'm small.\nBOTH: But on Shabbos, at the table, we sing it all!" },
    c45f_partners: { title: "The New Partners", text: "TZVI HIRSCH: Okay, I've got it! We roll the paper into tubes, glue them, done. Let's go!\nBINYAMIN: Wait. Before we glue anything, let's test one tube.\nTZVI HIRSCH: Test? Why test? Tubes are strong. Everybody knows that.\nBINYAMIN: Then the test will be quick." },
    c45f_chess: { title: "The Chess Club (a play)", text: "NARRATOR: The chess club, after school.\nMENDY: Come on, come on, move already! The bus leaves in five minutes!\nZEIDY YUSUPOV: Patience, Mendy. A good move is worth waiting for.\nMENDY: But I want to win before the bus comes!\nZEIDY YUSUPOV: Then think first. Winning comes after." },
    c45f_nosson: { title: "A Letter at the End of the Year", text: "You did not even argue. You just turned pink and went to your seat. Later, when I told you I was wrong, you shrugged and said, \"You didn't know.\" Then I said sorry. That was all. You never brought it up again. Not once.\nHere is what I did not tell you then. That shrug changed me." },
