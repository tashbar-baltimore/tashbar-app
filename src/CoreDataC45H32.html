(function () {
  var P = {
    c45h3_b2c4: { title: 'Lost on the Ridge Trail, Chapter 4 in Short', text: 'The crashing in the bushes was only a young deer, as scared as the boys. They laughed, and the hollow felt less scary.\nAvrumi remembered STOP: Stop, Think, Observe, Plan. They laid out everything they had: a little water, trail mix, two squashed rugelach, a flashlight, a compass, two whistles and two ponchos.\nNobody could see them under the trees, so they hung the bright orange poncho high on a branch, like a flag. That was Tzvi Hirsch\'s idea. Avrumi drew a new map from memory and wrote the plan: stay by the rock ledge, blow three blasts every few minutes, and wait to be found.\nThey davened Mincha facing east, using the compass. As the sun sank behind the ridge, Avrumi tried the flashlight. It flickered and went out.' },
    c45h3_b2k4: { title: 'Avrumi\'s Notebook: Race Day', text: 'Thursday, 9:00. The big canoe race is at 2:00. Dark clouds have been piling up over the lake all morning. Dovid said, "I think the race will be called off." Reb Akiva is checking the sky every hour.\n12:00. A strong west wind came up and blew the clouds away over the hills. The sky turned bright blue.\n2:00. The race started right on time. Dovid laughed. "So much for my prediction," he said. "Next time I will keep checking the sky." Bunk Daled came in second, only one canoe length behind Bunk Hei.' },
    c45h3_b2c5: { title: 'Lost on the Ridge Trail, Chapter 5 in Short', text: 'The flashlight was dead, so the boys got ready for the night under the rock ledge. The forest was darker than any place they had ever been, and full of strange sounds.\nIn the dark, Tzvi Hirsch admitted that he was scared, and that it was all his fault. Avrumi said he was scared too. He told how his Abba fixes a mistake in a sefer Torah: he stops, looks carefully, and fixes it one letter at a time. A mistake is the part where you learn to be careful.\nThey said Shema together. Then the clouds cleared, and Avrumi showed Tzvi Hirsch the Big Dipper and the North Star, which always shows north. Far below, a light blinked three times, then three more.' },
    c45h3_b2k5: { title: 'The Pine Lake Ripple: The Owl Who Moved In', text: 'Campers in Bunk Gimmel have a new neighbor. Last week, a barred owl began sleeping every day in the tall oak tree behind the dining hall. It is about as big as a basketball, with brown and white stripes and dark eyes.\nBarred owls hunt at night. They eat mice, frogs and even fish. The dining hall kitchen throws out food scraps each evening, and the camp nurse says mice have been seen near the garbage cans.\nThe owl calls after dark. Campers say it sounds like someone asking, "Who cooks for you?"\nRabbi Weiss has asked all campers to stay away from the oak tree so the owl is not frightened away.' },
    c45h3_b2c6: { title: 'Lost on the Ridge Trail, Chapter 6 in Short', text: 'The boys blew three whistle blasts, and the far-off light blinked three times again. Then it was gone. Tzvi Hirsch started toward it in the dark, but he stopped himself. Walking in the dark could make them fall or get more lost. So they stayed, took turns keeping watch, and kept signaling.\nIn the morning, thick fog hid everything. Avrumi remembered his nature notes: fog is a cloud that touches the ground, and when the sun warms the air, the fog lifts. He found a bare stone patch near the ledge, the only place anyone could see from above. The boys spent an hour building a giant arrow of white rocks pointing to the ledge. Then a high buzzing sound came closer above the fog.' },
    c45h3_b2k6: { title: 'Camp Nature Book: Cairns', text: 'High on a mountain, above the tree line, there are no trees to paint blue marks on. So hikers watch for cairns. A cairn is a neat pile of flat stones stacked on a rock beside the path. Each one is placed where a hiker standing beside it can just see the next.\nOn an unmarked trail, cairns may be the only signs of the way. That is why hikers have a rule: never knock a cairn down, and never build a new one just for fun. A false cairn could lead the next hiker the wrong way.' },
    c45h3_b2c7: { title: 'Lost on the Ridge Trail, Chapter 7 in Short', text: 'The fog lifted, and a small gray drone flew over the stone arrow and the orange poncho. The boys waved and blew their whistles. The drone hovered, dipped once like a nod, and flew away. Had it seen them? Nobody could be sure.\nTzvi Hirsch wanted to follow it, but he looked at Avrumi and stayed. If the drone saw them, the searchers would come to this spot. So the boys waited. They ate the last trail mix, shared the last water and davened Shacharis. Avrumi told how his Abba writes a sefer Torah with patience, letter by letter.\nAt last, a big brown dog in an orange vest burst out of the bushes, and a man\'s voice called their names.' },
    c45h3_b2k7: { title: 'The Pine Lake Ripple: The Mystery Trumpet', text: 'Every Friday, the lost-and-found table outside the dining hall was piled high: sneakers, towels, a trumpet and forty-two flashlights. This week, Nosson decided to do something about it. He made a sign that said FIND YOUR THINGS BEFORE SHABBOS. Then he took a photo of every item and posted the pictures on the bunk board.\nBy Friday afternoon, almost everything was gone. The only thing left was the trumpet. Nobody at camp played the trumpet, and nobody knew where it came from.' },
    c45h3_b5c4: { title: 'Shabbos at the Lighthouse, Chapter 4 in Short', text: 'After the big wave, Reb Shimon and the four boys greeted Shabbos in the little cottage. They sang Kabbalas Shabbos over the howling wind. In Lecha Dodi, Tzvi Hirsch heard the order of the verses in a new way.\nReb Shimon made Kiddush on grape juice in a plastic cup, and they ate the round challos from Gold\'s Bakery, Ima\'s cold chicken and the babka. Dovid cut the babka into five exactly equal pieces. They sang zemiros in three different tunes.\nThen Nosson asked why Reb Shimon loves the lighthouse. Reb Shimon began: "When I was a young man, I worked on a ship. One night, there was a fog..." Then he stopped and said, "Another time."\nTzvi Hirsch watched the beam flash past the window every six seconds. Then he counted to ten, and it did not come back.' },
    c45h3_b5c5: { title: 'Shabbos at the Lighthouse, Chapter 5 in Short', text: 'Scene 1: The beacon has failed. The lighthouse is dark except for the Shabbos candles.\nScene 2: On the radio, the Coast Guard warns all boats. Then the fishing boat Miss Ellie calls: the engine is dead, two people are aboard, and the captain cannot see the light.\nScene 3: Reb Shimon explains pikuach nefesh: to save a life, we do what is needed, even on Shabbos. Years ago his Rav told him what to do in exactly this case.\nScene 4: The Coast Guard asks for the light. Reb Shimon climbs to the lantern room. The boys wait without touching anything. The backup lamp comes on, one flash every six seconds.\nScene 5: At the window, Nosson sees a tiny green light, low on the water, moving toward the shoal.' },
    c45h3_b5c6: { title: 'Shabbos at the Lighthouse, Chapter 6 in Short', text: 'The green light belongs to a boat. Binyamin explains that a boat\'s right side shows green and its left side shows red. Seeing only green, he works out that the boat is drifting north and west, toward the shoal. Reb Shimon tells the Coast Guard, who say their rescue boat is fifteen minutes away.\nThe boys watch and call out every change. The light slides closer to the white water. They whisper Tehillim together.\nReb Shimon suggests the anchor. The green light slides, and slides, and then stops. The anchor is holding.\nA searchlight sweeps in from the north and finds the small white fishing boat. Then a huge wave rises between the boats. When the searchlight swings back, the green light is gone.' },
    c45h3_b5c7: { title: 'Shabbos at the Lighthouse, Chapter 7 in Short', text: 'Reb Shimon wrote his keeper\'s log on Motzaei Shabbos. Each entry starts with a time: the beacon failed at 8:52, the backup lamp was lit at 9:15, the green light was seen at 9:20, the anchor held at 9:39, and at 9:46 the Coast Guard had the Miss Ellie. The captain and his son were safe. At 11:40 the four boys were asleep in a row on the floor.\nThen the chapter tells the morning as a story. Tzvi Hirsch wakes up with Dovid\'s elbow in his ear and hears the silence. The bay is flat and gray, full of floating logs. Reb Shimon davens at the window as the sun rises.\nLater, Nosson finds an old keeper\'s log from 1904, with a pencil note in the margin: "S.G. 1971. This light saved my life."' },
    c45h3_b5k4: { title: 'The Missing Lantern Key (a short chapter book)', text: 'Chapter 1, The Locked Door: The museum opens the lighthouse to visitors tomorrow. But the key to the lantern room is not on its hook. Without it, nobody can show visitors the great lamp. Under the hook lies a black feather.\nChapter 2, The Fog Rolls In: Thick fog rolls over the bay. The museum boat will arrive at noon, and the boys still have no key. Now they cannot even see the roof to look for anything up there.\nChapter 3, Feathers on the Gallery: At eleven, the fog thins. On the gallery, Binyamin finds more black feathers and a shiny bottle cap stuck in a crack. Crows love shiny things.\nChapter 4, The Nest: Tzvi Hirsch looks up at the roof and spots a messy nest. In it, shining in the sun, is the brass key. The visitors climb to the lantern room right on time.' },
    c45h3_b5k5: { title: 'Storm at the Dock (a short play in four scenes)', text: 'SCENE 1. The camp dock, evening. Mr. Katz\'s rowboat has come untied and is floating away from the dock.\nSHLOIMY: Zeidy! The boat is getting away!\nSCENE 2. The same dock. The wind grows stronger, and the boat drifts farther out, rocking.\nSHLOIMY (pulling off his sneakers): I can swim out and grab it!\nSCENE 3. The same dock. Zeidy holds Shloimy\'s arm.\nZEIDY: Never jump into cold, windy water after a boat. A boat can be replaced. A person cannot. When you lose something on the water, you call for help and use a tool.\nSCENE 4. The same dock, a minute later. Zeidy takes the long boat hook from its rack. He stretches out over the edge, hooks the rowboat\'s rope and pulls it in, hand over hand.\nSHLOIMY: You got it, Zeidy!\nZEIDY: We got it. With our heads, not our feet.' },
    c45h3_b5k6: { title: 'The Last Out (a short story)', text: 'It was the last inning of the camp championship. Bunk Daled was losing by three runs. There were two outs, the bases were loaded, and Dovid Lerner was walking up to bat.\nThe first pitch flew past him. Strike one. The second pitch, strike two. The whole camp leaned forward on the benches. Dovid fouled off the next pitch. Then another. Then another. His hands were sweating on the bat.\nOn the sixth pitch, Dovid swung with everything he had. Crack! The ball soared high and far, toward the fence at the edge of the field, and all three runners took off.\nThe ball floated higher, and higher, and then, with the ball still in the air, every light on the camp field went out.' },
    c45h3_b5k7: { title: 'Two Texts About the Foggy Ferry', text: 'TEXT A: The Ferry\'s Log, Tuesday\n7:05 a.m. Left the dock. 14 passengers.\n7:30 a.m. Thick fog. Slowed to half speed.\n7:52 a.m. Sounded the horn every two minutes.\n8:20 a.m. Arrived at the island dock, 25 minutes late. All safe.\nTEXT B: Cody\'s Story\nThe fog swallowed the ferry like a giant gray mouth. Cody gripped the cold rail and could not even see the front of the boat. Every two minutes, the horn let out a deep moan that made him jump. Nobody talked. Then, out of the gray, the island dock appeared, and everyone on the deck cheered as if they had won a prize.' }

  var TEACH = {
    'READ.LIT.L05.33':{
      hook:'A good hiker reads the sky and guesses the weather. A good reader reads the clues and guesses what comes next.',
      big:'A prediction is a smart guess built on clues in the text plus what you know. Then read on and check it. If it was wrong, change your prediction. A wish is not a prediction.',
      intro:['Find a clue.', 'Add what you know.', 'Make a prediction.', 'Read on and check it. Change your prediction if the text shows something new.'],
      ex:[{q:'Ridge Trail, Chapter 4: the poncho', steps:['Clue: the boys hang the orange poncho high.', 'What I know: orange is easy to see from far away.', 'Prediction: searchers may spot it.', 'Read on to check.'], a:'Clue + what I know = prediction.'}],
      oops:{q:'Tzvi Hirsch is hungry. What will happen?', wrong:'A pizza will arrive, because he wants one.', right:'He will have to make the trail mix last.', why:'A wish is not a prediction. Use clues: they have only a little food.'},
      idea:['A prediction is a bridge: one end on a clue, the other on what you know.'],
      try:{q:'"The clouds grew dark, and the wind blew cold." What can you predict?', o:['A storm is coming.', 'A sunny day is coming.', 'Nothing will happen.'], a:'A storm is coming.', steps:['Find the clue.', 'Add what you know about dark clouds.']}
    },
    'READ.LIT.L05.34':{
      hook:'A detective asks questions. So does a strong reader.',
      big:'Good readers ask questions while they read. A thin question has its answer right there in the text. A thick question makes you think and put clues together. Thick questions help you understand the most.',
      intro:['Read a part of the chapter.', 'Ask a question about it.', 'Ask: is the answer right there in the text? Then it is a thin question.', 'Is it a why or how question that makes you think? Then it is a thick question.'],
      ex:[{q:'Ridge Trail, Chapter 5', steps:['Thin: What did the boys say together? (Shema, right there.)', 'Thick: Why did Tzvi Hirsch feel better after Avrumi\'s story?', 'To answer it, put clues together: Abba fixes a mistake one letter at a time, and Tzvi Hirsch had already stopped and stayed.'], a:'Ask both kinds. Thick questions go deeper.'}],
      oops:{q:'"What did the boys say together?" Is this a thick question?', wrong:'Yes, because it is about the chapter.', right:'No, it is a thin question: the answer, Shema, is right there.', why:'A thick question makes you think. One fact you can point to is thin.'},
      idea:['Thin questions skim the top. Thick questions dig.'],
      try:{q:'"Why did Avrumi tell about his Abba?" Thin or thick?', o:['thick question', 'thin question', 'not a question'], a:'thick question', steps:['Is the answer in one place?', 'Or must you think about why?']}
    },
    'READ.LIT.L05.35':{
      hook:'Even a good reader gets lost sometimes. What matters is how he finds his way back.',
      big:'When a part confuses you, notice and stop. Then pick a fix-up: reread, read on (the meaning may come in the next sentence), or split a long word into word parts. Check that it makes sense. Clarifying means fixing a part that confuses you.',
      intro:['Notice: I am confused.', 'Stop at the confusing part.', 'Pick a fix-up: reread, read on, or word parts.', 'Check: does it make sense now?'],
      ex:[{q:'Ridge Trail, Chapter 6: fog', steps:['Confusing: why will the fog lift?', 'Read on: fog is a cloud that touches the ground.', 'When the sun warms the air, the fog lifts.', 'Check: it makes sense now.'], a:'Read on fixed it.'}],
      oops:{q:'You do not know a word. What should you do?', wrong:'Skip it and keep going, even if the sentence makes no sense.', right:'Reread, read on, or split it into word parts.', why:'Skipping leaves the confusing part confusing. Pick a fix-up.'},
      idea:['A fix-up is a flashlight. Point it at the dark part of the page.'],
      try:{q:'"Unsafe." Which fix-up helps?', o:['word parts', 'read faster', 'skip it'], a:'word parts', steps:['Split it: un + safe.', 'Un means not.']}
    },
    'READ.LIT.L05.36':{
      hook:'Your friend asks, "What happened in that chapter?" You have ten seconds. What do you say?',
      big:'A summary tells the most important events in order, in a few words. Too short leaves out big events. Too long is stuffed with small details. Just right is in the middle.',

    'READ.LIT.L06.33':{
      hook:'A book is a building, and every chapter is a floor. Even a quiet floor holds up the next one.',
      big:'Every chapter has a job in the whole book: it sets up the problem, adds a clue, makes the problem harder, or solves the problem. Its ending is often a hook that pulls you into the next chapter.',
      intro:['Read the chapter.', 'Ask: what does this chapter add that the book did not have before?', 'Name its job: sets up the problem, adds a clue, makes the problem harder, or solves the problem.', 'Look at the ending: is it a hook? What question does it pass on?'],
      ex:[{q:'Lighthouse, Chapter 4: the calm meal', steps:['Shabbos comes in; they eat and sing.', 'The calm makes the next shock feel stronger.'], a:'A quiet chapter can set up the danger that comes next.'},
          {q:'Lighthouse, Chapter 4: the fog story', steps:['Reb Shimon starts a story about a ship in fog.', 'He stops: "Another time."', 'The book will come back to it.'], a:'It adds a clue for later.'}],
      oops:{q:'What job does Chapter 4 do?', wrong:'They make Kiddush and eat challah and babka.', right:'It adds a clue (the fog story), and its ending makes the problem harder.', why:'That only retells. Name what the chapter does for the whole book.'},
      idea:['A hook at the end of a chapter is a rope that pulls you into the next one.'],
      try:{q:'A chapter ends: "Then the phone rang. It was the hospital." What is that ending?', o:['a hook', 'a solution', 'a title'], a:'a hook', steps:['Does it answer a question?', 'Or does it make you want to read on?']}
    },
    'READ.LIT.L06.34':{
      hook:'A chapter is like a play. Each scene walks on stage with one job to do.',
      big:'A chapter is built from scenes. Each scene has a job: it brings the problem, makes it more dangerous, explains the rule, turns it around, or ends on a hook. Each scene builds on the one before it.',
      intro:['Read the chapter.', 'Split it into scenes: where does the place, the time or the action change?', 'For each scene ask: what job does it do?', 'Ask how it connects to the scene before and after.'],
      ex:[{q:'Lighthouse, Chapter 5', steps:['Scene 1: the beacon fails. It brings the problem.', 'Scene 2: the Miss Ellie calls. It makes it more dangerous.', 'Scene 3: Reb Shimon\'s talk. It explains the rule.', 'Scene 4: the lamp comes on. It turns it around.'], a:'Each scene does one job, and each builds on the last.'}],
      oops:{q:'What job does the radio scene do?', wrong:'It is about a radio.', right:'It makes it more dangerous: a boat with two people is out there.', why:'"It is about..." is the topic. The job is what the scene adds.'},
      idea:['Scenes are steps on a staircase. Each one lifts the story a little higher.'],
      try:{q:'Scene 1: a cat is stuck up a tree. Scene 2: a storm starts. What job does Scene 2 do?', o:['Makes it more dangerous', 'Brings the problem', 'Turns it around'], a:'Makes it more dangerous', steps:['Was the problem already there?', 'Did this scene make it worse?']}
    },
    'READ.LIT.L06.35':{
      hook:'Why can\'t you put a good book down? Because the author built the suspense, piece by piece.',
      big:'Suspense has a shape: the problem, rising tension (the worry grows), the turn (things change direction), and the cliffhanger (the chapter stops on a big question).',
      intro:['Read the chapter.', 'Find the problem near the start.', 'Find the details that make the worry grow: that is rising tension.', 'Find the turn, then the cliffhanger at the very end.'],
      ex:[{q:'Lighthouse, Chapter 6', steps:['The problem: a boat drifts toward the shoal.', 'Rising tension: the light slides closer; help is fifteen minutes away.', 'The turn: the anchor holds.', 'The cliffhanger: a wave hides the boat, and the green light is gone.'], a:'Problem, rising tension, the turn, the cliffhanger.'}],
      oops:{q:'Which part is the cliffhanger?', wrong:'The boat drifting toward the shoal.', right:'The green light is gone, at the very end.', why:'The problem comes at the start. The cliffhanger is the last line that leaves you asking "what now?"'},
      idea:['Rising tension is a rubber band stretching. The turn lets it go, and the cliffhanger stretches it again.'],
      try:{q:'A story ends: "He opened the box, and gasped." What is that ending?', o:['the cliffhanger', 'the problem', 'the turn'], a:'the cliffhanger', steps:['Is it at the end?', 'Does it leave a question?']}
    },
    'READ.LIT.L06.36':{
      hook:'Two people can build a house with the same bricks and get two very different houses. Two texts can tell one night in two different ways.',
      big:'A log is short entries with times, in time order, mostly facts. A story is built with scenes, details and feelings. Comparing how two texts are built shows what each one is best at: the log tells exactly when things happened; the story shows how the people felt.',
      intro:['Read both parts.', 'Look at the shape: times and short facts, or scenes and feelings?', 'Name how each is built: a log or a story.', 'Ask what each one shows best, and what it leaves out.'],
      ex:[{q:'Lighthouse, Chapter 7', steps:['The log: 8:52, 9:15, 9:20, 9:39, 9:46, in time order.', 'Short facts: beacon failed, lamp lit, anchor holding.', 'The story: Tzvi Hirsch wakes up and hears the silence.', 'Scenes and feelings: the flat bay, the sunrise, Modeh Ani.'], a:'The log tells exactly when; the story helps you feel the morning.'}],
      oops:{q:'How is the log built?', wrong:'Like a story, because it tells about the same night.', right:'As a log: short entries with times, in time order.', why:'The topic is the same. Look at the shape of the text, not what it is about.'},
      idea:['A log is a ruler: exact and plain. A story is a painting: it shows how it felt.'],
      try:{q:'"8:00 Bus left. 8:25 Arrived at school." How is this built?', o:['a log', 'a story', 'a poem'], a:'a log', steps:['Does each line start with a time?', 'Are there feelings?']}
    }
