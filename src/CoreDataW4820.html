   W48 = Writing Grades 4-8 (docs/core-growth/W48-map.md). This file: Grade 4 (L05), Unit 5 "Little Researcher" (research basics, ARMS, COPS). Cast: the Glen Avenue Crew. The sources are practice texts made up for these lessons.
   In engine lessons the FIRST choice in o is the right one. */
(function () {
  var LESSONS = {
  'WRIT.RES.L05.01':{name:'Good Question',
  teach:[
    {how:'It is Sukkos. Mr. Halpern is visiting the Katz family’s sukkah when geese honk overhead in a big V, heading south. Avrumi asks: “How do they know the way?” Mr. Halpern smiles: “After Yom Tov, let’s find out from books, not guesses.” Research starts with a QUESTION. A good research question asks How or Why about one thing, and a book can answer it.', q:'Which is a good research question?', o:['How do birds find their way south?','Do birds fly?','What is everything about all animals?']},
    {how:'Mistake 1: a question that is TOO BIG. “What is everything about birds?” would fill a whole library. You could never finish. Keep your question to one thing about your topic.', q:'Which question is too big?', o:['What is everything about birds?','How do geese fly such a long way?','How do birds find their way south?']},
    {how:'Mistake 2: a YES OR NO question. “Do birds fly south?” Yes. Done! One word answers it, so there is nothing to research. Questions that start with Do, Is, Can or Are are often yes or no. Turn it into How or Why: “Why do birds fly south?”', q:'Dovid asks: “Can birds see the stars?” What kind of question is it?', o:['Yes or no','Too big','Good research question']}
  ],
  practice:[
    {t:'sort', q:'Avrumi’s list of questions about birds. Sort each one.', bins:[{id:'G',label:'✅ Good research question'},{id:'B',label:'📚 Too big'},{id:'Y',label:'👍 Yes or no'}],
      items:[{label:'How do birds find their way south?',bin:'G'},{label:'Why do birds fly south in the fall?',bin:'G'},{label:'How do geese fly such a long way?',bin:'G'},{label:'What is everything about birds?',bin:'B'},{label:'How do all the animals in the world live?',bin:'B'},{label:'Do birds fly south?',bin:'Y'},{label:'Can geese swim?',bin:'Y'}],
      h:'If one word (yes or no) answers it, it is yes or no. If it asks about everything or all, it is too big. How or Why about one thing is good.'},
    {t:'pairs', q:'Match each kind of question to what you do next.', pairs:[['Too big','Ask about one thing.'],['Yes or no','Start with How or Why.'],['Good research question','Keep it, and start looking in books.']],
      h:'What is wrong with the question? Find the fix for that.'},
    {t:'spotall', q:'Tap every GOOD research question: How or Why, about one thing.', cells:[{label:'How do birds use the stars?',ok:true},{label:'Why do some birds stay all winter?',ok:true},{label:'How do birds know when to leave?',ok:true},{label:'Is a goose a bird?',ok:false},{label:'What is everything about the sky?',ok:false},{label:'Do geese honk?',ok:false}],
      h:'Skip a question one word answers. Skip a question about everything. Keep How or Why about one thing.'},
    {t:'order', q:'Dovid asked: “Can birds see the stars?” That is yes or no. Build his good research question. Tap the tiles in order.', tiles:['How do','birds use','the stars','at night?'],
      h:'Start with How do. Then who. Then what they use. The question mark goes last.'},
    {t:'pairs', q:'Match each yes or no question to a How or Why question about the same thing.', pairs:[['Do birds fly south?','Why do birds fly south?'],['Do geese fly a long way?','How do geese fly such a long way?'],['Can birds use the sun?','How do birds use the sun?']],
      h:'Keep the same topic. Swap Do or Can for How or Why.'},
    {t:'sort', q:'Too big, or about one thing?', bins:[{id:'B',label:'📚 Too big'},{id:'O',label:'🎯 About one thing'}],
      items:[{label:'What is everything about the ocean?',bin:'B'},{label:'How do all animals get ready for winter?',bin:'B'},{label:'What is everything about birds?',bin:'B'},{label:'How do geese fly such a long way?',bin:'O'},{label:'How do birds use the sun?',bin:'O'},{label:'Why do birds fly south in the fall?',bin:'O'}],
      h:'Everything and all make a question too big. A question about one thing can be answered in a short report.'},
    {t:'write', q:'Your turn. Pick a topic you wonder about: birds, the harbor, the moon or trains. Write three research questions about it. Check each one: Is it about one thing? Does it need more than one word to answer? Circle your best one.', min:0, checks:['❓ My questions start with How or Why.','🎯 Each one asks about one thing, not everything.','📚 A book could answer my best question.'], h:'Start with How or Why. Then ask about one thing you really wonder about. If one word answers it, turn it around.'}
  ],
  check:[
    {q:'Binyamin wonders about the Baltimore harbor. He writes: “What is everything about the ocean?” What is wrong?', o:['Too big','Yes or no','Good research question'], h:'Does it ask about one thing, or about everything?'},
    {q:'Tzvi Hirsch wonders about the moon. He writes: “Is the moon far away?” What kind of question is it?', o:['Yes or no','Too big','Good research question'], h:'Can one word answer it?'},
    {t:'order', q:'Yehuda wonders about the harbor. Build his good research question. Tap the tiles in order.', tiles:['Why does','Baltimore’s harbor','have a','lighthouse?'], h:'Start with Why does. The question mark goes last.'}
  ],
  re:[
    {how:'A new way: a research question is like a fishing line. Too big is like trying to catch the whole ocean. Yes or no is a line with no hook: one word and it is over. How or Why about one thing catches a real fish: an answer you can write about.', q:'Which question catches a real answer?', o:['How do geese fly such a long way?','Do geese fly?','What is everything about the sea?']},
    {how:'A simpler step: just check the first word. Do, Is, Can and Are often make a yes or no question. How and Why ask for more.', q:'Which first word asks for more?', o:['Why','Do','Is']},
    {how:'The skill underneath: TIDE Plan. There, POW’s Pick my idea meant a topic you already knew how to teach. Now you go further: you pick something you do NOT know yet, and ask a question that books can answer.', q:'In POW, what does the P stand for?', o:['Pick my idea','Plan the ending','Put it in order']}
  ]},

  'WRIT.RES.L05.02':{name:'Notes, Not Copies',
  teach:[
    {how:'Avrumi found a library book: Wings Going South, by Neil Ross. (It is a practice book, made up for these lessons.) It says: “Birds use the sun to tell which way is south.” Copying the whole sentence is slow, and it is not your own work. A NOTE keeps only the KEY WORDS: the few words that hold the fact.', q:'Which note is in key words?', o:['sun – shows south','Birds use the sun to tell which way is south.','birds are nice']},
    {how:'How to find key words: read one sentence. Cover it. Ask: what is the fact? Write 2 to 5 words that hold it: names, numbers, action words. Leave out little words like the, which and that. Then check the book, and say the note back as a sentence: is it still true?', q:'Book: “Birds that fly at night use the stars instead.” Which note holds the fact?', o:['night fliers – stars','Birds that fly at night use','instead']},
    {how:'Two mistakes. COPIED: the whole sentence, word for word. LOST THE FACT: so few words, or the wrong words, that the note no longer says the fact, like “birds – sky.” A good note in key words is short AND still true.', q:'Tzvi Hirsch’s note says only: “birds – sky.” What is wrong?', o:['Lost the fact','Copied','Nothing: it is key words']}
  ],
  practice:[
    {t:'sort', q:'Avrumi’s notes from the practice book and article. Sort each note.', bins:[{id:'K',label:'📝 Key words'},{id:'C',label:'📋 Copied'},{id:'L',label:'❓ Lost the fact'}],
      items:[{label:'sun – shows south',bin:'K'},{label:'night fliers – stars',bin:'K'},{label:'follow rivers, coasts, mountains',bin:'K'},{label:'Birds use the sun to tell which way is south.',bin:'C'},{label:'Birds that fly at night use the stars instead.',bin:'C'},{label:'birds – sky',bin:'L'},{label:'geese',bin:'L'}],
      h:'A whole sentence, word for word, is copied. One or two words that do not say the fact lost the fact. 2 to 5 words that still say the fact are key words.'},
    {t:'pairs', q:'Match each sentence from the practice texts to its key-word note.', pairs:[['In the fall, many birds fly south, where they can find more food for the winter.','fall – fly south – more food'],['Birds use the sun to tell which way is south.','sun – shows south'],['Canada geese fly in a V shape, which saves energy on the long trip.','geese V – saves energy'],['Many birds can sense the earth’s magnetism, almost like a compass inside them.','sense magnetism – like a compass']],
      h:'Find the note with the same fact in fewer words.'},
    {t:'spotall', q:'Article: “Birds also follow things they can see from the sky, like rivers, coasts and mountains.” Tap every KEY word.', cells:[{label:'follow',ok:true},{label:'rivers',ok:true},{label:'coasts',ok:true},{label:'mountains',ok:true},{label:'also',ok:false},{label:'like',ok:false},{label:'they',ok:false}],
      h:'Key words hold the fact: what the birds do and what they follow. Little words like also, like and they can go.'},
    {t:'order', q:'Put the steps for taking a note in order. Tap the tiles in order.', tiles:['Read the sentence.','Cover it.','Write the key words.','Check the book: still true?'],
      h:'Read it first. Cover it so you do not copy. Write. Then check.'},
    {t:'pairs', q:'Avrumi’s research question is “How do birds find their way south?” Match each smaller question to the note that answers it.', pairs:[['What do birds use to find south?','sun – shows south'],['What do birds use at night?','night fliers – stars'],['What do birds follow from the sky?','follow rivers, coasts, mountains']],
      h:'Which note holds that fact?'},
    {t:'sort', q:'Article: “Canada geese fly in a V shape, which saves energy on the long trip.” Keep it in the note, or leave it out?', bins:[{id:'K',label:'📝 Key word: keep'},{id:'L',label:'✂️ Little word: leave out'}],
      items:[{label:'geese',bin:'K'},{label:'V shape',bin:'K'},{label:'saves energy',bin:'K'},{label:'which',bin:'L'},{label:'in a',bin:'L'},{label:'on the',bin:'L'}],
      h:'Keep the words that hold the fact: who, what, and what it does. Leave out little words.'},
    {t:'write', q:'Your turn. Here is the practice article, How Birds Find Their Way: “The earth acts like a giant magnet. Many birds can sense the earth’s magnetism, almost like a compass inside them. Birds also follow things they can see from the sky, like rivers, coasts and mountains.” Take one note for each sentence, in key words. Then take notes the same way from one page of a real book on your own research question.', min:0, checks:['📝 Each note is 2 to 5 key words.','📋 I did not copy a whole sentence.','✅ I checked the text: every note is still true.'], h:'Read one sentence. Cover it. Ask: what is the fact? Write only the words that hold it. Then uncover and check.'}
  ],
  check:[
    {q:'Dovid reads a book about the harbor: “Big ships use tugboats to turn in the harbor.” His note says: “Big ships use tugboats to turn in the harbor.” What is wrong?', o:['Copied','Lost the fact','Key words'], h:'Is the note the whole sentence, word for word?'},
    {q:'Binyamin reads: “The moon takes about 27 days to go around the earth.” His note says: “moon – 27 days around earth.” What kind of note is it?', o:['Key words','Copied','Lost the fact'], h:'Is it short? Is the fact still there?'},
    {t:'order', q:'Yehuda reads a book about trains: “Many steam trains burned coal to make steam.” Put his note-taking in order. Tap the tiles in order.', tiles:['He reads the sentence.','He covers it.','He writes: steam trains – burned coal','He checks: is it still true?'], h:'Read, cover, write the key words, then check.'}
  ],
  re:[
    {how:'A new way: a note is like a short message to yourself. You would not write out a whole page. You write only the words you need: “sun – shows south.”', q:'A good note is like…', o:['a short message to yourself','a whole copied page','a picture']},
    {how:'A simpler step: find just the one or two most important words first. Ask: what is the sentence about? What do they do or use?', q:'“Birds that fly at night use the stars instead.” What do they use?', o:['the stars','instead','that']},
    {how:'The skill underneath: Group It. There, the facts were already on cards, ready to sort into groups. Now you go further: you make the fact cards yourself, from a book or an article, in key words and not copies.', q:'In Group It, what did you do with the facts?', o:['Sorted them into named groups','Copied them','Threw them out']}
  ]},

  'WRIT.RES.L05.03':{name:'Where I Found It',
  teach:[
    {how:'Avrumi has great notes. Mr. Halpern asks: “Where did you find them?” Avrumi shrugs: “In a book.” Which book? A reader (or Avrumi, next week) needs to find it again to check. So for each source, write two things: its TITLE and its AUTHOR.', q:'Why write where you found your facts?', o:['So a reader can find the same book and check','So the notes look longer','So you can copy more']},
    {how:'The TITLE is the name of the book or article. Look on the cover, or at the top of the article. The AUTHOR is the person who wrote it. Look for the word “by.” Wings Going South, by Neil Ross: the title is Wings Going South, and the author is Neil Ross. (Both practice texts were made up for these lessons.)', q:'Practice article: How Birds Find Their Way, by Ben Carter. Who is the author?', o:['Ben Carter','How Birds Find Their Way','by']},
    {how:'Three mistakes. “A library book” or “the computer” tells nothing: which one? Mixing up the title and the author. Forgetting a source: if a fact came from the article, the article goes on the list too. Write one line for each source: Title, by Author.', q:'Which source line is ready?', o:['Wings Going South, by Neil Ross','a library book','Neil Ross, by Wings Going South']}
  ],
  practice:[
    {t:'sort', q:'Sort each one: a title or an author?', bins:[{id:'T',label:'📕 Title'},{id:'A',label:'✍️ Author'}],
      items:[{label:'Wings Going South',bin:'T'},{label:'How Birds Find Their Way',bin:'T'},{label:'The Busy Harbor',bin:'T'},{label:'Neil Ross',bin:'A'},{label:'Ben Carter',bin:'A'},{label:'Sam Porter',bin:'A'}],
      h:'The title is the name of the book or article. The author is the person who wrote it.'},
    {t:'pairs', q:'Match each title to its author.', pairs:[['Wings Going South','Neil Ross'],['How Birds Find Their Way','Ben Carter'],['The Busy Harbor','Sam Porter']],
      h:'Think back: who wrote the book, and who wrote the article? The Busy Harbor is by Sam Porter.'},
    {t:'spotall', q:'Tap every source line that tells the reader exactly where to look.', cells:[{label:'Wings Going South, by Neil Ross',ok:true},{label:'How Birds Find Their Way, by Ben Carter',ok:true},{label:'The Busy Harbor, by Sam Porter',ok:true},{label:'a library book',ok:false},{label:'the computer',ok:false},{label:'my friend’s book',ok:false}],
      h:'A ready line has a title and an author. A line with no title tells nothing.'},
    {t:'order', q:'Build the source line for the practice book. Tap the tiles in order.', tiles:['Wings Going South,','by','Neil Ross'],
      h:'Title first, with a comma. Then by. Then the author.'},
    {t:'sort', q:'Avrumi’s notes came from two practice texts. Which source did each note come from?', bins:[{id:'B',label:'📕 Wings Going South'},{id:'A',label:'📰 How Birds Find Their Way'}],
      items:[{label:'fall – fly south – more food',bin:'B'},{label:'sun – shows south',bin:'B'},{label:'night fliers – stars',bin:'B'},{label:'sense magnetism – like a compass',bin:'A'},{label:'follow rivers, coasts, mountains',bin:'A'},{label:'geese V – saves energy',bin:'A'}],
      h:'The book told about fall, the sun and the stars. The article told about magnetism, rivers and geese. Both sources go on the list.'},
    {t:'pairs', q:'Match each mistake to its fix.', pairs:[['“a library book”','Write its title and author.'],['Title and author mixed up','The author is the person after “by.”'],['A fact from the article, but no article on the list','Add a line for the article.']],
      h:'What is wrong? Find the fix for that problem.'},
    {t:'write', q:'Your turn. Find two sources on your research question: two books, or a book and an article, from home, school or the library. Under your notes, write “Where I Found It.” Then write one line for each source: the title, then by, then the author.', min:0, checks:['📕 Each line has the title.','✍️ Each line has the author, after “by.”','📚 Every source I took notes from is on my list.'], h:'Look on the cover or at the top for the title. Look for “by” to find the author. One line for each source.'}
  ],
  check:[
    {q:'Binyamin’s book cover says: Trains of Long Ago, by Peter Lang. What is “Peter Lang”?', o:['Author','Title','Tells nothing'], h:'Which name comes after “by”?'},
    {q:'Dovid writes his source line: “a book from the library.” What kind of source line is it?', o:['Tells nothing','Title','Author'], h:'Can a reader tell which book it is?'},
    {t:'order', q:'Tzvi Hirsch used a book: Facts About the Moon, by Martin Brand. Build his source line. Tap the tiles in order.', tiles:['Facts About the Moon,','by','Martin Brand'], h:'Title, then by, then the author.'}
  ],
  re:[
    {how:'A new way: a source line is like a return address on a letter. It tells where the facts came from, so anyone can go back there.', q:'A source line tells…', o:['where the facts came from','how long the book is','what you think of it']},
    {how:'A simpler step: just find the word “by.” The name after it is the author. The big name on the cover, before it, is the title.', q:'In “The Busy Harbor, by Sam Porter,” what comes after by?', o:['the author','the title','the page']},
    {how:'The skill underneath: Facts and Quotes. There, you told who SAID a quote: says Mr. Gold, the baker. Now you go further: you list every book or article your facts came FROM, with its title and author, at the end of your notes.', q:'In Facts and Quotes, what did you add after a quote?', o:['who said it','a picture','a heading']}
  ]},

  'WRIT.ESSAY.L05.06':{name:'Revise with ARMS',
  teach:[
    {how:'Yehuda wrote his bird report from his notes. Now he REVISES: he rereads to make the MEANING better, with ARMS. A: Add a word, a detail or a sentence that is missing. R: Remove what does not belong. M: Move a sentence to the place where it makes sense. S: Substitute: swap a weak word for a better one.', q:'Yehuda writes: “Birds use the sun.” Rabbi Feldman asks: “To do what?” Which ARMS move fixes it?', o:['Add','Remove','Move']},
    {how:'Here are the other moves. Remove: “My cousin has a pet parakeet.” It is not about how birds find their way. Move: “So that is how birds find the way” sits in the middle, but it wraps up, so it belongs at the end. Substitute: “the lights in the sky” is unclear; swap in “the stars.”', q:'“At night, birds use the lights in the sky.” Which ARMS move swaps in “the stars”?', o:['Substitute','Add','Remove']},
    {how:'You learned in Fix It Up: revise first, then edit. ARMS makes revising exact. The big mistake is still fixing only spelling and calling it revising. Spelling and capitals come later, when you edit. Revising is about MEANING: Does it make sense? Is something missing, extra, out of place, or weak? Revise first. Edit after.', q:'Which change is revising with ARMS?', o:['Removing a sentence that is off the topic','Fixing the spelling of “sowth”','Adding a period']}
  ],
  practice:[
    {t:'pairs', q:'Match each problem to its ARMS move.', pairs:[['Something is missing.','Add'],['A sentence does not belong.','Remove'],['A sentence is in the wrong place.','Move'],['A word is weak or unclear.','Substitute']],
      h:'Say ARMS: Add, Remove, Move, Substitute. Which move fixes that problem?'},
    {t:'sort', q:'Yehuda’s paragraph is about how birds find their way south. Which ARMS move does each line need?', bins:[{id:'A',label:'➕ Add'},{id:'R',label:'✂️ Remove'},{id:'S',label:'🔁 Substitute'}],
      items:[{label:'Birds use the sun. (Reader: to do what?)',bin:'A'},{label:'Many birds fly south. (Reader: when?)',bin:'A'},{label:'My cousin has a pet parakeet.',bin:'R'},{label:'Our class trip was on Tuesday.',bin:'R'},{label:'At night, birds use the lights in the sky.',bin:'S'},{label:'Birds follow stuff they can see.',bin:'S'}],
      h:'If the reader asks a question after the line, Add. If it is not about how birds find the way, Remove. If a word is weak or unclear, like stuff, Substitute.'},
    {t:'spotall', q:'Yehuda is REVISING. Tap every change that is an ARMS move for meaning.', cells:[{label:'Add: “to tell which way is south”',ok:true},{label:'Remove the parakeet sentence',ok:true},{label:'Move “So that is how…” to the end',ok:true},{label:'Substitute “the stars” for “the lights in the sky”',ok:true},{label:'Fix “sowth” to “south”',ok:false},{label:'Put a period at the end',ok:false}],
      h:'ARMS changes what the piece means. Spelling and periods are editing, and they come later.'},
    {t:'order', q:'Yehuda moves his sentences so the paragraph makes sense. Tap the tiles in order.', tiles:['Birds have a few ways to find their way south.','In the day, they use the sun.','Then at night, they use the stars.','So that is how birds find the way.'],
      h:'What the paragraph is about comes first. “Then” comes after the day. “So that is how” wraps it up at the end.'},
    {t:'pairs', q:'Substitute: match each weak or unclear phrase to a better one.', pairs:[['the lights in the sky','the stars'],['stuff they can see','rivers and coasts'],['which is good','which saves energy']],
      h:'Which words say exactly what the practice texts say?'},
    {t:'sort', q:'Revising now, or editing later?', bins:[{id:'V',label:'🔧 Revising (ARMS)'},{id:'E',label:'✏️ Editing (later)'}],
      items:[{label:'Add a detail the reader needs',bin:'V'},{label:'Remove an off-topic sentence',bin:'V'},{label:'Move the wrap-up sentence to the end',bin:'V'},{label:'Swap a weak word for a better one',bin:'V'},{label:'Fix a spelling',bin:'E'},{label:'Put in a capital letter',bin:'E'},{label:'Put a period at the end',bin:'E'}],
      h:'Revising changes the meaning. Editing fixes spelling, capitals and marks.'},
    {t:'write', q:'Your turn. Take a paragraph you wrote this year, or your bird or research paragraph. Read it out loud. Ask the ARMS questions: Is something missing? Is something extra? Is a sentence out of place? Is a word weak? Make your changes, and mark each one A, R, M or S in the margin.', min:0, checks:['➕ I added a word or detail the reader needed.','✂️ I removed or moved a sentence that was off topic or out of place.','🔁 I swapped at least one weak word for a better one.'], h:'Read it aloud, slowly. Stop at each sentence and ask the four ARMS questions. Leave spelling for later.'}
  ],
  check:[
    {q:'Dovid’s paragraph is about how a lighthouse helps ships at night. One sentence says: “My Zeidy likes fishing.” Which ARMS move fixes it?', o:['Remove','Add','Substitute'], h:'Is the sentence about how a lighthouse helps ships?'},
    {q:'Binyamin writes: “The moon goes around the earth in some time.” “Some time” is weak. Which ARMS move swaps in “about 27 days”?', o:['Substitute','Remove','Move'], h:'He is swapping a weak word for a better one.'},
    {t:'order', q:'Tzvi Hirsch revises his paragraph about trains. Move his sentences into the order that makes sense. Tap the tiles in order.', tiles:['Here is how workers build a train track.','First, they lay wooden ties on a bed of stones.','Next, they fasten steel rails on top of the ties.','That is how a train track is built.'], h:'What it is about comes first. First, then Next. The wrap-up goes last.'}
  ],
  re:[
    {how:'A new way: ARMS is like fixing a model you built. Add a missing piece. Remove a piece that does not belong. Move a piece to the right spot. Substitute a better piece for a weak one.', q:'Swapping a weak piece for a better one is…', o:['Substitute','Remove','Add']},
    {how:'A simpler step: start with just two moves, Add and Remove. Ask: Is something missing? Is something extra?', q:'“Our class trip was on Tuesday” is in a paragraph about birds. Is it missing or extra?', o:['extra','missing','neither']},
    {how:'The skill underneath: Belongs or Not? and Fix It Up. There, you cut a detail that wandered, and you reread with a checklist. Now you go further: ARMS gives you four exact moves for meaning (Add, Remove, Move, Substitute), and you make them before any spelling fix.', q:'In Belongs or Not?, what did you do with a detail that wandered?', o:['Cut it','Copied it','Moved it to the start']}
  ]},

  'WRIT.ESSAY.L05.07':{name:'Edit with COPS',
  teach:[
    {how:'Yehuda revised his bird report with ARMS. The meaning is right. NOW he edits, with COPS. C: Capitals at the start of a sentence, on names, and on I. O: Order of words: read it aloud. Are the words in order, with none missing? P: Punctuation: an end mark, and commas in a list. S: Spelling: circle words that look wrong, and check them.', q:'“birds use the sun to find south.” Which COPS letter fixes it?', o:['Capitals','Spelling','Order of words']},
    {how:'Check one letter at a time. Read the whole piece for C. Then again for O. Then P. Then S. Reading aloud helps with O: “Birds south fly in the fall” sounds wrong, so fix the order: “Birds fly south in the fall.”', q:'“At night, birds the stars use.” Which COPS letter fixes it?', o:['Order of words','Punctuation','Capitals']},
    {how:'From Fix It Up you know: revise first, then edit, one check at a time. COPS goes further. It names your four checks, and it adds O. The mistake: reading in your head. Your eyes jump over a missing or switched word, because your brain fills it in. For O, read aloud, with your finger under each word.', q:'Yehuda reads “Birds use sun to find south” in his head and says it is fine. What should he do?', o:['Read it aloud for O','Check only the spelling','Hand it in']}
  ],
  practice:[
    {t:'pairs', q:'Match each COPS letter to its job.', pairs:[['C','Capitals'],['O','Order of words'],['P','Punctuation'],['S','Spelling']],
      h:'Say COPS slowly: Capitals, Order of words, Punctuation, Spelling.'},
    {t:'sort', q:'Each sentence has one mistake. Which COPS letter fixes it?', bins:[{id:'C',label:'🔠 Capitals'},{id:'P',label:'❗ Punctuation'},{id:'S',label:'🔤 Spelling'}],

      {type:'sort', q:'“Canada geese fly in a V shape, which saves energy.”', bins:['Key word','Leave out'], cards:[['geese',0],['which',1],['saves energy',0],['in a',1],['V shape',0]],
        say:'Keep it, or leave it out? Sort each word.', how:'Keep words that hold the fact. Leave out little words.'},
      {type:'match', pairs:[['What do birds use to find south?','sun – shows south'],['What do birds use at night?','night fliers – stars'],['What do birds follow?','rivers, coasts, mountains']],

      {type:'match', pairs:[['“a library book”','Write the title and author.'],['Title and author mixed up','The author comes after by.'],['A source is missing','Add a line for it.']],

  'WRIT.ESSAY.L05.06':{ band:'E45', pic:'🔧', today:'Revise for meaning with ARMS', why:'Revising makes your piece say what you really mean.',
    ready:[{q:'A detail wanders off the topic. What do you do?', o:['Cut it','Keep it','Copy it'], a:'Cut it'}],
    bridge:'WRIT.PARA.L05.07', bridgeName:'Belongs or Not?',
    watch:{ q:'Yehuda revises his bird report.', m:{type:'scene', e:'🔧', t:'Yehuda reads his draft out loud to Avrumi.'}, steps:[
      {t:'A: “Birds use the sun.” To do what? Add: to find south.'},
      {t:'R: “My cousin has a pet parakeet.” Off topic. Remove it.'},
      {t:'M: “So that is how…” sits in the middle. Move it.'},
      {t:'It goes at the end, where it wraps up.'},
      {t:'S: “The lights in the sky” is unclear. Substitute: the stars.'},
      {t:'Spelling waits. First the meaning, then the edit.'}], a:'A revised paragraph that says what Yehuda means.' },
    oops:{ q:'Yehuda says he revised.', wrong:'He fixed “sowth” to “south” and stopped.', right:'He reread for meaning: he added a detail, removed the parakeet sentence, and swapped in “the stars.”', why:'Fixing spelling is editing, and it comes later. Revising with ARMS makes the meaning better.' },
    ways:['reading-aloud scene','memory strategy (ARMS)','worked example','sort it','match it','word tiles','tap the reason','Mistake Detective'], done:'You can revise for meaning with ARMS.',
    board:{ one:'ARMS: Add, Remove, Move, Substitute. Meaning first.', activity:'Project a short draft about birds; boys come up and mark one ARMS move each (A, R, M or S in the margin) and say why.', mistakes:['Fixing only spelling and calling it revising','Keeping a sentence that is off topic','Leaving a weak word like stuff or good'] },
    do:[
      {type:'sort', q:'Yehuda’s changes. Revising, or a mistake?', bins:['Revising: meaning','Mistake: that is editing'], cards:[['Add a missing detail',0],['Fix “sowth” to “south”',1],['Remove the parakeet line',0],['Put in a capital letter',1]], mis:true,
        say:'Revising for meaning, or a mistake? Sort each change.', how:'ARMS changes the meaning. Spelling and capitals wait.',
        why:{q:'Why is fixing “sowth” not revising?', o:['It fixes spelling, not meaning','It adds a detail','It moves a sentence','It is off topic'], a:'It fixes spelling, not meaning'}},
      {type:'match', pairs:[['Something is missing','Add'],['A sentence wanders','Remove'],['Out of place','Move'],['A weak word','Substitute']],
        say:'Match each problem to its ARMS move.', how:'Say ARMS. Which move fixes that problem?'}],
    your:[
      {type:'tiles', q:'Substitute: “At night, birds use the lights in the sky.”', w:['At night,','birds use','the stars.'], extra:['stuff'],
        say:'Swap the unclear words. Build the better sentence.', how:'“The lights in the sky” is unclear. Say exactly what they use.'},
      {type:'sort', q:'Paragraph: how birds find their way south.', bins:['Add','Remove','Substitute'], cards:[['Birds use the sun. (To do what?)',0],['My cousin has a parakeet.',1],['At night, birds use the lights in the sky.',2],['Our trip was on Tuesday.',1]],
        say:'Add, remove, or substitute? Sort each line.', how:'Missing: add. Off topic: remove. Weak words: substitute.',
        why:{q:'Why remove “My cousin has a parakeet.”?', o:['It is not about how birds find the way','It is spelled wrong','It needs a capital','It is too short'], a:'It is not about how birds find the way'}},
      {type:'match', pairs:[['the lights in the sky','the stars'],['stuff they can see','rivers and coasts'],['which is good','which saves energy']],
        say:'Match each weak word to a better one.', how:'Which words say exactly what you mean?'},
      {type:'tiles', q:'“Many birds fly south.” The reader asks: when? Add it.', w:['In the fall,','many birds','fly','south.'], extra:['stuff'],
        say:'Add when: build the full sentence.', how:'Start with when. Then who. Then what they do.'},
      {type:'sort', q:'Revising now, or editing later?', bins:['Revising (ARMS)','Editing (later)'], cards:[['Move the wrap-up to the end',0],['Fix a spelling',1],['Swap a weak word',0],['Put a period at the end',1]],
        say:'Revising now, or editing later? Sort each change.', how:'Meaning now. Spelling and marks later.',
        why:{q:'Why does the period wait until later?', o:['It is editing, not meaning','It is off topic','It is a weak word','It moves a sentence'], a:'It is editing, not meaning'}}] },

  'WRIT.ESSAY.L05.07':{ band:'E45', pic:'✏️', today:'Edit with COPS after you revise', why:'Clean writing lets the reader enjoy your facts.',
    ready:[{q:'In ARMS, what does the R stand for?', o:['Remove','Read','Rhyme'], a:'Remove'}],
    bridge:'WRIT.PARA.L05.05', bridgeName:'Fix It Up',
    watch:{ q:'Yehuda edits his bird report.', m:{type:'scene', e:'✏️', t:'Yehuda revised with ARMS. Now he edits with COPS.'}, steps:[
      {t:'C: “birds fly south.” Birds needs a capital B.'},
      {t:'O: “At night, birds the stars use.” He reads it aloud.'},
      {t:'It sounds wrong. He fixes the order: birds use the stars.'},
      {t:'P: “How do birds find the way” needs a question mark.'},
      {t:'S: “sowth” looks wrong. He checks: south.'},
      {t:'One letter at a time, so he misses nothing.'}], a:'A clean report, ready for the Gazette.' },
    oops:{ q:'Yehuda edits first.', wrong:'He fixes the spelling in the parakeet sentence, then removes the sentence anyway.', right:'He revises with ARMS first, then edits what is left with COPS.', why:'Editing a sentence you will remove wastes time. Revise first, then edit.' },
    ways:['editing scene','memory strategy (COPS)','worked example','sort it','match it','word tiles','tap the reason','Mistake Detective'], done:'You can edit with COPS after you revise.',
    board:{ one:'Revise first. Then COPS: Capitals, Order of words, Punctuation, Spelling.', activity:'Write four sentences on the board, each with one mistake; boys name the COPS letter and fix it, reading each one aloud.', mistakes:['Editing before revising','Checking everything at once and missing things','Not reading aloud, so words stay out of order'] },
    do:[

        say:'Read each one aloud. Ready, or a word mistake?', how:'Point to each word as you say it.',

      {type:'match', pairs:[['C','Capitals'],['O','Order of words'],['P','Punctuation'],['S','Spelling']],
        say:'Match each COPS letter to its job.', how:'Say COPS slowly. What does each letter check?'}],
    your:[
      {type:'sort', q:'Each sentence has one mistake.', bins:['Capitals','Punctuation','Spelling'], cards:[['geese fly in a V.',0],['Birds use the stars',1],['Birds use the sunn.',2],['yehuda saw geese.',0]],
        say:'Capitals, punctuation, or spelling? Sort each sentence.', how:'Look at the first letter, the end, and each word.',
        why:{q:'How do you know “Birds use the stars” needs P?', o:['It has no mark at the end','It starts with a small letter','A word is spelled wrong','The words are out of order'], a:'It has no mark at the end'}},
      {type:'tiles', q:'Fix the order: “Birds south fly in the fall.”', w:['Birds','fly south','in the fall.'], extra:['sowth'],
        say:'Read it aloud, then put the words in order.', how:'Who, then what they do, then when.'},
      {type:'match', pairs:[['birds use the sun.','Birds use the sun.'],['Birds south fly.','Birds fly south.'],['Do geese fly in a V','Do geese fly in a V?']],
        say:'Match each mistake to its fixed sentence.', how:'Find the same sentence with the mistake fixed.'},
      {type:'tiles', q:'Fix it: “at night birds the stars use”', w:['At night,','birds use','the stars.'], extra:['nite'],
        say:'Fix the capital, the order and the end mark.', how:'Start with a capital. End with a period.'},
      {type:'sort', q:'Ready for the Gazette?', bins:['Ready','Needs COPS'], cards:[['Birds follow rivers, coasts and mountains.',0],['birds follow rivers.',1],['Many birds fly south in the fall.',0],['Birds use the stars at nite.',1]],
        say:'Ready, or needs COPS? Sort each sentence.', how:'Check C, O, P and S, one at a time.',
        why:{q:'What is wrong in “Birds use the stars at nite.”?', o:['Spelling: it should be night','A capital is missing','It needs a question mark','The words are out of order'], a:'Spelling: it should be night'}}] },

  'WRIT.PARA.L05.21':{ band:'E45', pic:'🔎', today:'Answer a question with a detail from the text', why:'The text holds the answer. Show the reader where it is.',
    ready:[{q:'In Back It Up, what do you add to a reason?', o:['Proof','A joke','A question'], a:'Proof'}],
    bridge:'WRIT.PARA.L05.16', bridgeName:'Back It Up',

    oops:{ q:'Avrumi answers: What do birds follow from the sky?', wrong:'“I think they follow the clouds.”', right:'“Birds follow rivers, coasts and mountains they can see from the sky.”', why:'A guess is not in the text. The answer must use a detail from the text.' },

        say:'From the text, or a guess? Sort each answer.', how:'Check the text. Is the answer there?',
        why:{q:'Why is “Because it looks nice.” a mistake?', o:['It is a guess, not from the text','It is too long','It has the detail','It is a question'], a:'It is a guess, not from the text'}},
      {type:'match', pairs:[['Why do many birds fly south in the fall?','more food for the winter'],['What do night fliers use?','the stars'],['What do birds follow?','rivers, coasts and mountains']],
        say:'Match each question to the detail that answers it.', how:'Read the question. Which detail tells exactly that?'}],
    your:[
      {type:'tiles', q:'Question: Why do Canada geese fly in a V?', w:['Geese fly','in a V','to save','energy.'], extra:['for fun'],
        say:'Build the answer with the detail from the text.', how:'Turn the question around. Then add why.',
        why:{q:'Why use “to save energy”?', o:['It is the detail the text gives','It is a guess','It sounds fun','It is short'], a:'It is the detail the text gives'}},
      {type:'sort', q:'Question: What do birds follow from the sky?', bins:['Answers it','Does not answer'], cards:[['rivers and coasts',0],['a V shape',1],['mountains',0],['more food',1]],
        say:'Does this detail answer the question? Sort each one.', how:'Reread the question. What does it ask?'},
      {type:'match', pairs:[['A guess','Find it in the text.'],['Detail does not answer','Reread the question.'],['No detail','Add the detail.']],
        say:'Match each mistake to its fix.', how:'What went wrong? Find the step that fixes it.'},
      {type:'tiles', q:'Question: How do birds that fly at night find the way?', w:['Birds that','fly at night','use the','stars.'], extra:['I think'],
        say:'Answer about night fliers with the text’s detail.', how:'Start with who. Then what they use, from the text.'},
      {type:'sort', q:'Question: Why do many birds fly south in the fall?', bins:['Answers from the text','A guess','Does not answer'], cards:[['To find more food for the winter.',0],['Maybe they get bored.',1],['Birds use the sun.',2],['They find more food there.',0]],
        say:'From the text, a guess, or no answer? Sort each one.', how:'Is it in the text? Does it tell why?',
        why:{q:'How do you know “Birds use the sun.” does not answer?', o:['It is about finding the way, not why they go','It is a guess','It is not in the text','It has no capital'], a:'It is about finding the way, not why they go'}}] },
  };
