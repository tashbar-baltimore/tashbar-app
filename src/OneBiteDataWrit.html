W('LANG.MECH.L03.01',{ band:'B23', pic:'✂️', today:'Use an apostrophe to squeeze or own', why:'Writing to Bubby, I am coming for Shabbos becomes I\'m coming.',
  ready:[{q:'Which word means more than one cat?', o:['cats','cat','a cat'], a:'cats'}], bridge:'LANG.GRAM.L02.01', bridgeName:'One or Many',

  oops:{ q:'Two cats (more than one)', wrong:'cat\'s', right:'cats', why:'Many cats just add s. Nothing belongs and nothing is missing.' },

  do:[
    {type:'match', pairs:[['isn\'t','is not'],['I\'ll','I will'],['don\'t','do not'],['I\'m','I am']], say:'Match each squeezed word to its two words.', how:'Put back the letters that fell out.'},
    {type:'tiles', w:['Yosef\'s','kippah','is','blue.'], extra:['Yosefs'], hear:'Yosef\'s kippah is blue.', say:'Build the sentence. Whose kippah is it?', how:'It belongs to Yosef, so Yosef gets an apostrophe s.'}],
  your:[
    {type:'sort', bins:['Squeezed','Belongs'], cards:[['isn\'t',0],['Avi\'s',1],['can\'t',0],['Dov\'s',1]], say:'Squeezed words or belonging? Sort them.', how:'Can you open it into two words? Squeezed. Owner name? Belongs.'},
    {type:'listen', hear:'isn\'t', o:['isn\'t','isnt','is\'nt'], a:'isn\'t', say:'Listen. Tap the right spelling.', how:'Is not. The o fell out, so the apostrophe goes there.'},

    {type:'listen', hear:'can\'t', o:['can\'t','cant','ca\'nt'], a:'can\'t', say:'Listen. Tap the right spelling.', how:'Can not. The n and o fell out, so the apostrophe goes there.'},

    {type:'tiles', w:['The','shop','smells','like','fresh','wood.'], hear:'The shop smells like fresh wood.', say:'Build the complete sentence.', how:'Who first: The shop. Then what it does: smells.'}],

    {type:'sort', bins:['Sentence','Fragment'], cards:[['We sang.',0],['When it rained.',1],['Eli helps.',0],['On the bus.',1]], say:'Sentence or fragment? Sort them.', how:'When it rained. Then what? That is a fragment.'},
    {type:'tiles', w:['When','the','bus','came,','we','got','on.'], hear:'When the bus came, we got on.', say:'Fix the fragment. Build the whole sentence.', how:'Add what happened: we got on.'},
    {type:'sort', bins:['Complete','Run-on'], cards:[['I ran.',0],['I ran I fell.',1],['We ate.',0],['We ate we left.',1]], say:'Complete or run-on? Sort them.', how:'Two ideas with no period between is a run-on.'},
