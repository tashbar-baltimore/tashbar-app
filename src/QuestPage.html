{q:'Combine: "The board was too long. Avi cut it."', o:['The board was too long, so Avi cut it.','The board was too long, but Avi cut it.','The board was too long and, Avi.']},
{t:'order', q:'Build one sentence from: "Menachem sanded the shelf. He painted it."', tiles:['Menachem sanded the shelf','and','painted it.']},
{q:'Choose the joining word: "It was late, ___ the boys kept learning."', o:['but','so','or']},
]},
'WRIT.PARA.L04.01': {name:'Paragraph: topic sentence, three details, closing',
teach:[
{how:'A topic sentence tells what the whole paragraph is about.', q:'Which is the best topic sentence for a paragraph about shop safety?', o:['Three rules keep everyone safe in the shop.','I like wood.','Saws are made of metal.']},
{how:'Every detail must support the topic sentence.', q:'Topic: "Shabbos at our house is peaceful." Which detail does NOT belong?', o:['My bike has a flat tire.','We eat slowly and sing zemiros.','Nobody rushes to go anywhere.']},
{how:'A closing sentence wraps up, often by saying the main idea in new words.', q:'Best closing for a paragraph about why a workshop is a great class?', o:['For all these reasons, the workshop is the best part of my week.','Wood has a smell.','My neighbor has a garage.']},
],
practice:[
{q:'Best topic sentence for a paragraph about Baltimore’s harbor?', o:['Baltimore’s harbor is busy with ships, boats and visitors.','Water is wet.','I went to the beach once.'], h:'It should cover the whole paragraph.'},
{q:'Topic: "Saving money is smart." Which detail supports it?', o:['Savings help you buy something big later.','Money is green.','My friend has a wallet.'], h:'Which one explains why saving is smart?'},
{q:'Which detail does NOT belong in a paragraph about how to plant a seed?', o:['My favorite color is blue.','Dig a small hole.','Water it every day.'], h:'Which one is off topic?'},
{q:'In a paragraph, what comes first?', o:['the topic sentence','the closing sentence','a detail'], h:'It tells what the paragraph is about.'},
{q:'Best closing for a paragraph about the first day of Trades Co.?', o:['By the end of the day, I knew this would be my favorite class.','The shop has a door.','Tomorrow is Tuesday.'], h:'It should wrap up the main idea.'},
{q:'Topic: "Winter is my favorite season." Which is a strong detail?', o:['I love sledding down the big hill near the shul.','Summer is hot.','Some trees are tall.'], h:'Which one shows why he likes winter?'},
],
check:[
{q:'Best topic sentence for a paragraph about caring for tools?', o:['Taking care of your tools makes them last longer.','Tools are in the shop.','I have a red hammer.']},
{q:'Topic: "Our class trip was exciting." Which detail does NOT belong?', o:['My cousin lives in Ohio.','We rode a ferry across the harbor.','We saw a real submarine.']},
{t:'write', q:'Write a paragraph about your favorite thing to build or make. Use a topic sentence, three details and a closing sentence.', min:40, checks:['I started with a topic sentence.','I wrote three details.','I ended with a closing sentence.']},
]},
'WRIT.PARA.L05.01': {name:'Paragraph with transition words',
teach:[
{how:'Transitions connect ideas. First, next, then and finally show order.', q:'"___, gather your tools. Next, measure the board."', o:['First','However','Finally']},
{how:'"However" shows a contrast: something different from what came before.', q:'"The plan looked easy. ___, the cuts were tricky."', o:['However','For example','First']},
{how:'"For example" brings in an example. "As a result" shows an effect.', q:'"We practiced every day. ___, we won the game."', o:['As a result','For example','However']},
],
practice:[
{q:'"Many trees lose their leaves in fall. ___, maples turn bright red first."', o:['For example','However','Finally'], h:'Maples are an example of trees.'},
{q:'"Sand the wood. ___, wipe away the dust."', o:['Then','However','For example'], h:'This is the next step.'},
{q:'"Avi wanted to go outside. ___, it was raining."', o:['However','As a result','First'], h:'Rain is a problem, a contrast.'},
{q:'"The bridge was closed. ___, traffic was slow all day."', o:['As a result','For example','First'], h:'Slow traffic was the effect.'},
{q:'"___, put away every tool before you leave."', o:['Finally','However','For example'], h:'This is the last step.'},
{q:'Which transition shows a contrast?', o:['On the other hand','Next','For example'], h:'Contrast means the other side.'},
],
check:[
{q:'"The shelf wobbled. ___, we added a brace."', o:['As a result','For example','However']},
{q:'"Some tools need power. ___, a hammer does not."', o:['However','As a result','First']},
{t:'write', q:'Write a paragraph of at least 5 sentences about your morning routine. Use at least three transitions, such as first, next, then, after that or finally.', min:50, checks:['I used at least three transition words.','My steps are in order.','I have a topic sentence and a closing.']},
]},
'WRIT.PARA.L05.02': {name:'Step-by-step how-to paragraph',
teach:[
{how:'A how-to paragraph teaches the steps in order so someone else can do it.', q:'What should a how-to paragraph start with?', o:['A sentence that says what you will make or do','The last step','A joke']},
{how:'Each step starts with an action word: cut, measure, sand.', q:'Which is the clearest step?', o:['Measure 12 inches from the end of the board.','Then you sort of do the measuring.','Boards are nice.']},
{how:'Put the steps in the order they really happen.', t:'order', q:'Put the steps in order to make a sandwich.', tiles:['Take two slices of bread.','Spread on the filling.','Put the slices together.']},
],
practice:[
{t:'order', q:'Put the steps in order to plant a seed.', tiles:['Dig a small hole.','Drop in the seed.','Cover it with soil.','Water it.'], h:'What must happen before the seed goes in?'},
{q:'Which step is missing? "Fill the kettle. ___. Pour the hot water."', o:['Heat the water.','Drink the tea.','Buy a kettle.'], h:'What happens between filling and pouring?'},
{t:'order', q:'Put the steps in order to hang a picture.', tiles:['Mark the spot on the wall.','Hammer in the nail.','Hang the picture on the nail.'], h:'Mark first, hang last.'},
{q:'Which detail helps the reader most?', o:['Use a 1/4-inch drill bit.','Use a bit.','Use something good.'], h:'Exact sizes help.'},
{q:'Which is the best last sentence for a how-to paragraph?', o:['Now your birdhouse is ready to hang outside.','I like birds.','First, get wood.'], h:'It should finish the job.'},
{t:'order', q:'Put the steps in order to wash your hands.', tiles:['Wet your hands.','Rub with soap for 20 seconds.','Rinse with water.','Dry with a towel.'], h:'Wet, soap, rinse, dry.'},
],
check:[
{t:'order', q:'Put the steps in order to change a light bulb.', tiles:['Turn off the light.','Unscrew the old bulb.','Screw in the new bulb.','Turn the light on.']},
{q:'Which step is clearest?', o:['Sand the edges until they feel smooth.','Do the sanding thing.','Sanding happens.']},
{t:'write', q:'Write a how-to paragraph that teaches a skill you know, such as folding a paper airplane or setting the table for Shabbos. Give at least four steps in order.', min:50, checks:['I said what we are making or doing.','I gave at least four steps in order.','Each step starts with an action word.']},
]},
'LANG.GRAM.L05.01': {name:'Keep verb tense consistent',
teach:[
{how:'Keep the same time in a sentence. If it happened in the past, use past-tense verbs.', q:'Which is correct?', o:['Yesterday we walked to shul and davened.','Yesterday we walk to shul and davened.','Yesterday we walked to shul and daven.']},
{how:'Past: walked, built. Present: walk, build. Future: will walk, will build.', q:'"Tomorrow, Eli ___ the shelf."', o:['will paint','painted','paints']},
{how:'Some past-tense verbs change spelling: go → went, make → made.', q:'"Last week Shmuel ___ a birdhouse."', o:['made','make','maked']},
],
practice:[
{q:'Which is correct?', o:['He opened the box and took out the drill.','He opened the box and takes out the drill.','He opens the box and took out the drill.'], h:'Both verbs should be past.'},
{q:'"Every day, Ari ___ to school."', o:['walks','walked','will walked'], h:'"Every day" is present.'},
{q:'"Last night we ___ our homework."', o:['finished','finish','will finish'], h:'"Last night" is past.'},
{q:'Which is correct?', o:['The boys ran to the field and played ball.','The boys run to the field and played ball.','The boys ran to the field and play ball.'], h:'Match both verbs.'},
{q:'"Yesterday I ___ a new word."', o:['learned','learn','will learn'], h:'Yesterday is past.'},
{q:'"Next week the class ___ the museum."', o:['will visit','visited','visits'], h:'Next week is future.'},
],
check:[
{q:'Which is correct?', o:['Chaim swept the floor and washed the tables.','Chaim sweeps the floor and washed the tables.','Chaim swept the floor and washes the tables.']},
{q:'"Last Sunday we ___ to the lake."', o:['went','go','goed']},
{q:'"Tomorrow I ___ my cut list."', o:['will check','checked','checks']},
]},
'WRIT.PARA.L06.01': {name:'Summary paragraph',
teach:[
{how:'A summary tells only the main points, in your own words, in order.', q:'What belongs in a summary?', o:['the main events or ideas','every small detail','your opinion']},
{p:'shtender', how:'Leave out small details and your opinions.', q:'Which detail should you leave OUT of a summary of "The Shtender"?', o:['Avi rubbed the wood in long, smooth lines.','Zeidy and Avi built a shtender.','They brought it to the shul.']},
{p:'shtender', how:'Start by naming the main character and what the story is about.', q:'Best first sentence for a summary of "The Shtender"?', o:['Avi helps his grandfather build a shtender for the shul.','The wood was smooth as glass.','I think Avi is nice.']},
],
practice:[
{q:'How long should a summary be compared to the original?', o:['much shorter','the same length','longer'], h:'Only the main points.'},
{p:'siddur', q:'Best one-sentence summary of "The Lost Siddur"?', o:['Moshe lost his siddur, the bus driver returned it, and Moshe wrote his name in it.','Moshe looked under his seat.','The siddur was small and blue.'], h:'Problem, what happened, how it ended.'},
{q:'Which does NOT belong in a summary?', o:['I think the story was boring.','the main character’s problem','how the problem was solved'], h:'Leave out opinions.'},
{q:'A summary should be written:', o:['in your own words','copied word for word','as questions'], h:'Retell, don’t copy.'},
{p:'Camels are built for the desert. Their humps store fat for energy. Their wide feet keep them from sinking in sand. Long eyelashes keep sand out of their eyes.', q:'Best one-sentence summary?', o:['Camels have body parts that help them survive in the desert.','Camels have eyelashes.','Camels are my favorite animal.'], h:'Cover everything in one idea.'},
{q:'What order should a summary follow?', o:['the same order as the original','random order','most exciting first'], h:'Keep the original order.'},
],
check:[
{p:'The Pony Express carried mail between Missouri and California in 1860 and 1861. Riders changed horses every 10 to 15 miles and delivered letters in about ten days. It ended when the telegraph line was finished.', q:'Best summary sentence?', o:['The Pony Express carried mail across the West in about ten days until the telegraph replaced it.','Riders changed horses.','The Pony Express was cool.']},
{q:'Which belongs in a summary?', o:['the main problem and how it ends','the color of a character’s shirt','what you would have done']},
{p:'longway', t:'write', q:'Read "The Long Way Home." Write a summary paragraph of 3 to 5 sentences in your own words.', min:35, checks:['I named the main character and his problem.','I told the main events in order.','I left out my opinion and small details.']},
]},
'WRIT.ESSAY.L07.01': {name:'State a claim with reasons',
teach:[
{how:'A claim is a statement people could argue about. A fact can be proven.', q:'Which is a claim?', o:['Every middle school should teach a trade.','Baltimore is in Maryland.','A foot has 12 inches.']},
{how:'Good reasons explain WHY the claim is right.', q:'Claim: "Students should keep a budget." Best reason?', o:['A budget helps you save for things you really want.','Budgets are on paper.','My friend has a budget.']},
{how:'A strong claim is clear and specific.', q:'Which claim is clearest?', o:['Our school should add a 20-minute reading period every day.','Reading is kind of good.','Stuff should change.']},
],
practice:[
{q:'Which is a fact, not a claim?', o:['Water freezes at 32°F.','Winter is the best season.','Schools should start later.'], h:'Which one can be proven?'},
{q:'Claim: "The school should start a woodshop." Which reason is strongest?', o:['Students learn measuring and planning skills they will use for life.','Wood smells nice.','I want to use a saw.'], h:'Which reason helps everyone, not just you?'},
{q:'Which claim is clear and specific?', o:['The town should build a bike path along the river by next summer.','Things in town are bad.','Bikes exist.'], h:'What, where, when.'},
{q:'Which reason does NOT support "Students should learn to cook"?', o:['Kitchens have windows.','Cooking teaches measuring and fractions.','Knowing how to cook helps you stay healthy.'], h:'Which one has nothing to do with the claim?'},
{q:'Which is a claim?', o:['Homework should be limited to one hour a night.','Homework is given in school.','Some students do homework.'], h:'Could someone disagree?'},
{q:'Claim: "Every shop should have a first-aid kit." Best reason?', o:['Small injuries can be treated right away.','Kits are white.','Tape is sticky.'], h:'Why does it matter?'},
],
check:[
{q:'Which is a claim?', o:['Our yeshiva should hold a monthly chesed day.','Our yeshiva has a gym.','June has 30 days.']},
{q:'Claim: "Students should earn Tashbar dollars for mastering skills." Best reason?', o:['Rewards for real progress can motivate students to keep learning.','Dollars are green.','Money is paper.']},
{t:'write', q:'Write a claim about something you think should change in school or your community. Give two reasons that support it.', min:40, checks:['My claim is something people could argue about.','I gave two reasons.','Each reason explains WHY.']},
]},
'WRIT.ESSAY.L07.02': {name:'Quote evidence and explain it',
teach:[
{how:'Evidence backs your claim. Quote the exact words, inside quotation marks.', q:'Which correctly quotes the text?', o:['The article says, "Over 100,000 vehicles cross it every day."','The article says over 100,000 vehicles cross it every day."','The article says, Over 100,000 vehicles cross it every day.']},
{how:'After the quote, explain how it proves your claim.', q:'Claim: The Brooklyn Bridge is still important. Quote: "Over 100,000 vehicles cross it every day." Best explanation?', o:['This shows that huge numbers of people still depend on the bridge.','This is a quote.','Bridges are made of steel.']},
{how:'Introduce a quote with a lead-in, such as "According to the article,".', q:'Which is the best lead-in?', o:['According to the article,','Quote:','Here is words:']},
],
practice:[
{p:'railroad', q:'Claim: The railroad changed travel. Best evidence?', o:['"After the railroad, the same trip took about a week."','"Building it was brutal work."','"In 1869, workers drove a final spike."'], h:'Which quote is about travel?'},
{q:'Claim: Sharp tools are safer. Quote: "A dull saw needs more force, so it can slip." Best explanation?', o:['This shows that dull tools can cause accidents, so keeping tools sharp is a safety rule.','This sentence is about saws.','Saws are sharp.'], h:'Connect the quote back to the claim.'},
{q:'Which is punctuated correctly?', o:['Mr. Adler said, "A good joint will make it stronger."','Mr. Adler said "a good joint will make it stronger".','Mr. Adler said, a good joint will make it stronger.'], h:'Comma, quotation marks, capital, period inside.'},
{q:'What is the job of the explanation after a quote?', o:['to show how the quote proves the claim','to repeat the quote','to change the topic'], h:'Why did you pick this quote?'},
{p:'longway', q:'Claim: Pinchas showed kindness. Best evidence?', o:['"He stopped, turned around and jogged back."','"Pinchas was the fastest runner in his grade."','"That afternoon, the menahel handed out the awards."'], h:'Which quote shows him helping?'},
{q:'Which is the WEAKEST explanation of a quote?', o:['This quote is good.','This shows Pinchas gave up winning to help someone in need.','This proves he cared more about Hillel than the race.'], h:'Which one doesn’t explain anything?'},
],
check:[
{p:'bridge', q:'Claim: Washington Roebling was determined. Best evidence?', o:['"He watched through a telescope from his window and sent instructions every day."','"The work was dangerous."','"The Brooklyn Bridge opened in 1883."']},
{q:'Which is punctuated correctly?', o:['The manual says, "Always wear safety glasses."','The manual says "always wear safety glasses"','The manual says, Always wear safety glasses.']},
{p:'bridge', t:'write', q:'Claim: The Brooklyn Bridge was a great achievement. Write 3 to 5 sentences: state the claim, quote one piece of evidence from the passage, and explain how it proves the claim.', min:40, checks:['I stated the claim.','I quoted exact words in quotation marks.','I explained how the quote proves the claim.']},
]},
'LANG.GRAM.L08.01': {name:'Clauses and complex sentences',
teach:[
{how:'An independent clause can stand alone. A dependent clause cannot; it starts with words like because, when, although or if.', q:'Which is a dependent clause?', o:['because the glue was wet','the glue was wet','we waited']},
{how:'A complex sentence has one independent clause and at least one dependent clause.', q:'Which is a complex sentence?', o:['When the bell rang, we went to Mincha.','The bell rang.','The bell rang, and we went to Mincha.']},
{how:'When the dependent clause comes first, put a comma after it.', q:'Which is punctuated correctly?', o:['If it rains, the trip will move to Monday.','If it rains the trip, will move to Monday.','If, it rains the trip will move to Monday.']},
],
practice:[
{q:'Which is the independent clause in "Although the board was long, it fit in the car"?', o:['it fit in the car','Although the board was long','the board'], h:'Which part can stand alone?'},
{q:'Which word starts a dependent clause?', o:['because','and','the'], h:'And joins two independent clauses.'},
{q:'Combine with "because": "We stayed inside. It was snowing."', o:['We stayed inside because it was snowing.','Because we stayed inside it was snowing.','We stayed inside, it was snowing because.'], h:'Because goes before the reason.'},
{q:'Which is a complex sentence?', o:['Since the saw was dull, Eli sharpened it.','Eli sharpened the saw.','The saw was dull, so Eli sharpened it.'], h:'Look for since, because, when, if.'},
{q:'Which is punctuated correctly?', o:['After we finished, we cleaned the shop.','After we finished we, cleaned the shop.','After, we finished we cleaned the shop.'], h:'The comma goes after the dependent clause.'},
{q:'Which is a dependent clause?', o:['until the paint dries','the paint dries','wait'], h:'It can’t stand alone.'},
],
check:[
{q:'Which is a complex sentence?', o:['Before he cut the board, Avi checked his measurement.','Avi checked his measurement.','Avi checked his measurement, and he cut the board.']},
{q:'Combine with "when": "The light turns green. The battery is charged."', o:['When the light turns green, the battery is charged.','The light turns green when, the battery is charged.','When the light turns green the battery, is charged.']},
{q:'Which word starts a dependent clause?', o:['although','but','or']},
]},
'WRIT.ESSAY.L08.02': {name:'Answer a counterclaim',
teach:[
{how:'A counterclaim is the other side’s view. Naming it makes your argument stronger.', q:'Claim: "School should start at 9:00." Which is a counterclaim?', o:['Some people say a later start would make the day end too late.','School should start at 9:00.','Sleep helps students learn.']},
{how:'A rebuttal answers the counterclaim with a reason or evidence.', q:'Counterclaim: "Woodshop is too dangerous." Best rebuttal?', o:['With safety training, a license for each tool and an adult supervising, the risk is small.','Woodshop is fun.','Some people don’t like wood.']},
{how:'Use phrases like "Some people argue…" and "However, …".', q:'Which sentence introduces a counterclaim?', o:['Some people argue that phones help students learn.','Phones are made of glass.','In conclusion, phones are bad.']},
],
practice:[
{q:'Claim: "Students should earn Tashbar dollars for mastering skills." Which is a counterclaim?', o:['Some people worry students will care about money more than learning.','Tashbar dollars are fun.','Students like rewards.'], h:'What would someone on the other side say?'},
{q:'Best rebuttal to "Pay will make students care only about money"?', o:['Pay only comes from real mastery, so the only way to earn is to learn.','Money is good.','Students should work.'], h:'Answer the worry with a reason.'},
{q:'Which word often starts a rebuttal?', o:['However','Firstly','Because'], h:'It turns back to your side.'},
{q:'Why include a counterclaim?', o:['It shows you understand the other side and makes your argument stronger.','It makes the essay longer.','It changes your claim.'], h:'Think about convincing a reader.'},
{q:'Counterclaim: "Electives take time away from core subjects." Best rebuttal?', o:['Trades electives use math and reading every day, so they support core skills.','Electives are nice.','Core subjects are hard.'], h:'Show the elective helps the core.'},
{q:'Which is NOT a counterclaim to "We need a new library"?', o:['Libraries hold books.','Some say most people read online now.','Others argue the money should fix the roads.'], h:'Which one doesn’t argue against it?'},
],
check:[
{q:'Claim: "Homework should be limited." Which is a counterclaim?', o:['Some people say homework helps students practice skills.','Homework should be limited.','Students are busy.']},
{q:'Best rebuttal to "A school garden costs too much"?', o:['Seeds and soil are cheap, and the garden can sell produce to cover its costs.','Gardens are green.','Some people like gardens.']},
{t:'write', q:'Claim: "Middle schools should offer a trades class." Write 3 to 5 sentences: give one counterclaim and a rebuttal that answers it.', min:40, checks:['I stated a counterclaim fairly.','I answered it with a reason or evidence.','I used phrases like "Some people argue" and "However."']},
]},
'WRIT.RES.L09.01': {name:'Find and judge sources',
teach:[
{how:'Reliable sources have a known expert author or organization and are up to date.', q:'Which source is most reliable for facts about bridges?', o:['A university engineering department website','An anonymous comment','An ad for car insurance']},
{how:'Check the date. For facts that change, newer is better.', q:'You need Baltimore’s population today. Which source?', o:['Recent U.S. Census data','A 1990 almanac','A novel set in Baltimore']},
{how:'Watch for bias: is the source trying to sell or persuade?', q:'Which source is most likely biased about a drill?', o:['The drill company’s ad','A consumer testing report','A government safety notice']},
],
practice:[
{q:'Which website ending belongs to a U.S. government agency?', o:['.gov','.com','.biz'], h:'gov = government.'},
{q:'Which is the best source for a report on volcanoes?', o:['A national geological survey website','A social media post','A video game'], h:'Who are the experts?'},
{q:'Why is a source with no author less reliable?', o:['You can’t check who wrote it or whether he is an expert.','It is shorter.','It has more pictures.'], h:'Who stands behind it?'},
{q:'Two sources disagree. What should you do?', o:['Check a third reliable source.','Use the one you like.','Leave the topic out.'], h:'Break the tie.'},
{q:'Which is a primary source about the Brooklyn Bridge opening?', o:['A newspaper article printed the day it opened in 1883','A 2020 encyclopedia article','A modern travel blog'], h:'Primary = from the time it happened.'},
{q:'Which source is most up to date on bike helmet laws?', o:['The state government’s current website','A 1998 magazine','A friend’s opinion'], h:'Laws change. Find the official, current one.'},
],
check:[
{q:'Which is most reliable for facts about tornadoes?', o:['The National Weather Service website','An anonymous forum','A movie about storms']},
{q:'Which source is most likely biased?', o:['A company website selling the product','A university study','A government report']},
{q:'Which is a primary source?', o:['A soldier’s letter written during the war','A textbook chapter about the war','A website summary of the war']},
]},
'WRIT.RES.L09.02': {name:'Paraphrase and cite',
teach:[
{how:'Paraphrasing means saying the idea in your own words and your own sentence shape. Changing one or two words is still copying.', p:'Original: "Honey almost never spoils because germs cannot grow in it."', q:'Which is the best paraphrase?', o:['Germs can’t live in honey, so it lasts a very long time.','Honey almost never spoils because germs cannot grow in it.','Honey almost never goes bad because germs cannot grow in it.']},
{how:'Even a paraphrase needs a citation: say where the idea came from.', q:'Which sentence includes a citation?', o:['According to the National Park Service, the Liberty Bell is in Philadelphia.','The Liberty Bell is in Philadelphia.','I think the Liberty Bell is in Philadelphia.']},
{how:'Use quotation marks only when you copy exact words.', q:'You copy five words exactly from a source. You must:', o:['put them in quotation marks and cite the source','change one word','leave out the source']},
],
practice:[
{p:'Original: "The Erie Canal cut shipping costs by about 90 percent."', q:'Which is the best paraphrase?', o:['Shipping became roughly ten times cheaper after the Erie Canal opened.','The Erie Canal cut shipping costs by about 90 percent.','The Erie Canal cut shipping prices by about 90 percent.'], h:'Change the sentence shape, not just one word.'},
{q:'What is plagiarism?', o:['using someone else’s words or ideas without credit','citing a source','writing your own ideas'], h:'Credit matters.'},
{p:'Original: "Bees pollinate about one-third of the crops we eat."', q:'Which is the best paraphrase?', o:['Roughly a third of our food crops depend on bees to pollinate them.','Bees pollinate about one-third of the crops we eat.','Bees pollinate about a third of the crops we eat.'], h:'Rebuild the sentence.'},
{q:'Which is a correct short citation?', o:['(National Weather Service, 2024)','[the internet]','(I read it)'], h:'Name the source and year.'},
{q:'When should you cite a source?', o:['whenever you use its facts, ideas or words','only for exact quotes','never in a short report'], h:'Ideas count too.'},
{p:'Original: "Glaciers carve valleys as they slowly move downhill."', q:'Which is the best paraphrase?', o:['As glaciers creep down slopes, they cut out valleys.','Glaciers carve valleys as they slowly move downhill.','Glaciers carve valleys as they slowly go downhill.'], h:'New words and new order.'},
],
check:[
{p:'Original: "Lightning heats the air to about 50,000 degrees Fahrenheit."', q:'Which is the best paraphrase?', o:['A lightning bolt can make the air around it roughly 50,000°F.','Lightning heats the air to about 50,000 degrees Fahrenheit.','Lightning warms the air to about 50,000 degrees Fahrenheit.']},
{q:'Which needs a citation?', o:['a statistic you found in an article','your own opinion','a story about your own day']},
{q:'Which sentence uses a source correctly?', o:['According to NASA, sunlight takes about 8 minutes to reach Earth.','Sunlight takes about 8 minutes to reach Earth, I copied this.','Sunlight takes about 8 minutes, trust me.']},
]},
'WRIT.ESSAY.L09.01': {name:'Business writing',
teach:[
{how:'A business letter has a greeting, a clear purpose in the first sentence, details, and a polite closing.', q:'Best first sentence for a letter to a lumber store?', o:['I am writing to ask for a price on ten pine boards for our school shop.','Hi! What’s up?','Wood is great.']},
{how:'Use a polite, professional tone. No slang.', q:'Which closing is professional?', o:['Thank you for your help. Sincerely, Avi Gold, Tashbar Trades Co.','Later!','Bye, from me.']},
{how:'Be specific: what, how many, when.', q:'Which request is clearest?', o:['Please deliver 10 pine boards, 1 × 8 × 8 feet, by Friday, November 20.','Please send some wood soon.','We need stuff for shop.']},
],
practice:[

const RI=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const PICK=a=>a[Math.floor(Math.random()*a.length)];
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
function fracStr(n,d){ if(d<0){n=-n;d=-d} const g=gcd(n,d); n/=g; d/=g; if(d===1) return String(n);
const neg=n<0; n=Math.abs(n); const w=Math.floor(n/d), r=n%d; return (neg?'-':'')+(w?w+' ':'')+r+'/'+d; }
function money(c){ return '$'+(c/100).toFixed(2); }
function uniq(list){ const out=[]; for(const x of list){ if(!out.includes(x)) out.push(x); } return out; }
function opts(correct, distract){ const o=uniq([correct, ...distract.filter(x=>x!==correct)]); while(o.length<3) o.push(String(Number(o[o.length-1])+1 || o.length)); return o.slice(0,3); }
const N=(q,a,h,extra)=>Object.assign({t:'num',q,a,h},extra||{});
const M=(q,o,h)=>({q,o,h});

how:['To add, add the tens, then the ones: 47 + 28 → 60 + 15 = 75.','To subtract, take away the tens, then the ones: 83 − 25 → 63 − 5 = 58.','Check subtraction by adding back: 58 + 25 = 83.'],
gen(){ if(Math.random()<.5){ const a=RI(12,68), b=RI(11,99-a); return N(`${a} + ${b} = ?`, a+b, 'Add the tens first, then add the ones.'); }
const a=RI(31,99), b=RI(11,a-6); return N(`${a} − ${b} = ?`, a-b, 'Take away the tens, then the ones. Regroup a ten if you need more ones.'); }},
'MATH.PV.L03.01': {name:'Read, write and compare numbers to 1,000',
how:['Each digit has a place: 482 = 4 hundreds, 8 tens, 2 ones.','To compare, look at the hundreds first. If they match, look at the tens.','> means greater than. < means less than. The open side faces the bigger number.'],
gen(){ const k=RI(0,2);
if(k===0){ const n=RI(102,989); const pl=PICK(['hundreds','tens','ones']); const d={hundreds:Math.floor(n/100),tens:Math.floor(n/10)%10,ones:n%10}[pl]; return N(`What digit is in the ${pl} place of ${n}?`, d, 'Hundreds is the first digit, tens the middle, ones the last.'); }
if(k===1){ const h=RI(1,9),t=RI(0,9),o=RI(0,9); return N(`${h} hundreds, ${t} tens and ${o} ones make what number?`, h*100+t*10+o, 'Write the hundreds digit, then the tens, then the ones.'); }
let a=RI(100,999), b=Math.random()<.15?a:RI(100,999); if(Math.random()<.4){ b=Math.floor(a/100)*100+RI(0,99); }
const s=a>b?'>':a<b?'<':'='; return M(`Which sign goes in the box? ${a} ☐ ${b}`, [s,...['>','<','='].filter(x=>x!==s)], 'Compare the hundreds, then the tens, then the ones.'); }},
'MATH.OPS.L03.02': {name:'Add and subtract within 1,000 with regrouping',
how:['Line up ones under ones, tens under tens, hundreds under hundreds.','Adding: when a column makes 10 or more, carry 1 to the next column.','Subtracting: when the top digit is too small, borrow 1 from the next column.'],
gen(){ if(Math.random()<.5){ const a=RI(118,689), b=RI(105,980-a); return N(`${a} + ${b} = ?`, a+b, 'Start with the ones. Carry when a column reaches 10.'); }
const a=RI(305,990), b=RI(108,a-50); return N(`${a} − ${b} = ?`, a-b, 'Start with the ones. Borrow from the next column when the top digit is smaller.'); }},
'MATH.MEAS.L03.04': {name:'Count money and make change',
how:['A quarter is 25¢, a dime is 10¢, a nickel is 5¢, a penny is 1¢.','Count the biggest coins first, then add the smaller ones.','Change = what you paid − the price. $1 = 100¢.'],
gen(){ if(Math.random()<.5){ const q=RI(0,3),d=RI(0,4),n=RI(0,3),p=RI(0,4); if(q+d+n+p===0) return this.gen(); return N(`How many cents? ${q} quarters, ${d} dimes, ${n} nickels, ${p} pennies`, q*25+d*10+n*5+p, 'Quarters 25¢ each, dimes 10¢, nickels 5¢, pennies 1¢.', {unit:'¢'}); }
const item=PICK(['pencil','eraser','ruler','pack of nails','sticker']); const pr=RI(1,19)*5; return N(`A ${item} costs ${pr}¢. You pay with $1. How much change, in cents?`, 100-pr, '$1 is 100¢. Subtract the price from 100.', {unit:'¢'}); }},

'MATH.FRAC.L05.01': {name:'Equivalent fractions and comparing fractions',
how:['Multiply the top and bottom by the same number to get an equal fraction: 2/3 = 4/6.','To compare, give both fractions the same bottom number.','With the same bottom, the bigger top is the bigger fraction.'],
gen(){ if(Math.random()<.5){ const b=RI(2,6), a=RI(1,b-1), k=RI(2,5); const c=`${a*k}/${b*k}`; const ds=[`${a+k}/${b+k}`,`${a*k}/${b*k+1}`,`${a*k+1}/${b*k}`,`${a}/${b*k}`].filter(x=>{const [p,q]=x.split('/').map(Number);return p*b!==a*q}); return M(`Which fraction is equal to ${a}/${b}?`, opts(c,ds), `Multiply ${a} and ${b} by the same number.`); }
let b1=RI(2,8), a1=RI(1,b1-1), b2=RI(2,8), a2=RI(1,b2-1); const L=a1*b2, R=a2*b1; const s=L>R?'>':L<R?'<':'='; return M(`Which sign goes in the box? ${a1}/${b1} ☐ ${a2}/${b2}`, [s,...['>','<','='].filter(x=>x!==s)], `Rename both with ${b1*b2} on the bottom, then compare the tops.`); }},

const a=RI(2,d), b=RI(1,a-1); return N(`${a}/${d} − ${b}/${d} = ?`, (a-b)/d, `Subtract the tops: ${a} − ${b}. Keep ${d} on the bottom.`, {kind:'frac'}); }},
'MATH.ALG.L07.02': {name:'Ratios and unit rates',
how:['A unit rate is "per one": the cost of ONE item, miles in ONE hour.','Divide the total by the number of items: $4.50 ÷ 6 pens = $0.75 per pen.','Use unit rates to compare deals: the lower price per item is the better buy.'],
gen(){ const k=RI(0,2);
if(k===0){ const n=RI(3,9), u=RI(3,40)*5; const item=PICK(['pens','screws (per pack)','notebooks','pine boards','clamps']); return N(`${n} ${item} cost ${money(n*u)}. What is the cost of 1? (in dollars)`, u/100, `Divide ${money(n*u)} by ${n}.`, {unit:'$'}); }
if(k===1){ const h=RI(2,6), s=RI(9,14)*5; return N(`A bus travels ${h*s} miles in ${h} hours. How many miles per hour?`, s, `Divide ${h*s} by ${h}.`); }
const a=RI(3,8), ua=RI(20,60), b=a+RI(2,6), ub=ua+PICK([-6,-3,3,6]); const better=ua<ub?`${a} for ${money(a*ua)}`:`${b} for ${money(b*ub)}`; const worse=ua<ub?`${b} for ${money(b*ub)}`:`${a} for ${money(a*ua)}`; return M(`Which is the better buy? ${a} for ${money(a*ua)} or ${b} for ${money(b*ub)}`, [better,worse,'They cost the same per item'], 'Find the price of ONE in each deal.'); }},

how:['8 + ? = 13: count up from 8 to 13. That is 5.','Fact family: 5 + 8 = 13, 8 + 5 = 13, 13 '+'−'+' 8 = 5, 13 '+'−'+' 5 = 8.','Subtraction undoes addition.'],
gen(){ const a=RI(2,9), b=RI(2,9), k=RI(0,2); if(k===0) return N(`${a} + ? = ${a+b}`, b, `Count up from ${a} to ${a+b}.`); if(k===1) return N(`? + ${b} = ${a+b}`, a, `${a+b} ${MI} ${b} = ?`); return N(`${a+b} ${MI} ? = ${a}`, b, `What do you add to ${a} to get back to ${a+b}?`); }},
'MATH.OPS.L02.02':{name:'Subtract within 20',
how:['15 '+'−'+' 7: think 7 + ? = 15. The answer is 8.','Or take apart: 15 '+'−'+' 5 = 10, then 10 '+'−'+' 2 = 8.','Check: add your answer back and see if you get the start.'],
gen(){ const a=RI(11,20), b=RI(2,9); return N(`${a} ${MI} ${b} = ?`, a-b, `Think addition: ${b} + ? = ${a}.`); }},
'MATH.OPS.L02.07':{name:'Add three numbers',
how:['4 + 6 + 3: find a ten first: 4 + 6 = 10, then 10 + 3 = 13.','Look for a double: 5 + 2 + 5 = 10 + 2.','You can add in any order.'],
gen(){ const a=RI(1,9), b=RI(1,9), c=RI(1,Math.max(1,20-a-b)); return N(`${a} + ${b} + ${c} = ?`, a+b+c, 'Find two that make 10, or a double, then add the third.'); }},
'MATH.OPS.L02.08':{name:'Balance scale: true or false',
how:['The = sign means both sides are worth the same.','6 + 2 = 5 + 3 is true: both sides are 8.','7 = 7 is true. 4 + 1 = 6 is false.'],
gen(){ const a=RI(1,9), b=RI(1,9), s=a+b, c=RI(1,Math.min(9,s-1)); const tru=Math.random()<.5, d=tru?s-c:s-c+PICK([-1,1]); return MX(`True or false?  ${a} + ${b} = ${c} + ${Math.max(0,d)}`, [tru||Math.max(0,d)===s-c?'True':'False', tru||Math.max(0,d)===s-c?'False':'True'], 'Work out each side. Are they the same number?'); }},
'MATH.OPS.L02.09':{name:'Story problems within 20',
how:['Read the story. Is something added, taken away, or compared?','Gets more, comes, joins: add. Gives away, eats, leaves: subtract.','"How many more" means find the difference.'],
gen(){ const [x,y]=two(), k=RI(0,3), a=RI(6,12), b=RI(2,8);
if(k===0) return N(`${x} has ${a} marbles. He gets ${b} more. How many marbles does he have now?`, a+b, 'He gets more, so add.');
if(k===1) return N(`${x} had ${a+b} pretzels. He gave ${b} to ${y}. How many are left?`, a, 'He gave some away, so subtract.');
if(k===2) return N(`${x} has ${a+b} stickers. ${y} has ${a}. How many more stickers does ${x} have?`, b, 'Compare: subtract the smaller from the bigger.');
return N(`There were some pencils in a cup. ${x} put in ${b} more. Now there are ${a+b}. How many were there at first?`, a, `Something + ${b} = ${a+b}. Count back ${b}.`); }},
'MATH.PV.L02.01':{name:'Tens and ones',
how:['46 is 4 tens and 6 ones.','The left digit tells the tens; the right digit tells the ones.','3 tens and 0 ones is 30.'],
gen(){ const t=RI(1,9), o=RI(0,9), pic='\u{1F51F}'.repeat(t)+(o?'  '+'\u{1F7E1}'.repeat(o):''); if(Math.random()<.5) return N(`${t} tens and ${o} ones make what number?`, 10*t+o, 'Write the tens digit, then the ones digit.', {pic}); return N(`How many tens are in ${10*t+o}?`, t, 'The left digit is the tens.'); }},
'MATH.PV.L02.02':{name:'Alligator signs',
how:['> means greater than. < means less than. = means the same.','Compare the tens first: 52 > 47 because 5 tens beats 4 tens.','If the tens match, compare the ones.'],
gen(){ const a=RI(10,99), b=Math.random()<.15?a:RI(10,99); const s=a>b?'>':a<b?'<':'='; return MX(`Which sign goes in the box?   ${a} □ ${b}`, [s].concat(['>','<','='].filter(x=>x!==s)), 'Compare the tens first, then the ones. The open mouth faces the bigger number.'); }},
'MATH.PV.L02.03':{name:'10 more and 10 less',
how:['10 more than 34 is 44: the tens go up by one.','10 less than 61 is 51: the tens go down by one.','The ones digit stays the same.'],
gen(){ const n=RI(11,89); if(Math.random()<.5) return N(`10 more than ${n} is ?`, n+10, 'Add one to the tens digit.'); return N(`10 less than ${n} is ?`, n-10, 'Take one from the tens digit.'); }},
'MATH.OPS.L02.10':{name:'Add tens and ones',
how:['34 + 5: add the ones: 4 + 5 = 9, so 39.','34 + 20: add the tens: 3 tens + 2 tens = 5 tens, so 54.','Tens go with tens, ones go with ones.'],
gen(){ const n=RI(21,69); if(Math.random()<.5){ const o=RI(1,9); return N(`${n} + ${o} = ?`, n+o, 'Add the ones. If they make 10 or more, the tens go up.'); } const t=RI(1,Math.floor((99-n)/10))*10; return N(`${n} + ${t} = ?`, n+t, 'Add the tens only. The ones stay the same.'); }},
'MATH.OPS.L02.11':{name:'Subtract tens',
how:['70 '+'−'+' 30: 7 tens take away 3 tens is 4 tens: 40.','It works like 7 '+'−'+' 3, with tens.','The answer always ends in 0.'],
gen(){ const a=RI(2,9), b=RI(1,a); return N(`${a*10} ${MI} ${b*10} = ?`, (a-b)*10, `Think ${a} ${MI} ${b}, then make it tens.`); }},
'MATH.MEAS.L02.01':{name:'Measure with units',
how:['Lay same-size blocks end to end, with no gaps and no overlaps.','Count the blocks: that is the length.','Start at the very end of the object.'],
gen(){ if(Math.random()<.3) return MX('When you measure with blocks, the blocks must…',['Touch, with no gaps or overlaps','Have gaps between them','Be different sizes'],'Gaps or overlaps make the count wrong.'); const n=RI(3,9); return N('The pencil is as long as this row of blocks. How many blocks long is it?', n, 'Count every block in the row.', {pic:'✏️'.repeat(1)+'\n'+'\u{1F7E9}'.repeat(n)}); }},
'MATH.MEAS.L02.02':{name:'Clock to the half hour',
how:['The short hand shows the hour. The long hand shows the minutes.','Long hand on 12: o’clock, like 3:00.','Long hand on 6: half past, like 3:30.'],
gen(){ const h=RI(1,12), half=Math.random()<.5, t=`${h}:${half?'30':'00'}`, cp=(half?0x1F55C:0x1F550)+h-1; return MX('What time does the clock show?', three(t,[`${h%12+1}:${half?'30':'00'}`,`${h}:${half?'00':'30'}`,`${(h+10)%12+1}:00`]), 'Short hand = hour. Long hand on 12 = :00, on 6 = :30.', {pic:String.fromCodePoint(cp)}); }},
'MATH.MEAS.L02.03':{name:'Coins',
how:['Penny 1¢, nickel 5¢, dime 10¢, quarter 25¢.','A dime is small but worth more than a nickel.','Count the biggest coins first: 10, 20, 25, 26.'],
gen(){ const k=RI(0,2); if(k===0){ const C=[['penny',1],['nickel',5],['dime',10],['quarter',25]], [c,v]=PICK(C); return N(`How many cents is a ${c} worth?`, v, 'Penny 1, nickel 5, dime 10, quarter 25.', {unit:'¢'}); }
if(k===1){ const C=[['10 cents','Dime',['Nickel','Penny']],['25 cents','Quarter',['Dime','Nickel']],['5 cents','Nickel',['Dime','Penny']],['1 cent','Penny',['Nickel','Dime']]], [q,r,w]=PICK(C); return MX(`Which coin is worth ${q}?`,[r].concat(w),'Penny 1, nickel 5, dime 10, quarter 25.'); }
const d=RI(0,3), n=RI(0,3), p=RI(1,4); return N(`${d} dimes, ${n} nickels and ${p} pennies. How many cents?`, d*10+n*5+p, 'Count by tens for dimes, by fives for nickels, then by ones.', {unit:'¢'}); }},
'MATH.STAT.L02.01':{name:'Picture graphs',
how:['Each picture stands for one.','Count each row to read the graph.','How many more: subtract the smaller row from the bigger row.'],
gen(){ const a=RI(3,8), b=RI(1,a-1), c=RI(1,7), pic=`\u{1F34E} | ${'\u{1F34E}'.repeat(a)}\n\u{1F350} | ${'\u{1F350}'.repeat(b)}\n\u{1F34B} | ${'\u{1F34B}'.repeat(c)}`; const k=RI(0,2);
if(k===0) return N('How many more apples than pears?', a-b, 'Count both rows, then subtract.', {pic}); if(k===1) return N('How many pieces of fruit in all?', a+b+c, 'Add all three rows.', {pic}); return N('How many lemons?', c, 'Count the lemon row.', {pic}); }},
'MATH.GEO.L02.01':{name:'Shape rules',
how:['A shape is named by its sides and corners.','Color and size do not change the shape.','A big red triangle and a tiny blue triangle are both triangles.'],
gen(){ if(Math.random()<.35) return MX('A big red triangle and a tiny blue triangle. Are they both triangles?',['Yes: both have 3 sides and 3 corners','No: their colors are different','No: their sizes are different'],'Only sides and corners decide the shape.');
const S=[['triangle',3],['square',4],['rectangle',4],['pentagon',5],['hexagon',6]], [s,n]=PICK(S); return N(`How many corners does a ${s} have?`, n, `A ${s} has ${n} sides, and the same number of corners.`); }},
'MATH.GEO.L02.02':{name:'Halves and quarters',
how:['Halves: 2 equal parts. Quarters (fourths): 4 equal parts.','The parts must be the same size.','2 halves make a whole. 4 quarters make a whole.'],
gen(){ const Q=[['A circle is cut into 4 equal parts. Each part is a…','Quarter',['Half','Whole']],['A rectangle is cut into 2 equal parts. Each part is a…','Half',['Quarter','Third']],['A challah is cut into 2 pieces, one big and one small. Are they halves?','No: halves must be equal',['Yes: there are 2 pieces','Yes: any 2 pieces are halves']]];
if(Math.random()<.35){ const w=PICK([['halves',2],['quarters',4]]); return N(`How many ${w[0]} make one whole?`, w[1], 'Count the equal parts in a whole.'); } const [q,r,w]=PICK(Q); return MX(q,[r].concat(w),'Halves = 2 equal parts. Quarters = 4 equal parts.'); }},
'MATH.OPS.L03.03':{name:'Fact flash within 20',
how:['Facts you know by heart make big math fast.','Use doubles and make-ten to get there quickly.','Subtraction: think of the matching addition fact.'],
gen(){ const a=RI(2,9), b=RI(2,9); return Math.random()<.5?N(`${a} + ${b} = ?`, a+b, 'Make ten or use a double.'):N(`${a+b} ${MI} ${b} = ?`, a, `Think: ${b} + ? = ${a+b}.`); }},
'MATH.NUM.L03.01':{name:'Odd or even',
how:['Even numbers make pairs with none left over: 8 = 4 pairs.','Odd numbers have one left over: 7 = 3 pairs and 1.','Look at the ones digit: 0, 2, 4, 6, 8 are even.'],
gen(){ const n=RI(1,60), r=n%2?'Odd':'Even'; return MX(`Is ${n} odd or even?`, [r, r==='Odd'?'Even':'Odd'], 'Look at the ones digit. 0, 2, 4, 6, 8 mean even.', n<=12?{pic:'\u{1F45F}'.repeat(n)}:undefined); }},
'MATH.OPS.L03.04':{name:'Rows of chairs: arrays',
how:['An array is rows with the same number in each row.','3 rows of 4: 4 + 4 + 4 = 12.','You can count rows or columns: the total is the same.'],
gen(){ const r=RI(2,5), c=RI(2,5), row='\u{1F36A}'.repeat(c), pic=Array(r).fill(row).join('\n'); if(Math.random()<.6) return N(`${r} rows of ${c} cookies. How many cookies in all?`, r*c, `Add ${c} again and again: ${Array(r).fill(c).join(' + ')}.`, {pic}); return N(`${Array(r).fill(c).join(' + ')} = ?`, r*c, 'Add them one at a time, or skip count.'); }},
'MATH.PV.L03.02':{name:'Hundreds, tens and ones',
how:['352 is 3 hundreds, 5 tens and 2 ones.','A zero holds a place: 507 has 0 tens.','10 tens make 1 hundred.'],
gen(){ const h=RI(1,9), t=RI(0,9), o=RI(0,9), n=100*h+10*t+o; const k=RI(0,2); if(k===0) return N(`${h} hundreds, ${t} tens and ${o} ones make what number?`, n, 'Write hundreds, then tens, then ones.'); if(k===1) return N(`How many hundreds are in ${n}?`, h, 'The first digit of a 3-digit number is the hundreds.'); return N(`How many tens are in the tens place of ${n}?`, t, 'The middle digit is the tens.'); }},
'MATH.NUM.L03.02':{name:'Skip count by 5s, 10s and 100s',
how:['By 5s: 5, 10, 15, 20: the ones go 5, 0, 5, 0.','By 10s: 30, 40, 50: the tens go up.','By 100s: 300, 400, 500: the hundreds go up.'],
gen(){ const s=PICK([5,10,100]), a=RI(1,s===100?5:12)*s; return N(`Skip count by ${s}s: ${a}, ${a+s}, ${a+2*s}, ?`, a+3*s, `Add ${s} more.`); }},
'MATH.PV.L03.03':{name:'Expanded form',
how:['Stretch a number out: 463 = 400 + 60 + 3.','Each part shows what its digit is really worth.','Squeeze it back: 700 + 20 + 8 = 728.'],
gen(){ const h=RI(1,9), t=RI(1,9), o=RI(1,9), n=100*h+10*t+o; if(Math.random()<.5) return N(`${h*100} + ${t*10} + ${o} = ?`, n, 'Put each digit in its place: hundreds, tens, ones.'); return N(`${n} = ${h*100} + ? + ${o}`, t*10, `The tens digit is ${t}, so it is worth ${t*10}.`); }},
'MATH.PV.L03.04':{name:'Jump 10 or 100 in your head',
how:['100 more than 345 is 445: only the hundreds change.','10 less than 602 is 592: borrow from the hundreds.','Find which digit moves, then change just that one.'],
gen(){ const n=RI(120,880), s=PICK([10,100]); if(Math.random()<.5) return N(`${s} more than ${n} is ?`, n+s, `Only the ${s===100?'hundreds':'tens'} digit goes up.`); return N(`${s} less than ${n} is ?`, n-s, `Only the ${s===100?'hundreds':'tens'} digit goes down.`); }},
'MATH.OPS.L03.05':{name:'Column climb: add up to four numbers',
how:['Line the numbers up: tens over tens, ones over ones.','Add the ones column first, carry a ten if needed.','Then add the tens column.'],
gen(){ const k=RI(3,4), xs=Array.from({length:k},()=>RI(11,39)); return N(`${xs.join(' + ')} = ?`, xs.reduce((a,b)=>a+b,0), 'Add the ones first, carry the tens, then add the tens.'); }},
'MATH.OPS.L03.06':{name:'Two-step stories',
how:['Some stories have two steps. Do them one at a time.','First find what happened first. Then use that answer for step two.','Check: does your answer make sense in the story?'],
gen(){ const [x,y]=two(), k=RI(0,2);
if(k===0){ const a=RI(30,60), b=RI(5,20), c=RI(5,25); return N(`${x} had ${a} stickers. He gave ${b} to ${y}, then got ${c} more. How many does he have now?`, a-b+c, `Step 1: ${a} ${MI} ${b}. Step 2: add ${c}.`); }
if(k===1){ const a=RI(20,40), b=RI(10,30), c=RI(5,20); return N(`The shelf had ${a} seforim. ${b} more came. Then ${c} went to the beis medrash. How many are on the shelf now?`, a+b-c, `Step 1: ${a} + ${b}. Step 2: take away ${c}.`); }
const a=RI(12,30), b=RI(5,15); return N(`${x} read ${a} pages. ${y} read ${b} more pages than ${x}. How many pages did they read together?`, a+a+b, `${y} read ${a} + ${b}. Then add both boys' pages.`); }},
'MATH.MEAS.L03.01':{name:'Inches and centimeters',
how:['Line the end of the object up with 0 on the ruler.','Read the number at the other end.','An inch is about 2 and a half centimeters, so 1 inch is longer than 1 cm.'],
gen(){ const k=RI(0,2); if(k===0){ const p=RI(1,3); return N('The arrow points to how many inches?', p, 'Count the big numbered marks from 0.', {tape:p}); }
if(k===1) return MX(PICK(['Which unit is best for measuring a pencil?','Which unit is best for measuring a paper clip?']),['Centimeters','Kilometers','Miles'],'Use small units for small things.');
return MX('Which is longer?',['1 inch','1 centimeter'],'An inch is about 2 and a half centimeters.'); }},
'MATH.MEAS.L03.02':{name:'How much longer?',
how:['To compare lengths, subtract: 45 cm '+'−'+' 28 cm = 17 cm.','To join lengths, add them.','Keep the same unit all the way through.'],
gen(){ const [x]=two(), a=RI(30,90), b=RI(10,a-5); if(Math.random()<.5) return N(`One rope is ${a} cm. Another is ${b} cm. How many cm longer is the first rope?`, a-b, 'Subtract the shorter from the longer.'); return N(`${x}'s string is ${a} inches. He cuts off ${b} inches. How long is it now?`, a-b, 'Cutting off means subtract.'); }},
'MATH.MEAS.L03.03':{name:'Time to 5 minutes',
how:['The long hand counts by 5s: on the 1 it is 5 minutes, on the 4 it is 20.','The short hand shows the hour it just passed.','a.m. is morning, p.m. is afternoon and evening.'],
gen(){ const k=RI(0,2); if(k===0){ const n=RI(1,11); return N(`The long hand points to ${n}. How many minutes after the hour is it?`, n*5, `Count by 5s up to ${n}.`); }
if(k===1){ const h=RI(1,12), n=RI(1,11), mm=String(n*5).padStart(2,'0'); return MX(`The short hand is just past ${h}. The long hand points to ${n}. What time is it?`, three(`${h}:${mm}`,[`${n}:${String(h*5%60).padStart(2,'0')}`,`${h%12+1}:${mm}`,`${h}:${String(n).padStart(2,'0')}`]), 'Hour from the short hand. Minutes: long hand number times 5.'); }
const E=[['Shacharis at 8:00 in the morning','a.m.'],['Supper at 6:00 in the evening','p.m.'],['Mincha at 1:30 in the afternoon','p.m.'],['Waking up at 7:00 in the morning','a.m.']], [q,r]=PICK(E); return MX(`${q} is…`,[r, r==='a.m.'?'p.m.':'a.m.'],'Morning is a.m. After 12 noon is p.m.'); }},
'MATH.STAT.L03.01':{name:'Bar graphs',
how:['Each square in the bar stands for one.','Read each bar by counting its squares.','Compare bars by subtracting.'],
gen(){ const D=['Sun','Mon','Tue','Wed','Thu'], v=D.map(()=>RI(1,8)), pic=D.map((d,i)=>`${d} ${'\u{1F7E6}'.repeat(v[i])}`).join('\n'); let i=RI(0,4), j=RI(0,4); while(j===i) j=RI(0,4); if(v[i]<v[j]) [i,j]=[j,i];
const k=RI(0,2); if(k===0) return N(`Pages learned each day. How many more pages on ${D[i]} than on ${D[j]}?`, v[i]-v[j], 'Count both bars, then subtract.', {pic}); if(k===1) return N(`Pages learned each day. How many pages on ${D[i]} and ${D[j]} together?`, v[i]+v[j], 'Count both bars, then add.', {pic});
const mx=Math.max(...v), days=D.filter((d,x)=>v[x]===mx); return MX('Pages learned each day. Which day had the most?', three(days[0], D.filter(d=>!days.includes(d))), 'Find the longest bar.', {pic}); }},
'MATH.GEO.L03.01':{name:'Sides, corners, rows and columns',
how:['Triangle 3 sides, square and rectangle 4, pentagon 5, hexagon 6.','A square has 4 equal sides and 4 square corners.','A rectangle cut into 3 rows of 4 squares has 12 squares.'],
gen(){ const k=RI(0,2); if(k===0){ const S=[['pentagon',5],['hexagon',6],['triangle',3],['quadrilateral',4]], [s,n]=PICK(S); return N(`How many sides does a ${s} have?`, n, 'tri = 3, quad = 4, penta = 5, hexa = 6.'); }
if(k===1){ const r=RI(2,4), c=RI(2,5); return N(`A rectangle is split into ${r} rows and ${c} columns of equal squares. How many squares?`, r*c, `${r} rows of ${c}: add ${c} ${r} times.`, {pic:Array(r).fill('\u{1F7E8}'.repeat(c)).join('\n')}); }
return MX('Which shape has 4 equal sides and 4 square corners?',['Square','Long rectangle','Triangle'],'Equal sides and square corners: that is a square.'); }}

Object.assign(GEN, MK8);
/* ===== Each boy's own lineup (TL-037). The server sends st.place.MATH.path = Blueprint skills from his placement onward.
His build shows 4 skills at a time from that path; beat the boss and the next 4 open. No placement = the old band (WEEK). ===== */
const TL_WIN=4;
const TL_ALIAS={'MATH.MEAS.L03.01':'MATH.MEAS.L03.04','MATH.RAT.L07.01':'MATH.ALG.L07.02','MATH.RAT.L07.02':'MATH.ALG.L08.02','MATH.ALG.L07.01':'MATH.ALG.L07.04','MATH.FUN.L09.01':'MATH.ALG.L09.01','MATH.FUN.L09.02':'MATH.FUNC.L09.02','MATH.ALG.L09.01':'MATH.ALG.L09.04'};
function tlPath(st,c){ const p=st&&st.place&&st.place[c]; if(!p||!Array.isArray(p.path)) return null; const P=p.path.filter(id=>GEN[id]||BANK_ALL[id]); return P.length?P:null; }
function tlWindow(st,c){ const P=tlPath(st,c); if(!P) return null; const w=(st.win||{})[c]; let i=w&&w.stamp===st.place[c].stamp?P.indexOf(w.start):0;
if(i<0){ const all=st.place[c].path, j=all.indexOf(w.start); i=j<0?0:Math.max(0,P.findIndex(id=>all.indexOf(id)>=j)); } return P.slice(i,i+TL_WIN); }
function tlApplyPlace(st,r){
if(st.idv!==2){ ['skills','fails'].forEach(k=>{ const o=st[k]||{}, n={}; Object.keys(o).forEach(id=>{ n[TL_ALIAS[id]||id]=o[id]; }); st[k]=n; });
const f=st.fallback||{}; Object.keys(f).forEach(c=>{ if(f[c]) f[c]=TL_ALIAS[f[c]]||f[c]; }); st.idv=2; }
st.place=(r&&r.place)||null; st.win=st.win||{}; st.boss=st.boss||{};
if(st.place) Object.keys(st.place).forEach(c=>{ const p=st.place[c]; if(!p||!p.path) return; const w=st.win[c];
if(!w||w.stamp!==p.stamp){ st.win[c]={stamp:p.stamp,start:p.start}; st.boss[c]=false; } });
}
function tlAdvance(st){ if(!st||!st.place) return; let moved=false;
Object.keys(st.place).forEach(c=>{ const P=tlPath(st,c); if(!P) return; const win=tlWindow(st,c);
if(st.boss[c]&&win.length&&win.every(id=>mastered(st,id))){ const i=P.indexOf(win[win.length-1])+1; if(i<P.length){ st.win[c]={stamp:st.place[c].stamp,start:P[i]}; st.boss[c]=false; st.builds=(st.builds||0)+1; moved=true; } } });
if(moved){ saveStudent(st); toast('The road ahead is open! Your next skills are ready.'); } }
function tlFindLevelCard(st){ if(!st||(st.place&&st.place.MATH)) return '';
return `<div class="tlfind"><span class="tli" aria-hidden="true">\u{1F9ED}</span><div class="tlt"><b>Find your math level</b><small>A quick check of a few questions. Then your own math lineup is ready.</small></div><button class="btn big" type="button" onclick="tlFindLevel()">Start</button></div>`; }
function tlFindLevel(){ try{ sessionStorage.setItem('tl-check',JSON.stringify({token:SRV.token,at:Date.now()})); }catch(e){}

/* v212 SAVE QUEUE (developer2@ / Claude, 2026-11-15), for 500 boys at once. Takes over the v71 Wi-Fi retry in Helpers.html
   (that one stands down when window.TL_SAVEQ is set), so there is ONE save system:
   - one save at a time per page; saves asked for meanwhile ride on the next one (always his latest state + every answer row);
   - a failed save puts its answer rows back and tries again after about 3, 7, 15, 30, 60 s, then every 2 min while he is signed in,
     each wait spread at random so 500 Chromebooks do not all knock at the same second; right away when the Wi-Fi comes back;
   - callers get onDone(r) once: on success, or onDone(null) after the second failure (the retries go on quietly);
   - signing out or a page change with rows still unsent: the rows wait on this Chromebook (localStorage) and go with his next save.

const SVQ={busy:false,dirty:false,cbs:[],att:0,timer:null,st:null};
window.TL_SAVEQ=true;
function svKey(id){ return 'tl-pend-'+id; }
function svStash(id,ev){ try{ if(!ev||!ev.length) return; const k=svKey(id), old=JSON.parse(localStorage.getItem(k)||'[]'); localStorage.setItem(k,JSON.stringify(old.concat(ev).slice(-300))); }catch(e){} }
function svUnstash(id){ try{ const k=svKey(id), v=JSON.parse(localStorage.getItem(k)||'[]'); localStorage.removeItem(k); return Array.isArray(v)?v:[]; }catch(e){ return []; } }
function svReset(){ if(SVQ.timer){ clearTimeout(SVQ.timer); SVQ.timer=null; } const cb=SVQ.cbs.splice(0); SVQ.busy=false; SVQ.dirty=false; SVQ.att=0; SVQ.st=null; cb.forEach(f=>{ try{ f(null); }catch(e){} }); }
function saveStudent(st,onDone){
if(SVQ.st&&SVQ.st.id!==st.id) svReset();
SVQ.st=st; if(onDone) SVQ.cbs.push(onDone);

if(SVQ.timer){ clearTimeout(SVQ.timer); SVQ.timer=null; }
svGo();
}
function svGo(){
const st=SVQ.st; if(!st){ SVQ.busy=false; return; }
SVQ.busy=true; SVQ.dirty=false;
const cbs=SVQ.cbs.splice(0), token=SRV.token;
const had=Object.prototype.hasOwnProperty.call(SRV.states,st.id), prev=SRV.states[st.id];
const prevLen=((prev||{}).ledger||[]).length;
const bank=st.ledger.slice(0,Math.max(0,st.ledger.length-prevLen)).slice(0,10);
const ev=svUnstash(st.id).concat(SRV.pendingEv.splice(0));
SRV.states[st.id]=clone(st);
run('msSave',token,st.id,clone(st),ev,bank).then(r=>{
if(r&&typeof r.balance==='number'){ st.balance=r.balance; if(Array.isArray(r.ledger)) st.ledger=r.ledger; SRV.states[st.id]=clone(st); }
SVQ.att=0; SVQ.busy=false; cbs.forEach(cb=>{ try{ cb(r); }catch(e){ console.error(e); } });
if(SVQ.dirty&&SVQ.st===st&&SRV.token===token) svGo();
}).catch(e=>{
SVQ.busy=false;
if(SRV.token!==token||SVQ.st!==st){ svStash(st.id,ev); cbs.forEach(cb=>{ try{ cb(null); }catch(x){} }); return; }
SRV.pendingEv=ev.concat(SRV.pendingEv); if(had) SRV.states[st.id]=prev; else delete SRV.states[st.id];

else SVQ.cbs=cbs.concat(SVQ.cbs);
const base=[3000,7000,15000,30000,60000][SVQ.att-1]||120000;
SVQ.timer=setTimeout(()=>{ SVQ.timer=null; if(SRV.token===token&&SVQ.st===st&&!SVQ.busy) svGo(); },base*(0.7+Math.random()*0.6));
});
}

if(a==='signin') return pinGo();
if(a==='sound'){ SND.on=!SND.on; return render(); }
if(a==='signout'){ try{ if(A.st) svStash(A.st.id,SRV.pendingEv.splice(0)); svReset(); }catch(e){} if(window.TashbarSound) TashbarSound.signOut(); A.view='signin'; A.who=null; A.pin=''; A.st=null; A.play=null; A.res=null; A.overlay=null; SRV.token=null; SRV.states={}; SRV.pendingEv=[]; return render(); }
if(a==='reset') return overlay(`<div class="oe">🔄</div><h2>Start ${esc(A.st.name)} over?</h2><p>This clears the progress on this device.</p><button class="btn go big" data-act="reset-yes">Start over</button> <button class="btn big" data-act="closeov">Cancel</button>`);
if(a==='locked'){ SND.wrong(); return toast('Finish the glowing one first. Each skill builds on the last.'); }
if(a==='start') return startMission(b.dataset.c,b.dataset.id,'skill');
if(a==='boss') return startMission(b.dataset.c,null,'boss');
if(a==='retry') return startMission(A.res.c,A.res.id,'retry');
if(a==='tohub'){ A.drop=A.res&&A.res.dropKey; A.view='hub'; A.overlay=null; render(); scrollTo(0,0); if(A.drop===undefined) A.drop=null; return; }
if(a==='quit') return overlay(`<div class="oe">🚪</div><h2>Leave this mission?</h2><p>Your answers in this mission won’t be saved.</p><button class="btn go big" data-act="closeov">Keep playing</button> <button class="btn big" data-act="quit-yes">Leave</button>`);
if(a==='quit-yes'){ A.overlay=null; A.view='hub'; A.play=null; render(); return; }
const p=A.play; if(!p) return; const it=p.items[p.i];
if(a==='pick') return answer(it.shown[+b.dataset.k],b);
if(a==='tile'){ p.order.push(+b.dataset.k); SND.tap(); p.fb=null; return render(); }
if(a==='untile'){ p.order.splice(+b.dataset.j,1); return render(); }
if(a==='ordercheck') return answer(p.order.map(k=>it.shown[k]).join(' '));
if(a==='submitwrite'){ const w=(p.text.trim().match(/\S+/g)||[]).length; if(w<it.min) return toast(`Write at least ${it.min} words. You have ${w}.`); if(it.checks.some((c,k)=>!p.ticks[k])) return toast('Tick each box when your writing does it.'); return answer(p.text); }
if(a==='next') return next();
if(window.TLT&&TLT.acts[a]) return TLT.acts[a]();
});
document.addEventListener('change',e=>{ const t=e.target; if(t.dataset&&t.dataset.act==='tick'&&A.play){ A.play.ticks[+t.dataset.k]=t.checked; if(t.checked){ SND.tap(); burst(t,['#45E0A0','#F5BF2E'],10); } } });
document.addEventListener('input',e=>{ if(e.target.id==='wr'&&A.play){ const p=A.play, it=p.items[p.i]; p.text=e.target.value; const w=(p.text.trim().match(/\S+/g)||[]).length, pct=Math.min(100,Math.round(w/it.min*100));
const f=document.getElementById('wfill'), c=document.getElementById('wct'); if(f){ const was=f.classList.contains('full'); f.style.width=pct+'%'; f.classList.toggle('full',pct>=100); if(pct>=100&&!was){ SND.right(2); burst(f,['#45E0A0','#F5BF2E'],16); } } if(c) c.textContent=`${w} of ${it.min} words${w>=it.min?' · nice!':''}`; } });
document.addEventListener('submit',e=>{ if(e.target.dataset.act==='numform'){ e.preventDefault(); const v=document.getElementById('numin').value; if(v.trim()) answer(v.trim()); } });
document.addEventListener('keydown',e=>{
if(A.overlay&&(e.key==='Enter'||e.key==='Escape')){ e.preventDefault(); A.overlay=null; render(); return; }
if(A.view==='signin'&&!A.staffUrl){ if(/^[0-9]$/.test(e.key)) pinKey(e.key); else if(e.key==='Backspace'){ A.pin=A.pin.slice(0,-1); render(); } else if(e.key==='Enter'){ e.preventDefault(); pinGo(); } return; }
if(A.view!=='play'||!A.play) return; const p=A.play, it=p.items[p.i]; const tag=(e.target.tagName||'').toLowerCase();
if(tag==='textarea'||tag==='input') return;
const locked=p.fb&&(p.fb.ok||it.phase==='check');
if(locked&&e.key==='Enter'){ e.preventDefault(); next(); return; }
if(it.t==='mc'&&!locked&&/^[1-4]$/.test(e.key)){ const k=+e.key-1; const o=it.shown[k]; if(o!==undefined) answer(o,document.querySelector(`.opt[data-k="${k}"]`)); }
});
function pinKey(n){ if(A.pin.length>=4||A.busy) return; A.pin+=n; SND.t(520+A.pin.length*130,.09,'triangle',0,.12); A.err=''; render(); const dot=document.querySelectorAll('.dots2 i')[A.pin.length-1]; dot&&burst(dot,['#FDE047','#F472B6','#60A5FA','#34D399'],10); }
function pinGo(){
if(A.pin.length===4&&!A.busy){ A.busy=true; render(); const pin=A.pin;
run('msSignInCode',pin).then(r=>{
if(!r||!r.ok){ A.busy=false; SND.wrong(); A.err='That code didn’t work. Try again.'; A.pin=''; return render(); }
SRV.token=r.token;
if(r.role==='parent') return tlToParent(r.token,r.url);
if(r.role==='staff') return toStaff(r.token);
if(window.TashbarSound) TashbarSound.signIn('ms',r.token);
return run('msLoad',r.token).then(d=>{
SRV.states=d.states||{}; const me=(d.roster||[]).find(x=>x.id===r.sid)||{id:r.sid,name:r.name};
if(!ROSTER.some(x=>x.id===me.id)) ROSTER.push({id:me.id,name:me.name});
A.busy=false; A.pin=''; SND.win(); A.st=loadStudent(me); if(A.st.day.d!==today()) A.st.day={d:today(),n:0}; A.session=0; bumpStreak(A.st); A.view='hub'; render(); welcome(); setTimeout(()=>window.TLT&&TLT.notes(),2500);
});
}).catch(e=>{ A.busy=false; A.pin=''; A.err='Can’t reach the school. Check the Wi-Fi and try again.'; render(); });
} }
function tlToParent(token,url){ try{ sessionStorage.setItem('tl-session',JSON.stringify({role:'parent',sid:null,at:Date.now(),token:token})); }catch(e){}
 var go=function(u){ A.busy=false; try{ window.open(u+'?pp=1','_top'); }catch(e){} render(); };
 if(url||window.TL_APP_URL) return Promise.resolve(go(url||window.TL_APP_URL));
 return run('msAppUrl').then(go).catch(function(){ A.busy=false; A.pin=''; A.err='Signed in, but the parent page did not open. Try again.'; render(); }); }
function toStaff(token){
try{ sessionStorage.setItem('tl-session',JSON.stringify({role:'staff',sid:null,at:Date.now(),token})); }catch(e){}
return run('msAppUrl').then(u=>{ A.busy=false; A.staffUrl=u+'?sg=1'; try{ window.open(u+'?sg=1','_top'); }catch(e){}; render(); })
.catch(()=>{ A.busy=false; A.pin=''; A.err='Signed in, but the teacher page didn’t open. Try again.'; render(); });
}
function tlPhotoTools(){ return window.TLT?TLT.tools():''; }
function tlLoadTools(){ run('msQuestTools').then(t=>{ if(t&&t.css){ const s=document.createElement('style'); s.textContent=t.css; document.head.appendChild(s); } if(t&&t.js){ try{ (0,eval)(t.js); }catch(e){ console.error('QuestTools',e); } } if(A.view==='play'||A.view==='hub'||A.view==='result') render(); }).catch(e=>console.error('QuestTools',e)); }
function boot(){
run('msBootstrap').then(b=>{ ROSTER=(b.students||[]); A.bootErr=false; render(); if(!window.TLT) tlLoadTools(); })
.catch(()=>{ A.bootErr=true; render(); setTimeout(boot,15000); });
}
document.documentElement.setAttribute('data-theme','bright');
render(); boot();
render();
</script>
</body>
</html>
