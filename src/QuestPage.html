<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tashbar Learning · Middle School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{
--sky1:#BFD8FF; --sky2:#EEF4FF; --ink:#1B2140; --soft:#4B5578; --card:#FFFFFF; --card2:#F4F7FF; --line:#D3DCF0;
--amber:#F2A516; --amber-ink:#7A4E00; --mint:#139A64; --mint-l:#DDF6EA; --rose:#C9432E; --rose-l:#FFE7E1;
--coin:#F5BF2E; --coin-d:#C98A00; --math:#3B7BF0; --read:#0F9E8B; --writ:#DD6A24; --voc:#A0682F; --boss:#7A4BE6;
--glow:rgba(242,165,22,.55); --shadow:0 10px 30px rgba(27,33,64,.14); --win:#FFE7A3;
--display:'Fredoka',ui-rounded,'Segoe UI',system-ui,sans-serif; --body:'Andika','Segoe UI',system-ui,sans-serif;
box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
--sky1:#12173A; --sky2:#262E66; --ink:#F2F4FF; --soft:#B8C0E0; --card:#1D2452; --card2:#252D63; --line:#36407D;
--amber:#FFB547; --amber-ink:#FFD58C; --mint:#45E0A0; --mint-l:#173D31; --rose:#FF8E7A; --rose-l:#43231F;
--math:#7FA8FF; --read:#4FD8C3; --writ:#FF9B5E; --voc:#D9A774; --boss:#B49BFF; --glow:rgba(255,181,71,.6);
--shadow:0 12px 34px rgba(0,0,0,.4); --win:#FFD86B; color-scheme:dark}}
:root[data-theme="dark"]{
--sky1:#12173A; --sky2:#262E66; --ink:#F2F4FF; --soft:#B8C0E0; --card:#1D2452; --card2:#252D63; --line:#36407D;
--amber:#FFB547; --amber-ink:#FFD58C; --mint:#45E0A0; --mint-l:#173D31; --rose:#FF8E7A; --rose-l:#43231F;
--math:#7FA8FF; --read:#4FD8C3; --writ:#FF9B5E; --voc:#D9A774; --boss:#B49BFF; --glow:rgba(255,181,71,.6);
--shadow:0 12px 34px rgba(0,0,0,.4); --win:#FFD86B; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--sky2)}
html,body{overflow-x:hidden}
html,body{margin:0;min-height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:linear-gradient(180deg,var(--sky1),var(--sky2) 70%);background-attachment:fixed;color:var(--ink);font:18px/1.5 var(--body);
padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:1160px;margin:0 auto;padding-block:12px 60px}
.btn{border:0;border-radius:16px;padding:14px 22px;font:600 19px var(--display);background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.go{background:var(--amber);color:#2B1A00;box-shadow:0 5px 0 var(--coin-d)}
.btn.go:active{box-shadow:0 1px 0 var(--coin-d)}
.btn.big{font-size:23px;padding:18px 30px;border-radius:20px}
.btn.ghost{background:transparent;box-shadow:none;padding:8px 12px}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
.icon-btn{border:0;background:var(--card);border-radius:14px;width:46px;height:46px;font-size:21px;box-shadow:0 3px 0 var(--line);display:grid;place-items:center}
.signin{min-height:92vh;display:grid;place-items:center;text-align:center;padding-block:20px}
.logo-word{font:700 clamp(46px,9vw,92px)/.95 var(--display);letter-spacing:-.01em;color:var(--ink)}
.logo-word span{display:block;font-size:.42em;color:var(--amber);letter-spacing:.02em;margin-top:6px}
.signin .sub{color:var(--soft);margin:14px 0 26px}
.who-grid{display:grid;grid-template-columns:repeat(4,minmax(120px,150px));gap:14px;justify-content:center}
@media (max-width:640px){.who-grid{grid-template-columns:repeat(2,1fr)}}
.who{border:0;background:var(--card);border-radius:22px;padding:18px 10px 14px;box-shadow:0 6px 0 var(--line);display:grid;gap:8px;justify-items:center;font:600 20px var(--display)}
.who:hover{transform:translateY(-3px)}
.av{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font:700 28px var(--display);color:#fff;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
.pinbox{background:var(--card);border-radius:28px;padding:26px;box-shadow:var(--shadow);width:min(380px,100%);margin:0 auto}
.pindots{display:flex;gap:14px;justify-content:center;margin:16px 0 20px}
.pindots i{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);transition:all .15s}
.pindots i.on{background:var(--amber);border-color:var(--amber);transform:scale(1.15)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pinpad button{border:0;border-radius:18px;background:var(--card2);font:600 28px var(--display);padding:14px 0;box-shadow:0 4px 0 var(--line)}
.pinpad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.err{color:var(--rose);font-weight:700;min-height:1.5em;margin-top:10px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 0 16px}
.tools{display:flex;gap:8px}
@media (max-width:640px){.top .xpbar{order:5;min-width:100%}}
.me{display:flex;align-items:center;gap:12px;flex:1;min-width:230px}
.me .av{width:54px;height:54px;font-size:24px}
.me h2{font-size:24px}
.rank{font:600 15px var(--display);color:var(--soft)}
.lvl{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 8px;border-radius:12px;background:var(--boss);color:#fff;font:700 17px var(--display)}
.xpbar{flex:1;min-width:200px;max-width:340px}
.xpbar .lab{display:flex;justify-content:space-between;font:600 14px var(--display);color:var(--soft)}
.track{height:16px;border-radius:99px;background:var(--card);box-shadow:inset 0 2px 4px rgba(0,0,0,.12);overflow:hidden}
.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--boss),#E35BD8);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.wallet{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:8px 16px 8px 10px;box-shadow:0 4px 0 var(--line)}
.coin{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF1B8,var(--coin) 45%,var(--coin-d));display:grid;place-items:center;font:700 13px var(--display);color:#6B4300;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.wallet b{font:700 26px var(--display)}
.wallet.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.15)}}
.hub{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:20px;align-items:start}
@media (max-width:860px){.hub{grid-template-columns:minmax(0,1fr)}}
.hub>*,.lower>*{min-width:0}
.panel{background:var(--card);border-radius:26px;padding:18px;box-shadow:var(--shadow)}
.build h3{font-size:22px}
.build .cap{color:var(--soft);font-size:16px;margin-top:2px}
.build svg{width:100%;height:auto;display:block;margin-top:8px}
.goal{display:flex;align-items:center;gap:14px;margin-top:14px;padding:12px;border-radius:18px;background:var(--card2)}
.goal svg{width:58px;height:58px;flex:none}
.goal b{font:600 18px var(--display);display:block}
.goal span{color:var(--soft);font-size:15px}
.nextup{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(120deg,var(--amber),#FF8A3D);color:#2B1A00;border-radius:26px;padding:18px 22px;box-shadow:var(--shadow);margin-bottom:18px}
.nextup .t{flex:1;min-width:200px}
.nextup small{font:600 15px var(--display);opacity:.8}
.nextup h2{font-size:26px}
.nextup .btn{background:#2B1A00;color:#FFE7A3;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.worlds{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.world{background:var(--card);border-radius:24px;padding:16px 18px;box-shadow:var(--shadow);border-left:8px solid var(--wc)}
.world .wh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.world .wh h3{font-size:21px}
.world .wh span{color:var(--soft);font-size:15px}
.path{display:flex;align-items:center;gap:0;margin-top:12px;overflow-x:auto;padding:6px 4px 8px}
.node{flex:none;width:62px;height:62px;border-radius:50%;border:0;display:grid;place-items:center;font:700 22px var(--display);position:relative;background:var(--card2);color:var(--soft);box-shadow:0 4px 0 var(--line)}
.node.done{background:var(--wc);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.node.now{background:var(--card);color:var(--wc);border:4px solid var(--wc);animation:beckon 1.6s ease-in-out infinite}
@keyframes beckon{0%,100%{box-shadow:0 0 0 0 var(--glow)}50%{box-shadow:0 0 0 12px rgba(0,0,0,0)}}
.node.locked{opacity:.55;cursor:default}
.node.boss{width:72px;height:72px;font-size:30px;border-radius:22px}
.node.boss.now{border-color:var(--boss);color:var(--boss)}
.node.boss.done{background:var(--boss)}
.node .stars{position:absolute;bottom:-12px;font-size:12px;letter-spacing:-1px;color:var(--amber)}
.link{flex:1;min-width:16px;height:6px;background:var(--line);border-radius:3px}
.link.done{background:var(--wc)}
.node-label{font-size:14px;color:var(--soft);margin-top:10px}
.node-label b{color:var(--ink)}
.lower{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
@media (max-width:860px){.lower{grid-template-columns:1fr}}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.badge{text-align:center;padding:10px 4px;border-radius:18px;background:var(--card2);font-size:13px;color:var(--soft)}
.badge .bi{font-size:32px;display:block;filter:grayscale(1);opacity:.35}
.badge.got{background:var(--win);color:#3A2600}
.badge.got .bi{filter:none;opacity:1}
.ledger{margin-top:10px;display:grid;gap:6px;font-size:16px}
.ledger div{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:12px;background:var(--card2)}
.ledger b{color:var(--mint);font-family:var(--display)}
.foot{color:var(--soft);font-size:14px;text-align:center;margin-top:26px}
.foot button{background:none;border:0;color:var(--soft);text-decoration:underline;font-size:14px}
.blk.empty rect{fill:none;stroke:var(--line);stroke-width:2.5;stroke-dasharray:6 5}
.blk.next rect,polygon.next{stroke:var(--amber);animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-22}}
.blk.drop{animation:drop .9s cubic-bezier(.3,1.5,.5,1) both}
@keyframes drop{0%{transform:translateY(-220px);opacity:0}60%{opacity:1}100%{transform:none}}
.twinkle{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.win-glow{animation:winglow 2.6s ease-in-out infinite}
@keyframes winglow{50%{opacity:.6}}
.play{min-height:100vh;padding-bottom:30px;position:relative}
.play::before{content:attr(data-icon);position:fixed;right:-40px;bottom:-60px;font-size:340px;opacity:.09;pointer-events:none;z-index:-1;transform:rotate(-12deg)}
.ptop{display:flex;align-items:center;gap:12px;padding:10px 0}
.ptop .t{flex:1;min-width:0}
.ptop .t small{font:600 15px var(--display);color:var(--wc)}
.ptop .t b{display:block;font:600 21px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.combo{font:700 18px var(--display);color:var(--amber);min-width:84px;text-align:right;transition:transform .2s}
.combo.bump{transform:scale(1.35)}
.xpgain{font:700 17px var(--display);background:var(--card);border-radius:12px;padding:6px 12px;box-shadow:0 3px 0 var(--line)}
.trail{display:flex;gap:6px;align-items:flex-end;margin:4px 0 18px}
.seg{flex:1;display:grid;gap:5px}
.seg .sl{font:600 13px var(--display);color:var(--soft);display:flex;gap:6px;align-items:center}
.seg.cur .sl{color:var(--ink)}
.pips{display:flex;gap:4px}
.pip{flex:1;height:14px;border-radius:7px;background:var(--card);box-shadow:inset 0 2px 3px rgba(0,0,0,.12);transition:background .3s}
.pip.ok{background:var(--mint)}
.pip.miss{background:var(--rose)}
.pip.cur{background:var(--amber);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.stage{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;max-width:880px;margin:0 auto}
.stage.withp{grid-template-columns:minmax(260px,1fr) minmax(320px,1.15fr);max-width:1160px}
@media (max-width:860px){.stage.withp{grid-template-columns:minmax(0,1fr)}}
.stage>*{min-width:0}
.passage{background:var(--card);border-radius:24px;padding:18px 20px;box-shadow:var(--shadow);max-height:70vh;overflow:auto}
.passage h3{font-size:20px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.passage .pt{margin-top:10px;font-size:19px;line-height:1.7}
.qcard{background:var(--card);border-radius:28px;padding:22px;box-shadow:var(--shadow);position:relative;border-top:8px solid var(--wc)}
.how{background:var(--card2);border-radius:18px;padding:12px 16px;margin-bottom:16px;border-left:6px solid var(--amber)}
.how b{font:600 15px var(--display);color:var(--amber-ink)}
.qrow{display:flex;gap:10px;align-items:flex-start}
.qtext{font:600 clamp(22px,2.6vw,28px)/1.35 var(--display);flex:1}
.qtext.pre{font-family:ui-monospace,Consolas,monospace;font-size:20px;white-space:pre-wrap}
.say{border:0;background:var(--card2);border-radius:12px;width:44px;height:44px;font-size:19px;flex:none}
.opts{display:grid;gap:12px;margin-top:20px}
.opt{border:0;text-align:left;border-radius:18px;padding:16px 18px;background:var(--card2);box-shadow:0 5px 0 var(--line);font:500 20px/1.35 var(--body);display:flex;gap:14px;align-items:center;transition:transform .1s,background .2s}
.opt:hover:not([disabled]){transform:translateY(-2px)}
.opt .k{flex:none;width:34px;height:34px;border-radius:10px;background:var(--card);display:grid;place-items:center;font:700 16px var(--display);color:var(--soft)}
.opt.right{background:var(--mint);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.opt.right .k{background:rgba(255,255,255,.25);color:#fff}
.opt.miss{background:var(--rose-l);color:var(--rose);opacity:.8}
.opt.reveal{outline:3px dashed var(--mint);outline-offset:-3px}
.opt[disabled]{cursor:default}
.numrow{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.numin{flex:1;min-width:160px;border:3px solid var(--line);border-radius:18px;background:var(--card2);color:var(--ink);font:600 28px var(--display);padding:12px 16px}
.numin.ok{border-color:var(--mint)}
.go2.signbtn{width:100%;border:0;cursor:pointer}.go2.signbtn:disabled{opacity:.45;cursor:default}
.tiles,.built{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;min-height:56px}
.built{padding:10px;border-radius:18px;border:3px dashed var(--line)}
.tile{border:0;border-radius:14px;padding:12px 16px;background:var(--card2);box-shadow:0 4px 0 var(--line);font:500 19px var(--body)}
.tile.on{background:var(--wc);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
textarea.area{width:100%;margin-top:16px;border:3px solid var(--line);border-radius:18px;background:var(--card2);color:var(--ink);font:19px/1.6 var(--body);padding:14px;resize:vertical}
.meter{margin-top:10px}
.meter .track{height:14px}
.meter .fill{background:linear-gradient(90deg,var(--writ),var(--amber))}
.meter .fill.full{background:var(--mint)}
.meter small{font:600 15px var(--display);color:var(--soft)}
.checks{display:grid;gap:8px;margin-top:14px}
.chk{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:14px;background:var(--card2);font-size:17px;cursor:pointer}
.chk input{width:24px;height:24px;accent-color:var(--mint)}
.fb{margin-top:18px;border-radius:18px;padding:14px 16px;font-size:18px;animation:slidein .25s ease-out}
@keyframes slidein{from{transform:translateY(8px);opacity:0}}
.fb.good{background:var(--mint-l);color:var(--mint)}
.fb.good b{font:700 22px var(--display)}
.fb.hint{background:var(--win);color:#3A2600}
.fb.hint b{font:600 17px var(--display)}
.fb.miss{background:var(--rose-l);color:var(--rose)}
.nextbtn{margin-top:18px;width:100%}
.keys{text-align:center;color:var(--soft);font-size:14px;margin-top:12px}
.tape{margin-top:14px;overflow-x:auto}
.tape svg{width:100%;min-width:480px;height:auto}
.tape .tb{fill:#F7D24A;stroke:#B48A00;stroke-width:2}.tape .tk{stroke:#3A2A00;stroke-width:1.6}.tape .tn{font:700 16px var(--display);fill:#3A2A00}.tape .arr{fill:#D62E1F}.tape .arrl{stroke:#D62E1F;stroke-width:2.5}
.bosshp{display:flex;gap:6px;margin:6px 0 16px}
.bosshp i{flex:1;height:22px;border-radius:6px;background:linear-gradient(180deg,#9C7BFF,var(--boss));box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);transition:all .35s}
.bosshp i.gone{background:var(--card);box-shadow:inset 0 2px 3px rgba(0,0,0,.15);transform:scaleY(.6)}
.bossname{display:flex;align-items:center;gap:12px;font:700 22px var(--display);color:var(--boss)}
.bossname .bf{font-size:40px;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.bossname.hit .bf{animation:hit .35s}
@keyframes hit{30%{transform:translateX(-8px) rotate(-8deg)}60%{transform:translateX(6px) rotate(6deg)}}
.overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;background:rgba(10,14,40,.55);backdrop-filter:blur(4px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.ocard{background:var(--card);border-radius:30px;padding:30px 26px;text-align:center;max-width:460px;width:100%;box-shadow:var(--shadow);animation:zoom .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes zoom{from{transform:scale(.7);opacity:0}}
.ocard .oe{font-size:64px;line-height:1}
.ocard h2{font-size:30px;margin:10px 0 8px}
.ocard p{color:var(--soft);margin-bottom:20px}
.ring-txt{font:700 34px var(--display)}
.result{max-width:640px;margin:0 auto;text-align:center;padding-top:16px}
.stamp{display:inline-block;font:700 clamp(40px,8vw,64px)/1 var(--display);color:var(--mint);border:6px solid var(--mint);border-radius:22px;padding:10px 26px;transform:rotate(-6deg);animation:stamp .5s cubic-bezier(.3,1.7,.5,1) both}
.stamp.soft{color:var(--amber);border-color:var(--amber)}
.stamp.boss{color:var(--boss);border-color:var(--boss)}
@keyframes stamp{from{transform:rotate(-6deg) scale(2.6);opacity:0}}
.result .msg{color:var(--soft);font-size:20px;margin:18px auto 0;max-width:30em}
.bigstars{font-size:54px;margin-top:14px;letter-spacing:6px}
.bigstars span{display:inline-block;opacity:.18;filter:grayscale(1)}
.bigstars span.lit{animation:starin .45s cubic-bezier(.3,1.8,.5,1) both;opacity:1;filter:none}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}}
.pay{background:var(--card);border-radius:24px;padding:16px 20px;box-shadow:var(--shadow);margin-top:22px;text-align:left}
.pay .pl{display:flex;justify-content:space-between;padding:8px 0;font-size:19px;opacity:0;transform:translateX(-12px);transition:all .35s}
.pay .pl.in{opacity:1;transform:none}
.pay .pl b{font:700 21px var(--display);color:var(--coin-d)}
.pay .tot{border-top:2px dashed var(--line);margin-top:6px;padding-top:12px}
.pay .tot b{font-size:28px;color:var(--mint)}
.res-xp{margin-top:18px}
.res-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.newbadge{display:inline-flex;align-items:center;gap:12px;background:var(--win);color:#3A2600;border-radius:18px;padding:10px 18px;margin-top:16px;font:600 18px var(--display);animation:zoom .4s cubic-bezier(.3,1.6,.5,1) both}
.newbadge .bi{font-size:30px}

<script>
const PASS = {
shtender: {title:'The Shtender', text:`On Sunday morning, Avi went to his grandfather's workshop behind the house. Zeidy was building a shtender for the shul.
"You can help me sand the top," Zeidy said. He gave Avi a block of wood wrapped in sandpaper. Avi rubbed the wood in long, smooth lines, the way Zeidy showed him. By lunchtime the top felt as smooth as glass.
In the afternoon, they screwed the legs on and carried the shtender to the shul together. The gabbai put it at the front, right next to the aron kodesh.`},
siddur: {title:'The Lost Siddur', text:`After Mincha on Tuesday, Moshe could not find his siddur. He looked under his seat and on the bookshelf. Then he remembered: he had used it on the bus that morning.
Moshe ran outside just as the bus driver, Mr. Klein, was walking toward the building. In his hand was a small blue siddur. "I found this on the back seat," Mr. Klein said.
Moshe thanked him and wrote his name inside the cover so it would never get lost again.`},
bridge: {title:'The Brooklyn Bridge', text:`When the Brooklyn Bridge opened in 1883, it was the longest suspension bridge in the world. Its chief engineer, John Roebling, died from an injury before construction began, so his son Washington took over.
Washington Roebling became sick from working deep under the river in the caissons, the huge underwater boxes used to build the towers' foundations. Unable to visit the site, he watched through a telescope from his window and sent instructions every day.
The work was dangerous. More than twenty workers died during the fourteen years of building. Still, the bridge was built to last. Roebling made it six times stronger than it needed to be. More than 140 years later, over 100,000 vehicles cross it every day.`},
railroad: {title:'The Transcontinental Railroad', text:`In 1869, workers drove a final spike at Promontory Summit, Utah, joining two railroads into one line across the country. Before that, a trip from New York to California took months by wagon or by ship around South America. After the railroad, the same trip took about a week.
Building it was brutal work. Crews blasted tunnels through solid granite in the Sierra Nevada mountains, sometimes moving forward only a foot a day. Thousands of workers from China did much of this dangerous work for the Central Pacific line.`},
broken: {title:'The Broken Shtender', text:`Shlomo had worked on his shtender for three weeks in Trades Co. It was his first big project, and he planned to give it to his father for his birthday.
On Thursday, as he carried it across the shop, he tripped on a cord. The shtender hit the floor, and one leg snapped. Shlomo felt his face get hot. He wanted to throw the pieces in the scrap bin and never think about it again.
Mr. Adler, the shop teacher, picked up the broken leg and turned it over. "The break is clean," he said. "A good joint will make it stronger than before. But it's your choice."
Shlomo stared at the pieces for a long time. Then he picked up a clamp. He stayed after school twice that week, gluing and shaping a new joint.
On Sunday, he gave his father the shtender. His father ran his hand over the repaired leg. "This is the best part," he said.`},
longway: {title:'The Long Way Home', text:`Pinchas was the fastest runner in his grade, and he knew it. During the yeshiva field day, he raced ahead of everyone in the long run.
Near the finish, he heard a shout behind him. A younger boy, Hillel, had fallen and was holding his ankle. Pinchas could hear the other runners catching up.
He stopped, turned around and jogged back. He helped Hillel stand and walked him slowly to the first-aid table. Pinchas finished the race last.
That afternoon, the menahel handed out the awards. The last one was a new award, made that day. It said "True Winner" and had Pinchas's name on it.`},
drill: {title:'Cordless Drill: Quick Start', text:`1. Charge the battery fully before first use (about 1 hour). The light turns green when charged.
2. Slide the battery into the handle until it clicks.
3. Set the direction switch: push right for forward (drilling), left for reverse (removing screws).
4. Turn the clutch ring to choose torque. Lower numbers (1–5) for small screws; higher numbers (15–20) for large screws. Use the drill symbol for drilling holes.
5. Always wear safety glasses.
WARNING: Do not use near water. Remove the battery before changing bits.`},
cutsheet: {title:'Pine Board Cut Sheet', text:`Project: Small sefarim shelf
Material: one 1 × 8 pine board, 8 feet long
Cuts:
• 2 sides — 24 inches each
• 3 shelves — 14 inches each
Kerf: allow 1/8 inch for each saw cut.
Note: Cut sides first. Sand all edges before assembly.`},
};

'READ.PHON.L03.01': {name:'Split big words into syllables',
teach:[
{how:'Two consonants between two vowels? Split between them. The first part is closed, so its vowel is short: nap | kin.', q:'Split the word: napkin', o:['nap | kin','na | pkin','napk | in']},
{how:'Only one consonant between vowels? Try splitting before it. The first part is open, so its vowel says its name: ro | bot.', q:'Split the word: robot', o:['ro | bot','rob | ot','r | obot']},
{how:'A word that ends in a consonant + le keeps those three letters together: ta | ble.', q:'Split the word: table', o:['ta | ble','tab | le','t | able']},
],
practice:[
{q:'Split the word: basket', o:['bas | ket','ba | sket','bask | et'], h:'Two consonants (s, k) sit between the vowels. Split between them.'},
{q:'Split the word: pilot', o:['pi | lot','pil | ot','p | ilot'], h:'One consonant between the vowels. Split before it; the i says its name.'},
{q:'Split the word: puzzle', o:['puz | zle','pu | zzle','puzz | le'], h:'Consonant + le stays together at the end.'},
{q:'How many syllables are in "fantastic"?', o:['3','2','4'], h:'Clap it: fan · tas · tic.'},
{q:'Split the word: helmet', o:['hel | met','he | lmet','helm | et'], h:'Split between the two middle consonants, l and m.'},
{q:'Which word has an open first syllable (a long vowel)?', o:['music','muffin','mitten'], h:'Mu | sic: the u says its name.'},
],
check:[
{q:'Split the word: magnet', o:['mag | net','ma | gnet','magn | et']},
{q:'Split the word: candle', o:['can | dle','cand | le','ca | ndle']},
{q:'How many syllables are in "invention"?', o:['3','2','4']},
]},

teach:[
{how:'un- means "not." Unlocked means not locked.', q:'What does "unsafe" mean?', o:['not safe','very safe','safe again']},
{how:'re- means "again." Rebuild means build again.', q:'What does "reread" mean?', o:['read again','not read','read before']},
{how:'-ful means "full of." -less means "without."', q:'What does "careless" mean?', o:['without care','full of care','care again']},
],
practice:[
{q:'What does "preheat" mean?', o:['heat before','heat again','not heat'], h:'pre- means before.'},
{q:'What does "helpful" mean?', o:['full of help','without help','help again'], h:'-ful means full of.'},
{q:'Which word means "not able"?', o:['unable','enable','ablest'], h:'Which prefix means not?'},
{q:'What does "misread" mean?', o:['read wrongly','read again','read before'], h:'mis- means wrongly.'},
{q:'What is a "builder"?', o:['a person who builds','building again','not building'], h:'-er can mean a person who does something.'},
{q:'A tool with no use is ___.', o:['useless','useful','reuse'], h:'Which suffix means without?'},
],
check:[

]},
'READ.VOC.L04.01': {name:'Use context clues for new words',
teach:[
{how:'Look at the words around a hard word. They often explain it.', q:'"The road was so narrow that only one car could pass." Narrow means:', o:['not wide','very long','bumpy']},
{how:'Sometimes the sentence gives the opposite. Look for "but" or "unlike."', q:'"Yosef was timid, but his brother was bold and loud." Timid means:', o:['shy','brave','noisy']},
{how:'Sometimes the sentence gives examples.', q:'"Hand tools, such as hammers and saws, hung on the wall." Hand tools are:', o:['tools you hold and use by hand','tools that run on power','tools for cooking']},
],
practice:[
{q:'"The bread was stale, hard and dry from sitting out all week." Stale means:', o:['old and dry','fresh','sweet'], h:'The clue words are "hard and dry."'},
{q:'"The rebbe was elated when the whole class knew the answer; he smiled from ear to ear." Elated means:', o:['very happy','angry','tired'], h:'How does someone feel when he smiles from ear to ear?'},
{q:'"The path was hazardous, with loose rocks and a steep drop." Hazardous means:', o:['dangerous','pretty','easy'], h:'Loose rocks and a steep drop are a clue.'},
{q:'"Dovid was famished after the long fast and ate two bowls of soup." Famished means:', o:['very hungry','full','sleepy'], h:'He ate two bowls after a fast.'},
{q:'"Unlike the fragile glass cup, the metal cup did not break when it fell." Fragile means:', o:['easy to break','heavy','shiny'], h:'"Unlike" tells you it is the opposite of not breaking.'},
{q:'"The boys had to conserve water on the trip, using only a little each day." Conserve means:', o:['save','spill','heat'], h:'Using only a little each day is a clue.'},
],
check:[
{q:'"The workshop was cluttered, with wood scraps and tools covering every table." Cluttered means:', o:['messy and full','clean','empty']},
{q:'"Chaim was reluctant to jump in the cold lake and waited a long time." Reluctant means:', o:['not wanting to','excited','fast']},
{q:'"The old bridge was sturdy enough to hold a heavy truck." Sturdy means:', o:['strong','weak','new']},
]},

'READ.COMP.L05.01': {name:'Main idea and supporting details',
teach:[
{how:'The main idea is what the whole paragraph is mostly about. The details support it.', p:'Honeybees are busy workers. Some bees gather nectar from flowers. Others guard the hive. Still others take care of the young bees. Every bee has a job.', q:'What is the main idea?', o:['Every bee in a hive has a job.','Bees guard the hive.','Flowers have nectar.']},
{how:'A detail is one small part. The main idea covers all the details.', p:'A good hammer has a few important parts. The head strikes the nail. The claw pulls nails out. The handle gives you grip and swing.', q:'What is the main idea?', o:['A hammer has parts that each do a job.','The claw pulls nails out.','Handles are made of wood.']},
{how:'Often the first sentence states the main idea.', p:'Baltimore has a long history as a port city. Ships have brought goods into its harbor for over 250 years. Today, huge cargo ships still unload cars and machines there.', q:'What is the main idea?', o:['Baltimore has long been an important port.','Cargo ships are huge.','Cars come from far away.']},
],
practice:[
{p:'Camels are built for the desert. Their humps store fat for energy. Their wide feet keep them from sinking in sand. Long eyelashes keep sand out of their eyes.', q:'What is the main idea?', o:["Camels' bodies help them live in the desert.",'Camels have long eyelashes.','Sand is hot.'], h:'Which choice covers ALL the details, not just one?'},
{p:'Saving money takes a plan. First, decide what you are saving for. Next, set aside a little each week. Finally, don’t spend it on things you don’t need.', q:'What is the main idea?', o:['Saving money takes a plan.','Decide what you want.','Spending is fun.'], h:'Look at the first sentence.'},
{p:'Before the Erie Canal, moving goods from New York City to the Great Lakes took weeks by wagon. After the canal opened in 1825, boats did it in days, and shipping costs fell sharply.', q:'What is the main idea?', o:['The Erie Canal made shipping goods much faster and cheaper.','Wagons were slow.','The canal opened in 1825.'], h:'What changed because of the canal?'},
{p:'Many animals get ready for winter. Squirrels bury nuts. Some birds fly south. Bears eat a lot and then sleep for months.', q:'What is the main idea?', o:['Animals prepare for winter in different ways.','Bears sleep in winter.','Birds fly south.'], h:'Squirrels, birds and bears are all examples of what?'},
{p:'A sharp saw is safer than a dull one. A dull saw needs more force, so it can slip. A sharp saw cuts with less pushing and stays on the line.', q:'What is the main idea?', o:['A sharp saw is safer to use than a dull one.','Saws can slip.','Lines guide a cut.'], h:'Look at the first sentence.'},
{p:'The human heart is a strong pump. It beats about 100,000 times a day. With each beat it pushes blood through the whole body.', q:'What is the main idea?', o:['The heart is a powerful pump that never stops working.','Blood moves.','Bodies are big.'], h:'What are all the details about?'},
],
check:[
{p:'Lighthouses kept sailors safe for hundreds of years. Their bright lights warned ships away from rocks. Their horns sounded in fog. Each one had a keeper who kept the light burning all night.', q:'What is the main idea?', o:['Lighthouses helped keep ships safe.','Lighthouses had keepers.','Fog is thick.']},
{p:'Recycling paper helps in several ways. It saves trees. It uses less water than making new paper. It also keeps trash out of landfills.', q:'What is the main idea?', o:['Recycling paper has many benefits.','Paper comes from trees.','Landfills are full.']},
{p:'Ants work as a team. When one ant finds food, it leaves a scent trail. Other ants follow the trail and carry the food home together.', q:'What is the main idea?', o:['Ants work together to find and carry food.','Ants leave a scent.','Food is heavy.']},
]},
'READ.COMP.L05.02': {name:'Sequence and cause and effect',
teach:[
{how:'Signal words like first, next, then and finally show order.', p:'First, Eli measured the board. Next, he marked a line. Then he cut along the line. Finally, he sanded the edge.', q:'What did Eli do right after he marked the line?', o:['cut along the line','sanded the edge','measured the board']},
{how:'A cause is WHY something happened. The effect is WHAT happened. Look for "because" or "so."', p:'Because it rained all night, the baseball field was full of puddles, so the game was moved to Monday.', q:'Why was the game moved?', o:['The field was full of puddles from the rain.','It was Monday.','The players were tired.']},
{how:'One effect can cause another, like a chain.', p:'The power went out during the storm. The freezer stopped working, so the ice cream melted.', q:'What caused the ice cream to melt?', o:['The freezer stopped when the power went out.','The storm was loud.','It was summer.']},
],
practice:[
{p:'Shimon forgot to water the plant for two weeks. Its leaves turned brown and dry.', q:'What was the effect of forgetting to water the plant?', o:['The leaves turned brown and dry.','Shimon forgot.','Plants need sun.'], h:'The effect is what happened.'},
{p:'To make the challah, Ari’s father mixed the dough, let it rise for an hour, braided it, and then baked it.', q:'What happened right after the dough rose?', o:['It was braided.','It was mixed.','It was baked.'], h:'Find "rise," then read the next step.'},
{p:'The bus was late, so Yehuda missed the start of davening. He davened quickly, then joined the class.', q:'Why did Yehuda miss the start of davening?', o:['The bus was late.','He davened quickly.','He joined the class.'], h:'Look before the word "so."'},
{p:'In the spring, the snow on the mountains melts. The water flows into rivers. The rivers rise and sometimes flood the towns nearby.', q:'What happens right before the rivers rise?', o:['The water flows into the rivers.','The towns flood.','It is winter.'], h:'Put the events in a line.'},
{p:'The class saved Tashbar dollars for three weeks. Then they voted on a prize. Finally, they bought a new basketball.', q:'What did the class do first?', o:['saved Tashbar dollars for three weeks','voted on a prize','bought a basketball'], h:'Look for the first event.'},

{p:'The town built a new bridge over the river. Now trucks no longer drive through the center of town, and the streets are quieter.', q:'What made the streets quieter?', o:['Trucks use the new bridge instead of driving through town.','The river is wide.','The town is small.']},
]},
'READ.COMP.L06.01': {name:'Make inferences from clues',
teach:[
{how:'An inference uses clues in the text plus what you already know. The text does not say it straight out.', p:'Binyamin’s shoes were muddy, his coat was wet, and he was shivering when he came in.', q:'What can you infer?', o:['It was rainy and cold outside.','It was a sunny day.','Binyamin was at home all day.']},
{how:'Ask yourself: which clues point to the answer?', p:'Mr. Levy looked at the clock, tapped his foot and sighed. The bus was twenty minutes late.', q:'How does Mr. Levy probably feel?', o:['impatient','happy','sleepy']},
{how:'Pick the answer the clues support best, not just one that could be true.', p:'The table was set with the white cloth, two candlesticks and a covered challah.', q:'What is most likely about to happen?', o:['a Shabbos meal','a science class','a ball game']},
],

{p:'Every seat was full, and people stood along the walls to hear the speaker.', q:'What can you infer about the speaker?', o:['Many people wanted to hear him.','No one liked him.','He spoke very quietly.'], h:'Why would people stand to listen?'},
{p:'Akiva checked his list twice, packed his tefillin, and set his alarm for 5:30.', q:'What can you infer?', o:['He has an early trip or day tomorrow.','He plans to sleep late.','He lost his tefillin.'], h:'Why set an alarm so early and pack?'},
],
check:[
{p:'The puppy’s tail wagged fast, and it ran in circles when the boys came home.', q:'How does the puppy feel?', o:['excited','scared','bored']},
{p:'Nosson’s hands were covered in sawdust, and there was a pencil behind his ear.', q:'Where was Nosson most likely?', o:['in the woodshop','at the swimming pool','at the dentist']},
{p:'The lights in the store were off, and a sign on the door said "See you Sunday."', q:'What can you infer?', o:['The store is closed now.','The store is having a sale.','The store just opened.']},

check:[

{p:'railroad', q:'Claim: Some of the work went very slowly. Best evidence?', o:['Crews blasted tunnels through solid granite, sometimes moving forward only a foot a day.','Thousands of workers from China did much of this dangerous work.','The railroad joined two lines into one.']},
{p:'railroad', q:'Claim: Before the railroad, travel west was hard. Best evidence?', o:['A trip from New York to California took months by wagon or by ship around South America.','Workers drove a final spike at Promontory Summit, Utah.','After the railroad, the same trip took about a week.']},
]},
'READ.COMP.L07.02': {name:'Write an objective summary',
teach:[
{how:'A summary gives the main points, short, in your own words. It leaves out small details.', p:'The Wright brothers ran a bicycle shop in Ohio. They used money from the shop to build gliders and test their ideas about flight. In 1903, at Kitty Hawk, North Carolina, they flew the first powered airplane for 12 seconds.', q:'Which is the best objective summary?', o:['The Wright brothers used money from their bicycle shop to develop flight and flew the first powered airplane in 1903.','The Wright brothers were the most amazing inventors ever.','The first flight lasted 12 seconds.']},
{how:'An objective summary leaves out opinions. No "I think," no "amazing."', p:'Maple syrup comes from the sap of maple trees. In early spring, farmers drill small holes and collect the sap. They boil it for hours until most of the water is gone. It takes about 40 gallons of sap to make one gallon of syrup.', q:'Which is the best objective summary?', o:['Farmers collect maple sap in spring and boil it for hours; about 40 gallons of sap make one gallon of syrup.','Maple syrup is the best topping in the world.','Farmers drill small holes.']},
{how:'Keep the main events in order.', p:'Yaakov wanted to join the chess club, but he kept losing. He studied one opening every night for a month. At the next tournament, he won three games.', q:'Which is the best objective summary?', o:['Yaakov kept losing at chess, studied every night for a month, and then won three tournament games.','I think Yaakov should have tried harder sooner.','Yaakov studied one opening.']},
],
practice:[
{p:'Coral reefs cover a tiny part of the ocean floor, yet about a quarter of all ocean fish live around them. Warmer water can cause corals to turn white and die. Scientists are testing ways to grow new coral and replant reefs.', q:'Which is the best objective summary?', o:['Coral reefs support many fish, are harmed by warming water, and scientists are trying to regrow them.','Coral reefs are beautiful and everyone should visit one.','Corals can turn white.'], h:'Find the choice with every main point and no opinion.'},
{p:'The Pony Express carried mail between Missouri and California in 1860 and 1861. Riders changed horses every 10 to 15 miles and delivered letters in about ten days. It ended when the telegraph line was finished.', q:'Which is the best objective summary?', o:['The Pony Express delivered mail across the West in about ten days until the telegraph replaced it in 1861.','The Pony Express riders were the bravest people in history.','Riders changed horses often.'], h:'"Bravest" is an opinion. One detail is not a summary.'},
{p:'Dovid’s family moved to a new city. At first he missed his friends. Then he joined the afternoon basketball league, and by Chanukah he had made two close friends.', q:'Which is the best objective summary?', o:['After moving, Dovid missed his old friends, joined a basketball league, and made new friends by Chanukah.','Moving is always hard and nobody likes it.','Dovid joined a basketball league.'], h:'Keep the events in order.'},
{p:'Volcanoes form where melted rock, called magma, pushes up through cracks in the earth’s crust. When magma reaches the surface it is called lava. Over many eruptions, layers of cooled lava can build a mountain.', q:'Which is the best objective summary?', o:['Volcanoes form when magma rises through the crust, erupts as lava, and builds up layers over time.','Volcanoes are the scariest thing in nature.','Magma is melted rock.'], h:'Which choice covers the whole process?'},
{p:'A town wanted a new playground. Students wrote letters to the town council, raised money at a bake sale, and helped plan the design. The playground opened the next summer.', q:'Which is the best objective summary?', o:['Students wrote letters, raised money and helped plan, and the new playground opened the next summer.','The students’ bake sale had great cookies.','The town council got letters.'], h:'Main events, in order, no opinion.'},
{p:'Honey almost never spoils. It has very little water and is slightly acidic, so germs cannot grow in it. Jars of honey thousands of years old have been found still safe to eat.', q:'Which is the best objective summary?', o:['Honey lasts a very long time because its low water and acid stop germs from growing.','Honey is the tastiest food there is.','Old jars of honey were found.'], h:'"Tastiest" is an opinion.'},
],
check:[
{p:'Benjamin Franklin started a library in Philadelphia so people could share books. Members paid a small fee, and the money bought more books. It became one of the first lending libraries in America.', q:'Which is the best objective summary?', o:['Franklin started a library in Philadelphia where members’ fees bought shared books; it was one of America’s first lending libraries.','Franklin was a genius who did everything right.','Members paid a small fee.']},
{p:'Ezra broke his arm in the fall and could not write for six weeks. He learned to type with one hand and finished all his assignments on time.', q:'Which is the best objective summary?', o:['Ezra broke his arm, learned to type with one hand, and still finished his work on time.','Ezra was very unlucky.','Ezra could not write.']},
{p:'Glaciers are huge sheets of ice that move slowly downhill. As they move, they scrape rock and carve valleys. Many lakes in the northern United States were formed by glaciers long ago.', q:'Which is the best objective summary?', o:['Glaciers are slow-moving ice that carve the land, forming valleys and many northern U.S. lakes.','Glaciers are amazing and cold.','Glaciers scrape rock.']},
]},

],

],

]},
'READ.VOC.L08.01': {name:'Figurative language',
teach:[
{how:'A simile compares two things using "like" or "as."', q:'"The gym was as hot as an oven." This is a:', o:['simile','fact','question']},
{how:'A metaphor compares by saying one thing IS another.', q:'"The classroom was a beehive of activity." What does it mean?', o:['The room was busy and full of movement.','There were bees in the class.','The class was quiet.']},
{how:'An idiom is a saying that does not mean its exact words.', q:'"It’s raining cats and dogs." What does it mean?', o:['It is raining very hard.','Animals are falling.','It is a light rain.']},
],
practice:[
{q:'"Chaim was a rock for his friends." This means Chaim was:', o:['dependable and strong','hard and cold','heavy'], h:'What is good about a rock?'},
{q:'"The old car coughed and groaned up the hill." Giving a thing human actions is called:', o:['personification','simile','rhyme'], h:'Cars don’t really cough. People do.'},
{q:'"I’ve told you a million times." This big exaggeration is called:', o:['hyperbole','simile','fact'], h:'Not really a million.'},
{q:'"Hit the books" means:', o:['study hard','hit something','throw books'], h:'It’s an idiom.'},
{q:'"His words were as sharp as a knife." This means his words were:', o:['hurtful','helpful','quiet'], h:'What does a sharp knife do?'},
{q:'"Time flies when you’re learning something fun." This means:', o:['Time seems to pass quickly.','Clocks have wings.','Time stops.'], h:'How fast do flying things move?'},
],
check:[
{q:'"The wind howled through the trees." This is:', o:['personification','simile','hyperbole']},
{q:'"The test was a breeze." This means the test was:', o:['easy','windy','long']},
{q:'"Moshe was as quiet as a mouse." This is a:', o:['simile','metaphor','idiom']},
]},
'READ.COMP.L09.01': {name:'Judge an argument’s claims and evidence',
teach:[
{how:'The claim is what the writer wants you to believe or do.', p:'Our school should start a woodshop. Students who learn trades gain skills they can use for life. A survey of local builders found that 7 out of 10 cannot find enough trained workers.', q:'What is the writer’s claim?', o:['The school should start a woodshop.','7 out of 10 builders can’t find workers.','Students gain skills.']},
{how:'Strong evidence is a fact, number or example that is relevant and reliable.', p:'Our school should start a woodshop. Students who learn trades gain skills they can use for life. A survey of local builders found that 7 out of 10 cannot find enough trained workers.', q:'Which is the strongest evidence in the paragraph?', o:['the survey of local builders','the word "should"','the title "school"']},
{how:'Weak evidence: one person’s story, a feeling, or something unrelated.', p:'Phones should be banned during class. My friend’s cousin says phones made his grades worse.', q:'Why is this evidence weak?', o:['One person’s story isn’t enough to prove it.','It uses numbers.','It is about phones.']},
],
practice:[
{p:'The city should add bike lanes on Park Avenue. Last year, 40 bike accidents happened there, and cities that added lanes saw accidents drop by about half.', q:'How strong is the evidence?', o:['Strong: it gives local numbers and results from other cities.','Weak: it is only an opinion.','Weak: it is unrelated to bikes.'], h:'Does it use facts tied to the claim?'},
{p:'Everyone should eat breakfast because it is the best meal and I always feel great after it.', q:'What is the main weakness?', o:['It relies on the writer’s own feelings, not facts.','It has too many statistics.','It is too long.'], h:'Where is the proof?'},
{p:'Recess should be longer. Studies show students pay better attention after active breaks. Also, longer recess is more fun.', q:'Which reason is the least strong evidence?', o:['Longer recess is more fun.','Students pay better attention after breaks.','Studies were done.'], h:'Which one is just a feeling?'},
{p:'We should not build the new mall, because the people who want it are greedy.', q:'What is wrong with this argument?', o:['It attacks people instead of giving reasons about the mall.','It uses too much evidence.','It has no claim.'], h:'Is "greedy" a reason about the mall?'},
{p:'Last year our library lent 80,000 books and ran 300 free classes, and half its visitors have no internet at home.', q:'Which claim does this evidence best support?', o:['Libraries are still needed.','Books are old.','Internet is expensive.'], h:'What do all three facts show?'},
{p:'Either we cancel the trip or the whole school will fail its exams.', q:'What is the problem with this reasoning?', o:['It gives only two choices when there are more.','It uses a statistic.','It is about a trip.'], h:'Are there really only two options?'},
],
check:[
{p:'Our town should plant more trees. Trees lower summer temperatures on streets by several degrees, and a city study found shaded streets need less road repair.', q:'How strong is this evidence?', o:['Strong: it gives facts and a study connected to the claim.','Weak: it is a personal story.','Weak: it is off topic.']},
{p:'This game is the best because everybody is buying it.', q:'What is the weakness?', o:['Being popular doesn’t prove it is the best.','It gives too many facts.','It is too short.']},
{p:'Students should learn to budget. In one survey, most adults said they wished they had learned about money in school, and students in budgeting classes saved more later.', q:'What is the claim?', o:['Students should learn to budget.','Adults wished they learned about money.','Students saved more.']},
]},
'READ.LIT.L09.01': {name:'Author’s purpose and point of view',
teach:[
{how:'Authors write to inform, to persuade, or to entertain.', p:'Lightning heats the air around it to about 50,000°F, which is hotter than the surface of the sun.', q:'The author’s main purpose is to:', o:['inform','persuade','entertain']},
{how:'First person uses "I" and "we." Third person uses "he" and "they."', p:'I tightened the last screw and stepped back. My first shelf actually stood straight.', q:'What point of view is this?', o:['first person','third person','second person']},
{how:'The author’s viewpoint is his opinion. Strong words give it away.', p:'Wasting food is a shameful habit we must break today.', q:'What is the author’s viewpoint on wasting food?', o:['It is wrong and must stop.','It doesn’t matter.','It is sometimes good.']},
],
practice:[
{p:'Come to the Trades Co. market this Sunday! Every shelf is handmade, and every purchase supports student workers.', q:'The author’s purpose is to:', o:['persuade','inform','entertain'], h:'Is he trying to get you to do something?'},
{p:'The ostrich tried to hide behind a lamppost, but its long neck stuck out like a flagpole, and all the birds laughed.', q:'The author’s purpose is to:', o:['entertain','inform','persuade'], h:'Is this meant to be funny?'},
{p:'Dovid looked at the broken window. He knew he should tell the truth, but his stomach twisted.', q:'What point of view is this?', o:['third person','first person','second person'], h:'Look for "he" or "I."'},
{p:'Some people think homework helps students practice. Others think it takes away family time. Both sides have research to back them up.', q:'What is the author’s viewpoint here?', o:['The author stays neutral and presents both sides.','The author is against homework.','The author loves homework.'], h:'Does he pick a side?'},
{p:'The new bridge is a disaster: ugly, overpriced and late.', q:'Which words show the author’s viewpoint?', o:['disaster, ugly, overpriced','the new bridge','is'], h:'Look for strong opinion words.'},
{p:'A healthy plant needs light, water and air. Without light, plants cannot make food.', q:'Why did the author write this?', o:['to explain what plants need','to sell plants','to tell a funny story'], h:'Is he teaching, selling or joking?'},
],
check:[
{p:'You need to see this exhibit. It’s the best one the museum has ever had, and tickets are almost gone!', q:'The author’s purpose is to:', o:['persuade','inform','entertain']},
{p:'We hiked for hours, and I was sure we were lost until I spotted the trail marker.', q:'What point of view is this?', o:['first person','third person','second person']},
{p:'Bees pollinate about one-third of the food crops we eat, including apples and almonds.', q:'The author’s purpose is to:', o:['inform','persuade','entertain']},
]},

],

],

]},
'READ.COMP.L09.03': {name:'Check facts across sources',
teach:[
{how:'When sources disagree, trust the one that is more reliable and more recent.', p:'Source A (encyclopedia, 2024): Mount Everest is 29,032 feet tall.\nSource B (travel brochure, 1985): Mount Everest is about 29,000 feet tall.', q:'Which source should you use for the exact height?', o:['Source A: it is recent and from a reference work.','Source B: it is older.','Neither: they disagree completely.']},
{how:'A fact that two reliable sources agree on is well supported.', p:'Source A (encyclopedia): The Chesapeake Bay is the largest estuary in the United States.\nSource B (Maryland state website): The Chesapeake Bay is the nation’s largest estuary.', q:'What can you conclude?', o:['Both reliable sources agree, so the fact is well supported.','The sources disagree.','Neither source can be trusted.']},
{how:'An opinion is not a fact, even when it appears in a source.', p:'Blog post: The Erie Canal was the most boring project ever built.', q:'Can you use this as a fact in a report?', o:['No, it is an opinion.','Yes, it is from a blog.','Yes, it uses the word "most."']},
],
practice:[
{p:'Source A (science museum website): Light from the sun takes about 8 minutes to reach Earth.\nSource B (forum comment): Sunlight reaches us instantly.', q:'Which is more reliable?', o:['Source A','Source B','Both equally'], h:'Who wrote each one?'},
{p:'Source A (2010 guide): The town has 12,000 people.\nSource B (2023 census): The town has 14,500 people.', q:'Which number should a report use for today?', o:['14,500','12,000','the average of the two'], h:'Which is newer and official?'},
{p:'Source A (encyclopedia): The Liberty Bell is in Philadelphia.\nSource B (National Park Service): The Liberty Bell is displayed in Philadelphia, Pennsylvania.', q:'What do the sources show?', o:['They agree on the fact.','They disagree.','Neither is reliable.'], h:'Compare what they say.'},
{p:'Advertisement: Our glue is the strongest in the world!', q:'How should a researcher treat this?', o:['As a sales claim that needs checking.','As a proven fact.','As a scientific study.'], h:'Who benefits from the claim?'},
{p:'Source A says a project took 14 years. Source B says it took 12 years.', q:'What is the best next step?', o:['Check a third reliable source.','Pick the bigger number.','Use both numbers without explaining.'], h:'How do you break a tie?'},
{p:'Source: a history textbook written by a professor, with a list of references.', q:'Why is this likely reliable?', o:['An expert wrote it and lists references.','It is long.','It has pictures.'], h:'Think about who wrote it.'},
],
check:[
{p:'Source A (personal website, no author): Spiders are insects.\nSource B (university biology page): Spiders are arachnids, not insects.', q:'Which should you trust?', o:['Source B','Source A','Both']},
{p:'Source A (2005 map): The highway has 4 lanes.\nSource B (2024 state road report): The highway was widened to 6 lanes in 2019.', q:'How many lanes does the highway have now?', o:['6','4','5']},
{p:'Opinion column: Baseball is the greatest sport ever invented.', q:'How should this be used in a report?', o:['As one person’s opinion, not a fact.','As a proven fact.','As data.']},
]},
};
const WRIT = {
'LANG.SENT.L03.01': {name:'Complete sentences: fix fragments and run-ons',
teach:[
{how:'A complete sentence has a subject (who) and a predicate (what he does), and it is a complete thought.', q:'Which is a complete sentence?', o:['The boys built a birdhouse.','Built a birdhouse.','The boys with the hammer.']},
{how:'A fragment is missing a part. Ask: Who? Did what?', q:'"Running down the hall." What is missing?', o:['who is running','an ending mark','a verb']},
{how:'A run-on joins two sentences with no break. Fix it with a period, or with a comma and "and," "but" or "so."', q:'Which fixes the run-on "I finished my work I went outside"?', o:['I finished my work. I went outside.','I finished my work I, went outside.','I finished. my work I went outside.']},
],

{q:'"The tall boy in the front row." What does it need?', o:['a predicate (what he did)','a subject','a capital letter'], h:'We know who. What did he do?'},
],

{q:'Which is a fragment?', o:['When the bus came.','The bus came.','We got on the bus.']},

],

]},
'WRIT.SENT.L04.01': {name:'Combine sentences with and, but, so',

],
