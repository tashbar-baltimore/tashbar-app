      {type:'dictation', hear:'Ben has a big red bus.', w:['Ben','has','a','big','red','bus.'], say:'Listen. Build it. Then read it smoothly, three times.', how:'Say it softly. Tap the words in order.'},
      {type:'listen', hear:'The. Cat. Sat. On. A. Mat.', o:['🐢','🐇'], a:'🐢', mis:true, say:'Careful! Stops after every word are choppy. Listen again.', how:'A stop after every word is turtle reading.'},
      {type:'sort', bins:['🐛','🦊'], cards:[['A bug is on a rug.',0],['A fox ran to his den.',1],['The bug can hop.',0],['The fox can dig a pit.',1]], say:'Read each one smoothly. Is it about the bug or the fox?', how:'Read it like you are talking. Then pick its box.'},
      {type:'dictation', hear:'The sun is hot.', w:['The','sun','is','hot.'], say:'Build it. Read it to Abba three times, smoothly!', how:'Say it softly. Tap the words in order.'}]},

    { id:'WRIT.HAND.L01.12', grade:0, name:'Big Letters', pic:'✏️', after:'READ.FLU.L01.09', acts:[
      {type:'trace', glyph:'D', name:'big D', say:'Big duh: a tall line down, then a big round belly.', how:'Line down first. Then curve from the top to the bottom.'},
      {type:'sort', bins:['✅','❌'], cards:[['Dan',0],['dan',1],['Ben',0],['ben',1]], mis:true, say:'Careful! Names start with a big letter. Right or wrong?', how:'Look at the first letter. Is it big?'},
      {type:'trace', glyph:'B', name:'big B', say:'Big buh: a tall line, then two bumps.', how:'Line down. Then a bump on top and a bump on the bottom.'},
      {type:'match', pairs:[['D','d'],['B','b'],['T','t']], say:'Big letter, little letter. Match them.', how:'Say the sound of each one. Find its partner.'},
      {type:'trace', glyph:'T', name:'big T', say:'Big tuh: a tall line down, then a line across the top.', how:'Line down. Then a long line across the top.'},
      {type:'dictation', hear:'Tal can hop.', w:['Tal','can','hop.'], extra:['tal'], say:'Listen. Build it. A name gets a big letter.', how:'Names and the first word start with a big letter.'},
      {type:'trace', glyph:'I', name:'big I', say:'The word I: a line down, a hat and shoes.', how:'Line down. Then a short line on top and on the bottom.'}]},

    /* ===== K Unit 10 · Long and short; my first chapter ===== */
    { id:'READ.PHON.L01.25', grade:0, name:'Long or Short?', pic:'🎂', after:'WRIT.HAND.L01.12', acts:[
      {type:'sort', bins:['🍎','🎂'], cards:[['🐱',0],['🚂',1],['🎩',0],['🍇',1],['🦇',0],['🐍',1]], say:'Short like apple, or long like cake? Sort them.', how:'Say it. Does the middle say ay, its own name?'},
      {type:'listen', hear:'snake', o:['🍎','🎂'], a:'🎂', say:'Is snake short like apple, or long like cake?', how:'Say snake slowly. Hear ay in the middle?'},
      {type:'findall', grid:['🚂','🐱','🍇','🎩','🐍','🦇'], find:['🚂','🍇','🐍'], findSay:'picture that says ay', say:'Tap every picture that says ay, like cake.', how:'Say each one. Long ay says its name.'},
      {type:'listen', hear:'man', o:['🍎','🎂'], a:'🍎', mis:true, say:'Careful! Not every one is long. Man: short or long?', how:'Say man slowly. Aa, like apple: short.'},
      {type:'findall', grid:['🐱','🎂','🎩','🚂','🦇','🍇'], find:['🐱','🎩','🦇'], findSay:'picture that says aa', say:'Now tap every picture with short aa, like apple.', how:'Say each one. Short aa sounds like apple.'}]},

    { id:'READ.PHON.L01.26', grade:0, name:'Shhh, Ch, Th', pic:'🤫', after:'READ.PHON.L01.25', acts:[
      {type:'listen', hear:'ship', o:['sh','ch','th'], a:'sh', say:'Ship starts with shhh. Two letters make one sound.', how:'Shhh, like a quiet finger. Find the two letters.'},
      {type:'sort', bins:['sh','ch'], cards:[['🚢',0],['🐚',0],['🧀',1],['🐣',1],['🍒',1]], say:'Shhh or ch? Put each picture in its box.', how:'Shhh is quiet. Ch is a sneeze: ch, ch!'},
      {type:'listen', hear:'thumb', o:['th','sh','t'], a:'th', say:'Thumb starts with th. Put your tongue out a bit!', how:'Th: your tongue peeks between your teeth.'},
      {type:'findall', grid:['ship','sip','shop','sit','shed','sad'], find:['ship','shop','shed'], findSay:'word that starts with shhh', mis:true, say:'Careful! Sss is not shhh. Look for two letters.', how:'Shhh needs two letters together at the start.'},
      {type:'tiles', w:['ch','i','n'], extra:['sh'], hear:'chin', say:'Build chin. Ch is one tile.', how:'Ch, ih, nnn. Three sounds, three tiles.'},
      {type:'match', pairs:[['fish','🐟'],['chop','🪓'],['bath','🛁']], say:'Two letters, one sound. Read each word and match.', how:'Find the two letters that stick together. Then blend.'}]},

    { id:'READ.PA.L01.15', grade:0, name:'Four Sounds', pic:'🐸', after:'READ.PHON.L01.26', acts:[
      {type:'listen', hear:'fff... rrr... ah... guh', o:['🐸','🐟','🦊'], a:'🐸', say:'Four sounds this time! Push them together.', how:'Say the four sounds faster and faster.'},
      {type:'tiles', w:['h','a','n','d'], extra:['m'], hear:'hand', say:'Hand has four sounds. Build it.', how:'Hhh, aa, nnn, duh. Four tiles.'},
      {type:'listen', hear:'stop', o:['3','4','5'], a:'4', mis:true, say:'Careful! Sss and tuh are two sounds. How many in stop?', how:'Say stop slowly. Hold up a finger for each sound.'},
      {type:'sort', bins:['3','4'], cards:[['🐸',1],['🐱',0],['✋',1],['🐟',0],['☀️',0]], say:'Three sounds or four? Hold up a finger for each.', how:'Say it slowly. One finger for each sound.'},
      {type:'listen', hear:'tuh... eh... nnn... tuh', o:['⛺','🐔','🧸'], a:'⛺', say:'Push the four sounds together. What is it?', how:'Say the sounds faster and faster.'}]},

    { id:'READ.FLU.L01.10', grade:0, name:'Heart Words: have, of, they', pic:'❤️', after:'READ.PA.L01.15', acts:[
      {type:'listen', hear:'have', o:['have','hat','had'], a:'have', say:'Have is a heart word. Its last letter is quiet.', how:'Hhh, aa, vvv. The last letter makes no sound.'},
      {type:'findall', grid:['of','off','of','on','of','if'], find:'of', findSay:'of', say:'Of is a heart word. It says uv! Tap every of.', how:'Just two letters. Off has three.'},
      {type:'listen', hear:'they', o:['they','the','then'], a:'they', mis:true, say:'Careful! They and the look alike. They says thay.', how:'They has four letters. The has three.'},
      {type:'dictation', hear:'They are my pals.', w:['They','are','my','pals.'], say:'Listen. Build it with heart words.', how:'Say it softly. Tap the words in order.'},
      {type:'listen', hear:'are', o:['are','am','an'], a:'are', say:'Are is a heart word. It says ar. Tap are.', how:'Three letters. The last one is quiet.'},
      {type:'dictation', hear:'We have a dog.', w:['We','have','a','dog.'], say:'Listen. Build it. Then read it smoothly.', how:'Say it softly. Tap the words in order.'}]}
  ];
  if (window.TLCORE && TLCORE.k1) K1G.forEach(function (g) { TLCORE.k1.add(g); });
  if (window.TLCORE) TLCORE.add('F', LESSONS, {});
})();
</script>
