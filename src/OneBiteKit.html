<script>
/* OneBiteKit.html: the ONE BITE Activity Kit (round 2, HoS 2026-11-21: "short, hands-on, many different ways, each age feels different").
   Hands-on activities for "Do it with me" (ONE_BITE[id].do, guided) and "Your turn" (ONE_BITE[id].your, practice).
   The player (OneBite.html) runs them; this file only knows how to draw one activity, take a tap, and say if it is right.
   Every drag also works with tap-tap. All state lives in a plain object the player keeps, so a re-draw never loses work.
   Mechanics and look follow KMathGamesUI.html / K1LettersUI.html (big targets, voice-first, drag or tap-then-tap).

   THE SCHEMA (one object per activity; docs/ONE-BITE-PLAYBOOK.md section 10). Every activity may also have:
     say:'spoken instruction'   how:'kid-friendly How to do it line'   q:'big prompt, e.g. 3 + 4 = ?'   pic:'emoji'
     why:{q:'Why?', o:['reason','reason'], a:'reason'}   (Gr 4-5 "tap the reason", asked after a right answer)
   tenframe  {type:'tenframe', n:7, start:0}                  tap (or drag the dot) to fill the frame until it shows n
             {type:'tenframe', n:4, start:9}                  take away: start > n, he taps dots OFF until n are left (n can be 0)
   hop       {type:'hop', start:3, add:4, unit:1, from, to}   hop the frog on a number line; lands on start + add
             {type:'hop', start:7, add:6, ask:'hops', o:['5','6','7']}   how many hops? hop to the flag (start + add), then pick the number of hops
   count     {type:'count', n:6, pic:'🍎', o:['5','6','7']}   tap each picture to count, then pick the number
   blocks    {type:'blocks', n:14}                            build n with tens and ones
   tiles     {type:'tiles', w:['c','a','t'], extra:['b'], he:false, hear:'cat'}   put tiles in order
   findall   {type:'findall', grid:['b','d','b','p'], find:'b'}   tap every target
   match     {type:'match', pairs:[['🍎','a'],['🐝','b']]}    pair each left with its right
   sort      {type:'sort', bins:['Circle','Not a circle'], cards:[['⚪',0],['🔺',1]]}   cards into 2-3 bins
   trace     {type:'trace', glyph:'b', he:false}              finger-trace the dotted letter; passes at about 80% covered
   fbar      {type:'fbar', n:3, d:4}   shade 3/4 · {type:'fbar', n:1, d:2, to:4}   shade the fourths bar to equal 1/2 · {type:'fbar', n:1, d:2, to:6, split:true}   cut 1/2 into 6 parts (= 3/6)
   clock     {type:'clock', h:3, m:30}   set the hands (step 60/30/15/5 from m, or step:5) · {type:'clock', h:2, m:15, add:45}   show the time 45 minutes later (elapsed)
   coins     {type:'coins', total:37, coins:['q','d','n','p'], fewest:false}   tap (or drag) drawn coins into the purse to make the amount ('D' = a dollar bill)
   listen    {type:'listen', hear:'buh', clip:'letter-sound:b', o:['b','d','p'], a:'b', he:false}   hear it, tap the match
   pic:'art:apple' uses the K-1 games' drawn pictures (KMG.ART). Hebrew (he:true) is never spoken by a computer voice; use clip.
   No double slash in this file (HtmlService rule). */
(function(){
if(window.OBK) return;
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>typeof v==='number'&&isFinite(v), isArr=Array.isArray, S=x=>String(x==null?'':x);
function shuf(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function shufNot(a){ if(a.length<2) return a.slice(); let b, t=0; do{ b=shuf(a); t++; }while(t<10&&b.every((x,i)=>x===a[i])); return b; }
function idx(n){ return Array.from({length:n},(_,i)=>i); }
function pic(x){ x=x==null||x===''?'⭐':S(x);
  if(/^art:/.test(x)&&window.KMG&&KMG.ART){ const f=KMG.ART[x.slice(4)]; if(typeof f==='function') try{ return '<span class="obk-art">'+f()+'</span>'; }catch(e){} return '⭐'; }
  return E(x); }
function numChoices(n){ const set=[n]; [n+1,n-1,n+2,n-2].forEach(v=>{ if(set.length<3&&v>=0&&set.indexOf(v)<0) set.push(v); }); return shuf(set).map(String); }
function heCls(d){ return d.he?' obk-he':''; }

const T={};

/* ---------- ten-frame: make n (start < n: fill up; start > n: take away, tap dots OFF down to n; n can be 0) ---------- */
const tfOn=v=>v===1||v===2;
T.tenframe={ check:true,
  take(d){ return num(d.start)&&d.start>d.n; },
  err(d){ if(!num(d.n)||d.n<0||d.n>20) return 'n must be a number from 0 to 20';
    if(d.start!=null&&(!num(d.start)||d.start<0||d.start>20||d.start===d.n)) return 'start must be a number from 0 to 20, not the same as n (smaller: fill up; bigger: take away)';
    if(d.n===0&&!d.start) return 'n is 0: give a start to take away from'; return ''; },
  init(d){ const take=T.tenframe.take(d), pre=d.start||0, size=(Math.max(d.n,pre)>10)?20:10; return {take, cells:idx(size).map(i=>i<pre?(take?1:2):0)}; },
  say(d){ if(T.tenframe.take(d)) return 'Here are '+d.start+'. Take away '+(d.start-d.n)+'. Tap dots to take them off.';
    return d.start?('Here are '+d.start+'. Fill it up to '+d.n+'.'):('Make '+d.n+'. Put '+d.n+' dots in the boxes.'); },
  how(d){ if(T.tenframe.take(d)) return 'Tap a dot to take it away. Count as you go: 1, 2, 3. Then count the dots that are left.';
    return 'Tap a box to put a dot in it. Count as you go: 1, 2, 3. Tap a dot again to take it out.'; },
  label(d){ return T.tenframe.take(d)?'Ten-frame: '+d.start+' take away '+(d.start-d.n):'Ten-frame: make '+d.n; },
  view(d,s,c){ const f=s.cells.filter(tfOn).length; let h='<div class="obk-tf">';
    for(let fr=0;fr<s.cells.length/10;fr++){ h+='<div class="obk-tf-f">'; for(let j=0;j<10;j++){ const i=fr*10+j, v=s.cells[i];
      h+='<button class="obk-cell'+(v===2?' pre':v===3?' gone':v?' on':'')+'" data-obk="cell" data-k="'+i+'" data-obk-drop="cell" aria-label="box '+(i+1)+(v===3?', taken away':v?', has a dot':', empty')+'"'+(v===2?' disabled':'')+'></button>'; } h+='</div>'; }
    h+='</div><div class="obk-row">'+(s.take?'':'<button class="obk-tray" data-obk="tray" data-obk-drag="tray" aria-label="A dot. Tap it, or drag it into a box."><i></i></button>')+(c.guided?'<span class="obk-count" aria-live="polite">'+f+'</span>':'')+'</div>';
    return h; },
  tap(d,s,a,k,drop){ if(a==='cell'){ const i=+k, v=s.cells[i]; if(v===2) return; s.cells[i]=s.take?(v===1?3:v===3?1:v):(v?0:1); return; }
    if(a==='tray'){ let i=drop&&drop.a==='cell'?+drop.k:-1; if(i<0||s.cells[i]) i=s.cells.indexOf(0); if(i>=0) s.cells[i]=1; } },
  ready(d,s){ return s.take?s.cells.some(v=>v===3):s.cells.some(v=>v===1); },
  judge(d,s){ const f=s.cells.filter(tfOn).length; if(f===d.n) return {ok:true};
    if(s.take) return {ok:false,msg:f>d.n?'Take away more. Count the dots that are left.':'Too many taken away. Tap one to put it back.'};
    return {ok:false,msg:f>d.n?'Too many. Tap a dot to take it out, and count again.':'Not yet. Count the dots. Do you need more?'}; },
  solve(d,s){ s.cells=s.take?s.cells.map((v,i)=>i<d.n?1:i<d.start?3:0):s.cells.map((v,i)=>v===2?2:i<d.n?1:0); } };

/* ---------- hop: a frog on a number line ---------- */
T.hop={ check:true,
  u(d){ return Math.abs(d.unit||1); },
  rng(d){ const u=T.hop.u(d), a=d.start, b=d.start+d.add, w=10*u, lo=d.from!=null?d.from:Math.floor(Math.min(a,b)/w)*w;
    const hi=d.to!=null?d.to:lo+Math.max(w,Math.ceil((Math.max(a,b)-lo)/w)*w); return [lo,hi]; },
  err(d){ if(!num(d.start)||!num(d.add)||d.add===0) return 'needs start and add (add is not 0)'; const u=T.hop.u(d); if(!num(u)||d.add%u) return 'add must be a whole number of hops (a multiple of unit)';
    const r=T.hop.rng(d), b=d.start+d.add; if(d.start<r[0]||d.start>r[1]||b<r[0]||b>r[1]) return 'start and the landing number must be on the line (from..to)';
    if((r[1]-r[0])/u>20) return 'the line is too long: at most 20 hops from one end to the other';
    if(d.ask!=null&&d.ask!=='hops') return "ask can only be 'hops'"; if(d.ask&&d.o&&(!isArr(d.o)||d.o.map(S).indexOf(S(T.hop.n(d)))<0)) return 'o must include the number of hops ('+T.hop.n(d)+')'; return ''; },
  n(d){ return Math.round(Math.abs(d.add)/T.hop.u(d)); },
  opts(d){ return d.ask&&d.o?d.o.map(S):null; },
  init(d){ const s={pos:d.start, path:[d.start]}; if(d.ask) Object.assign(s,{o:d.o?shufNot(d.o.map(S)):numChoices(T.hop.n(d)), off:{}}); return s; },
  say(d){ if(d.ask) return 'Start at '+d.start+'. Hop to '+(d.start+d.add)+'. How many hops?'; const n=Math.abs(d.add)/T.hop.u(d), u=T.hop.u(d); return 'Start at '+d.start+'. Hop '+(d.add>0?'':'back ')+n+' '+(u>1?(n===1?'jump':'jumps')+' of '+u:(n===1?'time':'times'))+'. Where do you land?'; },
  how(d){ if(d.ask) return 'Hop one at a time to the flag and count each hop out loud. The number of hops is the answer.'; return 'Put the frog on '+d.start+'. Tap Hop and count each hop out loud: 1, 2, 3. Stop when you have done them all.'; },
  label(d){ return d.ask?'Number line: hops from '+d.start+' to '+(d.start+d.add):'Number line: '+d.start+(d.add>0?' + ':' - ')+Math.abs(d.add); },
  view(d,s,c){ const r=T.hop.rng(d), u=T.hop.u(d), W=340, pad=18, n=(r[1]-r[0])/u, sx=v=>pad+(v-r[0])*(W-2*pad)/Math.max(1,r[1]-r[0]);
    const fs=n<=10?13:n<=15?11:9.5; let g='<svg class="obk-nl" viewBox="0 0 '+W+' 112" role="img" aria-label="number line from '+r[0]+' to '+r[1]+', the frog is on '+s.pos+'">';
    g+='<line x1="'+pad+'" y1="86" x2="'+(W-pad)+'" y2="86" stroke="#1F2A44" stroke-width="3"/>';
    for(let v=r[0];v<=r[1]+1e-9;v+=u){ const x=sx(v); g+='<line x1="'+x+'" y1="79" x2="'+x+'" y2="93" stroke="#1F2A44" stroke-width="2"/><text x="'+x+'" y="109" font-size="'+fs+'" text-anchor="middle" fill="#1F2A44" font-weight="'+(v===d.start?'900':'600')+'">'+v+'</text>'; }
    g+='<circle cx="'+sx(d.start)+'" cy="86" r="5" fill="#3B6FD8"/>'+(d.ask?'<text x="'+(sx(d.start+d.add)+6)+'" y="40" font-size="24" text-anchor="middle">🚩</text>':'');
    for(let k=0;k+1<s.path.length;k++){ const x1=sx(s.path[k]), x2=sx(s.path[k+1]), mx=(x1+x2)/2; g+='<path d="M'+x1+' 80 Q'+mx+' 46 '+x2+' 80" fill="none" stroke="#FF7A3D" stroke-width="3" stroke-dasharray="5 4"/>'; }
    g+='<text x="'+sx(s.pos)+'" y="74" font-size="30" text-anchor="middle">🐸</text></svg>';
    const hops=Math.round(Math.abs(s.pos-d.start)/u), at=s.pos===d.start+d.add;
    if(d.ask) return g+'<p class="obk-count sm" aria-live="polite">'+(c.guided?'Hops: '+hops:at?'You are at the flag!':'Hop to the flag 🚩')+'</p>'+
      (at||s.over?'<div class="obk-opts">'+s.o.map((o,j)=>'<button class="obk-opt'+(s.off[j]?' off':'')+(s.over&&o===S(T.hop.n(d))?' right':'')+(c.hint&&o===S(T.hop.n(d))&&!s.over?' obk-pulse':'')+'" data-obk="pick" data-k="'+j+'"'+(s.off[j]||s.over?' disabled':'')+'>'+E(o)+'</button>').join('')+'</div>':'')+
      '<div class="obk-row"><button class="obk-btn" data-obk="back" aria-label="Hop back"'+(s.pos-u<r[0]-1e-9||s.over?' disabled':'')+'>◀ Hop</button><button class="obk-btn obk-pri'+(c.guided&&!at?' obk-pulse':'')+'" data-obk="fwd" aria-label="Hop forward"'+(s.pos+u>r[1]+1e-9||s.over?' disabled':'')+'>Hop ▶</button></div>';
    return g+'<p class="obk-count sm" aria-live="polite">Hops: '+hops+(c.guided?' of '+Math.round(Math.abs(d.add)/u):'')+'</p>'+
      '<div class="obk-row"><button class="obk-btn" data-obk="back" aria-label="Hop back"'+(s.pos-u<r[0]-1e-9?' disabled':'')+'>◀ Hop</button><button class="obk-btn obk-pri'+(c.guided&&hops<Math.abs(d.add)/u&&d.add>0?' obk-pulse':'')+'" data-obk="fwd" aria-label="Hop forward"'+(s.pos+u>r[1]+1e-9?' disabled':'')+'>Hop ▶</button></div>'; },
  tap(d,s,a,k){ if(a==='pick'){ if(!d.ask) return; const j=+k; if(s.off[j]) return; if(s.o[j]===S(T.hop.n(d))) return 'ok'; s.off[j]=1; s.msg='Not '+s.o[j]+'. Count the orange hops again.'; return 'miss'; }
    const r=T.hop.rng(d), u=T.hop.u(d); let np=s.pos; if(a==='fwd') np=s.pos+u; else if(a==='back') np=s.pos-u; else return;
    if(np<r[0]-1e-9||np>r[1]+1e-9) return; if(s.path.length>1&&s.path[s.path.length-2]===np) s.path.pop(); else s.path.push(np); s.pos=np; },
  ready(d,s){ return s.pos!==d.start; },
  judge(d,s){ const b=d.start+d.add; if(s.pos===b) return {ok:true}; const past=d.add>0?s.pos>b:s.pos<b;
    return {ok:false,msg:past?'Too far! Hop back and count the hops again.':'Keep hopping. Count every hop.'}; },
  solve(d,s){ const u=T.hop.u(d), st=d.add>0?u:-u; s.path=[d.start]; for(let v=d.start;v!==d.start+d.add;){ v+=st; s.path.push(v); } s.pos=d.start+d.add; } };

/* ---------- count: tap each picture, then pick the number ---------- */
T.count={
  err(d){ if(!num(d.n)||d.n<1||d.n>20) return 'n must be a number from 1 to 20'; if(d.o&&(!isArr(d.o)||d.o.map(S).indexOf(S(d.n))<0)) return 'o must include n'; return ''; },
  opts(d){ return d.o?d.o.map(S):null; },
  init(d){ return {tap:[], off:{}, o:d.o?shufNot(d.o.map(S)):numChoices(d.n)}; },
  say(d){ return 'Tap each '+(d.name||'one')+' to count. How many?'; },
  how(){ return 'Touch each one and say the next number. The last number you say tells how many.'; },
  label(d){ return 'Count '+d.n; },
  view(d,s,c){ let h='<div class="obk-objs" role="group" aria-label="pictures to count">';
    for(let i=0;i<d.n;i++){ const t=s.tap.indexOf(i); h+='<button class="obk-obj'+(t>=0?' on':'')+'" data-obk="obj" data-k="'+i+'" aria-label="'+(t>=0?'counted '+(t+1):'picture '+(i+1))+'">'+pic(d.pic||'🍎')+(t>=0?'<b>'+(t+1)+'</b>':'')+'</button>'+((i+1)%5===0&&i<d.n-1?'<span class="obk-br"></span>':''); }
    h+='</div>';
    if(c.guided&&s.tap.length<d.n&&!s.solved) return h+'<p class="obk-note">Count them all first.</p>';
    return h+'<div class="obk-opts">'+s.o.map((o,j)=>'<button class="obk-opt'+(s.off[j]?' off':'')+(s.over&&o===S(d.n)?' right':'')+(c.hint&&o===S(d.n)&&!s.over?' obk-pulse':'')+'" data-obk="pick" data-k="'+j+'"'+(s.off[j]||s.over?' disabled':'')+'>'+E(o)+'</button>').join('')+'</div>'; },
  tap(d,s,a,k){ if(a==='obj'){ const i=+k; if(s.tap.indexOf(i)<0) s.tap.push(i); return; }
    if(a==='pick'){ const j=+k; if(s.off[j]) return; if(s.o[j]===S(d.n)) return 'ok'; s.off[j]=1; s.msg='Not '+s.o[j]+'. Touch each one and count again.'; return 'miss'; } },
  solve(d,s){ s.tap=idx(d.n); } };

/* ---------- blocks: build a number with tens and ones ---------- */
T.blocks={ check:true,
  err(d){ if(!num(d.n)||d.n<1||d.n>99||d.n%1) return 'n must be a whole number from 1 to 99'; return ''; },
  init(){ return {t:0,o:0}; },
  say(d){ return 'Build '+d.n+' with tens and ones.'; },
  how(d){ const t=Math.floor(d.n/10), o=d.n%10; return 'A ten is a tall stick of 10. A one is a little cube. '+d.n+' is '+t+(t===1?' ten':' tens')+' and '+o+(o===1?' one.':' ones.'); },
  label(d){ return 'Blocks: build '+d.n; },
  view(d,s,c){ let m='<div class="obk-mat" data-obk-drop="mat" aria-label="your mat">';
    for(let i=0;i<s.t;i++) m+='<button class="obk-tb" data-obk="rmt" data-k="'+i+'" aria-label="a ten, tap to take it away"><span class="obk-ten"></span></button>';
    m+='<span class="obk-ones">'; for(let i=0;i<s.o;i++) m+='<button class="obk-ob" data-obk="rmo" data-k="'+i+'" aria-label="a one, tap to take it away"><span class="obk-one"></span></button>'; m+='</span>';
    if(!s.t&&!s.o) m+='<span class="obk-note">Your mat</span>'; m+='</div>';
    const lab=s.t+(s.t===1?' ten':' tens')+' and '+s.o+(s.o===1?' one':' ones')+(c.guided?' = '+(s.t*10+s.o):'');
    return m+'<p class="obk-count sm" aria-live="polite">'+lab+'</p><div class="obk-row"><button class="obk-btn" data-obk="ten" data-obk-drag="ten" aria-label="Add a ten"><span class="obk-ten mini"></span> + 10</button><button class="obk-btn" data-obk="one" data-obk-drag="one" aria-label="Add a one"><span class="obk-one mini"></span> + 1</button></div>'; },
  tap(d,s,a){ if(a==='ten'&&s.t<9) s.t++; else if(a==='one'&&s.o<19) s.o++; else if(a==='rmt'&&s.t>0) s.t--; else if(a==='rmo'&&s.o>0) s.o--; },
  ready(d,s){ return s.t+s.o>0; },
  judge(d,s){ const v=s.t*10+s.o; if(v===d.n&&s.o<10) return {ok:true}; if(v===d.n) return {ok:false,msg:'That is '+d.n+', but trade 10 ones for 1 ten.'};
    return {ok:false,msg:v<d.n?'Not enough yet. Count your tens and ones.':'Too many. Tap a block to take it away.'}; },
  solve(d,s){ s.t=Math.floor(d.n/10); s.o=d.n%10; } };

/* ---------- tiles: build a word or number in order ---------- */
T.tiles={ check:true,
  err(d){ if(!isArr(d.w)||d.w.length<2||d.w.length>8) return 'w must be a list of 2 to 8 tiles'; if(d.extra&&!isArr(d.extra)) return 'extra must be a list'; if(d.w.concat(d.extra||[]).length>10) return 'at most 10 tiles in all'; return ''; },
  init(d){ return {pool:shufNot(d.w.concat(d.extra||[]).map(S)), used:{}, slots:d.w.map(()=>-1), wrong:{}}; },
  say(d){ return d.hear?'Listen. Build the word with the tiles.':'Put the tiles in the right order.'; },
  how(d){ return d.hear?'Say the word slowly. Find the first sound, then the next. Tap the tiles in order.':'Find the one that comes first. Then the next. Tap them in order.'; },
  label(d){ return 'Tiles: '+d.w.join(d.he?'':'-'); },
  view(d,s,c){ let h=(d.hear?'<button class="obk-btn obk-hear" data-obk="hear" aria-label="Hear it">🔊 Hear it</button>':'')+'<div class="obk-slots'+heCls(d)+'">';
    s.slots.forEach((j,i)=>{ h+='<button class="obk-slot'+(j>=0?' full':'')+(s.wrong[i]?' obk-shake':'')+'" data-obk="slot" data-k="'+i+'" data-obk-drop="slot" aria-label="place '+(i+1)+(j>=0?': '+E(s.pool[j]):', empty')+'">'+(j>=0?E(s.pool[j]):c.guided?'<span class="ghost">'+E(d.w[i])+'</span>':'')+'</button>'; });
    h+='</div><div class="obk-pool'+heCls(d)+'">'; s.pool.forEach((t,j)=>{ h+=s.used[j]?'<span class="obk-tile gone"></span>':'<button class="obk-tile" data-obk="tile" data-k="'+j+'" data-obk-drag="tile">'+E(t)+'</button>'; });
    return h+'</div>'; },
  tap(d,s,a,k,drop){ s.wrong={};
    if(a==='slot'){ const i=+k, j=s.slots[i]; if(j>=0){ s.slots[i]=-1; delete s.used[j]; } return; }
    if(a==='tile'){ const j=+k; if(s.used[j]) return; let i=drop&&drop.a==='slot'?+drop.k:s.slots.indexOf(-1); if(i<0) return;
      const old=s.slots[i]; if(old>=0) delete s.used[old]; s.slots[i]=j; s.used[j]=1; } },
  ready(d,s){ return s.slots.indexOf(-1)<0; },
  judge(d,s){ let bad=0; s.slots.forEach((j,i)=>{ if(s.pool[j]!==S(d.w[i])){ bad++; s.wrong[i]=1; } }); if(!bad) return {ok:true};
    s.slots.forEach((j,i)=>{ if(s.wrong[i]){ delete s.used[j]; s.slots[i]=-1; } }); return {ok:false,msg:'Some tiles were in the wrong place. Try those again.'}; },
  solve(d,s){ s.used={}; s.slots=d.w.map(t=>{ const j=s.pool.findIndex((x,jj)=>x===S(t)&&!s.used[jj]); s.used[j]=1; return j; }); s.wrong={}; } };

/* ---------- findall: tap every target ---------- */
T.findall={
  tg(d){ return (isArr(d.find)?d.find:[d.find]).map(S); },
  err(d){ if(!isArr(d.grid)||d.grid.length<3||d.grid.length>20) return 'grid must be a list of 3 to 20 things'; if(d.find==null||d.find==='') return 'find is missing';
    const t=T.findall.tg(d); if(!d.grid.some(x=>t.indexOf(S(x))>=0)) return 'the grid has no '+t[0]; if(d.grid.every(x=>t.indexOf(S(x))>=0)) return 'the grid needs some things that are not '+t[0]; return ''; },
  init(){ return {found:{}, bad:-1}; },
  say(d){ return 'Tap every '+(d.findSay||T.findall.tg(d)[0])+'.'; },
  how(d){ return 'Look at each one, row by row. Is it a '+(d.findSay||T.findall.tg(d)[0])+'? Tap it.'; },
  label(d){ return 'Find every '+T.findall.tg(d)[0]; },
  view(d,s,c){ const t=T.findall.tg(d), tot=d.grid.filter(x=>t.indexOf(S(x))>=0).length, got=Object.keys(s.found).length;
    const firstLeft=d.grid.findIndex((x,i)=>t.indexOf(S(x))>=0&&!s.found[i]);
    let h='<div class="obk-find'+heCls(d)+(d.grid.length>12?' many':'')+'">'; d.grid.forEach((x,i)=>{ h+='<button class="obk-fc'+(s.found[i]?' on':'')+(s.bad===i?' obk-shake':'')+((c.guided&&!got||c.hint)&&i===firstLeft?' obk-pulse':'')+'" data-obk="cell" data-k="'+i+'"'+(s.found[i]?' disabled':'')+'>'+pic(x)+(s.found[i]?'<b>✓</b>':'')+'</button>'; });
    return h+'</div><p class="obk-count sm" aria-live="polite">Found '+got+(c.guided?' of '+tot:'')+'</p>'; },
  tap(d,s,a,k){ if(a!=='cell') return; const i=+k, t=T.findall.tg(d); if(s.found[i]) return; s.bad=-1;
    if(t.indexOf(S(d.grid[i]))>=0){ s.found[i]=1; const tot=d.grid.filter(x=>t.indexOf(S(x))>=0).length; return Object.keys(s.found).length>=tot?'ok':undefined; }
    s.bad=i; s.msg='That one is not a '+(d.findSay||t[0])+'. Look again.'; return 'bump'; },
  solve(d,s){ const t=T.findall.tg(d); d.grid.forEach((x,i)=>{ if(t.indexOf(S(x))>=0) s.found[i]=1; }); } };

/* ---------- match: pair each left with its right ---------- */
T.match={
  err(d){ if(!isArr(d.pairs)||d.pairs.length<2||d.pairs.length>4) return 'pairs must be a list of 2 to 4 pairs'; if(d.pairs.some(p=>!isArr(p)||p.length!==2)) return 'each pair is [left, right]'; return ''; },
  opts(d){ return d.pairs; },
  init(d){ return {ro:shufNot(idx(d.pairs.length)), sel:null, done:{}, bad:null}; },
  say(){ return 'Match each one to its partner. Tap one, then tap its match.'; },
  how(){ return 'Tap a picture. Then tap the one that goes with it. A line of color shows a match.'; },
  label(d){ return 'Match '+d.pairs.length+' pairs'; },
  view(d,s,c){ const L='<div class="obk-col">'+d.pairs.map((p,i)=>'<button class="obk-m'+(s.done[i]?' m'+(i%4):'')+(s.sel&&s.sel.side==='L'&&s.sel.k===i?' sel':'')+(s.bad&&s.bad[0]===i?' obk-shake':'')+'" data-obk="L" data-k="'+i+'" data-obk-drag="L"'+(s.done[i]?' disabled':'')+'>'+pic(p[0])+'</button>').join('')+'</div>';
    const R='<div class="obk-col'+heCls(d)+'">'+s.ro.map(i=>'<button class="obk-m'+(s.done[i]?' m'+(i%4):'')+(s.sel&&s.sel.side==='R'&&s.sel.k===i?' sel':'')+(s.bad&&s.bad[1]===i?' obk-shake':'')+(c.hint&&s.sel&&s.sel.side==='L'&&s.sel.k===i?' obk-pulse':'')+'" data-obk="R" data-k="'+i+'" data-obk-drop="R"'+(s.done[i]?' disabled':'')+'>'+pic(d.pairs[i][1])+'</button>').join('')+'</div>';
    return '<div class="obk-match">'+L+'<div class="obk-mid" aria-hidden="true">↔</div>'+R+'</div>'; },
  pair(d,s,i,j){ s.sel=null; if(i===j){ s.done[i]=1; s.bad=null; return Object.keys(s.done).length>=d.pairs.length?'ok':undefined; } s.bad=[i,j]; s.msg='Those two do not go together. Try again.'; return 'bump'; },
  tap(d,s,a,k,drop){ const i=+k; s.bad=null;
    if(a==='L'){ if(s.done[i]) return; if(drop&&drop.a==='R') return T.match.pair(d,s,i,+drop.k); if(s.sel&&s.sel.side==='R') return T.match.pair(d,s,i,s.sel.k); s.sel={side:'L',k:i}; return; }
    if(a==='R'){ if(s.done[i]) return; if(s.sel&&s.sel.side==='L') return T.match.pair(d,s,s.sel.k,i); s.sel={side:'R',k:i}; } },
  solve(d,s){ d.pairs.forEach((p,i)=>{ s.done[i]=1; }); } };

/* ---------- sort: cards into 2-3 bins, one card at a time ---------- */
T.sort={
  err(d){ if(!isArr(d.bins)||d.bins.length<2||d.bins.length>3) return 'bins must be a list of 2 or 3 names'; if(!isArr(d.cards)||d.cards.length<2||d.cards.length>8) return 'cards must be a list of 2 to 8 cards';
    if(d.cards.some(c=>!isArr(c)||c.length!==2||!num(c[1])||c[1]<0||c[1]>=d.bins.length)) return 'each card is [picture, bin number starting at 0]'; return ''; },
  init(d){ return {order:shufNot(idx(d.cards.length)), place:{}, bad:false}; },
  cur(s){ return s.order.find(i=>s.place[i]==null); },
  say(){ return 'Where does it go? Tap the right box.'; },
  how(){ return 'Look at the card. Which box is it like? Tap that box, or drag the card into it.'; },
  label(d){ return 'Sort into '+d.bins.join(' / '); },
  view(d,s,c){ const cur=T.sort.cur(s); let h='<div class="obk-card-wrap">'+(cur==null?'<span class="obk-note">All sorted!</span>':'<button class="obk-card'+(s.bad?' obk-shake':'')+'" data-obk="card" data-k="'+cur+'" data-obk-drag="card" aria-label="card: '+E(d.cards[cur][0])+'">'+pic(d.cards[cur][0])+'</button>')+'</div>';
    h+='<div class="obk-bins n'+d.bins.length+'">'+d.bins.map((b,j)=>'<button class="obk-bin'+(c.hint&&cur!=null&&d.cards[cur][1]===j?' obk-pulse':'')+'" data-obk="bin" data-k="'+j+'" data-obk-drop="bin"><span class="obk-bin-t">'+E(b)+'</span><span class="obk-bin-in">'+
      Object.keys(s.place).filter(i=>s.place[i]===j).map(i=>'<i>'+pic(d.cards[i][0])+'</i>').join('')+'</span></button>').join('')+'</div>';
    return h; },
  tap(d,s,a,k,drop){ const cur=T.sort.cur(s); if(cur==null) return; s.bad=false; let b=-1;
    if(a==='bin') b=+k; else if(a==='card'&&drop&&drop.a==='bin') b=+drop.k; else return;
    if(d.cards[cur][1]===b){ s.place[cur]=b; return T.sort.cur(s)==null?'ok':undefined; }
    s.bad=true; s.msg='Not that box. Look at it again.'; return 'bump'; },
  solve(d,s){ d.cards.forEach((c,i)=>{ s.place[i]=c[1]; }); } };

/* ---------- trace: finger-trace a dotted letter or number ---------- */
const TR={ W:300, G:12, R:22 };
T.trace={ check:true, needsMount:true,
  err(d){ if(d.glyph==null||!S(d.glyph).length||S(d.glyph).length>3) return 'glyph must be 1 to 3 letters or digits'; return ''; },
  init(){ return {strokes:[], hit:{}, stray:{}, tgt:null}; },
  say(d){ return 'Trace the '+(d.name||S(d.glyph))+' with your finger. Stay on the dots.'; },
  how(){ return 'Start at the top. Keep your finger on the dots and go slowly. Cover all the dots.'; },
  label(d){ return 'Trace '+S(d.glyph); },
  font(d){ const n=S(d.glyph).length, px=n===1?230:n===2?150:105; return d.he?'bold '+px+'px "Frank Ruhl Libre","Noto Serif Hebrew",serif':'bold '+px+'px "Nunito","Arial Rounded MT Bold",Arial,sans-serif'; },
  targets(d){ try{ const cv=document.createElement('canvas'); cv.width=TR.W; cv.height=TR.W; const x=cv.getContext('2d'); x.font=T.trace.font(d); x.textAlign='center'; x.textBaseline='middle'; x.fillStyle='#000'; x.fillText(S(d.glyph),TR.W/2,TR.W/2+8);
      const px=x.getImageData(0,0,TR.W,TR.W).data, n=TR.W/TR.G, out=[];
      for(let cy=0;cy<n;cy++) for(let cx=0;cx<n;cx++){ let ink=0; [[.5,.5],[.25,.25],[.75,.25],[.25,.75],[.75,.75]].forEach(o=>{ const X=Math.floor((cx+o[0])*TR.G), Y=Math.floor((cy+o[1])*TR.G); if(px[(Y*TR.W+X)*4+3]>110) ink++; }); if(ink>=2) out.push(cy*n+cx); }
      return out; }catch(e){ return []; } },
  view(d,s){ return '<div class="obk-trace'+heCls(d)+'"><canvas data-obk-trace width="'+TR.W+'" height="'+TR.W+'" aria-label="Trace '+E(d.name||d.glyph)+' here with your finger"></canvas></div><div class="obk-row"><button class="ob-link" data-obk="clear">Start over</button></div>'; },
  mark(s,x,y){ const n=TR.W/TR.G, set={}; (s.tgt||[]).forEach(i=>set[i]=1); const r=TR.R;
    for(let cy=Math.max(0,Math.floor((y-r)/TR.G));cy<=Math.min(n-1,Math.floor((y+r)/TR.G));cy++) for(let cx=Math.max(0,Math.floor((x-r)/TR.G));cx<=Math.min(n-1,Math.floor((x+r)/TR.G));cx++){
      const mx=(cx+.5)*TR.G, my=(cy+.5)*TR.G; if((mx-x)*(mx-x)+(my-y)*(my-y)<=r*r){ const i=cy*n+cx; if(set[i]) s.hit[i]=1; else s.stray[i]=1; } } },
  draw(cv,d,s){ const x=cv.getContext('2d'); if(!x) return; x.clearRect(0,0,TR.W,TR.W); x.font=T.trace.font(d); x.textAlign='center'; x.textBaseline='middle';
    x.fillStyle='#EFE9DD'; x.fillText(S(d.glyph),TR.W/2,TR.W/2+8); x.save(); x.setLineDash([2,11]); x.lineCap='round'; x.lineWidth=6; x.strokeStyle='#8E97AA'; x.strokeText(S(d.glyph),TR.W/2,TR.W/2+8); x.restore();
    if(s.solved){ x.fillStyle='rgba(30,158,98,.85)'; x.fillText(S(d.glyph),TR.W/2,TR.W/2+8); return; }
    x.strokeStyle='rgba(30,158,98,.78)'; x.fillStyle='rgba(30,158,98,.78)'; x.lineCap='round'; x.lineJoin='round'; x.lineWidth=TR.R*1.4;
    s.strokes.forEach(st=>{ if(st.length===1){ x.beginPath(); x.arc(st[0][0],st[0][1],TR.R*.7,0,7); x.fill(); return; } x.beginPath(); x.moveTo(st[0][0],st[0][1]); st.slice(1).forEach(p=>x.lineTo(p[0],p[1])); x.stroke(); }); },
  mount(root,d,s){ const cv=root.querySelector('canvas[data-obk-trace]'); if(!cv) return; if(!s.tgt) s.tgt=T.trace.targets(d); T.trace.draw(cv,d,s);
    let down=false; const pt=e=>{ const r=cv.getBoundingClientRect(); return [ (e.clientX-r.left)*TR.W/Math.max(1,r.width), (e.clientY-r.top)*TR.W/Math.max(1,r.height) ]; };
    const add=(e,start)=>{ if(s.over||s.solved) return; const p=pt(e); if(start) s.strokes.push([p]); else { const st=s.strokes[s.strokes.length-1]; if(st) st.push(p); }
      const st=s.strokes[s.strokes.length-1], q=st.length>1?st[st.length-2]:p, steps=Math.max(1,Math.ceil(Math.hypot(p[0]-q[0],p[1]-q[1])/6));
      for(let k=1;k<=steps;k++) T.trace.mark(s,q[0]+(p[0]-q[0])*k/steps,q[1]+(p[1]-q[1])*k/steps); T.trace.draw(cv,d,s); };
    cv.addEventListener('pointerdown',e=>{ e.preventDefault(); down=true; try{ cv.setPointerCapture(e.pointerId); }catch(x){} add(e,true); });
    cv.addEventListener('pointermove',e=>{ if(down){ e.preventDefault(); add(e,false); } });
    const up=()=>{ down=false; }; cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up); cv.addEventListener('pointerleave',up); },
  tap(d,s,a){ if(a==='clear'){ s.strokes=[]; s.hit={}; s.stray={}; } },
  cover(s){ const tot=(s.tgt||[]).length; return tot?Object.keys(s.hit).length/tot:0; },
  ready(){ return true; },
  judge(d,s){ if(!s.strokes.length) return {ok:false,soft:true,msg:'Put your finger on the dots and trace.'}; const tot=(s.tgt||[]).length; if(!tot) return {ok:true}; const cov=T.trace.cover(s), stray=Object.keys(s.stray).length;
    if(cov>=0.8&&stray<=tot*1.6) return {ok:true}; if(cov>=0.8) return {ok:false,msg:'Stay on the dots. Tap Start over and go slowly.'};
    return {ok:false,msg:'Keep going! Cover all the dots.'}; },
  solve(d,s){ s.solved=true; (s.tgt||[]).forEach(i=>s.hit[i]=1); } };

/* ---------- listen: hear it, tap the match ---------- */
T.listen={
  err(d){ if(!isArr(d.o)||d.o.length<2||d.o.length>4) return 'o must be a list of 2 to 4 choices'; if(d.o.map(S).indexOf(S(d.a))<0) return 'a must be one of the choices'; if(!d.hear&&!d.clip) return 'needs hear (words to say) or clip'; if(d.he&&!d.clip) return 'Hebrew needs a recorded clip (no computer voice)'; return ''; },
  opts(d){ return d.o; },
  init(d){ return {o:shufNot(d.o.map(S)), off:{}}; },
  say(d){ return 'Listen. Tap the one you hear.'; },
  how(){ return 'Tap the speaker to hear it again. Say it with me. Then tap the one that matches.'; },
  label(d){ return 'Listen: '+S(d.a); },
  view(d,s,c){ return '<button class="obk-btn obk-hear big" data-obk="hear" aria-label="Hear it again">🔊</button>'+(d.cap&&(s.off&&Object.keys(s.off).length||c.guided)?'<p class="obk-note">'+E(d.cap)+'</p>':'')+
    '<div class="obk-opts'+heCls(d)+'">'+s.o.map((o,j)=>'<button class="obk-opt'+(s.off[j]?' off':'')+(s.over&&o===S(d.a)?' right':'')+(c.hint&&o===S(d.a)&&!s.over?' obk-pulse':'')+'" data-obk="pick" data-k="'+j+'"'+(s.off[j]||s.over?' disabled':'')+'>'+pic(o)+'</button>').join('')+'</div>'; },
  tap(d,s,a,k){ if(a!=='pick') return; const j=+k; if(s.off[j]) return; if(s.o[j]===S(d.a)) return 'ok'; s.off[j]=1; s.msg='Not that one. Listen again.'; return 'miss'; },
  solve(){} };

/* ---------- fbar: a fraction bar. Shade n/d; or shade a bar cut in `to` parts to equal n/d; or split:true, cut the n/d bar until it has `to` parts ---------- */
const FW=['','whole','half','third','fourth','fifth','sixth','seventh','eighth','ninth','tenth','eleventh','twelfth'];
function frw(n,d){ if(d===2) return n+(n===1?' half':' halves'); const w=FW[d]||(d+'th'); return n+' '+w+(n===1?'':'s'); }
function only23(k){ while(k%2===0) k/=2; while(k%3===0) k/=3; return k===1; }
T.fbar={ check:true,
  mode(d){ return d.split?'split':d.to?'equal':'shade'; },
  err(d){ if(!num(d.d)||d.d<1||d.d>12||d.d%1) return 'd (parts) must be a whole number from 1 to 12'; if(!num(d.n)||d.n<0||d.n>d.d||d.n%1) return 'n must be a whole number from 0 to d';
    if(d.to!=null){ if(!num(d.to)||d.to%1||d.to<2||d.to>24||d.to===d.d) return 'to must be a whole number of parts from 2 to 24 (not d)';
      if((d.n*d.to)%d.d) return 'n/d cannot be made with '+d.to+' parts (n x to must divide by d)';
      if(d.split&&(d.to%d.d||!only23(d.to/d.d))) return 'split: to must be d times 2, 3, 4, 6, 8 or 9 (each cut splits every part in 2 or 3)'; }
    else if(d.split) return 'split needs to (how many parts at the end)'; return ''; },
  init(d){ const m=T.fbar.mode(d); return m==='split'?{parts:d.d}:{on:{}}; },
  goal(d){ return d.to?d.n*d.to/d.d:d.n; },
  say(d){ const m=T.fbar.mode(d); if(m==='split') return 'Cut every part until the bar has '+d.to+' parts. The shaded part stays the same.';
    if(m==='equal') return 'The top bar shows '+frw(d.n,d.d)+'. Shade the bottom bar to show the same amount.'; return 'Shade '+frw(d.n,d.d)+' of the bar.'; },
  how(d){ const m=T.fbar.mode(d); if(m==='split') return 'Each cut splits every part into 2 or 3 smaller parts. The shaded amount stays the same; only the names change.';
    if(m==='equal') return 'Line up the bars. Shade parts of the bottom bar until the orange ends at the same place as the top bar.';
    return 'The bottom number tells how many equal parts. The top number tells how many to shade. Tap parts to shade them.'; },
  label(d){ const m=T.fbar.mode(d); return m==='split'?'Fraction bar: split '+d.n+'/'+d.d+' into '+d.to+' parts':m==='equal'?'Fraction bar: '+d.n+'/'+d.d+' = ?/'+d.to:'Fraction bar: shade '+d.n+'/'+d.d; },
  bar(parts,shaded,act,onFn,big){ let h='<div class="obk-fb'+(big?' big':'')+'" role="group">'; for(let i=0;i<parts;i++){ const on=onFn(i);
      h+=act&&!(act==='btn')?'<button class="obk-fp'+(on?' on':'')+'" data-obk="part" data-k="'+i+'" aria-label="part '+(i+1)+(on?', shaded':'')+'"></button>':'<i class="obk-fp'+(on?' on':'')+'"></i>'; }
    return h+'</div>'; },
  view(d,s,c){ const m=T.fbar.mode(d);
    if(m==='split'){ const k=s.parts/d.d, sh=d.n*k;
      return T.fbar.bar(s.parts,sh,null,i=>i<sh,true)+'<p class="obk-count sm" aria-live="polite">'+s.parts+' parts'+(c.guided||s.over?' · '+sh+'/'+s.parts+' shaded':'')+'</p>'+
        '<div class="obk-row"><button class="obk-btn" data-obk="cut" data-k="2"'+(s.parts*2>24?' disabled':'')+'>✂ Cut in 2</button><button class="obk-btn" data-obk="cut" data-k="3"'+(s.parts*3>24?' disabled':'')+'>✂ Cut in 3</button><button class="ob-link" data-obk="reset">Start over</button></div>'; }
    const P=m==='equal'?d.to:d.d, tap=P<=6, cnt=Object.keys(s.on).length;
    let h=(m==='equal'?T.fbar.bar(d.d,d.n,null,i=>i<d.n)+'<p class="obk-note">'+d.n+'/'+d.d+'</p>':'')+T.fbar.bar(P,cnt,tap?'tap':null,i=>!!s.on[i],true);
    h+='<p class="obk-count sm" aria-live="polite">'+(c.guided||s.over?cnt+'/'+P+' shaded':'Shaded: '+cnt)+'</p>';
    if(!tap) h+='<div class="obk-row"><button class="obk-btn" data-obk="less" aria-label="Shade one less">◀ Less</button><button class="obk-btn obk-pri" data-obk="more" aria-label="Shade one more">More ▶</button></div>';
    return h; },
  tap(d,s,a,k){ const m=T.fbar.mode(d);
    if(m==='split'){ if(a==='cut'){ const f=+k; if(s.parts*f<=24) s.parts*=f; } else if(a==='reset') s.parts=d.d; return; }
    const P=m==='equal'?d.to:d.d;
    if(a==='part'){ const i=+k; if(s.on[i]) delete s.on[i]; else s.on[i]=1; return; }
    const cnt=Object.keys(s.on).length; if(a==='more'&&cnt<P){ s.on={}; for(let i=0;i<=cnt;i++) s.on[i]=1; } else if(a==='less'&&cnt>0){ s.on={}; for(let i=0;i<cnt-1;i++) s.on[i]=1; } },
  ready(d,s){ return T.fbar.mode(d)==='split'?s.parts!==d.d:true; },
  judge(d,s){ const m=T.fbar.mode(d);
    if(m==='split'){ if(s.parts===d.to) return {ok:true}; if(s.parts>d.to||d.to%s.parts) { return {ok:false,msg:'That is '+s.parts+' parts. We need '+d.to+'. Tap Start over and cut again.'}; } return {ok:false,msg:s.parts+' parts. Cut again to get '+d.to+'.'}; }
    const cnt=Object.keys(s.on).length, g=T.fbar.goal(d); if(cnt===g) return {ok:true};
    return {ok:false,msg:cnt>g?'Too much is shaded. Tap a part to take it off.':'Not enough yet. Shade more parts.'}; },
  solve(d,s){ if(T.fbar.mode(d)==='split'){ s.parts=d.to; return; } s.on={}; for(let i=0;i<T.fbar.goal(d);i++) s.on[i]=1; } };

/* ---------- clock: set the hands to a time (step 60 / 30 / 15 / 5 minutes); with add, show the time that much later (elapsed time) ---------- */
function ckFmt(t){ t=((t%720)+720)%720; const h=Math.floor(t/60)||12, m=t%60; return h+':'+(m<10?'0':'')+m; }
function ckSay(t){ t=((t%720)+720)%720; const h=Math.floor(t/60)||12, m=t%60; return m===0?h+" o'clock":m===30?'half past '+h:ckFmt(t); }
function ckDur(a){ a=Math.abs(a); const h=Math.floor(a/60), m=a%60; return (h?h+(h===1?' hour':' hours'):'')+(h&&m?' and ':'')+(m?m+' minutes':''); }
T.clock={ check:true,
  step(d){ return d.step||(d.add?5:d.m%30===0?30:d.m%15===0?15:5); },
  goal(d){ return ((d.h%12)*60+d.m+(d.add||0)+720*2)%720; },
  err(d){ if(!num(d.h)||d.h<1||d.h>12||d.h%1) return 'h must be a whole hour from 1 to 12'; if(!num(d.m)||d.m<0||d.m>59||d.m%1) return 'm must be whole minutes from 0 to 59';
    const st=T.clock.step(d); if([5,10,15,30,60].indexOf(st)<0) return 'step must be 5, 10, 15, 30 or 60 minutes'; if(d.m%st) return 'm must be a multiple of step ('+st+')';
    if(d.add!=null&&(!num(d.add)||d.add===0||Math.abs(d.add)>=720||d.add%st)) return 'add (minutes later) must be a multiple of step, not 0, under 12 hours'; return ''; },
  init(d){ return {t:d.add?((d.h%12)*60+d.m):0}; },
  say(d){ return d.add?'It is '+ckSay((d.h%12)*60+d.m)+'. Show the time '+ckDur(d.add)+(d.add>0?' later.':' earlier.'):'Set the clock to '+ckSay((d.h%12)*60+d.m)+'.'; },
  how(d){ const st=T.clock.step(d); if(d.add) return 'Move the long hand one jump at a time and count the minutes. Each number on the clock is 5 minutes; all the way around is 1 hour.';

  view(d,s,c){ const t=((s.t%720)+720)%720, R=100, cx=110, cy=110, st=T.clock.step(d), ha=t/720*360, ma=(t%60)*6; let g='<svg class="obk-ckface" viewBox="0 0 220 220" role="img" aria-label="clock showing '+ckFmt(t)+'">';

    for(let k=0;k<60;k++){ const a=k*6*Math.PI/180, r1=k%5?94:88; g+='<line x1="'+(cx+Math.sin(a)*r1).toFixed(1)+'" y1="'+(cy-Math.cos(a)*r1).toFixed(1)+'" x2="'+(cx+Math.sin(a)*98).toFixed(1)+'" y2="'+(cy-Math.cos(a)*98).toFixed(1)+'" stroke="#1F2A44" stroke-width="'+(k%5?1:3)+'"/>'; }
    for(let k=1;k<=12;k++){ const a=k*30*Math.PI/180; g+='<text x="'+(cx+Math.sin(a)*74).toFixed(1)+'" y="'+(cy-Math.cos(a)*74+8).toFixed(1)+'" font-size="22" font-weight="800" text-anchor="middle" fill="#1F2A44">'+k+'</text>'; }
    const hand=(a,len,w,col)=>'<line x1="110" y1="110" x2="'+(cx+Math.sin(a*Math.PI/180)*len).toFixed(1)+'" y2="'+(cy-Math.cos(a*Math.PI/180)*len).toFixed(1)+'" stroke="'+col+'" stroke-width="'+w+'" stroke-linecap="round"/>';
    g+=hand(ha,52,9,'#1F2A44')+hand(ma,84,5,'#3B6FD8')+'<circle cx="110" cy="110" r="7" fill="#FF7A3D"/></svg>';
    const mins=st>=60?'':'<div class="obk-ckrow"><span class="obk-cklab">Long hand: minutes</span><button class="obk-btn" data-obk="mb" aria-label="minutes back '+st+'">◀ '+st+' min</button><button class="obk-btn obk-pri" data-obk="mf" aria-label="minutes forward '+st+'">'+st+' min ▶</button></div>';
    return g+(c.guided||s.over?'<p class="obk-count sm" aria-live="polite">'+ckFmt(t)+'</p>':'')+'<div class="obk-ck">'+
      '<div class="obk-ckrow"><span class="obk-cklab">Short hand: hour</span><button class="obk-btn" data-obk="hb" aria-label="hour back">◀</button><button class="obk-btn obk-pri" data-obk="hf" aria-label="hour forward">▶</button></div>'+mins+'</div>'; },
  tap(d,s,a){ const st=T.clock.step(d); if(a==='hf') s.t+=60; else if(a==='hb') s.t-=60; else if(a==='mf') s.t+=st; else if(a==='mb') s.t-=st; else return; s.t=((s.t%720)+720)%720; s.moved=true; },
  ready(d,s){ return !!s.moved; },

  solve(d,s){ s.t=T.clock.goal(d); } };

/* ---------- coins: tap (or drag) coins into the purse to make an amount; drawn coins, not emoji ---------- */
const COIN={p:{v:1,name:'penny',r:19,fill:'#C8834A',ring:'#9A5B2B',t:'1¢'},n:{v:5,name:'nickel',r:21,fill:'#C9CDD3',ring:'#8D949E',t:'5¢'},d:{v:10,name:'dime',r:17,fill:'#D9DDE2',ring:'#8D949E',t:'10¢'},
  q:{v:25,name:'quarter',r:24,fill:'#D2D6DB',ring:'#7E858F',t:'25¢'},D:{v:100,name:'dollar',bill:true,t:'$1'}};
function coinArt(k,sz){ const c=COIN[k]; if(c.bill) return '<svg class="obk-coin" width="'+(sz*1.6).toFixed(0)+'" height="'+sz+'" viewBox="0 0 64 40" aria-hidden="true"><rect x="1.5" y="1.5" width="61" height="37" rx="4" fill="#CFE8C6" stroke="#4E8A3E" stroke-width="3"/><circle cx="32" cy="20" r="10" fill="none" stroke="#4E8A3E" stroke-width="2"/><text x="32" y="25" font-size="13" font-weight="900" text-anchor="middle" fill="#2F5E24">$1</text></svg>';
  const r=c.r, w=(sz*r/24).toFixed(0); return '<svg class="obk-coin" width="'+w+'" height="'+w+'" viewBox="0 0 '+(2*r+4)+' '+(2*r+4)+'" aria-hidden="true"><circle cx="'+(r+2)+'" cy="'+(r+2)+'" r="'+r+'" fill="'+c.fill+'" stroke="'+c.ring+'" stroke-width="3"/><circle cx="'+(r+2)+'" cy="'+(r+2)+'" r="'+(r-5)+'" fill="none" stroke="'+c.ring+'" stroke-width="1" stroke-dasharray="2 2"/><text x="'+(r+2)+'" y="'+(r+2+r*0.3).toFixed(1)+'" font-size="'+(r*0.78).toFixed(1)+'" font-weight="900" text-anchor="middle" fill="#1F2A44">'+c.t+'</text></svg>'; }
function money(c){ return c<100?c+'¢':'$'+(c/100).toFixed(2); }
function moneySay(c){ return c<100?c+' cents':(c%100?'$'+(c/100).toFixed(2):(c/100)+(c===100?' dollar':' dollars')); }
T.coins={ check:true,
  kinds(d){ return (isArr(d.coins)?d.coins:(d.total>=100?['D','q','d','n','p']:['q','d','n','p'])).filter(k=>COIN[k]); },
  fewest(d){ let r=d.total, n=0; T.coins.kinds(d).map(k=>COIN[k].v).sort((a,b)=>b-a).forEach(v=>{ n+=Math.floor(r/v); r%=v; }); return r?Infinity:n; },
  err(d){ if(!num(d.total)||d.total<1||d.total>500||d.total%1) return 'total must be whole cents from 1 to 500 ($5.00)';
    if(d.coins!=null&&(!isArr(d.coins)||!d.coins.length||d.coins.some(k=>!COIN[k]))) return "coins must be a list of 'p','n','d','q','D' (penny, nickel, dime, quarter, dollar)";
    const vs=T.coins.kinds(d).map(k=>COIN[k].v), ok=[true]; for(let c=1;c<=d.total;c++) ok[c]=vs.some(v=>v<=c&&ok[c-v]); if(!ok[d.total]) return 'that amount cannot be made with those coins';
    if(T.coins.fewest(d)>20) return 'that needs more than 20 coins: add bigger coins'; return ''; },
  init(){ return {bag:[]}; },
  sum(s){ return s.bag.reduce((a,k)=>a+COIN[k].v,0); },
  say(d){ return 'Make '+moneySay(d.total)+'. Tap coins to put them in the purse.'+(d.fewest?' Use the fewest coins.':''); },
  how(d){ return 'Start with the biggest coin that fits. Then count on with smaller coins: 25, 35, 40, 41. Tap a coin in the purse to take it out.'; },
  label(d){ return 'Coins: make '+money(d.total)+(d.fewest?' (fewest)':''); },
  view(d,s,c){ const sz=c.k1?52:44, tot=T.coins.sum(s);
    let h='<div class="obk-purse" data-obk-drop="purse" aria-label="the purse">'+(s.bag.length?s.bag.map((k,i)=>'<button class="obk-pc" data-obk="rm" data-k="'+i+'" aria-label="'+COIN[k].name+', tap to take it out">'+coinArt(k,36)+'</button>').join(''):'<span class="obk-note">👛 The purse</span>')+'</div>';
    h+='<p class="obk-count sm" aria-live="polite">'+(c.guided||s.over?'In the purse: '+money(tot):s.bag.length+(s.bag.length===1?' coin':' coins'))+'</p>';
    return h+'<div class="obk-bank">'+T.coins.kinds(d).map(k=>'<button class="obk-cb" data-obk="add" data-k="'+k+'" data-obk-drag="add" aria-label="add a '+COIN[k].name+'">'+coinArt(k,sz)+'<span>'+COIN[k].name+'</span></button>').join('')+'</div>'; },
  tap(d,s,a,k,drop){ if(a==='add'){ if(COIN[k]&&s.bag.length<20) s.bag.push(k); return; } if(a==='rm'){ s.bag.splice(+k,1); } },
  ready(d,s){ return s.bag.length>0; },
  judge(d,s){ const t=T.coins.sum(s); if(t===d.total){ if(d.fewest&&s.bag.length>T.coins.fewest(d)) return {ok:false,msg:'That makes '+money(t)+'! But you can use fewer coins. Trade small coins for a bigger one.'}; return {ok:true}; }
    return {ok:false,msg:t>d.total?'That is '+money(t)+', too much. Tap a coin in the purse to take it out.':'That is '+money(t)+'. You need '+money(d.total-t)+' more.'}; },
  solve(d,s){ let r=d.total; s.bag=[]; T.coins.kinds(d).sort((a,b)=>COIN[b].v-COIN[a].v).forEach(k=>{ while(COIN[k].v<=r){ s.bag.push(k); r-=COIN[k].v; } }); } };

/* ---------- fit-text (after every draw) ---------- */
const FIT='.obk .obk-card,.obk .obk-fc,.obk .obk-m,.obk .obk-opt,.obk .obk-bin-t,.obk .obk-tile,.obk .obk-slot,.obk-q';
function txtRects(el){ const out=[], w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT); let n;
  while((n=w.nextNode())){ if(!n.textContent.trim()||(n.parentElement&&n.parentElement.closest('b,.ghost'))) continue; const r=document.createRange(); r.selectNodeContents(n); const L=r.getClientRects(); for(let i=0;i<L.length;i++) if(L[i].width>1) out.push(L[i]); }
  return out; }
function fitBad(el,want){ const R=txtRects(el); if(!R.length) return false; const b=el.getBoundingClientRect(), cs=getComputedStyle(el), lo=b.left+parseFloat(cs.borderLeftWidth||0)+1, hi=b.right-parseFloat(cs.borderRightWidth||0)-1, tops=[];
  for(let i=0;i<R.length;i++){ const q=R[i]; if(q.left<lo-1||q.right>hi+1) return true; if(!tops.some(t=>Math.abs(t-q.top)<4)) tops.push(q.top); } return tops.length>want; }
function fitOne(el){ if(!el.textContent.trim()) return; el.style.fontSize=''; el.style.overflowWrap=''; const want=Math.max(2,(el.textContent.match(/\n/g)||[]).length+1);
  if(!fitBad(el,want)) return; const f0=parseFloat(getComputedStyle(el).fontSize)||20; let f=f0;
  for(let k=0;k<8&&f>f0*0.55&&fitBad(el,want);k++){ f=Math.max(f0*0.55,f*0.88); el.style.fontSize=f.toFixed(1)+'px'; }
  if(fitBad(el,want)) el.style.overflowWrap='anywhere'; }   /* still too long at the smallest size: break the word rather than stick out */

/* ---------- the kit API the player uses ---------- */
function ty(d){ return d&&T[d.type]; }
const OBK=window.OBK={
  types:T, list:Object.keys(T),
  err(d,band){ const t=ty(d); if(!d||typeof d!=='object') return 'not an activity'; if(!t) return 'unknown activity type "'+(d&&d.type)+'" (use one of '+Object.keys(T).join(', ')+')';
    const e=t.err(d); if(e) return d.type+': '+e;
    if(band==='K1'){ const o=t.opts&&t.opts(d); if(o&&o.length>3) return d.type+': Little Learners get 3 choices at most'; }
    if(d.why&&(!d.why.q||!isArr(d.why.o)||d.why.o.map(S).indexOf(S(d.why.a))<0)) return d.type+': why needs q, o and a (a is one of o)';
    return ''; },
  init(d,c){ const s=ty(d).init(d,c||{}); return Object.assign(s,{misses:0,msg:'',over:false,ok:false,solved:false}); },
  isCheck(d){ const t=ty(d); return d.type==='hop'&&d.ask?false:!!t.check; },   /* hop with ask:'hops' ends on a choice, not on Check */
  say(d){ return d.say||ty(d).say(d); },
  how(d){ return d.how||ty(d).how(d); },
  label(d){ return d.label||ty(d).label(d); },
  view(d,s,c){ return ty(d).view(d,s,c||{}); },
  tap(d,s,a,k,drop,c){ return ty(d).tap(d,s,a,k,drop,c||{}); },
  ready(d,s){ const t=ty(d); return t.ready?!!t.ready(d,s):true; },
  judge(d,s){ return ty(d).judge(d,s); },
  solve(d,s){ ty(d).solve(d,s); s.solved=true; },
  mount(root,d,s,c){ OBK.fit(root); const t=ty(d); if(t&&t.mount) try{ t.mount(root,d,s,c||{}); }catch(e){ console.warn('OneBiteKit mount',e); } },
  /* fit-text: long card, cell, match, choice, bin and prompt text shrinks (down to 55%) until it fits in 2 lines (or as many lines as its \n asks)
     and never sticks out. Runs after every draw; short text is never touched. */
  fit(root){ try{ (root||document).querySelectorAll(FIT).forEach(fitOne); }catch(e){} },
  hear(d){ try{ const clips=window.TL_CLIPS||{}; if(d.clip&&clips[d.clip]&&window.TLWorld&&TLWorld.say){ TLWorld.say(d.clip,'',{force:true}); return; }
    if(d.he||!d.hear) return; if(typeof speak==='function') speak(S(d.hear)); }catch(e){} },
  pic, E
};

/* ---------- drag (every drag is also a tap-tap) ---------- */
let drag=null, quiet=0, onDrop=null;
OBK.onDrop=fn=>{ onDrop=fn; };
OBK.suppressed=()=>Date.now()<quiet;

  if(!drag.g){ if(dx*dx+dy*dy<144) return; const r=drag.el.getBoundingClientRect(), g=drag.el.cloneNode(true); g.removeAttribute('data-obk'); g.removeAttribute('data-obk-drag');

  drag.g.style.left=(e.clientX-drag.g.offsetWidth/2)+'px'; drag.g.style.top=(e.clientY-drag.g.offsetHeight/2)+'px';
  const z=zoneAt(e.clientX,e.clientY); if(drag.hot&&drag.hot!==z) drag.hot.classList.remove('obk-hot'); if(z) z.classList.add('obk-hot'); drag.hot=z; },true);

  quiet=Date.now()+450; if(cancel) return; const z=zoneAt(e.clientX,e.clientY); if(z&&onDrop) onDrop({a:d.el.dataset.obk,k:d.el.dataset.k},{a:z.dataset.obkDrop,k:z.dataset.k}); }
