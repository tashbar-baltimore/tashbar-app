  'WRIT.RES.L06.01':{name:'Many Sources',
  teach:[
    {how:'The Crew is writing a research report for the Gazette: “How did people keep food cold before fridges?” Yehuda has three practice sources, made up for these lessons: the book Cold Without a Plug, by Aaron Kessler; the book Kitchens Long Ago, by Natan Dahan; and the article “Ice by Wagon,” by Daniel Mendez, in Science Corner Magazine. One source can be wrong, or leave something out. So FIND THE ANSWER IN MORE THAN ONE SOURCE. Kessler says that in winter, workers cut big blocks of ice from frozen lakes. Dahan says the same. When two sources give the same answer, they AGREE, and you can trust the fact more.', q:'Kessler: workers cut ice from frozen lakes in winter. Dahan: workers cut ice from frozen lakes in winter. What do the two sources do?', o:['agree','disagree','only one source']},
    {how:'Sometimes two sources DISAGREE. Yehuda asks: when did most American homes get an electric fridge? Mendez says in the 1930s. Dahan says in the 1940s. Do not just pick the one you like. CHECK A THIRD SOURCE. Kessler says in the 1940s. Now two of three sources agree: in the 1940s. That is the answer Yehuda uses. (It is true: in the 1940s, most American homes got an electric fridge.)', q:'Two sources disagree. What do you do?', o:['check a third source','pick the one you like','use both answers']},
    {how:'Two mistakes. ONE SOURCE ONLY: you find a fact in one source and stop. You never checked it. PICKING A SIDE: two sources disagree, and you choose one without checking a third. A fact you checked in two sources that agree is CHECKED IN TWO SOURCES. That is the kind of fact that goes in the report.', q:'Avrumi reads in Kessler that root cellars kept carrots cool. He writes it in the report and never looks anywhere else. Which mistake is it?', o:['one source only','picking a side','nothing, it is checked']}

  'WRIT.RES.L06.02':{name:'Note Cards',
  teach:[
    {how:'In Grade 4 you took notes in key words, not copied sentences. Now you go further, with NOTE CARDS. Rule one: ONE FACT PER CARD. Why? Later you will sort your cards into groups, one group for each paragraph. A card with two facts cannot go in two piles at once. Yehuda uses the practice sources made up for this unit: Cold Without a Plug, by Aaron Kessler; Kitchens Long Ago, by Natan Dahan; and “Ice by Wagon,” by Daniel Mendez.', q:'Which is ONE fact for one card?', o:['Workers cut ice from frozen lakes in winter.','Workers cut ice from lakes, and the iceman brought it in a wagon.','Ice, iceman, icebox, root cellar.']},
    {how:'Rule two: write the fact in YOUR OWN WORDS, the way you did in Proof from the Text. Read, cover the page, and write it your way, keeping the meaning. Rule three: put the SOURCE at the bottom of every card: the title and the author’s last name. A card: “Ice packed in sawdust lasted into the summer. Source: Cold Without a Plug, Kessler.” Now you will always know where each fact came from.', q:'Which card is complete?', o:['Melted ice dripped into a pan someone had to empty. Source: “Ice by Wagon,” Mendez','Melted ice dripped into a pan someone had to empty.','Source: “Ice by Wagon,” Mendez']},
    {how:'Three mistakes. TWO FACTS ON ONE CARD: split it into two cards. NO SOURCE: you will not know where it came from, and you cannot list it later. COPIED WORDS: the whole sentence is copied from the source. Kessler wrote: “The blocks were packed in sawdust inside an icehouse.” A card that says exactly that is copied. Cover it and use your own words: “Icehouses kept the ice in sawdust.”', q:'Mendez wrote: “The iceman drove his wagon from house to house with blocks of ice.” Dovid’s card says exactly that, with the source. Which mistake is it?', o:['copied words','no source','two facts on one card']}
  ],

    {t:'spotall', q:'Tap every card that is complete: one fact, own words, and a source.', cells:[{label:'Ice packed in sawdust lasted into the summer. Source: Cold Without a Plug, Kessler',ok:true},{label:'A springhouse kept milk cool. Source: Kitchens Long Ago, Dahan',ok:true},{label:'Melted ice dripped into a pan. Source: “Ice by Wagon,” Mendez',ok:true},{label:'Root cellars kept carrots cool.',ok:false},{label:'Ice was cut in winter, and the iceman sold it. Source: Dahan',ok:false}],

      h:'Is there more than one fact? Is there a source at the bottom?'},
    {t:'spotall', q:'Avrumi’s card has two facts: “The iceman brought ice in a wagon, and melted ice dripped into a pan. Source: Mendez.” Tap every card that splits it the right way.', cells:[{label:'An iceman brought ice to homes in a wagon. Source: “Ice by Wagon,” Mendez',ok:true},{label:'Melted ice in an icebox dripped into a pan. Source: “Ice by Wagon,” Mendez',ok:true},{label:'The iceman came, and the ice melted. Source: Mendez',ok:false},{label:'Melted ice dripped into a pan.',ok:false}],

  'WRIT.RES.L06.03':{name:'Source List',
  teach:[
    {how:'In Grade 4 you listed each source as Title, by Author. Now you go further. At the end of the report comes a SOURCE LIST: one line for every source you USED. Where do you find them? On your note cards: read the source at the bottom of each card. A book you never opened does not go on the list. For a BOOK, write the title and the author: “Cold Without a Plug, by Aaron Kessler.” (These are the practice sources made up for this unit.)', q:'Which is a full line for a book?', o:['Kitchens Long Ago, by Natan Dahan','Kitchens Long Ago','by Natan Dahan']},

      items:[{label:'Cold Without a Plug',bin:'T'},{label:'Kitchens Long Ago',bin:'T'},{label:'“Ice by Wagon”',bin:'T'},{label:'Aaron Kessler',bin:'A'},{label:'Natan Dahan',bin:'A'},{label:'Daniel Mendez',bin:'A'},{label:'Science Corner Magazine',bin:'W'}],

      h:'A book needs the title and the author. An article also needs where it appeared.'},
    {t:'sort', q:'Sort each list or line: complete, or a mistake?', bins:[{id:'C',label:'✅ Complete'},{id:'P',label:'❌ Mistake: a part left out'},{id:'S',label:'❌ Mistake: a source left out'}],

  'WRIT.ESSAY.L06.09':{name:'Revise the Whole Thing',
  teach:[
    {how:'Yehuda has a first draft of his report, “How did people keep food cold before fridges?” In Grade 4, ARMS revised sentences. Now you revise the whole piece. Before he fixes any word or spelling, Yehuda REVISES THE WHOLE THING. He reads the whole report, top to bottom, and asks three big questions. ORDER: are the paragraphs in the best order? MISSING: is a part missing: an opener, a body paragraph that answers the question, an ending? FIT: does every paragraph fit the question? Fixing words and spelling comes later.', q:'Which is a question for revising the whole thing?', o:['Are the paragraphs in the best order?','Is “icebox” spelled right?','Is there a comma after “In winter”?']},
    {how:'Yehuda’s draft: an opener; then a paragraph about the iceman bringing ice to homes; then a paragraph about workers cutting ice from frozen lakes; then a paragraph about his favorite ice-pop flavors; then a paragraph about root cellars. And then it just stops. ORDER: the ice is cut first, and only then brought to homes. He moves the ice-cutting paragraph before the iceman. MISSING: there is no ending. He adds one: in the 1940s most homes got an electric fridge, but people kept food cold long before.', q:'The iceman paragraph comes before the ice-cutting paragraph. What should Yehuda fix?', o:['the order','a missing part','spelling only']},
    {how:'FIT: the ice-pop paragraph does not answer the question, so Yehuda cuts it. Now the report goes: opener, cutting ice, the iceman, root cellars, ending. The big mistake: SPELLING ONLY. A boy fixes a few spellings and commas and says “Revised!” But the order, the missing parts and the fit were never checked. Revise the whole thing first. Then edit the words.', q:'Avrumi fixes three spelling mistakes in his report and says, “Revised!” Which mistake is it?', o:['spelling only','a missing part','the order']}
  ],
  practice:[

      h:'Out of order: move. Missing: add. Off the question: cut.'},

      h:'Does the paragraph tell how people kept food cold BEFORE fridges?'},

      items:[{label:'The ending comes before the opener.',bin:'O'},{label:'The iceman paragraph comes before the ice-cutting paragraph.',bin:'O'},{label:'There is no ending at all.',bin:'M'},{label:'There is no opener; it starts with a fact about sawdust.',bin:'M'},{label:'A paragraph about a trip to the zoo.',bin:'F'},{label:'A paragraph about ice-pop flavors.',bin:'F'}],
      h:'Is the part in the wrong place, not there at all, or off the question?'},
    {t:'spotall', q:'Tap every question Yehuda asks when he revises the WHOLE thing (before editing words).', cells:[{label:'Are the paragraphs in the best order?',ok:true},{label:'Is a part missing: an opener, a body paragraph, an ending?',ok:true},{label:'Does every paragraph fit the question?',ok:true},{label:'Is every word spelled right?',ok:false},{label:'Did I use enough exclamation marks?',ok:false}],
      h:'Revising the whole thing is about the parts: order, missing, fit. Spelling comes later.'},
    {t:'write', q:'Your turn. Binyamin’s draft, “How did people keep milk cold before fridges?” has these paragraphs: (1) springhouses over cold streams, (2) his favorite kind of cheese, (3) an opener that asks the question, (4) iceboxes with a block of ice at the top. There is no ending. Write his revised plan: one line for each paragraph, in the best order, with what you cut and what you added.', min:0, checks:['🔀 I put the paragraphs in the best order, opener first.','✂️ I cut the paragraph that does not fit.','➕ I added the missing ending.'], h:'Opener first. Cut the cheese paragraph: it does not answer the question. Add an ending.'}
