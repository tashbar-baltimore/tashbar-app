  'WRIT.ESSAY.L06.06':{name:'TREE, Level 2',
  teach:[
    {how:'In Grade 4 you planned an opinion with TREE: Topic sentence, Reasons, Explain, Ending. Level 2 goes further: the question is about a TEXT, so your reasons come FROM THE TEXT. Read Yehuda’s Gazette article: “The empty lot behind our yeshiva gets about 7 hours of sun a day. Mr. Halpern said, ‘A garden is a science lab that grows.’ Lettuce is ready to pick about 6 weeks after planting. The Tomchei Shabbos pantry nearby needs fresh vegetables every week. Rabbi Feldman said, ‘When a boy plants a seed, he learns patience.’ Dovid’s Abba offered to build six raised beds, one for each class.” The TOPIC sentence turns the question into your answer.', q:'The question: “Should our yeshiva start a vegetable garden?” Which topic sentence answers it?', o:['Our yeshiva should start a vegetable garden.','Gardens have many plants.','This piece is about gardens.']},
    {how:'R is for REASONS. At Level 2, every reason must come from the text. Ask: can I point to the sentence in the article that gives me this reason? If yes, it is FROM THE TEXT. If not, it is NOT IN THE TEXT, and it does not belong in this plan, even if it is true.', q:'Same article. Which reason comes from the text?', o:['The garden could give fresh vegetables to the pantry.','Gardening is more fun than math.','Everyone in our class wants a garden.']},
    {how:'E is for EXPLAIN: under each reason, write the detail from the text that backs it up. The last E is the ENDING: say your opinion again. Two mistakes: a reason that is NOT IN THE TEXT, and a topic sentence that DOES NOT ANSWER THE QUESTION.', q:'Reason: a garden teaches science. Which detail from the text explains it?', o:['Mr. Halpern said, “A garden is a science lab that grows.”','Rabbi Feldman said, “When a boy plants a seed, he learns patience.”','Gardens are good for everyone.']}

      items:[{label:'The pantry nearby needs fresh vegetables every week.',bin:'F'},{label:'The lot gets about 7 hours of sun a day.',bin:'F'},{label:'Gardening is better than recess.',bin:'N'},{label:'Most boys love tomatoes.',bin:'N'},{label:'Dovid’s Abba offered to build the beds.',bin:'F'}],

    {t:'sort', q:'Question: “Should our yeshiva start a vegetable garden?” Sort each plan line: a strong TREE line, or a mistake?', bins:[{id:'S',label:'✅ Strong TREE line'},{id:'N',label:'❌ Mistake: not in the text'},{id:'Q',label:'❌ Mistake: does not answer the question'}],

    {how:'A simpler step: first turn the question into your answer. “Should we…?” becomes “We should…”.', q:'Question: “Should the Crew start a book club?” Which is the topic sentence?', o:['The Crew should start a book club.','Books have many pages.','Should we start one?']},
    {how:'The skill underneath: Three-Part Piece (Level 6) and Grade 4’s TREE. Level 2 goes further: you answer a question about a text, and every reason and detail now comes from that text, not from your head.', q:'At Level 2, your reasons come from…', o:['the text','your head','your friends']}

  'WRIT.PARA.L06.09':{name:'Best Reason First?',
  teach:[
    {how:'Yehuda has three reasons from the article. Which one goes first? First RANK them with two questions. 1. Is it a SHOULD reason, or only a CAN reason? A CAN reason, like “the lot gets about 7 hours of sun,” only shows we are able to; it is the weakest. 2. Of the SHOULD reasons, who is helped, and how often? Families in need, every week, is more good than our classes learning science. So: families in need is strongest, science is in the middle, and sun is weakest.', q:'Which of these garden reasons is strongest?', o:['It can help families in need every week.','The lot gets about 7 hours of sun a day.','Gardens are fun.']},
    {how:'Then pick an order, and know WHY. BUILD UP: weakest first, strongest LAST, so the reader remembers it. BEST FIRST: strongest FIRST, so the reader is on your side from the start. Both are good, when you can say why.', q:'Yehuda puts his strongest reason last. Why?', o:['so the reader remembers it','so the reader is on your side from the start','because it is the shortest']},
    {how:'The mistake: the strongest reason BURIED in the middle, where the reader skims past it. Another mistake: NO WHY, an order picked by chance. Ask: where is my strongest reason, and why is it there?', q:'Yehuda’s order: sun, families in need, science. What is wrong?', o:['the strongest is buried','nothing, it builds up','nothing, it is best first']}
  ],
  practice:[
    {t:'pairs', q:'Rank Yehuda’s three garden reasons. Match each reason to its rank.', pairs:[['It can help families in need every week.','Strongest: helps the most, most often'],['It can teach our classes science.','Middle'],['The lot gets about 7 hours of sun a day.','Weakest: it shows we can, not why we should']],
      h:'Ask about each reason: how much good does it do, and for whom?'},
    {t:'order', q:'Build up! Put Yehuda’s reasons in order: weakest first, strongest last. Tap the sentences in order.', tiles:['First, the empty lot gets about 7 hours of sun a day.','Also, Mr. Halpern says a garden is a science lab that grows.','Most important, our vegetables could help families in need every week.'], extra:['Gardens are fun.'],
      h:'Start with the reason that does the least good. End with the one that does the most.'},
    {t:'sort', q:'Strongest: families in need. Middle: science. Weakest: sun. Sort each order of reasons: build up, best first, or a mistake?', bins:[{id:'B',label:'📈 Build up'},{id:'F',label:'🥇 Best first'},{id:'X',label:'❌ Mistake: the strongest is buried'}],
      items:[{label:'sun, science, families in need',bin:'B'},{label:'families in need, science, sun',bin:'F'},{label:'sun, families in need, science',bin:'X'},{label:'science, families in need, sun',bin:'X'}],
      h:'Find families in need in each order. Is it last, first, or in the middle?'},
    {t:'spotall', q:'Tap every sentence that says WHY the writer chose his order.', cells:[{label:'I put my strongest reason last, so the reader remembers it.',ok:true},{label:'I start with my strongest reason, so the reader is on my side from the start.',ok:true},{label:'I put them in this order because that is how I wrote them.',ok:false},{label:'The order does not matter.',ok:false},{label:'I put my strongest reason in the middle.',ok:false}],
      h:'A real WHY tells what the order does for the reader.'},
    {t:'order', q:'Best first! Put Yehuda’s reasons in order: strongest first. Tap the sentences in order.', tiles:['Most important, our vegetables could help families in need every week.','Next, Mr. Halpern says a garden is a science lab that grows.','Last, the empty lot already gets about 7 hours of sun a day.'], extra:['Also, gardens are fun.'],
      h:'Start with the reason that does the most good. The words “Most important,” “Next,” and “Last,” help too.'},
    {t:'pairs', q:'Match each order to what it does for the reader.', pairs:[['Build up: strongest last','so the reader remembers it'],['Best first: strongest first','so the reader is on your side from the start'],['Buried: strongest in the middle','a mistake: the reader skims past it']],
      h:'Where is the strongest reason? What does that spot do for the reader?'},
    {t:'write', q:'Your turn. Write your three garden reasons from the article in the order you choose: build up or best first. Then write one sentence that says why you chose that order.', min:0, checks:['🥇 I know which reason is strongest.','📈 My strongest reason is first or last, not buried.','💬 I wrote why I chose my order.'], h:'Ask about each reason: how much good does it do? Then decide: first or last?'}
  ],
  check:[
    {q:'Binyamin thinks our yeshiva should start a chess club. His reasons, weakest to strongest: chess sets are cheap; boys could play at recess; chess teaches boys to think before they move. He writes them in this order: recess, think before they move, cheap sets. What is wrong with his order?', o:['the strongest is buried','nothing, it builds up','nothing, it is best first'], h:'Find his strongest reason. Is it first, last, or in the middle?'},
    {q:'Dovid writes his strongest reason first. Which WHY fits his order?', o:['so the reader is on your side from the start','so the reader remembers it','because it is the shortest'], h:'What does putting the strongest reason FIRST do for the reader?'},
    {t:'order', q:'Put Binyamin’s chess club reasons in build-up order: weakest first, strongest last. Tap the sentences in order.', tiles:['First, chess sets are cheap.','Also, boys could play at recess.','Most important, chess teaches boys to think before they move.'], extra:['Chess has 32 pieces.'], h:'Weakest first. Strongest last.'}
  ],
  re:[
    {how:'A new way: at a Shabbos meal, a host may bring out his best dish first to wow the guests, or save it for the end as the big finish. Either way, he knows why.', q:'Saving your strongest reason for last is…', o:['build up','best first','buried']},
    {how:'A simpler step: just find your strongest reason and put a star on it. Then put the star first or last.', q:'Where can the starred reason go?', o:['first or last','in the middle','anywhere at all']},
    {how:'The skill underneath: TREE, Level 2. Your plan already has reasons from the text. Now you go further: you rank them, put them in a logical order, and say why.', q:'Before you put your reasons in order, you…', o:['rank them','cut them','hide them']}
  ]},

  'WRIT.PARA.L06.10':{name:'Proof from the Text',
  teach:[
    {how:'In Grade 4 you backed up a reason with a fact. In Point, Proof, Explain, your proof could be a fact, an example or a quote. Now you go further: the proof comes from a TEXT you read, and the reader must be able to find it. Give it as a FACT in your own words, or as a QUOTE: the exact words, inside quotation marks.', q:'Reason: a garden teaches science. Which is a quote from Yehuda’s article?', o:['Mr. Halpern said, “A garden is a science lab that grows.”','Mr. Halpern likes science a lot.','Science is very important.']},
    {how:'Say WHERE the proof comes from with a SOURCE TAG before it: “According to the Gazette article,” “In Yehuda’s article,” or “Mr. Halpern said,”. A quote is copied word for word. A fact in your own words gets no quotation marks, but it still gets a tag. A fact in your own words changes the words but keeps the meaning.', q:'Which sentence has a source tag?', o:['According to the Gazette article, the lot is sunny for about 7 hours each day.','The lot is sunny for about 7 hours each day.','Everyone knows the lot is sunny.']},
    {how:'Two mistakes. MADE-UP PROOF: it is not in the text, like “Everyone knows gardens are great.” NO SOURCE TAG: the proof is in the text, but the reader cannot tell where it came from. And a quote must be the EXACT words: never change them.', q:'Avrumi writes: “A pantry nearby must get fresh vegetables each week.” He writes nothing before it. Which mistake is it?', o:['no source tag','made-up proof','a quote']}
  ],
  practice:[
    {t:'sort', q:'Sort each piece of proof: a fact in my own words, or a quote?', bins:[{id:'F',label:'📝 A fact in my own words'},{id:'Q',label:'💬 A quote'}],
      items:[{label:'According to the article, the lot is sunny for about 7 hours each day.',bin:'F'},{label:'Rabbi Feldman said, “When a boy plants a seed, he learns patience.”',bin:'Q'},{label:'Mr. Halpern said, “A garden is a science lab that grows.”',bin:'Q'},{label:'The article says that lettuce can be picked about 6 weeks after it is planted.',bin:'F'},{label:'In Yehuda’s article, we learn that Dovid’s Abba is willing to make six garden beds.',bin:'F'}],
      h:'A quote has someone’s exact words inside quotation marks. A fact in your own words has none.'},
    {t:'pairs', q:'Match each reason to its proof from the text.', pairs:[['A garden can help families in need.','According to the article, a pantry near our yeshiva must get fresh vegetables each week.'],['A garden teaches patience.','Rabbi Feldman said, “When a boy plants a seed, he learns patience.”'],['A garden is easy to set up.','The article says Dovid’s Abba is willing to make six garden beds.']],
      h:'Read the reason. Which proof shows THAT reason is true?'},
    {t:'spotall', q:'Tap every sentence that has a source tag.', cells:[{label:'According to the Gazette article, a pantry near our yeshiva must get fresh vegetables each week.',ok:true},{label:'Mr. Halpern said, “A garden is a science lab that grows.”',ok:true},{label:'In Yehuda’s article, we learn that lettuce can be picked in about 6 weeks.',ok:true},{label:'Lettuce can be picked in about 6 weeks.',ok:false},{label:'Everyone knows gardens are good.',ok:false}],
      h:'A source tag names where it comes from: the article, or the person who said it.'},
    {t:'sort', q:'Sort each piece of proof for the garden: proof from the text with a tag, or a mistake?', bins:[{id:'T',label:'✅ Proof from the text, tagged'},{id:'M',label:'❌ Mistake: made-up proof'},{id:'N',label:'❌ Mistake: no source tag'}],
      items:[{label:'According to the article, the lot is sunny for about 7 hours each day.',bin:'T'},{label:'Everyone knows gardens make boys happy.',bin:'M'},{label:'A pantry nearby must get fresh vegetables each week.',bin:'N'},{label:'Most yeshivos already have gardens.',bin:'M'},{label:'Rabbi Feldman said, “When a boy plants a seed, he learns patience.”',bin:'T'}],
      h:'Is it in the article? If not, it is made up. If it is, does it say where it comes from?'},
    {t:'order', q:'Build a reason with proof: reason, source tag, quote, explain. Tap the parts in order.', tiles:['A garden would teach us science.','In Yehuda’s article, Mr. Halpern said,','“A garden is a science lab that grows.”','This shows that we would learn by doing, not only from books.'], extra:['Everyone knows science is fun.'],
      h:'The reason comes first. The tag comes right before the quote. The explain comes last.'},
    {t:'spotall', q:'Reason: a garden teaches patience. Tap every piece of proof from the text that supports it.', cells:[{label:'Rabbi Feldman said, “When a boy plants a seed, he learns patience.”',ok:true},{label:'According to the article, lettuce can be picked about 6 weeks after it is planted.',ok:true},{label:'Rabbi Feldman said, “Patience is the best middah.”',ok:false},{label:'Waiting is hard for everyone.',ok:false},{label:'According to the article, the lot is sunny for about 7 hours each day.',ok:false}],
      h:'Two tests: are these the article’s real words or facts, AND do they show patience?'},
    {t:'write', q:'Your turn. Pick one garden reason. Write the reason, then proof from Yehuda’s article with a source tag (a fact or a quote), then one sentence that explains it.', min:0, checks:['📄 My proof is really in the article.','🏷️ I said where it comes from.','💬 A quote has the exact words in quotation marks.'], h:'Find the sentence in the article first. Then start with “According to the article,” or the name of the person who said it.'}
  ],
  check:[
    {q:'New article: “Our yeshiva library is open only at lunch. Forty boys signed a list asking for more time to read.” A boy writes: “Forty boys signed their names to ask for more reading time.” He writes nothing before it. Which mistake is it?', o:['no source tag','made-up proof','nothing, it is proof from the text, tagged'], h:'Is it in the article? Does the reader know where it came from?'},
    {q:'In the library article, Mr. Halpern said, “Reading every day makes you a stronger thinker.” A boy writes: Mr. Halpern said, “Reading every day makes you a stronger thinker.” What kind of proof is it?', o:['a quote','a fact in my own words','made-up proof'], h:'Are these his exact words, inside quotation marks?'},
    {t:'order', q:'Build a reason with proof from the library article: reason, source tag, fact, explain. Tap the parts in order.', tiles:['Many boys want more time to read.','According to the article,','forty boys signed their names to ask for more reading time.','This shows that one lunch period is not enough time to read.'], extra:['Everyone loves books.'], h:'Reason first. Then where it comes from. Then the fact. Then what it shows.'}
  ],
  re:[
    {how:'A new way: proof from the text is like a receipt. It shows where you got it. The source tag is the store’s name printed on the receipt.', q:'The source tag is like…', o:['the store’s name on the receipt','the price','the bag']},
    {how:'A simpler step: start your proof with “According to the article,”. Then write the fact.', q:'Which one starts with a source tag?', o:['According to the article,','Everyone knows','I think']},
    {how:'The skill underneath: Point, Proof, Explain. There, proof was a fact, an example or a quote from anywhere. Now you go further: the proof comes from a text, in your own words or as an exact quote, and a source tag says where.', q:'Proof from the text needs…', o:['a source tag','a hook','a title']}
  ]},

  'WRIT.PARA.L06.11':{name:'Because, So, Therefore',
  teach:[
    {how:'In Grade 4 you joined ideas with linking words like “for instance” and “in addition”. Now you go further: you link your opinion and reasons with PHRASES and CLAUSES that show which way your thinking goes. A link that GIVES THE REASON points back to the cause: “because the pantry needs fresh vegetables every week.” Because and since give the reason. Because, since and so join INSIDE one sentence. Therefore, As a result, Consequently and Specifically START a new sentence, with a comma after them.', q:'“Our yeshiva should start a garden ___ the pantry needs fresh vegetables every week.” Which link gives the reason?', o:['because','Consequently,','Specifically,']},
    {how:'A link that SHOWS THE RESULT points forward to what follows: so, Therefore, As a result, Consequently, Because of this. (“Because of this” shows a result: “this” is the reason you already said.) A link that ZOOMS IN, “Specifically,” goes from a general reason to an exact detail.', q:'“A garden would teach us science. ___, we could watch lettuce grow from seed in about 6 weeks.” Which link zooms in?', o:['Specifically,','Because','Consequently,']},
    {how:'The mistake: a link that POINTS THE WRONG WAY. “Therefore” comes before the result, never before the reason. Read every link as an arrow: reason → result. Another mistake: VAGUE AFTER “SPECIFICALLY”: it promises an exact detail, so give one.', q:'Which pair links the right way?', o:['The pantry needs fresh vegetables every week. Therefore, our garden could help families in need.','Our garden could help families in need. Therefore, the pantry needs fresh vegetables every week.','A garden helps. Specifically, it helps with things.']}
  ],
  practice:[
    {t:'sort', q:'Sort each link: it joins INSIDE one sentence, or it STARTS a new sentence?', bins:[{id:'I',label:'🧩 Inside one sentence (no capital)'},{id:'N',label:'🚪 Starts a new sentence (capital and comma)'}],
      items:[{label:'because',bin:'I'},{label:'since',bin:'I'},{label:'so',bin:'I'},{label:'Therefore,',bin:'N'},{label:'As a result,',bin:'N'},{label:'Specifically,',bin:'N'}],
      h:'Lowercase links join two parts of ONE sentence. A capital and a comma start a NEW sentence.'},
    {t:'pairs', q:'Match each first part to the link and ending that finish it.', pairs:[['Our yeshiva should start a garden','because the pantry nearby needs fresh vegetables every week.'],['Dovid’s Abba offered to build six raised beds.','As a result, every class could have its own bed.'],['A garden would teach us science.','Specifically, we could watch lettuce grow from seed.']],
      h:'Does the first part need a reason, a result, or a closer look?'},
    {t:'order', q:'Build the sentence: opinion, link, reason. Tap the parts in order.', tiles:['Our yeshiva should start a vegetable garden','because','the pantry nearby needs fresh vegetables every week.'], extra:['Therefore,'],
      h:'The opinion comes first. Then the link that points back to the reason.'},
    {t:'spotall', q:'Tap every pair that links the RIGHT way: reason first, then result.', cells:[{label:'The lot gets about 7 hours of sun a day. Therefore, vegetables would grow well there.',ok:true},{label:'Dovid’s Abba offered to build six raised beds. Because of this, we would not need to buy beds.',ok:true},{label:'The pantry needs fresh vegetables every week. As a result, our garden could help families in need.',ok:true},{label:'Vegetables would grow well there. Therefore, the lot gets about 7 hours of sun a day.',ok:false},{label:'We would not need to buy beds. Consequently, Dovid’s Abba offered to build them.',ok:false}],
      h:'Read each pair as an arrow. Does the first sentence cause the second?'},
    {t:'sort', q:'Sort each sentence: does it link the right way, or is it a mistake?', bins:[{id:'R',label:'✅ Links the right way'},{id:'W',label:'❌ Mistake: points the wrong way'},{id:'V',label:'❌ Mistake: vague after “Specifically”'}],
      items:[{label:'A garden teaches patience. Specifically, we wait about 6 weeks for lettuce.',bin:'R'},{label:'We should plant a garden since it would teach us science.',bin:'R'},{label:'A garden teaches science. Specifically, it is good stuff.',bin:'V'},{label:'Our garden could feed families. Therefore, the pantry needs vegetables.',bin:'W'},{label:'The lot is sunny because vegetables would grow well there.',bin:'W'}],
      h:'Check the arrow: reason → result. After “Specifically,” look for an exact detail.'},
    {t:'order', q:'Build a linked paragraph: opinion with a reason, zoom in, result. Tap the sentences in order.', tiles:['Our yeshiva should start a vegetable garden because it would teach us science.','Specifically, we could watch lettuce grow from seed in about 6 weeks.','As a result, by the end of those 6 weeks, we would know how a plant grows.'], extra:['Therefore, the lot is sunny.'],
      h:'Opinion and reason first. “Specifically” zooms in on that reason. The result needs “those 6 weeks” to make sense.'},
    {t:'write', q:'Your turn. Write three sentences about the garden: your opinion with a because clause, a sentence that starts with “Specifically,”, and a sentence that starts with a result link (As a result, Consequently or Therefore).', min:0, checks:['🔙 My because clause gives a real reason.','🔍 After “Specifically,” I give an exact detail.','➡️ My result link points forward: reason, then result.'], h:'Pick one reason from the article. Say it with because. Zoom in on one fact. Then say what follows from it.'}
  ],
  check:[
    {q:'“Our yeshiva library is open only at lunch. ___, many boys never get time to read.” Which kind of link fits the blank?', o:['shows the result','gives the reason','zooms in'], h:'Is “many boys never get time to read” a cause, a result, or a closer look?'},
    {q:'“Our library should stay open after school. Therefore, forty boys signed a list asking for more time to read.” What is wrong?', o:['points the wrong way','vague after “Specifically”','nothing, it links the right way'], h:'Read it as an arrow. Did the list come because of the opinion, or is the list the reason?'},
    {t:'order', q:'Build the sentence: opinion, link, reason. Tap the parts in order.', tiles:['Our library should stay open after school','because','forty boys signed a list asking for more time to read.'], extra:['Specifically,'], h:'Opinion first. Then the link that points back to the reason.'}
