  'WRIT.ESSAY.L08.06':{name:'Compare Two Texts',
  teach:[
    {how:'In Grade 5 you used one detail from each of two texts. Now you go further. The Beacon printed two pieces on one topic: returning a lost item, hashavas aveidah. TEXT 1, Benny’s story “The Brown Wallet”: Yechiel finds a wallet with $200 at the bus stop. “For one long minute” he thinks about what it could buy. Then he walks six blocks in the rain to return it. Mr. Blum’s eyes fill with tears: “That is our money for Pesach food.” TEXT 2, Yoni’s news item “Lost and Found: 31 Items Go Home”: Last month the new shelf in the front hall sent 31 lost items home: 14 jackets, 9 water bottles and 8 seforim. Rabbi Rosen said, “This shelf makes that mitzvah easy.” To compare, ask three questions. The first is WHAT IT SAYS: what each text tells about the topic. The story: one boy returns one wallet, and it is hard. The news item: a whole yeshiva returns 31 items, and the shelf makes it easy.', q:'Which sentence tells WHAT each text says?', o:['The story is about one boy and one wallet; the news item is about 31 items at the yeshiva.','The story shows feelings; the news item uses numbers.','A story wants the reader to feel.']},
    {how:'The second question is HOW IT SAYS IT: the tools each writer uses. Benny takes us inside one boy’s head (“for one long minute”), builds a scene with dialogue and feelings, and ends with a picture: the walk home felt shorter. Yoni puts the biggest fact first, gives exact numbers, and quotes real people. He tells no feelings of his own. The third question is WHY THEY DIFFER. Look for three reasons. PURPOSE: what the writer wants. The story wants you to feel the choice; the news item wants you to know the facts and use the shelf. AUDIENCE: who reads it. KIND OF TEXT: a story and a news item each follow their own rules.', q:'“Benny takes us inside Yechiel’s head; Yoni gives numbers and quotes.” Which question does that answer?', o:['how it says it','what it says','why they differ']},
    {how:'Write one compare paragraph: name both texts and the topic, then what, how and why, in that order. “Both texts show that returning a lost item matters. The story follows one wallet, but the news item counts 31 items. Benny shows Yechiel’s feelings, while Yoni gives numbers and quotes. They differ because a story wants us to feel, and news wants us to know.” Two mistakes. TWO SUMMARIES: he only tells what each text says. There is no how and no why, so nothing is compared. NO WHY: he shows how the texts differ, but never says why. Check in that order: is there a how? Is there a why?', q:'Eli writes: “The story shows feelings, but the news item uses numbers.” Then he stops. Which mistake is it?', o:['no why','two summaries','nothing']}

      items:[{label:'The story follows one boy; the news item reports on a whole yeshiva.',bin:'W'},{label:'Benny shows Yechiel’s thoughts; Yoni gives exact numbers.',bin:'H'},{label:'A story wants the reader to feel; a news item wants him to know.',bin:'Y'},{label:'In the story one wallet goes home; in the news item 31 items do.',bin:'W'},{label:'Benny ends with a picture; Yoni starts with the biggest fact.',bin:'H'},{label:'Yoni writes so every boy knows to use the shelf.',bin:'Y'}],

  'WRIT.PARA.L08.12':{name:'Theme Statement',
  teach:[
    {how:'In Grade 6 you made a claim about a character. Now you go further: a claim about the message of the whole story, a message about LIFE. That is a THEME STATEMENT. Benny’s story “The Brown Wallet”: Yechiel finds a wallet with $200. “For one long minute” he thinks about what it could buy. Then he walks six blocks in the rain to return it, says no to a $20 reward, and “the walk home felt shorter than the walk there.” A theme statement is a FULL SENTENCE about people in general, with no names, that says something true about life: “Doing the right thing can cost you something, but it gives you something better.”', q:'Which is a theme statement?', o:['Doing the right thing can cost you something, but it gives you something better.','Honesty.','Yechiel finds a wallet and gives it back.']},
    {how:'Two mistakes. ONE WORD: “Honesty.” That is a topic, not a message. It does not say what the story teaches ABOUT honesty. SUMMARY: “Yechiel finds a wallet and gives it back.” That retells what happens. A summary tells events. It is still a summary with the names left out: “A boy returns a wallet in the rain.” A theme says what the events MEAN for anyone. To turn a one-word topic into a theme, ask: “What does the story say about it?”', q:'“Yechiel walks six blocks in the rain to return a wallet.” Which is it: theme statement, one word, or summary?', o:['summary','one word','theme statement']},
    {how:'Then PROVE it. Pick a DETAIL from the story that shows the theme, and EXPLAIN how it shows it. Detail: Yechiel thinks “for one long minute” about what $200 could buy. Explain: the right choice cost him something; it was not easy. Detail: “The walk home felt shorter than the walk there.” Explain: he got something better, a light heart. A detail that is true but shows nothing about the theme, like “The wallet was brown,” does not prove it.', q:'Theme: doing right can cost you, but it gives you more. Which detail proves it?', o:['Yechiel says no to a $20 reward.','The wallet is brown.','The bench is at a bus stop.']}
  ],
  practice:[

      items:[{label:'Giving back what is not yours can feel lighter than keeping it.',bin:'G'},{label:'Mitzvos.',bin:'O'},{label:'A boy in the rain returns a wallet to its owner.',bin:'S'},{label:'Doing right is hard, but it is worth it.',bin:'G'},{label:'Temptation.',bin:'O'},{label:'Yechiel thinks about the money, then walks to Willow Lane.',bin:'S'}],

    {t:'order', q:'Build Akiva’s theme paragraph. Tap the lines in order.', tiles:['In “The Brown Wallet,” Benny shows that doing right can cost you, but it gives you more.','For one long minute, Yechiel thinks about what $200 could buy.','That minute shows the right choice cost him something.','Then the walk home feels shorter, so he got something better.'], extra:['The wallet is brown.'],

    {t:'spotall', q:'Benny’s new story: for weeks, Tani’s shofar gives only squeaks. He practices every night. On the last day of Elul, his tekiah rings clear for the class. Tap every THEME STATEMENT.', cells:[{label:'Steady work can turn failure into success.',ok:true},{label:'Small efforts every day add up to something big.',ok:true},{label:'Giving up early means you never see what you could do.',ok:true},{label:'Patience.',ok:false},{label:'Tani practices the shofar and blows it.',ok:false}],
      h:'A full sentence about life, for anyone? Not one word, not what happens.'},
    {t:'write', q:'Your turn to write. Pick a story you read this year. Write its theme statement. Then prove it: give two details from the story, and after each one, explain how it shows the theme.', min:0, checks:['💡 My theme is a full sentence about life, with no names.','📜 It is not one word and not a summary.','🔗 Each detail shows the theme, and I explained how.'], h:'Name the topic in one word. Then ask: what does the story say about it? Write that as a sentence.'}

  check:[
    {q:'Benny’s story “The Question”: all winter, shy Tzemach never raises his hand in shiur. One day he asks his Rebbe a question, and the Rebbe smiles: “That question is worth the whole morning.” By Shavuos, he asks a question every week. Yoni writes the theme: “Courage.” Which is it: theme statement, one word, or summary?', o:['one word','summary','theme statement'], h:'Is it a full sentence about life? Or just a topic?'},

  ]},

  'WRIT.ESSAY.L08.07':{name:'Revise for Reader',
  teach:[
    {how:'In Grade 5 you revised the whole thing: order, missing parts, fit. Now you go further. Read your draft as a NEW READER, someone who was not there and does not know what you know, like a fifth grader or a guest. Wherever he would stop and ask a question, he is confused. Four things confuse a reader. Here are two. An UNCLEAR HE OR IT (you fixed vague pronouns in grammar; now you hunt them as a reader): Benny’s draft says, “Yechiel gave Mr. Blum the wallet, and he started to cry.” Who cried? Use the name: “and Mr. Blum started to cry.” An UNDEFINED WORD: a word your reader may not know. Yoni’s draft says, “Owners must give a siman.” Add what it means: “a siman, a sign that proves the item is theirs, like a name inside a jacket.”', q:'“Avishai put his Chumash on his bag, and it fell.” What will confuse a reader?', o:['unclear he or it','undefined word','jump']},
    {how:'Here are the other two. A MISSING STEP: in a chain of actions, the writer skipped one, and the reader asks, “How did that happen?” Benny’s draft: “Yechiel found the wallet. Then he knocked on Mr. Blum’s door.” How did he know where Mr. Blum lived? Add the step: “He read the name and address on the card inside.” A JUMP: two ideas sit side by side, and the reader asks, “What does this have to do with that?” Yoni’s draft: “Rabbi Rosen set up the shelf this fall. Returning a lost item is a mitzvah.” Add the link: “He set it up because returning a lost item is a mitzvah, hashavas aveidah.”', q:'“Boys put found items on the shelf. Then the owners take them home.” The reader asks, “How do owners know their things are there?” What is it?', o:['missing step','jump','undefined word']},
    {how:'How to revise for a reader. READ it as a new reader, slowly; pretend you know only what is on the page. STOP wherever he would ask a question. NAME the problem: unclear he or it, undefined word, missing step, or jump. FIX it: a name, a meaning, a step, or a link. The big mistake is “I KNOW WHAT I MEANT.” The writer fills every gap from his own head, so he never sees it. Your reader cannot read your mind.', q:'Benny reads his draft and says, “It is clear to me, so it is fine.” Which mistake is it?', o:['I know what I meant','missing step','undefined word']}
  ],
  practice:[
    {t:'sort', q:'Sort each line a Beacon writer drafted.', bins:[{id:'U',label:'👉 Unclear he or it'},{id:'D',label:'📖 Undefined word'}],
      items:[{label:'Eli told Yoni that he won the debate.',bin:'U'},{label:'Owners must give a siman.',bin:'D'},{label:'Rabbi Rosen thanked Avishai when he came in.',bin:'U'},{label:'Put found items in the Blue Room.',bin:'D'},{label:'The jacket was on the chair, and it was wet.',bin:'U'},{label:'Our team ran a give-and-go.',bin:'D'}],
      h:'Could he or it point to two people or things? Unclear. Is there a word a new reader may not know? Undefined.'},
    {t:'pairs', q:'Match each problem to the words that give it away.', pairs:[['unclear he or it','Who is he? What is it?'],['undefined word','What does that word mean?'],['missing step','How did that happen?'],['jump','What does this have to do with that?'],['I know what I meant','“It is clear to me, so it is fine.”']],
      h:'Four are a new reader’s questions. One is the writer’s excuse.'},
    {t:'spotall', q:'Benny’s first draft. Tap every spot that will CONFUSE a new reader.', cells:[{label:'Yechiel gave Mr. Blum the wallet, and he started to cry.',ok:true},{label:'Yechiel found the wallet. Then he knocked on Mr. Blum’s door.',ok:true},{label:'He read the card in the billfold.',ok:true},{label:'Yechiel saw a brown wallet on the bench at the bus stop.',ok:false},{label:'Yechiel zipped up his coat and walked six blocks in the rain.',ok:false}],
      h:'Read each line as a new reader. Would you stop and ask a question?'},
    {t:'sort', q:'Sneaky lines! Sort each line from the two drafts.', bins:[{id:'G',label:'✅ Clear for a new reader'},{id:'M',label:'⚠️ Missing step'},{id:'J',label:'⚠️ Jump'}],
      items:[{label:'Boys who find something put it on the shelf and write it on the list beside it.',bin:'G'},{label:'Yechiel opened the wallet. Then he walked to Willow Lane.',bin:'M'},{label:'Thirty-one items went home last month. Avishai Torres is in sixth grade.',bin:'J'},{label:'Rabbi Rosen set up the shelf because returning a lost item is a mitzvah.',bin:'G'},{label:'Boys put found items on the shelf. Then the owners take them home.',bin:'M'},{label:'Rabbi Rosen set up the shelf this fall. Returning a lost item is a mitzvah.',bin:'J'}],
      h:'An action skipped (“How did that happen?”) is a missing step. Two ideas with no link (“What does this have to do with that?”) is a jump.'},
    {t:'order', q:'Put Akiva’s revising steps in order.', tiles:['Read it as a new reader.','Stop where he would ask a question.','Name the problem.','Fix it with a name, a meaning, a step or a link.'], extra:['Fix the spelling first.'],
      h:'Read, stop, name, fix. Spelling waits for editing.'},
    {t:'spotall', q:'Eli’s sports piece for The Beacon. Tap every spot that will CONFUSE a new reader.', cells:[{label:'Dov passed to Tzvika, and he scored.',ok:true},{label:'We ran our give-and-go.',ok:true},{label:'We were down by six. Then we won by two.',ok:true},{label:'The game was on Sunday afternoon.',ok:false},{label:'The crowd cheered at the end.',ok:false}],
      h:'Who is he? What does that word mean? How did that happen?'},
    {t:'write', q:'Your turn to write. Take a piece you wrote this year. Read it as a new reader. Find at least two spots where he would stop. Name each problem and write the fixed line.', min:0, checks:['👉 Every he and it points to only one person or thing.','📖 Every word a new reader may not know is explained.','🔗 No step is missing, and every idea links to the one before.'], h:'Pretend you are a fifth grader who was not there. Circle every spot where you would ask a question.'}

  check:[
    {q:'Gavriel’s trip report: “Mr. Gross showed Yoni the map, and he pointed to the trail.” What will confuse a reader: unclear he or it, jump, or undefined word?', o:['unclear he or it','jump','undefined word'], h:'Draw an arrow from “he.” Can it point to two people?'},
    {q:'Gavriel’s trip report: “The trail has three switchbacks.” A fifth grader asks, “What is a switchback?” What will confuse a reader: undefined word, missing step, or unclear he or it?', o:['undefined word','missing step','unclear he or it'], h:'What question does the reader ask?'},

  'WRIT.ESSAY.L08.08':{name:'Edit Like a Pro',
  teach:[
    {how:'In Grade 4 you edited with COPS, one letter at a time, on a short piece. Now you go further. Akiva, The Beacon’s editor, edits a WHOLE piece in THREE PASSES, from biggest to smallest. Each pass hunts one kind of mistake, through the whole piece, top to bottom. PASS 1, the SENTENCES PASS: fragments and run-ons. PASS 2, the WORDS PASS: usage and spelling. PASS 3, the MARKS PASS: punctuation and capitals. You know these mistakes from grammar class. Today is about the method that catches them.', q:'Which pass catches “Because the shelf was full.”?', o:['sentences pass','words pass','marks pass']},
    {how:'Each pass has a pro tool. SENTENCES PASS: read ALOUD, one sentence at a time. Stop at every period: is it one whole thought? A fragment sounds unfinished; a run-on jams two thoughts together. A run-on belongs to this pass, even though its fix adds a mark. WORDS PASS: read BACKWARD, last word first, so the story cannot carry your eyes past a misspelled word. When you land on a look-alike word (their, there and they’re; its and it’s; then and than), read its sentence to check it. MARKS PASS: put your finger on the start and end of every sentence, every name and every quotation mark. Why this order? A pass 1 fix can add a period and a capital. Doing marks LAST means you check them after every other fix.', q:'“Their are 31 items on the shelf.” Which pass catches it?', o:['words pass','sentences pass','marks pass']},
    {how:'Two mistakes. WRONG TOOL: each pass needs its own tool. Reading forward for spelling lets the story carry your eyes right past “blokcs.” Reading backward for fragments breaks every thought apart, so you cannot hear one. OUT OF ORDER: he checks the marks first, then splits a run-on, and the new period and capital never get checked. And remember: editing is not revising. You fixed the meaning when you revised. Now fix only sentences, words and marks.', q:'Yoni hunts spelling by reading his news item forward, fast, the way he reads a story. Which mistake is it?', o:['wrong tool','out of order','no mistake']}
  ],
  practice:[
    {t:'sort', q:'Which pass catches each mistake in the drafts?', bins:[{id:'S',label:'🗣️ Sentences pass'},{id:'W',label:'🔤 Words pass'},{id:'M',label:'✒️ Marks pass'}],
