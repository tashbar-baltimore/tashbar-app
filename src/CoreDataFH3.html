<script>
/* CoreDataFH3.html: Core Growth job F, HELPER 3 (Helpers wanted: "F · K–1 listen-along stories"), Kindergarten listening games

   Maple Street, F-map section 8). The skill rows are in src/CoreDataF.js (file CoreDataFH3).

    { id:'READ.LIT.L01.01', grade:0, name:'Who Is in the Story?', pic:'🧒', after:'READ.COMP.L01.02', acts:[

      {type:'listen', hear:'One boy sat all alone. He looked worried. Who was he?', o:['🧒🎒','👦🪑','👶'], a:'👦🪑', mis:true, say:'Listen. Who was the worried boy? Tap him.', how:'Not the boy with the knapsack. Picture the classroom page.'},
      {type:'match', pairs:[['👨‍🏫','🏫'],['👶','🍼'],['🧔','🥐']], say:'Match each person to his place or thing.', how:'Think where we met him in the story. Who bakes? Who is tiny?'},
      {type:'listen', hear:'Who helped Ovadia feel better?', o:['🧔','🧒🎒','👶'], a:'🧒🎒', say:'Who was a kind friend? Tap him.', how:'Think: who shared his snack and sat next to Ovadia?'}]},

    { id:'READ.LIT.L01.02', grade:0, name:'Where Is the Story?', pic:'🛖', after:'READ.PA.L01.09', acts:[

      {type:'listen', hear:'Where does this story happen?', o:['🏫','🛖🌿','🏖️'], a:'🛖🌿', say:'Where did the family eat supper? Tap the place.', how:'The setting is where the story happens. Listen for the place.'},
      {type:'listen', hear:'When does this story happen? In the day, or at night?', o:['☀️','🌙⭐'], a:'🌙⭐', say:'When did it happen? Day or night?', how:'Listen for clues. What color was the sky? What could Eli see?'},
      {type:'sort', bins:['🛖 In the sukkah','🚫 Not there'], cards:[['🕯️',0],['🛝',1],['⭐',0],['🏊',1],['🐈',0]], say:'What was in the sukkah story? Sort them.', how:'Close your eyes. Picture the sukkah. Was it there?'},
      {type:'listen', hear:'Something moved by the wall. Where was Eli then?', o:['🌲','🛖🌿','🏫'], a:'🛖🌿', mis:true, say:'Something moved! Where was Eli then? Tap the place.', how:'A noise does not change the place. Did Eli go anywhere?'},
      {type:'match', pairs:[['⭐','🌙'],['🌿','🛖'],['🎒','🏫']], say:'Clues tell the setting. Match each clue to its place or time.', how:'Ask: where would I see this? When would I see it?'}]},

    { id:'READ.LIT.L01.03', grade:0, name:'Problem and Fix', pic:'💡', after:'READ.PA.L01.04', acts:[

      {type:'listen', hear:'What was the problem in the story?', o:['🍪','💨🔵','🌧️'], a:'💨🔵', say:'What went wrong? Tap the problem.', how:'The problem is the thing that went wrong. What did the wind do?'},

      {type:'listen', hear:'How was the problem fixed?', o:['🛒','🚌','📮🌲🔵'], a:'📮🌲🔵', say:'How did it get better? Tap the fix.', how:'The fix is how the problem got better. Who came by?'},
      {type:'order', steps:['💨🔵','🔍🌳','📮🌲🔵'], say:'Put it in order: problem, looking, fix.', how:'First something goes wrong. Then they try. Last it gets better.'},
      {type:'sort', bins:['😟 Problem part','😊 Fix part'], cards:[['💨',0],['😢',0],['📮',1],['📎',1]], say:'Is it part of the problem, or the fix?', how:'Did it make things worse, or better?'}]},

    { id:'READ.LIT.L01.04', grade:0, name:'Retell It', pic:'🍞', after:'READ.PHON.L01.02', acts:[

      {type:'listen', hear:'How did Eli feel at the very end?', o:['😢','😠','😊'], a:'😊', say:'How did Eli feel at the end? Tap it.', how:'Remember Abba\'s question. What did Eli\'s face do?'}]}

  if (window.TLCORE && TLCORE.k1) K1G.forEach(function (g) { TLCORE.k1.add(g); });
