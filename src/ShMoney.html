function tdot(x,y,t){ if(t.jelly) return; if(t.donut){ donut(x,y); return; } if(TLIVE>=TCAP) return; const e=document.createElement('i'); TLIVE++;
  if(t.em){ e.className='stem'; e.textContent=t.em[tk++%t.em.length]; e.style.fontSize=(t.small?13:18)+'px'; e.style.left=x+'px'; e.style.top=y+'px'; document.body.appendChild(e);
    e.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(-50%,${t.up?-(18+Math.random()*16):(10+Math.random()*20)}px) scale(.3)`,opacity:0}],{duration:t.up?900:700,easing:'ease-out'}).onfinish=()=>{ e.remove(); TLIVE--; }; return; }
  if(t.conf){ const c=['#F43F5E','#22C55E','#3B82F6','#FACC15','#A855F7'][tk++%5]; e.className='sttr'; e.style.cssText+=`;width:6px;height:9px;border-radius:1.5px;left:${x-3}px;top:${y-4}px;background:${c}`; document.body.appendChild(e);
    const dx=(Math.random()-.5)*24, sp=(Math.random()<.5?-1:1)*(200+Math.random()*300); e.animate([{transform:'translate(0,0) rotate(0deg)',opacity:1},{transform:`translate(${dx}px,${26+Math.random()*20}px) rotate(${sp}deg)`,opacity:0}],{duration:800,easing:'ease-in'}).onfinish=()=>{ e.remove(); TLIVE--; }; return; }
  if(t.spark){ const c=['#F97316','#FACC15','#FB923C','#EF4444'][tk++%4]; e.className='sttr'; e.style.cssText+=`;width:5px;height:5px;left:${x-2.5}px;top:${y-2.5}px;background:#FFF7ED;box-shadow:0 0 6px 3px ${c}`; document.body.appendChild(e);
    const dx=(Math.random()-.5)*22, up=22+Math.random()*30; e.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${dx}px,${-up}px) scale(.2)`,opacity:0}],{duration:700+Math.random()*300,easing:'ease-out'}).onfinish=()=>{ e.remove(); TLIVE--; }; return; }
  if(t.fw){ const c=['#F43F5E','#FDE047','#38BDF8','#A3E635','#F472B6'][tk++%5]; e.className='sttr'; e.style.cssText+=`;width:4px;height:4px;left:${x-2}px;top:${y-2}px;background:#fff;box-shadow:0 0 6px 2px ${c}`; document.body.appendChild(e);
    const a=Math.random()*Math.PI*2, d=6+Math.random()*12; e.animate([{transform:'translate(0,0) scale(1.2)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+8}px) scale(.2)`,opacity:0}],{duration:550,easing:'ease-out'}).onfinish=()=>{ e.remove(); TLIVE--; }; return; }
  const sz=t.rb?14:12; e.className='sttr'; e.style.width=e.style.height=sz+'px'; e.style.left=(x-sz/2)+'px'; e.style.top=(y-sz/2)+'px';
  if(t.rb){ thue=(thue+9)%360; e.style.background=`hsl(${thue},95%,58%)`; } else { e.style.background='radial-gradient(circle,#FFF7ED,#FDBA74 45%,#F97316 70%,rgba(249,115,22,0))'; }
  document.body.appendChild(e); e.animate([{transform:'scale(1)',opacity:.95},{transform:'scale(.15)',opacity:0}],{duration:t.rb?650:450,easing:'ease-in'}).onfinish=()=>{ e.remove(); TLIVE--; }; }
function trailMove(x,y){ try{ if(rmo()||!A.st) return; const t=wornTrail(); if(!t){ TL=null; return; }
  if(!TL||Math.hypot(x-TL.x,y-TL.y)>200){ TL={x:x,y:y}; return; }
  const dx=x-TL.x, dy=y-TL.y, len=Math.hypot(dx,dy); if(len<t.gap) return; const ux=dx/len, uy=dy/len; let dd=len;
  while(dd>=t.gap){ TL.x+=ux*t.gap; TL.y+=uy*t.gap; dd-=t.gap; tdot(TL.x,TL.y,t); } }catch(e){} }

function buy(id){ const x=id==='gift'?item('gift'):item(id); if(!x||M.busy) return; M.busy=true; M.err=''; drawStore();

function center(el){ const r=el?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0}; return [r.left+r.width/2,r.top+r.height/2]; }

function receipt(rows){ if(!rows||!rows.length||isOpen('shm-pay')||k1()) return false;

 const lines=g.map((x,k)=>`<div class="ln" style="--i:${k}"><span>${x.n>1?x.n+' × ':''}${E(why(x.why).slice(0,46))}</span><b>${$(x.amt*x.n)}</b></div>`).join('');

  body:`<div class="shm-paper" style="--n:${g.length+1}"><div class="sub">TASHBAR BANK · ${E(d.toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'}))}<br>Pay to: ${E((A.st&&A.st.name)||'')}</div>${lines}<div class="ln tot" style="--i:${g.length}"><span>TOTAL</span><b>${$(tot)}</b></div><span class="shm-stamp">PAID</span></div><div class="shm-acts">${MN('Put it in my bank','data-shm="deposit"')}</div>`,
  onClose:()=>{ try{ const p=document.getElementById('tlcash'), [tx,ty]=p&&getComputedStyle(p).display!=='none'?center(p):[60,innerHeight-40]; flyMoney(innerWidth/2,innerHeight/2,tx,ty,Math.min(20,6+Math.round(tot/2))); register(); if(p){ p.classList.remove('bump'); void p.offsetWidth; p.classList.add('bump'); } }catch(e){} } });
 try{ printer(g.length+1); setTimeout(thunk,(g.length+1)*260+600); }catch(e){}
 return true; }
