   Only this workstream edits this file. Places register with SHK.place({...}) (src/ShellKit.html).
   Rebuilt fresh (2026-11-27) with the same functions and the same server calls as the old screens (CanteenKid, BoyLibrary, OlamHaba sheet,
   Music panel, TalkRebbe). Buttons come only from the button kit (window.TLK); every place is a full page with the house top left.
   The server sets every money amount: this file only shows what the server sends (the canteen's cart line adds up the prices the
   server sent, as a money lesson; the server checks and charges). Nothing here pays, saves mastery or changes money.
   Attributes are data-shp="..." (never the old data-cno / data-bl / data-tr / data-act), so the old screens never hear these taps.
   Grade 2 and up only (SHK.on()); K-1 boys keep their games and see none of this. */

const st=()=>{ try{ return (typeof A!=='undefined'&&A.st)||null; }catch(e){ return null; } };

const tap=()=>{ try{ SND.tap(); }catch(e){} };

const money=n=>(n<0?'−':'')+'$'+Math.abs(Number(n)||0).toFixed(2);

.shp-cloud i:nth-of-type(1){left:14px;top:52px;width:96px;height:72px}.shp-cloud i:nth-of-type(2){left:66px;top:10px;width:116px;height:108px}.shp-cloud i:nth-of-type(3){left:142px;top:46px;width:88px;height:76px}

.shp-eq{display:inline-flex;gap:3px;align-items:flex-end;height:22px}.shp-eq i{width:5px;background:#D97706;border-radius:2px;height:40%;animation:shp-eq 1s ease-in-out infinite alternate}.shp-eq i:nth-child(2){animation-delay:-.3s}.shp-eq i:nth-child(3){animation-delay:-.6s}

/* ======================= THE CANTEEN COURT (city; door canteen) ======================= */
const CN={info:null,infoAt:0,infoBusy:false,menu:null,cash:null,pf:1,story:[],order:null,recent:[],panel:'buy',step:'shop',tray:{},cid:null,busy:false,msg:'',last:null,lastStatus:null,poll:0,tip:0,cls:false};
const TIPS=[
 ['Need or want?','Water is a need. A treat is a want. Both are OK. Just think before you buy.'],
 ['Save some!','Money you do not spend today is still yours tomorrow. You can save up for something bigger.'],
 ['Compare','Two snacks you like? The cheaper one leaves you more money.'],
 ['Look at "Left after"','Every time you buy, your money goes down. Check how much will be left.'],
 ['Tzedakah','Some money can help others. You can give in the Store.'],
 ['Locked','Locked food costs more than you have. Save up, and it opens by itself!']];
/* the four doors, in this order (the order tests/run.js and tests/lib/shell-places.js check) */
const CN_DOORS=[['buy','🍕','Buy food','Pick, pay, get it'],['cash','💳','Get canteen money','Where it comes from'],['story','📒','My story','Money in and out'],['learn','📚','Lessons','Learn to use money']];
function inClass(){ try{ return !!(window.TM_CLASS&&TM_CLASS()); }catch(e){ return false; } }
function cnInfo(force){ if(!S.on()||CN.infoBusy) return; if(!force&&CN.infoSid===sid()&&Date.now()-CN.infoAt<60000) return; CN.infoBusy=true; CN.infoSid=sid();
 S.call('cnKidInfo').then(r=>{ CN.infoBusy=false; CN.infoAt=Date.now(); CN.info=r&&r.ok?r:null; if(isOpen('canteen')&&CN.panel==='learn') cnDraw(); }).catch(()=>{ CN.infoBusy=false; CN.infoAt=Date.now(); }); }
function cnLoad(){ return S.call('cnOrderMenu').then(r=>{ r=r||{}; CN.menu=r.menu||[]; CN.cash=r.cash==null?null:r.cash; CN.pf=r.pf==null?1:r.pf; CN.story=r.story||[]; CN.order=(r.open||[])[0]||null; CN.recent=r.recent||[]; cnStatus(); cnDraw(); })
 .catch(e=>{ CN.msg=(e&&e.message)||'Could not load the menu.'; cnDraw(); }); }
/* the canteen tells him when his food is ready: while he waits for an order, ask again every 15 s (only on that screen) */
function cnWatch(){ clearTimeout(CN.poll); if(!isOpen('canteen')||!CN.order||CN.panel!=='buy') return; CN.poll=setTimeout(()=>{ if(isOpen('canteen')&&CN.order) cnLoad().then(cnWatch); },15000); }
function cnStatus(){ const o=CN.order, s=o?(o.seen?'seen':o.status):null;
 if(s&&s!==CN.lastStatus&&CN.lastStatus){ try{ SND.right(3); }catch(e){} }
 if(!o&&CN.lastStatus){ const r=CN.recent[0]; if(r&&r.status==='picked') CN.msg='The canteen gave you your food. Enjoy! Say a bracha!'; else if(r&&r.status==='cancelled') CN.msg='The canteen could not make it. All your money is back.'; CN.step='shop'; CN.last=null; }
 CN.lastStatus=s; }
function coinsHTML(c){ c=Math.max(0,Math.round(c)); let h='', n=0; const max=14;
 const d=Math.floor(c/100); c-=d*100; if(d>4) h+=`<span class="shp-bill">$1</span><b>× ${d}</b>`, n+=2; else for(let i=0;i<d;i++){ h+='<span class="shp-bill">$1</span>'; n++; }
 [[25,'q','25¢'],[10,'di','10¢'],[5,'n','5¢'],[1,'p','1¢']].forEach(([v,k,l])=>{ let q=Math.floor(c/v); c-=q*v; while(q-->0&&n<max){ h+=`<span class="shp-coin ${k}" title="${l}">${l}</span>`; n++; } });
 return h; }
function coinWords(c){ c=Math.max(0,Math.round(c)); const d=Math.floor(c/100), q=Math.floor((c%100)/25), r=c%25, w=[];
 if(d) w.push(d+(d===1?' dollar':' dollars')); if(q) w.push(q+(q===1?' quarter':' quarters')); if(r) w.push(r+(r===1?' cent':' cents')); return w.join(' and ')||'nothing yet'; }
function trayLines(){ return (CN.menu||[]).filter(m=>CN.tray[m.id]>0).map(m=>({m,q:CN.tray[m.id]})); }
function trayCents(){ return trayLines().reduce((s,l)=>s+cents(l.m.price)*l.q,0); }
function coach(t){ const x=t||TIPS[CN.tip%TIPS.length]; return `<div class="shp-coach"><span style="font-size:28px" aria-hidden="true">🦉</span><div><b>Money coach: ${E(x[0])}</b>${E(x[1])}</div></div>`; }
function steps(n){ return `<div class="shp-steps">${['1 Pick food','2 Pay','3 Get your food'].map((s,i)=>K().pill(i===n?'now':'prog',s).replace('tlk-pill','tlk-pill'+(i===n?' on':''))).join('')}</div>`; }
/* the Level Pass rule (HoS 2026-11-20; server: PathfinderLevel.js): the server sends pf; below 1 a level still waits for its quick check. Canteen money is never cut. */
function quarter(pf){ if(!(pf<1)) return ''; const on=Math.max(1,Math.min(3,Math.round(pf*4)));
 return card(`<p><b>Take the quick level check to unlock full pay at this level.</b> Until then, lessons there give ${on===1?'1 quarter':on+' quarters'} for every dollar. A <b>quarter</b> is 25¢; <b>4 quarters make $1.00</b>. Your canteen money is not cut.</p>`); }
function wallet(){ const c=cents(CN.cash);
 return card(`<div class="shp-wallet">${K().box('money','My canteen money',CN.cash==null?'…':money(CN.cash))}<div><div class="shp-coins" aria-hidden="true">${CN.cash==null?'':coinsHTML(c)}</div><p class="shp-sm">${CN.cash==null?'':'That is '+E(coinWords(c))+'.'}</p></div></div>`); }
function cnDoors(){ const crew=CN.info&&CN.info.crew&&CN.info.crew.assigned;
 return `<div class="shp-tiles4" role="tablist" aria-label="In the canteen">${CN_DOORS.map(x=>`<button type="button" role="tab" class="tlk tlk-tile shp-door" aria-selected="${CN.panel===x[0]}" data-shp="cn-door" data-p="${x[0]}"><span class="shp-ti" aria-hidden="true">${x[1]}</span><b>${x[2]}</b><small>${x[0]==='learn'&&crew?'Money and Canteen Crew':x[3]}</small></button>`).join('')}</div>`; }
function vShop(){ const have=cents(CN.cash), used=trayCents(), left=have-used, L=trayLines();
 let h=steps(0)+`<div class="shp-grid">${CN.menu.map(m=>{ const p=cents(m.price), q=CN.tray[m.id]||0, lock=!m.out&&p>left;
  return `<button type="button" class="tlk tlk-tile shp-food" data-shp="cn-add" data-id="${E(m.id)}"${m.out||lock?' aria-disabled="true"':''} aria-label="${E(m.name)}, ${amt(p)}${m.out?', sold out':lock?', locked':''}">${m.pic?`<img class="shp-em" src="${E(m.pic)}" alt="">`:`<span class="shp-em" aria-hidden="true">${E(m.emoji||'🍪')}</span>`}<b>${E(m.name)}</b><span class="shp-row">${K().pill('money',amt(p))}${q?K().pill('now','In your tray: '+q):''}${m.out?K().pill('lock','Sold out'):lock?K().pill('lock',q?'No money for one more':'Need '+amt(p-left)+' more'):''}</span></button>`; }).join('')}</div>`;
 h+=`<div class="shp-tray">${L.length?L.map(l=>K().quiet('Take out '+l.m.name+(l.q>1?' (×'+l.q+')':''),'data-shp="cn-sub" data-id="'+E(l.m.id)+'"','tlk-small')).join(''):'<p><b>Tap the food you want.</b></p>'}</div>`;
 if(L.length) h+=`<p class="shp-math">${money(have/100)} <i>− ${money(used/100)}</i> = <u>${money(left/100)} left</u></p>`;
 h+=`<div class="shp-fixed">${L.length?K().main('Next','data-shp="cn-check"'):''}</div>`;
 return card(h)+card(coach(CN.menu.some(m=>!m.out&&cents(m.price)>left)&&!L.length?TIPS[5]:null)); }
function vCheck(){ const have=cents(CN.cash), used=trayCents(), L=trayLines();
 return card(steps(1)+`<div class="shp-list">${L.map(l=>`<div><span>${E(l.m.emoji||'🍪')} ${E(l.m.name)}${l.q>1?' ×'+l.q:''}</span>${K().pill('money',money(cents(l.m.price)*l.q/100))}</div>`).join('')}
  <div><span>You have</span>${K().pill('money',money(have/100))}</div><div><span>You pay</span>${K().pill('money','− '+money(used/100))}</div><div><span><b>Left after</b></span>${K().pill('money',money((have-used)/100))}</div></div>`
  +K().ask({title:CN.busy?'Paying…':'Buy it for '+money(used/100)+'?',text:'The money comes off your canteen money right now. Then go to the canteen and get your food.',yes:'Buy it',yesAttrs:'data-shp="cn-buy"'+(CN.busy?' disabled':''),noAttrs:'data-shp="cn-back"'}),'shp-c')+card(coach(TIPS[3])); }
function vTrack(){ const o=CN.order, done=o.status==='picked', seen=o.seen||o.status==='ready', idx=done?3:seen?1:0;
 const stages=[['🛒',o.paid===false?'I ordered':'I paid'],['👀','The canteen is making it'],['😋','I got my food']];
 let h=steps(2);
 if(CN.last) h+=`<h3>You paid ${money(CN.last.total)}!</h3><p class="shp-math">${money(CN.last.before)} <i>− ${money(CN.last.total)}</i> = <u>${money(CN.last.after)}</u></p><p>Now you have ${money(CN.last.after)} (${E(coinWords(cents(CN.last.after)))}).</p>`;
 h+=`<div class="shp-track">${stages.map((x,i)=>`<div class="${i<idx||i===0?'ok':i===idx?'on':''}"><span aria-hidden="true">${x[0]}</span>${i<idx||i===0?'✓ ':''}${E(x[1])}</div>`).join('')}</div>`;
 h+=`<p><b>${seen?'The canteen saw your order. It is still being made.':'Go to the canteen and say your name. They will give you your food.'}</b></p>`;

 const MU=MU_(), m=muPrefs(), off=MU.info&&MU.info.off, wait=!MU.info;
 const tile=(k,ic,name,sub,dis)=>`<button type="button" class="tlk tlk-tile" data-shp="mu-mood" data-m="${E(k)}" aria-pressed="${m.mood===k}"${dis?' disabled':''}><span class="shp-em" aria-hidden="true">${ic}</span><b>${E(name)}</b><small>${E(sub)}</small>${m.mood===k?K().pill('now',k==='off'?'On now':'Playing'):''}</button>`;
 return (off?card(`<p>${K().pill('lock','Your teacher turned music off for the school right now.')} Sound effects still work.</p>`):'')
  +card(`<p>${wait?'Getting the songs ready…':'Pick a kind of music. It keeps playing new songs of that kind.'}</p><div class="shp-grid">${tile('off','🔇','No music','Quiet. Game sounds stay on.',false)}${muMoods().map(r=>{ const n=muCount(r[0]); return tile(r[0],r[1],r[2],r[3]+(n?' · '+n+' songs':''),off||wait); }).join('')}</div>`)
  +card(`<label class="shp-vol"><span aria-hidden="true">🔈</span><input type="range" min="0" max="100" value="${Math.round((m.vol==null?.6:m.vol)*100)}" aria-label="Volume" data-shp="mu-vol"><span aria-hidden="true">🔊</span></label><p class="shp-sm">🎧 Please use headphones, so the music is just for you.</p>`)
  +`<div id="shp-munow">${muNow()}</div>`; }
function muDraw(){ if(isOpen('music')) S.body('music',muBody()); }
/* the engine says when a song starts or stops (muUI); the Now playing box follows it */
try{ if(typeof window.muUI==='function'&&!window.muUI.__shp){ const _u=window.muUI; window.muUI=function(){ const r=_u.apply(this,arguments); try{ const n=document.getElementById('shp-munow'); if(n&&isOpen('music')) n.innerHTML=muNow(); }catch(e){} return r; }; window.muUI.__shp=true; } }catch(e){}
S.place({id:'music',name:'Music',world:'c',icon:'ycw-ic-music',scene:'ycw-c-music',door:'music',order:68,
 show:()=>S.on(),
 sub:()=>{ if(!mu()) return 'Pick your music'; const m=muPrefs(), r=muMoods().find(x=>x[0]===m.mood); return m.mood==='off'||!r?'Music is off':'Playing: '+r[2]; },
 pill:()=>'',
 open:()=>{ if(!S.on()) return; css(); try{ muCtx(); muLoadSfx(); }catch(e){} S.page({id:'music',world:'c',scene:'ycw-c-music',title:'Music',icon:'ycw-ic-music',body:muBody()}); muInfo().then(muDraw); }});

/* ======================= THE MESSAGE TOWER: Talk to my Rebbe (kingdom; door talk) =======================
   He picks ANY staff member, writes a note, and sends it (asked first with TLK.ask). Only that staff member sees it (Classroom.js crSend). */
const TR={staff:null,to:'',text:'',busy:false,step:'write',sent:'',msg:''};
function trName(id){ const s=(TR.staff||[]).find(x=>String(x.id)===String(id)); return s?s.name:''; }
function trBody(){
 if(TR.step==='sent') return card(`<div class="shp-c"><div style="font-size:54px" aria-hidden="true">✅</div><h3>Your note was sent</h3><p>It went to <b>${E(TR.sent)}</b>. Only they will see it.</p><div class="shp-fixed">${K().quiet('Write another note','data-shp="tr-new"')}</div></div>`);
 if(TR.step==='ask') return card(K().ask({icon:'✉️',title:TR.busy?'Sending…':'Send this note to '+trName(TR.to)+'?',text:'Only '+trName(TR.to)+' will see it.',yes:'Send',yesAttrs:'data-shp="tr-send"'+(TR.busy?' disabled':''),noAttrs:'data-shp="tr-no"'}),'shp-c');
 const opts=(TR.staff||[]).map(s=>`<option value="${E(s.id)}"${String(s.id)===String(TR.to)?' selected':''}>${E(s.name)}</option>`).join('');
 return card(`<div class="shp-form"><p>Write a note to any rebbe or teacher.</p>
  <label for="shp-tr-to">Who is it for?</label>${TR.staff?`<select id="shp-tr-to"><option value="">Pick a rebbe or teacher</option>${opts}</select>`:'<p>Loading the list…</p>'}
  <label for="shp-tr-text">Your note</label><textarea id="shp-tr-text" maxlength="1000" placeholder="Write what you want to say.">${E(TR.text)}</textarea>
  <div class="shp-n" id="shp-tr-n">${TR.text.length} / 1000</div>
  <p>${K().pill('lock','🔒 Only the person you pick will see this note.')}</p>
  ${TR.msg?`<p role="alert">${K().pill('now',TR.msg)}</p>`:''}
  <div class="shp-fixed">${K().main('Send my note','data-shp="tr-ask"')}</div></div>`); }
function trKeep(){ const ta=document.getElementById('shp-tr-text'), sel=document.getElementById('shp-tr-to'); if(ta) TR.text=ta.value; if(sel) TR.to=sel.value; }
function trDraw(){ if(isOpen('talk')) S.body('talk',trBody()); }
function trOpen(note){ if(!S.on()) return; css(); TR.step='write'; TR.msg=''; TR.busy=false; if(note&&!TR.text) TR.text=String(note).slice(0,1000);
 S.page({id:'talk',world:'k',scene:'ycw-k-post',title:'Talk to my Rebbe',icon:'ycw-ic-talk',body:trBody()});
 if(!TR.staff) S.call('crStaffList').then(l=>{ TR.staff=l||[]; trDraw(); }).catch(()=>{ TR.staff=[]; trDraw(); }); }
function trClick(a){
 if(a==='tr-ask'){ trKeep(); if(!TR.to){ TR.msg='Pick who the note is for.'; return trDraw(); } if(!TR.text.trim()){ TR.msg='Write your note first.'; return trDraw(); } TR.msg=''; TR.step='ask'; tap(); return trDraw(); }
 if(a==='tr-no'){ TR.step='write'; return trDraw(); }
 if(a==='tr-new'){ TR.step='write'; TR.msg=''; return trDraw(); }
 if(a==='tr-send'){ if(TR.busy) return; TR.busy=true; trDraw();
  return S.call('crSend',TR.to,TR.text).then(r=>{ TR.busy=false; TR.sent=(r&&r.to)||trName(TR.to); TR.text=''; TR.to=''; TR.step='sent'; try{ SND.right(3); }catch(e){} trDraw(); })
   .catch(err=>{ TR.busy=false; TR.step='write'; TR.msg=String((err&&err.message)||err||'Could not send. Try again.').replace(/^Error:\s*/,''); trDraw(); }); }
}
document.addEventListener('input',e=>{ const t=e.target; if(!t) return;
 if(t.id==='shp-tr-text'){ TR.text=t.value; const n=document.getElementById('shp-tr-n'); if(n) n.textContent=TR.text.length+' / 1000'; }
 if(t.dataset&&t.dataset.shp==='mu-vol'&&mu()){ const MU=MU_(), m=muPrefs(); m.vol=(+t.value)/100; try{ if(MU.audio) MU.audio.volume=muTarget(); }catch(x){} clearTimeout(MU.shpSave); MU.shpSave=setTimeout(()=>{ try{ if(A.st) saveStudent(A.st); }catch(x){} },1500); } });
document.addEventListener('change',e=>{ const t=e.target; if(t&&t.id==='shp-tr-to') TR.to=t.value; });
S.place({id:'talk',name:'Talk to my Rebbe',world:'k',icon:'ycw-ic-talk',scene:'ycw-k-post',door:'talk',order:70,
 show:()=>S.on(),
 sub:()=>'Write a note to your rebbe or teacher',
 pill:()=>'',
 open:()=>trOpen()});

/* ======================= one tap listener for all five places ======================= */
document.addEventListener('click',e=>{ const b=e.target&&e.target.closest&&e.target.closest('[data-shp]'); if(!b||!b.closest('.shk-page,.shk-pop')) return;
 const a=b.dataset.shp; if(b.disabled||b.getAttribute('aria-disabled')==='true'&&a!=='cn-add') return;
 if(a.indexOf('cn-')===0) return cnClick(a,b);
 if(a.indexOf('tr-')===0) return trClick(a);
 if(a==='lesson'){ const id=b.dataset.id; tap(); return S.openLesson(id); }
 if(a==='lb-tab'){ LB.tab=+b.dataset.i||0; tap(); return lbDraw(); }
 if(a==='oh-go') return S.close('olamhaba','home');
 if(a==='mu-mood'&&mu()){ const m=muPrefs(); m.mood=b.dataset.m; try{ if(m.mood==='off') muStop(); else muPlay(false); }catch(x){} try{ if(A.st) saveStudent(A.st); }catch(x){} return muDraw(); }
 if(a==='mu-next'&&mu()){ try{ if(muPrefs().mood!=='off') muPlay(true); }catch(x){} return; }
});
/* other parts of the app (a lesson's "Still stuck?", Kodesh Quest) can open the Message Tower with a note already written */
window.SHP={ talk:note=>{ if(!S.on()) return false; S.fly('k',()=>trOpen(note)); return true; }, doors:CN_DOORS.map(d=>d[0]) };
})();
</script>
