  'WRIT.ESSAY.L09.02':{name:'Claim vs Counterclaim',
  teach:[
    {how:'MY CLAIM is the position I will prove. A COUNTERCLAIM is the opposing position. In Grade 7 you brought the other side in and answered it. In Grade 8 you choose WHICH version of the other side to answer: the strongest one.', q:'Debate topic: our grade should hold the class election by secret ballot. Eli argues FOR it. Which sentence is a counterclaim?', o:['A show of hands is faster and lets everyone see that the count is honest.','A secret ballot lets every boy vote without pressure from his friends.','The election will be held in Cheshvan.']},

  'WRIT.ESSAY.L09.03':{name:'Rebuttal',
  teach:[
    {how:'A REBUTTAL answers a counterclaim with evidence and reasoning. Move 1: SHOWS IT IS MISTAKEN. Bring evidence that the counterclaim is simply not true: "In fact, …".', q:'Claim: our yeshiva should join the debate tournament. Counterclaim: “It will cost a whole week of learning.” Which rebuttal shows it is mistaken?', o:['In fact, the schedule shows the tournament falls during Chanukah vacation, so no school day is missed.','But debate is really fun.','The tournament should happen because it is a good idea.']},
    {how:'Move 2: SHOWS IT MATTERS LESS. The counterclaim is true, but the problem is small. The test: matters less talks only about the problem and makes it smaller. Outweigh admits the problem and adds a different good on your side.', q:'Counterclaim: “Debate practice will make boys late for supper.” Which rebuttal shows it matters less?', o:['Practice ends only ten minutes after the usual supper time, on one night a week.','Yes, supper may be late, but boys learn to speak with confidence.','Only boys who complain about everything say that.']},
    {how:'Move 3: CONCEDE AND OUTWEIGH. Admit the problem openly ("Yes, …"), then add a different good that weighs more ("but …"). The mistake: answering with an INSULT ("only lazy boys say that") or JUST REPEATING YOUR CLAIM ("we should still do it"). Neither brings evidence or reasoning.', q:'Counterclaim: “A student election takes two afternoons.” Which rebuttal is concede and outweigh?', o:['Yes, it takes two afternoons, but every boy learns how to choose leaders wisely.','We should still hold the election.','People who say that just want to complain.']}

    {t:'write', q:'Your turn to write. Counterclaim: “A student election will turn friends against each other.” Write a rebuttal that uses ONE of the three moves, and name the move.', min:0, checks:['🔎 I used one move and named it.','📊 I gave evidence or a reason.','🚫 No insult, and not just my claim again.'], h:'Pick a move. Mistaken: "In fact, …". Matters less: "The problem is small: …". Concede: "Yes, …, but …".'}

    {q:'Counterclaim: “If the library stays open in the evening, no adult will be in charge.” Rebuttal: “In fact, Mr. Gross’s sign-up sheet already lists a parent volunteer for every evening.” Which move is it?', o:['shows it is mistaken','shows it matters less','concede and outweigh'], h:'Does the evidence show the worry is not true, or only small?'},
    {t:'order', q:'Counterclaim: “Debate practice runs late.” Build a concede and outweigh rebuttal. Tap the tiles in order.', tiles:['Yes, practice runs late,','but every debater','learns to speak','with confidence.'], h:'Admit the problem first. Then the different good that weighs more.'}

    {how:'A simpler step: start every rebuttal with one of three openers: "In fact," or "The problem is small:" or "Yes, …, but …". Then add your evidence.', q:'Which opener admits the point?', o:['Yes, …, but …','In fact,','The problem is small:']},
    {how:'The skill underneath: Answer a counterclaim (Level 8). First bring in the other side; then you can answer it.', q:'Before you rebut it, you must first state the…', o:['counterclaim','title','greeting']}

  'WRIT.PARA.L09.01':{name:'Spot the Weak Link',
  teach:[
    {how:'In Grade 7 you fixed jumps in your own chain of reasons. Debaters give those jumps names: OVERGENERALIZING (one case becomes "always") and FALSE CAUSE ("it came after, so it was caused by it"). Now you add two more, and you use all four to NAME THE WEAK LINK in your OPPONENT’S argument.', q:'Your opponent says: “The week after the new water fountain went in, our team won every game, so the fountain won the games.” Name the weak link.', o:['false cause','overgeneralizing','either-or']},
    {how:'ATTACKING THE PERSON: the opponent goes after who said it instead of what he said, so the idea is still unanswered. It can even sound polite: "With respect, he is only in sixth grade." Your answer: bring the debate back to the idea.', q:'Opponent: “We should not use Gavriel’s schedule plan; he is always late himself.” Name the weak link.', o:['attacking the person','either-or','false cause']},
    {how:'EITHER-OR: the opponent offers only two choices when there are more. Your answer: NAME THE OTHER CHOICES ("There is a third way: …"). SOUND REASONING has none of the four weak links: enough cases, a real cause, the idea not the person, and more than two choices.', q:'Opponent: “Either we cancel recess, or we never finish the year’s learning.” What is the best answer?', o:['Name the other choices, like a shorter recess or a better schedule.','Agree that there are only two choices.','Say that the opponent is lazy.']}

      items:[{label:'Akiva waited a long time once, so the line is always slow.',bin:'O'},{label:'The line got slower after the walls were painted, so the paint slowed it.',bin:'F'},{label:'The office timed the line at 20 minutes on each of the last ten days.',bin:'S'},{label:'One boy was late to Mincha because of the line, so every boy is late.',bin:'O'},{label:'One server handles 120 boys, while the other grades have two.',bin:'S'}],

      items:[{label:'Don’t listen to Yoni; he lost last year’s chess match.',bin:'P'},{label:'Either we hold an election, or no boy will ever lead anything.',bin:'E'},{label:'Rabbi Rosen says the last five club votes all went smoothly.',bin:'S'},{label:'With respect, Eli only wants an election because he wants to win it.',bin:'P'},{label:'Either the teachers choose everything, or the boys choose everything.',bin:'E'}],
      h:'Does it answer the idea or the person? Are there really only two choices?'},
    {t:'pairs', q:'Match each weak link to the way you answer it.', pairs:[['Overgeneralizing','Ask for enough cases, not just one.'],['Attacking the person','Bring it back to the idea.'],['Either-or','Name the other choices.']],
      h:'What would you say back to the opponent?'},
    {t:'spotall', q:'Your opponent’s speech against the class trip. Tap every sentence with a WEAK LINK.', cells:[{label:'One trip went badly, so every trip is a mistake.',ok:true},{label:'Either we go to the museum, or we learn nothing this year.',ok:true},{label:'The boys who want the zoo are just immature.',ok:true},{label:'The trip falls during Chanukah vacation, so no class is missed.',ok:false},{label:'The museum’s guide explains each exhibit to school groups.',ok:false}],
      h:'Ask the four questions of each sentence.'},
    {t:'order', q:'Build sound reasoning. Tap the tiles in order.', tiles:['Over ten days,','the office timed','a 20-minute wait','each day.'],
      h:'Start with how many cases. Then who checked. Then what was found.'},
    {t:'spotall', q:'Opponent: “Either we buy new chairs, or the library must close.” Tap every OTHER CHOICE he left out.', cells:[{label:'Borrow chairs from the lunchroom.',ok:true},{label:'Set study times by grade.',ok:true},{label:'Move some tables to make room.',ok:true},{label:'Close the library.',ok:false},{label:'Buy new chairs.',ok:false}],
      h:'His two choices are already on the table. Which choices did he leave out?'},
    {t:'write', q:'Your turn to write. Your opponent says: “Either we hold the tournament this year, or our yeshiva will never debate again.” Name the weak link, then answer it in one or two sentences.', min:0, checks:['🏷️ I named the weak link.','🔀 I named at least one other choice.','🤝 I answered his idea, not him.'], h:'Find the jump first. Then show a choice he left out.'}
  ],
  check:[
    {q:'In the election debate, Shimon says: “Don’t vote for Naftali’s plan; he can’t even keep his locker neat.” Name the weak link: attacking the person, either-or, or sound reasoning?', o:['attacking the person','either-or','sound reasoning'], h:'Is Shimon answering the plan, or talking about Naftali?'},
    {q:'Your opponent says: “Since the new bell schedule began, test scores fell, so the bell schedule lowered them.” Name the weak link.', o:['false cause','attacking the person','sound reasoning'], h:'Did he show the schedule caused it, or only that it came first?'},
    {t:'order', q:'Your opponent says: “Either the boys elect the editor, or the boys will have no say in The Beacon at all.” Name the weak link, then answer it. Tap the tiles in order.', tiles:['That is either-or,','because there is a third choice:','the boys could vote','on each issue’s top story.'], h:'First name the weak link. Then name a choice he left out.'}

  re:[

  'WRIT.PARA.L09.02':{name:'Evidence Ladder',
  teach:[
    {how:'Not all credible evidence is equally strong. Picture a ladder. Rung 1, the WEAKEST: ONE STORY (an anecdote), what happened to one person. It is real, but it may be unusual. Rung 2: AN EXPERT’S OPINION, what someone who knows the field thinks.', q:'Claim: boys focus better after a short break. Which is one story (an anecdote)?', o:['Moshe says he did his best on a test right after recess.','The school psychologist says breaks help most boys focus.','A study of 300 students found better focus after breaks.']},
    {how:'Rung 3: A NUMBER FROM A CAREFUL STUDY or AN OFFICIAL RECORD. Careful = many cases, chosen fairly, counted the same way. Rung 4, the STRONGEST: SEVERAL CAREFUL SOURCES THAT AGREE.', q:'Same claim. Which evidence is the strongest?', o:['Three separate studies and another school’s records all show better focus after breaks.','A study of 300 students found better focus after breaks.','The school psychologist says breaks help most boys focus.']},
    {how:'When two pieces compete, the one on the higher rung is STRONGER. Many stories are still stories: nobody counted them with care. Lead with the highest rung you have. A story can still help, but put it AFTER strong evidence to make it feel real, never in place of it.', q:'Which is stronger: a coach’s opinion, or the league’s official record of 40 games?', o:['the league’s official record of 40 games','the coach’s opinion','they are equal']}
  ],
  practice:[

      items:[{label:'Yoni’s cousin’s school went weekly, and he loved it.',bin:'S'},{label:'Mr. Gross, who has advised school papers for 20 years, thinks weekly works best.',bin:'X'},{label:'Our survey of all 180 boys found 132 want a weekly paper.',bin:'N'},{label:'One boy said he forgot about last month’s issue.',bin:'S'}],
      h:'One person’s experience? One expert’s view? Or many cases, counted with care?'},
    {t:'pairs', q:'Match each rung to its example.', pairs:[['Rung 1, the weakest','One story about one person'],['Rung 3','A number from a careful study'],['Rung 4, the strongest','Several careful sources that agree']],
      h:'The more careful cases behind it, the higher it climbs.'},
    {t:'spotall', q:'Claim: our school should add a second recess. Tap every piece of evidence that is STRONGER than one story.', cells:[{label:'A study of 300 students found better focus after breaks.',ok:true},{label:'The school psychologist says breaks help most boys focus.',ok:true},{label:'Another school’s office log shows fewer interruptions on days with two recesses.',ok:true},{label:'Avi felt better after an extra recess once.',ok:false},{label:'My brother’s yeshiva has two recesses, and he likes it.',ok:false}],

    {t:'order', q:'Put the evidence in order from weakest to strongest. Tap the tiles in order.', tiles:['Benny’s friend liked debate camp.','The debate coach says camp builds skills.','A careful survey of 200 campers found better speaking.','Three surveys and camp records all agree.'],

    {t:'write', q:'Your turn to write. Claim: our school should hold a debate tournament. Write two pieces of evidence: one from a low rung and one from a higher rung. Then say which is stronger and why.', min:0, checks:['📖 I wrote one piece from a low rung.','📊 I wrote one piece from a higher rung.','🪜 I said which is stronger and why.'], h:'Low: one boy’s story or one opinion. Higher: a careful count, an official record, or several sources that agree.'}

  check:[
    {q:'Claim: the class election should be held in the morning. Evidence: “Last year Chaim voted after lunch and forgot which boy he had picked.” On the ladder, what kind of evidence is it?', o:['one story','an expert’s opinion','several careful sources that agree'], h:'How many people does it tell about?'},
