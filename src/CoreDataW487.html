  'WRIT.ESSAY.L06.05':{name:'Story Mountain',
  teach:[
    {how:'A story mountain is a plan with four parts. THE PROBLEM: what goes wrong at the start. RISING EVENTS: each one makes the problem harder, so the story climbs. THE TURNING POINT: the top of the mountain, the moment everything changes. THE END: how it works out, on the way down.', q:'Tzvi Hirsch’s story: on Erev Shabbos morning, the oven in his family’s bakery breaks, with 200 challos still to bake. Which part of the mountain is this?', o:['the problem','the turning point','the end']},
    {how:'Ask about every event: does it make the problem HARDER? If yes, it is a rising event. The turning point is the highest moment: a choice, a discovery, or a big try that changes everything after it.', q:'Same story. “The repairman says he cannot come until Sunday.” What is it?', o:['a rising event','the turning point','the problem']},
    {how:'Two mistakes. A FLAT STORY: there is no real problem at all, just events that go “and then, and then”. And a story that SKIPS THE CLIMB: the problem is fixed right away, so there is no mountain at all, and the reader never worries.', q:'Which plan skips the climb?', o:['The oven breaks. A neighbor fixes it in one minute. The end.','The oven breaks. No repairman can come. The dough keeps rising. Then Tzvi Hirsch has an idea.','The oven breaks. Every phone call fails. Customers start calling.']}
  ],
  practice:[
    {t:'sort', q:'Dovid’s story about his model bridge. Sort each event: the problem, a rising event, or the turning point?', bins:[{id:'P',label:'⛰️ The problem'},{id:'R',label:'📈 Rising event'},{id:'T',label:'🔄 Turning point'}],
      items:[{label:'The night before the science fair, Dovid’s bridge cracks in half.',bin:'P'},{label:'The glue he needs is all used up.',bin:'R'},{label:'His little brother bumps the table, and another piece falls off.',bin:'R'},{label:'Dovid sees that triangles hold weight.',bin:'T'}],
      h:'The problem starts the story. A rising event makes it harder. The turning point changes everything after it.'},
    {t:'order', q:'Put Yehuda’s story mountain in order: problem, rising event, turning point, end. Tap the sentences in order.', tiles:['Yehuda’s notebook of clues goes missing the day before the Gazette is printed.','He searches his desk, his backpack and the shul, but it is not there.','Then he remembers lending it to his little sister to draw in.','He finds it under her crayons and finishes his article just in time.'], extra:['Yehuda likes the color green.'],
      h:'Start at the bottom: what goes wrong. Climb: what makes it harder. Top: what changes. Then down: how it works out.'},
    {t:'spotall', q:'Problem: Avrumi is lost on a class trip. Tap every event that makes the problem HARDER (a rising event).', cells:[{label:'His phone battery dies.',ok:true},{label:'It starts to rain, and his map gets wet.',ok:true},{label:'The bus he thought was his drives away.',ok:true},{label:'He eats a snack.',ok:false},{label:'Rabbi Feldman finds him right away.',ok:false}],
      h:'Ask about each one: does it make things worse for Avrumi?'},
    {t:'pairs', q:'The Crew’s sukkah story. Match each event to its part of the mountain.', pairs:[['A storm knocks down the sukkah on Erev Sukkos.','The problem'],['Two walls blow away down the street.','A rising event'],['Dovid has the idea to tie the walls to the fence.','The turning point'],['They eat in a strong sukkah all Yom Tov.','The end']],
      h:'What goes wrong? What makes it worse? What changes everything? How does it work out?'},
    {t:'sort', q:'Sort each plan: a story mountain, a flat story, or a story that skips the climb?', bins:[{id:'M',label:'⛰️ Story mountain'},{id:'F',label:'➖ Mistake: flat story'},{id:'S',label:'⏩ Mistake: skips the climb'}],
      items:[{label:'The siyum cake falls. The store is closed. Guests come in an hour. Tzvi Hirsch and Abba bake a new one together.',bin:'M'},{label:'We went to the park, and then we ate, and then we went home.',bin:'F'},{label:'The bike chain falls off. Abba fixes it in a second. The end.',bin:'S'},{label:'I woke up, davened, ate breakfast and went to yeshiva.',bin:'F'}],
      h:'A flat story has no problem at all. Skipping the climb means there is a problem, but it is fixed at once.'},
    {t:'spotall', q:'Problem: Binyamin keeps losing to the same older boy at chess club. Tap every event that could be the TURNING POINT.', cells:[{label:'Zeidy shows him a trap the older boy always falls for.',ok:true},{label:'Binyamin decides to study the older boy’s games, move by move.',ok:true},{label:'Binyamin loses again.',ok:false},{label:'The club meets on Tuesdays.',ok:false}],
      h:'A turning point is a choice or a discovery that changes everything after it.'},
    {t:'write', q:'Your turn to write. Plan a story mountain about a time something went wrong before Shabbos. Write one sentence for each part: the problem, two rising events, the turning point, and the end.', min:0, checks:['⛰️ My problem is a real problem.','📈 Each rising event makes it harder.','🔄 My turning point is where everything changes.'], h:'Think of an Erev Shabbos when your family was rushing. What went wrong? What made it worse?'}
  ],
  check:[
    {q:'Story: the Crew’s shalach manos baskets are ready on Purim morning, but snow closes the roads. Then the delivery van gets stuck. Then Avrumi has the idea to pull the baskets on sleds. Every basket arrives before the seudah. What is “Avrumi has the idea to pull the baskets on sleds”?', o:['the turning point','a rising event','the problem','the end'], h:'Is it what goes wrong, what makes it worse, what changes everything, or how it works out?'},
    {q:'Plan: “Dovid’s robot will not turn on before the science fair. He changes the battery, and it works. The end.” What mistake does this plan make?', o:['skips the climb','a flat story','a story mountain'], h:'Is there a problem? Does anything make it harder before it is fixed?'},
    {t:'order', q:'Put this story mountain in order: problem, rising event, turning point, end. Tap the sentences in order.', tiles:['The Crew’s weather balloon floats away the morning of the science fair.','The store has no more balloons, and the fair starts at noon.','Dovid remembers the box of party balloons in his basement.','They tie three together and launch it again just in time.'], extra:['Balloons come in many colors.'], h:'What goes wrong? What makes it harder? What changes? How does it end?'}
  ],
  re:[
    {how:'A new way: a story mountain is like a real hike. Each step up is harder, the top is the turning point, and then it is downhill to the end.', q:'On a story mountain, where is the turning point?', o:['at the top','at the bottom','before the problem']},
    {how:'A simpler step: ask one question about each event. Does it make the problem HARDER? If yes, it is a rising event.', q:'Problem: the Crew is late for the bus. “Dovid cannot find his other shoe.” What is it?', o:['a rising event','the end','the turning point']},
    {how:'The skill underneath: Three-Part Piece (Level 6). A story has a beginning, a middle and an end too. The rising events fill the middle.', q:'Where do the rising events go?', o:['in the middle','at the very end','before the problem']}
  ]},

  'WRIT.PARA.L06.04':{name:'Dialogue + Action',
  teach:[
    {how:'DIALOGUE is what a character says, inside quotation marks. ACTION is what he does: his hands, his feet, his face. Strong stories mix them, so the reader hears AND sees the scene.', q:'“I’ll hold the ladder,” Tzvi Hirsch said, planting his feet on the bottom rung. Which part is the action?', o:['planting his feet on the bottom rung','“I’ll hold the ladder,”','Tzvi Hirsch said']},
    {how:'The mistake is TALKING HEADS: line after line of talk, and no one moves, so the reader cannot see anyone. The fix: add an action that shows how the character feels.', q:'Which line mixes dialogue and action?', o:['“We lost,” Binyamin said, slowly putting the pieces back in the box.','“We lost,” Binyamin said.','Binyamin said that they lost.']},
    {how:'Punctuate it right. The spoken words go inside quotation marks. If “he said” comes next, put a comma inside the quotation mark, not a period inside the quotation mark. A question mark goes inside too: “Is it ready?” Avrumi asked. An exclamation mark goes inside too: “Wait!” Dovid called. A new speaker starts a new line.', q:'Which line is punctuated correctly?', o:['“Pass the glue,” Dovid said.','“Pass the glue.” Dovid said.','“Pass the glue” Dovid said.']}
  ],
  practice:[
    {t:'sort', q:'The Crew starts a race on Glen Avenue. Sort each part: dialogue or action?', bins:[{id:'D',label:'💬 Dialogue'},{id:'A',label:'🏃 Action'}],
      items:[{label:'“It’s my turn to start!”',bin:'D'},{label:'Avrumi pushed up his glasses',bin:'A'},{label:'“Ready, set, go!”',bin:'D'},{label:'Yehuda tucked his notebook in his pocket',bin:'A'}],
      h:'Dialogue is the words someone says, in quotation marks. Action is what someone does.'},
    {t:'spotall', q:'Tap every line that mixes dialogue AND action.', cells:[{label:'“Got it!” Dovid yelled, catching the ball.',ok:true},{label:'Tzvi Hirsch wiped flour off his hands. “Who wants a hot roll?”',ok:true},{label:'“Hi,” he said.',ok:false},{label:'“Let’s go,” said Yehuda.',ok:false},{label:'Binyamin moved his knight.',ok:false}],
      h:'Look for BOTH: words in quotation marks, and something the character does.'},
    {t:'pairs', q:'Each line is talking heads. Match it to the action that shows how he feels.', pairs:[['“I’m not scared,” Tzvi Hirsch said,','gripping the rail until his knuckles turned white.'],['“We won!” Dovid shouted,','jumping off the stage.'],['“I’m sorry,” Binyamin said,','looking down at his shoes.']],
      h:'Read the words. How does he feel? Which action shows that feeling?'},
    {t:'sort', q:'Sort each line: written correctly, or a mistake?', bins:[{id:'C',label:'✅ Written correctly'},{id:'M',label:'❌ Mistake'}],
      items:[{label:'“Pass the challah,” Abba said.',bin:'C'},{label:'“Pass the challah” Abba said.',bin:'M'},{label:'“Is it ready?” Avrumi asked.',bin:'C'},{label:'“Pass the salt.” Yehuda said.',bin:'M'},{label:'“Ready?” Dovid asked. “Ready!” Avrumi said.',bin:'M'}],
      h:'Before “Abba said”, the spoken words end with a comma, a question mark or an exclamation mark, inside the quotation mark. A new speaker starts a new line.'},
    {t:'order', q:'Build a line with dialogue and action. Tap the parts in order.', tiles:['“Watch this,”','Dovid said,','flipping the switch.'], extra:['“Watch this.”'],
      h:'Spoken words first, with a comma inside. Then who said it. Then what he did.'},
    {t:'spotall', q:'“I can’t find it anywhere,” Yehuda said. Tap every action that shows he is worried.', cells:[{label:'flipping his notebook pages faster and faster',ok:true},{label:'biting his lip',ok:true},{label:'smiling and stretching',ok:false},{label:'yawning',ok:false}],
      h:'Which actions would a worried boy really do?'},
    {t:'write', q:'Your turn to write. The Crew is setting up the sukkah, and the roof keeps sliding off. Write three lines of dialogue. Give each line an action too.', min:0, checks:['💬 Each line has words in quotation marks.','🏃 Each line has an action that shows a feeling.','✏️ My commas go inside the quotation marks.'], h:'Picture the boys. Who is on the ladder? Who is holding the boards? What are their faces doing?'}
  ],
  check:[
    {q:'Line: “Look at this,” Avrumi whispered, spreading the map across the table. What is “spreading the map across the table”?', o:['action','dialogue','talking heads'], h:'Is it what he says, or what he does?'},
    {q:'Line: “Close the window” Abba said. What does this line need?', o:['a comma inside the quotation mark','a period inside the quotation mark','a question mark'], h:'“Abba said” comes next. What goes at the end of the spoken words?'},
    {t:'order', q:'Build a line with dialogue and action. Tap the parts in order.', tiles:['“Careful,”','Rabbi Feldman said,','lifting the old sefer','with both hands.'], h:'Spoken words first. Then who said it. Then what he did.'}
  ],
  re:[
    {how:'A new way: dialogue is the sound, and action is the picture. A story with only dialogue is like a phone call. Add the picture.', q:'A story with only dialogue is like…', o:['a phone call','a movie','a photo']},
    {how:'A simpler step: after each line someone says, ask, “What are his hands doing?” Write that.', q:'“Done!” Tzvi Hirsch said. Which action can you add?', o:['slapping the last box shut','said loudly','“Done!”']},
    {how:'The skill underneath: Talking Characters (Level 5). Dialogue shows what a character thinks.', q:'Which one is dialogue?', o:['“I think we can fix it.”','He walked in.','It was raining.']}
  ]},

  'WRIT.PARA.L06.05':{name:'Slow Motion',
  teach:[
    {how:'Writers control TIME. SLOW DOWN the big moment: tell it second by second, with small actions, sounds and thoughts. SPEED UP the boring part: one quick sentence, then move on.', q:'Dovid’s story is about the moment his robot must climb the ramp at the science fair. Which part should he slow down?', o:['the big moment','the bus ride to the fair','eating lunch']},
    {how:'To slow down, zoom in. Not “The robot made it,” but each tiny step: the wheels spin, one slips, Dovid holds his breath, the robot tips over the top. To speed up, sum it up: “After a long bus ride, we got to the fair.”', q:'Which sentence speeds up the boring part?', o:['After a long bus ride, we got to the fair.','The wheels spun. One slipped. Dovid held his breath.','The judge leaned closer to the ramp.']},
    {how:'Two mistakes. RUSHING THE BIG MOMENT: the best part in one quick line. DRAGGING THE BORING PART: every step of tying your shoes. Either way, the reader gets bored or misses the best part.', q:'“Tzvi Hirsch caught the last ball, and we won.” This is the biggest moment of the story. What is wrong?', o:['rushing the big moment','dragging the boring part','nothing, it is fine']}
  ],
  practice:[
    {t:'sort', q:'Dovid’s story: his robot at the science fair. Should he slow down or speed up each part?', bins:[{id:'S',label:'🐢 Slow down'},{id:'U',label:'⏩ Speed up'}],
      items:[{label:'the robot climbing the steep ramp',bin:'S'},{label:'the bus ride to the fair',bin:'U'},{label:'the robot’s wheels gripping the ramp',bin:'S'},{label:'waiting in line for lunch',bin:'U'}],
      h:'Slow down the part the reader is waiting for. Speed past the parts where nothing much happens.'},
    {t:'pairs', q:'Match each rushed line to its slow-motion version.', pairs:[['He caught the ball.','The ball flew toward him. He stretched. His fingers closed around it.'],['The robot made it.','The wheels spun. One slipped. Then it tipped over the top.'],['The shofar blew.','The shul went silent. The baal tokeia lifted the shofar. A long blast filled the room.']],
      h:'Which slow-motion version tells the SAME moment, second by second?'},
    {t:'spotall', q:'Tap every sentence that SPEEDS UP time.', cells:[{label:'Two hours later, we got home.',ok:true},{label:'The rest of the week went by fast.',ok:true},{label:'Nothing much happened until Thursday.',ok:true},{label:'His hand shook as he reached for the door.',ok:false},{label:'One wheel slipped. Dovid held his breath.',ok:false}],
      h:'Speeding up skips over time in one sentence. Slowing down stays on one second.'},
    {t:'order', q:'Tzvi Hirsch’s big moment, in slow motion. Tap the sentences in order.', tiles:['Tzvi Hirsch opened the oven door.','Heat rushed onto his face.','He reached in with the big wooden paddle.','He slid out the first golden challah.'], extra:['The bakery is on the corner.'],
      h:'Tell it second by second: what happens first, then next, then next.'},
    {t:'sort', q:'Sort each piece of a story: slow motion, rushing, or dragging?', bins:[{id:'G',label:'🎬 Slow motion'},{id:'R',label:'💨 Mistake: rushing the big moment'},{id:'D',label:'🐌 Mistake: dragging the boring part'}],
      items:[{label:'The shul went still. The baal tokeia raised the shofar. A long blast rang out.',bin:'G'},{label:'The last answer was right, and he won the whole contest.',bin:'R'},{label:'I put on my left sock. Then my right sock. Then my left shoe. Then my right shoe.',bin:'D'},{label:'Yehuda opened the box, and the lost key was inside.',bin:'R'}],
      h:'Is it the big moment told slowly, the big moment rushed, or a boring part dragged out?'},
    {t:'spotall', q:'Avrumi’s big moment: he walks up to get the siyum award. Tap every detail that SLOWS it down.', cells:[{label:'His legs felt like jelly.',ok:true},{label:'Every eye in the room followed him.',ok:true},{label:'He heard his own footsteps on the stage.',ok:true},{label:'Later we had cake.',ok:false},{label:'The next day was Sunday.',ok:false}],
      h:'Slow-motion details stay inside that one moment: what he feels, sees and hears.'},
    {t:'write', q:'Your turn to write. Think of a big moment: a last chess move, catching a ball, opening a gift. First speed past the trip there in ONE sentence. Then slow the big moment down in three or four short sentences.', min:0, checks:['⏩ The boring part is one quick sentence.','🐢 The big moment has three or more sentences.','👂 I used a small action, a sound or a thought.'], h:'Close your eyes and play the moment like a video, one second at a time. What do you see, hear and think?'}
  ],
  check:[
    {q:'Binyamin’s story has three parts: the walk to the chess club, the setup at the table, and the last move of the final game. What should he do with the walk and the setup at the table?', o:['speed up','slow down','nothing, it is fine'], h:'Which part is the reader waiting for? What about the other two?'},
    {q:'Story: the Crew drives to the lake. Avrumi writes ten sentences about the car ride: the seat belts, the snacks, every red light. What is the mistake?', o:['dragging the boring part','rushing the big moment','nothing, it is fine'], h:'Is the car ride the big moment, or a boring part?'},
    {t:'order', q:'Binyamin’s last chess move, in slow motion. Tap the sentences in order.', tiles:['Binyamin picked up his queen.','He slid it slowly across the board.','He set it down on the last square.','Zeidy smiled and tipped over his king.'], h:'Tell it second by second: pick it up, move it, put it down, then what happens.'}
  ],
  re:[
    {how:'A new way: think of a replay of the best moment in a ball game. They show it in slow motion, but they never replay the walk to the field.', q:'In a replay, which part goes in slow motion?', o:['the big moment','the walk to the field','the drive home']},
    {how:'A simpler step: find the ONE most exciting second. Give it three sentences. Give everything else one.', q:'How many sentences for a boring part?', o:['one','three','ten']},
    {how:'The skill underneath: Hook the Reader (Level 6). A scene hook shows one moment. Slow motion stretches that moment out.', q:'“The quill scratched slowly across the parchment.” What kind of hook is it?', o:['a scene hook','a fact hook','a question hook']}
  ]},

  'WRIT.PARA.L06.06':{name:'Time Jumps',
  teach:[
    {how:'Stories jump through time. A TIME-JUMP PHRASE is a few words that move the clock: “That evening,” “The next morning,” “Three days later,”. When it starts the sentence, put a comma after it.', q:'Which is a time-jump phrase?', o:['The next morning,','and then','he ran']},
    {how:'A TIME-JUMP CLAUSE moves the clock too, but it has its own who-or-what AND a doing word inside it: “After we left the shul,” “By the time we got home,” “As soon as Shabbos ended,”. And “Meanwhile,” jumps to another place at the same time.', q:'Which is a time-jump clause?', o:['By the time we got home,','That evening,','Three days later,']},
    {how:'The mistake is AND THEN, AND THEN: “and then” is not a time jump, because every event starts the same way, so the reader cannot tell if a minute or a week went by. Another mistake is jumping with no time words at all, so the reader gets lost.', q:'Which sentence tells the reader how much time passed?', o:['Two days later, the package came.','And then the package came.','The package came.']}
  ],
  practice:[
    {t:'sort', q:'Sort each time jump: a time-jump phrase, or a time-jump clause (it has a who-or-what and a doing word)?', bins:[{id:'P',label:'🕐 Time-jump phrase'},{id:'C',label:'🕰️ Time-jump clause'}],
      items:[{label:'Later that night,',bin:'P'},{label:'When Zeidy came home,',bin:'C'},{label:'The week after Pesach,',bin:'P'},{label:'Once the snow stopped,',bin:'C'},{label:'By the time the soup was hot,',bin:'C'},{label:'Early Friday morning,',bin:'P'}],
      h:'Look for a who-or-what and a doing word, like “Zeidy came”. If it has both, it is a clause.'},
    {t:'pairs', q:'Match each amount of time to the time jump that fits it.', pairs:[['a few minutes','Moments later,'],['one night','The next morning,'],['a whole year','By the next Sukkos,']],
      h:'How much time goes by? Which words say that much time?'},
    {t:'spotall', q:'Tzvi Hirsch’s story. Tap every time jump.', cells:[{label:'That Friday,',ok:true},{label:'As the sun set,',ok:true},{label:'Meanwhile,',ok:true},{label:'the bakery',ok:false},{label:'very hot',ok:false}],
      h:'A time jump tells WHEN, or moves to another place at the same time.'},
    {t:'order', q:'Put Binyamin’s week in order. Tap the sentences in order.', tiles:['On Sunday, Binyamin signed up for the chess tournament.','Every night that week, he practiced with Zeidy.','By the time Thursday came, he knew every trap.','On Friday morning, he walked into the tournament hall.'], extra:['Chess has 32 pieces.'],
      h:'Follow the time jumps: Sunday, then that week, then Thursday, then Friday.'},
    {t:'sort', q:'Sort each one: a clear time jump, or the “and then” mistake?', bins:[{id:'C',label:'⏳ Clear time jump'},{id:'M',label:'❌ Mistake: and then, and then'}],
      items:[{label:'And then we ate. And then we played.',bin:'M'},{label:'After supper, we played a board game.',bin:'C'},{label:'And then it was Shabbos.',bin:'M'},{label:'Two hours later, the guests arrived.',bin:'C'}],
      h:'Does it tell the reader how much time passed, or just say “and then”?'},
    {t:'spotall', q:'Tap every time jump that is a CLAUSE (it has a who-or-what and a doing word).', cells:[{label:'After Abba made havdalah,',ok:true},{label:'While the cholent cooked,',ok:true},{label:'Before we left for shul,',ok:true},{label:'That evening,',ok:false},{label:'Three days later,',ok:false}],
      h:'Find the who-or-what and the doing word: “Abba made”, “the cholent cooked”.'},
    {t:'write', q:'Your turn to write. Tell about one Erev Shabbos, from morning to candle lighting, in four sentences. Start each sentence with a different time jump. Use at least one clause.', min:0, checks:['⏳ Each sentence starts with a time jump.','🕰️ At least one is a clause (a who-or-what and a doing word).','🚫 I never wrote “and then”.'], h:'Morning, noon, afternoon, candle lighting. What happened at each time? How much time passed?'}
  ],
  check:[
    {q:'Sentence: “As soon as the bell rang, the boys ran out to the yard.” What is “As soon as the bell rang,”?', o:['a time-jump clause','a time-jump phrase','not a time jump'], h:'Is there a who-or-what and a doing word inside it?'},
    {q:'Yehuda is at home, searching for his notebook. The next sentence tells what Avrumi is doing at the same time, at the bakery. Which time jump starts it?', o:['Meanwhile,','The next morning,','Three days later,'], h:'Same time, another place. Which words say that?'},
    {t:'order', q:'Put the chesed fair story in order. Tap the sentences in order.', tiles:['On Sunday, the Crew planned a chesed fair.','By Wednesday, they had collected forty games.','On Thursday morning, the doors opened.','By the time it ended, every game was on its way to the hospital.'], h:'Follow the time jumps: which day comes first?'}
  ],
  re:[
    {how:'A new way: a time jump is a door in the story. The reader steps through it into a new time.', q:'“The next morning,” is like…', o:['a door to a new time','the end of the story','a character']},
    {how:'A simpler step: ask how much time passed. Minutes? A night? A year? Then pick the words that say it.', q:'A whole night passed. Which time jump fits?', o:['The next morning,','Moments later,','A year later,']},
    {how:'The skill underneath: Summary Paragraph (Level 6). A summary tells the key events in order.', q:'A summary tells the key events…', o:['in order','in any order','with your opinion']}
  ]},

  'WRIT.PARA.L06.07':{name:'Picture Words',
  teach:[
    {how:'A VAGUE WORD makes a blurry picture: thing, stuff, nice, good, went, got. A PICTURE WORD is exact, so the reader sees just what you mean: not “food” but “Savta’s spicy fish”, not “went” but “tiptoed”. Swap vague words for picture words.', q:'Which is a picture word?', o:['tiptoed','went','moved']},
    {how:'Use an exact NOUN (a thing you can point to) and an exact VERB (how it is done). A weak verb plus an adverb is often ONE exact verb: “walked quietly” is “tiptoed”, “ate quickly” is “gobbled”. Each verb for moving paints its own picture: tiptoed, shuffled (slow, dragging steps), marched, sprinted. Then add a sense detail: a sound, a smell, a taste or a feel. Sense details put the reader right there. “The bread was good” becomes “The warm challah crackled when Abba tore it.”', q:'Which sentence uses picture words?', o:['The warm challah crackled when Abba tore it.','The bread was good.','The food was really nice.']},
    {how:'The mistake is PILING ON: “a very very big nice cake.” Many vague words still make a blurry picture. One exact word beats them all: “a three-layer honey cake.” And THE WORD MUST FIT: a little sukkah for four boys is not “gigantic”; it is “cozy”.', q:'Which one is piling on?', o:['a very very big nice cake','a three-layer honey cake','a cake']}
  ],
  practice:[
    {t:'sort', q:'Sort each word: vague words, or picture words?', bins:[{id:'V',label:'🌫️ Vague word'},{id:'P',label:'🖼️ Picture word'}],
      items:[{label:'stuff',bin:'V'},{label:'crunchy',bin:'P'},{label:'nice',bin:'V'},{label:'sprinted',bin:'P'},{label:'thing',bin:'V'},{label:'esrog',bin:'P'}],
      h:'Can you see exactly what the word means? Then it is a picture word.'},
