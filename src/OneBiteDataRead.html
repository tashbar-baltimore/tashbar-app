(function(){

      odd:'w', mix:'wvwmwvnw', bins:['v','z']}

  for(var gi=1;gi<G.length;gi++){ var pg=G[gi-1], p0=pg.ls.charAt(1), p1=pg.ls.charAt(pg.ls.length-1);

                 {q:'Which small letter matches big '+L[p1][0]+'?', o:[p1].concat(pg.near[p1]), a:p1}]; }

  G.forEach(function(g,gi){
    var id=g.id, ls=g.ls.split(''), last=ls[ls.length-1], first=ls[0];

    var caseP=ls.slice(-4).map(function(x){ return [L[x][0], x]; });

    extra.forEach(function(e){ sortItems.push({label:e[0], bin:e[1]}); });

        {how:'Every letter has a name, a sound and a shape. '+says(first), q:'This is '+aWord(first)+'. Which letter makes its first sound?', pic:L[first][3], o:[first].concat(g.near[first])},

          {q:'Which small letter matches big '+L[last][0]+'?', steps:[L[last][5], L[last][6], 'Same name, '+L[last][0]+' and '+last+'.'], a:last}],

    var nx=ls[ls.length-2];
    dq['This is '+aWord(nx)+'. Which letter makes its first sound? || '+L[nx][3]]='Say it slowly: '+L[nx][2]+'.\nListen to the very first sound.\nWhich letter makes that sound? Tap it.';
    dq['Put the letters in ABC order.']='Sing the ABC song slowly.\nWhich letter comes first? Tap it.\nKeep going until all are in a row.';
    DO[id]=DO[id]||{ s:'Say the letter name.\nSay its sound: '+L[first][4]+'.\nLook at its shape, then tap.', q:dq };

    /* ---- the ONE BITE ---- */
    var steps=ls.map(function(x){ return {t:L[x][0]+' says '+L[x][4]+' '+L[x][3]+'. '+L[x][5], m:{type:'tiles', w:[L[x][0]+x, L[x][3]], hi:[0]}}; });
    steps.push({t:'Sing it with me! Clap on each letter.', m:{type:'chant', lines:g.chant}});

      'do':[
        {type:'listen', say:'Listen: '+L[first][2]+'. Which letter starts it?', hear:L[first][2], pic:L[first][3], o:o3(first), a:first},
        {type:'trace', say:'Trace big '+L[traceAt][0]+' with your finger.', how:L[traceAt][5], glyph:L[traceAt][0], name:'big '+L[traceAt][0]}

      your:[
