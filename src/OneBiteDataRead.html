    dq['Which small letter matches this big letter? || '+L[last][0]]='Say the name of the big letter: '+L[last][0]+'.\n'+L[last][6]+'\nFind the small letter with that shape. Tap it.';
    var nx=ls[ls.length-2];
    dq['This is '+aWord(nx)+'. Which letter makes its first sound? || '+L[nx][3]]='Say it slowly: '+L[nx][2]+'.\nListen to the very first sound.\nWhich letter makes that sound? Tap it.';
    dq['Put the letters in ABC order.']='Sing the ABC song slowly.\nWhich letter comes first? Tap it.\nKeep going until all are in a row.';
    DO[id]=DO[id]||{ s:'Say the letter name.\nSay its sound: '+L[first][4]+'.\nLook at its shape, then tap.', q:dq };

    /* ---- the ONE BITE ---- */
    /* Spoken lines never use a lone letter for its sound (a computer voice reads b as bee).
       Consonants get a sound spelling (buh, mmm); vowels are heard in their keyword. */
    var chant=chantOf(ls);
    var steps=ls.map(function(x){ return {t:L[x][0]+' is for '+L[x][2]+' '+L[x][3]+'. '+L[x][5], m:{type:'tiles', w:[L[x][0]+x, L[x][3]], hi:[0]}}; });
    if(steps.length>4){ var z=ls[ls.length-1]; steps[steps.length-1]={t:L[z][0]+' is for '+L[z][2]+' '+L[z][3]+'. Now sing them all and clap!', m:{type:'chant', lines:chant}}; }
    else steps.push({t:'Sing it with me! Clap on each letter.', m:{type:'chant', lines:chant}});
    var o3=function(x){ return [x].concat(g.near[x]); };
    var big=ls[1], lw=g.lw, mp=g.mp.split('');
    B[id]={ band:'K1', pic:g.pic, today:'Meet the letters '+nameLine.replace(/, ([A-Z])$/,' and $1'),
      why:'Letters build every word. Soon you will read them all!',
      ready:g.ready, bridge:g.bridge, bridgeName:g.bridgeName,
      watch:{ q:'Letters '+nameLine, pic:g.pic, steps:steps, a:ls.map(function(x){ return L[x][0]+x+' '+L[x][3]; }).join('  ') },
      oops:g.oops,
      ways:['song','picture','listen and tap','find them all','match','finger trace','letter tiles','Mistake Detective'],
      done:'You know '+nameLine.replace(/, ([A-Z])$/,' and $1')+'! Sing them at home tonight!',
      'do':[
        {type:'listen', q:L[first][3]+' '+L[first][2], hear:L[first][2], o:o3(first), a:first, say:'Listen: '+L[first][2]+'. Which letter makes its first sound?', how:'Say '+L[first][2]+' slowly. Hear the first sound. Tap that letter.'},
        {type:'trace', glyph:L[big][0], name:'big '+L[big][0], say:'Trace big '+L[big][0]+' with your finger. Start at the top.', how:L[big][5]+' Stay on the dots.'}
      ],
      your:[
        {type:'findall', grid:g.mix.split(''), find:g.odd, findSay:'small '+g.odd, say:'Tap every small '+g.odd+'. Find them all!', how:L[g.odd][6]+' Look at each one. Tap only that shape.'},
        {type:'match', pairs:ls.slice(-3).map(function(x){ return [L[x][0], x]; }), say:'Match each big letter to its small letter.', how:'Say the big letter name. Find the small letter with that name.'},
        {type:'listen', hear:lw[1], o:o3(lw[0]), a:lw[0], say:'Listen to the word. Which letter makes its first sound?', how:'Say the word slowly. Hear the first sound. Tap that letter.'},
        {type:'tiles', w:ls.slice(-3), say:'Put the letters in ABC order.', how:'Sing the ABC song slowly. Tap the first letter, then the next.'},
        {type:'match', pairs:mp.map(function(x){ return [x, L[x][3]]; }), say:'Match each letter to its picture.', how:'Say the picture word slowly. Hear the first sound. Find that letter.'}
      ],
      board:{ one:'Name, sound, shape: '+ls.map(function(x){ return x.toUpperCase()+' says '+L[x][4].split(',')[0]; }).join('; ')+'.',
        activity:'Letter cards on the floor. Call a sound; boys hop to its letter and say a word.',
        mistakes:[g.oops.wrong+' for '+g.oops.right, 'Saying the letter name when asked for its sound', 'Mixing up the big and small letter'] } };
  });
  /* A boy who already mastered the old Letter Lineup keeps his place: .a to .f count as mastered for him (QuestPage mastered). */
  try{ if(typeof mastered==='function'&&mastered.length===2&&!mastered.abcSplit){ var m0=mastered, m1=function(st,id){ if(m0(st,id)) return true;
    return /^READ\.PHON\.L01\.01\.[a-f]$/.test(String(id))&&m0(st,'READ.PHON.L01.01'); }; m1.abcSplit=1; window.mastered=m1; } }catch(e){}
})();
})(window.ONE_BITE);
