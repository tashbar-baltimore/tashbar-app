  'WRIT.RES.L08.01':{name:'Follow-Up Questions',
  teach:[
    {how:'In Grade 6 you narrowed a big topic to one question. The Beacon’s Rosh Hashanah report asks: “How do bees make honey?” Akiva finds a first answer in the book The Busy Hive: “Bees bring nectar home and dry it in the hive until it becomes honey.” A good researcher does not stop there. Find the NEW WORD, a word in the answer you cannot explain yet: “dry.” Ask HOW or WHY about it: “How do bees dry the nectar?” That is a SHARPER QUESTION. It grows out of the answer and digs one step deeper.', q:'Answer: “A bee carries nectar home in a special honey stomach.” Which is a sharper question?', o:['What happens to the nectar inside the honey stomach?','Does a bee carry nectar home?','What is the biggest zoo in America?']},
    {how:'Each answer opens the next question, like a chain. “How do bees make honey?” They dry nectar in the hive. “How do they dry it?” They fan their wings until the nectar is dry and thick. “Why must it be dry?” Dry honey does not spoil, so it lasts all winter. Each link is sharper than the one before, and every link still helps answer the report’s question. When the next question would not help the report, stop and write. A follow-up question may be small, even one fact. That is fine: it is a step inside your report question, not a new report question.', q:'Where does a sharper question come from?', o:['a word in the last answer','a brand-new topic','the same question again']},
    {how:'Two mistakes. ALREADY ANSWERED: the question asks what the answer just said. Answer: “Bees fan their wings over the cells.” Question: “Do bees fan their wings?” Nothing new. OFF THE TRACK: the question may be interesting, but it leaves the report’s question: “Why do bees sting?” A SHARPER QUESTION grows from a word in the answer and stays on the report’s question.', q:'Answer: “House bees fan their wings over the cells.” Yoni asks, “Why do bees sting people?” Which is it: sharper question, already answered, or off the track?', o:['off the track','already answered','sharper question']}
  ],

  'WRIT.RES.L08.02':{name:'Search Smart',
  teach:[
    {how:'Before you search, choose your SEARCH WORDS. Take the key words from your question and drop the little ones. “How do bees dry the nectar?” becomes: bees dry nectar. Then add one exact word: honey bees dry nectar wings. These are SHARP SEARCH WORDS. One general word, like “honey,” is TOO WIDE: you get recipes, shops and cakes.', q:'Eli’s question: “How do bees dry the nectar?” Which are sharp search words?', o:['honey bees dry nectar wings','honey','please tell me all about bees']},
    {how:'Watch for words with TWO MEANINGS. “Bee” can be an insect or a spelling bee. “Comb” can be a honeycomb or a hair comb. “Cell” can be a hive cell or a phone. If a word has two meanings, add a word that pins the right one: honey bee, honeycomb, hive cell. Often your other key words already pin it: in “bees dry nectar,” the word nectar shows you mean honey bees. If the results still go wrong, add a pinning word.', q:'Yoni typed “bee winners” and got a list of spelling contest champions. What went wrong?', o:['two meanings','too wide','sharp search words']},
    {how:'Now choose which result to open. Do not just tap the top one. Read each result card. The TITLE and preview: is it about my question? The SITE: who made it, a museum, a university, a shop? The DATE: is it new enough? (How bees make honey has not changed, so an older page is fine. This year’s honey prices would need this year.) Check for “Sponsored” first: a card marked Sponsored is AN AD, even when it is about bees. Skip it. A honey cake recipe is OFF MY QUESTION. A card about your question, made by someone who knows: OPEN IT.', q:'Results for “honey bees dry nectar.” Which should Akiva open first?', o:['“From Flower to Honey,” Harborview Science Museum: how bees turn nectar into honey','Sponsored: Golden Spoon Honey Shop, 20% off all jars','“Honey Cake for Rosh Hashanah,” a recipe page']}
  ],

      h:'Could the word mean something that is not about bees?'},
    {t:'sort', q:'Sneaky results! Akiva searched “honey bees dry nectar.” Sort each result card.', bins:[{id:'O',label:'✅ Open it'},{id:'A',label:'⚠️ Skip: an ad'},{id:'F',label:'⚠️ Skip: off my question'}],
      items:[{label:'“From Flower to Honey,” Harborview Science Museum, 2024: how bees fan their wings to dry nectar',bin:'O'},{label:'Sponsored: Golden Spoon Honey Shop. Buy raw honey today!',bin:'A'},{label:'“Honey Cake for Rosh Hashanah,” a recipe page',bin:'F'},{label:'“How a Hive Makes Honey,” Green Valley University Bee Lab',bin:'O'},{label:'Sponsored: Buzz Brand beehive kits, free shipping',bin:'A'},{label:'“Honey Bee Craft Ideas,” a crafts page',bin:'F'}],
      h:'First: is it marked Sponsored? Then it is an ad. If not: is it about how bees make honey, and who made it?'},
    {t:'order', q:'Build the steps of a smart search. Tap them in order.', tiles:['Write your question.','Pick its key words.','Read each result card.','Open the best result.'], extra:['Tap the top result.'],
      h:'Words first, then read the cards, then open one. The top result is not always the best.'},
    {t:'spotall', q:'Gavriel’s question: “Why do leaves change color in the fall?” Tap every result card he should OPEN.', cells:[{label:'“Why Leaves Change Color,” Green Valley University, 2019',ok:true},{label:'“Fall Colors Explained,” Harborview Science Museum',ok:true},{label:'“Color Change in Leaves,” a science magazine for kids, 2022',ok:true},{label:'Sponsored: leaf blowers, half price',ok:false},{label:'“Best Fall Hikes Near Baltimore,” a travel page',ok:false}],

    {q:'Yoni’s question: “How do bees make wax?” One result card: “Sponsored: Bright Candle Company. Beeswax candles, buy two, get one free.” Is it open it, an ad, or off my question?', o:['an ad','open it','off my question'], h:'Check for Sponsored first. A Sponsored card is an ad, even if it is about bees.'},
    {t:'order', q:'Build Gavriel’s smart search. Tap the steps in order.', tiles:['Gavriel writes his question.','He picks its key words.','He reads each result card.','He opens the best one.'], extra:['He opens the top one.'], h:'Words first, then read the cards, then open one.'}

    {how:'The skill underneath: Check the Source (Grade 7). Once a source is open, you check who wrote it, when, and whether a second source agrees. Search Smart comes before that, and goes further back: you choose the words that find good sources, and you choose which result is worth opening from its card alone.', q:'Check the Source asks who wrote it, when, and…', o:['does a second source agree','is it on top','is it long']}
  ]},

  'WRIT.RES.L08.03':{name:'No Copying',
  teach:[
    {how:'In Grade 5 you said a fact in your own words, and in Grade 6 you chose when to quote and when to paraphrase. Now watch for a trap: PATCHWRITING. It looks like your own words, but it is still copying. The museum page says: “Inside the hive, house bees fan their wings over the cells, and the moving air dries the nectar into thick honey.” A WORD SWAP keeps MOST of his words and changes only a few: “Inside the hive, house bees flap their wings over the cells, and the moving breeze dries the nectar into thick honey.” Most of the words are still his.', q:'Which note is a word swap of the museum sentence?', o:['Inside the hive, house bees flap their wings over the cells, and the moving breeze dries the nectar into thick honey.','Nectar turns into honey by drying. In the hive, the bees dry it with a breeze from their own wings.','“The moving air dries the nectar,” says the museum page.']},
    {how:'SAME SHAPE is sneakier. MOST of the words are changed (little words like “the” and topic words like “nectar” may stay), but the sentence still marches in his order, piece by piece: “Within the nest, worker insects flap above the openings, and the rushing breeze thickens the sweet juice into heavy syrup.” You copied his thinking in new clothes. Word swap and same shape are both patchwriting. OWN WORDS means new words AND your own shape: “Nectar turns into honey by drying. In the hive, the bees dry it with a breeze from their own wings.”', q:'Which note is in own words?', o:['Nectar turns into honey by drying. In the hive, the bees dry it with a breeze from their own wings.','Within the nest, worker insects flap above the openings, and the rushing breeze thickens the sweet juice into heavy syrup.','Inside the hive, house bees fan their wings over the cells, and the moving air dries the nectar.']},
    {how:'The fix has four steps. READ the passage until you understand it. COVER it. WRITE what you remember, the way you would tell a friend. Then uncover it and CHECK: Is the meaning the same? Is the shape mine? Are three or more of his words in a row? Topic words like “nectar” or “honey stomach” may stay. If his exact words really matter, put them in quotation marks and credit him. A writer who looks at the source while he writes, changing one word at a time, almost always ends up patchwriting.', q:'Benny writes his note while looking at the source, changing one word at a time. What will he most likely get?', o:['patchwriting','own words','a quote']}
  ],
  practice:[
    {t:'sort', q:'Source, The Busy Hive: “A worker bee sucks nectar from a flower and carries it home in a special honey stomach.” Sort each note.', bins:[{id:'O',label:'✍️ Own words'},{id:'P',label:'🧩 Patchwriting'}],
      items:[{label:'A worker bee sips nectar from a blossom and carries it home in a special honey stomach.',bin:'P'},{label:'Flower nectar rides home inside the bee, in a pouch just for honey-making.',bin:'O'},{label:'A working bee drinks juice from a bloom and brings it back in a particular nectar belly.',bin:'P'},{label:'To carry nectar, a bee stores it inside its body, in its honey stomach.',bin:'O'},{label:'A worker bee sucks nectar from a flower and takes it home in its honey stomach.',bin:'P'}],
      h:'Is it his sentence with a few words changed? Is it his order with new words? Then it is patchwriting.'},
    {t:'pairs', q:'Match each kind of note to what is true of it.', pairs:[['word swap','his sentence, a few words changed'],['same shape','new words, his order piece by piece'],['own words','new words and your own shape']],
      h:'How many of his words are left? Whose order is it?'},
    {t:'spotall', q:'Source, the museum page: “Inside the hive, house bees fan their wings over the cells, and the moving air dries the nectar into thick honey.” Tap every PATCHWRITE.', cells:[{label:'Inside the hive, house bees flap their wings over the cells, and the moving breeze dries the nectar into thick honey.',ok:true},{label:'Within the nest, worker insects flap above the openings, and the rushing breeze thickens the sweet juice into heavy syrup.',ok:true},{label:'Inside the hive, house bees fan their wings, and the air dries the nectar into honey.',ok:true},{label:'Nectar turns into honey by drying. In the hive, the bees dry it with a breeze from their own wings.',ok:false}],
      h:'Read the source, then each note. Is it his sentence or his order?'},
    {t:'sort', q:'Sneaky notes! Source, the Young Naturalist article: “When the honey is dry enough, the bees seal each cell with a thin cap of wax.” Sort each note.', bins:[{id:'G',label:'✅ Own words'},{id:'W',label:'⚠️ Mistake: word swap'},{id:'S',label:'⚠️ Mistake: same shape'}],
      items:[{label:'When the honey is dry enough, the bees close each cell with a thin lid of wax.',bin:'W'},{label:'Once the syrup is thick, the insects shut every hole with a slim cover of beeswax.',bin:'S'},{label:'The bees put a wax lid on each cell, but only after the honey has dried.',bin:'G'},{label:'When the honey is dry, the bees seal the cell with a cap of wax.',bin:'W'},{label:'As soon as the liquid has thickened, the workers cover all chambers with a narrow lid of wax.',bin:'S'},{label:'A thin wax lid means the honey inside is done drying.',bin:'G'}],
      h:'Many of his words left: word swap. New words in his order: same shape. New words and a new shape: own words.'},
    {t:'order', q:'Build the fix for patchwriting. Tap the steps in order.', tiles:['Read until you understand it.','Cover the source.','Write it from memory.','Uncover it and check.'], extra:['Change a few words.'],
      h:'Understand it, hide it, write it, then compare. Changing a few words is not a step.'},
    {t:'spotall', q:'Source, The Busy Hive: “Bees store honey in the hive so they have food to eat in the cold winter.” Tap every note in OWN WORDS.', cells:[{label:'Honey is the hive’s food supply for winter.',ok:true},{label:'In the cold months, the bees live on the honey they saved.',ok:true},{label:'Bees keep honey in the hive so they have food to eat in the cold winter.',ok:false},{label:'Insects save syrup in the nest so they possess meals to consume in the chilly season.',ok:false}],
      h:'New words AND a new shape, with the same meaning?'},
    {t:'write', q:'Your turn to write. Read the museum sentence twice: “Inside the hive, house bees fan their wings over the cells, and the moving air dries the nectar into thick honey.” Cover it. Write it from memory in your own words. Then uncover it and check.', min:0, checks:['🙈 I wrote with the source covered.','🔀 My note has my own shape, not his order.','🔍 I checked: same meaning, and no three of his words in a row (or I used quotation marks).'], h:'Say it out loud to yourself as if you were telling a friend. Then write what you said.'}
  ],
  check:[
    {q:'Gavriel’s source, a museum page: “In autumn, trees stop making the green coloring, so the yellow and orange hidden in the leaf can finally show.” His note: “In fall, trees quit making the green color, so the yellow and orange hidden in the leaf can at last appear.” Is it own words, word swap, or same shape?', o:['word swap','same shape','own words'], h:'How many of the source’s words are still there?'},
    {q:'Same source. Eli’s note: “Leaves hide their warm colors under the green. When fall comes and the green fades, those colors show through.” Is it own words, word swap, or same shape?', o:['own words','word swap','same shape'], h:'Are the words new? Is the order his or Eli’s own?'},
    {t:'order', q:'Build Gavriel’s fix. Tap the steps in order.', tiles:['Gavriel reads the page twice.','He covers it.','He writes what he remembers.','He uncovers it and checks.'], extra:['He swaps a few words.'], h:'Read, cover, write from memory, check.'}
  ],
  re:[
    {how:'A new way: tracing a picture. Even if you color it in new colors, the lines are still his. Drawing from memory gives you your own lines.', q:'A traced picture in new colors is like a note that is…', o:['same shape','own words','a quote']},
    {how:'A simpler step: close the book. Tell your chavrusa out loud what you learned. Then write down what you said.', q:'After you read, what do you do before you write?', o:['cover the source','change a few words','copy it']},
    {how:'The skill underneath: Proof from the Text (Grade 5), a fact in your own words, and Quote or Paraphrase? (Grade 6). You put facts in your own words and chose when to quote. Now you go further: you catch patchwriting, the copying that only looks like a paraphrase, and fix it by writing from memory.', q:'A paraphrase says it in your own words and keeps…', o:['the meaning','every word','his sentence shape']}
  ]},

  'WRIT.RES.L08.04':{name:'Cite It',
  teach:[
    {how:'In Grade 6 you credited a source inside your paragraph: “Samuel Hirsch explains that…”. At the end of the report, each source also gets one full ENTRY, so any reader can find it. Many schools use MLA style. A BOOK entry has four parts, in this order: the author, last name first. The title. The publisher, then the year. Hirsch, Samuel. The Busy Hive. Harbor Press, 2021. (On this screen titles look plain. On paper or a computer, the book’s title goes in italics, slanted letters. If you write by hand, underline it.)', q:'Which is the right entry for the book?', o:['Hirsch, Samuel. The Busy Hive. Harbor Press, 2021.','The Busy Hive. Hirsch, Samuel. 2021, Harbor Press.','Samuel Hirsch, The Busy Hive.']},
    {how:'A WEB PAGE entry does the same four jobs: the author. The title of the page, in quotation marks, because it is one page of a bigger site. The name of the site, in italics. The date. Ortiz, Daniel. “From Flower to Honey.” Harborview Science Museum, 4 Mar. 2024. Every entry ends with a period. (Full MLA also adds the web address at the very end: a comma after the date, then the address without https://. We leave it out here to keep entries short. Add it when your teacher asks.)', q:'In a web page entry, what goes in quotation marks?', o:['the title of the page','the author','the date']},
    {how:'Two mistakes. MISSING A PART: the source has an author, a publisher or site, and a date, but the entry leaves one out, so the reader cannot find it: “Hirsch, Samuel. The Busy Hive.” OUT OF ORDER: every part is there, but in the wrong order, or the first name comes first: “Samuel Hirsch. The Busy Hive. Harbor Press, 2021.” A CORRECT ENTRY has every part, in order, with the right marks.', q:'Yoni’s entry reads: Harborview Science Museum, 4 Mar. 2024. Ortiz, Daniel. “From Flower to Honey.” Which is it: correct entry, missing a part, or out of order?', o:['out of order','missing a part','correct entry']}
  ],
  practice:[
    {t:'sort', q:'Sort each entry: is it for a book or a web page?', bins:[{id:'B',label:'📕 Book entry'},{id:'W',label:'💻 Web page entry'}],
      items:[{label:'Hirsch, Samuel. The Busy Hive. Harbor Press, 2021.',bin:'B'},{label:'Ortiz, Daniel. “From Flower to Honey.” Harborview Science Museum, 4 Mar. 2024.',bin:'W'},{label:'Levi, Natan. Trees in Fall. Oakview Books, 2020.',bin:'B'},{label:'Park, Aaron. “Why Leaves Change Color.” Green Valley University, 9 Oct. 2019.',bin:'W'},{label:'Cohen, Raphael. Sounds of the Shofar. Lantern Books, 2018.',bin:'B'}],
      h:'A title in quotation marks and a site name mean a web page. A publisher means a book.'},
    {t:'pairs', q:'Match each piece of the book entry to its job.', pairs:[['Hirsch, Samuel.','the author, last name first'],['The Busy Hive.','the title'],['Harbor Press,','the publisher'],['2021.','the year']],
      h:'Who wrote it? What is it called? Who put it out? When?'},

      h:'Which parts help a reader find the same page?'},
    {t:'sort', q:'Sneaky entries! Sort each one.', bins:[{id:'G',label:'✅ Correct entry'},{id:'M',label:'⚠️ Mistake: missing a part'},{id:'O',label:'⚠️ Mistake: out of order'}],
