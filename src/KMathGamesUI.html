lex-direction:column; align-items:center; justify-content:center; gap:18px; overflow:hidden; }\n.kmg-say{ font:600 calc(var(--w-fs,22px) * 1.05)/1.2 var(--w-font-display,'Fredoka',sans-serif); text-align:center; color:var(--w-soft,#555); min-height:1.2em; }\nbody.world-explorers .kmg-say{ font-size:20px; opacity:.75; }\n.kmg-row{ display:flex; flex-wrap:wrap; gap:14px; justify-content:center; align-items:flex-end; }\n.kmg-obj{ width:var(--kmg-o); height:var(--kmg-o); position:relative; cursor:pointer; transition:transform .25s var(--w-ease,ease); }\n.kmg-obj svg{ width:100%; height:100%; display:block; pointer-events:none; }\n.kmg-obj.counted::after{ content:attr(data-n); position:absolute; right:-6px; top:-8px; background:var(--w-accent,#FF7A3D); color:#fff; border-radius:999px; min-width:30px; height:30px; font:700 18px/30px var(--w-font-display,sans-serif); text-align:center; }\n.kmg-obj.gone{ opacity:.18; filter:grayscale(1); transform:translateY(-14px) scale(.85); }\n.kmg-obj.gone::before{ content:\"\"; position:absolute; inset:6px; border:3px dashed var(--w-soft,#888); border-radius:50%; }\n.kmg-tray{ background:var(--w-bg,#FFF6DC); border:var(--w-border,4px) solid var(--w-line,#eee); border-radius:var(--w-radius,30px); padding:14px; min-width:150px; min-height:140px; display:flex; flex-wrap:wrap; gap:8px; align-content:center; justify-content:center; cursor:pointer; transition:transform .2s; }\n.kmg-tray.pick:hover{ transform:translateY(-4px); }\n.kmg-choices{ display:flex; gap:var(--w-gap,22px); justify-content:center; flex-wrap:wrap; margin-top:16px; }\n.kmg-ch{ min-width:var(--w-btn-h,120px); height:var(--w-btn-h,120px); border-radius:var(--w-radius-btn,999px); border:var(--w-border,4px) solid var(--w-line,#eee); background:var(--w-surface,#fff); color:var(--w-ink,#2B2350);\n font:700 calc(var(--w-btn-h,120px) * .46)/1 var(--w-font-display,'Fredoka',sans-serif); cursor:pointer; box-shadow:var(--w-shadow); padding:0 18px; transition:transform .2s var(--w-ease,ease); }\n.kmg-ch:active{ transform:scale(.94); }\n.kmg-glow{ animation:kmgGlow 1s ease-in-out infinite; } @keyframes kmgGlow{ 50%{ box-shadow:0 0 0 10px rgba(255,201,64,.55),var(--w-shadow); transform:scale(1.05); } }\n.kmg-bad{ animation:kmgShake .4s; } @keyframes kmgShake{ 25%{ transform:translateX(-8px); } 75%{ transform:translateX(8px); } }\n.kmg-good{ background:var(--w-good,#22A85A) !important; color:#fff !important; border-color:transparent !important; }\n.kmg-drop{ border:4px dashed var(--w-line,#ccc); border-radius:var(--w-radius,24px); }\n.kmg-drop.hot{ border-color:var(--w-accent2,#2FB5E8); background:rgba(47,181,232,.08); }\n.kmg-drag{ cursor:grab; touch-action:none; } .kmg-drag.lift{ position:fixed; z-index:2147482000; pointer-events:none; transform:scale(1.15); filter:drop-shadow(0 10px 12px rgba(0,0,0,.25)); }\n.kmg-frame{ display:grid; grid-template-columns:repeat(5,var(--kmg-c)); gap:6px; background:var(--w-accent4,#B66CF0); padding:8px; border-radius:14px; }\n.kmg-frame > div{ width:var(--kmg-c); height:var(--kmg-c); background:#fff; border-radius:8px; display:grid; place-items:center; }\n.kmg-frame > div .kmg-obj{ --kmg-o:calc(var(--kmg-c) * .84); }\n.kmg-strip{ display:flex; gap:10px; } .kmg-strip b{ width:var(--w-btn-h,110px); height:var(--w-btn-h,110px); border-radius:18px; background:var(--w-bg,#FFF6DC); border:var(--w-border,4px) solid var(--w-line,#eee); display:grid; place-items:center; font:700 calc(var(--w-btn-h,110px) * .4)/1 var(--w-font-display,sans-serif); }\n.kmg-strip b.q{ border-style:dashed; color:var(--w-accent,#FF7A3D); }\n.kmg-big{ font:700 calc(var(--w-btn-h,120px) * 1.1)/1 var(--w-font-display,sans-serif); color:var(--w-accent,#FF7A3D); }\n.kmg-scene{ position:relative; width:min(100%,760px); aspect-ratio:16/9; }\n.kmg-scene svg.bg{ position:absolute; inset:0; width:100%; height:100%; }\n.kmg-shape{ position:absolute; cursor:pointer; } .kmg-shape svg{ width:100%; height:100%; display:block; }\n.kmg-shape.found{ filter:drop-shadow(0 0 8px var(--w-good,#22A85A)); } .kmg-shape.found::after{ content:\"\u2713\"; position:absolute; right:-6px; top:-10px; color:var(--w-good,#22A85A); font:900 28px sans-serif; }\n.kmg-zone{ position:absolute; border-radius:18px; }\n.kmg-pencil{ height:clamp(52px,6.5vw,80px); cursor:pointer; margin:8px 0; } .kmg-pencil svg{ height:100%; display:block; }\n.kmg-hint{ font-size:calc(var(--w-fs,22px) * .85); color:var(--w-soft,#666); }\nbody.world-adventurers .kmg-stage{ border-style:dashed; }\n@media (max-width:600px){ .kmg{ --kmg-o:54px; --kmg-s:40px; --kmg-c:50px; } .kmg-ch{ min-width:88px; height:88px; font-size:40px; } .kmg-strip b{ width:62px; height:62px; font-size:28px; } .kmg-tray{ min-width:96px; padding:8px; } }\n"; document.head.appendChild(s); } }catch(e){} })();

 function rand01(){ try{ var a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]/4294967296; }catch(e){ return Math.random(); } }

 function choicesFor(ans,cands,r,lo,hi){ var set=[ans]; cands.forEach(function(c){ if(set.length<3&&c!==ans&&c>=lo&&c<=hi&&set.indexOf(c)<0) set.push(c); });
  var d=1; while(set.length<3){ [ans+d,ans-d].forEach(function(c){ if(set.length<3&&c>=lo&&c<=hi&&set.indexOf(c)<0) set.push(c); }); d++; } return shuffle(set,r); }
 /* ---------- art: clean, big SVG objects kids know ---------- */

 };
 var THEMES=['apple','ball','star','dreidel','fish','car','cookie','siddur','candle','truck','bird'];
 var NAMES={ apple:['apple','apples'], ball:['ball','balls'], star:['star','stars'], dreidel:['dreidel','dreidels'], fish:['fish','fish'], car:['car','cars'], cookie:['cookie','cookies'], siddur:['siddur','siddurim'], candle:['candle','candles'], truck:['truck','trucks'], bird:['bird','birds'] };
 function themer(r){ var last=null; return function(){ var t; do{ t=THEMES[Math.floor(r()*THEMES.length)]; }while(t===last); last=t; return t; }; }
 function pl(t,n){ return NAMES[t][n===1?0:1]; }
 var SAY_N=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];

 var GEN={
  match:function(r,t){ var pair=r()<.5?['boy','hat']:['plate','cup'], n=ri(r,3,5); return { kind:'match', a:pair[0], b:pair[1], n:n, extra:ri(r,0,2), answer:n, say:pair[0]==='boy'?'Give every boy one hat.':'Put one cup on every plate.' }; },

  more:function(r,t){ var a=ri(r,1,10), b; do{ b=ri(r,1,10); }while(b===a); var trays=shuffle([a,b],r); return { kind:'more', theme:t, trays:trays, answer:Math.max(a,b), say:'Which tray has more '+pl(t,2)+'?' }; },
  sort:function(r,t){ var bySize=r()<.35, cols=shuffle(['red','green','blue','yellow','orange','purple'],r).slice(0,2), items=[], n=6, k=ri(r,2,4);
   var sortable=['apple','ball','car','fish','bird','truck','dreidel']; if(sortable.indexOf(t)<0) t=sortable[Math.floor(r()*sortable.length)];

  count100:function(r,t){ var s=ri(r,1,6)*10, seq=[s,s+10,s+20], ans=s+30; return { kind:'strip', step:10, seq:seq, answer:ans, choices:choicesFor(ans,[ans+10,ans-10,ans+1,s+21],r,10,100), say:'Count by tens. What comes next?' }; },

  shape:function(r,t){ var kinds=['circle','triangle','square','rectangle'], target=kinds[Math.floor(r()*4)], n=ri(r,6,8), tc=ri(r,2,4), list=[];
   for(var i=0;i<n;i++) list.push(i<tc?target:kinds.filter(function(k){ return k!==target; })[Math.floor(r()*3)]);
   list=shuffle(list,r); var cols=['#E8433A','#2F7FE0','#4CB944','#FFC940','#9B5DE5','#FF8A3D'];

   dragify(st,function(d,z){ var ok=z.getAttribute('data-z')===it.answer; if(ok){ d.classList.add('placed'); d.classList.remove('kmg-drag'); d.style.cssText+=';position:absolute;left:calc(50% - 30px);top:calc(50% - 30px);--kmg-o:60px'; z.appendChild(d); } answer(ok,ok?null:d); }); },
  longer:function(it,st,cb){ clean(); var cols=[C.yellow,C.blue,C.green];

   st.querySelectorAll('.kmg-pencil').forEach(function(p){ p.onclick=function(){ answer(Number(p.getAttribute('data-idx'))===it.answer,p); }; }); },
  heavy:function(it,st,cb){ clean(); var pic={ feather:'🪶', rock:'🪨', leaf:'🍃', apple:'🍎', balloon:'🎈', book:'📕' }, heavyLeft=it.answer===0;

   st.querySelectorAll('[data-idx]').forEach(function(b){ b.onclick=function(){ answer(Number(b.getAttribute('data-idx'))===it.answer,b); }; }); }
 };
 /* plug-in hook: another file adds game kinds that use this same round, voice, record and I do / we do / you do engine.

 function addKind(kind,gen,render,re,kinds){ GEN[kind]=gen; R[kind]=render; if(re) SKILLS.unshift([re,kinds||[kind]]); }
 window.KMG={ start:start, GEN:GEN, R:R, ART:ART, makeRound:makeRound, kindsFor:kindsFor, shuffle:shuffle, choicesFor:choicesFor, THEMES:THEMES, themer:themer, addKind:addKind,
