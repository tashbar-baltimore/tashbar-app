  'WRIT.ESSAY.L07.05':{name:'Hook and Orient',
  teach:[
    {how:'You know hooks from Grade 5: a scene hook, a question hook, a fact hook. Now add orienting. A story opening has two jobs. The first is the HOOK: it makes the reader curious, with a scene hook (a moment of action), a question hook, or a fact hook (a surprising detail). "This is a story about…" is not a hook.', q:'Which opening sentence is a hook?', o:['“The printer is jammed, and we go to press in an hour!”','My story is about a printer.','This is a story about The Beacon.']},

  'WRIT.ESSAY.L07.06':{name:'Whose Eyes?',
  teach:[
    {how:'POINT OF VIEW is whose eyes tell the story. In FIRST PERSON the narrator is inside the story and says I, me, my, we. In THIRD PERSON the narrator stands outside and says he, his, and names. A first-person narrator still says he about others; the test is how the narrator speaks about himself.', q:'“My camera bag felt heavy as I climbed to the roof.” Which point of view?', o:['first person','third person','switches person']},
    {how:'Choose one point of view and keep it. The mistake is SWITCHES PERSON: the main boy is "he" and then suddenly "I", or a story told by "I" suddenly calls the narrator by his name.', q:'A story about Benny, told in third person: “Benny ran into the lab and opened his file. I could not believe it was empty.” What went wrong?', o:['switches person','knows too much','stays in one point of view']},
    {how:'A narrator can only tell what he could know. A first-person narrator knows his own thoughts, and only what he sees and hears of others. If "I" tells someone else’s secret thoughts, or what happens in a room he is not in, the narrator KNOWS TOO MUCH.', q:'Told by Gavriel: “I took the photo. In the office downstairs, Mr. Gross was quietly deciding to put it on the cover.” What went wrong?', o:['knows too much','switches person','stays in one point of view']}
  ],

      h:'Look for I, me, my, we. No I, me, my or we anywhere: third person.'},

    {t:'sort', q:'Point-of-view mistakes! Each line is told in first person. Sort them.', bins:[{id:'G',label:'✅ Stays in one point of view'},{id:'S',label:'⚠️ Switches person'},{id:'K',label:'⚠️ Knows too much'}],
      items:[{label:'Told by Eli: “I stood. Then Eli cleared his throat.”',bin:'S'},{label:'Told by Gavriel: “I took the shot. Akiva secretly hated it.”',bin:'K'},{label:'Told by Yoni: “I asked my question. Rabbi Rosen laughed.”',bin:'G'},{label:'Told by Benny: “I hit save. Across town, my zeidy was thinking of me.”',bin:'K'},{label:'Told by Akiva: “I read the page. Akiva sighed.”',bin:'S'},{label:'Told by Eli: “I heard Benny gasp behind me.”',bin:'G'}],
      h:'Does the narrator stay "I"? Could he really see, hear or know that?'},
    {t:'order', q:'Build a first-person sentence that keeps its point of view. Tap the tiles in order.', tiles:['Through the window,','I watched','Eli','pace the hallway.'],

      h:'Akiva knows his own thoughts and what he sees and hears. Nothing more.'},
    {t:'write', q:'Your turn to write. Choose first person OR third person. Write three sentences about Gavriel taking the cover photo in the rain. Keep the point of view.', min:0, checks:['👁️ I chose first person or third person.','🔒 I kept it: the main boy never switches between I and he.','🧠 If first person: only what I see, hear and think.'], h:'First person: I, me, my, and only what you see and hear. Third person: Gavriel, he, his. Read it back and circle every I and he.'}

  check:[

    {q:'Told by Benny in first person: “I handed in my story. In the next room, Akiva was secretly worried it was too long.” What went wrong?', o:['knows too much','switches person','stays in one point of view'], h:'Could Benny see it, hear it, or think it himself?'},

  'WRIT.PARA.L07.04':{name:'Flashback and Back',
  teach:[
    {how:'Review from Grade 5: time jumps move the clock FORWARD IN TIME, and "Meanwhile," moves TO ANOTHER PLACE at the same time. New in Grade 6: a signal can take the story BACK IN TIME, a flashback. The signal names the earlier time ("Two days earlier," "The night before,") and the verb uses HAD: "had lost," "had promised."', q:'“The night before, Eli had lost his voice.” This signal moves the story…', o:['back in time','forward in time','to another place']},
    {how:'A flashback must also come back. Signal the RETURN to the present with "Now," or "Back in the present," and drop the "had": "Now Gavriel held the broken camera." With no return signal, the reader thinks the old scene is still going on.', q:'A flashback is over. Which signal brings the reader back to the present?', o:['Now,','Two days earlier,','The night before,']},
    {how:'Two traps. "Back at the newsroom," moves TO ANOTHER PLACE, not back in time: "back at" means returning to a place. And the WRONG SIGNAL: "Meanwhile" for something days later, or "Later" for something that happened before. A NO SIGNAL jump loses the reader too.', q:'“Yoni finished the interview. Meanwhile, three days later, it was printed.” What is wrong?', o:['wrong signal','no signal','nothing is wrong']}
  ],
  practice:[
    {t:'sort', q:'Sort each shift signal by where it moves the story.', bins:[{id:'F',label:'⏩ Forward in time'},{id:'B',label:'⏪ Back in time'},{id:'P',label:'📍 To another place'}],
      items:[{label:'By Thursday night,',bin:'F'},{label:'A year earlier,',bin:'B'},{label:'Across the hall,',bin:'P'},{label:'Two hours later,',bin:'F'},{label:'Back at the newsroom,',bin:'P'},{label:'The summer before,',bin:'B'}],
      h:'Does it move the clock ahead, move it back, or move the camera to a new spot?'},
    {t:'pairs', q:'Match each part of a flashback to its job.', pairs:[['A week earlier,','Takes the reader back in time'],['had promised','Shows the action came before'],['Now,','Brings the reader back to the present']],
      h:'One part opens the past, one keeps it in the past, one closes it.'},
    {t:'spotall', q:'Benny’s flashback. Tap every signal or verb that shows the story went BACK in time.', cells:[{label:'Two days earlier,',ok:true},{label:'had promised',ok:true},{label:'The summer before,',ok:true},{label:'Back at the bus stop,',ok:false},{label:'An hour later,',ok:false}],
      h:'Look for "earlier", "before" and "had". "Back at" moves the place, not the clock.'},
    {t:'sort', q:'Signal mistakes! Sort each pair of sentences.', bins:[{id:'G',label:'✅ Clear signal'},{id:'N',label:'⚠️ No signal'},{id:'W',label:'⚠️ Wrong signal'}],
      items:[{label:'Gavriel held the broken camera. The day before, he had left it on the bleachers.',bin:'G'},{label:'Gavriel held the broken camera. He left it on the bleachers.',bin:'N'},{label:'Benny lost his file on Monday. Meanwhile, on Friday, he found it.',bin:'W'},{label:'Eli opened his notes. Later, he had written them the week before.',bin:'W'},{label:'Akiva locked the newsroom. The next morning, the papers were gone.',bin:'G'},{label:'Gavriel snapped a photo on the roof. Rabbi Rosen read a letter.',bin:'N'}],
      h:'Is there a signal at the start of the new part? Does it tell the truth about when?'},
    {t:'order', q:'A flashback is over. Build the sentence that returns to the present. Tap the tiles in order.', tiles:['Now,','back in the newsroom,','Akiva','reached for the phone.'],
      h:'The return signal first. Then the place. Then who, and what he does.'},
    {t:'spotall', q:'A flashback about Eli. Tap every sentence that brings the reader BACK TO THE PRESENT.', cells:[{label:'Now Eli stepped up to the podium.',ok:true},{label:'Back in the present, the room went quiet.',ok:true},{label:'A year earlier, Eli had lost his first debate.',ok:false},{label:'He had forgotten every word.',ok:false}],
      h:'The return signal comes first, and the "had" is gone.'},
    {t:'write', q:'Your turn to write. On printing day, Gavriel’s camera is broken. Start in the present, go back to when it broke, then return to the present.', min:0, checks:['⏪ A signal takes the reader back, and I used "had".','↩️ A signal brings the reader back to the present.','📍 The reader always knows when and where he is.'], h:'One sentence now. Then a signal for the earlier time, with "had". Then a return signal, without "had".'}
  ],
  check:[
    {q:'A flashback about Eli’s first debate is over. Which sentence brings the reader back to the present?', o:['Now Eli stepped up to the podium.','Eli had practiced for weeks.','The year before, Eli had lost.'], h:'Look for the return signal, and no "had".'},

  re:[

  'WRIT.PARA.L07.05':{name:'Ending That Lands',
  teach:[
