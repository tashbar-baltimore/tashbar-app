<script>
/* Tashbar UPGRADE Phase 3 — Motivation on every page. Loaded by msQuestTools (Photos.js) in its own eval, like MathMore/ReadMore/ScienceMore.
   QuestPage.html only calls these through window.* checks, so if this file fails the app still works like Version 23. */
/* UPGRADE Phase 3 items 1, 4, 7 (alazar@ chat, 2026-11-10): Next-goal bar, combo flame + bonus at 5/10, kind misses */
function tlGoalBar(){ try{ const st=A.st; if(!st) return ''; const L=lvlInfo(masteredCount(st)); const p=A.play; const cb=(A.view==='play'&&p&&p.combo>=2)?`<span class="tlflame" aria-label="${p.combo} right in a row" style="font-size:${Math.min(18+p.combo*2,38)}px;line-height:1;white-space:nowrap">🔥<b style="font-size:16px"> ${p.combo} in a row</b></span>`:''; const txt=L.toNext>0?skillsWord(L.toNext)+' to Level '+(L.l+1)+'!':'Every level reached!'; return `<div class="tlgoal" role="status" style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px auto 4px;max-width:960px;padding:8px 14px;border-radius:14px;background:rgba(99,102,241,.10);font-weight:700"><span>🎯 Next goal: ${txt}</span><span style="flex:1;max-width:220px;height:10px;border-radius:6px;background:rgba(0,0,0,.08);overflow:hidden"><span style="display:block;height:100%;width:${L.pct}%;background:#3BC48A"></span></span>${p3Chip()}${cb}</div>`; }catch(e){ return ''; } }
function tlComboBonus(n){ try{ if(SND&&SND.t){ const b=n>=10?784:659; [1,1.26,1.5,2].forEach((m,k)=>SND.t(b*m,.18,'triangle',k*.09,.14)); } }catch(e){} try{ const tgt=document.querySelector('.tlflame')||document.querySelector('.qcard'); if(tgt&&typeof burst==='function') burst(tgt,['#F59E0B','#EF4444','#FBBF24'],n>=10?36:26); }catch(e){} }
function tlKindMiss(p,it,cooling){ if(it&&Array.isArray(it.re)&&it.re.length){ const k=Math.min(Math.max((p.tries||2)-2,0),it.re.length-1), head=['Tough one, let\'s look at it another way.','Let\'s take a smaller step.','Let\'s go back to the skill underneath.'][Math.min(k,2)]; return `<div class="fb hint" role="status"><b>${head}</b> <span>${esc(it.re[k])}</span>${it.h?`<p style="margin:.4em 0 0"><b>Hint:</b> ${esc(it.h)}</p>`:''}${cooling?'<span class="coolnote">Read it, then try again.</span>':''}</div>`; } const hows=p.items.filter(x=>x&&typeof x.how==='string'&&x.how).map(x=>x.how); let alt=''; if(hows.length){ const k=hows.indexOf(it.how); alt=hows[k>=0?(k+1)%hows.length:hows.length-1]; } const body=alt?esc(alt):esc(it.h||'Look again carefully, one step at a time.'); const hint=(alt&&it.h)?`<p style="margin:.4em 0 0"><b>Hint:</b> ${esc(it.h)}</p>`:''; return `<div class="fb hint" role="status"><b>Tough one, let's look at it another way.</b> <span>${body}</span>${hint}${cooling?'<span class="coolnote">Read it, then try again.</span>':''}</div>`; }
/* Boss fix (builder, 2026-11-11): a boss round must always have 8 questions (win = 7 of 8). Near the end of a road the skill window can be only 2-3 skills, which gave 4-6 questions and made the boss impossible to beat. Now the round takes turns between his skills until it has 8. */
try{ if(typeof buildBoss==='function'){ window.buildBoss=function(c,range){
 const ids=(tlWindow(A.st,c)||WEEK[c][range]||[]).filter(id=>GEN[id]||BANK_ALL[id]); const out=[], seen=new Set(), pools={};
 ids.forEach(id=>{ if(!GEN[id]) pools[id]=shuffle(BANK_ALL[id].practice.concat(BANK_ALL[id].check).filter(x=>x.t!=='write')); });
 const one=(id,allowRepeat)=>{ for(let t=0;t<12;t++){ let x; if(GEN[id]) x=GEN[id].gen(); else { const pl=pools[id]; if(!pl.length) return null; x=pl[t%pl.length]; } if(!x) return null; const k=id+'|'+x.q+'|'+JSON.stringify(x.o||x.a||x.tiles||''); if(allowRepeat||!seen.has(k)){ seen.add(k); const it=prepItem(x,'check'); it.skill=id; return it; } } return null; };
 if(ids.length){ for(let pass=0;pass<2&&out.length<8;pass++){ let guard=0; while(out.length<8&&guard<64){ const it=one(ids[guard%ids.length],pass===1); if(it) out.push(it); guard++; } } }
 return shuffle(out); }; } }catch(e){ console.error('boss fix',e); }
/* ===== UPGRADE Phase 3 items 2, 3, 5, 6, 8, 9, 10 (Claude Code builder, 2026-11-10): daily quest, school-day streaks, level-up celebration, personal bests, mystery unlock, weekly replay, Shabbos page. No new money. ===== */
const P3_OFF=new Set(['2027-03-23','2027-04-21','2027-04-22','2027-04-23','2027-04-24','2027-04-25','2027-04-26','2027-04-27','2027-04-28','2027-04-29','2027-06-10','2027-06-11','2027-06-12','2027-08-12','2027-10-01','2027-10-02','2027-10-03','2027-10-10','2027-10-11','2027-10-15','2027-10-16','2027-10-17','2027-10-18','2027-10-19','2027-10-20','2027-10-21','2027-10-22','2027-10-23','2027-10-24']); /* Yom Tov, Chol Hamoed, Erev Pesach/YK/Sukkos/RH, Purim, Tisha B'Av (Hebcal). Add school breaks here. */
function p3IsSchool(ds){ const w=new Date(ds+'T00:00:00Z').getUTCDay(); return w>=1&&w<=4&&!P3_OFF.has(ds); }
function p3Prev(ds){ return new Date(new Date(ds+'T00:00:00Z').getTime()-864e5).toISOString().slice(0,10); }
function p3WeekStart(){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-d.getDay()); return d.getTime(); }
function p3(st){ const o=st.p3||(st.p3={}); o.pb=o.pb||{combo:0,fast:{},bw:-1,cur:{k:0,n:0,told:false}}; o.mk=o.mk||{have:['📍'],use:'📍',last:Math.floor(masteredCount(st)/5)*5}; o.lands=o.lands||[]; o.qd=o.qd||[]; o.log=o.log||[]; o.qn=o.qn||0;
 if(o.pb.bw<0){ const ws=p3WeekStart(), by={}; Object.values(st.skills).forEach(s=>{ if(s&&s.m&&s.at&&s.at<ws){ const d=new Date(s.at); d.setHours(0,0,0,0); d.setDate(d.getDate()-d.getDay()); by[d.getTime()]=(by[d.getTime()]||0)+1; } }); o.pb.bw=Math.max(0,...Object.values(by)); }
 return o; }
function p3WeekSkills(st){ const ws=p3WeekStart(); return Object.entries(st.skills).filter(([id,s])=>s&&s.m&&s.at>=ws); }
const P3_Q={les1:['Finish 1 lesson',1,'les'],les2:['Finish 2 lessons',2,'les'],cmb5:['Get 5 right in a row',5,'cmb'],fst3:['Get 3 practice answers right on the first try',3,'fst'],mst1:['Master a new skill',1,'mst'],sub2:['Work in 2 different subjects',2,'sub'],str3:['Earn 3 stars on one lesson',3,'str']};
function p3Quest(st){ const o=p3(st), t=today(); if(!o.q||o.q.d!==t){ let h=0; (t+st.id).split('').forEach(ch=>{ h=(h*31+ch.charCodeAt(0))>>>0; }); const A1=['les1','les2'], B1=['cmb5','fst3'], C1=['mst1','sub2','str3']; o.q={d:t,k:[A1[h%2],B1[(h>>>3)%2],C1[(h>>>6)%3]],v:{les:0,cmb:0,fst:0,mst:0,sub:[],str:0},done:[],all:false,party:false}; } return o.q; }
function p3QVal(q,k){ const g=P3_Q[k], v=q.v[g[2]]; return Math.min(g[1],Array.isArray(v)?v.length:v); }
function p3QCheck(st,live){ const q=p3Quest(st), o=p3(st); q.k.forEach(k=>{ if(q.done.includes(k)) return; if(p3QVal(q,k)>=P3_Q[k][1]){ q.done.push(k); if(live){ SND.t(988,.12,'sine',0,.1); SND.t(1319,.18,'sine',.1,.1); toast('📜 Quest goal done: '+P3_Q[k][0]+'!'); } } });
 if(!q.all&&q.done.length===q.k.length){ q.all=true; q.party=true; o.qn++; o.qd.push(q.d); o.qd=o.qd.slice(-40); } }
function p3Ans(p,it,ok){ try{ const st=A.st; if(!st||!p) return; const q=p3Quest(st); if(ok){ q.v.cmb=Math.max(q.v.cmb,p.combo); if(it.phase==='practice'&&p.tries===1) q.v.fst++; } p3QCheck(st,true); }catch(e){ console.error('p3Ans',e); } }
function p3Finish(st,p,outcome,stars){ const out={pbs:[],mystery:null}; try{ const o=p3(st), q=p3Quest(st), now=Date.now();
 q.v.les++; if(!q.v.sub.includes(p.c)) q.v.sub.push(p.c); if(outcome==='mastered'){ q.v.mst++; q.v.str=Math.max(q.v.str,stars); } q.v.cmb=Math.max(q.v.cmb,p.best||0); p3QCheck(st,false);
 const pb=o.pb, add=(txt)=>{ out.pbs.push(txt); o.log.push({at:now,t:txt}); o.log=o.log.slice(-20); };
 if((p.best||0)>pb.combo){ if(pb.combo>=3) add(`Most right in a row ever: ${p.best}!`); pb.combo=p.best; }
 if(outcome==='mastered'&&!p.replay&&p.kind==='skill'&&p.t0){ const ms=now-p.t0, old=pb.fast[p.c]; if(old&&ms<old) add(p.c==='READ'?'Your fastest read yet!':`Your fastest ${CURR[p.c].label} lesson yet!`); if(!old||ms<old) pb.fast[p.c]=ms; }
 const wk=p3WeekStart(); if(pb.cur.k!==wk){ if(pb.cur.k) pb.bw=Math.max(pb.bw,pb.cur.n); pb.cur={k:wk,n:0,told:false}; } pb.cur.n=p3WeekSkills(st).length; if(pb.bw>0&&pb.cur.n>pb.bw&&!pb.cur.told){ pb.cur.told=true; add(`Best week ever! ${pb.cur.n} skills this week.`); }
 const n=masteredCount(st); if(outcome==='mastered'&&Math.floor(n/5)>Math.floor(o.mk.last/5)){ o.mk.last=n; const pool=P3_MK.filter(m=>!o.mk.have.includes(m)); out.mystery=pool.length?pool[0]:'★'; if(pool.length) o.mk.have.push(out.mystery); }
 if(outcome==='bosswin'){ const r=jReveal(st,p.c); if(r&&r.to&&r.to>r.from){ o.lands.push({at:now,c:p.c,to:r.to}); o.lands=o.lands.slice(-30); } }
 }catch(e){ console.error('p3Finish',e); } return out; }
const P3_MK=['⭐','🦁','🦅','💎','🔥','🎯','🦌','🌟','🏔️','🐎','🌻','🍎'];
function p3Marker(st){ const o=st.p3&&st.p3.mk; return o&&o.use&&o.use!=='📍'?o.use:''; }
function p3Chip(){ try{ const st=A.st; if(!st) return ''; const q=p3Quest(st); return `<span class="p3chip" title="Today's quest">📜 Quest ${q.done.length}/3</span>`; }catch(e){ return ''; } }
/* queue so celebration screens never cover each other */
const P3Q=[]; let p3QT=null;
function p3Queue(fn){ P3Q.push(fn); if(!p3QT) p3QT=setInterval(()=>{ if(!P3Q.length){ clearInterval(p3QT); p3QT=null; return; } if(A.view!=='result'&&A.view!=='hub'){ P3Q.length=0; return; } if(A.overlay) return; P3Q.shift()(); },500); }
function p3Full(inner,cls){ A.overlay={html:`<div class="overlay p3full ${cls||''}" data-act="closeov-bg"><div class="p3fc" role="dialog" aria-modal="true">${inner}</div></div>`}; render(); setTimeout(()=>{ const b=document.querySelector('.p3fc .btn'); b&&b.focus(); },60); }
function p3Fanfare(){ [[523,.18],[659,.18],[784,.18],[1047,.36],[784,.16],[1047,.5]].reduce((w,[f,d])=>{ SND.t(f,d,'triangle',w,.15); SND.t(f/2,d,'sine',w,.08); return w+d*.85; },0); setTimeout(()=>SND.level(),1500); }
function p3LevelUp(r){ const La=lvlInfo(r.after.n), Lb=lvlInfo(r.before.n), mk=p3Marker(A.st)||'📍';
 const stops=RANKS.map((rk,k)=>`<li class="${k+1<La.l?'past':k+1===La.l?'here':''}"><span>${k+1}</span></li>`).join('');
 p3Fanfare(); confetti(); setTimeout(()=>confetti(),900);
 p3Full(`<div class="p3lvl">LEVEL ${La.l}</div><h2>You reached ${esc(RANKS[La.l-1])}!</h2><p>You have mastered ${La.n} skill${La.n===1?'':'s'}. Look how far down the road you’ve come.</p>
 <div class="p3road"><ol style="--n:${RANKS.length}">${stops}</ol><div class="p3mk" id="p3mk" style="--from:${Lb.l-1};--to:${La.l-1};--n:${RANKS.length}">${mk}</div></div>
 <div class="p3money"><small>Tashbar Bank</small><b id="p3bal">${fmt(r.before.bal)}</b></div>
 <button class="btn go big" data-act="closeov">Keep going</button>`,'lvl');
 setTimeout(()=>{ const m=document.getElementById('p3mk'); m&&m.classList.add('go'); SND.thunk(); },500);
 setTimeout(()=>{ countUp(document.getElementById('p3bal'),r.before.bal,r.after.bal,1600,fmt); if(r.after.bal>r.before.bal) for(let k=0;k<8;k++) setTimeout(()=>SND.coin(k),k*180); },900); }
function p3QuestParty(){ const st=A.st, q=p3Quest(st); q.party=false; SND.win(); confetti(); setTimeout(()=>p3Fanfare(),300);
 p3Full(`<div class="oe">📜</div><h2>Daily Quest complete!</h2><p>All 3 goals done today. That’s quest number ${p3(st).qn}.</p><div class="p3qlist">${q.k.map(k=>`<div class="ok">✅ ${esc(P3_Q[k][0])}</div>`).join('')}</div><p class="p3b">Bonus: a gold star on your quest board ⭐</p><button class="btn go big" data-act="closeov">Awesome!</button>`); }
function p3Mystery(m){ SND.t(440,.2,'sine',0,.1); p3Full(`<div class="p3box" id="p3box" data-act="p3open" role="button" aria-label="Open your mystery box">🎁</div><h2>Mystery unlock!</h2><p>Every 5th skill you master opens a surprise. Tap the box.</p><div id="p3sur"></div><button class="btn big" data-act="p3open" id="p3ob">Open it</button>`); A.p3m=m; }
function p3Open(){ const m=A.p3m; if(!m) return; A.p3m=null; const box=document.getElementById('p3box'); if(box){ box.textContent='✨'; box.classList.add('open'); } SND.win(); confetti();
 const s=document.getElementById('p3sur'), ob=document.getElementById('p3ob'); if(s) s.innerHTML=m==='★'?`<p class="p3b">You found every marker! Here’s a cheer: you’re unstoppable! 🎉</p>`:`<div class="p3new">${m}</div><p class="p3b">New map marker! Use it to lead your way on the Journey Map.</p><button class="btn go big" data-act="p3use" data-m="${m}">Use it now</button> `; if(ob){ ob.textContent='Maybe later'; ob.dataset.act='closeov'; } }
function p3ResultHTML(r){ try{ return p3ResultHTML_(r); }catch(e){ console.error('p3Res',e); return ''; } }
function p3ResultHTML_(r){ const x=r.p3; if(!x) return ''; const q=p3Quest(A.st);
 return `<div class="p3res">${x.pbs.length?`<div class="p3pb"><span class="p3pbi">🏅</span><div><small>Personal best</small>${x.pbs.map(t=>`<b>${esc(t)}</b>`).join('')}</div></div>`:''}
 <div class="p3qmini"><b>📜 Today’s quest</b>${q.k.map(k=>`<span class="${q.done.includes(k)?'ok':''}">${q.done.includes(k)?'✅':'⬜'} ${esc(P3_Q[k][0])}</span>`).join('')}</div></div>`; }
function p3RunResult(r,t){ const x=r.p3; if(!x){ if(r.after.lvl>r.before.lvl) setTimeout(()=>{ if(A.view==='result'&&A.res===r) p3Queue(()=>p3LevelUp(r)); },t+1500); return; } const lvl=r.after.lvl>r.before.lvl, q=p3Quest(A.st);
 setTimeout(()=>{ if(A.view!=='result'||A.res!==r) return; if(lvl) p3Queue(()=>p3LevelUp(r)); if(q.party) p3Queue(p3QuestParty); if(x.mystery) p3Queue(()=>p3Mystery(x.mystery)); },t+1500); }
function p3HubHTML(st){ try{ return p3HubHTML_(st); }catch(e){ console.error('p3Hub',e); return ''; } }
function p3HubHTML_(st){ const o=p3(st), q=p3Quest(st), ws=p3WeekStart(), wk=p3WeekSkills(st).length, earned=Math.round(st.ledger.filter(x=>x.at>=ws).reduce((a,x)=>a+x.amt,0)*100)/100, lands=o.lands.filter(x=>x.at>=ws).length, dw=new Date().getDay(), shab=dw>=4||dw===0;
 const goals=q.k.map(k=>{ const g=P3_Q[k], v=p3QVal(q,k), d=q.done.includes(k); return `<li class="${d?'ok':''}"><span class="ck">${d?'✅':'⬜'}</span><span class="gt">${esc(g[0])}</span><span class="gp">${v} / ${g[1]}</span><span class="gb"><i style="width:${Math.round(v/g[1]*100)}%"></i></span></li>`; }).join('');
 const pb=o.pb, fasts=Object.entries(pb.fast||{}).map(([c,ms])=>`<li>⚡ Fastest ${esc(CURR[c]?CURR[c].label:c)}: ${Math.max(1,Math.round(ms/60000))} min</li>`).join('');
 const mks=o.mk.have.length>1?`<div class="p3mks"><b>My map markers</b>${o.mk.have.map(m=>`<button class="p3mkb ${o.mk.use===m?'on':''}" data-act="p3use" data-m="${m}" aria-label="Use marker ${m}">${m}</button>`).join('')}</div>`:`<p class="p3hint">🎁 Master ${5-masteredCount(st)%5} more skill${5-masteredCount(st)%5===1?'':'s'} to open a mystery surprise.</p>`;
 return `<div class="p3hub">
 <section class="panel p3quest ${q.all?'all':''}"><div class="p3h"><h3>📜 Today’s Quest</h3><span>${q.all?'⭐ Complete!':q.done.length+' of 3 done'}</span></div><ul>${goals}</ul><p class="p3hint">${q.all?'You did all 3 today. Come back next school day for a new quest.':'Finish all 3 for a gold quest star.'} Quests done: ${o.qn} ⭐</p></section>
 <section class="panel p3week"><div class="p3h"><h3>🚀 Look how far you’ve come</h3><button class="btn" data-act="p3replay">▶ Play my week</button></div>
 <div class="p3tiles"><div><span>📍</span><b id="p3w1">${wk}</b><small>skills mastered this week</small></div><div><span>💵</span><b id="p3w2">${fmt(earned)}</b><small>earned this week</small></div><div><span>🗺️</span><b id="p3w3">${lands}</b><small>new lands this week</small></div></div>
 <p class="p3hint">Since you started: ${masteredCount(st)} skill${masteredCount(st)===1?'':'s'} mastered · ${fmt(st.balance)} in the bank${(st.streak||{}).n>=2?` · 🔥 ${st.streak.n} school days in a row`:''}</p>
 <div class="p3bests"><b>🏅 My bests</b><ul>${pb.combo?`<li>🔥 Most right in a row: ${pb.combo}</li>`:''}<li>📅 Best week: ${Math.max(pb.bw,wk)} skills</li>${fasts}</ul></div>${mks}
 <button class="btn ${shab?'go':''} big p3shab" data-act="p3shab">🕯️ My Shabbos page</button></section></div>`; }
function p3Replay(){ const st=A.st, ws=p3WeekStart(); const vals=[p3WeekSkills(st).length, st.ledger.filter(x=>x.at>=ws).reduce((a,x)=>a+x.amt,0), p3(st).lands.filter(x=>x.at>=ws).length];
 [['p3w1',vals[0],v=>Math.round(v)],['p3w2',vals[1],fmt],['p3w3',vals[2],v=>Math.round(v)]].forEach(([id,v,F],k)=>setTimeout(()=>{ const e=document.getElementById(id); if(!e) return; countUp(e,0,v,1200,F); burst(e,['#3BC48A','#E0AE4F','#6E9BEA'],14); SND.t(660+k*120,.15); },k*700)); }
function p3Shabbos(){ const st=A.st, o=p3(st), ws=p3WeekStart(), we=ws+6*864e5, sk=p3WeekSkills(st).sort((a,b)=>a[1].at-b[1].at), earned=st.ledger.filter(x=>x.at>=ws).reduce((a,x)=>a+x.amt,0), qd=o.qd.filter(d=>new Date(d+'T12:00:00').getTime()>=ws).length, pbs=o.log.filter(x=>x.at>=ws), lands=o.lands.filter(x=>x.at>=ws);
 const sun=new Date(ws).toLocaleDateString('en-US',{month:'long',day:'numeric'}), fri=new Date(ws+5*864e5).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
 A.overlay={html:`<div class="overlay p3full p3printwrap"><div class="p3fc p3print" role="dialog" aria-modal="true"><span class="p3noprint">${window.TLK?TLK.x('data-act="closeov"','tr'):'<button type="button" class="btn" data-act="closeov" aria-label="Close">✕</button>'}</span>
 <div class="p3ph"><span>🕯️🕯️</span><div><h2>${esc(st.name)}’s Shabbos Page</h2><small>Tashbar Learning · week of ${sun} – ${fri}</small></div></div>
 <div class="p3ptiles"><div><b>${sk.length}</b><small>skills mastered</small></div><div><b>${fmt(earned)}</b><small>earned in the Tashbar Bank</small></div><div><b>${(st.streak||{}).n||0}</b><small>school days in a row</small></div><div><b>${qd}</b><small>daily quests done</small></div></div>
 <h3>Skills I mastered this week</h3>${sk.length?`<ol class="p3psk">${sk.map(([id,s])=>`<li>${esc(skillName(id))} <span>${'⭐'.repeat(s.stars||1)}</span></li>`).join('')}</ol>`:'<p>This week I kept practicing. Next week I’ll master more!</p>'}
 ${lands.length?`<h3>New lands I reached</h3><p>${lands.map(x=>`${LANDS[x.to-1].e} ${esc(LANDS[x.to-1].n)} (${esc(CURR[x.c].label)})`).join(' · ')}</p>`:''}
 ${pbs.length?`<h3>My personal bests</h3><ul>${pbs.map(x=>`<li>🏅 ${esc(x.t)}</li>`).join('')}</ul>`:''}
 <p class="p3pnow">Bank balance now: <b>${fmt(st.balance)}</b></p>
 <div class="p3psign"><span>Parent’s signature: ______________________</span><span>Gut Shabbos! 🍷🍞</span></div>
 <div class="p3noprint"><button class="btn go big" data-act="p3print">🖨️ Print</button></div></div></div>`}; render(); }
document.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act;
