 "ELEC.L01": "By the end of Level 1 (Kindergarten): A student can tell same from different, continue a simple pattern, compare groups by pairing, listen well and use please, thank you and sorry. He names colors, lines and borders, keeps a steady beat and claps word parts, and knows land and water, the four seasons, our flag, long ago and today, what things are made of, and the days of the week.",
 "ELEC.L02": "By the end of Level 2 (Grade 1): A student can put events in order, sort by two rules, find the odd one out and follow if-then rules. He gives a Show and Tell, tells a story in three steps and takes turns talking. He names shapes, textures and near and far, hears high, low, fast and slow, sorts instruments, and knows maps, animal homes, American symbols, travel, tools and the months.",
 "ELEC.L03": "By the end of Level 3 (Grade 2): A student can solve pattern puzzles, speak up clearly, mix primary colors and keep a beat. He zooms in to see that everything is made of atoms and learns about hidden light and X-rays. He knows the seven continents, the parts of a plant, Maryland, great inventors, solid, liquid and gas, and time facts.",
 "ELEC.L04": "By the end of Level 4 (Grade 3): A student can use two clues to solve a puzzle, give a talk with a beginning, middle and end, draw what he sees, and follow a melody up and down. He explores magnets, energy changing form and where electricity comes from. He knows the five oceans, animal groups, the 50 states, explorers, magnets and measuring length.",
 "ELEC.L05": "By the end of Level 5 (Grade 4): A student can use a logic grid, listen and ask good questions, design a clear poster and read a rhythm. He opens the atom, builds atoms by counting protons and compares atom sizes. He knows countries and capitals, the solar system, the three branches of government, the birth of America, circuits and big numbers.",
 "ELEC.L06": "By the end of Level 6 (Grade 5): A student can sort true, false and can't tell, persuade politely, draw depth and read notes on the staff. He reads the periodic table, names isotopes and knows the light family and natural radiation. He learns record places, the water cycle, presidents, inventions, simple machines and Roman numerals, and can take hands-on Studio courses with a grown-up: photography, piano, sewing, fixing, knots, music making, woodshop and kitchen science.",
 "ELEC.L07": "By the end of Level 7 (Grade 6): A student can spot a flaw in an argument, deliver a Dvar Torah, design on a computer and compose a short melody. He learns how a nucleus decays, alpha, beta and gamma, shielding, half-life and counting with a Geiger counter. He knows latitude and longitude, Earth's layers, the Constitution, ancient civilizations, light and sound, and the metric system.",
 "ELEC.L08": "By the end of Level 8 (Grade 7): A student can reason with if and only if, debate with evidence, plan and build a craft, and build chords for harmony. He measures dose, uses time, distance and shielding, and tells irradiated from contaminated. He knows the biggest countries, body systems, elections and terms, the Age of Exploration, how computers work and distances in space.",
 "ELEC.L09": "By the end of Level 9 (Grade 8): A student can prove a claim step by step, speak to an audience with slides, keep a portfolio and arrange a song. He explains mass becoming energy, fission and fusion, controlled chain reactions and power plants, and compares energy sources fairly. He knows Eretz Yisrael on the map, the elements, America's growth, the Industrial Revolution, energy sources and percents.",
 "ELEC.L10": "By the end of Level 10 (Grade 9): A student can test syllogisms with Venn diagrams, think on his feet with PREP, draw in perspective and use scales and intervals. He reads nuclear notation, balances decays, follows decay chains, does half-life math and reads radon tests. He knows climate zones, Newton's laws, how the economy works, the world wars, flight and powers of ten.",
 "ELEC.L11": "By the end of Level 11 (Grade 10): A student can build truth tables, argue a debate case with rebuttal, use color theory and work with chords and keys. He explains binding energy, reactor parts, keeping a reactor steady, the lessons of past accidents and used fuel. He knows great rivers and ranges, pH, landmark court cases, the space race, the internet and famous numbers.",
 "ELEC.L12": "By the end of Level 12 (Grade 11): A student can name common fallacies, answer interview questions with STAR Steps, lay out a page along an eye path and read meter and syncopation. He uses detectors, distance and shielding math, dose limits and ALARA, room surveys and nuclear medicine. He knows world money, medicine milestones, civic duties, great scientists, engines and electric cars, and interest.",
 "ELEC.L13": "By the end of Level 13 (Grade 12): A student can weigh odds and evidence, explain a hard idea simply, use typography well and know the orchestra. He runs reactor simulator startups and power changes, explores nuclear careers and writes an energy decision. He knows world organizations, stars and galaxies, the citizenship test, modern tech milestones, AI and digital smarts, and statistics.",
 "ELEC.L14": "By the end of Level 14 (after 12th grade, college and work-ready): A student can prove by cases and by contradiction, run a meeting, design for a real purpose and find the form of a piece of music by lettering its parts. In nuclear science he works with the Q-value and mass defect, how radiation meets matter, and counting statistics with detector efficiency.",
 "ELEC.L15": "By the end of Level 15 (after 12th grade, college and work-ready): A student can use game strategy and think backwards, pitch a proposal with evidence, make plans and elevations to scale, and compose with question and answer phrases. In nuclear science he follows a neutron generation with the six-factor formula, predicts power changes from reactor kinetics, and plans jobs with health physics.",
 "ELEC.L16": "By the end of Level 16 (after 12th grade, college and work-ready): A student can map an argument, give a keynote, curate an exhibition and arrange music for an ensemble as capstones. In nuclear science he solves heat-removal balances, follows NRC licensing and defense in depth, passes a simulator operator check and defends a capstone research project."

 "ELEC.LOGIC.L01.03": "Line the two groups up in pairs: the group with some left over has more, and when none are left over the groups are the same.",
 "ELEC.LOGIC.L01.04": "Before and after with daily life: wash hands before bread, and Friday comes before Shabbos, put in order with a little train.",
 "ELEC.LOGIC.L02.01": "First, next, last: plant a seed, it grows, pick the flower, and the morning order from Modeh Ani to negel vasser.",
 "ELEC.LOGIC.L02.02": "Two Checks: sort by one rule, then by two at once, such as animals that live in water and have fur.",
 "ELEC.LOGIC.L02.03": "Odd one out: look at all of them, find the rule most share (fruit, or a color), then find the one that breaks it.",
 "ELEC.LOGIC.L02.04": "If-then rules from daily life: IF it rains, THEN we take a coat; IF a friend needs help, THEN we help.",
 "ELEC.LOGIC.L03.01": "Pattern detectives: find the part that repeats, sing it like a song to hear what comes next, and spot the piece that breaks the rule.",
 "ELEC.LOGIC.L04.01": "Clue puzzles: use the first clue to cross out some answers and the second to cross out more, until two clues together leave one.",
 "ELEC.LOGIC.L05.01": "Logic grids: names down the side, choices across the top, ✗ for every no, and a ✓ that rules out the rest of its row and column.",
 "ELEC.LOGIC.L06.01": "True, false or can't tell: use only the facts given, never a guess, and say can't tell when the facts are not enough.",
 "ELEC.LOGIC.L07.01": "Spot the flaw in an argument: false cause and too few cases, taught with claims that sound convincing but do not follow.",
 "ELEC.LOGIC.L08.01": "If and only if: a rule, its reverse and its opposite compared side by side, and when the rule and its reverse are both true.",
 "ELEC.LOGIC.L09.01": "Prove it step by step: start from what is given, each step follows from a fact or an earlier step, and order chains pass along.",
 "ELEC.LOGIC.L10.01": "Circle Check with Venn diagrams: two premises and a conclusion, drawn as circles to test whether a syllogism is valid or a trap.",
 "ELEC.LOGIC.L11.01": "Truth tables for AND, OR and NOT, row by row, with the worked case that an if-then rule is false in only one row.",
 "ELEC.LOGIC.L12.01": "Fallacy Finder: find the claim, find the reason, and ask whether the reason proves it, with real ads and arguments.",
 "ELEC.LOGIC.L13.01": "Count the Chances: outcomes you want over all equal outcomes, from 0 (can't happen) to 1, then weigh real evidence with it.",
 "ELEC.LOGIC.L14.01": "The Proof Toolbox: proof by cases and proof by contradiction, each shown in a worked example before practice.",
 "ELEC.LOGIC.L15.01": "Think Backwards in turn-based games: start from the winning position and work back, worked through in Nim.",
 "ELEC.LOGIC.L16.01": "Capstone Argument Map: claim at the top, reasons under it, objections and replies below, built for a real class question.",
 "ELEC.MUS.L01.01": "Volume Dial: loud sounds like a big drum and a lion's roar, soft sounds like a whisper, sorted by listening.",
 "ELEC.MUS.L01.02": "Tick-Tock Beat: a beat stays steady like a clock, kept by tapping, clapping or marching.",
 "ELEC.MUS.L01.03": "Copy Cat: listen to the whole clap pattern, then echo it exactly, at the same speed.",
 "ELEC.MUS.L01.04": "Clap Each Part: one clap for each part of a word (ap-ple is two claps, cat is one).",
 "ELEC.MUS.L02.01": "Animal sounds for high and low, fast and slow: a bird is high, a bear is low, a rabbit is fast, a turtle is slow.",
 "ELEC.MUS.L02.02": "Hit, Blow, Pluck: sort instruments by asking how you make the sound (drum, trumpet or shofar, strings).",
 "ELEC.MUS.L02.03": "Shh Space: a rest is a quiet beat, so music needs quiet too, clapped as clap, clap, rest, clap.",
 "ELEC.MUS.L02.04": "Stair Steps: a melody climbs higher like stairs or walks back down, heard and shown with steps.",
 "ELEC.MUS.L03.01": "Keep the beat like a heartbeat: clap along, with the same space between every clap, counting 1, 2, 3, 4.",
 "ELEC.MUS.L04.01": "High and low notes, and drawing a melody with arrows for up, down or the same.",
 "ELEC.MUS.L05.01": "Read a rhythm: whole, half and quarter notes by how many beats each lasts, matched to a steady walking beat.",
 "ELEC.MUS.L06.01": "Notes on the staff: 5 lines and 4 spaces in the treble clef, with a memory sentence for the lines E, G, B, D, F.",
 "ELEC.MUS.L07.01": "Compose a melody that moves mostly by steps (next-door notes) with a few leaps, then plan where it starts and ends.",
 "ELEC.MUS.L08.01": "Harmony: notes sounding together, and building a chord by starting on a note and skipping one letter, twice.",
 "ELEC.MUS.L09.01": "Arrange a song: keep the melody, plan the intro, the order of parts and the dynamics (loud and soft).",
 "ELEC.MUS.L10.01": "Scales and intervals on the piano: whole and half steps (no black key between E and F or B and C) and the letter count trick for intervals.",
 "ELEC.MUS.L11.01": "Chords and keys with the skip-a-letter trick for triads, and chords numbered with Roman numerals in a key.",
 "ELEC.MUS.L12.01": "Meter and syncopation: read the time signature, count out loud and clap, and dotted notes that add half their value.",
 "ELEC.MUS.L13.01": "Family Finder for the orchestra: strings, woodwinds, brass and percussion by how the sound starts, smaller instruments higher.",
 "ELEC.MUS.L14.01": "Letter the Parts: label the first idea A and each new idea B, C, then find forms like rondo by what comes back.",
 "ELEC.MUS.L15.01": "Compose with Question and Answer: a 4-bar question phrase and an answer that comes home, moving mostly by steps.",
 "ELEC.MUS.L16.01": "Capstone arranging with the Part Planner: give every player a job (melody, harmony or bass) inside each instrument's range, with dynamics and tempo planned.",
 "ELEC.NUC.L03.01": "Zoom in like a scientist: a smooth beach is really tiny grains of sand, and every grain, the air and even you are built from atoms.",
 "ELEC.NUC.L03.02": "Hidden light Hashem made: feel the warmth from a heater with eyes closed, then see how an X-ray passes through a cheek but stops at teeth.",
 "ELEC.NUC.L03.03": "X-rays as careful helpers: hard bones stop the rays and show white, soft skin lets them pass, and the X-ray helper steps away before it shines.",
 "ELEC.NUC.L04.01": "Forces without touching: a magnet pulls a paper clip, pulls iron and steel but not wood or aluminum, and two poles that are the same push apart.",
 "ELEC.NUC.L04.02": "Follow energy as it changes form, step by step: sunlight heats a black car, and a flashlight turns stored energy into electricity, then light.",
 "ELEC.NUC.L04.03": "Where electricity comes from: a magnet spinning in a coil of wire makes a generator; then the power plant chain from heat to steam to turbine to wires.",
 "ELEC.NUC.L05.01": "Atom Village: open an atom to find the nucleus and electrons around it, then sort each part by two questions: where is it, and what charge?",
 "ELEC.NUC.L05.02": "Build atoms by the rule that names them: count the protons (one is hydrogen, two is helium), add neutrons, and match electrons to protons.",
 "ELEC.NUC.L05.03": "Size and scale by comparison: a million atoms across a dot, and a nucleus like a grain of sand in a large shul, so an atom is mostly empty space.",
 "ELEC.NUC.L06.01": "Read the periodic table like a map: each box gives symbol, name and atomic number, so oxygen, O, number 8, has 8 protons.",
 "ELEC.NUC.L06.02": "Isotope cousins: same protons, different neutrons; add protons and neutrons for the mass number and name it, such as carbon-12 and carbon-13.",
 "ELEC.NUC.L06.03": "The light family in one line from radio waves to gamma rays, with the rule that a shorter wave carries more energy, sorted into ionizing and non-ionizing.",
 "ELEC.NUC.L06.04": "Radiation is natural: granite, radon gas and cosmic rays, compared in millirem with a real yearly dose chart so the numbers mean something.",
 "ELEC.NUC.L07.01": "Nucleus Mountain: an unbalanced nucleus is unstable and decays, giving off radiation, and counting protons shows radon turning into a new element.",
 "ELEC.NUC.L07.02": "Alpha, beta and gamma told apart by what happens to the protons: alpha loses 2, beta gains 1, gamma leaves the number the same.",
 "ELEC.NUC.L07.03": "Stop That Ray: paper stops alpha, thin aluminum stops beta, thick lead or concrete slows gamma; name the ray, then pick the thinnest shield that works.",
 "ELEC.NUC.L07.04": "Half-life as a halving pattern (80, 40, 20, 10) worked out with numbers, plus why one atom is random like popcorn but many atoms are predictable.",
 "ELEC.NUC.L07.05": "Counting clicks with a Geiger counter: measure the background first, count several times, average, then subtract background from the sample.",
 "ELEC.NUC.L08.01": "How much is a dose: everyday doses in millirem (a chest X-ray, a flight across America) and changing millisieverts to millirem by multiplying by 100.",
 "ELEC.NUC.L08.02": "Three safety rules, time, distance and shielding, practiced with numbers: half the time is half the dose, and twice as far is one quarter.",
 "ELEC.NUC.L08.03": "Irradiated or contaminated: rays that pass through and are gone versus radioactive dust that stays, checked by subtracting background clicks.",
 "ELEC.NUC.L08.04": "Radiation at work in medicine: tracer scans follow a radioactive medicine like footprints, and half-life math plans how much is left after 6 and 12 hours.",
 "ELEC.NUC.L09.01": "Power Valley: the pieces after a split weigh a little less, and E = mc² turns that missing mass into energy, found by subtracting before and after.",
 "ELEC.NUC.L09.02": "Fission (a heavy nucleus splits) and fusion (light nuclei join, as in the sun) told apart by one question: did something break apart or join?",
 "ELEC.NUC.L09.03": "The chain reaction, controlled: each split throws out new neutrons, and control rods keep it steady at exactly one more split each round.",
 "ELEC.NUC.L09.04": "Inside a power plant as a giant kettle: fuel makes heat, heat makes steam, steam spins the turbine, the generator makes electricity, cooling towers recycle water.",
 "ELEC.NUC.L09.05": "Compare energy sources fairly on many rows, not one: the strongest case for and against nuclear power, and how often each source runs at full power.",
 "ELEC.NUC.L10.01": "Nuclear notation read step by step: atomic number on the bottom, mass number on top, and neutrons = mass number minus atomic number (uranium-235 has 143).",
 "ELEC.NUC.L10.02": "Balance a decay by keeping two totals equal: alpha takes 4 off the top and 2 off the bottom, beta adds 1 to the bottom; radium-226 becomes radon-222.",
 "ELEC.NUC.L10.03": "Decay chains followed on a chart of nuclides, one alpha or beta step at a time, from radon-222 down toward stable lead.",
 "ELEC.NUC.L10.04": "Half-life math: number of half-lives = time ÷ half-life, then halve once for each, and work backwards to plan a hospital delivery of technetium-99m.",
 "ELEC.NUC.L10.05": "Radon in the home: where it seeps in, how a test kit works, and averaging two basement tests against the action level of 4 pCi/L.",
 "ELEC.NUC.L10.06": "The bombs of 1945 taught as history with care: Einstein's 1939 letter, Hiroshima and Nagasaki in August 1945, and counting the days between events.",
 "ELEC.NUC.L11.01": "Binding energy: a helium nucleus weighs less than its parts, read binding energy per piece from the graph, and multiply to find the total.",
 "ELEC.NUC.L11.02": "Parts of a reactor (fuel, moderator, coolant, control rods and more), and how pressurized and boiling water reactors in the U.S. differ.",
 "ELEC.NUC.L11.03": "Keeping it steady with the multiplication factor k, followed generation by generation from 1000 neutrons, plus temperature feedback as a safety helper.",
 "ELEC.NUC.L11.04": "Accidents and their lessons: Three Mile Island, Chernobyl and Fukushima, each taken in three steps: find the cause, then the lesson, then the fix.",
 "ELEC.NUC.L11.05": "Used fuel and waste: a deep cooling pool, then a sealed dry cask of steel and concrete, and tracking how decay heat falls after shutdown with real percentages.",
 "ELEC.NUC.L12.01": "Detector lab: Geiger counters and other detectors compared, and a net count rate found by subtracting background from a timed sample count.",
 "ELEC.NUC.L12.02": "Distance and shielding math: the inverse-square law and half-value layers, used together in one worked example from 1 meter.",
 "ELEC.NUC.L12.03": "Dose and ALARA: gray versus sievert, the NRC worker limit of 5 rem a year, and planning a valve repair to keep dose as low as reasonably achievable.",
 "ELEC.NUC.L12.04": "Survey a room (simulation): read dose rates at 30 centimeters, then choose the posting the NRC rules require from the highest reading.",
 "ELEC.NUC.L12.05": "Nuclear medicine: how a tracer reaches one organ, why its half-life must be chosen carefully, and decay math to plan a delivery.",
 "ELEC.NUC.L13.01": "Reactor simulator, startup: follow the written procedure step by step and predict power with doubling time.",
 "ELEC.NUC.L13.02": "Reactor simulator, power changes and scram: raise power slowly in small steps, and know when every control rod drops in at once.",
 "ELEC.NUC.L13.03": "Careers in nuclear: real training paths for technicians and reactor operators, compared using Bureau of Labor Statistics data.",
 "ELEC.NUC.L13.04": "Energy decision capstone on a real case (a TVA construction permit): weigh every row fairly, then write a decision paragraph that starts with a clear claim.",
 "ELEC.NUC.L14.01": "Nuclear physics: the Q-value from mass before and after, mass defect, and balancing an alpha decay by rule.",
 "ELEC.NUC.L14.02": "Radiation meets matter: the three ways a photon interacts, how charged particles lose energy, and halving layers to find a shield thickness.",
 "ELEC.NUC.L14.03": "Detection and counting statistics: random decay, detector efficiency, and measuring background first for a fair net count.",
 "ELEC.NUC.L15.01": "Reactor physics: follow one generation of neutrons around the core with the six-factor formula for k.",
 "ELEC.NUC.L15.02": "Reactor kinetics: prompt and delayed neutrons (β = 0.0065 for uranium-235) and the reactor period, used to predict a power rise.",
 "ELEC.NUC.L15.03": "Health physics: absorbed dose in gray and rad, NRC yearly limits, and the inverse-square law to plan a job near a pump.",
 "ELEC.NUC.L16.01": "Heat removal: the heat balance Q = ṁ × c × ΔT solved with real plant numbers, and why decay heat still needs cooling after a scram.",
 "ELEC.NUC.L16.02": "Licensing and safety: the NRC's two-step Part 50 path, defense in depth with many independent layers, and how a license review follows the plant's written safety report.",
 "ELEC.NUC.L16.03": "Simulator operator check: shift turnover, written procedures, checking the automatic systems after a transient, and planning a power change.",
 "ELEC.NUC.L16.04": "Capstone research project: a clear question, real data, a paper in standard order, an oral defense, and reporting the uncertainty of a count.",
 "ELEC.SPEAK.L01.01": "Good listeners look at the person talking, stay quiet until he is done, and use the right voice inside and outside.",
 "ELEC.SPEAK.L01.02": "Question Words (who, what, where, when) to ask about the thing we are learning.",
 "ELEC.SPEAK.L01.03": "Kind words as keys: say please when you ask, thank you when you get, and sorry when you bump or break something, then help fix it.",
 "ELEC.SPEAK.L01.04": "Describing words for color, size and shape: a round red apple tells more than just an apple.",
 "ELEC.SPEAK.L02.01": "Show and Tell in three steps (say what it is, tell one thing about it, say thank you) while standing tall and facing the class.",
 "ELEC.SPEAK.L02.02": "Tell a story in three parts, first, then, last, so the listener can follow, and fix a story that is mixed up.",
 "ELEC.SPEAK.L02.03": "Talk, Listen, Talk: a conversation is like a game of catch, and your turn says something about what he said.",
 "ELEC.SPEAK.L02.04": "Loud, Clear, Slow: a voice the back row can hear without shouting, a calm speed, and a breath between sentences.",
 "ELEC.SPEAK.L03.01": "Speak up clearly to a group: a loud voice, slow words and eyes up at the people, not at the floor.",
 "ELEC.SPEAK.L04.01": "A talk with a beginning, middle and end: say what it is about, give the details in order, and wrap up with a short sum-up.",
 "ELEC.SPEAK.L05.01": "Listening is a skill: eyes on the speaker, wait until the end, find the main idea, then ask a question about what he said.",
 "ELEC.SPEAK.L06.01": "Persuade politely: a claim with reasons, and say what is good in the other side's idea before giving yours.",
 "ELEC.SPEAK.L07.01": "Deliver a Dvar Torah: a question on the parsha, an answer from a real source, a lesson for us, spoken slowly with pauses.",
 "ELEC.SPEAK.L08.01": "Debate: two sides, a judge, and winning with strong reasons and evidence, not a loud voice, including switching sides.",
 "ELEC.SPEAK.L09.01": "Speak to an audience with slides: one idea per slide, big pictures, few words, and about one slide for each minute.",
 "ELEC.SPEAK.L10.01": "Think on your feet with PREP: point, reason, example, point, shown in a worked example on a surprise topic.",
 "ELEC.SPEAK.L11.01": "Debate case and rebuttal: a claim with main ideas, reason and evidence, signposting as you go, and a worked rebuttal.",
 "ELEC.SPEAK.L12.01": "STAR Steps for interviews (for a yeshiva, a program or a job): answer with a short, true story in order.",
 "ELEC.SPEAK.L13.01": "Be a Bridge Builder: explain a hard idea by starting from what the listener knows, worked through on the moon's phases.",
 "ELEC.SPEAK.L14.01": "Run a meeting with a Meeting Map: an agenda, a time for each topic and clear decisions, planned for a class food drive.",
 "ELEC.SPEAK.L15.01": "The Pitch Path for a proposal: the problem, evidence it is real, your plan, what it costs, and a clear call to action.",
 "ELEC.SPEAK.L16.01": "Capstone keynote with the Keynote Blueprint: a hook, a roadmap, three main ideas each with a story, and a close that echoes the hook, about 10 minutes."

 "SCI.L01": "By the end of Level 1 (Kindergarten): A student can use his five senses to look closely, tell living from not living, and say what plants and animals need. He names the parts of a plant, sorts rocks, sand and soil, guesses then tests sink or float, tells a push from a pull, knows day from night and today's weather, and washes his hands the right way.",
 "SCI.L02": "By the end of Level 2 (Grade 1): A student can run a fair test that changes only one thing. He explains that sound is a shake, that light makes shadows and white light holds a rainbow, and that clouds bring rain. He knows how animals are covered and move, how plants drink and catch sunlight, the four seasons, the moon's shapes, and how his bones, heart, food and sleep keep him strong.",
 "SCI.L03": "By the end of Level 3 (Grade 2): A student can measure with a ruler, read a simple map of land and water, and sort materials by their properties. He tests what magnets pull, tells changes that can be undone from ones that cannot, and knows insects, eggs, seeds and soils. He uses the sun's path and shadows to tell time, follows the moon through the Jewish month, and chooses Ha'etz or Ha'adamah.",
 "SCI.L04": "By the end of Level 4 (Grade 3): A student can follow life cycles (butterfly and frog), read a thermometer, put the water cycle in order, and use a ramp test with a table to find a pattern. He explains gravity, friction and simple machines, how leaves make food and change color, why the earth's spin and orbit make days, years and seasons, and how to keep his body, teeth and heart healthy.",
 "SCI.L05": "By the end of Level 5 (Grade 4): A student can explain energy and its forms, build a complete circuit with conductors and insulators, and describe waves and how heat moves. He knows animal senses, migration, the bee dance and the Torah's kosher signs, how lungs, heart, bones and nerves work, minerals and crystals, erosion, pollination, the Seven Species, the sun, the planets, the moon and tides.",
 "SCI.L06": "By the end of Level 6 (Grade 5): A student can trace food chains and webs, sort matter into solids, liquids and gases, separate mixtures, and show that mass is never lost. He explains photosynthesis and the oxygen cycle, why ice floats, where Earth's fresh water is, how digestion, vitamins and water serve the body, star colors, telescopes, finding north, and why the Jewish calendar adds a second Adar."

 "SCI.ANIM.L01.01": "Line animals up from tiny to giant (an ant to a whale), then match each one to its coat: feathers, scales or fur. Hashem made every animal just right.",
 "SCI.ANIM.L02.01": "Animal coats are like our clothes: fur is a warm coat, feathers keep birds dry, scales cover fish and snakes, and a shell is a helmet.",
 "SCI.ANIM.L02.02": "Act out how animals move (hop like a frog, slide like a snake) and match each body part to its job: wings fly, fins swim, four legs run.",
 "SCI.ANIM.L03.01": "Count legs in pairs (2, 4, 6) and look for three body parts like a snowman's three balls: six legs means insect, and eight-legged spiders are not insects.",
 "SCI.ANIM.L03.02": "Egg, chick, bird, like seed, sprout, plant: the mother bird keeps her eggs warm, the chick pecks out and learns to fly, and shiluach hakan teaches kindness to her.",
 "SCI.ANIM.L03.03": "Three winter plans, sleep, travel or save: a bear sleeps, some birds fly to warm places, a squirrel stores food, and we get ready too with coats and a full pantry.",
 "SCI.ANIM.L04.01": "Put the four stages in order (egg, caterpillar, chrysalis, butterfly) and see why it is a cycle: the butterfly lays eggs and it starts again.",
 "SCI.ANIM.L04.02": "Follow a tadpole as it changes: it hatches in water with a tail and gills, grows back legs then front legs, loses its tail, and breathes air as a frog.",
 "SCI.ANIM.L04.03": "Built for the desert, part by part: the hump stores fat (not water), long eyelashes and closing nostrils keep out sand, and wide padded feet do not sink.",
 "SCI.ANIM.L04.04": "Built for the cold: thick fur, a layer of fat and black skin that soaks up heat keep a polar bear warm in the Arctic; penguins in the far south huddle together.",
 "SCI.ANIM.L05.01": "Animal super-senses, each with its example: a bat's echolocation (squeaks and echoes), an owl's dish-shaped face, a dog's nose and an eagle's sharp eyes.",
 "SCI.ANIM.L05.02": "Migration: why birds leave in the fall and return, the Arctic tern's two summers a year, geese flying in a V, and finding the way by the sun, stars and landmarks.",
 "SCI.ANIM.L05.03": "Decode the waggle dance like a map: the straight wiggle shows which way to fly compared to the sun, and a longer waggle means the flowers are farther away.",
 "SCI.ANIM.L05.04": "Sort animals by the Torah's two signs, split hooves and chewing the cud: both signs means kosher, and the camel, shafan, arneves and pig each have only one.",
 "SCI.ANIM.L06.01": "Build a food chain from grass to rabbit to fox: plants are producers that make food from sunlight, animals are consumers, and every chain starts with a plant.",
 "SCI.ANIM.L06.02": "Predator or prey: match hunting tools (sharp eyes, claws, speed) and safety tools (camouflage, shells, spines, herds), and see that one animal can be both.",
 "SCI.ANIM.L06.03": "The cleanup crew: earthworms, mushrooms and bacteria break down fallen leaves and an apple core into rich soil for new plants, so nothing is wasted.",
 "SCI.ANIM.L06.04": "Connect food chains into a food web and ask what if: the sea otter, urchin and kelp story shows that when one kind disappears, many others change.",
 "SCI.BODY.L01.01": "Germs are too tiny to see, so we learn a routine: wet, soap, rub, rinse, dry, singing a short song while we scrub, and always before we eat.",
 "SCI.BODY.L02.01": "Bones are the hard frame that holds us up, like the beams in a house; milk and cheese help build them, and a helmet keeps them safe.",
 "SCI.BODY.L02.02": "The heart is a pump that never stops; squeeze a ball again and again, then feel it beat faster after running, while muscles pull bones to move.",
 "SCI.BODY.L02.03": "Food is fuel, like gas for a car: pick the healthy snack that gives energy to learn, keep treats for sometimes, and say a bracha before we eat.",
 "SCI.BODY.L02.04": "Sleep is charging a battery: children grow while they sleep, a dark, quiet room helps, and the day ends with Shema and begins with Modeh Ani.",
 "SCI.BODY.L03.01": "Light is like a ball that hits and bounces back: it shines on a thing and bounces into our eyes, so no light means no seeing and the moon shines with sunlight.",
 "SCI.BODY.L03.02": "Every sound starts with a shake that shakes the air, spreading like ripples in a pond; hum with a hand on your throat, and learn why a far drum sounds soft.",
 "SCI.BODY.L03.03": "Sniff first, then taste: the tongue tells sweet, salty, sour and bitter, smell adds the rest, a stuffy cold makes soup taste plain, and besamim at Havdalah.",
 "SCI.BODY.L03.04": "Close your eyes and feel: skin tells hot and cold, soft and rough, smooth and sharp, and touch keeps us safe (pull away from a hot pot, blow on hot cocoa first).",
 "SCI.BODY.L04.01": "Sort foods by their job: grains give energy, fruits and vegetables give vitamins, protein foods build muscles, and dairy builds strong bones.",
 "SCI.BODY.L04.02": "Match each kind of tooth to its job (incisors bite, canines tear, molars grind), learn that enamel is the hardest part of the body, and why we brush.",
 "SCI.BODY.L04.03": "Germs are tiny living things that spread from hands to mouths and food; learn when to wash and how to scrub for about 20 seconds, palms to under the nails.",
 "SCI.BODY.L04.04": "The heart is a fist-sized pump: find your pulse, see why running speeds it up, and turn 15 seconds of beats into a minute by multiplying by 4.",
 "SCI.BODY.L05.01": "Follow a breath: in through the nose, down the windpipe into two lungs, oxygen into the blood and carbon dioxide out, with the diaphragm pulling down to draw air in.",
 "SCI.BODY.L05.02": "The heart pumps blood through blood vessels to carry oxygen and food; feel the pulse at the wrist or neck, and multiply beats per minute to find longer times.",
 "SCI.BODY.L05.03": "The skeleton holds us up and guards the brain, heart and lungs; a baby has about 300 bones and a grown-up 206, and joints move like a door hinge or a ball in a cup.",
 "SCI.BODY.L05.04": "The brain is the control center and nerves are wires carrying messages; a reflex, like pulling away from something hot or a knee kick, happens before you think.",
 "SCI.BODY.L06.01": "Follow food on its journey in order: teeth and saliva in the mouth, the esophagus, the churning stomach, the small intestine into the blood, and the large intestine takes back water.",
 "SCI.BODY.L06.02": "Vitamins and minerals through stories and matches: sailors' scurvy cured by vitamin C in lemons, iron in blood carries oxygen, calcium builds bones, and sunlight makes vitamin D.",
 "SCI.BODY.L06.03": "About 60 percent of the body is water: track how we lose it (sweat, breath, restroom), why we feel thirsty, and work out percent of a body weight.",
 "SCI.BODY.L06.04": "Taste buds sense five tastes (sweet, salty, sour, bitter, savory) on every part of the tongue, and much of flavor is really smell, so food tastes dull with a cold.",
 "SCI.EARTH.L01.01": "Look at the sky and name today's weather (sunny, cloudy, rainy, snowy, windy), choose what to wear or bring, and keep a weather chart to spot a pattern.",
 "SCI.EARTH.L01.02": "Who built this home? Birds weave nests, bees make honeycombs, beavers dam a stream into a pond, and people build houses, shuls, yeshivas and gardens.",
 "SCI.EARTH.L02.01": "Watch the sky for patterns that repeat: the sun rises in the east and sets in the west, the moon grows from Rosh Chodesh to full on the 15th, and winter days are short.",
 "SCI.EARTH.L03.01": "Read a map as a view from above: blue is water, green or brown is land; then name river, lake, ocean, island, mountain and valley, and count map symbols.",
 "SCI.EARTH.L03.03": "Snow and ice wonders: look at a snowflake's six sides or arms, see that water spreads out when it freezes so ice floats, and why a lake freezes on top like a blanket over the fish.",
 "SCI.INQ.L01.01": "The five senses as a scientist's tools: match eyes, ears, nose, tongue and hands to what they notice, then describe a thing closely (hard or soft, loud or quiet).",
 "SCI.INQ.L02.01": "Run a fair test: start with a question, change only ONE thing, keep everything else the same, then look, write down and compare to find the answer.",
 "SCI.INQ.L03.01": "Measure like a scientist: line the end up with 0 on the ruler, read where it ends, never mix inches and centimeters, pick the right tool, and record in a table.",
 "SCI.LAND.L01.01": "Sort by feel and size: a hard, heavy rock, a small pebble, tiny bits of sand, and soft dark soil where plants and worms live.",
 "SCI.LAND.L02.01": "Order water from small to big (puddle, pond, lake, sea), see the blue Earth from space, and learn that we drink fresh water, not salty sea water.",
 "SCI.LAND.L02.02": "Breathe on a cold window to make tiny drops like a cloud; then put the steps in order: the sun warms water, drops rise, clouds gather, heavy clouds rain.",
 "SCI.LAND.L02.03": "Make a fist: the knuckles are mountains and the dips are valleys; a hill is smaller than a mountain, rivers run in valleys, and the Torah was given on Har Sinai.",
 "SCI.LAND.L02.04": "Wind is moving air we feel but cannot see: blow on a pinwheel to make wind, then tell a soft breeze from a strong storm by what it moves.",
 "SCI.LAND.L03.01": "Water flows downhill: pour water on a tilted tray, then follow rain and snow from mountain streams into a river and down to the sea, like the Yarden to the Kinneret.",
 "SCI.LAND.L03.02": "The squeeze test: sandy soil is grainy like sugar and drains fast, clay is sticky like dough and holds water, and dark garden soil grows plants best.",
 "SCI.LAND.L04.01": "A thermometer is a ladder: up the rungs is warmer, down is colder; read the top of the liquid, know 0 °C freezes and 100 °C boils, and count up to find the change.",
 "SCI.LAND.L04.02": "The kettle model: steam rises, hits a cold lid and drips, then the four steps in order (evaporation, condensation, precipitation, collection) going around again.",
 "SCI.LAND.L04.03": "Lightning is a giant spark and thunder is the air bursting; light is faster than sound, so count the seconds and divide by 3 for kilometers, and go indoors.",
 "SCI.LAND.L04.04": "Weather is your outfit today, climate is your whole closet: sort places into desert, polar and rainforest, match animals to each, and compare Baltimore's seasons.",
 "SCI.LAND.L05.01": "Test minerals like a scientist with a scratch test (a fingernail scratches soft ones, hard ones scratch glass), and learn that diamond and pencil graphite are both carbon.",
 "SCI.LAND.L05.02": "Look at salt with a magnifying glass to see tiny cubes: crystals have particles in a neat repeating pattern, like six-armed snowflakes and six-sided quartz.",
 "SCI.LAND.L05.03": "The Choshen of the Kohen Gadol as a grid: twelve stones in four rows of three, one shevet engraved on each; meforshim discuss the gems, and pictures use design colors only.",
 "SCI.LAND.L05.04": "Erosion step by step: rain and rivers wear away rock, fast water carries more sand, slow water drops it and builds a delta, and plant roots hold soil in place.",
 "SCI.LAND.L06.01": "Oceans by numbers: about 7 of every 10 parts of the surface, a deepest spot about 11 km down compared with Everest's 9 km, salty and full of life.",
 "SCI.LAND.L06.02": "Where Earth's water is, part by part: 97 of 100 parts salty, most fresh water frozen, less than 1 part easy to use, and why rain from the salty sea is fresh.",
 "SCI.LAND.L06.03": "Groundwater soaks into the spaces between sand, gravel and rock; a well dug below the water table fills, a dry time can empty it, and Yitzchak reopened his father's wells.",
 "SCI.LAND.L06.04": "Bal tashchis from the fruit-tree pasuk: using things is fine but wasting them for nothing is not, applied to food, clothes, water and toys, with Chazal on Gan Eden.",
 "SCI.LIFE.L01.01": "Alive or not alive? Living things grow and need things: plants need water, sunlight and air; animals need food, water, air and a safe home; rocks and toys need nothing.",
 "SCI.LIFE.L02.01": "Every part has a job: roots drink and hold, the stem holds up, leaves catch sunlight, a duck's webbed feet paddle, and a turtle's shell inspired the bike helmet.",
 "SCI.LIFE.L02.02": "Match young to parent (puppy and dog, chick and hen), notice that young look like their parents but not exactly the same, and how parents care for them.",
 "SCI.LIFE.L03.01": "Helpers that move seeds and pollen: a bee carries yellow pollen from flower to flower, burrs cling to fur, birds drop berry seeds, and squirrels forget acorns.",
 "SCI.LIFE.L03.02": "Match living things to their habitat (cactus to desert, polar bear to the Arctic, whales and seaweed to the ocean) and count the different kinds in a pond.",
 "SCI.MATT.L01.01": "Guess first, then drop it in: wood and leaves float, rocks and keys sink, and Noach's Teivah shows that big things can float too.",
 "SCI.MATT.L02.01": "White light is many colors mixed together: a prism or raindrops split sunlight into a rainbow, a hose on a sunny day can make one, and we say a bracha on a rainbow.",
 "SCI.MATT.L03.01": "Guess, test and sort: a magnet pulls iron and steel but not wood, plastic or glass (not all metal), and two same ends push apart while N and S pull together.",
 "SCI.MATT.L04.01": "Gravity pulls things down toward the earth: it keeps us on the ground, water in the oceans and the moon going around, and on the moon you weigh about one sixth.",
 "SCI.MATT.L04.02": "Rub your hands to feel friction: it slows things when surfaces rub, rough carpet makes lots and smooth ice makes little, as with sneaker soles, sand on ice and brakes.",
 "SCI.MATT.L04.03": "Name the simple machine in everyday things: a seesaw is a lever on a fulcrum, a ramp means less push, a wagon rolls on a wheel and axle, and a pulley lifts with a rope.",
 "SCI.MATT.L04.04": "A fair test with a ramp: change only the height, keep the same car, floor and start, measure each roll in a table, find the pattern, and test more than once.",
 "SCI.MATT.L05.01": "Energy is what makes things happen: name its forms (light, heat, motion, sound, electricity, stored in food and fuel) and trace how one changes into another.",
 "SCI.MATT.L05.02": "Trace the loop: electricity flows only in a complete circuit, a gap or switch stops it, metals are conductors, plastic, rubber and wood are insulators, and outlets are not toys.",
 "SCI.MATT.L05.03": "Drop a stone in a pond to see a wave carry energy; sound and light both travel as waves, light far faster, and sound cannot travel where there is no air.",
 "SCI.MATT.L05.04": "Heat always moves from warmer to cooler; insulators like wool, foam and trapped air slow it, which explains coats, pot handles and how a thermos keeps drinks hot or cold.",
 "SCI.MATT.L06.01": "Sort matter into solid, liquid and gas by what the particles do: packed and wiggling in place, sliding past each other, or zooming far apart.",
 "SCI.MATT.L06.02": "Mix it, then separate it: a magnet pulls iron from sand, a filter takes sand from water, and evaporating salt water leaves the dissolved salt behind.",
 "SCI.MATT.L06.03": "Weigh before and after: melted ice in a sealed bag and sugar stirred into water keep the same mass, so matter changes form but nothing is lost.",
 "SCI.MATT.L06.04": "Water is different: it grows about one tenth bigger when it freezes, so ice floats, bottles and pipes can burst, and lakes freeze from the top so fish live below.",
 "SCI.PHYS.L01.01": "Sun and shade: sunlight warms what it touches, shade from a tree or roof stays cooler, and a dark thing warms up faster than a light one.",
 "SCI.PHYS.L01.02": "Act it out: a push moves something away, a pull brings it toward you, and a big push or small push changes how fast and far it goes.",
 "SCI.PHYS.L02.01": "Every sound is a shake: hum with a hand on your throat, pluck a string, then learn that a big shake is loud, a small shake is soft, and no shake means no sound.",
 "SCI.PHYS.L02.02": "Shine a light on things and sort them: clear lets light through, wax paper lets some through, wood blocks it and makes a shadow on the side away from the light.",
 "SCI.PHYS.L03.01": "Material detective: name the material, list its properties (hard or soft, bendy or stiff, soaks up or waterproof), and choose the right one for the job.",
 "SCI.PHYS.L03.02": "Heating and cooling change things: ice melts and freezes back, chocolate hardens again, but a cooked egg or baked challah can never be undone.",
 "SCI.PLANT.L01.01": "Name the four parts with a body picture: roots are feet under the ground, the stem holds it up, leaves catch the sun, and the flower makes seeds.",
 "SCI.PLANT.L02.01": "The stem is a straw: roots soak up water, it travels up the stem to every leaf, shown by a white flower turning blue in blue water; a droopy plant needs a drink.",
 "SCI.PLANT.L02.02": "Leaves are the plant's kitchen and little solar panels: they catch sunlight to make food, so a plant leans to the window and grows weak in the dark.",
 "SCI.PLANT.L02.03": "Follow the circle: a flower visited by bees grows into a fruit, the fruit holds seeds, and a seed grows a new tree; fruit from a tree gets Ha'eitz.",
 "SCI.PLANT.L02.04": "A tree through four seasons: buds in spring, full green leaves in summer, orange leaves that drop in fall, and a bare tree resting (not dead) in winter; Tu B'Shvat too.",
 "SCI.PLANT.L03.01": "Seeds travel because plants cannot walk: sort each seed by its ride, wings and fluff fly on the wind, hooks stick to fur, and round shells float.",
 "SCI.PLANT.L03.02": "Root down, shoot up, like an anchor and a flag: water and warmth wake the tiny plant inside a seed; plant a bean in a clear cup to watch the stages in order.",
 "SCI.PLANT.L03.03": "Ask where it grows: a tree that lives year after year means Ha'etz, from the ground means Ha'adamah (etz = tree, adamah = ground); not sure, ask your rebbe.",
 "SCI.PLANT.L04.01": "A leaf is a food factory: it needs sunlight, water from the roots and air through tiny holes, makes sugar for the plant, and gives off oxygen we breathe.",
 "SCI.PLANT.L04.02": "Why leaves change: in summer the green hides other colors; as fall days get shorter and colder the tree stops making green, the yellow and orange show, then leaves drop.",
 "SCI.PLANT.L04.03": "Read a tree stump: count the rings from the middle out to the bark to find its age, and read wide rings as rainy years and thin rings as dry years.",
 "SCI.PLANT.L04.04": "The Torah's mitzvos for growing in Eretz Yisrael (bikkurim, orlah, kilayim, shemitah) taught as rules to match and count, showing the land and its fruit belong to Hashem.",
 "SCI.PLANT.L05.01": "Pollination: pollen must move from flower to flower to make seeds, carried by bees, butterflies, birds or wind, and bright colors, sweet smells and nectar guides invite them.",
 "SCI.PLANT.L05.02": "Plants move without walking: stems bend toward the light, roots grow down, a mimosa folds its leaves when touched, and a Venus flytrap snaps after two touches.",
 "SCI.PLANT.L05.03": "Giant redwoods by comparison: taller than a 30-story building, with water pulled up through tiny tubes from root to top, and thick spongy bark against fire.",
 "SCI.PLANT.L05.04": "The Shivas HaMinim the Torah praises (wheat, barley, grapes, figs, pomegranates, olives, dates): sort them by where they grow, with date honey as the pasuk's honey.",
 "SCI.PLANT.L06.01": "Photosynthesis from sunlight, water and carbon dioxide, proven by the willow tree that gained about 74 kg while its soil lost only about 57 g: built from water and air.",
 "SCI.PLANT.L06.02": "Leaves up close under a microscope: stomata on the underside let carbon dioxide in and oxygen and water vapor out, and guard cells close them on hot, dry days.",
 "SCI.PLANT.L06.03": "The oxygen and carbon dioxide cycle between plants and people, shown by the old candle-in-a-jar test: the candle went out, but with a mint plant in the jar for some days a candle could burn again.",
 "SCI.PLANT.L06.04": "Wheat from seed to bread in order (grow, harvest, thresh, grind, knead, bake), with one grain giving dozens, multiplied out, and Hamotzi on bread.",
 "SCI.SKY.L01.01": "Bright sky with the sun means day; a dark sky with the moon and stars means night, tied to Modeh Ani in the morning and Shema at night.",
 "SCI.SKY.L02.01": "Shine a flashlight on a ball and walk around it: the moon has no light of its own, so we see thin, half, full and back again, starting at Rosh Chodesh.",
 "SCI.SKY.L02.02": "A far plane looks like a dot, and stars are much farther: stars are giant suns, the sun is the closest star, and Hashem counts every star by name.",
 "SCI.SKY.L02.03": "The seasons go around like a wheel (spring, summer, fall, winter), matched to clues like snow or blossoms, with Pesach in spring and Sukkos in fall.",
 "SCI.SKY.L03.01": "The sun's path like a ball thrown high, up, over and down: it rises in the east, is high at midday and sets in the west, because the Earth spins.",
 "SCI.SKY.L03.02": "A shadow clock: hold a flashlight low for a giant shadow and high for a tiny one, so long shadows mean morning or evening and short ones mean midday.",
 "SCI.SKY.L03.03": "Our months follow the moon: thin and new on Rosh Chodesh, growing each night like a cookie, and full on day 15, so Pesach and Sukkos nights are bright.",
 "SCI.SKY.L03.04": "A flashlight at noon is hard to see but still on: stars shine day and night, the bright sun hides them, and they appear when it gets dark.",
 "SCI.SKY.L04.01": "Turn a ball slowly near a lamp: the earth spins once in 24 hours, the side facing the sun has day, and the sun only seems to rise in the east and set in the west.",
 "SCI.SKY.L04.02": "Walk around a chair (the sun) while turning: each turn is a day, one full orbit is about 365 days, a year, and the four seasons fit in one trip.",
 "SCI.SKY.L04.03": "Walk a ball around a lamp: the sun always lights half the moon, and as it circles the earth we see sliver, half and full, Rosh Chodesh to the 15th.",
 "SCI.SKY.L04.04": "Walk around a lamp facing outward to see why each season has its own stars: Kesil (Orion) with its three-star belt fills winter evenings; stars help with seasons and directions, not the future.",
 "SCI.SKY.L05.01": "The sun is a star that looks big only because it is close: about 109 Earths fit across it, and its light takes about 8 minutes to reach us.",
 "SCI.SKY.L05.02": "Sort the eight planets into four small rocky ones and four gas giants, learn Saturn's rings and red Mars, and that planets shine with reflected sunlight like the moon.",
 "SCI.SKY.L05.03": "The moon up close: no air or water, so no wind or rain, craters from space rocks, and astronauts' footprints still there; why you would need air and a radio.",
 "SCI.SKY.L05.04": "The moon's gravity pulls the oceans into bulges, and as the earth turns, beaches pass through them: high tide, low tide, about two of each a day.",
 "SCI.SKY.L06.01": "A lens bends light: a magnifying glass makes things bigger, a telescope gathers far more light than the eye to show faint stars, and Galileo saw Jupiter's 4 moons.",
 "SCI.SKY.L06.02": "A star's color is its temperature: blue-white is hottest, red is coolest, and our yellow sun is in the middle, compared with the hottest part of a gas flame.",
 "SCI.SKY.L06.03": "Find north at night: the pointer stars of the Big Dipper lead to the North Star, which stays almost still; face it and east is right, west left, south behind.",
 "SCI.SKY.L06.04": "Why the calendar adds a second Adar: 12 moon months are about 354 days, the sun's year about 365, so the moon year is about 11 days short and Pesach must stay in spring."
};

</script>
