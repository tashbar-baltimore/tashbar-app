    "READ.COMP.L07.05":{"band": "M68", "pic": "🕵️", "today": "Tell what is said outright from what is only hinted", "why": "Authors do not tell you everything. The best part of a story is often the part you figure out yourself.", "ready": [{"q": "\"Avi's cheeks were red, and he was breathing hard.\" Which is said outright?", "o": ["Avi was breathing hard.", "Avi had been running.", "Avi was scared."], "a": "Avi was breathing hard."}], "bridge": "READ.COMP.L06.07", "bridgeName": "Two Clues, One Inference", "watch": {"q": "After Twenty Years", "m": {"type": "scene", "e": "🔥", "t": "\"The man in the doorway struck a match to look at his watch. The light showed a pale, square-jawed face with keen eyes, and a little white scar near his right eyebrow.\""}, "steps": [{"t": "Said outright first: he struck a match, and we see his face and a scar."}, {"t": "I can point to those words. Nobody can argue with them."}, {"t": "Now the hint: why does the author light up his face so clearly?"}, {"t": "Clue plus what I know: a policeman is standing right there, and police learn faces."}, {"t": "Inferred: the policeman may know this face. I hold that idea and check it at the end."}, {"t": "Teach it back: tell your chavrusa one fact said outright and one inference."}], "a": "Said outright: the scar. Inferred: the policeman may know his face."}, "oops": {"q": "Bob has a diamond pin and a diamond watch. Is \"Bob is rich\" said outright?", "wrong": "Yes, it is right there", "right": "No, it is inferred from the diamonds", "why": "The word rich is not in the text. You joined the diamonds to what you know."}, "ways": ["worked example", "read the whole story", "Mistake Detective", "find the proof", "tap the reason", "teach it back"], "done": "You can tell said outright, inferred and not supported apart!", "board": {"one": "Said outright: point to the words. Inferred: clue + what I know. Not supported: no words, no clues.", "activity": "Three columns on the board. Read one paragraph of \"After Twenty Years\" aloud. Boys call out statements about Bob; the class votes on the column and proves it.", "mistakes": ["Calling an inference \"said outright\" because it feels obvious", "Calling a wild guess an inference", "Forgetting to name the clue"]}, "do": [{"type": "read", "text": "C68.ST6.01", "say": "Read \"After Twenty Years\" to the very end.", "how": "Notice what the author tells you, and what he only hints."}, {"type": "sort", "mis": true, "bins": ["Said outright", "Inferred", "Not supported"], "cards": [["The restaurant was torn down five years ago.", 0], ["Bob looks down on Jimmy a little.", 1], ["Bob owns a ranch out West.", 2], ["Bob came a thousand miles to be there.", 0], ["Jimmy felt torn about his old friend.", 1]], "say": "Watch the trap! Said, inferred, or not supported?", "how": "Can you point to the exact words? Then it is said outright."}], "your": [{"type": "proof", "text": "C68.ST6.01", "q": "Which sentence says OUTRIGHT how Jimmy knew Bob?", "proof": "I saw it was the face of the man wanted in Chicago", "look": "the words in Jimmy's note", "say": "Find where the story says it outright.", "how": "Read Jimmy's note on the last page."}, {"type": "evidence", "q": "Which line only HINTS that Bob did not get rich honestly?", "p": ["\"You see, the West is a pretty big place.\"", "\"It was exactly ten o'clock when we parted.\"", "\"I've had to compete with some of the sharpest wits going to get my pile.\""], "a": 2, "look": "a line about HOW he got his money", "say": "Tap the line with the hint.", "how": "Which line is about how he made his money?"}, {"type": "match", "pairs": [["said outright", "you can point to the exact words"], ["inferred", "a clue plus what you know"], ["not supported", "no words and no clues"]], "say": "Match each kind of answer to its test.", "how": "Ask: words, clues, or nothing?"}, {"type": "listen", "hear": "A tall man, with the collar turned up to his ears, hurried across and asked, doubtfully, \"Is that you, Bob?\"", "o": ["he is hiding his face and is not sure of Bob", "he is cold and in a hurry to get home", "he is lost and looking for the drug store"], "a": "he is hiding his face and is not sure of Bob", "cap": "What can you infer from BOTH clues?", "say": "Listen. What do both clues hint?", "how": "Collar up AND \"doubtfully\". What do they hint together?"}, {"type": "cloze", "t": "\"Bob had a sister in Ohio.\" The story has no words and no clues about it, so it is ___.", "o": ["not supported", "said outright", "inferred"], "a": "not supported", "say": "Challenge! Tap the words that fit.", "how": "No words, no clues: what kind is it?"}]},
    "READ.COMP.L07.06":{"band": "M68", "pic": "🪜", "today": "Make an inference, then explain the clue and what you know", "why": "Anyone can guess. A strong reader can show the steps of his thinking, so others can check it.", "ready": [{"q": "Clue: Chaim's coat is dripping. What can you infer?", "o": ["it is raining outside", "Chaim is hungry", "Chaim is late"], "a": "it is raining outside"}], "bridge": "READ.COMP.L06.07", "bridgeName": "Two Clues, One Inference", "watch": {"q": "The Long Way Home", "m": {"type": "scene", "e": "🪜", "t": "\"He stopped on the top step and looked down for a long moment, holding the cold metal rail with both hands, before he took the first step.\""}, "steps": [{"t": "Bottom rung, the clue: he holds the rail with both hands and looks down a long time."}, {"t": "Next rung, what I know: people grip a rail when they cannot see the steps well."}, {"t": "Top rung, the inference: Mr. Weiss cannot see well in the dark."}, {"t": "Check it: the big-letter siddur and the page he asks for twice fit too."}, {"t": "Say it in one line: the clue is..., I know..., so I infer..."}, {"t": "Teach it back: climb the ladder out loud for your chavrusa."}], "a": "The clue is the rail, I know people grip rails when they cannot see, so I infer his eyes are weak."}, "oops": {"q": "\"Mr. Weiss stopped staying because he does not like herring anymore.\" An inference?", "wrong": "Yes, it explains why he left", "right": "No, there is no clue for it", "why": "An inference stands on a clue from the text. Nothing in the story points to the herring."}, "ways": ["inference ladder", "read the whole story", "Mistake Detective", "find the proof", "tap the reason", "teach it back"], "done": "You can make an inference and explain every step of it!", "board": {"one": "Clue (from the text) + what I know (from life) = inference. Then check it against the rest.", "activity": "Draw a three-rung ladder. Give one clue from the story; pairs of boys fill the \"what I know\" rung and the inference, then read their ladder to another pair, who must find a second clue that fits.", "mistakes": ["Giving an inference with no clue", "Using a clue but skipping the \"what I know\" step", "Not checking the inference against the rest of the story"]}, "do": [{"type": "read", "text": "C68.ST6.02", "say": "Read \"The Long Way Home\" to the end.", "how": "Watch what Natan notices about Mr. Weiss."}, {"type": "storymap", "slots": ["Clue from the text", "What I know", "Inference"], "cards": ["His siddur has very big letters.", "Big letters help people who see poorly.", "Mr. Weiss cannot see well."], "extra": ["Mr. Weiss is grumpy."], "say": "Build the inference ladder.", "how": "Clue from the story, then what you know, then the inference."}], "your": [{"type": "evidence", "mis": true, "q": "Natan infers that Mr. Weiss cannot see well. Which detail is NOT a clue for it?", "p": ["He leaned close and asked the man next to him to repeat the page number.", "He had a small white beard and a gray hat with a soft brim.", "He walked home very slowly, close to the houses."], "a": 1, "look": "a detail that says nothing about his eyes", "say": "Watch the trap! Which detail is not a clue?", "how": "True is not enough. Does it say anything about seeing?"}, {"type": "sort", "bins": ["Clue from the text", "What I already know"], "cards": [["He walks home close to the houses.", 0], ["Older eyes need more light to see well.", 1], ["People who see poorly stay near walls.", 1], ["He stands by the side door, near the street.", 0]], "say": "Clue from the story, or what you know?", "how": "Is it in the story, or in your head?"}, {"type": "proof", "text": "C68.ST6.02", "q": "Which sentence shows Natan's inference was right?", "proof": "If someone could walk me home after", "look": "what Mr. Weiss says at his door", "say": "Find the proof that Natan was right.", "how": "Read what Mr. Weiss says on the last page."}, {"type": "listen", "hear": "Every morning this week, Shmuli has come to class with wet hair and his shirt untucked, just as the bell rings.", "o": ["his mornings are rushed", "he went swimming", "he does not like school"], "a": "his mornings are rushed", "cap": "Which inference has the clues behind it?", "say": "Listen. Tap the inference the clues support.", "how": "Wet hair, untucked, just in time. What do you know?"}, {"type": "order", "steps": ["The clue is the long look down the dark steps.", "I know people pause when they cannot see where to step.", "So I infer he cannot see well in the dark.", "The walk close to the houses fits too."], "say": "Challenge! Put Natan's explanation in order.", "how": "Clue, what I know, inference, then check."}]},
    "READ.COMP.L07.07":{"band": "M68", "pic": "🎯", "today": "Pick the quote that proves the whole answer best", "why": "Many quotes are connected to an answer. Only one proves it best. Finding it is what makes an argument win.", "ready": [{"q": "Claim: \"The soup was very hot.\" Which line proves it?", "o": ["Steam rose from the bowl, and Dovi blew on every spoonful.", "The soup had carrots in it.", "Mommy made soup on Friday."], "a": "Steam rose from the bowl, and Dovi blew on every spoonful."}], "bridge": "READ.COMP.L06.08", "bridgeName": "Strongest Evidence", "watch": {"q": "The Light After Minchah", "m": {"type": "scene", "e": "🎯", "t": "Claim: Eli learns not to accuse without proof. \"Eli was very quiet.\" / \"His keys don't even fit.\" / \"What if I had said it out loud in the lunchroom? Half the yeshiva would think he was a thief by Minchah.\""}, "steps": [{"t": "Split the claim: Eli LEARNS something, about accusing without proof."}, {"t": "\"Eli was very quiet.\" It shows a feeling, but not what he learned. Cross it out."}, {"t": "\"His keys don't even fit.\" That is a fact about the keys, not about Eli. Cross it out."}, {"t": "\"What if I had said it out loud in the lunchroom?\" Here he sees the harm a guess can do."}, {"t": "Best quote: the lunchroom line. It shows the whole claim."}, {"t": "Teach it back: tell your chavrusa why the other two quotes lose."}], "a": "The lunchroom quote proves the whole claim."}, "oops": {"q": "Claim: Akiva is fair. Best quote?", "wrong": "\"Akiva Feldman, the editor, called it the office.\"", "right": "\"Put a man's name next to the word stole, and that is not a guess anymore.\"", "why": "The first is true but says nothing about fairness. The second shows him protecting a man from a wrong accusation."}, "ways": ["worked example", "split the claim", "Mistake Detective", "find the proof", "tap the reason", "challenge round", "teach it back"], "done": "You can pick the quote that proves the whole answer best!", "board": {"one": "Best quote: on the claim, the whole claim, and specific. Split a two-part claim and prove each part.", "activity": "Write one claim and five quotes on the board. Boys cross out quotes one at a time, giving a reason each time (\"off the claim\", \"only half\", \"only opinion\"), until one is left.", "mistakes": ["Choosing the longest or most exciting quote", "Proving only one half of a two-part claim", "Using a character's opinion as proof of what happened"]}, "do": [{"type": "evidence", "q": "Claim: Mr. Dahan respects the rule about the archive. Which quote proves it best?", "p": ["\"I know every pipe down here by its first name.\"", "\"So it stays locked.\"", "\"Old buildings have their secrets.\""], "a": 1, "look": "what he does once he hears the rule", "say": "Tap the quote that proves the claim best.", "how": "Which quote shows him following the rule?"}, {"type": "sort", "mis": true, "bins": ["Proves part 1: he notices", "Proves part 2: he is honest", "Proves neither"], "cards": [["He crouched down and held the flashlight low.", 0], ["\"It is what the dust tells me. It is not a fact.\"", 1], ["Gavriel had brought his camera.", 2], ["\"Not yet,\" Gavriel admitted.", 1]], "say": "Watch the trap! Two parts, two proofs.", "how": "Claim: Gavriel notices things AND is honest. Which part does each prove?"}], "your": [{"type": "proof", "text": "C68.W1.03", "q": "Which sentence best proves the founder was proud of his key?", "proof": "as if he were proud of it", "look": "how Rabbi Brandt holds the key in the photo", "say": "Find the best proof in Chapter 3.", "how": "Read the page with the old photograph."}, {"type": "listen", "hear": "Claim: Yoni knows how to get people talking. Proof: Yoni did not come with a list of hard questions. He came with two cups of hot tea.", "o": ["it shows what he does to make people comfortable", "it is the longest line in the chapter", "it tells us Yoni likes tea"], "a": "it shows what he does to make people comfortable", "cap": "Why is this the best proof?", "say": "Listen. Tap why this proof is best.", "how": "Does the proof SHOW the claim, or something else?"}, {"type": "match", "pairs": [["Benny keeps his clue to himself", "\"So he said nothing at all.\""], ["The drawer was cleared on purpose", "\"The drawers below it were full and dusty.\""], ["The room had been shut a long time", "\"thick enough to write your name in\""]], "say": "Match each claim to its best quote.", "how": "Which quote shows exactly that claim?"}, {"type": "cloze", "t": "\"Eli was very quiet\" shows a feeling. For the claim \"Eli learned not to accuse,\" it is ___ proof.", "o": ["weak", "the best", "false"], "a": "weak", "say": "Tap the word that fits.", "how": "Does it show what he LEARNED?"}, {"type": "evidence", "q": "Claim: Akiva wants the truth AND wants to be kind. Which quote proves BOTH?", "p": ["\"We are not going to accuse anyone. We are going to watch, and we are going to learn.\"", "\"Rule of the newsroom.\"", "\"It is going to be the most careful issue we ever printed.\""], "a": 0, "look": "a line with both truth and kindness in it", "say": "Challenge! Tap the quote that proves both parts.", "how": "Find the line that seeks the truth without hurting anyone."}]},
    "READ.COMP.L07.08":{"band": "M68", "pic": "🔍", "today": "Reread one paragraph to catch what a quick read missed", "why": "Authors hide their best clues in plain sight. A second, slow read finds them.", "ready": [{"q": "You finished a story and the ending surprised you. What helps you see how it happened?", "o": ["reread the important part slowly", "start a new story", "read only the title again"], "a": "reread the important part slowly"}], "bridge": "READ.COMP.L07.05", "bridgeName": "Said or Hinted?", "watch": {"q": "After Twenty Years", "m": {"type": "scene", "e": "🔥", "t": "\"Is that you, Bob?\" he asked, doubtfully. ... \"You've changed lots, Jimmy. I never thought you were so tall by two or three inches.\" \"Oh, I grew a bit after I was twenty.\""}, "steps": [{"t": "First read: two old friends meet. Bob says Jimmy looks taller."}, {"t": "Now reread slowly. Why does the tall man ask \"doubtfully\"? A true friend would be sure."}, {"t": "Why does Bob notice the height? Because this man is NOT Jimmy."}, {"t": "The author hid the clue inside a friendly joke, so we laugh and miss it."}, {"t": "Close reading: one paragraph, slowly, asking why each detail is there."}, {"t": "Teach it back: show your chavrusa the two clues you missed."}], "a": "\"Doubtfully\" and \"so tall\" were clues the man was not Jimmy."}, "oops": {"q": "Is reading the whole story again, fast, a close reading?", "wrong": "Yes, any second read counts", "right": "No: one paragraph, slowly, every detail", "why": "A fast reread only shows what happens again. Close reading slows down to see how."}, "ways": ["worked example", "reread one paragraph", "Mistake Detective", "find the proof", "tap the reason", "chavrusa", "teach it back"], "done": "You can reread one paragraph and catch what a quick read missed!", "board": {"one": "Close reading: one paragraph, slowly. Ask of each detail: why this word, why here?", "activity": "Project one paragraph of \"After Twenty Years\". Read it once together. Then each chavrusa pair underlines one detail they missed, and explains to the class what it shows once you know the ending.", "mistakes": ["Rereading everything fast instead of one part slowly", "Noticing a detail but not asking why it is there", "\"Noticing\" something that is not in the text"]}, "do": [{"type": "evidence", "q": "Reread: \"When you struck the match to look at your watch, I saw it was the face of the man wanted in Chicago.\" Which earlier sentence set this up?", "p": ["\"The man in the doorway struck a match to look at his watch.\"", "\"There was now a fine, cold drizzle falling.\"", "\"The few people on the street hurried along.\""], "a": 0, "look": "an earlier sentence with the same action", "say": "Tap the sentence the ending points back to.", "how": "Find the earlier moment with the match."}, {"type": "sort", "mis": true, "bins": ["Close reading", "Not close reading"], "cards": [["Reread the match paragraph slowly.", 0], ["Read the whole story again, fast.", 1], ["Ask why the man spoke \"doubtfully\".", 0], ["Skip to the note at the end.", 1]], "say": "Watch the trap! Which ones are close reading?", "how": "Close reading is one part, slowly, asking why."}], "your": [{"type": "proof", "text": "C68.ST6.01", "q": "Reread the drug-store moment. Which sentence shows Bob catching the trick?", "proof": "not long enough to change a man's nose from a Roman to a pug", "look": "what Bob notices in the bright light", "say": "Find the moment Bob sees the truth.", "how": "Reread the paragraph with the bright lights."}, {"type": "listen", "hear": "His hand was steady when he began to read, but it trembled a little by the time he had finished.", "o": ["the note shook Bob, even though he is a hard man", "Bob was cold from the rain", "the paper was heavy"], "a": "the note shook Bob, even though he is a hard man", "cap": "Why does the author show the hand change?", "say": "Listen. Tap why the author shows his hand.", "how": "Steady, then trembling. What changed inside Bob?"}, {"type": "match", "pairs": [["\"doubtfully\"", "the man is not sure who Bob is"], ["\"sunk in his overcoat\"", "he is hiding his face"], ["\"a little white scar\"", "a mark police could know"]], "say": "Match each detail to what it shows.", "how": "Reread each detail. Why is it there?"}, {"type": "cloze", "t": "Bob calls Jimmy a \"plodder.\" On a second read, the plodder is the one who ___ him.", "o": ["caught", "praised", "forgot"], "a": "caught", "say": "Tap the word that fits.", "how": "Who wins at the end, the fast talker or the plodder?"}, {"type": "order", "steps": ["Bob strikes a match.", "The policeman sees his face.", "The policeman walks on.", "A tall man comes, collar up.", "Bob reads Jimmy's note."], "say": "Challenge! Order the clues as the story gives them.", "how": "Reread from the match to the note."}]},
    "READ.FLU.L07.02":{"band": "M68", "pic": "🎭", "today": "Read dialogue so each speaker sounds like himself", "why": "Stories are full of people talking. When your voice shows who is speaking, the scene comes alive.", "ready": [{"q": "Which line should sound excited?", "o": ["\"We won the game!\"", "\"Please pass the salt.\"", "\"It is Tuesday.\""], "a": "\"We won the game!\""}], "bridge": "READ.FLU.L06.02", "bridgeName": "Who Is Talking?", "watch": {"q": "Proved and Guessed (a scene)", "m": {"type": "scene", "e": "🎭", "t": "ELI: (throwing up his hands) Who borrows a whole drawer?\nAKIVA: I don't know yet. That is why it is on the right side.\nGAVRIEL: (slowly, choosing each word) So someone has been walking there for a while."}, "steps": [{"t": "First, the names: Eli, Akiva, Gavriel. I do not read them aloud."}, {"t": "Eli throws up his hands. I read his line loud and fast, rising at the question."}, {"t": "Akiva has no direction, so I use who he is: calm and firm."}, {"t": "Gavriel chooses each word. I slow down and leave small pauses."}, {"t": "Three boys, three voices. Now the listener knows who is talking without names."}, {"t": "Teach it back: read one line to your chavrusa. Can he guess who?"}], "a": "Eli loud and fast, Akiva calm, Gavriel slow and quiet."}, "oops": {"q": "Should you say \"Eli\" before Eli's line?", "wrong": "Yes, so people know who is talking", "right": "No, change your voice instead", "why": "The voice shows who is speaking. The name is only a sign for the reader."}, "ways": ["read it 3 times", "listen to a model", "Readers' Theatre", "Mistake Detective", "tap the reason", "teach it back"], "done": "You can read a scene so every speaker sounds like himself!", "board": {"one": "Names and ( ) are not read aloud. The ( ) shapes the voice. Each speaker sounds like who he is.", "activity": "Readers' Theatre: four boys take Akiva, Eli, Gavriel and the narrator. They read the scene twice, switching parts the second time. The class guesses who is speaking with eyes closed.", "mistakes": ["Reading the speaker's name aloud", "Reading the stage direction aloud", "Reading every speaker in the same voice"]}, "do": [{"type": "read", "text": "C68.FL6.01", "say": "Read the scene 3 times: listen, read along, read alone.", "how": "Tap the speaker to hear it first. Then read with it. Then alone."}, {"type": "sort", "mis": true, "bins": ["Read it aloud", "Do not read it aloud"], "cards": [["AKIVA:", 1], ["Can we prove it?", 0], ["(impatient)", 1], ["Weeks, maybe. Again and again.", 0]], "say": "Watch the trap! What do you say out loud?", "how": "Names and ( ) guide your voice. You do not say them."}], "your": [{"type": "match", "pairs": [["(groaning)", "low and tired"], ["(honestly)", "plain and sincere"], ["(to himself, very softly)", "almost a whisper"]], "say": "Match each direction to its voice.", "how": "Act the words in ( ) with your voice."}, {"type": "evidence", "q": "Which line should be read the most slowly?", "p": ["ELI: (impatient) So?", "GAVRIEL: (slowly, choosing each word) So someone has been walking there for a while.", "ELI: (writing fast, excited) Someone stole the files!"], "a": 1, "look": "a direction about speed", "say": "Tap the line to read most slowly.", "how": "Find the stage direction that talks about speed."}, {"type": "listen", "hear": "Not yet. It is what the dust tells me. It is not a fact.", "o": ["Gavriel, honest and slow", "Eli, loud and impatient", "Akiva, firm and friendly"], "a": "Gavriel, honest and slow", "cap": "Who is speaking, and how?", "say": "Listen to the line. Who says it?", "how": "Whose line is it in the scene? How does he feel?"}, {"type": "cloze", "t": "AKIVA: Your math teacher is a wise man. No direction here, so Akiva should sound ___.", "o": ["calm and firm", "loud and wild", "sleepy and slow"], "a": "calm and firm", "say": "No direction. Use who he is.", "how": "What kind of boy is Akiva, the editor?"}, {"type": "order", "steps": ["Find who is speaking: Eli.", "Read the direction: throwing up his hands.", "Think who he is: quick and loud.", "Read the line aloud in his voice."], "say": "Challenge! Plan your reading of Eli's line.", "how": "Who, how, what kind of boy, then read."}]},
'READ.LIT.L07.30':{ band:'M68', pic:'🗝️', today:'Read chapter 1 and prove what the room shows',
      why:'A locked room cannot talk, but its dust can. Prove what happened from the clues.',
      ready:[{q:'Which one is an inference?', o:['The muddy boots mean he came in from the rain.','The boots are by the door.','He has boots.'], a:'The muddy boots mean he came in from the rain.'}],
      bridge:'READ.COMP.L06.07', bridgeName:'Two Clues, One Inference',
      watch:{ q:'The Key on the Red String', m:{type:'scene', e:'🗄️', t:'The top drawer said 1951–1955. He pulled it open. It was empty.'}, steps:[
        {t:'Said outright: the top drawer is empty.'},
        {t:'Notice too: the drawers below are full.'},
        {t:'What I know: nobody empties one drawer by accident.'},
        {t:'Inference: someone took those years on purpose.'},
        {t:'Proof: point to "It was empty," then to the full drawers.'},
        {t:'Teach it back: tell your chavrusa the clue, what you know, and the inference.'}], a:'Someone took the first five years on purpose.' },
      oops:{ q:'"Someone has been in the room" is said outright. Right?', wrong:'Yes, the chapter says it', right:'No: we infer it from the clues', why:'No sentence says it. The path, the chair and the wrapper show it.' },
      ways:['read the whole chapter','worked example','Mistake Detective','find the proof','clue + what I know','teach it back'], done:'You read chapter 1 like a detective and proved what the room shows!',
      board:{ one:'Clue + what I know = inference. Prove it with the exact words.', activity:'Draw the archive on the board: door, path, cabinet, chair. Boys place each clue on the drawing and say what it lets them infer.', mistakes:['Taking a character\'s words as proof','Saying an inference is "said in the text"','Naming a person the clues do not reach'] },
      do:[
        {type:'read', text:'C68.W1.01', say:'Read chapter 1, "The Key on the Red String."', how:'Notice every detail the boys find in the basement.'},
        {type:'evidence', mis:true, q:'Which sentence proves someone has been in the locked room?', p:['Everything wore a gray coat of dust, thick enough to write your name in.','"Nobody has touched this place in fifty years."','On that strip, the dust was thin, almost gone, as if someone had walked it many times.'], a:2, look:'a detail that shows people, not just dust', say:'Careful! Which sentence really proves it?', how:'A character can be wrong. Which detail SHOWS feet were there?'}],
      your:[
        {type:'proof', text:'C68.W1.01', q:'Which sentence shows the wrapper points to a person Benny met?', proof:'It was the same kind', look:'where Benny compares the wrapper to his candy', say:'Find the proof in chapter 1.', how:'Read the last page. What does Benny compare?'},
        {type:'sort', mis:true, bins:['Said outright','Inferred'], cards:[['The yeshiva is seventy-five years old.',0],['Someone sat in the chair by the window.',1],['The door groaned open.',0],['Benny feels like an outsider.',1]], say:'Watch the trap! Said outright, or inferred?', how:'Can you point to the exact words? If not, you inferred it.'},
        {type:'listen', hear:'"Maybe the custodian swept," said Eli. "Then why did he sweep only a path?" said Gavriel.', o:['a sweeper cleans the whole floor, not one strip','the custodian never comes downstairs','Eli is always wrong'], a:'a sweeper cleans the whole floor, not one strip', cap:'Why does Gavriel doubt Eli?', say:'Listen. Tap the reason Gavriel doubts Eli.', how:'What does a floor look like after someone sweeps it?'},
        {type:'match', pairs:[['a clean path in thick dust','someone walks here often'],['one empty drawer in a full cabinet','someone chose those years'],['a candy wrapper by the chair','someone sat and waited']], say:'Match each clue to its inference.', how:'Clue plus what you know about people.'},
        {type:'cloze', t:'Benny keeps the wrapper because he is new. The clue: "He had been here three months." What I know: new boys often ___ to speak up.', o:['wait','rush','forget'], a:'wait', say:'Challenge! Finish Benny\'s inference.', how:'Think of your first weeks in a new class.'}] },

    'READ.LIT.L07.31':{ band:'M68', pic:'📋', today:'Read chapter 2 and sort the proved from the guessed',
      why:'Every reader has guesses. A strong reader knows which of his ideas are proved.',
      ready:[{q:'"The lights are off, so nobody is home." Is that proved?', o:['no, it is a guess','yes, it is proved','it is a fact about lights'], a:'no, it is a guess'}],
      bridge:'READ.COMP.L06.09', bridgeName:'Draw a Conclusion',
      watch:{ q:'Proved and Guessed', m:{type:'scene', e:'🧑‍🏫', t:'"Who borrows a whole drawer?" "I don\'t know yet. That is why it is on the right side."'}, steps:[
        {t:'Eli writes: someone stole the files. Did anyone see a theft? No.'},
        {t:'So it is a guess. It belongs under GUESSED.'},
        {t:'Notice the word "stole". It blames someone before there is proof.'},
        {t:'Akiva keeps the idea, but on the right side, until it is proved.'},
        {t:'A guess is not wrong. It is a question waiting for evidence.'},
        {t:'Teach it back: tell your chavrusa what moves a guess to PROVED.'}], a:'A guess stays under GUESSED until evidence moves it.' },
      oops:{ q:'"Mr. Dahan has keys to every door, so he did it." Fair?', wrong:'Yes: he has the most keys', right:'No: having keys is not using them', why:'One clue can fit many people. "Could" is not "did".' },
      ways:['read the whole chapter','sort proved and guessed','Mistake Detective','find the proof','tap the reason','teach it back'], done:'You can tell what is proved from what is only guessed!',
      board:{ one:'PROVED: someone saw it or can show it. GUESSED: an idea waiting for evidence.', activity:'Make the Beacon\'s whiteboard: two columns. Boys write each idea from chapter 2 on a card and argue where it goes.', mistakes:['Treating a likely idea as proved','Missing words that blame, like "stole"','Moving a guess because many boys agree'] },
      do:[
        {type:'read', text:'C68.W1.02', say:'Read chapter 2, "Proved and Guessed."', how:'Watch how the boys decide what is proved.'},
        {type:'sort', mis:true, bins:['Proved','Guessed'], cards:[['The 1951 to 1955 drawer is empty.',0],['Someone stole the files.',1],['A peppermint wrapper was by the chair.',0],['Mr. Dahan took the files.',1]], say:'Trap! Proved, or only guessed?', how:'Did the boys see it? Then it is proved.'}],
      your:[
        {type:'proof', text:'C68.W1.02', q:'Which sentence shows why Akiva will not write Mr. Dahan\'s name?', proof:'that is not a guess anymore', look:'what happens when a name sits next to "stole"', say:'Find Akiva\'s reason in chapter 2.', how:'Read what Akiva says when he caps the marker.'},
        {type:'evidence', q:'Which line shows Gavriel is careful about what he really knows?', p:['Gavriel had brought his camera.','"It is what the dust tells me. It is not a fact."','He scrolled through the pictures he had taken the day before.'], a:1, look:'Gavriel judging his own idea', say:'Tap Gavriel\'s careful line.', how:'Which line shows him calling his idea a guess?'},
        {type:'match', pairs:[['dust on top of the footprints','not walked this morning'],['the path is not gray again','not from years ago'],['both clues together','walked for weeks']], say:'Match each clue to what Gavriel rules out.', how:'Each clue rules out one time. Together they point to one.'},
        {type:'order', steps:['Notice a clue.','Write the idea under GUESSED.','Look for evidence.','Move it to PROVED only with proof.'], say:'Put the newsroom rule in order.', how:'An idea starts as a guess. Proof comes last.'},
        {type:'listen', hear:'"Good work, Benny," he said. "Next time, tell us the same day."', o:['a clue helps most when it is shared quickly','new boys should stay quiet','the wrapper did not matter'], a:'a clue helps most when it is shared quickly', cap:'What does Akiva want Benny to learn?', say:'Listen. Tap what Akiva means.', how:'Benny waited a whole day. Why would that matter?'}] },

    'READ.LIT.L07.32':{ band:'M68', pic:'💡', today:'Read chapter 3 and explain each inference, step by step',
      why:'An inference you can explain is one others can trust. Show the clue and what you know.',
      ready:[{q:'Clue: his coat is wet. What I know: rain makes coats wet. Inference?', o:['He was out in the rain.','He has a coat.','Coats are warm.'], a:'He was out in the rain.'}],
      bridge:'READ.COMP.L06.07', bridgeName:'Two Clues, One Inference',
      watch:{ q:'The Light After Minchah', m:{type:'scene', e:'📷', t:'In Rabbi Brandt\'s right hand, held up a little, as if he were proud of it, was a key.'}, steps:[
        {t:'Clue: the founder holds a key on a string.'},
        {t:'It looks just like the key Rabbi Rosen gave the boys.'},
        {t:'What I know: the founder\'s key was never found.'},
        {t:'Inference: this photo shows the lost second key.'},
        {t:'Second clue: his son stands beside him. Where might the key have gone?'},
        {t:'Teach it back: tell your chavrusa the clue, what you know, and the inference.'}], a:'The photo shows the missing key, and a son who may have it.' },
      oops:{ q:'"The light under the door proves a thief is inside." Right?', wrong:'Yes: a secret light means a thief', right:'No: it shows someone is there, not why', why:'The clue tells us someone visits. It says nothing about why.' },
      ways:['read the whole chapter','clue + what I know','Mistake Detective','find the proof','tap the reason','teach it back'], done:'You can explain an inference: the clue and what you know!',
      board:{ one:'Inference = clue in the text + what I already know. Say both.', activity:'An inference ladder on the board: bottom rung the clue, middle rung what I know, top rung the inference. Boys build a ladder for each clue in chapter 3.', mistakes:['Giving only the inference, with no clue','Using a "what I know" that is really a guess','Stretching one clue too far'] },
      do:[
        {type:'read', text:'C68.W1.03', say:'Read chapter 3, "The Light After Minchah."', how:'Track the three new clues the boys find.'},
        {type:'evidence', mis:true, q:'Which line proves Mr. Dahan could not open the archive?', p:['Mr. Dahan laughed and lifted the huge ring of keys from his belt.','"Not one of these fits it."','"Every winter I want to check that wall for damp."'], a:1, look:'a line about the keys and the lock', say:'Trap ahead! Which line really proves it?', how:'A big ring of keys is not proof. Look for what the keys can and cannot do.'}],
      your:[
        {type:'proof', text:'C68.W1.03', q:'Which sentence tells when Mr. Dahan sees the light?', proof:'On Tuesdays and Thursdays, when I come down', look:'what Mr. Dahan sees after Minchah', say:'Find the proof in chapter 3.', how:'Read what Mr. Dahan tells Yoni on page 2.'},
        {type:'sort', bins:['Clue in the text','What I know','Inference'], cards:[['Mr. Dahan sees the light on Tuesdays and Thursdays.',0],['People who come back often keep a habit.',1],['Someone comes back again and again.',2],['The founder held a key on a string.',0],['Fathers often leave things to sons.',1],['His son may have the key.',2]], say:'Build the inferences: clue, what I know, inference.', how:'Clue from the chapter, knowledge from life, then the idea.'},
        {type:'listen', hear:'"His keys don\'t even fit," said Eli. "I almost wrote his name on the board."', o:['ashamed that he almost blamed him','proud that he solved it','angry at Mr. Dahan'], a:'ashamed that he almost blamed him', cap:'How does Eli feel?', say:'Listen. Tap how Eli feels.', how:'What did Eli almost do? How would you feel?'},
        {type:'match', pairs:[['Yoni','asks people kindly, with tea'],['Gavriel','sees what others walk past'],['Akiva','writes only what is proved'],['Eli','learns he judged too fast']], say:'Match each reporter to his strength.', how:'Think about what each boy does in chapter 3.'},
        {type:'cloze', t:'Akiva writes his question under GUESSED, because "almost every afternoon" is not the same as ___.', o:['every','never','sometimes'], a:'every', say:'Challenge! Tap the word that fits.', how:'Reread the paragraph about Reb Feivel\'s chair.'}] },

    'READ.LIT.L07.33':{ band:'M68', pic:'🔦', today:'Read chapter 4 and prove the answer to the mystery',
      why:'A mystery plays fair. When the answer comes, a strong reader goes back and finds every clue.',
      ready:[{q:'A clue that seemed small turns out to matter. What should you do?', o:['go back and reread where it appeared','skip ahead to the end','forget it'], a:'go back and reread where it appeared'}],
      bridge:'READ.COMP.L06.08', bridgeName:'Strongest Evidence',
      watch:{ q:'A Stakeout with Gemaras', m:{type:'scene', e:'🚪', t:'"Nu," said Reb Feivel. "The reporters. I wondered how long it would take you."'}, steps:[
        {t:'Said outright: Reb Feivel opens the door.'},
        {t:'Clue: he is not surprised to see the boys.'},
        {t:'What I know: people who expect a visit are not shocked by it.'},
        {t:'Inference: he knew the boys were on his trail.'},
        {t:'Check it: he even knows Benny found his wrapper.'},
        {t:'Teach it back: tell your chavrusa how you know he expected them.'}], a:'He expected the boys to find him.' },

ark and link?"}, {"type": "listen", "hear": "Claim: Yoni is curious. Proof: Yoni leaned forward and asked, \"Who started the yeshiva, Rebbe?\"", "o": ["he leans in and asks a question", "he writes for the newspaper", "he is sitting in the closet"], "a": "he leans in and asks a question", "cap": "Why does this proof work?", "say": "Listen. Tap the reason the proof works.", "how": "What does Yoni DO that shows he wants to know?"}, {"type": "evidence", "q": "Claim: Benny noticed a clue AND kept it to himself. Which sentence proves BOTH?", "p": ["He picked it up.", "So he put the wrapper in his other pocket, and he said nothing at all.", "It crinkled, and a sharp, cool smell rose from it."], "a": 1, "look": "one line with the clue and the silence", "say": "Two parts. Tap the line that proves both.", "how": "Check each line for BOTH parts of the claim."}, {"type": "order", "steps": ["Claim: Akiva is careful.", "Quote: \"It is going to be the most careful issue we ever printed.\"", "Link: he slows Eli down on purpose.", "Check: would it convince a doubter?"], "say": "Challenge! Build Akiva's proved answer in order.", "how": "Claim, quote, link, then the convince test."}]}

r show Shea look \"at the clock, then at the notes, then at the clock again\"?", "p": ["He cannot read the library clock well.", "He is torn between home and his friend.", "He wants to copy the notes over again."], "a": 1, "look": "why his eyes go back and forth", "how": "Reread slowly. What two things pull at him?"}, {"type": "evidence", "skill": "READ.COMP.L07.08", "q": "Close reading: \"Dovid said he did not mind staying home. He folded his tallis bag very neatly, and then folded it again.\" Which detail does a close reader notice?", "p": ["He told everyone, out loud, that he did not mind staying home.", "He folded the bag again, though it was already neat.", "He has a tallis bag."], "a": 1, "look": "a small action that shows a hidden feeling", "how": "Why would someone fold a neat bag twice? Reread slowly."}, {"type": "evidence", "skill": "READ.FLU.L07.02", "q": "NOACH: (whispering, eyes on the door) Did you hear that? How should you read this line?", "p": ["Read \"Noach\" first, then the line, loudly.", "Softly and tense, like he is listening for a sound.", "At a normal, steady speed, in a calm and cheerful voice."], "a": 1, "look": "what the stage direction asks for", "how": "Do not read the name. What does \"whispering, eyes on the door\" ask your voice to do?"}, {"type": "evidence", "skill": "READ.FLU.L07.02", "q": "A scene has an excited boy, a calm grandfather and a narrator. Which plan reads it best?", "p": ["One steady voice for all three, so every word is clear.", "Say each name aloud first, so the listener knows who.", "Bright for the boy, warm for Zeidy, clear for the narrator."], "a": 2, "look": "a plan that gives each speaker his own voice", "how": "Each speaker should sound like who he is."}, {"type": "evidence", "skill": "READ.COMP.L06.07", "q": "Clue 1: the cookie jar is empty. Clue 2: there are crumbs on Chezky's sleeve. Which inference fits BOTH clues?", "p": ["The jar was never filled.", "Someone baked a new batch of cookies for Shabbos.", "Ch
