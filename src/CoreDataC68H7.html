(function () {
  var LESSONS = {
    'READ.COMP.L07.05':{name:"Said or Hinted?", teach:[{"q": "\"The streets were empty, and rain was coming.\" Is \"the streets were empty\" said outright, or inferred?", "o": ["said outright", "inferred", "not in the text"], "how": "Said outright: the exact words are on the page. You can point to them."}, {"q": "\"He tried each shop door as he went, twirling his club.\" What can you infer?", "o": ["he is a policeman checking the shops", "he is lost", "he owns every shop"], "how": "Inferred: the text gives clues. You add what you know: police check shop doors at night."}, {"q": "A story never says why a man left town, and gives no clues. Can you say he ran from the police?", "o": ["no: that is not supported", "yes: it is a good guess", "yes: men who leave are guilty"], "how": "No words and no clues means not supported. A guess is not an answer."}], practice:[{"t": "sort", "q": "After Twenty Years. Said outright, or inferred?", "bins": [{"id": "s", "label": "Said outright"}, {"id": "i", "label": "Inferred"}], "items": [{"label": "The restaurant was torn down five years ago.", "bin": "s"}, {"label": "Bob is proud of his money.", "bin": "i"}, {"label": "The two friends agreed to meet in twenty years.", "bin": "s"}, {"label": "The policeman knew Bob before he said so.", "bin": "i"}], "h": "Can you point to the exact words? Then it is said outright."}, {"t": "pairs", "q": "Match each clue to what you can infer.", "pairs": [["a diamond pin and a diamond watch", "he has a lot of money"], ["his hand trembled as he read", "the note shook him"], ["the streets were almost empty", "it was late and cold"]], "h": "Clue plus what you know about people."}, {"t": "spotall", "q": "Tap every sentence that is NOT supported by \"After Twenty Years\".", "cells": [{"label": "Bob grew up in Chicago.", "ok": true}, {"label": "Jimmy became a policeman.", "ok": false}, {"label": "Bob had a brother in the West.", "ok": true}, {"label": "The two men were once close friends.", "ok": false}], "h": "No words and no clues for it? Then it is not supported."}, {"t": "order", "q": "Put the steps for checking an answer in order.", "tiles": ["Can I point to the exact words?", "If not, are there clues?", "Add the clue to what I know.", "No words, no clues: not supported."], "h": "Words first, then clues, then nothing."}, {"t": "sort", "q": "Mistake Detective: Shloimy labeled these. Right or wrong?", "bins": [{"id": "r", "label": "Labeled right"}, {"id": "w", "label": "Labeled wrong"}], "items": [{"label": "\"Bob waited in a doorway\" = said outright", "bin": "r"}, {"label": "\"Bob is rich\" = said outright", "bin": "w"}, {"label": "\"Jimmy felt torn\" = inferred", "bin": "r"}, {"label": "\"Bob stole a horse\" = inferred", "bin": "w"}], "h": "Check each label against the text."}, {"t": "pairs", "q": "Match each kind of answer to its test.", "pairs": [["said outright", "I can point to the words"], ["inferred", "clues plus what I know"], ["not supported", "no words and no clues"]], "h": "Words, clues, or nothing?"}], check:[{"q": "Passage: \"Rivky's brother Moshe had read the same page of his sefer four times. He had set out the good cups on the table, the ones with the gold rims. Every time a car door slammed outside, his head came up. When the Golds' van finally turned into the driveway, the sefer was face-down on the couch and Moshe was already on the porch, waving with both arms.\" \"Moshe set out the good cups.\" What is this?", "o": ["said outright", "inferred", "not supported"], "h": "Test 1: exact words? Test 2: a clue plus what you know? Neither: no support."}, {"q": "Passage: \"Rivky's brother Moshe had read the same page of his sefer four times. He had set out the good cups on the table, the ones with the gold rims. Every time a car door slammed outside, his head came up. When the Golds' van finally turned into the driveway, the sefer was face-down on the couch and Moshe was already on the porch, waving with both arms.\" \"Moshe had been waiting a long time     'READ.COMP.L07.06':{name:"Clue + What I Know", teach:[{"q": "An inference is built from two things. What are they?", "o": ["a clue from the text and what I already know", "two guesses", "the title and the picture"], "how": "Clue + what I know = inference. Both parts must be there."}, {"q": "\"Mr. Weiss holds a siddur with very big letters.\" What do you already know that helps?", "o": ["big letters help people who cannot see well", "old siddurim are heavy", "every siddur has big letters"], "how": "What I know comes from life: what do big letters help with?"}, {"q": "Why explain your thinking, and not just give the inference?", "o": ["so others can check that it really comes from the text", "so the answer is longer", "because the rebbe likes long answers"], "how": "An explained inference can be checked. A bare guess cannot."}], practice:[{"t": "sort", "q": "Sort each one: a clue from the text, or what I already know?", "bins": [{"id": "c", "label": "Clue from the text"}, {"id": "k", "label": "What I know"}], "items": [{"label": "Mr. Weiss stands by the side door.", "bin": "c"}, {"label": "It gets dark early in winter.", "bin": "k"}, {"label": "He asks for the page number twice.", "bin": "k"}, {"label": "He holds the rail with both hands.", "bin": "c"}], "h": "Is it in the story, or in your head?"}, {"t": "order", "q": "Build the inference ladder from the bottom up.", "tiles": ["Clue: he holds the rail with both hands.", "What I know: people grip rails when they cannot see the steps.", "Inference: he cannot see the steps well.", "Check: does the rest of the story fit?"], "h": "Clue, then what you know, then the inference, then check."}, {"t": "pairs", "q": "Match each clue to the inference it supports.", "pairs": [["wet umbrella by the door", "someone came in from the rain"], ["a red 54 on a test", "the test went badly"], ["coat on, bag by the door", "he is ready to leave"]], "h": "What does each clue make you think?"}, {"t": "spotall", "q": "Tap every inference that has a clue behind it in \"The Long Way Home\".", "cells": [{"label": "Mr. Weiss leaves before dark on purpose.", "ok": true}, {"label": "Mr. Weiss is angry at the shul.", "ok": false}, {"label": "Natan cares about Mr. Weiss.", "ok": true}, {"label": "Mr. Weiss hates herring.", "ok": false}], "h": "Can you name the clue? If not, do not tap it."}, {"t": "sort", "q": "Mistake Detective: explained, or just a guess?", "bins": [{"id": "e", "label": "Explained inference"}, {"id": "g", "label": "Just a guess"}], "items": [{"label": "He grips the rail, and people do that when they cannot see, so his eyes are weak.", "bin": "e"}, {"label": "He is old, so he must be grumpy.", "bin": "g"}, {"label": "His siddur has big letters, which help weak eyes, so he sees poorly.", "bin": "e"}, {"label": "He leaves early, so he must not like Natan.", "bin": "g"}], "h": "An explained inference names the clue and what you know."}, {"t": "pairs", "q": "Match each part of the explanation to its words.", "pairs": [["The clue is", "from the text"], ["I know that", "from my life"], ["So I infer", "my conclusion"]], "h": "Three parts: clue, what I know, inference."}], check:[{"q": "Passage: \"On Sunday, Shimmy's little brother told everyone that Shimmy had a cold. Every afternoon this week, Shimmy has come home from yeshiva, walked past the kitchen without a word, and gone straight to his room. His supper sits on the table, hardly touched. Tonight his father found him at his desk, still in his coat, staring at a math test with a red 54 at the top. He was not coughing.\" Explanation: \"The red 54 is on his test. A low mark can make a boy ashamed. So Shimmy is upset.\" Which part is \"A low mark can make a boy ashamed\"?", "o": ["what I know", "the clue", "the inference"], "h": "Is it in the passage, from your own life, or your conclusion?"}, {"q": "Passage: \"On Sunday, Shimmy's little brother told everyone that Shimmy had a cold. Every afternoon this week, Shimmy has come home from yeshiva, walked past the kitchen without a word, and gone straight to his room. His supper sits on the table, hardly touched. Tonight his father found him at his desk, still in his coat, staring at a math test with a red 54 at the top. He was not coughing.\" Explanation: \"He was not coughing, and a boy with a cold coughs, so the cold is not the reason.\" Which part is \"He was not coughing\"?", "o": ["the clue", "what I know", "the inference"], "h": "Is it in the passage, from your own life, or your conclusion?"}, {"q": "Passage: \"On Sunday, Shimmy's little brother told everyone that Shimmy had a cold. Every afternoon this week, Shimmy has come home from yeshiva, walked past the kitchen without a word, and gone straight to his room. His supper sits on the table, hardly touched. Tonight his father found him at his desk, still in his coat, staring at a math test with a red 54 at the top. He was not coughing.\" \"Shimmy is still sick with his cold.\" Why is this the weaker inference?", "o": ["it does not fit every clue", "it has no clue in the passage at all", "it is said outright in the passage"], "h": "Test it against each clue, the last line too."}], re:[{"q": "Clue: the floor is wet and the window is open. What I know: rain comes in open windows. Inference?", "o": ["rain came in the window", "someone spilled juice", "the floor was just washed"], "h": "Join the clue to what you know."}, {"q": "Which is an EXPLAINED inference?", "o": ["His shoes are muddy, and the field is muddy, so he played outside.", "He played outside.", "He probably likes mud."], "h": "Look for the clue and the reason."}, {"q": "An inference with no clue behind it is...", "o": ["a guess", "a fact", "a quote"], "h": "No clue, no inference."}]},
    'READ.COMP.L07.07':{name:"The Best Quote", teach:[{"q": "Claim: \"Gavriel notices things, and he is honest about what he does not know.\" How many parts does the claim have?", "o": ["two", "one", "none"], "how": "Split the claim at \"and\". Each part needs its own proof."}, {"q": "What makes one quote BETTER proof than another?", "o": ["it shows the whole claim, clearly and exactly", "it is the longest quote", "it comes first in the chapter"], "how": "Best proof: on the claim, the whole claim, and specific."}, {"q": "A quote is true and exciting, but it is about something else. Is it good proof?", "o": ["no: it does not show the claim", "yes: it is true", "yes: it is exciting"], "how": "True is not enough. Ask: does it show THIS claim?"}], practice:[{"t": "sort", "q": "Claim: Mr. Dahan is honest about the archive. Sort the quotes.", "bins": [{"id": "s", "label": "Strong proof"}, {"id": "w", "label": "Weak proof"}], "items": [{"label": "\"I tried, the first week I came. Then I asked the office.\"", "bin": "s"}, {"label": "\"I know every pipe down here by its first name.\"", "bin": "w"}, {"label": "\"So it stays locked.\"", "bin": "s"}, {"label": "He wiped his hands on a rag.", "bin": "w"}], "h": "Does the quote show honesty about the archive?"}, {"t": "pairs", "q": "Match each weak quote to what is wrong with it.", "pairs": [["true, but about something else", "off the claim"], ["shows only one half of the claim", "not the whole claim"], ["a character's opinion, not what happened", "not proof"]], "h": "What is missing from each quote?"}, {"t": "order", "q": "Put the steps for choosing the best quote in order.", "tiles": ["Split the claim into its parts.", "Collect every quote that might prove it.", "Cross out quotes that are off the claim.", "Keep the one that proves the whole claim most clearly."], "h": "Split, collect, cross out, keep."}, {"t": "spotall", "q": "Claim: Benny is shy in his first months. Tap every quote that shows it.", "cells": [{"label": "Twice he almost took it out.", "ok": true}, {"label": "Benny had moved to Baltimore in September.", "ok": false}, {"label": "So he said nothing at all.", "ok": true}, {"label": "He picked up the wrapper.", "ok": false}], "h": "Does the quote show shyness, or only a fact?"}, {"t": "sort", "q": "Mistake Detective: Avrumi picked these as \"best proof\". Right or wrong?", "bins": [{"id": "r", "label": "Good pick"}, {"id": "w", "label": "Bad pick"}], "items": [{"label": "Claim: the room was dusty. \"Everything wore a gray coat of dust.\"", "bin": "r"}, {"label": "Claim: Eli is careful. \"Eli stepped in first.\"", "bin": "w"}, {"label": "Claim: Akiva is fair. \"He took the marker out of Eli's hand, gently.\"", "bin": "r"}, {"label": "Claim: Yoni is shy. \"Yoni could ask anybody anything.\"", "bin": "w"}], "h": "Does the quote prove the claim, or the opposite?"}, {"t": "pairs", "q": "Match each claim to its best quote.", "pairs": [["the founder was proud of the key", "\"held up a little, as if he were proud of it\""], ["the photos are easy to miss", "\"most boys walked past them a hundred times\""], ["Gavriel found something", "\"a look on his face\""]], "h": "Which quote shows exactly that claim?"}], check:[{"q": "Passage: \"Pinny stayed after Maariv to stack the chairs. He found Mr. Rubinstein's wallet under the last bench, full of money. He did not take one dollar. He ran down the block in the rain to Mr. Rubinstein's house, rang the bell twice, and held it out with both hands. 'You dropped this,' he said, 'I think.' He gave it back without a word about himself, and forgot to tell anyone.\" Claim: Pinny is honest AND humble. How much of the claim does \"He did not take one dollar\" prove?", "o": ["only half the claim", "the whole claim", "none of the claim"], "h": "Split the claim: honest, humble. Test this line on each part."}, {"q": "Passage: \"Pinny stayed after Maariv to stack the chairs. He found Mr. Rubinstein's wallet under the last bench, full of money. He did not take one dollar. He ran down the block in the rain to Mr. Rubinstein's house, rang the bell twice, and held it out with both hands. 'You dropped this,' he said, 'I think.' He gave it back without a word about himself, and forgot to tell anyone.\" Claim: Pinny is honest AND humble. As proof, \"He found Mr. Rubinstein's wallet under the last bench, full of money\" is...", "o": ["off the claim", "only half the claim", "the best proof"], "h": "Does finding something show honesty, or what he does next?"}, {"q": "Passage: \"Pinny stayed after Maariv to stack the chairs. He found Mr. Rubinstein's wallet under the last bench, full of money. He did not take one dollar. He ran down the block in the rain to Mr. Rubinstein's house, rang the bell twice, and held it out with both hands. 'You dropped this,' he said, 'I think.' He gave it back without a word about himself, and forgot to tell anyone.\" Claim: Pinny is honest AND humble. \"He gave it back without a word about himself, and forgot to tell anyone\" proves...", "o": ["the whole claim", "only half the claim", "none of the claim"], "h": "Check each half of the claim against the words."}], re:[{"q": "Claim: \"The trip was long and tiring.\" Which quote is best?", "o": ["\"We drove nine hours and slept the whole next day.\"", "\"We drove to the lake.\"", "\"The lake was blue.\""], "h": "Which shows long AND tiring?"}, {"q": "A claim with two parts usually needs...", "o": ["proof for each part", "one short quote", "no quote"], "h": "Each part needs its own proof."}, {"q": "\"It was a great game,\" said Eli. As proof that the team played well, this is...", "o": ["weak: it is only an opinion", "strong: Eli was there", "strong: it is a quote"], "h": "Is it what happened, or what he thinks?"}]},
    'READ.COMP.L07.08':{name:"Read It Again, Closer", teach:[{"q": "What is close reading?", "o": ["rereading one short part slowly, for every detail", "reading the whole story again fast", "reading only the ending"], "how": "Close reading: one paragraph, slowly, more than once."}, {"q": "On a second read, what do you ask about a detail?", "o": ["why did the author put this here?", "how many words is it?", "is it on page one?"], "how": "Every detail is a choice. Ask why the author chose it."}, {"q": "Why do details in a mystery seem unimportant the first time?", "o": ["the author hides clues in plain sight", "the author made a mistake", "details never matter"], "how": "A good author plays fair: the clue is there, but quiet."}], practice:[{"t": "sort", "q": "Close reading, or not?", "bins": [{"id": "c", "label": "Close reading"}, {"id": "n", "label": "Not close reading"}], "items": [{"label": "Reread one paragraph slowly.", "bin": "c"}, {"label": "Skim the whole story again.", "bin": "n"}, {"label": "Ask why the author chose one word.", "bin": "c"}, {"label": "Jump to the ending.", "bin": "n"}], "h": "Close reading is slow and small."}, {"t": "order", "q": "Put the steps of close reading in order.", "tiles": ["Read the whole story for what happens.", "Pick one paragraph that matters.", "Reread it slowly and mark each detail.", "Ask why the author put each detail there."], "h": "Whole first, then one paragraph, slowly."}, {"t": "pairs", "q": "Match each detail from \"After Twenty Years\" to what a second read shows.", "pairs": [["\"I never thought you were so tall\"", "the man is not really Jimmy"], ["the match lights up his face", "the policeman saw him clearly"], ["his hand trembled as he read", "the note moved him"]], "h": "What does each detail mean once you know the ending?"}, {"t": "spotall", "q": "Tap every detail that is a hidden clue on a second read.", "cells": [{"label": "the white scar by his eyebrow", "ok": true}, {"label": "it was ten o'clock", "ok": false}, {"label": "the collar turned up to his ears", "ok": true}, {"label": "the store sold hardware", "ok": false}], "h": "Which details help you know who is who?"}, {"t": "sort", "q": "Mistake Detective: what did Yehuda notice on his second read?", "bins": [{"id": "n", "label": "A real new noticing"}, {"id": "x", "label": "Not new, or not in the text"}], "items": [{"label": "The policeman left right after seeing Bob's face.", "bin": "n"}, {"label": "Bob is in New York.", "bin": "x"}, {"label": "The tall man hurried Bob away from the lights.", "bin": "n"}, {"label": "Jimmy had a dog.", "bin": "x"}], "h": "A noticing must be in the text, and easy to miss."}, {"t": "pairs", "q": "Match each kind of detail to what it does.", "pairs": [["a pause or a slow action", "it shows a feeling without saying it"], ["a line that fits something bigger", "it means more than it says"], ["the first action of a scene", "it sets up the scene"]], "h": "Ask what each detail is doing for the story."}], check:[{"q": "Passage: \"Zeidy took the old watch out of the drawer, wound it slowly, and held it to his ear. For a long moment he said nothing. Then he put it in Yossi's hand and closed the boy's fingers around it, one at a time. 'It still runs,' he said. 'It only needs someone to wind it.'\" What does \"For a long moment he said nothing\" do?", "o": ["it shows a feeling without saying it", "it sets up the time and the place of the scene", "it is only about the watch"], "h": "A pause in a story is a choice. What is it doing here?"}, {"q": "Passage: \"Zeidy took the old watch out of the drawer, wound it slowly, and held it to his ear. For a long moment he said nothing. Then he put it in Yossi's hand and closed the boy's fingers around it, one at a time. 'It still runs,' he said. 'It only needs someone to wind it.'\" On a second read, \"It only needs someone to wind it\"...", "o": ["means more than it says", "sets up the scene", "is only about the watch"], "h": "Reread the last line. Why would Zeidy say it to Yossi?"}, {"q": "Passage: \"Zeidy took the old watch out of the drawer, wound it slowly, and held it to his ear. For a long moment he said nothing. Then he put it in Yossi's hand and closed the boy's fingers around it, one at a time. 'It still runs,' he said. 'It only needs someone to wind it.'\" What does \"closed the boy's fingers around it, one at a time\" do?", "o": ["it shows a feeling without saying it", "it is only about the watch", "it sets up the time and the place of the scene"], "h": "A slow action is a choice. What is it doing here?"}], re:[{"q": "Close reading means...", "o": ["rereading one part slowly for details", "reading fast to the end", "reading only the title"], "h": "Slow and small."}, {"q": "On a second read, you ask about each detail...", "o": ["why the author put it there", "how long it is", "if it rhymes"], "h": "Every detail is a choice."}, {"q": "In a mystery, clues are often...", "o": ["hidden in plain sight", "printed in red", "only on the last page"], "h": "The author plays fair, but quietly."}]},
    'READ.FLU.L07.02':{name:"Voices in the Scene", teach:[{"q": "In a play, do you read the speaker's name aloud?", "o": ["no: the name tells you who speaks", "yes: every word is read", "only the first time"], "how": "The name before the colon is a sign, not a line. Change your voice instead."}, {"q": "What do the words in ( ) tell you?", "o": ["how to say the line", "a line to read out loud", "the title of the scene"], "how": "Stage directions are for the reader's voice, not his mouth."}, {"q": "How do you make each speaker sound like himself?", "o": ["match the voice to who he is and how he feels", "read every line the same way", "read the longest lines loudest"], "how": "Think: who is he, and what does he feel right now?"}], practice:[{"t": "sort", "q": "Read aloud, or not?", "bins": [{"id": "r", "label": "Read it aloud"}, {"id": "n", "label": "Do not read it aloud"}], "items": [{"label": "ELI:", "bin": "n"}, {"label": "Who borrows a whole drawer?", "bin": "r"}, {"label": "(groaning)", "bin": "n"}, {"label": "Can we prove it?", "bin": "r"}], "h": "Names and directions guide your voice. You do not say them."}, {"t": "pairs", "q": "Match each Beacon reporter to his voice.", "pairs": [["Akiva", "calm and firm"], ["Eli", "fast and excited"], ["Gavriel", "quiet and careful"]], "h": "Who is each boy? How does he talk?"}, {"t": "pairs", "q": "Match each stage direction to the voice it asks for.", "pairs": [["(whispering)", "soft, close to silent"], ["(throwing up his hands)", "loud and frustrated"], ["(slowly, choosing each word)", "slow, with small pauses"]], "h": "Act out the words in ( ) with your voice."}, {"t": "order", "q": "Put the 3 reads in order.", "tiles": ["Listen and follow the lit words.", "Read along with the voice.", "Read it alone, out loud."], "h": "Hear it, share it, then own it."}, {"t": "sort", "q": "Mistake Detective: Dovi read the scene like this. Right or wrong?", "bins": [{"id": "r", "label": "Right"}, {"id": "w", "label": "Wrong"}], "items": [{"label": "He said \"Eli\" before Eli's line.", "bin": "w"}, {"label": "He sped up when Eli got excited.", "bin": "r"}, {"label": "He read \"(groaning)\" out loud.", "bin": "w"}, {"label": "He slowed down for Gavriel.", "bin": "r"}], "h": "Names and directions are never read aloud."}, {"t": "spotall", "q": "Tap every line that should sound excited.", "cells": [{"label": "Someone stole the files!", "ok": true}, {"label": "It is not a fact.", "ok": false}, {"label": "Who borrows a whole drawer?", "ok": true}, {"label": "Can we prove it?", "ok": false}], "h": "Who is speaking, and how does he feel?"}], check:[{"q": "Scene: MENDY: (yawning, half asleep) Is it morning already? / SHIMSHON: (bursting in, out of breath) Get up! The snow is up to the windows! / MENDY: (suddenly wide awake) Up to the WINDOWS? New line: SHIMSHON: (whispering, so Zeidy won't hear) Get up! Snow! Which voice fits this new line?", "o": ["soft, close to silent", "fast and excited", "low and tired, like a yawn"], "h": "The words are exciting. What does the direction ask for?"}, {"q": "Scene: MENDY: (yawning, half asleep) Is it morning already? / SHIMSHON: (bursting in, out of breath) Get up! The snow is up to the windows! / MENDY: (suddenly wide awake) Up to the WINDOWS? / ZEIDY: Nu, boys. Shoes on. The snow will wait for no one. Zeidy's line has no direction. Which voice fits it?", "o": ["calm and firm", "soft, close to silent", "fast and excited"], "h": "No direction? Read his words. Is Zeidy rushing, whispering, or steady?"}, {"q": "Scene: MENDY: (yawning, half asleep) Is it morning already? / SHIMSHON: (bursting in, out of breath) Get up! The snow is up to the windows! / MENDY: (suddenly wide awake) Up to the WINDOWS? New line: MENDY: Shoes? Where are my shoes? It has no direction, and he just woke up to snow. Which voice fits?", "o": ["fast and excited", "low and tired", "calm and firm"], "h": "No direction? Think what just happened to him."}], re:[{"q": "In a play, the name before the colon is...", "o": ["not read aloud", "read loudly", "read twice"], "h": "It tells you who speaks."}, {"q": "Words in ( ) tell you...", "o": ["how to say the line", "what to read aloud", "the page number"], "h": "They guide your voice."}, {"q": "Eli is excited. His lines should sound...", "o": ["quick, with energy", "slow and flat", "whispered"], "h": "Match the voice to the feeling."}]},

  var TEACH = {
    "READ.COMP.L07.05":{"hook": "The best part of a story is often the part the author never says.", "big": "Some things an author tells you outright: the words are on the page, and you can point to them. Other things he only hints. You put the clue together with what you already know about people, and you infer. And some ideas have no words and no clues behind them at all: they are not supported, no matter how good they sound. O. Henry leaves clues all through \"After Twenty Years\". A strong reader can tell which things are said and which are only hinted. A strong reader can tell the three kinds apart and say which kind his answer is.", "intro": ["Ask: can I point to the exact words? Then it is said outright.", "If not, are there clues? Clue plus what I know is an inference.", "No words and no clues? Not supported.", "Say which kind your answer is."], "ex": [{"q": "\"His scarfpin was a large diamond.\" Is \"Bob is rich\" said outright?", "steps": ["Look for the word rich: it is not there.", "Clue: a large diamond pin.", "What I know: diamonds cost a lot.", "So \"Bob is rich\" is inferred."], "a": "inferred"}, {"q": "\"About that long ago, there used to be a restaurant where this store stands.\"", "steps": ["Can I point to the words? Yes.", "So \"a restaurant stood here once\" is said outright."], "a": "said outright"}], "oops": {"q": "Bob wears a diamond pin. Is \"Bob is rich\" said outright?", "wrong": "Yes, the text says so", "right": "No, it is inferred from the diamond", "why": "The word rich is not on the page. You built it from a clue."}, "idea": ["Said, hinted, or not there: knowing which kind keeps your answers honest."], "try": {"q": "Which test tells you an answer is said outright?", "o": ["I can point to the exact words", "it sounds like a good guess", "the author uses a big word"], "a": "I can point to the exact words", "steps": ["Look for the words on the page.", "If they are there, it is said outright."]}},
    "READ.COMP.L07.06":{"hook": "Detectives do not just know. They can tell you HOW they know.", "big": "An inference is not a guess. It is built from two parts: a clue from the text, and something you already know about people and the world. In \"The Long Way Home\", Natan sees that Mr. Weiss holds the rail with both hands. He knows that people grip a rail when they cannot see the steps. So he infers that Mr. Weiss cannot see well in the dark. A strong reader can say all three parts out loud: \"The clue is..., I know that..., so I infer...\". Then he checks the inference against the rest of the story.", "intro": ["Find a clue in the text.", "Add what you already know.", "Say the inference.", "Check it against the rest of the story."], "ex": [{"q": "Mr. Weiss leaves Shalosh Seudos before dark. Why?", "steps": ["Clue: he grips the rail and looks down the dark steps.", "What I know: people grip rails when they cannot see.", "Inference: he cannot see well in the dark.", "Check: the big-letter siddur fits too."], "a": "He leaves early so he can walk home while there is still light."}, {"q": "Natan asks to walk with Mr. Weiss \"for the company.\" Why say nothing about his eyes?", "steps": ["Clue: \"He had not said one word about eyes, or the dark, or steps.\"", "What I know: people feel embarrassed when others point out their weakness.", "Inference: he wants to help without making Mr. Weiss feel old."], "a": "He offers help kindly and truthfully, so Mr. Weiss keeps his dignity."}], "oops": {"q": "\"Mr. Weiss stopped coming because he does not like herring anymore.\" Is that an inference?", "wrong": "Yes, it explains why he left", "right": "No, there is no clue for it", "why": "An inference needs a clue from the text. Nothing in the story points to the herring."}, "idea": ["Clue + what I know = inference. Say all three, and anyone can check you.", "An inference is weak when it does not fit every clue."], "try": {"q": "What two parts build an inference?", "o": ["a clue and what I know", "a title and a guess", "a picture and a feeling"], "a": "a clue and what I know", "steps": ["Find a clue in the text.", "Add what you know."]}},
    "READ.COMP.L07.07":{"hook": "Lawyers win cases with the right piece of evidence. Readers win arguments the same way.", "big": "Many quotes can be connected to a claim. Only one is the best. The best quote is on the claim (not about something else), proves the whole claim (not just half of it), and is specific (it shows, it does not just say). When a claim has two parts, like \"Gavriel notices things, and he is honest about what he does not know\", split it at the \"and\" and look for proof of each part. Then cross out quotes that are only true, only exciting, or only someone's opinion, and keep the one that proves it most clearly.", "intro": ["Split the claim into its parts.", "Collect quotes that might prove it.", "Cross out quotes that are off the claim or only opinions.", "A quote can prove the whole claim, only half the claim, or none of the claim.", "Keep the one that proves the whole claim most clearly."], "ex": [{"q": "Claim: Eli learns not to accuse without proof.", "steps": ["\"Eli was very quiet.\" Shows a feeling, not what he learned.", "\"His keys don't even fit.\" A fact about the keys.", "\"What if I had said it out loud in the lunchroom?\" Shows him seeing the harm.", "Best: the lunchroom quote."], "a": "\"What if I had said it out loud in the lunchroom?\""}, {"q": "Claim: the founder's key was the one Rabbi Rosen gave them, or one just like it.", "steps": ["Find the photo sentence about the key.", "\"It was the same key... Or one exactly like it.\"", "It proves the whole claim, both possibilities."], "a": "\"It was the same key Rabbi Rosen had laid on their table. Or one exactly like it.\""}], "oops": {"q": "Claim: Akiva is fair. Best quote?", "wrong": "\"Akiva Feldman, the editor, called it the office.\"", "right": "\"Put a man's name next to the word stole, and that is not a guess anymore.\"", "why": "The first is true but says nothing about fairness. The second shows him protecting a man from a wrong accusation."}, "idea": ["On the claim, the whole claim, and specific: that is the best quote."], "try": {"q": "What should you do first with a claim that has \"and\" in it?", "o": ["split it into two parts", "find the longest quote", "find the quote with the most names"], "a": "split it into two parts", "steps": ["Find the \"and\".", "Look for proof of each part."]}},
    "READ.COMP.L07.08":{"hook": "O. Henry hid the whole ending in one match. Did you see it the first time?", "big": "A quick first read tells you what happens. A close reading tells you how the author made it happen. Pick one paragraph that matters, reread it slowly, and ask about each detail: why this word? why here? In \"After Twenty Years\", the match that lights Bob's face seems like a small action. On a second read, after you know the ending, it is the moment the policeman recognizes him, and the moment the whole story turns. Strong readers reread on purpose, because the best clues are hidden in plain sight.", "intro": ["Read the whole text once for what happens.", "Choose one paragraph that matters.", "Reread it slowly and mark each detail.", "Ask why the author put each detail there."], "ex": [{"q": "\"The man in the doorway struck a match to look at his watch.\"", "steps": ["First read: he checks the time.", "Second read: the light shows his face to the policeman.", "Why here? It is the moment Jimmy recognizes him."], "a": "The match is the turning point, hidden as a small action."}, {"q": "\"I never thought you were so tall by two or three inches.\"", "steps": ["First read: Bob is just surprised.", "Second read: this man is not Jimmy at all."], "a": "A clue hidden in a friendly remark."}], "oops": {"q": "Is reading the whole story again, fast, a close reading?", "wrong": "Yes, any second read is close reading", "right": "No, close reading is one part, slowly", "why": "Close reading is small and slow: one paragraph, every word."}, "idea": ["The best clues are hidden in plain sight. Reread on purpose to find them."], "try": {"q": "What do you ask about a detail on a second read?", "o": ["why did the author put this here?", "is this the longest sentence?", "how many words is it?"], "a": "why did the author put this here?", "steps": ["Pick one detail.", "Ask why it is there."]}},
    "READ.FLU.L07.02":{"hook": "A scene comes alive when every speaker sounds like himself.", "big": "A play is written to be heard. The name before each line tells you who is speaking; do not read it aloud, change your voice instead. The words in parentheses, the stage directions, tell you how he says it: groaning, whispering, choosing each word. Think about who the speaker is. Eli is quick and loud when he is excited. Gavriel is quiet and careful. Akiva is calm and firm. Read the scene three times: listen first, read along second, and read it alone the third time, giving each boy his own voice.", "intro": ["Listen to the scene once and follow the words.", "Read along with the voice.", "Read it alone, out loud.", "Give each speaker his own voice, guided by the ( )."], "ex": [{"q": "ELI: (throwing up his hands) Who borrows a whole drawer?", "steps": ["Do not say \"Eli\".", "The direction says he throws up his hands: he is frustrated.", "Read it loud and fast, rising at the end."], "a": "Loud, fast, frustrated, rising at the question mark."}, {"q": "GAVRIEL: (slowly, choosing each word) So someone has been walking there for a while.", "steps": ["Slow down.", "Leave a small pause between word groups."], "a": "Slow, quiet, with small pauses."}], "oops": {"q": "Should you say \"Eli\" before Eli's line?", "wrong": "Yes, so people know who is talking", "right": "No, change your voice instead", "why": "In a play, the voice shows who is speaking. The name is only a sign for the reader."}, "idea": ["Every speaker is a person. Let your voice show who he is and how he feels."], "try": {"q": "What tells you how to say a line?", "o": ["the words in ( )", "the page number", "the name in capitals"], "a": "the words in ( )", "steps": ["Find the stage direction.", "Let it change your voice."]}},
'READ.LIT.L07.30':{ hook:'A locked room, a brass key and an empty drawer. A real reader proves what happened before he says a word.',
      big:'In chapter 1, the Beacon opens the archive. Some things the author tells you outright: the drawer is empty. Other things she only shows: a clean path, a clean chair, a wrapper. You put each clue together with what you know about people, and you make an inference: someone has been coming here. Then you prove it with the exact words. Notice too who says what. Eli says nobody has touched the room. The dust says otherwise.',
      intro:['Read the chapter once for the story.','Find the clues the author shows.','Add what you know and infer.','Prove it with the exact words.'],
      ex:[{q:'"The seat of the chair was clean too." What can you infer?', steps:['Clue: only the chair seat is clean.','I know: a seat gets clean when someone sits on it.','Inference: someone sat in that chair.'], a:'Someone has been sitting by the window.'},
          {q:'Eli: "Nobody has touched this place in fifty years." Is he right?', steps:['Eli says it, but saying is not proof.','The path in the dust shows feet walked there.','So the room proves Eli wrong.'], a:'No: the dust shows someone has been there.'}],
      oops:{ q:'"Someone has been here" is said outright in chapter 1. Right?', wrong:'Yes, the author says it', right:'No: we infer it from the clues', why:'No sentence says it. The path, the chair and the wrapper SHOW it, and we put them together.' },
      idea:['Characters can be wrong. The clues in the room cannot lie.'],
      'try':{ q:'What turns a clue into an inference?', o:['adding what you already know','reading it twice','copying the clue word for word'], a:'adding what you already know', steps:['Find the clue.','Ask what you know about it from life.'] } },
    'READ.LIT.L07.31':{ hook:'Eli wants a suspect. Akiva wants proof. Which one makes a better reporter?',
      big:'In chapter 2, Akiva draws a line down the whiteboard: PROVED on one side, GUESSED on the other. That line is the heart of reading like a detective. What you saw goes on the left. What you think goes on the right, until you prove it. Watch the words, too: "stole" blames someone before there is proof. Gavriel reads the dust like a clock: not this morning, not years ago, so weeks. That is an inference with its steps shown.',
      intro:['List what the boys saw.','List what they only think.','Watch for words that judge.','Move a guess only with proof.'],
      ex:[{q:'"Someone stole the files." Which side?', steps:['Did anyone see a theft? No.','"Stole" already blames someone.','So it is a guess, and a strong word too.'], a:'GUESSED, and better said as "took" or "borrowed".'},
          {q:'"A clean path in the dust." Which side?', steps:['Gavriel took a photo of it.','Every boy saw it.','So it is proved.'], a:'PROVED'}],
      oops:{ q:'Eli says Mr. Dahan has keys to every door, so it must be him. Fair?', wrong:'Yes: he has the most keys', right:'No: having keys is not using them', why:'One clue can fit many people. Eli jumped from "could" to "did".' },
      idea:['A guess is fine. Printing a guess as a fact is not.'],
      'try':{ q:'Which side does a guess go on until it is proved?', o:['GUESSED','PROVED','neither, erase it'], a:'GUESSED', steps:['Ask: did anyone see it?','If not, it waits on the right.'] } },
    'READ.LIT.L07.32':{ hook:'One cup of tea, one old photograph, and the mystery turns.',
      big:'In chapter 3, three clues arrive. Mr. Dahan\'s keys do not fit, so he is not the visitor. Mr. Dahan sees a light under the door on Tuesdays and Thursdays, the only afternoons he is there to look. So the visitor comes at least on those days, and maybe on others too. And an old photograph shows the founder holding a key on a string, with his son beside him. Each inference has two parts: the clue in the text and what you already know. Say both, so your thinking can be checked.',
      intro:['Find the clue in the text.','Say what you already know.','Join them into an inference.','Check: does a second clue agree?'],
      ex:[{q:'The founder holds a key on a string in the 1951 photo.', steps:['Clue: the key on a string looks like Rabbi Rosen\'s key.','I know: the founder\'s key was never found.','Inference: this is the lost second key.'], a:'The photo shows the missing key.'},
          {q:'Mr. Dahan sees the light on Tuesdays and Thursdays.', steps:['Clue: he sees it on the two days he stays late.','I know: he is not there to look on the other days.','Inference: the visitor comes at least on those days, maybe more.'], a:'Someone visits at least on Tuesdays and Thursdays.'}],
      oops:{ q:'"The light proves a thief is inside." Right?', wrong:'Yes: a secret light means a thief', right:'No: it proves someone is inside, not why', why:'Mr. Dahan himself thought a rebbe was working. The clue tells who-is-there, not why.' },
      idea:['Show your thinking: the clue AND what you know.'],
      'try':{ q:'Which two parts make an inference?', o:['a clue and what I know','a title and a picture','a quote and a title'], a:'a clue and what I know', steps:['Point to the clue.','Add what you know from life.'] } },
    'READ.LIT.L07.33':{ hook:'Five boys, two tables and a Gemara. The strangest stakeout in the history of newspapers.',
      big:'In chapter 4, the mystery of WHO is solved. Go back and see how fair the author was: the peppermint, the path, the light, the key on a string, the boy in the photo. Every clue pointed one way. But notice HOW the boys find out: Akiva will not burst in on an old man. They get Mr. Gross and knock. A good reader and a good reporter check an answer by asking, with respect. And the chapter ends with a new question: why?',
      intro:['Line up the clues from chapters 1 to 3.','See if chapter 4 confirms them.','Tell what is said from what is inferred.','Find the new question at the end.'],
      ex:[{q:'"Nu," said Reb Feivel. "The reporters. I wondered how long it would take you."', steps:['Clue: he is not surprised to see them.','I know: people who expect a visit are not shocked.','Inference: he knew the boys were looking.'], a:'He expected them to find him.'},
          {q:'From his coat pocket hung a faded red string.', steps:['Clue: a red string, like on the founder\'s key.','I know: the founder\'s key went missing in 1979.','Inference: Reb Feivel has his father\'s key.'], a:'He has the second key.'}],
      oops:{ q:'"Reb Feivel had a key, so he did something wrong." Right?', wrong:'Yes: a secret key is wrong', right:'No: a key shows HOW he got in, not WHY', why:'The key was his father\'s. Only his reason will tell us if anything was wrong.' },
      idea:['Solving who is not the end. A good reader asks why.'],
      'try':{ q:'How do the boys check their answer?', o:['they knock and ask','they shout through the door','they wait for him to leave'], a:'they knock and ask', steps:['Think about what Akiva says to Eli.'] } }

    "READ.COMP.L07.05":{"s": "Can you point to the exact words? Said outright.\nNo words, but clues? Clue + what you know = inferred.\nNo words and no clues? Not supported.", "q": {"Passage: \"Rivky's brother Moshe had read the same page of his sefer four times. He had set out the good cups on the table, the ones with the gold rims. Every time a car door slammed outside, his head came up. When the Golds' van finally turned into the driveway, the sefer was face-down on the couch and Moshe was already on the porch, waving with both arms.\" \"Moshe set out the good cups.\" What is this?": "Test 1: exact words? Test 2: a clue plus what you know? Neither: no support.", "Passage: \"Rivky's brother Moshe had read the same page of his sefer four times. He had set out the good cups on the table, the ones with the gold rims. Every time a car door slammed outside, his head came up. When the Golds' van finally turned into the driveway, the sefer was face-down on the couch and Moshe was already on the porch, waving with both arms.\" \"Moshe had been waiting a long time.\" What is this?": "Test 1: exact words? Test 2: a clue plus what you know? Neither: no support.", "Passage: \"Rivky's brother Moshe had read the same page of his sefer four times. He had set out the good cups on the table, the ones with the gold rims. Every time a car door slammed outside, his head came up. When the Golds' van finally turned into the driveway, the sefer was face-down on the couch and Moshe was already on the porch, waving with both arms.\" \"Moshe was angry at Rivky.\" What is this?": "Test 1: exact words? Test 2: a clue plus what you know? Neither: no support.", "\"Rivky's brother Dov smiled when he saw the cake.\" \"Dov smiled\" is...": "Can you point to the words?", "\"Dov smiled when he saw the cake.\" \"Dov likes cake\" is...": "The text hints it with a clue.", "\"Dov smiled when he saw the cake.\" \"Dov baked the cake himself\" is...": "Is there any word or clue about who baked it?"}},
    "READ.COMP.L07.06":{"s": "Find a clue in the text.\nAdd what you already know about people.\nSay it: the clue is..., I know..., so I infer...", "q": {"Passage: \"On Sunday, Shimmy's little brother told everyone that Shimmy had a cold. Every afternoon this week, Shimmy has come home from yeshiva, walked past the kitchen without a word, and gone straight to his room. His supper sits on the table, hardly touched. Tonight his father found him at his desk, still in his coat, staring at a math test with a red 54 at the top. He was not coughing.\" Explanation: \"The red 54 is on his test. A low mark can make a boy ashamed. So Shimmy is upset.\" Which part is \"A low mark can make a boy ashamed\"?": "Is it in the passage, from your own life, or your conclusion?", "Passage: \"On Sunday, Shimmy's little brother told everyone that Shimmy had a cold. Every afternoon this week, Shimmy has come home from yeshiva, walked past the kitchen without a word, and gone straight to his room. His supper sits on the table, hardly touched. Tonight his father found him at his desk, still in his coat, staring at a math test with a red 54 at the top. He was not coughing.\" Explanation: \"He was not coughing, and a boy with a cold coughs, so the cold is not the reason.\" Which part is \"He was not coughing\"?": "Is it in the passage, from your own life, or your conclusion?", "Passage: \"On Sunday, Shimmy's little brother told everyone that Shimmy had a cold. Every afternoon this week, Shimmy has come home from yeshiva, walked past the kitchen without a word, and gone straight to his room. His supper sits on the table, hardly touched. Tonight his father found him at his desk, still in his coat, staring at a math test with a red 54 at the top. He was not coughing.\" \"Shimmy is still sick with his cold.\" Why is this the weaker inference?": "Test it against each clue, the last line too.", "Clue: the floor is wet and the window is open. What I know: rain comes in open windows. Inference?": "Join the clue to what you know.", "Which is an EXPLAINED inference?": "Look for the clue and the reason.", "An inference with no clue behind it is...": "No clue, no inference."}},
    "READ.COMP.L07.07":{"s": "Split the claim into its parts.\nCross out quotes that are off the claim, half the claim, or only opinion.\nKeep the one that SHOWS the whole claim most clearly.", "q": {"Passage: \"Pinny stayed after Maariv to stack the chairs. He found Mr. Rubinstein's wallet under the last bench, full of money. He did not take one dollar. He ran down the block in the rain to Mr. Rubinstein's house, rang the bell twice, and held it out with both hands. 'You dropped this,' he said, 'I think.' He gave it back without a word about himself, and forgot to tell anyone.\" Claim: Pinny is honest AND humble. How much of the claim does \"He did not take one dollar\" prove?": "Split the claim: honest, humble. Test this line on each part.", "Passage: \"Pinny stayed after Maariv to stack the chairs. He found Mr. Rubinstein's wallet under the last bench, full of money. He did not take one dollar. He ran down the block in the rain to Mr. Rubinstein's house, rang the bell twice, and held it out with both hands. 'You dropped this,' he said, 'I think.' He gave it back without a word about himself, and forgot to tell anyone.\" Claim: Pinny is honest AND humble. As proof, \"He found Mr. Rubinstein's wallet under the last bench, full of money\" is...": "Does finding something show honesty, or what he does next?", "Passage: \"Pinny stayed after Maariv to stack the chairs. He found Mr. Rubinstein's wallet under the last bench, full of money. He did not take one dollar. He ran down the block in the rain to Mr. Rubinstein's house, rang the bell twice, and held it out with both hands. 'You dropped this,' he said, 'I think.' He gave it back without a word about himself, and forgot to tell anyone.\" Claim: Pinny is honest AND humble. \"He gave it back without a word about himself, and forgot to tell anyone\" proves...": "Check each half of the claim against the words.", "Claim: \"The trip was long and tiring.\" Which quote is best?": "Which shows long AND tiring?", "A claim with two parts usually needs...": "Each part needs its own proof.", "\"It was a great game,\" said Eli. As proof that the team played well, this is...": "Is it what happened, or what he thinks?"}},
    "READ.COMP.L07.08":{"s": "Read once for what happens.\nPick one paragraph and reread it slowly.\nAsk about each detail: why this word? why here?", "q": {"Passage: \"Zeidy took the old watch out of the drawer, wound it slowly, and held it to his ear. For a long moment he said nothing. Then he put it in Yossi's hand and closed the boy's fingers around it, one at a time. 'It still runs,' he said. 'It only needs someone to wind it.'\" What does \"For a long moment he said nothing\" do?": "A pause in a story is a choice. What is it doing here?", "Passage: \"Zeidy took the old watch out of the drawer, wound it slowly, and held it to his ear. For a long moment he said nothing. Then he put it in Yossi's hand and closed the boy's fingers around it, one at a time. 'It still runs,' he said. 'It only needs someone to wind it.'\" On a second read, \"It only needs someone to wind it\"...": "Reread the last line. Why would Zeidy say it to Yossi?", "Passage: \"Zeidy took the old watch out of the drawer, wound it slowly, and held it to his ear. For a long moment he said nothing. Then he put it in Yossi's hand and closed the boy's fingers around it, one at a time. 'It still runs,' he said. 'It only needs someone to wind it.'\" What does \"closed the boy's fingers around it, one at a time\" do?": "A slow action is a choice. What is it doing here?", "Close reading means...": "Slow and small.", "On a second read, you ask about each detail...": "Every detail is a choice.", "In a mystery, clues are often...": "The author plays fair, but quietly."}},
    "READ.FLU.L07.02":{"s": "Do not read the name or the ( ) out loud.\nThe ( ) tells you HOW to say the line.\nGive each speaker the voice that fits who he is.", "q": {"Scene: MENDY: (yawning, half asleep) Is it morning already? / SHIMSHON: (bursting in, out of breath) Get up! The snow is up to the windows! / MENDY: (suddenly wide awake) Up to the WINDOWS? New line: SHIMSHON: (whispering, so Zeidy won't hear) Get up! Snow! Which voice fits this new line?": "The words are exciting. What does the direction ask for?", "Scene: MENDY: (yawning, half asleep) Is it morning already? / SHIMSHON: (bursting in, out of breath) Get up! The snow is up to the windows! / MENDY: (suddenly wide awake) Up to the WINDOWS? / ZEIDY: Nu, boys. Shoes on. The snow will wait for no one. Zeidy's line has no direction. Which voice fits it?": "No direction? Read his words. Is Zeidy rushing, whispering, or steady?", "Scene: MENDY: (yawning, half asleep) Is it morning already? / SHIMSHON: (bursting in, out of breath) Get up! The snow is up to the windows! / MENDY: (suddenly wide awake) Up to the WINDOWS? New line: MENDY: Shoes? Where are my shoes? It has no direction, and he just woke up to snow. Which voice fits?": "No direction? Think what just happened to him.", "In a play, the name before the colon is...": "It tells you who speaks.", "Words in ( ) tell you...": "They guide your voice.", "Eli is excited. His lines should sound...": "Match the voice to the feeling."}},
