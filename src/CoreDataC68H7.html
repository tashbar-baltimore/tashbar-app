    "READ.COMP.L07.05":{"band": "M68", "pic": "🕵️", "today": "Tell what is said outright from what is only hinted", "why": "Authors do not tell you everything. The best part of a story is often the part you figure out yourself.", "ready": [{"q": "\"Avi's cheeks were red, and he was breathing hard.\" Which is said outright?", "o": ["Avi was breathing hard.", "Avi had been running all the way home.", "Avi was scared."], "a": "Avi was breathing hard."}], "bridge": "READ.COMP.L06.07", "bridgeName": "Two Clues, One Inference", "watch": {"q": "After Twenty Years", "m": {"type": "scene", "e": "🌧️", "t": "\"He tried doors as he went, twirling his club, now and then turning to cast his watchful eye down the quiet street.\""}, "steps": [{"t": "Said outright first: he tries doors and twirls a club."}, {"t": "I can point to those words. Nobody can argue."}, {"t": "Now the hint: why try every shop door at night?"}, {"t": "Clue plus what I know: police check that shops are locked."}, {"t": "Inferred: he takes his job seriously."}, {"t": "Teach it back: tell your chavrusa one said fact and one inference."}], "a": "Said outright: he tries doors. Inferred: he takes his job seriously."}, "oops": {"q": "Bob has a diamond pin and a diamond watch. Is \"Bob is rich\" said outright?", "wrong": "Yes, it is right there", "right": "No, it is inferred from the diamonds", "why": "The word rich is not in the text. You joined the diamonds to what you know."}, "ways": ["worked example", "read the whole story", "Mistake Detective", "find the proof", "tap the reason", "teach it back"], "done": "You can tell said outright, inferred and not supported apart!", "board": {"one": "Said outright: point to the words. Inferred: clue + what I know. Not supported: no words, no clues.", "activity": "Three columns on the board. Read one paragraph of \"After Twenty Years\" aloud. Boys call out statements about Bob; the class votes on the column and proves it.", "mistakes": ["Calling an inference \"said outright\" because it feels obvious", "Calling a wild guess an inference", "Forgetting to name the clue"]}, "do": [{"type": "read", "text": "C68.ST6.01", "say": "Read \"After Twenty Years\" to the very end.", "how": "Notice what the author tells you, and what he only hints."}, {"type": "sort", "mis": true, "bins": ["Said outright", "Inferred", "Not supported"], "cards": [["The restaurant was torn down five years ago.", 0], ["Bob looks down on Jimmy a little.", 1], ["Bob owns a ranch out West.", 2], ["Bob came a thousand miles to be there.", 0], ["Jimmy felt torn about his old friend.", 1]], "say": "Watch the trap! Said, inferred, or not supported?", "how": "Can you point to the exact words? Then it is said outright."}], "your": [{"type": "proof", "text": "C68.ST6.01", "q": "Which sentence says OUTRIGHT how Jimmy knew Bob?", "proof": "I saw it was the face of the man wanted in Chicago", "look": "the words in Jimmy's note", "say": "Find where the story says it outright.", "how": "Read Jimmy's note on the last page."}, {"type": "evidence", "q": "Which line only HINTS that Bob did not get rich honestly?", "p": ["\"You see, the West is a pretty big place.\"", "His scarfpin was a large diamond, oddly set.", "\"I came a thousand miles to stand in this door tonight.\""], "a": 1, "look": "a detail that seems odd once you know the ending", "say": "Tap the line with the hint.", "how": "Read each line twice. Which one hints at more than it says?"}, {"type": "match", "pairs": [["said outright", "you can point to the exact words"], ["inferred", "a clue plus what you know"], ["not supported", "no words and no clues"]], "say": "Match each kind of answer to its test.", "how": "Ask: words, clues, or nothing?"}, {"type": "listen", "hear": "\"Is that you, Bob?\" he asked, doubtfully.", "o": ["he may not be the real Jimmy", "he is cold, tired and wet from the long walk in the rain", "he is angry at Bob for being late"], "a": "he may not be the real Jimmy", "cap": "What does \"doubtfully\" hint about the tall man?", "say": "Listen. What does that one word hint?", "how": "Would a true old friend ask \"doubtfully\"?"}, {"type": "cloze", "t": "\"Bob has a brother in Chicago.\" This idea is ___.", "o": ["not supported", "said outright", "inferred"], "a": "not supported", "say": "Challenge! Tap the words that fit.", "how": "Look for words, then clues. If neither, what is it?"}]},
    "READ.COMP.L07.06":{"band": "M68", "pic": "🪜", "today": "Make an inference, then explain the clue and what you know", "why": "Anyone can guess. A strong reader can show the steps of his thinking, so others can check it.", "ready": [{"q": "Clue: Chaim's coat is dripping. What can you infer?", "o": ["it is raining outside", "Chaim is hungry", "Chaim is late for his bus to school"], "a": "it is raining outside"}], "bridge": "READ.COMP.L06.07", "bridgeName": "Two Clues, One Inference", "watch": {"q": "The Long Way Home", "m": {"type": "scene", "e": "🪜", "t": "\"He stopped on the top step and looked down for a long moment, holding the cold metal rail with both hands, before he took the first step.\""}, "steps": [{"t": "Bottom rung, the clue: he grips the rail with both hands."}, {"t": "He also looks down a long moment first."}, {"t": "Next rung, what I know: people grip rails when they cannot see."}, {"t": "Top rung, the inference: Mr. Weiss cannot see well in the dark."}, {"t": "Check it: the big-letter siddur fits too."}, {"t": "Say it: the clue is..., I know..., so I infer..."}, {"t": "Teach it back: climb the ladder out loud for your chavrusa."}], "a": "The clue is the rail, I know people grip rails when they cannot see, so I infer his eyes are weak."}, "oops": {"q": "\"Mr. Weiss stopped staying because he does not like herring anymore.\" An inference?", "wrong": "Yes, it explains why he left", "right": "No, there is no clue for it", "why": "An inference stands on a clue. Nothing points to the herring. An inference is also weak when it does not fit every clue."}, "ways": ["inference ladder", "read the whole story", "Mistake Detective", "find the proof", "tap the reason", "teach it back"], "done": "You can make an inference and explain every step of it!", "board": {"one": "Clue (from the text) + what I know (from life) = inference. Then check it against the rest.", "activity": "Draw a three-rung ladder. Give one clue from the story; pairs of boys fill the \"what I know\" rung and the inference, then read their ladder to another pair, who must find a second clue that fits.", "mistakes": ["Giving an inference with no clue", "Using a clue but skipping the \"what I know\" step", "Not checking the inference against the rest of the story"]}, "do": [{"type": "read", "text": "C68.ST6.02", "say": "Read \"The Long Way Home\" to the end.", "how": "Watch what Natan notices about Mr. Weiss."}, {"type": "storymap", "slots": ["Clue from the text", "What I know", "Inference"], "cards": ["His siddur has very big letters.", "Big letters help people who see poorly.", "Mr. Weiss cannot see well."], "extra": ["Mr. Weiss is grumpy."], "say": "Build the inference ladder.", "how": "Clue from the story, then what you know, then the inference."}], "your": [{"type": "evidence", "mis": true, "q": "Natan infers that Mr. Weiss cannot see well. Which detail is NOT a clue for it?", "p": ["He leaned close and asked the man next to him to repeat the page number.", "He had a small white beard and a gray hat with a soft brim.", "He walked home very slowly, close to the houses."], "a": 1, "look": "a detail that says nothing about his eyes", "say": "Watch the trap! Which detail is not a clue?", "how": "True is not enough. Does it say anything about seeing?"}, {"type": "sort", "bins": ["Clue from the text", "What I already know"], "cards": [["He walks home close to the houses.", 0], ["Older eyes need more light to see well.", 1], ["Older people often walk slowly on dark streets.", 1], ["He stands by the side door, near the street.", 0]], "say": "Clue from the story, or what you know?", "how": "Is it in the story, or in your head?"}, {"type": "proof", "text": "C68.ST6.02", "q": "What does Mr. Weiss ask for at his door?", "proof": "If someone could walk me home after", "look": "what Mr. Weiss says at his door", "say": "Find the proof that Natan was right.", "how": "Read what Mr. Weiss says on the last page."}, {"type": "listen", "hear": "Every morning this week, Shmuli has come to class with wet hair and his shirt untucked, just as the bell rings.", "o": ["his mornings are rushed", "he went swimming", "he does not like school"], "a": "his mornings are rushed", "cap": "Which inference has the clues behind it?", "say": "Listen. Tap the inference the clues support.", "how": "Wet hair, untucked, just in time. What do you know?"}, {"type": "order", "steps": ["The clue: he said not one word about eyes.", "I know: people feel small when others point out a weakness.", "So I infer he wants to help without shaming him.", "Mr. Weiss relaxing fits too."], "say": "Challenge! Explain why Natan asks for \"the company.\"", "how": "Clue, what I know, inference, then check."}]},
    "READ.COMP.L07.07":{"band": "M68", "pic": "🎯", "today": "Pick the quote that proves the whole answer best", "why": "Many quotes are connected to an answer. Only one proves it best. Finding it is what makes an argument win.", "ready": [{"q": "Claim: \"The soup was very hot.\" Which line proves it?", "o": ["Steam rose from the bowl, and Dovi blew on every spoonful.", "The soup had carrots in it.", "Mommy made the soup on Friday morning, with carrots and noodles in it."], "a": "Steam rose from the bowl, and Dovi blew on every spoonful."}], "bridge": "READ.COMP.L06.08", "bridgeName": "Strongest Evidence", "watch": {"q": "The Light After Minchah", "m": {"type": "scene", "e": "🎯", "t": "Claim: Eli learns not to accuse without proof. \"Eli was very quiet.\" / \"His keys don't even fit.\" / \"What if I had said it out loud in the lunchroom? Half the yeshiva would think he was a thief by Minchah.\""}, "steps": [{"t": "Split the claim: Eli LEARNS something about accusing."}, {"t": "\"Eli was very quiet.\" A feeling, not a lesson. Cross it out."}, {"t": "\"His keys don't even fit.\" A fact about keys. Cross it out."}, {"t": "\"What if I had said it out loud in the lunchroom?\""}, {"t": "Here Eli sees the harm a guess can do."}, {"t": "Best quote: the lunchroom line. It shows the whole claim."}, {"t": "Some quotes prove only half the claim. Check both halves."}, {"t": "Teach it back: tell your chavrusa why the other two lose."}], "a": "The lunchroom quote proves the whole claim."}, "oops": {"q": "Claim: Akiva is fair. Best quote?", "wrong": "\"It is going to be the most careful issue we ever printed.\"", "right": "\"Put a man's name next to the word stole, and that is not a guess anymore.\"", "why": "The first is true but says nothing about fairness. The second shows him protecting a man from a wrong accusation."}, "ways": ["worked example", "split the claim", "Mistake Detective", "find the proof", "tap the reason", "challenge round", "teach it back"], "done": "You can pick the quote that proves the whole answer best!", "board": {"one": "Best quote: on the claim, the whole claim, and specific. Split a two-part claim and prove each part.", "activity": "Write one claim and five quotes on the board. Boys cross out quotes one at a time, giving a reason each time (\"off the claim\", \"only half\", \"only opinion\"), until one is left.", "mistakes": ["Choosing the longest or most exciting quote", "Proving only one half of a two-part claim", "Using a character's opinion as proof of what happened"]}, "do": [{"type": "evidence", "q": "Claim: Mr. Dahan respects the rule about the archive. Which quote proves it best?", "p": ["\"I know every pipe down here by its first name.\"", "\"So it stays locked.\"", "\"Old buildings have their secrets.\""], "a": 1, "look": "what he does once he hears the rule", "say": "Tap the quote that proves the claim best.", "how": "Which quote shows him following the rule?"}, {"type": "sort", "mis": true, "bins": ["Proves part 1: he notices", "Proves part 2: he is honest", "Proves neither"], "cards": [["He crouched down and held the flashlight low.", 0], ["\"It is what the dust tells me. It is not a fact.\"", 1], ["Gavriel had brought his camera.", 2], ["\"Not yet,\" Gavriel admitted.", 1]], "say": "Watch the trap! Two parts, two proofs.", "how": "Claim: Gavriel notices things AND is honest. Which part does each prove?"}], "your": [{"type": "proof", "text": "C68.W1.03", "q": "Claim: the old photos are easy to miss. Which sentence by the author (not a character) proves it best?", "proof": "most boys walked past them a hundred times without seeing them at all", "look": "what the boys do when they pass the photos", "say": "Find the best proof in Chapter 3.", "how": "Read the page where Gavriel shows the old picture."}, {"type": "listen", "hear": "Claim: Yoni knows how to get people talking. Proof: Yoni did not come with a list of hard questions. He came with two cups of hot tea.", "o": ["it shows what he does to make people comfortable", "it shows Yoni is polite to grown-ups", "it tells us that Yoni likes hot tea more than anything else"], "a": "it shows what he does to make people comfortable", "cap": "Why is this the best proof?", "say": "Listen. Tap why this proof is best.", "how": "Does the proof SHOW the claim, or something else?"}, {"type": "match", "pairs": [["Benny keeps his clue to himself", "\"and he said nothing at all\""], ["The drawer was cleared on purpose", "\"The drawers below it were full and dusty.\""], ["Nobody cleans the archive", "\"thick enough to write your name in\""]], "say": "Match each claim to its best quote.", "how": "Which quote shows exactly that claim?"}, {"type": "cloze", "t": "\"Eli was very quiet\" shows a feeling. For the claim \"Eli learned not to accuse,\" it proves ___.", "o": ["too little", "the whole claim", "the opposite"], "a": "too little", "say": "Tap the words that fit.", "how": "Does a feeling show what he LEARNED?"}, {"type": "evidence", "q": "Claim: Akiva wants the truth AND wants to be kind. Which quote proves BOTH?", "p": ["\"We are not going to accuse anyone. We are going to watch, and we are going to learn.\"", "\"Rule of the newsroom.\"", "\"It is going to be the most careful issue we ever printed,\" said Akiva, and took the key back."], "a": 0, "look": "a line with both truth and kindness in it", "say": "Challenge! Tap the quote that proves both parts.", "how": "Find the line that seeks the truth without hurting anyone."}]},
    "READ.COMP.L07.08":{"band": "M68", "pic": "🔍", "today": "Reread one paragraph to catch what a quick read missed", "why": "Authors hide their best clues in plain sight. A second, slow read finds them.", "ready": [{"q": "You finished a story and the ending surprised you. What helps you see how it happened?", "o": ["reread the important part slowly", "start the next story in the book right away", "read only the title again"], "a": "reread the important part slowly"}], "bridge": "READ.COMP.L07.05", "bridgeName": "Said or Hinted?", "watch": {"q": "After Twenty Years", "m": {"type": "scene", "e": "🔥", "t": "\"Is that you, Bob?\" he asked, doubtfully. ... \"You've changed lots, Jimmy. I never thought you were so tall by two or three inches.\" \"Oh, I grew a bit after I was twenty.\""}, "steps": [{"t": "First read: two old friends meet. Bob says Jimmy looks taller."}, {"t": "Now reread slowly. The man asks \"doubtfully\". Why?"}, {"t": "A true old friend would be sure."}, {"t": "Why does Bob notice the height? Because this man is NOT Jimmy."}, {"t": "The clue hides inside a friendly joke, so we miss it."}, {"t": "Close reading: one paragraph, slowly, asking why each detail is there."}, {"t": "Teach it back: show your chavrusa the two clues you missed."}], "a": "\"Doubtfully\" and \"so tall\" were clues the man was not Jimmy."}, "oops": {"q": "Is reading the whole story again, fast, a close reading?", "wrong": "Yes, any second read counts", "right": "No: one paragraph, slowly, every detail", "why": "A fast reread only shows what happens again. Close reading slows down to see how."}, "ways": ["worked example", "reread one paragraph", "Mistake Detective", "find the proof", "tap the reason", "chavrusa", "teach it back"], "done": "You can reread one paragraph and catch what a quick read missed!", "board": {"one": "Close reading: one paragraph, slowly. Ask of each detail: why this word, why here?", "activity": "Project one paragraph of \"After Twenty Years\". Read it once together. Then each chavrusa pair underlines one detail they missed, and explains to the class what it shows once you know the ending.", "mistakes": ["Rereading everything fast instead of one part slowly", "Noticing a detail but not asking why it is there", "\"Noticing\" something that is not in the text"]}, "do": [{"type": "evidence", "q": "Reread Jimmy's note: \"I saw it was the face of the man wanted in Chicago.\" Which earlier detail let him see the face?", "p": ["\"The light showed a pale, square-jawed face with keen eyes.\"", "\"There was now a fine, cold drizzle falling.\"", "\"The waiting man pulled out a handsome watch, the lids of it set with small diamonds.\""], "a": 0, "look": "an earlier moment when the face was lit up", "say": "Tap the detail the ending points back to.", "how": "How could anyone see a face on a dark street?"}, {"type": "sort", "mis": true, "bins": ["Close reading", "Not close reading"], "cards": [["Reread the match paragraph slowly.", 0], ["Read the whole story again, fast.", 1], ["Ask why the man spoke \"doubtfully\".", 0], ["Notice \"glare\" but never ask why it is there.", 1]], "say": "Watch the trap! Which ones are close reading?", "how": "Close reading is one part, slowly, asking why."}], "your": [{"type": "proof", "text": "C68.ST6.01", "q": "In the drug-store glare, which sentence tells what Bob sees in the man's face?", "proof": "not long enough to change a man's nose from a Roman to a pug", "look": "what Bob notices in the bright light", "say": "Find the moment Bob sees the truth.", "how": "Reread the paragraph with the bright lights."}, {"type": "listen", "hear": "There was now a fine, cold drizzle falling, and the wind had risen.", "o": ["a lonely mood for Bob", "Bob is about to give up and go home", "the policeman needs a warmer coat"], "a": "a lonely mood for Bob", "cap": "What does the weather do to the scene?", "say": "Listen. What does the weather add?", "how": "Reread slowly. How does the street feel now?"}, {"type": "match", "pairs": [["\"his hand... trembled a little\"", "it shows a feeling without saying it"], ["Bob calls Jimmy \"a plodder\"", "it means more than it says"], ["\"The policeman on the beat moved up the avenue\"", "it sets up the scene"]], "say": "Match each detail to what it does.", "how": "Reread each detail. What job does it do?"}, {"type": "cloze", "t": "Bob calls Jimmy a \"plodder.\" On a second read, the plodder is the one who ___ him.", "o": ["recognized", "congratulated", "forgot"], "a": "recognized", "say": "Tap the word that fits.", "how": "Who wins at the end, the fast talker or the plodder?"}, {"type": "order", "steps": ["Read the drug-store paragraph once.", "Mark the word \"glare\".", "Ask why the light matters here.", "Link it to the match at the start."], "say": "Challenge! Close-read the drug-store paragraph in order.", "how": "Read, mark, ask why, then link."}]},
    "READ.FLU.L07.02":{"band": "M68", "pic": "🎭", "today": "Read dialogue so each speaker sounds like himself", "why": "Stories are full of people talking. When your voice shows who is speaking, the scene comes alive.", "ready": [{"q": "Which line should be read quietly, with a hurt voice?", "o": ["(quietly, hurt) It's fine. Go without me.", "(cheerful, waving to everyone) Good morning, everybody!", "(loudly) Lunch is ready!"], "a": "(quietly, hurt) It's fine. Go without me."}], "bridge": "READ.FLU.L06.02", "bridgeName": "Who Is Talking?", "watch": {"q": "Proved and Guessed (a scene)", "m": {"type": "scene", "e": "🎭", "t": "ELI: (throwing up his hands) Who borrows a whole drawer?\nAKIVA: I don't know yet. That is why it is on the right side.\nGAVRIEL: (slowly, choosing each word) So someone has been walking there for a while."}, "steps": [{"t": "First, the names: Eli, Akiva, Gavriel. I do not say them."}, {"t": "Eli throws up his hands. Loud and fast, rising at the end."}, {"t": "Akiva has no direction, so I use who he is."}, {"t": "He is the steady editor: calm and firm."}, {"t": "Gavriel chooses each word. I slow down and pause."}, {"t": "Three boys, three voices. No names needed."}, {"t": "Teach it back: read a line. Can your chavrusa guess who?"}], "a": "Eli loud and fast, Akiva calm, Gavriel slow and quiet."}, "oops": {"q": "Should you say \"Eli\" before Eli's line?", "wrong": "Yes, so people know who is talking", "right": "No, change your voice instead", "why": "The voice shows who is speaking. The name is only a sign for the reader."}, "ways": ["read it 3 times", "listen to a model", "Readers' Theatre", "Mistake Detective", "tap the reason", "teach it back"], "done": "You can read a scene so every speaker sounds like himself!", "board": {"one": "Names and ( ) are not read aloud. The ( ) shapes the voice. Each speaker sounds like who he is.", "activity": "Readers' Theatre: four boys take Akiva, Eli, Gavriel and the narrator. They read the scene twice, switching parts the second time. The class guesses who is speaking with eyes closed.", "mistakes": ["Reading the speaker's name aloud", "Reading the stage direction aloud", "Reading every speaker in the same voice"]}, "do": [{"type": "read", "text": "C68.FL6.01", "say": "Read the scene 3 times: listen, read along, read alone.", "how": "Tap the speaker to hear it first. Then read with it. Then alone."}, {"type": "sort", "mis": true, "bins": ["Read it aloud", "Do not read it aloud"], "cards": [["AKIVA:", 1], ["Can we prove it?", 0], ["(impatient)", 1], ["Weeks, maybe. Again and again.", 0]], "say": "Watch the trap! What do you say out loud?", "how": "Names and ( ) guide your voice. You do not say them."}], "your": [{"type": "match", "pairs": [["(groaning)", "low and tired"], ["(honestly)", "plain and sincere"], ["(to himself, very softly)", "almost a whisper"]], "say": "Match each direction to its voice.", "how": "Act the words in ( ) with your voice."}, {"type": "evidence", "q": "Which line should be read the most slowly?", "p": ["ELI: (writing fast, excited) Someone stole the files! Someone has a second key! Someone is hiding the yeshiva's history!", "GAVRIEL: (honestly) Not yet. It is what the dust tells me. It is not a fact.", "ELI: (throwing up his hands) Who borrows a whole drawer?"], "a": 1, "look": "the speaker who weighs every word", "say": "Tap the line to read most slowly.", "how": "Which speaker weighs every word?"}, {"type": "listen", "hear": "Stole is a strong word. Maybe someone borrowed them.", "o": ["Akiva, calm and firm", "Eli, loud and impatient", "Gavriel, quiet and unsure"], "a": "Akiva, calm and firm", "cap": "Who is speaking, and how?", "say": "Listen to the line. Who says it?", "how": "Whose line is it in the scene? How does he feel?"}, {"type": "cloze", "t": "YONI: Rebbe, who started the yeshiva? No direction here, and Yoni talks to everyone, so he should sound ___.", "o": ["curious and friendly", "bored and flat, like reading a list", "angry and loud"], "a": "curious and friendly", "say": "No direction. Use who he is.", "how": "What kind of reporter is Yoni?"}, {"type": "order", "steps": ["Skip the name: Eli.", "Use the direction: throwing up his hands.", "Read the line aloud, fast and rising."], "say": "Challenge! Plan your reading of Eli's line.", "how": "Name first, then direction, then your voice."}]},
'READ.LIT.L07.30':{ band:'M68', pic:'🗝️', today:'Read chapter 1 and prove what the room shows',
      why:'A locked room cannot talk, but its dust can. Prove what happened from the clues.',
      ready:[{q:'Which one is an inference?', o:['The muddy boots mean he came in from the rain.','The boots by the front door are brown, and they are size six.','He has boots.'], a:'The muddy boots mean he came in from the rain.'}],
      bridge:'READ.COMP.L06.07', bridgeName:'Two Clues, One Inference',
      watch:{ q:'The Key on the Red String', m:{type:'scene', e:'🗄️', t:'The top drawer said 1951–1955. He pulled it open. It was empty.'}, steps:[
        {t:'Said outright: the top drawer is empty.'},
        {t:'Notice too: the drawers below are full.'},
        {t:'What I know: nobody empties one drawer by accident.'},
        {t:'Inference: someone took those years on purpose.'},
        {t:'Proof: point to "It was empty," then to the full drawers.'},
        {t:'No words and no clues? Then it is not supported.'},
        {t:'Teach it back: give your chavrusa clue, knowledge, inference.'}], a:'Someone took the first five years on purpose.' },
      oops:{ q:'"Someone has been in the room" is said outright. Right?', wrong:'Yes, the chapter says it', right:'No: we infer it from the clues', why:'No sentence says it. The path, the chair and the wrapper show it.' },
      ways:['read the whole chapter','worked example','Mistake Detective','find the proof','clue + what I know','teach it back'], done:'You read chapter 1 like a detective and proved what the room shows!',
      board:{ one:'Clue + what I know = inference. Prove it with the exact words.', activity:'Draw the archive on the board: door, path, cabinet, chair. Boys place each clue on the drawing and say what it lets them infer.', mistakes:['Taking a character\'s words as proof','Saying an inference is "said in the text"','Naming a person the clues do not reach'] },
      do:[
        {type:'read', text:'C68.W1.01', say:'Read chapter 1, "The Key on the Red String."', how:'Notice every detail the boys find in the basement.'},
        {type:'evidence', mis:true, q:'Which sentence proves someone has been in the locked room?', p:['Everything wore a gray coat of dust, thick enough to write your name in.','"Nobody has touched this place in fifty years."','On that strip, the dust was thin, almost gone.'], a:2, look:'a detail that shows people, not just dust', say:'Careful! Which sentence really proves it?', how:'A character can be wrong. Which detail SHOWS feet were there?'}],
      your:[
        {type:'proof', text:'C68.W1.01', q:'Which short sentence says the wrapper matches Benny\'s own peppermint?', proof:'It was the same kind', look:'the sentence right after he looks at the wrapper again', say:'Find the proof in chapter 1.', how:'Read the last page. What does Benny compare?'},
        {type:'sort', mis:true, bins:['Said outright','Inferred','Not supported'], cards:[['The yeshiva is seventy-five years old.',0],['Someone sat in the chair by the window.',1],['The door groaned open.',0],['Benny feels like an outsider.',1],['Mr. Gross is angry at the boys.',2]], say:'Watch the trap! Said, inferred, or not supported?', how:'Words? Said outright. Clue? Inferred. Neither? Not supported.'},
        {type:'listen', hear:'"Maybe the custodian swept," said Eli. "Then why did he sweep only a path?" said Gavriel.', o:['a sweeper cleans the whole floor, not one strip','the custodian is never allowed to come down to the basement','Eli is always wrong'], a:'a sweeper cleans the whole floor, not one strip', cap:'Why does Gavriel doubt Eli?', say:'Listen. Tap the reason Gavriel doubts Eli.', how:'What does a floor look like after someone sweeps it?'},
        {type:'match', pairs:[['a clean path in thick dust','someone walks here often'],['one empty drawer in a full cabinet','someone chose those years'],['a candy wrapper by the chair','someone sat and ate a candy here']], say:'Match each clue to its inference.', how:'Clue plus what you know about people.'},
        {type:'evidence', q:'Inference: Benny is not ready to trust the other boys yet. Which sentence supports it best?', p:['"A new boy should not walk down dark stairs without something sweet."','He had been here three months.','Benny had wandered to the chair by the window.'], a:1, look:'a line that explains WHY he keeps quiet', say:'Challenge! Tap the line behind the inference.', how:'Which line gives a reason, not just an action?'}] },

    'READ.LIT.L07.31':{ band:'M68', pic:'📋', today:'Read chapter 2 and sort the proved from the guessed',
      why:'Every reader has guesses. A strong reader knows which of his ideas are proved.',
      ready:[{q:'"The lights are off, so nobody is home." Is that proved?', o:['no, it is a guess','yes, it is proved','it is a fact about lights'], a:'no, it is a guess'}],
      bridge:'READ.COMP.L06.09', bridgeName:'Draw a Conclusion',
      watch:{ q:'Proved and Guessed', m:{type:'scene', e:'🧑‍🏫', t:'"Who borrows a whole drawer?" "I don\'t know yet. That is why it is on the right side."'}, steps:[
        {t:'Eli writes: someone stole the files. Did anyone see a theft? No.'},
        {t:'So it is a guess. It belongs under GUESSED.'},
        {t:'Notice the word "stole". It blames someone before there is proof.'},
        {t:'Akiva keeps the idea on the right side until it is proved.'},
        {t:'A guess is not wrong. It is a question waiting for evidence.'},
        {t:'Teach it back: tell your chavrusa what moves a guess to PROVED.'}], a:'A guess stays under GUESSED until evidence moves it.' },
      oops:{ q:'"Mr. Dahan has keys to every door, so he did it." Fair?', wrong:'Yes: he has the most keys', right:'No: having keys is not using them', why:'One clue can fit many people. "Could" is not "did".' },
      ways:['read the whole chapter','sort proved and guessed','Mistake Detective','find the proof','tap the reason','teach it back'], done:'You can tell what is proved from what is only guessed!',
      board:{ one:'PROVED: someone saw it or can show it. GUESSED: an idea waiting for evidence.', activity:'Make the Beacon\'s whiteboard: two columns. Boys write each idea from chapter 2 on a card and argue where it goes.', mistakes:['Treating a likely idea as proved','Missing words that blame, like "stole"','Moving a guess because many boys agree'] },
      do:[
        {type:'read', text:'C68.W1.02', say:'Read chapter 2, "Proved and Guessed."', how:'Watch how the boys decide what is proved.'},
        {type:'sort', mis:true, bins:['Proved','Guessed','Not on the board: no clue'], cards:[['The 1951 to 1955 drawer is empty.',0],['Someone stole the files.',1],['A peppermint wrapper was by the chair.',0],['Someone has a second key.',1],['Rabbi Rosen hid the files himself.',2]], say:'Trap! Proved, guessed, or no clue at all?', how:'Did the boys see it? Then it is proved.'}],
      your:[
        {type:'proof', text:'C68.W1.02', q:'Which sentence tells what could happen to Mr. Dahan if the boys are wrong?', proof:'If we are wrong, it follows him around', look:'what happens to a man if the boys are wrong', say:'Find Akiva\'s reason in chapter 2.', how:'Read what Akiva says when he caps the marker.'},
        {type:'evidence', q:'Which line shows Gavriel is careful about what he really knows?', p:['Gavriel had brought his camera.','"It is what the dust tells me. It is not a fact."','He scrolled through the pictures he had taken the day before.'], a:1, look:'Gavriel judging his own idea', say:'Tap Gavriel\'s careful line.', how:'Which line shows Gavriel judging his OWN idea?'},
        {type:'match', pairs:[['dust on top of the footprints','not walked this morning'],['the path is not gray again','not from years ago'],['both clues together','walked for weeks']], say:'Match each clue to what Gavriel rules out.', how:'Each clue rules out one time. Together they point to one.'},
        {type:'order', steps:['Notice a clue.','Write the idea under GUESSED.','Find evidence that someone saw it.','Only then move it to PROVED.'], say:'Put the newsroom rule in order.', how:'An idea starts as a guess. Proof comes last.'},
        {type:'listen', hear:'"I am not saying it is him. I am saying it could be."', o:['backing away from his guess, but still holding it','proving Mr. Dahan took the files','agreeing at last that Mr. Dahan did nothing wrong at all'], a:'backing away from his guess, but still holding it', cap:'What is Eli doing here?', say:'Listen. What is Eli doing with his guess?', how:'Is he sure, or only saying it could be?'}] },

    'READ.LIT.L07.32':{ band:'M68', pic:'💡', today:'Read chapter 3 and explain each inference, step by step',
      why:'An inference you can explain is one others can trust. Show the clue and what you know.',
      ready:[{q:'Clue: his coat is wet. What I know: rain makes coats wet. Inference?', o:['He was out in the rain.','He has a coat.','Coats keep people warm in winter.'], a:'He was out in the rain.'}],
      bridge:'READ.COMP.L06.07', bridgeName:'Two Clues, One Inference',
      watch:{ q:'The Light After Minchah', m:{type:'scene', e:'📷', t:'In Rabbi Brandt\'s right hand, held up a little, as if he were proud of it, was a key.'}, steps:[
        {t:'Clue: the founder holds a key on a string.'},
        {t:'Another clue: Yoni learned that key was never found.'},
        {t:'What I know: a key kept in a family often stays there.'},
        {t:'Inference: his son, Feivel, may have it now.'},
        {t:'Check it: the son stands right beside him in the photo.'},
        {t:'Teach it back: give your chavrusa clue, knowledge, inference.'}], a:'The photo shows the lost key. His son may have it.' },
      oops:{ q:'"The light under the door proves a thief is inside." Right?', wrong:'Yes: a secret light means a thief', right:'No: it shows someone is there, not why', why:'The clue tells us someone visits. It says nothing about why.' },
      ways:['read the whole chapter','clue + what I know','Mistake Detective','find the proof','tap the reason','teach it back'], done:'You can explain an inference: the clue and what you know!',
      board:{ one:'Inference = clue in the text + what I already know. Say both.', activity:'An inference ladder on the board: bottom rung the clue, middle rung what I know, top rung the inference. Boys build a ladder for each clue in chapter 3.', mistakes:['Giving only the inference, with no clue','Using a "what I know" that is really a guess','Stretching one clue too far'] },
      do:[
        {type:'read', text:'C68.W1.03', say:'Read chapter 3, "The Light After Minchah."', how:'Track the three new clues the boys find.'},
        {type:'evidence', mis:true, q:'Which line proves Mr. Dahan could not open the archive?', p:['Mr. Dahan laughed and lifted the huge ring of keys from his belt.','"Not one of these fits it."','"Every winter I want to check that wall for damp."'], a:1, look:'a line about the keys and the lock', say:'Trap ahead! Which line really proves it?', how:'A big ring of keys is not proof. Look for what the keys can and cannot do.'}],
      your:[
        {type:'proof', text:'C68.W1.03', q:'Which sentence on the photograph names the boy?', proof:'Rabbi Aharon Brandt and his son Feivel, age 12', look:'the words that give the boy\'s name', say:'Find the proof in chapter 3.', how:'Read the words written at the bottom of the old photograph.'},
        {type:'sort', bins:['Clue in the text','What I know','Inference'], cards:[['Mr. Dahan sees the light on Tuesdays and Thursdays.',0],['People who come back often keep a habit.',1],['Someone comes back again and again.',2],['The founder held a key on a string.',0],['Fathers often leave things to sons.',1],['His son may have the key.',2]], say:'Build the inferences: clue, what I know, inference.', how:'Clue from the chapter, knowledge from life, then the idea.'},
        {type:'listen', hear:'"His keys don\'t even fit," said Eli. "I almost wrote his name on the board."', o:['ashamed that he almost blamed him','proud that he solved the mystery by himself','angry at Mr. Dahan'], a:'ashamed that he almost blamed him', cap:'How does Eli feel?', say:'Listen. Tap how Eli feels.', how:'What did Eli almost do? How would you feel?'},
        {type:'match', pairs:[['the keys do not fit','Mr. Dahan is not the visitor'],['light seen Tuesdays and Thursdays','the visitor comes at least then'],['a key on a string in 1951','the photo key may be the one we hold']], say:'Match each clue to its inference.', how:'Clue plus what you know gives the inference.'},
        {type:'evidence', q:'Why does Akiva write a question, not a name, under GUESSED?', p:['"We are going to watch, and we are going to learn. Literally."','"We are not going to accuse anyone."','"Bring yours."'], a:1, look:'the line where Akiva gives his rule', say:'Challenge! Tap Akiva\'s reason.', how:'Which line explains his choice, not just the plan?'}] },
