    c45_kites: { title: 'Kites Around the World', text: 'People all over the world fly kites, but they do it in very different ways.\nIn Japan, some kite makers build giant kites so big that it takes a whole team of men to hold the string. In India, boys fly small, fast paper kites and try to cut each other\'s strings in friendly contests. In Afghanistan, kite flying is a favorite winter sport on the rooftops.\nIn Eretz Yisrael, many families fly kites on Lag BaOmer and on long summer afternoons at the beach. Dovid Lerner\'s cousin in Yerushalayim builds his own kites out of bamboo sticks and plastic bags.\nBig or small, fancy or homemade, a kite needs only three things: a light frame, a cover that catches the wind, and a strong string.' },
    c45_penguins: { title: 'Penguin Fathers', text: 'In the coldest place on Earth, the emperor penguin father has one of the hardest jobs in the animal world.\nAfter the mother lays a single egg, she passes it to the father and goes to the sea to eat. The father balances the egg on top of his feet and covers it with a warm flap of skin. For about two months he stands in the wind and the dark, keeping the egg warm.\nDuring all that time, he eats nothing at all. Hundreds of fathers huddle together in a tight crowd to share their warmth, taking turns standing on the cold outside edge.\nWhen the chick hatches, the father even feeds it a little milky food from his throat until the mother comes back.' },
    c45_kiddush: { title: 'Getting Ready for the Kiddush', text: 'On Friday night, the Lerners\' kitchen is the busiest room in the house.\nAbba sets out the cups and fills the becher. Dovid carries the challah board to the table and covers the two challos with the embroidered cover. His little brother Shloimy puts a siddur at every place, even for the guests.\nZeidy arrives early every week. He is the one who tells the best stories at the table, and he always brings a bag of candies for the children.\nBy the time everyone comes home from shul, the table is ready, the candles are glowing, and the whole family is waiting to make kiddush together.' },
    c45_beaver: { title: 'The Beaver\'s Pond', text: 'A beaver chews through a young tree in a single night, using its strong orange front teeth. It drags the branches to a stream and pushes them into the mud.\nOne branch at a time, the beaver builds a dam. It packs the cracks with mud and stones. Slowly, the water behind the dam rises and spreads out into a quiet pond.\nSoon the pond is full of new life. Frogs lay their eggs in the still water. Ducks swim in from the river. Fish hide among the sunken branches, and herons come to hunt them.\nIn the middle of the pond, the beaver builds its lodge, a dome of sticks with an underwater door, where its family stays safe and dry all winter.' },
    c45_moving: { title: 'Moving Day on Park Heights', text: 'When the Adler family moved into the house on the corner, the truck arrived at seven in the morning.\nBy seven-fifteen, Mr. Katz from next door was carrying boxes up the front steps. The Benaim boys brought over a cooler of cold drinks. Binyamin\'s father, who owns a big van, made three trips to the old apartment for the last pieces of furniture.\nAt lunchtime, a pot of chicken soup and a tray of potato kugel appeared on the porch with a note: "Welcome to the street!"\nBy evening, every box was inside, the beds were set up, and the Adler boys were already playing catch in the street with their new friends.' },
    c45_market: { title: 'The Floating Market', text: 'Long before sunrise, the canal outside the city is dark and quiet. Then the first wooden boats slide out of the mist.\nThe boats are piled high with mangoes, coconuts, bananas and bright green vegetables. Some sellers paddle with long oars. Others steer small motors that sputter and cough.\nBuyers do not walk from stall to stall. Instead, they paddle their own boats right up to the sellers. They point, ask the price, and hand over money on the end of a long pole. The seller passes the fruit across the water in a basket.\nBy the time the sun is high, the canal is crowded with boats bumping gently together, and almost every basket is empty.' },
    c45_bike: { title: 'Taking Care of a Bike', text: 'A bike lasts for years if you take care of it.\nFirst, keep the tires full of air. Soft tires make pedaling hard and can get flat on sharp stones. Check them with your thumb every week.\nNext, keep the chain clean and oiled. A dry, dirty chain squeaks and wears out quickly. A few drops of oil once a month keep it running smoothly.\nThe first bicycles, more than two hundred years ago, had no pedals at all. Riders pushed along with their feet.\nFinally, store your bike indoors when it rains. Water makes the metal parts rust, and rust makes the brakes and gears stick.' },
    c45_robins: { title: 'Zeidy\'s Garden Robins', text: 'Robins are some of the hardest-working birds in Zeidy\'s garden.\nIn the spring, the mother robin builds a cup-shaped nest out of grass and mud while the father keeps watch nearby. She tucks it into a safe spot in the branches of the maple tree.\nWhen the eggs hatch, the parents fly back and forth all day long, carrying worms to the hungry chicks. A family of robins can catch hundreds of worms in a single day.\nRobin eggs are a beautiful light blue color, and some paint companies even name a color after them.\nAfter about two weeks, the chicks are big enough to leave the nest, and the parents still feed them for a few more days while they learn to find food.' },
    c45_braille: { title: 'Dots That Speak', text: 'Louis Braille lost his sight when he was a small boy in France, two hundred years ago. In those days, books for blind children had huge raised letters. They were heavy, expensive, and very slow to read.\nAt school, Louis learned about a code of raised dots that soldiers had used to send messages at night. The code was too hard, so Louis decided to make a better one.\nHe worked on it for years. When he was only fifteen, he finished a code that used just six dots in a small rectangle. Each pattern of dots stood for a letter or a number. A reader could feel a whole letter with one fingertip.\nToday, people all over the world read and write with Braille\'s dots.' },
    c45_letter: { title: 'How a Letter Travels', text: 'When Yehuda mails a letter to his cousin in Los Angeles, it goes on a long trip.\nFirst, a mail carrier picks it up from the blue mailbox on the corner and brings it to the post office. There, a machine reads the address and sprays a row of tiny lines on the envelope, a code for where it is going.\nNext, the letter rides in a truck to a giant sorting center. Machines sort thousands of letters a minute by their codes. Yehuda\'s letter goes into a bin for California.\nThe bin flies across the country on a cargo plane. Another truck carries it to a post office near his cousin\'s house.\nFinally, a mail carrier walks it to the front door, usually just three or four days after Yehuda dropped it in the box.' },
    c45_harbor: { title: 'A Morning at the Harbor', text: 'Early on Sunday morning, Avrumi and his Zeidy walked down to the harbor with a bag of sandwiches.\nThe water was calm and gray, and the tall ships rocked gently at the dock. Seagulls circled over the fishing boats, crying loudly for scraps.\nAt the end of the pier, an old man in a wool cap was painting a picture of the boats. Avrumi stood behind him for a long time, watching every careful stroke of his brush.\n"You like to draw?" asked the old man without turning around.\n"Every day," said Avrumi.\nThe man smiled, handed him a small brush, and said, "Then show me the sky."' },
    c45_rain: { title: 'Caught in the Rain', text: 'On the way home from the park, the sky turned dark and the wind began to blow.\nTzvi Hirsch and his little brother ran past the bakery, past the bus stop and past the shul, but the rain was faster.\nBy the time they reached the corner of their street, their shirts were soaked, their shoes were squishing, and their hair was dripping into their eyes.\nAt the front door, Abba was waiting with two big towels and a smile.\n"Next time," he said, "maybe you will listen to the weather report."' }
