function leaves(u){ try{ var x=new URL(String(u),location.href); if(x.protocol!=='http:'&&x.protocol!=='https:') return false;

function frTitle(u){ var s=String(u); return /[?&]so=1/.test(s)?'⭐ Tashbar Points (daily sign-off)':/[?&]canteen=1/.test(s)?'🍎 Canteen & menu':/[?&]pf=1/.test(s)?'🧭 Pathfinder report':/[?&]old=1/.test(s)?'✍️ Written work':/[?&]cp=1/.test(s)?'👀 See what the kids see':/[?&]pp=1/.test(s)?'👪 Parent page':'Page'; }
var prevOpen=window.open;
function frame(u,title){ var w=q('#sh-fr'); if(!w){ w=document.createElement('div'); w.id='sh-fr'; w.setAttribute('role','dialog'); w.setAttribute('aria-modal','true'); body().appendChild(w); }
  title=title||frTitle(u); w.innerHTML='<div class="frb"><button type="button" data-shfr="x">← Back to the staff portal</button><span>'+E(title)+'</span></div><iframe name="sh-frame" title="'+E(title)+'"></iframe>';
  var f=w.querySelector('iframe'); f.addEventListener('load',function(){ try{ var L=f.contentWindow.location; if(L.origin===location.origin&&(/\/staff\/?$/.test(L.pathname)||/[?&]sg=1/.test(L.search)||(L.pathname==='/'&&!L.search))) frClose(); }catch(x){} });   /* the page's own "back" link lands on a sign-in page: close the frame instead */
  document.documentElement.style.overflow='hidden'; w.dataset.u=String(u); try{ prevOpen.call(window,String(u),'sh-frame'); }catch(x){ f.src=String(u); } }
function frClose(){ var w=q('#sh-fr'); if(w) w.remove(); document.documentElement.style.overflow=''; }
window.open=function(u,target){ if(u&&target!=='sh-frame'&&body().classList.contains('sh-on')&&leaves(u)){ frame(String(u)); return null; } return prevOpen.apply(window,arguments); };
document.addEventListener('click',function(e){ var b=e.target.closest&&e.target.closest('[data-shfr]'); if(!b) return; e.preventDefault(); frClose(); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&q('#sh-fr')) frClose(); });

/* ================= START: draw at once (no flash of the old screen while the boys load); fill in when the staff screen has its data ================= */
function validTok(){ try{ var t=JSON.parse(sessionStorage.getItem('tl-session')||'null'); return !!(t&&t.role==='staff'&&t.token&&Date.now()-(t.at||0)<6*3600e3); }catch(e){ return false; } }
function isOut(){ var s=SS(); return !!(s&&s.out); }
function goOut(){ document.documentElement.classList.remove('sh-boot'); body().classList.remove('sh-on','sh-page','sh-feat'); var t=q('#sh-top'); if(t) t.style.display='none'; }
var withData=false;
function on(){ if(isOut()){ goOut(); return false; } if(!q('#app header.top')) return false; if(!body().classList.contains('sh-on')) body().classList.add('sh-on'); if(!withData){ withData=true; draw(); } return true; }
if(validTok()){ document.documentElement.classList.add('sh-boot'); body().classList.add('sh-on'); draw(); } else document.documentElement.classList.remove('sh-boot');
var n=0; (function wait(){ if(on()) return; if(++n<400) setTimeout(wait,250); })();
setInterval(function(){ if(isOut()&&body().classList.contains('sh-on')) goOut(); },1000);
/* the search bar is re-made by its add-on: keep it in the slot */
setInterval(slot,1500);
/* which boys are on a step right now (their goal now = this skill), for the curriculum tree */
function boysOn(id){ var out=[]; (S0().boys||[]).forEach(function(b){ if(b.test) return; var C=cellsOf(b.id), st=''; Object.keys(C).forEach(function(k){ if(C[k]&&C[k].now===id) st=C[k].status||'now'; }); if(st) out.push({id:b.id,name:b.name,stuck:st==='red'}); }); return out; }
function boysOnAll(){ var o={}; (S0().boys||[]).forEach(function(b){ if(b.test) return; var C=cellsOf(b.id); Object.keys(C).forEach(function(k){ var c=C[k]; if(c&&c.now){ var x=o[c.now]||(o[c.now]={n:0,stuck:0}); x.n++; if(c.status==='red') x.stuck++; } }); }); return o; }
/* when an old tool's drawer closes (a boy added, a group made ...), refresh the page you are on so the change shows at once */
/* "Student added" → 🎯 Set his level now: the Set level pop-up for the new boy (StaffScreen.html addPanel) */
document.addEventListener('click',function(e){ var b=e.target.closest&&e.target.closest('[data-shlv]'); if(!b) return; var id=b.dataset.shlv, nm=b.dataset.shname||'';
  if(ST.list&&!byId(id)) ST.list.push({id:id,name:nm,grade:null,place:{}}); else if(!ST.list) ST.list=[{id:id,name:nm,grade:null,place:{}}];
  setTimeout(function(){ dlgOpen([id]); },150); },true);
var drawerOpen=false; setInterval(function(){ var d=!!q('#app > aside.drawer'); if(drawerOpen&&!d){ refreshMap(); if(S.area==='students') loadRoster(true); if(S.area==='today') loadToday(); if(S.area==='school'||S.area==='home') draw(); } drawerOpen=d; },700);
window.SH={ area:area, run:run, boysOn:boysOn, boysOnAll:boysOnAll, map:function(id){ boyOpen(id); }, boy:function(id){ boyOpen(id); }, frame:function(u,t){ frame(u,t); } };
})();
</script>
