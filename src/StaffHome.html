function num(sel){ var e=q(sel); if(!e) return 0; var m=String(e.textContent||'').match(/(\d+)/g); return m?Number(m[m.length-1]):0; }

function nextHTML(){ var r=steps(); return '<div id="sh-next"><h2>👉 Next steps</h2>'+(r.length?r.map(function(x){ return '<div class="row"><span class="n" style="background:'+x[0]+'">'+x[1]+'</span><span><b>'+E(x[2])+'</b><small>'+E(x[3])+'</small></span><button type="button" class="go" data-sh="do" data-k="'+x[4]+'">'+E(x[5])+' →</button></div>'; }).join(''):(r.known?'<div class="ok">✅ All caught up. Nothing needs you right now.</div>':'<div class="row"><span><b>Still loading the boys…</b><small>Or open Today to see who needs you.</small></span><button type="button" class="go" data-sh="area" data-v="today">Open Today →</button></div>'))+'</div>'; }

function hello(){ var h=new Date().getHours(), nm=''; try{ nm=String(S0().staffName||'').split(' ')[0]; }catch(e){} return (h<12?'Good morning':h<17?'Good afternoon':'Good evening')+(nm?', '+nm:''); }
function S0(){ try{ return (typeof window.S==='object'&&window.S&&window.S.d)||(new Function('try{ return S&&S.d; }catch(e){ return null; }'))()||{}; }catch(e){ return {}; } }

/* ================= STUDENTS: one list, search, filters, set level for one or many boys (libRoster / libApply place, with Undo) ================= */
var LV=[['MATH','🔢','Math',1,16,1],['READ','📖','Reading',1,15,1],['LANG','✍️','Language Arts & Writing',1,9,1],['SCI','🔬','Science',1,15,1],['SOC','🌍','Social Studies',1,14,1],['COMP','💻','Computing, Life & Money',1,16,0],['HEB','🔤','Lashon Hakodesh',1,13,0],['ELEC','🛠️','Electives',3,16,0],
  ['K:KRI','📜','Kriyah',1,13,0],['K:CHU','📜','Chumash',1,13,0],['K:RAS','📜','Rashi',1,13,0],['K:MSH','📜','Mishnayos',1,13,0],['K:GEM','📜','Gemara',1,13,0]];   /* key, icon, name, lowest, highest (Placement.js PL.SUBJECTS, Library.js LIB.TRACKS), 1 = Level n is about Grade n-1 */
var LVN={}; LV.forEach(function(x){ LVN[x[0]]=x; });
var ST={list:null,q:'',f:'all',g:'all',sel:{},busy:false,err:'',dlg:null};
function tok(){ try{ var s=JSON.parse(sessionStorage.getItem('tl-session')||'null'); return s&&s.token; }catch(e){ return null; } }
function srv(fn,args){ return new Promise(function(ok,no){ try{ var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){ no(e&&e.message?e.message:String(e)); }); r[fn].apply(r,args||[]); }catch(e){ no(String(e)); } }); }
function gName(g){ return g==null||g===''?'':g===0?'K':'Gr '+g; }
function hint(key,n){ var x=LVN[key]; if(!x||!x[5]) return ''; return n===1?'Kindergarten':n<=9?'Grade '+(n-1):''; }
function hasLv(b,k){ var p=b.place&&b.place[k]; return p&&p.lv>0; }

function loadRoster(force){ if(ST.list&&!force) return drawStudents(); ST.err=''; srv('libRoster',[tok()]).then(function(r){ ST.list=(r&&r.boys||[]).filter(function(b){ return !b.test; }); drawStudents(); }).catch(function(e){ ST.err=String(e); drawStudents(); }); }
function shown(){ var q=ST.q.trim().toLowerCase(); return (ST.list||[]).filter(function(b){ if(q&&String(b.name).toLowerCase().indexOf(q)<0) return false; if(ST.f==='nolevel'&&!noLevel(b)) return false; if(ST.g!=='all'&&String(b.grade)!==ST.g) return false; return true; }); }
function lvChips(b){ var out=[]; LV.forEach(function(x){ var p=b.place&&b.place[x[0]]; if(p&&p.lv>0) out.push('<span title="'+E(x[2])+'">'+x[1]+' '+E(x[2].split(' ')[0].replace(',',''))+' '+p.lv+'</span>'); });
  return noLevel(b)?'<span class="none">No Math or Reading level yet</span>'+out.join(''):out.join(''); }
function studentsHTML(){ return '<div class="st-head"><div><h1>Students</h1><p class="lead" style="margin:0" id="st-count">Loading the boys…</p></div><div class="st-acts"><button type="button" class="shb" data-sh="do" data-k="add">➕ Add a student</button><button type="button" class="shb alt" data-sh="do" data-k="classes">🏫 Class lists & grades</button><button type="button" class="shb alt" data-sh="do" data-k="groups">👥 Groups</button></div></div>'
  +'<div class="st-tools"><input id="st-q" type="search" placeholder="Search by name…" aria-label="Search students" value="'+E(ST.q)+'"><button type="button" class="chip'+(ST.f==='all'?' on':'')+'" data-st="f" data-v="all">Everyone</button><button type="button" class="chip'+(ST.f==='nolevel'?' on':'')+'" data-st="f" data-v="nolevel">No level yet<em id="st-nl"></em></button><select id="st-g" aria-label="Grade"><option value="all">All grades</option>'+['0','1','2','3','4','5','6','7','8'].map(function(g){ return '<option value="'+g+'"'+(ST.g===g?' selected':'')+'>'+(g==='0'?'Kindergarten':'Grade '+g)+'</option>'; }).join('')+'</select></div>'
  +'<div class="st-list" id="st-list"><div class="st-empty">Loading…</div></div>'
  +'<h3>More tools</h3><div class="tiles">'+['levels','mycls'].map(tile).join('')+'</div>'; }
function drawStudents(){ var L=q('#st-list'); if(!L) return; var c=q('#st-count'), nl=q('#st-nl');
  if(ST.err){ L.innerHTML='<div class="st-empty">Could not load the boys: '+E(ST.err)+'</div>'; return; }
  if(!ST.list){ L.innerHTML='<div class="st-empty">Loading…</div>'; return; }
  var all=ST.list, n=all.filter(noLevel).length; if(c) c.textContent=all.length+' boys'+(n?' · '+n+' still need a level':''); if(nl) nl.textContent=n?String(n):'';
  var a=shown(); if(!a.length){ L.innerHTML='<div class="st-empty">'+(all.length?'No boy matches.':'No students yet. Tap “Add a student”.')+'</div>'; selbar(); return; }
  L.innerHTML=a.map(function(b){ var on=!!ST.sel[b.id]; return '<div class="st-row'+(on?' sel':'')+'"><input type="checkbox" data-st="pick" data-id="'+E(b.id)+'"'+(on?' checked':'')+' aria-label="Pick '+E(b.name)+'"><div class="st-nm"><b>'+E(b.name)+'</b></div><span class="st-gr">'+E(gName(b.grade)||'No grade')+'</span><div class="st-lv">'+lvChips(b)+'</div><div class="st-b"><button type="button" class="lvb" data-st="lv" data-id="'+E(b.id)+'">🎯 Set level</button><button type="button" data-st="open" data-id="'+E(b.id)+'">Open ›</button></div></div>'; }).join('');
  selbar(); }
function selbar(){ var ids=Object.keys(ST.sel).filter(function(k){ return ST.sel[k]; }), bar=q('#sh-selbar');
  if(!ids.length||S.area!=='students'){ if(bar) bar.remove(); return; }
  if(!bar){ bar=document.createElement('div'); bar.id='sh-selbar'; body().appendChild(bar); }
  bar.innerHTML='<span>'+ids.length+' picked</span><button type="button" data-st="lvmany">🎯 Set level for them</button><button type="button" class="x" data-st="clear">Clear</button>'; }
function byId(id){ return (ST.list||[]).filter(function(b){ return b.id===id; })[0]; }
function dlgOpen(ids){ ST.dlg={ids:ids,key:null,lv:0,err:'',busy:false}; dlgDraw(); }
function dlgClose(){ ST.dlg=null; var d=q('#sh-dlg'); if(d) d.remove(); }
function dlgDraw(){ var D=ST.dlg; if(!D) return dlgClose(); var d=q('#sh-dlg'); if(!d){ d=document.createElement('div'); d.id='sh-dlg'; d.setAttribute('role','dialog'); d.setAttribute('aria-modal','true'); body().appendChild(d); }
  var one=D.ids.length===1?byId(D.ids[0]):null, who=one?one.name:D.ids.length+' boys';
  var h='<div class="box"><h2>🎯 Set level for '+E(who)+'</h2><p class="sub">'+(one?(gName(one.grade)?gName(one.grade).replace('Gr','Grade')+' · ':'')+'He starts the subject at the level you pick.':'Each boy starts the subject at the level you pick.')+'</p>';
  h+='<h3>1. Subject</h3><div class="grid">'+LV.map(function(x){ var cur=one&&one.place&&one.place[x[0]]&&one.place[x[0]].lv; return '<button type="button" data-st="key" data-v="'+x[0]+'"'+(D.key===x[0]?' class="on"':'')+'>'+x[1]+' '+E(x[2])+'<small>'+(cur?'Now: Level '+cur:'No level yet')+'</small></button>'; }).join('')+'</div>';
  if(D.key){ var x=LVN[D.key], cur=one&&one.place&&one.place[D.key]&&one.place[D.key].lv; h+='<h3>2. Level</h3><div class="lvs">'; for(var n=x[3];n<=x[4];n++) h+='<button type="button" data-st="lvl" data-v="'+n+'" class="'+(D.lv===n?'on':cur===n?'cur':'')+'">'+n+'<small>'+E(hint(D.key,n)||(cur===n?'now':''))+'</small></button>'; h+='</div>'; }
  if(D.err) h+='<div class="err">'+E(D.err)+'</div>';
  h+='<div class="foot"><button type="button" class="no" data-st="close">Cancel</button><button type="button" class="go" data-st="save"'+(D.key&&D.lv&&!D.busy?'':' disabled')+'>'+(D.busy?'Saving…':D.key&&D.lv?'Save: '+E(LVN[D.key][2])+' Level '+D.lv:'Pick a subject and a level')+'</button></div></div>';
  d.innerHTML=h; }
function dlgSave(){ var D=ST.dlg; if(!D||!D.key||!D.lv||D.busy) return; D.busy=true; D.err=''; dlgDraw();
  srv('libApply',[tok(),{action:'place',boys:D.ids,key:D.key,level:D.lv}]).then(function(r){ applyChanged(r&&r.changed); dlgClose(); ST.sel={}; drawStudents();
    toast2((r&&r.msg)||'Saved.',r&&r.undo?function(){ srv('libApply',[tok(),r.undo]).then(function(u){ applyChanged(u&&u.changed); drawStudents(); toast2((u&&u.msg)||'Put back.'); }).catch(function(e){ toast2('Could not undo: '+e); }); }:null); })
   .catch(function(e){ D.busy=false; D.err=String(e); dlgDraw(); }); }
function applyChanged(ch){ if(!ch) return; Object.keys(ch).forEach(function(id){ var b=byId(id), c=ch[id]; if(!b||!c) return; b.place=b.place||{}; if(c.place) b.place[c.key]={lv:c.place.lv||c.place.level||0}; else delete b.place[c.key]; }); }
function toast2(m,undo){ var o=q('#sh-toast'); if(o) o.remove(); var t=document.createElement('div'); t.id='sh-toast'; t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:2147483300;display:flex;gap:12px;align-items:center;background:#16202C;color:#fff;padding:10px 12px 10px 18px;border-radius:999px;font:800 15px system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100vw - 24px)';
  t.innerHTML='<span>✓ '+E(m)+'</span>'+(undo?'<button type="button" style="border:0;border-radius:999px;padding:8px 14px;background:#FDE047;color:#16202C;font:900 14px system-ui,sans-serif;cursor:pointer">↩ Undo</button>':''); body().appendChild(t);
  if(undo) t.querySelector('button').onclick=function(){ t.remove(); undo(); }; setTimeout(function(){ if(t.parentNode) t.remove(); },10000); }
document.addEventListener('click',function(e){ var b=e.target.closest&&e.target.closest('[data-st]'); if(!b) return; var a=b.dataset.st;

  if(a==='open'){ if(window.SL&&window.SL.open) window.SL.open(b.dataset.id); return; }
  if(a==='key'){ ST.dlg.key=b.dataset.v; var bb=byId(ST.dlg.ids[0]); ST.dlg.lv=(ST.dlg.ids.length===1&&bb&&bb.place&&bb.place[ST.dlg.key]&&bb.place[ST.dlg.key].lv)||0; ST.dlg.err=''; return dlgDraw(); }
  if(a==='lvl'){ ST.dlg.lv=Number(b.dataset.v); return dlgDraw(); }

function area(v){ S.area=v; S.from=v; draw(); }

function run(k){ var a=A[k]; if(!a) return; var how=a[3];
  if(/^sf:/.test(how)){ if(window.SF) window.SF.open(how.slice(3)); return; }

  el.click(); }

document.addEventListener('click',function(e){ var b=e.target.closest&&e.target.closest('[data-sh]'); if(!b) return; var a=b.dataset.sh; e.preventDefault();
  if(a==='area') return area(b.dataset.v); if(a==='do') return run(b.dataset.k); if(a==='back') return area(S.from||'home');
  if(a==='out'){ var o=q('#app [data-act=out]'); if(o) o.click(); } });

var n=0; (function wait(){ if(on()) return; if(++n<200) setTimeout(wait,300); })();
/* the search bar is re-made by its add-on: keep it in the slot */
setInterval(slot,1500);
window.SH={ area:area, run:run };
})();
