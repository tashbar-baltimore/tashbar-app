c45f_gulf: { title: "A River in the Ocean", text: "How did people find it? In the 1700s, ships carried mail between England and America. The English mail ships took about two weeks longer to reach America than the American merchant ships did. Nobody understood why.\nThen Benjamin Franklin, who was in charge of the mail, asked a sea captain named Timothy Folger. Folger laughed and said the answer was simple: the English captains were sailing straight into the Gulf Stream, against the current, and losing days." },
    c45f_weathermap: { title: "The First Weather Map", text: "Good morning. My name is Rabbi Adler, and today I have a question: how did people first know a storm was coming?\nIn 1849, a scientist named Joseph Henry asked telegraph men in many cities to send him the weather each morning. A few years later, he hung a big map on the wall of the Smithsonian in Washington. A white card meant fair weather. A black card meant rain.\nWhy did this matter? Because for the first time, people could see a storm before it arrived." },
    c45f_tide: { title: "The Tide", text: "Who is pulling? Who is pushing,\nfar above the foam?\nNot a giant, not a wind,\nnot a whale come home.\nIt's the moon! The quiet moon,\nhanging in the sky,\ntugging at the ocean's coat\nas it passes by." },
    c45f_river: { title: "The River by Our Shul", text: "The river runs beside our shul,\nit hurries past the trees,\nand carries every falling leaf\ndown to the far-off seas.\nWho sends it? Who keeps\nit moving night and day?\nThe rain that falls upon the hills\nand finds the river's way." },
    c45f_deep: { title: "A Letter from the Deep Ocean", text: "We are floating above the Mariana Trench, the deepest place in all the oceans. If you dropped Mount Everest into the deepest part of the trench, its top would still be more than a mile under water. That is how deep it is: almost seven miles straight down.\nDown there, it is completely dark. No sunlight reaches that far, not even a little.\nSo you are probably wondering: is anything alive down there? Yes!" },
    c45f_pole: { title: "A Letter from the South Pole", text: "Dear Shimmy,\nGreetings from the research station at the South Pole! Here is a fact for you: the ice under my feet is almost two miles thick. Two miles! In winter, the sun does not come up for six months.\nSo you are wondering: is it cold here? Freezing! Colder than our freezer at home, by a lot.\nGive Bubby a hug from me, and keep learning hard.\nLove, Uncle Yaakov" },
    c45f_galileo: { title: "Galileo Looks Up", text: "One clear night, he pointed his tube at the moon.\nWhat did he see? Until then, many people believed the moon was perfectly smooth, like a polished ball. But through his tube, Galileo saw mountains, with long shadows behind them. He saw valleys and deep round holes, the ones we now call craters.\nThe moon was not smooth at all." },
    c45f_magnet: { title: "The Earth Is a Magnet", text: "Boys, look at this compass. Why does its needle always point north?\nIn the year 1600, an English doctor named William Gilbert wanted to know. He made a little ball out of magnet stone, and he moved a tiny needle all around it. Again and again, the needle pointed to the top of the ball.\nThen he understood. The whole earth is a giant magnet!\nSo, boys, what will you test this week?" },
    c45f_eagle: { title: "The Eagle Has Landed (a play)", text: "NARRATOR: The fuel is running low.\nDUKE: Sixty seconds.\nNARRATOR: The Eagle keeps flying.\nALDRIN: Forward. Drifting right.\nDUKE: Thirty seconds.\nNARRATOR: Then, at last, a light turns on in the Eagle.\nALDRIN: Contact light!\nARMSTRONG: Houston, Tranquility Base here. The Eagle has landed." },
    c45f_launch: { title: "The Launch (a play)", text: "NARRATOR: The rocket stands on the pad, white and tall.\nCONTROL: Ten seconds.\nNARRATOR: In the crowd, Shmuel holds his Abba's hand.\nCONTROL: Five. Four. Three. Two. One.\nNARRATOR: Fire bursts out under the rocket. It rises, slowly, then faster.\nSHMUEL: It's up! It's really up!\nABBA: Baruch Hashem. They are on their way." },
    c45f_footprint: { title: "Footprints on the Moon", text: "But on the moon, a footprint\nlies pressed in the gray dust,\njust where a boot first stepped on it,\nas still as old, cold crust.\nNo wind will ever blow it.\nNo rain will ever fall.\nNo waves will ever wash it out.\nIt does not change at all." },
