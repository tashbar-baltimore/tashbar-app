(function () {

  'WRIT.ESSAY.L07.07':{name:'Pick the Pattern',
  teach:[
    {how:'An information essay answers a question. Before you write, pick the PATTERN that fits the question: the plan for your body paragraphs. There are four. DEFINITION answers "What is it?": say what group it belongs to, what makes it different, then its parts. CLASSIFICATION answers "What kinds are there?": one paragraph for each kind.', q:'Akiva’s question for The Beacon: “What kinds of trash end up in the Inner Harbor?” Which pattern fits?', o:['classification','definition','compare and contrast']},
    {how:'COMPARE AND CONTRAST answers "How are two things alike and different?": first how they are alike, then how they differ. CAUSE AND EFFECT answers "Why does it happen?" or "What happens when…?": first the cause, what makes it happen, then the effect, what happens because of it. Here it is one of four patterns: one cause, one effect.', q:'Eli’s question: “Why does Mr. Trash Wheel catch the most trash after a heavy rain?” Which pattern fits?', o:['cause and effect','classification','definition']},
    {how:'Find the CLUE WORDS in the question. "What is" → definition. "What kinds" or "What types" → classification. "alike", "different" or "compare" → compare and contrast. "Why" or "What happens when" → cause and effect. The mistake is the WRONG PATTERN: the question asks why, and the plan lists kinds. Every paragraph can be true, and the essay still misses the question.', q:'Question: “How is a trash wheel different from a skimmer boat?” Gavriel’s plan: 1) plastic bottles, 2) foam cups, 3) plastic bags. What went wrong?', o:['wrong pattern','pattern fits','too many paragraphs']}
  ],
  practice:[
    {t:'pairs', q:'Match each question to the pattern that answers it.', pairs:[['What is a storm drain?','Definition'],['What kinds of boats work in the harbor?','Classification'],['How is a trash wheel like a skimmer boat?','Compare and contrast'],['What happens when a storm drain clogs?','Cause and effect']],

    {t:'order', q:'Build Akiva’s planning sentence. Tap the tiles in order.', tiles:['The question asks','“what kinds,”','so I will use','classification.'],

    {t:'spotall', q:'Question: “What is Mr. Trash Wheel?” Tap every line that belongs in a definition plan.', cells:[{label:'Its group: a machine that catches floating trash.',ok:true},{label:'What makes it different: the stream’s current turns its wheel.',ok:true},{label:'Its parts: a water wheel, a conveyor belt and a dumpster.',ok:true},{label:'Why the harbor gets dirty after rain.',ok:false},{label:'How it is like a skimmer boat.',ok:false}],

  'WRIT.ESSAY.L07.08':{name:'Thesis Sentence',
  teach:[
    {how:'An information essay has one THESIS SENTENCE, usually at the end of the opening paragraph. It does two jobs. It STATES THE TOPIC: what the whole essay is about. And it PREVIEWS THE PARTS: it names the main parts, one for each body paragraph, so the reader knows what is coming. A thesis that does both previews the parts.', q:'Which thesis states the topic and previews the parts?', o:['Mr. Trash Wheel, a machine that catches trash in the Inner Harbor, works with three parts: a water wheel, a conveyor belt and a dumpster.','Mr. Trash Wheel is a machine in Baltimore.','In this essay I will tell you about Mr. Trash Wheel.']},
    {how:'Name the parts IN THE SAME ORDER as the body paragraphs. If paragraph 1 is about the wheel, paragraph 2 the belt and paragraph 3 the dumpster, the thesis names them in that order. Keep the parts short and alike: three nouns, or three verbs.', q:'Eli’s body paragraphs: 1) the wheel, 2) the belt, 3) the dumpster. Which preview matches?', o:['a water wheel, a conveyor belt and a dumpster','a dumpster, a water wheel and a conveyor belt','a conveyor belt and some other things']},
    {how:'Three mistakes. ANNOUNCES: "In this essay I will tell you about…" talks about the essay instead of the topic. AN OPINION: a word like best, should or amazing gives the writer’s view ("Every city should build a trash wheel."). That is a claim for an argument; an information thesis informs. TOPIC ONLY: a plain fact about the topic, with no opinion, that previews nothing ("Mr. Trash Wheel is a machine in Baltimore."). Check in that order: about the essay? a view? no parts?', q:'“Mr. Trash Wheel is the best machine in the world.” What is wrong with this thesis?', o:['an opinion','topic only','announces']}
  ],
  practice:[
    {t:'sort', q:'Sort each thesis.', bins:[{id:'P',label:'🗺️ Previews the parts'},{id:'T',label:'📌 Topic only'},{id:'O',label:'💬 An opinion'}],
      items:[{label:'The Inner Harbor stays cleaner thanks to three helpers: booms, trash wheels and skimmer boats.',bin:'P'},{label:'Mr. Trash Wheel works in Baltimore.',bin:'T'},{label:'Baltimore should build ten more trash wheels.',bin:'O'},{label:'Storm drains are found on city streets.',bin:'T'},{label:'Rain sends trash to the harbor in two steps: it washes trash into storm drains, and the drains empty into the stream.',bin:'P'},{label:'Working on a skimmer boat is the most exciting job in Baltimore.',bin:'O'}],
      h:'First: is there an opinion word like best, should or most exciting? If not, are the parts named?'},
    {t:'pairs', q:'Match each body-paragraph plan to the thesis that previews it.', pairs:[['1) the water wheel 2) the belt 3) the dumpster','Mr. Trash Wheel works with a water wheel, a conveyor belt and a dumpster.'],['1) plastic bottles 2) foam cups 3) plastic bags','Three kinds of trash fill Mr. Trash Wheel’s dumpster: plastic bottles, foam cups and plastic bags.'],['1) how they are alike 2) how they differ','A trash wheel and a skimmer boat share a job but work in different ways.']],
      h:'Find the thesis that names the same parts, in the same order.'},
    {t:'spotall', q:'Tap every thesis that previews the parts.', cells:[{label:'Mr. Trash Wheel gets its power from two places: the stream’s current and the sun.',ok:true},{label:'Booms, rakes and a belt work together to pull trash from the Jones Falls.',ok:true},{label:'Mr. Trash Wheel has googly eyes.',ok:false},{label:'In this essay I will explain trash.',ok:false},{label:'The harbor is in Baltimore.',ok:false}],
      h:'Does the sentence name the main parts the essay will cover?'},
    {t:'sort', q:'Thesis mistakes! Sort each one.', bins:[{id:'G',label:'✅ Previews the parts'},{id:'A',label:'⚠️ Announces'},{id:'T',label:'⚠️ Topic only'}],
      items:[{label:'In this essay I will tell you about booms.',bin:'A'},{label:'This essay is about skimmer boats.',bin:'A'},{label:'Skimmer boats work in the harbor.',bin:'T'},{label:'A skimmer boat cleans the harbor in three steps: it finds the trash, scoops it up and unloads it.',bin:'G'},{label:'Booms are used in the harbor.',bin:'T'},{label:'A boom steers trash with two parts: a floating tube on top and a curtain below the water.',bin:'G'}],
      h:'"In this essay" or "This essay is about" announces. A topic with no parts is topic only.'},
    {t:'order', q:'Build Eli’s thesis. Tap the tiles in order.', tiles:['Mr. Trash Wheel','works with','a water wheel,','a conveyor belt','and a dumpster.'],
      h:'The topic first. Then the parts, in the order of the body paragraphs.'},
    {t:'spotall', q:'Body paragraphs: 1) where the trash comes from, 2) how the wheel catches it, 3) where it goes. Tap every thesis that previews them IN ORDER.', cells:[{label:'Harbor trash comes from city streets, gets caught by the wheel, and leaves on a barge.',ok:true},{label:'From the street to the wheel to the barge, harbor trash takes a three-stop trip.',ok:true},{label:'Harbor trash leaves on a barge, comes from city streets, and gets caught by the wheel.',ok:false},{label:'Trash is a problem.',ok:false},{label:'This essay is about trash.',ok:false}],
      h:'First where it comes from, then the wheel, then where it goes.'},
    {t:'write', q:'Your turn to write. Pick a topic you know well: your shul, a Yom Tov food, or a job in your house. List two or three body paragraphs, then write one thesis sentence.', min:0, checks:['📌 It states the topic.','🗺️ It previews each body paragraph, in order.','🚫 No "In this essay I will", and no opinion.'], h:'Write the list first. Then: topic + "has three parts:" (or "works in three steps:") + the list, in order.'}
  ],
  check:[
    {q:'Thesis: “Our shul’s sukkah is the most beautiful in Baltimore.” What is wrong with it?', o:['an opinion','topic only','announces'], h:'Is there a word that gives the writer’s view, like most beautiful?'},
    {q:'Thesis: “Shabbos challah comes together in three stages: the dough, the braiding and the baking.” Which describes it?', o:['previews the parts','topic only','announces'], h:'Does it name the topic? Does it name the main parts?'},
    {t:'order', q:'Body paragraphs: 1) the kitchen 2) the bedrooms 3) the car. Build a thesis that previews them in order. Tap the tiles in order.', tiles:['Pesach cleaning','has three parts:','the kitchen,','the bedrooms','and the car.'], h:'The topic first. Then the parts, joined with commas and "and".'}
  ],
  re:[
    {how:'A new way: a thesis is a table of contents in one sentence. A reader who reads only the thesis already knows what each paragraph will cover.', q:'A thesis works like…', o:['a table of contents','a title page','the last page']},
    {how:'A simpler step: write your body-paragraph topics as a list first. Then join them: the topic + "has three parts:" + the list.', q:'To build a thesis fast, start from…', o:['the list of body paragraphs','a question to the reader','your favorite fact']},
    {how:'The skill underneath: Umbrella Sentence (Grade 4). A topic sentence covers one paragraph. A thesis is a bigger umbrella: it covers the whole essay and names each part under it.', q:'A thesis covers…', o:['the whole essay','one paragraph','one sentence']}
  ]},

  'WRIT.PARA.L07.06':{name:'Develop the Point',
  teach:[
    {how:'In Grade 5 you backed a point with proof. Now DEVELOP it: a strong body paragraph uses several KINDS of support, and a good writer knows which kind he is using. A FACT gives a number, a date or a name that you could look up: "It has done this job since 2014." A DEFINITION explains a word the reader may not know: "A conveyor belt is a moving belt that carries things from place to place."', q:'“A barge is a flat boat that carries heavy loads.” What kind of support is this?', o:['a definition','a fact','a quote']},
    {how:'A CONCRETE DETAIL paints what you would SEE or HEAR if you stood there, with no number: "Dripping bottles ride slowly up the belt." A QUOTE gives someone’s exact words, in quotation marks, with who said them. An EXAMPLE is one case that shows the point, often starting with "For example,".', q:'“For example, a bottle dropped on a street can ride the rain down the stream and up the belt.” What kind of support is this?', o:['an example','a concrete detail','a definition']},
    {how:'Two mistakes. SAYS IT AGAIN, which you met in Say More: a sentence that repeats the point in new words. The new one is ONE KIND ONLY: three facts in a row, so the reader gets numbers but never sees it or learns the hard word. A developed paragraph uses at least three DIFFERENT kinds.', q:'Point: “The bakery is busy before Shabbos.” Support: “It sells 400 challos. It opens at 6:00. It has 12 workers.” What is the problem?', o:['one kind only','says it again','develops the point']}
  ],
  practice:[
    {t:'sort', q:'Sort each sentence by its kind of support.', bins:[{id:'F',label:'🔢 Fact'},{id:'D',label:'📖 Definition'},{id:'C',label:'👀 Concrete detail'}],
      items:[{label:'Mr. Trash Wheel has done this job since 2014.',bin:'F'},{label:'In one hour, the Beacon team picked up 104 pieces of trash along the Jones Falls.',bin:'F'},{label:'A boom is a floating fence that steers trash.',bin:'D'},{label:'The current is the steady push of moving water.',bin:'D'},{label:'Foam cups bob and spin toward the wheel.',bin:'C'},{label:'The rakes clank as they drag trash onto the belt.',bin:'C'}],
      h:'A number or a date you can check: fact. A word explained: definition. Something you could see or hear: concrete detail.'},
    {t:'spotall', q:'Tap every paragraph that uses ONE KIND ONLY.', cells:[{label:'Point: the Beacon team worked hard. Support: They met 5 times. They wrote 12 pages. They took 30 photos.',ok:true},{label:'Point: the chessed drive was a success. Support: It ran for 3 days. The boys brought 210 cans. They filled 9 boxes.',ok:true},{label:'Point: the belt lifts the trash. Support: A conveyor belt is a moving belt. Dripping bottles ride up it. Mr. Gross said, “The belt does the lifting.”',ok:false},{label:'Point: the wheel catches the most trash after rain. Support: A storm drain is a street opening for rainwater. Foam cups bob and spin toward the wheel. For example, after a storm, cups crowd the booms.',ok:false}], h:'Name the kind of each support sentence. Three facts with numbers, and nothing else? One kind only.'},
    {t:'spotall', q:'Benny’s point: “Mr. Trash Wheel catches the most trash after a heavy rain.” Tap every sentence that DEVELOPS the point: it adds something new.', cells:[{label:'A storm drain is an opening in the street that carries rainwater away.',ok:true},{label:'Rain washes trash off the streets into the storm drains, and the drains empty into the Jones Falls.',ok:true},{label:'For example, after a storm, bottles and foam cups crowd the booms.',ok:true},{label:'The wheel really does catch lots of trash after it rains.',ok:false},{label:'After rain, it catches the most trash of all.',ok:false}],
      h:'Does the sentence add a word, a fact, a picture or a case? Or does it only say the point again?'},
    {t:'sort', q:'Sneaky ones! Point: “The belt lifts the trash out of the water.” Sort each sentence.', bins:[{id:'G',label:'✅ Develops the point'},{id:'S',label:'⚠️ Says it again'}],
      items:[{label:'Dripping bottles ride slowly up the belt.',bin:'G'},{label:'The belt really does lift trash out.',bin:'S'},{label:'A conveyor belt is a moving belt that carries things from place to place.',bin:'G'},{label:'So, the trash gets lifted out by the belt.',bin:'S'},{label:'Mr. Gross said, “The stream does the pushing, and the belt does the lifting.”',bin:'G'},{label:'Lifting trash out of the water is what the belt does.',bin:'S'}],
      h:'Read the point. Then ask: is anything new here, or is it the point in new words?'},
    {t:'order', q:'Build a sentence that adds a definition. Tap the tiles in order.', tiles:['A boom','is a floating fence','that steers trash','to the wheel.'],
      h:'The word first. Then what it is. Then what it does.'},
    {t:'spotall', q:'Tap every QUOTE written the right way: exact words, in quotation marks, with who said them.', cells:[{label:'Mr. Gross said, “The stream does the pushing, and the belt does the lifting.”',ok:true},{label:'“I watched it for an hour,” Yoni said.',ok:true},{label:'Someone said the belt is good.',ok:false},{label:'Mr. Gross said the stream does the pushing.',ok:false},{label:'The belt does the lifting.',ok:false}],
      h:'Look for quotation marks AND a name. Words with no quotation marks are not a quote.'},
    {t:'write', q:'Your turn to write. Point: “The dumpster on the barge holds the trash until it leaves.” Write three or four sentences that develop it. Use at least three kinds of support, and name each one in brackets.', min:0, checks:['🧱 Every sentence adds something new.','🔢 I used at least three kinds: fact, definition, concrete detail, quote, example.','🏷️ I named the kind of each sentence.'], h:'Try: define "barge" (a flat boat that carries heavy loads). Add something you could see. Use the fact: when the dumpster is full, a boat tows it away and brings an empty one.'}
  ],
  check:[
    {q:'Point: “Our shul’s new sukkah is big.” Support: “It seats 120 people. It is 30 feet long. It has 14 tables.” What is the problem?', o:['one kind only','says it again','develops the point'], h:'Name the kind of each sentence. Are there at least three different kinds?'},
    {q:'Point: “The bakery is busy before Shabbos.” Sentence: “Trays of warm challah crowd every shelf.” What kind of support is this?', o:['a concrete detail','an example','a fact'], h:'No number, no word explained. Could you see it if you stood there?'},
    {t:'order', q:'Point: “Bakeries are busy before Shabbos.” Build an example sentence. Tap the tiles in order.', tiles:['For example,','one bakery','baked 400 challos','last Friday.'], h:'"For example," first. Then who, what, and when.'}
  ],
  re:[
    {how:'A new way: think of a museum guide. He gives a date (a fact), explains a hard word (a definition), points at something to look at (a concrete detail), repeats what an expert said (a quote), and tells one story (an example).', q:'When a guide explains a hard word, he gives…', o:['a definition','a quote','a fact']},
    {how:'A simpler step: after your point, ask three questions. What word needs explaining? What would I see there? Who said something about it? Each answer is a new sentence.', q:'The question “What would I see there?” gives…', o:['a concrete detail','a definition','a quote']},
    {how:'The skill underneath: Say More (Grade 4) and Point, Proof, Explain (Grade 5) gave you facts, examples and quotes. Now you go further: you add definitions and concrete details, use at least three different kinds, and name each one.', q:'Develop the Point goes further than Point, Proof, Explain by…', o:['using and naming several kinds of support','writing a longer title','adding an opinion']}
  ]},

  'WRIT.PARA.L07.07':{name:'Smooth Transitions',
  teach:[
    {how:'In Unit 1 your glue words linked sentences inside an argument. An essay also needs links BETWEEN PARAGRAPHS. The first sentence of a new paragraph is a BRIDGE: it POINTS BACK to the last paragraph and POINTS FORWARD to the new one. Last paragraph: the wheel. New paragraph: the belt. Bridge: "The wheel gives the power, but the conveyor belt does the lifting."', q:'In that bridge, which part points back to the last paragraph?', o:['The wheel gives the power','the conveyor belt does the lifting','but']},
    {how:'Bridge starters help: "Once…," "After…," "Besides…," or "…, but…". "Once the belt has lifted the trash, the dumpster holds it." The "Once" part points back; the rest points forward. A bridge that does both POINTS BACK AND FORWARD.', q:'Last paragraph: the booms. New paragraph: the wheel. Which first sentence points back and forward?', o:['Once the booms steer the trash in, the wheel goes to work.','The wheel is turned by the current.','The booms steer the trash, as I said before.']},
    {how:'Two mistakes. FORWARD ONLY: the new paragraph jumps in with no link back ("The dumpster sits on a barge."). A one-word link like "Next," or "Also," is sentence glue. It does not say what came before, so it is still forward only. BACK ONLY: the first sentence only repeats the last paragraph and never says what is new.', q:'Last paragraph: the belt. New paragraph: the dumpster. “Next, the dumpster sits on a barge.” What is it?', o:['forward only','back only','points back and forward']}
  ],
  practice:[
    {t:'sort', q:'Last paragraph: the belt. New paragraph: the dumpster. Sort each first sentence.', bins:[{id:'B',label:'🌉 Points back and forward'},{id:'F',label:'⏩ Forward only'},{id:'K',label:'⏪ Back only'}],
      items:[{label:'Once the belt has lifted the trash, the dumpster holds it.',bin:'B'},{label:'After its ride up the belt, the trash drops into a dumpster.',bin:'B'},{label:'The dumpster sits on a barge.',bin:'F'},{label:'Also, a dumpster sits on a barge.',bin:'F'},{label:'The belt lifts trash, as I said.',bin:'K'},{label:'That is how the belt lifts the trash out of the water.',bin:'K'}],
      h:'Does it name the belt (back)? Does it name the dumpster (forward)? A bridge does both.'},
    {t:'pairs', q:'Match each bridge to the two paragraphs it joins.', pairs:[['Once the booms steer the trash in, the wheel goes to work.','booms → wheel'],['The wheel gives the power, but the belt does the lifting.','wheel → belt'],['Once the belt has lifted the trash, the dumpster holds it.','belt → dumpster']],
      h:'The first part names the last paragraph. The second part names the new one.'},
    {t:'spotall', q:'Last paragraph: how the wheel catches trash. New paragraph: where the trash goes. Tap every first sentence that points back AND forward.', cells:[{label:'Once the wheel catches the trash, it still has to leave the harbor.',ok:true},{label:'Catching the trash is only half the job; next, it must leave the harbor.',ok:true},{label:'Trash leaves on a barge.',ok:false},{label:'Next, trash leaves the harbor.',ok:false},{label:'As the last paragraph showed, the wheel catches trash.',ok:false}],
      h:'Look for the catching (back) AND the leaving (forward) in one sentence.'},
    {t:'sort', q:'Bridge mistakes! Last paragraph: rain and storm drains. New paragraph: the booms. Sort each first sentence.', bins:[{id:'G',label:'✅ Points back and forward'},{id:'F',label:'⚠️ Forward only'},{id:'K',label:'⚠️ Back only'}],
      items:[{label:'Once rain carries the trash down the stream, the booms steer it to the wheel.',bin:'G'},{label:'Booms are floating fences.',bin:'F'},{label:'Also, booms steer trash.',bin:'F'},{label:'Rain washes trash into storm drains, as I explained.',bin:'K'},{label:'The storm drains really do carry trash.',bin:'K'},{label:'The storm drains bring the trash, but the booms decide where it goes.',bin:'G'}],
      h:'"Also," alone does not point back. Repeating the drains does not point forward.'},
    {t:'order', q:'Build a bridge from the belt paragraph to the dumpster paragraph. Tap the tiles in order.', tiles:['Once the belt','has lifted the trash,','the dumpster','holds it.'],
      h:'Point back to the belt first. Then point forward to the dumpster.'},
    {t:'spotall', q:'Tap every paragraph opener that points back to what came before.', cells:[{label:'Once the trash is out of the water,',ok:true},{label:'After its ride up the belt,',ok:true},{label:'Besides turning the wheel,',ok:true},{label:'Also,',ok:false},{label:'Next,',ok:false}],
      h:'Does the opener name what the last paragraph was about?'},
    {t:'write', q:'Your turn to write. Pick two paragraphs of the harbor feature: the wheel → the belt, or the belt → the dumpster. Write the first sentence of the second paragraph: a bridge.', min:0, checks:['⏪ It points back to the last paragraph.','⏩ It points forward to the new one.','🚫 It is not just "Next," or "Also,".'], h:'Start with "Once…," or "After…," and name what the last paragraph did. Then say what the new paragraph is about.'}
  ],
  check:[
    {q:'An essay about building a sukkah. Last paragraph: the walls. New paragraph: the s’chach. “Once the walls are standing, it is time to lay the s’chach.” What is it?', o:['points back and forward','forward only','back only'], h:'Does it name the walls? Does it name the s’chach?'},
    {q:'Same essay. Last paragraph: the s’chach. New paragraph: the decorations. “Also, there are decorations.” What is it?', o:['forward only','back only','points back and forward'], h:'Does "Also," say anything about the s’chach?'},
    {t:'order', q:'Build a bridge from the s’chach paragraph to the decorations paragraph. Tap the tiles in order.', tiles:['Once the s’chach','is on top,','the boys hang','the decorations.'], h:'Point back to the s’chach first. Then forward to the decorations.'}
