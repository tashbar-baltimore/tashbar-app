<!-- StaffLibrary.html — the Library & One-Tap Command Center for staff (server: Library.js). Claude Code builder, 2026-11-16.
     Opens from the "Library" button. Loads the Library and the roster ONCE; every action is one libApply call that returns
     only what changed, so the screen never reloads and never sends you back to the name. Undo for 30 seconds. -->
<style>
#lbx-btn{position:fixed;left:14px;bottom:14px;z-index:9000;border:0;border-radius:999px;padding:10px 16px;font:700 14px/1 system-ui,-apple-system,"Segoe UI",sans-serif;background:#16274A;color:#fff;box-shadow:0 6px 18px rgba(10,20,40,.25);cursor:pointer;display:none}
#lbx-btn b{color:#F0B847}

  position:fixed;inset:0;z-index:9500;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
@media (prefers-color-scheme:dark){#lbx{--bg:#0F1625;--panel:#162033;--ink:#E9EDF5;--soft:#9AA6BC;--line:#26324A;--line2:#1D2840;--navy:#0A1222;--honey:#F0B847;--honey-soft:#3A2E14;--honey-ink:#F6D58C;--sel:#1E2D4D;--sel-line:#7C9CE6;--good:#5CC48A;--good-soft:#14301F;--warn:#E3A74A;--warn-soft:#33270F;--bad:#EE7D70;--bad-soft:#3A1A17}}

#lbx .card .code{font:11px ui-monospace,Menlo,monospace;color:var(--soft)}#lbx .card .t{font-weight:600;line-height:1.3}#lbx .card .k{font-size:12px;color:var(--honey-ink)}
#lbx .card .tag{font-size:10.5px;font-weight:700;color:var(--soft)}

#lbx .say{flex:1 1 260px;min-width:0}#lbx .say small{display:block;color:var(--soft);font-size:12px}
#lbx .ab{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;font-weight:600}
#lbx .ab.pri{background:var(--navy);color:#fff;border-color:var(--navy)}#lbx .ab:disabled{opacity:.4;cursor:not-allowed}
#lbx select{border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--panel)}

#lbx .toast.err{background:#8E2A20}
#lbx .hist{border-top:1px solid var(--line);max-height:32%;overflow:auto;padding:8px 12px 80px;font-size:12px;color:var(--soft)}
#lbx .hist b{color:var(--ink)}
#lbx .empty{color:var(--soft);padding:14px}
#lbx .view{flex:1;min-height:0;overflow:auto;padding:16px 16px 40px}
#lbx .view h2{margin:0 0 4px;font:700 22px/1.2 Georgia,"Times New Roman",serif}
#lbx .tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-top:10px}

#lbx .mm button{border:0;border-radius:6px;padding:4px 0;width:100%;font:600 12px ui-monospace,Menlo,monospace}
#lbx .c-ahead{background:var(--good-soft);color:var(--good)}#lbx .c-on{background:var(--line2);color:var(--ink)}#lbx .c-below{background:var(--warn-soft);color:var(--warn)}#lbx .c-far{background:var(--bad-soft);color:var(--bad)}#lbx .c-none{background:transparent;color:var(--soft)}
#lbx .mm small{display:block;font:500 10.5px system-ui;opacity:.8}
#lbx .need{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

#lbx .pill{font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 6px;background:var(--bad-soft);color:var(--bad)}#lbx .pill.q{background:var(--warn-soft);color:var(--warn)}
#lbx .plform{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#lbx .plform input{border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--panel);min-width:0;width:200px}
@media (max-width:900px){#lbx .body{grid-template-columns:minmax(0,1fr)}#lbx .pane{max-height:38vh;border-right:0;border-bottom:1px solid var(--line)}
  #lbx .nav{display:flex;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}#lbx .nav h3{display:none}#lbx .nav button{white-space:nowrap;width:auto;border:1px solid var(--line)}#lbx .nav button span{display:none}
  #lbx .hist{display:none}#lbx .toast{bottom:auto;top:60px}}
</style>
<button id="lbx-btn" type="button" title="The Library and one-tap assigning">&#128218; <b>Library</b> &amp; Assign</button>
<div id="lbx" hidden role="dialog" aria-label="Library and Command Center"></div>
<script>
(function(){
'use strict';
var L = { view:'cc', pls:[], map:null, mapAt:0, plView:null, plForm:false, cat:null, ros:null, tick:{}, last:null, subj:null, sel:null, open:{}, q:'', bq:'', undo:null, hist:[], busy:0, toastT:null };
var btn = document.getElementById('lbx-btn'), box = document.getElementById('lbx');
function tok(){ try { return (typeof S !== 'undefined' && S && S.token) ? S.token : null; } catch (e) { return null; } }
function call(fn){ var a = [].slice.call(arguments, 1); return new Promise(function(ok, no){ google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){ no(e && e.message ? e.message : String(e)); })[fn].apply(null, a); }); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
setInterval(function(){ btn.style.display = tok() && box.hidden ? 'block' : 'none'; }, 800);
btn.onclick = openLib;
document.addEventListener('keydown', function(e){ if (box.hidden) return; var typing = /INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||'');
  if (e.key === 'Escape') { if (L.q) { L.q=''; draw(); } else if (L.sel) { L.sel=null; draw(); } else closeLib(); return; }
  if (e.key === '/' && !typing) { e.preventDefault(); var q = document.getElementById('lbx-q'); if (q) q.focus(); return; }
  if (typing || e.metaKey || e.ctrlKey) return; var k = e.key.toLowerCase();
  if (k === 'p') doAct('place'); else if (k === 'a') doAct('assign'); else if (k === 'b') doAct('block'); else if (k === 'z' && L.undo) doUndo(); });

/* ---------- loading (once) ---------- */
function openLib(){
  box.hidden = false; document.body.style.overflow = 'hidden';
  if (L.cat && L.ros) { draw(); return; }
  box.innerHTML = '<div class="top"><h1>Library &amp; Command Center</h1><button class="tb" data-x="close">Close</button></div><div class="empty">Opening the Library…</div>';
  box.querySelector('[data-x=close]').onclick = closeLib;
  var cached = null; try { cached = JSON.parse(localStorage.getItem('lbx_cat2') || 'null'); } catch (e) {}
  var t = tok();
  Promise.all([cached ? Promise.resolve(cached) : call('libCatalog', t), call('libRoster', t)]).then(function(r){
    L.cat = r[0]; L.ros = r[1]; prep();
    if (!cached) { try { localStorage.setItem('lbx_cat2', JSON.stringify(L.cat)); } catch (e) {} }
    else call('libCatalog', t).then(function(c){ if (c.stamp !== L.cat.stamp || c.cards.length !== L.cat.cards.length) { L.cat = c; prep(); draw(); try { localStorage.setItem('lbx_cat2', JSON.stringify(c)); } catch (e) {} } }).catch(function(){});
    draw(); loadHist(); loadPls();
  }).catch(function(e){ box.querySelector('.empty').textContent = 'The Library did not open: ' + e + ' Close and try again.'; });
}
function closeLib(){ box.hidden = true; document.body.style.overflow = ''; }
function loadPls(){ call('libPlaylists', tok()).then(function(p){ L.pls = p || []; if (L.view === 'cc') { var n = document.getElementById('lbx-nav'); if (n) { var st = n.scrollTop; draw(); } } }).catch(function(){}); }
function loadMap(force){ if (!force && L.map && Date.now() - L.mapAt < 60000) return; call('libMap', tok()).then(function(m){ L.map = m; L.mapAt = Date.now(); if (L.view !== 'cc') draw(); }).catch(function(e){ L.mapErr = String(e); if (L.view !== 'cc') draw(); }); }
function loadHist(){ call('libHistory', tok()).then(function(h){ L.hist = h; var el = document.getElementById('lbx-h'); if (el) el.innerHTML = histHTML(); }).catch(function(){}); }

/* ---------- the Library model ---------- */
var WINGS = ['Torah','Learning','Skills','Heart'], SUBJ = {}, BYS = {}, CARD = {}, SUBJKEYS = {};
function prep(){
  SUBJ = {}; BYS = {}; CARD = {};
  Object.keys(L.cat.strands).forEach(function(k){ var s = L.cat.strands[k]; var id = s.wing + '|' + s.subj; (SUBJ[id] = SUBJ[id] || { wing:s.wing, name:s.subj, strands:[] });
    if (!SUBJ[id].strands.some(function(x){ return x.name === s.name; })) SUBJ[id].strands.push({ code:k, name:s.name, place:s.place, band:s.band, codes:[k] }); else SUBJ[id].strands.filter(function(x){ return x.name === s.name; })[0].codes.push(k); });
  L.cat.cards.forEach(function(c){ var o = { code:c[0], title:c[1], kid:c[2], strand:c[3], lv:c[4], order:c[5], live:c[6], kind:c[7] }; CARD[o.code] = o;
    var s = L.cat.strands[o.strand], id = s.wing + '|' + s.subj, st = SUBJ[id].strands.filter(function(x){ return x.codes.indexOf(o.strand) >= 0; })[0]; (BYS[id + '|' + st.name] = BYS[id + '|' + st.name] || []).push(o); });
  Object.keys(BYS).forEach(function(k){ BYS[k].sort(function(a,b){ return a.lv - b.lv || a.order - b.order; }); });
  SUBJKEYS = {}; (L.cat.subjects || []).forEach(function(s){ SUBJKEYS[s[0]] = { name:s[1], min:s[2], max:s[3] }; });
  if (!L.subj) L.subj = SUBJ['Learning|Math'] ? 'Learning|Math' : Object.keys(SUBJ)[0];
}
function cardsOf(subjId, st){ return BYS[subjId + '|' + st.name] || []; }
function bandName(l){ return ['','Band K-2','Band 3-5','Band 6-8'][l] || ('L' + l); }
function lvName(st, l){ return st.band ? bandName(l) : 'L' + l; }
function gradeName(st, l){ if (st.band) return ['','grades K-2','grades 3-5','grades 6-8'][l] || ''; return l === 1 ? 'Kindergarten' : l <= 9 ? 'Grade ' + (l - 1) : 'High school'; }
function levelsOf(subjId, st){ var have = {}; cardsOf(subjId, st).forEach(function(c){ have[c.lv] = 1; }); var ks = Object.keys(have).map(Number).sort(function(a,b){return a-b;}); if (!ks.length) return []; var out = []; for (var i = ks[0]; i <= ks[ks.length-1]; i++) out.push(i); return out; }
function placeKeyOf(st){ return st.place || ''; }
var DEFKEYS = { MATH:1, READ:1, LANG:1, SCI:1, SOC:1, HEB:1 };
function placeOf(b, key){ return key && b.place ? b.place[key] : null; }
function levelOf(b, key){ var p = placeOf(b, key); if (p && p.lv) return p; if (DEFKEYS[key] && b.grade != null) return { lv: b.grade + 1, by: 'default' }; return null; }   /* default = grade + 1, shown only, never written */
function canLevel(){ var r = L.ros && L.ros.me ? String(L.ros.me.role || '') : ''; return { head:1, admin:1, rebbe:1, teacher:1, '':1 }[r] === 1; }

/* ---------- drawing ---------- */
function ticked(){ return L.ros.boys.filter(function(b){ return L.tick[b.id]; }); }
function draw(){
  var keep = {}; ['lbx-roster','lbx-shelves','lbx-nav'].forEach(function(id){ var el = document.getElementById(id); if (el) keep[id] = el.scrollTop; });
  var h = '<div class="top"><div style="margin-right:auto"><h1>Library &amp; Command Center</h1><small>Tick boys · tap a level or a lesson · one tap does them all</small></div>'
    + ['cc','map','needs'].map(function(v){ return '<button class="tb' + (L.view === v ? ' on' : '') + '" data-v="' + v + '">' + {cc:'Command Center', map:'Mastery Map', needs:'Needs you'}[v] + '</button>'; }).join('')
    + '<button class="tb" data-x="pfx" title="Pathfinder: today\'s five CSV files for the daily check">Pathfinder export</button>'
    + '<span class="sync' + (L.busy ? ' busy' : '') + '" id="lbx-sync"><i></i><span>' + (L.busy ? 'Saving…' : 'All saved') + '</span></span><button class="tb" data-x="close">Close</button></div>';
  if (L.view !== 'cc') { box.innerHTML = h + '<div class="view" id="lbx-view">' + (L.view === 'map' ? mapHTML() : needsHTML()) + '</div><div class="toast" id="lbx-toast" hidden></div>'; wireView(); return; }
  h += '<div class="body"><div class="pane"><div class="ph"><div class="row"><input class="search" id="lbx-bq" placeholder="Find a boy" value="' + esc(L.bq) + '"><button class="chip" data-x="clear">Clear</button></div><div class="row">' + groupChips() + '</div>' + (ticked().length && canLevel() ? '<div class="row"><span style="font-size:12px;color:var(--soft)">Grade for ' + ticked().length + ':</span><select id="lbx-gr" aria-label="Grade"><option value="0">K</option>' + [1,2,3,4,5,6,7,8].map(function(g){ return '<option>' + g + '</option>'; }).join('') + '</select><button class="chip" data-x="grade">Set grade</button></div>' : '') + (ticked().length ? '<div class="row"><button class="chip" data-x="report">Report cards for ' + ticked().length + '</button></div>' : '') + '</div><div class="scroll" id="lbx-roster">' + rosterHTML() + '</div><div class="hist" id="lbx-h">' + histHTML() + '</div></div>';
  h += '<nav class="nav" id="lbx-nav"><div style="padding:4px 4px 8px"><input class="search" id="lbx-q" placeholder="Search the Library ( / )" value="' + esc(L.q) + '" style="width:100%"></div>' + navHTML() + '</nav>';
  h += '<div class="shelves" id="lbx-shelves">' + shelvesHTML() + '</div></div>';
  h += actHTML();
  box.innerHTML = h;
  Object.keys(keep).forEach(function(id){ var el = document.getElementById(id); if (el) el.scrollTop = keep[id]; });
  wire();
}
function groupChips(){ return (L.ros.groups || []).slice(0, 12).map(function(g, i){ var all = g.sids.length && g.sids.every(function(id){ return L.tick[id]; }); return '<button class="chip" data-g="' + i + '" aria-pressed="' + !!all + '">' + esc(g.name) + '</button>'; }).join('') + '<button class="chip" data-x="all">Everyone</button>'; }
function curKey(){ var st = curStrand(); return st ? placeKeyOf(st) : (SUBJ[L.subj] && SUBJ[L.subj].strands[0] ? placeKeyOf(SUBJ[L.subj].strands[0]) : ''); }
function curStrand(){ if (!L.sel) return null; var S = SUBJ[L.sel.subj]; return S ? S.strands.filter(function(x){ return x.name === L.sel.st; })[0] : null; }
function rosterHTML(){
  var key = curKey(), q = L.bq.toLowerCase(), h = '', list = L.ros.boys.filter(function(b){ return !q || b.name.toLowerCase().indexOf(q) >= 0; });

    var d = new Date(), h = '<!doctype html><html><head><meta charset="utf-8"><title>Report cards</title><style>body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:#16233D;margin:0;padding:24px}h1{font:700 22px Georgia,serif;margin:0}h2{font:700 15px system-ui;margin:16px 0 6px}.card{page-break-after:always;max-width:760px;margin:0 auto 40px}.top{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid #E3A72F;padding-bottom:8px}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #E2DED4;padding:6px 8px;text-align:left}th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#5B6880}.muted{color:#5B6880}.pb{margin:20px 0}button{font:600 14px system-ui;padding:8px 14px;border-radius:8px;border:1px solid #16274A;background:#16274A;color:#fff}@media print{.pb{display:none}}</style></head><body><div class="pb"><button onclick="window.print()">Print</button></div>';
    boys.forEach(function(b){ var r = m.boys[b.id] || {}; r.prog = r.prog || {}; r.stuck = r.stuck || []; r.month = r.month || {}; r.recent = r.recent || []; var dd = daysAgo(r.last);
      h += '<div class="card"><div class="top"><h1>' + esc(b.name) + '</h1><span class="muted">' + (b.grade != null ? (b.grade ? 'Grade ' + b.grade : 'Kindergarten') + ' · ' : '') + d.toLocaleDateString([], { month:'long', day:'numeric', year:'numeric' }) + '</span></div>';
      h += '<h2>Where he is</h2><table><tr><th>Subject</th><th>Level</th><th>Against grade</th><th>This level</th></tr>';
      MAPCOLS.forEach(function(c){ var p = b.place[c[0]] || levelOf(b, c[0]); if (!p || !p.lv) return; var exp = b.grade != null ? b.grade + 1 : null, dl = exp != null && !/^K:/.test(c[0]) ? p.lv - exp : null, pr = r.prog[c[0]];
        h += '<tr><td>' + c[1] + '</td><td>Level ' + p.lv + (p.by === 'default' ? ' <span class="muted">(not set yet)</span>' : '') + '</td><td>' + (dl == null ? '' : dl > 0 ? dl + ' ahead' : dl === 0 ? 'on grade' : (-dl) + ' below') + '</td><td>' + (pr ? pr[0] + ' of ' + pr[1] + ' lessons' : '') + '</td></tr>'; });
      h += '</table><h2>Mastered in the last 30 days</h2>' + (Object.keys(r.month).length ? '<table>' + Object.keys(r.month).map(function(s){ return '<tr><td>' + esc(s) + '</td><td>' + r.month[s] + ' lesson' + (r.month[s] === 1 ? '' : 's') + '</td></tr>'; }).join('') + '</table><p class="muted">Most recent: ' + esc(r.recent.join(', ')) + '</p>' : '<p class="muted">Nothing mastered in the last 30 days.</p>');
      h += '<h2>Needs practice</h2>' + (r.stuck.length ? '<ul>' + r.stuck.map(function(s){ return '<li>' + esc(s[2]) + ' <span class="muted">(' + s[1] + ' misses)</span></li>'; }).join('') + '</ul>' : '<p class="muted">Not stuck on anything.</p>');
      var pk = L.ros.picks[b.id] || []; h += '<h2>Assigned to him</h2>' + (pk.length ? '<ul>' + pk.map(function(id){ return '<li>' + esc(CARD[id] ? CARD[id].title : id) + '</li>'; }).join('') + '</ul>' : '<p class="muted">Nothing assigned right now.</p>');
      h += '<p class="muted">Last active: ' + (dd == null ? 'no work saved yet' : dd === 0 ? 'today' : dd + ' days ago') + ' · ' + (r.mastered || 0) + ' lessons mastered in all.</p></div>'; });
    w.document.open(); w.document.write(h + '</body></html>'); w.document.close();
  }).catch(function(e){ w.document.body.innerHTML = '<p style="font:16px system-ui;padding:20px">Could not make the report cards: ' + esc(e) + '</p>'; });
}
/* ---------- Mastery Map + Needs you ---------- */
var MAPCOLS = [['MATH','Math','Learning|Math'],['READ','Reading','Learning|Reading'],['LANG','Writing','Learning|Writing & Language'],['SCI','Science','Learning|Science'],['SOC','Social Studies','Learning|Social Studies'],['HEB','Lashon Hakodesh','Torah|Kriyah & Lashon Hakodesh'],['K:KRI','Kriyah','Torah|Kriyah & Lashon Hakodesh'],['K:CHU','Chumash','Torah|Chumash & Mefarshim'],['K:RAS','Rashi','Torah|Chumash & Mefarshim'],['K:MSH','Mishnayos','Torah|Mishnah & Gemara'],['K:GEM','Gemara','Torah|Mishnah & Gemara']];
function daysAgo(ms){ if (!ms) return null; return Math.floor((Date.now() - ms) / 864e5); }
function inGroupFilter(b){ var g = L.mapGroup; if (g == null || g === '') return true; var G = L.ros.groups[+g]; return !G || G.sids.indexOf(b.id) >= 0; }
function groupSelect(){ return '<select id="lbx-mg" aria-label="Show"><option value="">Everyone</option>' + (L.ros.groups || []).map(function(g, i){ return '<option value="' + i + '"' + (String(L.mapGroup) === String(i) ? ' selected' : '') + '>' + esc(g.name) + '</option>'; }).join('') + '</select>'; }
function mapHTML(){
  if (!L.map) return '<h2>Mastery Map</h2><div class="empty">' + (L.mapErr ? 'The map did not load: ' + esc(L.mapErr) : 'Reading every boy\'s progress…') + '</div>';
  var h = '<h2>Mastery Map</h2><div class="row" style="justify-content:space-between"><span style="color:var(--soft)">Each square: his level against his grade, and how much of that level he has mastered. Tap a square to open the Command Center with that boy and subject.</span>' + groupSelect() + '</div>';
  h += '<div class="row" style="margin-top:8px;font-size:12px;color:var(--soft);gap:14px"><span><b style="color:var(--good)">■</b> ahead of grade</span><span><b>■</b> on grade</span><span><b style="color:var(--warn)">■</b> 1 below</span><span><b style="color:var(--bad)">■</b> 2 or more below</span><span>no grade on file: grey</span></div>';
  h += '<div class="tw"><table class="mm"><thead><tr><th>Boy</th>' + MAPCOLS.map(function(c){ return '<th>' + c[1] + '</th>'; }).join('') + '<th>Last active</th><th>Stuck</th></tr></thead><tbody>';
  L.ros.boys.filter(function(b){ return !b.test && inGroupFilter(b); }).forEach(function(b){ var m = L.map.boys[b.id] || { prog:{}, stuck:[] }, d = daysAgo(m.last);
    h += '<tr><td><b>' + esc(b.name) + '</b> <span style="color:var(--soft)">' + (b.grade != null ? 'G' + b.grade : '') + '</span></td>';
    MAPCOLS.forEach(function(c){ var p = b.place[c[0]] || (c[0] === 'K:CHU' && b.place.CHM ? { lv:b.place.CHM.lv, chm:1 } : null) || levelOf(b, c[0]); if (!p || !p.lv) { h += '<td><button class="c-none" data-mb="' + esc(b.id) + '" data-ms="' + esc(c[2]) + '">–</button></td>'; return; }
      var cls = 'c-on'; if (!p.chm && b.grade != null) { var dlt = p.lv - (b.grade + 1); cls = dlt > 0 ? 'c-ahead' : dlt === 0 ? 'c-on' : dlt === -1 ? 'c-below' : 'c-far'; } else if (b.grade == null) cls = 'c-none';
      var pr = m.prog[c[0]]; h += '<td><button class="' + cls + '" data-mb="' + esc(b.id) + '" data-ms="' + esc(c[2]) + '"' + (p.by === 'default' ? ' style="opacity:.55" title="Default: grade + 1. No one has set this yet."' : '') + '>' + (p.chm ? 'Ch ' : 'L') + p.lv + (pr ? '<small>' + pr[0] + '/' + pr[1] + '</small>' : '') + '</button></td>'; });
    h += '<td>' + (d == null ? '–' : d === 0 ? 'today' : d + ' d') + '</td><td>' + (m.stuck.length ? '<span class="pill">' + m.stuck.length + '</span>' : '') + '</td></tr>'; });
  return h + '</tbody></table></div>';
}
function needsHTML(){
  if (!L.map) return '<h2>Needs you</h2><div class="empty">' + (L.mapErr ? 'Did not load: ' + esc(L.mapErr) : 'Looking for boys who are stuck or quiet…') + '</div>';
  var q = L.map.quietDays || 5, items = [], never = [];
  L.ros.boys.filter(function(b){ return !b.test && inGroupFilter(b); }).forEach(function(b){ var m = L.map.boys[b.id] || { stuck:[] }, d = daysAgo(m.last);
    m.stuck.forEach(function(s){ items.push({ b:b, kind:'stuck', code:s[0], fails:s[1], name:s[2] }); });
    (m.overdue || []).forEach(function(o){ items.push({ b:b, kind:'overdue', code:o[0], due:o[1], name:o[2] }); });
    if (d != null && d >= q) items.push({ b:b, kind:'quiet', days:d }); else if (d == null) never.push(b); });
  var h = '<h2>Needs you</h2><div class="row" style="justify-content:space-between"><span style="color:var(--soft)">Boys with an overdue lesson, stuck on a lesson (3+ misses, not mastered), or with no work for ' + q + '+ days.</span>' + groupSelect() + '</div><div style="margin-top:10px">';
  var nv = never.length ? '<div class="need"><div class="who"><b>' + never.length + ' boy' + (never.length === 1 ? ' has' : 's have') + ' not saved any work yet</b><small>' + esc(never.slice(0, 12).map(function(b){ return b.name; }).join(', ') + (never.length > 12 ? ', …' : '')) + '</small></div><button class="ab" data-na="never">Tick them in the Command Center</button></div>' : '';
  L.needNever = never;
  if (!items.length) return h + '<div class="empty">Nobody is stuck or quiet right now.</div>' + nv + '</div>';
  items.sort(function(a, b){ var o = { overdue:0, stuck:1, quiet:2, never:3 }; return o[a.kind] - o[b.kind] || (b.fails || b.days || 0) - (a.fails || a.days || 0); });
  items.slice(0, 120).forEach(function(it, i){ h += '<div class="need"><div class="who"><b>' + esc(it.b.name) + '</b> ' + (it.kind === 'overdue' ? '<span class="pill">overdue</span><small>“' + esc(it.name) + '” was due ' + esc(it.due) + ' and is not mastered yet</small>' : it.kind === 'stuck' ? '<span class="pill">stuck</span><small>Missed “' + esc(it.name) + '” ' + it.fails + ' times · ' + esc(it.code) + '</small>' : it.kind === 'quiet' ? '<span class="pill q">quiet</span><small>No work saved for ' + it.days + ' days</small>' : '<span class="pill q">no work yet</span><small>Has not saved any work</small>') + '</div>'
    + ((it.kind === 'stuck' || it.kind === 'overdue') && CARD[it.code] && CARD[it.code].live ? '<button class="ab" data-na="assign" data-i="' + i + '">Assign it again</button>' : '') + '<button class="ab" data-na="open" data-i="' + i + '">Open in Command Center</button></div>'; });
  L.needItems = items; return h + nv + '</div>';
}
function wireView(){
  box.querySelector('[data-x=close]').onclick = closeLib;
  var px = box.querySelector('[data-x=pfx]'); if (px) px.onclick = pfxOpen;
  box.querySelectorAll('[data-v]').forEach(function(el){ el.onclick = function(){ L.view = el.dataset.v; if (L.view !== 'cc') loadMap(); draw(); }; });
  var mg = document.getElementById('lbx-mg'); if (mg) mg.onchange = function(){ L.mapGroup = mg.value; draw(); };
  var v = document.getElementById('lbx-view');
  v.onclick = function(e){ var c = e.target.closest('[data-mb]'); if (c) { L.tick = {}; L.tick[c.dataset.mb] = 1; L.subj = c.dataset.ms; L.plView = null; L.sel = null; L.q = ''; L.view = 'cc'; draw(); return; }
    var n = e.target.closest('[data-na]'); if (!n) return;
    if (n.dataset.na === 'never') { L.tick = {}; (L.needNever || []).forEach(function(b){ L.tick[b.id] = 1; }); L.view = 'cc'; draw(); return; }
    var it = L.needItems[+n.dataset.i];
    if (n.dataset.na === 'open') { L.tick = {}; L.tick[it.b.id] = 1; L.view = 'cc'; if (it.code && CARD[it.code]) { var s = L.cat.strands[CARD[it.code].strand]; L.subj = s.wing + '|' + s.subj; L.sel = { type:'card', code:it.code, subj:L.subj, st:s.name, lv:CARD[it.code].lv }; L.open[L.subj + '|' + s.name] = CARD[it.code].lv; } draw(); return; }
    if (n.dataset.na === 'assign') apply({ action:'assign', boys:[it.b.id], cards:[it.code], note:'Try this one again' }); };
}
function dueDate(v){ if (!v) return ''; var d = new Date(); if (v === 'fri') { var add = (5 - d.getDay() + 7) % 7; d.setDate(d.getDate() + (add || 7)); } else d.setDate(d.getDate() + Number(v)); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function doUndo(){ if (!L.undo) return; var u = L.undo; L.undo = null; apply(u); }
})();
