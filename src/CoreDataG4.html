    'LANG.GRAM.L04.06':{name:"Walked, Walk, Will Walk", teach:[{"how": "Past tense tells what already happened. Many past verbs end in -ed: walked, helped.", "q": "\"Yesterday, Avi ___ Zeidy.\"", "o": ["helped", "helps", "will help"]}, {"how": "Present tense tells what happens now or every day: he walks, they walk.", "q": "\"Every day, Dovid ___ to school.\"", "o": ["walks", "walked", "will walk"]}, {"how": "Future tense tells what will happen. It uses will: he will walk.", "q": "Which word makes a verb future?", "o": ["will", "ed", "ing"]}], practice:[{"t": "sort", "q": "Sort each verb by its tense.", "bins": [{"id": "0", "label": "Past"}, {"id": "1", "label": "Present"}, {"id": "2", "label": "Future"}], "items": [{"label": "jumped", "bin": "0"}, {"label": "jumps", "bin": "1"}, {"label": "will jump", "bin": "2"}, {"label": "played", "bin": "0"}, {"label": "plays", "bin": "1"}, {"label": "will play", "bin": "2"}], "h": "Already, now, or not yet?"}, {"t": "pairs", "q": "Match each time word to its tense.", "pairs": [["yesterday", "past"], ["every day", "present"], ["tomorrow", "future"]], "h": "When does it happen?"}, {"t": "order", "q": "Build a future tense sentence.", "tiles": ["Tomorrow,", "we", "will bake", "challah."], "h": "Tomorrow, then who, then will + the verb."}, {"t": "order", "q": "Build a past tense sentence.", "tiles": ["Yesterday,", "Chaim", "cleaned", "his room."], "h": "Yesterday, then who, then the -ed verb."}, {"t": "sort", "q": "Mistake Detective: does the verb match the time word?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "Yesterday we played.", "bin": "0"}, {"label": "Yesterday we will play.", "bin": "1"}, {"label": "Tomorrow we will play.", "bin": "0"}, {"label": "Tomorrow we played.", "bin": "1"}], "h": "Check the time word first."}, {"t": "spotall", "q": "Tap every future verb.", "cells": [{"label": "will help", "ok": true}, {"label": "will bake", "ok": true}, {"label": "helped", "ok": f     'LANG.GRAM.L05.04':{name:"Big Old Red Truck", teach:[{"how": "When two or more adjectives come before a noun, they go in a set order: opinion, size, age, color, material, then the noun.", "q": "Which order is right?", "o": ["a big old truck", "an old big truck", "a truck big old"]}, {"how": "Opinion comes first: what you think (lovely, ugly, delicious). Size comes next (big, tiny), then age (old, new).", "q": "Which comes first?", "o": ["lovely", "little", "wooden"]}, {"how": "Color comes after age, and material (wooden, silver, glass) comes last, right before the noun.", "q": "Which is right?", "o": ["a red wooden sled", "a wooden red sled", "a sled red wooden"]}], practice:[{"t": "sort", "q": "Sort each adjective by its kind.", "bins": [{"id": "0", "label": "Opinion"}, {"id": "1", "label": "Size"}, {"id": "2", "label": "Color"}], "items": [{"label": "lovely", "bin": "0"}, {"label": "tiny", "bin": "1"}, {"label": "blue", "bin": "2"}, {"label": "delicious", "bin": "0"}, {"label": "huge", "bin": "1"}, {"label": "green", "bin": "2"}], "h": "What you think? How big? What color?"}, {"t": "order", "q": "Build it: opinion, age, material, then the noun.", "tiles": ["a", "lovely", "new", "silver", "bike"], "h": "Lovely (opinion), new (age), silver (material)."}, {"t": "order", "q": "Build it: opinion, size, material.", "tiles": ["a", "delicious", "little", "chocolate", "cake"], "h": "Delicious is what you think, so it comes first."}, {"t": "sort", "q": "Mistake Detective: right order, or a mistake?", "bins": [{"id": "0", "label": "Right order"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "a big old map", "bin": "0"}, {"label": "an old big map", "bin": "1"}, {"label": "a small red book", "bin": "0"}, {"label": "a red small book", "bin": "1"}], "h": "Size comes before age and color."}, {"t": "pairs", "q": "Match each kind to an example.", "pairs": [["opinion", "lovely"], ["size", "tiny"], ["age", "old"], ["material", "wooden"]], "h": "Think: what you think, how     'LANG.USE.L05.03':{name:"Punctuation for Effect", teach:[{"how": "An exclamation mark shows strong feeling: \"We won the match!\" Use it to show strong feeling, not on every sentence.", "q": "\"We found the treasure___\" Which mark shows the excitement?", "o": ["!", ".", ","]}, {"how": "An ellipsis (...) shows a pause, as if someone stops to think: \"The key is... in the attic!\"", "q": "In \"The key is... in the attic,\" what does the ... show?", "o": ["a pause", "a question", "a list"]}, {"how": "A question mark makes the reader wonder: \"What was in the box?\" Use it to build suspense.", "q": "Which ending makes the reader wonder?", "o": ["What was in the box?", "It was in the box.", "The box!"]}], practice:[{"t": "sort", "q": "Sort each sentence by the effect of its mark.", "bins": [{"id": "0", "label": "Strong feeling"}, {"id": "1", "label": "A pause"}, {"id": "2", "label": "Wonder"}], "items": [{"label": "We won!", "bin": "0"}, {"label": "I think... yes.", "bin": "1"}, {"label": "Who left it here?", "bin": "2"}, {"label": "Look out!", "bin": "0"}, {"label": "Wait... listen.", "bin": "1"}, {"label": "Where did it go?", "bin": "2"}], "h": "! feeling, ... pause, ? wonder."}, {"t": "pairs", "q": "Match each mark to its effect.", "pairs": [["!", "strong feeling"], ["...", "a pause"], ["?", "wonder or a question"]], "h": "Read it aloud the way the mark tells you."}, {"t": "sort", "q": "Mistake Detective: good use, or too much?", "bins": [{"id": "0", "label": "Good use"}, {"id": "1", "label": "Too much"}], "items": [{"label": "We won the match!", "bin": "0"}, {"label": "We ate lunch!!!", "bin": "1"}, {"label": "The door creaked... then silence.", "bin": "0"}, {"label": "I... ate... my... lunch.", "bin": "1"}], "h": "Save the marks for the moments that need them."}, {"t": "order", "q": "Build it: a pause, then a surprise.", "tiles": ["The map led to...", "an empty box!"], "h": "The ... comes before the surprise."}, {"t": "spotall", "q": "Tap every sentence that sh     'LANG.GRAM.L06.05':{name:"Either Or, Neither Nor", teach:[{"how": "Some joining words come in pairs: either ... or, neither ... nor, both ... and, not only ... but also.", "q": "Which pair goes together?", "o": ["neither ... nor", "neither ... or", "either ... nor"]}, {"how": "Either ... or gives a choice: \"Either Yehuda or Avrumi will draw the map.\" Neither ... nor says not one and not the other: none of them.", "q": "\"___ Yehuda nor Avrumi found the key.\" Which fits?", "o": ["Neither", "Either", "Both"]}, {"how": "Both ... and joins two things that are both true: \"Both Dovid and Binyamin like chess.\"", "q": "\"Both Dovid ___ Binyamin like chess.\" Which fits?", "o": ["and", "or", "nor"]}], practice:[{"t": "pairs", "q": "Match each word to its partner.", "pairs": [["either", "or"], ["neither", "nor"], ["both", "and"], ["not only", "but also"]], "h": "These words always come in pairs."}, {"t": "sort", "q": "Mistake Detective: right pair, or a mistake?", "bins": [{"id": "0", "label": "Right pair"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "either rugelach or cookies", "bin": "0"}, {"label": "either rugelach nor cookies", "bin": "1"}, {"label": "neither Dovid nor Avi", "bin": "0"}, {"label": "neither Dovid or Avi", "bin": "1"}], "h": "Either goes with or. Neither goes with nor."}, {"t": "order", "q": "Build it: not one and not the other.", "tiles": ["Neither the map", "nor", "the key", "was in the attic."], "h": "Neither ... nor."}, {"t": "sort", "q": "Sort each pair by what it means.", "bins": [{"id": "0", "label": "A choice"}, {"id": "1", "label": "Not one, not the other"}, {"id": "2", "label": "Both true"}], "items": [{"label": "either ... or", "bin": "0"}, {"label": "neither ... nor", "bin": "1"}, {"label": "both ... and", "bin": "2"}], "h": "Choice, none, or both?"}, {"t": "spotall", "q": "\"Either Yehuda or Avrumi will draw the map.\" Tap the joining pair.", "cells": [{"label": "either", "ok": true}, {"label": "or", "ok": true}, {"label":     'LANG.GRAM.L06.06':{name:"Wow! Oops!", teach:[{"how": "An interjection is a word that shows feeling: wow, oops, ouch, hooray, oh, hmm.", "q": "Which word is an interjection?", "o": ["hooray", "table", "quickly"]}, {"how": "A strong interjection stands alone with an exclamation mark: \"Wow! Look at that!\"", "q": "Which is a strong interjection?", "o": ["Wow!", "well,", "table"]}, {"how": "A mild interjection is written with a comma: \"Oh, I forgot my hat.\" \"Hmm, let me think.\"", "q": "How do you write a mild interjection?", "o": ["with a comma", "with a question mark", "with a period"]}], practice:[{"t": "sort", "q": "Sort each interjection.", "bins": [{"id": "0", "label": "Strong (!)"}, {"id": "1", "label": "Mild (,)"}], "items": [{"label": "Wow", "bin": "0"}, {"label": "Hmm", "bin": "1"}, {"label": "Hooray", "bin": "0"}, {"label": "Well", "bin": "1"}, {"label": "Ouch", "bin": "0"}], "h": "Big feeling: !. Small feeling: comma."}, {"t": "pairs", "q": "Match each interjection to its feeling.", "pairs": [["Ouch!", "pain"], ["Hooray!", "joy"], ["Oops!", "a small mistake"], ["Hmm,", "thinking"]], "h": "What would make you say it?"}, {"t": "sort", "q": "Mistake Detective: punctuated right, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "Oops, I dropped it.", "bin": "0"}, {"label": "Oops I dropped it.", "bin": "1"}, {"label": "Wow! What a view!", "bin": "0"}, {"label": "Wow what a view.", "bin": "1"}], "h": "An interjection needs a comma or an exclamation mark."}, {"t": "order", "q": "Build it: start with a strong interjection.", "tiles": ["Hooray!", "We", "won the match!"], "h": "The interjection first, with !."}, {"t": "spotall", "q": "\"Oops, I dropped the tray. Hmm, where is the broom?\" Tap every interjection.", "cells": [{"label": "Oops", "ok": true}, {"label": "Hmm", "ok": true}, {"label": "dropped", "ok": false}, {"label": "tray", "ok": false}], "h": "Interjections show feeling."}, {"t": "order", "q": "Build it with a mild interjection.", "tiles": ["Oh,", "I forgot", "my siddur."], "h": "A mild one takes a comma."}], check:[{"q": "In \"Oops, I spilled the grape juice,\" which word is the interjection?", "o": ["Oops", "spilled", "juice"]}, {"q": "\"___! We finished the whole puzzle!\" Which interjection fits?", "o": ["Hooray", "Ouch", "Hmm"]}, {"q": "\"Hmm I think the answer is seven.\" What is missing?", "o": ["a comma", "a question mark", "nothing"]}], re:[{"q": "Which shows pain?", "o": ["Ouch!", "Hooray!", "Hmm,"], "h": "Ouch shows pain."}, {"q": "A mild interjection takes...", "o": ["a comma", "a question mark", "nothing"], "h": "Mild: comma."}, {"q": "Which is an interjection?", "o": ["wow", "window", "walk"], "h": "It shows feeling."}]},
    'LANG.USE.L07.02':{name:"Standard English Fix", teach:[{"how": "Formal writing (a letter to the menahel, a Beacon article) uses standard English, not slang. Slang like \"gonna\", \"wanna\" and \"kinda\" is for talking with friends.", "q": "Which word belongs in a letter to the menahel?", "o": ["going to", "gonna", "kinda"]}, {"how": "Watch for common errors: \"should of\" is really should have; \"could of\" is could have.", "q": "\"We should of asked first.\" What is the standard form?", "o": ["should have", "should of", "shoulda"]}, {"how": "Pronouns too: \"Me and him wrote it\" becomes \"He and I wrote it.\" Test by taking out the other person: \"I wrote it.\"", "q": "Which is standard?", "o": ["Akiva and I edited it.", "Me and Akiva edited it.", "Akiva and me edited it."]}], practice:[{"t": "pairs", "q": "Match each slang form to its standard form.", "pairs": [["gonna", "going to"], ["wanna", "want to"], ["kinda", "kind of"], ["should of", "should have"]], "h": "Say it the way a careful writer would."}, {"t": "sort", "q": "Sort: standard English, or needs a fix?", "bins": [{"id": "0", "label": "Standard"}, {"id": "1", "label": "Fix it"}], "items": [{"label": "going to", "bin": "0"}, {"label": "gonna", "bin": "1"}, {"label": "should have", "bin": "0"}, {"label": "should of", "bin": "1"}, {"label": "very good", "bin": "0"}, {"label": "real good", "bin": "1"}], "h": "Would it look right in a printed article?"}, {"t": "sort", "q": "Mistake Detective: standard, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "Benny and I took the photos.", "bin": "0"}, {"label": "Me and Benny took the photos.", "bin": "1"}, {"label": "The editor thanked Gavriel and me.", "bin": "0"}, {"label": "The editor thanked Gavriel and I.", "bin": "1"}], "h": "Take out the other person and test it."}, {"t": "order", "q": "Fix: \"We should of checked the facts.\"", "tiles": ["We", "should have", "checked", "the facts."], "h": "Should of is really should have."}, {"t": "spotall", "q": "\"We're gonna print a real good article tomorrow.\" Tap every word to fix for a formal article.", "cells": [{"label": "gonna", "ok": true}, {"label": "real", "ok": true}, {"label": "article", "ok": false}, {"label": "tomorrow", "ok": false}], "h": "Slang and nonstandard words."}, {"t": "order", "q": "Fix: \"Me and Yoni interviewed the custodian.\"", "tiles": ["Yoni and I", "interviewed", "the custodian."], "h": "Take out Yoni: I interviewed."}], check:[{"q": "\"We kinda liked the new schedule.\" In a letter to the menahel, which word needs fixing?", "o": ["kinda", "liked", "schedule"]}, {"q": "\"They could of won the debate.\" What is the standard form?", "o": ["could have", "could of", "coulda"]}, {"q": "\"Mr. Gross gave the prize to Chaim and ___.\" Which is standard?", "o": ["me", "I", "myself"]}], re:[{"q": "Which is standard?", "o": ["want to", "wanna", "wan"], "h": "Wanna is slang."}, {"q": "\"I should of known.\" Fix:", "o": ["should have", "should of", "shoulda"], "h": "Should have."}, {"q": "Which is standard?", "o": ["Eli and I went.", "Me and Eli went.", "Eli and me went."], "h": "I went."}]},
    'LANG.SENT.L08.02':{name:"Sharpen the Sentence", teach:[{"how": "Weak verbs (is, was, got, went, made) hide the action. Swap them for strong verbs that show it: \"Eli went quickly across the field\" becomes \"Eli sprinted across the field.\"", "q": "Which strong verb replaces \"went quickly\"?", "o": ["sprinted", "was", "got"]}, {"how": "Cut empty words that add nothing: really, very, just, thing, stuff, kind of. \"The story was really very good\" becomes \"The story was gripping.\"", "q": "Which words are empty in \"The story was really very good\"?", "o": ["really very", "story", "good"]}, {"how": "Turn \"There is/There was\" openings into a real subject and verb: \"There was a crowd that cheered\" becomes \"The crowd cheered.\"", "q": "Sharpen: \"There were boys who waited outside.\"", "o": ["Boys waited outside.", "There were boys outside who waited.", "Boys were the ones who waited."]}], practice:[{"t": "pairs", "q": "Match each weak phrase to one strong verb.", "pairs": [["went quickly", "sprinted"], ["said loudly", "shouted"], ["made a decision", "decided"], ["went slowly and quietly", "crept"]], "h": "One strong verb shows the action."}, {"t": "sort", "q": "Cut the empty words, keep the strong ones.", "bins": [{"id": "0", "label": "Cut it"}, {"id": "1", "label": "Keep it"}], "items": [{"label": "really", "bin": "0"}, {"label": "very", "bin": "0"}, {"label": "crowd", "bin": "1"}, {"label": "roared", "bin": "1"}, {"label": "kind of", "bin": "0"}, {"label": "archive", "bin": "1"}], "h": "Empty words add length, not meaning."}, {"t": "sort", "q": "Mistake Detective: which version is sharper?", "bins": [{"id": "0", "label": "Sharper"}, {"id": "1", "label": "Weaker"}], "items": [{"label": "The crowd roared.", "bin": "0"}, {"label": "The crowd made a really loud noise.", "bin": "1"}, {"label": "Gavriel decided to stay.", "bin": "0"}, {"label": "Gavriel made a decision to stay.", "bin": "1"}], "h": "Strong verb, no empty words."}, {"t": "order", "q": "Sharpen: \"The editors had a debate about the headline.\"", "tiles": ["The editors", "debated", "the headline."], "h": "Turn \"had a debate\" into one verb."}, {"t": "spotall", "q": "\"There was a really big crowd that cheered.\" Tap the parts to cut.", "cells": [{"label": "There was", "ok": true}, {"label": "really", "ok": true}, {"label": "crowd", "ok": false}, {"label": "cheered", "ok": false}], "h": "Empty openings and empty words."}, {"t": "order", "q": "Sharpen: \"Benny went really fast to the printer.\"", "tiles": ["Benny", "sprinted", "to the printer."], "h": "One strong verb for \"went really fast\"."}], check:[{"q": "Replace the weak verb: \"Yoni went slowly through the dark archive.\"", "o": ["crept", "raced", "walked"]}, {"q": "Which word is empty in \"Gavriel wrote a really long article\"?", "o": ["really", "wrote", "article"]}, {"q": "\"There were three boys who swept the shul.\" Which move sharpens it?", "o": ["cut \"There were\"", "add \"really\"", "cut \"shul\""]}], re:[{"q": "Which is the strongest verb?", "o": ["roared", "made noise", "was loud"], "h": "One verb shows it."}, {"q": "Which word is empty?", "o": ["very", "printer", "debated"], "h": "Very adds little."}, {"q": "Sharpen \"made a decision\".", "o": ["decided", "was deciding a decision", "made deciding"], "h": "One verb."}]},
    'LANG.MECH.L09.02':{name:"Leave It Out…", teach:[{"how": "When you quote only part of a sentence, an ellipsis (...) shows where words were left out.", "q": "A writer quotes only part of a sentence. What mark shows words were left out?", "o": ["an ellipsis (...)", "a dash", "a colon"]}, {"how": "Original: \"The fire, which started in a bakery, spread fast.\" Shortened: \"The fire ... spread fast.\" The dots stand where the words were.", "q": "In \"The fire ... spread fast,\" what do the dots stand for?", "o": ["the words that were left out", "a pause to think", "a question"]}, {"how": "Never leave out words that change the meaning: a quote must stay true to the writer. \"Not easy\" cut to \"easy\" changes the meaning.", "q": "Why must an ellipsis never change the meaning?", "o": ["a quote must stay true to the writer", "it saves space", "it looks nicer"]}], practice:[{"t": "sort", "q": "Original: \"The new library, which opened in Elul, is not small, and it is never empty.\" Sort each quote.", "bins": [{"id": "0", "label": "Fair"}, {"id": "1", "label": "Changes the meaning"}], "items": [{"label": "\"The new library ... is not small.\"", "bin": "0"}, {"label": "\"The new library ... is ... small.\"", "bin": "1"}, {"label": "\"The new library ... is never empty.\"", "bin": "0"}, {"label": "\"The new library ... is ... empty.\"", "bin": "1"}], "h": "Do the dots keep what the writer meant?"}, {"t": "pairs", "q": "Match each mark to its job.", "pairs": [["...", "words left out of a quote"], ["—", "a sharp break"], [":", "here comes a list"]], "h": "Which job does each mark do?"}, {"t": "sort", "q": "Original: \"The archive, in the basement, held old letters. Rabbi Rosen, our menahel, read every issue.\" Are the dots in the right place?", "bins": [{"id": "0", "label": "Right place"}, {"id": "1", "label": "Wrong place"}], "items": [{"label": "\"The archive ... held old letters.\"", "bin": "0"}, {"label": "\"The ... archive held old letters.\"", "bin": "1"}, {"label": "\"Rabbi Rosen ... read every issue.\"", "bin": "0"}, {"label": "\"Rabbi ... Rosen read every issue.\"", "bin": "1"}], "h": "Dots replace whole words, not break a name."}, {"t": "order", "q": "Original: \"The fundraiser, which the Beacon ran, raised $500.\" Build the short quote.", "tiles": ["\"The fundraiser", "...", "raised $500.\""], "h": "Keep the start, dots, then the end."}, {"t": "spotall", "q": "Original: \"The fire, which started in a bakery, spread fast.\" Tap the part that can be left out.", "cells": [{"label": "which started in a bakery", "ok": true}, {"label": "The fire", "ok": false}, {"label": "spread fast", "ok": false}], "h": "The extra detail can go; the main idea stays."}, {"t": "order", "q": "Original: \"Our team, after weeks of practice, won the debate.\" Build the short quote.", "tiles": ["\"Our team", "...", "won the debate.\""], "h": "Keep the main idea."}], check:[{"q": "Original: \"The mural, painted by the eighth grade, was not finished.\" Quote: \"The mural ... was not finished.\" Is it fair?", "o": ["fair", "changes the meaning", "the dots are in the wrong place"]}, {"q": "Original: \"The bus, which was late, arrived at noon.\" Which short quote is fair?", "o": ["\"The bus ... arrived at noon.\"", "\"The ... bus arrived at noon.\"", "\"The bus arrived ... late at noon.\""]}, {"q": "A boy shortens \"The trip was not cancelled\" to \"The trip was ... cancelled.\" What is wrong?", "o": ["changes the meaning", "the dots are too short", "nothing is wrong"]}], re:[{"q": "What does ... in a quote stand for?", "o": ["words left out", "a list", "a sharp break"], "h": "Left-out words."}, {"q": "Which is fair for \"The game, played in the rain, ended late\"?", "o": ["\"The game ... ended late.\"", "\"The game ... rain.\"", "\"The ... ended.\""], "h": "Keep the meaning."}, {"q": "An ellipsis must never...", "o": ["change the meaning", "shorten a quote", "use three dots"], "h": "Stay true to the writer."}]}

  BITE['LANG.GRAM.L03.05'] = {"band": "B23", "pic": "🐢", "today": "Tell what kind, or tell how", "why": "Adjectives describe things. Adverbs describe how things are done.", "ready": [{"q": "Which word describes a thing?", "o": ["tall", "run", "shul"], "a": "tall"}], "bridge": "LANG.GRAM.L02.02", "bridgeName": "Describing Words", "watch": {"q": "a quick boy / he ran quickly", "m": {"type": "tiles", "w": ["a quick", "boy"], "hi": [0]}, "steps": [{"t": "Quick tells about the boy. It is an adjective.", "m": {"type": "tiles", "w": ["a quick", "boy"], "hi": [0]}}, {"t": "Quickly tells how he ran. It is an adverb.", "m": {"type": "tiles", "w": ["he ran", "quickly"], "hi": [1]}}, {"t": "Many adverbs add -ly: soft → softly.", "m": {"type": "tiles", "w": ["soft", "ly"], "hi": [1]}}, {"t": "Ask: a thing, or how? The baby slept quietly."}, {"t": "Chant it and tiptoe softly!", "m": {"type": "chant", "lines": ["Adjective: what kind of thing?", "Adverb: how did he do it?", "Add an -ly and off you go!"]}}], "a": "quick = adjective, quickly = adverb"}, "oops": {"q": "The baby slept ___.", "wrong": "quiet", "right": "quietly", "why": "How did the baby sleep? How needs an adverb: quietly."}, "ways": ["worked example", "chant", "word-part builder", "fill the gap", "sort", "Mistake Detective"], "done": "You can tell what kind, or tell how!", "board": {"one": "Adjective tells about a noun; adverb tells how (often -ly).", "activity": "Boys act out \"walk slowly\", \"walk quickly\"; the class names the adverb.", "mistakes": ["He did it careful", "Adding -ly to a word that describes a noun", "Thinking every -ly word is an adverb (friendly)"]}, "do": [{"type": "match", "pairs": [["quick", "quickly"], ["soft", "softly"], ["careful", "carefully"]], "say": "Match each adjective to its adverb.", "how": "Add -ly to tell how."}, {"type": "sort", "mis": true, "bins": ["Right", "Mistake"], "cards": [["Chaim did it carefully.", 0], ["Chaim did it careful.", 1], ["The baby slept quietly.", 0], ["The baby slept quiet.", 1]], "say": "Mistake Detective! Right, or a mistake?", "how": "How something is done needs an adverb."}], "your": [{"type": "parts", "parts": ["soft", "ly"], "extra": ["er"], "mean": "in a soft way", "roles": ["root", "suffix"], "say": "Build the adverb that means in a soft way.", "how": "Adjective + ly."}, {"type": "sort", "bins": ["Adjective", "Adverb"], "cards": [["a quiet room", 0], ["he spoke quietly", 1], ["a slow turtle", 0], ["it walked slowly", 1]], "say": "Tells about a thing, or tells how?", "how": "Adverbs tell how."}, {"type": "cloze", "t": "Naftali carried the eggs ___.", "o": ["carefully", "careful", "cares"], "a": "carefully", "say": "Fill the gap. How did he carry them?", "how": "How needs an adverb."}, {"type": "tiles", "w": ["Naftali", "sang", "softly."], "extra": ["soft."], "say": "Build it with an adverb.", "how": "Who, the action, then how."}, {"type": "match", "pairs": [["loud", "a ___ bell"], ["loudly", "it rang ___"], ["gentle", "a ___ wind"], ["gently", "it blew ___"]], "say": "Match each word to the gap it fits.", "how": "A thing, or how?"}]};
  BITE['LANG.GRAM.L03.06'] = {"band": "B23", "pic": "🎨", "today": "Pick the strongest describing word", "why": "Strong words let your reader see, smell and feel your story.", "ready": [{"q": "Which word describes a thing?", "o": ["cold", "run", "shul"], "a": "cold"}], "bridge": "LANG.GRAM.L03.05", "bridgeName": "How Did He Do It?", "watch": {"q": "The soup was nice.", "m": {"type": "tiles", "w": ["The soup", "was", "nice."], "hi": [2]}, "steps": [{"t": "Nice is a weak word. It does not paint a picture.", "m": {"type": "tiles", "w": ["The soup", "was", "nice."], "hi": [2]}}, {"t": "Ask: what was it really like? Hot and yummy."}, {"t": "Pick a strong word that fits: steaming.", "m": {"type": "tiles", "w": ["The soup", "was", "steaming."], "hi": [2]}}, {"t": "Check: does it make sense? Steaming soup, yes. Steaming blanket, no."}, {"t": "Chant it and paint the air!", "m": {"type": "chant", "lines": ["Nice is weak, and good is too,", "Find a word that paints it true!"]}}], "a": "The soup was steaming."}, "oops": {"q": "a ___ blanket", "wrong": "delicious", "right": "cozy", "why": "Delicious is for food. A strong word must still make sense."}, "ways": ["worked example", "chant", "fill the gap", "sort", "match", "Mistake Detective"], "done": "You can pick the strongest describing word!", "board": {"one": "Swap weak words (nice, good, bad) for strong words that fit.", "activity": "A weak-word jar: boys pull out nice or good and race to name three strong words that fit a picture.", "mistakes": ["Strong word that does not fit", "Stacking very very", "Using nice for everything"]}, "do": [{"type": "match", "pairs": [["a nice smell", "a sweet smell"], ["a big tree", "a towering tree"], ["a good story", "an exciting story"]], "say": "Match each weak phrase to a stronger one.", "how": "Which one lets you see it?"}, {"type": "sort", "mis": true, "bins": ["Fits", "Mistake"], "cards": [["a delicious kugel", 0], ["a delicious chair", 1], ["a cozy blanket", 0], ["a cozy thunderstorm",   BITE['LANG.GRAM.L04.06'] = {"band": "B23", "pic": "🚶", "today": "Tell past, present and future", "why": "Verbs tell your reader WHEN something happens.", "ready": [{"q": "Which word is an action?", "o": ["walk", "shul", "tall"], "a": "walk"}], "bridge": "LANG.GRAM.L02.03", "bridgeName": "Then and Now", "watch": {"q": "walk", "m": {"type": "tiles", "w": ["walked", "walk", "will walk"], "hi": [0]}, "steps": [{"t": "Past: it already happened. Yesterday I walked.", "m": {"type": "tiles", "w": ["walked", "walk", "will walk"], "hi": [0]}}, {"t": "Present: now or every day. Every day I walk.", "m": {"type": "tiles", "w": ["walked", "walk", "will walk"], "hi": [1]}}, {"t": "Future: not yet. Tomorrow I will walk.", "m": {"type": "tiles", "w": ["walked", "walk", "will walk"], "hi": [2]}}, {"t": "Find the time word first. It tells which tense to use."}, {"t": "Point to the time with me!", "m": {"type": "move", "t": "Point behind you: past! Point down: now! Point ahead: future!"}}], "a": "walked = past, walk = present, will walk = future"}, "oops": {"q": "Tomorrow we ___ ball.", "wrong": "played", "right": "will play", "why": "Tomorrow has not happened yet. The future needs will."}, "ways": ["worked example", "movement", "sort", "match", "build with tiles", "Mistake Detective"], "done": "You can tell past, present and future!", "board": {"one": "Past = already (-ed). Present = now or every day. Future = will.", "activity": "A time line on the floor: boys jump to past, now or future when the teacher says a verb.", "mistakes": ["Past verb with tomorrow", "Forgetting will", "Mixing tenses in one sentence"]}, "do": [{"type": "match", "pairs": [["yesterday", "past"], ["every day", "present"], ["tomorrow", "future"]], "say": "Match each time word to its tense.", "how": "When does it happen?"}, {"type": "sort", "mis": true, "bins": ["Right", "Mistake"], "cards": [["Yesterday we played.", 0], ["Yesterday we will play.", 1], ["Tomorrow we will play.", 0], ["Tomorrow we played.", 1]],   BITE['LANG.GRAM.L05.04'] = {"band": "E45", "pic": "🚚", "today": "Put describing words in the right order", "why": "\"A red big truck\" sounds wrong to every reader. The right order sounds smooth.", "ready": [{"q": "Which word is an adjective?", "o": ["big", "truck", "drive", "quickly"], "a": "big"}], "bridge": "LANG.GRAM.L04.03", "bridgeName": "Bigger, Biggest", "watch": {"q": "a big old red truck", "m": {"type": "tiles", "w": ["a", "big", "old", "red", "truck"], "hi": [1, 2, 3]}, "steps": [{"t": "Three adjectives describe the truck: big, old, red."}, {"t": "The order: opinion, size, age, color, material.", "m": {"type": "tiles", "w": ["opinion", "size", "age", "color", "material"], "hi": [1, 2, 3]}}, {"t": "Big is size, old is age, red is color.", "m": {"type": "tiles", "w": ["a", "big", "old", "red", "truck"], "hi": [1, 2, 3]}}, {"t": "Add an opinion? It goes first: a lovely big old red truck."}], "a": "a big old red truck"}, "oops": {"q": "a ___ map", "wrong": "old big", "right": "big old", "why": "Size comes before age: a big old map."}, "ways": ["worked example", "order chart", "build with tiles", "sort", "tap the reason", "Mistake Detective"], "done": "You can put describing words in the right order!", "board": {"one": "Opinion, size, age, color, material, noun.", "activity": "Boys hold adjective cards and line up in the right order in front of a noun card.", "mistakes": ["Color before size", "Opinion in the middle", "Material before color"]}, "do": [{"type": "tiles", "w": ["a", "big", "old", "red", "truck"], "extra": ["quickly"], "say": "Build it: size, age, color.", "how": "Big, old, red, then truck.", "why": {"q": "Why does \"big\" come before \"old\"?", "o": ["Size comes before age", "It is shorter", "It is a color", "It is the noun"], "a": "Size comes before age"}}, {"type": "sort", "mis": true, "bins": ["Right order", "Mistake"], "cards": [["a big old map", 0], ["an old big map", 1], ["a small red book", 0], ["a red small book", 1]], "say": "Mistake De   BITE['LANG.USE.L05.02'] = {"band": "E45", "pic": "🎯", "today": "Choose the exact word for the moment", "why": "Precise words let your reader hear and see exactly what happened.", "ready": [{"q": "Which word is a verb?", "o": ["ran", "red", "road", "really"], "a": "ran"}], "bridge": "LANG.GRAM.L03.06", "bridgeName": "Best Describer", "watch": {"q": "\"Don't wake the baby,\" Avrumi said.", "m": {"type": "tiles", "w": ["\"Don't wake the baby,\"", "Avrumi", "said."], "hi": [2]}, "steps": [{"t": "\"Said\" is plain. It does not show how he said it.", "m": {"type": "tiles", "w": ["\"Don't wake the baby,\"", "Avrumi", "said."], "hi": [2]}}, {"t": "Ask: how would he say it? Softly. The exact word is whispered.", "m": {"type": "tiles", "w": ["\"Don't wake the baby,\"", "Avrumi", "whispered."], "hi": [2]}}, {"t": "Verbs too: went → tiptoed, raced, wandered. Pick the one that fits."}, {"t": "Nouns too: a tree → an oak. Name exactly which one."}], "a": "\"Don't wake the baby,\" Avrumi whispered."}, "oops": {"q": "\"Shh,\" he ___.", "wrong": "shouted", "right": "whispered", "why": "Precise also means right for the moment. You do not shout \"shh\"."}, "ways": ["worked example", "match", "sort", "fill the gap", "tap the reason", "Mistake Detective"], "done": "You can choose the exact word for the moment!", "board": {"one": "Swap plain words (said, went, thing) for precise ones that fit the moment.", "activity": "Act it out: a boy acts a way of moving; the class names the precise verb.", "mistakes": ["A fancy word that does not fit", "Said every time", "Thing and stuff"]}, "do": [{"type": "match", "pairs": [["said loudly", "shouted"], ["said softly", "whispered"], ["went quietly", "tiptoed"]], "say": "Match each plain phrase to one precise word.", "how": "One exact word for two plain ones.", "why": {"q": "Why is \"tiptoed\" better than \"went quietly\"?", "o": ["One word shows exactly how", "It is louder", "It is a noun", "It is shorter to say"], "a": "One word shows exactly how"}   BITE['LANG.GRAM.L06.05'] = {"band":"E45","pic":"⚖️","today":"Join ideas with word pairs: either or, neither nor","why":"Paired joining words show a choice, or say \"not this and not that\".","bridge":"LANG.GRAM.L06.01","bridgeName":"Conjunction Kit","done":"*Either/or*, *neither/nor*, *both/and*: partners stay together!","board":{"one":"either-or (choice), neither-nor (none), both-and (both), not only-but also.","activity":"Two boys stand up; the class makes either/or, neither/nor and both/and sentences about them.","mistakes":["neither ... or","either ... nor","dropping the second partner"]},"hook":{"kind":"wouldyou","pic":"🍪","t":"Bubby says: \"Take *either* a rugelach *or* a cookie.\"","q":"Which would you pick?","o":["the rugelach","the cookie","both of them"],"pay":"Pick *one*! *Either ... or* means one or the other, not both."},"learn":[{"t":"Some joining words come in *pairs*.","act":{"type":"match","pairs":[["either","or"],["neither","nor"],["both","and"]],"say":"Match each word to its *partner*.","how":"*Either* with or. *Neither* with nor. *Both* with and."}},{"t":"Each pair has its own *meaning*.","act":{"type":"sort","bins":["One of them","Not one, not the other","Both"],"cards":[["Either Avi or Dov will come.",0],["Neither Avi nor Dov came.",1],["Both Avi and Dov came.",2],["Neither Ari nor Shai was late.",1],["Both Ari and Shai ate supper.",2],["Ari or Shai will win.",0]],"say":"What does each pair *mean*?","how":"Either: *one*. Neither: *none*. Both: *two*."}},{"who":{"q":"\"Neither Dovid ___ Avi came.\"","o":[["Moshe","or"],["Eliyahu","nor"]],"a":1,"why":"*Neither* always takes *nor*."}}],"play":[{"type":"sort","mis":true,"bins":["Right pair","Mistake"],"cards":[["either rugelach or cookies",0],["either rugelach nor cookies",1],["neither Dovid nor Avi",0],["neither Dovid or Avi",1]],"say":"Mistake Detective! Right pair, or a mistake?","how":"*Either* with or, *neither* with nor."},{"type":"tiles","w":["Neither the map","nor","the key","was in the attic."],"extra":["or"],"say":"Build it: not one, not the other.","how":"*Neither* ... *nor*.","why":{"q":"Why \"nor\" and not \"or\"?","o":["It goes with neither","It goes with either","It means both"],"a":"It goes with neither"}},{"type":"cloze","t":"You may have either a rugelach ___ a cookie.","o":["or","nor","and"],"a":"or","say":"Fill the gap with the partner word.","how":"*Either* goes with *or*.","why":{"q":"Why \"or\"?","o":["It is the partner of either","It means none","It means both"],"a":"It is the partner of either"}},{"type":"tiles","w":["Both Zeidy","and","Binyamin","love chess."],"extra":["or","nor"],"say":"Challenge! Build it: both are true.","how":"*Both* ... *and*."}]};

  BITE['LANG.USE.L07.02'] = {"band": "M68", "pic": "📝", "today": "Fix slang and errors for formal writing", "why": "A letter or article with \"gonna\" or \"should of\" loses the reader's respect, even if the idea is great.", "ready": [{"q": "Which is formal?", "o": ["Dear Rabbi Rosen,", "Hey Rabbi!", "Yo,", "Sup,"], "a": "Dear Rabbi Rosen,"}], "bridge": "LANG.USE.L07.01", "bridgeName": "Formal Voice", "watch": {"q": "Me and Eli are gonna write a real good article.", "m": {"type": "tiles", "w": ["Me and Eli", "are gonna", "write", "a real good article."], "hi": [0, 1, 3]}, "steps": [{"t": "First: \"Me and Eli\". Take out Eli: I write.", "m": {"type": "tiles", "w": ["Eli and I", "are gonna", "write", "a real good article."], "hi": [0]}}, {"t": "Second: \"gonna\" is slang. Write going to.", "m": {"type": "tiles", "w": ["Eli and I", "are going to", "write", "a real good article."], "hi": [1]}}, {"t": "Third: \"real good\" should be very good, or one strong word: excellent.", "m": {"type": "tiles", "w": ["Eli and I", "are going to", "write", "an excellent article."], "hi": [3]}}, {"t": "Slang is fine with friends. Formal writing uses standard English."}, {"t": "Teach your chavrusa three slang fixes and the take-out test."}], "a": "Eli and I are going to write an excellent article."}, "oops": {"q": "We should of asked Mr. Gross.", "wrong": "Fine: it sounds right when you say it", "right": "We should have asked Mr. Gross.", "why": "\"Should've\" sounds like \"should of\", but the words are should have."}, "ways": ["worked example", "take-out test", "match", "sort", "build with tiles", "teach it back", "Mistake Detective"], "done": "You can fix slang and common errors for formal writing!", "board": {"one": "Formal writing: no slang (gonna, kinda), should have not should of, I/me by the take-out test.", "activity": "Pairs rewrite a slangy text message as a formal letter to the menahel.", "mistakes": ["should of", "Me and him as the subject", "real good"]}, "do": [{"type": "m   BITE['LANG.SENT.L08.02'] = {"band":"M68","pic":"✏️","today":"Sharpen sentences with strong verbs and no empty words","why":"Editors cut weak verbs and empty words so every sentence lands.","bridge":"LANG.USE.L08.01","bridgeName":"Cut the Clutter","done":"Sharpen: cut *empty words*, use *strong verbs*, start with the *subject*.","board":{"one":"Strong verb, cut empty words (really, very, just), cut \"There was\".","activity":"Editors' race: teams sharpen 5 weak Beacon sentences; fewest words with the same meaning wins.","mistakes":["Adding very instead of a strong verb","Keeping There was","Cutting meaning along with words"]},"hook":{"kind":"compare","pic":"🔪","t":"\"The crowd made a really loud noise.\" \"The crowd roared.\"","q":"Which one hits harder?","o":["the first one","the second one"],"pay":"*The crowd roared*! A *strong verb*, no *empty words*. Fewer words, more power."},"learn":[{"t":"Move 1: cut *empty words* like *really* and *very*.","act":{"type":"sort","bins":["Cut it","Keep it"],"cards":[["really",0],["crowd",1],["very",0],["roared",1],["basically",0],["sprinted",1]],"say":"*Cut* the empty words, *keep* the strong ones.","how":"Does it add *meaning*?"}},{"t":"Move 2: swap a weak phrase for one *strong verb*.","act":{"type":"match","pairs":[["went quickly","sprinted"],["said loudly","shouted"],["made a decision","decided"]],"say":"Match each *weak phrase* to one strong verb.","how":"One *strong verb* shows the action."}},{"t":"Move 3: cut *There was*. Start with the *subject*.","act":{"type":"tiles","w":["A teacher","helped","us."],"extra":["There was"],"say":"Sharpen: There was a teacher who helped us.","how":"Cut *There was*. Start with the *subject*."}},{"who":{"q":"Sharpen \"Eli went quickly across the field.\"","o":[["Ari","Eli very quickly went across the field."],["Tzadok","Eli sprinted across the field."]],"a":1,"why":"*Very* adds length. A *strong verb* adds power."}},{"t":"*Teach it back*: tell your chavrusa the three moves.","m":{"type":"
