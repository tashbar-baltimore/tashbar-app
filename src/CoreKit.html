<script>
/* CoreKit.html: Core Growth (job T, 2026-11-24). Loads on the boy's page right before the CoreData<Job><n>.html files
   (CoreSkills.js coreFiles_; Photos.js and Speed.js), after the One Bite data and before the One Bite player.
   A data file adds its lessons with ONE call (docs/core-growth/HOW-TO-ADD-A-SKILL.md):
     TLCORE.add('F', LESSONS, { teach: TEACHER_TIME, howto: HOW_TO_BOXES, bite: ONE_BITE_LESSONS });
   LESSONS: id -> the lesson in the engine's shape, written as  ID : { name: ..., teach: [3], practice: [6], check: [3 tap kinds], re: [3] }
     (the server finds a lesson by that exact "id, colon, brace, name" shape; keep  name  first).
   teach / howto / bite are optional: id -> TL_TEACH entry, TL_DO entry, ONE_BITE entry (docs/ONE-BITE-PLAYBOOK.md).
   A lesson goes into READ (READ.*), WRIT (LANG.* and WRIT.*) and always BANK_ALL. An id that is already there is NOT replaced
   (an existing lesson is improved in its own file); the clash is listed in TLCORE.clash for the tests. */
(function () {
  var W = window, C = W.TLCORE = W.TLCORE || { jobs: {}, ids: {}, clash: [] };
  function bag(id) {
    var p = String(id).split('.')[0];
    try { if (p === 'READ' && typeof READ !== 'undefined') return READ; } catch (e) {}
    try { if ((p === 'LANG' || p === 'WRIT') && typeof WRIT !== 'undefined') return WRIT; } catch (e) {}
    return null;
  }
  function all() { try { return typeof BANK_ALL !== 'undefined' ? BANK_ALL : null; } catch (e) { return null; } }
  C.add = function (job, lessons, extra) {
    extra = extra || {}; job = String(job || '?');
    var BA = all(), TT = W.TL_TEACH = W.TL_TEACH || {}, DO = W.TL_DO = W.TL_DO || {}, OB = W.ONE_BITE = W.ONE_BITE || {}, mine = C.jobs[job] = C.jobs[job] || [];
    Object.keys(lessons || {}).forEach(function (id) {
      var L = lessons[id], b = bag(id);
      if ((BA && BA[id] && !C.ids[id]) || C.ids[id]) { C.clash.push(job + ' ' + id); return; }
      if (b) b[id] = L; if (BA) BA[id] = L;
      C.ids[id] = job; mine.push(id);
      if (extra.teach && extra.teach[id] && !TT[id]) TT[id] = extra.teach[id];
      if (extra.howto && extra.howto[id] && !DO[id]) DO[id] = extra.howto[id];
      if (extra.bite && extra.bite[id] && !OB[id]) OB[id] = extra.bite[id];
    });
    return mine.length;
  };
  /* UPGRADE an EXISTING skill (job S and any job that rebuilds an old lesson in the One Bite shape, without touching its file):
       TLCORE.upgrade('S', { bite: ONE_BITE_LESSONS, teach: TEACHER_TIME, howto: HOW_TO_BOXES });
     The skill must already have its lesson (BANK_ALL): its questions stay as they are and become the lesson's practice and "Show me".
     Nothing is replaced: a skill that already has a One Bite lesson (or Teacher Time, or a How-to box) keeps it, and the refusal is
     listed in TLCORE.clash, so the tests fail and name it. TLCORE.up[id] = job. */
  C.up = C.up || {};
  C.upgrade = function (job, extra) {
    extra = extra || {}; job = String(job || '?');
    var BA = all(), TT = W.TL_TEACH = W.TL_TEACH || {}, DO = W.TL_DO = W.TL_DO || {}, OB = W.ONE_BITE = W.ONE_BITE || {}, n = 0;
    var ids = {}; ['bite', 'teach', 'howto'].forEach(function (k) { Object.keys(extra[k] || {}).forEach(function (id) { ids[id] = 1; }); });
    Object.keys(ids).forEach(function (id) {
      if (!BA || !BA[id]) { C.clash.push(job + ' ' + id + ': upgrade of a skill that has no lesson (use TLCORE.add for a new skill)'); return; }
      if (C.up[id] && C.up[id] !== job) { C.clash.push(job + ' ' + id + ': already upgraded by job ' + C.up[id]); return; }
      var b = extra.bite && extra.bite[id], t = extra.teach && extra.teach[id], h = extra.howto && extra.howto[id];
      if (b && OB[id]) { C.clash.push(job + ' ' + id + ': already has a One Bite lesson (improve that one in its own file)'); return; }
      if (b) OB[id] = b; if (t && !TT[id]) TT[id] = t; if (h && !DO[id]) DO[id] = h;
      C.up[id] = job; n++;
    });
    return n;
  };
  /* CONTENT STORE (job T, T-2): a long text (story, chapter, article, poem, play) is NOT in the start-up download. It is written in
     texts/<JOB>/<ID>.txt (docs/core-growth/HOW-TO-ADD-A-TEXT.md), published as /texts/<ID>.json, and fetched here only when a boy opens it.
     TLCORE.text(id) gives a Promise of { id, title, grade, kind, topic, book, chapter, pic, source, words, pages: [[{ s: [sentences], who? }]], glossary: { word: meaning } }.
     Kept in memory for the visit; the browser revalidates the file (cache: no-cache), so a fixed text shows at once and an unchanged one costs a tiny check. */
  var TX = {}, TID = /^[A-Z][A-Z0-9]*(\.[A-Z0-9]+){1,3}$/;
  C.textBase = C.textBase || '/texts/';
  C.text = function (id) {
    id = String(id || '');
    if (!TID.test(id)) return Promise.reject(new Error('not a text id: ' + id));
    if (TX[id]) return TX[id];
    var p = fetch(C.textBase + id + '.json', { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error('text ' + id + ' is not on the site (' + r.status + ')');
      return r.json();
    }).then(function (t) { if (!t || t.id !== id || !t.pages) throw new Error('text ' + id + ' did not load right'); return t; });
    TX[id] = p; p.catch(function () { if (TX[id] === p) delete TX[id]; });   /* a failed load can be tried again */
    return p;
  };
  /* the whole text as plain sentences, numbered in reading order (the Reader and "tap the sentence that proves it" use these numbers) */
  C.textSentences = function (t) { var out = []; (t.pages || []).forEach(function (pg, i) { pg.forEach(function (par, j) { (par.s || []).forEach(function (x) { out.push({ page: i, par: j, s: x }); }); }); }); return out; };
})();
</script>
