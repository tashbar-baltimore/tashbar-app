  'WRIT.ESSAY.L09.05':{name:'Memoir Moment',
  teach:[
    {how:'A MEMOIR is a true piece about the writer’s own life. For The Beacon’s last issue, “A moment that changed me”, every editor writes one. The hardest choice comes first: WHICH moment? Choose A MEMOIR MOMENT: it is small (a few minutes), it is true, and it means something big to you. Gavriel’s list: “my whole summer at camp”, “the afternoon in Zeidy’s sukkah on Chol Hamoed when he taught me to hold his camera steady”, “what I ate for lunch today”.', q:'Which one is a memoir moment?', o:['The afternoon in Zeidy’s sukkah on Chol Hamoed when he taught me to hold his camera steady.','My whole summer at camp.','What I ate for lunch today.']},
    {how:'Two mistakes. TOO BIG: a whole day, a whole trip, a whole year. The writer rushes through everything, and the reader feels nothing. NO MEANING: small, but it changed nothing; it cannot answer “why does this matter to me?” Test every idea with two questions. 1) Can it happen in a few minutes? 2) Did it change how I think or act? Two yeses: a memoir moment.', q:'Eli’s idea: “my whole bar mitzvah year.” What is it?', o:['too big','a memoir moment','no meaning']},
    {how:'Then ZOOM IN. Spend most of your words on those few minutes: what you saw, heard, said and felt. Sum up everything around them in one line (“We had spent the morning hanging decorations in the sukkah.”). In Grade 5 you slowed down the big moment of a made-up story. A memoir goes further: the moment is TRUE, and you choose it BECAUSE it changed you.', q:'Gavriel has 300 words. Where should most of them go?', o:['the few minutes with Zeidy and the camera','the drive to Zeidy’s house','the whole week of Sukkos']}

  check:[

  re:[
    {how:'A new way: Gavriel says a good photo never shows the whole city. It zooms in on one face, and that face tells you about the city. A memoir moment is the one face, not the whole city.', q:'The one face in the photo is like…', o:['a memoir moment','a whole year','a list of events']},

    {how:'The skill underneath: Slow Motion (Grade 5). In a story, you slow down the big moment. A memoir goes further: the moment is true, you CHOOSE it from your whole life because it changed you, and only then do you zoom in.', q:'In Slow Motion, you slow down…', o:['the big moment','the boring part','every part the same']}
  ]},

  'WRIT.PARA.L09.06':{name:'Then and Now',
  teach:[
    {how:'A memoir has TWO VOICES. THE BOY THEN lives the scene: past tense, what he saw, heard and felt, and he does not know yet how it ends. THE WRITER NOW looks back: present tense, what he knows today. Gavriel: “My hands shook on the heavy camera.” That is the boy then. “I still breathe out before every photo I take for The Beacon.” That is the writer now.', q:'“Today I understand why Zeidy never rushed me.” Whose voice is this?', o:['the writer now','the boy then','Zeidy’s voice']},
    {how:'Each frame gets its own SIGNAL and TENSE. The boy then: a time signal (“That Chol Hamoed,” “I was nine,”) and past tense. The writer now: a now signal (“Today,” “Looking back,” “Now I know”) and present tense. In Grade 6 a flashback went back and returned to more story. A memoir goes further: the NOW is not more story. It is the writer himself, thinking. The mistake is NO SIGNAL: the frames blur, and the reader cannot tell who is talking.', q:'Which sentence cuts to the writer now?', o:['Looking back, I see that Zeidy was in no hurry at all.','That Sukkos, Zeidy handed me his camera.','My hands shook.']},
    {how:'The big mistake: THE BOY KNOWS TOO MUCH. The boy then cannot know what the writer knows now. “At nine, I knew this lesson would shape my life” is false to the moment. Let the boy be nervous, confused, even wrong, and save the understanding for the writer now: “I did not know yet that…”. WHEN TO CUT: stay in the scene most of the time. Cut to the writer now for a sentence or two at the turn, where the meaning shows, and at the end.', q:'Gavriel writes: “At nine, I already knew Zeidy was teaching me patience.” What went wrong?', o:['the boy knows too much','no signal','nothing, it is fine']}
  ],
  practice:[
    {t:'sort', q:'Gavriel’s memoir. Sort each sentence by its voice.', bins:[{id:'T',label:'🧒 The boy then (the scene)'},{id:'N',label:'✍️ The writer now (looking back)'}],
      items:[{label:'My hands shook on the heavy black camera.',bin:'T'},{label:'Zeidy laughed. “Breathe out, then press.”',bin:'T'},{label:'The first photo came out a gray blur.',bin:'T'},{label:'Today I still breathe out before every photo.',bin:'N'},{label:'Looking back, I see he was in no hurry at all.',bin:'N'},{label:'Now I know he was teaching more than cameras.',bin:'N'}],
      h:'Past tense, inside the scene? Or a now signal and present tense, looking back?'},
    {t:'pairs', q:'Match each signal to its job.', pairs:[['That Chol Hamoed, I was nine.','Opens the scene of the boy then'],['Looking back,','Cuts to the writer now'],['I did not know yet that…','Shows the boy knew less than the writer']],
      h:'Does it open the past, cut to today, or show the gap between them?'},
    {t:'spotall', q:'Eli’s memoir about his first time leining in shul. Tap every sentence in the voice of THE WRITER NOW.', cells:[{label:'Today I lein most weeks, and I still hear that crack.',ok:true},{label:'Looking back, I see why my father only nodded.',ok:true},{label:'Now I understand that the whole shul was with me.',ok:true},{label:'My voice cracked on the very first word.',ok:false},{label:'The yad shook in my sweaty fingers.',ok:false}],
      h:'Look for a now signal and present tense.'},
    {t:'sort', q:'Sneaky ones! Sort each passage.', bins:[{id:'G',label:'✅ Clear frames'},{id:'K',label:'⚠️ Mistake: the boy knows too much'},{id:'S',label:'⚠️ Mistake: no signal'}],
      items:[{label:'I was nine. I did not know yet why he waited.',bin:'G'},{label:'My voice cracked. Today I lein most weeks.',bin:'G'},{label:'At nine, I knew this was the lesson of my life.',bin:'K'},{label:'At the bimah, I knew the crack would help me.',bin:'K'},{label:'My hands shook. I breathe out first, every time.',bin:'S'},{label:'The shutter clicked, and I see why he waited.',bin:'S'}],
      h:'Could the boy know this yet? Does every cut to now have a signal, and does each frame keep its tense?'},
    {t:'order', q:'Build Gavriel’s passage: the scene, then the cut. Tap the sentences in order.', tiles:['That Chol Hamoed, I was nine.','Zeidy put his heavy camera in my hands and waited.','I did not know yet what he was really teaching me.','Looking back, I see he was in no hurry at all.'],
      h:'Open the scene with a time signal. Show the gap. Then cut to the writer now.'},
    {t:'spotall', q:'When should Gavriel cut to the writer now? Tap every good place.', cells:[{label:'At the turn: right after the sharp photo clicks.',ok:true},{label:'At the very end of the memoir.',ok:true},{label:'In the middle of Zeidy’s sentence.',ok:false},{label:'After every sentence of the scene.',ok:false},{label:'Never: all scene, and no looking back.',ok:false}],
      h:'Stay in the scene most of the time. Cut where the meaning shows, and at the end.'},
    {t:'write', q:'Your turn to write. Take your own memoir moment (or Gavriel’s). Write three sentences as the boy then, with a time signal and past tense. Then cut to the writer now with a signal, in one or two sentences.', min:0, checks:['🧒 My scene is in past tense, and the boy does not know too much.','✍️ My cut to now has a signal: “Today,” “Looking back,” or “Now I know”.','✂️ I cut at a turn, for only a sentence or two.'], h:'Live the scene first. Then ask: what do I know now that the boy did not?'}
  ],
  check:[
    {q:'Akiva’s memoir: “Today, every time I lock the newsroom, I feel that key’s weight again.” Whose voice is this?', o:['the writer now','the boy then','no signal'], h:'Is there a now signal and present tense?'},
    {q:'Benny writes: “That first Shabbos, standing at the back of a new shul, I knew that the boy waving at me would become my best friend.” What went wrong?', o:['the boy knows too much','no signal','the writer now'], h:'Could Benny know that yet, on that first Shabbos?'},
    {t:'order', q:'Build Benny’s cut to the writer now. Tap the tiles in order.', tiles:['Looking back,','I see that','the boy with the seat','was making room for me.'], h:'The now signal first. Then what the writer sees today.'}
  ],
  re:[
    {how:'A new way: a film with a voice-over. The picture shows the boy back then. Over it, a grown man’s voice speaks from today. The picture is the boy then; the voice-over is the writer now.', q:'The voice-over is like…', o:['the writer now','the boy then','no signal']},
    {how:'A simpler step: use two colors. Blue for every sentence of the boy then (past tense). Green for the writer now (present tense, with a now signal). Then check: does every green part start with a signal? Does any blue sentence know what only green can know?', q:'A blue sentence knows what only the writer knows now. That is…', o:['the boy knows too much','no signal','the writer now']},
    {how:'The skill underneath: Flashback and Back (Grade 6). A signal takes the story back in time, and “Now,” returns to the story. A memoir goes further: its two frames are two VOICES, the boy who did not know yet and the writer who knows now, and you choose when to cut.', q:'In Flashback and Back, which signal returns the reader to the present?', o:['Now,','Two days earlier,','The night before,']}
  ]},

  'WRIT.PARA.L09.07':{name:'Voice',
  teach:[
    {how:'VOICE is how a writer sounds on the page, like a real person you could pick out of a crowd. You already own two pieces: exact words (Picture Words, Grade 5) and telling details (Precise Detail, Grade 7). Voice adds two tools of its own: rhythm, and your own lens. The same moment can be written in A FLAT VOICE or A REAL VOICE. Flat: “Zeidy gave me his camera. It was nice. I took a picture. It was good.” Real: “Zeidy’s camera was heavier than my schoolbag, and it smelled like old leather. I pressed. Blur.” Tool 1, WORD CHOICE, you know: exact words, never “nice”, “good” or “stuff”.', q:'Which sentence has a real voice?', o:['The camera smelled like old leather and Zeidy’s coat.','The camera was very nice.','It was a good camera and stuff.']},
    {how:'Tool 2 is RHYTHM: mix short and long sentences. A long sentence carries the reader along; a short one stops him. “I held my breath, waited for Zeidy to nod, and pressed as softly as I could. Blur.” Tool 3 is YOUR LENS: of all the telling details, choose the ones only YOU would notice, because of who you are. Gavriel, a photographer, notices the light. Eli, who leins, notices the letters with no vowels.', q:'Which detail is something only Gavriel, the photographer, would notice?', o:['The light through the s’chach made stripes on Zeidy’s face.','The sukkah was nice.','It was Sukkos.']},
    {how:'Two mistakes. A FLAT VOICE: plain words, every sentence the same length, details anyone would see. TRYING TOO HARD: fancy words he would never say (“the luminous apparatus”). In Grade 6 you used a formal voice for an argument. A memoir goes further: you choose your OWN voice for the job. It is neither formal nor slang; it is you, on your best day.', q:'“The magnificent, luminous apparatus trembled in my minuscule hands.” What is wrong?', o:['trying too hard','a flat voice','nothing, it is a real voice']}
  ],
  practice:[
    {t:'sort', q:'Gavriel’s camera moment. Sort each sentence by its voice.', bins:[{id:'R',label:'🗣️ A real voice'},{id:'F',label:'😐 A flat voice'},{id:'T',label:'🎭 Trying too hard'}],
      items:[{label:'Zeidy’s camera smelled like old leather.',bin:'R'},{label:'I pressed. Blur.',bin:'R'},{label:'It was a really nice camera.',bin:'F'},{label:'I took a picture and it was good.',bin:'F'},{label:'The ancient apparatus gleamed magnificently.',bin:'T'},{label:'My trembling digits caressed the device.',bin:'T'}],
      h:'Would a real boy say it on his best day? Too plain? Or too fancy?'},
    {t:'pairs', q:'Match each tool of voice to what it means.', pairs:[['Word choice','Exact words a real person would use'],['Rhythm','Short and long sentences, mixed'],['Your lens','Details only you would notice']],
      h:'Is it about the words, the sentence lengths, or the details?'},
    {t:'spotall', q:'Gavriel is the photographer. At Eli’s bar mitzvah seudah on Sunday night, tap every detail only GAVRIEL would notice.', cells:[{label:'The hall lights turned the cake gold.',ok:true},{label:'Eli blinked at the exact second I pressed.',ok:true},{label:'The candles threw long shadows across two tables.',ok:true},{label:'The kugel was still warm.',ok:false},{label:'Rabbi Rosen shook Eli’s hand twice.',ok:false}],
      h:'Every detail here is exact. Which ones come from a photographer’s eye?'},
    {t:'sort', q:'Sneaky ones! Rhythm. Sort each passage.', bins:[{id:'G',label:'✅ Rhythm that works'},{id:'M',label:'⚠️ Mistake: all the same length'}],
      items:[{label:'I went up. I said it. I looked down. I started.',bin:'M'},{label:'I had practiced for weeks. Then: crack.',bin:'G'},{label:'It was hot. It was loud. It was long.',bin:'M'},{label:'I waited for the light on Zeidy’s face. Click.',bin:'G'},{label:'I held it. I pressed it. I looked at it.',bin:'M'}],
      h:'Do the sentences change length, so a short one can hit hard?'},
    {t:'order', q:'Build a passage with rhythm. Tap the sentences in order.', tiles:['I breathed out, the way Zeidy had shown me.','Then I waited for the light on his face to hold still.','I pressed.','Sharp.'],
      h:'Two long sentences carry the reader. Two short ones stop him.'},
    {t:'pairs', q:'Fix the flat voice. Match each flat sentence to its real-voice version.', pairs:[['It was nice.','It smelled like old leather.'],['I was nervous.','My finger shook on the button.'],['He said something to help.','“Breathe out,” he said, “then press.”']],
      h:'Swap the plain word for an exact detail you could see, hear or touch.'},
    {t:'write', q:'Your turn to write. Take your memoir moment (or Gavriel’s). First write it in a flat voice, in two sentences. Then write it again in a real voice, in three or four sentences.', min:0, checks:['🔤 Word choice: I used exact words, not “nice” or “good”.','🎵 Rhythm: I mixed long and short sentences.','👀 My lens: a detail only I would notice.'], h:'Read it aloud. Would you say it to a friend at the Shabbos table?'}
  ],
  check:[
    {q:'Yoni bakes challah every Friday with his father, who is a baker. He writes: “I could tell by the smell that the dough needed two more minutes.” Which tool of voice is this?', o:['your lens','rhythm','a flat voice'], h:'Which detail could only a boy who bakes every week notice?'},
    {q:'Benny’s memoir: “The shul was nice. The people were nice. The kiddush was good.” What voice is this?', o:['a flat voice','a real voice','trying too hard'], h:'Plain words? Every sentence the same length?'},
    {t:'order', q:'Build Yoni’s passage with rhythm. Tap the sentences in order.', tiles:['My father kneaded the dough for a long time, humming a Shabbos niggun.','Then he slid the bowl to me.','My turn.'], h:'Start long. Then shorter. End on the short one that hits hard.'}
  ],
  re:[
    {how:'A new way: when a friend calls, you know who it is before he says his name. His voice gives him away. A real voice in writing works the same way: the reader can hear the person.', q:'Knowing a friend by his voice on the phone is like…', o:['a real voice in writing','a flat voice','trying too hard']},
    {how:'A simpler step: read it out loud. If it sounds like a form, it is a flat voice. If it sounds like a dictionary, you are trying too hard. If it sounds like you on your best day, it is your real voice.', q:'Read aloud, it sounds like a dictionary. It is…', o:['trying too hard','a flat voice','a real voice']},
    {how:'The skill underneath: Formal Voice (Grade 6) and Precise Detail (Grade 7). A formal voice fits an argument; telling details fit a story. A memoir goes further: you choose your own voice, built from exact words, rhythm, and your own lens.', q:'An argument for adults uses a…', o:['formal voice','slang voice','shouting voice']}
  ]},

  'WRIT.PARA.L09.08':{name:'Reflection',
  teach:[
    {how:'A memoir does not end when the scene ends. It ends with A REFLECTION from the writer now. In Grade 7 your character showed a before and a now inside the story. Grade 7 used past tense: “Now I knew…”. A memoir goes further. The now is TODAY, in present tense: “Now I understand…”. And it adds a third beat: what you STILL DO because of it. Gavriel: “Back then I thought Zeidy was teaching me about cameras. Now I understand he was teaching me to slow down. Before every Beacon photo, I still breathe out first.”', q:'Which ending is a memoir reflection?', o:['Back then I thought it was about cameras. Now I understand it was about slowing down.','And that was the Sukkos Zeidy taught me to use his camera.','The lesson is: always be patient.']},
    {how:'Two mistakes you know. A SUMMARY retells what happened; the reader was just there. A PASTED-ON MORAL (Grade 6) lectures: “The lesson is…”, “So always…”. One new mistake: TOO PERFECT. “Now I never rush anything, ever again” is not true of any real boy, so the reader stops believing you. A memoir is true, so the reflection may be honest and unfinished: “Some days I still rush.”', q:'“Since that day, I am perfectly patient, every single day.” What is this ending?', o:['too perfect','a reflection','a summary']},
    {how:'Make it land in two ways. TIE IT TO A DETAIL from the moment, like the breath before the click. SHOW IT TODAY: what he does now because of it. “Before every Beacon photo, I still breathe out first. Some days I forget, and then I almost feel his hand on mine.”', q:'Which line ties to a detail and shows it today?', o:['Before every Beacon photo, I still breathe out first.','I learned a lot that day.','Cameras are very interesting.']}
  ],
  practice:[
    {t:'sort', q:'Gavriel’s last lines. Sort each one.', bins:[{id:'R',label:'💭 A reflection'},{id:'S',label:'📋 A summary'},{id:'M',label:'📌 A pasted-on moral'}],
      items:[{label:'Now I know he was teaching me to wait.',bin:'R'},{label:'Today I still breathe out before every photo.',bin:'R'},{label:'And that was the day I used Zeidy’s camera.',bin:'S'},{label:'So Zeidy helped me, and I took a photo.',bin:'S'},{label:'The lesson is: always be patient.',bin:'M'},{label:'So remember, boys, listen to your elders!',bin:'M'}],
      h:'What he understands now? What happened, again? Or a lecture to the reader?'},
    {t:'pairs', q:'Match each part of a reflection to its job.', pairs:[['Back then I thought…','What the boy believed'],['Now I understand…','What the writer knows today'],['Today I still…','Where it shows in his life now']],
      h:'The boy then, the writer now, or his life today?'},
    {t:'spotall', q:'Eli’s memoir about his first leining. Tap every line that REFLECTS: then and now, or his life today.', cells:[{label:'Back then I thought the crack meant I had failed.',ok:true},{label:'Now I see the shul wanted me, not a perfect voice.',ok:true},{label:'I nod at younger boys, the way my father nodded.',ok:true},{label:'Then I finished leining and sat down.',ok:false},{label:'The moral: never be afraid.',ok:false}],
      h:'Does it show what he understands now, or how it lives in his life today?'},
    {t:'sort', q:'Sneaky ones! Honest, or too perfect? Sort each line.', bins:[{id:'H',label:'✅ Honest reflection'},{id:'P',label:'⚠️ Mistake: too perfect'}],
      items:[{label:'I am still learning to wait. I breathe out first.',bin:'H'},{label:'Some days I still rush. Then I feel his hand.',bin:'H'},{label:'Since then, I am patient with everything.',bin:'P'},{label:'Now I never rush anything, ever again.',bin:'P'},{label:'Since that day, I am never nervous.',bin:'P'}],
      h:'Real life is not perfect. Could a real boy truly say this?'},
    {t:'order', q:'Build Gavriel’s reflection. Tap the sentences in order.', tiles:['Back then, I thought Zeidy was teaching me about cameras.','Now I understand he was teaching me to slow down.','Before every Beacon photo, I still breathe out first.','Some days I forget, and then I almost feel his hand on mine.'],
      h:'Then, now, today. The honest line comes last.'},
    {t:'pairs', q:'Fix each ending. Match each draft to what it needs.', pairs:[['The lesson is: be patient.','Turn the moral into what YOU now understand'],['And that was the day I used his camera.','Add the gap: back then … now …'],['Now I understand patience.','Tie it to a detail and show it today']],
      h:'A lecture? A retelling? Or true, but too general?'},
    {t:'write', q:'Your turn to write. Write the last paragraph of your memoir (or Gavriel’s). Show the gap, tie it to a detail from the moment, and show it in your life today. No pasted-on moral, and nothing too perfect.', min:0, checks:['💭 I showed the gap: back then I thought … now I understand …','🔗 I tied it to a detail from the moment.','📌 No pasted-on moral, and nothing too perfect: honest is better.'], h:'Finish three starters: “Back then I thought…”, “Now I understand…”, “Today I still…”.'}
  ],
  check:[
    {q:'Benny ends his memoir: “Back then I thought the boy who saved me a seat was just being polite. Now I understand he was making room for me, and today I save a seat for every new boy.” What is this ending?', o:['a reflection','a summary','a pasted-on moral'], h:'Does it show the gap between then and now?'},
    {q:'Yoni ends his memoir about baking challah with his father: “Since that Friday, I have never once lost patience with anything.” What is this ending?', o:['too perfect','a reflection','a pasted-on moral'], h:'Could any real boy say this truthfully?'},
    {t:'order', q:'Build Akiva’s reflection about the newsroom key. Tap the sentences in order.', tiles:['Back then, I thought the key was a prize.','Now I understand it was a promise to keep.','Today, I still lock the newsroom myself, every Thursday night.'], h:'Then, now, today.'}
  ],
  re:[
