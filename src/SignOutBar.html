<script>
/* Phase 1 (07 BUILD PROMPT v3, 2026-11-09): Sign out in the same top-right corner on every boy screen, auto sign-out after 5 quiet minutes, staff Placement button hidden on boy screens. */
(function(){
 var IDLE=5*60000, last=Date.now();
 ['pointerdown','keydown','touchstart','wheel'].forEach(function(ev){ document.addEventListener(ev,function(){ last=Date.now(); },{passive:true,capture:true}); });
 function signedIn(){ try{ return typeof A!=='undefined'&&A&&A.view!=='signin'&&!!A.st; }catch(e){ return false; } }
 /* Head of School 2026-11-11: any Sign out saves the boy's work first (state + answers not yet sent), then signs out to the home keypad. */
 document.addEventListener('click',function(e){ var t=e.target&&e.target.closest&&e.target.closest('[data-act="signout"]'); if(!t) return;
  try{ if(typeof A!=='undefined'&&A&&A.st&&typeof SRV!=='undefined'&&SRV&&SRV.token&&typeof saveStudent==='function') saveStudent(A.st); }catch(err){} }, true);
 function doOut(){ var b=document.createElement('button'); b.type='button'; b.setAttribute('data-act','signout'); b.style.display='none'; document.body.appendChild(b); b.click(); b.remove(); }
 var css=document.createElement('style');
 css.textContent='.tl-out{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));z-index:2147483001;border:0;border-radius:12px;padding:12px 22px;min-height:48px;font:700 17px system-ui,"Segoe UI",sans-serif;background:#1E1B4B;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.25);cursor:pointer}';
 document.head.appendChild(css);
 var fb=document.createElement('button'); fb.type='button'; fb.className='tl-out'; fb.textContent='Sign out'; fb.style.display='none';
 fb.addEventListener('click',function(e){ e.stopPropagation(); doOut(); });
 document.body.appendChild(fb);
 function fixedUp(x){ for(var i=0;x&&i<4;i++,x=x.parentElement){ if(getComputedStyle(x).position==='fixed') return true; } return false; }
 function tick(){
  var on=signedIn();
  var inpage=Array.prototype.some.call(document.querySelectorAll('[data-act="signout"]'),function(x){ return x!==fb&&x.offsetParent!==null; });
  fb.style.display=on&&!inpage?'':'none';
  Array.prototype.forEach.call(document.querySelectorAll('a,button'),function(x){ if(x!==fb&&/Placement/.test(x.textContent||'')&&fixedUp(x)) x.style.display='none'; });
  if(on&&Date.now()-last>IDLE){ last=Date.now(); doOut(); }
 }
 setInterval(tick,1000); tick();
})();
</script>
<script>

 +'.tl-bq h2{margin:0 0 6px;font-size:22px;font-weight:900}.tl-bq p{margin:0 0 16px;font-size:16px;color:#4C4A7A;line-height:1.4}'

 +'@keyframes tlbf{from{opacity:0}to{opacity:1}}@keyframes tlbp{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}'

 document.head.appendChild(css);
 var bk=document.createElement('button'); bk.type='button'; bk.className='tl-back'; bk.style.display='none';
 bk.innerHTML='<span class="c"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="#1E1B4B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="l"></span>';
 document.body.appendChild(bk);

  q.addEventListener('keydown',function(e){ if(e.key==='Escape'){ q.remove(); bk.focus(); } }); }
 bk.addEventListener('click',function(e){ e.stopPropagation(); var v=view(), p=null; try{ p=A.play; }catch(err){}
  if(v==='play'&&p&&(p.i>0||p.fb)) ask(); else leave(); });
 function tick(){ var v=view(), on=v==='play'||v==='result';
  bk.style.display=on?'':'none'; document.body.classList.toggle('tl-back-on',on);
  if(on){ var w=where(); if(bk.lastW!==w){ bk.lastW=w; bk.querySelector('.l').textContent=w; bk.setAttribute('aria-label','Back to the '+w.toLowerCase()); } }
  else { var q=document.querySelector('.tl-bq'); if(q) q.remove(); } }
 setInterval(tick,300); tick();
})();

<script>
/* THE MENU (HoS 2026-11-20, button system 1: "← top-left on every screen, three dots top-right; every pop-up closes with one round ✕").

   little train, each growing into a round navy button inside a white pill that stretches out with a soft spring; the ✕ lands last.
   Options: Sign out (saves his work first, as before), Message my rebbe (TalkRebbe), Sound on/off (SND; mutes the music too), Music (always opens the music panel to pick songs; shows a line only when music is turned off there).

(function(){
 if(window.__TLMENU) return; window.__TLMENU=1;
 function act(a,attr){ var b=document.createElement('button'); b.type='button'; b.setAttribute(attr||'data-act',a); b.style.display='none'; document.body.appendChild(b); b.click(); b.remove(); }
 function signedIn(){ try{ return typeof A!=='undefined'&&A&&A.view!=='signin'&&!!A.st; }catch(e){ return false; } }

 var S='fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
 var ITEMS=[
  {k:'out',label:'Sign out',svg:'<svg viewBox="0 0 24 24" '+S+'><path d="M14 4h-7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7"/><path d="M11 12h10M17 8l4 4-4 4"/></svg>',go:function(){ close(); act('signout'); }},
  {k:'msg',label:'Message my rebbe',svg:'<svg viewBox="0 0 24 24" '+S+'><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/></svg>',go:function(){ close(); act('open','data-tr'); }},
  {k:'snd',label:'Sound and music',svg:'<svg viewBox="0 0 24 24" '+S+'><path d="M4 10v4h4l5 4V6L8 10H4z"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"/><path class="sl" d="M3 3l18 18" stroke="#FF6B8A"/></svg>',go:function(){ act('sound'); paint(); },off:function(){ return !sndOn(); }},
  {k:'mus',label:'Music',svg:'<svg viewBox="0 0 24 24" '+S+'><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/><path class="sl" d="M3 3l18 18" stroke="#FF6B8A"/></svg>',go:function(){ close(); act('mubtn'); },off:function(){ return !musOn(); }}
 ];
 var N=ITEMS.length, css=document.createElement('style');
 css.textContent='.tl-out{display:none!important}'
 +'#tlmenu{--ink:#1E1B4B;position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:48px;height:48px;z-index:2147483001}'

 +'#tlmenu .op{will-change:transform;position:absolute;top:3px;right:3px;width:42px;height:42px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;cursor:pointer;color:#fff;background:var(--ink);transition:background .3s cubic-bezier(.4,0,.2,1) .08s;'
 +'transform:translate(0,var(--sy)) scale(.15);animation:tlmC .38s cubic-bezier(.4,0,.2,1) both;animation-delay:calc(('+(N-1)+' - var(--i)) * 35ms);backface-visibility:hidden;-webkit-tap-highlight-color:transparent}'
 +'#tlmenu.init .op{animation:none}'
 +'#tlmenu .op svg{width:22px;height:22px;opacity:0;transition:opacity .15s,transform .15s}'
 +'#tlmenu.open .op{background:#1E1B4B;transition:background .25s calc(var(--i) * 55ms);animation:tlmO .62s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i) * 55ms)}'
 +'#tlmenu.open .op svg{opacity:1;transition:opacity .3s calc(var(--i) * 55ms + 220ms),transform .15s}'
 +'@media (hover:hover){#tlmenu.open .op:hover svg{transform:scale(1.12)}}'
 +'#tlmenu .op.out{color:#FF9AB5}#tlmenu .op .sl{opacity:0}#tlmenu .op.off{color:#9C97D0}#tlmenu .op.off .sl{opacity:1}'
 +'@keyframes tlmO{0%{transform:translate(0,var(--sy)) scale(.15)}100%{transform:translate(var(--tx),0) scale(1)}}'
 +'@keyframes tlmC{0%{transform:translate(var(--tx),0) scale(1)}100%{transform:translate(0,var(--sy)) scale(.15)}}'
 +'#tlmenu .x{position:absolute;top:3px;right:3px;width:42px;height:42px;border-radius:50%;border:0;padding:0;background:#1E1B4B;color:#fff;display:grid;place-items:center;cursor:pointer;transform:scale(0) rotate(-90deg);transition:transform .2s cubic-bezier(.4,0,.2,1)}'

 +'#tlmenu .tp:focus-visible{outline:3px solid #FDE047;outline-offset:2px}'
 +'#tlmenu.open .tp{display:none}'

 +'@media (prefers-reduced-motion:reduce){#tlmenu .op,#tlmenu.open .op{animation-duration:.01s}#tlmenu .pl,#tlmenu.open .pl{transition-duration:.01s}}';
 document.head.appendChild(css);
