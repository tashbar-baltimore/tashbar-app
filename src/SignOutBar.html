 el('close').addEventListener('click',function(){ setOpen(false); trigger.focus(); });
 el('signout').addEventListener('click',function(){ setOpen(false); actions.signOut(); });
 el('message').addEventListener('click',function(){ setOpen(false); actions.openMessages(); });
 el('sound').addEventListener('click',function(){ state.soundOn=!state.soundOn; update(); actions.setSound(state.soundOn); });
 root.querySelector('[data-action="musicPanel"]').addEventListener('click',function(){ setOpen(false); actions.openMusicPanel(); });
 root.querySelector('[data-action="playPause"]').addEventListener('click',function(){ if(!state.songLoaded) return; state.playing=!state.playing; update(); actions.setPlaying(state.playing); });
 root.querySelector('[data-action="next"]').addEventListener('click',function(){ if(!state.songLoaded) return; state.playing=true; update();
  var icon=root.querySelector('[data-next-icon]'); icon.classList.remove('cm-zip'); void icon.getBoundingClientRect(); icon.classList.add('cm-zip'); actions.nextSong(); });
 document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&state.open){ setOpen(false); trigger.focus(); } });
 document.addEventListener('pointerdown',function(e){ if(state.open&&!root.contains(e.target)) setOpen(false); },true);

 /* labels: hold on touch, hover with a mouse */
 var tip=null, tipTimer=null;
 function showTip(btn){ if(!state.open||!btn.dataset.label) return; hideTip(); tip=document.createElement('span'); tip.className='cm-tip'; tip.textContent=btn.dataset.label; btn.appendChild(tip); }
 function hideTip(){ clearTimeout(tipTimer); if(tip){ tip.remove(); tip=null; } }
 root.querySelectorAll('[data-label]').forEach(function(btn){
  btn.addEventListener('pointerdown',function(){ showTip(btn); });
  btn.addEventListener('pointerenter',function(e){ if(e.pointerType==='mouse') showTip(btn); });
  var later=function(){ clearTimeout(tipTimer); tipTimer=setTimeout(hideTip,450); };
  btn.addEventListener('pointerup',later); btn.addEventListener('pointerleave',later);
 });
 window.addEventListener('resize',function(){ layout(true); });

 /* the app's own state, read every 400 ms (sound from SND, music from TashbarMusic); only redraws when something changed */
 function sync(force){ var m=mus(), so=sndOn();
  if(force||m.loaded!==state.songLoaded||m.playing!==state.playing||so!==state.soundOn){ state.songLoaded=m.loaded; state.playing=m.playing; state.soundOn=so; update(); } }
 setInterval(function(){ var on=signedIn(); root.style.display=on?'':'none'; if(!on){ if(state.open){ state.open=false; layout(true); } return; } sync(false); makeRoom(); },400);

 /* make room: a button the closed dots would sit on (a pop-up's Close or ✕ in the top corner) is moved left until it is clear,
    so every screen's own buttons stay tappable, including screens added later. Looks only under the dots (elementsFromPoint). */
 var ROOM_SEL='button,a[href],[role="button"],[onclick],input,select,textarea,[data-tj],[data-act]';
 function clickable(n){ for(var i=0;n&&n!==document.body&&i<6;i++,n=n.parentElement){ if(n.matches&&n.matches(ROOM_SEL)) return n; } return null; }
 function makeRoom(){
  if(state.open||root.style.display==='none') return;
  var t=trigger.getBoundingClientRect(), W=document.documentElement.clientWidth, R=Math.min(t.right,W-1), L=t.left-6, found=[];
  [.15,.5,.85].forEach(function(fx){ [.15,.5,.85].forEach(function(fy){
   var st=document.elementsFromPoint(t.left+(R-t.left)*fx,t.top+t.height*fy), top=null;
   for(var i=0;i<st.length;i++){ if(!root.contains(st[i])){ top=st[i]; break; } }
   var c=top&&clickable(top); if(c&&found.indexOf(c)<0) found.push(c);
   /* a button that runs under the dots but is partly covered by its own header: look a little way up for buttons whose box reaches the dots */
   for(var up=top,k=0;up&&up!==document.body&&k<3;k++,up=up.parentElement){ var bs=up.querySelectorAll(ROOM_SEL); if(bs.length>80) break;
    for(var j=0;j<bs.length;j++){ var b=bs[j], r=b.getBoundingClientRect(); if(found.indexOf(b)<0&&r.width>0&&r.right>t.left&&r.left<R&&r.bottom>t.top&&r.top<t.bottom) found.push(b); } } }); });
  found.forEach(function(c){ var r=c.getBoundingClientRect(), need=r.right-L; if(need<=0||r.width>W*0.5) return;
   var cs=getComputedStyle(c);
   if(cs.position!=='absolute'&&cs.position!=='fixed'){ var mr=parseFloat(cs.marginRight)||0, was=c.style.getPropertyValue('margin-right');
    c.style.setProperty('margin-right',(mr+need)+'px','important');
    if(c.getBoundingClientRect().right<=L+1) return;
    if(was) c.style.setProperty('margin-right',was); else c.style.removeProperty('margin-right'); }
   var tx=(parseFloat(c.dataset.cmTx)||0)+need; c.dataset.cmTx=tx; c.style.setProperty('translate',(-tx)+'px 0','important'); });
 }
 try{ new MutationObserver(function(){ requestAnimationFrame(makeRoom); setTimeout(makeRoom,250); }).observe(document.body,{childList:true}); }catch(e){}

 window.TL_MENU={open:function(){ setOpen(true); },close:function(){ setOpen(false); },actions:actions,state:state};
 renderIcons(); layout(true);
})();
</script>
