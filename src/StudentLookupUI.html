<style id="sl-css">
/* STUDENT LOOKUP (Head of School 2026-11-18): one search, one student, everything about him on one page, everything changeable.
   Server: StudentLookup.js. Codes stay secret (only replaced, never shown). No double slash in this file. */
#slBar{position:sticky;top:0;z-index:2147482000;display:flex;gap:10px;align-items:center;max-width:1180px;margin:8px auto 0;padding:10px 14px;background:#fff;border:2px solid #4338CA;border-radius:16px;box-shadow:0 6px 18px rgba(30,27,75,.12);font:600 16px system-ui,"Segoe UI",sans-serif}
#slBar label{white-space:nowrap;color:#312E81}
#slBar input{flex:1;min-width:120px;border:1px solid #c7cbe0;border-radius:10px;padding:10px 12px;font:500 17px system-ui,sans-serif}
#slRes{position:absolute;left:14px;right:14px;top:100%;margin-top:4px;background:#fff;border:1px solid #c7cbe0;border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,.15);max-height:60vh;overflow:auto}
#slRes button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid #eef0f6;background:#fff;padding:12px 14px;font:600 16px system-ui,sans-serif;cursor:pointer}
#slRes button:hover,#slRes button:focus{background:#EEF2FF}
#slRes small{color:#5b6578;font-weight:500}
#slOv{position:fixed;inset:0;z-index:2147482500;background:rgba(15,18,40,.45);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:24px 12px}
#slPg{background:#fff;color:#1b2333;width:min(760px,100%);border-radius:20px;padding:20px 22px;font:500 16px/1.45 system-ui,"Segoe UI",sans-serif;box-shadow:0 20px 50px rgba(0,0,0,.3)}
#slPg h2{margin:0;font-size:26px}#slPg .sub{color:#5b6578;margin:2px 0 10px}
#slPg .x{float:right;border:0;background:#eef0f6;border-radius:10px;font-size:20px;width:40px;height:40px;cursor:pointer}
#slPg section{border-top:1px solid #e2e5ee;padding:14px 0 6px}
#slPg h3{margin:0 0 8px;font-size:18px}
#slPg input,#slPg select{border:1px solid #c7cbe0;border-radius:10px;padding:9px 10px;font:500 16px system-ui,sans-serif;max-width:100%}
#slPg .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
#slPg button.b{border:0;border-radius:12px;padding:10px 16px;font:700 15px system-ui,sans-serif;cursor:pointer;background:#4338CA;color:#fff;min-height:44px}
#slPg button.g{background:#eef0f6;color:#1b2333}
#slPg button.r{background:#B91C1C;color:#fff}
#slPg button:disabled{opacity:.5;cursor:default}
#slPg .code{font:800 46px/1 ui-monospace,Menlo,monospace;letter-spacing:.18em;background:#F0FDF4;border:2px solid #16A34A;border-radius:14px;padding:12px 18px;display:inline-block;margin:6px 0}
#slPg .muted{color:#5b6578;font-size:14px}
#slPg .err{color:#B91C1C;font-weight:700}
#slPg .ok{color:#15803D;font-weight:700}
#slPg .par{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:6px 0;border-bottom:1px dashed #e2e5ee}
@media (max-width:560px){#slBar label{display:none}#slPg{padding:16px 14px}}
</style>
<script>
(function(){
 if(window.SL_ON) return; window.SL_ON=1;
 var L=null, P=null, Q='', busy=false;
 function tok(){ try{ var s=JSON.parse(sessionStorage.getItem('tl-session')||'null'); return s&&s.role==='staff'?s.token:null; }catch(e){ return null; } }
 function run(fn){ var a=[].slice.call(arguments,1); return new Promise(function(res,rej){ google.script.run.withSuccessHandler(res).withFailureHandler(function(e){ rej(e&&e.message?e.message:String(e)); })[fn].apply(null,a); }); }
 function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
 function el(id){ return document.getElementById(id); }
 /* forgiving search: "Khaber" finds Khaver/Chaver/Haver, "Bat Ya" finds Batya, spaces and vowels do not matter */
 function key(s){ s=String(s||'').toLowerCase().replace(/[^a-z]/g,'');
  s=s.replace(/kh|ch|ck/g,'k').replace(/ph/g,'f').replace(/tz|ts/g,'s').replace(/sh/g,'S').replace(/th/g,'t');
  s=s.replace(/[vw]/g,'b').replace(/[cqh]/g,'k').replace(/z/g,'s').replace(/f/g,'p');
  var first=s.charAt(0); s=first+s.slice(1).replace(/[aeiouy]/g,''); return s.replace(/(.)\1+/g,'$1'); }
 function plain(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,''); }
 function score(st,q){ var n=st.name.toLowerCase(), qp=plain(q); if(!qp) return 0;
  if(plain(n).indexOf(qp)===0) return 100; if(plain(n).indexOf(qp)>=0) return 80;
  var words=q.toLowerCase().split(/\s+/).filter(Boolean), nw=n.split(/\s+/);
  if(words.every(function(w){ return nw.some(function(x){ return x.indexOf(w)===0; }); })) return 70;
  if(key(n).indexOf(key(q))>=0) return 50;
  var nk=nw.map(key); if(words.every(function(w){ var k=key(w); return nk.some(function(x){ return x.indexOf(k)===0; }); })) return 40;
  return 0; }
 function bar(){ if(el('slBar')||!tok()) return;
  var b=document.createElement('div'); b.id='slBar'; b.setAttribute('role','search');
  b.innerHTML='<label for="slQ">🔎 Find a student</label><input id="slQ" type="search" autocomplete="off" placeholder="Type part of a name (any spelling)" aria-label="Find a student"><div id="slRes" hidden></div>';
  document.body.insertBefore(b,document.body.firstChild);
  var q=el('slQ'); q.addEventListener('input',function(){ Q=q.value; list(); }); q.addEventListener('focus',function(){ if(!L) load(); list(); });
  q.addEventListener('keydown',function(e){ if(e.key==='Enter'){ var f=el('slRes').querySelector('button'); if(f) f.click(); } if(e.key==='Escape'){ el('slRes').hidden=true; } });
  document.addEventListener('click',function(e){ if(!e.target.closest('#slBar')) { var r=el('slRes'); if(r) r.hidden=true; } });
 }
 function load(){ var t=tok(); if(!t) return; run('slFind',t).then(function(r){ L=r||[]; list(); }).catch(function(e){ var r=el('slRes'); if(r){ r.hidden=false; r.innerHTML='<div style="padding:12px" class="err">'+esc(e)+'</div>'; } }); }
 function list(){ var r=el('slRes'); if(!r) return; if(!Q.trim()){ r.hidden=true; return; }
  if(!L){ r.hidden=false; r.innerHTML='<div style="padding:12px">Loading the list…</div>'; return; }
  var m=L.map(function(s){ return {s:s,v:score(s,Q)}; }).filter(function(x){ return x.v>0; }).sort(function(a,b){ return b.v-a.v||a.s.name.localeCompare(b.s.name); }).slice(0,12);
  r.hidden=false;
  r.innerHTML=m.length?m.map(function(x){ var s=x.s; return '<button type="button" data-slid="'+esc(s.id)+'"><span>'+esc(s.name)+(s.test?' <small>(test)</small>':'')+'</span><small>'+(s.grade?'Grade '+esc(s.grade)+' · ':'')+esc(s.school)+'</small></button>'; }).join(''):'<div style="padding:12px">No student matches “'+esc(Q)+'”. Try fewer letters.</div>';
  r.querySelectorAll('[data-slid]').forEach(function(b){ b.onclick=function(){ r.hidden=true; open(b.getAttribute('data-slid')); }; });
 }
 function open(id){ P={id:id,info:null,err:'',msg:'',code:null,ask:false,newPar:false,parCode:null}; draw(); refresh(); }
 function refresh(){ run('slInfo',tok(),P.id).then(function(i){ P.info=i; draw(); }).catch(function(e){ P.err=String(e); draw(); }); }
 function close(){ var o=el('slOv'); if(o) o.remove(); P=null; }
 function draw(){ var o=el('slOv'); if(!o){ o=document.createElement('div'); o.id='slOv'; o.addEventListener('click',onClick); o.addEventListener('mousedown',function(e){ if(e.target===o) close(); }); document.body.appendChild(o); }
  var i=P.info, h='<div id="slPg" data-sid="'+esc(P.id)+'" role="dialog" aria-modal="true" aria-label="Student page"><button class="x" data-sl="close" aria-label="Close">✕</button>';
  if(!i){ h+=P.err?'<p class="err">'+esc(P.err)+'</p>':'<p>Loading…</p>'; o.innerHTML=h+'</div>'; return; }
  h+='<h2>'+esc(i.name)+'</h2><div class="sub">'+(i.grade?'Grade '+esc(i.grade)+' · ':'')+esc(i.schoolName)+'</div>';
  if(window.SH&&window.SH.map) h+='<button type="button" class="b" data-shmap="'+esc(P.id)+'" style="margin:8px 0 4px">🗺️ His map: his goal now and the steps left in his unit</button>';   /* the staff home's boy map (StaffHome.html) */
  if(P.err) h+='<p class="err">'+esc(P.err)+'</p>'; if(P.msg) h+='<p class="ok">'+esc(P.msg)+'</p>';
  h+='<section><h3>🔑 Sign-in code</h3>';
  if(P.code) h+='<div>'+esc(i.name)+'’s new code:</div><div class="code">'+esc(P.code)+'</div><div class="muted">Write it down or give it to the student now. For safety it is shown only this once; you can always give another.</div>';
  else if(P.ask) h+='<p>Give '+esc(i.name)+' a new code? The old code stops working.</p><div class="row"><button class="b" data-sl="code" '+(busy?'disabled':'')+'>Yes, give a new code</button><button class="b g" data-sl="nocode">Cancel</button></div>';
  else h+='<p class="muted">Codes are kept secret, so the old code can’t be shown. You can give a new one in one tap.</p><button class="b" data-sl="ask">Give a new code</button>';
  h+='</section><section><h3>📝 Name and grade</h3>';
  if(i.can.edit) h+='<div class="row"><input id="slName" value="'+esc(i.name)+'" aria-label="Name" maxlength="60" style="flex:1;min-width:200px"><select id="slGrade" aria-label="Grade">'+['K','1','2','3','4','5','6','7','8'].map(function(g){ return '<option'+(g===i.grade?' selected':'')+'>'+g+'</option>'; }).join('')+'</select><button class="b" data-sl="save" '+(busy?'disabled':'')+'>Save</button></div>';
  else h+='<p>'+esc(i.name)+(i.grade?' · Grade '+esc(i.grade):'')+'</p><p class="muted">The Head of School or a school admin can change these.</p>';
  h+='</section><section><h3>🏫 School or family group</h3>';
  if(i.can.move&&i.schools.length) h+='<div class="row"><select id="slSchool" aria-label="School">'+i.schools.map(function(s){ return '<option value="'+esc(s.id)+'"'+(s.id===i.school?' selected':'')+'>'+esc(s.name)+'</option>'; }).join('')+'</select><button class="b" data-sl="move" '+(busy?'disabled':'')+'>Move</button></div>';
  else h+='<p>'+esc(i.schoolName)+'</p><p class="muted">The Head of School can move a student to another school or family group.</p>';
  h+='</section><section><h3>👪 Parents</h3>';
  h+=i.parents.length?i.parents.map(function(p){ return '<div class="par"><b>'+esc(p.title||p.name)+'</b>'+(p.title?'<span class="muted">'+esc(p.name)+'</span>':'')+(p.email?'<span>'+esc(p.email)+'</span>':'')+(p.phone?'<span>'+esc(p.phone)+'</span>':'')+(i.can.parents?'<button class="b g" data-sl="unlink" data-p="'+esc(p.id)+'" '+(busy?'disabled':'')+'>Remove from this student</button>':'')+'</div>'; }).join(''):'<p class="muted">No parent is linked yet.</p>';
  if(P.parCode) h+='<p>The new parent’s sign-in code:</p><div class="code">'+esc(P.parCode)+'</div><div class="muted">Give it to the parent now. It is shown only this once.</div>';
  if(i.can.parents){
   if(i.otherParents.length) h+='<div class="row"><select id="slPar" aria-label="Parent already in the system"><option value="">Link a parent already in the system…</option>'+i.otherParents.map(function(p){ return '<option value="'+esc(p.id)+'">'+esc(p.name)+(p.kids?' ('+p.kids+' child'+(p.kids===1?'':'ren')+')':'')+'</option>'; }).join('')+'</select><button class="b" data-sl="link" '+(busy?'disabled':'')+'>Link</button></div>';
   h+=P.newPar?'<div class="row"><input id="slPn" placeholder="Parent’s full name" aria-label="Parent’s full name" style="flex:1;min-width:180px"><input id="slPt" placeholder="How the app greets them, e.g. Mr. Cohen" aria-label="Title" style="flex:1;min-width:180px"></div><div class="row"><input id="slPe" type="email" placeholder="Email (optional)" aria-label="Email"><input id="slPp" placeholder="Phone (optional)" aria-label="Phone"><button class="b" data-sl="addpar" '+(busy?'disabled':'')+'>Add parent</button><button class="b g" data-sl="nopar">Cancel</button></div>':'<button class="b g" data-sl="newpar">+ Add a new parent</button>';
  } else h+='<p class="muted">The Head of School or a school admin can link parents.</p>';
  h+='</section><section><h3>📚 Levels, points, Pathfinder and more</h3><p class="muted">Every subject level, skills, points, the Pathfinder report, written work and removing a student are on the full student card.</p><button class="b" data-sl="card">Open the full student card</button></section></div>';
  o.innerHTML=h;
 }
 function act(p){ busy=true; P.err=''; P.msg=''; draw(); return p.then(function(r){ busy=false; return r; },function(e){ busy=false; P.err=String(e); draw(); throw e; }); }
 function onClick(e){ var t=e.target.closest('[data-sl]'); if(!t||t.disabled||!P) return; var a=t.getAttribute('data-sl'), i=P.info, T=tok();
  if(a==='close') return close();
  if(a==='ask'){ P.ask=true; return draw(); } if(a==='nocode'){ P.ask=false; return draw(); }
  if(a==='code') return act(run('sgFreeCode',T).then(function(r){ return run('sgSetCode',T,i.id,r.code).then(function(){ return r.code; }); })).then(function(c){ P.code=c; P.ask=false; P.msg='New code saved.'; draw(); }).catch(function(){});
  if(a==='save') return act(run('slSave',T,i.id,{name:el('slName').value,grade:el('slGrade').value})).then(function(r){ P.msg=r&&r.same?'Nothing changed.':'Saved.'; L=null; refresh(); }).catch(function(){});
  if(a==='move'){ var sc=el('slSchool').value; if(sc===i.school){ P.msg='Already in that school.'; return draw(); } return act(run('acMoveStudents',T,[i.id],sc)).then(function(){ P.msg='Moved.'; L=null; refresh(); }).catch(function(){}); }
  if(a==='link'){ var pid=el('slPar').value; if(!pid){ P.err='Pick a parent first.'; return draw(); } return act(run('slLinkParent',T,i.id,pid)).then(function(){ P.msg='Parent linked.'; refresh(); }).catch(function(){}); }
  if(a==='unlink') return act(run('slUnlinkParent',T,i.id,t.getAttribute('data-p'))).then(function(){ P.msg='Parent removed from this student.'; refresh(); }).catch(function(){});
  if(a==='newpar'){ P.newPar=true; return draw(); } if(a==='nopar'){ P.newPar=false; return draw(); }
  if(a==='addpar') return act(run('acSaveParent',T,{name:el('slPn').value,title:el('slPt').value,email:el('slPe').value,phone:el('slPp').value,sids:[i.id]})).then(function(r){ P.newPar=false; P.parCode=r&&r.code; P.msg='Parent added.'; refresh(); }).catch(function(){});
  if(a==='card'){ var id=i.id; close(); var b=document.createElement('button'); b.type='button'; b.hidden=true; b.setAttribute('data-act','card'); b.setAttribute('data-id',id); document.body.appendChild(b); b.click(); setTimeout(function(){ b.remove(); },0); try{ window.scrollTo(0,0); }catch(x){} }
 }
 (function wait(){ if(tok()) bar(); if(!document.getElementById('slBar')) setTimeout(wait,1000); })();
 window.SL={ open:function(id){ open(String(id)); } };
 document.addEventListener('click',function(e){ var b=e.target.closest&&e.target.closest('[data-shmap]'); if(!b) return; e.preventDefault(); var ov=document.getElementById('slOv'); if(ov) ov.remove(); if(window.SH&&window.SH.map) window.SH.map(b.dataset.shmap); });   /* the staff home's Students list opens a boy's page here (StaffHome.html) */
 window.addEventListener('storage',function(){ if(tok()) bar(); });
})();
</script>
