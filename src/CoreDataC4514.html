(function () {
  var P = {
    c45_enpower: { title: 'Where Does Electricity Come From?', text: 'When you flip a switch, a light turns on in an instant. But the electricity started its trip far away.\nMAKING IT SPIN\nMost electricity is made in power plants. Many power plants burn coal or natural gas to boil water. The hot steam rushes out and spins a big wheel with blades, called a turbine.\nMAGNETS AND WIRE\nThe turbine turns a generator. Inside the generator, magnets spin past coils of copper wire, and that pushes electricity through the wire. In 1831, a scientist named Michael Faraday found that a moving magnet can make electricity flow in a wire.\nWIND, WATER AND SUN\nSome power plants burn nothing at all. Wind can spin the blades of a wind turbine. At the Conowingo Dam on the Susquehanna River in Maryland, falling water spins turbines. Solar panels are different: they turn sunlight right into electricity, with nothing spinning.\nDOWN THE WIRES\nTall towers carry power lines across the land. Near your street, machines called transformers change the electricity so it is safe for homes. Then it runs through wires inside the walls, all the way to your switch.' },
    c45_enbattery: { title: 'How a Battery Works', text: 'A flashlight, a remote and a toy car have something in common. Each one runs on a battery.\nTHE FIRST BATTERY\nIn 1800, a scientist in Italy named Alessandro Volta built the first battery. He stacked discs of zinc and copper, with pieces of cardboard soaked in salt water between them. Today we measure a battery\'s push in volts, a word that comes from his name.\nWHAT IS INSIDE\nA battery stores energy in chemicals. Every battery has two ends: a plus end and a minus end. Inside, the chemicals slowly change, and this pushes electricity out of the battery.\nA LOOP CALLED A CIRCUIT\nElectricity flows only in a closed loop, called a circuit. It leaves one end of the battery, runs through the wire and the bulb, and comes back to the other end. If the loop is broken, the light goes out.\nWHY BATTERIES GO DEAD\nWhen the chemicals are used up, the battery cannot push anymore. We say it is dead. A rechargeable battery is different: a charger pushes the chemicals back the way they were, so the battery can be used again and again.' },
    c45_enshelf: { title: 'Dovid\'s Source Shelf: The First Light Bulbs', text: 'Dovid Lerner is writing a report on the first light bulbs. Mr. Halpern gave him four sources. Here is a short piece of each one.\nSOURCE 1: A DICTIONARY (Science Words for Kids)\nfilament (noun): the thin thread inside a bulb that glows when electricity runs through it.\nSOURCE 2: A HISTORY BOOK (Lighting Up the World)\nBefore electric lights, people read by candles, oil lamps and gas lamps. For many years, inventors tried to make an electric bulb, but the thin thread inside kept burning out. In 1879, in New Jersey, Thomas Edison\'s team made a bulb with a thread of baked cotton that glowed for many hours. In England, Joseph Swan made a glowing bulb at about the same time.\nSOURCE 3: A HOW-TO GUIDE (Safe Science at Home)\nHow to change a light bulb, with a grown-up: 1. Turn off the lamp and unplug it. 2. Wait until the old bulb is cool. 3. Twist it out. 4. Twist in the new bulb.\nSOURCE 4: A TABLE OF NUMBERS (How Long Bulbs Last)\nEdison\'s cotton-thread bulb: about 13 hours\nEdison\'s bamboo-thread bulb: more than 1,000 hours\nAn old-style bulb: about 1,000 hours\nAn LED bulb: about 15,000 hours' },
    c45_enshelf2: { title: 'Avrumi\'s Source Shelf: Shabbos Timers', text: 'Avrumi Katz wants to learn about Shabbos timers. Rabbi Feldman helped him find four sources. Here is a short piece of each one.\nSOURCE 1: A HOW-TO GUIDE (Your Plug-In Timer)\nSet the timer before Shabbos begins. 1. Turn the dial until the arrow points to the time now. 2. Push down the pins for the hours the lamp should be on. 3. Plug the timer into the wall, and plug the lamp into the timer.\nSOURCE 2: A DICTIONARY (Words for Young Builders)\ndial (noun): a round face with numbers or marks that turns to set a machine.\nSOURCE 3: A TABLE OF NUMBERS (The Katz Family\'s Friday Night Timers)\nDining room lights: on 4:00 PM, off 11:30 PM\nLiving room lamp: on 4:00 PM, off 10:00 PM\nBoys\' bedroom lamp: on 6:00 PM, off 9:00 PM\nSOURCE 4: A HISTORY BOOK (Clocks That Help at Home)\nSwitches run by a clock have been made for more than a hundred years. Over time, many Jewish families began to use them for Shabbos. A timer set before Shabbos turns the lights on and off by itself, so nobody touches a switch on Shabbos. For any question about timers, families ask a Rav.' },
    c45_ensave: { title: 'Saving Energy at Home', text: 'Every machine in your home runs on electricity. A watt tells how fast a machine uses electricity. The more watts, the more electricity it uses each hour.\nAvrumi Katz wanted his family to use less electricity, so he made a table. He read the labels on things around the house. (The numbers are rounded.)\nTABLE: WATTS USED IN THE KATZ HOME\nOld-style light bulb: 60 watts\nLED light bulb: 9 watts\nCeiling fan: 40 watts\nFridge, motor running: 150 watts\nElectric urn, heating: 1,500 watts\nAvrumi showed the table to his Abba. That week, Abba changed every old-style bulb to an LED bulb. An LED bulb gives about the same light, but it stays cool, so less energy turns into wasted heat.\nThe urn\'s heater does not run all day. It turns on and off to keep the water hot.\nSmall habits help too. Turn off the light when you leave a room. Close the fridge door quickly, so the cold air stays inside.' },
    c45_entimer: { title: 'How a Shabbos Timer Works', text: 'On Shabbos, we do not turn lights on or off. Yet in many Jewish homes, the lights go off at bedtime all by themselves. The secret is a Shabbos timer.\nA timer is a clock that works a switch. Some timers plug into the wall, and a lamp plugs into the timer. Others are built right into the wall. Around the dial of many timers are little pins. The pins mark the hours the lights should be on. When the dial turns to those hours, the switch clicks on. When the hours pass, it clicks off.\nThe timer is set before Shabbos begins. If a family has a question about a timer on Shabbos, they ask a Rav.\nTzvi Hirsch Gold made this table for his family\'s fridge, so nobody forgets.\nTABLE: THE GOLD FAMILY\'S FRIDAY NIGHT TIMERS\nDining room lights: on 4:00 PM, off 11:30 PM\nKitchen light: on all night\nLiving room lamp: on 4:00 PM, off 10:00 PM\nBoys\' bedroom lamp: on 6:00 PM, off 9:00 PM' },
    c45_enstorm: { title: 'Lights Out on Glen Avenue (a story with pictures and sound)', text: 'This story comes with pictures and sound. Each part has a picture, a sound and the words of the story.\nPART 1\nPICTURE: Dovid Lerner sits at the kitchen table with his Chumash. Rain streams down the dark window. The clock on the wall says 8:15.\nSOUND: Rain drums on the roof. Thunder rumbles far away.\nWORDS: Dovid was finishing his homework while the storm grew louder.\nPART 2\nPICTURE: The kitchen is black. Only a flash of lightning shows the window.\nSOUND: CRACK! Then the fridge stops humming.\nWORDS: All at once, the lights went out.\nPART 3\nPICTURE: Abba holds up a lantern.\nSOUND: Soft, slow violin music begins.\nWORDS: "Don\'t worry," said Abba. "I knew this lantern would come in handy."\nPART 4\nPICTURE: Dovid and Abba sit close together in a circle of warm, golden light.\nSOUND: The music turns bright and cheerful. The rain patters gently now.\nWORDS: Dovid finished his homework by lantern light, and Abba learned beside him.' },
    c45_enlantern: { title: 'Chess by Lantern Light (a story with pictures and sound)', text: 'This story comes with pictures and sound. Each part has a picture, a sound and the words of the story.\nPART 1\nPICTURE: Binyamin Yusupov and his Zeidy sit at a chessboard by the living room window. Snow falls outside. The clock on the wall says 7:40.\nSOUND: The wind whistles. A slow, gentle clarinet tune plays.\nWORDS: Binyamin had been staring at the board for a long time.\nPART 2\nPICTURE: The room goes dark. Only the white snow glows outside the window.\nSOUND: The fridge\'s low hum stops. Now there is only the wind.\nWORDS: The lights flickered and went out.\nPART 3\nPICTURE: Zeidy holds up a small battery lantern. Its light falls across the chessboard.\nSOUND: Quick, playful flute music begins.\nWORDS: "A good game does not need a power plant," said Zeidy with a smile.\nPART 4\nPICTURE: Binyamin slides his rook across the board in the golden light.\nSOUND: Click! The music rises, bright and happy.\nWORDS: "Check," whispered Binyamin.' }
