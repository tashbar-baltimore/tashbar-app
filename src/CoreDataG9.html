    'LANG.MECH.L06.04':{name:"Opening Comma", teach:[{"how": "Some sentences open with a word like yes, no, or well. Put a comma right after that word: Yes, I finished my homework. No, the bus is not here yet. Well, we can try again.", "q": "Which is right?", "o": ["Well, we can walk to shul.", "Well we can walk to shul.", "Well we, can walk to shul."]}, {"how": "Some sentences open with a long phrase that tells when or where: After a long day at the yeshiva, Dovid fell asleep. Put a comma at the end of the long phrase, right before the main part of the sentence.", "q": "Which is right?", "o": ["During the long Shabbos afternoon, Zeidy told stories.", "During the long Shabbos afternoon Zeidy, told stories.", "During, the long Shabbos afternoon Zeidy told stories."]}, {"how": "Some sentences open with a clause that starts with when, after, because, if, while, or although. A clause has its own subject and verb. Put a comma at the end of the opening clause: When the bell rang, the boys lined up. If the clause comes at the end, you need no comma: The boys lined up when the bell rang.", "q": "Which is right?", "o": ["Because it rained, we ate inside.", "Because, it rained we ate inside.", "Because it rained we, ate inside."]}], practice:[{"t": "sort", "q": "Mistake Detective: right, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "Yes, I can help.", "bin": "0"}, {"label": "Yes I can help.", "bin": "1"}, {"label": "When Zeidy came in, we all stood up.", "bin": "0"}, {"label": "When Zeidy came in we, all stood up.", "bin": "1"}, {"label": "After the long trip to Lakewood, Avrumi was tired.", "bin": "0"}, {"label": "After, the long trip to Lakewood Avrumi was tired.", "bin": "1"}], "h": "The comma goes at the end of the opener, right before the main part."}, {"t": "order", "q": "Build it: the clause opens the sentence.", "tiles": ["When the bell rang,", "the boys", "lined up."], "h": "The opening clause, its comma, then the main part."}, {"t": "pairs", "q": "Match each opener to its kind.", "pairs": [["Well,", "a word like yes, no, or well"], ["After a long day at the yeshiva,", "a long phrase"], ["Because the bus was late,", "a clause with its own subject and verb"]], "h": "One word? A long phrase? Or a clause with a subject and verb?"}, {"t": "spotall", "q": "Tap every sentence that needs a comma after its opening.", "cells": [{"label": "Yes we are ready.", "ok": true}, {"label": "If it snows tomorrow we will build a snowman.", "ok": true}, {"label": "We are ready.", "ok": false}, {"label": "We will build a snowman if it snows tomorrow.", "ok": false}], "h": "Look for an opener before the main part. A clause at the end needs no comma."}, {"t": "sort", "q": "Sort each opener.", "bins": [{"id": "0", "label": "Opening word"}, {"id": "1", "label": "Long phrase"}, {"id": "2", "label": "Clause"}], "items": [{"label": "No,", "bin": "0"}, {"label": "Yes,", "bin": "0"}, {"label": "In the back of the big shul,", "bin": "1"}, {"label": "At the end of the long day,", "bin": "1"}, {"label": "When Mr. Halpern called,", "bin": "2"}, {"label": "Although it was cold,", "bin": "2"}], "h": "A clause has its own subject and verb. A phrase does not."}, {"t": "order", "q": "Build it: the clause opens the sentence.", "tiles": ["Because Bubby was coming,", "we cleaned", "the whole house."], "h": "The because clause, its comma, then the main part."}], check:[{"q": "\"No___ the soup is still too hot.\" What fills the gap?", "o": [",", "?", ";"]}, {"q": "\"If Shmuel finishes his homework he can play outside.\" Where does the comma go?", "o": ["at the end of the opening clause", "after the first word", "nowhere"]}, {"q": "\"While Abba made Kiddush, the boys stood quietly.\" What kind of opener is \"While Abba made Kiddush\"?", "o": ["a clause with its own subject and verb", "a word like yes, no, or well", "a long phrase"]}], re:[{"q": "Which is right?", "o": ["Yes, Avrumi is home.", "Yes Avrumi is home.", "Yes Avrumi, is home."], "h": "A comma right after yes."}, {"q": "\"When the rain stopped___ we went outside.\" What fills the gap?", "o": [",", ".", "?"], "h": "A comma ends the opening clause."}, {"q": "\"We went outside when the rain stopped.\" Does it need a comma?", "o": ["no", "yes, after outside", "yes, after when"], "h": "The clause comes at the end, so no comma."}]},

    'LANG.MECH.L09.03':{name:"Spell It Right 8", teach:[{"how": "Some words are misspelled so often that good writers keep a memory trick for each. Separate: there is a rat in separate (sep-a-rat-e). Definitely: it holds the word finite (de-finite-ly), with no a. Necessary: one collar, two sleeves, so one c and two s's (ne-c-e-ss-ary).", "q": "Which spelling is right?", "o": ["separate", "seperate", "separete"]}, {"how": "Some hard words double two letters. Accommodate is big enough to hold two c's and two m's. Embarrass has two r's and two s's. Occurrence has two c's, two r's, and ends in -ence (occur has the stress on CUR, so the r doubles).", "q": "Which spelling is right?", "o": ["embarrass", "embarass", "embaras"]}, {"how": "A prefix usually does not change the root. Keep every letter of both parts, even when two same letters meet: mis + spell = misspell, un + necessary = unnecessary, dis + satisfied = dissatisfied, im + mature = immature, un + natural = unnatural. When the letters do not match, nothing doubles: mis + take = mistake.", "q": "mis + spell = ?", "o": ["misspell", "mispell", "misspel"]}], practice:[{"t": "sort", "q": "Mistake Detective: right spelling, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "separate", "bin": "0"}, {"label": "seperate", "bin": "1"}, {"label": "definitely", "bin": "0"}, {"label": "definately", "bin": "1"}, {"label": "necessary", "bin": "0"}, {"label": "neccessary", "bin": "1"}], "h": "Use the trick: a rat, finite, one collar and two sleeves."}, {"t": "pairs", "q": "Match each word to its memory trick.", "pairs": [["separate", "there is a rat in it"], ["definitely", "it holds finite"], ["necessary", "one collar, two sleeves"], ["accommodate", "two c's and two m's"]], "h": "Picture the trick, then spell."}, {"t": "order", "q": "Build the sentence with the right spelling.", "tiles": ["The shul hall", "could", "accommodate", "every guest."], "h": "Accommodate: two c'
