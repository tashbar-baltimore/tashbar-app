 /* ---------- HUD */
 function hud(c){ const app=document.getElementById('app'); if(!app) return; const card=app.querySelector('.card'); if(!card) return; let h=document.getElementById('pfq-hud'); if(h&&h.nextElementSibling!==card){ h.remove(); h=null; }
  const station=Math.floor((c.n-1)/5)+1, step=(c.n-1)%5, L=land(c.sec), r=rank(Q.st.stars), earned=(P.v&&P.v.earned)||0;
  let steps=''; for(let i=0;i<5;i++) steps+=`<span class="st${i<step?' on':''}${i===step?' me':''}">${i===step?esc(Q.st.av||'🧭'):i<step?'✔':''}</span>`;
  const html=`<button type="button" class="av" data-pfq="av" aria-label="Change explorer">${esc(Q.st.av||'🧭')}</button><span class="who">${esc(L[1]+' '+L[0])}<small>${esc(r[2]+' '+r[1])} · Station ${station}</small></span><span class="steps">${steps}<span class="chest" aria-hidden="true">🎁</span></span>${c.kod?'':`<span class="cash" title="What you earned in the Pathfinder">${money(earned)}</span>`}<span class="stars">⭐ ${Q.st.stars}</span><button type="button" class="snd" data-pfq="snd" aria-label="${Q.muted?'Sound on':'Sound off'}">${Q.muted?'🔇':'🔊'}</button>`;
  if(!h){ h=document.createElement('div'); h.id='pfq-hud'; card.parentNode.insertBefore(h,card); } if(h.dataset.k!==html){ h.innerHTML=html; h.dataset.k=html; }
  if(Q.lastEarn!=null&&earned>Q.lastEarn){ const cs=h.querySelector('.cash'); if(cs){ cs.classList.add('up'); setTimeout(()=>cs.classList.remove('up'),600); } SFX.coin(); } Q.lastEarn=earned; }
 /* ---------- screens */
 function pickAvatar(after){ SFX.whoosh(); const o=ov(`<div style="font-size:54px">🗺️</div><h1>Choose your explorer!</h1><p>Your explorer travels the Pathfinder trail with you. Every 5 questions you reach a treasure station.</p><div class="pfq-grid">${AV.map(a=>`<button type="button" data-a="${a}" aria-label="explorer ${a}">${a}</button>`).join('')}</div>`);
  o.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{ Q.st.av=b.dataset.a; save(); SFX.pop(); closeOv(); confetti(16,['⭐','✨']); render(); if(after) after(); }); }
 function mapSvg(sec,from,to){ const N=6, pts=[]; for(let i=0;i<N;i++) pts.push([60+i*88, i%2?70:150]); let d='M'+pts.map(p=>p.join(' ')).join(' L');
  let s=`<svg class="pfq-map" viewBox="0 0 560 230" aria-hidden="true"><rect x="0" y="0" width="560" height="230" rx="24" fill="rgba(255,255,255,.1)"/><path d="${d}" fill="none" stroke="#F0B847" stroke-width="10" stroke-dasharray="2 16" stroke-linecap="round"/>`;
  pts.forEach((p,i)=>{ const done=i<to-1, here=i===to-1; s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${here?26:20}" fill="${done?'#7be38f':here?'#fff':'rgba(255,255,255,.25)'}" stroke="#16274A" stroke-width="4"/><text x="${p[0]}" y="${p[1]+7}" font-size="20" text-anchor="middle">${done?'🚩':here?'🎁':(i+1)}</text>`; });
  const a=pts[Math.max(0,from-1)], b=pts[Math.min(N-1,to-1)]; s+=`<text id="pfq-walker" x="${a[0]}" y="${a[1]-34}" font-size="40" text-anchor="middle">${esc(Q.st.av||'🧭')}<animate attributeName="x" from="${a[0]}" to="${b[0]}" dur="1.2s" fill="freeze"/><animate attributeName="y" from="${a[1]-34}" to="${b[1]-34}" dur="1.2s" fill="freeze"/></text></svg>`; return s; }
 const CHEER=["You're on the right trail!","Hop on the train to your next station!","You're doing great!","Look how far you have come!","Every answer moves you forward!","Your path is getting clearer!","Great job! Keep exploring!"];
 function station(c,stationNo,earnedHere,kod){ SFX.whoosh(); const L=land(c.sec);
  const o=ov(`<h1>${esc(L[1])} Station ${stationNo} reached!</h1><p style="font-size:22px;font-weight:800;margin:4px 0 8px">${esc(CHEER[(stationNo-1)%CHEER.length])}</p>${mapSvg(c.sec,stationNo-1,stationNo)}<p>Tap the treasure chest!</p><div class="pfq-chest" data-pfq="chest" role="button" tabindex="0" aria-label="Open the treasure chest">🎁</div><div id="pfq-prize"></div>`);
  const ch=o.querySelector('[data-pfq="chest"]'); const openIt=()=>{ if(ch.classList.contains('open')) return; ch.classList.add('open'); ch.textContent=kod?'💎':'💰'; ch.removeAttribute('data-pfq'); ch.removeAttribute('role'); ch.removeAttribute('tabindex'); SFX.open(); confetti(30,['🪙','⭐','✨','💎']);
   const stars=3+Math.floor(Math.random()*3); Q.st.stars+=stars; save(); const j=JOKES.length?JOKES[(Q.st.jk++)%JOKES.length]:null; save();
   const pz=o.querySelector('#pfq-prize'); pz.innerHTML=`${!kod&&earnedHere>0?`<div class="pfq-money" id="pfq-count">$0.00</div><p style="margin:0">earned on this stretch of the trail</p>`:''}<div class="pfq-rank">+${stars} ⭐ explorer stars</div>${j?`<div class="pfq-joke">${esc(j[1])}<br><button type="button" data-pfq="pl">Tap for the answer</button></div>`:''}<br><button type="button" class="go" data-pfq="on">Keep exploring ➜</button>`;
   if(!kod&&earnedHere>0){ const el=pz.querySelector('#pfq-count'); let t0=null; const step=ts=>{ t0=t0||ts; const k=Math.min(1,(ts-t0)/900); el.textContent=money(earnedHere*k); if(k<1) requestAnimationFrame(step); else SFX.coin(); }; requestAnimationFrame(step); }
   const pl=pz.querySelector('[data-pfq="pl"]'); if(pl) pl.onclick=()=>{ pl.outerHTML=`<span class="pl">${esc(j[2])}</span>`; SFX.pop(); };
   pz.querySelector('[data-pfq="on"]').onclick=()=>{ closeOv(); rankCheck(); }; try{ pz.querySelector('.go').focus(); }catch(e){} };
  ch.onclick=openIt; ch.onkeydown=e=>{ if(e.key==='Enter'||e.key===' ') openIt(); }; }
 function rankCheck(){ const r=rank(Q.st.stars); if(Q.st.rank!==r[1]){ const first=!Q.st.rank; Q.st.rank=r[1]; save(); if(!first){ SFX.fanfare(); fireworks(); const o=ov(`<div style="font-size:80px">${r[2]}</div><h1>New rank: ${esc(r[1])}!</h1><p>You have ${Q.st.stars} explorer stars. Keep going for the next rank!</p><button type="button" class="go">Awesome!</button>`); o.querySelector('.go').onclick=closeOv; } } }
 function coinCatch(done){ SFX.whoosh(); const g=document.createElement('div'); g.className='pfq-game'; g.innerHTML=`<div class="bar" style="width:100%"></div><div class="top"><span>⚡ COIN CATCH!</span><span id="pfq-gc">0</span></div><div style="position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:900 30px system-ui;pointer-events:none;text-align:center" id="pfq-gi">Tap the coins and stars!<br><span style="font-size:20px;color:#F0B847">🪙 +1 · ⭐ +3 · 💎 +5</span></div>`; document.body.appendChild(g);
  let caught=0, end=Date.now()+10000, alive=true; const bar=g.querySelector('.bar'), cnt=g.querySelector('#pfq-gc'); setTimeout(()=>{ const i=g.querySelector('#pfq-gi'); if(i) i.remove(); },1200);
  const spawn=()=>{ if(!alive) return; const f=document.createElement('span'); f.className='fall'; const rr=Math.random(), gem=rr<0.07, star=!gem&&rr<0.3; f.textContent=gem?'💎':star?'⭐':'🪙'; f.style.left=(5+Math.random()*80)+'vw'; const dur=2200+Math.random()*1600; f.animate([{transform:'translateY(0)'},{transform:'translateY('+(innerHeight+120)+'px)'}],{duration:dur,easing:'linear'}).onfinish=()=>f.remove();
   const hit=e=>{ e.preventDefault(); if(!alive||f.dataset.got) return; f.dataset.got=1; caught+=gem?5:star?3:1; cnt.textContent=caught; SFX.coin(); const r=f.getBoundingClientRect(), p=document.createElement('span'); p.className='pop'; p.textContent=gem?'+5':star?'+3':'+1'; p.style.left=r.left+'px'; p.style.top=r.top+'px'; g.appendChild(p); setTimeout(()=>p.remove(),700); f.remove(); };
   f.addEventListener('pointerdown',hit); g.appendChild(f); setTimeout(spawn,170+Math.random()*190); };
  spawn(); const tick=setInterval(()=>{ const left=end-Date.now(); bar.style.width=Math.max(0,left/100)+'%'; if(left<=0){ clearInterval(tick); alive=false; finish(); } },100);
  function finish(){ const stars=Math.max(1,Math.round(caught/3)); Q.st.stars+=stars; save(); g.innerHTML=`<div style="position:absolute;inset:0;display:grid;place-items:center;color:#fff;text-align:center;padding:20px"><div><div style="font-size:70px">🏆</div><h1 style="font:900 34px system-ui;margin:4px 0">You caught ${caught}!</h1><div class="pfq-rank">+${stars} ⭐ explorer stars</div><br><button type="button" class="go" style="border:0;border-radius:20px;padding:16px 32px;font:900 22px system-ui;background:linear-gradient(180deg,#ffcf4a,#f0a81e);color:#3a2600;box-shadow:0 6px 0 #c47f00;margin-top:14px;cursor:pointer">Open the treasure ➜</button></div></div>`;
   SFX.fanfare(); confetti(24); g.querySelector('.go').onclick=()=>{ g.remove(); done(); }; } }
 function landDone(sec,label,kod){ SFX.fanfare(); fireworks(); setTimeout(fireworks,700); const L=land(sec); Q.st.stars+=10; Q.st.done[sec]=1; save();
  const o=ov(`<div style="font-size:84px">🚩</div><h1>${esc(L[1]+' '+(label||L[0]))} conquered!</h1><p>You planted your flag! ${kod?'':'Your treasure jar for this land is yours.'}</p><div class="pfq-rank">+10 ⭐ explorer stars · ${esc(rank(Q.st.stars)[2]+' '+rank(Q.st.stars)[1])}</div><br><button type="button" class="go">Next land ➜</button>`); o.querySelector('.go').onclick=()=>{ closeOv(); rankCheck(); }; }
 function walking(on){ let w=document.getElementById('pfq-wait'); if(on){ if(!w){ w=document.createElement('div'); w.id='pfq-wait'; w.innerHTML=`<span>${esc(Q.st.av||'🧭')}</span> Walking to the next step…`; document.body.appendChild(w); SFX.step(); } } else if(w){ setTimeout(()=>{ const x=document.getElementById('pfq-wait'); if(x&&!P.busy) x.remove(); },250); } }
 /* ---------- the loop: after every page render */
 const _render=render;
 render=function(){ const r=_render.apply(this,arguments); try{ after(); }catch(e){ if(window.console) console.warn('PathfinderQuest',e); } return r; };
 function after(){ if(P.mode!=='kid'||!P.v) return; const k=key(); if(!Q.st||Q.sid!==k){ const old=Q.st, wasTemp=!Q.sid||Q.sid==='pfq:boy'; Q.sid=k; load(); if(old&&wasTemp&&!Q.st.av&&old.av){ Q.st=old; save(); } }
  const v=P.v; document.body.classList.add('pfq');
  walking(!!P.busy);
  const c=cur(); ['READ','MATH','LANG','K'].forEach(x=>document.body.classList.remove('pfq-'+x)); if(c) document.body.classList.add('pfq-'+(c.kod?'K':(['READ','MATH','LANG'].indexOf(c.sec)>=0?c.sec:'MATH')));
  /* a land finished (general: the road shows it done; Kodesh: the "done" screen) */
  if(v.road){ const now={}; Object.keys(v.road).forEach(k=>{ const s=v.road[k].status; now[k]=s&&s!=='todo'&&s!=='going'; }); if(Q.road){ Object.keys(now).forEach(k=>{ if(now[k]&&!Q.road[k]&&!Q.st.done[k]&&!Q.ov) setTimeout(()=>landDone(k,v.road[k].label),300); }); } Q.road=now; }
  if(v.kodesh&&v.kodesh.finished&&Q.kfin!==v.kodesh.finished.k&&!Q.ov){ Q.kfin=v.kodesh.finished.k; if(!Q.st.done['K'+Q.kfin]){ Q.st.done['K'+Q.kfin]=1; save(); setTimeout(()=>landDone(Q.kfin,v.kodesh.finished.label,1),300); } }
  if(!c) return;
  if(!Q.st.av&&!Q.ov){ pickAvatar(); }
  if(Q.earn0==null||Q.sec!==c.sec){ Q.earn0=v.earned||0; }
  hud(c);
  if(Q.last!==c.id){ const prev=Q.last; Q.last=c.id;
   if(prev&&Q.sec===c.sec&&c.n>1&&(c.n-1)%5===0&&!Q.ov){ const stationNo=Math.floor((c.n-1)/5)+1, earnedHere=(v.earned||0)-Q.earn0; Q.earn0=v.earned||0;
    const go=()=>station(c,stationNo,earnedHere,c.kod); if(stationNo%2===1) coinCatch(go); else go(); }
   else SFX.step();
   Q.sec=c.sec; } }
 document.addEventListener('click',function(e){ const t=e.target.closest&&e.target.closest('[data-pfq]'); if(t){ const a=t.dataset.pfq; if(a==='snd'){ Q.muted=!Q.muted; try{ localStorage.setItem('pfq:mute',Q.muted?'1':'0'); }catch(x){} render(); } else if(a==='av') pickAvatar(); return; }
  const b=e.target.closest&&e.target.closest('.ch,[data-act="pick"],[data-act="kqpick"],[data-act="kqtap"],[data-act="tile"],[data-act="kqtile"]'); if(b) SFX.pop(); },true);
 try{ render(); }catch(e){}
})();
</script>
