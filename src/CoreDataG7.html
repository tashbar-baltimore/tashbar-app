  BITE['READ.VOC.L06.03'] = {"band":"E45","pic":"🔍","today":"Use cause and contrast clues to find meaning","why":"Signal words show how a hard word connects to easy ones.","bridge":"READ.VOC.L04.01","bridgeName":"Clue Hunter","done":"*Signal words* crack hard words: *cause* explains, *contrast* flips.","board":{"one":"Find the signal word. Because, so, as a result: cause clue. But, although, unlike: contrast clue (the opposite).","activity":"Write a sentence with a hard word on the board; boys circle the signal word and guess the meaning.","mistakes":["Missing the signal word","Reading a contrast clue as the same meaning","Guessing without checking the sentence"]},"hook":{"kind":"secret","pic":"🔐","t":"Secret word: \"Unlike his noisy brother, Tzvi Hirsch is placid.\"","q":"Crack it! What does placid mean?","o":["calm","loud","hungry"],"pay":"*Calm*! *Unlike* was the key. It flips *noisy* into its opposite."},"learn":[{"t":"A *signal word* is a key to a hard word.","act":{"type":"sort","bins":["Cause clue","Contrast clue"],"cards":[["because",0],["but",1],["so",0],["although",1],["as a result",0],["unlike",1]],"say":"Sort each *signal word*.","how":"*Cause* tells why. *Contrast* shows an opposite."}},{"t":"*Cause* clue: so, because. The reason explains the word.","act":{"type":"cloze","t":"The sidewalk was sweltering, so we walked on the shady side. Sweltering means ___.","o":["very hot","very cold","very dark"],"a":"very hot","say":"Find the *signal word* first.","how":"*So* shows a cause. Why walk in the *shade*?"}},{"t":"*Contrast* clue: but, unlike. The word means the *opposite*.","m":{"type":"tiles","w":["Unlike his noisy brother,","Tzvi Hirsch","is placid."],"hi":[0]}},{"who":{"q":"\"The path was narrow, but the road was wide.\" Narrow means?","o":[["Dani","wide"],["Meir","not wide"]],"a":1,"why":"*But* flips it. Narrow is the *opposite* of wide."}}],"play":[{"type":"sort","mis":true,"bins":["Right","Mistake"],"cards":[["Binyamin was drowsy, so he went to sleep early. Drowsy means sleepy.",0],["The path was steep, but the road was flat. Steep means flat.",1],["Unlike the quiet library, the lunchroom was boisterous. Boisterous means noisy.",0],["The milk was spoiled, so we threw it out. Spoiled means fresh.",1]],"say":"Mistake Detective! Is the meaning right, or a mistake?","how":"Find the *signal word*. Same idea, or the *opposite*?","why":{"q":"Why is \"Steep means flat\" a mistake?","o":["But signals the opposite of flat","So signals a cause","There is no clue"],"a":"But signals the opposite of flat"}},{"type":"match","pairs":[["placid","calm and quiet"],["sweltering","very hot"],["boisterous","noisy"],["drowsy","sleepy"]],"say":"Match each word to its meaning.","how":"Think back to each *clue* sentence.","why":{"q":"Why does placid mean calm and quiet?","o":["Unlike signals the opposite of noisy","Placid sounds like noisy","Unlike means the same"],"a":"Unlike signals the opposite of noisy"}},{"type":"cloze","t":"The first hill was gentle, ___ the second hill was steep.","o":["but","so","because"],"a":"but","say":"Pick the signal word that fits.","how":"*Gentle* and *steep* are opposites.","why":{"q":"Why \"but\"?","o":["Gentle and steep are opposites","Gentle causes steep","They mean the same"],"a":"Gentle and steep are opposites"}},{"type":"tiles","w":["It was frigid outside,","so","Dovid wore","his warmest coat."],"extra":["but"],"say":"Challenge! Build a sentence with a *cause* clue.","how":"The cause first, then *so*, then what happened."}]};
  BITE['READ.VOC.L06.04'] = {"band":"E45","pic":"🎀","today":"Read homographs: same spelling, different meaning and sound","why":"The sentence tells you which word it is and how to say it.","bridge":"READ.VOC.L04.02","bridgeName":"Dictionary Detective","done":"*Homographs* look the same. The *sentence* tells you the sound.","board":{"one":"Homographs: same spelling, different meanings, often different sounds. Read the sentence to pick the meaning, then the sound.","activity":"Say a sentence with bow, wind, lead, tear or close; boys show a thumbs up or down for each sound.","mistakes":["Reading wind (moving air) like find","Reading a tear in a coat like ear","Choosing the sound before reading the sentence"]},"hook":{"kind":"fact","pic":"🌬️","t":"Did you know? Some words are spelled the same but sound different.","q":"How do you say \"wind\" in \"wind the clock\"?","o":["like pinned","like find"],"pay":"Like *find*! Read the *sentence first*, then pick the *sound*."},"learn":[{"t":"*Homographs*: same spelling, different *meaning*. Many sound different.","act":{"type":"match","pairs":[["wind that rhymes with pinned","moving air"],["wind that rhymes with find","to turn or wrap"],["lead that rhymes with seed","to guide"],["lead that rhymes with bed","a gray metal"]],"say":"Say each *sound*. Match it to its meaning.","how":"Say the word out loud *both* ways."}},{"t":"Read the *sentence first*. The meaning picks the sound.","act":{"type":"sort","bins":["Bow rhymes with go","Bow rhymes with cow"],"cards":[["Tie a bow on the gift.",0],["Dovid played the violin with a bow.",0],["Bow your head politely.",1],["The bow of the boat cut through the waves.",1]],"say":"How do you say *bow* in each sentence?","how":"A knot or violin bow: *go*. Bending or a boat front: *cow*."}},{"who":{"q":"\"A tear rolled down his cheek.\" How do you say tear?","o":[["Simcha","rhymes with bear"],["Gedalya","rhymes with ear"]],"a":1,"why":"A drop from your *eye* rhymes with *ear*."}}],"play":[{"type":"sort","mis":true,"bins":["Right","Mistake"],"cards":[["Mr. Halpern will lead the trip: lead rhymes with seed.",0],["Please do not tear the page: tear rhymes with ear.",1],["Please close the door: close rhymes with nose.",0],["The wind blew hard: wind rhymes with find.",1]],"say":"Mistake Detective! Is the sound right, or a mistake?","how":"Find the *meaning* first. Then the *sound*.","why":{"q":"Why is \"The wind blew hard: rhymes with find\" wrong?","o":["Moving air rhymes with pinned","Wind is not a word","It is a tear"],"a":"Moving air rhymes with pinned"}},{"type":"cloze","t":"Please close the window. Here, close means ___.","o":["to shut","near","far"],"a":"to shut","say":"Fill the gap. What does close mean here?","how":"What do you *do* to a window?","why":{"q":"Why does close mean to shut here?","o":["It is something you do to a window","It tells how far away","It is a drop from your eye"],"a":"It is something you do to a window"}},{"type":"match","pairs":[["close that rhymes with nose","to shut"],["close with an s sound","near"],["tear that rhymes with bear","to rip"],["tear that rhymes with ear","a drop from your eye"]],"say":"Match each sound to its meaning.","how":"Try each meaning in a *sentence*."},{"type":"sort","bins":["wind like pinned","wind like find"],"cards":[["Wind the hose.",1],["The wind is cold.",0],["Wind up the yo-yo string.",1],["A strong wind shook the sukkah.",0]],"say":"Challenge! How do you say wind in each one?","how":"*Moving air*: pinned. To *turn or wrap*: find."}]};
  BITE['READ.VOC.L06.05'] = {"band":"E45","pic":"📖","today":"Use a thesaurus, then check meaning and feeling","why":"The right word makes your writing clear and strong.","bridge":"READ.VOC.L05.01","bridgeName":"Same and Opposite","done":"A *thesaurus* gives choices. You pick the one that fits the *meaning* and *feeling*.","board":{"one":"A thesaurus gives synonyms. Pick one, then check: does it fit the meaning? Does it fit the feeling?","activity":"Write a plain sentence; boys use a class thesaurus to swap one word, then explain why it fits.","mistakes":["Taking the first word listed","A word that is too loud or too soft for the sentence","A harsh word where a kind one belongs"]},"hook":{"kind":"predict","pic":"👣","t":"Dovid must pass the sleeping baby. Thesaurus: tiptoe, stomp, march.","q":"Which word will fit best?","o":["tiptoe","stomp","march"],"pay":"*Tiptoe*! A thesaurus gives choices. *You* check which one fits."},"learn":[{"t":"A *thesaurus* lists *synonyms*: words that mean almost the same.","act":{"type":"match","pairs":[["tiptoe","walk very quietly"],["march","walk in step, like a parade"],["stroll","walk slowly, just relaxing"],["stomp","walk with heavy, loud steps"]],"say":"Match each synonym for *walk* to its meaning.","how":"*Picture* each way of walking."}},{"t":"Check the *meaning*. Does it fit the sentence?","act":{"type":"sort","bins":["Fits","Does not fit"],"cards":[["The baby is asleep, so Avrumi whispered.",0],["The baby is asleep, so Avrumi shouted.",1],["Yehuda was starving, so he gobbled his kugel.",0],["Yehuda was starving, so he nibbled one crumb.",1]],"say":"Does the new word fit the *meaning*?","how":"Read the *whole* sentence."}},{"who":{"q":"Rebbe praised Eli. Thesaurus: smart → bright, sly.","o":[["Akiva","Eli is a sly student."],["Nosson","Eli is a bright student."]],"a":1,"why":"*Sly* sounds sneaky. Praise needs a *kind* word."}}],"play":[{"type":"sort","mis":true,"bins":["Right","Mistake"],"cards":[["The aroma of fresh challah filled the house.",0],["The stink of fresh challah filled the house.",1],["Avi gave Bubby a gentle hug.",0],["Avi gave Bubby a rough hug.",1]],"say":"Mistake Detective! Does the word fit the feeling?","how":"Good things need *kind* words.","why":{"q":"Why is \"the stink of fresh challah\" a mistake?","o":["Stink is a bad word for a good smell","Stink is too long","It is not a real word"],"a":"Stink is a bad word for a good smell"}},{"type":"cloze","t":"Thesaurus: ran → raced, strolled. Late for the bus, Moshe ___ to the corner.","o":["raced","strolled"],"a":"raced","say":"Fill the gap with the word that fits.","how":"Late means he must go *fast*.","why":{"q":"Why raced?","o":["Late means he must hurry","It is listed first","Strolled means the same"],"a":"Late means he must hurry"}},{"type":"match","pairs":[["big","enormous"],["happy","thrilled"],["said","whispered"],["cold","freezing"]],"say":"Match each plain word to a more exact synonym.","how":"Almost the same meaning, but *more exact*."},{"type":"cloze","t":"Thesaurus: pleased → glad, smug. Binyamin was ___ to help Bubby carry the groceries.","o":["glad","smug"],"a":"glad","say":"Challenge! Pick the word with the kind feeling.","how":"*Smug* means too pleased with yourself.","why":{"q":"Why not smug?","o":["Smug means too pleased with yourself","Smug means sad","Smug is a place"],"a":"Smug means too pleased with yourself"}}]};
  BITE['READ.VOC.L06.06'] = {"band":"E45","pic":"💡","today":"Understand idioms and proverbs in a story","why":"Sayings pack a big idea into a few words.","bridge":"READ.VOC.L06.02","bridgeName":"Figure It Out","done":"*Idioms* mean more than their words. *Proverbs* give advice.","board":{"one":"Idiom: the words mean something else (a piece of cake = very easy). Proverb (adage): a short saying with advice. Use story clues.","activity":"Read a short story with one idiom and one proverb; boys find each and say what it means.","mistakes":["Reading an idiom word for word","Mixing up idioms and proverbs","Ignoring the clues in the story"]},"hook":{"kind":"story","pic":"🍰","t":"Avrumi said, \"The spelling bee was a piece of cake!\"","q":"Was there cake at the spelling bee?","o":["Yes, a big one","No, it was easy","Maybe a small one"],"pay":"No cake! *A piece of cake* means *very easy*. That is an *idiom*."},"learn":[{"t":"An *idiom* means something different from its words.","act":{"type":"match","pairs":[["a piece of cake","very easy"],["hit the books","study hard"],["all ears","listening closely"],["break the ice","begin a friendly chat"]],"say":"Match each *idiom* to what it really means.","how":"Not the exact words. Use the *story clues*."}},{"t":"A *proverb* is a short saying with *advice*.","act":{"type":"sort","bins":["Idiom","Saying with advice"],"cards":[["hit the books",0],["a piece of cake",0],["practice makes perfect",1],["say little and do much (Pirkei Avos)",1]],"say":"*Idiom*, or a *saying* with advice?","how":"A proverb or saying gives *advice*. An idiom is a *picture* phrase."}},{"who":{"q":"\"Shimon was under the weather.\" What happened?","o":[["Yisroel","He stood in the rain."],["Elchanan","He felt sick."]],"a":1,"why":"An idiom does not mean its *exact words*."}}],"play":[{"type":"sort","mis":true,"bins":["Right","Mistake"],"cards":[["The test was a piece of cake: it was very easy.",0],["The test was a piece of cake: there was cake at the test.",1],["Yehuda broke the ice with the new boy: he began a friendly chat.",0],["Dovid was all ears: his ears grew big.",1]],"say":"Mistake Detective! Is the meaning right, or a mistake?","how":"Idioms do not mean their *exact words*.","why":{"q":"Why is \"there was cake at the test\" wrong?","o":["An idiom does not mean its exact words","The test was hard","Cake is a proverb"],"a":"An idiom does not mean its exact words"}},{"type":"match","pairs":[["Practice makes perfect.","Keep practicing and you will get better."],["Actions speak louder than words.","Doing shows more than talking."],["Say little and do much.","Promise less and do more."]],"say":"Match each proverb to its advice.","how":"What does it tell you to *do*?"},{"type":"cloze","t":"Eli learned a new song from his little brother. Pirkei Avos says, \"Who is wise? One who learns from every person.\" Eli was ___.","o":["wise","foolish","lucky"],"a":"wise","say":"Fill the gap. What does the saying teach?","how":"Who did Eli *learn* from?","why":{"q":"Why was Eli wise?","o":["He learned from his little brother","He is the oldest","He was lucky"],"a":"He learned from his little brother"}},{"type":"sort","bins":["Idiom","Saying with advice"],"cards":[["all ears",0],["actions speak louder than words",1],["under the weather",0],["who is wise? one who learns from everyone (Pirkei Avos)",1]],"say":"Idiom, or proverb with advice?","how":"Does it give *advice*? Then it is a *proverb*."},{"type":"cloze","t":"Yehuda had a fever, so he was ___ the weather and stayed home.","o":["under","over","above"],"a":"under","say":"Challenge! Finish the idiom.","how":"The idiom for feeling *sick*."}]};
  BITE['READ.VOC.L06.07'] = {"band":"E45","pic":"🔀","today":"Use words that signal contrast and addition","why":"Signal words tell the reader how two ideas connect.","bridge":"LANG.GRAM.L06.01","bridgeName":"Conjunction Kit","done":"*However* signals a surprise. *Moreover* adds one more.","board":{"one":"Contrast (however, although, on the other hand): a different idea. Addition (moreover, also, in addition): one more of the same kind.","activity":"Say one fact; boys add a second sentence starting with however or moreover.","mistakes":["Moreover before a surprise","However before one more of the same","No comma after however or moreover"]},"hook":{"kind":"challenge","pic":"🚶","t":"\"Zeidy is 80 years old. ___, he walks to shul every day.\"","q":"Which word fits the gap?","o":["However","Moreover"],"pay":"*However*! Walking daily at 80 is a *surprise*. Surprise needs a *contrast* word."},"learn":[{"t":"*Contrast* words show an *opposite* or a *surprise*.","act":{"type":"sort","bins":["Contrast","Addition"],"cards":[["however",0],["moreover",1],["although",0],["also",1],["on the other hand",0],["in addition",1]],"say":"Sort each *signal word*.","how":"A *surprise*, or *one more* of the same?"}},{"t":"*Moreover* and *in addition* add one more.","act":{"type":"match","pairs":[["The cholent was cold.","However, everyone ate it."],["The cholent was hot.","Moreover, it was delicious."],["The hike was long.","However, nobody felt tired."],["The hike was fun.","In addition, we saw a waterfall."]],"say":"Match each first sentence to what comes next.","how":"A *surprise*, or *one more* of the same?"}},{"t":"A *comma* comes right after however.","m":{"type":"tiles","w":["However,","he still walks to shul."],"hi":[0]}},{"who":{"q":"\"The test was hard. ___, Eli did well.\"","o":[["Binyamin","Moreover"],["Tzvi","However"]],"a":1,"why":"Doing well on a hard test is a *surprise*."}}],"play":[{"type":"sort","mis":true,"bins":["Right","Mistake"],"cards":[["The road was icy. However, Zeidy drove home safely.",0],["The road was icy. Moreover, Zeidy drove home safely.",1],["Binyamin sets the table. In addition, he clears it after the meal.",0],["Binyamin sets the table. On the other hand, he clears it after the meal.",1]],"say":"Mistake Detective! Does the signal word fit?","how":"Surprise: *contrast*. One more: *addition*.","why":{"q":"Why is \"Moreover, Zeidy drove home safely\" wrong?","o":["Driving safely on ice is a surprise","It adds the same idea","It needs no word"],"a":"Driving safely on ice is a surprise"}},{"type":"cloze","t":"Chaim is the youngest boy on the team. ___, he is the fastest runner.","o":["However","Moreover","In addition"],"a":"However","say":"Fill the gap. Surprise, or one more?","how":"*Youngest* but *fastest* is a surprise.","why":{"q":"Why however?","o":["Youngest but fastest is a surprise","It adds one more of the same","It tells the time"],"a":"Youngest but fastest is a surprise"}},{"type":"match","pairs":[["The puppy is small.","However, it barks very loudly."],["The puppy is cute.","Moreover, it is gentle."],["The bus was slow.","On the other hand, the train was fast."]],"say":"Match each first sentence to what comes next.","how":"A surprise, or one more of the same?"},{"type":"cloze","t":"The bus was late. However___ we got to school on time.","o":[",",".",";"],"a":",","say":"Challenge! Which mark comes after however?","how":"*However* starts the sentence, so a *comma* follows it."}]};
  BITE['READ.VOC.L07.05'] = {"band":"M68","pic":"🌡️","today":"Hear the feeling hiding inside a word","why":"The same fact can sound kind or cruel. Good writers choose the feeling on purpose.","bridge":"READ.VOC.L07.01","bridgeName":"Word Choice","done":"Words carry *feelings*. Pick *positive*, *neutral*, or *negative* on purpose.","board":{"one":"Connotation = the feeling a word carries. Positive (thrifty), neutral (careful), negative (stingy).","activity":"Pairs get a neutral word (smell, said, careful) and find a positive and a negative twin for it.","mistakes":["Thinking twins have opposite meanings","Using a negative word in praise","Missing neutral words"]},"hook":{"kind":"compare","pic":"💰","t":"\"Gavriel is thrifty.\" \"Gavriel is stingy.\"","q":"Which one sounds nicer?","o":["thrifty","stingy","they sound the same"],"pay":"*Thrifty*! Same meaning, different *feeling*. That feeling is *connotation*."},"learn":[{"t":"Some words are *twins*: same meaning, different *feeling*.","act":{"type":"match","pairs":[["thrifty","stingy"],["confident","arrogant"],["curious","nosy"]],"say":"Match each *positive* word to its *negative* twin.","how":"Same idea, opposite *feeling*."}},{"t":"Words can be *positive*, *neutral*, or *negative*.","act":{"type":"sort","bins":["Positive","Neutral","Negative"],"cards":[["aroma",0],["smell",1],["stench",2],["confident",0],["sure",1],["arrogant",2]],"say":"Sort each word by the *feeling* it carries.","how":"*Neutral* words carry no strong feeling."}},{"who":{"q":"Eli thanks Zeidy, who saved for years for a new sefer.","o":[["Ari","Zeidy is stingy."],["Yehoshua","Zeidy is thrifty."]],"a":1,"why":"A thank-you needs a *positive* word."}},{"t":"*Teach it back*: tell your chavrusa three twins.","m":{"type":"scene","e":"🗣️","t":"Tell your chavrusa: thrifty or stingy, confident or arrogant, curious or nosy. Which would you want to be called?"}}],"play":[{"type":"sort","mis":true,"bins":["Right","Mistake"],"cards":[["Stingy gives a negative feeling.",0],["Nosy gives a positive feeling.",1],["Confident gives a positive feeling.",0],["Thrifty and stingy have opposite meanings.",1]],"say":"Mistake Detective! Right, or a mistake?","how":"Twins share a *meaning*. Only the *feeling* changes."},{"type":"cloze","t":"The Beacon praised the new boy as ___ on his first day.","o":["confident","arrogant","nosy"],"a":"confident","say":"Pick the word that praises.","how":"Praise needs a *positive* feeling."},{"type":"match","pairs":[["thrifty","wise with money"],["stingy","will not share"],["nosy","pokes into others' business"],["curious","wants to learn"]],"say":"Match each word to what it says about a person.","how":"Same idea. Which one sounds *kind*?"},{"type":"tiles","w":["Akiva is","thrifty:","he saves","his allowance."],"extra":["stingy:"],"say":"Challenge! Build a sentence that praises how Akiva saves.","how":"Praise needs the *positive* word."}]};
  BITE['READ.VOC.L07.06'] = {"band":"M68","pic":"🌬️","today":"Spot things that act like people","why":"Personification paints a picture and sets a mood in a few words.","bridge":"READ.VOC.L07.05","bridgeName":"Thrifty or Stingy?","done":"*Personification* gives a thing a *human action*. The verb sets the *mood*.","board":{"one":"Personification = a thing doing a human action (the wind whispered). Find the thing, find the action, ask: can only a person do this?","activity":"Each boy picks an object in the room and writes one sentence that gives it a human action. The class guesses the mood.","mistakes":["Calling a real person personification","Naming the thing instead of the action","Missing the mood the verb sets"]},"hook":{"kind":"notice","pic":"🪜","t":"\"The old stairs groaned under Zeidy's feet.\"","q":"What do you notice about the stairs?","o":["They act like a person","They are brand new","They are made of stone"],"pay":"Stairs cannot groan! They got a *human action*. That is *personification*."},"learn":[{"t":"*Personification*: a thing does a *human action*.","act":{"type":"sort","bins":["Personification","Not personification"],"cards":[["The wind whispered.",0],["The wind blew.",1],["The leaves danced down the street.",0],["The leaves fell on the street.",1]],"say":"Does a *thing* act like a person?","how":"Can only a *person* really do it?"}},{"t":"Find the *action word*. Then say what really happened.","act":{"type":"match","pairs":[["The alarm clock screamed.","The alarm rang loudly."],["The flowers drank the rain.","The flowers soaked up the rain."],["The old car coughed.","The old car made rough noises."]],"say":"Match each one to what *really* happened.","how":"Ask: what did the *thing* really do?"}},{"t":"The verb sets the *mood*: calm or wild.","act":{"type":"sort","bins":["Calm","Wild"],"cards":[["The breeze whispered.",0],["The storm howled.",1],["The sun smiled.",0],["The wind shrieked.",1]],"say":"Calm or wild? Sort each *mood*.","how":"Picture a *person* doing the action."}},{"who":{"q":"\"Akiva laughed at the joke.\" Is it personification?","o":[["Refael","Yes, laughing is human"],["Yosef","No, Akiva is a person"]],"a":1,"why":"Only a *thing* acting human counts."}},{"t":"*Teach it back*: tell your chavrusa the three steps.","m":{"type":"scene","e":"🗣️","t":"Tell your chavrusa: find the thing, find the action, then ask \"can only a person do this?\""}}],"play":[{"type":"sort","mis":true,"bins":["Right","Mistake"],"cards":[["\"The moon hid behind a cloud\" is personification.",0],["\"The moon was behind a cloud\" is personification.",1],["\"The stairs groaned\" is personification.",0],["\"Akiva laughed at the joke\" is personification.",1]],"say":"Mistake Detective! Right, or a mistake?","how":"A real *person* does not count. *Was* is not an action."},{"type":"cloze","t":"On a calm night, the breeze ___ through the sukkah.","o":["whispered","howled","screamed"],"a":"whispered","say":"Pick the verb that makes a calm mood.","how":"Gentle night, *gentle* human action."},{"type":"tiles","w":["The tired","old bus","groaned","up the hill."],"extra":["rolled"],"say":"Build a sentence that personifies the bus.","how":"Thing, then its *human* action, then where."},{"type":"order","steps":["Find the thing.","Find what it does.","Ask: can only a person do this?"],"say":"Challenge! Put the spotting steps in order.","how":"*Thing*, *action*, *question*."}]};
  BITE['READ.VOC.L07.08'] = {"band":"M68","pic":"🎓","today":"Learn five words that work in every class","why":"Teachers in every subject ask you to analyze, infer and summarize. Know the words, and you know the job.","bridge":"READ.VOC.L07.03","bridgeName":"Clue to Meaning","done":"*Analyze*, *evidence*, *infer*, *conclude*, *summarize*: words for every class.","board":{"one":"Analyze = break into parts. Evidence = facts that support. Infer = figure out what is not said. Conclude = decide from evidence. Summarize = main points briefly.","activity":"Boys find each word in a real worksheet from another class and say what it asks them to do.","mistakes":["Retelling every detail instead of summarizing","Calling a guess evidence","Mixing up infer and summarize"]},"hook":{"kind":"story","pic":"☂️","t":"Akiva sees wet coats and dripping umbrellas by the door.","q":"What can Akiva figure out?","o":["It is raining outside","It is Shabbos","Someone is baking"],"pay":"Nobody said rain! The coats are *evidence*. Akiva *inferred* it."},"learn":[{"t":"Five *academic words* work in every class. Here are four.","act":{"type":"match","pairs":[["analyze","break into parts to understand"],["evidence","facts that support an idea"],["infer","figure out what is not said"],["conclude","decide after weighing evidence"]],"say":"Match each *academic word* to its meaning.","how":"Think of a class where you used it."}},{"t":"First *evidence*, then *inference*, then *conclusion*.","act":{"type":"order","steps":["Evidence: wet coats at the door.","Inference: it must be raining.","Conclusion: take an umbrella."],"say":"Put the rain story in *order*.","how":"*Facts* first. Then what you *figure out*. Then what you *decide*."}},{"t":"The fifth word: *summarize* means tell the *main points* briefly.","m":{"type":"scene","e":"📝","t":"A long chapter becomes three short sentences. Only the main points stay."}},{"who":{"q":"Rebbe asks the class to summarize the story.","o":[["Tuvia","Tell every single detail"],["Ezra","Tell only the main points"]],"a":1,"why":"A *summary* is short. It skips small details."}},{"t":"*Teach it back*: tell your chavrusa the five words.","m":{"type":"scene","e":"🗣️","t":"Tell your chavrusa: analyze, evidence, infer, conclude, summarize. Give one example of each."}}],"play":[{"type":"sort","mis":true,"bins":["Right","Mistake"],"cards":[["A summary tells the main points briefly.",0],["Evidence is a guess with no proof.",1],["To infer is to copy the words exactly.",1],["To conclude is to decide after weighing the evidence.",0]],"say":"Mistake Detective! Right, or a mistake?","how":"Check each word against its *meaning*."},{"type":"cloze","t":"Before you write your answer, ___ the graph by studying each part.","o":["analyze","summarize","conclude"],"a":"analyze","say":"Pick the academic word that fits.","how":"Studying each *part* = *analyze*."},{"type":"sort","bins":["Analyze","Infer","Summarize"],"cards":[["Study each part of the graph.",0],["Figure out why Mr. Gross is smiling.",1],["Tell the science fair story in two sentences.",2],["Look at each step of the math problem.",0],["Work out how the boy feels.",1],["Give the main points of the chapter.",2]],"say":"Sort each task by the word it asks for.","how":"*Parts*? *Hidden* meaning? *Main* points?"},{"type":"tiles","w":["The evidence","supports","my conclusion."],"extra":["summarizes"],"say":"Challenge! Build a sentence with two academic words.","how":"What *supports* what?"}]};
  BITE['READ.VOC.L08.05'] = {"band":"M68","pic":"📜","today":"Read phrases that point to famous stories","why":"One short allusion carries a whole story. Know the story, and you get the meaning.","bridge":"READ.VOC.L08.01","bridgeName":"Beyond Literal","done":"An *allusion* points to a famous *story*. Ask what it is *known for*.","board":{"one":"Allusion = a short phrase that points to a famous story. Spot the name, remember the story, ask what it is known for, use it.","activity":"Pairs write a Beacon headline about school life that uses one of the four allusions, then explain it.","mistakes":["Reading the name literally","Forgetting what the story is known for","Missing that the writer does not retell the story"]},"hook":{"kind":"mystery","pic":"🪨","t":"\"Our little team played the champions. It was a Dovid and Golyas match.\"","q":"What does the writer mean?","o":["A small side faced a giant","Two boys named Dovid played","The game was about slingshots"],"pay":"A *small* side faced a *giant*! That is an *allusion*: it points to a *story*."},"learn":[{"t":"An *allusion* points to a famous *story*.","act":{"type":"match","pairs":[["a Dovid and Golyas match","Dovid"],["the patience of Hillel","Hillel"],["an ark-sized project","Noach"]],"say":"Match each *allusion* to the person in its story.","how":"Find the famous *name*."}},{"t":"Spot it: look for a famous *name* or *story*.","act":{"type":"sort","bins":["Allusion","Not an allusion"],"cards":[["It was a Dovid and Golyas match.",0],["The game was close.",1],["He has the patience of Hillel.",0],["He is very patient.",1]],"say":"Does it point to a famous *story*?","how":"Look for a famous *name*."}},{"t":"Then ask: what is the story *known for*?","act":{"type":"match","pairs":[["a Dovid and Golyas match","a small side against a giant"],["the patience of Hillel","amazing patience"],["an ark-sized project","a huge, long job"]],"say":"Match each allusion to its *meaning*.","how":"Remember the story. What is it *known for*?"}},{"who":{"q":"\"Rabbi Rosen has the patience of Hillel.\"","o":[["Avi","Rabbi Rosen is named Hillel"],["Sasson","Rabbi Rosen is very patient"]],"a":1,"why":"Hillel is *famous* for his *patience*."}},{"t":"*Teach it back*: tell your chavrusa the four steps.","m":{"type":"scene","e":"🗣️","t":"Tell your chavrusa: spot the name, remember the story, ask what it is known for, then use it."}}],"play":[{"type":"sort","mis":true,"bins":["Right","Mistake"],"cards":[["A Dovid and Golyas match means a small side faces a giant.",0],["The patience of Hillel means losing your temper fast.",1],["An ark-sized project means a tiny task.",1],["An ark-sized project means a huge, long job.",0]],"say":"Mistake Detective! Right meaning, or a mistake?","how":"What is each story *famous* for?"},{"type":"order","steps":["Spot the famous name.","Remember the story.","Ask what the story is known for.","Use it in the sentence."],"say":"Put the allusion steps in order.","how":"What do you do *after* you spot the name?"},{"type":"cloze","t":"Cleaning the whole shul for Pesach was ___.","o":["an ark-sized project","the patience of Hillel","a Dovid and Golyas match"],"a":"an ark-sized project","say":"Pick the allusion that fits.","how":"Cleaning a whole shul is a *huge, long* job."},{"type":"tiles","w":["Rabbi Rosen","has","the patience","of Hillel."],"extra":["the size"],"say":"Challenge! Build a sentence with an allusion.","how":"Who, *has*, what."}]};
  BITE['READ.VOC.L08.06'] = {"band":"M68","pic":"🎩","today":"Tell the dictionary meaning from the feeling","why":"A fair reporter picks neutral words. A good friend picks kind ones. Both need to hear connotation.","bridge":"READ.VOC.L07.05","bridgeName":"Thrifty or Stingy?","done":"*Denotation* is the meaning. *Connotation* is the feeling. Choose on purpose.","board":{"one":"Denotation = dictionary meaning. Connotation = the feeling a word brings along. Same denotation, different feeling: crowd/mob, determined/stubborn, refined/stuffy.","activity":"Pairs rewrite a loaded sentence (\"The mob swarmed the stubborn guard\") in neutral words for a news report.","mistakes":["Mixing up denotation and connotation","Using a loaded word in a news report","Thinking twins have different dictionary meanings"]},"hook":{"kind":"compare","pic":"👥","t":"\"The crowd gathered.\" \"The mob swarmed.\"","q":"Which one sounds more dangerous?","o":["the crowd","the mob","they sound the same"],"pay":"The *mob*! Same *meaning*, a darker *feeling*."},"learn":[{"t":"*Denotation*: the plain dictionary *meaning*.","act":{"type":"match","pairs":[["denotation","dictionary meaning"],["connotation","feeling a word brings"],["neutral","no strong feeling"]],"say":"Match each *term* to its meaning.","how":"*Meaning* or *feeling*?"}},{"t":"*Connotation*: the *feeling* a word brings.","act":{"type":"sort","bins":["Positive","Neutral","Negative"],"cards":[["respectful",0],["determined",0],["crowd",1],["said",1],["mob",2],["stubborn",2]],"say":"Sort each word by its *connotation*.","how":"*Neutral* words carry no strong feeling."}},{"who":{"q":"What is denotation?","o":[["Ari","the feeling a word carries"],["Menachem","the dictionary meaning"]],"a":1,"why":"The *feeling* is connotation. *Denotation* is the meaning."}},{"t":"*Teach it back*: tell your chavrusa the two words.","m":{"type":"scene","e":"🗣️","t":"Tell your chavrusa: denotation is the meaning, connotation is the feeling. Give one pair, like crowd and mob."}}],"play":[{"type":"sort","mis":true,"bins":["Right","Mistake"],"cards":[["House and home have the same denotation.",0],["Denotation is the feeling a word carries.",1],["Mob has a negative connotation.",0],["Refined has a negative connotation.",1]],"say":"Mistake Detective! Right, or a mistake?","how":"*Denotation* = meaning. *Connotation* = feeling."},{"type":"match","pairs":[["determined","stubborn"],["crowd","mob"],["refined","stuffy"]],"say":"Match each word to its *negative* twin.","how":"Same dictionary meaning, *worse* feeling."},{"type":"cloze","t":"For a fair news report: \"A large ___ came to the siyum.\"","o":["crowd","mob","rabble"],"a":"crowd","say":"Pick the neutral word.","how":"News reports use *neutral* words."},{"type":"tiles","w":["The guests","admired","Zeidy's","refined manners."],"extra":["stuffy manners."],"say":"Challenge! Build a sentence that praises Zeidy.","how":"Praise needs the *positive* twin."}]};
  BITE['READ.VOC.L08.08'] = {"band":"M68","pic":"⚖️","today":"Use the words of a strong argument","why":"Every essay, debate and editorial is built from a claim, evidence, reasoning and a counterclaim.","bridge":"READ.VOC.L07.08","bridgeName":"Academic Words","done":"*Claim*, *evidence*, *reasoning*, *counterclaim*: the parts of a strong argument.","board":{"one":"Claim = your point. Evidence = relevant facts. Reasoning = \"This shows that...\" Counterclaim = the other side, named and answered.","activity":"Teams get a claim about school life and race to write one relevant fact, one reason and one counterclaim with an answer.","mistakes":["Using true but not relevant facts","Skipping the reasoning","Hiding the counterclaim instead of answering it"]},"hook":{"kind":"whatswrong","pic":"📣","t":"Claim: \"Our class should recycle.\" Proof: \"Gavriel has a red backpack.\"","q":"What is wrong with that proof?","o":["It does not connect","It is too short","Nothing is wrong"],"pay":"It does not *connect*! *Evidence* must be *relevant* to the *claim*."},"learn":[{"t":"A strong argument has four *parts*.","act":{"type":"match","pairs":[["claim","the main point you argue"],["evidence","facts that support it"],["reasoning","how the evidence proves it"],["counterclaim","the other side's point"]],"say":"Match each *argument word* to its meaning.","how":"*Point*, *proof*, *how*, *other side*."}},{"t":"*Evidence* must be *relevant*: it connects to the claim.","act":{"type":"sort","q":"Claim: The Beacon should print every week.","bins":["Relevant","Not relevant"],"cards":[["Readers asked for more issues in a survey.",0],["Eli likes blue ink.",1],["Monthly papers miss fresh stories.",0],["The printer is in the basement.",1]],"say":"Sort the *evidence* for the claim.","how":"Does it connect *directly* to the claim?"}},{"who":{"q":"Should strong writers hide the other side?","o":[["Dovi","Yes, never mention it"],["Ezra","No, name it and answer it"]],"a":1,"why":"Name the *counterclaim*, then *answer* it."}},{"t":"*Teach it back*: tell your chavrusa the four parts.","m":{"type":"scene","e":"🗣️","t":"Tell your chavrusa: claim, evidence, reasoning, counterclaim. Make up a tiny argument about Shabbos guests."}}],"play":[{"type":"sort","mis":true,"bins":["Right","Mistake"],"cards":[["A counterclaim is the other side's argument.",0],["Reasoning is the same as a claim.",1],["Evidence must be relevant to the claim.",0],["A good writer hides every counterclaim.",1]],"say":"Mistake Detective! Right, or a mistake?","how":"Strong writers *name* the other side and *answer* it."},{"type":"match","pairs":[["Our class should recycle.","claim"],["We toss 40 bottles a week.","evidence"],["This shows we waste a lot.","reasoning"],["Some say bins cost too much.","counterclaim"]],"say":"Match each sentence to its part of the argument.","how":"*Point*, *proof*, *how*, *other side*."},{"type":"cloze","t":"\"Some say the trip costs too much. ___, the PTA will pay half.\"","o":["However","Because","For example"],"a":"However","say":"Pick the word that answers the counterclaim.","how":"*However* turns from the other side to *your* answer."},{"type":"tiles","w":["Some say","bins cost too much,","but","the city pays for them."],"extra":["so"],"say":"Challenge! Build a counterclaim and its answer.","how":"The *other side* first, then *your* answer."}]};
  BITE['READ.VOC.L09.02'] = {"band":"M68","pic":"🚶","today":"Use the root ced, cede, cess: go","why":"One Latin root unlocks precede, proceed, exceed, process and more.","bridge":"READ.VOC.L09.01","bridgeName":"Shades of Meaning","done":"*Cede* = go. The *prefix* shows the way: before, back, beyond.","board":{"one":"ced/cede/cess = go, yield. pre = before, re = back, se = apart, pro = forward, ex = beyond. -ceed only in proceed, exceed, succeed.","activity":"Teams list every ced/cess word they can find in a Beacon issue and prove each meaning from its prefix.","mistakes":["Mixing up precede (before) and proceed (forward)","Spelling procede or excede","Ignoring the prefix that shows which way"]},"hook":{"kind":"secret","pic":"🌊","t":"Code: cede means go. re means back.","q":"So what do waters do when they \"recede\"?","o":["go back","rise up","freeze"],"pay":"They *go back*! *Cede* = go. The *prefix* shows which way."},"learn":[{"t":"*Cede* means *go*. The *prefix* shows which way.","act":{"type":"parts","parts":["re","cede"],"extra":["pro"],"mean":"go back","roles":["prefix","root"],"say":"Build the word that means *go back*.","how":"*re* = back. *cede* = go."}},{"t":"Change the prefix, change the *direction*.","act":{"type":"match","pairs":[["precede","go before"],["proceed","go forward"],["exceed","go beyond"],["secede","go apart, leave a group"]],"say":"Match each word to its *direction*.","how":"*pre* before, *pro* forward, *ex* beyond, *se* apart."}},{"t":"Spelling: only *proceed*, *exceed*, *succeed* end in -ceed.","act":{"type":"sort","bins":["-cede","-ceed"],"cards":[["precede",0],["proceed",1],["recede",0],["exceed",1],["concede",0],["succeed",1]],"say":"Sort each word by its *spelling*.","how":"Only *three* words end in *-ceed*."}},{"who":{"q":"Spell it: \"We will ___ to the next story.\"","o":[["Shimon","procede"],["Raphael","proceed"]],"a":1,"why":"*Proceed* is one of the three *-ceed* words."}},{"t":"*Teach it back*: tell your chavrusa the root and prefixes.","m":{"type":"scene","e":"🗣️","t":"Tell your chavrusa: cede = go. Then pre, re, ex and pro show which way. Name the three -ceed words."}}],"play":[{"type":"sort","mis":true,"bins":["Right","Mistake"],"cards":[["Recede means go back.",0],["Precede means go after.",1],["Exceed means go beyond.",0],["Secede means join together.",1]],"say":"Mistake Detective! Right meaning, or a mistake?","how":"*Cede* = go. Then check the *prefix*."},{"type":"cloze","t":"Yoni saw he could not win the chess match, so he shook hands to ___ the game.","o":["concede","secede","exceed"],"a":"concede","say":"Fill the gap with the right root word.","how":"*Concede* = give in."},{"type":"tiles","w":["The water","began to","recede","after the storm."],"extra":["exceed"],"say":"Build a sentence where the water goes back.","how":"*Recede* = go *back*."},{"type":"sort","bins":["Before","Back","Beyond"],"cards":[["Lightning precedes thunder.",0],["The tide recedes at night.",1],["The car exceeded the speed limit.",2],["The overture precedes the song.",0],["The crowd receded from the fire.",1],["His answer exceeded every hope.",2]],"say":"Challenge! Which way does each one go?","how":"Find the *prefix*: *pre*, *re*, or *ex*."}]};
  BITE['READ.VOC.L09.03'] = {"band":"M68","pic":"🧰","today":"Choose the best tool for a hard word","why":"Strong readers pick the right tool, then make sure they are right.","bridge":"READ.VOC.L09.02","bridgeName":"Ced, Cede: Go","done":"Pick the *tool*: clue, parts, or dictionary. Then *test* and *verify*.","board":{"one":"Context clue, word parts, dictionary. Then verify: test it in the sentence and check the dictionary.","activity":"Pairs take three hard words from a Beacon article, name the tool each one needs, and verify.","mistakes":["Running to the dictionary before reading the clue","Guessing without testing in the sentence","Missing a prefix or root you already know"]},"hook":{"kind":"challenge","pic":"🧰","t":"\"The outage was unavoidable; nothing could stop the storm.\"","q":"Which tool cracks \"unavoidable\" fastest?","o":["word parts","a dictionary","skip it"],"pay":"*Word parts* (un + avoid + able) work, and so does the clue. Use the tool the word *hands* you."},"learn":[{"t":"Pick the *tool* the word hands you.","act":{"type":"match","pairs":[["The sentence explains the word.","use the context clue"],["The word has parts you know.","use word parts"],["No clue and no parts you know.","use a dictionary"]],"say":"Match each situation to the right *tool*.","how":"*Clue* first, then *parts*, then the *dictionary*."}},{"t":"Every tool ends the same: *test*, then *verify*.","act":{"type":"order","steps":["Look for a context clue.","Look for word parts.","Guess a meaning.","Test it in the sentence.","Check the dictionary."],"say":"Put the *strategy* steps in order.","how":"What must you do *before* you guess?"}},{"who":{"q":"\"The tea was tepid, neither hot nor cold.\" Tepid means?","o":[["Akiva","boiling hot"],["Eliezer","lukewarm"]],"a":1,"why":"*Neither hot nor cold* is the *clue*. Test it!"}},{"t":"*Teach it back*: tell your chavrusa the five steps.","m":{"type":"scene","e":"🗣️","t":"Tell your chavrusa: clue, parts, guess, test, check. Which tool did you use last time you met a hard word?"}}],"play":[{"type":"sort","mis":true,"bins":["Right","Mistake"],"cards":[["No clue in the sentence, so Eli checks the dictionary.",0],["Akiva guesses a meaning and never tests it.",1],["Gavriel sees \"pre\" and \"view,\" so he uses word parts.",0],["The sentence gives examples after \"such as,\" but Yoni ignores them.",1]],"say":"Mistake Detective! Smart strategy, or a mistake?","how":"Use the tool the word *gives* you, then *verify*."},{"type":"cloze","t":"Eli guessed a meaning, so now he must ___ it in the sentence.","o":["test","skip","erase"],"a":"test","say":"Fill the gap with the next step.","how":"First *guess*, then *test*."},{"type":"sort","bins":["Context clue","Word parts","Dictionary"],"cards":[["Bubby's soup was tepid, neither hot nor cold. (tepid)",0],["The water bottle is refillable. (refillable)",1],["Mr. Gross called the plan quixotic. (quixotic)",2],["The sky was overcast; gray clouds hid the sun. (overcast)",0],["Zeidy said the old clock was unreliable. (unreliable)",1],["The rebbe praised the boy's sagacity. (sagacity)",2]],"say":"Which tool does each sentence hand you?","how":"A *clue*? *Parts* you know? If neither, the *dictionary*."},{"type":"match","pairs":[["tepid","lukewarm"],["refillable","can be filled again"],["inaccurate","not correct"]],"say":"Challenge! Match each word to the meaning you worked out.","how":"Remember the *clue* or the *parts*."}]};
  BITE['READ.VOC.L09.04'] = {"band":"M68","pic":"😄","today":"Spot verbal irony and puns","why":"Writers use irony and puns all the time. Catch them, or you miss the meaning.","bridge":"READ.VOC.L09.03","bridgeName":"Clue Strategies","done":"Irony *flips* the meaning. A pun *doubles* it. Keep humor *kind*.","board":{"one":"Verbal irony = saying the opposite of what you mean. Pun = one word, two meanings at once. Kind humor jokes about a situation, never a person.","activity":"Pairs write one kind pun and one line of verbal irony about a Beacon deadline, then swap and label.","mistakes":["Calling any joke a pun","Taking ironic words at face value","Humor that makes fun of a person"]},"hook":{"kind":"riddle","pic":"🏦","t":"\"I used to be a banker, but I lost interest.\"","q":"Why do people smile at this?","o":["Interest has two meanings","The banker is sad","Banks are funny"],"pay":"*Interest* means bank money *and* caring. One word, *two meanings*: a *pun*!"},"learn":[{"t":"*Verbal irony* says the *opposite* of what you mean.","act":{"type":"cloze","t":"Soaked by the rain, Yoni said, \"Just ___ weather for a walk.\"","o":["perfect","terrible","rainy"],"a":"perfect","say":"Fill the gap to make *verbal irony*.","how":"Say the *opposite* of what he means."}},{"t":"A *pun* uses one word with *two meanings*.","act":{"type":"match","pairs":[["dough","bread and money"],["problems","math exercises and troubles"],["interest","bank money and caring"]],"say":"Match each pun word to its *two meanings*.","how":"A pun word means two things *at once*."}},{"who":{"q":"\"What lovely weather!\" said Eli, soaked in a storm.","o":[["Dov","a pun"],["Yitzchak","verbal irony"]],"a":1,"why":"No word has two meanings. He says the *opposite*."}},{"t":"*Teach it back*: irony *flips*, a pun *doubles*.","m":{"type":"scene","e":"🗣️","t":"Tell your chavrusa: irony flips, a pun doubles. Keep humor kind: joke about things, never about people."}}],"play":[{"type":"sort","mis":true,"bins":["Right","Mistake"],"cards":[["\"Great start to the trip!\" after a breakdown = verbal irony",0],["\"The math book looked sad because it had so many problems\" = verbal irony",1],["\"The calendar's days are numbered\" = a pun",0],["\"What lovely weather!\" in a storm = a pun",1]],"say":"Mistake Detective! Right label, or a mistake?","how":"Irony *flips*. A pun *doubles*."},{"type":"tiles","w":["Stuck in traffic,","Mr. Gross said,","\"We are making","great time!\""],"extra":["terrible time!\""],"say":"Build Mr. Gross's ironic line.","how":"The words say the *opposite* of the situation."},{"type":"sort","bins":["Verbal irony","Pun"],"cards":[["Seeing the burnt kugel, Tatty said, \"Just how I like it!\"",0],["The baker needed a vacation, so he took a loaf day.",1],["After a ten-hour bus ride, Avi said, \"That was quick.\"",0],["The bicycle could not stand up; it was two tired.",1]],"say":"Verbal irony, or a pun?","how":"*Opposite*? Irony. *Two meanings*? Pun."},{"type":"tiles","q":"\"The baker stopped baking. He did not have enough dough.\"","w":["Dough","means","bread dough","and also money."],"extra":["only bread."],"say":"Challenge! Build why the dough joke is a pun.","how":"Name *both* meanings."}]};
  BITE['READ.VOC.L09.05'] = {"band": "M68", "pic": "⚖️", "today": "See how word choice makes a side sound good", "why": "Writers win arguments with word choice. A sharp reader sees it happening.", "ready": [{"q": "Which word sounds kinder?", "o": ["slender", "skinny", "bony", "scrawny"], "a": "slender"}], "bridge": "READ.VOC.L09.04", "bridgeName": "Irony and Puns", "watch": {"q": "\"Our firm editor kept the rule; their bullheaded editor would not listen.\"", "m": {"type": "tiles", "w": ["Our firm editor", "kept the rule;", "their bullheaded editor", "would not listen."], "hi": [0]}, "steps": [{"t": "Our side: firm. That sounds good.", "m": {"type": "tiles", "w": ["Our firm editor", "kept the rule;", "their bullheaded editor", "would not listen."], "hi": [0]}}, {"t": "Their side: bullheaded. That sounds bad.", "m": {"type": "tiles", "w": ["Our firm editor", "kept the rule;", "their bullheaded editor", "would not listen."], "hi": [2]}}, {"t": "Same fact: neither editor changed his mind."}, {"t": "Ask: what are the facts under the feelings?"}, {"t": "Teach your chavrusa: loaded words pick a side."}], "a": "Firm and bullheaded share a meaning but not a feeling."}, "oops": {"q": "\"Their thrifty plan saves money.\" The word thrifty...", "wrong": "makes their plan sound bad", "right": "makes their plan sound good", "why": "Thrifty is the positive word. Cheap would make it sound bad."}, "ways": ["worked example", "loaded-word hunt", "match", "sort", "build with tiles", "teach it back", "Mistake Detective"], "done": "You can see how word choice picks a side!", "board": {"one": "Same meaning, different feeling. Positive words for our side, negative for theirs. Ask: what are the facts under the feelings?", "activity": "Pairs rewrite one loaded Beacon editorial sentence twice: once neutral, once for the other side.", "mistakes": ["Taking loaded words as facts", "Thinking twin words mean different things", "Missing praise words used for one's own side"]}, "do": [{"type": "match
