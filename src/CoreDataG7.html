(function () {

    'READ.VOC.L06.03':{name:"Cause and Contrast Clues", teach:[{"how": "A cause clue uses a signal word like because, so, or as a result. The cause and the effect explain each other, so they help you guess a hard word. \"Dovid was exhausted because he stayed up late.\" Staying up late makes you very tired, so exhausted means very tired.", "q": "Avrumi was famished, so he ate two bowls of cholent. What does famished mean?", "o": ["very hungry", "very full", "very sleepy"]}, {"how": "A contrast clue uses a signal word like but, although, or unlike. It tells you the hard word means the opposite of something nearby. \"Unlike his noisy brother, Tzvi Hirsch is placid.\" Placid is the opposite of noisy: calm and quiet.", "q": "Yehuda is usually timid, but today he spoke up in front of the whole class. What does timid mean?", "o": ["shy", "brave", "loud"]}, {"how": "Find the signal word first. Because, so, as a result: a cause clue. But, although, unlike: a contrast clue. Then ask: does the hard word match the idea, or mean the opposite?", "q": "Which word signals a contrast clue?", "o": ["although", "because", "so"]}], practice:[{"t": "sort", "q": "Sort each signal word.", "bins": [{"id": "0", "label": "Cause clue"}, {"id": "1", "label": "Contrast clue"}], "items": [{"label": "because", "bin": "0"}, {"label": "but", "bin": "1"}, {"label": "so", "bin": "0"}, {"label": "although", "bin": "1"}, {"label": "as a result", "bin": "0"}, {"label": "unlike", "bin": "1"}], "h": "Cause words tell why or what happened. Contrast words show an opposite."}, {"t": "pairs", "q": "Match each word from the clue sentences to its meaning.", "pairs": [["famished", "very hungry"], ["placid", "calm and quiet"], ["exhausted", "very tired"], ["timid", "shy"]], "h": "Look back at the signal word in each sentence."}, {"t": "sort", "q": "Mistake Detective: is the meaning right, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "Binyamin was drowsy, so he went to sleep early. Drowsy means sleepy.", "bin": "0"}, {"label": "The path was narrow, but the road was wide. Narrow means wide.", "bin": "1"}, {"label": "Unlike the quiet library, the lunchroom was boisterous. Boisterous means noisy.", "bin": "0"}, {"label": "The milk was spoiled, so we threw it out. Spoiled means fresh.", "bin": "1"}], "h": "Find the signal word. Same idea, or the opposite?"}, {"t": "order", "q": "Build a sentence with a cause clue.", "tiles": ["It was frigid outside,", "so", "Dovid wore", "his warmest coat."], "h": "The cause first, then so, then the effect."}, {"t": "spotall", "q": "Tap every word that signals a contrast.", "cells": [{"label": "but", "ok": true}, {"label": "although", "ok": true}, {"label": "unlike", "ok": true}, {"label": "because", "ok": false}, {"label": "as a result", "ok": false}], "h": "A contrast word shows the opposite is coming."}, {"t": "order", "q": "Build a sentence with a contrast clue.", "tiles": ["Although", "the hill was steep,", "Avrumi", "reached the top."], "h": "Although starts it. A comma ends the first part."}], check:[{"q": "Moshe was jubilant because his team won the game. Which kind of clue helps you with jubilant?", "o": ["a cause clue", "a contrast clue", "no clue at all"]}, {"q": "Eli is frugal, unlike his cousin, who spends every penny. Frugal means ___ spending every penny.", "o": ["the opposite of", "the same as", "the cause of"]}, {"q": "The soup was scalding, so Zeidy let it cool before he served it. What does scalding mean?", "o": ["very hot", "very cold", "very salty"]}], re:[{"q": "The tea was tepid, so Yehuda drank it in one gulp. Which word is the signal?", "o": ["so", "tea", "gulp"], "h": "Look for because, so, or as a result."}, {"q": "Although Binyamin looked calm, he was anxious about the test. What does anxious mean?", "o": ["worried", "calm", "happy"], "h": "Although signals a contrast: the opposite of calm."}, {"q": "Which signal word makes a cause clue?", "o": ["as a result", "but", "unlike"], "h": "Cause words: because, so, as a result."}]},
    'READ.VOC.L06.04':{name:"Two Words, Same Spelling", teach:[{"how": "Homographs are words with the same spelling but different meanings. Many also sound different. Avrumi tied a bow on the gift: this bow rhymes with go. Bow your head: this bow rhymes with cow.", "q": "Avrumi tied a bow on Bubby's gift. How do you say this bow?", "o": ["rhymes with go", "rhymes with cow", "rhymes with toy"]}, {"how": "Let the sentence tell you the meaning and the sound. The wind blew the leaves: wind that rhymes with pinned means moving air. Wind the string around the spool: wind that rhymes with find means to turn or wrap.", "q": "Please wind the string around the stick. Which wind is it?", "o": ["wind that rhymes with find", "wind that rhymes with pinned", "moving air"]}, {"how": "More pairs. Lead that rhymes with seed means to guide. Lead that rhymes with bed is a gray metal. Tear that rhymes with ear is a drop from your eye. Tear that rhymes with bear means to rip. Close that rhymes with nose means to shut. Close with an s sound, as in close by, means near.", "q": "Be careful not to tear the page. Which tear is it?", "o": ["tear that rhymes with bear", "tear that rhymes with ear", "a drop from your eye"]}], practice:[{"t": "sort", "q": "Sort: how do you say bow in each sentence?", "bins": [{"id": "0", "label": "Bow rhymes with go"}, {"id": "1", "label": "Bow rhymes with cow"}], "items": [{"label": "Tie a bow on the gift.", "bin": "0"}, {"label": "Dovid played the violin with a bow.", "bin": "0"}, {"label": "At camp, Binyamin shot an arrow from a bow.", "bin": "0"}, {"label": "Bow your head politely.", "bin": "1"}, {"label": "The bow of the boat cut through the waves.", "bin": "1"}, {"label": "The boys took a bow after the Chanukah play.", "bin": "1"}], "h": "A knot, a violin bow or an arrow bow rhymes with go. Bending forward, or the front of a boat, rhymes with cow."}, {"t": "pairs", "q": "Match each sound to its meaning.", "pairs": [["wind that rhymes with pinned", "moving air"], ["wind that rhymes with find", "to turn or wrap"], ["lead that rhymes with seed", "to guide"], ["lead that rhymes with bed", "a gray metal"]], "h": "Say each word out loud both ways."}, {"t": "sort", "q": "Mistake Detective: is the sound right, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "Mr. Halpern will lead the trip: lead rhymes with seed.", "bin": "0"}, {"label": "A tear rolled down his cheek: tear rhymes with bear.", "bin": "1"}, {"label": "Please close the door: close rhymes with nose.", "bin": "0"}, {"label": "The wind blew hard: wind rhymes with find.", "bin": "1"}], "h": "Find the meaning first. Then pick the sound."}, {"t": "order", "q": "Build a sentence that uses wind two ways.", "tiles": ["The wind", "made me", "wind", "my scarf tighter."], "h": "Moving air comes first. Then the wrapping word."}, {"t": "spotall", "q": "Tap every sentence where tear rhymes with ear.", "cells": [{"label": "A tear fell on his cheek.", "ok": true}, {"label": "Tears of joy filled Zeidy's eyes.", "ok": true}, {"label": "Don't tear the paper.", "ok": false}, {"label": "There is a tear in my coat.", "ok": false}], "h": "A drop from your eye rhymes with ear. A rip rhymes with bear."}, {"t": "pairs", "q": "Match each sound to its meaning.", "pairs": [["close that rhymes with nose", "to shut"], ["close with an s sound", "near"], ["tear that rhymes with ear", "a drop from your eye"], ["tear that rhymes with bear", "to rip"]], "h": "Try each meaning in a sentence."}], check:[{"q": "Bubby asked Chaim to wind the yarn into a ball. How do you say wind here?", "o": ["rhymes with find", "rhymes with pinned", "rhymes with bend"]}, {"q": "Sit close to the front so you can hear the rebbe. What does close mean here?", "o": ["near", "to shut", "far away"]}, {"q": "Two words have the same spelling but different meanings. What are they called?", "o": ["homographs", "synonyms", "antonyms"]}], re:[{"q": "The guide will lead us up the mountain. How do you say lead here?", "o": ["rhymes with seed", "rhymes with bed", "rhymes with lid"], "h": "To guide: lead rhymes with seed."}, {"q": "Shimon has a tear in his sleeve. What does tear mean here?", "o": ["a rip", "a drop from your eye", "a button"], "h": "A tear in a sleeve is a rip. It rhymes with bear."}, {"q": "Which pair are homographs?", "o": ["bow (a knot) and bow (bend forward)", "big and large", "hot and cold"], "h": "Same spelling, different meanings."}]},
    'READ.VOC.L06.05':{name:"Thesaurus Smart", teach:[{"how": "A thesaurus lists synonyms: words that mean almost the same. Look up a plain word to find a stronger one. Thesaurus: big → large, huge, enormous. Said → whispered, shouted, asked.", "q": "What does a thesaurus give you?", "o": ["synonyms: words that mean almost the same", "how to say a word", "the history of a word"]}, {"how": "Synonyms are not exact twins. Always check that it fits the sentence. Thesaurus: walk → stroll, march, tiptoe, stomp. To walk quietly past a sleeping baby, tiptoe fits. Stomp and march are too loud.", "q": "Dovid walked quietly past his sleeping baby brother. Which word fits best?", "o": ["tiptoed", "marched", "stomped"]}, {"how": "Check the feeling too. Some synonyms sound kind, some sound harsh. Smart → bright, sly: bright is a compliment, sly sounds sneaky. Old → antique, worn-out: antique sounds special, worn-out sounds used up.", "q": "Rabbi Feldman wants to praise Eli. Which word fits?", "o": ["bright", "sly", "sneaky"]}], practice:[{"t": "pairs", "q": "Match each plain word to a stronger or more exact synonym.", "pairs": [["big", "enormous"], ["happy", "thrilled"], ["said", "whispered"], ["cold", "freezing"]], "h": "Which word means almost the same, but stronger?"}, {"t": "sort", "q": "Sort: does the new word fit the meaning?", "bins": [{"id": "0", "label": "Fits"}, {"id": "1", "label": "Does not fit"}], "items": [{"label": "The baby is asleep, so Avrumi whispered.", "bin": "0"}, {"label": "The baby is asleep, so Avrumi shouted.", "bin": "1"}, {"label": "Yehuda was starving, so he gobbled his kugel.", "bin": "0"}, {"label": "Yehuda was starving, so he nibbled one crumb.", "bin": "1"}], "h": "Read the whole sentence. Does the word make sense?"}, {"t": "sort", "q": "Mistake Detective: does the word fit the feeling?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "The aroma of fresh challah filled the house.", "bin": "0"}, {"label": "The stink of fresh challah filled the house.", "bin": "1"}, {"label": "Rabbi Feldman praised Eli as a bright student.", "bin": "0"}, {"label": "Rabbi Feldman praised Eli as a sly student.", "bin": "1"}], "h": "Good things need words with a good feeling."}, {"t": "order", "q": "Build the sentence with the word that fits.", "tiles": ["The aroma", "of fresh challah", "filled", "the house."], "h": "Who or what, then what it did."}, {"t": "spotall", "q": "Thesaurus: pleased → glad, cheerful, delighted, smug. Tap every word with a kind feeling.", "cells": [{"label": "glad", "ok": true}, {"label": "cheerful", "ok": true}, {"label": "delighted", "ok": true}, {"label": "smug", "ok": false}], "h": "Smug means too pleased with yourself. It sounds unkind."}, {"t": "pairs", "q": "Match each synonym for walk to its exact meaning.", "pairs": [["tiptoe", "walk very quietly"], ["march", "walk in step, like a parade"], ["stroll", "walk slowly, just relaxing"], ["stomp", "walk with heavy, loud steps"]], "h": "Picture each way of walking."}], check:[{"q": "Thesaurus: said → whispered, shouted, asked. Moshe called to his friend across the big field. Which word fits?", "o": ["shouted", "whispered", "asked"]}, {"q": "You found a new word in the thesaurus. What should you do next?", "o": ["check that it fits the sentence", "use the longest word", "use the first word listed"]}, {"q": "Thesaurus: old → antique, worn-out. Zeidy treasures his beautiful old candlesticks. Which word fits?", "o": ["antique", "worn-out", "broken"]}], re:[{"q": "Thesaurus: walk → stroll, march, tiptoe. The boys walked slowly around the lake, just relaxing. Which word fits?", "o": ["strolled", "marched", "tiptoed"], "h": "Slow and relaxed: stroll."}, {"q": "Why use a thesaurus?", "o": ["to find a stronger word", "to check the spelling", "to find a map"], "h": "It lists synonyms."}, {"q": "Thesaurus: smell → aroma, stink. The kitchen smelled of fresh challah. Which word fits the good feeling?", "o": ["aroma", "stink", "mess"], "h": "Fresh challah smells good. Pick the kind word."}]},
    'READ.VOC.L06.06':{name:"What the Saying Means", teach:[{"how": "An idiom is a group of words that means something different from the words themselves. \"Hit the books\" does not mean hitting anything! It means to study hard. \"A piece of cake\" means very easy.", "q": "Avrumi hit the books all week before the test. What did he do?", "o": ["studied hard", "hit his books", "lost his books"]}, {"how": "A proverb, also called an adage, is a short, well-known saying that gives advice or teaches a truth. \"Practice makes perfect\" means: keep practicing and you will get better. Pirkei Avos has wise sayings too: \"Say little and do much.\"", "q": "What does \"Practice makes perfect\" teach?", "o": ["Keep practicing and you will get better.", "Never practice.", "Only perfect boys practice."]}, {"how": "In a story, use the clues around a saying. Zeidy saw Dovid sneezing and said, \"You look under the weather.\" Dovid is sneezing, so under the weather means sick.", "q": "In that story, what does \"under the weather\" mean?", "o": ["sick", "outside in the rain", "happy"]}], practice:[{"t": "sort", "q": "Sort: idiom or proverb?", "bins": [{"id": "0", "label": "Idiom"}, {"id": "1", "label": "Proverb (adage)"}], "items": [{"label": "hit the books", "bin": "0"}, {"label": "a piece of cake", "bin": "0"}, {"label": "break the ice", "bin": "0"}, {"label": "Practice makes perfect.", "bin": "1"}, {"label": "Actions speak louder than words.", "bin": "1"}, {"label": "Say little and do much.", "bin": "1"}], "h": "An idiom does not mean its exact words. A proverb gives advice."}, {"t": "pairs", "q": "Match each idiom to its meaning.", "pairs": [["a piece of cake", "very easy"], ["hit the books", "study hard"], ["under the weather", "sick"], ["break the ice", "start a friendly talk"]], "h": "Think about what it really means, not the exact words."}, {"t": "sort", "q": "Mistake Detective: is the meaning right, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "The test was a piece of cake: it was very easy.", "bin": "0"}, {"label": "The test was a piece of cake: there was cake at the test.", "bin": "1"}, {"label": "Yehuda broke the ice with the new boy: he started a friendly talk.", "bin": "0"}, {"label": "Shimon was under the weather: he stood in the rain.", "bin": "1"}], "h": "An idiom does not mean its exact words."}, {"t": "order", "q": "Build the proverb.", "tiles": ["Actions", "speak louder", "than", "words."], "h": "What you do comes first."}, {"t": "spotall", "q": "Tap every idiom.", "cells": [{"label": "a piece of cake", "ok": true}, {"label": "break the ice", "ok": true}, {"label": "Practice makes perfect.", "ok": false}, {"label": "Say little and do much.", "ok": false}], "h": "An idiom does not mean its exact words. Proverbs give advice."}, {"t": "pairs", "q": "Match each proverb to its meaning.", "pairs": [["Practice makes perfect.", "Keep practicing and you will get better."], ["Actions speak louder than words.", "What you do shows more than what you say."], ["Say little and do much.", "Promise less and do more."], ["Who is rich? One who is happy with what he has.", "Being happy with what you have makes you rich."]], "h": "What advice does each saying give?"}], check:[{"q": "Chaim never said much, but he set up every chair in the shul. Rabbi Feldman smiled: \"Actions speak louder than words.\" What does the rebbe mean?", "o": ["What you do shows more than what you say.", "Chaim should talk louder.", "Chairs are louder than words."]}, {"q": "The new boy looked lonely, so Yehuda told a funny story to break the ice. What did Yehuda do?", "o": ["started a friendly talk", "cracked ice in a cup", "made the boy cold"]}, {"q": "When Zeidy told stories, Dovid was all ears. What kind of saying is \"all ears\"?", "o": ["an idiom", "a proverb", "a question"]}], re:[{"q": "What does \"hit the books\" mean?", "o": ["study hard", "throw books", "buy books"], "h": "It is an idiom: the words do not mean exactly what they say."}, {"q": "Zeidy said, \"Practice makes perfect.\" What kind of saying is it?", "o": ["a proverb", "an idiom", "a question"], "h": "It gives advice, so it is a proverb."}, {"q": "Shimon is under the weather today. How does he feel?", "o": ["sick", "great", "wet"], "h": "Under the weather means sick."}]},
    'READ.VOC.L06.07':{name:"However, Moreover", teach:[{"how": "Some words tell the reader what kind of idea comes next. Contrast words signal a contrast: a different or surprising idea is coming. They include however, although, and on the other hand.", "q": "Our sukkah is small. ___, it fits the whole family. Which word fits?", "o": ["However", "Moreover", "In addition"]}, {"how": "Addition words signal an addition: one more idea of the same kind is coming. They include moreover, also, and in addition.", "q": "Glen Avenue has a big park. ___, it has a library. Which word fits?", "o": ["Moreover", "However", "On the other hand"]}, {"how": "Commas: when however, moreover, in addition, or on the other hand starts a sentence, put a comma after it. Although starts a part of a sentence, and a comma ends that part: Although it rained, we walked to shul.", "q": "Which is right?", "o": ["However, the bus was late.", "However the bus was late.", "However. The bus was late."]}], practice:[{"t": "sort", "q": "Sort each signal word.", "bins": [{"id": "0", "label": "Contrast"}, {"id": "1", "label": "Addition"}], "items": [{"label": "however", "bin": "0"}, {"label": "moreover", "bin": "1"}, {"label": "although", "bin": "0"}, {"label": "also", "bin": "1"}, {"label": "on the other hand", "bin": "0"}, {"label": "in addition", "bin": "1"}], "h": "Contrast: a different idea. Addition: one more of the same kind."}, {"t": "pairs", "q": "Match each first sentence to the sentence that comes next.", "pairs": [["Zeidy is 80 years old.", "However, he still walks to shul every day."], ["The cholent was hot.", "Moreover, it was delicious."], ["Avrumi finished his homework.", "He also helped his brother with a math problem."]], "h": "Does the next idea surprise you, or add more?"}, {"t": "sort", "q": "Mistake Detective: does the signal word fit?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "The test was hard. However, Eli did well.", "bin": "0"}, {"label": "The test was hard. Moreover, Eli did well.", "bin": "1"}, {"label": "Binyamin sets the table. In addition, he clears it after the meal.", "bin": "0"}, {"label": "Binyamin sets the table. On the other hand, he clears it after the meal.", "bin": "1"}], "h": "Surprise needs contrast. One more of the same needs addition."}, {"t": "order", "q": "Build a sentence with a contrast word.", "tiles": ["Although", "it rained,", "the game", "went on."], "h": "Although starts it. A comma ends the first part."}, {"t": "spotall", "q": "Tap every word that signals an addition.", "cells": [{"label": "moreover", "ok": true}, {"label": "in addition", "ok": true}, {"label": "also", "ok": true}, {"label": "however", "ok": false}, {"label": "although", "ok": false}], "h": "Addition words add one more idea of the same kind."}, {"t": "order", "q": "Build two sentences with an addition word.", "tiles": ["Mr. Halpern", "teaches math.", "Moreover,", "he coaches", "the hockey team."], "h": "First idea, then Moreover with a comma, then one more."}], check:[{"q": "Bubby's apartment is tiny. ___, she hosts twenty guests every Shabbos. Which word fits?", "o": ["However", "Moreover", "Also"]}, {"q": "Dovid finished his chores. ___, he set the table for Shabbos. Which word fits?", "o": ["In addition", "However", "On the other hand"]}, {"q": "The library was closed. On the other hand, the park was open. What does \"On the other hand\" signal?", "o": ["a contrast", "an addition", "a time"]}], re:[{"q": "Which word signals a contrast?", "o": ["however", "moreover", "also"], "h": "Contrast: however, although, on the other hand."}, {"q": "The park has swings. ___, it has a slide.", "o": ["In addition", "However", "Although"], "h": "One more idea of the same kind: addition."}, {"q": "Which is punctuated right?", "o": ["Moreover, the trip was free.", "Moreover the trip was free.", "Moreover. The trip was free."], "h": "Put a comma after moreover."}]},
    'READ.VOC.L07.05':{name:"Thrifty or Stingy?", teach:[{"how": "Two words can mean almost the same thing but carry a different feeling. That feeling is called connotation. Thrifty and stingy both describe someone careful with money. Thrifty gives a positive feeling (wise with money). Stingy gives a negative feeling (will not share).", "q": "Which word gives a positive feeling?", "o": ["thrifty", "stingy", "cheap"]}, {"how": "More word twins: confident means sure of yourself (positive), but arrogant means acting better than everyone else (negative). Curious means eager to learn (positive), but nosy means poking into other people's business (negative).", "q": "Which word gives a negative feeling?", "o": ["nosy", "curious", "eager"]}, {"how": "Some words are neutral: no strong feeling. Aroma is positive, smell is neutral, and stench is negative. Writers pick the word with the feeling they want.", "q": "\"The kitchen was full of the ___ of fresh challah.\" Which word gives the warmest feeling?", "o": ["aroma", "smell", "stench"]}], practice:[{"t": "pairs", "q": "Match each positive word to its negative twin.", "pairs": [["thrifty", "stingy"], ["confident", "arrogant"], ["curious", "nosy"], ["aroma", "stench"]], "h": "Same idea, opposite feeling."}, {"t": "sort", "q": "Sort each word by the feeling it carries.", "bins": [{"id": "0", "label": "Positive feeling"}, {"id": "1", "label": "Negative feeling"}], "items": [{"label": "thrifty", "bin": "0"}, {"label": "confident", "bin": "0"}, {"label": "curious", "bin": "0"}, {"label": "stingy", "bin": "1"}, {"label": "arrogant", "bin": "1"}, {"label": "nosy", "bin": "1"}], "h": "Would you like to be called this? Then it is positive."}, {"t": "sort", "q": "Mistake Detective: right, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "Stingy gives a negative feeling.", "bin": "0"}, {"label": "Nosy gives a positive feeling.", "bin": "1"}, {"label": "Confident gives a positive feeling.", "bin": "0"}, {"label": "Thrifty and stingy have opposite meanings.", "bin": "1"}], "h": "Twins share a meaning. Only the feeling changes."}, {"t": "order", "q": "Build a sentence that praises how Akiva saves.", "tiles": ["Akiva is", "thrifty:", "he saves", "his allowance."], "h": "Praise needs the positive word."}, {"t": "spotall", "q": "\"Eli is a curious reporter, but his rival is nosy and arrogant.\" Tap every word with a negative feeling.", "cells": [{"label": "nosy", "ok": true}, {"label": "arrogant", "ok": true}, {"label": "curious", "ok": false}, {"label": "reporter", "ok": false}], "h": "Would you be upset to be called this word?"}, {"t": "order", "q": "Build the rule.", "tiles": ["Connotation is", "the feeling", "a word", "carries."], "h": "Start with the word you are defining."}], check:[{"q": "Yoni bought a used bike to save money. His father wants to praise him. Which word fits?", "o": ["thrifty", "stingy", "cheap"]}, {"q": "Benny asks the printer many questions because he wants to learn how a paper is made. Which word fits best?", "o": ["curious", "nosy", "arrogant"]}, {"q": "Eli writes a plain news line with no strong feeling: \"Gavriel was ___ of the answer.\" Which word fits?", "o": ["sure", "arrogant", "nosy"]}], re:[{"q": "What is connotation?", "o": ["the feeling a word carries", "the number of letters", "the root of a word"], "h": "Thrifty and stingy: same idea, different feeling."}, {"q": "Which word is the negative twin of confident?", "o": ["arrogant", "curious", "thrifty"], "h": "Acting better than everyone else."}, {"q": "Which word is neutral?", "o": ["smell", "aroma", "stench"], "h": "Neutral = no strong feeling."}]},
    'READ.VOC.L07.06':{name:"The Wind Whispered", teach:[{"how": "Personification gives a human action or feeling to something that is not a person. \"The wind whispered through the trees.\" Wind cannot really whisper; people do. The writer gives the wind a human action.", "q": "In \"The old door groaned,\" what is personified?", "o": ["the door", "groaned", "old"]}, {"how": "To spot it: find the thing, find what it does, and ask, \"Can only a person really do this?\" Human actions like whispered, smiled, danced, grumbled and refused are clues.", "q": "Which sentence uses personification?", "o": ["The sun smiled on the sukkah.", "The sun was bright over the sukkah.", "The sukkah was in the yard."]}, {"how": "Writers use personification to paint a picture and set a mood. \"The wind whispered\" feels gentle. \"The wind howled\" feels wild and scary.", "q": "\"The wind howled all night.\" What mood does it give?", "o": ["wild and scary", "calm and gentle", "silly"]}], practice:[{"t": "pairs", "q": "Match each personification to what really happened.", "pairs": [["The alarm clock screamed.", "The alarm rang loudly."], ["The flowers drank the rain.", "The flowers soaked up the rain."], ["The old car coughed.", "The old car made rough noises."], ["The stars winked at us.", "The stars twinkled."]], "h": "Ask: what did the thing really do?"}, {"t": "sort", "q": "Sort: does a thing act like a person?", "bins": [{"id": "0", "label": "Personification"}, {"id": "1", "label": "Not personification"}], "items": [{"label": "The wind whispered.", "bin": "0"}, {"label": "The wind blew.", "bin": "1"}, {"label": "The leaves danced down the street.", "bin": "0"}, {"label": "The leaves fell on the street.", "bin": "1"}, {"label": "The stars winked at us.", "bin": "0"}, {"label": "The stars were bright.", "bin": "1"}], "h": "Can only a person really do it?"}, {"t": "sort", "q": "Mistake Detective: right, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "\"The moon hid behind a cloud\" is personification.", "bin": "0"}, {"label": "\"The moon was behind a cloud\" is personification.", "bin": "1"}, {"label": "\"The stairs groaned under Zeidy's feet\" is personification.", "bin": "0"}, {"label": "\"Akiva laughed at the joke\" is personification.", "bin": "1"}], "h": "Personification is a thing acting like a person, not a real person."}, {"t": "order", "q": "Build a sentence that personifies the bus.", "tiles": ["The tired", "old bus", "groaned", "up the hill."], "h": "Thing, then its human action, then where."}, {"t": "spotall", "q": "\"The kettle sang on the stove, the rain begged to come in, and Bubby stirred the soup.\" Tap every personification.", "cells": [{"label": "the kettle sang", "ok": true}, {"label": "the rain begged to come in", "ok": true}, {"label": "Bubby stirred the soup", "ok": false}, {"label": "on the stove", "ok": false}], "h": "Bubby is a real person, so she does not count."}, {"t": "order", "q": "Put the spotting steps in order.", "tiles": ["Find the thing.", "Find what it does.", "Ask: can only a person do this?"], "h": "Thing, action, question."}], check:[{"q": "\"The printer refused to work on deadline day.\" What is this?", "o": ["personification", "a plain fact", "an example clue"]}, {"q": "\"The thunder grumbled over the city.\" Which word gives the thunder a human action?", "o": ["grumbled", "thunder", "city"]}, {"q": "Gavriel wants the storm in his story to feel wild and scary. Which verb fits \"The storm ___ at the windows\"?", "o": ["howled", "whispered", "smiled"]}], re:[{"q": "What is personification?", "o": ["giving a human action to a thing", "a word with a negative feeling", "a word root"], "h": "The wind whispered."}, {"q": "Which is personification?", "o": ["The candle danced in the dark.", "The candle was lit.", "The candle was tall."], "h": "Can a candle really dance?"}, {"q": "In \"The leaves danced down the street,\" what is the human action?", "o": ["danced", "leaves", "street"], "h": "Find what the thing does."}]},
    'READ.VOC.L07.08':{name:"Academic Words", teach:[{"how": "Academic words are used in every subject: Chumash, science, history and math. Analyze means break something into parts to understand it. Evidence means facts or proof that support an idea.", "q": "What does \"evidence\" mean?", "o": ["facts that support an idea", "a wild guess", "a short retelling"]}, {"how": "Infer means figure out something that is not said, using clues and what you know. Akiva sees wet coats and dripping umbrellas, so he infers it is raining. Conclude means decide after looking at all the evidence. Your decision is a conclusion.", "q": "Which word means figure out what is not said directly?", "o": ["infer", "summarize", "analyze"]}, {"how": "Summarize means tell only the main points, in a few words. A summary skips the small details. The same five words work in every class, so learn them once and use them everywhere.", "q": "Which word means tell the main points briefly?", "o": ["summarize", "analyze", "infer"]}], practice:[{"t": "pairs", "q": "Match each academic word to its meaning.", "pairs": [["analyze", "break into parts to understand"], ["evidence", "facts that support an idea"], ["infer", "figure out what is not said"], ["summarize", "tell the main points briefly"]], "h": "Think of a class where you used it."}, {"t": "sort", "q": "Sort each task by the academic word it asks for.", "bins": [{"id": "0", "label": "Analyze"}, {"id": "1", "label": "Infer"}, {"id": "2", "label": "Summarize"}], "items": [{"label": "Study each part of the graph.", "bin": "0"}, {"label": "Look at each step of the math problem.", "bin": "0"}, {"label": "Figure out why Mr. Gross is smiling from the clues.", "bin": "1"}, {"label": "Work out how the boy feels, though the story never says.", "bin": "1"}, {"label": "Tell the science fair story in two sentences.", "bin": "2"}, {"label": "Give the main points of the history chapter.", "bin": "2"}], "h": "Parts? Hidden meaning? Main points?"}, {"t": "sort", "q": "Mistake Detective: right, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "A summary tells the main points briefly.", "bin": "0"}, {"label": "Evidence is a guess with no proof.", "bin": "1"}, {"label": "To infer is to copy the words exactly.", "bin": "1"}, {"label": "To conclude is to decide after weighing the evidence.", "bin": "0"}], "h": "Check each word against its meaning."}, {"t": "order", "q": "Put the steps of a good answer in order.", "tiles": ["Read the question.", "Gather evidence.", "Draw a conclusion."], "h": "You need evidence before you can conclude."}, {"t": "spotall", "q": "\"Analyze the chart, then summarize what you found.\" Tap every academic word.", "cells": [{"label": "analyze", "ok": true}, {"label": "summarize", "ok": true}, {"label": "chart", "ok": false}, {"label": "found", "ok": false}], "h": "Find the words from today: analyze, evidence, conclude, infer, summarize."}, {"t": "order", "q": "Build a sentence with two academic words.", "tiles": ["The evidence", "supports", "my conclusion."], "h": "What supports what?"}], check:[{"q": "In history, Rabbi Rosen asks for the main points of a long chapter in three sentences. What must the boys do?", "o": ["summarize", "infer", "analyze"]}, {"q": "In science, Eli measures two plants every day for a month. His measurements are his...", "o": ["evidence", "summary", "conclusion"]}, {"q": "In a story, a boy has red eyes and holds a crumpled tissue. The story never says he cried, but Benny figures it out. Benny...", "o": ["infers", "summarizes", "copies"]}], re:[{"q": "What does \"analyze\" mean?", "o": ["break into parts to understand", "tell the main points", "guess with no clues"], "h": "Think of studying each part of a graph."}, {"q": "After weighing all the evidence, you...", "o": ["conclude", "summarize", "copy"], "h": "Your decision is a conclusion."}, {"q": "Which word means tell only the main points?", "o": ["summarize", "evidence", "infer"], "h": "A summary skips the small details."}]},
    'READ.VOC.L08.05':{name:"Allusions", teach:[{"how": "An allusion is a short phrase that points to a famous story. The writer does not retell it; the reader already knows it. In Tanach, Dovid, a young shepherd, defeated the giant Golyas with a sling and a stone. So \"a Dovid and Golyas match\" (in English, a David and Goliath match) means a small side faces a much bigger one.", "q": "What does \"a Dovid and Golyas match\" mean?", "o": ["a small side faces a much bigger one", "two teams of the same size", "a game played with stones"]}, {"how": "Hillel was famous for his patience. A man once came to him again and again with silly questions, trying to make him angry, and Hillel answered each one calmly. So \"the patience of Hillel\" means amazing patience.", "q": "\"Mr. Gross has the patience of Hillel.\" What does it mean?", "o": ["he is amazingly patient", "he is very old", "he asks many questions"]}, {"how": "Noach built a huge ark over many years, so \"an ark-sized project\" means a huge job that takes a long time. Yaakov gave Yosef a special, colorful coat, so \"a coat of many colors\" means a very colorful coat. To read an allusion: spot the famous name, remember the story, ask what the story is known for.", "q": "\"Building the new shul library was an ark-sized project.\" What does it mean?", "o": ["a huge job that took a long time", "a project about boats", "a small, quick job"]}], practice:[{"t": "pairs", "q": "Match each allusion to its meaning.", "pairs": [["a Dovid and Golyas match", "a small side against a giant"], ["the patience of Hillel", "amazing patience"], ["an ark-sized project", "a huge, long job"], ["a coat of many colors", "a very colorful coat"]], "h": "Remember the story. What is it known for?"}, {"t": "sort", "q": "Sort: does it point to a famous story?", "bins": [{"id": "0", "label": "Allusion"}, {"id": "1", "label": "Not an allusion"}], "items": [{"label": "It was a Dovid and Golyas match.", "bin": "0"}, {"label": "The game was close.", "bin": "1"}, {"label": "He has the patience of Hillel.", "bin": "0"}, {"label": "He is very patient.", "bin": "1"}, {"label": "Painting the shul was an ark-sized project.", "bin": "0"}, {"label": "Painting the shul took weeks.", "bin": "1"}], "h": "Look for a famous name or story."}, {"t": "sort", "q": "Mistake Detective: right meaning, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "A Dovid and Golyas match means a small side faces a giant.", "bin": "0"}, {"label": "The patience of Hillel means losing your temper fast.", "bin": "1"}, {"label": "An ark-sized project means a tiny task.", "bin": "1"}, {"label": "A coat of many colors means a very colorful coat.", "bin": "0"}], "h": "What is each story famous for?"}, {"t": "order", "q": "Put the allusion steps in order.", "tiles": ["Spot the famous name.", "Remember the story.", "Ask what the story is known for.", "Use it in the sentence."], "h": "Name, story, known for, use."}, {"t": "spotall", "q": "\"Our small team faced the champions in a Dovid and Golyas match, and the coach showed the patience of Hillel.\" Tap every allusion.", "cells": [{"label": "a Dovid and Golyas match", "ok": true}, {"label": "the patience of Hillel", "ok": true}, {"label": "our small team", "ok": false}, {"label": "the champions", "ok": false}], "h": "Look for the famous stories."}, {"t": "order", "q": "Build a sentence with an allusion.", "tiles": ["Rabbi Rosen", "has", "the patience", "of Hillel."], "h": "Who, has, what."}], check:[{"q": "The tiny Beacon newsletter took on the city's biggest paper in a writing contest. Which allusion fits?", "o": ["a Dovid and Golyas match", "the patience of Hillel", "a coat of many colors"]}, {"q": "Akiva answered the same question from his little brother twenty times, calmly and kindly. Which allusion fits?", "o": ["the patience of Hillel", "an ark-sized project", "a Dovid and Golyas match"]}, {"q": "Gavriel's family spent a whole summer building a giant model of the Beis Hamikdash. Which allusion fits?", "o": ["an ark-sized project", "a coat of many colors", "the patience of Hillel"]}], re:[{"q": "What is an allusion?", "o": ["a short phrase that points to a famous story", "a word with a negative feeling", "a thing acting like a person"], "h": "The writer points; the reader remembers."}, {"q": "\"Eli's scarf was a coat of many colors.\" What does it mean?", "o": ["it was very colorful", "it was very old", "it was too big"], "h": "Yosef's special, colorful coat."}, {"q": "Who defeated the giant Golyas with a sling and a stone?", "o": ["Dovid", "Hillel", "Noach"], "h": "A young shepherd."}]},
    'READ.VOC.L08.06':{name:"Refined, Polite, Respectful", teach:[{"how": "Every word has a denotation: its dictionary meaning. Many words also have a connotation: the feelings and ideas a word brings along. House and home have the denotation \"a place where people live,\" but home brings warmth and family.", "q": "What is the denotation of a word?", "o": ["its dictionary meaning", "the feeling it gives", "its root"]}, {"how": "Words can share the denotation but differ in connotation. Refined and stuffy both describe very formal, proper manners, but refined praises and stuffy complains. Determined and stubborn both mean not giving up, but determined praises and stubborn complains. Polite and respectful are positive words for good manners.", "q": "Which word praises Zeidy's elegant manners?", "o": ["refined", "snobbish", "stuffy"]}, {"how": "Writers choose connotation to fit their purpose. A news reporter uses neutral words: \"The crowd gathered.\" A writer who dislikes the people might write: \"The mob swarmed.\" The facts are the same; the denotation is the same; the feeling changes.", "q": "Which is the most neutral for a news report?", "o": ["The crowd gathered.", "The mob swarmed.", "The rabble stormed in."]}], practice:[{"t": "pairs", "q": "Match each word to its negative twin (same denotation).", "pairs": [["determined", "stubborn"], ["crowd", "mob"], ["refined", "stuffy"], ["thrifty", "stingy"]], "h": "Same dictionary meaning, worse feeling."}, {"t": "sort", "q": "Sort each word by its connotation.", "bins": [{"id": "0", "label": "Positive"}, {"id": "1", "label": "Neutral"}, {"id": "2", "label": "Negative"}], "items": [{"label": "respectful", "bin": "0"}, {"label": "determined", "bin": "0"}, {"label": "crowd", "bin": "1"}, {"label": "said", "bin": "1"}, {"label": "mob", "bin": "2"}, {"label": "stubborn", "bin": "2"}], "h": "Neutral words carry no strong feeling."}, {"t": "sort", "q": "Mistake Detective: right, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "House and home have the same denotation.", "bin": "0"}, {"label": "Denotation is the feeling a word carries.", "bin": "1"}, {"label": "Mob has a negative connotation.", "bin": "0"}, {"label": "Refined has a negative connotation.", "bin": "1"}], "h": "Denotation = dictionary meaning. Connotation = feeling."}, {"t": "order", "q": "Build the rule.", "tiles": ["Denotation is", "the dictionary", "meaning", "of a word."], "h": "Start with the word you are defining."}, {"t": "spotall", "q": "\"A rabble of fans pushed in, and the stubborn referee sneered.\" Tap every word with a negative connotation.", "cells": [{"label": "rabble", "ok": true}, {"label": "stubborn", "ok": true}, {"label": "sneered", "ok": true}, {"label": "referee", "ok": false}], "h": "Would a fair reporter use this word?"}, {"t": "order", "q": "Build a sentence that praises Zeidy.", "tiles": ["The guests", "admired", "Zeidy's", "refined manners."], "h": "Who admired what?"}], check:[{"q": "Benny writes \"The crowd waited outside the hall.\" Yoni writes \"The mob waited outside the hall.\" What is the same in both words?", "o": ["the denotation", "the connotation", "the feeling"]}, {"q": "Akiva writes a tribute to Zeidy, who never gave up learning even when it was hard. Which word fits best?", "o": ["determined", "stubborn", "pigheaded"]}, {"q": "Eli quotes the fire chief in a fair, neutral Beacon report on the Lag Ba'omer parade. Which verb fits: \"The fire chief ___ that the street will close at noon\"?", "o": ["said", "sneered", "whined"]}], re:[{"q": "What is connotation?", "o": ["the feelings a word brings along", "the dictionary meaning", "the spelling"], "h": "Home brings warmth."}, {"q": "Which word has a negative connotation?", "o": ["stuffy", "refined", "respectful"], "h": "Which one complains?"}, {"q": "Crowd and mob share the same...", "o": ["denotation", "connotation", "feeling"], "h": "Same dictionary meaning."}]},
    'READ.VOC.L08.08':{name:"Academic Words 7", teach:[{"how": "A claim is the main point a writer argues: \"Our school should start a recycling program.\" Evidence is the facts, numbers or examples that support the claim.", "q": "What is a claim?", "o": ["the main point a writer argues", "a fact or number", "the other side's point"]}, {"how": "Reasoning explains how the evidence proves the claim. It often starts \"This shows that...\" Evidence must be relevant: it connects directly to the claim. If it does not connect, it is not relevant.", "q": "Claim: \"The Beacon should print every week.\" Which evidence is relevant?", "o": ["Readers asked for more issues in a survey.", "Eli likes blue ink.", "The Beacon logo is a lighthouse."]}, {"how": "A counterclaim is the other side's argument. Strong writers name it and then answer it, often with but or however: \"Some say bins cost too much, but the city pays for them.\" Answering a counterclaim makes your claim stronger.", "q": "What is a counterclaim?", "o": ["the other side's argument", "your main point", "a fact that supports you"]}], practice:[{"t": "pairs", "q": "Match each argument word to its meaning.", "pairs": [["claim", "the main point you argue"], ["evidence", "facts that support it"], ["reasoning", "how the evidence proves it"], ["counterclaim", "the other side's point"]], "h": "Point, proof, how, other side."}, {"t": "sort", "q": "Claim: \"The Beacon should print every week.\" Sort the evidence.", "bins": [{"id": "0", "label": "Relevant"}, {"id": "1", "label": "Not relevant"}], "items": [{"label": "Readers asked for more issues in a survey.", "bin": "0"}, {"label": "Weekly papers report events while they are still news.", "bin": "0"}, {"label": "Monthly papers miss fresh stories.", "bin": "0"}, {"label": "Eli likes blue ink.", "bin": "1"}, {"label": "The printer is in the basement.", "bin": "1"}, {"label": "The Beacon logo is a lighthouse.", "bin": "1"}], "h": "Does it connect directly to the claim?"}, {"t": "sort", "q": "Mistake Detective: right, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "A counterclaim is the other side's argument.", "bin": "0"}, {"label": "Reasoning is the same as a claim.", "bin": "1"}, {"label": "Evidence must be relevant to the claim.", "bin": "0"}, {"label": "A good writer hides every counterclaim.", "bin": "1"}], "h": "Strong writers name the other side and answer it."}, {"t": "order", "q": "Put the parts of an argument in order.", "tiles": ["State your claim.", "Give evidence.", "Explain your reasoning."], "h": "Point, proof, how it proves."}, {"t": "spotall", "q": "Claim: \"Our class should start a recycling program.\" Tap every piece of relevant evidence.", "cells": [{"label": "The class throws away 40 bottles a week.", "ok": true}, {"label": "Recycling one bottle saves energy.", "ok": true}, {"label": "Gavriel has a red backpack.", "ok": false}, {"label": "The room was painted last year.", "ok": false}], "h": "Ask: does it connect to recycling?"}, {"t": "order", "q": "Build a counterclaim and its answer.", "tiles": ["Some say", "bins cost too much,", "but", "the city pays for them."], "h": "The other side first, then but, then your answer."}], check:[{"q": "Akiva argues the Beacon should add a puzzle page. Mr. Gross says a puzzle page would take space from the news. In Akiva's essay, Mr. Gross's point is...", "o": ["a counterclaim", "his claim", "his reasoning"]}, {"q": "Yoni writes: \"This shows that a sports page would bring in more readers.\" That sentence is his...", "o": ["reasoning", "counterclaim", "evidence"]}, {"q": "Claim: \"The shul should have a longer kiddush on Shabbos.\" Benny adds, \"The shul's carpet is blue.\" What is wrong with that evidence?", "o": ["it is not relevant", "it is a counterclaim", "it is too long"]}], re:[{"q": "What is evidence?", "o": ["facts that support the claim", "the other side's point", "the main point"], "h": "Facts, numbers, examples."}, {"q": "Which words often start reasoning?", "o": ["This shows that...", "Some say...", "Once upon a time..."], "h": "Reasoning explains how the evidence proves the claim."}, {"q": "Evidence that connects directly to the claim is...", "o": ["relevant", "a counterclaim", "a summary"], "h": "If it does not connect, it is not relevant."}]},
    'READ.VOC.L09.02':{name:"Ced, Cede: Go", teach:[{"how": "The Latin root \"ced,\" \"cede\" or \"cess\" comes from cedere: to go, or to yield (give way). A prefix tells which way. Precede = go before, so it comes before (pre = before), recede = go back (re = back), secede = go apart, leave a group (se = apart). In 1860 and 1861, eleven Southern states seceded from the United States.", "q": "What does \"recede\" mean?", "o": ["go back", "go before", "go apart"]}, {"how": "The same root shows up as \"ceed\" and \"cess.\" Proceed = go forward (pro = forward). Exceed = go beyond (ex = out, beyond). Succeed = come next after (the son succeeded his father as rav); it also means do well. A process is a way of going forward, step by step, and a procession is a group going forward together.", "q": "What does \"exceed\" mean?", "o": ["go beyond", "go back", "go before"]}, {"how": "Cede also means yield, give way. To concede is to give in, or admit the other side is right. Spelling rule: only three common words end in -ceed: proceed, exceed, succeed. The others end in -cede: precede, recede, secede, concede.", "q": "Which spelling is right?", "o": ["proceed", "procede", "proseed"]}], practice:[{"t": "pairs", "q": "Match each prefix to its meaning.", "pairs": [["pre-", "before"], ["re-", "back"], ["se-", "apart"], ["ex-", "beyond"], ["pro-", "forward"]], "h": "Think of preview, return, exit, proceed."}, {"t": "sort", "q": "Sort each word by its spelling.", "bins": [{"id": "0", "label": "-cede"}, {"id": "1", "label": "-ceed"}], "items": [{"label": "precede", "bin": "0"}, {"label": "proceed", "bin": "1"}, {"label": "recede", "bin": "0"}, {"label": "exceed", "bin": "1"}, {"label": "concede", "bin": "0"}, {"label": "succeed", "bin": "1"}], "h": "Only proceed, exceed and succeed end in -ceed."}, {"t": "sort", "q": "Mistake Detective: right meaning, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "Recede means go back.", "bin": "0"}, {"label": "Precede means go after.", "bin": "1"}, {"label": "Exceed means go beyond.", "bin": "0"}, {"label": "Secede means join together.", "bin": "1"}], "h": "Cede = go. Then check the prefix."}, {"t": "order", "q": "Build a sentence where the water goes back.", "tiles": ["The water", "began to", "recede", "after the storm."], "h": "Recede = go back."}, {"t": "spotall", "q": "\"At the hachnasas sefer Torah, the procession preceded the meal, and the crowd exceeded two hundred.\" Tap every word built on the root that means go.", "cells": [{"label": "procession", "ok": true}, {"label": "preceded", "ok": true}, {"label": "exceeded", "ok": true}, {"label": "meal", "ok": false}, {"label": "crowd", "ok": false}], "h": "Look for ced, cede, ceed or cess."}, {"t": "order", "q": "Build what \"exceed\" means.", "tiles": ["to go", "beyond", "a limit"], "h": "Ex = beyond, ceed = go."}], check:[{"q": "\"On Friday night, Kabbalas Shabbos precedes Maariv.\" Precedes tells you Kabbalas Shabbos...", "o": ["comes before", "comes after", "goes apart"]}, {"q": "The bakery sold more challos than its goal. Which word fits: \"Its sales ___ the goal\"?", "o": ["exceeded", "receded", "conceded"]}, {"q": "Akiva writes, \"The siyum will ___ the seudah.\" Which spelling is right?", "o": ["precede", "preceed", "presede"]}], re:[{"q": "What does \"precede\" mean?", "o": ["to go before", "to go back", "to go beyond"], "h": "Pre = before. Whatever precedes something comes before it."}, {"q": "Which word means \"give in, admit the other side is right\"?", "o": ["concede", "secede", "exceed"], "h": "Cede also means yield."}, {"q": "Which word ends in -ceed?", "o": ["succeed", "recede", "concede"], "h": "Only proceed, exceed and succeed."}]},
    'READ.VOC.L09.03':{name:"Clue Strategies", teach:[{"how": "Meet an unknown word? You have three tools. Tool 1 is a context clue: the sentence or paragraph explains the word. \"The rink was frigid, so cold our fingers went numb.\" The clue \"so cold\" tells you frigid means very cold.", "q": "In \"The rink was frigid, so cold our fingers went numb,\" which tool does the sentence hand you?", "o": ["a context clue", "word parts", "nothing at all"]}, {"how": "Tool 2 is word parts: a prefix, root or suffix you know. \"Unbreakable\" = un (not) + break + able (can be), so it means cannot be broken. Use word parts when the sentence gives no clue but the word is built from parts you know: unavoidable, inaccurate, refillable.", "q": "\"The new phone case is unbreakable.\" There is no clue in the sentence. Which tool helps?", "o": ["word parts", "a context clue", "nothing helps"]}, {"how": "Tool 3 is the dictionary: use it when there is no clue and no parts you know, and always to verify a guess. The full order: look for a context clue, look for word parts, guess a meaning, test it in the sentence, check the dictionary.", "q": "\"The rebbe gave a cogent answer.\" No clue, and no parts you know. What should you do?", "o": ["look it up in a dictionary", "skip the word", "guess and move on"]}], practice:[{"t": "pairs", "q": "Match each situation to the right move.", "pairs": [["The sentence explains the word.", "use the context clue"], ["The word has parts you know.", "use word parts"], ["No clue and no parts you know.", "use a dictionary"], ["You made a guess.", "verify it"]], "h": "Clue, parts, dictionary, then verify."}, {"t": "sort", "q": "Which tool does each sentence hand you?", "bins": [{"id": "0", "label": "Context clue"}, {"id": "1", "label": "Word parts"}, {"id": "2", "label": "Dictionary"}], "items": [{"label": "Bubby's soup was tepid, neither hot nor cold. (tepid)", "bin": "0"}, {"label": "The Beacon's first report was inaccurate. (inaccurate)", "bin": "1"}, {"label": "Mr. Gross called the plan quixotic. (quixotic)", "bin": "2"}, {"label": "Eli was elated, as happy as he had ever been. (elated)", "bin": "0"}, {"label": "The water bottle is refillable. (refillable)", "bin": "1"}, {"label": "The speaker used an esoteric term. (esoteric)", "bin": "2"}], "h": "Clue in the sentence? Parts you know? If neither, the dictionary."}, {"t": "sort", "q": "Mistake Detective: smart strategy, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "No clue in the sentence, so Eli checks the dictionary.", "bin": "0"}, {"label": "Akiva guesses a meaning and never tests it.", "bin": "1"}, {"label": "Gavriel sees \"pre\" and \"view,\" so he uses word parts.", "bin": "0"}, {"label": "The sentence gives examples after \"such as,\" but Yoni ignores them.", "bin": "1"}], "h": "Use the tool the word gives you, then verify."}, {"t": "order", "q": "Put the strategy steps in order.", "tiles": ["Look for a context clue.", "Look for word parts.", "Guess a meaning.", "Test it in the sentence.", "Check the dictionary."], "h": "Clue, parts, guess, test, check."}, {"t": "spotall", "q": "\"The headline was misleading, but the article was accurate and fair.\" Tap every clue that helps with misleading.", "cells": [{"label": "mis- (wrongly)", "ok": true}, {"label": "but ... accurate and fair", "ok": true}, {"label": "headline", "ok": false}, {"label": "the article", "ok": false}], "h": "Sometimes two tools work together: parts and a contrast clue."}, {"t": "order", "q": "Test your guess: put lukewarm in place of tepid.", "tiles": ["The soup", "was lukewarm,", "neither hot nor cold."], "h": "If the sentence still makes sense, the guess passes."}], check:[{"q": "\"After the long fast, Dovid was famished; he ate three bowls of soup.\" Which tool does this sentence hand you?", "o": ["a context clue", "word parts", "a dictionary"]}, {"q": "\"Mr. Gross bought nonflammable decorations for the sukkah.\" The sentence has no clue. Which tool should Benny try next?", "o": ["word parts", "a context clue", "skip the word"]}, {"q": "Yoni guessed that \"ominous\" means threatening. What should he do now?", "o": ["verify it", "stop reading", "pick a new word"]}], re:[{"q": "The sentence explains the hard word. Which tool?", "o": ["a context clue", "word parts", "a dictionary"], "h": "Read the words around it."}, {"q": "No clue and no parts you know. Which tool?", "o": ["a dictionary", "a context clue", "word parts"], "h": "The dictionary always works."}, {"q": "What is the last step after you guess and test?", "o": ["check the dictionary", "skip the word", "read faster"], "h": "Clue, parts, guess, test, check."}]},
    'READ.VOC.L09.04':{name:"Irony and Puns", teach:[{"how": "Verbal irony is saying the opposite of what you mean. Soaked in the rain with no umbrella, Eli says, \"What lovely weather!\" The words say one thing; he means the opposite of what he says. The situation and his tone show the real meaning.", "q": "Soaked in the rain, Eli says, \"What lovely weather!\" What does he really mean?", "o": ["The weather is bad.", "The weather is lovely.", "He wants more rain."]}, {"how": "A pun is a joke that uses a word with two meanings at once. \"I used to be a banker, but I lost interest.\" Interest is the money a bank pays, and interest is caring about something. Both meanings fit, so it is a pun.", "q": "In \"The baker quit because he could not make enough dough,\" which word is the pun?", "o": ["dough", "baker", "quit"]}, {"how": "Tell them apart: verbal irony flips the meaning; a pun doubles it. Keep humor kind: joke about a situation, never to make fun of a person.", "q": "Which is the kind way to joke?", "o": ["Joke about a situation.", "Make fun of a classmate.", "Laugh at someone's mistake."]}], practice:[{"t": "pairs", "q": "Match each term to its meaning.", "pairs": [["verbal irony", "saying the opposite of what you mean"], ["pun", "a word with two meanings at once"], ["tone", "how the words are said"]], "h": "Irony flips. A pun doubles."}, {"t": "sort", "q": "Sort each line: verbal irony or a pun?", "bins": [{"id": "0", "label": "Verbal irony"}, {"id": "1", "label": "Pun"}], "items": [{"label": "After the bus broke down, Yoni said, \"Great start to the trip!\"", "bin": "0"}, {"label": "The baker quit because he could not make enough dough.", "bin": "1"}, {"label": "The old calendar's days are numbered.", "bin": "1"}, {"label": "Facing a huge pile of homework, Benny said, \"Oh, a light evening.\"", "bin": "0"}, {"label": "The math book looked sad because it had so many problems.", "bin": "1"}, {"label": "The kugel came out burnt black, and the cook sighed, \"Well, that went perfectly.\"", "bin": "0"}], "h": "Opposite of what he means? Irony. One word, two meanings? Pun."}, {"t": "sort", "q": "Mistake Detective: right label, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "\"Great start to the trip!\" after a breakdown = verbal irony", "bin": "0"}, {"label": "\"The math book looked sad because it had so many problems\" = verbal irony", "bin": "1"}, {"label": "\"The calendar's days are numbered\" = a pun", "bin": "0"}, {"label": "\"What lovely weather!\" in a storm = a pun", "bin": "1"}], "h": "Irony flips. A pun doubles."}, {"t": "order", "q": "Build why the dough joke is a pun.", "tiles": ["Dough", "means", "bread dough", "and also money."], "h": "Name both meanings."}, {"t": "spotall", "q": "Tap every line that uses verbal irony.", "cells": [{"label": "\"What lovely weather!\" (in a storm)", "ok": true}, {"label": "\"Oh, a light evening.\" (huge pile of homework)", "ok": true}, {"label": "\"What a fine day!\" (sunny and warm)", "ok": false}, {"label": "\"This soup is delicious.\" (he asks for more)", "ok": false}], "h": "Do the words match the situation? If not, it is irony."}, {"t": "order", "q": "Build Mr. Gross's line of verbal irony.", "tiles": ["Stuck in traffic,", "Mr. Gross said,", "\"We are making", "great time!\""], "h": "The words say the opposite of the situation."}], check:[{"q": "The power went out during the storm, and Akiva said, \"Well, this is convenient.\" This is...", "o": ["verbal irony", "a pun", "a definition clue"]}, {"q": "\"The tailor was well suited for his job.\" This line is...", "o": ["a pun", "verbal irony", "not a joke at all"]}, {"q": "Eli's team lost 10 to 0, and he says, \"We really crushed it today.\" He means...", "o": ["the opposite of what he says", "exactly what he says", "two meanings at once"]}], re:[{"q": "Saying the opposite of what you mean is...", "o": ["verbal irony", "a pun", "a fact"], "h": "The words and the meaning do not match."}, {"q": "A word with two meanings at once makes...", "o": ["a pun", "verbal irony", "a rhyme"], "h": "Dough: bread and money."}, {"q": "\"The math book looked sad because it had so many problems.\" Which word is the pun?", "o": ["problems", "math", "book"], "h": "Math problems, and troubles."}]},
    'READ.VOC.L09.05':{name:"Firm or Bullheaded?", teach:[{"how": "Two words can share a basic meaning (denotation) but carry different feelings (connotation). Firm and bullheaded both mean not changing your mind. Firm sounds good; bullheaded sounds bad.", "q": "Which word makes \"not changing your mind\" sound good?", "o": ["firm", "bullheaded", "stubborn"]}, {"how": "In an argument, a writer often picks positive words for his own side and negative words for the other side. \"Our plan is thrifty; theirs is cheap.\" Thrifty and cheap both mean spending little, but thrifty sounds good and cheap sounds bad.", "q": "\"Our plan is thrifty; theirs is cheap.\" Which word makes a side sound good?", "o": ["thrifty", "cheap", "plan"]}, {"how": "A careful reader spots loaded words and asks: what are the facts under the feelings? A fair writer uses neutral words, like \"spends little,\" and gives reasons, not just loaded words.", "q": "Which choice is neutral?", "o": ["spends little", "thrifty", "cheap"]}], practice:[{"t": "pairs", "q": "Match each positive word to its negative twin.", "pairs": [["firm", "bullheaded"], ["thrifty", "cheap"], ["confident", "arrogant"], ["curious", "nosy"]], "h": "Same basic meaning, different feeling."}, {"t": "sort", "q": "Sort each word by its feeling.", "bins": [{"id": "0", "label": "Sounds good"}, {"id": "1", "label": "Sounds bad"}, {"id": "2", "label": "Neutral"}], "items": [{"label": "thrifty", "bin": "0"}, {"label": "cheap", "bin": "1"}, {"label": "spends little", "bin": "2"}, {"label": "firm", "bin": "0"}, {"label": "bullheaded", "bin": "1"}, {"label": "does not change his mind", "bin": "2"}], "h": "Praise, put-down, or plain fact?"}, {"t": "sort", "q": "Mistake Detective: right, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "\"The council's bold plan\" makes the plan sound good.", "bin": "0"}, {"label": "\"The council's reckless plan\" makes the plan sound good.", "bin": "1"}, {"label": "\"Our curious reporters\" makes the reporters sound good.", "bin": "0"}, {"label": "\"Their nosy reporters\" makes the reporters sound good.", "bin": "1"}], "h": "Bold and curious praise. Reckless and nosy put down."}, {"t": "order", "q": "Build Akiva's line defending his own team.", "tiles": ["Our team is", "determined,", "not", "stubborn."], "h": "His own side gets the positive word."}, {"t": "spotall", "q": "\"The Beacon's brave editors exposed the scheme, while the other paper's timid staff stayed silent.\" Tap every loaded word.", "cells": [{"label": "brave", "ok": true}, {"label": "scheme", "ok": true}, {"label": "timid", "ok": true}, {"label": "editors", "ok": false}, {"label": "silent", "ok": false}], "h": "Which words add praise or a put-down?"}, {"t": "order", "q": "Build a neutral sentence about the plan.", "tiles": ["The new plan", "costs less", "than last year's."], "h": "Just the fact, no loaded words."}], check:[{"q": "Mr. Gross writes, \"Our generous budget helps every class.\" Generous makes the budget sound...", "o": ["good", "bad", "neutral"]}, {"q": "Eli wants the other side's plan to sound bad. Which word fits: \"their ___ plan\"?", "o": ["reckless", "bold", "careful"]}, {"q": "An editorial is full of loaded words. What should a careful reader ask?", "o": ["What are the facts under the feelings?", "Which side has longer words?", "How many pages is it?"]}], re:[{"q": "Firm and bullheaded both mean not changing your mind. Which sounds bad?", "o": ["bullheaded", "firm", "both the same"], "h": "Bullheaded is a put-down."}, {"q": "Which is the positive twin of \"nosy\"?", "o": ["curious", "pushy", "cheap"], "h": "Both want to know things."}, {"q": "A fair writer uses...", "o": ["neutral words and reasons", "only loaded words", "only put-downs"], "h": "Facts, not just feelings."}]},
    'READ.VOC.L09.06':{name:"Academic Words 8", teach:[{"how": "A source is where information comes from: a book, an article, an interview. When you use a source, you cite it: you name where the information came from. \"According to the shul's records, the building is 90 years old.\" That sentence cites a source.", "q": "What does it mean to cite a source?", "o": ["name where the information came from", "copy it word for word", "throw it away"]}, {"how": "Credible means believable, able to be trusted (cred = believe). A credible source is expert, careful and checkable. To paraphrase is to say a source's idea in your own words, and still cite it. What you write is a paraphrase.", "q": "Which source is most credible for a report on the shul's history?", "o": ["the shul's own records", "a rumor in the hallway", "a guess from a friend"]}, {"how": "To synthesize is to put ideas from several sources together into one new understanding (syn = together). \"Zeidy's story and the old newspaper both show that the shul was rebuilt after the fire.\" That sentence synthesizes two sources.", "q": "Using ideas from three sources to write one conclusion is called...", "o": ["synthesizing", "paraphrasing", "citing"]}], practice:[{"t": "pairs", "q": "Match each research word to its meaning.", "pairs": [["source", "where information comes from"], ["cite", "name the source"], ["credible", "able to be trusted"], ["paraphrase", "say it in your own words"], ["synthesize", "combine ideas from several sources"]], "h": "Cred = believe, syn = together."}, {"t": "sort", "q": "Sort each source: credible or not?", "bins": [{"id": "0", "label": "Credible"}, {"id": "1", "label": "Not credible"}], "items": [{"label": "an encyclopedia article", "bin": "0"}, {"label": "an interview with the shul's founder", "bin": "0"}, {"label": "a science museum's guide", "bin": "0"}, {"label": "a rumor in the hallway", "bin": "1"}, {"label": "an unsigned post with no facts", "bin": "1"}, {"label": "a guess from a friend", "bin": "1"}], "h": "Expert, careful, checkable?"}, {"t": "sort", "q": "Mistake Detective: right meaning, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "Paraphrase means say it in your own words.", "bin": "0"}, {"label": "Cite means copy without naming the source.", "bin": "1"}, {"label": "Synthesize means combine ideas from several sources.", "bin": "0"}, {"label": "Credible means hard to believe.", "bin": "1"}], "h": "Cred = believe, syn = together."}, {"t": "order", "q": "Build a sentence that cites a source.", "tiles": ["According to", "the shul's records,", "the building", "is 90 years old."], "h": "\"According to\" names the source."}, {"t": "spotall", "q": "\"According to Zeidy and the old newspaper, the shul was rebuilt in one year.\" Tap every source.", "cells": [{"label": "Zeidy", "ok": true}, {"label": "the old newspaper", "ok": true}, {"label": "the shul", "ok": false}, {"label": "one year", "ok": false}], "h": "A source is where the information comes from."}, {"t": "order", "q": "Build a sentence that synthesizes two sources.", "tiles": ["Both", "Zeidy's story", "and the newspaper", "show the shul was rebuilt."], "h": "Both ... and ... puts them together."}], check:[{"q": "Akiva writes, \"As the Beacon's survey reports, most boys walk to school.\" Naming the survey is a way to...", "o": ["cite a source", "paraphrase a poem", "synthesize two sources"]}, {"q": "Benny retells a long paragraph's idea in his own words and names the source. He has written...", "o": ["a paraphrase", "a synthesis", "a rumor"]}, {"q": "An article by a bird expert, with facts you can check, is...", "o": ["credible", "paraphrased", "synthesized"]}], re:[{"q": "Where information comes from is called a...", "o": ["source", "citation", "summary"], "h": "A book, article or interview."}, {"q": "Credible means...", "o": ["able to be trusted", "hard to find", "very long"], "h": "Cred = believe."}, {"q": "Combining ideas from several sources is...", "o": ["synthesizing", "paraphrasing", "citing"], "h": "Syn = together."}]}
