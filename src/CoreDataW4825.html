    {how:'The Beacon’s final issue has one page left, and every article must fit. Gavriel’s job: make each sentence CONCISE: the same meaning in the fewest words. He hunts DEADWOOD, words that do no work. Kind 1: a WORDY PHRASE, a long way to say a short thing. “in order to” becomes “to.” (You learned “in order to” as a linking word. It still works, but “to” does the same job.) “due to the fact that” becomes “because.” “at this point in time” becomes “now.” “The fact that” can almost always go: “The fact that the sale raised $640 surprised us” becomes “The sale’s $640 surprised us.” Kind 2: an EMPTY WORD: “very,” “really,” “basically,” “actually.” Cut it, or trade two words for one strong one: “very tired” becomes “exhausted.”', q:'Gavriel’s line: “In order to fit the page, we cut two photos.” What does “In order to” become?', o:['To','Because','Now']},
    {how:'Kind 3: SAID TWICE. Some phrases say one idea two times: “past history” (all history is past), “end result,” “free gift,” “each and every,” “7 p.m. in the evening.” Keep one. A whole sentence can be said twice too: “The siyum was on Thursday. It took place on Thursday.” Cut the copy. In Precise and Technical (Grade 7) you chose the exact topic word, and in Voice (this year) you chose words that sound like you. Now you go further: in every sentence, you take out the words that do no work.', q:'Yoni’s line: “The end result was a full page.” Which word says the idea a second time, and can go?', o:['end','result','page']},

  'WRIT.ESSAY.L09.07':{name:'Editor’s Desk',
