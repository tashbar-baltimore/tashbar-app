   A.busy / A.err and the map home's buttons are exactly as before; this file only draws a 3D world behind them and restyles them.

      each number shoots a comet into space and lights a spinning 3D gem; a wrong code makes a red burst.

      ("Warp speed! Opening your day...") with a soft whoosh (only when the boy's sound is on).
   4. THE WELCOME: the jump ends in a 3D burst of gems; his name flies in letter by letter out of deep space; a gyroscope with his
      first letter spins where the sun was; his streak / next step / bank swing in as glass panels.
   5. THE MAP HOME: the same map home (GameMap.html: 4 tabs, one PLAY, nothing removed) floating in the galaxy: glass panels, a tilted
      3D path, a hologram goal card that tilts with the pointer, and a glass dock.
   Safety: never on a K-1 boy's game path (K1Only), never in a lesson (the canvas stops, so lessons run at full speed), pauses when the
   tab is hidden, draws less on a slow Chromebook, no flashing (nothing blinks or strobes), and "reduce motion" gets a still picture.
   Off switch: window.TL_W3D = false. Joined to the boy page by sgQuest_ (StaffGrid.js), after SignInEnergy.
   No double slash in this file (HtmlService rule). */

function P(x,y,z){ var f=F()/z; return [VW/2+(x-cam.x*260)*f, VH*.46+(y-cam.y*170)*f, f]; }

function drawStars(dt){ var f=F(), move=spd*dt*.9, warp=spd>6, cxx=VW/2, cyy=VH*.46, ox=cam.x*260, oy=cam.y*170;
 var paths=[[],[],[],[],[]];
 for(var i=0;i<stars.length;i++){ var s=stars[i]; s.z-=move; if(s.z<20){ star(s,true); continue; }
  var k=f/s.z, X=cxx+(s.x-ox)*k, Y=cyy+(s.y-oy)*k; if(X<-50||X>VW+50||Y<-50||Y>VH+50){ if(s.z<ZF*.5) star(s,true); continue; }

   for(var j=0;j<p.length;j+=3){ var m=p[j+2]/(p[j+2]+Math.min(900,spd*34)); cx.moveTo(p[j],p[j+1]); cx.lineTo(cxx+(p[j]-cxx)*m,cyy+(p[j+1]-cyy)*m); }

  for(var q=0;q<p.length;q+=3){ var d=1-p[q+2]/ZF, sz=.5+d*d*3.4; cx.globalAlpha=Math.min(1,.15+d*1.1); cx.fillRect(p[q]-sz/2,p[q+1]-sz/2,sz,sz); } }

var gph=0;

 cx.strokeStyle=g; cx.lineWidth=1.2; cx.beginPath();
 for(i=-18;i<=18;i++){ var X=i*Hf*1.4; cx.moveTo(vx+X*f/near,hz+Hf*f/near); cx.lineTo(vx+X*f/far,hz+Hf*f/far); }

 if(mode==='warp'){ var k=Math.min(1,warpT/1400); r0*=1+k*k*5; X+= (X-VW/2)*k*2; Y+=(Y-VH/2)*k*2; }

 for(var i=0;i<glyphs.length;i++){ var g=glyphs[i]; g.z-=spd*dt*.45; g.r+=g.vr*dt*.001; if(g.z<160){ glyph(g,true); continue; }
  var p=P(g.x,g.y,g.z), sc=p[2]*g.s*.9, w=96*sc, sx=Math.cos(g.r); if(w<3||p[0]<-w||p[0]>VW+w||p[1]<-w||p[1]>VH+w) continue;

 for(var i=0;i<parts.length;i++){ var p=parts[i]; p.x+=p.vx*dt; p.y+=p.vy*dt+.00008*dt*dt*0; p.vy+=.0009*dt; p.z+=p.vz*dt; p.l-=dt*.00055; p.r+=dt*.01; if(p.l<=0||p.z<30) continue; keep.push(p);

 spd+=(spdT-spd)*Math.min(1,dt*(spdT>spd?.0022:.0035)); if(mode==='warp') warpT+=dt; else if(warpT>0) warpT=Math.max(0,warpT-dt*2);

/* ---------- the screens ---------- */
var SPD={si:.7,warp:16,wel:1.4,home:.35};
