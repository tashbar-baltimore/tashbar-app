  UP['LANG.GRAM.L08.01'] = {"band": "M68", "pic": "🧱", "today": "Build complex sentences with a dependent clause", "why": "Complex sentences show how ideas connect: why, when, even though. Good news stories need them.", "ready": [{"q": "Which group of words has a subject and a verb?", "o": ["when the bell rang", "after the long game", "in the newsroom"], "a": "when the bell rang"}], "bridge": "LANG.GRAM.L08.03", "bridgeName": "Phrase or Clause?", "watch": {"q": "Although the printer jammed, Akiva finished the paper.", "m": {"type": "tiles", "w": ["Although the printer jammed,", "Akiva finished the paper."], "hi": [0]}, "steps": [{"t": "\"Akiva finished the paper\" stands alone. It is an independent clause.", "m": {"type": "tiles", "w": ["Although the printer jammed,", "Akiva finished the paper."], "hi": [1]}}, {"t": "\"Although the printer jammed\" leans. It leaves you waiting. It is a dependent clause."}, {"t": "Leaning words start dependent clauses. Pick the one for the link: because or since = why; when, after or until = time; although = a surprise."}, {"t": "Dependent clause first? Comma where it ends. Grade 7 move: two equal ideas, compound; one depends on the other, complex."}, {"t": "Teach it back: tell your chavrusa how to spot the leaning part and where the comma goes."}], "a": "Complex = one independent clause + one dependent clause."}, "oops": {"q": "\"The game ended, and we cheered.\" Is it complex?", "wrong": "Yes: it has two clauses", "right": "No: it is compound", "why": "Both parts stand alone, joined by and. A complex sentence needs one part that leans."}, "ways": ["worked example", "stand or lean test", "sort", "sentence combining", "evidence tap", "fill the gap", "teach it back", "Mistake Detective"], "done": "You can build complex sentences and place the comma right!", "board": {"one": "Independent = stands alone. Dependent = leans (although, because, when, if, since). Complex = one of each. Dependent first? Comma.", "activity": "Boys hold two sentence strips and join them with a leaning-word card, then read the new sentence aloud.", "mistakes": ["Calling a compound sentence complex", "A comma inside the dependent clause", "Leaving a dependent clause alone as a sentence"]}, "do": [{"type": "sort", "bins": ["Stands alone", "Leans (dependent)"], "cards": [["the votes were counted", 0], ["since the vote was close", 1], ["Yoni asked a question", 0], ["until the bell rang", 1]], "say": "Can it stand alone, or does it lean?", "how": "Read it alone. Does it leave you waiting?"}, {"type": "combine", "mis": true, "a": "The interview ran long.", "b": "Yoni had many questions.", "o": ["because", "and", "but"], "j": "because", "say": "Make it complex. Pick the leaning word.", "how": "And and but join two that stand. Which word leans?", "why": {"q": "Why is and the wrong pick?", "o": ["And keeps both parts standing: compound, not complex.", "And is too short.", "And needs a comma."], "a": "And keeps both parts standing: compound, not complex."}}], "your": [{"type": "tiles", "w": ["When the paper came out,", "the whole school", "read it."], "extra": ["When the paper came out"], "say": "Build it with the dependent clause first.", "how": "Leaning part, comma, then the part that stands."}, {"type": "evidence", "q": "Which one is a complex sentence?", "p": ["Gavriel took the photo.", "Gavriel took the photo, and Eli wrote the caption.", "After Gavriel took the photo, Eli wrote the caption."], "a": 2, "look": "one part that leans", "say": "Tap the complex sentence.", "how": "Find a part that starts with a leaning word."}, {"type": "cloze", "t": "___ the deadline was close, the editors stayed calm.", "o": ["Even though", "And", "But"], "a": "Even though", "say": "Pick the word that makes the first part lean.", "how": "And and but cannot start a leaning part."}, {"type": "evidence", "q": "Which sentence shows the surprise best?", "p": ["The press broke, and the paper came out on time.", "Although the press broke, the paper came out on time.", "The press broke. The paper came out on time."], "a": 1, "look": "a leaning word that shows the surprise", "say": "Tap the sentence that shows the link best.", "how": "Which word tells the reader this was unexpected?"}, {"type": "combine", "a": "Benny ate supper.", "b": "He came home from shul.", "o": ["after", "although", "unless"], "j": "after", "say": "Join them into one complex sentence.", "how": "Which leaning word shows the time order?"}]};
  UP['LANG.GRAM.L08.02'] = {"band": "M68", "pic": "🔧", "today": "Put describing words right next to what they describe", "why": "A misplaced modifier can make a news story say something silly, or something wrong.", "ready": [{"q": "In \"the boy with the camera,\" what does \"with the camera\" describe?", "o": ["the boy", "the camera", "nothing"], "a": "the boy"}], "bridge": "LANG.SENT.L05.03", "bridgeName": "Add a Phrase", "watch": {"q": "Racing to the printer, the papers fell from Akiva's hands.", "m": {"type": "tiles", "w": ["Racing to the printer,", "the papers", "fell from Akiva's hands."], "hi": [1]}, "steps": [{"t": "Ask: who was racing? The word right after the comma must be that person."}, {"t": "Here it says the papers were racing. Silly! The describing part dangles."}, {"t": "Fix it: put the racer right after the comma.", "m": {"type": "tiles", "w": ["Racing to the printer,", "Akiva", "dropped the papers."], "hi": [1]}}, {"t": "Little words move meaning too. \"Only Eli saw the photo\": nobody else. \"Eli saw only the photo\": nothing else."}, {"t": "Teach it back: tell your chavrusa the \"who is doing it?\" test."}], "a": "Racing to the printer, Akiva dropped the papers."}, "oops": {"q": "Hanging on the wall, Gavriel saw the old photo.", "wrong": "Fine: we know what he means", "right": "Gavriel saw the old photo hanging on the wall.", "why": "Gavriel was not hanging on the wall! Put the photo next to its describing part."}, "ways": ["worked example", "who is doing it? test", "Mistake Detective", "build with tiles", "listen", "evidence tap", "teach it back"], "done": "You can put every describing part next to the word it describes!", "board": {"one": "An opening -ing part describes the word right after the comma. Ask: who is doing it? Put only, just, almost right before the word they limit.", "activity": "Boys act out a silly dangling sentence, then fix it so the right person does the action.", "mistakes": ["An opening -ing part with no person after the com
