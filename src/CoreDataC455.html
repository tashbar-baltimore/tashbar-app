(function () {
  var P = {
    c45_esrogcase: { title: 'The Empty Silver Box', text: 'Three days before Sukkos, Rabbi Feldman brought a beautiful esrog to his fourth-grade class in Baltimore. A friend had grown it on his own tree in Eretz Yisrael. The rebbe set it in a silver box on his desk and told the boys, "Look with your eyes, not with your fingers."\nAfter recess, the box was empty.\nThe whole class was upset. Tzvi Hirsch said that Nosson, the new boy from Montreal, must have taken it. Nosson\'s face turned red, but he said nothing.\nYehuda Benaim opened his notebook and wrote down clues. The rebbe\'s hat was gone, but his coat was still on his chair. A trail of leaves went up the stairs. Avrumi drew a map of every clue.\nThe boys followed the trail to the third floor. There, Mr. Gomez the custodian told them he had seen the rebbe carry something upstairs, wrapped in a handkerchief.\nBack in class, Rabbi Feldman told the truth. He had touched the esrog, seen a tiny spot, and rushed upstairs to ask Rav Mizrachi if it was still hadar. Behind the radiator, the boys found the note he had left: "Back soon. The esrog is with me."' },
    c45_windalarm: { title: 'The Wind Alarm', text: 'On Monday of Chol Hamoed, the sky over Baltimore was gray, and the trees were already swaying. The six boys walked together to Rabbi Feldman\'s sukkah. Dovid carried a shoebox very carefully, as if it held eggs.\nInside the box was a small machine: a toy fan on a stick, a wire, a battery and a buzzer. "It is a wind alarm," Dovid explained. "The radio said a big wind is coming this afternoon. When the wind gets strong, the buzzer goes off. Then you know to bring the decorations inside." He had built it the night before.\nRabbi Feldman put the alarm on the roof of the sukkah. Then each boy took a turn to hold the lulav and esrog and say the bracha.\nJust as Yehuda finished, the alarm buzzed loudly. The branches on the roof began to toss, and a paper chain snapped loose.\n"Quick, the decorations!" shouted Binyamin. The boys grabbed the pictures, the paper chains and the cushions and carried them into the house. A minute later, the wind roared through the yard, but everything was safe and dry.\n"Dovid," said the rebbe, smiling, "this year the wind did not catch us by surprise."' },
    c45_flattire: { title: 'The Flat Tire', text: 'On a Sunday morning in spring, Eli Rosen and his Zeidy rode their bikes along the path by Lake Roland. The sun was warm, and the ducks were busy in the water.\nHalfway around the lake, Eli heard a loud pop. His front tire was flat. They were far from home, and Zeidy\'s car was in the shop.\nFirst, they tried to push the bikes, but the flat tire wobbled and scraped. Then Zeidy remembered that his friend Reb Mordechai lived on a street near the lake. They walked the bikes slowly up the hill and knocked on his door.\nReb Mordechai came out with a smile and a small box. Inside was a patch kit. He showed Eli how to find the hole by pushing the tube under a bucket of water and watching for bubbles. Eli glued on the patch himself, and Zeidy pumped the tire full of air.\nThey rode home just in time for lunch. That night, Eli asked his Abba for a patch kit of his own, to keep in his bike bag.' },
    c45_apology: { title: 'I Was Wrong', text: 'The boys were back in their seats, but nobody was reading. Now they knew the rebbe had carried the esrog upstairs himself.\nTzvi Hirsch had been quiet for a long time, which was not like him. That morning, in front of the whole class, he had said that Nosson took the esrog.\nTzvi Hirsch turned around in his chair. His ears were red. "Nosson," he said, "I said you took it. In front of everybody. I was wrong."\nNosson shrugged one shoulder. "You didn\'t know."\n"I didn\'t know," said Tzvi Hirsch, "and I said it anyway. That\'s worse. I\'m sorry."\nFor a second, Nosson did not answer. Then he smiled, a real smile, all the way up to his eyes. "In Montreal," he said, "my rebbe used to say: a good detective looks at all the clues before he decides."\n"Then I\'m a very bad detective," said Tzvi Hirsch, and everyone laughed, even him.\nAcross the room, Avrumi added a tiny handkerchief to his map. He checked it twice against his notes before he put down his pencil.' },
    c45_drawing: { title: 'Avrumi\'s Drawing', text: 'Six boys leaned over Avrumi\'s drawing of the esrog. Near the top, beside the little stem, one dot was colored in dark.\n"Why did you color that one in?" asked Yehuda.\n"Because I saw a tiny speck right there," said Avrumi. "I drew it the way it looked."\n"Maybe your pencil slipped," said Tzvi Hirsch.\nAvrumi did not get angry. He opened his math book and showed them his other drawings from that day: the clock, the bus, the window. Every line was neat. There was not a single stray mark.\n"Okay," said Tzvi Hirsch. "I take it back. Your pencil doesn\'t slip."\nBinyamin had not said a word. While the others talked over each other, he sat with his hands folded and looked at the drawing for a long time. "Before we decide," he said at last, "let\'s hear what Mr. Abergel thinks. He knows esrogim."\nYehuda flipped through his notebook, page after page, until he found the line he wanted. "Flax," he read out loud. "It sticks to everything."' },
    c45_snowwalk: { title: 'The First Snow', text: 'The first snow of the winter fell all night on Glen Avenue. In the morning, Akiva Stern looked out the window and saw that the sidewalk was buried.\nNext door lived old Mr. Fishman, who walked with a cane. Akiva knew he went to shul every morning at seven.\nAkiva pulled on his boots, took the big shovel from the porch, and went outside before breakfast. He did not shovel his own steps first. He started with Mr. Fishman\'s.\nThe snow was wet and heavy. Akiva\'s arms ached, and twice he slipped and fell into the drift. Each time, he brushed himself off and kept going.\nWhen the path was clear, Akiva put the shovel back and went inside, quiet as a mouse.\nAt a quarter to seven, Mr. Fishman opened his door. He looked at the clean path and the small boot prints that led to the house next door, and he smiled all the way to shul.' },
    c45_upstairs: { title: 'Why the Rebbe Ran', text: 'Rabbi Feldman stood next to his desk with one hand on the white handkerchief.\n"This morning," he said, "I told you to look with your eyes, not with your fingers. Then, during recess, I wanted to see the bottom of the esrog. Just for a second. So I picked it up with my thumb."\nWhen he put it down, he saw a tiny dark spot, right where his thumb had been.\n"I was very worried," the rebbe said. "An esrog with a mark might not be hadar, beautiful enough for the mitzvah, anymore. And this esrog was a gift from my friend in Eretz Yisrael, who grew it on his own tree." So he wrapped it in his handkerchief, grabbed his hat and ran upstairs to ask Rav Mizrachi. He was in such a hurry that he forgot his coat.\n"Rebbe," said Nosson quietly, "we heard you upstairs. You said the boys must never find out what you did."\nRabbi Feldman gave a small, tired laugh. "I was embarrassed," he said. "I taught you not to touch the esrog, and I was the one who touched it. But Rav Mizrachi told me that a rebbe who tells the truth about his mistake teaches his talmidim two things. So I am telling you the truth."' },
    c45_longway: { title: 'The Long Way Home', text: 'For a whole week, Moishe Klein walked home from school the long way, down Fallstaff Road, instead of cutting through the park.\n"Why do you go that way?" asked his friend Shimon. "The park is twice as fast."\nMoishe only shrugged.\nOn Thursday, Shimon walked with him. Halfway down Fallstaff Road, a boy in a blue jacket came out of a gate and fell into step beside Moishe. It was Elchanan, the new boy who had moved from England. He had no brothers in the school, and he did not know anyone on his street yet.\nThe three boys walked slowly, talking about soccer and the new math book. At Elchanan\'s corner, they waved goodbye.\n"I remember my first week here," Moishe told Shimon. "I walked home alone every day, and it felt like the longest walk in the world. I did not want Elchanan to feel that way."\nOn Friday, Shimon walked the long way too.' },
    c45_rightwrong: { title: 'What We Got Right', text: 'The six boys sat on the floor by the radiator, holding the yellow note Dovid had fished out.\n"Let\'s see what we got right," said Avrumi. He unfolded his map, covered with arrows and tiny drawings. "The hat was gone, but the coat was here. We said that meant the rebbe was somewhere close. Right."\n"The leaves on the stairs went up," said Dovid. "We said he went upstairs. Right."\n"And we said I stole it," said Nosson in a small voice. "Wrong."\nTzvi Hirsch turned red to the tips of his ears. "I said that. Not everybody. Me." He looked at the floor. "I decided first and looked for clues later. Every clue I skipped would have told me the truth."\n"You said sorry already," said Nosson.\nTzvi Hirsch took a deep breath. "Next time, I am going to look at all the clues before I decide. Even when I am sure. Especially when I am sure."\nBinyamin nodded slowly. "My Zeidy says the same thing about chess. Look at the whole board before you move."' },
    c45_farmer: { title: 'The Esrog Farmer', text: 'Rabbi Feldman put his phone on the desk, and a warm, crackly voice filled the room. It was Reb Elazar, the man who grew the esrog, calling from his farm in the north of Eretz Yisrael.\n"On my farm," he said, "we also have to be detectives. Esrog trees have sharp thorns. The wind can push a young esrog against a thorn and scratch it. So we tie the branches carefully, and we check every esrog almost every day, from the time it is as small as a pea."\n"How do you know which esrog to send?" asked Binyamin.\n"I look, and I look again, in the morning light and the evening light," said Reb Elazar. "When I am not sure, I do what your rebbe did. I ask a Rav." He paused. "A good farmer is not ashamed to ask. And it sounds like a good rebbe is not ashamed either."\nRabbi Feldman smiled and looked down at his desk.' },
    c45_lantern: { title: 'The Sukkah Lantern', text: 'Ezra Dweck wanted to build the sukkah lantern all by himself this year. He was nine now, and he was sure he could do it.\n"Do you want me to hold the sides?" asked his big brother Pinchas.\n"No, thank you," said Ezra. "I can do it alone."\nHe cut four paper walls and tried to tape them into a square. Every time he taped one corner, another corner fell down. He tried again and again. After an hour, the table was covered with torn paper, and the lantern was still flat.\nEzra sat down and sighed. Through the window, he could see Pinchas hanging paper chains in the sukkah.\nFinally, Ezra went outside. "Pinchas," he said quietly, "can you hold the corners while I tape them?"\nWith four hands instead of two, the lantern stood up in five minutes. That night, it glowed over the sukkah table.\n"Next year," said Ezra, "let\'s build two."' }
