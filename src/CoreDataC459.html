(function () {
  var P = {
    c45_rcmarks: { title: 'The Blue Marks', text: 'Avrumi Katz and Tzvi Hirsch Gold were hiking up Ridge Trail with Avrumi\'s Abba. Every few minutes, they passed a tree with a bright blue mark painted on its bark. "Those blue marks show the trail," Abba said. "As long as we see them, we are not lost."\nNear the top, the path split in two. One path went up over the rocks. The other went down into the trees. Tzvi Hirsch ran ahead up the rocky path. "This way!" he called.\nAvrumi did not move. He studied the trees. On the rocky path, there were no marks at all. But on an oak tree beside the lower path, he spotted a faded blue stripe. From somewhere below came the sound of rushing water. Avrumi unfolded his map. The trail line crossed a creek before it reached the lookout.\n"Tzvi Hirsch!" Avrumi called. "I think the trail goes down, not up."\nTzvi Hirsch climbed back, a little out of breath. They took the lower path. Soon the trees opened up, and there was the creek, with flat stepping stones across it. On the other side, a fresh blue mark shone on a birch tree.\n"You were right," said Tzvi Hirsch. "Next time, I will look before I run."\nAbba smiled. "A good hiker reads the clues, just like a good reader."' },
    c45_rcsefer: { title: 'Who Fixes the Sefarim?', text: 'Every week, the old sefarim on the back shelf of the Glen Avenue shul fell apart a little more. Covers hung loose. Pages slipped out. Then, one Monday morning, Yehuda Benaim found a surprise. Three torn sefarim had new, strong green covers.\n"Who fixed them?" Yehuda whispered to Nosson Abergel.\nNosson looked around. "The shul is locked every night," he said. "Only Reb Hillel the shamash has the key." Every window was shut tight, too.\nOn Wednesday, two more sefarim had green covers. Yehuda took out his clue notebook and wrote: Green covers. Locked doors. Who has a key?\nThat afternoon, Nosson noticed a small strip of green tape stuck to Reb Hillel\'s coat sleeve. A little pot of glue peeked out of his pocket.\nOn Thursday night, the boys came back after Maariv to learn. A light was on in the small room next to the library. They peeked in. Reb Hillel sat at a table with a stack of sefarim, a roll of green tape and a brush of glue.\n"So you found me," he laughed. "A sefer is too precious to throw away. I fix a few every night."\n"Can we help?" asked Nosson. Reb Hillel smiled and slid the tape across the table.' },
    c45_rcfair: { title: 'The Flood at the Science Fair', text: 'Dovid Lerner had worked for three weeks on his science fair project: a machine that watered a plant all by itself. A plastic bottle hung upside down over a pot of basil. A thin tube carried water from the bottle to the soil, one drop at a time.\nOn the morning of the fair, the gym was full of tables. Mr. Halpern, the judge, walked from project to project with his clipboard.\nDovid squeezed the bottle to start the water. Nothing happened. He squeezed harder. Pop! The tube flew off. Water sprayed across the table, soaked his poster and dripped onto Binyamin\'s shoes.\nDovid\'s face went red. He wanted to hide under the table.\nMr. Halpern walked over. He looked at the puddle. Then he looked at Dovid. "So," he said, "what did you learn?"\nDovid took a deep breath. "The tube was too loose," he said slowly. "When I squeezed, the pressure pushed it off. Next time, I will clamp it tight and let gravity do the work."\nMr. Halpern wrote something on his clipboard. "That," he said, "is what a real scientist says."\nThat night, Dovid fixed his machine with a small metal clamp. All week long, the basil on his windowsill got its water one drop at a time.' },
    c45_rcgeese: { title: 'Why Geese Fly in a V', text: 'In the fall, you may hear honking high above Baltimore. Look up, and you will see a flock of Canada geese flying south in the shape of a giant V. Why do they fly that way?\nScientists have found that the V shape saves energy. When a goose flaps its wings, it stirs up the air behind it. Some of that moving air swirls upward. The goose flying just behind and to the side rides on that rising air. Because of this lift, each goose can fly farther without getting as tired.\nThe goose at the front of the V works the hardest. It has no rising air to ride on. When the leader gets tired, it drops back, and another goose takes its place at the front.\nThe V shape also helps the geese keep track of each other. Each goose can see the others clearly, so the flock stays together.\nGeese honk as they fly. Some scientists think the honking helps the flock stay in touch and keep a steady pace.\nA trip south can be more than a thousand miles. By taking turns at the front, the whole flock makes it.' },
    c45_rccanoe: { title: 'The Canoe Trip', text: 'On the third day of camp, Binyamin Yusupov and Tzvi Hirsch Gold set out across Pine Lake in a red canoe with their counselor, Reb Akiva. Binyamin\'s Zeidy had taught him a strong sailor\'s knot, and Binyamin had practiced it all summer.\nThe lake was calm. Halfway across, Reb Akiva pointed to the far shore. "Get ready," he said. "We have a portage ahead."\nTzvi Hirsch frowned. "A what?"\nThey soon found out. The lake ended at a strip of rocky land. On the other side, a second lake sparkled through the trees. At a portage, there is no water to paddle on, so you must lift the canoe out and carry it over land to the next lake.\nThe boys unloaded the packs. Then all three of them flipped the canoe upside down and lifted it onto their shoulders. Under the canoe, it was dark and echoey, like a tunnel. Tzvi Hirsch started to sing, and his voice boomed.\nAt the second lake, they slid the canoe back into the water. A ranger was standing by the dock with a rope in his hands. "Can anyone tie a knot that holds?" he asked. "Every knot I try slips."\nBinyamin smiled and stepped forward.' },
    c45_rcclock: { title: 'The Clock That Stopped', text: 'The old clock in the beis medrash had ticked for fifty years. It stood taller than Rabbi Feldman, with a long brass pendulum behind a little glass door. For thirty years, Reb Zalman the gabbai had wound it every Friday with a small brass key.\nOne Tuesday, Nosson Abergel looked up during Shacharis and blinked. The hands said 7:15, but the boys were almost finished davening. The clock was silent.\nAfter davening, Rabbi Feldman opened the glass door. The pendulum hung still. A pendulum is the heavy weight that swings back and forth inside a clock and keeps it on time. When it stops swinging, the clock stops too.\n"Nobody wound it last Friday," said Rabbi Feldman. "He was away at his grandson\'s bar mitzvah."\nRabbi Feldman\'s voice was calm and unhurried. He showed Nosson how to turn the key. The spring inside tightened, click by click. Then Nosson gave the pendulum a gentle push. Tick. Tock. Tick.\nRabbi Feldman moved the hands to the right time. "Now," he said, "who will help Reb Zalman keep this clock going?"\nNosson\'s hand shot up first.' },
    c45_rcsuitcase: { title: 'The Wrong Suitcase', text: 'Binyamin Yusupov and his Zeidy were riding the train home to Baltimore after a chess tournament in New York. Zeidy had won two games, and Binyamin had won one. Binyamin ate an egg salad sandwich and counted the blue seats in their car.\nWhen the train stopped, Zeidy grabbed their black suitcase from the rack, and they hurried off.\nAt home, Binyamin opened the suitcase to take out his chess set. Instead, he found a man\'s sweater, a pair of reading glasses and a tall pile of Russian newspapers. "Zeidy," he said, "this is not our suitcase!"\nZeidy looked at the tag. It had a name, Mr. Rafael Aminov, and a phone number. Zeidy called the number right away. A worried voice answered. Mr. Aminov had taken their suitcase by mistake, too!\nThat evening, Mr. Aminov came to the door with the right suitcase. When he saw the chessboard on the table, his face lit up. "You play?" he asked. It turned out that he and Zeidy had grown up a few streets apart in Bukhara.\nThe two men played chess until late at night. Binyamin made tea and watched every move.\n"Sometimes," Zeidy said, "a mistake brings you a friend."' },
    c45_rcfort: { title: 'The Snow Fort That Fell', text: 'The morning after the big snow, Tzvi Hirsch, Avrumi and Dovid built a snow fort in the Golds\' backyard. They piled up soft, fluffy snow as high as their shoulders. Tzvi Hirsch wore his green hat with a pom-pom.\nThen Tzvi Hirsch leaned on the wall. Whump! The whole fort fell down on top of him. Only his pom-pom was poking out.\nThe boys dug him out, laughing. "It was too soft," said Dovid, brushing snow off his gloves. "We need blocks."\nAvrumi drew a plan in his notebook. They packed snow tightly into a sand bucket, flipped it over and made strong, square blocks. They stacked the blocks in rows, like bricks, and pressed snow into the cracks.\nBy lunchtime, the new fort was finished. Tzvi Hirsch leaned on the wall again, very carefully this time. It did not move.\nHis twin baby brothers watched from the kitchen window, clapping their mittens.\n"The first fort taught us how to build the second one," said Avrumi.' },
    c45_rcfog: { title: 'Fog on the Lookout', text: 'On the last morning of the camp trip, Avrumi Katz and Nosson Abergel climbed toward the lookout with the rest of their group. Reb Akiva led the way. The sky was gray, and the air felt damp and heavy.\nHalfway up, a thick fog rolled in. Soon the boys could barely see the tree in front of them. "Stay close," Reb Akiva called. "Follow the cairns."\nNosson looked puzzled. Then he saw one: a neat pile of flat stones stacked on a rock beside the path. A few steps later, there was another. The cairns stood like little stone guards, showing hikers the way when the trail was hard to see.\nAvrumi pulled out his compass. The needle pointed north, and the trail on his map ran north to the lookout. "If we keep following the cairns, we should reach the top soon," he said.\nThe group walked slowly, from one pile of stones to the next. At last the path leveled off. A wooden sign said LOOKOUT.\nThey saw nothing but white. The boys sat down to wait and eat their sandwiches. Then a breeze came up the mountain. The fog thinned, then tore apart like a curtain. Below them, the whole green valley sparkled in the sun.\n"It was worth the wait," whispered Nosson.' },
    c45_rcbridge: { title: 'Will It Hold?', text: 'Every boy in Grade 4 had one week to build a bridge out of craft sticks and glue. On Friday, Mr. Halpern would test each bridge by hanging a bucket from its middle and adding weights until it broke.\nDovid Lerner\'s first bridge was long and flat. When he pressed on it with one finger, it sagged like a hammock. Dovid frowned. He remembered the old railroad bridge near the harbor, with its strong steel triangles.\nThat night, he rebuilt it. This time, he glued the sticks into triangles along both sides. Triangles do not bend easily, so they make a bridge rigid. Rigid means stiff and hard to bend. Then he reinforced the middle with a second layer of sticks.\nOn Friday, the class gathered around the testing table. Yehuda\'s bridge held three weights before it snapped. Binyamin\'s held five. Then it was Dovid\'s turn.\nOne weight. Two. Five. Eight. The bridge creaked but did not bend. Ten. Twelve. The whole class was counting out loud.\nAt fifteen weights, there was a loud crack, and the bridge split in two. Everyone cheered anyway. It was the strongest bridge in the class.\nMr. Halpern picked up a broken piece and smiled. "Triangles," he said. "Engineers have known that trick for a long time."' }
