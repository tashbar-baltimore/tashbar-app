  var P = {
    c45h3_b2c1: { title: 'Lost on the Ridge Trail, Chapter 1 in Short', text: 'At breakfast, Avrumi saw a few small, puffy clouds over the lake. The bunk set out on Ridge Trail, and Reb Akiva gave three rules: stay in sight of the boy in front, follow the blue marks, and blow three whistle blasts if you need help.\nTzvi Hirsch ran far ahead and counted blue marks, until Reb Akiva called, "Rule number one!" Avrumi wanted to find the way back, so he drew every turn of the trail in his notebook.\nBy lunch, the air was hot and sticky. One cloud in the west had kept growing taller all through lunch. Then its top spread out flat, like an anvil. Avrumi remembered that a flat-topped cloud means a storm. A cool breeze blew across the creek, and a gray curtain of rain was moving over the hills. So Reb Akiva blew the signal to line up and turned the bunk back.' },
    c45h3_b2wx: { title: 'Avrumi\'s Notebook: Wednesday at the Lake', text: 'Wednesday, 7:00. Thick fog over Pine Lake. I cannot see the dock. Reb Akiva says no canoes until the fog lifts, because the boats could bump into each other.\n10:15. The sun is climbing higher. As the sun warmed the air, the fog began to thin. By ten o\'clock it was gone, and we could see across the whole lake. So the canoe trip started.\n1:00. The wind is stronger now. It blew across the water and made the waves bigger and bigger.\n1:30. Reb Akiva called all the canoes back to the dock, since big waves can tip a canoe over. Tzvi Hirsch said it was not fair. Then a wave splashed right over his sneakers, and he paddled back faster than anybody.' },
    c45h3_b2c2: { title: 'Lost on the Ridge Trail, Chapter 2 in Short', text: 'The bunk hurried down Ridge Trail. First they heard thunder, and Reb Akiva led the bracha. Then, on a rocky part of the trail, a gust snatched Tzvi Hirsch\'s red cap and rolled it down the steep slope. Without a word, Tzvi Hirsch ran after it.\nAvrumi saw him go. Nobody else had seen. Avrumi had one second to decide, and he went down after his friend.\nAt the bottom, the cap blew away again. Then the rain came all at once. Avrumi\'s map turned into a wet lump and came apart in his fingers.\nThe boys climbed back up the muddy slope for a long time. At last they reached the top. But there was no trail, no line of boys and no Reb Akiva. They turned in a full circle. There was not one blue mark on any tree.' },
    c45h3_b2k2: { title: 'The Pine Lake Ripple: How Bunk Gimmel Built a Raft', text: 'On Sunday, Bunk Gimmel decided to build a raft for the camp swim race. First, the boys collected six empty plastic barrels from the kitchen. They washed them out with the hose and screwed the lids on tight, so no water could get in.\nNext, their counselor showed them how to lay four long boards across the barrels. The boys tied every board down with thick rope, two knots at each corner.\nThen came the test. Eight boys carried the raft to the lake and set it in the shallow water. One corner sank. A barrel had a crack! The boys pulled the raft out, found a new barrel, and tied it on.\nAfter that, the raft floated perfectly flat. Finally, on Thursday, Bunk Gimmel paddled it in the swim race. They came in last, but they were the only bunk that did not get wet.' },
    c45h3_b2c3: { title: 'Lost on the Ridge Trail, Chapter 3 in Short', text: 'Lightning flashed, and thunder cracked. The boys were on high ground next to a tall pine tree, the worst place to be.\nAvrumi remembered his Abba\'s steps for a lightning storm. Get off the high ground. Stay away from the tallest tree. Find a low place with small trees. Crouch low on your pack with your feet together. So the boys went down into a hollow full of young trees and crouched on their packs.\nThey counted from each flash to its thunder. Every five seconds means about one mile. The numbers grew from 3 to 6 to 12, so they knew the storm was moving away.\nThey blew their whistles, three blasts at a time, but nobody answered. Tzvi Hirsch wanted to walk downhill to camp. Avrumi said, "Stop." When you are lost, you stay where people will look for you.' },
    c45h3_b2k3: { title: 'Camp Pine Lake Rules: Thunder at the Lake', text: 'If you hear thunder while you are swimming, follow these steps.\nStep 1. Get out of the water right away. Water carries electricity, so lightning that hits a lake can hurt swimmers far from where it strikes.\nStep 2. Go quickly to the dining hall, without running on the wet dock. A big building with walls and a roof is the safest place in a storm. The open beach is not safe, and neither is the boat shed, which has open sides.\nStep 3. Stay inside and wait. Thunder you can hear means lightning is close enough to be dangerous.\nStep 4. Do not go back to the lake until 30 minutes after the last thunder. Storms can rumble back, so the lifeguard waits a full half hour before blowing the "all clear" whistle.' },
    c45h3_b5c1: { title: 'Shabbos at the Lighthouse, Chapter 1 in Short', text: 'On a Friday off from school, the week after Purim, Tzvi Hirsch and three friends rode out in the workboat Shoshana with his great-uncle, Reb Shimon, to Kettle Shoal Lighthouse. Ima packed a box "just in case": two challos, grape juice, chicken, a babka and Shabbos candles.\nThe lighthouse, built in 1883, is a white six-sided house with a red roof, on iron legs far out in the bay. The bottom of the bay is soft mud, many feet deep, so a heavy stone tower would sink. Instead, each iron leg has a wide spiral at the bottom, like a giant screw, and the builders screwed each one deep into the mud. The legs do a second job, too: waves pass right under the house instead of smashing into a wall.\nThe light warns ships away from the shoal, where sandbars hide just under the water. Every lighthouse has its own flash pattern. Kettle Shoal flashes white, once every six seconds, so a captain knows exactly where he is.\nAt eleven o\'clock, the barometer needle fell fast. A storm was coming early.' },
    c45h3_b5c2: { title: 'Shabbos at the Lighthouse, Chapter 2 in Short', text: 'The boys worked fast. Dovid hung an iron bolt inside the old fog bell, and it rang out across the water.\nBut the wind was getting stronger. Reb Shimon explained that wind blowing across water pushes it into waves. The stronger and longer the wind blows, the bigger the waves grow. When the wind is strong enough, the top of each wave tips over into white foam, called whitecaps. Whitecaps all over the bay mean a rough ride for a small boat.\nThey set out for Baltimore anyway. Far from the lighthouse, the waves became steep hills of water, and one broke over the side and soaked Binyamin. Reb Shimon called the Coast Guard. The storm had come many hours early, and the waves were too rough for a small boat. The Coast Guard said to go back and stay at the lighthouse, the safest place they could be.\nThe boys called home. Shabbos would start a little after seven. "It seems," said Reb Shimon, "we are making Shabbos here."' },
    c45h3_b5c3: { title: 'Shabbos at the Lighthouse, Chapter 3 in Short', text: 'With what was in Ima\'s box and the lighthouse kitchen, there was plenty to eat. Everybody had a job: latching shutters, setting out water, spreading an old white tablecloth, sweeping the floor.\nBy five o\'clock, the water was much higher. Nosson noticed it first: a ring of green weed on one of the iron legs had been above the water in the morning, and now it was under. Reb Shimon gave two reasons. First, the tide: twice a day the water rises and falls, because the moon pulls on the oceans, and the tide was coming in. Second, the storm surge: the south wind was pushing water up the bay and piling it higher at this end. The tide and the surge added up.\nA line carved on a post showed where the water reached in the storm of August 1933, higher than the floor. That night, the keeper\'s family waited in the lantern room, and in the morning the house was still standing. "These legs have stood through a hundred and forty years of storms," said Reb Shimon.\nThen he lit the Shabbos candles.' },
    c45h3_b5k1: { title: 'Museum Card: Towers on the Rocks', text: 'Not every lighthouse stands on legs. Along rocky coasts, like the coast of Maine, most lighthouses are tall towers of stone or brick. Two things made towers the right choice there.\nFirst, solid rock can hold up a very heavy building without sinking. Builders cut the base of the tower right into the rock, so even giant waves cannot push it over.\nSecond, a tall tower lifts the lamp high above the water. Because the Earth is curved, a light that sits higher can be seen from farther away. A lamp 100 feet up can be seen from a ship\'s deck about 18 miles away, while a lamp close to the water can be seen only a few miles away.\nMany towers are also painted with stripes or checks, called a daymark, so that sailors can tell them apart in the daytime, too.' },
    c45h3_b5k2: { title: 'Coast Guard Safety Card: Fog on the Water', text: 'Fog can be as dangerous for a boat as a storm. Fog forms when warm, damp air moves over cold water. The cold water chills the air, and the water in the air turns into tiny drops that hang over the water like a low cloud.\nIn thick fog, a boater may not see a buoy, a rock or another boat until it is very close. Because of this, the rules say that a boat in fog must slow down.\nA boat in fog must also sound its horn every two minutes. That way, other boats can hear where it is, even when they cannot see it.\nMany boats also carry radar, which sends out radio waves that bounce back from things the captain cannot see. Radar shows those things as bright spots on a screen.' },
    c45h3_b5k3: { title: 'From the Diary of Mary Hale, a Keeper\'s Daughter, 1894', text: 'February 20, 1894. Papa says tonight\'s tide will be very high, and he showed me why. The moon is full tonight, and the moon and the sun are lined up in a row with the Earth. When they line up, their pulls add together, and the tide rises higher than usual. Sailors call it a spring tide, though it has nothing to do with springtime.\nThen Papa tapped the frosty window. All week, thick sheets of ice have floated down the bay. Papa says ice is the one enemy our iron legs fear, because a big sheet can push against them like a giant hand. So tonight he will check the legs with his lantern every hour.\nPapa trimmed the lamp\'s wick at sundown, and it has burned bright all night.' }

  var TEACH = {
    'READ.LIT.L05.30':{
      hook:'A storm does not jump out of a clear sky. It sends warnings first, one after another. A good reader, like a good hiker, follows the chain.',
      big:'In a story, one event causes the next. Follow the chain of causes and effects, and you understand why things happen, and you can see what is coming.',
      intro:['Read the chapter.', 'Find something that happens. Ask: what made it happen? That is the cause.', 'Ask: what happened because of it? That is the effect.', 'Check with "because": "The bunk turned back because..." Does it make sense?'],
      ex:[{q:'Ridge Trail, Chapter 1: the anvil cloud', steps:['Small clouds at breakfast grow tall by lunch.', 'The top spreads flat, like an anvil.', 'Avrumi knows a flat top means a storm.', 'So Reb Akiva turns the bunk back.'], a:'Each sky change leads to the next, and the last one causes the turn back.'},
          {q:'Ridge Trail, Chapter 1: Avrumi\'s map', steps:['Avrumi wants to know the way back.', 'So he draws every turn of the trail.'], a:'Wanting to know the way back is the cause; drawing the map is the effect.'}],
      oops:{q:'Why did the storm come?', wrong:'Because Tzvi Hirsch ran ahead right before it.', right:'The clouds grew all day in the hot, sticky air. His running ahead had nothing to do with it.', why:'Something that happens first is not always the cause. Ask: did it really make the next thing happen?'},
      idea:['Causes and effects are like dominoes. Each one tips the next.'],
      try:{q:'"The trail was muddy, so the boys walked slowly." What is the cause?', o:['The trail was muddy.', 'The boys walked slowly.', 'The boys were hungry.'], a:'The trail was muddy.', steps:['Find the signal word "so".', 'The words before it give the reason.']}
    },
    'READ.LIT.L05.31':{
      hook:'One step off a trail can change a whole day. A good reader keeps track of every step.',
      big:'Events in a story happen in an order. Time words (first, next, then, finally, at last) show the order. A character\'s choice often starts a whole chain of events.',
      intro:['Read the chapter.', 'Find the first important event.', 'Ask: what happened next? And next?', 'Look for the choice a character made, and what it led to.'],
      ex:[{q:'Ridge Trail, Chapter 2', steps:['Thunder; the bunk says the bracha.', 'A gust takes the red cap.', 'Tzvi Hirsch chooses to run after it.', 'Avrumi chooses to follow him.', 'The rain pours, and they lose the trail.'], a:'One quick choice led to a chain of events.'}],
      oops:{q:'What happened first: the rain, or the cap blowing away?', wrong:'The rain came first, and then the cap blew away.', right:'The cap blew away first. The rain came after the boys were down the slope.', why:'Find each event in the story. Do not guess the order from what seems most important.'},
      idea:['A chain of events is like a line of footprints. Follow them back, and you find where the walker left the trail.'],
      try:{q:'"The cap blew away, so Tzvi Hirsch ran, so Avrumi followed." Which event started the chain?', o:['The cap blew away.', 'Tzvi Hirsch ran.', 'Avrumi followed.'], a:'The cap blew away.', steps:['Find the first event.', 'Did the others happen because of it?']}
    },
    'READ.LIT.L05.32':{
      hook:'In a storm, knowing the right steps, in the right order, keeps you safe. Knowing WHY each step works helps you remember it.',
      big:'A process is a set of steps in order. To explain a process, tell each step and why it helps. Many texts are built as a problem and its solution.',
      intro:['Read the chapter.', 'Find the steps the characters follow.', 'For each step, find the reason it helps.', 'Name the problem and the solution.'],
      ex:[{q:'Ridge Trail, Chapter 3: lightning', steps:['Problem: lightning, and the boys are on high ground.', 'Step: get off the high ground and away from the tallest tree.', 'Why: lightning hits tall, high things.', 'Step: count flash to thunder. Why: 5 seconds is about 1 mile.'], a:'Each step solves part of the problem, and each has a reason.'}],
      oops:{q:'What is the safest place in a lightning storm in the woods?', wrong:'Under the tallest tree, because it keeps off the rain.', right:'A low place with small trees, crouched on your pack.', why:'Staying dry is not the problem. Lightning is. The tallest tree is the most likely to be hit.'},
      idea:['A good explanation answers two questions for every step: What do I do? Why does it help?'],
      try:{q:'Twelve seconds from flash to thunder. About how far away is the lightning?', o:['more than 2 miles', 'less than 1 mile', 'exactly 12 miles'], a:'more than 2 miles', steps:['Every 5 seconds is about 1 mile.', '10 seconds is 2 miles; 12 is a little more.']}
    },
    'READ.LIT.L06.30':{
      hook:'A good chapter can teach you real things about the world, the way an article does. Find its big ideas, and the facts stick.',
      big:'A part of a text can have more than one big idea. Each big idea is held up by key details. A summary puts the big ideas together in a few words.',
      intro:['Read the part that teaches facts.', 'Ask: what main points does it make? There may be two.', 'For each big idea, find the details that prove it.', 'Sum up: put both big ideas into one or two sentences.'],
      ex:[{q:'Lighthouse, Chapter 1: why the legs', steps:['Big idea 1: the screw legs keep the house from sinking.', 'Detail: the bottom of the bay is soft mud, many feet deep.', 'Big idea 2: the legs let waves pass under.', 'Detail: the bay goes under, and the house stays dry.'], a:'Two big ideas, each with its own details.'},
          {q:'Lighthouse, Chapter 1: the flashes', steps:['Big idea: each lighthouse has its own flash pattern.', 'Detail: Kettle Shoal flashes white, once every six seconds.', 'Detail: a captain who sees it knows where he is.'], a:'The details prove why the pattern matters.'}],
      oops:{q:'What is a big idea about the lighthouse?', wrong:'The roof is red, like a hat.', right:'Screw legs hold it up in soft mud and let waves pass under.', why:'A red roof is one small detail. A big idea is a main point that many details hold up.'},
      idea:['Big ideas are the poles of a tent. Details are the pegs that hold each pole in place.'],
      try:{q:'"The bottom of the bay is soft mud." Which big idea does it support?', o:['A stone tower would sink, so the house stands on screw legs.', 'Each light has its own flash pattern.', 'Ima packs a box just in case.'], a:'A stone tower would sink, so the house stands on screw legs.', steps:['Ask: what problem does soft mud make?', 'Which big idea solves that problem?']}
    },
    'READ.LIT.L06.31':{
      hook:'Ideas in a text hold hands. Pull one, and the next one comes along.',
      big:'A link map shows how ideas connect: this happened, so that happened, so the next thing happened. Most links are cause and effect: one idea makes the next one happen. Linking the ideas explains why the story went the way it did.',
      intro:['Read the chapter.', 'Find the first idea in the chain.', 'Ask: because of this, what happened next? That is the next link.', 'Keep going to the end. Read the chain back with "so" between each link.'],
      ex:[{q:'Lighthouse, Chapter 2: the waves', steps:['The wind gets stronger.', 'So the waves grow bigger.', 'So the tops break into whitecaps.', 'So the ride is too rough for a small boat.'], a:'Wind → waves → whitecaps → too rough.'},
          {q:'Lighthouse, Chapter 2: staying', steps:['The waves are too steep for a small boat.', 'So the Coast Guard says to stay at the lighthouse.', 'So the boys make Shabbos there.'], a:'Each link leads to the next.'}],
      oops:{q:'How is the fog bell linked to the storm?', wrong:'Dovid rang the bell, so the storm came early.', right:'They are not linked. The bell rang, but it did not cause the storm.', why:'Two things in one chapter are not always linked. The text must show how one leads to the other.'},
      idea:['A link map is a chain. Every link must really hook into the next one.'],
      try:{q:'"The wind blew hard all day. Big branches fell on the roads." How are the ideas linked?', o:['The wind made the branches fall.', 'The branches made the wind blow.', 'They are not linked at all.'], a:'The wind made the branches fall.', steps:['Which came first?', 'Did it lead to the second?']}
    },

      hook:'Anyone can guess. A strong reader explains, and points to the proof.',
      big:'To explain why something happened, use the text\'s own details, not a guess. A real reason is one the text gives. Say the reason, then point to the words in the text that give it.',
      intro:['Read the question: what needs explaining?', 'Find the part of the text that gives the reason.', 'Explain in your own words, using those details.', 'Check: can you point to every part of your explanation in the text?'],
      ex:[{q:'Lighthouse, Chapter 3: the rising water', steps:['Question: why was the water higher?', 'Text detail: the tide was coming in, because the moon pulls on the oceans.', 'Text detail: the south wind piled water up the bay, a storm surge.', 'Explain: the tide and the surge added up.'], a:'Two reasons, both from the text.'},
          {q:'Lighthouse, Chapter 3: is the house safe?', steps:['Question: why can the house stand the storm?', 'Text detail: its legs have stood through 140 years of storms.', 'Text detail: even in 1933, the house was still standing in the morning.'], a:'The explanation uses the text\'s own facts.'}],
      oops:{q:'Why did the water rise?', wrong:'Because storms always make the sea angry.', right:'The tide was coming in, and the wind pushed up a storm surge.', why:'"Always angry" is a guess the text never says. Use the reasons the text gives.'},
      idea:['An explanation is a bridge. Every board must come from the text.'],
      try:{q:'How did Nosson know the water had risen?', o:['A weed ring on a leg was now under water.', 'He felt scared.', 'He guessed.'], a:'A weed ring on a leg was now under water.', steps:['Find what Nosson saw.', 'Is it in the text?']}
    }

      bridge:'READ.LIT.L05.30', bridgeName:'Ridge Trail 1: Twenty Blue Marks',
      watch:{ q:'The Snow Fort That Fell (a short story)', m:{type:'scene', e:'⛄', t:'Three boys build a snow fort. Tzvi Hirsch leans on it. Whump!'}, steps:[

      ways:['real book (the Reader)','time order','story map','worked example','Mistake Detective','tap the reason','evidence in the text'],

        {type:'match', pairs:[['The gust takes the cap','Tzvi Hirsch runs down the slope'],['Tzvi Hirsch runs off alone','Avrumi goes after him'],['The rain pours down','The map comes apart'],['They climb up in a new place','They find no blue marks']],

    'READ.LIT.L05.32':{ band:'E45', pic:'⚡', today:'Read Chapter 3 and explain each safety step',

      bridge:'READ.COMP.L05.15', bridgeName:'How and Why',
      watch:{ q:'Will It Hold? (a short story)', m:{type:'scene', e:'🌉', t:'Dovid\'s craft-stick bridge sags like a hammock when he presses it.'}, steps:[

      oops:{ q:'Why did Dovid glue the sticks into triangles?', wrong:'Because triangles use fewer sticks.', right:'Because triangles do not bend easily, so the bridge is stiff.', why:'A reason must be in the text. Find the sentence that says what the triangles DO.' },
      ways:['real book (the Reader)','process steps','problem and solution','worked example','Mistake Detective','tap the reason','evidence in the text'],
      done:'You read Chapter 3 and explained every step! Teach your chavrusa the flash-to-thunder trick.',

          say:'Match each problem to the boys\' solution.', how:'Ask of each problem: what did the boys do about it?'},

    'READ.LIT.L06.30':{ band:'E45', pic:'🗼', today:'Read Chapter 1 and find two big ideas',
      why:'A chapter can teach real facts. Find the big ideas, and you remember what matters.',
      ready:[{q:'A big idea is...', o:['a main point of the text','one small fact','the title'], a:'a main point of the text'},
             {q:'A key detail...', o:['supports a big idea','has nothing to do with it','is always a number'], a:'supports a big idea'}],
      bridge:'READ.COMP.L06.10', bridgeName:'Sum Up an Article',
      watch:{ q:'Houses on Stilts (a short passage)', m:{type:'scene', e:'🏠', t:'Beach houses stand on stilts for two reasons. Storm floods can rise six feet, and on stilts the floor stays above the water. Stilts are also driven deep into the sand, so waves that wash the sand away cannot topple the house.'}, steps:[
        {t:'Big idea 1: stilts lift the floor above floods.'},
        {t:'Its detail: floods can rise six feet.'},
        {t:'Big idea 2: deep stilts hold the house when sand washes away.'},
        {t:'Its detail: they are driven deep into the sand.'},
        {t:'Sum up both: stilts keep the house above floods and standing.'}],
        a:'Two big ideas, each held up by its details.' },
      oops:{ q:'What is a big idea about the stilt house?', wrong:'Floods can rise six feet.', right:'Stilts lift the floor above floods.', why:'Six feet is a detail. It supports the big idea; it is not the big idea itself.' },
      ways:['real book (the Reader)','big ideas and details','worked example','Mistake Detective','tap the reason','evidence in the text','summary'],
      done:'You read Chapter 1 and found its big ideas! Tell your chavrusa why the lighthouse stands on legs.',
      board:{ one:'A text can have two big ideas. Each needs its own key details. A summary joins the big ideas in a sentence or two.', activity:'Tent poles: each pair draws a tent with two poles (the big ideas about the screw legs) and pegs (the details) from Chapter 1.', mistakes:['Calling a small detail a big idea','Finding only one big idea when there are two','A summary that lists small facts instead of the big ideas'] },
      do:[
        {type:'read', text:'C45.B5.01', say:'Open the book. Read Chapter 1 of Shabbos at the Lighthouse.', how:TELL},
        {type:'storymap', slots:['Big idea: standing in mud','Its detail','Big idea: facing the waves','Its detail'], cards:['Screw legs keep the house from sinking','The bay bottom is soft mud, many feet deep','The legs protect the house from the waves','Waves pass right under, between the legs'], extra:['The roof is red, like a hat'],
          say:'Put each big idea and its detail in its box.', how:'First find the two main points. Then find the fact that proves each one.',
          why:{q:'Why does "the roof is red" not fit?', o:['It does not support either big idea','It is too long','It is not in the chapter'], a:'It does not support either big idea'}}],
      your:[
        {type:'sort', mis:true, bins:['Big idea','Mistake: just a small detail'], cards:[['Screw legs keep the house from sinking',0],['Each lighthouse has its own flash pattern',0],['The lighthouse was built in 1883',1],['The roof is red, like a hat',1]],
          say:'Mistake Detective: big idea, or just a small detail?', how:'Would the facts fall apart without it? Then it is a big idea.',
          why:{q:'Why is "built in 1883" a small detail?', o:['No main point depends on it','It is a number','It comes first'], a:'No main point depends on it'}},
        {type:'proof', text:'C45.B5.01', q:'Which sentence tells the path the waves take past the house?', proof:'Waves can pass right under the house', look:'what the legs let pass under',
          say:'Open the book. Find the sentence that proves it.', how:'Find where Reb Shimon tells the legs\' second job.'},
        {type:'match', pairs:[['soft mud, many feet deep','why a stone tower would sink'],['a giant screw on each leg','how the legs hold fast'],['one white flash every six seconds','how a captain knows this light'],['sandbars just under the water','why ships need a warning']],
          say:'Match each detail to the idea it supports.', how:'Ask of each detail: which main point does it prove?'},
        {type:'combine', a:'The bay bottom is soft mud.', b:'The builders screwed iron legs deep into it.', o:['so','because','or'], j:'so',
          say:'Join the problem to the builders\' answer.', how:'Does the second sentence happen because of the first?',
          why:{q:'What would happen to a heavy stone tower here?', o:['It would sink','It would float','It would rust'], a:'It would sink'}},
        {type:'listen', q:'Challenge: sum it up.', hear:'Which is the best one-sentence summary of the lighthouse facts?', o:['Screw legs hold it up in soft mud and let waves pass under.','The house has six sides and a red roof.','Reb Shimon is about seventy-five years old.'], a:'Screw legs hold it up in soft mud and let waves pass under.',
          say:'Challenge! Pick the best summary.', how:'A summary holds the big ideas, not one small fact.',
          why:{q:'Why is it the best summary?', o:['It joins both big ideas','It is the shortest','It has a number in it'], a:'It joins both big ideas'}}] },
    'READ.LIT.L06.31':{ band:'E45', pic:'🌊', today:'Read Chapter 2, and link each idea to the next',
      why:'Ideas in a text hold hands. See the links, and you can explain why things happened.',

             {q:'A link map shows...', o:['how ideas connect','where a town is','who is talking'], a:'how ideas connect'}],
      bridge:'READ.COMP.L06.11', bridgeName:'Link Map',

        {t:'So Abba learned with the boys at home. The last link!'},
        {t:'Read the chain back with "so" between each link.'}],
        a:'Freezing rain → icy roads → no safe buses → snow day → learning at home.' },
      oops:{ q:'How is the freezing rain linked to the snow day?', wrong:'Freezing rain and snow days are both cold.', right:'The rain iced the roads, so the buses could not drive safely.', why:'Being alike is not a link. A link shows how one idea leads to the next.' },
      ways:['real book (the Reader)','link map','worked example','Mistake Detective','tap the reason','evidence in the text'],
      done:'You read Chapter 2 and linked the ideas! Tell your chavrusa the chain, from wind to Shabbos.',

      your:[
        {type:'sort', mis:true, bins:['Real link','Mistake: no real link'], cards:[['Strong wind pushed the water into big waves.',0],['Steep waves made a small boat unsafe.',0],['The boys called home, so the storm came early.',1],['The whitecaps made the wind blow harder.',1]],
          say:'Mistake Detective: a real link, or no real link?', how:'Does the text show the first part leading to the second?',
          why:{q:'Why is "calling home made the storm come" a mistake?', o:['The calls came after; they did not cause the storm','The phone was too small','The storm came at night'], a:'The calls came after; they did not cause the storm'}},
        {type:'evidence', q:'Which sentence links wind to whitecaps?', p:['Wind blowing across water pushes it into waves.','The stronger the wind blows, the bigger the waves grow.','When the wind gets strong enough, the top of each wave tips over into foam.','She was bobbing up and down.'], a:2, look:'what the wind does to a wave',
          say:'Tap the sentence that links wind to whitecaps.', how:'Which sentence tells what happens to the top of a wave in strong wind?'},
        {type:'proof', text:'C45.B5.02', q:'Which sentence gives the Coast Guard\'s reason the trip was not safe?', proof:'too steep for a small boat', look:'what the Coast Guard said about the waves',
          say:'Open the book. Find the sentence that proves it.', how:'Find the Coast Guard\'s words about the waves.'},
        {type:'combine', a:'The Shoshana turned back to the lighthouse.', b:'The waves were too steep for a small boat.', o:['because','but','or'], j:'because',
          say:'Join the two ideas with the right link word.', how:'Which idea is the reason for the other?',

          say:'Match each idea to the idea it leads to.', how:'Ask: what happened because of this?'}] },
