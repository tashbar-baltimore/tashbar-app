    c45f_icecream: { title: "Ice Cream in a Bag", text: "Today, boys, we make ice cream with no freezer. First, pour one cup of milk and a spoon of sugar into a small bag. Seal it tight! Second, fill a big bag with ice and six spoons of salt. Third, put the small bag inside the big one. Now shake. Shake hard, for five whole minutes. Feel it? It's getting thick!" },
    c45f_thunder: { title: "Counting the Thunder", text: "\"Now count!\" said Abba. \"One, two, three,\nfour, five...\" and then, so suddenly,\na rumble rolled across the town,\na giant's drum, a growling sound.\n\"Five seconds,\" Abba said. \"You see?\nThe storm is one mile off, maybe.\"" },
    c45f_hail: { title: "Hail on the Sukkah", text: "Tap, tap, tap, the hail came down,\nlike marbles on the sukkah's crown.\n\"Inside!\" called Zeidy. \"Bring the plate!\"\nWe grabbed the challah. \"Wait! Wait! Wait!\"\nThen from the window, safe and dry,\nwe watched the white stones bounce and fly." },
    c45f_snowcall: { title: "The Snow Day Phone Call", text: "RABBI FELDMAN: Tell them three things. One: no yeshiva today. Two: stay off the roads. Three: we will learn on the phone at ten o'clock.\nAVRUMI: Learn on the phone? On a snow day?\nABBA: Now go call the Golds. And speak slowly and clearly!\nTZVI HIRSCH: Hello? Gold's Bakery and Gold family. We are closed." },
    c45f_bus: { title: "The Late Bus (a play)", text: "RABBI ROTH: Boys, listen. The bus is stuck in the snow. Here is the plan. One: wait inside the shul. Two: call your parents. Three: stay together. Four: nobody walks home alone.\nSHIMMY: Inside the shul? For how long?\nRABBI ROTH: Until a parent comes. Not one minute less.\nSHIMMY: Then I'm calling my Zeidy. He drives a truck!" },
    c45f_trail: { title: "Rules of the Trail", text: "So here are my four rules of the trail.\nRule one: stay together. Nobody walks ahead of the leader. Nobody falls behind the counselor.\nRule three: carry water, and drink it. Not when you are thirsty. Before you are thirsty!\nRule four, and listen carefully, because this one is the most important: if you are lost, stop. Do not run. Do not wander." },
    c45f_pool: { title: "Pool Rules", text: "Listen up, boys! Three pool rules.\nRule one: walk, don't run. The deck is wet and slippery.\nRule two: swim only where the lifeguard can see you.\nRule three, the big one: if you hear my whistle, stop and look at me. Right away. Not in a minute. Right away!\nOkay? In you go!" },
    c45f_campfire: { title: "Campfire Night", text: "The sun goes down behind the hill.\nThe lake is dark, the air is still.\nA crackle, then a pop, a spark!\nThe flames leap up against the dark.\nWe sing a niggun, soft and low,\nthat rises with the embers' glow.\nAt last the fire is ash and gray." },
    c45f_lakepoem: { title: "Morning on the Lake", text: "The lake is flat, the mist is white,\nthe stars are leaving with the night.\nA fish jumps up! A ring, a splash!\nThen all is still. No noise, no crash.\nWe whisper, \"Look,\" and point, and stay,\nand watch the sun begin the day." },
    c45f_zeidycamp: { title: "Dear Zeidy, from Camp", text: "First, the good news. I passed my swimming test on the first try! The water was freezing, but I did not complain, because you told me that a strong person does not complain about cold water. Well, I complained a little, but only inside my head.\nThird, the bad news. The food is not like Bubby's.\nI miss you. I miss learning with you on Sunday mornings." },
