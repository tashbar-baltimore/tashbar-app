/* ---------- flying money ---------- */
function bills(){ return ST().wear&&ST().wear.coins==='gold-coins'?['🪙','🪙','💰','🥇']:['💵','💵','💵','💰']; }

function fly(fx,fy,tx,ty,n,list){ if(rmo()) return; list=list||bills(); for(let k=0;k<n;k++){ const e=document.createElement('i'); e.className='stmoney'; e.textContent=list[k%list.length]; e.style.left=fx+'px'; e.style.top=fy+'px'; document.body.appendChild(e);
 const mx=(fx+tx)/2+(Math.random()-.5)*360, my=Math.min(fy,ty)-140-Math.random()*140;
 e.animate([{transform:'translate(0,0) scale(.5) rotate(0)',opacity:0},{transform:`translate(${mx-fx}px,${my-fy}px) scale(1.3) rotate(${Math.random()*40-20}deg)`,opacity:1,offset:.45},{transform:`translate(${tx-fx}px,${ty-fy}px) scale(.45) rotate(${Math.random()*60-30}deg)`,opacity:.9}],{duration:950+k*40,delay:k*45,easing:'cubic-bezier(.3,.6,.4,1)',fill:'forwards'}).onfinish=()=>e.remove(); } }
function center(el){ const r=el?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0}; return [r.left+r.width/2,r.top+r.height/2]; }
function pillAt(){ const p=document.getElementById('tlcash'); if(p&&getComputedStyle(p).display!=='none') return center(p); const w=document.getElementById('wallet'); return w?center(w):[innerWidth-80,24]; }

/* ---------- 1. cash pill ---------- */
function lessonEst(){ const p=A.play; if(A.view!=='play'||!p) return 0; return (p.results||[]).filter(r=>r&&r.ok).reduce((a,r)=>a+1+(r.first?.5:0),0); }
function modalOpen(){ return !!(document.getElementById('kkov')||document.getElementById('tr-ov')||document.getElementById('elec-ov')||document.getElementById('sci-ov')||(window.HP&&HP.open)||A.overlay||T.open); }
let shownBal=null;
function pill(){ try{
  let p=document.getElementById('tlcash');
  if(!A.st||A.view==='login'||(!A.view)){ if(p) p.remove(); return; }
  if(!p){ p=document.createElement('div'); p.id='tlcash'; p.setAttribute('role','status'); p.setAttribute('aria-label','My money');
    p.innerHTML='<span class="tw"><small class="tl">My money</small><b id="tlcashv"></b><small class="td" id="tlcasht"></small></span><i id="tlcashp"></i>'; document.body.appendChild(p); }
  { const t=document.getElementById('tlcasht'), tx=todayTxt(); if(t&&t.textContent!==tx) t.textContent=tx; }
  document.body.classList.add('tl-cashpill');
  /* MONEY BADGE (HoS 2026-11-19: "the money should be on all the pages, including tests"): the same badge on every boy page,
     home included (it replaces the big orange home bar). Hidden only while the Store itself is open (its header shows the cash). */
  document.body.classList.toggle('st-hide-pill',!!(T.open&&document.getElementById('tlstore')));
  const bal=Number(A.st.balance)||0, v=document.getElementById('tlcashv');
  if(shownBal===null||bal<shownBal) shownBal=bal;
  else if(bal>shownBal+.004){ const from=shownBal; shownBal=bal; roll(v,from,bal); p.classList.remove('bump'); void p.offsetWidth; p.classList.add('bump'); }
  if(v&&!v.dataset.rolling) v.textContent=$(shownBal);
  const est=lessonEst(), pe=document.getElementById('tlcashp'); if(pe){ pe.classList.toggle('on',est>0); if(est>0) pe.textContent='+'+$(est)+' on the way'; }
}catch(e){} }
/* what he earned today, from his ledger (display only; the server sets every amount) */
function todayTxt(){ try{ const d=new Date().toDateString(); const t=(A.st.ledger||[]).filter(x=>x&&x.at&&new Date(x.at).toDateString()===d).reduce((a,x)=>a+Math.max(0,Number(x.amt)||0),0); return t>0?'+'+$(t)+' today':'+$0.00 today'; }catch(e){ return ''; } }
function roll(v,from,to){ if(!v) return; v.dataset.rolling='1'; const t0=performance.now(), d=1300; const step=now=>{ const k=Math.min(1,(now-t0)/d); v.textContent=$(from+(to-from)*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(step); else { delete v.dataset.rolling; v.textContent=$(to); } }; requestAnimationFrame(step); }
setInterval(pill,350);

/* ---------- 2. paycheck after every lesson ---------- */
const _sm=window.startMission||startMission;
startMission=function(){ try{ T.lesson={at:Date.now(),done:false,tries:0}; }catch(e){} return _sm.apply(this,arguments); };
function group(rows){ const m=new Map(); rows.forEach(r=>{ const k=String(r.why||'Earned')+'|'+r.amt; const g=m.get(k)||{why:String(r.why||'Earned'),amt:Number(r.amt)||0,n:0}; g.n++; m.set(k,g); }); return [...m.values()].sort((a,b)=>b.amt*b.n-a.amt*a.n); }
function nice(why){ let w=String(why); try{ if(typeof prettyWhy==='function') w=prettyWhy(w); }catch(e){} return w.replace(/^ms:\S+\s*/,'').replace(/\s+/g,' ').slice(0,46); }
setInterval(()=>{ try{
  const L=T.lesson; if(!L||L.done||!A.st) return;
  if(A.view!=='result'){ if(A.view!=='play') L.done=true; return; }
  L.tries++; const rows=(A.st.ledger||[]).filter(r=>r&&r.at>=L.at-3000&&Number(r.amt)>0);
  if(!rows.length){ if(L.tries>40) L.done=true; return; }
  L.done=true; setTimeout(()=>receipt(rows),900);
}catch(e){} },500);
function receipt(rows){
  if(document.querySelector('.strec')) return;
  const g=group(rows), tot=rows.reduce((a,r)=>a+(Number(r.amt)||0),0), d=new Date();
  const ov=document.createElement('div'); ov.className='strec'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-label','Your paycheck');
  ov.innerHTML=`<div class="paper"><h3>💵 PAYCHECK</h3><div class="sub">TASHBAR BANK · ${E(d.toLocaleDateString([], {weekday:'long',month:'short',day:'numeric'}))}<br>Pay to: ${E(A.st.name||'')}</div>
   ${g.map(x=>`<div class="ln"><span>${x.n>1?x.n+' × ':''}${E(nice(x.why))}</span><b>${$(x.amt*x.n)}</b></div>`).join('')}
   <div class="ln tot"><span>TOTAL</span><b>${$(tot)}</b></div><div class="stamp">PAID</div><button class="go" type="button">💵 Put it in my bank!</button></div>`;
  document.body.appendChild(ov);
  const lines=[...ov.querySelectorAll('.ln')], btn=ov.querySelector('.go'), stamp=ov.querySelector('.stamp');
  lines.forEach((l,k)=>setTimeout(()=>{ l.style.opacity=1; l.animate([{transform:'translateY(-8px)',opacity:0},{transform:'translateY(0)',opacity:1}],{duration:rmo()?1:260}); printer(2); },rmo()?0:250+k*260));
  const tEnd=rmo()?50:300+lines.length*260;
  setTimeout(()=>{ stamp.classList.add('on'); thunk(); },tEnd+200);
  setTimeout(()=>{ btn.style.opacity=1; btn.focus(); },tEnd+600);
  const close=()=>{ if(!ov.isConnected) return; const [fx,fy]=center(ov.querySelector('.paper')); ov.remove(); document.body.classList.remove('st-hide-pill'); const [tx,ty]=pillAt(); fly(fx,fy,tx,ty,Math.min(26,6+Math.round(tot/2))); register(); setTimeout(()=>{ const p=document.getElementById('tlcash'); if(p){ p.classList.remove('bump'); void p.offsetWidth; p.classList.add('bump'); } },900); };
  btn.addEventListener('click',close); ov.addEventListener('click',e=>{ if(e.target===ov) close(); });
  document.addEventListener('keydown',function k(e){ if(e.key==='Escape'){ close(); document.removeEventListener('keydown',k); } });
}

  T.loading=true; return run('stInfo',SRV.token).then(r=>{ T.loading=false; if(r&&r.ok){ T.info=r; T.at=Date.now(); syncOwned(); weekly(); } return T.info; }).catch(e=>{ T.loading=false; T.err=msg(e); return T.info; }); }

      prize:['Your prize is on its way!','A rebbe or teacher will hand it to you. You can see it in My stuff.'],card:['Canteen Cash added!',$(x.card/100)+' is now in your Canteen Cash'+(r.cash!=null?' (now '+$(r.cash)+')':'')+'. Buy food at the canteen!'],
      donate:['Thank you for giving!','You gave '+$(x.cents/100)+' back to Tashbar. That is real tzedakah.'],gift:['Gift sent!','Your friend got '+$(T.gift.amt)+' from you. What a good friend!']}[x.kind]||['Done!',''];
    T.confirm={id:x.id,done:true,emoji:x.emoji,title:done[0],text:done[1]}; draw(); spendShow(x,from-r.balance);
  }).catch(e=>{ T.busy=false; T.confirm=null; T.err=msg(e); draw(); }); }
function spendShow(x,amt){ const box=document.querySelector('.stconf .cb'), [tx,ty]=center(box), bal=document.querySelector('.stbal b'), [fx,fy]=center(bal);
  fly(fx,fy,tx,ty,Math.min(24,4+Math.round(amt/50)), x.kind==='donate'?['💝','💵','💖']:x.kind==='gift'?['🎁','💵']:x.kind==='card'?['💳','💵']:bills()); register(); setTimeout(hooray,500);
  if(x.kind==='donate'||x.cents>=100000) setTimeout(confettiBurst,700); if(x.kind==='donate') setTimeout(()=>bannerX('TZEDAKAH!','💝'),300); }

/* ---------- clicks ---------- */
document.addEventListener('click',e=>{ const b=e.target.closest&&e.target.closest('[data-st]'); if(!b) return; const a=b.dataset.st;
  if(a==='close'){ closeStore(); return; }
  if(a==='open'){ e.preventDefault(); T.tab=b.dataset.t||T.tab||'fun'; openStore(true); return; }
  if(a==='tab'){ T.tab=b.dataset.t; T.err=''; draw(); return; }
  if(a==='buy'){ T.confirm={id:b.dataset.id}; draw(); return; }
  if(a==='yes'){ buy(T.confirm.id); return; }
  if(a==='no'||a==='ok'){ T.confirm=null; draw(); return; }
  if(a==='goal'){ const s=ST(); s.goal=s.goal===b.dataset.id?null:b.dataset.id; if(!s.goal) delete s.goal; save(); draw(); return; }
  if(a==='wear'){ const x=item(b.dataset.id), s=ST(); if(!x) return; if(s.wear[x.slot]===x.id) delete s.wear[x.slot]; else s.wear[x.slot]=x.id; save(); draw(); dress(); colors(); return; }
  if(a==='cannon'){ e.preventDefault(); cannon(b); return; }
  if(a==='amt'){ T.gift.amt=Number(b.dataset.a)||5; draw(); return; }
  if(a==='sendgift'){ if(!T.gift.to) return; T.confirm={id:'gift'}; draw(); return; }
});
document.addEventListener('input',e=>{ if(e.target&&e.target.id==='st-gq'){ T.gift.q=e.target.value; const pos=e.target.selectionStart; draw(); const n=document.getElementById('st-gq'); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(x){} } } });
document.addEventListener('change',e=>{ if(e.target&&e.target.id==='st-gto'){ T.gift.to=e.target.value; draw(); } });

/* ---------- 6+7. home: store button, goal bar, and the boy's upgrades ---------- */
function goalBar(){ const s=ST(), I=T.info, bal=Number(A.st.balance)||0; const x=s.goal&&I?I.items.find(i=>i.id===s.goal):null;
  if(x){ const price=x.cents/100, pct=Math.min(100,Math.round(bal/price*100)), left=Math.max(0,price-bal);
    return `<section class="stgoalbar" aria-label="My savings goal"><span class="em" aria-hidden="true">${x.emoji}</span><div class="t"><small>🎯 SAVING FOR</small><b>${E(x.name)}</b><div class="bar"><i style="width:${pct}%"></i></div><small>${left>0?$(bal)+' of '+$(price)+' · '+$(left)+' to go':'You have enough! Go get it! 🎉'}</small></div><button type="button" data-st="open" data-t="${x.cat}">${left>0?'🏪 Store':'🛒 Get it!'}</button></section>`; }
  return `<section class="stgoalbar" aria-label="Tashbar Store"><span class="em" aria-hidden="true">🏪</span><div class="t"><b>The Tashbar Store is open!</b><small>Fun upgrades, real prizes, Canteen Cards, and tzedakah. Pick a goal and save for it.</small></div><button type="button" data-st="open" data-t="fun">🏪 Open the store</button></section>`; }
function dress(){ try{
  const s=ST(), w=s.wear||{};
  ['space','ocean','gold'].forEach(t=>document.body.classList.toggle('st-theme-'+t,w.theme==='theme-'+t&&A.view==='hub'));
  const h=document.querySelector('.hp2 .hpbar .hello b'); if(h&&!h.dataset.st){ h.dataset.st='1';
    if(w.hat==='crown') h.insertAdjacentHTML('afterbegin','<span class="stcrown" aria-hidden="true">👑</span>');
    if(w.frame==='frame-gold') h.classList.add('st-frame-gold'); if(w.frame==='frame-fire') h.classList.add('st-frame-fire'); if(w.frame==='frame-rainbow') h.classList.add('st-frame-rainbow');
    const pet=w.pet&&item(w.pet); if(pet) h.insertAdjacentHTML('afterbegin',`<span class="stpet" aria-hidden="true">${pet.emoji}</span>`);
    const tt=w.title&&item(w.title); if(tt) h.insertAdjacentHTML('beforeend',`<span class="sttitle">${E(tt.name.replace(/^Title:\s*/,''))}</span>`); }
}catch(e){} }
const _r=render;
render=function(){ const out=_r.apply(this,arguments); try{
  if(A.st&&A.view==='hub'){ const hp=document.querySelector('.hp2');
    if(hp&&!hp.querySelector('.stgoalbar')){ const bar=hp.querySelector('.hpbar'); if(bar) bar.insertAdjacentHTML('afterend',goalBar()); }
    const tools=document.querySelector('.hp2 .hpbar .tools'); if(tools&&!tools.querySelector('.stbtn')) tools.insertAdjacentHTML('afterbegin','<button type="button" class="stbtn" data-st="open" data-t="fun" aria-label="Open the Tashbar Store">🏪 Store</button>');
    if(tools&&!tools.querySelector('.stcannon')&&hasIt('bonus-cannon')) tools.insertAdjacentHTML('afterbegin','<button type="button" class="stcannon" data-st="cannon" aria-label="Fire the confetti cannon">🎉</button>');
    dress(); if(!T.info||Date.now()-T.at>60000) load().then(()=>{ if(A.view==='hub'&&!T.open){ const g=document.querySelector('.stgoalbar'); if(g) g.outerHTML=goalBar(); dress(); } }); else weekly();
    document.querySelectorAll('.bank td.amt, .bank .amt').forEach(td=>{ if(/\+\s*-|\+\$-|\+-\$/.test(td.textContent)){ td.textContent=td.textContent.replace(/\+\s*-\s*\$?|\+\$-/,'−$'); td.style.color='#B91C1C'; } });
  } else document.body.classList.remove('st-theme-space','st-theme-ocean','st-theme-gold');
  if(T.open) draw();
  colors();
}catch(e){ console.error('Store',e); } return out; };

/* upgrades in play: buddy cheers, silly sounds, star trail */
const _p3=window.p3Ans;
window.p3Ans=function(p,it,ok){ try{ if(ok){ const w=ST().wear||{};
  if(w.combo==='bonus-combo'&&p&&p.combo>0&&p.combo%3===0) setTimeout(fireworks,250);
  if(w.sound==='sound-duck') setTimeout(quack,140); if(w.sound==='sound-drum') setTimeout(drum,140);
  const pet=w.pet&&item(w.pet); if(pet&&!rmo()){ const q=document.querySelector('.qcard'); const [x,y]=q?[q.getBoundingClientRect().right-40,q.getBoundingClientRect().top+10]:[innerWidth-90,120]; const e=document.createElement('i'); e.className='stpop'; e.textContent=pet.emoji; e.style.left=x+'px'; e.style.top=y+'px'; document.body.appendChild(e); e.animate([{transform:'translateY(30px) scale(.4)',opacity:0},{transform:'translateY(-20px) scale(1.2) rotate(-10deg)',opacity:1,offset:.4},{transform:'translateY(0) scale(1)',opacity:0}],{duration:1100}).onfinish=()=>e.remove(); }

/* ---------- 8. FUN SHOP 2 ---------- */
const hasIt=id=>owned(id)||((ST().owned||[]).indexOf(id)>=0);
/* tap blasts: HomePlus splash() asks window.tlTapStyle() for colors (cols) or little pictures (em) */
const RAINBOW=['#EF4444','#F97316','#FACC15','#22C55E','#3B82F6','#6366F1','#A855F7'];
const TAPS={'tap-rainbow':{cols:RAINBOW},'tap-stars':{cols:['#FACC15','#F59E0B','#FDE047'],em:['⭐','✨','🌟']},'tap-confetti':{cols:['#F43F5E','#22C55E','#3B82F6','#FACC15','#A855F7'],sq:true},
 'tap-fireworks':{cols:['#F43F5E','#FDE047','#38BDF8','#A3E635','#F472B6'],big:true},'tap-gold':{cols:['#FACC15','#EAB308','#CA8A04'],em:['🪙','✨']},
 'hol-sukkah':{cols:['#16A34A','#FACC15'],em:['🍋','🌿','🍇','⭐']},'hol-menorah':{cols:['#2563EB','#CBD5E1','#FACC15'],em:['🕎','✨','🔥']},'hol-fruit':{cols:['#7C3AED','#65A30D','#CA8A04'],em:['🍇','🫒','🌾','🌳']},
 'hol-masks':{cols:['#A855F7','#F43F5E','#FACC15'],em:['🎭','🎉','🥁','👑']},'hol-arrows':{cols:['#EA580C','#FACC15'],em:['🏹','✨']},'hol-flowers':{cols:['#EC4899','#FACC15','#22C55E'],em:['🌸','🌼','🌿','🌷']}};
window.tlStoreTrailOn=()=>{ try{ return !!(A.st&&TRAILS[(ST().wear||{}).trail]); }catch(e){ return false; } };
window.tlTapStyle=()=>{ try{ if(!A.st) return null; return TAPS[(ST().wear||{}).tap]||null; }catch(e){ return null; } };
/* trails: follow the mouse (pointer events) and the finger (touch events, which keep coming while the page scrolls) */
const TRAILS={'trail':{em:['⭐','✨','🌟'],gap:30},'trail-rainbow':{rb:true,gap:7},'trail-comet':{comet:true,gap:7},'trail-sparkle':{em:['✨'],gap:22,small:true},'trail-bubbles':{em:['🫧'],gap:34,up:true},
 'hol-honey':{em:['🍎','🍯'],gap:34},'hol-flames':{em:['🔥','✨','🕯️'],gap:28,up:true},'hol-sea':{em:['🌊','💧'],gap:30},'hol-bonfire':{em:['🔥','✨'],gap:26,up:true},'hol-donuts':{donut:true,gap:30}};
/* Chanukah rolling donuts: small real donuts (a ring with a hole), five frostings, that roll away from the finger in random directions */
const DONUTS=[['#F9A8D4','#FFFFFF'],['#7C4A2D','#FDE68A'],['#FFFFFF','#F43F5E'],['#3B82F6','#FFFFFF'],['#E8A33D','#7C2D12']];
function donutSvg(k){ const f=DONUTS[k%DONUTS.length], ring='M10 1a9 9 0 1 0 .01 0zM10 7a3 3 0 1 1-.01 0z', top='M10 2.6a7.4 7.4 0 1 0 .01 0zM10 6.4a3.6 3.6 0 1 1-.01 0z';
  let sp=''; for(let i=0;i<7;i++){ const a=i/7*Math.PI*2+k, r=5.3; sp+=`<rect x="${(10+Math.cos(a)*r-.9).toFixed(2)}" y="${(10+Math.sin(a)*r-.35).toFixed(2)}" width="1.8" height=".7" rx=".35" fill="${i%2?f[1]:'#FACC15'}" transform="rotate(${Math.round(a*57)} ${(10+Math.cos(a)*r).toFixed(2)} ${(10+Math.sin(a)*r).toFixed(2)})"/>`; }
  return `<svg viewBox="0 0 20 20" width="100%" height="100%" aria-hidden="true"><path d="${ring}" fill="#D69A55" fill-rule="evenodd"/><path d="${top}" fill="${f[0]}" fill-rule="evenodd"/>${k%DONUTS.length===1||k%DONUTS.length===4?'':sp}<path d="M5.2 6.2a6.4 6.4 0 0 1 4-2.4" stroke="#fff" stroke-opacity=".55" stroke-width=".9" fill="none" stroke-linecap="round"/></svg>`; }
function donut(x,y){ if(TLIVE>=TCAP) return; TLIVE++; const e=document.createElement('i'), sz=14+Math.round(Math.random()*5); e.className='stdonut'; e.innerHTML=donutSvg(tk++);
  e.style.cssText=`position:fixed;z-index:2147483198;pointer-events:none;width:${sz}px;height:${sz}px;left:${x-sz/2}px;top:${y-sz/2}px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))`; document.body.appendChild(e);
  const a=Math.random()*Math.PI*2, dist=45+Math.random()*75, dx=Math.cos(a)*dist, dy=Math.sin(a)*dist, turn=(dist/(Math.PI*sz))*360*(dx<0?-1:1), ms=900+Math.random()*450;
  e.animate([{transform:'translate(0,0) rotate(0deg) scale(.4)',opacity:0},{transform:`translate(${dx*.12}px,${dy*.12}px) rotate(${turn*.12}deg) scale(1)`,opacity:1,offset:.1},{transform:`translate(${dx}px,${dy}px) rotate(${turn}deg) scale(1)`,opacity:1,offset:.8},{transform:`translate(${dx*1.04}px,${dy*1.04}px) rotate(${turn*1.04}deg) scale(.9)`,opacity:0}],{duration:ms,easing:'cubic-bezier(.12,.75,.3,1)'}).onfinish=()=>{ e.remove(); TLIVE--; }; }
let TL=null, TLIVE=0, thue=0, tk=0; const TCAP=90;
function tdot(x,y,t){ if(t.donut){ donut(x,y); return; } if(TLIVE>=TCAP) return; const e=document.createElement('i'); TLIVE++;
  if(t.em){ e.className='stem'; e.textContent=t.em[tk++%t.em.length]; e.style.fontSize=(t.small?13:18)+'px'; e.style.left=x+'px'; e.style.top=y+'px'; document.body.appendChild(e);
    e.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(-50%,${t.up?-(18+Math.random()*16):(10+Math.random()*20)}px) scale(.3)`,opacity:0}],{duration:t.up?900:700,easing:'ease-out'}).onfinish=()=>{ e.remove(); TLIVE--; }; return; }
  const sz=t.rb?14:12; e.className='sttr'; e.style.width=e.style.height=sz+'px'; e.style.left=(x-sz/2)+'px'; e.style.top=(y-sz/2)+'px';
  if(t.rb){ thue=(thue+9)%360; e.style.background=`hsl(${thue},95%,58%)`; } else { e.style.background='radial-gradient(circle,#FFF7ED,#FDBA74 45%,#F97316 70%,rgba(249,115,22,0))'; }
  document.body.appendChild(e); e.animate([{transform:'scale(1)',opacity:.95},{transform:'scale(.15)',opacity:0}],{duration:t.rb?650:450,easing:'ease-in'}).onfinish=()=>{ e.remove(); TLIVE--; }; }
function trailMove(x,y){ try{ if(rmo()||!A.st) return; const t=TRAILS[(ST().wear||{}).trail]; if(!t){ TL=null; return; }
  if(!TL||Math.hypot(x-TL.x,y-TL.y)>200){ TL={x:x,y:y}; return; }
  const dx=x-TL.x, dy=y-TL.y, len=Math.hypot(dx,dy); if(len<t.gap) return; const ux=dx/len, uy=dy/len; let dd=len;
  while(dd>=t.gap){ TL.x+=ux*t.gap; TL.y+=uy*t.gap; dd-=t.gap; tdot(TL.x,TL.y,t); } }catch(e){} }
document.addEventListener('pointermove',e=>{ if(e.pointerType==='touch') return; trailMove(e.clientX,e.clientY); },{passive:true});
document.addEventListener('touchstart',e=>{ const t=e.touches[0]; if(t) TL={x:t.clientX,y:t.clientY}; },{passive:true,capture:true});
document.addEventListener('touchmove',e=>{ const t=e.touches[0]; if(t) trailMove(t.clientX,t.clientY); },{passive:true,capture:true});
