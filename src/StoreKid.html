let AC=null; function ac(){ try{ if(typeof SND!=='undefined'&&SND&&SND.on===false) return null; AC=AC||new (window.AudioContext||window.webkitAudioContext)(); return AC; }catch(e){ return null; } }
function tone(f,w,d,v,type){ const c=ac(); if(!c) return; const t=c.currentTime+w, o=c.createOscillator(), g=c.createGain(); o.type=type||'triangle'; o.frequency.value=f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v||.12,t+.01); g.gain.exponentialRampToValueAtTime(.0008,t+d); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+.05); }
function noise(w,d,v,hz){ const c=ac(); if(!c) return; const t=c.currentTime+w, len=Math.floor(c.sampleRate*d), b=c.createBuffer(1,len,c.sampleRate), x=b.getChannelData(0); for(let k=0;k<len;k++) x[k]=(Math.random()*2-1)*Math.pow(1-k/len,2); const n=c.createBufferSource(); n.buffer=b; const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=hz||2000; const g=c.createGain(); g.gain.value=v||.3; n.connect(f); f.connect(g); g.connect(c.destination); n.start(t); }
function quack(){ const c=ac(); if(!c) return; const t=c.currentTime, o=c.createOscillator(), g=c.createGain(), f=c.createBiquadFilter(); o.type='sawtooth'; o.frequency.setValueAtTime(620,t); o.frequency.exponentialRampToValueAtTime(330,t+.18); f.type='bandpass'; f.frequency.value=1100; f.Q.value=3; g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.3,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+.22); o.connect(f); f.connect(g); g.connect(c.destination); o.start(t); o.stop(t+.25); }
function drum(){ tone(110,0,.18,.35,'sine'); tone(160,.12,.16,.3,'sine'); noise(.24,.35,.25,4000); }
function register(){ noise(0,.06,.35,1500); tone(1760,.06,.5,.12,'sine'); tone(2637,.12,.6,.1,'sine'); tone(3520,.2,.7,.08,'sine'); }
function printer(n){ for(let k=0;k<n;k++) noise(k*.06,.04,.12,3000); }

let shownBal=null;
function pill(){ try{
  let p=document.getElementById('tlcash');
  if(!A.st||A.view==='login'||(!A.view)){ if(p) p.remove(); return; }
  if(!p){ p=document.createElement('div'); p.id='tlcash'; p.setAttribute('role','button'); p.tabIndex=0; p.setAttribute('aria-label','Your cash. Open the Tashbar Store'); p.innerHTML='<span class="ci" aria-hidden="true">💵</span><b id="tlcashv"></b><i id="tlcashp"></i>'; document.body.appendChild(p);

  document.body.classList.add('tl-cashpill');
  const hideOnHub=A.view==='hub'&&!modalOpen()&&document.getElementById('wallet');
  document.body.classList.toggle('st-hide-pill',!!hideOnHub);
  const bal=Number(A.st.balance)||0, v=document.getElementById('tlcashv');
  if(shownBal===null||bal<shownBal) shownBal=bal;
  else if(bal>shownBal+.004){ const from=shownBal; shownBal=bal; roll(v,from,bal); p.classList.remove('bump'); void p.offsetWidth; p.classList.add('bump'); }
  if(v&&!v.dataset.rolling) v.textContent=$(shownBal);
  const est=lessonEst(), pe=document.getElementById('tlcashp'); if(pe){ pe.classList.toggle('on',est>0); if(est>0) pe.textContent='+'+$(est)+' on the way'; }
}catch(e){} }
function roll(v,from,to){ if(!v) return; v.dataset.rolling='1'; const t0=performance.now(), d=1300; const step=now=>{ const k=Math.min(1,(now-t0)/d); v.textContent=$(from+(to-from)*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(step); else { delete v.dataset.rolling; v.textContent=$(to); } }; requestAnimationFrame(step); }

const _sm=window.startMission||startMission;
startMission=function(){ try{ T.lesson={at:Date.now(),done:false,tries:0}; }catch(e){} return _sm.apply(this,arguments); };
function group(rows){ const m=new Map(); rows.forEach(r=>{ const k=String(r.why||'Earned')+'|'+r.amt; const g=m.get(k)||{why:String(r.why||'Earned'),amt:Number(r.amt)||0,n:0}; g.n++; m.set(k,g); }); return [...m.values()].sort((a,b)=>b.amt*b.n-a.amt*a.n); }
function nice(why){ let w=String(why); try{ if(typeof prettyWhy==='function') w=prettyWhy(w); }catch(e){} return w.replace(/^ms:\S+\s*/,'').replace(/\s+/g,' ').slice(0,46); }
setInterval(()=>{ try{
  const L=T.lesson; if(!L||L.done||!A.st) return;
  if(A.view!=='result'){ if(A.view!=='play') L.done=true; return; }
  L.tries++; const rows=(A.st.ledger||[]).filter(r=>r&&r.at>=L.at-3000&&Number(r.amt)>0);
  if(!rows.length){ if(L.tries>40) L.done=true; return; }
  L.done=true; setTimeout(()=>receipt(rows),900);
}catch(e){} },500);
function receipt(rows){
  if(document.querySelector('.strec')) return;
  const g=group(rows), tot=rows.reduce((a,r)=>a+(Number(r.amt)||0),0), d=new Date();
  const ov=document.createElement('div'); ov.className='strec'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-label','Your paycheck');
  ov.innerHTML=`<div class="paper"><h3>💵 PAYCHECK</h3><div class="sub">TASHBAR BANK · ${E(d.toLocaleDateString([], {weekday:'long',month:'short',day:'numeric'}))}<br>Pay to: ${E(A.st.name||'')}</div>
   ${g.map(x=>`<div class="ln"><span>${x.n>1?x.n+' × ':''}${E(nice(x.why))}</span><b>${$(x.amt*x.n)}</b></div>`).join('')}
   <div class="ln tot"><span>TOTAL</span><b>${$(tot)}</b></div><div class="stamp">PAID</div><button class="go" type="button">💵 Put it in my bank!</button></div>`;
  document.body.appendChild(ov);
  const lines=[...ov.querySelectorAll('.ln')], btn=ov.querySelector('.go'), stamp=ov.querySelector('.stamp');
  lines.forEach((l,k)=>setTimeout(()=>{ l.style.opacity=1; l.animate([{transform:'translateY(-8px)',opacity:0},{transform:'translateY(0)',opacity:1}],{duration:rmo()?1:260}); printer(2); },rmo()?0:250+k*260));
  const tEnd=rmo()?50:300+lines.length*260;
  setTimeout(()=>{ stamp.classList.add('on'); thunk(); },tEnd+200);
  setTimeout(()=>{ btn.style.opacity=1; btn.focus(); },tEnd+600);
  const close=()=>{ if(!ov.isConnected) return; const [fx,fy]=center(ov.querySelector('.paper')); ov.remove(); document.body.classList.remove('st-hide-pill'); const [tx,ty]=pillAt(); fly(fx,fy,tx,ty,Math.min(26,6+Math.round(tot/2))); register(); setTimeout(()=>{ const p=document.getElementById('tlcash'); if(p){ p.classList.remove('bump'); void p.offsetWidth; p.classList.add('bump'); } },900); };
  btn.addEventListener('click',close); ov.addEventListener('click',e=>{ if(e.target===ov) close(); });
  document.addEventListener('keydown',function k(e){ if(e.key==='Escape'){ close(); document.removeEventListener('keydown',k); } });
}

/* ---------- server data ---------- */
function load(force){ if(!A.st||!(typeof SRV!=='undefined'&&SRV.token)||T.loading) return Promise.resolve(T.info); if(!force&&T.info&&Date.now()-T.at<60000) return Promise.resolve(T.info);
  T.loading=true; return run('stInfo',SRV.token).then(r=>{ T.loading=false; if(r&&r.ok){ T.info=r; T.at=Date.now(); syncOwned(); weekly(); } return T.info; }).catch(e=>{ T.loading=false; T.err=msg(e); return T.info; }); }
function syncOwned(){ const s=ST(); s.owned=(T.info&&T.info.owned)||[]; Object.keys(s.wear).forEach(k=>{ if(s.owned.indexOf(s.wear[k])<0) delete s.wear[k]; }); }

/* ---------- 3+4. payday and interest (once a week) ---------- */
function weekly(){ try{ const I=T.info, s=ST(); if(!I||A.view!=='hub'||modalOpen()) return;
  if(I.interest&&I.interest.cents>0&&s.intSeen!==I.interest.at){ s.intSeen=I.interest.at; save(); setTimeout(()=>interestShow(I.interest.cents),1200); return; }
  const dow=new Date().getDay(); if((dow===4||dow===5)&&s.payday!==I.week.week&&I.week.earned>0){ s.payday=I.week.week; save(); setTimeout(()=>{ T.tab='week'; openStore(true); paydayShow(); },1500); }
}catch(e){} }
function save(){ try{ clearTimeout(T.sv); T.sv=setTimeout(()=>{ try{ saveStudent(A.st); }catch(e){} },1500); }catch(e){} }
function bannerX(text,emoji){ if(typeof window.tlChaChing!=='function'&&rmo()) return; const b=document.createElement('div'); b.className='hpbanner'; b.innerHTML=`<span>${emoji||'💰'}</span><b>${E(text)}</b><span>${emoji||'💰'}</span>`; document.body.appendChild(b);
 b.animate([{transform:'translate(-50%,-200%) rotate(-6deg) scale(.6)',opacity:0},{transform:'translate(-50%,0) rotate(-3deg) scale(1.1)',opacity:1,offset:.18},{transform:'translate(-50%,0) rotate(-3deg) scale(1)',opacity:1,offset:.8},{transform:'translate(-50%,-160%) rotate(-3deg) scale(.9)',opacity:0}],{duration:rmo()?600:2800,easing:'cubic-bezier(.2,.8,.3,1.2)'}).onfinish=()=>b.remove(); }
function rainDown(n){ if(rmo()) return; const [tx,ty]=pillAt(); for(let k=0;k<n;k++){ const x=Math.random()*innerWidth; fly(x,-40,tx,ty,1); } }
function interestShow(c){ bannerX('YOUR MONEY GREW! +'+$(c/100),'🏦'); hooray(); rainDown(18); try{ toast('🏦 The Tashbar Bank paid you '+$(c/100)+' interest for saving. Money that waits, grows!'); }catch(e){} }
function paydayShow(){ bannerX('PAYDAY!','💵'); hooray(); setTimeout(register,500); rainDown(30); setTimeout(confettiBurst,600); }

/* ---------- 5. the store ---------- */
const TABS=[['fun','🎮 Fun'],['real','🎁 Real prizes'],['canteen','💳 Canteen Cards'],['give','💝 Give'],['mine','🧺 My stuff'],['week','📊 My week']];
function openStore(keepTab){ if(!A.st) return; T.open=true; T.err=''; if(!keepTab&&!T.tab) T.tab='fun'; draw(); load(true).then(draw); }
function closeStore(){ T.open=false; T.confirm=null; const o=document.getElementById('tlstore'); if(o) o.remove(); try{ render(); }catch(e){} }
window.tlStore=openStore;

  if(!o){ o=document.createElement('div'); o.id='tlstore'; o.className='stov'; document.body.appendChild(o); }

   <div class="stbody">${!I?'<p>Opening the store…</p>':body(I,bal)}<p class="err" role="alert">${E(T.err)}</p></div>${T.confirm?conf(T.confirm,bal):''}</div>`;

function card(x,bal){ const own=owned(x.id), goal=ST().goal===x.id, worn=ST().wear[x.slot]===x.id, price=x.cents/100, need=Math.max(0,price-bal);
  const wear=x.kind==='wear'&&own?`<button class="wr ${worn?'on':''}" data-st="wear" data-id="${x.id}">${worn?'✓ Using it':'Use it'}</button>`:'';
  const canBuy=!(own&&(x.kind==='wear'||x.kind==='keep'));
  return `<div class="stcard ${own?'own':''} ${goal?'isgoal':''}">${own?'<span class="tag">YOURS</span>':''}<span class="em" aria-hidden="true">${x.emoji}</span><h4>${E(x.name)}</h4><p>${E(x.desc)}</p>
   <span class="pr">${$(price)}</span>${canBuy&&need>0?`<span class="need">Need ${$(need)} more</span><span class="nb"><i style="width:${Math.min(100,Math.round(bal/price*100))}%"></i></span>`:''}
   <div class="row">${canBuy?`<button class="buy" data-st="buy" data-id="${x.id}" ${need>0||T.busy?'disabled':''}>Buy it</button>`:''}${wear}${canBuy&&!own&&x.kind!=='donate'?`<button class="gl ${goal?'on':''}" data-st="goal" data-id="${x.id}">${goal?'🎯 My goal':'🎯 Make it my goal'}</button>`:''}</div></div>`; }
function body(I,bal){ const items=I.items.filter(x=>x.cat===T.tab);
  if(T.tab==='fun') return `<p class="stintro">Fun upgrades for your screen. They are yours forever, right away.</p><div class="stgrid">${items.map(x=>card(x,bal)).join('')}</div>`;
  if(T.tab==='real') return `<div class="note">🎁 Real prizes: after you buy one, a rebbe or teacher hands it to you. If it can’t happen, you get all your money back. Up to ${I.openPrizes} prizes can wait at a time.</div><div class="stgrid">${items.map(x=>card(x,bal)).join('')}</div>`;
  if(T.tab==='canteen'){ const c=I.canteen, left=Math.max(0,(c.weekMax-c.weekUsed)/100);
    return `<div class="note">💳 A Canteen Card turns Tashbar cash into Canteen Cash: <b>${$(c.rate)} Tashbar = $1.00 Canteen Cash</b>. Use Canteen Cash at the canteen for food. This week you can still get <b>${$(left)}</b> of Canteen Cash.${c.cash!==null&&c.cash!==undefined?` Your Canteen Cash now: <b>${$(c.cash)}</b>.`:' (You need a Canteen Cash account. Ask the office.)'}</div><div class="stgrid">${items.map(x=>card(x,bal)).join('')}</div>`; }
  if(T.tab==='give'){ const fr=I.friends||[], q=T.gift.q.toLowerCase(), list=fr.filter(f=>!q||f.name.toLowerCase().indexOf(q)>=0).slice(0,60);
    return `<div class="note">💝 Tzedakah: give some of your money back to Tashbar. Students have given <b>${$(I.given.school/100)}</b> so far. You gave <b>${$(I.given.mine/100)}</b>. Thank you!</div>
     <div class="stgrid">${items.filter(x=>x.kind==='donate').map(x=>card(x,bal)).join('')}</div>
     <div class="stgift"><h3 style="margin:0">🎁 Send money to a friend</h3><p style="margin:4px 0;color:#6B7280">Up to ${$(I.gift.dayMax/100)} a day. You sent ${$(I.gift.today/100)} today.</p>
      <label>Find your friend<input id="st-gq" value="${E(T.gift.q)}" placeholder="Type a name" autocomplete="off"></label>
      <select id="st-gto" size="5" aria-label="Pick a friend">${list.map(f=>`<option value="${E(f.id)}" ${f.id===T.gift.to?'selected':''}>${E(f.name)}</option>`).join('')}</select>
      <div class="amts">${[1,5,10,20,50].map(a=>`<button data-st="amt" data-a="${a}" class="${T.gift.amt===a?'on':''}">${$(a)}</button>`).join('')}</div>
      <button class="stgo" data-st="sendgift" ${T.gift.to&&bal>=T.gift.amt&&!T.busy?'':'disabled'}>🎁 Send ${$(T.gift.amt)}</button></div>
     <h3>🧱 The Builders’ Wall</h3><p class="stintro">Students who gave a brick to Tashbar.</p><div class="stwall">${(I.wall||[]).map(n=>`<span>${E(n)}</span>`).join('')||'<em>Be the first brick!</em>'}</div>`; }
  if(T.tab==='mine'){ const mine=I.items.filter(x=>owned(x.id));
    return `<h3 style="margin-top:0">✨ My upgrades</h3>${mine.length?`<div class="stgrid">${mine.map(x=>card(x,bal)).join('')}</div>`:'<p class="stintro">Nothing yet. Visit the Fun tab!</p>'}
     <h3>🧾 My orders</h3><div class="stlist">${(I.orders||[]).map(o=>`<div class="li"><span class="em">${o.emoji}</span><b>${E(o.label)}</b><span>${$(o.cents/100)}</span><span class="st ${E(o.status)}">${o.status==='waiting'?'⏳ On its way':o.status==='handed'?'✅ Got it':o.status==='cancelled'?'↩️ Money back':'✅ Done'}</span></div>`).join('')||'<p class="stintro">No orders yet.</p>'}</div>
     <h3>⭐ The Tashbar sky</h3><div class="stsky">${(I.stars||[]).map((n,k)=>`<span style="left:${(k*37)%86+3}%;top:${(k*53)%80+6}%">${E(n)}</span>`).join('')||'<span style="left:30%;top:45%">Name the first star!</span>'}</div>`; }
  if(T.tab==='week'){ const W=I.week, max=Math.max(1,...W.days.map(d=>d.cents)), best=W.days.reduce((a,d)=>d.cents>a.cents?d:a,W.days[0]), names=['Sun','Mon','Tue','Wed','Thu','Fri'];
    const ch=A.st.chest||null;
    return `<h3 style="margin-top:0">📊 My week</h3><div class="stweek">${W.days.map((d,k)=>`<div><b>${d.cents?$(d.cents/100):''}</b><i class="${d===best&&d.cents?'best':''}" style="height:${Math.round(d.cents/max*150)}px"></i><small>${names[k]}</small></div>`).join('')}</div>
     <div class="stkpis"><div><span>Earned this week</span><b>${$(W.earned/100)}</b></div><div><span>Best day</span><b>${best.cents?names[W.days.indexOf(best)]:'—'}</b></div><div><span>Bank interest</span><b>${$(W.interest/100)}</b></div><div><span>Spent and given</span><b>${$(W.spent/100)}</b></div>${ch?`<div><span>Treasure chest</span><b>${ch.paid?'Opened! 🎉':Math.min(ch.days,ch.need)+' of '+ch.need+' days'}</b></div>`:''}</div>
     <p class="stintro">🏦 Every Sunday the Tashbar Bank pays ${2}% interest on what you saved. Money that waits, grows!</p>`; }
  return ''; }
function conf(c,bal){ const x=item(c.id)||{}; const price=c.id==='gift'?T.gift.amt:x.cents/100; const fr=c.id==='gift'?((T.info.friends||[]).find(f=>f.id===T.gift.to)||{}).name:'';
  if(c.done) return `<div class="stconf"><div class="cb"><div class="em">${c.emoji||x.emoji}</div><h3>${E(c.title)}</h3><p>${E(c.text)}</p><button class="stgo" data-st="ok">🎉 Yay!</button></div></div>`;
  return `<div class="stconf"><div class="cb"><div class="em">${x.emoji}</div><h3>${c.id==='gift'?'Send '+$(price)+' to '+E(fr)+'?':'Buy '+E(x.name)+'?'}</h3><p>It costs <b>${$(price)}</b>. You will have <b>${$(bal-price)}</b> left.</p>
   <button class="stgo" data-st="yes" ${T.busy?'disabled':''}>${T.busy?'One moment…':c.id==='gift'?'🎁 Yes, send it!':x.kind==='donate'?'💝 Yes, give it!':'💵 Yes, buy it!'}</button> <button class="stgo alt" data-st="no">Not now</button></div></div>`; }
function buy(id){ const x=item(id); if(!x||T.busy) return; T.busy=true; T.err=''; draw();
  const cid=(Date.now().toString(36)+Math.random().toString(36).slice(2,10)).replace(/[^a-z0-9]/g,'');
  run('stBuy',SRV.token,id,{clientId:cid,to:T.gift.to,amount:T.gift.amt}).then(r=>{ T.busy=false;
    if(!r||!r.ok){ T.confirm=null; T.err='Something went wrong. Try again.'; draw(); return; }
    const from=Number(A.st.balance)||0; A.st.balance=r.balance; if(Array.isArray(r.ledger)){ A.st.ledger=r.ledger; try{ SRV.states[A.st.id]=Object.assign(SRV.states[A.st.id]||{},{balance:r.balance,ledger:r.ledger}); }catch(e){} }
    shownBal=r.balance;
    if(T.info){ if(x.kind==='wear'||x.kind==='keep') T.info.owned.push(x.id); T.info.orders.unshift(r.order); if(x.kind==='card'){ T.info.canteen.weekUsed+=x.card; if(r.cash!==null&&r.cash!==undefined) T.info.canteen.cash=r.cash; } if(x.kind==='donate') { T.info.given.mine+=x.cents; T.info.given.school+=x.cents; if(x.id==='brick') T.info.wall.unshift(A.st.name); } if(x.id==='star-named') T.info.stars.push(A.st.name); if(x.kind==='gift') T.info.gift.today+=Math.round(T.gift.amt*100); }
    if(x.kind==='wear'){ ST().wear[x.slot]=x.id; }
    if(ST().goal===x.id) delete ST().goal;
    syncOwned(); save();
    const done={wear:['It’s yours!','Your new '+x.name.toLowerCase()+' is on. Look at your home page!'],keep:['It’s yours!','Look up! Your star is in the Tashbar sky (My stuff tab).'],
      prize:['Your prize is on its way!','A rebbe or teacher will hand it to you. You can see it in My stuff.'],card:['Canteen Cash added!',$(x.card/100)+' is now in your Canteen Cash'+(r.cash!=null?' (now '+$(r.cash)+')':'')+'. Buy food at the canteen!'],
      donate:['Thank you for giving!','You gave '+$(x.cents/100)+' back to Tashbar. That is real tzedakah.'],gift:['Gift sent!','Your friend got '+$(T.gift.amt)+' from you. What a good friend!']}[x.kind]||['Done!',''];
    T.confirm={id:x.id,done:true,emoji:x.emoji,title:done[0],text:done[1]}; draw(); spendShow(x,from-r.balance);
  }).catch(e=>{ T.busy=false; T.confirm=null; T.err=msg(e); draw(); }); }
function spendShow(x,amt){ const box=document.querySelector('.stconf .cb'), [tx,ty]=center(box), bal=document.querySelector('.stbal b'), [fx,fy]=center(bal);
  fly(fx,fy,tx,ty,Math.min(24,4+Math.round(amt/50)), x.kind==='donate'?['💝','💵','💖']:x.kind==='gift'?['🎁','💵']:x.kind==='card'?['💳','💵']:bills()); register(); setTimeout(hooray,500);
  if(x.kind==='donate'||x.cents>=100000) setTimeout(confettiBurst,700); if(x.kind==='donate') setTimeout(()=>bannerX('TZEDAKAH!','💝'),300); }

/* ---------- clicks ---------- */
document.addEventListener('click',e=>{ const b=e.target.closest&&e.target.closest('[data-st]'); if(!b) return; const a=b.dataset.st;
  if(a==='close'){ closeStore(); return; }
  if(a==='open'){ e.preventDefault(); T.tab=b.dataset.t||T.tab||'fun'; openStore(true); return; }
  if(a==='tab'){ T.tab=b.dataset.t; T.err=''; draw(); return; }
  if(a==='buy'){ T.confirm={id:b.dataset.id}; draw(); return; }
  if(a==='yes'){ buy(T.confirm.id); return; }
  if(a==='no'||a==='ok'){ T.confirm=null; draw(); return; }
  if(a==='goal'){ const s=ST(); s.goal=s.goal===b.dataset.id?null:b.dataset.id; if(!s.goal) delete s.goal; save(); draw(); return; }
  if(a==='wear'){ const x=item(b.dataset.id), s=ST(); if(!x) return; if(s.wear[x.slot]===x.id) delete s.wear[x.slot]; else s.wear[x.slot]=x.id; save(); draw(); dress(); return; }
  if(a==='amt'){ T.gift.amt=Number(b.dataset.a)||5; draw(); return; }
  if(a==='sendgift'){ if(!T.gift.to) return; T.confirm={id:'gift'}; draw(); return; }
});
document.addEventListener('input',e=>{ if(e.target&&e.target.id==='st-gq'){ T.gift.q=e.target.value; const pos=e.target.selectionStart; draw(); const n=document.getElementById('st-gq'); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(x){} } } });
document.addEventListener('change',e=>{ if(e.target&&e.target.id==='st-gto'){ T.gift.to=e.target.value; draw(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&T.open){ if(T.confirm){ T.confirm=null; draw(); } else closeStore(); } });

/* ---------- 6+7. home: store button, goal bar, and the boy's upgrades ---------- */

  return `<section class="stgoalbar" aria-label="Tashbar Store"><span class="em" aria-hidden="true">🏪</span><div class="t"><b>The Tashbar Store is open!</b><small>Fun upgrades, real prizes, Canteen Cards, and tzedakah. Pick a goal and save for it.</small></div><button type="button" data-st="open" data-t="fun">🏪 Open the store</button></section>`; }

    if(w.frame==='frame-gold') h.classList.add('st-frame-gold'); if(w.frame==='frame-fire') h.classList.add('st-frame-fire');

    const tt=w.title&&item(w.title); if(tt) h.insertAdjacentHTML('beforeend',`<span class="sttitle">${E(tt.name.replace(/^Title:\s*/,''))}</span>`); }
}catch(e){} }
const _r=render;
render=function(){ const out=_r.apply(this,arguments); try{
  if(A.st&&A.view==='hub'){ const hp=document.querySelector('.hp2');
