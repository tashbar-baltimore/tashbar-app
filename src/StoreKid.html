/* ---------- sounds (small, made here; no files) ---------- */
let AC=null; function ac(){ try{ if(typeof SND!=='undefined'&&SND&&SND.on===false) return null; AC=AC||new (window.AudioContext||window.webkitAudioContext)(); return AC; }catch(e){ return null; } }
function tone(f,w,d,v,type){ const c=ac(); if(!c) return; const t=c.currentTime+w, o=c.createOscillator(), g=c.createGain(); o.type=type||'triangle'; o.frequency.value=f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v||.12,t+.01); g.gain.exponentialRampToValueAtTime(.0008,t+d); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+.05); }
function noise(w,d,v,hz){ const c=ac(); if(!c) return; const t=c.currentTime+w, len=Math.floor(c.sampleRate*d), b=c.createBuffer(1,len,c.sampleRate), x=b.getChannelData(0); for(let k=0;k<len;k++) x[k]=(Math.random()*2-1)*Math.pow(1-k/len,2); const n=c.createBufferSource(); n.buffer=b; const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=hz||2000; const g=c.createGain(); g.gain.value=v||.3; n.connect(f); f.connect(g); g.connect(c.destination); n.start(t); }
function quack(){ const c=ac(); if(!c) return; const t=c.currentTime, o=c.createOscillator(), g=c.createGain(), f=c.createBiquadFilter(); o.type='sawtooth'; o.frequency.setValueAtTime(620,t); o.frequency.exponentialRampToValueAtTime(330,t+.18); f.type='bandpass'; f.frequency.value=1100; f.Q.value=3; g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.3,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+.22); o.connect(f); f.connect(g); g.connect(c.destination); o.start(t); o.stop(t+.25); }
function drum(){ tone(110,0,.18,.35,'sine'); tone(160,.12,.16,.3,'sine'); noise(.24,.35,.25,4000); }
function register(){ noise(0,.06,.35,1500); tone(1760,.06,.5,.12,'sine'); tone(2637,.12,.6,.1,'sine'); tone(3520,.2,.7,.08,'sine'); }
function printer(n){ for(let k=0;k<n;k++) noise(k*.06,.04,.12,3000); }
function thunk(){ tone(90,0,.25,.4,'sine'); noise(0,.08,.25,600); }
function hooray(){ [[523,0],[659,.1],[784,.2],[1047,.32],[1319,.46],[1568,.6]].forEach(([f,w])=>{ tone(f,w,.45,.12,'triangle'); }); }

/* ---------- flying money ---------- */
function bills(){ return ST().wear&&ST().wear.coins==='gold-coins'?['🪙','🪙','💰','🥇']:['💵','💵','💵','💰']; }
window.TL_CASH_EMOJI=()=>bills()[Math.floor(Math.random()*4)];
function fly(fx,fy,tx,ty,n,list){ if(rmo()) return; list=list||bills(); for(let k=0;k<n;k++){ const e=document.createElement('i'); e.className='stmoney'; e.textContent=list[k%list.length]; e.style.left=fx+'px'; e.style.top=fy+'px'; document.body.appendChild(e);
 const mx=(fx+tx)/2+(Math.random()-.5)*360, my=Math.min(fy,ty)-140-Math.random()*140;
 e.animate([{transform:'translate(0,0) scale(.5) rotate(0)',opacity:0},{transform:`translate(${mx-fx}px,${my-fy}px) scale(1.3) rotate(${Math.random()*40-20}deg)`,opacity:1,offset:.45},{transform:`translate(${tx-fx}px,${ty-fy}px) scale(.45) rotate(${Math.random()*60-30}deg)`,opacity:.9}],{duration:950+k*40,delay:k*45,easing:'cubic-bezier(.3,.6,.4,1)',fill:'forwards'}).onfinish=()=>e.remove(); } }
function center(el){ const r=el?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0}; return [r.left+r.width/2,r.top+r.height/2]; }
function pillAt(){ const p=document.getElementById('tlcash'); if(p&&getComputedStyle(p).display!=='none') return center(p); const w=document.getElementById('wallet'); return w?center(w):[innerWidth-80,24]; }
function confettiBurst(){ try{ if(typeof confetti==='function') confetti(); }catch(e){} }

/* ---------- 1. cash pill ---------- */
function lessonEst(){ const p=A.play; if(A.view!=='play'||!p) return 0; return (p.results||[]).filter(r=>r&&r.ok).reduce((a,r)=>a+1+(r.first?.5:0),0); }
function modalOpen(){ return !!(document.getElementById('kkov')||document.getElementById('tr-ov')||document.getElementById('elec-ov')||document.getElementById('sci-ov')||(window.HP&&HP.open)||A.overlay||T.open); }
let shownBal=null;
function pill(){ try{
  let p=document.getElementById('tlcash');
  if(!A.st||A.view==='login'||(!A.view)){ if(p) p.remove(); return; }
  if(!p){ p=document.createElement('div'); p.id='tlcash'; p.setAttribute('role','status'); p.setAttribute('aria-label','My money');
    p.innerHTML='<span class="tw"><small class="tl">My money</small><b id="tlcashv"></b><small class="td" id="tlcasht"></small></span><i id="tlcashp"></i>'; document.body.appendChild(p); }
  { const t=document.getElementById('tlcasht'), tx=todayTxt(); if(t&&t.textContent!==tx) t.textContent=tx; }
  document.body.classList.add('tl-cashpill');
  /* MONEY BADGE (HoS 2026-11-19: "the money should be on all the pages, including tests"): the same badge on every boy page,
     home included (it replaces the big orange home bar). Hidden only while the Store itself is open (its header shows the cash). */
  document.body.classList.toggle('st-hide-pill',!!(T.open&&document.getElementById('tlstore')));
  const bal=Number(A.st.balance)||0, v=document.getElementById('tlcashv');
  if(shownBal===null||bal<shownBal) shownBal=bal;
  else if(bal>shownBal+.004){ const from=shownBal; shownBal=bal; roll(v,from,bal); p.classList.remove('bump'); void p.offsetWidth; p.classList.add('bump'); }
  if(v&&!v.dataset.rolling) v.textContent=$(shownBal);
  const est=lessonEst(), pe=document.getElementById('tlcashp'); if(pe){ pe.classList.toggle('on',est>0); if(est>0) pe.textContent='+'+$(est)+' on the way'; }
}catch(e){} }
/* what he earned today, from his ledger (display only; the server sets every amount) */
function todayTxt(){ try{ const d=new Date().toDateString(); const t=(A.st.ledger||[]).filter(x=>x&&x.at&&new Date(x.at).toDateString()===d).reduce((a,x)=>a+Math.max(0,Number(x.amt)||0),0); return t>0?'+'+$(t)+' today':'+$0.00 today'; }catch(e){ return ''; } }
function roll(v,from,to){ if(!v) return; v.dataset.rolling='1'; const t0=performance.now(), d=1300; const step=now=>{ const k=Math.min(1,(now-t0)/d); v.textContent=$(from+(to-from)*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(step); else { delete v.dataset.rolling; v.textContent=$(to); } }; requestAnimationFrame(step); }
setInterval(pill,350);

/* ---------- 2. paycheck after every lesson ---------- */
const _sm=window.startMission||startMission;
startMission=function(){ try{ T.lesson={at:Date.now(),done:false,tries:0}; }catch(e){} return _sm.apply(this,arguments); };
function group(rows){ const m=new Map(); rows.forEach(r=>{ const k=String(r.why||'Earned')+'|'+r.amt; const g=m.get(k)||{why:String(r.why||'Earned'),amt:Number(r.amt)||0,n:0}; g.n++; m.set(k,g); }); return [...m.values()].sort((a,b)=>b.amt*b.n-a.amt*a.n); }
function nice(why){ let w=String(why); try{ if(typeof prettyWhy==='function') w=prettyWhy(w); }catch(e){} return w.replace(/^ms:\S+\s*/,'').replace(/\s+/g,' ').slice(0,46); }
setInterval(()=>{ try{
  const L=T.lesson; if(!L||L.done||!A.st) return;
  if(A.view!=='result'){ if(A.view!=='play') L.done=true; return; }
  L.tries++; const rows=(A.st.ledger||[]).filter(r=>r&&r.at>=L.at-3000&&Number(r.amt)>0);
  if(!rows.length){ if(L.tries>40) L.done=true; return; }
  L.done=true; setTimeout(()=>receipt(rows),900);
}catch(e){} },500);
function receipt(rows){
  if(document.querySelector('.strec')) return;
  const g=group(rows), tot=rows.reduce((a,r)=>a+(Number(r.amt)||0),0), d=new Date();
  const ov=document.createElement('div'); ov.className='strec'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-label','Your paycheck');
  ov.innerHTML=`<div class="paper"><h3>💵 PAYCHECK</h3><div class="sub">TASHBAR BANK · ${E(d.toLocaleDateString([], {weekday:'long',month:'short',day:'numeric'}))}<br>Pay to: ${E(A.st.name||'')}</div>
   ${g.map(x=>`<div class="ln"><span>${x.n>1?x.n+' × ':''}${E(nice(x.why))}</span><b>${$(x.amt*x.n)}</b></div>`).join('')}
   <div class="ln tot"><span>TOTAL</span><b>${$(tot)}</b></div><div class="stamp">PAID</div>${window.TLK?TLK.main('Put it in my bank','','strec-go'):'<button class="go" type="button">Put it in my bank</button>'}</div>`;
  document.body.appendChild(ov);
  const lines=[...ov.querySelectorAll('.ln')], btn=ov.querySelector('.strec-go,.go'), stamp=ov.querySelector('.stamp');
  lines.forEach((l,k)=>setTimeout(()=>{ l.style.opacity=1; l.animate([{transform:'translateY(-8px)',opacity:0},{transform:'translateY(0)',opacity:1}],{duration:rmo()?1:260}); printer(2); },rmo()?0:250+k*260));
  const tEnd=rmo()?50:300+lines.length*260;
  setTimeout(()=>{ stamp.classList.add('on'); thunk(); },tEnd+200);
  setTimeout(()=>{ btn.style.opacity=1; btn.focus(); },tEnd+600);
  const close=()=>{ if(!ov.isConnected) return; const [fx,fy]=center(ov.querySelector('.paper')); ov.remove(); document.body.classList.remove('st-hide-pill'); const [tx,ty]=pillAt(); fly(fx,fy,tx,ty,Math.min(26,6+Math.round(tot/2))); register(); setTimeout(()=>{ const p=document.getElementById('tlcash'); if(p){ p.classList.remove('bump'); void p.offsetWidth; p.classList.add('bump'); } },900); };
  btn.addEventListener('click',close); ov.addEventListener('click',e=>{ if(e.target===ov) close(); });
  document.addEventListener('keydown',function k(e){ if(e.key==='Escape'){ close(); document.removeEventListener('keydown',k); } });
}

/* ---------- server data ---------- */
function load(force){ if(!A.st||!(typeof SRV!=='undefined'&&SRV.token)||T.loading) return Promise.resolve(T.info); if(!force&&T.info&&Date.now()-T.at<60000) return Promise.resolve(T.info);
  T.loading=true; return run('stInfo',SRV.token).then(r=>{ T.loading=false; if(r&&r.ok){ T.info=r; T.at=Date.now(); syncOwned(); weekly(); } return T.info; }).catch(e=>{ T.loading=false; T.err=msg(e); return T.info; }); }
function syncOwned(){ const s=ST(); s.owned=(T.info&&T.info.owned)||[]; Object.keys(s.wear).forEach(k=>{ if(s.owned.indexOf(s.wear[k])<0) delete s.wear[k]; }); }

/* ---------- 3+4. payday and interest (once a week) ---------- */
function weekly(){ try{ const I=T.info, s=ST(); if(!I||A.view!=='hub'||modalOpen()) return;
  const dow=new Date().getDay(); if((dow===4||dow===5)&&s.payday!==I.week.week&&I.week.earned>0){ s.payday=I.week.week; save(); setTimeout(()=>{ T.tab='week'; openStore(true); paydayShow(); },1500); }
}catch(e){} }
function save(){ try{ clearTimeout(T.sv); T.sv=setTimeout(()=>{ try{ saveStudent(A.st); }catch(e){} },1500); }catch(e){} }
function bannerX(text,emoji){ if(typeof window.tlChaChing!=='function'&&rmo()) return; const b=document.createElement('div'); b.className='hpbanner'; b.innerHTML=`<span>${emoji||'💰'}</span><b>${E(text)}</b><span>${emoji||'💰'}</span>`; document.body.appendChild(b);
 b.animate([{transform:'translate(-50%,-200%) rotate(-6deg) scale(.6)',opacity:0},{transform:'translate(-50%,0) rotate(-3deg) scale(1.1)',opacity:1,offset:.18},{transform:'translate(-50%,0) rotate(-3deg) scale(1)',opacity:1,offset:.8},{transform:'translate(-50%,-160%) rotate(-3deg) scale(.9)',opacity:0}],{duration:rmo()?600:2800,easing:'cubic-bezier(.2,.8,.3,1.2)'}).onfinish=()=>b.remove(); }
function rainDown(n){ if(rmo()) return; const [tx,ty]=pillAt(); for(let k=0;k<n;k++){ const x=Math.random()*innerWidth; fly(x,-40,tx,ty,1); } }
function paydayShow(){ bannerX('PAYDAY!','💵'); hooray(); setTimeout(register,500); rainDown(30); setTimeout(confettiBurst,600); }

const SHELVES=[['holiday','🕎 Holiday shop',''],['tap','💥 Tap blasts','Change what happens every time you tap or swipe.'],['trail','🌈 Trails','Something fun follows your mouse or finger.'],['color','🎨 App colors','Color the whole app: home, lessons, everything.'],['bonus','🎁 Bonuses','Extra fun buttons and celebrations.'],['','🏠 Home upgrades','Make your home page your own.']];

function closeStore(){ T.open=false; T.confirm=null; const o=document.getElementById('tlstore'); if(o) o.remove(); try{ render(); }catch(e){} }

   <div class="stbal">${window.TLK?TLK.box('money','My money',$(bal)):'<span>My money</span><b>'+$(bal)+'</b>'}</div>${I&&I.pf<1&&window.tlQuarterHTML?window.tlQuarterHTML(I.pf,true):''}
   <div class="sttabs" role="tablist">${TABS.map(t=>T.tab===t[0]?`<span class="stcur" role="tab" aria-selected="true">${P('now',t[1])}</span>`:KQ(t[1],`role="tab" aria-selected="false" data-st="tab" data-t="${t[0]}"`)).join('')}</div></div>

function KM(t,a){ return window.TLK?TLK.main(t,a):'<button type="button" '+a+'>'+E(t)+'</button>'; }

   <span class="pr">${P('money',$(price))}</span>${canBuy&&need>0?`<span class="need">${P('lock','Need '+$(need)+' more')}</span><span class="nb"><i style="width:${Math.min(100,Math.round(bal/price*100))}%"></i></span>`:''}

     <div class="stgrid">${items.filter(x=>x.kind==='donate').map(x=>card(x,bal)).join('')}</div>
