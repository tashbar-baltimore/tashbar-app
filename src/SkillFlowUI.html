<style id="sf-css">
/* SkillFlowUI.html — the staff SKILL FLOW CHART (Head of School 2026-11-19). Opened from the Course map tab "Skill flow chart"
   (DeptMapUI.html) or window.SF.open('ENGLISH'). Server: SkillFlow.js sfFlow. Placing a boy reuses the Course map's boy picker and the
   Library's libApply 'place' (rules, undo, history). Read-only otherwise. No double slash in this file. */
#sf-ov{position:fixed;inset:0;z-index:2147483050;background:#F3F5F8;color:#16202C;overflow:auto;font:15px/1.5 system-ui,"Segoe UI",Roboto,sans-serif;
  --taught:#178A5E;--guided:#B87D06;--quiz:#C8402F;--plan:#7A8494;--hi:#2F5BD3;--hi2:#8B3FD1;--line:#D6DCE5;--zone:#E9EDF3;--mute:#5B6676;--paper:#fff;--sel:#FFF4CC}
#sf-ov *{box-sizing:border-box}
#sf-ov .sf-top{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;padding:12px max(16px,env(safe-area-inset-left,0px)) 8px;position:sticky;top:0;background:#F3F5F8;z-index:6;border-bottom:1px solid var(--line)}
#sf-ov h2{margin:0;font:900 26px/1.1 system-ui,sans-serif;letter-spacing:-.01em}
#sf-ov .sf-sub{color:var(--mute);font-size:13px;margin-top:2px}
#sf-ov .sf-x{border:0;background:#16202C;color:#fff;border-radius:10px;padding:9px 16px;font:700 14px system-ui,sans-serif;cursor:pointer}
#sf-ov .sf-body{padding:10px max(16px,env(safe-area-inset-left,0px)) 40px}
#sf-ov .sf-sum{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:12px;margin-bottom:10px}
@media (max-width:760px){ #sf-ov .sf-sum{grid-template-columns:1fr} }
#sf-ov .sf-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:0}
#sf-ov .sf-eye{font:700 11px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
#sf-ov .sf-bar{display:flex;height:14px;border-radius:6px;overflow:hidden;margin:8px 0 6px}
#sf-ov .sf-bar span{display:block;height:100%}
#sf-ov .sf-nums{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--mute)}
#sf-ov .sf-nums b{font:800 18px system-ui,sans-serif;color:#16202C;margin-right:3px}
#sf-ov .sf-weak{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 14px;margin-top:6px;font-size:13px}
#sf-ov .sf-weak button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:3px 0}
#sf-ov .sf-weak em{font-style:normal;font-weight:700;color:var(--quiz)}
#sf-ov .sf-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
#sf-ov .sf-seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
#sf-ov .sf-seg button{border:0;background:none;padding:7px 12px;font:600 13px system-ui,sans-serif;color:var(--mute);cursor:pointer;min-height:36px}
#sf-ov .sf-seg button.on{background:#16202C;color:#fff}
#sf-ov .sf-tools input{flex:1 1 200px;min-width:0;max-width:340px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:14px system-ui,sans-serif}
#sf-ov .sf-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 10px;font:600 12.5px system-ui,sans-serif;cursor:pointer}
#sf-ov .sf-chip.off{opacity:.4} #sf-ov .sf-chip i{width:11px;height:11px;border-radius:3px;display:inline-block}
#sf-ov .sf-hint{color:var(--mute);font-size:12.5px}
#sf-ov .sf-wrap{border:1px solid var(--line);border-radius:14px;background:var(--paper);overflow:auto;height:min(70vh,880px);position:relative}
#sf-map{position:relative;transform-origin:0 0}
#sf-ov .sf-zh{position:absolute;top:0;height:34px;display:flex;align-items:center;justify-content:center;font:800 12px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);border-bottom:1px solid var(--line);background:var(--paper);z-index:3}
#sf-ov .sf-zb{position:absolute;top:0} #sf-ov .sf-zb.alt{background:var(--zone)}
#sf-ov .sf-lh{position:absolute;left:0;width:150px;padding:6px 10px;font:800 13.5px/1.15 system-ui,sans-serif;border-left:6px solid;background:var(--paper);z-index:3}
#sf-ov .sf-lh small{display:block;font:500 11px/1.3 system-ui,sans-serif;color:var(--mute);margin-top:3px}
#sf-ov .sf-lr{position:absolute;left:150px;border-top:1px solid var(--line)}
#sf-ov svg.sf-e{position:absolute;inset:0;pointer-events:none;overflow:visible}
#sf-ov svg.sf-e path{fill:none;stroke:var(--line);stroke-width:1.4}
#sf-ov svg.sf-e path.up{stroke:var(--hi);stroke-width:2.4;opacity:1!important} #sf-ov svg.sf-e path.down{stroke:var(--hi2);stroke-width:2.4;opacity:1!important} #sf-ov svg.sf-e path.fade{opacity:.1!important}
#sf-ov .sf-n{position:absolute;width:172px;height:30px;border:1px solid var(--line);border-left:5px solid;border-radius:7px;background:var(--paper);color:#16202C;font:600 12.5px/1 system-ui,sans-serif;text-align:left;padding:0 8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2}
#sf-ov .sf-n.taught{border-left-color:var(--taught)} #sf-ov .sf-n.guided{border-left-color:var(--guided)} #sf-ov .sf-n.quiz{border-left-color:var(--quiz);background:#FCF0EE}
#sf-ov .sf-n.planned{border-style:dashed;border-left-color:var(--plan);color:var(--mute);background:transparent}
#sf-ov .sf-n.fade{opacity:.15} #sf-ov .sf-n.up{box-shadow:0 0 0 2px var(--hi)} #sf-ov .sf-n.down{box-shadow:0 0 0 2px var(--hi2)} #sf-ov .sf-n.sel{background:var(--sel);box-shadow:0 0 0 3px #16202C} #sf-ov .sf-n.hide{display:none}
#sf-ov .sf-n b{float:right;font:800 11px system-ui,sans-serif;color:#fff;background:var(--hi);border-radius:999px;padding:2px 6px;margin-top:6px;margin-left:4px}
#sf-ov .sf-d{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--paper);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.12);z-index:9;overflow:auto;padding:16px 20px 40px;transform:translateX(105%);transition:transform .2s}
#sf-ov .sf-d.open{transform:none}
@media (max-width:700px){ #sf-ov .sf-d{top:auto;height:84vh;width:100%;border-radius:16px 16px 0 0;transform:translateY(105%)} }
@media (prefers-reduced-motion:reduce){ #sf-ov .sf-d{transition:none} }
#sf-ov .sf-d h3{margin:6px 0 4px;font:900 26px/1.1 system-ui,sans-serif}
#sf-ov .sf-d h4{margin:16px 0 6px;font:800 15px system-ui,sans-serif}
#sf-ov .sf-id{font:500 12px ui-monospace,Consolas,monospace;color:var(--mute)}
#sf-ov .sf-pill{display:inline-block;border-radius:999px;padding:3px 10px;font:700 12px system-ui,sans-serif;color:#fff}
#sf-ov .sf-pill.taught{background:var(--taught)} #sf-ov .sf-pill.guided{background:var(--guided)} #sf-ov .sf-pill.quiz{background:var(--quiz)} #sf-ov .sf-pill.planned{background:var(--plan)}
#sf-ov .sf-goal{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:12px 0;background:#F3F5F8}
#sf-ov .sf-goal b{font:800 18px/1.25 system-ui,sans-serif;display:block}
#sf-ov ol.sf-st{list-style:none;margin:0 0 0 9px;padding:0;counter-reset:s;border-left:2px solid var(--line)}
#sf-ov ol.sf-st li{counter-increment:s;position:relative;padding:0 0 10px 18px;font-size:14px}
#sf-ov ol.sf-st li::before{content:counter(s);position:absolute;left:-11px;top:0;width:20px;height:20px;border-radius:50%;background:#16202C;color:#fff;font:700 11px/20px system-ui,sans-serif;text-align:center}
#sf-ov ol.sf-st li b{display:block;font:700 13px system-ui,sans-serif}
#sf-ov ul.sf-f{margin:0;padding-left:18px;font-size:14px}
#sf-ov .sf-l{display:flex;flex-wrap:wrap;gap:6px}
#sf-ov .sf-l button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 9px;font:600 12.5px system-ui,sans-serif;cursor:pointer;border-left:4px solid;color:#16202C}
#sf-ov .sf-l button.taught{border-left-color:var(--taught)} #sf-ov .sf-l button.guided{border-left-color:var(--guided)} #sf-ov .sf-l button.quiz{border-left-color:var(--quiz)} #sf-ov .sf-l button.planned{border-left-style:dashed;border-left-color:var(--plan)}
#sf-ov .sf-place{margin-top:18px;border:2px solid #16202C;border-radius:12px;padding:12px}
#sf-ov .sf-place button{background:#16202C;color:#fff;border:0;border-radius:10px;padding:10px 16px;font:700 14px system-ui,sans-serif;cursor:pointer}
#sf-ov .sf-place p{margin:8px 0 0;font-size:13px;color:var(--mute)}
#sf-ov .sf-live{display:flex;gap:16px;font-size:14px;margin-top:6px} #sf-ov .sf-live b{font-size:18px}
#sf-ov button:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
</style>
<script>
(function(){
var NAME={taught:'Taught: full lesson',guided:'Guided practice',quiz:'Mostly quiz',planned:'Not built yet'};
var COLW=196, LABW=150, TOP=40, CARD=34, PADV=10, ZONES=['Kindergarten','Grade 1','Grade 2','Grade 3','Grade 4','Grade 5','Grade 6','Grade 7','Grade 8','High school'];
var LANECOL=['#7C5CC4','#3E7BD9','#1C9FB0','#4BA36E','#9C8A1E','#D06A2C','#C2416F','#6E7A8A','#3F5AA8','#2E8C8C','#8A5A2B','#B0476A','#5C7A2E','#9A3FBF','#466B9E'];
var X={ subj:'ENGLISH', R:null, by:{}, side:'all', show:{taught:1,guided:1,quiz:1,planned:1}, sel:null, zoom:1, pos:{}, W:0 };
function E(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function call(fn){ var a=[].slice.call(arguments,1); if(typeof run==='function') return run.apply(null,[fn].concat(a)); return new Promise(function(ok,no){ var r=google.script.run.withSuccessHandler(ok).withFailureHandler(no); r[fn].apply(r,a); }); }
function tok(){ try{ return S.token; }catch(e){ return null; } }
function $(id){ return document.getElementById(id); }
function open(subj){ X.subj=String(subj||'ENGLISH').toUpperCase(); var ov=$('sf-ov'); if(!ov){ ov=document.createElement('div'); ov.id='sf-ov'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true'); ov.setAttribute('aria-label','Skill flow chart'); document.body.appendChild(ov); }
  ov.innerHTML='<div class="sf-top"><div><h2>Skill flow chart</h2><div class="sf-sub">Loading the '+E(X.subj.toLowerCase())+' flow…</div></div><button type="button" class="sf-x" data-sf="close">Close</button></div>';
  call('sfFlow',tok(),X.subj).then(function(r){ X.R=r; X.by={}; r.flow.nodes.forEach(function(n){ n.from=[]; n.to=[]; X.by[n.id]=n; }); r.flow.edges.forEach(function(e){ if(X.by[e[0]]&&X.by[e[1]]){ X.by[e[1]].from.push(e[0]); X.by[e[0]].to.push(e[1]); } }); shell(); draw(); })
   .catch(function(err){ ov.querySelector('.sf-sub').textContent='Could not load: '+String(err&&err.message||err); }); }
function close(){ var ov=$('sf-ov'); if(ov) ov.remove(); X.sel=null; }
function shell(){ var F=X.R.flow, ov=$('sf-ov'), sum={taught:0,guided:0,quiz:0,planned:0}; F.nodes.forEach(function(n){ sum[n.depth]++; }); var tot=F.nodes.length;
  var groups={}, LN={}; F.lanes.forEach(function(l){ LN[l.id]=l.name; }); F.nodes.forEach(function(n){ if(n.L>9) return; var band=n.L<=4?'K–3':'4–8', k=n.lane+'|'+band, g=groups[k]=groups[k]||{lane:n.lane,band:band,bad:0,all:0,first:null}; g.all++; if(n.depth==='quiz'||n.planned){ g.bad++; if(!g.first) g.first=n.id; } });
  var working=0; Object.keys(X.R.live||{}).forEach(function(k){ working+=X.R.live[k][0]; });
  var h='<div class="sf-top"><div><h2>'+E(F.title)+' skill flow</h2><div class="sf-sub">'+E(F.from)+' to '+E(F.to)+': every skill in order. Tap a stop to see its goal, how it is taught, how mastery is proven, and to place a boy there.</div></div><button type="button" class="sf-x" data-sf="close">Close</button></div><div class="sf-body">';
  h+='<div class="sf-sum"><div class="sf-card"><div class="sf-eye">How each skill is taught today</div><div class="sf-bar">'+['taught','guided','quiz','planned'].map(function(k){ return '<span title="'+NAME[k]+'" style="width:'+(100*sum[k]/tot)+'%;background:var(--'+(k==='planned'?'plan':k)+')"></span>'; }).join('')+'</div><div class="sf-nums">'+['taught','guided','quiz','planned'].map(function(k){ return '<span><b>'+sum[k]+'</b>'+NAME[k].toLowerCase()+'</span>'; }).join('')+'</div>'+(working?'<div class="sf-hint" style="margin-top:6px">Blue numbers on a stop = boys working on it right now.</div>':'')+'</div>';
  h+='<div class="sf-card"><div class="sf-eye">Weakest stretches: mostly quiz or not built</div><div class="sf-weak">'+Object.values(groups).filter(function(g){ return g.bad; }).sort(function(a,b){ return b.bad/b.all-a.bad/a.all||b.bad-a.bad; }).slice(0,10).map(function(g){ return '<button type="button" data-sf="go" data-id="'+g.first+'"><span>'+E(LN[g.lane])+', grades '+g.band+'</span><em>'+g.bad+' of '+g.all+'</em></button>'; }).join('')+'</div></div></div>';
  h+='<div class="sf-tools"><div class="sf-seg"><button type="button" data-sf="side" data-v="all" class="on">All</button><button type="button" data-sf="side" data-v="read">Reading</button><button type="button" data-sf="side" data-v="write">Writing &amp; Language</button></div><input id="sf-q" type="search" placeholder="Find a skill: inference, vowel teams, thesis…" aria-label="Find a skill">'
   +['taught','guided','quiz','planned'].map(function(k){ return '<button type="button" class="sf-chip" data-sf="show" data-k="'+k+'"><i style="background:var(--'+(k==='planned'?'plan':k)+')"></i>'+NAME[k]+'</button>'; }).join('')
   +'<div class="sf-seg"><button type="button" data-sf="zoom" data-v="-1" aria-label="Zoom out">−</button><button type="button" data-sf="zoom" data-v="1" aria-label="Zoom in">+</button></div><span class="sf-hint">Blue = 3 steps before · Purple = 3 steps after</span></div>';
  h+='<div class="sf-wrap" id="sf-wrap"><div id="sf-map"><svg class="sf-e" id="sf-e"></svg></div></div><p class="sf-hint">'+E(F.mastery)+' Built '+E(X.R.built)+' from the live lessons. “Not built yet” stops are what a full day-school program needs and the app does not have.</p></div><div class="sf-d" id="sf-d" aria-hidden="true"></div>';
  ov.innerHTML=h; $('sf-q').oninput=draw; }
function col(L){ return Math.min(L,10)-1; }
function draw(){ var F=X.R.flow, map=$('sf-map'); if(!map) return; var q=($('sf-q').value||'').trim().toLowerCase();
  map.querySelectorAll('.sf-n,.sf-zh,.sf-zb,.sf-lh,.sf-lr').forEach(function(e){ e.remove(); });
  var vis=function(n){ return X.show[n.depth]&&(!q||(n.name+' '+n.obj+' '+n.id).toLowerCase().indexOf(q)>=0); };
  var lanes=F.lanes.filter(function(l){ return X.side==='all'||l.side===X.side; }); X.W=LABW+ZONES.length*COLW+20; var y=TOP, frag=document.createDocumentFragment(); X.pos={};
  lanes.forEach(function(l){ var per={}; F.nodes.forEach(function(n){ if(n.lane===l.id) (per[col(n.L)]=per[col(n.L)]||[]).push(n); });
    var rows=Math.max.apply(null,[1].concat(Object.values(per).map(function(a){ return a.length; }))), h=rows*CARD+PADV*2, color=LANECOL[F.lanes.indexOf(l)%LANECOL.length];
    var hd=document.createElement('div'); hd.className='sf-lh'; hd.style.cssText='top:'+y+'px;height:'+h+'px;border-left-color:'+color; hd.innerHTML=E(l.name)+'<small>'+E(l.about)+'</small>'; frag.appendChild(hd);
    var rl=document.createElement('div'); rl.className='sf-lr'; rl.style.cssText='top:'+(y+h)+'px;width:'+(X.W-LABW)+'px'; frag.appendChild(rl);
    Object.keys(per).forEach(function(c){ per[c].forEach(function(n,i){ var b=document.createElement('button'); b.type='button'; b.className='sf-n '+n.depth+(vis(n)?'':' hide'); b.dataset.sf='node'; b.dataset.id=n.id; b.title=n.name+' — '+n.obj;
      var lv=(X.R.live||{})[n.id]; b.innerHTML=(lv&&lv[0]?'<b title="boys working on it now">'+lv[0]+'</b>':'')+E(n.name);
      var x=LABW+(+c)*COLW+12, yy=y+PADV+i*CARD; b.style.left=x+'px'; b.style.top=yy+'px'; X.pos[n.id]={x:x,y:yy,c:color,v:vis(n)}; frag.appendChild(b); }); });
    y+=h; });
  var H=y+20; ZONES.forEach(function(z,i){ var bg=document.createElement('div'); bg.className='sf-zb'+(i%2?' alt':''); bg.style.cssText='left:'+(LABW+i*COLW)+'px;width:'+COLW+'px;height:'+H+'px'; frag.insertBefore(bg,frag.firstChild);
    var zh=document.createElement('div'); zh.className='sf-zh'; zh.style.cssText='left:'+(LABW+i*COLW)+'px;width:'+COLW+'px'; zh.textContent=z; frag.appendChild(zh); });
  map.style.width=(X.W*X.zoom)+'px'; map.style.height=H+'px'; map.style.transform='scale('+X.zoom+')'; map.appendChild(frag);
  var svg=$('sf-e'), out=''; svg.setAttribute('width',X.W); svg.setAttribute('height',H);
  F.edges.forEach(function(e){ var a=X.pos[e[0]], b=X.pos[e[1]]; if(!a||!b||!a.v||!b.v) return; var st=e[2]==='lane'?' style="stroke:'+a.c+';opacity:.55;stroke-width:3"':'', da=e[2]==='plan'?' stroke-dasharray="4 4"':'';
    if(b.x<=a.x+172){ var x1=a.x+86, y1=a.y+30, x2=b.x+86, y2=b.y, my=(y1+y2)/2; out+='<path data-a="'+e[0]+'" data-b="'+e[1]+'"'+st+da+' d="M'+x1+' '+y1+' C'+x1+' '+my+' '+x2+' '+my+' '+x2+' '+y2+'"/>'; }
    else { var x1=a.x+172, y1=a.y+15, x2=b.x, y2=b.y+15, mx=(x1+x2)/2; out+='<path data-a="'+e[0]+'" data-b="'+e[1]+'"'+st+da+' d="M'+x1+' '+y1+' C'+mx+' '+y1+' '+mx+' '+y2+' '+x2+' '+y2+'"/>'; } });
  svg.innerHTML=out; mark(); }
function chain(id,dir){ var seen={}, fr=[id]; for(var d=0;d<3&&fr.length;d++){ var nx=[]; fr.forEach(function(k){ (dir==='up'?X.by[k].from:X.by[k].to).forEach(function(x){ if(!seen[x]){ seen[x]=1; nx.push(x); } }); }); fr=nx; } return seen; }
function mark(){ var map=$('sf-map'); if(!map) return; var S0=X.sel, up=S0?chain(S0,'up'):{}, dn=S0?chain(S0,'down'):{};
  map.querySelectorAll('.sf-n').forEach(function(b){ var id=b.dataset.id; b.classList.toggle('sel',id===S0); b.classList.toggle('up',!!up[id]); b.classList.toggle('down',!!dn[id]); b.classList.toggle('fade',!!(S0&&id!==S0&&!up[id]&&!dn[id])); });
  $('sf-e').querySelectorAll('path').forEach(function(p){ var a=p.dataset.a, b=p.dataset.b; p.classList.remove('up','down','fade'); if(!S0) return; if(up[a]&&(up[b]||b===S0)) p.classList.add('up'); else if((a===S0||dn[a])&&dn[b]) p.classList.add('down'); else p.classList.add('fade'); }); }
function chip(id){ var n=X.by[id]; return '<button type="button" class="'+n.depth+'" data-sf="go" data-id="'+id+'">'+E(n.name)+' <span class="sf-id">· '+(n.g==='K'?'K':n.g==='HS'?'HS':'Gr '+n.g)+'</span></button>'; }
function detail(id,scroll){ var n=X.by[id]; if(!n) return; X.sel=id; mark(); var F=X.R.flow, LN={}; F.lanes.forEach(function(l){ LN[l.id]=l.name; }); var lv=(X.R.live||{})[id];
  var h='<button type="button" class="sf-x" data-sf="dclose" style="float:right">Close</button><div class="sf-eye">'+E(LN[n.lane])+' · '+(n.g==='K'?'Kindergarten':n.g==='HS'?'High school':'Grade '+n.g)+'</div><h3>'+E(n.name)+'</h3><div class="sf-id">'+(n.planned?'not built yet':E(n.id))+'</div> <span class="sf-pill '+n.depth+'">'+NAME[n.depth]+'</span>';
  if(!n.planned) h+='<div class="sf-live"><span><b>'+(lv?lv[0]:0)+'</b> working on it now</span><span><b>'+(lv?lv[1]:0)+'</b> mastered it</span></div>';
  h+='<div class="sf-goal"><div class="sf-eye">Goal: by the end, he can</div><b>'+E(n.obj)+'</b>'+(n.big?'<div style="margin-top:6px;font-size:14px">Big idea: '+E(n.big)+'</div>':'')+'</div>';
  if(n.steps.length) h+='<h4>How he is taught: the teaching lesson'+(n.k3t&&n.k3t!==n.name?' “'+E(n.k3t)+'”':'')+'</h4><ol class="sf-st">'+n.steps.map(function(s){ return '<li><b>'+E(s.st)+'</b>'+E(s.t)+'</li>'; }).join('')+'</ol>';
  if(n.quest.length) h+='<h4>'+(n.steps.length?'Then, in his practice quest':'How he is taught: the practice quest')+'</h4><ol class="sf-st">'+n.quest.map(function(s){ return '<li><b>'+E(s.st)+'</b>'+E(s.t)+'</li>'; }).join('')+'</ol>';
  if(!n.planned) h+='<h4>How he proves mastery</h4><p style="margin:0;font-size:14px">All '+(n.nc||3)+' check questions right, with no help. Then the skill is marked mastered and the next stop opens.</p>';
  if(n.has.length) h+='<h4>What is strong here</h4><ul class="sf-f">'+n.has.map(function(f){ return '<li>'+E(f)+'</li>'; }).join('')+'</ul>';
  if(n.flags.length) h+='<h4 style="color:var(--quiz)">What is thin here</h4><ul class="sf-f">'+n.flags.map(function(f){ return '<li>'+E(f)+'</li>'; }).join('')+'</ul>';
  h+='<h4>Builds on</h4><div class="sf-l">'+(n.from.length?n.from.map(chip).join(''):'<span class="sf-hint">A starting point.</span>')+'</div><h4>Leads to</h4><div class="sf-l">'+(n.to.length?n.to.map(chip).join(''):'<span class="sf-hint">The end of this line for now.</span>')+'</div>';
  if(!n.planned) h+='<div class="sf-place"><button type="button" data-sf="place" data-id="'+id+'">🎯 Place a boy at this stop</button><p>He starts his '+(n.key==='READ'?'Reading':'Writing &amp; Language')+' path here, at Level '+n.L+', beginning with this skill. This uses the same placement as the Course map, so it shows in the Library history and can be undone there.</p><p id="sf-pmsg"></p></div>';
  var d=$('sf-d'); d.innerHTML=h; d.classList.add('open'); d.setAttribute('aria-hidden','false'); d.scrollTop=0;
  if(scroll){ var p=X.pos[id], w=$('sf-wrap'); if(p&&w) w.scrollTo({left:Math.max(0,p.x*X.zoom-w.clientWidth/3),top:Math.max(0,p.y*X.zoom-w.clientHeight/2),behavior:'smooth'}); } }
function place(id){ var n=X.by[id]; if(!n||n.planned) return; var M=window.DPMAP; var msg=$('sf-pmsg');
  var go=function(ids){ return call('libApply',tok(),{action:'place',boys:ids,key:n.key,level:n.L,start:n.id}).then(function(r){ var m=$('sf-pmsg'); if(m) m.innerHTML='<b style="color:#178A5E">✓ '+E((r&&r.msg)||('Placed '+ids.length+' boy'+(ids.length===1?'':'s')+' here.'))+'</b>'; return r; }); };
  if(M&&typeof M.picker==='function'){ M.picker('🎯 Start boys at “'+E(n.name)+'” ('+(n.key==='READ'?'Reading':'Writing & Language')+' Level '+n.L+')…',go); return; }
  if(msg) msg.textContent='Open this from the Course map to pick boys.'; }
document.addEventListener('click',function(e){ var b=e.target.closest&&e.target.closest('[data-sf]'); if(!b||!$('sf-ov')||!$('sf-ov').contains(b)) return; var a=b.dataset.sf; e.preventDefault(); e.stopPropagation();
  if(a==='close') return close(); if(a==='dclose'){ X.sel=null; mark(); var d=$('sf-d'); d.classList.remove('open'); d.setAttribute('aria-hidden','true'); return; }
  if(a==='node'||a==='go') return detail(b.dataset.id,a==='go');
  if(a==='side'){ X.side=b.dataset.v; b.parentNode.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on',x===b); }); return draw(); }
  if(a==='show'){ var k=b.dataset.k; X.show[k]=X.show[k]?0:1; b.classList.toggle('off',!X.show[k]); return draw(); }
  if(a==='zoom'){ X.zoom=Math.max(.55,Math.min(1.4,X.zoom+(+b.dataset.v)*.15)); var m=$('sf-map'); m.style.transform='scale('+X.zoom+')'; m.style.width=(X.W*X.zoom)+'px'; return; }
  if(a==='place') return place(b.dataset.id); },true);
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&$('sf-ov')){ var d=$('sf-d'); if(d&&d.classList.contains('open')){ d.classList.remove('open'); X.sel=null; mark(); } else close(); } });
window.SF={ open:open, close:close };
})();
</script>
