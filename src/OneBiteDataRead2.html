    {t:'I find the pillars, the proof: boys learn better after running; a study says kids focus more after play.'},
    {t:'I notice the other side: we will lose learning time. And the answer: we will learn faster after.'},
    {t:'I test each pillar: does it really hold up the point? Yes, both are about learning better. A feeling like "it is the best" is not a pillar. Proof is something you can check.'},
    {t:'Same steps on a garden letter: "I think we should turn the dirt into a garden." The point: the yeshiva should plant a garden.'}], a:'Point, pillars, the other side, the answer.' },
  oops:{ q:'"Lakes can be dangerous, so every boy should learn to swim." Point?', wrong:'lakes are dangerous', right:'every boy should learn to swim', why:'Danger is a reason. The point is what the author wants.' },
  ways:['think-aloud','point and pillars','pillar test','tap the reason','Mistake Detective'], done:'You can find an author\'s point and proof!',
  board:{ one:'Point = what the author wants (should). Pillars = reasons. Then test each pillar.', activity:'Build a paper temple: the roof is the point, each column a reason; a weak reason gets pulled out.', mistakes:['Calling a reason the point','Missing how the author answers the other side','Keeping a reason that does not support the point'] },
  do:[
    {type:'sort', q:'The recess letter', bins:['Point','Proof','Other side'], cards:[['longer recess',0],['focus after play',1],['learn better',1],['lose learning time',2]], say:'Is it the point, a proof, or the other side?', how:'The point is what he wants. Reasons are proof. Losing learning time is the other side.'},
    {type:'match', pairs:[['I believe','a point'],['a study found','proof'],['some say','the other side'],['but','the answer']], say:'Match each signal to what comes next.', how:'I believe or should: the point. A study or a fact: proof. Some say: the other side. But: the answer.'}],
  your:[
    {type:'listen', q:'A letter to the shul', hear:'Our shul must add more lights in the parking lot. Last winter two people slipped in the dark. Bright lights would keep everyone safe. Some say lights cost too much. But the new bulbs last ten years. What is the author\'s point? A: two people slipped. B: the shul must add more lights. C: winter is dark. D: lights cost too much.', o:['A','B','C','D'], a:'B', say:'Listen. Tap the main point.', how:'Must shows the point. Slipping is a reason. Cost is the other side.', why:{q:'Which words show the point?', o:['last winter','must add','two people','in the dark'], a:'must add'}},
    {type:'sort', q:'Point: add parking lot lights', bins:['Supports it','Does not'], cards:[['two people slipped',0],['the lot is dark',0],['the shul is old',1],['lights cost money',1]], say:'Pillar test: does it support the point?', how:'A real pillar gives a reason the lights are a good idea.', why:{q:'Why does "the shul is old" fail?', o:['It does not show we need lights','It is not true','It is short','It is first'], a:'It does not show we need lights'}},
    {type:'listen', q:'Answer the other side', hear:'Same letter. Some say lights cost too much. Which part answers them? A: the new bulbs last ten years. B: two people slipped. C: lights keep everyone safe. D: the lot is dark.', o:['A','B','C','D'], a:'A', say:'Find the author\'s answer to the other side.', how:'Find some say. The answer comes right after but.', why:{q:'Which word signals the answer?', o:['Some','Last','Must','But'], a:'But'}},
    {type:'sort', q:'Akiva\'s letter: a bike rack', bins:['Point','Proof','Answer'], cards:[['add a bike rack',0],['bikes block the door',1],['boys trip on bikes',1],['fits by the fence',2]], say:'Listen to the letter in the hint. Sort each part.', how:'Our yeshiva should add a bike rack. Bikes now block the door, and boys trip on them. Some say there is no room. But a rack fits by the fence. Should shows the point; facts are proof; after but comes the answer.'},
    {type:'listen', q:'Challenge: a camp ad', hear:'Come to Camp Ohr! We have a big new pool and learning every day. We are the best camp ever! Which line is just a feeling, not proof? A: a big new pool. B: learning every day. C: we are the best camp ever. D: come to Camp Ohr.', o:['A','B','C','D'], a:'C', say:'Challenge! Which line is just a feeling?', how:'Proof is a fact you can check, like a pool. "We are the best" is a feeling. "Come to Camp Ohr" is the point.', why:{q:'Why is C not proof?', o:['It is short','It is the point','You cannot check it','It is about a pool'], a:'You cannot check it'}}] };


B['READ.COMP.L06.05']={ band:'E45', pic:'📰', today:'Use two texts on one topic together', why:'One text rarely tells it all. Two sources together give the full picture.',
  ready:[{q:'Two texts on one topic usually...', o:['teach different facts','say the same words','have no facts','are both stories'], a:'teach different facts'},{q:'Proof for a point is...', o:['a reason or fact','a title','a picture only','a question'], a:'a reason or fact'}],
  bridge:'READ.COMP.L06.04', bridgeName:'Point and Proof',
  watch:{ q:'Two texts about the shofar', m:{type:'scene',e:'📯',t:'Text 1: A shofar is made from a ram\'s horn. It is cleaned, boiled, and shaped. Text 2: On Rosh Hashana we blow the ram\'s horn to wake us up to do teshuva.'}, steps:[
    {t:'I read Text 1 and ask what it teaches: how a shofar is made.'},
    {t:'I read Text 2 and ask what it teaches: why we blow it.'},
    {t:'I sort each fact: only in 1 (boiled and shaped), only in 2 (to wake us up), or in both (a ram\'s horn).'},
    {t:'A strong sentence uses one piece from each: A shofar is shaped from a ram\'s horn, and we blow it to wake us up to teshuva.'},
    {t:'Same steps with two matzah texts. Only in Text 2: the dough baked on their backs as they walked. Using both: Bakers keep the dough from rising, to remember how we left Mitzrayim in a hurry.'}], a:'One piece from each text.' },
  oops:{ q:'T1: making. T2: why. Is "It is boiled" both?', wrong:'Yes, it is a fact.', right:'No: it is only from Text 1.', why:'Both means one piece from each text. Add why we blow it, from Text 2.' },
  ways:['think-aloud','sort by source','match text and job','tap the reason','Mistake Detective'], done:'You can use two texts together!',
  board:{ one:'Sort facts: Text 1, Text 2, or both; a strong sentence uses both.', activity:'Venn diagram on the board: boys place fact cards from two short texts.', mistakes:['Using facts from only one text','Putting a fact in both when it is in one','Copying a sentence instead of combining'] },
  do:[
    {type:'match', q:'The shofar texts', pairs:[['Text 1','how it is made'],['Text 2','why we blow it']], say:'Match each text to what it teaches.', how:'Ask what each text is about. Text 1: making. Text 2: the reason.'},
    {type:'sort', q:'The shofar texts', bins:['Only Text 1','Only Text 2','Both'], cards:[['cleaned first',0],['boiled, shaped',0],['wakes us to teshuva',1],['a ram\'s horn',2]], say:'Which text has this fact?', how:'Text 1 tells the making. Text 2 tells the reason. Both texts name a ram\'s horn.'}],
  your:[
    {type:'listen', q:'Lulav and esrog: use both', hear:'Text 1: On Sukkos we hold a lulav, a palm branch. Text 2: On Sukkos we also hold an esrog, a yellow fruit that must be whole. Which sentence uses both? A: The lulav is a palm branch. B: The esrog must be whole. C: On Sukkos we hold a palm branch and a whole yellow fruit.', o:['C','A','B','none'], a:'C', say:'Listen. Which sentence uses both texts?', how:'A uses only Text 1. B uses only Text 2. C has a piece from each.', why:{q:'Why is C best?', o:['It is the longest','It has a piece from each text','It is last','It says Sukkos'], a:'It has a piece from each text'}},
    {type:'sort', q:'Text 1: lulav. Text 2: esrog.', bins:['Only Text 1','Only Text 2','Both'], cards:[['a palm branch',0],['a yellow fruit',1],['held on Sukkos',2],['must be whole',1]], say:'Which text said it: the lulav text, esrog text, or both?', how:'Text 1 is about the lulav, a palm branch. Text 2 is about the esrog, a fruit. Both texts say they are held on Sukkos.'},
    {type:'listen', q:'Chanukah: which text tells how?', hear:'Text 1: Each night of Chanukah we light one more light. Text 2: We light to remember the nes of the oil that lasted eight days. Which text tells HOW we light?', o:['one','two','both','none'], a:'one', say:'Listen. Which text tells how?', how:'Text 1 tells the steps: one more light each night. Text 2 tells why.', why:{q:'How do you know?', o:['Text 1 tells the steps','Text 2 tells the steps','Both tell why','It is first'], a:'Text 1 tells the steps'}},
    {type:'sort', q:'Chanukah: does it use both texts?', bins:['Uses both','Only one'], cards:[['more lights, for nes',0],['one more each night',1],['oil lasted eight days',1],['one more, for oil',0]], say:'Mistake Detective: one text, or both?', how:'The mistake is using one text only. A both sentence needs a how fact AND a why fact.', why:{q:'Why is "oil lasted" only one?', o:['It is short','It is wrong','It is about light','It comes only from Text 2'], a:'It comes only from Text 2'}},
    {type:'listen', q:'Challenge: two notes about the siyum', hear:'Note 1: The siyum is Sunday at seven. Note 2: Every boy should bring his Mishnayos. Which plan uses both notes? A: Come Sunday at seven. B: Bring your Mishnayos. C: Come Sunday at seven with your Mishnayos.', o:['C','A','B','none'], a:'C', say:'Challenge! Which plan uses both notes?', how:'Note 1 tells when. Note 2 tells what to bring. To be ready, he needs both.', why:{q:'What would he miss with only Note 1?', o:['The time','The day','To bring his Mishnayos','The place'], a:'To bring his Mishnayos'}}] };

B['READ.LIT.L06.01']={ band:'E45', pic:'⛺', today:'Compare two characters or two places', why:'Seeing how two people are alike and different helps you understand each one better.',
  ready:[{q:'A trait is...', o:['what someone is like','how he feels now','his name','his age'], a:'what someone is like'},{q:'"Both" means...', o:['true of the two','only one','neither','first'], a:'true of the two'}],
  bridge:'READ.LIT.L04.02', bridgeName:'Character Clues',
  watch:{ q:'Avi and Tuvia', m:{type:'scene',e:'🏠',t:'Avi is loud and tells jokes at the Shabbos table. He wore a blue tie. Tuvia is quiet and likes to read. But when Bubby came to visit, both boys made her a card.'}, steps:[
    {t:'I list what each one does. Avi: loud, tells jokes. Tuvia: quiet, reads.'},
    {t:'Different: true of only one. Avi is loud and tells jokes; Tuvia is quiet and reads.'},
    {t:'Alike: true of both. Both boys made Bubby a card.'},
    {t:'I compare traits, not tiny details. Loud and quiet are traits.'},
    {t:'Same steps anywhere. Different: Ovadia is neat and wakes early; Binyamin is messy and sleeps late. Alike: both jumped up to help in the storm. Two shuls are alike: the same Torah is read in both.'}], a:'Different: loud vs quiet. Alike: both made a card.' },
  oops:{ q:'Avi: loud, blue tie. Tuvia: quiet. Different?', wrong:'only Avi wore a blue tie', right:'Avi is loud; Tuvia is quiet', why:'A tie is a tiny detail, not a trait. Compare what they are like: loud vs quiet.' },
  ways:['think-aloud','three-bin sort','match person and trait','tap the reason','Mistake Detective'], done:'You can compare characters and places!',
  board:{ one:'Different = true of only one. Alike = true of both. Compare traits, not tiny details.', activity:'Venn diagram with two hula hoops on the floor; boys place trait cards.', mistakes:['Listing only differences','Comparing small details instead of traits','Saying both when only one did it'] },
  do:[
    {type:'sort', q:'Avi and Tuvia', bins:['Only Avi','Only Tuvia','Both'], cards:[['tells jokes',0],['likes to read',1],['made a card',2],['is quiet',1]], say:'Is it true of Avi, Tuvia, or both?', how:'Different things go to one boy. Both boys made Bubby a card.'},
    {type:'match', q:'Avi and Tuvia', pairs:[['Avi','loud, jokes'],['Tuvia','quiet, reads'],['Both','made a card']], say:'Match each one to what is true of him.', how:'Avi is loud and tells jokes; Tuvia is quiet and reads.'}],
  your:[
    {type:'listen', q:'Mendy and Shloimy at camp', hear:'Mendy, in his blue cap, always plays ball. Shloimy always swims. But on the last night, both boys sang by the fire. How are they alike?', o:['sang','ball','swim','none'], a:'sang', say:'Listen. How are they alike?', how:'Alike means true of both: both boys sang by the fire.', why:{q:'Why not ball?', o:['Both play ball','Only Mendy plays ball','Ball is fun','It is not said'], a:'Only Mendy plays ball'}},
    {type:'sort', q:'Two kitchens; both keep meat and milk apart', bins:['Bubby\'s kitchen','Our kitchen','Both'], cards:[['an old stove',0],['a new oven',1],['meat and milk sides',2],['a small table',0],['a big table',1]], say:'Bubby\'s: old stove, small table. Ours: new oven, big table.', how:'Bubby\'s kitchen has an old stove and a small table. Ours has a new oven and a big table. Both keep a meat side and a milk side.', why:{q:'Why do both have meat and milk sides?', o:['Both kitchens are kosher','Both are new','Both are small','Sides are fun'], a:'Both kitchens are kosher'}},
    {type:'listen', q:'Yehuda and Shmuel: how different?', hear:'Yehuda builds models slowly and carefully. Shmuel draws fast and is messy. When their rebbi was sick, both said Tehillim for him. How are they different? A: Both said Tehillim. B: Yehuda is slow and careful; Shmuel is fast and messy. C: Yehuda is fast; Shmuel is careful.', o:['B','A','C','none'], a:'B', say:'Listen. How are Yehuda and Shmuel different?', how:'Different means true of only one. Both said Tehillim is how they are alike.', why:{q:'Why is careful only Yehuda?', o:['Both are careful','Yehuda is loud','It is not said','Shmuel is fast and messy'], a:'Shmuel is fast and messy'}},
    {type:'sort', q:'Mendy and Shloimy: how different?', bins:['A real difference','Not a difference'], cards:[['ball vs swimming',0],['both sang',1],['Mendy\'s blue cap',1],['ball fan, water fan',0]], say:'Mistake Detective: is it a real difference?', how:'The mistake is a tiny detail or something true of both. A real difference is a trait or habit true of only one.'},
    {type:'listen', q:'Challenge: two Shabbos tables', hear:'At Zaidy\'s table, there are only four people. At our table, there are twelve. But at both tables, everyone sings zemiros. How are the tables alike?', o:['sing','four','many','none'], a:'sing', say:'Challenge! How are the tables alike?', how:'The number of people is different. At both tables, everyone sings zemiros.', why:{q:'Which word signals alike?', o:['only','but','both','four'], a:'both'}}] };

B['READ.VOC.L06.01']={ band:'E45', pic:'🌳', today:'Use Greek and Latin roots to read big words', why:'A few roots unlock thousands of words, in science, in the news, everywhere.',
  ready:[{q:'Re means...', o:['again','not','full of','without'], a:'again'},{q:'-less means...', o:['without','full of','again','before'], a:'without'}],
  bridge:'READ.PHON.L04.01', bridgeName:'Prefixes and suffixes',
  watch:{ q:'telescope', m:{type:'tiles',w:['tele','scope']}, steps:[
    {t:'A big new word: telescope. I look for a root I know: tele means far.', m:{type:'tiles',w:['tele','scope'],hi:[0]}},
    {t:'The other part: scope means look at. I mix the meanings: far + look at.', m:{type:'tiles',w:['tele','scope'],hi:[1]}},
    {t:'A telescope is a tool to look at things far away. I check: does it fit "Moshe looked at the moon through a telescope before Kiddush Levana"? Yes.'},
    {t:'More roots: trans means across, port means carry, graph means write, bio means life, logy means study of, therm means heat, auto means self. Port is in portable: easy to carry.'},
    {t:'Same steps on autograph: auto (self) + graph (write). An autograph is a person\'s own signature, written by himself.'}], a:'telescope = far + look at' },
  oops:{ q:'Transport?', wrong:'look across', right:'carry across', why:'Port means carry, not look. The root for look is scope.' },
  ways:['think-aloud','build words from roots','match root and meaning','tap the reason','Mistake Detective'], done:'You can use roots to read big words!',
  board:{ one:'Find the root, then mix the meanings, then check it in a sentence.', activity:'Root tree: write a root on the trunk; boys add word branches (graph: autograph, paragraph).', mistakes:['Mixing up port (carry) and scope (look)','Ignoring the second root','Guessing from how the word sounds'] },
  do:[
    {type:'match', pairs:[['tele','far'],['port','carry'],['graph','write'],['bio','life']], say:'Match each root to its meaning.', how:'Think of a word you know: a telescope sees far. A portable box can be carried.'},
    {type:'tiles', w:['tele','graph'], extra:['port','scope'], q:'far + write', say:'Build the word that means far plus write.', how:'Tele means far. Graph means write. A telegraph is a message written and sent far.'}],
  your:[
    {type:'listen', q:'biology', hear:'Biology is a subject in school. Logy means study of. Biology is the study of what?', o:['life','rocks','stars','words'], a:'life', say:'Listen. Biology is the study of what?', how:'Bio means life, logy means study of: biology is the study of life.', why:{q:'Which root told you?', o:['logy','bio','tele','port'], a:'bio'}},
    {type:'sort', bins:['graph: write','port: carry'], cards:[['paragraph',0],['transport',1],['autograph',0],['portable',1],['photograph',0],['export',1]], say:'Which root is in this word?', how:'Look for graph or port inside the word.', why:{q:'What does export mean?', o:['carry out','write out','look out','sound out'], a:'carry out'}},
    {type:'match', pairs:[['portable','easy to carry'],['autobiography','own life story'],['telescope','sees far away']], say:'Match each word to its meaning.', how:'Split it into roots. Auto self, bio life, graph write, port carry.'},
    {type:'sort', q:'import', bins:['Right meaning','Mixed-up root'], cards:[['carry in',0],['look in',1],['bring in',0],['write in',1]], say:'Mistake Detective: right meaning, or a mixed-up root?', how:'Im means in. Port means carry. Scope means look. Graph means write.'},
    {type:'listen', q:'Challenge: a new word', hear:'On the science trip, Shmuli used a thermometer. Meter means measure. What does a thermometer measure?', o:['heat','light','sound','life'], a:'heat', say:'Challenge! A thermometer measures what?', how:'Therm means heat, meter means measure: a thermometer measures heat.', why:{q:'How did you figure it out?', o:['I guessed','It is long','It has an e','I mixed the two roots'], a:'I mixed the two roots'}}] };

B['READ.VOC.L06.02']={ band:'E45', pic:'🌙', today:'Figure out similes and metaphors', why:'Writers paint pictures with words. Knowing the real meaning makes stories come alive.',
  ready:[{q:'"The test was a breeze" means...', o:['it was easy','it was windy','it was outside','it was long'], a:'it was easy'},{q:'Literal means...', o:['exactly what it says','a hidden meaning','a rhyme','a question'], a:'exactly what it says'}],
  bridge:'READ.VOC.L04.03', bridgeName:'Literal or Not',
  watch:{ q:'The Shabbos table', m:{type:'scene',e:'🕯️',t:'The candles glowed like little stars. Zaidy\'s voice was a warm blanket over the table.'}, steps:[
    {t:'I notice like: glowed like little stars. A simile compares two things with like or as.'},
    {t:'I ask what they share: candles and stars both shine in the dark. So the candles shone brightly.'},
    {t:'I notice is or was, with no like: Zaidy\'s voice was a warm blanket. A metaphor says one thing IS another.'},
    {t:'I ask what they share: a blanket is warm and covers you. His voice felt warm and comforting.'},
    {t:'Same steps anywhere. The new sefer smelled as fresh as rain. That is a simile. The yard was a white blanket: snow covered the whole yard. The words felt like old friends: the words became familiar and easy for him.'}], a:'Simile: like or as. Metaphor: is. Then ask what they share.' },
  oops:{ q:'"His thoughts buzzed like bees." Means?', wrong:'there were bees in his head', right:'his mind was busy', why:'That is the literal picture. Like makes a comparison: no real bees, just a busy mind.' },
  ways:['think-aloud','sort simile and metaphor','what do they share','tap the reason','Mistake Detective'], done:'You can figure out similes and metaphors!',
  board:{ one:'Simile = like or as; metaphor = is. Ask what the two things share.', activity:'Draw it twice: boys draw the silly literal picture, then the real meaning.', mistakes:['Taking the picture literally','Calling every "like" a simile (I like cake)','Missing a metaphor because there is no like or as'] },
  do:[
    {type:'sort', bins:['Simile','Metaphor'], cards:[['glowed like stars',0],['voice was a blanket',1],['quiet as a mouse',0],['class was a zoo',1]], say:'Is it a simile, or a metaphor?', how:'Like or as: simile. Says it IS something: metaphor.'},
    {type:'match', pairs:[['like stars','shone brightly'],['class was a zoo','very noisy'],['quiet as a mouse','very quiet']], say:'Match each one to its real meaning.', how:'Ask what the two things share. A zoo is noisy, so the class was very noisy.'}],
  your:[
    {type:'listen', q:'Which one is a simile?', hear:'A: The challah was a cloud. B: The challah was soft as a cloud. C: The challah was on the table. Which is a simile?', o:['B','A','C','none'], a:'B', say:'Listen. Which one is a simile?', how:'B uses as to compare: soft as a cloud. A says the challah WAS a cloud: a metaphor.', why:{q:'What makes B a simile?', o:['It is about challah','It is longest','It uses as to compare','It is second'], a:'It uses as to compare'}},
    {type:'match', pairs:[['a heart of gold','very kind'],['slow as a snail','very slow'],['sukkah an icebox','very cold']], say:'Match each picture to its real meaning.', how:'Ask what the two things share. Gold is precious: a kind heart. A snail is slow. An icebox is cold.'},
    {type:'sort', bins:['Simile','Not a simile'], cards:[['I like kugel',1],['fast like the wind',0],['he looks like Abba',1],['brave as a lion',0]], say:'Mistake Detective: is it really a simile?', how:'The trap: like can mean enjoy, or look the same. A simile compares two different things to paint a picture.'},
    {type:'listen', q:'Challenge: Dovi\'s long walk', hear:'After the long Shabbos walk to Bubby, Dovi\'s feet were bricks. A: a metaphor meaning heavy and tired. B: a simile meaning heavy. C: a metaphor meaning red.', o:['B','A','C','none'], a:'A', say:'Challenge! Name it, and tell what it means.', how:'No like or as: a metaphor. Bricks are heavy, so his feet felt heavy and tired.', why:{q:'What do his feet and bricks share?', o:['Both are red','Both feel heavy','Both are square','Both are new'], a:'Both feel heavy'}}] };
