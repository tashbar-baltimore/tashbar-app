B['READ.COMP.L07.01']={ band:'M68', pic:'📌', today:'Prove a claim with the strongest evidence', why:'In a debate, a test or a shiur, the one who can point to the proof wins.',
  ready:[{q:'An inference needs...', o:['a clue from the text','a guess','a title','a feeling'], a:'a clue from the text'},{q:'A claim is...', o:['what you say is true','a question','a picture','a heading'], a:'what you say is true'}],
  bridge:'READ.COMP.L06.04', bridgeName:'Point and Proof',
  watch:{ q:'Claim: the fast day was hard for Shmuel.', m:{type:'scene',e:'📜',t:'It was not an easy day for Shmuel. He fasted from sunrise until dark, almost fifteen hours, on a hot July day. He davened Mincha with the minyan.'}, steps:[
    {t:'Strategy: I hold the claim in mind, then test each sentence. Does it PROVE the claim, or just sound related?'},
    {t:'"It was not an easy day" only says the claim again in new words. That is weak.'},
    {t:'"Almost fifteen hours, on a hot July day" gives facts I can check. That proves it is hard. Strongest.'},
    {t:'"He davened Mincha" is true but does not prove hard. Not evidence for this claim. Teach it back: tell your chavrusa the 3 kinds: repeats, related, proves.'},
    {t:'Same test anywhere. Hike claim: The trail climbed 2,000 feet over nine miles of loose rock. Food drive claim: "The boxes were brown." is not evidence. Bus claim: Today, about 25 million children ride a school bus every day.'}], a:'Strongest evidence = specific facts that prove the claim.' },
  oops:{ q:'Bridge record? "The work was dangerous."', wrong:'Strong proof', right:'Only related', why:'True, but a record needs longest, tallest or first. Danger does not prove a record.' },
  ways:['think-aloud','three kinds: repeats, related, proves','rank the evidence','tap the reason','teach it back'], done:'You can prove a claim with the strongest evidence!',
  board:{ one:'Test each sentence: does it repeat, relate, or prove? Pick the one with checkable facts.', activity:'Evidence auction: pairs get a claim and five sentences; they bid on the one that proves it best and defend the pick.', mistakes:['Picking a related sentence that does not prove','Repeating the claim as evidence','Using a sentence with no facts'] },
  do:[
    {type:'sort', q:'Claim: the fast day was hard.', bins:['Repeats claim','Only related','Proves it'], cards:[['not an easy day',0],['davened Mincha',1],['fifteen hours, hot',2]], say:'Repeats the claim, only related, or proves it?', how:'Repeating says the claim again. Related is true but does not prove. Proof gives facts that show it.'},
    {type:'match', pairs:[['says it again','weak'],['true but off','not evidence'],['checkable facts','strongest']], say:'Match each kind of evidence to how strong it is.', how:'Strongest evidence has checkable facts that prove the claim.'}],
  your:[
    {type:'listen', q:'Claim: the siyum was a big event.', hear:'Claim: the siyum was a big event. A: It was a really big night. B: The tables had white cloths, flowers and name cards. C: Three hundred people came, and the rav spoke. D: It was in the hall. Which is the strongest evidence?', o:['B','A','C','D'], a:'C', say:'Listen. Tap the strongest evidence.', how:'A only repeats the claim. B and D are related but do not prove big. C gives numbers you can check.', why:{q:'Why is C strongest?', o:['It gives checkable facts','It is the longest','It mentions the rav','It is second'], a:'It gives checkable facts'}},
    {type:'sort', q:'Claim: the yeshiva garden worked.', bins:['Evidence','Not evidence'], cards:[['40 pounds of tomatoes',0],['gave neighbors salad',0],['a 50-foot hose',1],['it was sunny once',1]], say:'Does it prove the garden worked?', how:'Evidence must fit the exact claim. A hose length is true, and has a number, but proves nothing about the garden working.', why:{q:'Why is "a 50-foot hose" not evidence?', o:['It has no number','It is too long','It is false','It does not show the garden worked'], a:'It does not show the garden worked'}},
    {type:'listen', q:'Error analysis: Yossi\'s answer', hear:'Claim: the trip was long. Yossi chose the evidence: we left early. Ari chose: the bus ride took six hours each way. Who chose the strongest evidence, and why? A: Yossi, because early is first. B: Neither. C: Both are equal. D: Ari, because six hours proves long.', o:['B','A','C','D'], a:'D', say:'Error analysis: who chose better?', how:'Leaving early is related but does not prove long. Six hours each way proves it.', why:{q:'What was Yossi\'s mistake?', o:['He chose a number','He chose too long','He chose related, not proof','He chose nothing'], a:'He chose related, not proof'}},
    {type:'tiles', w:['1,200 meals','many meals','it was huge'], q:'Rank: "the chesed drive was huge"', say:'Order the evidence from strongest to weakest.', how:'Exact numbers beat vague words. Repeating the claim proves nothing.'},
    {type:'sort', q:'Challenge: the bakery claim', bins:['Strongest','Weaker'], cards:[['600 challahs a week',0],['1952: 40 a week',1],['Zaidy once baked there',1],['the oven is huge',1]], say:'Challenge! Claim: the bakery sells lots of challah NOW.', how:'Now needs a fact about now. 1952 has a number but is about the past.', why:{q:'Why not "1952: 40 a week"?', o:['It is false','It is about the past, not now','It is too long','It has a number'], a:'It is about the past, not now'}}] };

B['READ.COMP.L07.02']={ band:'M68', pic:'🧾', today:'Write an objective summary: main points, no opinions', why:'A fair summary lets anyone know what a text says, without your feelings mixed in.',
  ready:[{q:'A summary is...', o:['short, the main points','every detail','your opinion','the title'], a:'short, the main points'},{q:'Which is an opinion?', o:['It is the best','It is red','It has 3 parts','It ends at 5'], a:'It is the best'}],
  bridge:'READ.LIT.L05.01', bridgeName:'Summarize the Story',
  watch:{ q:'Mendy\'s summary of an article', m:{type:'scene',e:'🧾',t:'Mendy wrote: Honeybees dance to tell other bees where flowers are. The dance shows the direction and the distance. This is the coolest thing in nature.'}, steps:[
    {t:'Strategy: I check every sentence with two filters. Is it a main point? Is it a fact, not a feeling?'},
    {t:'Bees dance to show where flowers are: main point, fact. Keep.'},
    {t:'The dance shows direction and distance: main point, fact. Keep.'},
    {t:'"The coolest thing in nature" is a feeling. Cut it. Teach it back: tell your chavrusa the two filters.'},
    {t:'Same filters anywhere. In a Pesach-cleaning summary, "which is the hardest job in the world" is not objective. A seed summary in order: A seed soaks up water, then a root grows down, and then a shoot grows up toward the light. A sound summary: Sound travels as waves that shake the air and then your eardrum, so it cannot travel in space, where there is no air.'}], a:'Main points, in order, in your words, no opinions.' },
  oops:{ q:'"Moving is always hard and sad." Keep it?', wrong:'Yes, it is in the text', right:'No, it is an opinion', why:'Always hard and sad is a feeling. Objective means no opinions, even if the text has them.' },
  ways:['think-aloud','two filters','keep or cut','error analysis','teach it back'], done:'You can write an objective summary!',
  board:{ one:'Two filters: main point? fact? Keep only what passes both, in order.', activity:'Opinion filter: boys read a summary aloud and stand up at every opinion word.', mistakes:['Keeping an opinion (hardest, best, amazing)','Retelling small details','Mixing up the order of events'] },
  do:[
    {type:'sort', q:'Mendy\'s bee summary', bins:['Keep','Cut'], cards:[['bees dance',0],['shows direction',0],['coolest in nature',1],['shows distance',0]], say:'Keep it in an objective summary, or cut it?', how:'Keep main points that are facts. Cut feelings like "coolest".'},
    {type:'findall', grid:['best','is','cool','air','bad','wave','ugly','ear'], find:['best','cool','bad','ugly'], findSay:'opinion word', say:'Tap every opinion word.', how:'Opinion words judge: best, cool, bad, ugly. Facts do not.'}],
  your:[
    {type:'listen', q:'Which summary is objective?', hear:'Article: Rain fell for a week, and the river rose over the road. The town closed the bridge. Summary A: The scary river rose, which was terrible. Summary B: The river rose after a week of rain, so the town closed the bridge. Summary C: It rained. Which summary is objective and complete?', o:['A','B','C','none'], a:'B', say:'Listen. Which summary is objective and complete?', how:'A has feelings: scary, terrible. C misses the main points. B has the main points as facts, in order.', why:{q:'What is wrong with A?', o:['It has opinions','It is too short','It is out of order','It has no river'], a:'It has opinions'}},
    {type:'sort', q:'Error analysis: Dov\'s summary of Pesach', bins:['Objective','Not objective'], cards:[['we clean for weeks',0],['we clean too much',1],['Seder ends at midnight',0],['matzah tastes boring',1]], say:'Error analysis: which parts break the rule?', how:'Dov\'s mistake is keeping opinions. "Too much" and "boring" judge. A fact can be checked.', why:{q:'What rule did Dov break?', o:['Summaries must be long','Use the author\'s words','Add a title','Objective means no opinions'], a:'Objective means no opinions'}},
    {type:'listen', q:'Which summary keeps the order?', hear:'Before the chesed fair, the boys baked 200 cookies. Earlier that week they bought the flour. At the fair they sold every cookie and gave the money to Tomchei Shabbos. Which summary keeps the events in order? A: The boys sold cookies, then bought flour and baked. B: The boys bought flour, baked cookies, sold them all and gave the money to Tomchei Shabbos. C: The boys baked the best cookies ever. D: The boys gave money to Tomchei Shabbos.', o:['A','B','C','D'], a:'B', say:'Listen. Which summary keeps the events in order?', how:'Order of events is time order, not the order the sentences come in. Earlier that week = first.', why:{q:'What was first in time?', o:['baking','selling','buying the flour','giving'], a:'buying the flour'}},
    {type:'match', q:'Snow-day article: keep or cut?', pairs:[['school closed','keep'],['so boring!','cut: opinion'],['boots were red','cut: detail']], say:'Snow closed school. It was so boring. Avi\'s boots were red.', how:'Keep main points. Cut opinions. Cut small details.'},
    {type:'listen', q:'Challenge: summarize a shul notice', hear:'Notice: The shul will paint the beis medrash on Sunday. Seforim must be moved to the library by Friday. Volunteers get pizza. Which is the best objective summary? A: The shul is painting on Sunday, so seforim must be moved by Friday. B: Painting is fun and the pizza is great. C: Seforim move to the library Sunday, and the shul is painted Friday. D: The shul is old.', o:['A','B','C','D'], a:'A', say:'Challenge! Pick the best objective summary.', how:'A keeps the main points as facts. B has opinions. C swaps the days. D misses the main point.', why:{q:'Why is the pizza not in A?', o:['It is false','It is a small detail','It is an opinion','It is first'], a:'It is a small detail'}}] };

B['READ.COMP.L07.03']={ band:'M68', pic:'🧱', today:'Name the job each part of a text does', why:'Writers build texts on purpose. Seeing the plan helps you read faster and write better.',
  ready:[{q:'Problem and solution means...', o:['a problem, then a fix','two things compared','steps in order','a list'], a:'a problem, then a fix'},{q:'Finally usually starts...', o:['the last step','the first step','a question','a title'], a:'the last step'}],
  bridge:'READ.COMP.L05.03', bridgeName:'Text Structures',
  watch:{ q:'The Muddy Field', m:{type:'scene',e:'⚽',t:'P1: Every spring, the yeshiva ball field turned to mud, and games were cancelled. P2: Why? The field sat lower than the street, so rain flowed in. P3: The boys and their fathers dug a drain along the edge. P4: Since then, not one game has been cancelled for mud.'}, steps:[
    {t:'Strategy: I ask each paragraph, "What is your job?" P1 tells the problem: mud and cancelled games.'},
    {t:'P2 starts with Why? It explains: the field is low, so rain flows in.'},
    {t:'P3 is the solution: a drain. P4 shows that the solution worked: no games cancelled since.'},
    {t:'Two more jobs: a hook grabs you with a question (Ever wondered why?); a step is one action in order (First, Next, Finally). Teach it back: tell your chavrusa all six jobs.'},
    {t:'Same question anywhere. In Clearing the Path, the first paragraph: it tells the problem. The last sentence: it shows that the solution worked. In a bagel article, "less water than bread dough" is there to explain why a bagel is dense.'}], a:'Problem, explain, solution, result.' },
  oops:{ q:'"The brine is salty, so pickles keep." Job?', wrong:'It gives a step.', right:'It explains why.', why:'There is no action to do. So gives a reason. A step is an action, like "First, soak the cucumbers."' },
  ways:['think-aloud','name each job','sort by job','tap the reason','teach it back'], done:'You can name the job of each part of a text!',
  board:{ one:'Ask each part: what is your job? Problem, explain, solution, result, hook, step.', activity:'Cut a short article into paragraphs; groups label each one with its job and rebuild it.', mistakes:['Calling an explanation a step','Missing that the last sentence proves the solution worked','Ignoring a hook question at the start'] },
  do:[
    {type:'match', q:'The Muddy Field', pairs:[['games cancelled','the problem'],['field sits low','explains why'],['dug a drain','the solution'],['none cancelled','shows it worked']], say:'Match each paragraph to its job.', how:'Ask each paragraph what its job is: problem, explain, solution, or result.'},
    {type:'sort', bins:['Hook','Explain','Step'], cards:[['Ever wondered why?',0],['because it is low',1],['First, dig a trench',2],['Guess what?',0],['Next, lay the pipe',2]], say:'What job does this sentence do?', how:'A hook grabs you with a question or surprise. Explain gives a reason. A step is one action in order.'}],
  your:[
    {type:'listen', q:'The noisy bus', hear:'P1: The yeshiva bus was so loud the driver could not hear. P2: So the boys made a rule: quiet voices after the first stop. P3: Now the driver says it is the calmest bus in town. What job does P3 do? A: tells the problem. B: explains why. C: shows the solution worked. D: is a hook.', o:['B','A','C','D'], a:'C', say:'Listen. What job does P3 do?', how:'P3 tells what happened after the fix. It shows that the solution worked.', why:{q:'Which words show it?', o:['Now ... the calmest','So the boys','was so loud','could not hear'], a:'Now ... the calmest'}},
    {type:'sort', q:'Error analysis: Chaim labeled these', bins:['Explains','Gives a step'], cards:[['Mix the flour',1],['That keeps it chewy',0],['Bake it 20 minutes',1],['The salt slows yeast',0]], say:'Error analysis: Chaim called them all steps. Fix it.', how:'No signal word? Ask: is it an action to do, or a reason? Chaim\'s mistake was calling reasons steps.', why:{q:'Why is "That keeps it chewy" not a step?', o:['It is short','It is last','It is about bread','It gives a reason, not an action'], a:'It gives a reason, not an action'}},
    {type:'listen', q:'Why did the author add it?', hear:'A pretzel article says: Pretzels are dipped in a baking soda bath before baking. This is what makes the crust dark and shiny. Why did the author add the second sentence? A: to hook the reader. B: to give the last step. C: to tell a problem. D: to give the reason for the crust\'s color.', o:['A','B','C','D'], a:'D', say:'Listen. Why is that sentence there?', how:'"This is what makes" gives a reason. Its job is to explain.', why:{q:'What clue shows explaining?', o:['are dipped','before baking','what makes it','pretzels'], a:'what makes it'}},
    {type:'tiles', w:['Lost a sukkah?','Ours blew over','poles were loose','we tied rope','it stood firm'], q:'Rebuild the article in order', say:'Rebuild the article: hook, problem, why, fix, result.', how:'A hook question, then the problem, then why, then the fix, then proof it worked.'},
    {type:'listen', q:'Challenge: the kiddush article', hear:'P1: Our shul kiddush always ran out of cholent. P2: Thirty new families had moved in. P3: The gabbai added a second pot. P4: Last Shabbos there was cholent for seconds. What job does P2 do? A: tells the problem. B: tells the solution. C: explains why. D: shows it worked.', o:['A','B','C','D'], a:'C', say:'Challenge! What job does P2 do?', how:'No why or because here, but P2 gives the reason for the problem.', why:{q:'What job does P4 do?', o:['tells the problem','shows the fix worked','is a step','is a hook'], a:'shows the fix worked'}}] };

B['READ.COMP.L07.04']={ band:'M68', pic:'🪖', today:'Spot the claim, its support and the other side', why:'Every ad and opinion tries to convince you. Check the claim before you believe it.',
  ready:[{q:'An author\'s point often uses...', o:['should','and','the','was'], a:'should'},{q:'Evidence should...', o:['prove the claim','repeat the claim','be a picture','be long'], a:'prove the claim'}],
  bridge:'READ.COMP.L07.01', bridgeName:'Cite text evidence for an answer',
  watch:{ q:'Every Boy Should Learn First Aid', m:{type:'scene',e:'🩹',t:'Every boy should learn first aid. Hatzalah volunteers say quick help saves lives. Last year, a boy in our camp helped a friend who was choking. Also, first aid makes you taller. Some say boys are too young. But a short class teaches the basics in one day.'}, steps:[
    {t:'Strategy: I find four parts. The claim: what the writer says should happen. Every boy should learn first aid.'},
    {t:'Support: reasons with evidence. Hatzalah says quick help saves lives; a camp boy helped a choking friend.'},
    {t:'Challenge step: I test every reason. "First aid makes you taller" has no evidence, and it is not true. A claim with no support is weak.'},
    {t:'The other side (counterclaim): boys are too young. The answer back (rebuttal): a short class teaches the basics. Teach it back: name the 4 parts to your chavrusa.'},
    {t:'Same four parts in a helmet letter. Claim: every boy should wear a helmet on a bike. Support: doctors say helmets prevent many serious head injuries. No support: boys who wear helmets ride faster than everyone else.'}], a:'Claim, support, counterclaim, rebuttal; test every reason.' },
  oops:{ q:'Claim? "We need a library. Some fear losses."', wrong:'some fear losses', right:'we need a library', why:'The fear of losing seforim is the other side, not the claim.' },
  ways:['think-aloud','four parts','test the support','error analysis','teach it back'], done:'You can spot a claim and check its support!',
  board:{ one:'Claim, reasons with evidence, counterclaim, rebuttal; test every reason.', activity:'Mini debate: one side states a claim with evidence; the other gives a counterclaim; the first answers with a rebuttal.', mistakes:['Calling the counterclaim the claim','Believing a reason that has no evidence','Missing the rebuttal'] },
  do:[
    {type:'sort', q:'The first-aid letter', bins:['Claim','Other side','Rebuttal'], cards:[['learn first aid',0],['boys are too young',1],['a one-day class',2]], say:'Is it the claim, the other side, or the answer?', how:'The claim says what should happen. The other side says no. The rebuttal answers them.'},
    {type:'match', pairs:[['claim','what he wants'],['evidence','facts that prove'],['counterclaim','the other side'],['rebuttal','the answer back']], say:'Match each part to its job.', how:'Claim first, then evidence. The other side says no; the rebuttal answers them.'}],
  your:[
    {type:'listen', q:'A letter about recess', hear:'Our yeshiva should add ten minutes to recess. A study found kids focus better after play. Our rebbeim say boys learn faster after running. Also, boys with more recess never get sick. Some say we will lose learning time. But we will learn faster when we come back. What is the main claim? A: add ten minutes to recess. B: kids focus after play. C: we will lose learning time. D: rebbeim say so.', o:['A','B','C','D'], a:'A', say:'Listen. Tap the main claim.', how:'Should shows the claim. B is support. C is the other side.', why:{q:'Which word shows the claim?', o:['should','study','some','but'], a:'should'}},
    {type:'sort', q:'Recess letter: test the support', bins:['Has evidence','No evidence'], cards:[['a study found it',0],['rebbeim see it',0],['never get sick',1]], say:'Does this reason have evidence?', how:'A study and the rebbeim are evidence. "Never get sick" has no support at all.', why:{q:'Why is "never get sick" weak?', o:['It is about money','It is short','It is the claim','No fact or reason backs it'], a:'No fact or reason backs it'}},
    {type:'listen', q:'Error analysis: Moshe\'s answer', hear:'Recess letter. The teacher asked: what is the counterclaim? Moshe answered: kids focus better after play. What was Moshe\'s mistake? A: he was right. B: he gave the claim. C: he gave a support, not the other side. D: he gave the rebuttal.', o:['A','B','C','D'], a:'C', say:'Error analysis: what went wrong?', how:'The counterclaim is what the other side says: we will lose learning time. Moshe gave a support.', why:{q:'What backs "focus better after play"?', o:['Some say we lose time','we learn faster after','A study found it','should'], a:'A study found it'}},
    {type:'tiles', w:['claim: bike rack','12 boys ride','"costs too much"','a parent donates'], q:'Teach it back: build the letter', say:'Put the letter in order: claim, support, other side, answer.', how:'Our shul needs a bike rack. Twelve boys ride daily. Some say it costs too much. But a parent will donate it.'},
    {type:'sort', q:'Challenge: an ad for a tutoring program', bins:['Supported','Not supported'], cards:[['grades went up 20%',0],['200 boys joined',1],['you\'ll be a genius',1],['best program ever',1]], say:'Challenge! The ad claims it raises grades.', how:'A number is support only if it proves THIS claim. Joining shows popular, not better grades.', why:{q:'What should a careful reader do with "best ever"?', o:['Believe it','Ask for evidence','Repeat it','Ignore the ad'], a:'Ask for evidence'}}] };

B['READ.LIT.L07.01']={ band:'M68', pic:'🛍️', today:'Connect character, conflict, change and theme', why:'The struggle a character faces, and how he changes, is where the lesson of a story lives.',
  ready:[{q:'The moral of a story is...', o:['the lesson','the title','a detail','the setting'], a:'the lesson'},{q:'A trait is...', o:['what someone is like','where he lives','his name','the time'], a:'what someone is like'}],
  bridge:'READ.LIT.L06.01', bridgeName:'Compare Characters',
  watch:{ q:'Naftali and the Tehillim group', m:{type:'scene',e:'📖',t:'Every Shabbos afternoon Naftali wanted to read his new book, but the shul needed boys for the Tehillim group. At first he came late and kept checking the clock. By winter, he was the one calling the other boys to come.'}, steps:[
    {t:'Character: who is it about? Naftali.'},
    {t:'Conflict: the problem inside him. He must choose between reading his book and joining the Tehillim group. Inner = a choice or fear inside him; outer = a person, storm or thing against him.'},
    {t:'Change: I compare the start and the end. He goes from coming late and checking the clock to calling the others to come.'},
    {t:'Theme: the change points to the lesson about life. Doing a mitzvah can become something we love. Teach it back: tell your chavrusa the chain: character, conflict, change, theme.'},
    {t:'Same chain in Eli\'s story. Conflict: He must choose between playing ball and helping Mrs. Gold. Change: He goes from helping with a sigh to waiting at her door on his own. Theme: Helping others can turn into something we want to do.'}], a:'Character + conflict + change = theme.' },
  oops:{ q:'Theme: "Naftali joined Tehillim." OK?', wrong:'Yes, a good theme', right:'No, it only retells', why:'That is what happened. A theme is a life lesson for anyone: a mitzvah can become a joy.' },
  ways:['think-aloud','character chain','sort theme and topic','error analysis','teach it back'], done:'You can connect character, conflict and theme!',
  board:{ one:'Conflict tests the character; his change points to the theme.', activity:'Story spine: boys fill in Character, Conflict, Change and Theme on four cards for a story they know.', mistakes:['Naming a topic (Tehillim) as the theme','Missing the inner conflict (a choice)','Not comparing the start and the end'] },
  do:[
    {type:'match', q:'Naftali and the Tehillim group', pairs:[['Character','Naftali'],['Conflict','book or Tehillim'],['Change','late to leader'],['Theme','mitzvah we love']], say:'Match each story part to Naftali\'s story.', how:'Conflict is his choice. Change compares the start and the end. Theme is the life lesson.'},
    {type:'sort', bins:['Inner conflict','Outer conflict'], cards:[['book or Tehillim',0],['a storm hits',1],['afraid to speak',0],['a bully blocks him',1]], say:'Is the problem inside him, or outside?', how:'Inner: a choice or fear inside him. Outer: a person, storm or thing against him.'}],
  your:[
    {type:'listen', q:'Shimon\'s story', hear:'Shimon wanted to go to the park on Sunday, but his little brother was sick and Ima needed help. At first Shimon helped with a frown. By the end of the day he was reading his brother a story, smiling. What is Shimon\'s conflict? A: he likes stories. B: his brother is sick. C: it is Sunday. D: the park or helping at home.', o:['A','B','C','D'], a:'D', say:'Listen. What is Shimon\'s conflict?', how:'The conflict is the choice he struggles with: the park or helping at home.', why:{q:'Why not B?', o:['It causes the conflict, but is not his choice','It is false','It is too short','It is the theme'], a:'It causes the conflict, but is not his choice'}},
    {type:'sort', q:'Shimon\'s story', bins:['A theme','Not a theme'], cards:[['kindness grows on you',0],['Shimon helped at home',1],['helping can bring joy',0],['a sick little brother',1]], say:'Is it a theme, or not?', how:'A theme is a life lesson for anyone. Retelling what happened is not a theme.', why:{q:'Why is "Shimon helped at home" not a theme?', o:['It is too long','It is false','It is a name','It retells, not a lesson'], a:'It retells, not a lesson'}},
    {type:'listen', q:'How does Shimon change?', hear:'How does Shimon change? A: from happy to grumpy. B: he does not change. C: from sick to well. D: from helping with a frown to reading to his brother, smiling.', o:['A','B','C','D'], a:'D', say:'Listen. How does Shimon change?', how:'Compare the start and the end: a frown at first, smiling by the end.', why:{q:'What do you compare to see a change?', o:['the title and the end','two names','the start and the end','the setting'], a:'the start and the end'}},
    {type:'match', pairs:[['conflict','his inner choice'],['change','start vs end'],['theme','life lesson']], say:'Teach it back: match each part to what it means.', how:'Conflict is the choice. Change compares start and end. Theme is the lesson for everyone.'},
    {type:'listen', q:'Challenge: Ari and Chesky', hear:'Ari, the fastest runner, laughed when new boy Chesky came last. Next race, Ari tripped, and Chesky stopped to help him up. After that, Ari ran beside Chesky and cheered him on. Best theme? A: Running. B: Ari tripped in a race. C: Fast runners always win. D: Kindness can change how we treat others.', o:['A','B','C','D'], a:'D', say:'Challenge! Pick the best theme.', how:'A is a topic. B retells. C is not what happened. D is a life lesson the change shows.', why:{q:'What changed in Ari?', o:['fast to slow','laughing to cheering him','alone to sad','winning to losing'], a:'laughing to cheering him'}}] };

B['READ.VOC.L07.01']={ band:'M68', pic:'🎨', today:'See how word choice creates feeling and mood', why:'The right word can make a scene glow or shiver. Writers choose on purpose.',
  ready:[{q:'A simile uses...', o:['like or as','is','a name','a number'], a:'like or as'},{q:'"Trudged" means walked...', o:['slowly and tiredly','fast','happily','backward'], a:'slowly and tiredly'}],
  bridge:'READ.VOC.L06.02', bridgeName:'Figure It Out',
  watch:{ q:'The Storm Before Shabbos', m:{type:'scene',e:'⛈️',t:'Thunder growled. Rain lashed the windows, and Yaakov huddled by the door. Then the clouds parted. Golden light poured over the table, and the candles twinkled.'}, steps:[
    {t:'Strategy: I circle strong verbs and ask what feeling each gives. Growled, lashed, huddled: tense and scary.'},
    {t:'Then the words change: parted, poured, twinkled. A change in words shows a change in mood: calm and joyful.'},
    {t:'Connotation is the feeling a word carries. Poured feels rich and warm; dripped would feel weak.'},
    {t:'Teach it back: tell your chavrusa how growled and twinkled make two different moods.'},
    {t:'Same strategy anywhere. Chizkiyahu bravely climbed down for a lost siddur: bravely gives the best feeling. A Shabbos table with candlelight and a sweet zemer: the mood is warm and joyful. Ending with "a siyum on the sidewalk": to make the long walk feel like a happy celebration.'}], a:'Strong words carry feelings; together they make the mood.' },
  oops:{ q:'"Sleet stung. Then Ima laughed." One mood?', wrong:'Yes, gloomy', right:'No, it shifts', why:'Stung feels cold and sharp; laughed feels warm. When the words change, the mood changes.' },
  ways:['think-aloud','sort by mood','pick the best word','error analysis','teach it back'], done:'You can see how word choice creates mood!',
  board:{ one:'Strong verbs and connotation build the mood; a word change shows a mood change.', activity:'Mood swap: boys rewrite a gloomy sentence into a joyful one by changing only three words.', mistakes:['Noticing what happens but not how the words feel','Missing the mood change mid-story','Picking a word that gives the wrong feeling'] },
  do:[
    {type:'sort', q:'The Storm Before Shabbos', bins:['Tense','Joyful'], cards:[['growled',0],['lashed',0],['poured',1],['twinkled',1],['huddled',0]], say:'Does this word feel tense, or joyful?', how:'Growled and lashed feel scary. Poured and twinkled feel warm and bright.'},
    {type:'match', pairs:[['dashed','fast'],['crept','quiet'],['stomped','angry']], say:'Match each verb to the feeling it gives.', how:'All three mean walked, but each carries a different feeling.'}],
  your:[
    {type:'listen', q:'Mendy ___ the heavy box up the hill.', hear:'Mendy blank the heavy box up the hill. Which word shows it was hard work? A: hauled. B: skipped. C: tossed. D: held.', o:['A','B','C','D'], a:'A', say:'Listen. Pick the word that shows hard work.', how:'Hauled means pulled with effort. Skipped and tossed sound easy.', why:{q:'What does hauled make you feel?', o:['It was heavy, hard work','It was fun','It was quick','It was quiet'], a:'It was heavy, hard work'}},
    {type:'sort', q:'Error analysis: Avi called Zaidy cheap', bins:['Kind feeling','Unkind feeling'], cards:[['thrifty',0],['careful with money',0],['cheap',1],['stingy',1]], say:'Avi meant Zaidy saves money. Kind or unkind way to say it?', how:'Cheap and stingy mean the same as thrifty, but carry an unkind feeling. Choose words with the right connotation.', why:{q:'Why is "thrifty" better than "cheap"?', o:['It is longer','It means more money','It is newer','It has a kinder feeling'], a:'It has a kinder feeling'}},
    {type:'listen', q:'What mood do the words create?', hear:'Snow drifted softly. The fire crackled, and Zaidy hummed a niggun while the cocoa steamed. What mood do the words create? A: angry. B: scary and tense. C: cozy and peaceful. D: bored.', o:['A','B','C','D'], a:'C', say:'Listen. What is the mood?', how:'Softly, crackled, hummed, steamed: soft, warm words make a cozy, peaceful mood.', why:{q:'Why "crackled," not "burned"?', o:['to show danger','to tell the time','to make the fire feel warm and alive','to name the fuel'], a:'to make the fire feel warm and alive'}},
    {type:'sort', q:'How does the mood change?', bins:['Before','After'], cards:[['silent and dark',0],['only the clock ticked',0],['the door burst open',1],['twins raced in',1]], say:'Still and quiet, then the twins burst in. Sort it.', how:'Silent and dark feel still and lonely. Burst and laughing feel excited and happy. The words change, so the mood changes.', why:{q:'How does the mood change?', o:['joyful the whole time','from still and lonely to excited and happy','scary and tense','from happy to sad'], a:'from still and lonely to excited and happy'}},
    {type:'listen', q:'Challenge: why end this way?', hear:'After the oven broke, the boys sold cold cookie dough, and Rebbi called it the sweetest flop in yeshiva history. Why end with those words? A: to show the cookies were bad. B: to describe a real flop. C: to tell the price. D: to turn a failure into a happy memory.', o:['A','B','C','D'], a:'D', say:'Challenge! Why did the author choose those words?', how:'Sweetest is warm and happy. The words turn a failure into a happy memory.', why:{q:'What does "sweetest" carry?', o:['a warm, happy feeling','a bitter feeling','a cold feeling','a sad feeling'], a:'a warm, happy feeling'}}] };


B['READ.COMP.L08.01']={ band:'M68', pic:'📰', today:'Compare two texts on the same topic', why:'A notice, a letter and a news story can tell the same event very differently. Comparing shows the full picture.',
  ready:[{q:'Two sources: a strong sentence uses...', o:['facts from both','only one','an opinion','the title'], a:'facts from both'},{q:'Objective means...', o:['facts, no opinions','feelings','long','funny'], a:'facts, no opinions'}],
  bridge:'READ.COMP.L06.05', bridgeName:'Two Sources',
  watch:{ q:'A notice and a diary', m:{type:'scene',e:'📰',t:'Text 1, school notice: Starting Monday, Gemara class moves from 8:30 to 8:00 a.m. Breakfast will be served at 7:30. Text 2, Shloimy\'s diary: Ugh, an earlier start! But Rebbi said we will finish a whole perek by Chanukah, so I am excited.'}, steps:[
    {t:'Strategy: I find the shared topic first. Both are about Gemara class starting earlier.'},
    {t:'I name each angle. Text 1 lists times. Text 2 tells feelings and a reason to be glad.'},
    {t:'I ask who wrote each and why. The school informs. Shloimy shares how he feels.'},
    {t:'I note what only one adds: breakfast at 7:30 is only in Text 1; finishing a perek is only in Text 2. Last question: which fact in one text answers the other writer? Teach it back: tell your chavrusa the questions: topic, angle, who and why, what only one adds, what answers the other.'},
    {t:'Same questions anywhere. A notice and a journal: in both, the yeshiva day is getting longer. Text 1 gives plain facts; Text 2 shows feelings and a reason to be glad.'}], a:'Same topic, different angle and purpose.' },
  oops:{ q:'Notice + diary. Topic both share?', wrong:'breakfast at 7:30', right:'Gemara starts earlier', why:'Breakfast is only in Text 1. The shared topic is what BOTH texts are about.' },
  ways:['think-aloud','four questions','sort by text','error analysis','teach it back'], done:'You can compare two texts on one topic!',
  board:{ one:'Shared topic, each angle, who wrote it and why, what only one adds.', activity:'Two-column chart: read a notice and a letter on one change; boys sort facts and feelings into columns.', mistakes:['Calling a detail from one text the shared topic','Missing the writer\'s purpose','Comparing details instead of angles'] },
  do:[
    {type:'sort', q:'The notice and the diary', bins:['Text 1 only','Text 2 only','Both'], cards:[['breakfast 7:30',0],['finish a perek',1],['starts earlier',2],['I am excited',1]], say:'Which text has this, or both?', how:'Text 1 is the school notice. Text 2 is Shloimy\'s diary. Both say class starts earlier.'},
    {type:'match', pairs:[['Text 1','plain facts'],['Text 2','feelings, reason'],['purpose 1','to inform'],['purpose 2','share feelings']], say:'Match each text to its angle and purpose.', how:'Ask who wrote it and why.'}],
  your:[
    {type:'listen', q:'Two texts: a new shul parking lot', hear:'Text 1, the shul board: A new lot with 60 spaces opens in March. Text 2, Mrs. Katz\'s letter: My walk to shul is finally safe, and I am so happy my elderly father can come again! What topic do both share? A: her father. B: 60 spaces. C: the new parking lot. D: March.', o:['A','B','C','D'], a:'C', say:'Listen. What topic do both texts share?', how:'B and D are only in Text 1. A is only in Text 2. Both are about the new lot.', why:{q:'Why not 60 spaces?', o:['It is wrong','It is a feeling','It is in both','Only Text 1 says it'], a:'Only Text 1 says it'}},
    {type:'sort', q:'Avi filed "finally safe" as Fact. Fix all.', bins:['Fact','Feeling or opinion'], cards:[['60 spaces',0],['finally safe',1],['opens in March',0],['so happy',1]], say:'Error analysis: sort each part correctly.', how:'A fact can be checked. A feeling or opinion shows how the writer feels. Avi\'s mistake: "finally safe" is her feeling.', why:{q:'Why does sorting facts and feelings help?', o:['It makes it longer','It shows each text\'s angle','It finds the title','It counts words'], a:'It shows each text\'s angle'}},
    {type:'listen', q:'Which fact answers the other writer?', hear:'Text 1, the shul board: A new lot with 60 spaces opens in March. It will have bright lights and a crossing guard. Text 2, a neighbor: The lot will bring dangerous traffic onto our street. Which fact from Text 1 best answers the neighbor? A: it opens in March. B: it has 60 spaces. C: a crossing guard will keep walkers safe. D: the board wrote it.', o:['A','B','C','D'], a:'C', say:'Listen. Which fact answers the neighbor\'s worry?', how:'The neighbor worries about danger. The crossing guard answers that worry.', why:{q:'Why not 60 spaces?', o:['It does not answer the danger worry','It is false','It is a feeling','It is in Text 2'], a:'It does not answer the danger worry'}},
    {type:'tiles', w:['shared topic','each angle','who and why','only one adds','answers the other'], q:'Teach it back: compare two texts', say:'Put the five compare questions in order.', how:'Find the shared topic, name each angle, ask who and why, note what only one adds, then find what answers the other.'},
    {type:'listen', q:'Challenge: which fact could change a mind?', hear:'Text 1: The town plans a bike path on Elm Street. It is one mile long, and work begins in May. Last year, 7 boys on bikes were hurt there. Text 2: A store owner writes: the path takes 10 parking spaces from my shop. Which fact from Text 1 best answers the store owner? A: the path is one mile long. B: the path will be on Elm Street. C: work begins in May. D: 7 boys were hurt there.', o:['A','B','C','D'], a:'D', say:'Challenge! Which fact answers the other text?', how:'Safety for boys is the strongest answer to losing parking spaces.', why:{q:'Why is A strongest?', o:['It shows why the path matters','It is first','It is short','It names a street'], a:'It shows why the path matters'}}] };

B['READ.COMP.L08.02']={ band:'M68', pic:'⛓️', today:'Follow how one event leads to the next', why:'History, science and stories are chains. Find the first link and the rest makes sense.',
  ready:[{q:'A cause is...', o:['why it happened','what happened','a place','a person'], a:'why it happened'},{q:'"As a result" points to...', o:['an effect','a contrast','an example','a title'], a:'an effect'}],
  bridge:'READ.COMP.L05.02', bridgeName:'Sequence and cause and effect',
  watch:{ q:'The New Bus Route', m:{type:'scene',e:'🚌',t:'The city added a bus route to Pine Hill. As a result, families could reach the yeshiva easily, so many moved there. The yeshiva grew so full that it opened a second building. With so many families, a kosher grocery opened nearby.'}, steps:[
    {t:'Strategy: I find the first link, the cause that starts it all: the new bus route.'},
    {t:'I ask, "What did it make possible?" Families could reach the yeshiva, so many moved there. Sign words help: so, because and as a result mean cause and effect; however means contrast; for example means an example.'},
    {t:'Then what? The yeshiva grew full and opened a second building; then a grocery opened. Each link leads to the next.'},
    {t:'What-if test: take away the first link. Without the bus route, would families have moved? No. So the chain falls. Teach it back: explain the chain and the what-if test to your chavrusa.'},
    {t:'Same chain anywhere. Camp Ohr made a new rule because boys were falling asleep in learning. The next summer, other camps copied the rule. In Cedar Falls, without the bridge, young families moving to the west side would not have happened.'}], a:'First cause, each link, then the what-if test.' },
  oops:{ q:'Bus route story: what came first?', wrong:'the second building', right:'the new bus route', why:'The second building is a later link. The first cause is the bus route that started the chain.' },
  ways:['think-aloud','build the chain','what-if test','error analysis','teach it back'], done:'You can follow a chain of cause and effect!',
  board:{ one:'Find the first cause, then ask what each link made possible; test with what-if.', activity:'Paper chain: each boy writes one link of a cause chain and they connect them in order.', mistakes:['Starting the chain in the middle','Calling a later event the cause','Missing the transition words'] },
  do:[
    {type:'tiles', w:['bus route','families move','yeshiva full','grocery opens'], q:'The bus route chain', say:'Put the links of the chain in order.', how:'Start with the first cause. Ask what each link made possible.'},
    {type:'sort', bins:['Cause, effect','Contrast','Example'], cards:[['as a result',0],['because',0],['however',1],['on the other hand',1],['for example',2],['such as',2]], say:'What does this transition word signal?', how:'Because and as a result: cause and effect. However: contrast. For example: example.'}],
  your:[
    {type:'listen', q:'The library hours', hear:'Boys had nowhere quiet to learn at night, so the shul opened its library until ten. More boys came to learn. The rav started a night chabura. Soon two other shuls opened their libraries at night too. What caused the shul to open the library at night? A: the night chabura. B: boys had nowhere quiet to learn. C: more boys came. D: the rav.', o:['A','B','C','D'], a:'B', say:'Listen. What started the chain?', how:'The library opened BECAUSE boys had nowhere quiet. The chabura came later.', why:{q:'Why not the night chabura?', o:['It is false','It is a person','It is first','It came later in the chain'], a:'It came later in the chain'}},
    {type:'sort', q:'What if the library never opened?', bins:['Would not happen','Still happens'], cards:[['more boys learning',0],['the night chabura',0],['boys need quiet',1],['the shul itself',1]], say:'Library opened, more came, a chabura began. What if not?', how:'Events that needed the library fall. Things that never depended on it still happen.', why:{q:'Why is "the shul itself" still there?', o:['It is at night','It is new','It came before the library','It is a chabura'], a:'It came before the library'}},
    {type:'listen', q:'Effects outside the shul', hear:'How did the night library affect other shuls? A: they closed early. B: they opened libraries at night too. C: nothing changed. D: their rav left.', o:['A','B','C','D'], a:'B', say:'Listen. How did it affect people outside?', how:'The text says: soon two other shuls opened their libraries at night too.', why:{q:'Which words prove it?', o:['two other shuls opened','the rav started','more boys came','nowhere quiet'], a:'two other shuls opened'}},
    {type:'match', pairs:[['no quiet place','library opens'],['library opens','more boys learn'],['more boys learn','a night chabura']], say:'Match each cause to what it led to.', how:'Each effect becomes the cause of the next link.'},
    {type:'listen', q:'Challenge: a history chain', hear:'Long ago, farmers grew wheat near a small river town. Then a railroad reached it. Farmers could sell crops in the city. The town grew rich and built a school. Without the railroad, which would probably NOT have happened? A: farmers growing wheat. B: the river by the town. C: the town building a school. D: the town being there.', o:['A','B','C','D'], a:'C', say:'Challenge! Use the what-if test.', how:'The school needed the town to grow rich, which needed the railroad. Farms, rivers and weather were there anyway.', why:{q:'Why would farmers still grow wheat?', o:['Wheat came before the railroad','They are new','They are big','They grow crops'], a:'Wheat came before the railroad'}}] };

B['READ.LIT.L08.01']={ band:'M68', pic:'🪵', today:'Track how a theme grows through a story', why:'A theme is not one line. It grows as the character is tested and changes.',
  ready:[{q:'Theme is...', o:['a lesson about life','one word','the title','a character'], a:'a lesson about life'},{q:'Conflict is...', o:['the problem','the ending','the setting','the title'], a:'the problem'}],
  bridge:'READ.LIT.L07.01', bridgeName:'Character, conflict and theme',
  watch:{ q:'The Found Wallet', m:{type:'scene',e:'👛',t:'Ari found a wallet on the bus. Nobody saw. He thought, finders keepers. Then he saw a photo of a little girl in it. He called the number on the card. The owner cried with thanks, and Ari walked home lighter.'}, steps:[
    {t:'Strategy: I take three snapshots. Snapshot 1, the test begins: Ari finds a wallet, and nobody saw.'},
    {t:'Snapshot 2, the turning point: he sees the photo and thinks of the owner.'},
    {t:'Snapshot 3, the end: he returns it and walks home lighter.'},
    {t:'The change points to the theme, a full sentence: doing the right thing when no one sees brings real happiness. Teach it back: snapshots, then theme.'},
    {t:'Same snapshots in The Extra Dollar: the test begins when Mr. Kaplan gives Yechezkel one dollar too much. At the end, Yechezkel gives back the dollar and feels lighter. In The Wobbly Shtender: Naftali learns from a failed shtender and Zeidy\'s words that good work takes patience, then teaches it to others.'}], a:'Test, turning point, end: the theme grows.' },
  oops:{ q:'The Found Wallet: theme?', wrong:'Ari returns a wallet', right:'do right when no one sees', why:'That retells the plot. A theme is a lesson for everyone.' },
  ways:['think-aloud','three snapshots','topic vs theme','error analysis','teach it back'], done:'You can track how a theme grows!',
  board:{ one:'Three snapshots: the test, the turning point, the end. The change shows the theme.', activity:'Snapshot strip: boys draw three frames of a character and write the theme under the last one.', mistakes:['Giving a one-word topic instead of a theme sentence','Using a detail as the theme','Looking only at the ending'] },
  do:[
    {type:'tiles', w:['finds wallet','sees photo','calls owner','walks lighter'], q:'The Found Wallet: snapshots', say:'Put the snapshots in order.', how:'The test begins when he finds it. The photo is the turning point. Then the end.'},
    {type:'sort', bins:['Topic','Plot detail','Theme'], cards:[['honesty',0],['Ari finds a wallet',1],['wallet had a photo',1],['do right unseen',2],['good work takes time',2]], say:'Topic word, plot detail, or theme?', how:'A topic is one idea word. A plot detail tells what happened. A theme is a lesson for everyone.'}],
  your:[
    {type:'listen', q:'Where does the test begin?', hear:'Moshe\'s rebbe asked who broke the window. Moshe had kicked the ball. His friends said, stay quiet. Moshe raised his hand and told the truth. The rebbe thanked him for his honesty. Where does the test of the theme begin? A: the rebbe asks who broke it. B: Moshe raises his hand. C: the rebbe thanks him. D: the window.', o:['A','B','C','D'], a:'A', say:'Listen. Where does the test begin?', how:'The test begins when Moshe must choose: the rebbe asks, and he could hide.', why:{q:'Why not B?', o:['B is the end','B is false','B is a detail','B is his choice, after the test begins'], a:'B is his choice, after the test begins'}},
    {type:'sort', q:'Error analysis: themes for Moshe\'s story', bins:['A theme','Not a theme'], cards:[['truth takes courage',0],['honesty',1],['Moshe broke a window',1],['own up to mistakes',0]], say:'Error analysis: which are real themes?', how:'"Honesty" is only a topic word. "Moshe broke a window" retells the plot. A theme is a lesson for everyone.', why:{q:'What is wrong with "honesty"?', o:['It is false','It is too long','It is a topic, not a full lesson','It is a name'], a:'It is a topic, not a full lesson'}},
    {type:'listen', q:'How does the end complete it?', hear:'How does the end complete the theme in Moshe\'s story? A: the rebbe asks who broke it. B: his friends tell him to stay quiet. C: he tells the truth and is thanked. D: Moshe kicks the ball.', o:['A','B','C','D'], a:'C', say:'Listen. How does the end complete it?', how:'The end shows the result of his choice: truth brings respect.', why:{q:'What theme does the end complete?', o:['Balls break windows','Telling the truth takes courage and earns respect','Friends are quiet','Rebbes ask questions'], a:'Telling the truth takes courage and earns respect'}},
    {type:'match', pairs:[['rebbe asks','the test'],['raises his hand','turning point'],['rebbe thanks him','the end, change']], say:'Teach it back: match each snapshot to its job.', how:'Start, turning point, end. The change points to the theme.'},
    {type:'listen', q:'Challenge: a story across a year', hear:'In Elul, Zev could not blow the shofar at all. Every day he practiced in the yard. On Rosh Hashana, his blasts filled the shul. Which sentence shows how the theme grows across the WHOLE story? A: Zev practices in the yard, showing yards are useful. B: Zev blows strong on Rosh Hashana, showing holidays are special. C: Zev cannot blow in Elul, showing shofar is hard. D: Zev goes from failing to practicing every day to blowing strong, showing that effort pays off.', o:['A','B','C','D'], a:'D', say:'Challenge! Which sentence tracks the whole theme?', how:'A whole-story theme sentence covers the start, the middle and the end.', why:{q:'Why not B?', o:['It covers only the end','It is false','It is too long','It is the start'], a:'It covers only the end'}}] };

B['READ.LIT.L08.02']={ band:'M68', pic:'⚾', today:'See one event through two characters\' eyes', why:'People feel the same moment differently. Readers who notice this understand people better.',
  ready:[{q:'First person uses...', o:['I and me','he and she','you','names only'], a:'I and me'},{q:'Third person uses...', o:['he, she, names','I and me','we','you'], a:'he, she, names'}],
  bridge:'READ.LIT.L05.02', bridgeName:'Who\'s Telling?',
  watch:{ q:'The Spilled Grape Juice', m:{type:'scene',e:'🍷',t:'BINYAMIN: At the Seder I reached for the matzah and knocked over my cup. Grape juice everywhere. My face burned. ZEIDY: I saw Binyamin\'s face turn red. I remembered spilling my own cup at my first Seder, seventy years ago. I smiled and said, "Now it is a real Seder!"'}, steps:[
    {t:'Strategy: I read each part and ask: how does he feel, and why?'},
    {t:'Binyamin feels embarrassed: his face burned.'},
    {t:'Zeidy understands, because he remembers spilling his own cup at his first Seder.'},
    {t:'The reader knows both minds. We know Zeidy is thinking of his own spill; Binyamin does not. Teach it back: two parts, two feelings, what only the reader knows.'},
    {t:'Same steps in The Last Out: Yanky understands because he remembers striking out three times last week. The reader knows that Yanky is thinking about his own bad game last week. In The Rainy Sunday: Yaakov sees the rain as ruining his day; Eli sees it as a present.'}], a:'Same event, two views; the reader sees both.' },
  oops:{ q:'Rainy Sunday: Yaakov\'s trip is cancelled. He feels?', wrong:'happy, rain is fun', right:'upset', why:'That might be how YOU feel. Use Yaakov\'s clue: the ruined trip.' },
  ways:['think-aloud','sort by character','what only the reader knows','error analysis','teach it back'], done:'You can see an event through two characters\' eyes!',
  board:{ one:'Read each part: how does he feel, and why? The reader may know more than each character.', activity:'Hot seat: two boys answer as two characters about the same event.', mistakes:['Using your own feelings instead of the character\'s clues','Thinking both characters know the same things','Mixing up first and third person'] },
  do:[
    {type:'sort', q:'The Spilled Grape Juice', bins:['Binyamin','Zeidy'], cards:[['face burned',0],['remembers his spill',1],['knocked the cup',0],['"a real Seder!"',1]], say:'Whose part is this from?', how:'Binyamin tells what he did and felt. Zeidy tells what he saw and remembered.'},
    {type:'match', q:'The Spilled Grape Juice', pairs:[['face burned','embarrassed'],['remembered spill','understands'],['smiled, joked','kind, calm']], say:'Match each clue to the feeling it shows.', how:'Clues about the body or memory show feelings: a burning face, a memory, a smile.'}],
  your:[
    {type:'listen', q:'Shimmy and Bubby', hear:'SHIMMY: I left the challah in too long. It came out black. I wanted to cry. BUBBY: I saw Shimmy\'s eyes fill up. I remembered burning a whole kugel before my first Shabbos guests. I hugged him: now you are a real baker! Why does Bubby understand? A: she burned the challah too. B: she burned a kugel long ago. C: Shimmy told her. D: she likes challah.', o:['A','B','C','D'], a:'B', say:'Listen. Why does Bubby understand Shimmy?', how:'Bubby\'s part says she remembered burning a whole kugel.', why:{q:'Which words prove it?', o:['I saw his eyes fill','I remembered burning','a real baker','first guests'], a:'I remembered burning'}},
    {type:'sort', q:'Shimmy and Bubby', bins:['Shimmy\'s part','Bubby\'s part'], cards:[['it came out black',0],['I wanted to cry',0],['I remembered a kugel',1],['a real baker',1]], say:'Whose part is this from?', how:'Shimmy tells about the burned challah. Bubby remembers her own kugel and hugs him.', why:{q:'What mistake does this sort prevent?', o:['Using your own feeling','Mixing up whose view it is','Reading fast','Counting words'], a:'Mixing up whose view it is'}},
    {type:'listen', q:'What does only the reader know?', hear:'In the challah story, what does the reader know that Shimmy does not? A: that the challah burned. B: that he wanted to cry. C: that it was for Shabbos. D: that Bubby is remembering her own burned kugel.', o:['A','B','C','D'], a:'D', say:'Listen. What does only the reader know?', how:'Shimmy cannot see inside Bubby\'s mind. The reader read her part.', why:{q:'Why not A?', o:['Shimmy knows it burned','It is false','It is Bubby\'s','It is a feeling'], a:'Shimmy knows it burned'}},
    {type:'tiles', w:['read each part','his feeling','why','reader knows'], q:'Teach it back: two views', say:'Put the two-views strategy in order.', how:'Read each part. Name his feeling. Find why. Then ask what only the reader knows.'},
    {type:'listen', q:'Challenge: two views of a move', hear:'Yaakov: We are moving to Eretz Yisrael! Every day I dream of the Kotel. Nissim, his friend: My best friend is leaving. Who will sit with me now? Which sentence contrasts their views? A: Both boys are sad. B: Yaakov sees a dream come true; Nissim sees a loss. C: Nissim sees a dream; Yaakov sees a loss. D: Yaakov is moving.', o:['A','B','C','D'], a:'B', say:'Challenge! Which sentence contrasts their views?', how:'Name each boy\'s view: a dream for Yaakov, a loss for Nissim. C swaps them.', why:{q:'Why not D?', o:['It tells a fact, not two views','It is false','It is too long','It swaps them'], a:'It tells a fact, not two views'}}] };

B['READ.VOC.L08.01']={ band:'M68', pic:'🪟', today:'Name and explain figurative language', why:'Poems, speeches and stories use these tools. Naming them helps you feel what the writer means.',
  ready:[{q:'A simile uses...', o:['like or as','is','a name','numbers'], a:'like or as'},{q:'A metaphor says one thing...', o:['is another','is like another','is real','is small'], a:'is another'}],
  bridge:'READ.VOC.L06.02', bridgeName:'Figure It Out',
  watch:{ q:'Four tools', m:{type:'scene',e:'🪟',t:'The old shul door groaned open. I had a million pages of homework. After the hike, my arms were noodles. The matzah was as flat as a board.'}, steps:[
    {t:'Strategy: I look for the sign of each tool. Like or as: simile. As flat as a board.'},
    {t:'Says one thing IS another: metaphor. My arms were noodles: my arms felt weak and floppy.'},
    {t:'A huge exaggeration: hyperbole. A million pages of homework: a lot of homework.'},
    {t:'A thing acts like a person: personification. The door groaned. Teach it back: name the four signs to your chavrusa.'},
    {t:'Same signs anywhere. "My legs were jelly" is a metaphor: My legs felt weak and wobbly.'}], a:'Simile, metaphor, hyperbole, personification.' },
  oops:{ q:'"The wind whispered through the sukkah." Device?', wrong:'simile', right:'personification', why:'No like or as. Whispering is a person thing, so the wind acts like a person.' },
  ways:['think-aloud','sort by device','real meaning vs picture','error analysis','teach it back'], done:'You can name and explain figurative language!',
  board:{ one:'Like/as = simile; is = metaphor; huge = hyperbole; acts human = personification.', activity:'Device hunt: groups find one of each device in a poem and act out the literal picture.', mistakes:['Calling personification a simile','Taking a metaphor literally','Missing hyperbole because it sounds normal'] },
  do:[
    {type:'sort', bins:['Personification','Hyperbole','Simile'], cards:[['the door groaned',0],['wind whispered',0],['waited forever',1],['a ton of homework',1],['quick as a fox',2],['like a drum',2]], say:'Which device is this?', how:'Acts like a person: personification. Huge exaggeration: hyperbole. Like or as: simile.'},
    {type:'match', pairs:[['noodle arms','weak, floppy'],['door groaned','creaked loudly'],['a million times','very many times']], say:'Match each one to its real meaning.', how:'Ask what the picture shares with real life. Noodles are floppy, so his arms felt weak.'}],
  your:[
    {type:'listen', q:'"My feet were bricks."', hear:'After the long walk to shul on Yom Kippur, my feet were bricks. What does it mean? A: my feet felt heavy and tired. B: my feet were red. C: my feet turned to stone. D: my feet were square.', o:['A','B','C','D'], a:'A', say:'Listen. What does the metaphor mean?', how:'Bricks are heavy. His feet felt heavy and tired. C is the literal picture.', why:{q:'Why not C?', o:['It is too short','It is a simile','It is false','That is the literal picture, not the meaning'], a:'That is the literal picture, not the meaning'}},

    {type:'match', pairs:[['simile','like or as'],['metaphor','is something'],['hyperbole','huge stretch'],['personification','acts human']], say:'Teach it back: match each device to its sign.', how:'Each device has a sign you can look for.'},
    {type:'sort', bins:['Personification','Simile','Metaphor'], cards:[['the kettle sang',0],['sang like a bird',1],['the oven roared',0],['shul was a beehive',2],['roared like a lion',1]], say:'Which device is it?', how:'A thing acting like a person: personification. Like or as: simile. Says it IS something: metaphor.', why:{q:'Why is "the oven roared" personification?', o:['There is no like or as','A thing does a living creature\'s action','It is loud','It is a kitchen'], a:'A thing does a living creature\'s action'}},
    {type:'listen', q:'Challenge: name it and explain it', hear:'The shofar\'s blast was a lightning bolt in the quiet shul. Which is right? A: a simile: the blast was sudden and powerful. B: a metaphor: the blast was bright. C: a metaphor: the blast was sudden and powerful. D: personification: the shofar spoke.', o:['A','B','C','D'], a:'C', say:'Challenge! Name it and explain it.', how:'No like or as, and it says the blast WAS lightning: a metaphor. Lightning is sudden and powerful.', why:{q:'What do the blast and lightning share?', o:['Both are sudden and powerful','Both are bright','Both are hot','Both are loud and slow'], a:'Both are sudden and powerful'}}] };

  watch:{ q:'BENEVOLENT, OBSTINATE, pitch', m:{type:'scene',e:'🗝️',t:'The BENEVOLENT gabbai gave every new boy a siddur and a warm smile. Yossi was usually OBSTINATE, but this time he changed his mind at once. Dictionary: pitch 1. to throw 2. how high a sound is. Sentence: The chazzan sang at a high pitch.'}, steps:[
    {t:'Strategy: two clues. Clue 1, context: he gave every new boy a siddur and a smile. Clue 2, a root: bene means good. So benevolent means kind and generous.'},
    {t:'An opposite clue: usually OBSTINATE, BUT he changed his mind at once. So obstinate means stubborn.'},
    {t:'Many meanings? I test each in the sentence. The chazzan sang at a high pitch: meaning 2, how high a sound is.'},
    {t:'I always test: put my meaning back into the sentence. Does it make sense? Teach it back: context, root, combine, test.'},

    {type:'listen', q:'inaudible', hear:'The rav\'s words were inaudible; even the front row could not hear. In means not; aud means hear. What does inaudible mean? A: too loud. B: not able to be heard. C: very short. D: in Hebrew.', o:['A','B','C','D'], a:'B', say:'Listen. Use the context and the root.', how:'Context: even the front row could not hear. Root: aud means hear, in means not.', why:{q:'Which clue settles it?', o:['the front row could not hear','the rav spoke','words','in Hebrew'], a:'the front row could not hear'}},

    {type:'listen', q:'Challenge: two clues at once', hear:'The doctor said the cough was chronic; Moshe had had it all year long. Chron means time. What does chronic mean? A: on time. B: happening at a set time. C: lasting a long time. D: lasting a short time.', o:['A','B','C','D'], a:'C', say:'Challenge! Use the context AND the root.', how:'Context: all year long. Root: chron means time. Together: lasting a long time.', why:{q:'Why not "a short time"?', o:['He had it all year','It is too short','Chron means new','Doctors say new'], a:'He had it all year'}}] };
