<script>
/* OneBiteDataRead2.html: hand-written ONE BITE lessons for Reading, Grades 2-8 (READ.*.L03 to L09). Lane C3.
   K-1 Reading lives in OneBiteDataRead.html (Lane C). Content lanes edit only their own data file.
   Schema and rules: docs/ONE-BITE-PLAYBOOK.md (sections 2, 6-7, 10). The player is OneBite.html; the activities are OneBiteKit.html.
   window.ONE_BITE['SKILL.ID'] = { band, today, why, pic, ready:[{q,o,a}], bridge, watch:{q,m,steps,a}, oops:{q,wrong,right,why}, ways:[...], done, board:{...},
     do:[2 guided activities], your:[3-5 practice activities] };
   Lane C3 rules: boys never see the word for this project; say "lesson". Every activity has say (12 words or fewer) and how.
   B23: read-along, one new word at a time, 3-4 choices. E45: real-world texts and "tap the reason" (why). M68: strategy, challenge, teach it back.
   Short passages (about 30 words) in q or a watch step. Sort cards 4 words or fewer; findall one word per cell; match sides about 3 words.
   No double slash in this file. */
window.ONE_BITE=window.ONE_BITE||{};
(function(B){

/* ---- GRADE 2 (L03, band B23). Quality round (HoS 2026-11-22): think-aloud Watch Me on a short original passage,
   then do 1-2 guided (easiest case), your 1-2 a little harder on a NEW passage, your 3 the Mistake Detective mistake,
   your 4 a new representation, your 5 a challenge or real-world case. ---- */
B['READ.COMP.L03.01']={ band:'B23', pic:'🐝', today:'Find the main topic of a page and its parts', why:'When you know what a page is about, every fact on it makes sense, and you can find what you need.',
  ready:[{q:'Chaim has a cat named Puff. Who has a cat?', o:['Chaim','Puff','Mommy'], a:'Chaim'},{q:'Puff ran to the yard. Where did Puff run?', o:['to the yard','to school','home'], a:'to the yard'}],
  bridge:'READ.COMP.L02.01',
  watch:{ q:'Ants', m:{type:'scene',e:'🐜',t:'Ants. Part 1: Ants live in a nest under the ground. Part 2: Ants carry food home in a long line.'}, steps:[
    {t:'I read the title first: Ants. So I think this page is about ants.'},
    {t:'I notice the word ants in every part. A word that keeps coming back is a big clue.', m:{type:'tiles',w:['Ants','nest','Ants','food'],hi:[0,2]}},
    {t:'I read Part 2 only. I notice carry, food, home, line. Most words tell about carrying food. So Part 2 is mostly about how ants carry food.'},
    {t:'Every part is about ants. So the main topic of the whole page is ants.'},
    {t:'A title must fit the WHOLE page: All About Ants. On a page about bees, the title All About Bees fits. Food or Eggs fits only one part.'}], a:'Main topic of the page: ants. Part 2: how ants carry food.' },
  oops:{ q:'A page about snow says sleds one time. Topic?', wrong:'sleds', right:'snow', why:'The topic is what the whole page is about. Sleds came up only once, in one part.' },
  ways:['think-aloud','find the word that comes back','sort topic and detail','match details to topics','Mistake Detective'], done:'You can find the main topic of a page and of each part!',
  board:{ one:'Read the title, find the word that keeps coming back, check that it fits every part.', activity:'Read a short two-part page aloud; boys hold up a finger each time the topic word comes back, then name what each part is mostly about.', mistakes:['Picking a detail that comes up in one part only','Picking a title that fits only one part','Not reading the title first'] },
  do:[
    {type:'findall', q:'A toad can hop. The toad eats bugs.', grid:['A','toad','can','hop','The','toad','eats','bugs'], find:'toad', findSay:'word that comes back', say:'Which word is in every sentence? Tap it each time.', how:'Read both sentences. One word is in both of them. That word is the topic.'},
    {type:'sort', q:'Dogs bark. Dogs wag. Dogs dig.', bins:['Main topic','Small detail'], cards:[['dogs',0],['barking',1],['wagging',1],['digging',1]], say:'Is it the main topic, or a small detail?', how:'The topic is in every sentence: dogs. Each thing a dog does is a detail.'}],
  your:[
    {type:'match', q:'Owls: which part is it from?', pairs:[['catch mice','how owls hunt'],['nest in a tree','owl homes'],['hoot: whoo!','owl sounds']], say:'Match each sentence to what its part is about.', how:'Read the sentence. Is it about hunting, homes, or sounds?'},
    {type:'sort', bins:['All About Bees','Sukkos Things','Chanukah Things'], cards:[['hive',0],['lulav',1],['candles',2],['honey',0],['esrog',1],['dreidel',2]], say:'Which page title does this detail belong under?', how:'Each title must fit every detail under it. Honey fits All About Bees.'},
    {type:'listen', hear:'Turtles. Part 1: A turtle has a hard shell. It hides inside when it is scared. Part 2: A mother turtle digs a hole in the sand and lays eggs. What is the main topic of the whole page?', o:['turtle','shell','eggs'], a:'turtle', say:'Mistake Detective: which word is in every part?', how:'Shells come up in Part 1 only. Eggs come up in Part 2 only. That is the mistake. Turtles are in every part.'},
    {type:'sort', q:'Turtles. Part 1: shell. Part 2: eggs.', bins:['Fits whole page','Only one part'], cards:[['All About Turtles',0],['Turtle Facts',0],['Hard Shells',1],['Laying Eggs',1],['Mother Turtles',1]], say:'Does this title fit the whole page?', how:'A title for the whole page must fit Part 1 AND Part 2. Hard Shells fits only Part 1.'},
    {type:'listen', q:'Challenge: the shul newsletter', hear:'Part 1: Our shul got new books. Part 2: Yehuda and his friends built a new stand for the rav. What is Part 2 mostly about?', o:['stand','books','sukkah'], a:'stand', say:'Challenge! What is Part 2 mostly about?', how:'Listen to Part 2 only. It tells about the new stand, a shtender for the rav.'}] };

B['READ.COMP.L03.02']={ band:'B23', pic:'🐪', today:'Use headings, captions and bold words to find facts', why:'Text tools are like road signs. They take you straight to the fact you need.',
  ready:[{q:'Which one names the whole page?', o:['the title','the last word','a dot'], a:'the title'},{q:'A page about bees is mostly about...', o:['bees','trees','cars'], a:'bees'}],
  bridge:'READ.COMP.L03.01', bridgeName:'Main Topic',
  watch:{ q:'Beavers', m:{type:'scene',e:'🦫',t:'Beavers. ▶ Building a Dam: A beaver packs sticks and mud to make a DAM. ▶ A Safe Home: The door is under the water. 🦫 A beaver lodge. Word box: dam: a wall that holds back water.'}, steps:[
    {t:'My question: what is a dam? I notice DAM is dark and thick. A bold word is explained nearby.'},
    {t:'So I look in the word box: dam: a wall that holds back water. I found it fast!'},
    {t:'New question: where is the door? I read the headings like road signs. A Safe Home sounds right. It says: The door is under the water. Found it!'},
    {t:'I notice a sentence next to the picture: A beaver lodge. That is the caption. A caption tells about the picture.'},
    {t:'A Safe Home is NOT the caption. It is a heading, a name for a part. On a camel page, the caption is the sentence by the picture: Wide feet help a camel walk on sand.'}], a:'Bold word: look in the word box. Question: pick the heading. Picture: read the caption.' },
  oops:{ q:'Which is the caption?', wrong:'A heading, like Made for Sand', right:'The sentence next to the picture', why:'A heading names a part. A caption is the sentence next to or under a picture and tells about it.' },
  ways:['think-aloud','match tool and job','sort facts under headings','bold words in a word box','Mistake Detective'], done:'You can use text tools to find facts fast!',
  board:{ one:'Headings name a part, captions tell about a picture, bold words are explained in the word box.', activity:'Give each pair a page and three questions; they point to the heading, caption or bold word that answers each one.', mistakes:['Calling a heading the caption','Not looking in the word box for a bold word','Reading every part instead of jumping to the heading'] },
  do:[
    {type:'match', pairs:[['heading','names a part'],['caption','about a picture'],['bold word','a key word']], say:'Match each text tool to its job.', how:'A heading is a road sign for a part. A caption sits by a picture. A bold word is dark and thick.'},
    {type:'sort', q:'Beavers: two headings', bins:['Building a Dam','A Safe Home'], cards:[['sticks and mud',0],['where they sleep',1],['how they build',0],['door under water',1]], say:'Which heading would you read for this?', how:'Building a Dam tells how they build. A Safe Home tells where they live.'}],
  your:[
    {type:'listen', q:'Word box: talons', hear:'Owls. An owl has sharp talons. Word box: talons: sharp claws on a bird\'s feet. What are talons?', o:['claws','eyes','wings'], a:'claws', say:'Talons is a bold word. Use the word box.', how:'A bold word is explained in the word box: talons: sharp claws on a bird\'s feet. On a camel page: hump: a big bump on a camel\'s back.'},
    {type:'sort', q:'Penguins: three headings', bins:['Staying Warm','Finding Food','Penguin Chicks'], cards:[['thick feathers',0],['huddle close',0],['catch fish',1],['dive deep',1],['egg on feet',2]], say:'Which heading would you read for this fact?', how:'Read the headings like road signs. Which part would tell this? On a camel page, why a camel does not sink is under Made for Sand.'},
    {type:'match', q:'Which tool answers it?', pairs:[['meaning of warn','word box'],['where they sleep','a heading'],['what is pictured','the caption']], say:'Which text tool would answer each question?', how:'A word meaning: the word box. Which part to read: a heading. What the picture shows: the caption.'},
    {type:'sort', q:'Caption, or heading?', bins:['A caption','Heading or title'], cards:[['🐧 Chicks stay warm.',0],['🦫 Beavers eat bark.',0],['Made for Sand',1],['A Safe Home',1],['Penguins',1]], say:'Mistake Detective: caption, or heading?', how:'The mistake is calling a heading the caption. A caption is a sentence next to a picture. A heading is a short name for a part.'},
    {type:'listen', q:'Challenge: Dovid\'s Pesach book', hear:'Dovid reads a book about Pesach. Heading: Getting Ready. He sees a dark, thick word: chametz. Where can he look to learn what it means?', o:['word box','title','cover'], a:'word box', say:'Challenge! Where should Dovid look?', how:'A bold word is explained nearby, in the word box.'}] };

B['READ.COMP.L03.03']={ band:'B23', pic:'🐦', today:'Answer how and why questions from a page', why:'How asks the steps or the way. Why asks the reason. Knowing which to look for helps you find the answer.',
  ready:[{q:'Which one is a heading?', o:['Why Plants Need Sun','A plant needs sun.','sun'], a:'Why Plants Need Sun'},{q:'A caption tells about...', o:['a picture','the last page','a word'], a:'a picture'}],
  bridge:'READ.COMP.L03.02', bridgeName:'Text Tools',
  watch:{ q:'How Beavers Build', m:{type:'scene',e:'🦫',t:'How Beavers Build. First a beaver cuts sticks. Then it packs them with mud. It swims with its flat tail. Beavers need deep water, so they build a dam. Deep water is good because it keeps them safe.'}, steps:[
    {t:'My question: how does a beaver build? How wants steps. I look for first and then: first it cuts sticks, then it packs them with mud.'},
    {t:'How can also ask the way: how does it swim? With its flat tail. Birds fly in a big group shaped like a V: that is HOW they fly.'},
    {t:'Next question: why build a dam? Why wants a reason. I look for so or because.'},
    {t:'I notice so: Beavers need deep water, so they build a dam. The reason comes BEFORE so. With because, it comes AFTER: because it keeps them safe.'},
    {t:'Sometimes the reason is in the part before. A part called Cold Is Coming tells why. The next part starts with So.'}], a:'How: first, then, or the way. Why: the reason before so, after because.' },
  oops:{ q:'Why do birds fly south?', wrong:'They fly in a V.', right:'It is warm there.', why:'Flying in a V tells HOW they fly. A why question wants a reason.' },
  ways:['think-aloud','how hand and why hand','sort questions','order steps from a text','Mistake Detective'], done:'You can answer how and why questions from a page!',
  board:{ one:'How wants steps or the way (first, then). Why wants a reason: before so, after because.', activity:'Call out questions; boys raise the how hand or the why hand, then hunt for the signal word in a short page.', mistakes:['Answering a why question with how','Looking after so for the reason (it comes before)','Not reading the heading that matches the question'] },
  do:[
    {type:'sort', bins:['How? Steps, way','Why? A reason'], cards:[['How do seeds grow?',0],['Why fly south?',1],['How do they fly?',0],['Why come back?',1]], say:'Does this question want how, or a reason?', how:'Look at the first word. How wants steps or the way. Why wants a reason.'},
    {type:'match', q:'It was cold, so Yossi ran in fast.', pairs:[['Why go in?','it was cold'],['What did he do?','ran in'],['How did he go?','fast']], say:'Match each question to its answer.', how:'With so, the reason comes before it: it was cold.'}],
  your:[
    {type:'tiles', w:['mix','let rise','braid','bake'], hear:'To bake challah, Shira and Mommy mix the dough. Then they let it rise. Then they braid it. Last, they bake it.', q:'Challah: the steps', say:'Listen. A how question! Put the steps in order.', how:'Listen for first, then, last. The dough rises before they braid it.'},
    {type:'findall', q:'It got cold, so we went in. Then we ate.', grid:['It','got','cold','so','we','went','in','Then','we','ate'], find:['so','Then'], findSay:'signal word', say:'Tap the reason word and the step word.', how:'So: the reason is just before it. Then: the next step.'},
    {type:'match', q:'Bears sleep in winter because food is gone.', pairs:[['Why sleep?','food is gone'],['When?','in winter'],['What do they do?','sleep']], say:'Match each question to its answer.', how:'With because, the reason comes after it: food is gone.'},
    {type:'sort', q:'Why do bears sleep all winter?', bins:['Answers WHY','Answers HOW'], cards:[['food is gone',0],['it is very cold',0],['curl up in dens',1],['breathe slowly',1]], say:'Mistake Detective: does it answer why, or how?', how:'The mistake is answering a why question with how. Why wants a reason. Curling up in a den is how they sleep.'},
    {type:'listen', q:'Challenge: ducks in the fall', hear:'Cold Is Coming. In the fall, ducks cannot find bugs. The Long Trip. So the ducks fly to a warm pond. Why do the ducks fly away?', o:['no bugs','ponds','spring'], a:'no bugs', say:'Challenge! Find the reason in two parts.', how:'The reason comes before So, in the part before. Birds fly south because it is warm there, and food is hard to find up north. In the spring they come back because there is lots of food again.'}] };

B['READ.FLU.L03.01']={ band:'B23', pic:'🎙️', today:'Read smoothly, follow the marks, then tell what happened', why:'When you read smoothly, the story makes sense, and people love to listen to you.',
  ready:[{q:'Which mark ends an asking sentence?', o:['?','.',','], a:'?'},{q:'Ben has a red hat. What color is the hat?', o:['red','blue','green'], a:'red'}],
  bridge:'READ.FLU.L02.02',
  watch:{ q:'In the Garden', m:{type:'scene',e:'🎃',t:'In the spring, Zev put in corn seeds. Ben put in pumpkin seeds. "Look!" said Ben. "Are they growing?" asked Zev.'}, steps:[
    {t:'I read in scoops, not word by word: Zev put in / corn seeds. That sounds like talking.'},
    {t:'I notice a comma after spring. So I rest a tiny bit, then keep going.'},
    {t:'I notice a period. So I stop and drop my voice a little. I notice an exclamation mark after Look! So I say it excited.'},
    {t:'I notice a question mark. So my voice goes up: Are they growing? That line sounds asking.'},
    {t:'Then I ask myself: what happened? Zev planted corn seeds. Ben planted pumpkin seeds.'}], a:'Scoop, follow the marks, then ask: what happened?' },
  oops:{ q:'Ben put in corn seeds.', wrong:'Ben. Put. In. Corn. Seeds.', right:'Ben put in / corn seeds.', why:'Robot reading stops after every word. Read words that go together in one scoop.' },
  ways:['think-aloud','match marks to voices','good and broken scoops','order what happened','Mistake Detective'], done:'You can read smoothly, with feeling, and tell what happened!',
  board:{ one:'Read in scoops, follow the marks, then ask what happened.', activity:'Echo reading: the teacher reads a line in scoops, the boys read it back the same way, then retell it.', mistakes:['Reading word by word like a robot','Not stopping at a period or resting at a comma','Reading fast but not knowing what happened'] },
  do:[
    {type:'match', pairs:[['?','asking'],['!','excited'],['.','stop'],[',','short rest']], say:'Match each mark to how your voice sounds.', how:'Question mark: voice goes up. Exclamation: excited. Period: stop. Comma: short rest.'},
    {type:'sort', bins:['Good scoop','Broken scoop'], cards:[['by the fence',0],['in the spring',0],['sat by the',1],['spring, they dug',1]], say:'Is it a good scoop, or a broken one?', how:'A good scoop is words that go together. Do not stop in the middle of an idea.'}],
  your:[
    {type:'listen', q:'"Is it ripe yet?" asked Ben.', hear:'Is it ripe yet?', o:['asking','happy','calm'], a:'asking', say:'Listen. How should this line sound?', how:'It ends with a question mark. Your voice goes up: asking. "What will we do with it?" sounds asking too.'},
    {type:'sort', bins:['Smooth scoop','Broken scoop'], cards:[['a big pumpkin /',0],['a big / pumpkin',1],['by the fence /',0],['by the / fence',1]], say:'Mistake Detective: where did the reader stop?', how:'A broken scoop stops in the middle of an idea. Stop after the words that go together.'},
    {type:'tiles', w:['dug rows','planted','shoots came','corn grew'], hear:'In the spring, Ben and Zev dug rows in the dirt. They put in seeds. Soon, little green shoots came up. By the end of the summer, the corn stood tall.', q:'What happened?', say:'Listen and follow along. Put what happened in order.', how:'Listen in scoops. First they dug, then planted, then shoots came, then the corn grew tall.'},
    {type:'sort', bins:['Voice up','Excited','Stop'], cards:[['Is it ripe?',0],['Can I help?',0],['Look at it!',1],['Wow, so tall!',1],['It is big.',2]], say:'How does your voice sound on this line?', how:'Look at the mark at the end. ? voice up. ! excited. Period: stop.'},
    {type:'listen', q:'Challenge: read the whole story', hear:'Ben and Zev had a garden. Zev put in corn seeds. Ben put in pumpkin seeds. Each day they gave the seeds a drink from the hose. By the end of the summer, a big pumpkin sat by the fence. What will we do with it? asked Zev. We will bring it to the shul for Sukkos! said Ben. Where did the big pumpkin sit?', o:['the fence','the shul','the hose'], a:'the fence', say:'Challenge! Read along, then answer.', how:'Read it again, smoother each time. A big pumpkin sat by the fence. They will bring it to the shul for Sukkos.'}] };

B['READ.VOC.L03.01']={ band:'B23', pic:'🔁', today:'Snap on un or re to change a word', why:'Learn two tiny parts and you can read hundreds of new words.',
  ready:[{q:'Clap it: how many beats in "unpack"?', o:['2','1','3'], a:'2'},{q:'Which word means the same as glad?', o:['happy','sad','mad'], a:'happy'}],
  bridge:'READ.VOC.L02.01',
  watch:{ q:'unhappy, untie, refill', m:{type:'tiles',w:['un','happy']}, steps:[
    {t:'I see a new word: unhappy. I cover un with my finger. I read: happy. A prefix is a word part at the start.', m:{type:'tiles',w:['un','happy'],hi:[1]}},
    {t:'I snap un back on. Un means not. So unhappy means not happy. Unkind means not kind.', m:{type:'tiles',w:['un','happy'],hi:[0]}},
    {t:'With an action word, un means undo: untie means undo the tie. Unpack means take things out.', m:{type:'tiles',w:['un','tie'],hi:[0]}},
    {t:'Re means again. Refill means fill again. In a sentence: Mordy had to retie his shoe. Retie means tie again.', m:{type:'tiles',w:['re','fill'],hi:[0]}},
    {t:'I check: is a real word left? Uncle: cover un, and cle is not a word. So uncle has no prefix.'}], a:'un = not, or undo. re = again.' },
  oops:{ q:'What does redo mean?', wrong:'not do', right:'do again', why:'Re means again. Un means not or undo. Do not mix them up!' },
  ways:['think-aloud','build words with tiles','match word and meaning','sort by prefix','Mistake Detective'], done:'You can use un and re to read new words!',
  board:{ one:'Cover the prefix, read the word, snap it back: un means not or undo, re means again.', activity:'Prefix cards: boys hold un or re in front of base-word cards and say the new meaning.', mistakes:['Mixing up un and re','Thinking every word that starts with un has a prefix (uncle)','Reading the prefix but not the base word'] },
  do:[
    {type:'match', pairs:[['unhappy','not happy'],['untie','undo the tie'],['redo','do again']], say:'Match each word to what it means.', how:'Cover the prefix and read the word. Un means not or undo. Re means again.'},
    {type:'tiles', w:['un','safe'], extra:['re'], q:'Build the word that means not safe.', say:'Build the word that means not safe.', how:'Not is un. Put un first, then safe: unsafe.'}],
  your:[
    {type:'listen', hear:'reread', o:['read again','not read','read fast'], a:'read again', say:'Listen to the word. Tap what it means.', how:'Cover re: read. Re means again. Reread means read again.'},
    {type:'tiles', w:['re','paint'], extra:['un','ing'], q:'Build the word that means paint again.', say:'Build the word that means paint again.', how:'Again is re. Re goes first, then paint: repaint.'},
    {type:'sort', bins:['un: not, undo','re: again'], cards:[['unkind',0],['redo',1],['unfair',0],['reread',1],['untie',0],['retie',1]], say:'Mistake Detective: un, or re?', how:'The mistake is mixing them up. Redo means do again. Unfair means not fair.'},
    {type:'findall', grid:['redo','red','undo','unit','real','up'], find:['redo','undo'], findSay:'word with a prefix', say:'Tap every word that has a prefix.', how:'Cover un or re. Is a real word left? Unit and real have no prefix.'},
    {type:'match', q:'Challenge: Mordy\'s trip home', pairs:[['relocked door','locked again'],['unlocked door','not locked'],['repacked bag','packed again'],['unpacked bag','took it all out']], say:'Challenge! The prefix decides. Match them.', how:'The base word is the same. Look at the prefix: re means again, un means not or undo.'}] };


B['READ.LIT.L03.01']={ band:'B23', pic:'⛰️', today:'Retell a story: beginning, middle, end and lesson', why:'When you can retell a story in order, you really understand it, and you can share it at the Shabbos table.',
  ready:[{q:'"Chaim flew his kite." Who is in the story?', o:['Chaim','the kite','the sky'], a:'Chaim'},{q:'"Then the kite got stuck." What happened?', o:['the kite got stuck','Chaim ate','it rained'], a:'the kite got stuck'}],
  bridge:'READ.LIT.L02.01',
  watch:{ q:'Chaim\'s Kite', m:{type:'scene',e:'🪁',t:'Chaim flew his kite. It got stuck in a tree. Zaidy brought a long stick. The kite came down, and Chaim said thank you.'}, steps:[
    {t:'I crouch low for the beginning. I ask: how does it start? Chaim flew his kite.', m:{type:'move',t:'Crouch: beginning! Stand: middle! Reach up: end!'}},
    {t:'I stand tall for the middle. I ask: what is the problem? The kite got stuck in a tree.'},
    {t:'I reach up high for the end. I ask: how is it solved? Zaidy brought a stick, and the kite came down.'},
    {t:'I ask: what can we learn? A lesson tells us what to DO. Kites are fun is a fact, not a lesson. Ask for help tells us what to do. That is the lesson.'},
    {t:'Now I say it with First, Then, At the end: First Chaim flew his kite. Then it got stuck. At the end Zaidy got it down. Ask for help. A retell of The Lost Coin sounds the same: First Ezriel found a coin. Then he asked who lost it. At the end he gave it back and felt good. Give back what is lost.'}], a:'Beginning, middle, end, lesson.' },
  oops:{ q:'Which retell is best?', wrong:'The kite came down.', right:'First Chaim flew his kite. Then it got stuck. At the end Zaidy got it down.', why:'One part is not a retell. A retell tells the beginning, the middle and the end, in order.' },
  ways:['think-aloud','story mountain movement','order the story','find the lesson','Mistake Detective'], done:'You can retell a story in order, with its lesson!',
  board:{ one:'Retell = beginning, middle, end, and the lesson, in order.', activity:'Story mountain: boys crouch, stand and reach as they retell a story the teacher reads.', mistakes:['Telling only one part, like the end','Telling small details instead of the big parts','Mixing up the order'] },
  do:[
    {type:'sort', q:'Chaim\'s Kite', bins:['Beginning','Middle','End'], cards:[['flies his kite',0],['kite gets stuck',1],['Zaidy gets it down',2],['kite comes down',2]], say:'Is this the beginning, the middle, or the end?', how:'Beginning: how it starts. Middle: the problem. End: how the problem is solved.'},
    {type:'tiles', w:['spills','gets towel','wipes up'], hear:'At supper, Avi spilled his juice. He ran to get a towel. Then he wiped it all up, and Mommy smiled.', q:'Avi\'s Spill', say:'Listen. Put Avi\'s story in order.', how:'Beginning: he spilled the juice. Middle: he got a towel. End: he wiped it up.'}],
  your:[
    {type:'listen', hear:'Yossi fell off his bike. He got up and tried again. Now he can ride! What is the lesson?', o:['Try again','Bikes roll','Stay home'], a:'Try again', say:'Listen to the story. Tap the lesson.', how:'A lesson is what the story teaches us to do. Bikes roll is a fact. Yossi did not give up: try again.'},
    {type:'tiles', w:['lost hat','checks shul','asks Ima','found it'], hear:'Dovid lost his Shabbos hat. First he looked in shul. Then he asked Ima. At last he found it under his bed.', q:'Dovid and the Hat', say:'Listen. Put Dovid\'s story in order.', how:'Listen for First, Then, At last. The problem starts, he tries two ways, then it is solved.'},
    {type:'listen', hear:'Retell one: Mendy found his mitten. Retell two: Mendy found his mitten. Then he lost it. Then he looked in his room. Retell three: First Mendy lost his mitten. Then he looked in his room. At the end he found it in his coat. Which retell is best?', o:['one','two','three'], a:'three', say:'Mistake Detective: which retell is best?', how:'Retell one tells only the end. Retell two is mixed up. Retell three tells the beginning, middle and end, in order.'},

B['READ.PHON.L04.01']={ band:'B23', pic:'🧩', today:'Use prefixes and suffixes to read big words', why:'Big words are built from small parts. Know the parts and you know the word.',
  ready:[{q:'Un means...', o:['not','again','before'], a:'not'},{q:'Re means...', o:['again','not','full'], a:'again'}],
  bridge:'READ.VOC.L03.01', bridgeName:'Prefix Start',
  watch:{ q:'careless', m:{type:'tiles',w:['care','less']}, steps:[
    {t:'A big word: careless. I cover the end. I read the base word: care.', m:{type:'tiles',w:['care','less'],hi:[0]}},
    {t:'I uncover the end: less. A suffix goes at the end. Less means without. Careless means without care.', m:{type:'tiles',w:['care','less'],hi:[1]}},
    {t:'Ful means full of: careful means full of care. Ful and less are opposites!'},

  board:{ one:'Cover the parts, read the base, add the meanings back.', activity:'Word-part cards: boys build words from prefix, base and suffix cards and say the meaning.', mistakes:['Mixing up -ful and -less','Reading the base but forgetting the prefix','Thinking re or un is a prefix in every word (real, uncle)'] },

B['READ.COMP.L05.01']={ band:'E45', pic:'☂️', today:'Find the main idea and the details that prove it', why:'A letter, a flyer, a news page: the main idea tells you in one sentence what it is all about.',
  ready:[{q:'A page says owl, owls, owl. The topic is...', o:['owls','night','trees','eyes'], a:'owls'},{q:'A detail is...', o:['one small fact','the whole page','the title','a question'], a:'one small fact'}],
  bridge:'READ.COMP.L03.01', bridgeName:'Main Topic',
  watch:{ q:'A letter from camp', m:{type:'scene',e:'✉️',t:'Dear Ima, Every morning we swim in the lake. After lunch we learn Mishnayos with Rabbi Gold. At night we sing by the fire. Love, Eli'}, steps:[
    {t:'I read every sentence first. I notice: swim, learn, sing. Each one is a thing Eli does at camp.'},
    {t:'I ask: what do ALL of them talk about? So I think the main idea is: Camp keeps Eli busy and happy.'},
    {t:'I test it like an umbrella. Does it cover swimming? Yes. Learning? Yes. Singing? Yes. It fits.'},
    {t:'Too small: We swim in the lake. That is one raindrop, a detail. Too big: Camps are fun everywhere. That covers more than the letter.'},
    {t:'Same steps on any paragraph. Lights, horns, keepers: Lighthouses helped keep ships safe. Chairs, cups, a sign: Zevi got the room ready for the parents\' program. A sentence like "Pencils are made of wood too." in a recycling paragraph does not support it.'}], a:'Main idea = the umbrella. Details = the raindrops.' },
  oops:{ q:'Bees: guards, nurses, foragers. Main idea?', wrong:'Bees guard the hive.', right:'Every bee in a hive has a job.', why:'Guarding is one detail. The main idea covers all of them.' },
  ways:['think-aloud','umbrella test','too small, just right, too big','tap the reason','Mistake Detective'], done:'You can find the main idea and prove it with details!',
  board:{ one:'The main idea is the umbrella over every sentence: not too small, not too big.', activity:'Umbrella chart: write the main idea on an umbrella and the details as raindrops under it; test a too-big and a too-small idea.', mistakes:['Picking one detail as the main idea','Picking something too big','Keeping a sentence that does not support the main idea'] },
  do:[

  your:[

    {type:'sort', q:'Beavers cut trees, build dams and use mud.', bins:['Too small','Just right','Too big'], cards:[['Beavers cut trees',0],['Beavers are builders',1],['All animals work',2],['Beavers use mud',0]], say:'Is this main idea too small, just right, or too big?', how:'Too small fits one sentence. Too big goes past the paragraph. Just right covers every sentence.', why:{q:'Why is "All animals work" too big?', o:['The paragraph is only about beavers','It is too short','It is a question','It names beavers'], a:'The paragraph is only about beavers'}},

    {type:'sort', q:'Challenge: Dovid and the sukkah', bins:['Main idea','Detail','Off topic'], cards:[['The sukkah gets ready',0],['hung paper chains',1],['set the table',1],['his bike is blue',2]], say:'Challenge! Main idea, detail, or off topic?', how:'The main idea covers every detail. A sentence that does not fit under it is off topic.', why:{q:'Why is "his bike is blue" off topic?', o:['It is not about the sukkah','It is short','It is a color','It comes last'], a:'It is not about the sukkah'}}] };

B['READ.COMP.L05.02']={ band:'E45', pic:'🔗', today:'Find the order and the cause of events', why:'Knowing what happened first, and why, helps you understand any story or news report.',
  ready:[{q:'"First mix it. Then bake it." Which word shows order?', o:['Then','mix','bake','it'], a:'Then'},{q:'"It rained, so we stayed in." Why did we stay in?', o:['it rained','we were tired','it was late','school'], a:'it rained'}],
  bridge:'READ.COMP.L03.03', bridgeName:'Read to Learn',
  watch:{ q:'The late bus', m:{type:'scene',e:'🚌',t:'Snow fell all night, so the bus was late. Because the bus was late, Yehuda missed davening with his class. He joined the class after.'}, steps:[
    {t:'I look for clue words: so, because, as a result. They point to cause and effect.'},
    {t:'Snow fell, so the bus was late. The cause comes before so: snow. The effect: the bus was late.'},
    {t:'Because the bus was late, he missed davening. Now the bus is the cause. One effect can cause the next, like dominoes.'},
    {t:'For order, I ask what happened FIRST in time, not first in the sentence. Snow came first. Joining the class came last.'},
    {t:'Same steps anywhere. Why is a bike hard to pedal? The chain rusted. Why did a cat sit on the windowsill? The bird feeder was moved next to the window. What happened first? The main street was loud for years. Then the town built a bridge.'}], a:'Cause: the first domino. Effect: what it made happen.' },
  oops:{ q:'Snow fell, so the bus was late. The cause?', wrong:'The bus was late.', right:'Snow fell.', why:'The cause comes first and makes the rest happen. It sits before so.' },
  ways:['think-aloud','domino chain','order in time','tap the reason','Mistake Detective'], done:'You can find the order and the cause of events!',
  board:{ one:'Cause = the first domino (why). Effect = what it made happen. Order = time, not sentence order.', activity:'Line up real dominoes; each boy names a cause and an effect as they fall.', mistakes:['Swapping cause and effect','Taking the first sentence as what happened first','Missing the clue words so or because'] },
  do:[
    {type:'match', pairs:[['first','the start'],['because','a reason next'],['then','the next event'],['as a result','an effect next']], say:'Match each clue word to what it signals.', how:'Because points to a reason. As a result points to an effect. First and then show order.'},
    {type:'tiles', w:['snow','late bus','missed it'], hear:'Yehuda missed davening because the bus was late. The bus was late because snow fell all night.', q:'Time order', say:'Listen. What happened first in time?', how:'The sentences start at the end. Snow came first, then the late bus, then missing davening.'}],
  your:[
    {type:'sort', q:'Mordy\'s bat sat in the rain, so it cracked.', bins:['Cause','Effect'], cards:[['sat in the rain',0],['rain soaked it',0],['the bat cracked',1],['the wood split',1]], say:'Is it a cause, or an effect?', how:'Ask: which one happened first and made the other happen? That is the cause.', why:{q:'How do you tell the cause?', o:['It happened first and made it happen','It is longer','It is in the title','It is last'], a:'It happened first and made it happen'}},
    {type:'tiles', w:['made soup','Abba home','ate dinner'], hear:'The family ate dinner after Abba came home. Before Abba came home, Ima made soup.', q:'What came first?', say:'Listen. Put the events in time order.', how:'After and before tell the time order. The soup came first.'},
    {type:'listen', q:'Note home: no school Monday', hear:'Dear parents, the heat at the yeshiva broke. Because of this, there is no school on Monday. As a result, the Chumash test moves to Tuesday. What caused no school on Monday?', o:['heat','test','snow','bus'], a:'heat', say:'Listen to the note. Find the cause.', how:'The cause comes before because of this: the heat broke.', why:{q:'How do you know?', o:['It came before because of this','It is first','It is short','Tests are hard'], a:'It came before because of this'}},
    {type:'sort', q:'Shira\'s plant got no water, so it wilted.', bins:['The cause','Not the cause'], cards:[['no water for days',0],['the pot is red',1],['it was green',1],['on a table',1]], say:'Mistake Detective: is it the cause?', how:'The mistake is picking something true that did not make it happen. The text proves the cause: no water.', why:{q:'Why is "it was green" not a cause?', o:['Being green did not make it wilt','It is wrong','It is short','Plants are green'], a:'Being green did not make it wilt'}},
    {type:'listen', q:'Challenge: Yossi and the tooth', hear:'Yossi ate too much candy after Purim. As a result, he got a cavity. So Ima took him to the dentist. What caused the cavity?', o:['candy','Ima','teeth','Purim'], a:'candy', say:'Challenge! Find the first domino.', how:'As a result points to the effect: a cavity. The cause before it: too much candy.', why:{q:'Which clue word helped?', o:['as a result','after','took','so'], a:'as a result'}}] };

B['READ.COMP.L05.03']={ band:'E45', pic:'🧱', today:'Name how an article is built', why:'When you know how a text is built, you know where to find what you need.',
  ready:[{q:'"The chain rusted, so it squeaks." The cause is...', o:['the chain rusted','it squeaks','the bike','rain'], a:'the chain rusted'},{q:'Which word shows order?', o:['finally','happy','bike','loud'], a:'finally'}],
  bridge:'READ.COMP.L05.02', bridgeName:'Sequence and cause and effect',
  watch:{ q:'The leaky sink', m:{type:'scene',e:'🚰',t:'Our kitchen sink dripped all night. Nobody could sleep! So Abba found a fix: he put in a new washer. Now the sink is quiet.'}, steps:[
    {t:'I ask: what is this text doing? I notice a problem: the sink dripped. Thumbs down.'},
    {t:'I notice a fix: a new washer. Thumbs up! A problem, then a fix: problem and solution.'},
    {t:'Other builds: two things alike and different is compare and contrast (both, but, however). Steps in order is sequence (first, next, finally). Why it happened is cause and effect.'},
    {t:'I check the clue words, then I check what the WHOLE text does. One "so" does not make it cause and effect.'},
    {t:'Same steps anywhere. A noisy lunchroom fixed by a bell: the solution is a bell that means one minute of quiet. Bikes and scooters: A scooter is lighter, so it is easier to carry. That shows a difference.'}], a:'Leaky sink = problem and solution.' },
  oops:{ q:'The sink leaked, so Abba fixed it. Structure?', wrong:'cause and effect', right:'problem and solution', why:'It has a so, but the whole text is a problem and a fix.' },
  ways:['think-aloud','finger signals','sort by clue words','tap the reason','Mistake Detective'], done:'You can name how an article is built!',
  board:{ one:'Compare (both, but), problem/solution (a fix), sequence (first, next), cause/effect (because, so).', activity:'Finger signals: read short texts aloud; boys show 2 fingers, thumbs up, or 3 fingers.', mistakes:['Calling any text with "so" cause and effect','Missing the solution in a problem text','Mixing up alike and different sentences'] },
  do:[
    {type:'match', pairs:[['compare','both, but'],['problem + fix','one way to fix'],['sequence','first, next'],['cause + effect','because, so']], say:'Match each structure to its clue words.', how:'Two things: compare. A problem and a fix. Steps in order. Why it happened.'},
    {type:'sort', q:'Cats and dogs', bins:['Alike','Different'], cards:[['both are pets',0],['both have fur',0],['dogs bark',1],['cats climb trees',1]], say:'Does it show how they are alike, or different?', how:'Both means alike. A sentence about only one of them shows a difference.'}],
  your:[
    {type:'listen', q:'The muddy path', hear:'The path to the shul was muddy, and boots got dirty. So the boys laid down wooden boards. Now everyone walks in clean. What is the solution?', o:['wood','mud','boots','shul'], a:'wood', say:'Listen. Tap the solution.', how:'The problem is the mud. The fix is the wooden boards.', why:{q:'Why are the boards the solution?', o:['They fix the mud problem','They are wood','They come last','The boys like boards'], a:'They fix the mud problem'}},
    {type:'sort', q:'Trains and buses', bins:['Alike','Different'], cards:[['they carry people',0],['both have seats',0],['trains use rails',1],['a bus is smaller',1]], say:'Does it show how they are alike, or different?', how:'Alike is true of both. A difference is true of only one.', why:{q:'Why is "they carry people" alike?', o:['It is true of both','It has no both','It is short','It names trains'], a:'It is true of both'}},
    {type:'listen', q:'The full gutter', hear:'The gutter was full of leaves, so water spilled over. To fix it, Tatty cleaned out the gutter. Now the rain runs down the pipe. How is this text built?', o:['fix','both','steps','why'], a:'fix', say:'Mistake Detective: how is it built?', how:'There is a so, but the WHOLE text is a problem and a fix. fix = problem and solution, both = compare, steps = sequence, why = cause and effect.', why:{q:'What tells you it is not cause and effect?', o:['The whole text gives a fix','It is short','It has a pipe','It is sad'], a:'The whole text gives a fix'}},
    {type:'match', pairs:[['a recipe','steps'],['trains, planes','compare'],['lost keys, spare','problem, fix'],['storm, no power','cause, effect']], say:'Match each text to how it is built.', how:'Ask what the whole text does: steps, compare, fix a problem, or explain why.'},
    {type:'listen', q:'Challenge: shul newsletter', hear:'First, the shul roof leaked in the rain. So the gabbai called a roofer, who put on new shingles. Now the shul is dry. How is this text built?', o:['fix','steps','both','why'], a:'fix', say:'Challenge! How is this text built?', how:'First and so are traps. Ask what the whole text does: a problem, then a fix.', why:{q:'Why not steps?', o:['It tells a problem and a fix','It says first','It is short','It is about a shul'], a:'It tells a problem and a fix'}}] };

B['READ.LIT.L05.01']={ band:'E45', pic:'⛄', today:'Summarize a story in one or two sentences', why:'When someone asks what a story was about, a summary tells it short and clear.',
  ready:[{q:'A retell tells the beginning, middle and...', o:['end','title','author','price'], a:'end'},{q:'The problem in a story usually comes...', o:['after the start','in the title','on the cover','never'], a:'after the start'}],
  bridge:'READ.LIT.L03.01', bridgeName:'Retell It',
  watch:{ q:'The Race', m:{type:'scene',e:'🏃',t:'Dovid wanted to win the camp race. He wore his new blue sneakers. But halfway, he tripped and fell. So he got up and kept running. Then he finished, and everyone cheered.'}, steps:[
    {t:'I use five fingers. Somebody (thumb): Dovid. Wanted (pointer): to win the camp race.'},
    {t:'But (middle finger): he tripped and fell. That is the problem.'},
    {t:'So (ring finger): he got up and kept running. Then (pinky): he finished, and everyone cheered.'},
    {t:'I join them: Dovid wanted to win the race, but he fell, so he got up and finished. Small details, like the blue sneakers, stay out.'},
    {t:'Same steps on The First Snow: Yitzchak wanted to build a snowman, but Ima asked him to help shovel for Mr. Rubin. Summary: Yitzchak wanted to build a snowman but first helped shovel Mr. Rubin\'s walk. Mr. Rubin thanked him with cocoa, a hat and a carrot, and Yitzchak built the snowman in his yard.'}], a:'Somebody, Wanted, But, So, Then.' },
  oops:{ q:'The Race: what is the BUT?', wrong:'He wore blue sneakers', right:'he tripped and fell', why:'The But is the main problem that gets in the way, not a small detail.' },
  ways:['think-aloud','five-finger summary','keep or cut','tap the reason','Mistake Detective'], done:'You can summarize a story!',
  board:{ one:'Somebody, Wanted, But, So, Then: one finger each.', activity:'Five-finger summary: boys trace a hand and write one phrase on each finger for a story they know.', mistakes:['Retelling every detail instead of summarizing','Picking a small detail as the But','Starting with the setting instead of the character'] },
  do:[
    {type:'tiles', w:['Somebody','Wanted','But','So','Then'], q:'The five fingers', say:'Put the summary words in order, thumb to pinky.', how:'Thumb: Somebody. Pointer: Wanted. Then But, So, Then.'},
    {type:'match', q:'The Race', pairs:[['Somebody','Dovid'],['Wanted','to win'],['But','he fell'],['So','got up, ran']], say:'Match each finger to the race story.', how:'Somebody: the main character. Wanted: his goal. But: the problem. So: what he did.'}],
  your:[
    {type:'listen', q:'Ari and the lost key', hear:'Ari wanted to get into the house after school. He put down his blue bag. But he had lost his key. So he waited at Bubby\'s next door, with her cat on his lap, until Ima came home. Then Ima let him in. What did Ari WANT?', o:['get in','visit Bubby','pet a cat','nap'], a:'get in', say:'Listen. What did Ari want?', how:'Wanted is his goal: to get into the house. Losing the key is the But.', why:{q:'Why is the key not what he wanted?', o:['Losing the key is the problem','He hates keys','It comes first','It is the title'], a:'Losing the key is the problem'}},
    {type:'sort', q:'Ari and the lost key', bins:['In the summary','Leave it out'], cards:[['wanted to get in',0],['his bag was blue',1],['lost his key',0],['Bubby has a cat',1],['waited for Ima',0]], say:'Does this go in a short summary?', how:'Keep Somebody, Wanted, But, So, Then. Leave out small details.'},
