   How does he feel?), W = Write and say more. Then the story moves one at a time: set the scene, talking characters, show the feeling,
   time words, wrap the story.
   Cast: the Shabbos Street Club (docs/core-growth/F-map.md section 8, C23-map.md section 5): Avi Benhamou and his Saba, Naftali Rosen and
   his Zeidy (a watchmaker), Chaim Weiss, Dovid Katz, Shimon Abergel, Rabbi Feld, Mr. Benhamou (the corner grocery), Mr. Klein (mail).

  'WRIT.PARA.L04.08':{name:'Then, Later, Finally',
  teach:[

  practice:[
    {t:'order', q:'Put Saba’s trip in order.', tiles:['First, the family packed one small trunk.','Next, they climbed onto the big ship.','That night, a storm rocked the ship.','Finally, they saw the lights of the shore.'], h:'Follow the time words.'},

  teach:[
