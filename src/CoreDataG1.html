    'LANG.SENT.L03.02':{name:"Because, But, So", teach:[{"how": "Because tells WHY. Ask: why did it happen?", "q": "\"Moshe wore his boots because ___.\" Which ending tells why?", "o": ["it was snowing outside", "his feet stayed dry", "his feet got wet"]}, {"how": "But shows a change: something different or surprising comes next.", "q": "\"Moshe wore his boots, but ___.\" Which ending shows a change?", "o": ["his feet still got wet", "it was snowing outside", "his feet stayed dry"]}, {"how": "So tells the result: what happened next because of it.", "q": "\"Moshe wore his boots, so ___.\" Which ending tells the result?", "o": ["his feet stayed dry", "it was snowing outside", "his feet still got wet"]}], practice:[{"t": "pairs", "q": "Match each joining word to its job.", "pairs": [["because", "tells why"], ["but", "shows a change"], ["so", "tells the result"]], "h": "Because answers why. But turns. So tells what happened next."}, {"t": "sort", "q": "Eli took an umbrella. Sort each ending to the word that fits.", "bins": [{"id": "0", "label": "because"}, {"id": "1", "label": "but"}, {"id": "2", "label": "so"}], "items": [{"label": "it was raining", "bin": "0"}, {"label": "it never rained", "bin": "1"}, {"label": "he stayed dry", "bin": "2"}, {"label": "Ima reminded him", "bin": "0"}, {"label": "he left it on the bus", "bin": "1"}, {"label": "his coat stayed dry", "bin": "2"}], "h": "Why? because. A change? but. What happened next? so."}, {"t": "order", "q": "Build the sentence. The result comes after so.", "tiles": ["The bus was late,", "so", "we walked to school."], "h": "First the idea, then so, then what happened next."}, {"t": "spotall", "q": "Shimon smiled because... Tap every ending that tells why.", "cells": [{"label": "he found his lost siddur", "ok": true}, {"label": "his Zeidy came to visit", "ok": true}, {"label": "so everyone smiled back", "ok": false}, {"label": "but he was tired", "ok": false}], "h": "A why ending gives a reason. It does not start with s     'LANG.SENT.L03.03':{name:"Grow It", teach:[{"how": "A kernel sentence is the smallest sentence: who, and what he did. \"Eli ran.\"", "q": "Which is the kernel: the smallest whole sentence?", "o": ["Eli ran.", "Eli ran to the park after school.", "to the park"]}, {"how": "Grow it with WHEN: add a time. \"After school, Eli ran.\"", "q": "Which part tells WHEN?", "o": ["after supper", "to the park", "very fast"]}, {"how": "Grow it with WHERE: add a place. \"Eli ran to the park.\"", "q": "Which part tells WHERE?", "o": ["to the park", "after supper", "very fast"]}], practice:[{"t": "sort", "q": "Sort each sentence part.", "bins": [{"id": "0", "label": "Did what"}, {"id": "1", "label": "When"}, {"id": "2", "label": "Where"}], "items": [{"label": "baked challah", "bin": "0"}, {"label": "on Friday", "bin": "1"}, {"label": "in the kitchen", "bin": "2"}, {"label": "swept the porch", "bin": "0"}, {"label": "after Maariv", "bin": "1"}, {"label": "at the shul", "bin": "2"}], "h": "Did what is the action. When is a time. Where is a place."}, {"t": "order", "q": "Build the grown sentence: when, who, did what, where.", "tiles": ["On Sunday,", "Dovid", "rode his bike", "to the park."], "h": "Start with the time, then who, then the action, then the place."}, {"t": "pairs", "q": "Match each part to its question.", "pairs": [["in the morning", "when"], ["at the shul", "where"], ["Chaim", "who"], ["sang a song", "did what"]], "h": "Ask: is it a time, a place, a person, or an action?"}, {"t": "spotall", "q": "Tap every part that tells WHEN.", "cells": [{"label": "after lunch", "ok": true}, {"label": "on Shabbos", "ok": true}, {"label": "at the lake", "ok": false}, {"label": "under the table", "ok": false}], "h": "A when part is a time: a day, a meal, a part of the day."}, {"t": "sort", "q": "Mistake Detective: did the sentence keep its kernel?", "bins": [{"id": "0", "label": "Grown right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "Yesterday, Shimon swam in the lake.",     'LANG.SENT.L03.04':{name:"Switch It Around", teach:[{"how": "A when part can move to the front. Then put a comma after it.", "q": "\"We ate supper after Maariv.\" Move the when part to the front.", "o": ["After Maariv, we ate supper.", "We after Maariv ate supper.", "After we ate supper Maariv."]}, {"how": "When the when part comes first, the comma goes right after the when part.", "q": "Which one has the comma in the right place?", "o": ["On Sunday, we went fishing.", "On, Sunday we went fishing.", "On Sunday we, went fishing."]}, {"how": "Moving a part can change the start, but it must not change the meaning.", "q": "Which sentence means the same as \"Chaim fed the fish at night\"?", "o": ["At night, Chaim fed the fish.", "At night, the fish fed Chaim.", "Chaim at night."]}], practice:[{"t": "order", "q": "Switch it: put the when part first.", "tiles": ["After Shacharis,", "the boys", "ate breakfast."], "h": "The time goes first. Then who, then what they did."}, {"t": "sort", "q": "Mistake Detective: is the comma in the right place?", "bins": [{"id": "0", "label": "Comma right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "In the morning, I davened.", "bin": "0"}, {"label": "In the morning I, davened.", "bin": "1"}, {"label": "After lunch, we played.", "bin": "0"}, {"label": "After, lunch we played.", "bin": "1"}], "h": "The comma goes right after the whole when part."}, {"t": "pairs", "q": "Match each sentence to its switched twin.", "pairs": [["We swam after lunch.", "After lunch, we swam."], ["Eli slept during the trip.", "During the trip, Eli slept."], ["I read before bed.", "Before bed, I read."]], "h": "Find the when part. Move it to the front. Add a comma."}, {"t": "spotall", "q": "Tap every sentence that is switched the right way.", "cells": [{"label": "At noon, the bell rang.", "ok": true}, {"label": "On Friday, we baked.", "ok": true}, {"label": "We baked, on Friday.", "ok": false}, {"label": "At, noon the bell rang.", "ok": false}], "h": ake"}], "items": [{"label": "\"The dog barked.\" is simple", "bin": "0"}, {"label": "\"The dog barked, so I woke up.\" is simple", "bin": "1"}, {"label": "\"If it snows, we sled.\" is complex", "bin": "0"}, {"label": "\"If it snows, we sled.\" is compound", "bin": "1"}], "h": "Look for the joining word first."}, {"t": "spotall", "q": "Tap every complex sentence.", "cells": [{"label": "After we ate, we benched.", "ok": true}, {"label": "If you knock, I will open.", "ok": true}, {"label": "We ate, and we benched.", "ok": false}, {"label": "We ate.", "ok": false}], "h": "Complex has a part with when, if, after or because."}], check:[{"q": "\"The sun set, and the stars came out.\" What kind of sentence is it?", "o": ["compound", "simple", "complex"]}, {"q": "\"Because it was late, we went home.\" What kind of sentence is it?", "o": ["complex", "simple", "compound"]}, {"q": "\"Yaakov fixed his bike.\" What kind of sentence is it?", "o": ["simple", "compound", "complex"]}], re:[{"q": "Which word makes a compound sentence?", "o": ["but", "because", "when"], "h": "And, but, so join two whole thoughts."}, {"q": "Which word starts a complex sentence part?", "o": ["if", "and", "so"], "h": "When, if, because, after."}, {"q": "\"Shimon read, and Eli drew.\" What kind?", "o": ["compound", "simple", "complex"], "h": "Two thoughts joined with and."}]},

    'LANG.SENT.L04.03':{name:"Fix the Run-On", teach:[{"how": "A run-on smashes two whole thoughts together with no stop: \"The bell rang we ran out.\"", "q": "Which is a run-on?", "o": ["The bell rang we ran out.", "The bell rang. We ran out.", "The bell rang, so we ran out."]}, {"how": "Fix 1: split it with a period, then start the next sentence with a capital.", "q": "Which fixes the run-on by splitting it?", "o": ["The bell rang. We ran out.", "The bell rang we. Ran out.", "The bell. Rang we ran out."]}, {"how": "Fix 2: join it with a comma and and, but or so. A comma alone is not enough.", "q": "Which fixes the run-on by joining it?", "o": ["The bell rang, so we ran out.", "The bell rang, we ran out.", "The bell rang so, we ran out."]}], practice:[{"t": "sort", "q": "Sort: run-on or correct?", "bins": [{"id": "0", "label": "Run-on"}, {"id": "1", "label": "Correct"}], "items": [{"label": "I lost my hat I found it.", "bin": "0"}, {"label": "I lost my hat, but I found it.", "bin": "1"}, {"label": "Eli ran he was late.", "bin": "0"}, {"label": "Eli ran. He was late.", "bin": "1"}], "h": "Read it aloud. Do two thoughts crash together?"}, {"t": "order", "q": "Fix the run-on \"The soup was hot I waited\" by joining it.", "tiles": ["The soup was hot,", "so", "I waited."], "h": "First thought, comma, joining word, second thought."}, {"t": "pairs", "q": "Match each run-on to its fix.", "pairs": [["The dog barked we woke up.", "The dog barked, so we woke up."], ["Moshe sang Avi clapped.", "Moshe sang, and Avi clapped."], ["It was late I was not tired.", "It was late, but I was not tired."]], "h": "Pick the joining word that shows how the thoughts connect."}, {"t": "sort", "q": "Mistake Detective: is the run-on really fixed?", "bins": [{"id": "0", "label": "Fixed right"}, {"id": "1", "label": "Still a mistake"}], "items": [{"label": "We ate. Then we benched.", "bin": "0"}, {"label": "We ate, then we benched.", "bin": "1"}, {"label": "It snowed, so school closed.", "bin": "     'LANG.SENT.L04.04':{name:"Combine Two", teach:[{"how": "Two short sentences about the same thing can become one strong sentence: say the part that repeats only once.", "q": "Which combines \"The dog is big. The dog is friendly.\"?", "o": ["The dog is big and friendly.", "The dog is big. Friendly.", "The big dog is. Friendly."]}, {"how": "Same doer, two actions? Join the actions: \"Eli swept and mopped.\"", "q": "Which combines \"Eli swept. Eli mopped.\"?", "o": ["Eli swept and mopped.", "Eli swept Eli mopped.", "Swept and mopped Eli."]}, {"how": "A describing word can move in front: \"The cake was warm. We ate it.\" becomes \"We ate the warm cake.\"", "q": "Which combines \"The cake was warm. We ate the cake.\"?", "o": ["We ate the warm cake.", "We ate the cake warm was.", "The cake was warm we ate the cake."]}], practice:[{"t": "pairs", "q": "Match the two sentences to the combined one.", "pairs": [["The hat is red. The hat is new.", "The hat is red and new."], ["Avi ran. Avi jumped.", "Avi ran and jumped."], ["The box was heavy. Dovid lifted the box.", "Dovid lifted the heavy box."]], "h": "Find what repeats. Say it only once."}, {"t": "order", "q": "Combine: \"Shimon washed the dishes. Shimon dried the dishes.\"", "tiles": ["Shimon", "washed", "and", "dried the dishes."], "h": "Same doer, two actions: join the actions with and."}, {"t": "sort", "q": "Mistake Detective: combined well, or a mistake?", "bins": [{"id": "0", "label": "Combined well"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "The soup was hot and tasty.", "bin": "0"}, {"label": "The soup was hot the soup was tasty.", "bin": "1"}, {"label": "Moshe read and wrote.", "bin": "0"}, {"label": "Moshe read and Moshe and wrote.", "bin": "1"}], "h": "A good combine says the repeated part only once."}, {"t": "spotall", "q": "\"The dog is big. The dog is friendly.\" Tap the words that repeat.", "cells": [{"label": "the dog", "ok": true}, {"label": "is", "ok": true}, {"label": "big", "ok": false}, {"label": "friendly", "ok": false}], "h": "The repeating words are said only once in the combined sentence."}, {"t": "order", "q": "Combine: \"The challah was warm. We ate the challah.\"", "tiles": ["We ate", "the warm", "challah."], "h": "Move the describing word in front of the thing."}, {"t": "sort", "q": "How will you combine each pair?", "bins": [{"id": "0", "label": "Join the actions"}, {"id": "1", "label": "Join the describers"}], "items": [{"label": "Eli sang. Eli clapped.", "bin": "0"}, {"label": "The lake is cold. The lake is deep.", "bin": "1"}, {"label": "Avi slipped. Avi fell.", "bin": "0"}, {"label": "The book is old. The book is long.", "bin": "1"}], "h": "Two actions? Join actions. Two describing words? Join describers."}], check:[{"q": "How do you combine \"The puppy is small. The puppy is fluffy.\"?", "o": ["join the describers", "join the actions", "make two sentences"]}, {"q": "How do you combine \"Naftali swam. Naftali dove.\"?", "o": ["join the actions", "join the describers", "make two sentences"]}, {"q": "When you combine two sentences well, what do you say only once?", "o": ["the part that repeats", "every word", "the last word"]}], re:[{"q": "Which combines \"The road was icy. We drove slowly on the road.\"?", "o": ["We drove slowly on the icy road.", "The road was icy we drove.", "We drove icy slowly."], "h": "Move the describer in front of road."}, {"q": "Which combines \"Chaim hopped. Chaim skipped.\"?", "o": ["Chaim hopped and skipped.", "Chaim hopped Chaim skipped.", "Hopped Chaim skipped."], "h": "Same doer: join the actions."}, {"q": "\"The tea is hot. The tea is sweet.\" What repeats?", "o": ["the tea is", "hot", "sweet"], "h": "Say it once."}]},
    'LANG.SENT.L05.01':{name:"Fragment or Sentence?", teach:[{"how": "A complete sentence has a subject (who or what) and a predicate (what it does or is), and it is a complete thought.", "q": "Which is a complete sentence?", "o": ["The old bridge creaked in the wind.", "The old bridge in the wind.", "Creaked in the wind all night."]}, {"how": "A fragment is missing a subject, a predicate, or the rest of the thought. Ask: who did it? What did he do? Is the thought finished?", "q": "\"Ran across the field.\" What is missing?", "o": ["the subject: who ran", "the end mark", "nothing"]}, {"how": "A part that starts with because, when or if is a fragment by itself. Fix it by joining it to a complete sentence.", "q": "Which fixes the fragment \"Because the bus was late.\"?", "o": ["We missed Shacharis because the bus was late.", "Because the bus. Was late.", "Because the bus was late, and."]}], practice:[{"t": "sort", "q": "Sort each one.", "bins": [{"id": "0", "label": "Complete sentence"}, {"id": "1", "label": "Fragment"}], "items": [{"label": "Yehuda found a clue.", "bin": "0"}, {"label": "Found a clue in the attic.", "bin": "1"}, {"label": "The map was torn.", "bin": "0"}, {"label": "When the map tore.", "bin": "1"}, {"label": "Avrumi drew a map.", "bin": "0"}, {"label": "The map with the red X.", "bin": "1"}], "h": "Ask: who or what? What does it do? Is the thought finished?"}, {"t": "pairs", "q": "Match each fragment to what it is missing.", "pairs": [["Ran to the bakery.", "missing a subject"], ["The warm rugelach.", "missing a predicate"], ["Because it was Erev Shabbos.", "thought not finished"]], "h": "Check for who, for an action, and for a finished thought."}, {"t": "order", "q": "Fix the fragment \"Because it was Erev Shabbos\" by joining it.", "tiles": ["Tzvi Hirsch ran", "to the bakery", "because it was Erev Shabbos."], "h": "Put the complete sentence first, then the because part."}, {"t": "sort", "q": "Mistake Detective: is the fragment really fixed?", "bins": [{"id": "0", "label": "Fixed"}, {"id": "1", "label": "Still a fragment"}], "items": [{"label": "Dovid built a robot.", "bin": "0"}, {"label": "Built a robot in the basement.", "bin": "1"}, {"label": "When the robot moved, we cheered.", "bin": "0"}, {"label": "When the robot moved.", "bin": "1"}], "h": "A fixed sentence has who, an action, and a finished thought."}, {"t": "spotall", "q": "Tap every complete sentence.", "cells": [{"label": "Binyamin moved his knight.", "ok": true}, {"label": "After the long game.", "ok": false}, {"label": "Zeidy smiled.", "ok": true}, {"label": "Moving the knight forward.", "ok": false}], "h": "Each one needs who, an action, and a finished thought."}, {"t": "pairs", "q": "Match each word to its meaning.", "pairs": [["subject", "who or what the sentence is about"], ["predicate", "what the subject does or is"], ["fragment", "a piece that is not a complete sentence"]], "h": "Subject is who. Predicate is what he does."}], check:[{"q": "\"Under the old bridge near the river.\" What is it?", "o": ["a fragment", "a complete sentence", "a question"]}, {"q": "\"Ate the whole challah.\" What is missing?", "o": ["the subject: who", "the predicate: what he did", "nothing"]}, {"q": "\"If it rains on Sunday.\" Why is it a fragment?", "o": ["the thought is not finished", "it has no capital", "it is too short"]}], re:[{"q": "Which is a complete sentence?", "o": ["Rabbi Feldman asked a question.", "Asked a hard question.", "The question about the map."], "h": "Look for who and an action."}, {"q": "\"The tall boy with the notebook.\" What is missing?", "o": ["the predicate: what he did", "the subject: who", "nothing"], "h": "There is a who, but no action."}, {"q": "\"When the bell rang.\" How do you fix it?", "o": ["join it to a complete sentence", "add a capital", "add an exclamation mark"], "h": "A when part needs a complete sentence with it."}]},
    'LANG.SENT.L05.02':{name:"Who, Which, That", teach:[{"how": "Who, which and that can join two sentences about the same thing. Who is for people.", "q": "Combine: \"I met a man. The man fixes clocks.\"", "o": ["I met a man who fixes clocks.", "I met a man which fixes clocks.", "I met a man, the man fixes clocks."]}, {"how": "Which is for things and animals: it is a thing, not a person. Which usually comes after a comma when it adds extra information.", "q": "Combine: \"We visited the lighthouse. The lighthouse is very old.\"", "o": ["We visited the lighthouse, which is very old.", "We visited the lighthouse, who is very old.", "We visited the lighthouse it is very old."]}, {"how": "That is for things you need to point out: \"the map that Zeidy found\" (not the other maps).", "q": "Which word fits? \"This is the map ___ Zeidy found in the attic.\"", "o": ["that", "who", "what"]}], practice:[{"t": "sort", "q": "Sort each phrase to the word that fits.", "bins": [{"id": "0", "label": "who"}, {"id": "1", "label": "which"}, {"id": "2", "label": "that"}], "items": [{"label": "a rebbe ___ loves questions", "bin": "0"}, {"label": "the bakery, ___ opens at six,", "bin": "1"}, {"label": "the key ___ opens the box", "bin": "2"}, {"label": "a boy ___ draws maps", "bin": "0"}, {"label": "our shul, ___ is on Glen Avenue,", "bin": "1"}, {"label": "the book ___ I borrowed", "bin": "2"}], "h": "Who: people. Which with a comma: extra information about a thing. That: points out which thing."}, {"t": "order", "q": "Combine: \"Avrumi has a cousin. The cousin lives in Eretz Yisroel.\"", "tiles": ["Avrumi has a cousin", "who", "lives in Eretz Yisroel."], "h": "Keep the first sentence. Replace the repeated person with who."}, {"t": "pairs", "q": "Match each pair to its combined sentence.", "pairs": [["I know a boy. The boy plays chess.", "I know a boy who plays chess."], ["We saw the lake. The lake was frozen.", "We saw the lake, which was frozen."], ["Here is the coat. I lost the coat.", "Here is the coat that I lost."]], "h": "Find the repeated person or thing. Swap it for who, which or that."}, {"t": "sort", "q": "Mistake Detective: is the joining word right?", "bins": [{"id": "0", "label": "Right word"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "the man who fixes clocks", "bin": "0"}, {"label": "the man which fixes clocks", "bin": "1"}, {"label": "the robot that Dovid built", "bin": "0"}, {"label": "the robot who Dovid built", "bin": "1"}], "h": "People take who. Things take which or that."}, {"t": "spotall", "q": "Tap every noun that would take who.", "cells": [{"label": "the sofer", "ok": true}, {"label": "Rabbi Feldman", "ok": true}, {"label": "the lighthouse", "ok": false}, {"label": "the chess set", "ok": false}], "h": "Who is only for people."}, {"t": "order", "q": "Combine: \"The storm knocked down a tree. The storm lasted all night.\"", "tiles": ["The storm,", "which", "lasted all night,", "knocked down a tree."], "h": "Put the extra fact right after the storm, between commas."}], check:[{"q": "\"Zeidy has a friend ___ teaches Gemara.\" Which word fits?", "o": ["who", "which", "what"]}, {"q": "Why do we use which, not who, in \"the oven, which was hot\"?", "o": ["it is a thing, not a person", "which is always first", "it is a question"]}, {"q": "\"Tzvi Hirsch dropped the tray ___ held the challos.\" Which word fits?", "o": ["that", "who", "whom"]}], re:[{"q": "\"I have a neighbor ___ grows tomatoes.\" Which word fits?", "o": ["who", "which", "that"], "h": "A neighbor is a person."}, {"q": "Which is right?", "o": ["the bike that I fixed", "the bike who I fixed", "the bike whom I fixed"], "h": "Things take that or which."}, {"q": "Which word is for people?", "o": ["who", "which", "that"], "h": "Who is for people."}]},
    'LANG.SENT.L05.03':{name:"Add a Phrase", teach:[{"how": "A prepositional phrase starts with a word like in, on, under, after, with or across, and ends with a noun: \"across the street\".", "q": "Which is a prepositional phrase?", "o": ["across the street", "ran quickly", "the tall tree"]}, {"how": "A prepositional phrase adds where, when or how to a sentence: \"Dovid fixed the bike with a wrench.\"", "q": "\"Dovid fixed the bike with a wrench.\" What does \"with a wrench\" tell?", "o": ["how", "when", "who"]}, {"how": "Put the phrase next to what it tells about, so the meaning is clear.", "q": "Which sentence is clear?", "o": ["The boy with the red hat waved.", "The boy waved with the red hat.", "With the red hat the boy waved hat."]}], practice:[{"t": "spotall", "q": "Tap every prepositional phrase.", "cells": [{"label": "under the bridge", "ok": true}, {"label": "after Maariv", "ok": true}, {"label": "with a hammer", "ok": true}, {"label": "the old map", "ok": false}, {"label": "jumped high", "ok": false}], "h": "It starts with a word like under, after, with, and ends with a noun."}, {"t": "sort", "q": "Sort each phrase by what it tells.", "bins": [{"id": "0", "label": "Where"}, {"id": "1", "label": "When"}, {"id": "2", "label": "How"}], "items": [{"label": "in the attic", "bin": "0"}, {"label": "before Shabbos", "bin": "1"}, {"label": "with a flashlight", "bin": "2"}, {"label": "behind the shul", "bin": "0"}, {"label": "during the storm", "bin": "1"}, {"label": "by hand", "bin": "2"}], "h": "Place? Time? The way it was done?"}, {"t": "order", "q": "Expand \"Yehuda searched the attic\" with HOW.", "tiles": ["Yehuda searched", "the attic", "with a flashlight."], "h": "Kernel first, then the how phrase."}, {"t": "sort", "q": "Mistake Detective: is each phrase in a clear place?", "bins": [{"id": "0", "label": "Clear"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "The dog in the yard barked.", "bin": "0"}, {"label": "The dog barked in the yard at the mailman.", "bin": "0"}, {"label": "I saw a fish on my bike.", "bin": "1"}, {"label": "He found a coin with a magnet in the sand.", "bin": "1"}], "h": "Read it as a picture. Does the phrase sit next to what it tells about?"}, {"t": "pairs", "q": "Match each starting word to an ending that makes a phrase.", "pairs": [["in", "the attic"], ["after", "the storm"], ["with", "a wrench"]], "h": "Each phrase ends with a noun."}, {"t": "order", "q": "Expand \"The lights went out\" with WHEN, at the front.", "tiles": ["During the storm,", "the lights", "went out."], "h": "The when phrase first, a comma, then the kernel."}], check:[{"q": "\"The cat slept under the porch.\" What does \"under the porch\" tell?", "o": ["where", "when", "how"]}, {"q": "\"beside the window\" — what is it?", "o": ["a prepositional phrase", "a whole sentence", "a verb"]}, {"q": "\"Shimon fixed the clock with a tiny screwdriver.\" What does \"with a tiny screwdriver\" tell?", "o": ["how", "where", "when"]}], re:[{"q": "\"After lunch, we played chess.\" What does \"after lunch\" tell?", "o": ["when", "where", "how"], "h": "After lunch is a time."}, {"q": "Which is a prepositional phrase?", "o": ["with a smile", "smiled wide", "a big smile"], "h": "Starts with with, ends with a noun."}, {"q": "Which is clear?", "o": ["The boy with the map waved.", "The boy waved the map with.", "With map the boy waved the."], "h": "Keep the phrase next to what it describes."}]},
    'LANG.SENT.L06.01':{name:"Combine to One", teach:[{"how": "Way 1: join two whole sentences with a comma and a joining word: and, but, so.", "q": "Combine with a joining word: \"The lighthouse was dark. Reb Shimon lit the lamp.\"", "o": ["The lighthouse was dark, so Reb Shimon lit the lamp.", "The lighthouse was dark Reb Shimon lit the lamp.", "The lighthouse was dark, Reb Shimon lit the lamp."]}, {"how": "Way 2: make one sentence a starting part with when, because, although or after.", "q": "Combine with a starting part: \"The storm ended. We went outside.\"", "o": ["After the storm ended, we went outside.", "After the storm ended we, went outside.", "The storm ended after we went outside."]}, {"how": "Way 3: tuck a describing word or phrase into the other sentence: \"The boat was small. It rocked.\" becomes \"The small boat rocked.\"", "q": "Tuck it in: \"The boat was small. The boat rocked in the waves.\"", "o": ["The small boat rocked in the waves.", "The boat was small rocked in the waves.", "The boat rocked small in the waves."]}], practice:[{"t": "sort", "q": "Sort each combined sentence by the way it was combined.", "bins": [{"id": "0", "label": "Joining word"}, {"id": "1", "label": "Starting part"}, {"id": "2", "label": "Tuck it in"}], "items": [{"label": "The door creaked, but nobody came.", "bin": "0"}, {"label": "Although it was late, we kept reading.", "bin": "1"}, {"label": "The rusty key opened the box.", "bin": "2"}, {"label": "We knocked, and Zeidy answered.", "bin": "0"}, {"label": "When the tide rose, the boat floated.", "bin": "1"}, {"label": "The old map showed a path.", "bin": "2"}], "h": "Look for and, but, so; a when, because or although start; or a describer tucked in."}, {"t": "order", "q": "Combine: \"The waves were high. The boys stayed calm.\" Start with although.", "tiles": ["Although the waves were high,", "the boys", "stayed calm."], "h": "Although part first, a comma, then the rest."}, {"t": "pairs", "q": "Match each pair to its best combine.", "pairs": [["The rope was wet. It slipped.", "The wet rope slipped."], ["We were tired. We kept going.", "We were tired, but we kept going."], ["The sun rose. We set out.", "When the sun rose, we set out."]], "h": "Pick the one that says it once and keeps the meaning."}, {"t": "sort", "q": "Mistake Detective: combined well, or a mistake?", "bins": [{"id": "0", "label": "Combined well"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "The storm was loud, so we sang louder.", "bin": "0"}, {"label": "The storm was loud, we sang louder.", "bin": "1"}, {"label": "The tall lighthouse stood firm.", "bin": "0"}, {"label": "The lighthouse was tall stood firm.", "bin": "1"}], "h": "A comma alone cannot join. A tucked-in word must fit the grammar."}, {"t": "order", "q": "Tuck it in: \"The boys were brave. The boys rowed to shore.\"", "tiles": ["The", "brave", "boys", "rowed to shore."], "h": "Put the describer right before the noun."}, {"t": "spotall", "q": "Tap every word that starts a starting part (way 2).", "cells": [{"label": "although", "ok": true}, {"label": "because", "ok": true}, {"label": "when", "ok": true}, {"label": "and", "ok": false}, {"label": "so", "ok": false}], "h": "Starting-part words: when, because, although, after, if."}], check:[{"q": "\"Avrumi drew the map, and Dovid built the model.\" Which way was used?", "o": ["a joining word", "a starting part", "tuck it in"]}, {"q": "\"The heavy door creaked open.\" Which way was used?", "o": ["tuck it in", "a joining word", "a starting part"]}, {"q": "What is wrong with \"The kettle whistled, Bubby poured the tea\"?", "o": ["a comma alone cannot join two sentences", "it has no subject", "it needs a question mark"]}], re:[{"q": "\"Because the road was icy, we drove slowly.\" Which way?", "o": ["a starting part", "a joining word", "tuck it in"], "h": "It starts with because."}, {"q": "\"The night was cold. The night was long.\" Best combine?", "o": ["The night was cold and long.", "The night was cold, the night was long.", "Cold the night was long."], "h": "Say it once."}, {"q": "Which joining word shows a surprise?", "o": ["but", "so", "and"], "h": "But shows a change."}]},
    'LANG.SENT.L06.02':{name:"Appositive", teach:[{"how": "An appositive is a noun phrase that renames a noun right next to it: \"Rabbi Feldman, our rebbe, smiled.\"", "q": "In \"Zeidy Benaim, a sofer from Morocco, told a story,\" which part is the appositive?", "o": ["a sofer from Morocco", "Zeidy Benaim", "told a story"]}, {"how": "Commas go on both sides of an appositive in the middle of a sentence, like a pair of hands holding it.", "q": "Which has the commas right?", "o": ["Binyamin, the chess champion, bowed.", "Binyamin the chess champion, bowed.", "Binyamin, the chess champion bowed."]}, {"how": "Use an appositive to combine: \"Avrumi drew the map. Avrumi is a careful artist.\" becomes \"Avrumi, a careful artist, drew the map.\"", "q": "Combine with an appositive: \"Mr. Halpern judged the fair. Mr. Halpern is our science teacher.\"", "o": ["Mr. Halpern, our science teacher, judged the fair.", "Mr. Halpern judged the fair, he is our science teacher.", "Our science teacher judged Mr. Halpern."]}], practice:[{"t": "spotall", "q": "\"Avrumi, the oldest of seven, helped his Abba, a sofer.\" Tap every appositive.", "cells": [{"label": "the oldest of seven", "ok": true}, {"label": "a sofer", "ok": true}, {"label": "helped his Abba", "ok": false}, {"label": "Avrumi", "ok": false}], "h": "An appositive is a noun phrase that renames the noun next to it."}, {"t": "order", "q": "Combine: \"Dovid fixed the radio. Dovid is a boy who loves gadgets.\"", "tiles": ["Dovid,", "a boy who loves gadgets,", "fixed the radio."], "h": "Name, comma, appositive, comma, the rest."}, {"t": "sort", "q": "Mistake Detective: are both commas there?", "bins": [{"id": "0", "label": "Commas right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "Tzvi Hirsch, the baker's son, carried the tray.", "bin": "0"}, {"label": "Tzvi Hirsch the baker's son, carried the tray.", "bin": "1"}, {"label": "Our shul, the oldest on the street, has a garden.", "bin": "0"}, {"label": "Our shul, the oldest on the street has a garden.", "bin": "1"}], "h": "An appositive in the middle needs a comma on each side."}, {"t": "pairs", "q": "Match each name to an appositive that renames him.", "pairs": [["Yehuda, ___, solved the mystery.", "the class detective"], ["Binyamin, ___, won the match.", "the chess champion"], ["Zeidy Yusupov, ___, told a story.", "Binyamin's grandfather"]], "h": "The appositive tells who he is."}, {"t": "sort", "q": "Is each one a noun phrase that could rename someone or something?", "bins": [{"id": "0", "label": "Appositive"}, {"id": "1", "label": "Not an appositive"}], "items": [{"label": "the youngest boy", "bin": "0"}, {"label": "a kosher bakery", "bin": "0"}, {"label": "jumped up", "bin": "1"}, {"label": "because it rained", "bin": "1"}], "h": "An appositive is a noun phrase, not an action or a because part."}, {"t": "order", "q": "Combine: \"The lighthouse guided the ships. The lighthouse was a tall white tower.\"", "tiles": ["The lighthouse,", "a tall white tower,", "guided the ships."], "h": "Thing, comma, appositive, comma, the rest."}], check:[{"q": "In \"Shabbos at the lighthouse, a stormy night, was one he would never forget,\" what is \"a stormy night\"?", "o": ["an appositive", "the subject", "a prepositional phrase"]}, {"q": "What does an appositive do?", "o": ["renames a noun right next to it", "shows an action", "asks a question"]}, {"q": "Which has the commas right?", "o": ["Mr. Katz, our neighbor, fixed the fence.", "Mr. Katz our neighbor, fixed the fence.", "Mr. Katz, our neighbor fixed the fence."]}], re:[{"q": "Which has the commas right?", "o": ["Our rebbe, Rabbi Feldman, smiled.", "Our rebbe Rabbi Feldman, smiled.", "Our rebbe, Rabbi Feldman smiled."], "h": "Both sides."}, {"q": "Which is an appositive in \"Eli, the new boy, waved\"?", "o": ["the new boy", "Eli", "waved"], "h": "It renames Eli."}, {"q": "Which combines with an appositive?", "o": ["Mendy, my cousin, visited.", "Mendy visited, my cousin.", "Mendy my cousin visited."], "h": "Name, comma, appositive, comma."}]},
    'LANG.SENT.L06.03':{name:"Cut It Down", teach:[{"how": "Wordy writing uses many words to say a little. Cut words that repeat or say nothing.", "q": "Which is the tighter sentence?", "o": ["Tzvi Hirsch ran fast.", "Tzvi Hirsch ran in a way that was very fast.", "Tzvi Hirsch, he ran, and he ran fast."]}, {"how": "Cut empty starters like \"There is\", \"It is a fact that\", \"In my opinion I think\".", "q": "Cut it down: \"It is a fact that the lighthouse is old.\"", "o": ["The lighthouse is old.", "It is a fact the lighthouse.", "The fact is old."]}, {"how": "Swap a long phrase for one strong word: \"at this point in time\" becomes \"now\".", "q": "Swap it: \"due to the fact that\" becomes...", "o": ["because", "when", "although"]}], practice:[{"t": "pairs", "q": "Match each wordy phrase to one strong word.", "pairs": [["at this point in time", "now"], ["due to the fact that", "because"], ["in the event that", "if"], ["a large number of", "many"]], "h": "Say the same idea with fewer words."}, {"t": "sort", "q": "Sort: tight or wordy?", "bins": [{"id": "0", "label": "Tight"}, {"id": "1", "label": "Wordy"}], "items": [{"label": "We left early.", "bin": "0"}, {"label": "We left at an early time.", "bin": "1"}, {"label": "Binyamin won.", "bin": "0"}, {"label": "Binyamin was the one who won.", "bin": "1"}, {"label": "Many boys came.", "bin": "0"}, {"label": "A large number of boys came.", "bin": "1"}], "h": "Look for extra words that say nothing new."}, {"t": "order", "q": "Cut it down: \"Avrumi drew a map, and the map was careful.\"", "tiles": ["Avrumi", "drew", "a careful map."], "h": "Say map once. Tuck careful in front of map."}, {"t": "sort", "q": "Mistake Detective: was it cut well, or did it lose meaning?", "bins": [{"id": "0", "label": "Cut well"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "The rugelach smelled sweet.", "bin": "0"}, {"label": "The rugelach smelled.", "bin": "1"}, {"label": "Dovid fixed the old radio.", "bin": "0"}, {"label": "Dovid fixed.", "bin": "1"}], "h": "Cut extra words, never the meaning."}, {"t": "spotall", "q": "Tap every empty phrase you could cut.", "cells": [{"label": "In my opinion I think", "ok": true}, {"label": "It is a fact that", "ok": true}, {"label": "really very", "ok": true}, {"label": "the map", "ok": false}, {"label": "found", "ok": false}], "h": "Empty words add length, not meaning."}, {"t": "order", "q": "Cut it down: \"Due to the fact that it rained, we stayed in.\"", "tiles": ["Because it rained,", "we stayed in."], "h": "Swap \"due to the fact that\" for one word."}], check:[{"q": "\"Shimon came to shul at a late hour.\" Which tight version keeps the meaning?", "o": ["Shimon came to shul late.", "Shimon came.", "Shimon came to shul at an hour."]}, {"q": "What should you cut to make writing tight?", "o": ["words that repeat or say nothing", "every describing word", "the subject"]}, {"q": "\"Bubby baked a honey cake.\" A boy cuts it to \"Bubby baked.\" What went wrong?", "o": ["it cut the meaning", "it is still too wordy", "nothing"]}], re:[{"q": "Which is tighter?", "o": ["Eli sang.", "Eli was singing a song that he sang.", "There was singing by Eli."], "h": "Fewer words, same idea."}, {"q": "\"In the event that it snows\" can become...", "o": ["if it snows", "because it snows", "now it snows"], "h": "In the event that = if."}, {"q": "Cut \"It is a fact that\" from \"It is a fact that bees make honey.\"", "o": ["Bees make honey.", "Fact bees honey.", "It is bees."], "h": "Keep the meaning."}]}

  BITE['LANG.SENT.L03.02'] = {"band": "B23", "pic": "🔗", "today": "Finish one idea with because, but or so", "why": "Three little words turn a short idea into a smart sentence.", "ready": [{"q": "Which is a whole sentence?", "o": ["The dog ran home.", "The dog", "ran home fast"], "a": "The dog ran home."}], "bridge": "LANG.SENT.L03.01", "bridgeName": "Whole Thought", "watch": {"q": "Moshe wore his boots", "m": {"type": "tiles", "w": ["Moshe wore his boots", "because", "it was snowing."], "hi": [1]}, "steps": [{"t": "Here is a short idea: Moshe wore his boots. I can grow it three ways."}, {"t": "Because tells WHY. Moshe wore his boots because it was snowing.", "m": {"type": "tiles", "w": ["Moshe wore his boots", "because", "it was snowing."], "hi": [1]}}, {"t": "But shows a change. Moshe wore his boots, but his feet still got wet.", "m": {"type": "tiles", "w": ["Moshe wore his boots,", "but", "his feet still got wet."], "hi": [1]}}, {"t": "So tells the result. Moshe wore his boots, so his feet stayed dry.", "m": {"type": "tiles", "w": ["Moshe wore his boots,", "so", "his feet stayed dry."], "hi": [1]}}, {"t": "Say it with me, and clap on each joining word!", "m": {"type": "chant", "lines": ["Because tells why!", "But shows a change!", "So tells what happens next!"]}}], "a": "Because = why. But = a change. So = the result."}, "oops": {"q": "\"We stayed inside ___ it was raining.\"", "wrong": "so", "right": "because", "why": "The rain is the reason. A reason needs because. So tells the result."}, "ways": ["worked example", "chant", "match", "sort", "build with tiles", "Mistake Detective"], "done": "You can grow one idea three ways: because, but and so!", "board": {"one": "Because = why. But = a change. So = the result.", "activity": "Write one short idea on the board. Boys finish it three ways, out loud, then in writing.", "mistakes": ["Using so for a reason", "Using because for a result", "Using but with no change"]}, "do": [{"type": "match", "pairs": [["because", "tells why"], ["but", "shows a change"], ["so", "tells the result"]], "say": "Match each word to its job.", "how": "Because answers why. But turns. So tells what happened next."}, {"type": "sort", "mis": true, "bins": ["Right word", "Mistake"], "cards": [["We ate soup because the day was cold", 0], ["We ate soup so the day was cold", 1], ["It rained, so we stayed in", 0], ["It rained because we stayed in", 1]], "say": "Mistake Detective! Is the joining word right?", "how": "Ask: is it a reason, a change, or a result?"}], "your": [{"type": "tiles", "w": ["The bus was late,", "so", "we walked."], "extra": ["because"], "say": "Build it. The result comes after so.", "how": "First the idea, then so, then what happened next."}, {"type": "sort", "q": "Eli took an umbrella...", "bins": ["because", "but", "so"], "cards": [["it was raining", 0], ["he stayed dry", 2], ["it never rained", 1], ["Ima reminded him", 0], ["he left it on the bus", 1], ["his coat stayed dry", 2]], "say": "Eli took an umbrella. Which word fits each ending?", "how": "Why? because. A change? but. What happened next? so."}, {"type": "match", "pairs": [["Akiva was tired, but", "he finished his work."], ["Akiva was tired, so", "he went to bed early."], ["Akiva was tired because", "he stayed up late."]], "say": "Match each start to the ending that fits.", "how": "Because gives a reason. But turns. So gives the result."}, {"type": "tiles", "w": ["Akiva was tired,", "but", "he finished his homework."], "extra": ["so"], "say": "Build it. Show a change with but.", "how": "The idea, then but, then the surprise."}, {"type": "sort", "bins": ["Tells why", "Tells the result"], "cards": [["because it was dark", 0], ["so we lit a lamp", 1], ["because he was thirsty", 0], ["so he drank water", 1]], "say": "Does the ending tell why, or the result?", "how": "Because starts a reason. So starts a result."}]};
  BITE['LANG.SENT.L03.03'] = {"band": "B23", "pic": "🌱", "today": "Grow a small sentence: add when and where", "why": "A bigger sentence paints a picture, so your reader can see it.", "ready": [{"q": "Which is a whole sentence?", "o": ["The cat slept.", "The cat", "on the bed"], "a": "The cat slept."}], "bridge": "LANG.SENT.L03.01", "bridgeName": "Whole Thought", "watch": {"q": "Eli ran.", "m": {"type": "tiles", "w": ["Eli", "ran."], "hi": [0, 1]}, "steps": [{"t": "Start with the kernel: who, and what he did. Eli ran.", "m": {"type": "tiles", "w": ["Eli", "ran."], "hi": [0, 1]}}, {"t": "Ask WHERE? To the park. Eli ran to the park.", "m": {"type": "tiles", "w": ["Eli", "ran", "to the park."], "hi": [2]}}, {"t": "Ask WHEN? After school. After school, Eli ran to the park.", "m": {"type": "tiles", "w": ["After school,", "Eli", "ran", "to the park."], "hi": [0]}}, {"t": "Check: the kernel is still there. Who? Eli. Did what? Ran."}, {"t": "Grow with me! Start small, then grow tall.", "m": {"type": "move", "t": "Crouch small: kernel! Stand up: when! Reach high: where!"}}], "a": "After school, Eli ran to the park."}, "oops": {"q": "Grow \"The boys sang.\"", "wrong": "At the siyum, loudly.", "right": "At the siyum, the boys sang loudly.", "why": "The new parts were added, but the kernel was lost. Keep who and what he did."}, "ways": ["worked example", "movement", "sort", "build with tiles", "Mistake Detective"], "done": "You can grow a small sentence with when and where!", "board": {"one": "Kernel first (who + did what), then grow it: when, where.", "activity": "Hold up a kernel card. Boys add a when card and a where card and read the new sentence.", "mistakes": ["Losing the kernel", "Mixing up when and where", "Adding parts that do not answer a question"]}, "do": [{"type": "sort", "bins": ["When", "Where"], "cards": [["after school", 0], ["to the park", 1], ["on Shabbos", 0], ["in the sukkah", 1]], "say": "Is it a time or a place? Sort it.", "how": "When is a time. Where is a place."}, {"type": "match", "mis": true, "pairs": [["Yesterday, Shimon swam.", "grown right"], ["Yesterday in the lake.", "mistake: no who and no action"], ["At night, slept.", "mistake: no who"]], "say": "Mistake Detective! Match each to what is wrong.", "how": "A grown sentence still needs who and what he did."}], "your": [{"type": "tiles", "w": ["On Sunday,", "Dovid", "rode his bike", "to the park."], "say": "Build it: when, who, did what, where.", "how": "Time first, then who, then the action, then the place."}, {"type": "sort", "bins": ["Did what", "When", "Where"], "cards": [["baked challah", 0], ["on Friday", 1], ["in the kitchen", 2], ["swept the porch", 0], ["after Maariv", 1], ["at the shul", 2]], "say": "Sort each part: did what, when, or where?", "how": "An action, a time, or a place?"}, {"type": "match", "pairs": [["in the morning", "when"], ["at the shul", "where"], ["Chaim", "who"]], "say": "Match each part to its question.", "how": "Is it a time, a place, or a person?"}, {"type": "tiles", "w": ["Akiva", "read a book", "in his room."], "extra": ["after"], "say": "Build it: who, did what, where.", "how": "Who first, then the action, then the place."}, {"type": "sort", "bins": ["Grown right", "Kernel lost"], "cards": [["At night, the baby slept.", 0], ["At night, slept in bed.", 1], ["The dog barked at the gate.", 0], ["Barked at the gate.", 1]], "say": "Did the sentence keep its kernel?", "how": "Look for who and what he did."}]};
  BITE['LANG.SENT.L03.04'] = {"band": "B23", "pic": "🔄", "today": "Move the when part to the front", "why": "Good writers start sentences in different ways, so their writing is fun to read.", "ready": [{"q": "\"Eli ran after school.\" Which part tells when?", "o": ["after school", "Eli", "ran"], "a": "after school"}], "bridge": "LANG.SENT.L03.03", "bridgeName": "Grow It", "watch": {"q": "We ate supper after Maariv.", "m": {"type": "tiles", "w": ["We ate supper", "after Maariv."], "hi": [1]}, "steps": [{"t": "Find the when part. When did we eat? After Maariv.", "m": {"type": "tiles", "w": ["We ate supper", "after Maariv."], "hi": [1]}}, {"t": "Lift it and move it to the front. Give it a capital letter.", "m": {"type": "tiles", "w": ["After Maariv", "we ate supper."], "hi": [0]}}, {"t": "Put a comma right after the when part. The comma is a little pause.", "m": {"type": "tiles", "w": ["After Maariv,", "we ate supper."], "hi": [0]}}, {"t": "Check the meaning. Who ate? We did. Same meaning, new start."}, {"t": "Say it with me, and pause where the comma goes!", "m": {"type": "chant", "lines": ["Find the when, lift it, move it,", "Comma pause, and that is how you do it!"]}}], "a": "After Maariv, we ate supper."}, "oops": {"q": "Switch \"We went fishing on Sunday.\"", "wrong": "on Sunday, We went fishing.", "right": "On Sunday, we went fishing.", "why": "The new first word gets the capital. We is not first now."}, "ways": ["worked example", "chant", "build with tiles", "sort", "match", "Mistake Detective"], "done": "You can start a sentence with the when part and put the comma right!", "board": {"one": "Find the when part, move it to the front, add a comma after it.", "activity": "Boys hold word cards in a line. The \"when\" boy walks to the front, and a \"comma\" boy stands after him.", "mistakes": ["Comma in the middle of the when part", "No comma at all", "Moving the wrong part and changing the meaning"]}, "do": [{"type": "tiles", "w": ["After Shacharis,", "the boys", "ate breakfast."], "say": "Switch it. Put the when part first.", "how": "Time first, then who, then what they did."}, {"type": "sort", "mis": true, "bins": ["Comma right", "Mistake"], "cards": [["In the morning, I davened.", 0], ["In the morning I, davened.", 1], ["After lunch, we played.", 0], ["After, lunch we played.", 1]], "say": "Mistake Detective! Is the comma in the right place?", "how": "The comma goes right after the whole when part."}], "your": [{"type": "match", "pairs": [["We swam after lunch.", "After lunch, we swam."], ["Eli slept on the trip.", "On the trip, Eli slept."], ["I read before bed.", "Before bed, I read."]], "say": "Match each sentence to its switched twin.", "how": "Find the when part. Move it. Add a comma."}, {"type": "tiles", "w": ["In the winter,", "the lake", "freezes."], "say": "Switch it. Start with the when part.", "how": "Time first, comma, then the rest."}, {"type": "sort", "bins": ["Same meaning", "Meaning changed"], "cards": [["Before supper, Dovid washed.", 0], ["Before Dovid, supper washed.", 1], ["In the yard, Moshe played.", 0], ["In Moshe, the yard played.", 1]], "say": "Does the switched sentence mean the same?", "how": "Only the when or where part moves."}, {"type": "tiles", "w": ["On Friday,", "we", "baked challah."], "say": "Switch it: We baked challah on Friday.", "how": "The day goes first, then a comma."}, {"type": "match", "pairs": [["Moshe learned before Maariv.", "Before Maariv, Moshe learned."], ["We sang at the siyum.", "At the siyum, we sang."], ["Eli napped after lunch.", "After lunch, Eli napped."]], "say": "Match each sentence to its switched twin.", "how": "Find the when part. Move it. Add a comma."}]};
  BITE['LANG.SENT.L04.01'] = {"band": "B23", "pic": "🧱", "today": "Tell simple, compound and complex sentences apart", "why": "Knowing the three kinds lets you build any sentence you need.", "ready": [{"q": "\"It rained, so we stayed in.\" Which word joins the two parts?", "o": ["so", "rained", "stayed"], "a": "so"}], "bridge": "WRIT.SENT.L04.01", "bridgeName": "Join It", "watch": {"q": "The rain fell.", "m": {"type": "tiles", "w": ["The rain fell."], "hi": [0]}, "steps": [{"t": "Simple: one complete thought. The rain fell.", "m": {"type": "tiles", "w": ["The rain fell."], "hi": [0]}}, {"t": "Compound: two complete thoughts, joined with a comma and and, but or so.", "m": {"type": "tiles", "w": ["The rain fell,", "so", "we went in."], "hi": [1]}}, {"t": "Complex: one part cannot stand alone. \"When the rain fell\" needs more.", "m": {"type": "tiles", "w": ["When the rain fell,", "we went in."], "hi": [0]}}, {"t": "My test: find the joining word. And, but, so means compound. When, because, if means complex."}, {"t": "Show me with your hands!", "m": {"type": "move", "t": "One finger: simple! Two hands together: compound! Hold on tight: complex!"}}], "a": "Simple = one thought. Compound = two, with and, but, so. Complex = a when, if or because part."}, "oops": {"q": "\"When the bell rang, we ran out.\"", "wrong": "compound, because it has a comma", "right": "complex: \"When the bell rang\" cannot stand alone", "why": "A comma does not make it compound. Look at the joining word."}, "ways": ["worked example", "movement", "sort", "build with tiles", "Mistake Detective"], "done": "You can tell simple, compound and complex sentences apart!", "board": {"one": "Find the joining word: and/but/so = compound; when/if/because = complex; none = simple.", "activity": "Boys stand with sentence strips: one strip is simple, two joined by a \"so\" card is compound, a \"when\" card makes it complex.", "mistakes": ["Calling every sentence with a comma compound", "Thinking a long sentence must be compound", "Missing the when or because at the start"]}, "do": [{"type": "sort", "bins": ["Simple", "Compound", "Complex"], "cards": [["Eli sang.", 0], ["Eli sang, and Avi clapped.", 1], ["When Eli sang, Avi clapped.", 2]], "say": "Sort each sentence by its kind.", "how": "Find the joining word first."}, {"type": "match", "mis": true, "pairs": [["\"If it snows, we sled.\"", "complex, not compound"], ["\"The bus came, but it was full.\"", "compound, not simple"], ["\"The dog barked.\"", "simple"]], "say": "Mistake Detective! Match each to its true kind.", "how": "A comma is not the clue. The joining word is."}], "your": [{"type": "tiles", "w": ["Moshe was hungry,", "so", "he made a sandwich."], "extra": ["when"], "say": "Build a compound sentence.", "how": "Thought, comma, joining word, thought."}, {"type": "sort", "bins": ["Compound", "Complex"], "cards": [["After we ate, we benched.", 1], ["We ate, and we benched.", 0], ["If you knock, I will open.", 1], ["I knocked, but nobody came.", 0]], "say": "Compound or complex? Sort it.", "how": "And, but, so: compound. After, if, when: complex."}, {"type": "tiles", "w": ["When the phone rang,", "Zeidy", "answered it."], "extra": ["and"], "say": "Build a complex sentence.", "how": "The when part first, a comma, then the rest."}, {"type": "match", "pairs": [["and, but, so", "compound"], ["when, because, if", "complex"], ["one thought", "simple"]], "say": "Match each clue to its kind.", "how": "The joining word tells the kind."}, {"type": "sort", "bins": ["Simple", "Not simple"], "cards": [["Naftali swept the floor.", 0], ["Naftali swept, and Eli mopped.", 1], ["The baby laughed.", 0], ["Because he was tired, he slept.", 1]], "say": "Is it simple: just one thought?", "how": "One who, one action, no joining word."}]};
  BITE['LANG.SENT.L04.02'] = {"band": "B23", "pic": "🧩", "today": "Join ideas with when, if and since", "why": "These words show how two ideas connect: time, maybe, or why.", "ready": [{"q": "Which is a whole sentence?", "o": ["We went home.", "after the game", "when it rained"], "a": "We went home."}], "bridge": "LANG.SENT.L04.01", "bridgeName": "Simple, Compound, Complex", "watch": {"q": "if it snows", "m": {"type": "tiles", "w": ["if it snows"], "hi": [0]}, "steps": [{"t": "Read \"if it snows.\" It leaves me waiting. What happens then?", "m": {"type": "tiles", "w": ["if it snows"], "hi": [0]}}, {"t": "It cannot stand alone. I join it to a whole thought: we will sled.", "m": {"type": "tiles", "w": ["If it snows,", "we will sled."], "hi": [1]}}, {"t": "The first part ends with a comma. If it snows, we will sled."}, {"t": "Each word means something. When is time. If is maybe. Since means because."}, {"t": "Chant it with me and tap the beat!", "m": {"type": "chant", "lines": ["When means the time,", "If means maybe,", "Since means because, so join them with me!"]}}], "a": "If it snows, we will sled."}, "oops": {"q": "\"Since it was cold.\"", "wrong": "a whole sentence", "right": "not whole: since it was cold, what happened?", "why": "A since part needs a whole thought joined to it."}, "ways": ["worked example", "chant", "match", "build with tiles", "sort", "Mistake Detective"], "done": "You can join ideas with when, if and since!", "board": {"one": "When/if/since/after/before parts cannot stand alone: join them to a whole thought with a comma.", "activity": "Half the class holds \"if\" cards, half holds whole thoughts. Pairs find a partner that makes sense and read it aloud.", "mistakes": ["Writing the when part alone with a period", "Forgetting the comma", "Using if when since (because) is meant"]}, "do": [{"type": "match", "pairs": [["when", "at that time"], ["if", "maybe, only then"], ["since", "because"]], "say": "Match each word to what it means.", "how": "Time, maybe, or why?"}, {"type": "sort", "mis": true, "bins": ["Whole sentence", "Mistake"], "cards": [["After we davened, we ate.", 0], ["After we davened.", 1], ["Since it was cold, I wore a coat.", 0], ["Since it was cold.", 1]], "say": "Mistake Detective! Is it a whole sentence?", "how": "A when or since part alone is not whole."}], "your": [{"type": "tiles", "w": ["If you finish early,", "you may", "read a book."], "say": "Build the sentence that starts with if.", "how": "If part, comma, then the rest."}, {"type": "sort", "bins": ["Can stand alone", "Needs more"], "cards": [["we went home", 0], ["after the game ended", 1], ["Dovid laughed", 0], ["when Zeidy told a joke", 1]], "say": "Can this part stand alone?", "how": "When, if, after or since at the start? It needs more."}, {"type": "match", "pairs": [["When the bell rang,", "we lined up."], ["If it rains,", "we will play inside."], ["Since he was thirsty,", "he drank water."]], "say": "Match each first part to its ending.", "how": "Read it together. Does it make sense?"}, {"type": "tiles", "w": ["Before Shabbos started,", "we", "lit the candles."], "extra": ["since"], "say": "Build the sentence that starts with before.", "how": "Before part, comma, then who and what."}, {"type": "sort", "bins": ["Time", "Maybe", "Because"], "cards": [["when the sun rose", 0], ["if we hurry", 1], ["since it was late", 2], ["when the bus came", 0]], "say": "What does each part tell?", "how": "When is time. If is maybe. Since is because."}]};
  BITE['LANG.SENT.L04.03'] = {"band": "B23", "pic": "🛑", "today": "Fix a run-on: split it or join it", "why": "A run-on makes your reader run out of breath. Fixing it makes your writing clear.", "ready": [{"q": "Which is a whole sentence?", "o": ["We ran out.", "ran out", "the bell"], "a": "We ran out."}], "bridge": "LANG.SENT.L04.01", "bridgeName": "Simple, Compound, Complex", "watch": {"q": "The bell rang we ran out.", "m": {"type": "tiles", "w": ["The bell rang", "we ran out."], "hi": [0, 1]}, "steps": [{"t": "Read it aloud. Two whole thoughts crash together: the bell rang, we ran out.", "m": {"type": "tiles", "w": ["The bell rang", "we ran out."], "hi": [0, 1]}}, {"t": "Fix 1, split it: a period, then a capital. The bell rang. We ran out.", "m": {"type": "tiles", "w": ["The bell rang.", "We ran out."], "hi": [0]}}, {"t": "Fix 2, join it: a comma plus and, but or so. The bell rang, so we ran out.", "m": {"type": "tiles", "w": ["The bell rang,", "so", "we ran out."], "hi": [1]}}, {"t": "Careful: a comma alone is not enough. \"The bell rang, we ran out\" is still wrong."}, {"t": "Show me with your hands!", "m": {"type": "move", "t": "Hands crash together: run-on! Hands apart: split! Hands hold: join!"}}], "a": "The bell rang. We ran out. Or: The bell rang, so we ran out."}, "oops": {"q": "Fix \"We won we cheered.\"", "wrong": "We won, we cheered.", "right": "We won, so we cheered.", "why": "A comma alone cannot join two whole thoughts. Add a joining word or use a period."}, "ways": ["read aloud", "movement", "sort", "build with tiles", "match", "Mistake Detective"], "done": "You can fix a run-on two ways: split it or join it!", "board": {"one": "Run-on = two thoughts crashing. Split with a period, or join with comma + and/but/so.", "activity": "Read run-ons aloud fast; the class shouts \"split!\" or \"join!\" and a boy fixes it on the board.", "mistakes": ["Fixing with a comma only", "Splitting in the wrong place", "Forgetting the capital after the period"]}, "do": [{"type": "sort", "bins": ["Run-on", "Correct"], "cards": [["I lost my hat I found it.", 0], ["I lost my hat, but I found it.", 1], ["Eli ran he was late.", 0], ["Eli ran. He was late.", 1]], "say": "Run-on or correct? Sort it.", "how": "Read it aloud. Do two thoughts crash?"}, {"type": "match", "mis": true, "pairs": [["We won, we cheered.", "mistake: comma alone"], ["We won, so we cheered.", "fixed: joined"], ["We won. We cheered.", "fixed: split"]], "say": "Mistake Detective! Match each to what it is.", "how": "A comma alone does not fix a run-on."}], "your": [{"type": "tiles", "w": ["The soup was hot,", "so", "I waited."], "extra": ["I"], "say": "Fix the run-on by joining it.", "how": "Thought, comma, joining word, thought."}, {"type": "sort", "bins": ["Fixed right", "Still wrong"], "cards": [["It snowed, so school closed.", 0], ["It snowed, school closed.", 1], ["We ate. Then we benched.", 0], ["We ate we benched.", 1]], "say": "Is the run-on really fixed?", "how": "Period, or comma plus and, but, so."}, {"type": "match", "pairs": [["The dog barked we woke up.", "The dog barked, so we woke up."], ["Moshe sang Avi clapped.", "Moshe sang, and Avi clapped."], ["It was late I was awake.", "It was late, but I was awake."]], "say": "Match each run-on to its fix.", "how": "Pick the word that shows how they connect."}, {"type": "tiles", "w": ["The game was fun.", "We", "played until dark."], "extra": ["fun we"], "say": "Fix it by splitting into two sentences.", "how": "Period after the first thought, capital on the second."}, {"type": "sort", "bins": ["Run-on", "Correct"], "cards": [["Zeidy called we were happy.", 0], ["Zeidy called. We were happy.", 1], ["The lights went out we lit candles.", 0], ["The lights went out, so we lit candles.", 1]], "say": "Run-on or correct?", "how": "Two thoughts with no stop? Run-on."}]};
  BITE['LANG.SENT.L04.04'] = {"band": "B23", "pic": "🪢", "today": "Combine two short sentences into one", "why": "Too many short sentences sound choppy. Combining makes writing smooth and strong.", "ready": [{"q": "\"Eli swept. Eli mopped.\" Who did both actions?", "o": ["Eli", "the floor", "Ima"], "a": "Eli"}], "bridge": "WRIT.SENT.L04.01", "bridgeName": "Join It", "watch": {"q": "The dog is big. The dog is friendly.", "m": {"type": "tiles", "w": ["The dog is big.", "The dog is friendly."], "hi": [0, 1]}, "steps": [{"t": "Two short sentences. Find what repeats: the dog is.", "m": {"type": "tiles", "w": ["The dog is big.", "The dog is friendly."], "hi": [0, 1]}}, {"t": "Say the repeating part only once, then join the new words with and.", "m": {"type": "tiles", "w": ["The dog is", "big", "and", "friendly."], "hi": [2]}}, {"t": "Same doer, two actions? Join the actions. Eli swept and mopped.", "m": {"type": "tiles", "w": ["Eli", "swept", "and", "mopped."], "hi": [2]}}, {"t": "A describing word can move in front: The cake was warm. We ate the cake. We ate the warm cake."}, {"t": "Say it with me, and snap your fingers!", "m": {"type": "chant", "lines": ["Find the twin, say it once,", "Join the rest, and that is that!"]}}], "a": "The dog is big and friendly."}, "oops": {"q": "Combine \"Moshe read. Moshe wrote.\"", "wrong": "Moshe read and Moshe and wrote.", "right": "Moshe read and wrote.", "why": "Say the repeating part, Moshe, only once."}, "ways": ["worked example", "chant", "match", "build with tiles", "sort", "Mistake Detective"], "done": "You can combine two short sentences into one strong one!", "board": {"one": "Find what repeats, say it once, join the rest with and (or move the describer in front).", "activity": "Two boys each hold a short sentence. A third boy holds \"and\" and stands between them while they drop the repeating words.", "mistakes": ["Repeating the doer", "Just gluing with no and", "Changing the meaning"]}, "do": [{"type": "match", "pairs": [["The hat is red. The hat is new.", "The hat is red and new."], ["Avi ran. Avi jumped.", "Avi ran and jumped."], ["The box was heavy. Dovid lifted it.", "Dovid lifted the heavy box."]], "say": "Match the pair to the combined sentence.", "how": "Find what repeats. Say it only once."}, {"type": "sort", "mis": true, "bins": ["Combined well", "Mistake"], "cards": [["The soup was hot and tasty.", 0], ["The soup was hot the soup was tasty.", 1], ["Moshe read and wrote.", 0], ["Moshe read and Moshe and wrote.", 1]], "say": "Mistake Detective! Combined well, or a mistake?", "how": "A good combine says the repeated part once."}], "your": [{"type": "tiles", "w": ["Shimon", "washed", "and", "dried the dishes."], "extra": ["Shimon"], "say": "Combine: Shimon washed. Shimon dried.", "how": "Same doer: join the two actions with and."}, {"type": "sort", "bins": ["Join the actions", "Join the describers"], "cards": [["Eli sang. Eli clapped.", 0], ["The lake is cold. The lake is deep.", 1], ["Avi slipped. Avi fell.", 0], ["The book is old. The book is long.", 1]], "say": "How will you combine each pair?", "how": "Two actions, or two describing words?"}, {"type": "tiles", "w": ["We ate", "the warm", "challah."], "extra": ["was"], "say": "Combine: The challah was warm. We ate it.", "how": "Move the describing word in front."}, {"type": "match", "pairs": [["The tea is hot. The tea is sweet.", "The tea is hot and sweet."], ["Dovid slipped. Dovid laughed.", "Dovid slipped and laughed."], ["The road was icy. We drove on it.", "We drove on the icy road."]], "say": "Match each pair to its combine.", "how": "Say the twin part once."}, {"type": "sort", "bins": ["Smooth", "Choppy"], "cards": [["Chaim hopped and skipped.", 0], ["Chaim hopped. Chaim skipped.", 1], ["The day was cold and windy.", 0], ["The day was cold. The day was windy.", 1]], "say": "Smooth or choppy? Sort it.", "how": "Smooth says the twin part once."}]};
  BITE['LANG.SENT.L05.01'] = {"band": "E45", "pic": "🧩", "today": "Find and fix a sentence fragment", "why": "A fragment leaves your reader asking \"who?\" or \"then what?\". Complete sentences make your writing clear.", "ready": [{"q": "\"The boys sang.\" Who is the sentence about?", "o": ["the boys", "sang", "the song", "nobody"], "a": "the boys"}], "bridge": "LANG.SENT.L03.01", "bridgeName": "Whole Thought", "watch": {"q": "Ran across the field.", "m": {"type": "tiles", "w": ["Ran across the field."], "hi": [0]}, "steps": [{"t": "Test 1: who or what? Nobody is named. The subject is missing."}, {"t": "Fix it: add the subject. Yehuda ran across the field.", "m": {"type": "tiles", "w": ["Yehuda", "ran", "across the field."], "hi": [0]}}, {"t": "Test 2: what does it do? \"The warm rugelach.\" No action. Add a predicate: The warm rugelach smelled sweet."}, {"t": "Test 3: is the thought finished? \"Because it was late.\" Then what? Join it: We went home because it was late.", "m": {"type": "tiles", "w": ["We went home", "because it was late."], "hi": [1]}}], "a": "Yehuda ran across the field."}, "oops": {"q": "\"When the map tore.\"", "wrong": "Complete: it has a subject and a verb", "right": "Fragment: the thought is not finished", "why": "A when part can have a subject and a verb and still be a fragment. Ask: then what happened?"}, "ways": ["worked example", "three tests", "sort", "match", "build with tiles", "tap the reason", "Mistake Detective"], "done": "You can find a fragment with three tests and fix it!", "board": {"one": "Three tests: who? does what? finished thought? Fail one = fragment.", "activity": "Read fragments aloud; the class answers the question it leaves (\"Who?\" \"Then what?\") and a boy fixes it.", "mistakes": ["Thinking a long piece must be a sentence", "Missing a because or when fragment", "Fixing by adding only a period"]}, "do": [{"type": "sort", "bins": ["Complete sentence", "Fragment"], "cards": [["Yehuda found a clue.", 0], ["Found a clue.", 1], ["The map was torn.", 0], ["The map with the red X.", 1]], "say": "Complete sentence, or fragment? Sort it.", "how": "Ask: who? does what? is the thought finished?", "why": {"q": "Why is \"Found a clue.\" a fragment?", "o": ["It has no subject: who found it?", "It is too short", "It needs a comma", "It has no capital"], "a": "It has no subject: who found it?"}}, {"type": "match", "mis": true, "pairs": [["When the map tore.", "trap: thought not finished"], ["Ran to the bakery.", "trap: no subject"], ["The warm rugelach.", "trap: no predicate"]], "say": "Mistake Detective! What trap makes each a fragment?", "how": "Check who, an action, and a finished thought."}], "your": [{"type": "tiles", "w": ["Tzvi Hirsch ran", "to the bakery", "because it was Erev Shabbos."], "extra": ["Because"], "say": "Fix the because fragment by joining it.", "how": "Complete sentence first, then the because part."}, {"type": "sort", "bins": ["Fixed", "Still a fragment"], "cards": [["Dovid built a robot.", 0], ["Built a robot in the basement.", 1], ["When it moved, we cheered.", 0], ["When the robot moved.", 1]], "say": "Is the fragment really fixed?", "how": "Who, an action, and a finished thought.", "why": {"q": "Why is \"When the robot moved.\" still a fragment?", "o": ["The thought is not finished", "It has no verb", "It has no subject", "It is a question"], "a": "The thought is not finished"}}, {"type": "match", "pairs": [["subject", "who or what it is about"], ["predicate", "what the subject does"], ["fragment", "not a complete sentence"]], "say": "Match each word to its meaning.", "how": "Subject is who. Predicate is what he does."}, {"type": "sort", "bins": ["Complete", "Fragment"], "cards": [["Binyamin moved his knight.", 0], ["After the long game.", 1], ["Zeidy smiled.", 0], ["Moving the knight forward.", 1]], "say": "Complete or fragment?", "how": "All three tests must pass."}, {"type": "tiles", "w": ["The warm rugelach", "smelled sweet."], "extra": ["on the tray.", "with cinnamon"], "say": "Fix it: give the rugelach a predicate.", "how": "Add what the subject does or is."}]};
  BITE['LANG.SENT.L05.02'] = {"band": "E45", "pic": "🔗", "today": "Combine sentences with who, which and that", "why": "Who, which and that let one sentence carry two facts, so your writing flows.", "ready": [{"q": "\"I met a man. The man fixes clocks.\" Which words repeat?", "o": ["the man", "fixes", "clocks", "I met"], "a": "the man"}], "bridge": "LANG.SENT.L04.04", "bridgeName": "Combine Two", "watch": {"q": "I met a man. The man fixes clocks.", "m": {"type": "tiles", "w": ["I met a man.", "The man fixes clocks."], "hi": [1]}, "steps": [{"t": "Two sentences share \"the man\". I will join them with one word."}, {"t": "A man is a person, so I use who. I met a man who fixes clocks.", "m": {"type": "tiles", "w": ["I met a man", "who", "fixes clocks."], "hi": [1]}}, {"t": "A thing with extra information takes which, inside commas. We saw the lighthouse, which is very old.", "m": {"type": "tiles", "w": ["We saw the lighthouse,", "which", "is very old."], "hi": [1]}}, {"t": "To point out one thing, use that. The map that Zeidy found had a red X."}], "a": "I met a man who fixes clocks."}, "oops": {"q": "Combine: \"Dovid built a robot. The robot can walk.\"", "wrong": "Dovid built a robot who can walk.", "right": "Dovid built a robot that can walk.", "why": "A robot is a thing, not a person. Things take that or which."}, "ways": ["worked example", "sort", "build with tiles", "match", "tap the reason", "Mistake Detective"], "done": "You can join sentences with who, which and that!", "board": {"one": "Who = people. Which (with commas) = extra facts about things. That = points out which thing.", "activity": "Write sentence pairs on cards. Boys swap the repeated words for who, which or that and read the new sentence.", "mistakes": ["Who for a thing", "Which for a person", "Forgetting the commas around a which part"]}, "do": [{"type": "match", "pairs": [["a rebbe ___ loves questions", "who"], ["the bakery, ___ opens at six,", "which"], ["the key ___ opens the box", "that"]], "say": "Match each phrase to the word that fits.", "how": "Who: people. Which with commas: extra facts. That: points out.", "why": {"q": "Why does \"a rebbe\" take who?", "o": ["A rebbe is a person", "It comes first", "It is a question", "It has a comma"], "a": "A rebbe is a person"}}, {"type": "sort", "mis": true, "bins": ["Right word", "Mistake"], "cards": [["the man who fixes clocks", 0], ["the man which fixes clocks", 1], ["the robot that Dovid built", 0], ["the robot who Dovid built", 1]], "say": "Mistake Detective! Is the joining word right?", "how": "People take who. Things take which or that."}], "your": [{"type": "tiles", "w": ["Avrumi has a cousin", "who", "lives in Eretz Yisroel."], "extra": ["which"], "say": "Combine the two sentences with one word.", "how": "A cousin is a person: who."}, {"type": "match", "pairs": [["I know a boy. He plays chess.", "I know a boy who plays chess."], ["We saw the lake. It was frozen.", "We saw the lake, which was frozen."], ["Here is the coat. I lost it.", "Here is the coat that I lost."]], "say": "Match each pair to its combined sentence.", "how": "Swap the repeated part for who, which or that."}, {"type": "tiles", "w": ["The storm,", "which", "lasted all night,", "knocked down a tree."], "say": "Combine. Put the extra fact between commas.", "how": "The storm, then which and the extra fact, then the rest.", "why": {"q": "Why are there commas around \"which lasted all night\"?", "o": ["It is extra information", "It is a list", "It is a question", "It is the subject"], "a": "It is extra information"}}, {"type": "sort", "bins": ["who", "which or that"], "cards": [["the sofer", 0], ["the lighthouse", 1], ["Rabbi Feldman", 0], ["the chess set", 1]], "say": "Does each noun take who, or which and that?", "how": "Who is only for people."}, {"type": "match", "pairs": [["who", "people"], ["which", "extra facts about things"], ["that", "points out one thing"]], "say": "Match each word to its job.", "how": "Think about people, things, and pointing."}]};
  BITE['LANG.SENT.L05.03'] = {"band": "E45", "pic": "🧭", "today": "Expand a sentence with a phrase", "why": "One small phrase tells your reader where, when or how, and makes the picture sharp.", "ready": [{"q": "\"Eli ran to the park.\" Which part tells where?", "o": ["to the park", "Eli", "ran", "the"], "a": "to the park"}], "bridge": "LANG.SENT.L03.03", "bridgeName": "Grow It", "watch": {"q": "Yehuda searched the attic.", "m": {"type": "tiles", "w": ["Yehuda", "searched", "the attic."], "hi": [0, 1]}, "steps": [{"t": "Start with the kernel: Yehuda searched the attic."}, {"t": "Add HOW with a phrase: with a flashlight. A phrase starts with a word like with, and ends with a noun.", "m": {"type": "tiles", "w": ["Yehuda searched the attic", "with a flashlight."], "hi": [1]}}, {"t": "Add WHEN at the front: after Maariv, then a comma.", "m": {"type": "tiles", "w": ["After Maariv,", "Yehuda searched the attic", "with a flashlight."], "hi": [0]}}, {"t": "Check the picture: \"with a flashlight\" sits after \"searched the attic\", so we know how he searched."}], "a": "After Maariv, Yehuda searched the attic with a flashlight."}, "oops": {"q": "\"I saw a fish on my bike.\"", "wrong": "Clear: the fish was seen", "right": "Unclear. Fix it: On my bike, I saw a fish.", "why": "The phrase \"on my bike\" sits next to \"fish\", so it sounds like the fish was on the bike."}, "ways": ["worked example", "spot the phrase", "sort", "build with tiles", "tap the reason", "Mistake Detective"], "done": "You can expand a sentence with a phrase that tells where, when or how!", "board": {"one": "Phrase = in/on/with/after... + noun. It tells where, when or how. Keep it next to what it describes.", "activity": "Boys draw a phrase card (with a ladder, after the storm) and add it to a kernel on the board.", "mistakes": ["Calling any group of words a phrase", "Putting the phrase next to the wrong word", "Forgetting the comma after a long phrase at the front"]}, "do": [{"type": "match", "pairs": [["in the attic", "where"], ["before Shabbos", "when"], ["with a flashlight", "how"]], "say": "Match each phrase to what it tells.", "how": "Place? Time? The way it was done?", "why": {"q": "Why does \"with a flashlight\" tell how?", "o": ["It tells the way it was done", "It names a place", "It names a time", "It is the subject"], "a": "It tells the way it was done"}}, {"type": "sort", "mis": true, "bins": ["Clear", "Mistake"], "cards": [["The dog in the yard barked.", 0], ["I saw a fish on my bike.", 1], ["On my bike, I saw a fish.", 0], ["He wore a hat on his head with a feather.", 1]], "say": "Mistake Detective! Is the phrase in a clear place?", "how": "Picture it. Is the phrase next to what it describes?"}], "your": [{"type": "tiles", "w": ["Yehuda searched", "the attic", "with a flashlight."], "say": "Expand it with how.", "how": "Kernel first, then the how phrase."}, {"type": "match", "pairs": [["in", "the attic"], ["after", "the storm"], ["with", "a wrench"]], "say": "Match each start to an ending.", "how": "Each phrase ends with a noun."}, {"type": "tiles", "w": ["During the storm,", "the lights", "went out."], "extra": ["storm"], "say": "Expand it with when, at the front.", "how": "When phrase, comma, then the kernel.", "why": {"q": "Why is there a comma after \"During the storm\"?", "o": ["The phrase comes first, before the kernel", "It is a list", "It is a question", "It is the end"], "a": "The phrase comes first, before the kernel"}}, {"type": "sort", "bins": ["Phrase", "Not a phrase"], "cards": [["under the bridge", 0], ["the old map", 1], ["after Maariv", 0], ["jumped high", 1]], "say": "Is it a prepositional phrase?", "how": "Starts with in, after, with... ends with a noun."}, {"type": "match", "pairs": [["behind the shul", "where"], ["during the storm", "when"], ["by hand", "how"]], "say": "Match each phrase to what it tells.", "how": "Place, time, or the way?"}]};
  BITE['LANG.SENT.L06.01'] = {"band": "E45", "pic": "🪢", "today": "Combine sentences three ways", "why": "Good writers choose how to combine, so each sentence says exactly what they mean.", "ready": [{"q": "\"The dog is big. The dog is friendly.\" Best combine?", "o": ["The dog is big and friendly.", "The dog is big the dog is friendly.", "Big friendly the dog.", "The dog big friendly is."], "a": "The dog is big and friendly."}], "bridge": "LANG.SENT.L04.04", "bridgeName": "Combine Two", "watch": {"q": "The storm ended. We went outside.", "m": {"type": "tiles", "w": ["The storm ended.", "We went outside."], "hi": [0, 1]}, "steps": [{"t": "Way 1, a joining word: The storm ended, so we went outside.", "m": {"type": "tiles", "w": ["The storm ended,", "so", "we went outside."], "hi": [1]}}, {"t": "Way 2, a starting part: After the storm ended, we went outside.", "m": {"type": "tiles", "w": ["After the storm ended,", "we went outside."], "hi": [0]}}, {"t": "Way 3, tuck it in: The sky was gray. The sky cleared. The gray sky cleared.", "m": {"type": "tiles", "w": ["The", "gray", "sky cleared."], "hi": [1]}}, {"t": "I choose the way that shows how the ideas connect: a result, a time, or a detail."}], "a": "After the storm ended, we went outside."}, "oops": {"q": "Combine \"The lamp went out. We lit a candle.\"", "wrong": "The lamp went out, we lit a candle.", "right": "When the lamp went out, we lit a candle.", "why": "A comma alone cannot join two sentences. Add a joining word or a starting part."}, "ways": ["worked example", "three ways", "sort", "build with tiles", "match", "tap the reason", "Mistake Detective"], "done": "You can combine sentences three ways and pick the best one!", "board": {"one": "Three ways: comma + and/but/so; a when/because/although start; tuck a describer in.", "activity": "Give each pair of boys two sentences. Each pair combines them all three ways and reads the one they like best.", "mistakes": ["Comma alone (comma splice)", "Changing the meanin
