  };
  var TEACH = {}, HOWTO = {}, BITE = {};
  var K1G = [
    { id:'WRIT.PARA.L01.05', grade:0, name:'Label It', pic:'🏷️', after:'WRIT.PARA.L01.04', acts:[

      {type:'match', pairs:[['🛏️','bed'],['🎩','hat'],['🥤','cup']], say:'Match each picture to its label. Sound out each word.', how:'Say the picture. Listen for its first sound.'}]},

      {type:'listen', pic:'🐟', hear:'Eli’s caption says: Fish.', o:['👍','👎'], a:'👎', mis:true, say:'Is that a caption? Does it tell what is happening?', how:'A caption tells who, and what they do.'},

      {type:'sort', bins:['✅','❌'], cards:[['I see a cow.',0],['i see a cow.',1],['We can hop.',0],['We can hop',1]], say:'Does it have a big letter and a dot? Sort them.', how:'Look at the first letter. Look at the end.'}]},

    { id:'WRIT.SENT.L01.02', grade:0, name:'Word by Word', pic:'👆', after:'WRIT.SENT.L01.01', acts:[

      {type:'tiles', w:['h','o','p'], extra:['t'], hear:'hop', say:'A new word? Stretch it out, sound by sound.', how:'Say it slowly. Tap each sound you hear.'},

      {type:'dictation', hear:'We see a bus.', w:['We','see','a','bus.'], say:'Say it, then write it word by word.', how:'Say one word. Tap it. Then say the next one.'}]},

    { id:'WRIT.SENT.L01.03', grade:0, name:'Point and Read', pic:'👉', after:'WRIT.SENT.L01.02', acts:[
      {type:'findall', grid:['I','⭐','can','🐔','run.','✏️'], find:['I','can','run.'], findSay:'word of Eli’s sentence', say:'Eli wrote: I can run. Point and tap each word.', how:'Words are made of letters. Say the sentence as you tap.'},

      {type:'listen', hear:'Eli reads it back: I see a big.', o:['👍','👎'], a:'👎', say:'Point and read. Does Eli’s sentence make sense?', how:'Read it with your finger. Is a word missing?'},

      {type:'listen', hear:'We go to shul.', o:['3','4','5'], a:'4', say:'Point and read: We go to shul. How many words?', how:'Point to each word as you say it. Count them.'}]}

</script>
