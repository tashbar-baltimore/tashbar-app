<script>
/* ScreenFit.html — safety net: no full-screen box may ever hide its buttons below the screen edge.
   Head of School report 2026-11-18: boys saw "Finish your Pathfinder" with no way out, because the box was taller
   than a Chromebook screen, did not scroll, and its buttons sat below the bottom edge.
   This add-on watches for any full-screen box (position:fixed, covering the window) that can be clicked.
   ONLY when its content does not fit the window does it:
     1. let that box scroll, and pin tall content to the top (centered content that is too tall cannot be scrolled to);
     2. let an inner panel scroll, if it cuts off a button or link.
   A box that fits is never touched. Decorations (pointer-events:none) are never touched.
   No words, rules, money or sign-in change. Load it LAST. */
(function () {
  if (window.TL_SCREENFIT) return; window.TL_SCREENFIT = { fixed: 0, log: [] };
  var SAFE = false; try { SAFE = CSS.supports('align-items', 'safe center'); } catch (e) {}
  var CLICK = 'button,a[href],[onclick],input,select,textarea,[role=button],[tabindex]';
  function vis(cs) { return cs.display !== 'none' && cs.visibility !== 'hidden' && cs.pointerEvents !== 'none' && +cs.opacity > 0.05; }
  function covers(el, cs) {
    if (cs.position !== 'fixed') return false;
    var r = el.getBoundingClientRect(), W = window.innerWidth, H = window.innerHeight;
    return r.width >= W * 0.85 && r.height >= H * 0.85;
  }
  function contentBox(el) {   /* union of the box's own children, as laid out now */
    var t = Infinity, b = -Infinity, k = el.children;
    for (var i = 0; i < k.length; i++) { var cs = getComputedStyle(k[i]); if (cs.display === 'none' || cs.position === 'fixed') continue;
      var r = k[i].getBoundingClientRect(); if (!r.height) continue; if (r.top < t) t = r.top; if (r.bottom > b) b = r.bottom; }
    return { top: t, bottom: b };
  }
  function note(el, what) { var n = el.id ? '#' + el.id : (el.className && typeof el.className === 'string' ? '.' + el.className.trim().split(/\s+/)[0] : el.tagName);
    window.TL_SCREENFIT.fixed++; window.TL_SCREENFIT.log.push(n + ': ' + what); }
  function fixBox(el, cs) {
    var H = window.innerHeight, c = contentBox(el), over = c.top < -1 || c.bottom > H + 1 || el.scrollHeight > el.clientHeight + 2;
    if (!over) return;
    if (el.getAttribute('data-sf') === '1') { /* already fixed; keep it scrolled where the boy put it */ return; }
    el.setAttribute('data-sf', '1');
    el.style.setProperty('overflow-y', 'auto', 'important');
    el.style.setProperty('overscroll-behavior', 'contain');
    var d = cs.display;
    if (d === 'grid' || d === 'inline-grid') {
      if (SAFE) el.style.setProperty('align-items', 'safe ' + (cs.alignItems === 'normal' ? 'center' : cs.alignItems.replace('safe ', '')), 'important');
      else { el.style.setProperty('align-items', 'start', 'important'); for (var i = 0; i < el.children.length; i++) { el.children[i].style.marginTop = 'auto'; el.children[i].style.marginBottom = 'auto'; } }
      el.style.setProperty('align-content', 'start', 'important');
    } else if (d === 'flex' || d === 'inline-flex') {
      var col = /column/.test(cs.flexDirection), prop = col ? 'justify-content' : 'align-items', cur = col ? cs.justifyContent : cs.alignItems;
      if (/center/.test(cur)) {
        if (SAFE) el.style.setProperty(prop, 'safe center', 'important');
        else { el.style.setProperty(prop, 'flex-start', 'important'); if (col && el.firstElementChild) { el.firstElementChild.style.marginTop = 'auto'; el.lastElementChild.style.marginBottom = 'auto'; } }
      }
      if (col) for (var j = 0; j < el.children.length; j++) el.children[j].style.flexShrink = '0';
    }
    note(el, 'box scrolls now');
  }
  function fixInner(el) {   /* an inner panel with overflow hidden that cuts off something clickable */
    var all = el.querySelectorAll('*'), n = Math.min(all.length, 4000);
    for (var i = 0; i < n; i++) { var p = all[i]; if (p.getAttribute('data-sf') === '2') continue;
      if (p.scrollHeight <= p.clientHeight + 4) continue;
      var cs = getComputedStyle(p); if (!/hidden|clip/.test(cs.overflowY) || cs.display === 'none') continue;
      if (p.clientHeight < 120) continue;   /* small bars and pills: leave alone */
      var pr = p.getBoundingClientRect(), cut = false, cl = p.querySelectorAll(CLICK);
      for (var j = 0; j < cl.length && !cut; j++) { var cr = cl[j].getBoundingClientRect(), ccs = getComputedStyle(cl[j]);
        if (!cr.height || ccs.visibility === 'hidden' || ccs.display === 'none' || ccs.position === 'fixed') continue; if (cr.top >= pr.bottom - 2 || cr.bottom > pr.bottom + 4) cut = true; }
      if (!cut) continue;
      p.setAttribute('data-sf', '2'); p.style.setProperty('overflow-y', 'auto', 'important'); p.style.setProperty('overscroll-behavior', 'contain');
      note(p, 'inner panel scrolls now');
    }
  }
  function scan() {
    var roots = [document.body], seen = 0;
    var list = []; (function walk(n, depth) { for (var c = n.firstElementChild; c; c = c.nextElementSibling) { list.push(c); if (depth < 4 && !/^(SVG|CANVAS|SCRIPT|STYLE|svg)$/.test(c.tagName)) walk(c, depth + 1); } })(document.body, 0);
    for (var i = 0; i < list.length; i++) { var el = list[i], cs = getComputedStyle(el);
      if (cs.position !== 'fixed' || !vis(cs) || !covers(el, cs)) continue;
      if (!el.querySelector(CLICK)) continue;   /* nothing to press: a picture or a background */
      try { fixBox(el, cs); fixInner(el); } catch (e) {} }
  }
  var queued = false, last = 0;
  function soon() { if (queued) return; queued = true; var wait = Math.max(60, 350 - (Date.now() - last));
    setTimeout(function () { queued = false; last = Date.now(); requestAnimationFrame(scan); }, wait); }
  function start() {
    try { new MutationObserver(soon).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'style', 'hidden', 'open'] }); } catch (e) {}
    window.addEventListener('resize', function () { var f = document.querySelectorAll('[data-sf]'); for (var i = 0; i < f.length; i++) f[i].removeAttribute('data-sf'); soon(); });
    soon(); setInterval(soon, 3000);
  }
  if (document.body) start(); else document.addEventListener('DOMContentLoaded', start);
  window.TL_SCREENFIT.scan = scan;
})();
</script>
