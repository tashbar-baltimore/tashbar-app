    c45_brsusp: { title: 'How a Suspension Bridge Hangs', text: 'A suspension bridge hangs in the air, a little like a swing. Two tall towers rise high above the water. Two giant main cables run over the tops of the towers, from one end of the bridge to the other.\nHundreds of thinner cables, called hangers, drop straight down from the main cables. The hangers hold up the road. So the road does not sit on the cables. It hangs from them!\nThe heavy road pulls down on the hangers, and the hangers pull down on the main cables. The main cables carry that pull up and over the towers.\nA suspension bridge can stretch farther between its towers than any other kind of bridge. That is why engineers choose it to cross wide rivers and bays.\n\nTHE DIAGRAM: a suspension bridge, seen from the side\nLabel 1, Tower: a tall post. There is one near each end.\nLabel 2, Main cable: it dips lowest in the middle, between the towers.\nLabel 3, Hanger: a thin cable that holds up the road.\nLabel 4, Deck: the flat road that cars drive on.\nLabel 5, Anchorage: a huge block of concrete at each end. It holds the main cable tight.\nArrows: they point down from the deck, along the hangers.' },
    c45_brbeam: { title: 'The Beam Bridge', text: 'The simplest bridge of all is a beam bridge. A log lying across a creek is a beam bridge! So is a plank across a puddle.\nA beam bridge is a long, stiff beam that rests on a support at each end. Long beam bridges rest on many supports, one after another, like a line of tables pushed together.\nWhen a heavy truck rolls onto a beam bridge, the beam bends a tiny bit. The truck\'s weight goes through the beam and down into the supports.\nBeam bridges are quick and cheap to build. But one beam cannot reach very far. If the gap is too wide, the beam sags in the middle, and it could even break.\n\nTHE DIAGRAM: a truck on a beam bridge, seen from the side\nLabel 1, Top of the beam: squeezed together. This push is called compression.\nLabel 2, Bottom of the beam: stretched apart. This pull is called tension.\nLabel 3, Support: there is one under each end of the beam.\nArrows: they point from the truck down into the supports.' },
    c45_brarch: { title: 'Stone Arches That Last', text: 'More than two thousand years ago, builders in ancient Rome made bridges out of stone arches. Some of those bridges still stand today. How can stone, with no steel at all, last so long?\nThe secret is the curved shape. When a cart or a person crosses an arch bridge, the weight does not push straight down. The arch carries it along the curve, out to the ends.\nEvery stone in the arch is pressed tightly against its neighbors. The more weight on top, the tighter the stones squeeze together.\nWhile an arch is being built, it needs a wooden frame under it to hold the stones up. Once the last stone is in place, the builders take the frame away, and the arch stands by itself.\n\nTHE DIAGRAM: a stone arch bridge, seen from the side\nLabel 1, Keystone: the wedge-shaped stone at the very top.\nLabel 2, Arch stones: each one is a wedge, wider on the outside of the curve than on the inside.\nLabel 3, Abutment: a strong wall at each end that the arch pushes against.\nArrows: they run along the curve, down to the abutments at the ends.' },
    c45_brbaymap: { title: 'Crossing the Bay', text: 'Before 1952, there was no road across the Chesapeake Bay in Maryland. To reach the Eastern Shore, families from Baltimore drove far around the top of the bay, or they waited in long lines for a ferry boat.\nThen, on July 30, 1952, the Chesapeake Bay Bridge opened. It is about 4.3 miles long. In the middle, it is so high that big ships can sail underneath.\nIn 1973, a second bridge opened right beside the first one. Most days, cars heading east use the older bridge, and cars heading west use the newer one.\n\nTHE MAP\nCompass rose: N is at the top, S at the bottom, W on the left, E on the right.\nKey: ● town or place · ═ bridge · ~ water · ▲ lighthouse\nNorth (top of the map)\n● Baltimore\n~ ~ Chesapeake Bay ~ ~\n▲ Sandy Point Shoal Lighthouse\n● Sandy Point ═══ ● Kent Island\n● Annapolis\nSouth (bottom of the map)' },
    c45_brwalk: { title: 'Avrumi\'s Map to the Footbridge', text: 'Nosson Abergel is new on Glen Avenue. On Sunday, the boys were meeting at the little footbridge in the park, to test their model bridges over the stream. Nosson did not know the way, so Avrumi drew him a map.\n"Start at the star," Avrumi said. "Then just follow the map."\n\nTHE MAP\nCompass rose: N is at the top, S at the bottom, W on the left, E on the right.\nKey: ★ start · ▬ street · ┇ path · ~ stream · ═ footbridge · ■ building\nNorth (top of the map)\n~ stream ~ ═ ~ stream ~\n┇ park path, from the bakery up to the footbridge\n★■ Yeshiva ▬▬ Glen Ave ▬▬ ■ Bakery\nSouth (bottom of the map)' },
    c45_brgym: { title: 'The Bridge Fair Map', text: 'Mr. Halpern drew this map of the gym for the Grade 4 bridge fair. Every boy\'s model bridge stands on its own table. Visitors come in through the front door and walk around to see them.\n\nTHE MAP\nCompass rose: N is at the top, S at the bottom, W on the left, E on the right.\nKey: ■ model table · ✚ first aid · ⚑ judges\' desk · 🚪 door\nNorth (top of the map)\n🚪 Front door · ⚑\n■ Dovid · ■ Avrumi · ■ Yehuda\n■ Binyamin · ✚ · ■ Nosson\n🚪 Back door · ■ Tzvi Hirsch\nSouth (bottom of the map)' },
    c45_brtest: { title: 'The Bridge Test', text: 'A story by Avrumi Katz\nDovid set his craft-stick bridge across the gap between two desks. Every boy in the class leaned in close.\n"One washer at a time," said Mr. Halpern. He hung a little bucket from the middle of the bridge.\nClink. Clink. Clink. The washers dropped in, one by one. The bridge did not move.\nTwenty washers. Thirty. Forty. Dovid held his breath.\n"It\'s bending," Tzvi Hirsch whispered.\nThen came a loud CRACK! The bridge snapped in the middle, and the bucket hit the floor.\nFor a long moment, nobody spoke. Then Dovid picked up the two halves and smiled.\n"Now I know where it is weak," he said. "Next time, I\'ll add triangles."\n\nTHE RECORDING: Mr. Halpern read this story aloud for the class listening corner. Here is what you hear:\n1. "Clink. Clink. Clink." comes slowly, with a pause after each one.\n2. Right after "The bridge did not move," you hear "Dovid held his breath."\n3. Tzvi Hirsch\'s words come in a soft whisper.\n4. "CRACK!" comes in a big, loud voice.\n5. After the bucket hits the floor, there are three seconds of silence.\n6. Soft drum music plays under the whole story.' },
    c45_brferry: { title: 'The Last Ferry', text: 'A story by Yehuda Benaim\nIt was a summer morning in 1952. Shimon stood on the deck of the ferry boat with his Abba, watching the gulls swoop over the bay.\nThe ferry horn blew a long, low HOOOONK. Shimon covered his ears and laughed.\nNot far away, workers were finishing a giant new bridge across the water.\n"Soon nobody will need this old boat," Abba said quietly.\nShimon looked down at the gray water. He felt a little sad.\n"Then we must remember this ride," he said.\nAbba put an arm around his shoulders. Together they watched the shore of Kent Island come closer and closer.\n\nTHE RECORDING: Rabbi Feldman read this story aloud for the class listening corner. Here is what you hear:\n1. The horn sound comes long and low.\n2. Abba\'s words come in a quiet voice.\n3. Right after Abba\'s words, you hear "Then we must remember this ride."\n4. Soft violin music plays at the very end.' }
