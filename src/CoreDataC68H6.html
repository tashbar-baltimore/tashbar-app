    'READ.LIT.L08.21':{name:"Flood 1: Setting Sets the Stakes", teach:[{"how": "The stakes are what a character could lose: a home, years of work, a person he loves. Ask: what is at risk here?", "q": "Everything a character could lose is called...", "o": ["the stakes", "the setting", "the climax"]}, {"how": "When an author slows down to show a place full of work, memories or people, the setting sets the stakes. It shows you what could be lost.", "q": "An author spends a page on a family's orchard, planted by their great-grandfather, before the drought comes. Why?", "o": ["the setting sets the stakes", "a danger in the setting", "a summary of the plot"]}, {"how": "A danger in the setting is something about the place that could turn against the people: a river, a cliff, a cracked dam.", "q": "A town sits right at the edge of a fast river. The river is...", "o": ["a danger in the setting", "the stakes", "a summary of the plot"]}], practice:[{"t": "sort", "q": "Danger, or what could be lost?", "bins": [{"id": "0", "label": "A danger in the setting"}, {"id": "1", "label": "The stakes"}], "items": [{"label": "a river beside the tracks", "bin": "0"}, {"label": "a store built over 38 years", "bin": "1"}, {"label": "a storm moving north", "bin": "0"}, {"label": "a neighbor who lives alone", "bin": "1"}], "h": "Could it hurt them, or could they lose it?"}, {"t": "pairs", "q": "Match each idea to its example.", "pairs": [["the stakes", "a home full of family photos"], ["a danger in the setting", "a house below a cracked dam"], ["the setting sets the stakes", "a page on the old family orchard"]], "h": "What could be lost, what could hurt, and how the place shows it."}, {"t": "order", "q": "Put the reader's questions in order.", "tiles": ["Where and when is this?", "What is dangerous about the place?", "What could be lost here?", "Why does the author show it now?"], "h": "Place, danger, stakes, purpose."}, {"t": "spotall", "q": "Tap every detail that shows what could be lost.",     'READ.LIT.L08.22':{name:"Flood 2: Planted Clues", teach:[{"how": "A planted clue is a detail the author puts in early, on purpose, because it will matter later. Ask: why tell me this now?", "q": "Page 1 mentions that the boat has a small leak. This is...", "o": ["a planted clue", "the payoff", "the setting"]}, {"how": "The payoff is the later moment when the clue matters. When you reach it, look back: the author prepared you.", "q": "In chapter 9 the leaking boat starts to sink. This is...", "o": ["the payoff", "a planted clue", "the title"]}, {"how": "A warning in someone's words is when a character says something that hints at what is coming, often without knowing it.", "q": "An old sailor says, \"That sea is not as calm as it looks.\" This is...", "o": ["a warning in someone's words", "the payoff", "a summary"]}], practice:[{"t": "sort", "q": "Clue, or the payoff?", "bins": [{"id": "0", "label": "A planted clue"}, {"id": "1", "label": "The payoff"}], "items": [{"label": "a loose step on page 3", "bin": "0"}, {"label": "the step gives way in chapter 8", "bin": "1"}, {"label": "a key hidden in the clock", "bin": "0"}, {"label": "the key opens the old trunk", "bin": "1"}], "h": "Early hint, or the moment it matters?"}, {"t": "pairs", "q": "Match each clue to its payoff.", "pairs": [["a cracked ladder", "the ladder breaks"], ["\"Never swim there.\"", "a boy is pulled by the current"], ["the dog hears things first", "the dog barks the alarm"]], "h": "Which later moment does each prepare?"}, {"t": "order", "q": "Put the clue-reading steps in order.", "tiles": ["notice a detail", "ask: why tell me this now?", "keep reading", "find the payoff and look back"], "h": "Notice, ask, read, connect."}, {"t": "spotall", "q": "Tap every line that could be a warning in someone's words.", "cells": [{"label": "\"Storms don't always stay where they're put.\"", "ok": true}, {"label": "\"Pass the salt, please.\"", "ok": false}, {"label": "\"That ice is thinner than it looks.\"", "o     'READ.LIT.L08.23':{name:"Flood 3: Why He Chose", teach:[{"how": "Motivation is the reason a character does what he does. The story rarely says it outright; you work it out.", "q": "The reason a character acts is his...", "o": ["motivation", "setting", "climax"]}, {"how": "Actions show motivation: watch what he does, especially when it costs him something. The bigger the cost, the clearer the reason.", "q": "Every night Dovi reads to his little brother, even the night before a big test. He never explains. What tells us why?", "o": ["actions show motivation", "the title tells us", "the setting tells us"]}, {"how": "Words show motivation: listen to what he says, especially under pressure. Then check that his actions agree.", "q": "Asked why he stays late, Avi says, \"Someone has to lock up.\" What shows his reason?", "o": ["words show motivation", "the setting tells us", "a planted clue"]}], practice:[{"t": "sort", "q": "Is the reason shown by actions or by words?", "bins": [{"id": "0", "label": "Actions show motivation"}, {"id": "1", "label": "Words show motivation"}], "items": [{"label": "he stops work to daven Mincha", "bin": "0"}, {"label": "\"I will watch.\"", "bin": "1"}, {"label": "he fills sacks with sand", "bin": "0"}, {"label": "\"Tell Chana not to worry.\"", "bin": "1"}], "h": "Did he do it, or say it?"}, {"t": "pairs", "q": "Match each choice to its reason.", "pairs": [["studies late every night", "to keep a promise"], ["gives away his lunch", "the boy was hungry"], ["runs back into the rain", "his dog is outside"]], "h": "What would make a person do that?"}, {"t": "order", "q": "Put the motivation steps in order.", "tiles": ["notice the choice", "look for proof in his words and actions", "ask what it cost him", "say the reason with because"], "h": "Choice, words, cost, reason."}, {"t": "spotall", "q": "Tap every good way to find a character's motivation.", "cells": [{"label": "watch what he gives up", "ok": true}, {"label": "guess with no proof", "ok":     'READ.LIT.L08.26':{name:"Flood 6: Story and History", teach:[{"how": "Historical fiction keeps real facts: the date, the place, what really happened. A detail kept from history should match a true account.", "q": "A novel says men first walked on the moon in July 1969. This detail is...", "o": ["kept from history", "invented by the author", "a planted clue"]}, {"how": "The author also invents: characters, their words, their homes and many scenes. A detail invented by the author did not really happen, but could have.", "q": "In that novel, a boy named Shloimy watches it on his uncle's TV. Shloimy is...", "o": ["invented by the author", "kept from history", "the setting"]}, {"how": "Why invent? The facts give numbers; an invented family lets us feel what the day meant. Authors invent to make history personal, without changing a real person's life.", "q": "Why put an invented family inside a real event?", "o": ["to make history personal", "to change the real facts", "to make it shorter"]}], practice:[{"t": "sort", "q": "Kept from history, or invented?", "bins": [{"id": "0", "label": "Kept from history"}, {"id": "1", "label": "Invented by the author"}], "items": [{"label": "Agnes flooded Ellicott City in June 1972", "bin": "0"}, {"label": "Brenner's Dry Goods and Hardware", "bin": "1"}, {"label": "the bridge into town washed away", "bin": "0"}, {"label": "Mr. Whitlock and Captain", "bin": "1"}], "h": "Would a history book say it?"}, {"t": "pairs", "q": "Match each idea to its meaning.", "pairs": [["kept from history", "it really happened"], ["invented by the author", "made up, but could have happened"], ["to make history personal", "why authors invent"]], "h": "Real, made up, and why."}, {"t": "order", "q": "Put the comparing steps in order.", "tiles": ["read a true account", "find what the novel keeps", "find what it invents", "ask why the author did it"], "h": "Facts, kept, invented, why."}, {"t": "spotall", "q": "Tap every detail kept from history.", "cells": [{"     'READ.LIT.L08.27':{name:"Flood 7: A Theme Grows", teach:[{"how": "A theme seed is an early moment that hints at what the book will teach. It is small, and easy to miss.", "q": "In chapter 1, a boy shares his lunch once. Later chapters show much more sharing. The first lunch is...", "o": ["a theme seed", "the climax", "a time marker"]}, {"how": "The theme grows when each new chapter adds a moment that shows the same idea more strongly. In a long chapter, stop after each page and ask: what does this add?", "q": "Each chapter adds a new act of courage until the whole town is brave. What is happening?", "o": ["the theme grows", "the setting sets the stakes", "a ticking count"]}, {"how": "Late in the book, a character says the theme: he puts the idea into words, after the story has shown it many times.", "q": "Near the end, a grandfather says, \"A family is the people who show up.\" This is...", "o": ["a character says the theme", "a seed planted early", "the setting sets the stakes"]}], practice:[{"t": "sort", "q": "Does it add to the theme \"a town is its people\"?", "bins": [{"id": "0", "label": "Adds to the theme"}, {"id": "1", "label": "Does not add"}], "items": [{"label": "neighbors shovel side by side", "bin": "0"}, {"label": "the truck is dusty", "bin": "1"}, {"label": "free coffee and doughnuts for helpers", "bin": "0"}, {"label": "the floorboards are warped", "bin": "1"}], "h": "Does it show people standing together?"}, {"t": "pairs", "q": "Match each idea to its meaning.", "pairs": [["a theme seed", "an early, small hint"], ["the theme grows", "each chapter adds more"], ["a character says the theme", "the idea put into words"]], "h": "Seed, growth, words."}, {"t": "order", "q": "Put the life of a theme in order.", "tiles": ["a theme seed", "the theme grows", "a character says the theme", "the ending closes it"], "h": "Seed, growth, words, ending."}, {"t": "spotall", "q": "Tap every good move for reading a long chapter on your own.", "cells": [{"label": "st     'READ.LIT.L08.28':{name:"Flood 8: What the Book Says", teach:[{"how": "A theme is a full sentence about life, like \"people matter more than things.\" A topic is just a word, like floods.", "q": "\"People matter more than things\" is...", "o": ["a theme", "a topic", "a summary"]}, {"how": "Prove the theme of a whole book three times: from the beginning, middle and end. Three proofs from one place are not enough.", "q": "Where should three proofs for a book's theme come from?", "o": ["the beginning, middle and end", "the last chapter only", "the title"]}, {"how": "The ending answers the beginning: the last chapter often returns to a first-chapter picture, so you can see what has changed.", "q": "A book opens and closes with the same quiet river, but the boy sees it differently. This shows...", "o": ["the ending answers the beginning", "a planted clue", "a ticking count"]}], practice:[{"t": "sort", "q": "A theme, or a topic?", "bins": [{"id": "0", "label": "A theme"}, {"id": "1", "label": "A topic"}], "items": [{"label": "People matter more than things.", "bin": "0"}, {"label": "floods", "bin": "1"}, {"label": "A town is its people.", "bin": "0"}, {"label": "a hardware store", "bin": "1"}], "h": "A sentence about life, or a word?"}, {"t": "pairs", "q": "Match each beginning to the ending that answers it.", "pairs": [["afraid of the deep end", "dives in to save a friend"], ["will not share his bike", "teaches his brother to ride"], ["the house is empty and cold", "the house is full for Shabbos"]], "h": "What has changed from the first picture to the last?"}, {"t": "order", "q": "Put the theme steps in order.", "tiles": ["name the topic", "say the theme as a sentence", "prove it from the beginning, middle and end", "show how the ending answers the beginning"], "h": "Topic, theme, proofs, ending."}, {"t": "spotall", "q": "Tap every strong proof for \"people matter more than things.\"", "cells": [{"label": "Zeidy lets the ledger go for Amos", "ok": true}, {"label": "t   BITE['READ.LIT.L08.21'] = {"band": "M68", "pic": "🏞️", "today": "See how the setting shows what could be lost", "why": "A flood is only frightening if we care what it could take. The first chapter shows you the town, the river and the store, so that later every inch of water matters.", "ready": [{"q": "What is the setting of a story?", "o": ["where and when it happens", "who tells it", "how it ends"], "a": "where and when it happens"}], "bridge": "READ.LIT.L08.10", "bridgeName": "How the Parts Fit", "watch": {"q": "Chapter 1: the place, and what it holds", "m": {"type": "scene", "e": "🏞️", "t": "The Patapsco was not much to look at that morning. It was brown and lazy and low."}, "steps": [{"t": "Where is the town? It climbs straight up from the river, \"as if somebody had tried to build a city on the side of a staircase.\" The bottom step is at the water."}, {"t": "The river: \"brown and lazy and low.\" Calm today. But the author makes Tuli look at it in the morning and again on the drive home. I ask why."}, {"t": "Brenner's is on the lower part of the street, \"only a short walk up from the railroad bridge.\" The store sits close to the river."}, {"t": "Inside: hundreds of drawers, a counter worn pale, a bell that rang for thirty-eight years. That is a lifetime of work. These are the stakes."}, {"t": "Teach it back: tell your chavrusa where the danger is in this setting, and what the place shows could be lost."}], "a": "The low river is the danger; the store, its years of work and its people are what could be lost."}, "oops": {"q": "\"The river is low and lazy, so it does not matter to the story.\"", "wrong": "True: it is just a nice view", "right": "False: the calm river is placed there on purpose", "why": "The author shows the river twice and adds the 1868 story. A calm danger is still a danger."}, "ways": ["worked example", "read the chapter", "Mistake Detective", "find the proof", "the stakes map", "teach it back"], "done": "You can show how a setting sets the stakes!", "board": {"one": "The stakes are what could be lost. A setting sets the stakes when it shows a place full of work, memories and people, next to a danger.", "activity": "Boys sketch Main Street from the river up and mark one danger and three things that could be lost.", "mistakes": ["Treating setting as scenery", "Thinking a calm river means no danger", "Missing the people who could be hurt"]}, "do": [{"type": "read", "text": "C68.FLD.01", "say": "Read chapter 1. Notice the town, the river, the store.", "how": "On each page, ask: what could be lost here?"}, {"type": "sort", "mis": true, "bins": ["Read right", "Mistake"], "cards": [["The ledger holds a lifetime of customers.", 0], ["The setting is just scenery for the trip.", 1], ["Mr. Whitlock's home faces the river.", 0], ["A low river means the town is safe.", 1]], "say": "Mistake Detective! Read right, or a mistake?", "how": "Does the place matter? Is a calm river safe?"}], "your": [{"type": "proof", "text": "C68.FLD.01", "q": "Which sentence shows the 1868 flood reached right into the town itself?", "proof": "the water came right up into town", "look": "what Mr. Whitlock's granddaddy told him", "say": "Find the proof the river came before.", "how": "Read what Mr. Whitlock says about 1868."}, {"type": "evidence", "q": "Why does the author mention empty windows with FOR RENT signs and mills that closed?", "p": ["The town is weak already; a flood could finish it.", "The Brenners are looking for a bigger store.", "Tuli wants a summer job in one of the mills."], "a": 0, "look": "what the town already has to lose", "say": "Tap why the author shows the empty windows.", "how": "Is this town strong, or already struggling?"}, {"type": "storymap", "slots": ["A danger in the setting", "The stakes: things", "The stakes: a person"], "cards": ["the river beside the tracks", "drawers, cloth, the brass register", "a man who lives alone upstairs"], "extra": ["a cold lake in the mountains"], "say": "Fill in the stakes map.", "how": "What could hurt them? What could they lose?"}, {"type": "cloze", "t": "Harlan Fisk paid his old debt with honey from his own bees. The store holds years of ___ with its customers.", "o": ["trust", "arguments", "trouble"], "a": "trust", "say": "What does the honey story show the store holds?", "how": "Reread the honey story. What did Zeidy give, and get back?"}, {"type": "listen", "hear": "The village sat at the foot of the volcano. Every house held three generations of photos, and the school was the only one for miles.", "o": ["sets the stakes", "shows the hero", "ends the story"], "a": "sets the stakes", "cap": "What does this setting do?", "say": "Listen. What does this setting do?", "how": "What could be lost, and what is the danger?"}]};
  BITE['READ.LIT.L08.22'] = {"band": "M68", "pic": "🔍", "today": "Spot the clues the author plants early", "why": "Good authors never waste a detail. When you spot a clue early, you read like a detective, and the big moments later feel earned, not random.", "ready": [{"q": "Which detail on page 1 is most likely to matter later?", "o": ["the rope on the bridge is frayed", "the sky is blue", "the boy has brown hair"], "a": "the rope on the bridge is frayed"}], "bridge": "READ.LIT.L08.21", "bridgeName": "Flood 1: Setting Sets the Stakes", "watch": {"q": "Chapter 2: clues for later", "m": {"type": "scene", "e": "🔍", "t": "\"The thing about a river,\" the old man said at last, \"is that it don't care what year it is.\""}, "steps": [{"t": "A detail the story did not need yet: the painted gauge on the bridge, and the 1868 height Mr. Whitlock points to, far above Tuli's head. Why tell me this now? I flag it."}, {"t": "A warning in someone's words: \"it don't care what year it is.\" Mr. Whitlock means 1868 could happen again."}, {"t": "The last line, \"In case the river remembers,\" points back to chapter 1: \"Rivers have long memories.\" The author is linking clues."}, {"t": "My test: if a detail is not needed now, and the author slows down for it, it is probably planted. I keep a list and check it in later chapters."}, {"t": "Teach it back: tell your chavrusa one planted clue from this chapter and what you think its payoff will be."}], "a": "The gauge, the 1868 height and Mr. Whitlock's warning are planted for the flood to come."}, "oops": {"q": "\"Every little detail in a chapter is a planted clue.\"", "wrong": "True: everything is a clue", "right": "False: a clue is a detail the author slows down for", "why": "The lady's umbrella is just color. The gauge, with the 1868 height far above Tuli's head, is a clue."}, "ways": ["worked example", "read the chapter", "Mistake Detective", "find the proof", "warning signs in order", "teach it back"], "done": "You can spot planted clues and guess their payoff!", "board": {"one": "A planted clue is an early detail that matters later; the payoff is the moment it matters. Ask: why tell me this now?", "activity": "Boys keep a clue list for the book and add the payoff page when they find it.", "mistakes": ["Calling every detail a clue", "Thinking clues come only at the end", "Missing warnings in what characters say"]}, "do": [{"type": "read", "text": "C68.FLD.02", "say": "Read chapter 2. Hunt for details planted for later.", "how": "When the author slows down for something, ask: why now?"}, {"type": "sort", "mis": true, "bins": ["Read right", "Mistake"], "cards": [["Zeidy's \"just in case\" hints at trouble ahead.", 0], ["Every detail is a planted clue.", 1], ["A detail the story did not need yet may be a clue.", 0], ["Clues come only at the end of a book.", 1]], "say": "Mistake Detective! Read right, or a mistake?", "how": "Is every detail a clue? Where do clues come?"}], "your": [{"type": "proof", "text": "C68.FLD.02", "q": "Which sentence shows how Mr. Whitlock climbs once he starts up his stairs?", "proof": "leaning hard on the rail, his bad leg dragging", "look": "how he climbs to his apartment", "say": "Find the clue about Mr. Whitlock's stairs.", "how": "Read the end of the walk back from the tower."}, {"type": "order", "steps": ["A sky the color of an old nickel", "Fat, lazy drops on the windshield", "Steady rain drums on the awning", "Zeidy at the back window: \"Higher\"", "The radio warns of very heavy rain"], "say": "Put the warning signs in order.", "how": "Follow the day from morning to supper. When did each happen?"}, {"type": "evidence", "q": "Which detail is most likely a planted clue, not just color?", "p": ["Mr. Whitlock will not move to a ground floor.", "Pinny made a pencil holder from a soup can.", "A boy came in to buy a bicycle chain."], "a": 0, "look": "a detail that could trap someone later", "say": "Tap the detail that is a planted clue.", "how": "Which one could matter when the water comes?"}, {"type": "cloze", "t": "Zeidy says his whole life in America is written in the ___. The author plants it to matter when the water comes.", "o": ["ledger", "key machine", "green awning"], "a": "ledger", "say": "Which object does the author plant for later?", "how": "Reread what Zeidy taps and calls his whole life."}, {"type": "listen", "hear": "On the first page, Chaim's grandfather hides an old map behind a loose brick in the cellar. Nobody mentions it again for ten chapters.", "o": ["planted a clue", "told the payoff", "set the theme"], "a": "planted a clue", "cap": "What has the author done?", "say": "Listen. What has the author done?", "how": "Is this early, and will it matter later?"}]};
  BITE['READ.LIT.L08.23'] = {"band": "M68", "pic": "🧭", "today": "Find out why a character makes his choices", "why": "People in stories, like people in life, show who they are by what they choose when it is hard. Reading their reasons teaches you to understand people.", "ready": [{"q": "A boy gives up recess to help a new boy find his class. What does this show?", "o": ["he cares about others", "he dislikes recess", "he is lost"], "a": "he cares about others"}], "bridge": "READ.LIT.L08.22", "bridgeName": "Flood 2: Planted Clues", "watch": {"q": "Chapter 3: why Zeidy stops", "m": {"type": "scene", "e": "🧭", "t": "\"Now is the time for Mincha. The river does not change the time for Mincha.\""}, "steps": [{"t": "The choice: at two o'clock, with the river over the top line, Zeidy stops carrying and davens Mincha in the back office."}, {"t": "His words: \"The river does not change the time for Mincha.\" His words and his action agree."}, {"t": "The cost: Mr. Whitlock says the water is rising a foot an hour. Every minute of davening is a minute not saving stock. The cost shows how much it matters."}, {"t": "Say it with because: Zeidy stops because davening on time matters more to him than the stock, even with the river rising."}, {"t": "Teach it back: tell your chavrusa Zeidy's choice, what it cost, and the reason, in one because sentence."}], "a": "Zeidy davens Mincha on time, even as the river rises, because it matters more to him than the stock."}, "oops": {"q": "\"Zeidy stays at the store because he does not care about the danger.\"", "wrong": "True: he ignores the danger", "right": "False: he stays to save more stock, and plans for the boys", "why": "He says there is more to bring up, and he sends the boys home with Abba. His choices show care, not carelessness."}, "ways": ["worked example", "read the chapter", "Mistake Detective", "find the proof", "match the reason", "teach it back"], "done": "You can explain why a character makes his choices!", "board": {"one": "Motivation is the reason behind a choice. Actions show motivation (what he does, what it costs him); words show motivation (what he says). Say it with because.", "activity": "Boys pick one character in chapter 3 and write: He chose ___ because ___. My proof: ___.", "mistakes": ["Guessing a reason with no proof", "Trusting words that actions do not match", "Ignoring what the choice cost"]}, "do": [{"type": "read", "text": "C68.FLD.03", "say": "Read chapter 3. Watch each choice people make.", "how": "For each choice, ask: why would he do that?"}, {"type": "sort", "mis": true, "bins": ["Read right", "Mistake"], "cards": [["Zeidy stays late to bring more stock up.", 0], ["Pinny comes because Tuli asked him to.", 1], ["Mr. Whitlock comes to warn them about the gauge.", 0], ["Davening Mincha then cost Zeidy nothing.", 1]], "say": "Mistake Detective! Read right, or a mistake?", "how": "Check each reason against what the chapter shows."}], "your": [{"type": "proof", "text": "C68.FLD.03", "q": "Which sentence shows Pinny wanted to come even before the trip was decided?", "proof": "as if he had been ready since the night before", "look": "Pinny in his raincoat and boots", "say": "Find the proof Pinny wanted to come.", "how": "Read the first page. What was Pinny already wearing?"}, {"type": "evidence", "q": "Why does Zeidy speak \"very calmly\" on the phone to Abba?", "p": ["He does not want the family at home to worry.", "He thinks the water is going down now.", "He is too tired from carrying boxes."], "a": 0, "look": "what Zeidy says next", "say": "Tap Zeidy's reason for staying calm.", "how": "Reread what he tells Abba to tell Chana."}, {"type": "match", "pairs": [["Zeidy: \"Sleep. I will watch.\"", "keep the boys safe"], ["Mr. Whitlock comes in dripping from the gauge", "warn his neighbors"], ["A man fills sacks with sand", "protect his house"]], "say": "Match each choice to its reason.", "how": "What did each person want?"}, {"type": "cloze", "t": "\"A warm room and good company. The rest is only food.\" Zeidy values ___ more than things.", "o": ["people", "the stock", "the food"], "a": "people", "say": "What do Zeidy's words show he values?", "how": "What does he call the most important thing?"}, {"type": "listen", "hear": "Every Friday, Avraham walks an hour to bring challah to an old man across town. He never misses a week, even in snow.", "o": ["his actions", "the weather", "his name"], "a": "his actions", "cap": "What shows his motivation?", "say": "Listen. What shows why he does it?", "how": "Does he say why, or show it?"}]};
  BITE['READ.LIT.L08.24'] = {"band": "M68", "pic": "⏱️", "today": "See how the author controls the speed of the night", "why": "Authors can make a minute feel like an hour, or an hour fly past. Seeing how they do it lets you feel the story more, and write scenes that grip.", "ready": [{"q": "Which line feels faster?", "o": ["\"He ran. He fell. Silence.\"", "\"He walked slowly along the shady path, thinking.\"", "\"It was a calm day.\""], "a": "\"He ran. He fell. Silence.\""}], "bridge": "READ.LIT.L08.23", "bridgeName": "Flood 3: Why He Chose", "watch": {"q": "Chapter 4: the speed of the night", "m": {"type": "scene", "e": "⏱️", "t": "\"The water,\" he said in a very serious voice, \"is on step one.\""}, "steps": [{"t": "A time marker: Zeidy shines the flashlight on his watch: \"Ten minutes to one.\" From here on, I feel every minute."}, {"t": "A ticking count: Tuli gives Pinny a job, to call out each step the water covers. The count becomes the clock of the chapter."}, {"t": "Short sentences at the scary moments: \"He went down.\" Three words, and we follow Zeidy into the water."}, {"t": "Cutting back and forth: Zeidy at the safe, then Pinny's count, then Zeidy again. Each cut makes me wait, and the wait is the suspense."}, {"t": "Teach it back: tell your chavrusa three tools that speed up this chapter, with one example of each."}], "a": "A time marker, Pinny's ticking count and short sentences make the night feel fast and tight."}, "oops": {"q": "\"Pinny's counting just slows the story down.\"", "wrong": "True: it interrupts the action", "right": "False: the count is the clock that builds suspense", "why": "Each new step tells us the water is higher while Zeidy is still down there. We hold our breath."}, "ways": ["worked example", "read the chapter", "Mistake Detective", "find the proof", "the count in order", "teach it back"], "done": "You can show how pacing builds suspense!", "board": {"one": "Pacing is the speed of a story. Short sentences, a ticking count and time markers speed it up; a long sentence can slow time for one big picture.", "activity": "Boys rewrite a calm paragraph about a fire drill using short sentences and a count, then read both aloud.", "mistakes": ["Thinking short sentences are lazy writing", "Missing the count as a clock", "Not noticing a long sentence that slows time"]}, "do": [{"type": "read", "text": "C68.FLD.04", "say": "Read chapter 4. Feel how fast the night moves.", "how": "Notice short sentences, the count, and clock times."}, {"type": "sort", "mis": true, "bins": ["Read right", "Mistake"], "cards": [["Short lines make the moment feel fast.", 0], ["Short sentences mean the writer was lazy.", 1], ["A long sentence can slow time for a big picture.", 0], ["Tuli's short shouts slow the scene down.", 1]], "say": "Mistake Detective! Read right, or a mistake?", "how": "What does each tool do to the speed?"}], "your": [{"type": "proof", "text": "C68.FLD.04", "q": "Which short line from Zeidy marks the moment the water gets into the store?", "proof": "It is inside", "look": "Zeidy's words on the first page", "say": "Find Zeidy's short line about the water.", "how": "Read the end of the first page."}, {"type": "order", "steps": ["Water reaches the bottom step", "Zeidy takes off his shoes", "A paint can lifts and floats", "The safe door sticks", "A voice calls through the wall"], "say": "Put the night's moments in order.", "how": "Follow Pinny's count as the water climbs."}, {"type": "evidence", "q": "Why does Pinny say \"Step five\" right after Zeidy says the safe door is stuck?", "p": ["The water rises while Zeidy is still stuck.", "Pinny wants to show he can count well.", "It tells how tall the stairs really are."], "a": 0, "look": "what the count does at that moment", "say": "Tap why the count comes right then.", "how": "What is happening to Zeidy when the number goes up?"}, {"type": "cloze", "t": "Tuli shouts, \"Zeidy, please! Leave it! Come back up!\" Short bursts like these ___ the pace.", "o": ["speed up", "slow down", "stop"], "a": "speed up", "say": "What do Tuli's short shouts do?", "how": "Say the line out loud. Does it feel fast or slow?"}, {"type": "listen", "hear": "The bell rang. No one moved. Again. Louder. Then the door handle turned.", "o": ["short sentences", "a long list", "a flashback"], "a": "short sentences", "cap": "What builds the speed?", "say": "Listen. What makes this feel fast?", "how": "Count the words in each sentence."}]};
  BITE['READ.LIT.L08.25'] = {"band": "M68", "pic": "⚖️", "today": "Find the choice that turns the whole story", "why": "Every story has a moment where everything hangs on one choice. Finding it shows you what the story is really about, and who the character really is.", "ready": [{"q": "In a story, where is the tension usually highest?", "o": ["near the turning point", "on the first page", "in the title"], "a": "near the turning point"}], "bridge": "READ.LIT.L08.24", "bridgeName": "Flood 4: Pacing the Night", "watch": {"q": "Chapter 5: the turn", "m": {"type": "scene", "e": "⚖️", "t": "\"Paper,\" Zeidy said. \"It is only paper, Naftali. Amos is a person.\""}, "steps": [{"t": "Highest tension: water at Zeidy's waist, the ledger in his arms, Mr. Whitlock calling through the wall. Tuli sees \"the face of a man doing arithmetic.\""}, {"t": "The choice: \"He opened his arms.\" The cash box sinks; the ledger drifts away. If he had held on, there would be no rescue."}, {"t": "His words explain it: \"It is only paper, Naftali. Amos is a person.\""}, {"t": "The change: in chapter 4 he waded in for the ledger; now he lets it go. The story turns from saving things to saving a person."}, {"t": "Teach it back: tell your chavrusa the climax, the choice, and how Zeidy is different before and after."}], "a": "Zeidy lets the ledger go to save Mr. Whitlock: the choice that turns the story from things to a person."}, "oops": {"q": "\"The climax is always on the very last page.\"", "wrong": "True: the end is the climax", "right": "False: the climax is where the story turns", "why": "Here the turn comes when Zeidy opens his arms. The rescue and the dawn come after it."}, "ways": ["worked example", "read the chapter", "Mistake Detective", "find the proof", "plot map", "teach it back"], "done": "You can find the climax and show how it changes a character!", "board": {"one": "The climax is the moment of highest tension, often the choice that turns the story. Compare the character before and after to see the change.", "activity": "Boys retell chapter 5 as if Zeidy had held on to the ledger, and see how much of the story disappears.", "mistakes": ["Thinking the climax is the last page", "Picking the scariest picture instead of the turn", "Not comparing the character before and after"]}, "do": [{"type": "read", "text": "C68.FLD.05", "say": "Read chapter 5. Find where the story turns.", "how": "Ask: which moment changes everything after it?"}, {"type": "sort", "mis": true, "bins": ["Read right", "Mistake"], "cards": [["Tuli's offer to cross shows he has changed.", 0], ["The climax is the brown lake at dawn.", 1], ["The roof rescue follows from Zeidy's choice.", 0], ["Tuli is the same boy as in chapter 1.", 1]], "say": "Mistake Detective! Read right, or a mistake?", "how": "Where is the turn? Who has changed?"}], "your": [{"type": "proof", "text": "C68.FLD.05", "q": "Which words give Zeidy a clear order, showing Tuli takes charge?", "proof": "Go up yours and come across", "look": "what Tuli shouts back across the gap", "say": "Find the proof that Tuli takes charge.", "how": "Read what Tuli shouts to Zeidy from the door."}, {"type": "evidence", "q": "What do Zeidy's words \"Now we stop counting. Now we work\" show?", "p": ["The story turns from waiting to acting.", "The water has finally stopped rising.", "Pinny counted the steps the wrong way."], "a": 0, "look": "what changes after this line", "say": "Tap what Zeidy's words show.", "how": "What do they do right after he says it?"}, {"type": "storymap", "slots": ["Rising action", "The climax", "Falling action"], "cards": ["the water climbs the steps", "Zeidy lets the ledger go", "dawn shows a brown lake"], "extra": ["Tuli wishes he were at camp"], "say": "Place each moment on the plot map.", "how": "Before the turn, the turn, after the turn."}, {"type": "cloze", "t": "In chapter 1 Tuli wished he were at camp. In chapter 5 he says, \"I'm lighter. I'll go.\" Tuli has ___.", "o": ["grown brave enough to lead", "stayed the boy who wished for camp", "become afraid of the river"], "a": "grown brave enough to lead", "say": "Compare Tuli before and after.", "how": "What did he want in chapter 1? What does he choose now?"}, {"type": "listen", "hear": "For weeks Eli saved for a new bike. The day he had enough, his friend's family lost everything in a fire. Eli emptied his jar into their mailbox.", "o": ["emptying the jar", "saving for weeks", "the new bike"], "a": "emptying the jar", "cap": "Which moment is the climax?", "say": "Listen. Where does this story turn?", "how": "Which choice changes everything?"}]};
  BITE['READ.LIT.L08.26'] = {"band": "M68", "pic": "📜", "today": "Compare the novel with the real 1972 flood", "why": "The Flood is made up, but Agnes was real. Seeing what the author kept and what was invented shows you how a story can be true to history without being a history book.", "ready": [{"q": "A story that mixes real history with made-up people is called...", "o": ["historical fiction", "a biography", "a news report"], "a": "historical fiction"}], "bridge": "READ.LIT.L08.25", "bridgeName": "Flood 5: The Turning Point", "watch": {"q": "Chapter 6 next to the real flood", "m": {"type": "scene", "e": "📜", "t": "Tropical Storm Agnes had flooded towns from Virginia to New York."}, "steps": [{"t": "A true account: In June 1972 the remains of Hurricane Agnes poured rain on Maryland. On the night of June 21 to 22 the Patapsco flooded lower Main Street in Ellicott City; at the railroad bridge the water stood about 14 and a half feet deep. The flood washed out bridges across the Patapsco. Seven people died along the river; nineteen died in Maryland."}, {"t": "Kept from history: the radio in chapter 6 gives the same death counts, seven along the Patapsco and nineteen in Maryland. Mr. Whitlock's guess in chapter 5 matches the real depth: fourteen and a half feet."}, {"t": "Invented by the author: Brenner's store, the wrecked counter, the empty safe, the Brenners, Mr. Whitlock. No history book names them."}, {"t": "Why: the numbers tell how big the flood was. The invented store and family let me feel what one night meant to real people, without changing any real person's story."}, {"t": "Teach it back: tell your chavrusa one fact the novel keeps, one thing it invents, and why the author mixes them."}], "a": "The novel keeps the real date, place and numbers, and invents the Brenners to make history personal."}, "oops": {"q": "\"If a novel has made-up people, it cannot be true to history.\"", "wrong": "True: made up means false", "right": "False: invented people can live inside real facts", "why": "The Brenners are invented, but the date, the town, the washed-out bridge and the numbers are real."}, "ways": ["worked example", "read the chapter", "Mistake Detective", "find the proof", "history map", "teach it back"], "done": "You can compare a novel with the real history it uses!", "board": {"one": "Historical fiction keeps real facts and invents people and scenes. Ask what is kept from history, what is invented by the author, and why.", "activity": "Boys make a two-column chart for chapter 6: Kept from history / Invented, with one line on why.", "mistakes": ["Thinking invented people make a novel false", "Thinking every detail must be real", "Not asking why the author invented"]}, "do": [{"type": "read", "text": "C68.FLD.06", "say": "Read chapter 6. What really happened, and what is invented?", "how": "Ask of each detail: would a history book say this?"}, {"type": "sort", "mis": true, "bins": ["Read right", "Mistake"], "cards": [["The Brenners' store is made up.", 0], ["Mr. Whitlock was a real man in 1972.", 1], ["Historical fiction must change the real facts.", 1], ["A made-up family can be true to the real flood.", 0]], "say": "Mistake Detective! Read right, or a mistake?", "how": "What is real, and what did the author invent?"}], "your": [{"type": "proof", "text": "C68.FLD.06", "q": "A history says families fled \"with only the clothes they wore.\" Which words in chapter 6 keep that fact?", "proof": "who had come up the hill in the night with nothing", "look": "the families on upper Main Street", "say": "Find where the chapter keeps this fact.", "how": "Read the first page, about the people on upper Main Street."}, {"type": "storymap", "slots": ["From history", "Built on it in the story", "Why the author did it"], "cards": ["the bridge into town washed away", "Abba drives nearly six hours around", "to show what one lost bridge cost a family"], "extra": ["Abba flies in by helicopter"], "say": "Fill in the history map.", "how": "Real fact, the invented scene on top of it, and why."}, {"type": "cloze", "t": "Chapter 1 says Monday was June 19, 1972. So Erev Shabbos in chapter 6 is June ___, a real Friday.", "o": ["23", "22", "24"], "a": "23", "say": "Work out the real date of Erev Shabbos.", "how": "Count from Monday the 19th to Friday."}, {"type": "evidence", "q": "Why might the author invent Mr. Whitlock instead of telling about a real flood victim?", "p": ["to tell a true-feeling story about no real person", "to change what really happened in the flood", "because no one lived by the river in 1972"], "a": 0, "look": "what an invented person lets the author do", "say": "Tap why the author invented him.", "how": "Whose life would a made-up story about a real man change?"}, {"type": "listen", "hear": "Radio stations read out how many people the storm had killed.", "o": ["the drive home", "the phone call", "the roadblock"], "a": "the drive home", "cap": "Which scene keeps this fact?", "say": "Listen. Which scene in chapter 6 keeps this?", "how": "Picture each scene. Where would a news report be heard?"}]};
