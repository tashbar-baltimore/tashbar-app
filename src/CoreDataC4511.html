(function () {
  var P = {
    c45_avflight: { title: 'Up Over Baltimore', text: 'By Dovid Lerner\nMy uncle, Reb Mordechai, has flown airplanes for twenty years. Last Sunday, he took me up in his small plane for the first time.\nBefore we took off, Uncle Mordechai walked all the way around the plane. He checked the wings, the tires and the propeller. Then he read a checklist out loud, one line at a time. I buckled my seat belt twice, just to be sure.\nThe engine roared, and the whole plane shook. We raced down the runway, faster and faster. Then, all at once, the bumping stopped. We were in the air! My stomach did a flip, and I grabbed the edge of my seat.\nBelow us, the houses looked like tiny blocks. I spotted the harbor shining in the sun and a long gray train crawling along its track. I wanted to remember everything.\nUncle Mordechai talked into his headset to a voice on the radio. He looked calm, but I wondered if he was ever scared up here. I did not ask.\nWhen we landed, my legs felt wobbly. Uncle Mordechai shook my hand as if I were a real pilot. "Next time," he said, "you can hold the controls for a minute."\nI could not stop smiling all the way home.' },
    c45_avthird: { title: 'Up Over Baltimore, Told from Outside', text: 'Last Sunday, Reb Mordechai Lerner took his nephew Dovid up in his small plane for the first time. Before takeoff, he walked around the plane and checked every part. Dovid buckled his seat belt twice.\nAs the plane raced down the runway, Dovid\'s stomach did a flip. He grabbed the edge of his seat.\nReb Mordechai talked calmly into his headset. Inside, though, he was thinking about the wind. It was gustier than he liked, so he kept a careful eye on it. He did not want Dovid to worry, so he said nothing.\nBack home, Dovid\'s little brother Shuki pressed his nose against the window. He was hoping to see the plane fly over the house.\nWhen they landed, Reb Mordechai felt proud of his nephew. Dovid could not stop smiling all the way home.' },
    c45_avcontest: { title: 'The Paper Airplane Contest', text: 'By Tzvi Hirsch Gold\nMr. Halpern gave every boy in our class one sheet of paper. "Fold the best airplane you can," he said. "The plane that flies farthest down the hall wins."\nI folded mine fast, with long, pointy wings. Binyamin folded his slowly. He pressed every fold flat with his thumbnail.\nMy plane went first. I threw it as hard as I could. It shot up, flipped over and crashed into the wall. Everyone laughed, and my face felt hot. I wanted to disappear.\nThen Binyamin stepped up. He held his plane gently and gave it a smooth push. It glided all the way past the water fountain and landed near the office door. Mr. Halpern measured it with a long tape. "Forty-two feet!" he called out.\nI walked over to Binyamin. "How did you do that?" I asked.\n"Do not throw it hard," he said. "Let the air carry it."\nOn my second try, I folded more carefully and threw it softly. It flew halfway down the hall. It did not win, but I felt proud of it.\nMr. Halpern smiled and wrote something on his clipboard.' },
    c45_avnews: { title: 'Dovid Flies Over Baltimore', text: 'By Avrumi Katz, for the Glen Avenue News\nLast Sunday, our classmate Dovid Lerner flew in a small airplane for the first time. His uncle, Reb Mordechai Lerner, is a pilot. Only the two of them were in the plane.\nOn Monday, I asked Dovid to tell me all about it. Dovid says the engine was so loud that the whole plane shook. He says his stomach did a flip when the wheels left the ground. From the air, he could see the harbor and a long gray train.\nReb Mordechai has been a pilot for twenty years. I also looked up some facts at the library. Many small planes like his have four seats and one propeller. They fly much lower and slower than a big passenger jet.\nDovid says his uncle promised him a turn at the controls next time. The whole class wants to hear about it!' },
    c45_avfirst: { title: 'The Day the Wright Brothers Flew', text: 'On December 17, 1903, two brothers from Dayton, Ohio, made history on the windy sand hills of North Carolina. Wilbur and Orville Wright ran a bicycle shop. For four years, they had studied birds, flown kites and gliders, and tested more than two hundred small wing shapes.\nTheir airplane, the Flyer, had two long wings, one above the other. A small engine, built with the help of their mechanic, Charlie Taylor, turned two propellers.\nThat cold morning, a strong wind blew across the sand hills near Kitty Hawk. Five men from the area came to watch. At about 10:35, with the engine already running, Orville lay down on the bottom wing. The Flyer rolled along a wooden rail and lifted into the air. It flew for 12 seconds and covered 120 feet, about the length of three school buses.\nThe brothers took turns and made four flights that day. We know the times and distances because they wrote them down. One of the five men, John Daniels, snapped a photograph of the first flight. That photograph still helps us see the moment today.\nToday, the Flyer hangs in a museum in Washington, D.C.' },
    c45_avpilot: { title: 'Up Before the Sun', text: 'By Captain Rafael Benaim, Yehuda Benaim\'s uncle\nI am an airline captain. Here is what my workday was like last Tuesday.\nMy alarm rang at four o\'clock in the morning. I said Modeh Ani, packed my tefillin and a sandwich, and drove to the airport in the dark.\nBefore every flight, I walk all the way around the airplane with a flashlight. That morning, I checked the tires, the wings and the two big engines. Everything looked right.\nIn the cockpit, my first officer and I read our checklist together, line by line. Then the control tower gave us permission to take off. I pushed the throttles forward, and the jet roared down the runway. When the wheels left the ground, I felt the same little thrill I felt on my very first flight.\nWe climbed up through gray clouds. Suddenly we burst out on top, and the sun was rising over a sea of white. I have seen it a thousand times, and it still makes me smile.\nTwo hours later, we landed in Florida. After the passengers were off, I davened Shacharis in a quiet corner of the airport.' },
    c45_avzeidy: { title: 'Zeidy\'s First Flight', text: 'By Binyamin Yusupov\nLong before I was born, my Zeidy Yusupov flew in an airplane for the first time. He was eleven years old. His family was moving from Uzbekistan to a new home in America. Last Shabbos, while we ate plov, Zeidy told me the whole story. On Sunday, I wrote it all down.\nZeidy says he wore his best jacket and held his little brother\'s hand all the way up the stairs to the plane. He had never seen anything so big. When the engines started, the noise made his teeth buzz.\nHe says he did not sleep at all. He pressed his face to the window and watched the clouds below turn pink, then orange, then gold. A kind flight attendant gave him a cup of tea with two cubes of sugar. He kept the paper wrapper from the sugar for years.\nWhen the plane landed, everyone clapped. Zeidy says he felt as if he were stepping into a brand-new world.\n"That was the first of many flights," Zeidy told me. "But it is the one I remember best."' },
    c45_avpass: { title: 'The First Passengers', text: 'After December 1903, the Wright brothers kept making their airplane better. But for almost five years, only the pilot rode in it.\nIn May 1908, the brothers went back to the sand hills near Kitty Hawk to test a newer Flyer. This one had two seats side by side, so the pilot could sit up and take a passenger along. On May 14, a mechanic named Charlie Furnas climbed into the seat next to Wilbur. He became the first airplane passenger. Their flight lasted less than half a minute. Later that day, Charlie flew again, this time with Orville, for a few minutes.\nSix years later, on January 1, 1914, the first airline with airplanes on a regular schedule began flying across Tampa Bay in Florida. The pilot, Tony Jannus, flew a flying boat that took off and landed on water. His first passenger was Abe Pheil, a former mayor of St. Petersburg. The trip took about 23 minutes. By boat or train, going around the bay took hours.\nToday, millions of people fly on airplanes every day.' },
    c45_avtwo1903: { title: 'December 17, 1903: Two Accounts', text: 'Account 1: An imagined diary page. Its words are made up for this lesson, told the way Orville Wright might have told them. The facts in it are real.\nThursday, December 17, 1903. A cold wind blew hard all morning, and ice covered the puddles near our camp. Wilbur and I waited, hoping the wind would calm down. It did not, so we decided to try anyway. It was my turn to fly. I lay down on the lower wing, and my heart was pounding. The engine roared and shook. Wilbur ran beside the wing to hold it level. Then the bumping stopped. I was flying! Cold air rushed past my face. The machine bobbed up and down, and it was hard to keep it steady. Twelve seconds later, I came down on the sand. My hands are so cold that I can hardly write.\nAccount 2: From a history book, written long after.\nOn December 17, 1903, near Kitty Hawk, North Carolina, Orville Wright made the first flight in an airplane with an engine. It lasted 12 seconds and covered 120 feet. The wind that day blew at more than 20 miles an hour. The brothers took turns and made four flights. The longest, by Wilbur, lasted 59 seconds and covered 852 feet. After the flights, the brothers walked to the weather station in Kitty Hawk and sent a telegram home to their father in Dayton, Ohio. At first, few people believed the news. Today, the Flyer hangs in a museum in Washington, D.C.' },
    c45_avglide: { title: 'The Glider Contest: Two Accounts', text: 'Account 1: By Binyamin Yusupov, who flew a glider that day.\nOn Tuesday, our class held a glider contest in the park behind the yeshiva. When Mr. Halpern called my name, my hands were shaking. I held my balsa glider up high and waited for the breeze to stop. Then I let it go. It floated over the grass, turned left and landed softly near the big oak tree. My heart was pounding. Then Dovid threw his glider. It sailed past the oak, all the way to the fence. Dovid won! I felt a little sad, but I clapped for him anyway. Next time, I will sand my wings smoother, the way Dovid did.\nAccount 2: By Nosson Abergel, for the Glen Avenue News.\nOn Tuesday, I was home sick, so I missed the glider contest. My classmates and Mr. Halpern told me all about it. Twenty boys flew balsa gliders in the park behind the yeshiva. Each boy had one throw. Dovid Lerner won. His glider flew 64 feet. Binyamin Yusupov came in second, with 51 feet. Next week, the winners will show the Grade 2 boys how to build gliders of their own.' },
    c45_avlift: { title: 'How Wings Lift', text: 'Watch a big jet race down the runway. Faster and faster it goes. Then its nose tips up, and the whole heavy plane rises into the sky. How can something so heavy fly?\nThe secret is in the wings. An airplane wing is curved on top and tilted up a little at the front. As the plane moves forward, air flows over and under the wing.\nThe shape and tilt of the wing bend the moving air downward. When the wing pushes air down, the air pushes the wing up. This upward push is called lift.\nThere is another way to see it. Air rushing over the curved top of the wing speeds up, and its pressure drops. Now the air under the wing presses up harder than the air on top presses down.\nThe faster a plane moves, the more lift its wings make. That is why a jet needs a long runway. It must go fast enough for lift to carry its weight.\nThe Wright brothers learned about lift by watching birds and testing small wings. Today\'s giant jets fly because of the same idea.' },
    c45_avtunnel: { title: 'The Wind Tunnel', text: 'In 1901, Wilbur and Orville Wright had a big problem. Their glider did not lift as much as they expected. The tables of numbers that other experts had made seemed to be wrong. So the brothers decided to find the right numbers themselves.\nIn their bicycle shop in Dayton, they built a wind tunnel. It was a wooden box about six feet long. A fan at one end blew a steady stream of air through it.\nInside the box, they placed small model wings made of thin metal. They measured how hard the air pushed on each one. They tested more than two hundred wing shapes: flat, curved, thick, thin, long and short.\nTheir careful work paid off. In 1902, they built a new glider with longer, thinner wings. It flew far better than their old ones. The brothers made hundreds of glides over the sand hills near Kitty Hawk.\nNow they were ready for the next step: adding an engine.' }
