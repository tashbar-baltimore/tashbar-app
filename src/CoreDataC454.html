    c45_rainymap: { title: 'Avrumi\'s Rainy-Day Map', text: 'It rained all Sunday on Glen Avenue, and Avrumi Katz had a plan. He spread a huge sheet of paper on the dining room table and began to draw a map of the whole neighborhood, house by house.\nHe had drawn only three houses when his little brother Shloimy climbed onto a chair. "Can I help?"\n"Not now," said Avrumi. "This has to be perfect."\nTen minutes later, his sister Chani asked if she could color the park. Then Mendy and Yossi wanted to add the bakery. Avrumi sent each of them away. The house grew loud with bored children, and the map grew slowly. By lunchtime, Avrumi had a headache and only one street.\nIma looked at the map and then at the bored faces. "Maybe they know things you don\'t," she said quietly.\nAvrumi sighed and handed out pencils. Shloimy drew the fire hydrant where the mail carrier always stops to talk. Chani added every tree in the park. Mendy and Yossi remembered the gray cat that sleeps on the Golds\' steps.\nBy the time Abba came home, the map covered the whole table. It was the best map Avrumi had ever made, because it held what everyone loved about Glen Avenue.' },
    c45_shofar: { title: 'Eli\'s Shofar', text: 'In the first week of Elul, two months after his bar mitzvah, Eli Mizrahi\'s grandfather gave him a small shofar. "This year," said Saba, "you will blow for the old men in our shul who cannot walk to the big minyan."\nEli put the shofar to his lips and blew. Nothing came out but a sound like air leaving a bicycle tire. He tried again. A squeak. His cousin Raphael laughed so hard he fell off the couch.\nEvery day after school, Eli practiced on the back porch. He pressed his lips tight. He blew softer, then harder. Some days he wanted to give the shofar back. One afternoon he blew until he felt dizzy, and still only a squeak came out.\nIn the third week, something changed. A short, rough note came out. The next day it was longer. By the last week of Elul, Eli could blow a clear tekiah that made the neighbor\'s dog bark.\nOn Rosh Hashanah, the old men in Saba\'s shul listened in silence as Eli blew every sound. Afterward, the oldest man shook his hand. "That," he said, "is the sound of a young man who did not give up."' },
    c45_firstloss: { title: 'The First Round', text: 'Binyamin Yusupov had played chess with Zeidy Yusupov every Motzaei Shabbos for two years. When the Baltimore Junior Chess Tournament began, he was sure he would win his first game.\nHe lost in nineteen moves.\nBinyamin walked out of the room with his face burning. He sat on the steps outside and told Zeidy he wanted to go home. "I am not good at chess," he said. "I never want to play again."\nZeidy sat down beside him. He did not argue. He took out a small notebook. "Before we go," he said, "show me the game. Every move."\nBinyamin did not want to. But slowly he set up the pocket chessboard and played the game again, move by move. On move eleven, he stopped. "Here," he said. "I moved my queen out too early. He chased it all over the board."\n"Good," said Zeidy. "Now you know something you did not know this morning."\nBinyamin played his second game slowly. Before every move, he asked himself, "Is my queen safe?" The game took more than an hour. When it ended, he had won.\nThat night he wrote in Zeidy\'s notebook: "Lost game 1. Learned about my queen."' },
    c45_challos: { title: 'The Friday Tray', text: 'Friday mornings at Gold\'s Bakery were the busiest of the week. By nine o\'clock, the line stretched out the door, and everyone wanted challah.\nTzvi Hirsch Gold was helping his father before school. "Carry this tray to the front," said Mr. Gold. "Carefully."\nTzvi Hirsch hurried. He always hurried. Halfway across the kitchen, his sneaker caught on a box. The tray tipped, and twelve golden challos rolled across the floor.\nFor one second, nobody had seen. He could push them under the table and say nothing. His heart was pounding.\nInstead, he walked straight to his father. "Abba, I dropped a whole tray. I was rushing."\nMr. Gold closed his eyes for a moment. Then he nodded. "Thank you for telling me right away. There is more dough rising in the back. Wash your hands."\nTzvi Hirsch braided dough more carefully than ever before. His father showed him how to tuck the ends. The new challos came out of the oven just in time.\nWhen the last customer left, Mr. Gold put a hand on his shoulder. "Challos I can bake again," he said. "A son who tells the truth, I cannot buy."' },
    c45_quill: { title: 'My Abba\'s Quill (a poem by Avrumi Katz)', text: 'Each night my Abba sits to write\nbeneath the lamp\'s warm yellow light.\nHe dips his quill and shapes one letter,\nthen looks again to make it better.\n\nI watch him from the kitchen chair.\nOne word an hour? It isn\'t fair!\nI race my pencil through my math.\nI like a quick and easy path.\n\n"Why so slow?" I ask him, yawning.\n"You will be writing here till morning!"\nHe smiles, his eyes still on the line:\n"A rushing hand won\'t write it fine."\n\nIn shul there is a Megillah, old,\nits parchment brown, its letters bold.\nA sofer wrote it long ago,\none careful letter, row by row.\n\nA hundred years, and every line\nis still as clear and still as fine.\nEach Purim, when it\'s read aloud,\nI hear it clearly through the crowd.\n\nSo now, whenever I start to race,\nI think of Abba\'s patient face.\nThe careful work is work that lasts,\nand lasting things are seldom fast.' },
    c45_oak: { title: 'The Oak Behind the Shul (a poem)', text: 'Behind our shul there is an oak,\nas old as all the oldest folk.\nIts bark is rough, its trunk is wide,\nand squirrels race along its side.\n\nLast winter, on a stormy night,\nthe wind howled out with all its might.\nIts branches bent down low and groaned;\nthe windows rattled, shutters moaned.\n\nAt dawn I ran out in the cold.\nThe fence was down, the trash cans rolled\nacross the yard. But there it stood,\nthe oak, still tall in its old wood.\n\nI asked my Zeidy, "How can that be?\nThe wind was stronger than the tree!"\nHe said, "Its roots go deep and wide,\nmuch deeper than the part outside."\n\nI think a person is like that.\nWhen troubles come and knock you flat,\nwhat holds you up is underground:\nthe roots you planted, safe and sound.\n\nSo I will plant my roots down deep,\nin learning and the friends I keep,\nin Shabbos meals and family,\nso I can stand just like that tree.' },
    c45_siddur: { title: 'The Siddur on the Bus', text: 'On the way home from yeshiva, Yehuda Benaim found a small, worn siddur on the seat of the number 27 bus. Its leather cover was cracked, and the pages were soft from years of davening.\nYehuda opened it, looking for a name. On the first page, in faded blue ink, someone had written: "To our son Mordechai, on his bar mitzvah."\n"There is no address," said Dovid. "You\'ll never find him."\nBut Yehuda was a detective. He took out his clue notebook and turned every page of the siddur. Tucked in the back was a small card from the Shaarei Tefillah shul, with the times for davening.\nThe next morning, Yehuda\'s Abba took him to the early minyan at Shaarei Tefillah. Near the window sat an old man, davening from a borrowed siddur and looking sad.\nYehuda walked up and held out the worn siddur. "Is this yours, Reb Mordechai?"\nThe old man\'s hands began to shake. "My parents gave me this," he whispered. "I thought it was gone forever."\nThat afternoon, Yehuda wrote in his notebook: "Case closed. Smallest case. Biggest smile."' },
    c45_robot: { title: 'Dovid\'s Robot', text: 'The science fair was on Thursday, and Dovid Lerner\'s robot was almost ready. It could roll forward, turn left and pick up a plastic cup with its claw.\nOn Wednesday night, Dovid pressed the switch for one last test. The robot rolled two inches, made a grinding noise and stopped. Its claw hung open.\nDovid took the robot apart. He checked every wire. He put it back together. It still would not move. By nine o\'clock, his eyes were stinging.\nAvrumi had offered to help twice that week. Both times Dovid had said, "I can do it myself." Now he stared at the phone for a long time. Finally, he called.\nAvrumi came over with his sketchbook. "Show me how it works," he said, "and I\'ll draw it." As Dovid explained, Avrumi drew a diagram of every gear. Halfway through, Dovid stopped talking and pointed at the drawing. "There," he said. "That gear is on backwards."\nTen minutes later, the robot rolled across the kitchen floor and lifted a cup.\nOn Thursday, the judge asked Dovid who had built the robot. "I did," said Dovid. "But Avrumi helped me see the problem."' },
    c45_twins: { title: 'One Promised Hour', text: 'On Sunday afternoon, Tzvi Hirsch Gold\'s Ima needed to bring a pot of soup to a neighbor who had just come home from the hospital. "Tzvi Hirsch," she said, "can you watch the twins for one hour? I will be back by three."\nTzvi Hirsch looked out the window. Down the block, the Glen Avenue Crew was choosing teams for a ball game. "Okay," he said. "I promise."\nThe moment the door closed, both babies began to cry. Tzvi Hirsch tried a bottle. He tried the rattle. He tried walking up and down the hall. The crying only got louder.\nThrough the window, he heard Binyamin call, "Tzvi Hirsch, we need you!" He wanted to run outside so badly that his feet itched. But he had promised.\nSo he sat down on the rug and made the silliest face he knew. One twin stopped crying and stared. Tzvi Hirsch made an even sillier face and sang the bakery song his Zeidy used to sing. Soon both twins were laughing.\nAt three o\'clock, Ima found all three of them asleep on the rug. She covered her son with a blanket and smiled.' },
    c45_lastbus: { title: 'The Last Bus', text: 'Meir Shapiro and his cousin Ezra went to the library after school to finish a project about the Chesapeake Bay. The last bus home left at 5:15. "We have plenty of time," said Ezra, opening a book about crabs.\nThe boys read about blue crabs and oysters. They copied a map of the bay. When Meir finally looked at the clock, it said 5:22.\nThey ran outside just in time to see the bus turn the corner and disappear.\nIt was getting dark and cold. Ezra wanted to walk home, but home was four miles away. Meir remembered what his Abba always said: "When you are stuck, stop and think first." The boys went back inside, and the librarian let them use the phone to call home.\nTwenty minutes later, Meir\'s Abba pulled up in the family van. He was quiet for a while. Then he said, "I am glad you called, and did not try to walk home in the dark."\nThe next day, both boys set an alarm on Meir\'s watch for 5:00.' },
    c45_basement: { title: 'The Noise in the Basement', text: 'After Melave Malka, Yehuda and Avrumi stayed at Dovid\'s house to finish a puzzle. The house was dark and quiet. Suddenly, a strange beeping came from the basement.\n"Did you hear that?" whispered Avrumi.\n"It\'s nothing," said Dovid. "Probably the dryer."\nBeep. Beep. BEEEEP.\n"That is not a dryer," Yehuda said slowly. He pulled out his notebook. "It beeps every ten seconds. Something is counting."\nAvrumi grabbed Dovid\'s sleeve. "Maybe we should get your Abba."\n"My Abba is asleep," Dovid groaned. "He has to get up early for Shacharis."\nThe three boys crept down the stairs. Dovid flipped on the light. On the workbench sat a small metal box covered in wires. A red light blinked on top.\n"Oh no," said Dovid, slapping his forehead. "It\'s my moisture alarm! I built it last week to tell us if the basement floods."\nYehuda pointed at the floor. A thin stream of water was running from the washing machine.\n"It works!" shouted Dovid. "My alarm really works!"\n"Great," Avrumi sighed. "Now go wake up your Abba."' },
    c45_bakerykey: { title: 'The Missing Key', text: 'It was almost Shabbos, and the door of Gold\'s Bakery would not lock.\n"Where is the key?" shouted Tzvi Hirsch, pulling open every drawer behind the counter.\n"Shh," whispered Binyamin, pointing at the stroller by the door. "The twins just fell asleep."\nTzvi Hirsch dropped his voice. "Sorry. But Abba gave it to me this morning. He said, \'Don\'t lose it.\'"\n"Think," said Binyamin calmly. "Where were you when he gave it to you?"\n"In the back, by the big oven." Tzvi Hirsch ran to the kitchen. He came back with empty hands. "Not there."\nBinyamin looked at the clock. Only forty minutes were left until candle-lighting.\n"What about your apron?" he asked.\nTzvi Hirsch reached into the pocket of his flour-covered apron and pulled out a shiny silver key. "I had it the whole time," he groaned.\nBinyamin laughed quietly. "Come on. Lock up, and let\'s get these boys home."\nJust then, Mr. Gold came around the corner and took the handle of the stroller. "Good Shabbos, boys," he said with a tired smile. "Did everything go smoothly?"\nThe two boys looked at each other. "Very smoothly," they said together.' }
