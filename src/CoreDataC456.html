    c45_firemap: { title: 'The Fire Stops at the Water (from The Map in Zeidy\'s Attic)', text: 'On Sunday morning, February 7, 1904, a fire started in a big warehouse with a tall brick front in downtown Baltimore. It was winter, and a strong wind was blowing. The wind pushed the flames from one building to the next.\nDowntown, the buildings stood close together, wall touching wall. When one building caught fire, the one beside it caught fire too.\nFiremen came by train from Washington, Philadelphia and New York. But the ends of many of their hoses did not fit Baltimore\'s fire hydrants. All that water, and they could not use it.\nBecause it was Sunday, the offices and stores were closed, and few people were downtown. As far as anyone knows, not one person died in the fire itself.\nThe fire burned for about thirty hours, and more than 1,500 buildings were lost. On the east side, it came to the Jones Falls, a stream that runs through the city into the harbor. There, with the water in its way and firemen fighting on the far bank, the fire finally stopped.\nOut over the water, seagulls circled the boats.\nMore than a hundred years later, Yehuda and his friends bent over a hand-drawn map of the fire. The shading stopped at the stream. A tiny star was drawn past it.\n"The side that did not burn," said Nosson.\n"The safe side," said Binyamin.' },
    c45_creek: { title: 'The Creek at Camp', text: 'In the last week of camp, Shmuel Peretz and his bunk hiked to the waterfall across Cedar Creek. The creek was shallow that morning, and the boys crossed a little wooden footbridge in a single line. Tall pine trees lined the trail.\nAfter lunch, dark clouds rolled over the mountain. Rain poured down for an hour. When the boys came back to the creek, the water was brown and fast. It had risen over the footbridge.\n"Nobody crosses," said their counselor, Mendel. "Fast water can knock a grown man down."\nThe only other way back was the long dirt road around the mountain, six miles. The boys groaned. Shmuel\'s sneakers were soaked, and the sun was going down.\nMendel took out his phone, but up on the mountain there was no signal. He could not call for a ride, so the bunk started walking. Shmuel led the singing so nobody would think about his feet.\nHalfway around, they saw headlights. The head counselor had driven out to look for them.\nThat night, Shmuel wrote home: "We missed supper, but we learned something. In the mountains, the weather is the boss."' },
    c45_chavrusas: { title: 'Fast and Slow', text: 'Rabbi Feldman made Tzvi Hirsch Gold and Binyamin Yusupov chavrusas for the class siyum on Mishnayos Brachos. A few boys laughed. Tzvi Hirsch did everything fast. Binyamin did everything slowly.\nOn the first day, Tzvi Hirsch raced through a whole Mishnah in one minute. "Done!" he said.\nBinyamin did not move. "What does it mean?"\nTzvi Hirsch opened his mouth and closed it again. He did not know.\n"Let\'s read it twice," said Binyamin. "Once to say it, once to understand it." Tzvi Hirsch groaned, but he tried. The second time, the Mishnah made sense.\nBinyamin had a problem too. In class he knew many answers, but he never raised his hand. "What if I\'m wrong?" he whispered.\n"So you\'re wrong," said Tzvi Hirsch. "Last week I said the wrong bracha on a banana in front of everyone. We all laughed, me too. Now I will never forget that it\'s ha\'adamah."\nBinyamin almost smiled.\nEvery day for a month, they learned together. At the siyum, Tzvi Hirsch read the last Mishnah slowly and clearly and explained every word. Then Rabbi Feldman asked a hard question. The room was quiet.\nBinyamin\'s hand went up first.' },
    c45_saba: { title: 'Saba by the Window', text: 'When Saba Nissim broke his hip, he came to live with Reuven Tawil\'s family. He had always been busy: davening at the early minyan, learning with his chavrusa every night, fixing every bicycle on the block. Now he sat by the window and said very little.\nReuven did not know what to say to him. Most days he hurried past the window on the way to his room.\nOne evening, Reuven heard Saba say quietly, "Forty years I learned with Reb Chaim every night. Now I cannot even get to him."\nThe next day, Reuven put Abba\'s old phone on Saba\'s table, turned on the speaker and showed him how to call. Saba pressed the wrong button six times. Reuven waited. On the seventh try, Reb Chaim\'s voice came through the speaker. "Nissim!" he called out, and Saba laughed for the first time since his fall.\nAfter that, Saba learned with Reb Chaim every night. And on Sundays, he called Reuven out to the porch. "Bring your bicycle," he said. "The chain is too loose. I\'ll show you how to fix it."\nBy spring, Reuven could fix every bicycle on the block. And he never hurried past the window again.' },
    c45_windsukkah: { title: 'The Sukkah in the Wind', text: 'This year, Dovid Lerner wanted to build the family sukkah by himself, with his own new design. "No extra poles," he told Abba. "Just the walls and the clips. It will look much cleaner."\nAbba looked at the plan. "A sukkah\'s walls must stand up to a normal wind," he said. "I would add poles at the corners."\n"It will be fine," said Dovid.\nHe worked all afternoon on Erev Sukkos. He clipped the walls together and laid the bamboo mats on top. It looked great.\nThen the wind came. By four o\'clock it was blowing hard. The walls began to lean. One corner shook. Then, with a loud slap, a whole wall panel fell flat on the grass.\nDovid stared at the panel. Yom Tov was three hours away. His face was hot. He could keep arguing, or he could ask for help.\nHe walked inside. "Abba," he said quietly, "show me how you would do it."\nTogether they drove poles into the ground at every corner and tied the walls tight. His little brothers held the rope. The neighbors\' boys came over to hang the paper chains.\nThat night, the wind still blew, but the sukkah stood strong. In his notebook, Dovid wrote: "A good builder also listens."' },
    c45_dvartorah: { title: 'Akiva\'s Dvar Torah', text: 'Rabbi Adler chose Akiva Levinson to say the dvar Torah at the class Chumash party. Akiva\'s stomach dropped. He liked writing, but talking in front of everyone made his knees shake.\nAll week he worked on a dvar Torah about Avraham Avinu welcoming guests. Every time he practiced in the mirror, he forgot the middle. On Wednesday night, he dreamed that the whole class was laughing at him.\nOn Thursday night, he decided to ask Rabbi Adler to pick someone else. He was writing the note when his little brother Shmuli came in with a pillow and sat on the floor. "Practice on me," said Shmuli.\nAkiva sighed and began. When he reached the part about Avraham running to greet the guests on a hot day, Shmuli\'s eyes got wide. "He ran? In the heat? Say it again!"\nAkiva looked at the note. Then he crumpled it up. "I\'ll do it," he said.\nHe practiced for Abba and Ima, and then for his grandfather on the phone.\nAt the party, his voice shook on the first line. By the third line, it was strong. When he finished, Rabbi Adler shook his hand, and Shmuli, sitting in the back with Abba, clapped the loudest.' }

    'READ.LIT.L06.08':{ band:'E45', pic:'🤝', today:'Show how two characters change each other',

      bridge:'READ.LIT.L06.01', bridgeName:'Compare Characters',
