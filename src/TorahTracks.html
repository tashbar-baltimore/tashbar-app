'LK.CHEM.L01.05':{name:"Chemdas 5: The Jewish Months in Order","band": "K-2", "peg": {"kind": "song", "show": "Tishrei, Cheshvan, Kislev, Teves...", "say": "Twelve months in a ring, from Tishrei to Elul, we sing!"}, "op": "Twelve months go round like a wheel. Hop on at Tishrei!", "teach": [{"how": "A regular Jewish year has twelve months. We start a new year on Rosh Hashanah, in Tishrei. The first four: Tishrei, Cheshvan, Kislev, Teves.", "q": "In which month do we start a new year?", "o": ["Tishrei", "Elul", "Kislev"], "h": "Rosh Hashanah is in this month."}, {"how": "Next come Shevat, Adar, Nissan and Iyar. Then Sivan, Tammuz, Av and Elul. Elul is the last month, right before Rosh Hashanah.", "q": "Which month comes right after Adar?", "o": ["Nissan", "Shevat", "Sivan"], "h": "It is the month of Pesach."}, {"how": "The Torah calls Nissan the first month, the month we left Mitzrayim. Some years have two months of Adar: Adar Alef and Adar Beis. Then the year has thirteen months.", "q": "In which month did we leave Mitzrayim?", "o": ["Nissan", "Tishrei", "Kislev"], "h": "The Torah calls it the first month."}], "we": [{"q": "Together: which month comes right before Tishrei?", "o": ["Elul", "Cheshvan", "Av"], "steps": ["Tishrei starts the new year.", "The month before it ends the old year.", "That is Elul."]}, {"q": "Together: which month comes right after Kislev?", "o": ["Teves", "Shevat", "Tishrei"], "steps": ["Say: Tishrei, Cheshvan, Kislev...", "What comes next?", "Teves!"]}], "practice": [{"t": "order", "q": "Put the first four months in order, from Tishrei.", "tiles": ["Tishrei", "Cheshvan", "Kislev", "Teves"], "h": "Tishrei starts the year.", "why": "Tishrei, Cheshvan, Kislev, Teves."}, {"t": "order", "q": "Put the middle four months in order.", "tiles": ["Shevat", "Adar", "Nissan", "Iyar"], "h": "Shevat comes right after Teves.", "why": "Shevat, Adar, Nissan, Iyar."}, {"t": "order", "q": "Put the last four months in order.", "tiles": ["Sivan", "Tammuz", "Av", "Elul"], "h": "Elul is last.", "why": "Sivan, Tammuz, Av, Elul."}, {"t": "sort", "q": "Sort: Tishrei to Adar, or Nissan to Elul?", "bins": [{"id": "A", "label": "Tishrei to Adar"}, {"id": "B", "label": "Nissan to Elul"}], "items": [{"label": "Tishrei", "bin": "A"}, {"label": "Kislev", "bin": "A"}, {"label": "Shevat", "bin": "A"}, {"label": "Adar", "bin": "A"}, {"label": "Nissan", "bin": "B"}, {"label": "Sivan", "bin": "B"}, {"label": "Av", "bin": "B"}, {"label": "Elul", "bin": "B"}], "h": "Adar is the end of the first half.", "why": "Tishrei to Adar is the first six; Nissan to Elul is the last six."}, {"t": "sort", "q": "Sort: a Jewish month, or not?", "bins": [{"id": "Y", "label": "A month"}, {"id": "N", "label": "Not a month"}], "items": [{"label": "Kislev", "bin": "Y"}, {"label": "Iyar", "bin": "Y"}, {"label": "Tammuz", "bin": "Y"}, {"label": "Cheshvan", "bin": "Y"}, {"label": "Shabbos", "bin": "N"}, {"label": "Pesach", "bin": "N"}, {"label": "Bereishis", "bin": "N"}], "h": "Three cards are not months.", "why": "Kislev, Iyar, Tammuz and Cheshvan are months."}, {"t": "sort", "q": "Sort: in the first four months, or the last four months?", "bins": [{"id": "A", "label": "First four"}, {"id": "B", "label": "Last four"}], "items": [{"label": "Cheshvan", "bin": "A"}, {"label": "Teves", "bin": "A"}, {"label": "Tishrei", "bin": "A"}, {"label": "Tammuz", "bin": "B"}, {"label": "Elul", "bin": "B"}, {"label": "Av", "bin": "B"}], "h": "The first four start with Tishrei.", "why": "Tishrei, Cheshvan, Teves are early; Tammuz, Av, Elul are late."}, {"t": "pairs", "q": "Match each month to the month right after it.", "pairs": [["Tishrei", "Cheshvan"], ["Kislev", "Teves"], ["Adar", "Nissan"], ["Sivan", "Tammuz"], ["Av", "Elul"]], "h": "Sing the months in order.", "why": "Each month is followed by the next one in the song."}, {"t": "pairs", "q": "Match each place to the month, counting from Tishrei.", "pairs": [["first", "Tishrei"], ["second", "Cheshvan"], ["sixth", "Adar"], ["seventh", "Nissan"], ["twelfth", "Elul"]], "h": "Count on your fingers from Tishrei.", "why": "Tishrei one, Cheshvan two, Adar six, Nissan seven, Elul twelve."}, {"t": "pairs", "q": "Match: which month is this?", "pairs": [["starts the new year", "Tishrei"], ["the month we left Mitzrayim", "Nissan"], ["the last month of the year", "Elul"], ["can come twice in one year", "Adar"]], "h": "Think of Rosh Hashanah and Pesach.", "why": "Tishrei new year, Nissan Mitzrayim, Elul last, Adar can be twice."}, {"t": "spotall", "q": "Tap every month between Nissan and Elul.", "cells": [{"label": "Iyar", "ok": true}, {"label": "Sivan", "ok": true}, {"label": "Tammuz", "ok": true}, {"label": "Av", "ok": true}, {"label": "Kislev", "ok": false}, {"label": "Teves", "ok": false}, {"label": "Cheshvan", "ok": false}], "h": "Start after Nissan and stop before Elul.", "why": "Iyar, Sivan, Tammuz and Av are between Nissan and Elul."}, {"t": "spotall", "q": "Tap every Jewish month.", "cells": [{"label": "Teves", "ok": true}, {"label": "Shevat", "ok": true}, {"label": "Iyar", "ok": true}, {"label": "Tammuz", "ok": true}, {"label": "Purim", "ok": false}, {"label": "Sukkos", "ok": false}, {"label": "Moshe", "ok": false}], "h": "Three cards are not months.", "why": "Teves, Shevat, Iyar and Tammuz are months."}, {"t": "type", "q": "How many months are in a regular Jewish year? Type the number.", "a": "12", "alt": ["twelve", "Twelve"], "h": "From Tishrei to Elul.", "why": "A regular year has twelve months."}], "check": [{"t": "order", "q": "Check: put these months in order, from Tishrei.", "tiles": ["Tishrei", "Kislev", "Adar", "Sivan", "Elul"]}, {"q": "Which month comes right after Elul?", "o": ["Tishrei", "Av", "Nissan"]}, {"q": "Which month can come twice in one year?", "o": ["Adar", "Elul", "Sivan"]}]},
'LK.CHEM.L01.06':{name:"Chemdas 6: The Yomim Tovim Through the Year","band": "K-2", "peg": {"kind": "three words", "show": "Tishrei · Kislev · Adar · Nissan · Sivan", "say": "Each Yom Tov has its own month: say the month, find the Yom Tov."}, "op": "Every month is a box. Some boxes hold a Yom Tov. Let us open them!", "teach": [{"how": "Tishrei is full of Yomim Tovim! Rosh Hashanah, Yom Kippur, Sukkos and Simchas Torah are all in Tishrei.", "q": "In which month is Sukkos?", "o": ["Tishrei", "Nissan", "Adar"], "h": "Same month as Rosh Hashanah."}, {"how": "Chanukah starts in Kislev. Purim is in Adar. On Purim, Queen Esther and Mordechai saved Klal Yisrael. Esther asked all the Jews to fast and daven.", "q": "In which month is Purim?", "o": ["Adar", "Kislev", "Sivan"], "h": "The happy month, right before Nissan."}, {"how": "Pesach is in Nissan, the month we left Mitzrayim. Chazal teach that we left Mitzrayim in the merit of the righteous women. Shavuos is in Sivan, when we got the Torah. On Shavuos we read Megillas Rus.", "q": "In which month is Shavuos?", "o": ["Sivan", "Nissan", "Tishrei"], "h": "We got the Torah in this month."}], "we": [{"q": "Together: Yom Kippur is in which month?", "o": ["Tishrei", "Elul", "Kislev"], "steps": ["Rosh Hashanah is in Tishrei.", "Yom Kippur comes a few days later.", "Same month: Tishrei."]}, {"q": "Together: which comes first in the year, Purim or Pesach?", "o": ["Purim", "Pesach", "The same day"], "steps": ["Purim is in Adar.", "Pesach is in Nissan.", "Adar comes right before Nissan."]}], "practice": [{"t": "order", "q": "Put these Yomim Tovim in order, starting from Tishrei.", "tiles": ["Rosh Hashanah", "Chanukah", "Purim", "Pesach", "Shavuos"], "h": "Rosh Hashanah starts the year.", "why": "Tishrei, Kislev, Adar, Nissan, Sivan."}, {"t": "order", "q": "Put the Tishrei Yomim Tovim in order.", "tiles": ["Rosh Hashanah", "Yom Kippur", "Sukkos", "Simchas Torah"], "h": "Rosh Hashanah is first.", "why": "Rosh Hashanah, then Yom Kippur, then Sukkos, then Simchas Torah."}, {"t": "order", "q": "Put these Yom Tov months in order, from Tishrei.", "tiles": ["Tishrei", "Kislev", "Adar", "Nissan", "Sivan"], "h": "Remember the month song.", "why": "Tishrei, Kislev, Adar, Nissan, Sivan."}, {"t": "sort", "q": "Sort: in Tishrei, or in Nissan?", "bins": [{"id": "T", "label": "Tishrei"}, {"id": "N", "label": "Nissan"}], "items": [{"label": "Rosh Hashanah", "bin": "T"}, {"label": "Yom Kippur", "bin": "T"}, {"label": "Sukkos", "bin": "T"}, {"label": "Simchas Torah", "bin": "T"}, {"label": "Pesach", "bin": "N"}], "h": "Only one is in Nissan.", "why": "Rosh Hashanah, Yom Kippur, Sukkos and Simchas Torah in Tishrei; Pesach in Nissan."}, {"t": "sort", "q": "Sort: Kislev, Adar or Sivan?", "bins": [{"id": "K", "label": "Kislev"}, {"id": "A", "label": "Adar"}, {"id": "S", "label": "Sivan"}], "items": [{"label": "Chanukah", "bin": "K"}, {"label": "Purim", "bin": "A"}, {"label": "Queen Esther and Mordechai", "bin": "A"}, {"label": "Shavuos", "bin": "S"}, {"label": "the day we got the Torah", "bin": "S"}, {"label": "Megillas Rus", "bin": "S"}], "h": "Shavuos is when we got the Torah.", "why": "Chanukah in Kislev; Purim and Queen Esther in Adar; Shavuos and Megillas Rus in Sivan."}, {"t": "sort", "q": "Sort: Tishrei to Adar, or Nissan to Elul?", "bins": [{"id": "A", "label": "Tishrei to Adar"}, {"id": "B", "label": "Nissan to Elul"}], "items": [{"label": "Sukkos", "bin": "A"}, {"label": "Chanukah", "bin": "A"}, {"label": "Purim", "bin": "A"}, {"label": "Pesach", "bin": "B"}, {"label": "Shavuos", "bin": "B"}], "h": "Pesach starts the second half.", "why": "Sukkos, Chanukah, Purim come first; Pesach and Shavuos later."}, {"t": "pairs", "q": "Match each Yom Tov to its month.", "pairs": [["Rosh Hashanah", "Tishrei"], ["Chanukah", "Kislev"], ["Purim", "Adar"], ["Pesach", "Nissan"], ["Shavuos", "Sivan"]], "h": "Start with Rosh Hashanah.", "why": "Tishrei, Kislev, Adar, Nissan, Sivan."}, {"t": "pairs", "q": "Match each Yom Tov to what it remembers.", "pairs": [["Pesach", "leaving Mitzrayim"], ["Shavuos", "getting the Torah"], ["Chanukah", "the little jar of oil"], ["Purim", "Queen Esther and Mordechai saved us"]], "h": "Think of the story of each one.", "why": "Each Yom Tov remembers its own story."}, {"t": "pairs", "q": "Match each Tishrei Yom Tov to its clue.", "pairs": [["Rosh Hashanah", "the new year"], ["Yom Kippur", "a day of fasting"], ["Sukkos", "we eat in a little hut"], ["Simchas Torah", "dancing with the Torah"]], "h": "Rosh Hashanah is the new year.", "why": "New year, fast, little hut, dancing."}, {"t": "spotall", "q": "Tap every Yom Tov in Tishrei.", "cells": [{"label": "Rosh Hashanah", "ok": true}, {"label": "Yom Kippur", "ok": true}, {"label": "Sukkos", "ok": true}, {"label": "Pesach", "ok": false}, {"label": "Purim", "ok": false}, {"label": "Chanukah", "ok": false}], "h": "Three are in Tishrei.", "why": "Rosh Hashanah, Yom Kippur and Sukkos are in Tishrei."}, {"t": "spotall", "q": "Tap every true sentence.", "cells": [{"label": "Pesach is in Nissan", "ok": true}, {"label": "Purim is in Adar", "ok": true}, {"label": "Chanukah starts in Kislev", "ok": true}, {"label": "On Shavuos we read Megillas Rus", "ok": true}, {"label": "Shavuos is in Tishrei", "ok": false}, {"label": "Sukkos is in Sivan", "ok": false}], "h": "Check each month.", "why": "Shavuos is in Sivan and Sukkos is in Tishrei."}, {"t": "type", "q": "In which month is Pesach? Type the month.", "a": "Nissan", "alt": ["Nisan", "nissan", "nisan"], "h": "The month we left Mitzrayim.", "why": "Pesach is in Nissan."}], "check": [{"t": "order", "q": "Check: put these in order through the year, from Tishrei.", "tiles": ["Yom Kippur", "Chanukah", "Purim", "Shavuos"]}, {"q": "On Purim, who saved Klal Yisrael with Mordechai?", "o": ["Queen Esther", "Rochel", "Sarah"]}, {"q": "Which Yom Tov is in Sivan?", "o": ["Shavuos", "Pesach", "Sukkos"]}]},
'LK.CHEM.L02.01':{name:"Chemdas 7: Torah, Nevi'im, Kesuvim: The 24 Sefarim of Tanach","band": "3-5", "peg": {"kind": "three words", "show": "5 · 8 · 11 = 24", "say": "Five in Torah, eight in Nevi'im, eleven in Kesuvim: twenty-four in all."}, "op": "Tanach is like a library with three shelves. Can you put every sefer on the right shelf?", "teach": [{"how": "Tanach has three parts: Torah, Nevi'im and Kesuvim. The name Tanach is made from the first letters of the three parts. All together there are 24 sefarim.", "q": "What are the three parts of Tanach?", "o": ["Torah, Nevi'im, Kesuvim", "Torah, Mishnah, Gemara", "Bereishis, Shemos, Vayikra"], "h": "The first letters spell Tanach."}, {"how": "The Torah is the five Chumashim, given by Hashem through Moshe. Nevi'im has 8 sefarim: Yehoshua, Shoftim, Shmuel, Melachim, Yeshayahu, Yirmiyahu, Yechezkel and Trei Asar.", "q": "How many sefarim are in Nevi'im?", "o": ["8", "5", "11"], "h": "Count: Yehoshua, Shoftim, Shmuel, Melachim, and four more."}, {"how": "Kesuvim has 11 sefarim: Tehillim, Mishlei, Iyov, Shir Hashirim, Rus, Eichah, Koheles, Esther, Daniel, Ezra (with Nechemiah) and Divrei Hayamim. Trei Asar counts as one sefer in Nevi'im, and Ezra with Nechemiah counts as one.", "q": "Tehillim is in which part of Tanach?", "o": ["Kesuvim", "Torah", "Nevi'im"], "h": "It is one of the eleven."}], "we": [{"q": "Together: Is Melachim in Torah, Nevi'im or Kesuvim?", "o": ["Nevi'im", "Torah", "Kesuvim"], "steps": ["The Torah is only the five Chumashim.", "Melachim is not a Chumash.", "It is one of the eight sefarim of Nevi'im."]}, {"q": "Together: 5 + 8 + 11 = ?", "o": ["24", "22", "26"], "steps": ["Torah has 5.", "Nevi'im has 8, so 13.", "Kesuvim has 11, so 24."]}], "practice": [{"t": "order", "q": "Put the three parts of Tanach in order.", "tiles": ["Torah", "Nevi'im", "Kesuvim"], "h": "Say the name Tanach slowly.", "why": "Tanach: Torah, then Nevi'im, then Kesuvim."}, {"t": "order", "q": "Put the first four sefarim of Nevi'im in order.", "tiles": ["Yehoshua", "Shoftim", "Shmuel", "Melachim"], "h": "Yehoshua led the people right after Moshe.", "why": "First Yehoshua, then the judges, then Shmuel, then the kings."}, {"t": "order", "q": "Put the last four sefarim of Nevi'im in order.", "tiles": ["Yeshayahu", "Yirmiyahu", "Yechezkel", "Trei Asar"], "h": "Trei Asar is last.", "why": "Yeshayahu, Yirmiyahu, Yechezkel, then Trei Asar."}, {"t": "sort", "q": "Sort each sefer: Torah or Nevi'im?", "bins": [{"id": "T", "label": "Torah"}, {"id": "N", "label": "Nevi'im"}], "items": [{"label": "Bereishis", "bin": "T"}, {"label": "Vayikra", "bin": "T"}, {"label": "Devarim", "bin": "T"}, {"label": "Yehoshua", "bin": "N"}, {"label": "Shmuel", "bin": "N"}, {"label": "Yirmiyahu", "bin": "N"}], "h": "The Torah is only five Chumashim.", "why": "Bereishis, Vayikra and Devarim are Chumashim; the others are Nevi'im."}, {"t": "sort", "q": "Sort each sefer: Nevi'im or Kesuvim?", "bins": [{"id": "N", "label": "Nevi'im"}, {"id": "K", "label": "Kesuvim"}], "items": [{"label": "Shoftim", "bin": "N"}, {"label": "Melachim", "bin": "N"}, {"label": "Yechezkel", "bin": "N"}, {"label": "Tehillim", "bin": "K"}, {"label": "Mishlei", "bin": "K"}, {"label": "Rus", "bin": "K"}, {"label": "Iyov", "bin": "K"}, {"label": "Divrei Hayamim", "bin": "K"}], "h": "Nevi'im has only eight.", "why": "Shoftim, Melachim and Yechezkel are Nevi'im; Tehillim, Mishlei, Rus, Iyov and Divrei Hayamim are Kesuvim."}, {"t": "sort", "q": "Sort into the three parts of Tanach.", "bins": [{"id": "T", "label": "Torah"}, {"id": "N", "label": "Nevi'im"}, {"id": "K", "label": "Kesuvim"}], "items": [{"label": "Shemos", "bin": "T"}, {"label": "Bamidbar", "bin": "T"}, {"label": "Yeshayahu", "bin": "N"}, {"label": "Trei Asar", "bin": "N"}, {"label": "Koheles", "bin": "K"}, {"label": "Ezra", "bin": "K"}], "h": "Five, eight, eleven.", "why": "Shemos and Bamidbar are Torah; Yeshayahu and Trei Asar are Nevi'im; Koheles and Ezra are Kesuvim."}, {"t": "pairs", "q": "Match each part to how many sefarim it has.", "pairs": [["Torah", "5 sefarim"], ["Nevi'im", "8 sefarim"], ["Kesuvim", "11 sefarim"], ["All of Tanach", "24 sefarim"]], "h": "Five, eight, eleven.", "why": "5 + 8 + 11 = 24."}, {"t": "pairs", "q": "Match each sefer to its part.", "pairs": [["Devarim", "Torah"], ["Shoftim", "Nevi'im"], ["Tehillim", "Kesuvim"]], "h": "Which one is a Chumash?", "why": "Devarim is a Chumash, Shoftim is in Nevi'im, Tehillim is in Kesuvim."}, {"t": "pairs", "q": "Match the sefer to what it holds.", "pairs": [["Tehillim", "songs and praises, many by Dovid"], ["Mishlei", "wise sayings of Shlomo"], ["Yehoshua", "coming into Eretz Yisrael"], ["Bereishis", "how the world began"]], "h": "Dovid sang, Shlomo was wise.", "why": "Each sefer has its own story or message."}, {"t": "spotall", "q": "Tap every sefer that is in Kesuvim.", "cells": [{"label": "Tehillim", "ok": true}, {"label": "Mishlei", "ok": true}, {"label": "Iyov", "ok": true}, {"label": "Daniel", "ok": true}, {"label": "Esther", "ok": true}, {"label": "Shmuel", "ok": false}, {"label": "Bamidbar", "ok": false}, {"label": "Yeshayahu", "ok": false}], "h": "Kesuvim has eleven sefarim.", "why": "Tehillim, Mishlei, Iyov, Esther and Daniel are Kesuvim; Shmuel and Yeshayahu are in Nevi'im; Bamidbar is in the Torah."}, {"t": "spotall", "q": "Tap every true sentence about Tanach.", "cells": [{"label": "It has 24 sefarim", "ok": true}, {"label": "Trei Asar counts as one sefer", "ok": true}, {"label": "The Torah has five Chumashim", "ok": true}, {"label": "Kesuvim has 5 sefarim", "ok": false}, {"label": "Melachim is in the Torah", "ok": false}], "h": "Five, eight, eleven.", "why": "Kesuvim has 11; Melachim is in Nevi'im."}, {"t": "type", "q": "How many sefarim are in all of Tanach? Type the number.", "a": "24", "alt": ["twenty-four", "twenty four"], "h": "Add 5 and 8 and 11.", "why": "5 + 8 + 11 = 24."}], "check": [{"t": "order", "q": "Put the parts of Tanach in order.", "tiles": ["Torah", "Nevi'im", "Kesuvim"]}, {"q": "Which part has eleven sefarim?", "o": ["Kesuvim", "Nevi'im", "Torah"]}, {"q": "Yechezkel is in which part?", "o": ["Nevi'im", "Kesuvim", "Torah"]}]},
'LK.CHEM.L02.02':{name:"Chemdas 8: The Parshiyos and Their Sefarim","band": "3-5", "peg": {"kind": "song", "show": "Bereishis, Noach, Lech Lecha, Vayera...", "say": "Sing the parshiyos like a train: one car after the next."}, "op": "Every Shabbos we read one parsha. Can you name them all in order?", "teach": [{"how": "The Torah is read in 54 parshiyos, one or two each Shabbos, all year. Sefer Bereishis has 12 parshiyos, and Sefer Shemos has 11.", "q": "How many parshiyos are in Sefer Bereishis?", "o": ["12", "11", "54"], "h": "From Bereishis to Vayechi."}, {"how": "Bereishis starts with Bereishis, Noach, Lech Lecha, Vayera, Chayei Sarah, Toldos. Then come Vayetzei, Vayishlach, Vayeshev, Mikeitz, Vayigash, Vayechi.", "q": "Which parsha comes right after Noach?", "o": ["Lech Lecha", "Vayera", "Toldos"], "h": "Hashem tells Avraham to go."}, {"how": "Shemos has Shemos, Va'eira, Bo, Beshalach, Yisro, Mishpatim, then Terumah, Tetzaveh, Ki Sisa, Vayakhel, Pekudei. Each sefer begins with a parsha of the same name.", "q": "Which parsha is the first in Sefer Vayikra?", "o": ["Vayikra", "Tzav", "Bo"], "h": "Each sefer starts with its own name."}], "we": [{"q": "Together: Is Yisro in Bereishis or Shemos?", "o": ["Shemos", "Bereishis", "Devarim"], "steps": ["Bereishis ends with Vayechi.", "Shemos goes from Shemos to Pekudei.", "Yisro is the fifth parsha of Shemos."]}, {"q": "Together: What comes after Vayeshev?", "o": ["Mikeitz", "Vayigash", "Vayishlach"], "steps": ["Say it: Vayetzei, Vayishlach, Vayeshev...", "Next is Mikeitz.", "Then Vayigash and Vayechi."]}], "practice": [{"t": "order", "q": "Put the first six parshiyos of Bereishis in order.", "tiles": ["Bereishis", "Noach", "Lech Lecha", "Vayera", "Chayei Sarah", "Toldos"], "h": "Start with the world being made.", "why": "Bereishis, Noach, Lech Lecha, Vayera, Chayei Sarah, Toldos."}, {"t": "order", "q": "Put the last six parshiyos of Bereishis in order.", "tiles": ["Vayetzei", "Vayishlach", "Vayeshev", "Mikeitz", "Vayigash", "Vayechi"], "h": "Vayechi ends the sefer.", "why": "Vayetzei, Vayishlach, Vayeshev, Mikeitz, Vayigash, Vayechi."}, {"t": "order", "q": "Put the first six parshiyos of Shemos in order.", "tiles": ["Shemos", "Va'eira", "Bo", "Beshalach", "Yisro", "Mishpatim"], "h": "The makos come before the sea splits.", "why": "Shemos, Va'eira, Bo, Beshalach, Yisro, Mishpatim."}, {"t": "order", "q": "Put the last five parshiyos of Shemos in order.", "tiles": ["Terumah", "Tetzaveh", "Ki Sisa", "Vayakhel", "Pekudei"], "h": "Pekudei ends Shemos.", "why": "Terumah, Tetzaveh, Ki Sisa, Vayakhel, Pekudei."}, {"t": "sort", "q": "Sort each parsha: Bereishis or Shemos?", "bins": [{"id": "B", "label": "Bereishis"}, {"id": "S", "label": "Shemos"}], "items": [{"label": "Noach", "bin": "B"}, {"label": "Toldos", "bin": "B"}, {"label": "Vayigash", "bin": "B"}, {"label": "Bo", "bin": "S"}, {"label": "Yisro", "bin": "S"}, {"label": "Terumah", "bin": "S"}, {"label": "Vayakhel", "bin": "S"}], "h": "Bereishis ends with Vayechi.", "why": "Noach, Toldos and Vayigash are in Bereishis; the rest are in Shemos."}, {"t": "sort", "q": "Sort each parsha into its sefer.", "bins": [{"id": "B", "label": "Bereishis"}, {"id": "S", "label": "Shemos"}, {"id": "V", "label": "Vayikra"}], "items": [{"label": "Vayetzei", "bin": "B"}, {"label": "Mikeitz", "bin": "B"}, {"label": "Beshalach", "bin": "S"}, {"label": "Ki Sisa", "bin": "S"}, {"label": "Vayikra", "bin": "V"}, {"label": "Tzav", "bin": "V"}], "h": "Tzav comes right after Vayikra.", "why": "Vayetzei and Mikeitz are in Bereishis, Beshalach and Ki Sisa in Shemos, Vayikra and Tzav in Vayikra."}, {"t": "sort", "q": "Sort: first parsha of a sefer, or not?", "bins": [{"id": "F", "label": "First of its sefer"}, {"id": "N", "label": "Not first"}], "items": [{"label": "Bereishis", "bin": "F"}, {"label": "Shemos", "bin": "F"}, {"label": "Bamidbar", "bin": "F"}, {"label": "Devarim", "bin": "F"}, {"label": "Noach", "bin": "N"}, {"label": "Bo", "bin": "N"}, {"label": "Korach", "bin": "N"}], "h": "Each sefer starts with a parsha of its own name.", "why": "The first parsha has the same name as its sefer."}, {"t": "pairs", "q": "Match each parsha to what happens in it.", "pairs": [["Noach", "the flood"], ["Lech Lecha", "Avraham goes to a new land"], ["Vayeshev", "Yosef is sold"], ["Beshalach", "the sea splits"], ["Yisro", "the Ten Commandments"]], "h": "Noach built the ark.", "why": "Each parsha has its own big story."}, {"t": "pairs", "q": "Match each Chumash to its first parsha.", "pairs": [["Bereishis", "Parshas Bereishis"], ["Shemos", "Parshas Shemos"], ["Bamidbar", "Parshas Bamidbar"], ["Devarim", "Parshas Devarim"]], "h": "Same name!", "why": "Each sefer begins with a parsha of its own name."}, {"t": "pairs", "q": "Match the parsha to the one that comes right after it.", "pairs": [["Vayera", "Chayei Sarah"], ["Vayishlach", "Vayeshev"], ["Va'eira", "Bo"], ["Ki Sisa", "Vayakhel"]], "h": "Sing the order.", "why": "Each pair is next-door neighbors."}, {"t": "spotall", "q": "Tap every parsha in Sefer Shemos.", "cells": [{"label": "Bo", "ok": true}, {"label": "Mishpatim", "ok": true}, {"label": "Tetzaveh", "ok": true}, {"label": "Pekudei", "ok": true}, {"label": "Vayechi", "ok": false}, {"label": "Toldos", "ok": false}, {"label": "Balak", "ok": false}], "h": "Shemos starts with Shemos and ends with Pekudei.", "why": "Vayechi and Toldos are in Bereishis; Balak is in Bamidbar."}, {"t": "type", "q": "How many parshiyos are in Sefer Shemos? Type the number.", "a": "11", "alt": ["eleven"], "h": "From Shemos to Pekudei.", "why": "Shemos has 11 parshiyos."}], "check": [{"t": "order", "q": "Put these parshiyos in order.", "tiles": ["Vayeshev", "Mikeitz", "Vayigash", "Vayechi"]}, {"q": "Beshalach is in which sefer?", "o": ["Shemos", "Bereishis", "Vayikra"]}, {"q": "How many parshiyos are in the whole Torah?", "o": ["54", "24", "12"]}]},
'LK.CHEM.L02.03':{name:"Chemdas 9: The Ten Makos in Order","band": "3-5", "peg": {"kind": "picture", "show": "Red river, jumping frogs ... dark night", "say": "Ten pictures in a row: from a red river to the last night in Mitzrayim."}, "op": "Pharaoh said no. Hashem sent ten makos, one after another. Can you remember all ten?", "teach": [{"how": "Pharaoh would not let Klal Yisrael go, so Hashem sent ten plagues on Mitzrayim. The first three: blood, frogs, lice. Aharon struck with the staff for these three.", "q": "What was the first plague?", "o": ["Blood", "Frogs", "Darkness"], "h": "The river turned red."}, {"how": "Next came wild animals, then the cattle disease, then boils. Then hail with fire inside it, then locusts, then darkness for three days.", "q": "Which plague came right after hail?", "o": ["Locusts", "Boils", "Frogs"], "h": "They ate what the hail left."}, {"how": "The tenth plague was the death of the firstborn, at midnight. Then Pharaoh let Klal Yisrael go. In the Haggadah, Rabbi Yehudah groups the plagues 3, 3, 4.", "q": "What was the tenth plague?", "o": ["The death of the firstborn", "Darkness", "Hail"], "h": "It happened at midnight."}], "we": [{"q": "Together: What came after frogs?", "o": ["Lice", "Blood", "Hail"], "steps": ["Blood was first.", "Frogs was second.", "Lice was third."]}, {"q": "Together: How many days was the darkness?", "o": ["Three", "One", "Seven"], "steps": ["Darkness is the ninth plague.", "The pasuk says it was thick darkness.", "It lasted three days."]}], "practice": [{"t": "order", "q": "Put the first five plagues in order.", "tiles": ["Blood", "Frogs", "Lice", "Wild animals", "Cattle disease"], "h": "It starts with the river.", "why": "Blood, frogs, lice, wild animals, cattle disease."}, {"t": "order", "q": "Put the last five plagues in order.", "tiles": ["Boils", "Hail", "Locusts", "Darkness", "Death of the firstborn"], "h": "Darkness is ninth.", "why": "Boils, hail, locusts, darkness, death of the firstborn."}, {"t": "order", "q": "Put Rabbi Yehudah's first group in order.", "tiles": ["Blood", "Frogs", "Lice"], "h": "Aharon struck for all three.", "why": "The first group of three: blood, frogs, lice."}, {"t": "order", "q": "Put the end of the story in order.", "tiles": ["Darkness", "Death of the firstborn", "Pharaoh lets Klal Yisrael go", "The sea splits", "Miriam leads the women in song"], "h": "The last plague came at midnight.", "why": "After the tenth plague Pharaoh let them go; at the sea, Miriam the prophet led the women in song with drums."}, {"t": "sort", "q": "Sort: first five plagues or last five?", "bins": [{"id": "F", "label": "First five"}, {"id": "L", "label": "Last five"}], "items": [{"label": "Blood", "bin": "F"}, {"label": "Lice", "bin": "F"}, {"label": "Wild animals", "bin": "F"}, {"label": "Hail", "bin": "L"}, {"label": "Locusts", "bin": "L"}, {"label": "Darkness", "bin": "L"}], "h": "Boils is number six.", "why": "Blood, lice and wild animals are in the first five; hail, locusts and darkness are in the last five."}, {"t": "sort", "q": "Sort: Rabbi Yehudah's three groups.", "bins": [{"id": "A", "label": "Group 1"}, {"id": "B", "label": "Group 2"}, {"id": "C", "label": "Group 3"}], "items": [{"label": "Frogs", "bin": "A"}, {"label": "Lice", "bin": "A"}, {"label": "Wild animals", "bin": "B"}, {"label": "Boils", "bin": "B"}, {"label": "Hail", "bin": "C"}, {"label": "Death of the firstborn", "bin": "C"}], "h": "Three, three, four.", "why": "Group 1: blood, frogs, lice. Group 2: wild animals, cattle disease, boils. Group 3: hail, locusts, darkness, firstborn."}, {"t": "sort", "q": "Sort: in Parshas Va'eira or Parshas Bo?", "bins": [{"id": "V", "label": "Va'eira"}, {"id": "B", "label": "Bo"}], "items": [{"label": "Blood", "bin": "V"}, {"label": "Frogs", "bin": "V"}, {"label": "Boils", "bin": "V"}, {"label": "Hail", "bin": "V"}, {"label": "Locusts", "bin": "B"}, {"label": "Darkness", "bin": "B"}, {"label": "Death of the firstborn", "bin": "B"}], "h": "Bo has the last three.", "why": "Va'eira has the first seven plagues; Bo has the last three."}, {"t": "pairs", "q": "Match each plague to its number.", "pairs": [["Blood", "1"], ["Wild animals", "4"], ["Hail", "7"], ["Darkness", "9"], ["Death of the firstborn", "10"]], "h": "Blood is first, darkness ninth.", "why": "Count them in order."}, {"t": "pairs", "q": "Match each plague to what happened.", "pairs": [["Blood", "the river turned red"], ["Hail", "ice with fire inside"], ["Locusts", "ate what the hail left"], ["Darkness", "three days nobody could see"]], "h": "Fire inside ice!", "why": "Each plague, as the pesukim describe it."}, {"t": "pairs", "q": "Match each person in the story of Mitzrayim.", "pairs": [["Yocheved", "Moshe's mother, who hid baby Moshe"], ["Miriam", "led the women in song at the sea"], ["Aharon", "struck the river with the staff"], ["Moshe", "brought Hashem's message to Pharaoh"], ["Pharaoh", "said no again and again"]], "h": "Who hid the baby?", "why": "Each one had a part in the story of leaving Mitzrayim."}, {"t": "spotall", "q": "Tap every one of the ten plagues.", "cells": [{"label": "Frogs", "ok": true}, {"label": "Boils", "ok": true}, {"label": "Locusts", "ok": true}, {"label": "Hail", "ok": true}, {"label": "Snow", "ok": false}, {"label": "Flood", "ok": false}, {"label": "Earthquake", "ok": false}], "h": "Only ten real ones.", "why": "Snow, a flood and an earthquake were not among the ten plagues."}, {"t": "type", "q": "Which number plague was darkness? Type the number.", "a": "9", "alt": ["nine", "ninth", "9th"], "h": "Just before the last one.", "why": "Darkness was the ninth plague."}], "check": [{"t": "order", "q": "Put these plagues in order.", "tiles": ["Blood", "Wild animals", "Hail", "Darkness"]}, {"q": "Which plague came right after lice?", "o": ["Wild animals", "Frogs", "Boils"]}, {"q": "Which plague was the very last?", "o": ["The death of the firstborn", "Darkness", "Locusts"]}]},
'LK.CHEM.L02.04':{name:"Chemdas 10: The Leaders, the Judges and the First Kings","band": "3-5", "peg": {"kind": "three words", "show": "Leader · Judges · Kings", "say": "First a leader, then the judges, then the kings: Shaul, Dovid, Shlomo."}, "op": "After Moshe, who led Klal Yisrael? Meet the heroes, one after another!", "teach": [{"how": "After Moshe, Yehoshua led Klal Yisrael into Eretz Yisrael; then came the judges of Sefer Shoftim. Devorah, a prophet and a judge, judged Klal Yisrael sitting under a palm tree. With Barak she led them to victory over Sisra, and she sang a song of thanks to Hashem.", "q": "Who judged Klal Yisrael under a palm tree?", "o": ["Devorah", "Gideon", "Shaul"], "h": "She was a prophet and a judge."}, {"how": "Gideon beat Midyan with only 300 men. Shimshon, very strong, fought the Plishtim. Shmuel was a great navi and the last judge.", "q": "Who beat Midyan with only 300 men?", "o": ["Gideon", "Shimshon", "Dovid"], "h": "Shofars and torches."}, {"how": "Shmuel anointed the first king, Shaul, from the tribe of Binyamin. Then came Dovid, from Yehudah, and his son Shlomo, who built the first Beis Hamikdash.", "q": "Who was the first king of Klal Yisrael?", "o": ["Shaul", "Dovid", "Shlomo"], "h": "Shmuel anointed him first."}], "we": [{"q": "Together: Who led with Barak to victory over Sisra?", "o": ["Devorah", "Shimshon", "Shaul"], "steps": ["Sisra led a big army against Klal Yisrael.", "The judge then was Devorah, the prophet.", "She led with Barak, and Hashem gave the victory."]}, {"q": "Together: Who came first, Shimshon or Shaul?", "o": ["Shimshon", "Shaul", "Both together"], "steps": ["Shimshon was a judge.", "The judges came before the kings.", "So Shimshon came first."]}], "practice": [{"t": "order", "q": "Put the three first kings in order.", "tiles": ["Shaul", "Dovid", "Shlomo"], "h": "Shlomo was Dovid's son.", "why": "Shaul, then Dovid, then his son Shlomo."}, {"t": "order", "q": "Put these leaders in order.", "tiles": ["Yehoshua", "Devorah", "Gideon", "Shimshon", "Shmuel"], "h": "Yehoshua came right after Moshe.", "why": "Yehoshua, then the judges Devorah, Gideon and Shimshon, then Shmuel."}, {"t": "order", "q": "Put the big eras in order.", "tiles": ["Moshe", "Yehoshua", "The judges", "The kings"], "h": "Kings came last.", "why": "Moshe, Yehoshua, the judges, then the kings."}, {"t": "order", "q": "Put these people in order.", "tiles": ["Devorah", "Gideon", "Shmuel", "Dovid"], "h": "Devorah comes before Gideon in Sefer Shoftim.", "why": "Devorah, Gideon, Shmuel, then King Dovid."}, {"t": "sort", "q": "Sort: a judge or a king?", "bins": [{"id": "J", "label": "A judge"}, {"id": "K", "label": "A king"}], "items": [{"label": "Devorah", "bin": "J"}, {"label": "Gideon", "bin": "J"}, {"label": "Shimshon", "bin": "J"}, {"label": "Shmuel", "bin": "J"}, {"label": "Shaul", "bin": "K"}, {"label": "Dovid", "bin": "K"}, {"label": "Shlomo", "bin": "K"}], "h": "Only three kings here.", "why": "Devorah, Gideon, Shimshon and Shmuel were judges; Shaul, Dovid and Shlomo were kings."}, {"t": "sort", "q": "Sort: which tribe was each king from?", "bins": [{"id": "B", "label": "Binyamin"}, {"id": "Y", "label": "Yehudah"}], "items": [{"label": "Shaul", "bin": "B"}, {"label": "Dovid", "bin": "Y"}, {"label": "Shlomo", "bin": "Y"}, {"label": "Dovid's sons", "bin": "Y"}], "h": "Shaul was from the small tribe.", "why": "Shaul came from Binyamin; Dovid and his son Shlomo came from Yehudah."}, {"t": "sort", "q": "Sort each fact to its judge.", "bins": [{"id": "V", "label": "Devorah"}, {"id": "G", "label": "Gideon"}, {"id": "S", "label": "Shimshon"}], "items": [{"label": "judged under a palm tree", "bin": "V"}, {"label": "led with Barak against Sisra", "bin": "V"}, {"label": "300 men", "bin": "G"}, {"label": "beat Midyan", "bin": "G"}, {"label": "very strong", "bin": "S"}, {"label": "fought the Plishtim alone", "bin": "S"}], "h": "Who sat under a palm tree?", "why": "Each judge has a story in Sefer Shoftim."}, {"t": "pairs", "q": "Match each leader to what he or she did.", "pairs": [["Yehoshua", "led the people into Eretz Yisrael"], ["Devorah", "judged under a palm tree and beat Sisra with Barak"], ["Gideon", "beat Midyan with 300 men"], ["Shmuel", "anointed the first kings"], ["Shlomo", "built the first Beis Hamikdash"]], "h": "Who anointed Shaul?", "why": "Each leader had a job from Hashem."}, {"t": "pairs", "q": "Match each king to a fact.", "pairs": [["Shaul", "the first king"], ["Dovid", "made Yerushalayim his city"], ["Shlomo", "the wisest of all"]], "h": "Who was first?", "why": "Shaul was first, Dovid chose Yerushalayim, Shlomo was the wisest."}, {"t": "pairs", "q": "Match the teacher to the student.", "pairs": [["Moshe", "Yehoshua"], ["Shmuel", "Shaul"], ["Dovid", "Shlomo"]], "h": "Who anointed Shaul?", "why": "Moshe taught Yehoshua, Shmuel anointed Shaul, Dovid was Shlomo's father."}, {"t": "spotall", "q": "Tap every king of Klal Yisrael.", "cells": [{"label": "Shaul", "ok": true}, {"label": "Dovid", "ok": true}, {"label": "Shlomo", "ok": true}, {"label": "Gideon", "ok": false}, {"label": "Yehoshua", "ok": false}, {"label": "Shimshon", "ok": false}], "h": "There are three here.", "why": "Gideon and Shimshon were judges; Yehoshua was the leader after Moshe."}, {"t": "type", "q": "How many men did Gideon take to fight Midyan? Type the number.", "a": "300", "alt": ["three hundred"], "h": "A small army!", "why": "Gideon won with only 300 men."}], "check": [{"t": "order", "q": "Put these in order.", "tiles": ["Yehoshua", "Devorah", "Shimshon", "Shaul", "Dovid"]}, {"q": "Who was the last judge, a great navi?", "o": ["Shmuel", "Gideon", "Shaul"]}, {"q": "Who built the first Beis Hamikdash?", "o": ["Shlomo", "Dovid", "Yehoshua"]}]},
'LK.CHEM.L02.05':{name:"Chemdas 11: The Six Sedarim of Mishnah","band": "3-5", "peg": {"kind": "three words", "show": "זְמַן נָקַט", "say": "Six first letters, six sedarim: Zeraim, Moed, Nashim, Nezikin, Kodashim, Taharos."}, "op": "The whole Mishnah fits on six shelves. Can you name them in order?", "teach": [{"how": "Rabbi Yehudah Hanasi wrote down the Mishnah in six big parts, called sedarim. Each seder has many masechtos.", "q": "Who wrote down the Mishnah?", "o": ["Rabbi Yehudah Hanasi", "Rashi", "Moshe"], "h": "He was called Hanasi, the prince."}, {"how": "In order: Zeraim, Moed, Nashim, Nezikin, Kodashim, Taharos. Their first letters spell two Hebrew words, so the order is easy to remember.", "q": "Which seder comes first?", "o": ["Zeraim", "Moed", "Taharos"], "h": "It starts with plants."}, {"how": "Zeraim: plants and farming, with Brachos first. Moed: Shabbos and Yom Tov. Nashim: halachos of marriage and the Jewish home, and promises. Nezikin: damages, money and courts. Kodashim: the offerings in the Beis Hamikdash. Taharos: purity.", "q": "Masechta Shabbos is in which seder?", "o": ["Moed", "Zeraim", "Nezikin"], "h": "Shabbos and Yom Tov."}], "we": [{"q": "Together: Bava Metzia is about money. Which seder?", "o": ["Nezikin", "Moed", "Kodashim"], "steps": ["Money and damages.", "That is the fourth seder.", "Nezikin."]}, {"q": "Together: What comes after Nashim?", "o": ["Nezikin", "Moed", "Kodashim"], "steps": ["Zeraim, Moed, Nashim...", "Next is Nezikin.", "Then Kodashim and Taharos."]}], "practice": [{"t": "order", "q": "Put the six sedarim in order.", "tiles": ["Zeraim", "Moed", "Nashim", "Nezikin", "Kodashim", "Taharos"], "h": "Use the six first letters.", "why": "Zeraim, Moed, Nashim, Nezikin, Kodashim, Taharos."}, {"t": "order", "q": "Put the first three sedarim in order.", "tiles": ["Zeraim", "Moed", "Nashim"], "h": "Plants come first.", "why": "Zeraim, Moed, Nashim."}, {"t": "order", "q": "Put the last three sedarim in order.", "tiles": ["Nezikin", "Kodashim", "Taharos"], "h": "Taharos is last.", "why": "Nezikin, Kodashim, Taharos."}, {"t": "sort", "q": "Sort each masechta: Zeraim or Moed?", "bins": [{"id": "Z", "label": "Zeraim"}, {"id": "M", "label": "Moed"}], "items": [{"label": "Brachos", "bin": "Z"}, {"label": "Peah", "bin": "Z"}, {"label": "Shabbos", "bin": "M"}, {"label": "Pesachim", "bin": "M"}, {"label": "Sukkah", "bin": "M"}, {"label": "Megillah", "bin": "M"}], "h": "Moed is Shabbos and Yom Tov.", "why": "Brachos and Peah are in Zeraim; the Shabbos and Yom Tov masechtos are in Moed."}, {"t": "sort", "q": "Sort each masechta: Nezikin or Kodashim?", "bins": [{"id": "N", "label": "Nezikin"}, {"id": "K", "label": "Kodashim"}], "items": [{"label": "Bava Kamma", "bin": "N"}, {"label": "Bava Basra", "bin": "N"}, {"label": "Sanhedrin", "bin": "N"}, {"label": "Avos", "bin": "N"}, {"label": "Chullin", "bin": "K"}, {"label": "Menachos", "bin": "K"}], "h": "Courts and money: Nezikin.", "why": "The Bavas, Sanhedrin and Avos are in Nezikin; Chullin and Menachos are in Kodashim."}, {"t": "sort", "q": "Sort into three sedarim.", "bins": [{"id": "M", "label": "Moed"}, {"id": "N", "label": "Nezikin"}, {"id": "T", "label": "Taharos"}], "items": [{"label": "Sukkah", "bin": "M"}, {"label": "Pesachim", "bin": "M"}, {"label": "Bava Metzia", "bin": "N"}, {"label": "Sanhedrin", "bin": "N"}, {"label": "Mikvaos", "bin": "T"}, {"label": "Keilim", "bin": "T"}], "h": "Taharos is about purity.", "why": "Sukkah and Pesachim in Moed, Bava Metzia and Sanhedrin in Nezikin, Mikvaos and Keilim in Taharos."}, {"t": "pairs", "q": "Match each seder to what it teaches.", "pairs": [["Zeraim", "plants and farming"], ["Moed", "Shabbos and Yom Tov"], ["Nezikin", "damages and courts"], ["Kodashim", "offerings in the Beis Hamikdash"], ["Taharos", "purity"]], "h": "Zeraim means seeds.", "why": "Each seder has its own subject."}, {"t": "pairs", "q": "Match each seder to its number.", "pairs": [["Zeraim", "1"], ["Nashim", "3"], ["Kodashim", "5"], ["Taharos", "6"]], "h": "Say all six.", "why": "Zeraim 1, Moed 2, Nashim 3, Nezikin 4, Kodashim 5, Taharos 6."}, {"t": "pairs", "q": "Match the masechta to its seder.", "pairs": [["Brachos", "Zeraim"], ["Shabbos", "Moed"], ["Nedarim", "Nashim"], ["Avos", "Nezikin"]], "h": "Pirkei Avos is with the courts.", "why": "Each masechta lives in one seder."}, {"t": "spotall", "q": "Tap every masechta in Seder Moed.", "cells": [{"label": "Shabbos", "ok": true}, {"label": "Pesachim", "ok": true}, {"label": "Sukkah", "ok": true}, {"label": "Megillah", "ok": true}, {"label": "Brachos", "ok": false}, {"label": "Bava Kamma", "ok": false}, {"label": "Chullin", "ok": false}], "h": "Shabbos and Yom Tov.", "why": "Brachos is in Zeraim, Bava Kamma in Nezikin, Chullin in Kodashim."}, {"t": "spotall", "q": "Tap every true sentence about the Mishnah.", "cells": [{"label": "It has six sedarim", "ok": true}, {"label": "Rabbi Yehudah Hanasi wrote it down", "ok": true}, {"label": "Brachos is in Zeraim", "ok": true}, {"label": "Taharos is the first seder", "ok": false}, {"label": "Moed is about money", "ok": false}], "h": "Zeraim is first.", "why": "Zeraim is first; Moed is Shabbos and Yom Tov."}, {"t": "type", "q": "How many sedarim are in the Mishnah? Type the number.", "a": "6", "alt": ["six"], "h": "Count the first letters.", "why": "The Mishnah has six sedarim."}], "check": [{"t": "order", "q": "Put these sedarim in order.", "tiles": ["Zeraim", "Nashim", "Kodashim", "Taharos"]}, {"q": "Masechta Brachos is in which seder?", "o": ["Zeraim", "Moed", "Taharos"]}, {"q": "Which seder teaches about damages and courts?", "o": ["Nezikin", "Kodashim", "Moed"]}]},
'LK.CHEM.L02.06':{name:"Chemdas 12: The Nevi'im and Their Sefarim","band": "3-5", "peg": {"kind": "rhyme", "show": "Four early, four late", "say": "Four sefarim of early, four sefarim of late: eight in Nevi'im, isn't that great!"}, "op": "A navi brings Hashem's message to the people. Who were they, and where can we read about them?", "teach": [{"how": "A navi is a prophet who brings a message from Hashem. The first four sefarim of Nevi'im tell the story of the people: Yehoshua, Shoftim, Shmuel, Melachim. They are called Nevi'im Rishonim, the early ones.", "q": "Which sefer is one of the early four?", "o": ["Melachim", "Yeshayahu", "Tehillim"], "h": "They tell the story of the people."}, {"how": "The last four are Nevi'im Acharonim: Yeshayahu, Yirmiyahu, Yechezkel and Trei Asar. Trei Asar means twelve: twelve nevi'im in one sefer, from Hoshea to Malachi.", "q": "How many nevi'im are in Trei Asar?", "o": ["12", "8", "24"], "h": "Trei Asar means twelve."}, {"how": "Chazal count seven women prophets: Sarah, Miriam, Devorah, Chana, Avigail, Chuldah and Esther. We read about them in the Torah, in Nevi'im and in Megillas Esther. Eliyahu and Elisha have no sefer of their own; they are in Sefer Melachim.", "q": "Who led the women in song at the Yam Suf?", "o": ["Miriam", "Chana", "Chuldah"], "h": "She was Moshe's sister."}], "we": [{"q": "Together: Where is the story of Yonah?", "o": ["Trei Asar", "Melachim", "Shoftim"], "steps": ["Yonah is one of the twelve.", "The twelve are in one sefer.", "That sefer is Trei Asar."]}, {"q": "Together: Whose son was Shmuel the navi?", "o": ["Chana", "Sarah", "Esther"], "steps": ["Chana davened at Shiloh for a son.", "Hashem answered her tefillah.", "Her son was Shmuel."]}], "practice": [{"t": "order", "q": "Put the eight sefarim of Nevi'im in order (first four).", "tiles": ["Yehoshua", "Shoftim", "Shmuel", "Melachim"], "h": "Leader, judges, then kings.", "why": "The early four: Yehoshua, Shoftim, Shmuel, Melachim."}, {"t": "order", "q": "Put the last four sefarim of Nevi'im in order.", "tiles": ["Yeshayahu", "Yirmiyahu", "Yechezkel", "Trei Asar"], "h": "The twelve come last.", "why": "The late four: Yeshayahu, Yirmiyahu, Yechezkel, Trei Asar."}, {"t": "order", "q": "Put the seven women prophets in order, as Chazal list them.", "tiles": ["Sarah", "Miriam", "Devorah", "Chana", "Avigail", "Chuldah", "Esther"], "h": "Sarah, from the time of the Avos, is first.", "why": "Chazal list them in order of time: Sarah, Miriam, Devorah, Chana, Avigail, Chuldah, Esther."}, {"t": "sort", "q": "Sort: early four or late four?", "bins": [{"id": "E", "label": "Early four"}, {"id": "L", "label": "Late four"}], "items": [{"label": "Yehoshua", "bin": "E"}, {"label": "Shoftim", "bin": "E"}, {"label": "Melachim", "bin": "E"}, {"label": "Yeshayahu", "bin": "L"}, {"label": "Yechezkel", "bin": "L"}, {"label": "Trei Asar", "bin": "L"}], "h": "The early four tell the story.", "why": "Yehoshua, Shoftim, Melachim are early; Yeshayahu, Yechezkel, Trei Asar are late."}, {"t": "sort", "q": "Sort: has his own sefer, or is inside another sefer?", "bins": [{"id": "O", "label": "His own sefer"}, {"id": "I", "label": "Inside another sefer"}], "items": [{"label": "Yeshayahu", "bin": "O"}, {"label": "Yirmiyahu", "bin": "O"}, {"label": "Yechezkel", "bin": "O"}, {"label": "Eliyahu", "bin": "I"}, {"label": "Elisha", "bin": "I"}, {"label": "Nasan", "bin": "I"}], "h": "Eliyahu is in Melachim.", "why": "Yeshayahu, Yirmiyahu and Yechezkel have their own sefer; Eliyahu and Elisha are in Melachim, Nasan in Shmuel."}, {"t": "sort", "q": "Sort each navi to the sefer where we read about him.", "bins": [{"id": "M", "label": "Melachim"}, {"id": "T", "label": "Trei Asar"}, {"id": "S", "label": "Shmuel"}], "items": [{"label": "Eliyahu", "bin": "M"}, {"label": "Chuldah", "bin": "M"}, {"label": "Yonah", "bin": "T"}, {"label": "Malachi", "bin": "T"}, {"label": "Nasan", "bin": "S"}, {"label": "Chana", "bin": "S"}, {"label": "Avigail", "bin": "S"}], "h": "Chana is the mother of Shmuel.", "why": "Eliyahu and Chuldah are in Melachim; Yonah and Malachi in Trei Asar; Nasan, Chana and Avigail in Shmuel."}, {"t": "pairs", "q": "Match each navi to his story.", "pairs": [["Yonah", "swallowed by a big fish"], ["Eliyahu", "fire on Mount Carmel"], ["Shmuel", "anointed Shaul and Dovid"], ["Yechezkel", "saw dry bones come alive"]], "h": "Yonah went to sea.", "why": "Each navi has a famous story."}, {"t": "pairs", "q": "Match each woman prophet to her story.", "pairs": [["Sarah", "Avraham's wife; Hashem told Avraham to listen to her"], ["Miriam", "led the women in song at the Yam Suf"], ["Chana", "her tefillah for a son, Shmuel"], ["Chuldah", "a prophet in the days of King Yoshiyahu"], ["Esther", "the queen who saved Klal Yisrael in the Purim story"]], "h": "Who sang at the sea?", "why": "Each one, as the Torah and Nevi'im tell about her."}, {"t": "pairs", "q": "Match each woman prophet to where we read about her.", "pairs": [["Sarah", "Bereishis"], ["Miriam", "Shemos"], ["Devorah", "Shoftim"], ["Avigail", "Shmuel"], ["Esther", "Megillas Esther"]], "h": "Devorah was a judge.", "why": "Sarah in Bereishis, Miriam in Shemos, Devorah in Shoftim, Avigail in Shmuel, Esther in her Megillah."}, {"t": "spotall", "q": "Tap every sefer of Nevi'im.", "cells": [{"label": "Yehoshua", "ok": true}, {"label": "Melachim", "ok": true}, {"label": "Yirmiyahu", "ok": true}, {"label": "Trei Asar", "ok": true}, {"label": "Tehillim", "ok": false}, {"label": "Bereishis", "ok": false}, {"label": "Mishlei", "ok": false}], "h": "Only eight sefarim in Nevi'im.", "why": "Tehillim and Mishlei are in Kesuvim; Bereishis is in the Torah."}, {"t": "spotall", "q": "Tap every true sentence about the women prophets.", "cells": [{"label": "Miriam led the women in song at the Yam Suf", "ok": true}, {"label": "Chana was the mother of Shmuel", "ok": true}, {"label": "Chuldah lived in the days of King Yoshiyahu", "ok": true}, {"label": "Devorah judged Klal Yisrael", "ok": true}, {"label": "Esther lived in the days of Yehoshua", "ok": false}, {"label": "Chana fought against Golyas", "ok": false}], "h": "Think of each story.", "why": "Esther lived in the Purim story, long after Yehoshua; Dovid fought Golyas."}, {"t": "type", "q": "Trei Asar means how many? Type the number.", "a": "12", "alt": ["twelve"], "h": "Twelve nevi'im in one sefer.", "why": "Trei Asar means twelve."}], "check": [{"t": "order", "q": "Put the late four in order.", "tiles": ["Yeshayahu", "Yirmiyahu", "Yechezkel", "Trei Asar"]}, {"q": "Who was swallowed by a big fish?", "o": ["Yonah", "Eliyahu", "Amos"]}, {"q": "Chuldah was a prophet in the days of which king?", "o": ["Yoshiyahu", "Shaul", "Dovid"]}]},
'LK.CHEM.L03.01':{name:"Chemdas 13: The Rambam's Thirteen Principles of Faith","band": "6-8", "peg": {"kind": "three words", "show": "Hashem · Torah · Future", "say": "Five about Hashem, four about the nevi'im and the Torah, four about reward and the future."}, "op": "Thirteen short lines in the siddur hold the whole foundation of our faith.", "teach": [{"how": "The Rambam gathered thirteen principles of faith. They are printed in the siddur, and each line begins: I believe with complete faith. Principles 1 to 5 are about Hashem Himself.", "q": "Who taught the Thirteen Principles of Faith?", "o": ["The Rambam", "Rashi", "The Chofetz Chaim"], "h": "The same great Rishon who wrote the Mishneh Torah."}, {"how": "1: Hashem created and runs everything. 2: Hashem is One. 3: Hashem has no body. 4: Hashem is first and last. 5: We daven only to Hashem.", "q": "Which principle says Hashem has no body?", "o": ["The third", "The first", "The tenth"], "h": "Created everything, One, no body..."}, {"how": "6: The words of the nevi'im are true. 7: Moshe Rabbeinu was the greatest navi. 8: The whole Torah we have was given to Moshe. 9: The Torah will never be changed. 10: Hashem knows all we do and think. 11: Hashem rewards and punishes. 12: Moshiach will come. 13: The dead will live again.", "q": "What is the twelfth principle?", "o": ["Moshiach will come", "Hashem is One", "The Torah will never be changed"], "h": "We wait for him every day."}], "we": [{"q": "Together: which number says the Torah will never be changed?", "o": ["9", "8", "5"], "steps": ["6 is about the nevi'im.", "7 is Moshe, and 8 is the Torah given to Moshe.", "Right after it, 9: the Torah will never be changed."]}, {"q": "Together: what is the very last principle?", "o": ["The dead will live again", "Moshiach will come", "Hashem is One"], "steps": ["The last two are about the future.", "12 is that Moshiach will come.", "13, the very last: the dead will live again."]}], "practice": [{"t": "order", "q": "Put the first five principles in order.", "tiles": ["Hashem created and runs everything", "Hashem is One", "Hashem has no body", "Hashem is first and last", "We daven only to Hashem"], "h": "All five are about Hashem Himself.", "why": "Principles 1 to 5: Creator, One, no body, first and last, daven only to Him."}, {"t": "order", "q": "Put principles 6 to 9 in order.", "tiles": ["The words of the nevi'im are true", "Moshe was the greatest navi", "The whole Torah was given to Moshe", "The Torah will never be changed"], "h": "From all the nevi'im, to Moshe, to the Torah he gave us.", "why": "Principles 6 to 9 are about the nevi'im and the Torah."}, {"t": "order", "q": "Put the last four principles in order.", "tiles": ["Hashem knows all we do and think", "Hashem rewards and punishes", "Moshiach will come", "The dead will live again"], "h": "Hashem knows first, then rewards; then the future.", "why": "Principles 10 to 13: knowing, reward, Moshiach, the dead live again."}, {"t": "sort", "q": "Sort: which group is each principle in?", "bins": [{"id": "A", "label": "About Hashem (1 to 5)"}, {"id": "B", "label": "Nevi'im and Torah (6 to 9)"}, {"id": "C", "label": "Reward and the future (10 to 13)"}], "items": [{"label": "Hashem has no body", "bin": "A"}, {"label": "We daven only to Hashem", "bin": "A"}, {"label": "Moshe was the greatest navi", "bin": "B"}, {"label": "The Torah will never be changed", "bin": "B"}, {"label": "Moshiach will come", "bin": "C"}, {"label": "Hashem rewards and punishes", "bin": "C"}], "h": "Five, four, four.", "why": "The thirteen fall into three groups: Hashem, the Torah, reward and the future."}, {"t": "pairs", "q": "Match the number to its principle.", "pairs": [["1", "Hashem created and runs everything"], ["2", "Hashem is One"], ["3", "Hashem has no body"], ["5", "We daven only to Hashem"]], "h": "The first five are all about Hashem.", "why": "Principles 1, 2, 3 and 5."}, {"t": "pairs", "q": "Match these numbers to their principles.", "pairs": [["7", "Moshe was the greatest navi"], ["8", "The whole Torah was given to Moshe"], ["10", "Hashem knows all we do and think"], ["13", "The dead will live again"]], "h": "The last one is about the very end of days.", "why": "Principles 7, 8, 10 and 13."}, {"t": "spotall", "q": "Tap every one of the Thirteen Principles.", "cells": [{"label": "Hashem is first and last", "ok": true}, {"label": "The words of the nevi'im are true", "ok": true}, {"label": "Moshiach will come", "ok": true}, {"label": "Hashem knows our thoughts", "ok": true}, {"label": "The Torah will be replaced one day", "ok": false}, {"label": "Hashem has a body", "ok": false}], "h": "Two of these say the opposite of a principle.", "why": "The Torah will never be changed, and Hashem has no body."}, {"t": "spotall", "q": "Tap every principle that is about Hashem Himself.", "cells": [{"label": "Hashem is One", "ok": true}, {"label": "Hashem has no body", "ok": true}, {"label": "Hashem is first and last", "ok": true}, {"label": "The Torah will never be changed", "ok": false}, {"label": "The words of the nevi'im are true", "ok": false}, {"label": "Moshe was the greatest navi", "ok": false}], "h": "Look for principles 1 to 5.", "why": "Principles 1 to 5 describe Hashem; 6 to 9 are about the nevi'im and the Torah."}, {"t": "type", "q": "How many principles of faith did the Rambam count? Type the number.", "a": "13", "alt": ["thirteen"], "h": "Count the lines in the siddur that begin: I believe.", "why": "The Rambam counted thirteen principles."}, {"t": "sort", "q": "Sort: a true principle, or its false opposite?", "bins": [{"id": "T", "label": "A principle of faith"}, {"id": "F", "label": "False opposite"}], "items": [{"label": "Hashem is One", "bin": "T"}, {"label": "There are two powers", "bin": "F"}, {"label": "The whole Torah was given to Moshe", "bin": "T"}, {"label": "A new Torah will come", "bin": "F"}, {"label": "We daven only to Hashem", "bin": "T"}, {"label": "We may daven to angels", "bin": "F"}], "h": "Each false card is the opposite of a principle.", "why": "Hashem is One, the Torah is from Moshe and never changes, and we daven only to Hashem."}, {"t": "order", "q": "Build the words of the twelfth principle in order.", "tiles": ["I believe with complete faith", "in the coming of Moshiach", "and even though he may delay", "I still wait for him every day"], "h": "It starts like every principle: I believe.", "why": "We wait every day for Moshiach to come."}, {"t": "pairs", "q": "Match each group to its numbers.", "pairs": [["About Hashem", "1 to 5"], ["Nevi'im and Torah", "6 to 9"], ["Reward and punishment", "10 and 11"], ["The future", "12 and 13"]], "h": "Five, four, two, two.", "why": "Hashem 1 to 5; nevi'im and Torah 6 to 9; reward 10 and 11; future 12 and 13."}], "check": [{"t": "order", "q": "Put these principles in order.", "tiles": ["Hashem is One", "The words of the nevi'im are true", "Hashem rewards and punishes", "The dead will live again"]}, {"q": "Which principle says Moshe Rabbeinu was the greatest navi?", "o": ["The seventh", "The second", "The twelfth"]}, {"q": "Where do we find the Thirteen Principles printed?", "o": ["In the siddur", "In the Mishnah Berurah", "In Tehillim"]}]},
'LK.CHEM.L03.02':{name:"Chemdas 14: The Chain of Tradition from Sinai","band": "6-8", "peg": {"kind": "song", "show": "Moshe › Yehoshua › Elders › Nevi'im › Great Assembly", "say": "Moshe, Yehoshua, the Elders, the Nevi'im, the Great Assembly; then Tannaim, Amoraim, Geonim, Rishonim, Acharonim."}, "op": "Your rebbe learned from his rebbe, who learned from his rebbe, all the way back to Moshe at Sinai!", "teach": [{"how": "Pirkei Avos begins: Moshe received the Torah from Sinai and passed it to Yehoshua. Yehoshua passed it to the Elders, the Elders to the Nevi'im, and the Nevi'im to the Men of the Great Assembly (Anshei Knesses Hagedolah).", "q": "Who received the Torah from Moshe?", "o": ["Yehoshua", "The Elders", "Aharon"], "h": "Moshe's closest student, who led the people into Eretz Yisrael."}, {"how": "The Men of the Great Assembly are the last link in the first mishnah of Pirkei Avos. They said three things: be careful in judging, raise many students, and make a fence around the Torah.", "q": "Which group comes right after the Nevi'im in the chain?", "o": ["The Men of the Great Assembly", "The Elders", "The Amoraim"], "h": "The first mishnah of Pirkei Avos ends with them."}, {"how": "Later came the eras of Torah teachers: the Tannaim taught the Mishnah, the Amoraim taught the Gemara, then came the Geonim, then the Rishonim (the early ones), then the Acharonim (the later ones), up to our time.", "q": "Who were the teachers of the Mishnah?", "o": ["The Tannaim", "The Geonim", "The Acharonim"], "h": "Theirs is the first of the five eras."}], "we": [{"q": "Together: who passed the Torah to the Nevi'im?", "o": ["The Elders", "Yehoshua", "The Tannaim"], "steps": ["Moshe gave it to Yehoshua.", "Yehoshua gave it to the Elders.", "The Elders gave it to the Nevi'im."]}, {"q": "Together: which era comes right before the Acharonim?", "o": ["The Rishonim", "The Geonim", "The Tannaim"], "steps": ["Acharonim means the later ones.", "Rishonim means the early ones.", "The early ones come right before the later ones."]}], "practice": [{"t": "order", "q": "Put the chain of the first mishnah in Pirkei Avos in order.", "tiles": ["Moshe", "Yehoshua", "The Elders", "The Nevi'im", "The Men of the Great Assembly"], "h": "Moshe received it at Sinai.", "why": "Moshe, Yehoshua, the Elders, the Nevi'im, the Men of the Great Assembly."}, {"t": "order", "q": "Put the five eras of Torah teachers in order.", "tiles": ["Tannaim", "Amoraim", "Geonim", "Rishonim", "Acharonim"], "h": "Mishnah, then Gemara, then the rest.", "why": "Tannaim, Amoraim, Geonim, Rishonim, Acharonim."}, {"t": "pairs", "q": "Match each era to what it is known for.", "pairs": [["Tannaim", "teachers of the Mishnah"], ["Amoraim", "teachers of the Gemara"], ["Geonim", "heads of the great yeshivos in Bavel"], ["Rishonim", "the early ones, like Rashi"], ["Acharonim", "the later ones, like the Chofetz Chaim"]], "h": "Rishonim means early; Acharonim means later.", "why": "Each era has its own job in the chain."}, {"t": "sort", "q": "Sort: Rishon or Acharon?", "bins": [{"id": "R", "label": "Rishonim (early)"}, {"id": "A", "label": "Acharonim (later)"}], "items": [{"label": "Rashi", "bin": "R"}, {"label": "the Rambam", "bin": "R"}, {"label": "the Ramban", "bin": "R"}, {"label": "Tosafos", "bin": "R"}, {"label": "the Chofetz Chaim", "bin": "A"}, {"label": "the Vilna Gaon", "bin": "A"}, {"label": "the Chasam Sofer", "bin": "A"}], "h": "The Chofetz Chaim lived not long ago.", "why": "Rashi, the Rambam, the Ramban and Tosafos are Rishonim; the others are Acharonim."}, {"t": "spotall", "q": "Tap every link in the first mishnah of Pirkei Avos.", "cells": [{"label": "Moshe", "ok": true}, {"label": "Yehoshua", "ok": true}, {"label": "the Elders", "ok": true}, {"label": "the Nevi'im", "ok": true}, {"label": "the Men of the Great Assembly", "ok": true}, {"label": "Aharon", "ok": false}, {"label": "the Rambam", "ok": false}], "h": "Five links, from Moshe to the Great Assembly.", "why": "The mishnah names Moshe, Yehoshua, the Elders, the Nevi'im and the Men of the Great Assembly."}, {"t": "spotall", "q": "Tap every thing the Men of the Great Assembly said.", "cells": [{"label": "be careful in judging", "ok": true}, {"label": "raise many students", "ok": true}, {"label": "make a fence around the Torah", "ok": true}, {"label": "build the Beis Hamikdash", "ok": false}, {"label": "write the Gemara", "ok": false}], "h": "They said three things.", "why": "Be careful in judging, raise many students, make a fence around the Torah."}, {"t": "pairs", "q": "Match who passed the Torah to whom.", "pairs": [["Moshe", "to Yehoshua"], ["Yehoshua", "to the Elders"], ["The Elders", "to the Nevi'im"], ["The Nevi'im", "to the Men of the Great Assembly"]], "h": "Each link hands it to the next.", "why": "That is the chain of the first mishnah in Pirkei Avos."}, {"t": "sort", "q": "Sort: a link in the first mishnah of Pirkei Avos, or a later era?", "bins": [{"id": "L", "label": "First mishnah of Pirkei Avos"}, {"id": "E", "label": "A later era"}], "items": [{"label": "Yehoshua", "bin": "L"}, {"label": "the Elders", "bin": "L"}, {"label": "the Nevi'im", "bin": "L"}, {"label": "Tannaim", "bin": "E"}, {"label": "Geonim", "bin": "E"}, {"label": "Acharonim", "bin": "E"}], "h": "The mishnah ends at the Great Assembly.", "why": "Yehoshua, the Elders and the Nevi'im are in the mishnah; the eras came later."}, {"t": "order", "q": "Put these Torah giants in order of time.", "tiles": ["Rabbi Yehudah Hanasi, a Tanna", "Rav Ashi, an Amora", "Rashi, a Rishon", "the Chofetz Chaim, an Acharon"], "h": "Follow the eras: Tannaim, Amoraim, Rishonim, Acharonim.", "why": "Each one lived in a later era than the one before."}, {"t": "type", "q": "Moshe received the Torah from which mountain? Type its name.", "a": "Sinai", "alt": ["Har Sinai", "Mount Sinai"], "h": "The first words of Pirkei Avos tell you.", "why": "Moshe received the Torah from Sinai."}, {"t": "spotall", "q": "Tap every era that came after the Gemara was finished.", "cells": [{"label": "Geonim", "ok": true}, {"label": "Rishonim", "ok": true}, {"label": "Acharonim", "ok": true}, {"label": "Tannaim", "ok": false}, {"label": "Amoraim", "ok": false}], "h": "The Amoraim taught the Gemara.", "why": "After the Amoraim came the Geonim, the Rishonim and the Acharonim."}], "check": [{"t": "order", "q": "Put the chain in order.", "tiles": ["Moshe", "Yehoshua", "The Elders", "The Nevi'im", "The Great Assembly"]}, {"q": "Where is the chain from Moshe written?", "o": ["The first mishnah of Pirkei Avos", "The end of Tehillim", "The Shulchan Aruch"]}, {"q": "Which era came right after the Amoraim?", "o": ["The Geonim", "The Rishonim", "The Tannaim"]}]},
'LK.CHEM.L03.03':{name:"Chemdas 15: The Great Sefarim and Who Wrote Them","band": "6-8", "peg": {"kind": "song", "show": "Mishnah › Gemara › Rashi › Rambam › Shulchan Aruch › Mishnah Berurah", "say": "Rabbi Yehudah Hanasi, the Gemara, Rashi, the Rambam, Rabbi Yosef Karo, the Chofetz Chaim."}, "op": "Six great sefarim sit on your rebbe's shelf, each one written by a giant. Can you match each one to its author?", "teach": [{"how": "Rabbi Yehudah Hanasi gathered the teachings of the Tannaim and wrote down the Mishnah, in six sedarim. Later the Amoraim discussed every mishnah; that is the Gemara. Rav Ashi and Ravina completed the Babylonian Gemara.", "q": "Who wrote down the Mishnah?", "o": ["Rabbi Yehudah Hanasi", "Rashi", "Rabbi Yosef Karo"], "h": "He was the great leader of the Tannaim in his time."}, {"how": "Rashi wrote the main explanation of Chumash and of the Gemara. The Rambam wrote the Mishneh Torah: all the halachos of the whole Torah, in fourteen books.", "q": "What great sefer of halachah did the Rambam write?", "o": ["The Mishneh Torah", "The Mishnah Berurah", "The Gemara"], "h": "Its name sounds like Mishnah, but it is a sefer of halachos."}, {"how": "Rabbi Yosef Karo wrote the Shulchan Aruch, the code of halachah we follow. The Chofetz Chaim wrote the Mishnah Berurah, explaining the part of the Shulchan Aruch about daily life, davening, Shabbos and Yom Tov.", "q": "Who wrote the Mishnah Berurah?", "o": ["The Chofetz Chaim", "The Rambam", "Rabbi Yehudah Hanasi"], "h": "He is also famous for his sefer about guarding our speech."}], "we": [{"q": "Together: which came first, Rashi or the Shulchan Aruch?", "o": ["Rashi", "The Shulchan Aruch", "They came at the same time"], "steps": ["Rashi was one of the Rishonim.", "The Shulchan Aruch was written hundreds of years later.", "So Rashi came first."]}, {"q": "Together: the Mishnah Berurah explains which sefer?", "o": ["The Shulchan Aruch", "The Gemara", "Tehillim"], "steps": ["The Chofetz Chaim wrote the Mishnah Berurah.", "He wrote it on the Shulchan Aruch.", "On the part about daily life, Shabbos and Yom Tov."]}], "practice": [{"t": "order", "q": "Put these sefarim in the order they were written.", "tiles": ["Mishnah", "Gemara", "Rashi's explanation", "Mishneh Torah", "Shulchan Aruch", "Mishnah Berurah"], "h": "Each one builds on the ones before it.", "why": "Mishnah, Gemara, Rashi, the Rambam, the Shulchan Aruch, the Mishnah Berurah."}, {"t": "pairs", "q": "Match each sefer to its author.", "pairs": [["Mishnah", "Rabbi Yehudah Hanasi"], ["Mishneh Torah", "the Rambam"], ["Shulchan Aruch", "Rabbi Yosef Karo"], ["Mishnah Berurah", "the Chofetz Chaim"]], "h": "Mishnah and Mishneh Torah are different sefarim.", "why": "Each great sefer and the giant who wrote it."}, {"t": "order", "q": "Put these authors in order of time.", "tiles": ["Rabbi Yehudah Hanasi", "Rashi", "the Rambam", "Rabbi Yosef Karo", "the Chofetz Chaim"], "h": "A Tanna first, an Acharon last.", "why": "Rabbi Yehudah Hanasi, Rashi, the Rambam, Rabbi Yosef Karo, the Chofetz Chaim."}, {"t": "sort", "q": "Sort: Tanna, Rishon, or Acharon?", "bins": [{"id": "T", "label": "Tanna"}, {"id": "R", "label": "Rishon"}, {"id": "A", "label": "Acharon"}], "items": [{"label": "Rabbi Yehudah Hanasi", "bin": "T"}, {"label": "Rabbi Akiva", "bin": "T"}, {"label": "Rashi", "bin": "R"}, {"label": "the Rambam", "bin": "R"}, {"label": "the Chofetz Chaim", "bin": "A"}, {"label": "the Vilna Gaon", "bin": "A"}], "h": "Tannaim taught the Mishnah.", "why": "Tannaim of the Mishnah, Rishonim like Rashi, Acharonim like the Chofetz Chaim."}, {"t": "spotall", "q": "Tap every thing the Rambam wrote.", "cells": [{"label": "Mishneh Torah", "ok": true}, {"label": "Sefer Hamitzvos", "ok": true}, {"label": "the Thirteen Principles of Faith", "ok": true}, {"label": "the Shulchan Aruch", "ok": false}, {"label": "the Mishnah Berurah", "ok": false}, {"label": "the Mishnah", "ok": false}], "h": "He was a Rishon, not a Tanna and not an Acharon.", "why": "The Rambam wrote the Mishneh Torah, the Sefer Hamitzvos and the Thirteen Principles."}, {"t": "pairs", "q": "Match each sefer to what it is.", "pairs": [["Mishnah", "the Tannaim's teachings, in six sedarim"], ["Gemara", "the Amoraim's discussion of the Mishnah"], ["Rashi", "the main explanation of Chumash and Gemara"], ["Shulchan Aruch", "the code of halachah we follow"]], "h": "Think of who wrote each one.", "why": "Each sefer has its own job."}, {"t": "type", "q": "Who wrote the Shulchan Aruch? Type his first name: Rabbi ___ Karo.", "a": "Yosef", "alt": ["Yoseph", "Joseph"], "h": "The same name as Yaakov's son.", "why": "Rabbi Yosef Karo wrote the Shulchan Aruch."}, {"t": "spotall", "q": "Tap every true fact about Rashi.", "cells": [{"label": "he explained Chumash", "ok": true}, {"label": "he explained the Gemara", "ok": true}, {"label": "he was one of the Rishonim", "ok": true}, {"label": "he lived in France", "ok": true}, {"label": "he wrote the Mishnah", "ok": false}, {"label": "he wrote the Shulchan Aruch", "ok": false}], "h": "Rashi explains; he did not write the Mishnah or the code of halachah.", "why": "Rashi, a Rishon from France, explained Chumash and Gemara."}, {"t": "sort", "q": "Sort: written before the Rambam, or after?", "bins": [{"id": "B", "label": "Before the Rambam"}, {"id": "A", "label": "After the Rambam"}], "items": [{"label": "Mishnah", "bin": "B"}, {"label": "Gemara", "bin": "B"}, {"label": "Rashi's explanation", "bin": "B"}, {"label": "Shulchan Aruch", "bin": "A"}, {"label": "Mishnah Berurah", "bin": "A"}], "h": "Rashi lived a little before the Rambam.", "why": "Mishnah, Gemara and Rashi came before; the Shulchan Aruch and Mishnah Berurah came after."}, {"t": "pairs", "q": "Match each author to what else he is known for.", "pairs": [["the Chofetz Chaim", "guarding our speech"], ["the Rambam", "the Thirteen Principles"], ["Rabbi Yehudah Hanasi", "leader of the Tannaim"]], "h": "Which one wrote a sefer about speech?", "why": "Each giant is known for more than one thing."}, {"t": "spotall", "q": "Tap every sefer of halachah.", "cells": [{"label": "Mishneh Torah", "ok": true}, {"label": "Shulchan Aruch", "ok": true}, {"label": "Mishnah Berurah", "ok": true}, {"label": "Rashi on Chumash", "ok": false}, {"label": "Tehillim", "ok": false}], "h": "Halachah tells us what to do.", "why": "The Mishneh Torah, the Shulchan Aruch and the Mishnah Berurah teach halachah."}], "check": [{"t": "order", "q": "Put the sefarim in order.", "tiles": ["Mishnah", "Gemara", "Shulchan Aruch", "Mishnah Berurah"]}, {"q": "Who wrote the Mishneh Torah?", "o": ["The Rambam", "Rashi", "The Chofetz Chaim"]}, {"q": "Who wrote the Shulchan Aruch?", "o": ["Rabbi Yosef Karo", "Rabbi Yehudah Hanasi", "Rashi"]}]},
'LK.CHEM.L03.04':{name:"Chemdas 16: The Two Batei Mikdash","band": "6-8", "peg": {"kind": "three words", "show": "Built · Destroyed · Tisha B'Av", "say": "Shlomo built the first and Bavel destroyed it; the returning Jews built the second and Rome destroyed it; both on Tisha B'Av."}, "op": "Twice we had a Beis Hamikdash. Twice it was destroyed, on the very same day of the year!", "teach": [{"how": "Shlomo Hamelech, the son of Dovid Hamelech, built the first Beis Hamikdash in Yerushalayim. It stood for 410 years, until Nevuchadnetzar, king of Bavel, destroyed it.", "q": "Who built the first Beis Hamikdash?", "o": ["Shlomo Hamelech", "Dovid Hamelech", "Yehoshua"], "h": "Dovid prepared for it, but his son built it."}, {"how": "Koresh, king of Persia, allowed the Jews to return from Bavel, and they built the second Beis Hamikdash. It stood for 420 years, until the Romans, led by Titus, destroyed it.", "q": "Who destroyed the second Beis Hamikdash?", "o": ["The Romans", "Bavel", "Persia"], "h": "Titus led their army."}, {"how": "Both were destroyed on the same day: Tisha B'Av, the ninth of Av. The Gemara says the first fell because of terrible sins like idol worship, and the second because of hatred for no reason. We daven every day for the third, which will be built when Moshiach comes.", "q": "On which day were both destroyed?", "o": ["Tisha B'Av", "Purim", "Yom Kippur"], "h": "The ninth day of the month of Av."}], "we": [{"q": "Together: who destroyed the first Beis Hamikdash?", "o": ["Nevuchadnetzar, king of Bavel", "Titus of Rome", "Koresh of Persia"], "steps": ["The first was built by Shlomo.", "It stood 410 years.", "Nevuchadnetzar of Bavel destroyed it."]}, {"q": "Together: why was the second Beis Hamikdash destroyed?", "o": ["Hatred for no reason", "There were too few sefarim", "A great storm"], "steps": ["The second stood 420 years.", "People learned Torah and did mitzvos.", "But they hated each other for no reason."]}], "practice": [{"t": "sort", "q": "Sort: first Beis Hamikdash or second?", "bins": [{"id": "F", "label": "First"}, {"id": "S", "label": "Second"}], "items": [{"label": "built by Shlomo Hamelech", "bin": "F"}, {"label": "destroyed by Bavel", "bin": "F"}, {"label": "stood 410 years", "bin": "F"}, {"label": "built after the return from Bavel", "bin": "S"}, {"label": "destroyed by the Romans", "bin": "S"}, {"label": "stood 420 years", "bin": "S"}], "h": "Shlomo and Bavel go with the first.", "why": "First: Shlomo, Bavel, 410. Second: the return, Rome, 420."}, {"t": "order", "q": "Put the history in order.", "tiles": ["Shlomo builds the first Beis Hamikdash", "Bavel destroys it", "The Jews return from Bavel", "The second Beis Hamikdash is built", "The Romans destroy it"], "h": "Built, destroyed, return, built again, destroyed again.", "why": "That is the story of the two Batei Mikdash."}, {"t": "pairs", "q": "Match each part of the story to the king or army.", "pairs": [["built the first", "Shlomo Hamelech"], ["destroyed the first", "Nevuchadnetzar of Bavel"], ["allowed the second to be built", "Koresh of Persia"], ["destroyed the second", "Titus of Rome"]], "h": "Two builders, two destroyers.", "why": "Shlomo built, Bavel destroyed; Koresh allowed, Rome destroyed."}, {"t": "spotall", "q": "Tap every true fact about Tisha B'Av.", "cells": [{"label": "the first Beis Hamikdash was destroyed", "ok": true}, {"label": "the second Beis Hamikdash was destroyed", "ok": true}, {"label": "it is the ninth of Av", "ok": true}, {"label": "it is a fast day", "ok": true}, {"label": "it is a happy Yom Tov", "ok": false}, {"label": "it is in the month of Nissan", "ok": false}], "h": "It is the saddest day of the year.", "why": "Both Batei Mikdash fell on the ninth of Av, and we fast."}, {"t": "type", "q": "How many years did the first Beis Hamikdash stand? Type the number.", "a": "410", "alt": ["four hundred ten", "four hundred and ten"], "h": "Ten less than the second one.", "why": "The first stood 410 years; the second 420."}, {"t": "pairs", "q": "Match each number to its fact.", "pairs": [["410", "years the first one stood"], ["420", "years the second one stood"], ["9", "the day of Av both were destroyed"], ["2", "Batei Mikdash that have stood so far"]], "h": "The second stood ten years longer.", "why": "410, 420, the ninth of Av, and two so far."}, {"t": "sort", "q": "Sort: did they build it, or destroy it?", "bins": [{"id": "B", "label": "Built"}, {"id": "D", "label": "Destroyed"}], "items": [{"label": "Shlomo Hamelech", "bin": "B"}, {"label": "the Jews who returned from Bavel", "bin": "B"}, {"label": "Nevuchadnetzar", "bin": "D"}, {"label": "Titus", "bin": "D"}, {"label": "the army of Rome", "bin": "D"}], "h": "Two kinds of people in this story.", "why": "Shlomo and the returning Jews built; Bavel and Rome destroyed."}, {"t": "order", "q": "Put the four kingdoms that ruled over the Jews in order.", "tiles": ["Bavel", "Persia", "Greece", "Rome"], "h": "Bavel destroyed the first, Rome the second.", "why": "Bavel, Persia, Greece, then Rome."}, {"t": "spotall", "q": "Tap every true fact about the second Beis Hamikdash.", "cells": [{"label": "the Jews built it after returning from Bavel", "ok": true}, {"label": "the Romans destroyed it", "ok": true}, {"label": "it stood 420 years", "ok": true}, {"label": "Shlomo Hamelech built it", "ok": false}, {"label": "it was destroyed on Purim", "ok": false}], "h": "Shlomo built the first one.", "why": "The second was built after the return, stood 420 years, and Rome destroyed it."}, {"t": "pairs", "q": "Match the person to his part in the story.", "pairs": [["Dovid Hamelech", "prepared to build it"], ["Shlomo Hamelech", "built the first"], ["Nevuchadnetzar", "destroyed the first"], ["Titus", "destroyed the second"]], "h": "Father prepared, son built.", "why": "Dovid prepared, Shlomo built; Bavel and Rome destroyed."}, {"t": "spotall", "q": "Tap every way we remember the Beis Hamikdash.", "cells": [{"label": "we fast on Tisha B'Av", "ok": true}, {"label": "we daven for it to be rebuilt", "ok": true}, {"label": "we leave a small part of a wall unpainted", "ok": true}, {"label": "we make a big party on Tisha B'Av", "ok": false}, {"label": "we try to forget it", "ok": false}], "h": "We remember with sadness and with tefillah.", "why": "We fast, we daven, and we leave a sign of the destruction in our homes."}], "check": [{"t": "order", "q": "Put it in order.", "tiles": ["First Beis Hamikdash built", "Destroyed by Bavel", "Second Beis Hamikdash built", "Destroyed by Rome"]}, {"q": "Who built the first Beis Hamikdash?", "o": ["Shlomo Hamelech", "Koresh", "Titus"]}, {"q": "Both Batei Mikdash were destroyed on...", "o": ["Tisha B'Av", "the tenth of Teves", "the first of Nissan"]}]},
'LK.CHEM.L03.05':{name:"Chemdas 17: The Four Fasts and What They Remember","band": "6-8", "peg": {"kind": "rhyme", "show": "3 Tishrei · 10 Teves · 17 Tammuz · 9 Av", "say": "Gedaliah, the siege, the wall, the fall."}, "op": "Four days a year we fast and remember, step by step, how the Beis Hamikdash was lost.", "teach": [{"how": "The Tenth of Teves: Nevuchadnetzar, king of Bavel, began the siege around Yerushalayim. The Seventeenth of Tammuz: the walls of Yerushalayim were broken through, and on that day Moshe broke the first Tablets.", "q": "What happened on the Tenth of Teves?", "o": ["The siege of Yerushalayim began", "The Beis Hamikdash burned", "Gedaliah was killed"], "h": "The first step: the enemy surrounds the city."}, {"how": "Tisha B'Av, the ninth of Av: both Batei Mikdash were destroyed. It is the saddest day of the year, and we fast from sunset to nightfall.", "q": "Which fast remembers both Batei Mikdash being destroyed?", "o": ["Tisha B'Av", "The Fast of Gedaliah", "The Tenth of Teves"], "h": "The ninth day of Av."}, {"how": "The Fast of Gedaliah, the day after Rosh Hashanah: Gedaliah, the good Jewish governor left in Eretz Yisrael after the first destruction, was killed, and the last Jews there were scattered.", "q": "Who does the Fast of Gedaliah remember?", "o": ["Gedaliah, the Jewish governor", "Nevuchadnetzar", "Titus"], "h": "The fast is named after him."}], "we": [{"q": "Together: what happened on the Seventeenth of Tammuz?", "o": ["The walls of Yerushalayim were broken through", "The siege began", "Gedaliah was killed"], "steps": ["First came the siege, on the Tenth of Teves.", "Next, the walls were broken.", "That was the Seventeenth of Tammuz."]}, {"q": "Together: about how long is it from the Seventeenth of Tammuz to Tisha B'Av?", "o": ["Three weeks", "One week", "Seven weeks"], "steps": ["From the 17th of Tammuz to the 9th of Av.", "That is about three weeks.", "We call this time the Three Weeks."]}], "practice": [{"t": "order", "q": "Put the four fasts in calendar order, starting from Tishrei.", "tiles": ["The Fast of Gedaliah", "The Tenth of Teves", "The Seventeenth of Tammuz", "Tisha B'Av"], "h": "Tishrei, Teves, Tammuz, Av.", "why": "The year starts in Tishrei: Gedaliah, then Teves, Tammuz and Av."}, {"t": "order", "q": "Put the story of the destruction in order.", "tiles": ["The siege begins", "The walls are broken", "The Beis Hamikdash is destroyed", "Gedaliah is killed"], "h": "Gedaliah was killed after the destruction.", "why": "Siege, walls, fire, and then Gedaliah."}, {"t": "pairs", "q": "Match each fast to what it remembers.", "pairs": [["The Tenth of Teves", "the siege began"], ["The Seventeenth of Tammuz", "the walls were broken"], ["Tisha B'Av", "both Batei Mikdash destroyed"], ["The Fast of Gedaliah", "the good governor was killed"]], "h": "Siege, walls, fire, Gedaliah.", "why": "Each fast remembers one step of the destruction."}, {"t": "pairs", "q": "Match each date to what happened.", "pairs": [["3 Tishrei", "Gedaliah was killed"], ["10 Teves", "the siege began"], ["17 Tammuz", "the walls were broken through"], ["9 Av", "the Beis Hamikdash burned"]], "h": "The fast of Teves is the first step of the story.", "why": "These are the dates of the four fasts."}, {"t": "sort", "q": "Sort: when does the fast begin?", "bins": [{"id": "L", "label": "From sunset"}, {"id": "S", "label": "From dawn"}], "items": [{"label": "Tisha B'Av", "bin": "L"}, {"label": "Yom Kippur", "bin": "L"}, {"label": "The Fast of Gedaliah", "bin": "S"}, {"label": "The Tenth of Teves", "bin": "S"}, {"label": "The Seventeenth of Tammuz", "bin": "S"}], "h": "Only the two biggest fasts begin the night before.", "why": "Tisha B'Av and Yom Kippur begin at sunset; the others begin at dawn."}, {"t": "spotall", "q": "Tap every thing that happened on the Seventeenth of Tammuz.", "cells": [{"label": "Moshe broke the first Tablets", "ok": true}, {"label": "the walls of Yerushalayim were broken through", "ok": true}, {"label": "the
