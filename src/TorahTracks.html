{how:'The Jewish calendar follows the moon. Each month starts at the new moon, Rosh Chodesh. There are twelve months, and some years have thirteen.', q:'What starts each Jewish month?', o:['The new moon, Rosh Chodesh','The first Sunday','A full moon']},
{how:'Counting from Nisan, the month we left Mitzrayim: Nisan, Iyar, Sivan, Tammuz, Av, Elul, Tishrei, Cheshvan, Kislev, Teves, Shevat, Adar.', q:'Which month is first when the Torah counts the months?', o:['Nisan','Tishrei','Adar']},
{how:'In a leap year there are two Adars, Adar Rishon and Adar Sheni, so that Pesach always comes in the spring.', q:'Why do some years have two Adars?', o:['So Pesach stays in the spring','Because Purim is long','By mistake']}
],
practice:[
{q:'Which month has Chanukah?', o:['Kislev','Sivan','Av'], h:'It begins on the 25th of this month.'},
{q:'Which month has Shavuos?', o:['Sivan','Kislev','Elul'], h:'Seven weeks after Pesach.'},
{q:'Which month comes right before Rosh Hashanah, when we blow the shofar every morning?', o:['Elul','Nisan','Teves'], h:'The month of teshuvah and preparation.'},
{t:'order', q:'Put these months in order, starting from Tishrei.', tiles:['Tishrei','Cheshvan','Kislev','Teves','Shevat'], h:'Tishrei, then Cheshvan, then the Chanukah month.'},
{q:'Tu B\'Shvat, the new year for trees, is in which month?', o:['Shevat','Adar','Tammuz'], h:'Tu means fifteen: the fifteenth of this month.'},
{q:'What is the sad day of Tishah B\'Av?', o:['The day both Batei Mikdash were destroyed','A Yom Tov with a seudah','The day we got the Torah'], h:'Av is the month of mourning.'}
],
check:[
{q:'How do Jewish months begin?', o:['With the new moon','With the sun\'s birthday','On Mondays']},
{q:'Which month has Pesach?', o:['Nisan','Tishrei','Kislev']},
{q:'What is a year with two Adars called?', o:['A leap year, shanah me\'uberes','A short year','A Shemittah year']}
]},
'LK.YT.L02.02':{name:'Yom Tov 6: Sefirah and Shavuos',
teach:[
{how:'From the second night of Pesach we count forty-nine days, seven weeks. This is Sefiras Ha\'omer. We count every night with a brachah.', q:'How many days do we count in Sefirah?', o:['Forty-nine','Forty','Fifty-four']},
{how:'On the fiftieth day is Shavuos, when we got the Torah at Har Sinai. Shavuos means weeks.', q:'What happened on Shavuos?', o:['We got the Torah at Har Sinai','We left Mitzrayim','The Beis Hamikdash was built']},
{how:'During Sefirah we remember the twenty-four thousand students of Rabbi Akiva who died because they did not give each other enough honor. Lag Ba\'omer, the thirty-third day, is a day of joy.', q:'What lesson do we learn from Rabbi Akiva\'s students?', o:['To give each other honor','To count faster','To eat dairy']}
],
practice:[
{q:'If we forget to count one whole day, what happens?', o:['We keep counting without a brachah','We start over','We stop counting'], h:'Ask your rebbe; most poskim say we continue without the brachah.'},
{q:'What does Shavuos mean?', o:['Weeks','Booths','Lights'], h:'Seven weeks of counting.'},
{q:'Which mountain did we get the Torah on?', o:['Har Sinai','Har Hamoriah','Har Hacarmel'], h:'A small, humble mountain.'},
{q:'What day of the Omer is Lag Ba\'omer?', o:['The thirty-third','The tenth','The forty-ninth'], h:'Lamed-Gimmel is 33.'},
{q:'Many people eat dairy on Shavuos. One reason given is…', o:['The Torah is compared to milk','Meat is not allowed on Yom Tov','Cheese is round like the moon'], h:'Milk and honey under your tongue: the Torah is sweet and nourishing.'},
{q:'Which Megillah do we read on Shavuos?', o:['Megillas Rus','Megillas Esther','Eichah'], h:'Rus accepted the Torah with all her heart.'}
],
check:[
{q:'What do we count between Pesach and Shavuos?', o:['The Omer','The stars','The parshiyos']},
{q:'What do we celebrate on Shavuos?', o:['Getting the Torah','Leaving Mitzrayim','Chanukah lights']},
{q:'How many weeks do we count?', o:['Seven','Four','Twelve']}
]},
/* ===== HALACHA ===== */
'LK.HAL.L01.01':{name:'Halacha 1: Which Brachah? Fruits and Vegetables',
teach:[
{how:'Before we eat, we thank Hashem with a brachah. Fruit that grows on a tree gets Borei Pri Ha\'eitz. An orange, an apple and a peach all grow on trees.', q:'Which brachah do we make on an orange?', pic:'בּוֹרֵא פְּרִי הָעֵץ', o:['Borei Pri Ha\'eitz','Borei Pri Ha\'adamah','Shehakol']},
{how:'Food that grows from the ground, not on a tree, gets Borei Pri Ha\'adamah. Carrots, potatoes, cucumbers, bananas and strawberries get Ha\'adamah.', q:'Which brachah do we make on a carrot?', pic:'בּוֹרֵא פְּרִי הָאֲדָמָה', o:['Borei Pri Ha\'adamah','Borei Pri Ha\'eitz','Hamotzi']},
{how:'A banana grows on a plant whose trunk does not last from year to year, so a banana is Ha\'adamah, not Ha\'eitz. Strawberries grow low on the ground: Ha\'adamah too.', q:'Which brachah do we make on a banana?', o:['Borei Pri Ha\'adamah','Borei Pri Ha\'eitz','Mezonos']}
],
practice:[
{q:'Which brachah on an apple?', o:['Borei Pri Ha\'eitz','Borei Pri Ha\'adamah','Shehakol'], h:'Apples grow on trees.'},
{q:'Which brachah on a potato chip?', o:['Borei Pri Ha\'adamah','Borei Pri Ha\'eitz','Hagafen'], h:'Potatoes grow in the ground. Ask your rebbe about your minhag.'},
{q:'Which brachah on a strawberry?', o:['Borei Pri Ha\'adamah','Borei Pri Ha\'eitz','Shehakol'], h:'It grows low on the ground.'},
{q:'Which brachah on grapes (the fruit)?', o:['Borei Pri Ha\'eitz','Borei Pri Hagafen','Shehakol'], h:'Eating grapes is Ha\'eitz; grape juice and wine are Hagafen.'},
{q:'Which brachah on a cucumber?', o:['Borei Pri Ha\'adamah','Borei Pri Ha\'eitz','Mezonos'], h:'It grows on a vine on the ground.'},
{q:'Which brachah on a pear?', o:['Borei Pri Ha\'eitz','Borei Pri Ha\'adamah','Hamotzi'], h:'Pears grow on trees.'}
],
check:[
{q:'Which brachah on a peach?', o:['Borei Pri Ha\'eitz','Borei Pri Ha\'adamah','Shehakol']},
{q:'Which brachah on a tomato?', o:['Borei Pri Ha\'adamah','Borei Pri Ha\'eitz','Mezonos']},
{q:'Which brachah on an orange?', o:['Borei Pri Ha\'eitz','Shehakol','Hagafen']}
]},
'LK.HAL.L01.02':{name:'Halacha 2: Hamotzi, Mezonos, Hagafen, Shehakol',
teach:[
{how:'Bread gets the special brachah Hamotzi Lechem Min Ha\'aretz. Before Hamotzi we wash our hands with a cup and say Al Netilas Yadayim.', q:'Which brachah do we make on bread?', pic:'הַמּוֹצִיא לֶחֶם מִן הָאָרֶץ', o:['Hamotzi','Mezonos','Shehakol']},
{how:'Cake, cookies, crackers and pasta, made from the five grains (wheat, barley, oats, rye, spelt), get Borei Minei Mezonos.', q:'Which brachah do we make on a cookie?', pic:'בּוֹרֵא מִינֵי מְזוֹנוֹת', o:['Mezonos','Hamotzi','Ha\'eitz']},
{how:'Wine and grape juice get Borei Pri Hagafen. Most other foods and drinks, like water, milk, meat, eggs, fish and candy, get Shehakol.', q:'Which brachah do we make on a cup of milk?', pic:'שֶׁהַכֹּל נִהְיָה בִּדְבָרוֹ', o:['Shehakol','Hagafen','Ha\'adamah']}
],
practice:[
{q:'Which brachah on grape juice?', o:['Borei Pri Hagafen','Borei Pri Ha\'eitz','Shehakol'], h:'Wine and grape juice have their own brachah.'},
{q:'Which brachah on a piece of chicken?', o:['Shehakol','Mezonos','Ha\'adamah'], h:'Meat, fish and eggs: Shehakol.'},
{q:'Which brachah on spaghetti?', o:['Mezonos','Hamotzi','Ha\'adamah'], h:'Pasta is made from wheat.'},
{q:'What do we do before eating bread?', o:['Wash our hands with a cup','Nothing at all','Say Shema'], h:'Netilas Yadayim, then Hamotzi.'},
{q:'Which brachah on a glass of water?', o:['Shehakol','Ha\'eitz','Hagafen'], h:'Water is not from a tree or the ground.'},
{q:'Which brachah on a chocolate bar?', o:['Shehakol','Ha\'eitz','Mezonos'], h:'Ask your rebbe; most say Shehakol.'}
],
check:[
{q:'Which brachah on challah?', o:['Hamotzi','Mezonos','Shehakol']},
{q:'Which brachah on cake?', o:['Mezonos','Hamotzi','Hagafen']},
{q:'Which brachah on an egg?', o:['Shehakol','Ha\'adamah','Ha\'eitz']}
]},
'LK.HAL.L01.03':{name:'Halacha 3: Brachos After We Eat',
teach:[
{how:'After we eat bread, we bentch: we say Birkas Hamazon. The Torah says: you will eat, be satisfied, and bless Hashem.', q:'What do we say after eating bread?', o:['Birkas Hamazon, bentching','Borei Nefashos','Nothing']},
{how:'After cake or cookies (mezonos), wine or grape juice, or the special fruits of Eretz Yisrael, we say Al Hamichyah, a short three-in-one brachah.', q:'What do we say after eating a big piece of cake?', o:['Al Hamichyah','Birkas Hamazon','Hamotzi']},
{how:'After most other foods, like apples, carrots, milk or chicken, we say Borei Nefashos.', q:'What do we say after eating an apple?', o:['Borei Nefashos','Al Hamichyah','Birkas Hamazon']}
],
practice:[
{q:'After a glass of water, what brachah do we say after?', o:['Borei Nefashos','Birkas Hamazon','Al Hamichyah'], h:'Most foods and drinks: Borei Nefashos.'},
{q:'After a sandwich, what do we say?', o:['Birkas Hamazon','Borei Nefashos','Al Hamichyah'], h:'A sandwich has bread.'},
{q:'After grape juice, what do we say?', o:['Al Hamichyah (Al Hagefen)','Borei Nefashos','Birkas Hamazon'], h:'Grape juice is one of the special three-in-one foods.'},
{q:'Which of these is one of the seven special fruits of Eretz Yisrael?', o:['Dates','Bananas','Apples'], h:'Wheat, barley, grapes, figs, pomegranates, olives and dates.'},
{q:'Where does the Torah tell us to bentch?', o:['V\'achalta v\'savata u\'veirachta','Shema Yisrael','Bereishis bara'], h:'You will eat, be satisfied, and bless.'},
{q:'After a bowl of cereal made from wheat, which after-brachah?', o:['Al Hamichyah','Birkas Hamazon','Borei Nefashos'], h:'Mezonos foods get Al Hamichyah.'}
],
check:[
{q:'What is bentching?', o:['Birkas Hamazon, after bread','A brachah before bread','A song on Shabbos']},
{q:'After cookies, what do we say?', o:['Al Hamichyah','Borei Nefashos','Hamotzi']},
{q:'After a carrot, what do we say?', o:['Borei Nefashos','Al Hamichyah','Birkas Hamazon']}
]},
'LK.HAL.L02.01':{name:'Halacha 4: Shabbos',
teach:[
{how:'Hashem made the world in six days and rested on the seventh. We keep Shabbos to remember this. Shabbos begins Friday night when the candles are lit and ends Motzei Shabbos with Havdalah.', q:'How does Shabbos end?', o:['With Havdalah','With Kiddush','With lighting Chanukah candles']},
{how:'On Shabbos we do not do the thirty-nine melachos, the kinds of work used to build the Mishkan. For example: writing, cooking, lighting a fire, and carrying outside where there is no eruv.', q:'How many main kinds of melachah are there?', o:['Thirty-nine','Ten','Seven']},
{how:'On Friday night and Shabbos day we make Kiddush on wine or grape juice, and eat challah. We have three meals on Shabbos: Shalosh Seudos.', q:'How many meals do we eat on Shabbos?', o:['Three','One','Five']}
],
practice:[
{q:'Which is one of the thirty-nine melachos?', o:['Writing','Reading a book','Singing zemiros'], h:'Writing was used for marking the boards of the Mishkan.'},
{q:'Where did the thirty-nine melachos come from?', o:['The work for building the Mishkan','The Purim story','The Chanukah story'], h:'The Torah puts the Mishkan and Shabbos side by side.'},
{q:'What is muktzeh?', o:['Things we may not move on Shabbos, like money or a pen','A Shabbos food','A song'], h:'Things that are not meant for Shabbos use.'},
{q:'How many challos do we use at each Shabbos meal?', o:['Two, lechem mishneh','One','Ten'], h:'For the double portion of mann on Friday.'},
{q:'What do we say over a cup to start the Shabbos meal?', o:['Kiddush','Havdalah','Hallel'], h:'Kiddush means making holy.'},
{q:'What do we smell at Havdalah?', o:['Besamim, spices','Flowers only','Nothing'], h:'To comfort our soul as Shabbos leaves.'}
],
check:[
{q:'When does Shabbos begin?', o:['Friday at candle lighting','Saturday morning','Sunday night']},
{q:'Which is a melachah we do not do on Shabbos?', o:['Cooking','Davening','Learning Torah']},
{q:'What ends Shabbos?', o:['Havdalah','Kiddush','Hamotzi']}
]},
'LK.HAL.L02.02':{name:'Halacha 5: Kibud Av Va\'em',
teach:[
{how:'The fifth of the Aseres Hadibros is Kabed es avicha v\'es imecha: honor your father and your mother.', q:'Which mitzvah is Kibud Av Va\'em?', o:['Honoring our parents','Keeping Shabbos','Giving tzedakah']},
{how:'Honor means doing things for them: helping, bringing them a drink, getting up when they come in. Fear (yirah) means not sitting in their place and not contradicting them.', q:'Which shows kibud, honor?', o:['Bringing Abba a drink when he asks','Sitting in Abba\'s special chair','Interrupting Ima']},
{how:'The Gemara tells of Dama ben Nesina, who did not wake his sleeping father even to sell a precious stone for a fortune. Hashem rewarded him with a red heifer born in his herd.', q:'What did Dama ben Nesina not do?', o:['Wake his sleeping father','Give tzedakah','Go to shul']}
],
practice:[
{q:'Which of the Aseres Hadibros is honoring parents?', o:['The fifth','The first','The tenth'], h:'It is the last one on the first luach.'},
{q:'Ima calls you while you are playing. What shows kibud?', o:['Coming right away with a smile','Pretending not to hear','Saying Later!'], h:'Answer quickly and nicely.'},
{q:'Which is part of fearing (respecting) a parent?', o:['Not sitting in their set place','Hugging them','Bringing them a drink'], h:'Yirah: not taking their place.'},
{q:'What reward does the Torah promise for this mitzvah?', o:['Long life','A new house','Many toys'], h:'L\'ma\'an ya\'arichun yamecha.'},
{q:'Abba is resting. What is the right thing to do?', o:['Play quietly so he can rest','Make loud noise','Wake him to show your drawing'], h:'Like Dama ben Nesina.'},
{q:'How should we speak to our parents?', o:['With respect and a calm voice','Shouting','Rolling our eyes'], h:'Honor is also in how we talk.'}
],
check:[
{q:'What does Kabed es avicha v\'es imecha mean?', o:['Honor your father and mother','Love your neighbor','Remember Shabbos']},
{q:'Which shows honor to a parent?', o:['Standing up when Abba walks in','Talking back','Taking Ima\'s seat']},
{q:'What reward does the Torah promise?', o:['Long life','Money','A pet']}
]},
'LK.HAL.L03.01':{name:'Halacha 6: Shemiras Halashon',
teach:[
{how:'Lashon hara is saying something true but negative about another person. The Torah says lo seileich rachil, do not go around as a gossip. The Chofetz Chaim wrote whole sefarim about guarding our tongue.', q:'What is lashon hara?', o:['Saying something negative about someone, even if true','Speaking in Hebrew','Saying a brachah']},
{how:'Rechilus is telling someone what another person said or did against him. It causes fights and hurt.', q:'Telling Moshe: Yossi said you were mean. What is that called?', o:['Rechilus','A brachah','Kibud av']},
{how:'Listening to lashon hara is also forbidden. If we hear it, we should not believe it, and we should try to change the subject or judge the person favorably.', q:'If someone starts saying lashon hara, what should we do?', o:['Change the subject and not believe it','Listen closely','Tell everyone']}
],
practice:[
{q:'Which great Rav wrote the sefer about lashon hara?', o:['The Chofetz Chaim','The Rambam','Rashi'], h:'He is known by the name of his sefer.'},
{q:'Which is lashon hara?', o:['Shimon got a bad mark, everyone look!','Shimon helped me today','Shimon is coming soon'], h:'Something that makes a person look bad.'},
{q:'Is lashon hara allowed if it is true?', o:['No, it is still lashon hara','Yes, if it is true it is fine','Only on Tuesdays'], h:'False things are even worse: motzi shem ra.'},
{q:'Who was punished with tzara\'as for speaking about Moshe?', o:['Miriam','Aharon','Yehoshua'], h:'In Parshas Beha\'aloscha.'},
{q:'How many people are hurt by lashon hara, Chazal say?', o:['Three: the speaker, the listener, and the one spoken about','Only the speaker','Nobody'], h:'It hurts everyone involved.'},
{q:'What is judging favorably called?', o:['Dan l\'kaf zechus','Lashon hara','Rechilus'], h:'Tilting the scale to the side of merit.'}
],
check:[
{q:'Is listening to lashon hara allowed?', o:['No','Yes, if quiet','Only from friends']},
{q:'What is rechilus?', o:['Telling someone what another said against him','Saying a brachah','Praising someone']},
{q:'What should we do with lashon hara we heard?', o:['Not believe it','Repeat it','Write it down']}
]},
/* ===== MIDDOS ===== */
'LK.MID.L01.05':{name:'Middos 1: Hakaras Hatov, Saying Thank You',
teach:[
{how:'Hakaras hatov means recognizing the good someone did for us and saying thank you. The very first thing we do each morning, Modeh Ani, is hakaras hatov to Hashem.', q:'What does hakaras hatov mean?', o:['Recognizing the good and saying thank you','Being first in line','Saying sorry']},
{how:'Moshe Rabbeinu did not hit the river to start the plagues of blood and frogs. Aharon did, because the river had protected baby Moshe. Even a river deserves hakaras hatov!', q:'Why did Aharon, not Moshe, hit the river?', o:['The river had saved Moshe, so he showed it hakaras hatov','Moshe was tired','Moshe could not swim']},
{how:'We thank our parents, our rebbeim, the bus driver, the lunch lady. Every thank-you is a little kiddush Hashem.', q:'The bus driver brings you to school. What do you say?', o:['Thank you!','Nothing','Hurry up!']}
],
practice:[
{q:'Leah, the mother of Yehudah, named him from the word for thanks. Why?', o:['She thanked Hashem for her son','She was sad','She liked the sound'], h:'Hoda\'ah means thanks.'},
{q:'Ima made you supper. What shows hakaras hatov?', o:['Saying Thank you, Ima, it was delicious','Saying Yuck','Leaving without a word'], h:'Notice the good and say it.'},
{q:'Who gives us everything we have?', o:['Hashem','Only the store','Only our friends'], h:'Every brachah is a thank-you to Hashem.'},
{q:'A friend lends you a pencil. What do you do?', o:['Say thank you and give it back','Keep it','Break it'], h:'Gratitude and returning it.'},
{q:'Which word means thank?', o:['מוֹדֶה','לֵךְ','שֵׁב'], h:'Modeh Ani.'},
{q:'Is it good to thank someone even for something small?', o:['Yes, always','No, only for big things','Only on birthdays'], h:'Small thanks build big middos.'}
],
check:[
{q:'What is hakaras hatov?', o:['Recognizing good and thanking','Being the leader','Winning a game']},
{q:'Who did Moshe show hakaras hatov to?', o:['The river that saved him','Paroh','The frogs']},
{q:'What is the first hakaras hatov of the day?', o:['Modeh Ani','Hamotzi','Aleinu']}
]},
'LK.MID.L01.06':{name:'Middos 2: Chesed, Being Kind',
teach:[
{how:'Chesed means doing kindness. Avraham Avinu kept his tent open on all four sides so guests could come in from any direction.', q:'Why was Avraham\'s tent open on all sides?', o:['To welcome guests from every direction','Because it was hot','To see the sheep']},
{how:'Even when Avraham was not feeling well after his bris, he sat at the door looking for guests to invite. That is hachnasas orchim, welcoming guests.', q:'What is hachnasas orchim?', o:['Welcoming guests','Learning Torah','Making a brachah']},
{how:'Rivkah showed chesed when she gave water to Eliezer and to all his camels too. That is how Eliezer knew she was right for Yitzchak.', q:'What chesed did Rivkah do?', o:['Gave water to Eliezer and his camels','Built a sukkah','Lit the menorah']}
],
practice:[
{q:'A new boy has no one to play with. What is chesed?', o:['Invite him to join your game','Ignore him','Laugh at him'], h:'Make him feel welcome, like Avraham.'},
{q:'Who gave water to all of Eliezer\'s camels?', o:['Rivkah','Rochel','Sarah'], h:'She later married Yitzchak.'},
{q:'Which is bikur cholim?', o:['Visiting someone who is sick','Giving charity','Washing hands'], h:'Cholim are sick people.'},
{q:'Your sister drops her books. What is chesed?', o:['Help her pick them up','Walk past','Step on them'], h:'Small acts are chesed too.'},
{q:'Hashem does chesed too. Which is one?', o:['Giving us food, life and the Torah','Nothing','Only on Shabbos'], h:'We copy Hashem\'s ways: just as He is kind, we are kind.'},
{q:'How did Avraham serve the malachim who visited?', o:['He ran to bring them food','He sent them away','He let them wait outside'], h:'He even ran, though he was old and weak.'}
],
check:[
{q:'What does chesed mean?', o:['Kindness','Anger','Laziness']},
{q:'Who kept his tent open on all four sides?', o:['Avraham Avinu','Paroh','Lavan']},
{q:'Visiting the sick is called…', o:['Bikur cholim','Hachnasas orchim','Kiddush']}
]},
'LK.MID.L02.01':{name:'Middos 3: Emes, Telling the Truth',
teach:[
{how:'Midvar sheker tirchak: the Torah tells us to stay far away from falsehood. Hashem\'s seal is emes, truth.', q:'What is Hashem\'s seal?', pic:'אֱמֶת', o:['Emes, truth','Gold','Shalom only']},
{how:'The letters of emes, Aleph-Mem-Tav, are at the start, middle and end of the Aleph-Beis: truth stands firm all the way through. The letters of sheker are crowded together and stand on one leg: lies cannot stand.', q:'Why do we say sheker cannot stand?', o:['Its letters each stand on one point','It is too long','It has no vowels']},
{how:'Telling the truth can be hard, especially when we made a mistake. But admitting the truth makes us bigger, like Yehudah who admitted his mistake and became the father of kings.', q:'You broke a cup by mistake. What do you do?', o:['Tell the truth and say sorry','Blame your brother','Hide the pieces']}
],
practice:[
{q:'What does sheker mean?', o:['A lie','Truth','Peace'], h:'The opposite of emes.'},
{q:'Which pasuk tells us to stay far from lies?', o:['Midvar sheker tirchak','Shema Yisrael','Lech lecha'], h:'From a false word, keep far.'},
{q:'Which son of Yaakov admitted the truth bravely?', o:['Yehudah','Reuven','Shimon'], h:'His name became the name of all Jews: Yehudim.'},
{q:'A friend asks if you took his cookie, and you did. What is emes?', o:['Yes, I took it, I am sorry','No, it was not me','I do not know'], h:'Emes even when it is hard.'},
{q:'Where is Aleph in the Aleph-Beis?', o:['At the very beginning','In the middle','At the end'], h:'Emes starts with the first letter.'},
{q:'Is a little lie okay?', o:['No, we stay far even from small lies','Yes, if small','Yes, on weekdays'], h:'Tirchak means stay far away.'}
],
check:[
{q:'What does emes mean?', o:['Truth','Lie','Joke']},
{q:'What should we do after a mistake?', o:['Tell the truth','Hide it','Blame someone']},
{q:'What does the Torah say about falsehood?', o:['Stay far from it','It is fine sometimes','Say it quietly']}
]},
'LK.MID.L02.02':{name:'Middos 4: Savlanus, Patience Like Hillel',
teach:[
{how:'Savlanus means patience: staying calm even when things are hard or annoying. Anger, ka\'as, makes a person forget even what he learned.', q:'What does savlanus mean?', o:['Patience','Speed','Strength']},
{how:'A man bet he could make Hillel angry. On Erev Shabbos, while Hillel was washing, he kept knocking with silly questions. Hillel calmly answered every time, and the man lost his bet.', q:'How did Hillel answer the silly questions?', o:['Calmly and kindly every time','By shouting','He refused to answer']},
{how:'Chazal say: be gentle like Hillel and not strict like Shammai. When we feel angry, we can stop, breathe, and think before we speak.', q:'What can we do when we feel angry?', o:['Stop, breathe and think first','Hit something','Yell right away']}
],
practice:[
{q:'What did the man want to do to Hillel?', o:['Make him angry','Give him a gift','Learn with him'], h:'He made a bet about it.'},
{q:'What day was it when the man came to Hillel?', o:['Erev Shabbos','Purim','Rosh Hashanah'], h:'Hillel was getting ready for Shabbos.'},
{q:'Your little brother knocks over your blocks. What shows savlanus?', o:['Calmly build them again together','Push him','Scream'], h:'Patience, like Hillel.'},
{q:'What happens when a person gets angry, Chazal say?', o:['He can forget his learning','He gets smarter','Nothing'], h:'Anger clouds the mind.'},
{q:'Which word means anger?', o:['Ka\'as','Chesed','Emes'], h:'The opposite of savlanus.'},
{q:'Moshe Rabbeinu got angry once and made a mistake. What happened?', o:['He hit the rock instead of speaking to it','He broke the Mishkan','He forgot Shabbos'], h:'At Mei Merivah, in Parshas Chukas.'}
],
check:[
{q:'Who stayed calm with the man who bet?', o:['Hillel','Shammai','Haman']},
{q:'What is savlanus?', o:['Patience','Anger','Fear']},
{q:'What is a good thing to do when angry?', o:['Stop and breathe','Shout','Break something']}
]},
'LK.MID.L03.01':{name:'Middos 5: Anavah, Humility',
teach:[
{how:'The Torah says Moshe was the most humble person on earth, anav me\'od, even though he was the greatest navi. Anavah is not thinking you are nothing; it is knowing your gifts come from Hashem.', q:'Who does the Torah call the most humble person?', o:['Moshe Rabbeinu','Paroh','Korach']},
{how:'Hashem gave the Torah on Har Sinai, a low mountain, to teach that Torah rests on the humble.', q:'Why was the Torah given on a small mountain?', o:['To teach that Torah stays with the humble','It was the closest','It was the tallest']},
{how:'The opposite of anavah is ga\'avah, pride. Korach wanted honor for himself and it led to his downfall.', q:'Who acted with ga\'avah and wanted honor?', o:['Korach','Moshe','Aharon']}
],
practice:[
{q:'You won a contest. What shows anavah?', o:['Thank Hashem and praise the others','Brag to everyone','Laugh at the losers'], h:'Our gifts come from Hashem.'},
{q:'What does ga\'avah mean?', o:['Pride','Humility','Kindness'], h:'The opposite of anavah.'},
{q:'What happened to Korach?', o:['The ground swallowed him','He became king','He led the people'], h:'Parshas Korach.'},
{q:'Where is Moshe called anav me\'od?', o:['In Parshas Beha\'aloscha','In Parshas Bereishis','In Megillas Esther'], h:'When Miriam and Aharon spoke about him.'},
{q:'A humble person, when he learns something new…', o:['Is happy to learn from anyone','Thinks he knows everything','Never asks questions'], h:'Eizehu chacham? Who is wise? One who learns from everyone.'},
{q:'Hashem lowered His Presence onto a small bush. Which one?', o:['The burning bush, the sneh','A tall cedar','A palm tree'], h:'Hashem appeared to Moshe in a thornbush.'}
],
check:[
{q:'What is anavah?', o:['Humility','Pride','Anger']},
{q:'Who was the most humble?', o:['Moshe Rabbeinu','Korach','Bilam']},
{q:'Where do our talents come from?', o:['Hashem','Only from us','From luck']}
]},
'LK.MID.L03.02':{name:'Middos 6: Bitachon, Trusting Hashem',
teach:[
{how:'Bitachon means trusting that Hashem takes care of us and everything He does is for the good. Nachum Ish Gamzu said about everything: gam zu l\'tovah, this too is for the good.', q:'What did Nachum Ish Gamzu always say?', o:['Gam zu l\'tovah, this too is for the good','Why me?','It is bad luck']},
{how:'Rabbi Akiva\'s candle blew out, his donkey and rooster were taken, so he slept in a field. That night soldiers captured the town. Had they heard his rooster or seen his candle, they would have found him. Everything was for the good.', q:'Why was it good that Rabbi Akiva lost his candle and animals?', o:['The soldiers did not find him','He wanted to camp out','He got new ones']},
{how:'In the midbar, Hashem gave mann each day. People were told not to save it for tomorrow, to learn to trust Hashem every day.', q:'What did the mann teach about bitachon?', o:['Trust Hashem one day at a time','Save everything for later','Do not eat']}
],
practice:[
{q:'Which Rebbe said kol mah d\'avid Rachmana l\'tav avid, all Hashem does is for good?', o:['Rabbi Akiva','Haman','Lavan'], h:'From the story of the candle and the donkey.'},
{q:'You hoped for sunshine but it rained. A bitachon answer?', o:['Hashem knows what is best','This is the worst day ever','It is unfair'], h:'Gam zu l\'tovah.'},
{q:'What does bitachon mean?', o:['Trust in Hashem','Fear','Laziness'], h:'Trusting that Hashem takes care of us.'},
{q:'Does bitachon mean we do nothing?', o:['No, we do our part and trust Hashem for the result','Yes, we just wait','We only worry'], h:'Hishtadlus plus bitachon.'},
{q:'Who sailed in an ark and trusted Hashem during the flood?', o:['Noach','Yonah','Moshe'], h:'Parshas Noach.'},
{q:'Which pasuk do many say: Hashem is my shepherd, I shall not lack?', o:['Mizmor l\'Dovid, Hashem ro\'i','Shema Yisrael','Modeh Ani'], h:'Tehillim 23.'}
],
check:[
{q:'What is bitachon?', o:['Trusting Hashem','Being afraid','Showing off']},
{q:'What does gam zu l\'tovah mean?', o:['This too is for the good','Good morning','Let us go']},
{q:'Bitachon means we also…', o:['Do our part and trust Hashem','Do nothing','Worry all the time']}
]},
/* ===== NAVI ===== */
'LK.NAV.L01.01':{name:'Navi 1: Yehoshua and Yericho',
teach:[
{how:'After Moshe Rabbeinu passed away, his student Yehoshua led Klal Yisrael into Eretz Yisrael. Sefer Yehoshua is the first sefer of Nevi\'im.', q:'Who led Klal Yisrael after Moshe?', o:['Yehoshua','Shmuel','Dovid']},
{how:'The Yarden river split for the Kohanim carrying the Aron, just like the Yam Suf had split, and everyone crossed on dry land.', q:'What split when the Kohanim stepped in with the Aron?', o:['The Yarden river','The Yam Suf','A mountain']},
{how:'Yericho had huge walls. Hashem told them to walk around the city once a day for six days, and seven times on the seventh day, with shofaros. Then the walls fell down!', q:'What happened to the walls of Yericho?', o:['They fell down','They grew taller','They turned to gold']}
],
practice:[
{q:'How many times did they circle Yericho on the seventh day?', o:['Seven','One','Three'], h:'Once a day for six days, then more on the last day.'},
{q:'What did the Kohanim blow while circling?', o:['Shofaros','Trumpets of silver only','Flutes'], h:'Ram\'s horns.'},
{q:'Who was Yehoshua\'s teacher?', o:['Moshe Rabbeinu','Eli','Shaul'], h:'Yehoshua never left his tent.'},
{q:'Which is the first sefer of Nevi\'im?', o:['Yehoshua','Shoftim','Melachim'], h:'Named for the leader after Moshe.'},
{q:'Who hid the spies in Yericho?', o:['Rachav','Devorah','Rus'], h:'She hung a red rope from her window.'},
{q:'What did the Kohanim carry into the Yarden?', o:['The Aron','The menorah','The mizbeach'], h:'The Aron with the Luchos.'}
],
check:[
{q:'Who brought Klal Yisrael into Eretz Yisrael?', o:['Yehoshua','Moshe','Avraham']},
{q:'Which city\'s walls fell down?', o:['Yericho','Yerushalayim','Chevron']},
{q:'Which river split?', o:['The Yarden','The Nile','The Euphrates']}
]},
'LK.NAV.L01.02':{name:'Navi 2: Chana and Shmuel',
teach:[
{how:'Chana had no children. She davened with all her heart in Shiloh, moving her lips but speaking quietly. That is how we daven Shemoneh Esrei today.', q:'What do we learn from how Chana davened?', o:['To daven quietly with our lips moving','To shout','To daven only in our heads']},
{how:'Hashem answered Chana and she had a son, Shmuel. She brought him to Eli the Kohen Gadol to serve Hashem in the Mishkan in Shiloh.', q:'What was the name of Chana\'s son?', o:['Shmuel','Shimshon','Shaul']},
{how:'One night young Shmuel heard a voice calling him. He thought it was Eli. Eli told him to answer: Speak, Hashem, for Your servant is listening. Shmuel became a great navi.', q:'Who was calling Shmuel at night?', o:['Hashem','Eli','His mother']}
],
practice:[
{q:'Where was the Mishkan in the days of Chana?', o:['Shiloh','Yerushalayim','Mitzrayim'], h:'Before the Beis Hamikdash was built.'},
{q:'Who was the Kohen Gadol who raised Shmuel?', o:['Eli','Aharon','Pinchas'], h:'He thought Chana was not praying properly at first.'},
{q:'What did Shmuel answer when Hashem called?', o:['Speak, for Your servant is listening','I am busy','Who is there?'], h:'Eli taught him the answer.'},
{q:'Which king did Shmuel later anoint first?', o:['Shaul','Shlomo','Chizkiyahu'], h:'The first king of Yisrael.'},
{q:'Whom did Shmuel anoint as the second king?', o:['Dovid','Shaul','Yehoshua'], h:'The youngest son of Yishai.'},
{q:'What did Chana\'s prayer teach for Shemoneh Esrei?', o:['Pray softly with moving lips','Pray loudly','Pray only on Shabbos'], h:'Rak sefaseha na\'os, only her lips moved.'}
],
check:[
{q:'Who davened for a son in Shiloh?', o:['Chana','Sarah','Rus']},
{q:'Who raised Shmuel in the Mishkan?', o:['Eli the Kohen Gadol','Yehoshua','Dovid']},
{q:'What did Shmuel become?', o:['A great navi','A king','A merchant']}
]},
'LK.NAV.L02.01':{name:'Navi 3: Dovid and Golyas',
teach:[
{how:'The Plishtim had a giant warrior, Golyas, who mocked Klal Yisrael and Hashem every day. Everyone was afraid.', q:'Who was Golyas?', o:['A giant of the Plishtim','A king of Yisrael','A navi']},
{how:'Young Dovid, a shepherd, said: You come with a sword, but I come in the Name of Hashem. He took five smooth stones and his slingshot.', q:'What did Dovid take to fight Golyas?', o:['A slingshot and five smooth stones','A big sword','A shield only']},
{how:'With one stone Dovid hit Golyas in the forehead and he fell. Dovid trusted Hashem, not his own strength.', q:'Why did Dovid win?', o:['He trusted Hashem','He was bigger','He had armor']}
],
practice:[
{q:'What was Dovid\'s job before he became king?', o:['A shepherd','A soldier','A baker'], h:'He watched his father\'s sheep.'},
{q:'Who was Dovid\'s father?', o:['Yishai','Shaul','Shmuel'], h:'He had eight sons; Dovid was the youngest.'},
{q:'How many stones did Dovid pick up?', o:['Five','One','Ten'], h:'Five smooth stones from the stream.'},
{q:'Which king was ruling when Dovid fought Golyas?', o:['Shaul','Shlomo','Dovid himself'], h:'The first king.'},
{q:'Which sefer of Tanach did Dovid write much of?', o:['Tehillim','Mishlei','Koheles'], h:'The songs we say every day.'},
{q:'Which city did Dovid make the capital?', o:['Yerushalayim','Chevron forever','Shiloh'], h:'Ir Dovid.'}
],
check:[
{q:'Who defeated Golyas?', o:['Dovid','Shaul','Yonasan']},
{q:'What did Dovid use?', o:['A slingshot and a stone','A spear','A bow and arrow']},
{q:'Whose Name did Dovid fight in?', o:['Hashem\'s','His own','Shaul\'s']}
]},
'LK.NAV.L02.02':{name:'Navi 4: Shlomo and the Beis Hamikdash',
teach:[
{how:'After Dovid, his son Shlomo became king. Hashem asked Shlomo what he wanted, and Shlomo asked for wisdom to judge the people.', q:'What did Shlomo ask Hashem for?', o:['Wisdom','Riches','A long life']},
{how:'Two women each claimed one baby. Shlomo said: Cut the baby in two. The real mother cried: Give it to her, do not hurt him! Shlomo knew she was the mother.', q:'How did Shlomo find the real mother?', o:['She would not let the baby be hurt','She cried louder','She was taller']},
{how:'Shlomo built the first Beis Hamikdash in Yerushalayim, on Har Hamoriah, where Akeidas Yitzchak happened. It stood for 410 years.', q:'Who built the first Beis Hamikdash?', o:['Shlomo HaMelech','Dovid HaMelech','Moshe Rabbeinu']}
],
practice:[
{q:'Whose son was Shlomo?', o:['Dovid','Shaul','Shmuel'], h:'The king before him.'},
{q:'On which mountain was the Beis Hamikdash built?', o:['Har Hamoriah','Har Sinai','Har Hacarmel'], h:'Where Avraham brought Yitzchak.'},
{q:'Why did Hashem give Shlomo riches and honor too?', o:['He asked for wisdom, not for himself','He asked for money','He won them'], h:'He did not ask for riches, so Hashem added them.'},
{q:'Which sefarim did Shlomo write?', o:['Mishlei, Koheles, Shir Hashirim','Yehoshua and Shoftim','Bereishis'], h:'Three sefarim of wisdom and song.'},
{q:'How long did the first Beis Hamikdash stand?', o:['410 years','40 years','1000 years'], h:'Until the Babylonians destroyed it.'},
{q:'Who wanted to build the Beis Hamikdash but was told his son would?', o:['Dovid HaMelech','Shaul','Eli'], h:'He prepared everything for it.'}
],
check:[
{q:'What did Shlomo ask for?', o:['Wisdom','Gold','Horses']},
{q:'What did Shlomo build?', o:['The first Beis Hamikdash','The Mishkan','The Kosel only']},
{q:'Who was Shlomo\'s father?', o:['Dovid HaMelech','Yishai','Shaul']}
]},
'LK.NAV.L03.01':{name:'Navi 5: Eliyahu on Har Hacarmel',
teach:[
{how:'In the time of King Achav, many Jews served the idol Ba\'al. Eliyahu HaNavi challenged the 450 prophets of Ba\'al on Har Hacarmel.', q:'Whom did Eliyahu challenge on Har Hacarmel?', o:['The prophets of Ba\'al','The Plishtim','The Kohanim']},
{how:'Each side prepared an offering. The prophets of Ba\'al called all day and nothing happened. Eliyahu even poured water over his mizbeach. Then fire came down from Shamayim and consumed everything.', q:'What came down onto Eliyahu\'s mizbeach?', o:['Fire from Shamayim','Rain','Snow']},
{how:'The people fell on their faces and called out: Hashem Hu Ha\'Elokim! Hashem is the G-d! We say these words seven times at the end of Yom Kippur.', q:'What did the people call out?', o:['Hashem Hu Ha\'Elokim','Modeh Ani','Shalom Aleichem']}
],
practice:[
{q:'Which king was ruling then?', o:['Achav','Dovid','Chizkiyahu'], h:'His wife Izevel persecuted the nevi\'im.'},
{q:'Why did Eliyahu pour water on his mizbeach?', o:['To show the fire was truly from Hashem','To clean it','By mistake'], h:'No trick could light a soaked mizbeach.'},
{q:'When do we say Hashem Hu Ha\'Elokim seven times?', o:['At the end of Yom Kippur, Ne\'ilah','On Purim','At Havdalah'], h:'The closing of the holiest day.'},
{q:'How did Eliyahu leave this world?', o:['In a fiery chariot, alive','He fell','He sailed away'], h:'His student Elisha watched.'},
{q:'Who was Eliyahu\'s student?', o:['Elisha','Yonah','Shmuel'], h:'He asked for a double portion of Eliyahu\'s spirit.'},
{q:'At which Seder custom do we open the door for Eliyahu?', o:['Shefoch chamascha, the Kos shel Eliyahu','Mah Nishtanah','Karpas'], h:'His cup waits on the table.'}
],
check:[
{q:'Where did Eliyahu prove Hashem is the true G-d?', o:['Har Hacarmel','Har Sinai','Har Nevo']},
{q:'What fell from Shamayim onto the mizbeach?', o:['Fire','Mann','Stones']},
{q:'Who was Eliyahu\'s student?', o:['Elisha','Achav','Ovadyah\'s son']}
]},
'LK.NAV.L03.02':{name:'Navi 6: The Order of Nevi\'im',
teach:[
{how:'Tanach has three parts: Torah, Nevi\'im and Kesuvim. The first sefarim of Nevi\'im, Nevi\'im Rishonim, tell our history: Yehoshua, Shoftim, Shmuel, Melachim.', q:'Which are the Nevi\'im Rishonim, in order?', o:['Yehoshua, Shoftim, Shmuel, Melachim','Melachim, Shmuel, Shoftim, Yehoshua','Tehillim, Mishlei, Iyov, Rus']},
{how:'Nevi\'im Acharonim are the later nevi\'im: Yeshayahu, Yirmiyahu, Yechezkel, and Trei Asar, the twelve shorter nevi\'im.', q:'What is Trei Asar?', o:['The twelve shorter nevi\'im in one sefer','Twelve shevatim','Twelve months']},
{how:'In Sefer Shoftim we meet the judges: Devorah, Gidon, Shimshon and others, who saved Yisrael before there were kings.', q:'Which navi-judge led Yisrael under a palm tree?', o:['Devorah','Rus','Yael\'s husband']}
],
practice:[
{t:'order', q:'Put the Nevi\'im Rishonim in order.', tiles:['Yehoshua','Shoftim','Shmuel','Melachim'], h:'The leader after Moshe, the judges, the navi who anointed kings, then the kings.'},
{q:'Which navi was swallowed by a big fish?', o:['Yonah','Yirmiyahu','Elisha'], h:'His sefer is one of Trei Asar, read on Yom Kippur.'},
{q:'Which judge had great strength as long as his hair was not cut?', o:['Shimshon','Gidon','Shmuel'], h:'He was a nazir from birth.'},
{q:'Which navi cried over the churban and wrote Eichah?', o:['Yirmiyahu','Yeshayahu','Yechezkel'], h:'Eichah is read on Tishah B\'Av.'},
{q:'What are the three parts of Tanach?', o:['Torah, Nevi\'im, Kesuvim','Mishnah, Gemara, Rashi','Bereishis, Shemos, Vayikra'], h:'Tanach is short for all three.'},
{q:'Which navi saw the vision of the dry bones coming to life?', o:['Yechezkel','Yonah','Amos'], h:'Read as a haftarah on Shabbos Chol Hamoed Pesach.'}
],
check:[
{q:'What comes right after Yehoshua?', o:['Shoftim','Melachim','Shmuel']},
{q:'What does Tanach stand for?', o:['Torah, Nevi\'im, Kesuvim','Torah and Nevi\'im only','Talmud and Chumash']},
{q:'Which is one of the Nevi\'im Acharonim?', o:['Yeshayahu','Yehoshua','Shoftim']}
]},
/* ===== PARSHA ===== */
'LK.PAR.L01.01':{name:'Parsha 1: Bereishis and Noach',
teach:[
{how:'Parshas Bereishis: Hashem created the world in six days and rested on the seventh, Shabbos. Adam and Chavah lived in Gan Eden until they ate from the Eitz Hada\'as.', q:'On which day did Hashem rest?', o:['The seventh day, Shabbos','The first day','The tenth day']},
{how:'Parshas Noach: people became very bad, so Hashem brought a mabul, a great flood. Noach, a tzaddik, built a teivah and saved his family and the animals.', q:'What did Noach build?', o:['A teivah, an ark','A tower','A city']},
{how:'After the flood Hashem promised never to flood the whole world again, and the sign was the rainbow, the keshes.', q:'What is the sign of Hashem\'s promise after the mabul?', o:['The rainbow','A star','A dove']}
],
practice:[
{q:'What did Hashem create on the first day?', o:['Light','Animals','People'], h:'Vayehi or, there was light.'},
{q:'Which tree were Adam and Chavah told not to eat from?', o:['The Eitz Hada\'as','The Eitz Hachaim','An apple tree only'], h:'The tree of knowledge.'},
{q:'Which bird did Noach send that came back with an olive leaf?', o:['A dove','A raven','An eagle'], h:'It showed the water had gone down.'},
{q:'How many days and nights did it rain in the mabul?', o:['Forty','Seven','One hundred'], h:'The same number as Moshe on Har Sinai.'},
{q:'What did people build in Bavel to reach the sky?', o:['A tower, the Migdal Bavel','A teivah','A sukkah'], h:'At the end of Parshas Noach.'},
{q:'Who were Noach\'s three sons?', o:['Shem, Cham and Yefes','Kayin, Hevel and Shes','Avraham, Nachor and Haran'], h:'All people come from them.'}
],
check:[
{q:'Who was the first man?', o:['Adam','Noach','Avraham']},
{q:'Why did Hashem bring the mabul?', o:['People became very bad','To water the plants','By accident']},
{q:'What did Noach save in the teivah?', o:['His family and the animals','Only gold','Nothing']}
]},
'LK.PAR.L01.02':{name:'Parsha 2: Avraham Avinu',
teach:[
{how:'Lech Lecha: Hashem told Avram to leave his land and go to the land Hashem would show him. Avram went, trusting Hashem. He was tested ten times and passed them all.', q:'What did Hashem tell Avram in Lech Lecha?', o:['Leave your land and go','Build an ark','Go down to Mitzrayim forever']},
{how:'Vayeira: three malachim visited Avraham. He served them a meal. They told him Sarah would have a son, Yitzchak.', q:'What news did the malachim bring?', o:['Sarah would have a son','A flood was coming','Avraham would be king']},
{how:'The biggest test was the Akeidah: Hashem asked Avraham to bring Yitzchak as an offering. At the last moment a malach stopped him, and a ram was brought instead.', q:'What was brought instead of Yitzchak?', o:['A ram','A lamb','Nothing']}
],
practice:[
{q:'How many tests did Avraham pass?', o:['Ten','Three','Seven'], h:'The Mishnah in Pirkei Avos counts them.'},
{q:'What was Avram\'s name changed to?', o:['Avraham','Yisrael','Yitzchak'], h:'Father of many nations.'},
{q:'Who was Avraham\'s nephew who lived in Sedom?', o:['Lot','Lavan','Eliezer'], h:'The malachim saved him from Sedom.'},
{q:'Where did the Akeidah happen?', o:['Har Hamoriah','Har Sinai','Har Hacarmel'], h:'The same place the Beis Hamikdash was later built.'},
{q:'In Chayei Sarah, whom did Avraham send to find a wife for Yitzchak?', o:['Eliezer','Lot','Yishmael'], h:'His trusted servant.'},
{q:'Where did Avraham bury Sarah?', o:['Me\'aras Hamachpelah in Chevron','Yerushalayim','Mitzrayim'], h:'He bought the cave from Efron.'}
],
check:[
{q:'Who was Avraham\'s son with Sarah?', o:['Yitzchak','Yishmael','Yaakov']},
{q:'What is the Akeidah?', o:['Avraham\'s test of bringing Yitzchak','A kind of sukkah','A brachah']},
{q:'Whom did Eliezer find for Yitzchak?', o:['Rivkah','Rochel','Leah']}
]},
'LK.PAR.L01.03':{name:'Parsha 3: Yitzchak, Yaakov and Eisav',
teach:[
{how:'Toldos: Yitzchak and Rivkah had twins, Eisav and Yaakov. Eisav loved hunting in the field; Yaakov was a tam, a wholesome boy who sat and learned in the tents of Torah.', q:'Who sat and learned in the tents?', o:['Yaakov','Eisav','Lavan']},
{how:'Eisav came home tired and sold the bechorah, the rights of the firstborn, to Yaakov for a pot of red lentil soup.', q:'What did Eisav sell to Yaakov for lentil soup?', o:['The bechorah','His bow','His house']},
{how:'Vayeitzei: Yaakov ran from Eisav to Charan. On the way he dreamed of a ladder reaching Shamayim, with malachim going up and down.', q:'What did Yaakov dream about?', o:['A ladder with malachim','A flood','Seven cows']}
],
practice:[
{q:'Who were the twins of Yitzchak and Rivkah?', o:['Yaakov and Eisav','Yosef and Binyamin','Kayin and Hevel'], h:'Parshas Toldos.'},
{q:'Whom did Yaakov marry in Charan?', o:['Leah and Rochel','Rivkah','Sarah'], h:'The daughters of Lavan.'},
{q:'How many years did Yaakov work for Rochel?', o:['Seven, and then seven more','One','Forty'], h:'They seemed like a few days, because he loved her.'},
{q:'Which parsha has Yaakov wrestling with a malach?', o:['Vayishlach','Bereishis','Noach'], h:'Afterward his name was changed.'},
{q:'What new name did Yaakov receive?', o:['Yisrael','Avraham','Yehudah'], h:'That is why we are called Bnei Yisrael.'},
{q:'Who was the trickster uncle in Charan?', o:['Lavan','Eliezer','Lot'], h:'Rivkah\'s brother.'}
],
check:[
{q:'What did Eisav trade for soup?', o:['The bechorah','A sheep','His tent']},
{q:'Where did Yaakov dream of the ladder?', o:['On the way to Charan','In Mitzrayim','In the teivah']},
{q:'What name did Yaakov get after the malach?', o:['Yisrael','Yosef','Yitzchak']}
]},
'LK.PAR.L01.04':{name:'Parsha 4: Yosef and His Brothers',
teach:[
{how:'Vayeishev: Yaakov loved Yosef and gave him a special coat, the kesones passim. Yosef dreamed that his brothers bowed to him. The brothers were jealous and sold him; he was taken to Mitzrayim.', q:'What special gift did Yaakov give Yosef?', o:['A colorful coat, the kesones passim','A sword','A crown']},
{how:'Mikeitz: Paroh dreamed of seven fat cows and seven thin cows. Yosef explained: seven years of plenty, then seven years of hunger. Paroh made Yosef the viceroy of Mitzrayim.', q:'What did the seven thin cows mean?', o:['Seven years of hunger','Seven new kings','Seven wars']},
{how:'Vayigash: when the brothers came for food, Yosef finally said: Ani Yosef, I am Yosef! The family came down to Mitzrayim, and Yaakov saw Yosef again.', q:'What did Yosef say to his brothers in Vayigash?', o:['I am Yosef!','Go away','Who are you?']}
],
practice:[
{q:'Which brother said not to kill Yosef but to throw him in a pit?', o:['Reuven','Shimon','Levi'], h:'He hoped to come back and save him.'},
{q:'Whose dreams did Yosef explain in prison?', o:['The butler and the baker','Paroh\'s sons','The brothers'], h:'Sar hamashkim and sar ha\'ofim.'},
{q:'Which brother did Yosef keep in Mitzrayim as a hostage?', o:['Shimon','Binyamin','Yehudah'], h:'Until they brought Binyamin.'},
{q:'In whose sack was Yosef\'s silver goblet found?', o:['Binyamin\'s','Reuven\'s','Dan\'s'], h:'The youngest brother.'},
{q:'In Vayechi, which grandsons did Yaakov bless?', o:['Ephraim and Menashe','Peretz and Zerach','Gershom and Eliezer'], h:'We bless our sons to be like them on Friday night.'},
{t:'order', q:'Put the Yosef parshiyos in order.', tiles:['Vayeishev','Mikeitz','Vayigash','Vayechi'], h:'Sold, then Paroh\'s dreams, then I am Yosef, then Yaakov\'s brachos.'}
],
check:[
{q:'Why were the brothers jealous of Yosef?', o:['Yaakov gave him a special coat and he had dreams','He was the oldest','He was rich']},
{q:'What did Paroh make Yosef?', o:['Viceroy, second to the king','A slave forever','A shepherd']},
{q:'Whom do we bless our sons to be like?', o:['Ephraim and Menashe','Lavan and Eisav','Paroh and Potifar']}
]},
'LK.PAR.L02.01':{name:'Parsha 5: The Parshiyos of Bereishis',
teach:[
{how:'Sefer Bereishis has twelve parshiyos. The first six: Bereishis, Noach, Lech Lecha, Vayeira, Chayei Sarah, Toldos.', q:'Which parsha comes right after Noach?', o:['Lech Lecha','Vayeira','Toldos']},
{how:'The last six: Vayeitzei, Vayishlach, Vayeishev, Mikeitz, Vayigash, Vayechi.', q:'Which is the last parsha of Sefer Bereishis?', o:['Vayechi','Vayigash','Shemos']},
{how:'When we finish a sefer of the Torah, everyone says: Chazak, chazak, v\'nischazeik! Be strong, be strong, and we will be strengthened.', q:'What do we say when we finish a sefer?', o:['Chazak, chazak, v\'nischazeik','Mazel tov','Good Shabbos']}
],
practice:[
{t:'order', q:'Put the first six parshiyos in order.', tiles:['Bereishis','Noach','Lech Lecha','Vayeira','Chayei Sarah','Toldos'], h:'Creation, flood, go forth, the malachim, Sarah, the twins.'},
{t:'order', q:'Put the last six parshiyos in order.', tiles:['Vayeitzei','Vayishlach','Vayeishev','Mikeitz','Vayigash','Vayechi'], h:'Yaakov leaves, sends messengers, settles; then Yosef\'s story.'},
{q:'In which parsha is the Akeidah?', o:['Vayeira','Lech Lecha','Toldos'], h:'Where three malachim visit Avraham.'},
{q:'In which parsha does Sarah pass away?', o:['Chayei Sarah','Vayeira','Bereishis'], h:'Its name means the life of Sarah.'},
{q:'In which parsha is the ladder dream?', o:['Vayeitzei','Vayishlach','Mikeitz'], h:'And Yaakov went out.'},
{q:'How many parshiyos are in the whole Torah?', o:['Fifty-four','Twelve','Forty'], h:'Some weeks we read two together.'}
],
check:[
{q:'Which comes first?', o:['Lech Lecha','Toldos','Vayechi']},
{q:'Which parsha tells of Paroh\'s dreams?', o:['Mikeitz','Noach','Vayeira']},
{q:'How many parshiyos are in Sefer Bereishis?', o:['Twelve','Ten','Fifty-four']}
]},
'LK.PAR.L02.02':{name:'Parsha 6: Shemos, Leaving Mitzrayim',
teach:[
{how:'Shemos: a new Paroh made the Jews slaves. Baby Moshe was hidden in a basket on the river, and Paroh\'s daughter Basya saved him.', q:'Who saved baby Moshe from the river?', o:['Basya, Paroh\'s daughter','Miriam alone','A malach']},
{how:'Hashem spoke to Moshe from the burning bush and sent him to Paroh: Let My people go! Paroh refused, and Hashem brought ten makkos.', q:'How many makkos came on Mitzrayim?', o:['Ten','Seven','Three']},
{how:'Beshalach: Klal Yisrael left Mitzrayim. At the Yam Suf the sea split, they crossed on dry land, and they sang Az Yashir.', q:'What split for Klal Yisrael?', o:['The Yam Suf','The Yarden','Har Sinai']}
],
practice:[
{q:'What was the first makkah?', o:['Blood','Frogs','Darkness'], h:'The river turned to blood.'},
{q:'What was the last makkah?', o:['The death of the firstborn','Hail','Locusts'], h:'After it, Paroh let them go.'},
{q:'Who was Moshe\'s brother who spoke to Paroh with him?', o:['Aharon','Yisro','Yehoshua'], h:'He became the Kohen Gadol.'},
{q:'What song did they sing after the sea split?', o:['Az Yashir, the Shirah','Adon Olam','Hatikvah'], h:'We say it every morning in Pesukei D\'zimra.'},
{q:'What food fell from the sky in the midbar?', o:['Mann','Matzah','Manna bread from Egypt'], h:'It tasted like whatever you wished.'},
{q:'In which parsha did we get the Aseres Hadibros?', o:['Yisro','Bo','Mishpatim'], h:'Named after Moshe\'s father-in-law.'}
],
check:[
{q:'Who led Klal Yisrael out of Mitzrayim?', o:['Moshe Rabbeinu','Yosef','Avraham']},
{q:'Where did Hashem first speak to Moshe?', o:['At the burning bush','At the Yam Suf','In Paroh\'s palace']},
{q:'What did they do after crossing the sea?', o:['Sang Az Yashir','Built a city','Went back to Mitzrayim']}
]},
/* ===== ROUND 2 (v206) ===== */
'LK.PAR.L01.05':{name:'Parsha 7: Har Sinai and the Aseres Hadibros',
teach:[
{how:'Parshas Yisro: seven weeks after leaving Mitzrayim, Klal Yisrael camped at Har Sinai, together like one person with one heart. They said Na\'aseh v\'nishma: we will do and we will listen.', q:'What did Klal Yisrael say before getting the Torah?', o:['Na\'aseh v\'nishma','Let us go back','We are tired']},
{how:'Hashem gave the Aseres Hadibros, the Ten Commandments. The mountain smoked, there was thunder and the sound of a shofar.', q:'How many Dibros did Hashem say at Har Sinai?', o:['Ten','Seven','Three']},
{how:'Moshe went up the mountain for forty days and came down with the Luchos, two stone tablets.', q:'How long was Moshe on Har Sinai?', o:['Forty days','Seven days','One year']}
],
practice:[
{q:'Who was Yisro?', o:['Moshe\'s father-in-law','Paroh\'s son','A navi of Mitzrayim'], h:'He gave Moshe advice about judges.'},
{q:'What advice did Yisro give Moshe?', o:['Appoint judges to help him','Go back to Mitzrayim','Build a tower'], h:'Moshe was judging everyone alone.'},
{q:'On how many Luchos were the Dibros written?', o:['Two','One','Ten'], h:'Five on each, the way we picture them.'},
{q:'What happened to the first Luchos?', o:['Moshe broke them after the Eigel','They were lost','They were buried'], h:'In Parshas Ki Sisa.'},
{q:'What was the Eigel Hazahav?', o:['A golden calf the people wrongly made','A Yom Tov food','A kind of korban'], h:'While Moshe was on the mountain.'},
{q:'Which parsha has the many laws right after Har Sinai?', o:['Mishpatim','Bereishis','Noach'], h:'Mishpatim means laws.'}
],
check:[
{q:'Where did we get the Torah?', o:['Har Sinai','Har Nevo','Yerushalayim']},
{q:'What are the Luchos?', o:['Two stone tablets','Two scrolls','Two crowns']},
{q:'What does Na\'aseh v\'nishma mean?', o:['We will do and we will listen','We will think about it','We will go home']}
]},
'LK.PAR.L01.06':{name:'Parsha 8: The Mishkan',
teach:[
{how:'Parshas Terumah: Hashem said: Make Me a Mishkan, and I will dwell among them. Everyone brought gifts: gold, silver, wool, wood and more.', q:'What did Hashem ask Klal Yisrael to build?', o:['The Mishkan','A palace','A tower']},
{how:'Inside the Mishkan were the Aron with the Luchos, the Menorah, the Shulchan with twelve loaves of lechem hapanim, and the golden Mizbeach for ketores.', q:'What was kept inside the Aron?', o:['The Luchos','The Menorah','Gold coins']},
{how:'Betzalel, a young man filled with wisdom from Hashem, led the building. The Mishkan traveled with Klal Yisrael through the midbar.', q:'Who led the building of the Mishkan?', o:['Betzalel','Korach','Yisro']}
],
practice:[
{q:'How many lights did the Menorah have?', o:['Seven','Eight','Three'], h:'The Chanukah menorah has eight; the Mishkan\'s had seven.'},
{q:'What was on the Shulchan?', o:['Twelve loaves of lechem hapanim','Fruits','The Torah'], h:'One for each shevet.'},
{q:'Which parsha tells about the Kohen Gadol\'s special clothes?', o:['Tetzaveh','Bereishis','Bamidbar'], h:'It comes right after Terumah.'},
{q:'What was on top of the Aron?', o:['Two golden keruvim','A crown of silver','A menorah'], h:'Two figures with wings.'},
{q:'What is terumah?', o:['A gift for Hashem','A kind of food','A song'], h:'Everyone gave with a full heart.'},
{q:'Which parsha has the final counting of the Mishkan\'s gold and silver?', o:['Pekudei','Yisro','Noach'], h:'The last parsha of Sefer Shemos.'}
],
check:[
{q:'What does Mishkan mean?', o:['A dwelling place for Hashem\'s Presence','A tent for sheep','A palace for the king']},
{q:'Who led the building?', o:['Betzalel','Paroh','Eliezer']},
{q:'How many branches did the Mishkan Menorah have, with lights?', o:['Seven','Ten','Two']}
]},
'LK.PAR.L02.03':{name:'Parsha 9: Sefer Vayikra',
teach:[
{how:'Sefer Vayikra teaches about korbanos and the Kohanim. Children traditionally begin learning Chumash with Vayikra: let the pure ones learn about purity.', q:'What is Sefer Vayikra mostly about?', o:['Korbanos and the Kohanim','The flood','Yosef and his brothers']},
{how:'In Parshas Shemini, the Mishkan was opened. Nadav and Avihu, sons of Aharon, brought a fire Hashem had not commanded, and they died. Aharon was silent: vayidom Aharon.', q:'How did Aharon react when his sons died?', o:['He was silent, accepting Hashem\'s judgment','He ran away','He argued']},
{how:'Shemini also teaches which animals are kosher: they have split hooves and chew their cud. Kosher fish have fins and scales.', q:'What makes a fish kosher?', o:['Fins and scales','A long tail','Living in the sea']}
],
practice:[
{q:'Which signs make an animal kosher?', o:['Split hooves and chewing its cud','Four legs','Being big'], h:'Both signs are needed.'},
{q:'Is a pig kosher?', o:['No, it has split hooves but does not chew its cud','Yes','Only on Yom Tov'], h:'It has only one sign.'},
{q:'Which parsha has V\'ahavta l\'reiacha kamocha?', o:['Kedoshim','Bereishis','Bo'], h:'Love your fellow as yourself.'},
{q:'Which parsha has the Yomim Tovim of the year?', o:['Emor','Tzav','Metzora'], h:'It lists Shabbos, Pesach, Shavuos, Rosh Hashanah, Yom Kippur, Sukkos.'},
{q:'What is the Shemittah year?', o:['Every seventh year the land rests','A Yom Tov','A kind of korban'], h:'In Parshas Behar.'},
{q:'Who were the sons of Aharon who died in Shemini?', o:['Nadav and Avihu','Elazar and Isamar','Gershom and Eliezer'], h:'Elazar and Isamar continued as Kohanim.'}
],
check:[
{q:'Where do young children traditionally start learning Chumash?', o:['Sefer Vayikra','Sefer Devarim','Megillas Esther']},
{q:'What makes an animal kosher?', o:['Split hooves and chewing its cud','Being white','Having horns']},
{q:'Which parsha says love your fellow as yourself?', o:['Kedoshim','Shemini','Tzav']}
]},
'LK.PAR.L02.04':{name:'Parsha 10: Sefer Bamidbar',
teach:[
{how:'Bamidbar means in the desert. It begins with counting Klal Yisrael and arranging the twelve shevatim around the Mishkan, each with its flag.', q:'What does Bamidbar mean?', o:['In the desert','In the city','In the boat']},
{how:'Shelach: twelve meraglim, spies, went to see Eretz Yisrael. Ten brought a bad report and the people cried. Only Yehoshua and Kalev trusted Hashem. Klal Yisrael stayed forty years in the midbar.', q:'Which two spies gave a good report?', o:['Yehoshua and Kalev','Moshe and Aharon','Korach and Dasan']},
{how:'Balak hired Bilam to curse Klal Yisrael. Bilam\'s donkey spoke! Instead of curses, Bilam said brachos, like Mah tovu ohalecha Yaakov.', q:'What happened when Bilam tried to curse?', o:['Brachos came out instead','He became king','It rained']}
],
practice:[
{q:'How many spies went into Eretz Yisrael?', o:['Twelve','Two','Seventy'], h:'One from each shevet.'},
{q:'Why did Klal Yisrael stay forty years in the midbar?', o:['Because of the bad report of the spies','They were lost','The Mishkan was too heavy'], h:'A year for each day of spying.'},
{q:'Who argued against Moshe and was swallowed by the ground?', o:['Korach','Kalev','Pinchas'], h:'Parshas Korach.'},
{q:'Which animal spoke to Bilam?', o:['His donkey','A snake','A lion'], h:'It saw a malach blocking the way.'},
{q:'Which famous words from Bilam do we say entering shul?', o:['Mah tovu ohalecha Yaakov','Modeh Ani','Adon Olam'], h:'How goodly are your tents, Yaakov.'},
{q:'Which mitzvah is at the end of Shelach, the third paragraph of Shema?', o:['Tzitzis','Tefillin','Mezuzah'], h:'Look at them and remember the mitzvos.'}
],
check:[
{q:'Who were the two loyal spies?', o:['Yehoshua and Kalev','Bilam and Balak','Dasan and Aviram']},
{q:'What did Bilam say instead of curses?', o:['Brachos','Nothing','Songs of Paroh']},
{q:'How long were they in the midbar?', o:['Forty years','Seven years','One hundred years']}
]},
'LK.PAR.L03.01':{name:'Parsha 11: Sefer Devarim',
teach:[
{how:'Sefer Devarim is Moshe Rabbeinu\'s last speeches in the final weeks of his life, on the plains of Moav, before Klal Yisrael entered Eretz Yisrael. It is also called Mishneh Torah, a review of the Torah.', q:'What is Sefer Devarim mostly?', o:['Moshe\'s final speeches to Klal Yisrael','The story of creation','The building of the Mishkan']},
{how:'Va\'eschanan has the Aseres Hadibros a second time and the first paragraph of Shema, with V\'ahavta: love Hashem with all your heart.', q:'Which parsha has the first paragraph of Shema?', o:['Va\'eschanan','Bereishis','Korach']},
{how:'At the end, in Vezos Habrachah, Moshe blesses each shevet. He sees Eretz Yisrael from Har Nevo and passes away. Never again arose a navi like Moshe.', q:'From which mountain did Moshe see Eretz Yisrael?', o:['Har Nevo','Har Sinai','Har Hamoriah']}
],
practice:[
{q:'What did Moshe daven for in Va\'eschanan?', o:['To be allowed into Eretz Yisrael','For rain','For more mann'], h:'Va\'eschanan means and I pleaded.'},
{q:'Which parsha has the second paragraph of Shema, V\'hayah im shamoa?', o:['Eikev','Shoftim','Re\'eh'], h:'It comes right after Va\'eschanan.'},
{q:'Which parsha begins Shoftim v\'shotrim, judges and officers?', o:['Shoftim','Ki Seitzei','Devarim'], h:'Named for its first word.'},
{q:'Which parsha is read on Simchas Torah, with Moshe\'s brachos?', o:['Vezos Habrachah','Ha\'azinu','Nitzavim'], h:'The very last parsha.'},
{q:'Which parsha is a song Moshe taught?', o:['Ha\'azinu','Shoftim','Eikev'], h:'Listen, heavens!'},
{q:'Which mitzvah tells us to remember Amalek?', o:['Zachor, in Ki Seitzei','Shema, in Va\'eschanan','Bikurim, in Ki Savo'], h:'Read on the Shabbos before Purim.'}
],
check:[
{q:'Who speaks most of Sefer Devarim?', o:['Moshe Rabbeinu','Yehoshua','Aharon']},
{q:'Where did Moshe pass away?', o:['Har Nevo, facing Eretz Yisrael','Mitzrayim','Yerushalayim']},
{q:'Which is the last parsha of the Torah?', o:['Vezos Habrachah','Devarim','Ha\'azinu']}
]},
'LK.PAR.L03.02':{name:'Parsha 12: The Parshiyos in Order',
teach:[
{how:'Sefer Shemos has eleven parshiyos: Shemos, Va\'eira, Bo, Beshalach, Yisro, Mishpatim, Terumah, Tetzaveh, Ki Sisa, Vayakheil, Pekudei.', q:'Which parsha comes right after Bo?', o:['Beshalach','Yisro','Va\'eira']},
{how:'Sefer Vayikra has ten: Vayikra, Tzav, Shemini, Tazria, Metzora, Acharei Mos, Kedoshim, Emor, Behar, Bechukosai. Some pairs are read together.', q:'Which parsha comes right after Shemini?', o:['Tazria','Emor','Tzav']},
{how:'Bamidbar has ten: Bamidbar, Nasso, Beha\'aloscha, Shelach, Korach, Chukas, Balak, Pinchas, Matos, Masei. Devarim has eleven, ending with Vezos Habrachah.', q:'Which parsha comes right after Korach?', o:['Chukas','Shelach','Balak']}
],
practice:[
{t:'order', q:'Put these Shemos parshiyos in order.', tiles:['Shemos','Va\'eira','Bo','Beshalach','Yisro'], h:'Slavery, the first makkos, the last makkos, the sea, Har Sinai.'},
{t:'order', q:'Put these Bamidbar parshiyos in order.', tiles:['Shelach','Korach','Chukas','Balak'], h:'Spies, the rebellion, the red cow, then Bilam.'},
{q:'Which parsha is read the Shabbos after Tishah B\'Av, Shabbos Nachamu?', o:['Va\'eschanan','Bereishis','Emor'], h:'Its haftarah is Nachamu, nachamu ami.'},
{q:'Which sefer has the most parshiyos?', o:['Bereishis, with twelve','Vayikra','Bamidbar'], h:'Count them: 12, 11, 10, 10, 11.'},
{q:'Which parsha has the Kohen Gadol\'s avodah on Yom Kippur?', o:['Acharei Mos','Tzav','Nasso'], h:'It is also read on Yom Kippur morning.'},
{q:'Which parsha has the brachah the Kohanim give, Yevarechecha?', o:['Nasso','Balak','Re\'eh'], h:'Birkas Kohanim.'}
],
check:[
{q:'How many parshiyos in the whole Torah?', o:['Fifty-four','Forty-nine','Sixty']},
{q:'What comes right after Yisro?', o:['Mishpatim','Terumah','Beshalach']},
{q:'What is the last parsha of Sefer Bamidbar?', o:['Masei','Matos','Pinchas']}
]},
'LK.NAV.L02.03':{name:'Navi 7: The Shoftim',
teach:[
{how:'After Yehoshua there were no kings. When Klal Yisrael strayed, enemies came; when they did teshuvah, Hashem sent a shofet, a judge, to save them.', q:'What did Hashem send when the people did teshuvah?', o:['A shofet to save them','A flood','A king right away']},
{how:'Devorah HaNeviah judged under a palm tree. With Barak she defeated the general Sisera, and she sang Shiras Devorah.', q:'Who sang a song after a great victory, in Sefer Shoftim?', o:['Devorah','Rus','Miriam']},
{how:'Gidon defeated the huge army of Midyan with only three hundred men, shofaros and torches in jars, to show the victory was from Hashem.', q:'How many men did Gidon fight with?', o:['Three hundred','Three thousand','Thirty thousand']}
],
practice:[
{q:'Why did Hashem want Gidon to have so few men?', o:['So everyone would know the victory was from Hashem','To save food','It was a mistake'], h:'A big army might think it won by itself.'},
{q:'What did Gidon\'s men carry?', o:['Shofaros and torches in jars','Swords only','Nothing'], h:'They broke the jars and blew the shofaros.'},
{q:'Where did Devorah sit to judge?', o:['Under a palm tree','In a palace','In a cave'], h:'Tomer Devorah.'},
{q:'Which shofet was a nazir with great strength?', o:['Shimshon','Gidon','Ehud'], h:'His strength came with his uncut hair.'},
{q:'Which enemy did Shimshon fight?', o:['The Plishtim','Midyan','Mitzrayim'], h:'The same enemy as Golyas later.'},
{q:'Who was the last shofet, who later anointed the kings?', o:['Shmuel','Shimshon','Gidon'], h:'Chana\'s son.'}
],
check:[
{q:'What is a shofet?', o:['A judge and leader','A king','A Kohen']},
{q:'Who defeated Midyan with three hundred men?', o:['Gidon','Shimshon','Dovid']},
{q:'Who judged under a palm tree?', o:['Devorah','Rivkah','Esther']}
]},
'LK.NAV.L02.04':{name:'Navi 8: Yonah',
teach:[
{how:'Hashem told Yonah to go to Ninveh and warn the people to do teshuvah. Yonah ran away on a ship to Tarshish.', q:'Where did Hashem send Yonah?', o:['To Ninveh','To Mitzrayim','To Yericho']},
{how:'A great storm came. The sailors threw Yonah into the sea, and a big fish swallowed him. Inside the fish for three days, Yonah davened to Hashem.', q:'What swallowed Yonah?', o:['A big fish','A whale shark called Leviathan','A wave']},
{how:'The fish spat Yonah out. He went to Ninveh, and the people did teshuvah, and Hashem forgave them. We read Sefer Yonah at Mincha on Yom Kippur.', q:'When do we read Sefer Yonah?', o:['Mincha of Yom Kippur','Purim night','Tishah B\'Av']}
],
practice:[
{q:'How long was Yonah inside the fish?', o:['Three days and three nights','One hour','Forty days'], h:'He davened there.'},
{q:'What did the people of Ninveh do?', o:['Teshuvah, and Hashem forgave them','Laughed at Yonah','Built a ship'], h:'Even the king put on sackcloth.'},
{q:'Why do we read Yonah on Yom Kippur?', o:['It teaches that teshuvah works and no one can run from Hashem','It is short','It is about food'], h:'The theme of the day.'},
{q:'What grew to give Yonah shade, then dried up?', o:['A kikayon plant','A palm tree','A tent'], h:'Hashem taught him a lesson about caring for Ninveh.'},
{q:'Where was the ship going?', o:['Tarshish','Ninveh','Yafo'], h:'The opposite direction from Ninveh.'},
{q:'Yonah is one of which group?', o:['Trei Asar, the twelve shorter nevi\'im','The Avos','The shevatim'], h:'Its sefer is short.'}
],
check:[
{q:'Who ran away from Hashem\'s mission?', o:['Yonah','Eliyahu','Shmuel']},
{q:'What did Ninveh do after Yonah\'s warning?', o:['Teshuvah','Nothing','Attacked']},
{q:'When is Yonah read?', o:['Yom Kippur at Mincha','Shavuos','Chanukah']}
]},
'LK.NAV.L03.03':{name:'Navi 9: Melachim and the Churban',
teach:[
{how:'After Shlomo, the kingdom split. Rechavam ruled the kingdom of Yehudah in the south; Yeravam led the ten shevatim of the kingdom of Yisrael in the north.', q:'Who led the ten shevatim after the split?', o:['Yeravam','Rechavam','Dovid']},
{how:'King Chizkiyahu was a tzaddik who spread Torah. When the Ashurim under Sancheirev surrounded Yerushalayim, a malach struck their camp in one night.', q:'Who saved Yerushalayim from Sancheirev?', o:['Hashem, through a malach, in Chizkiyahu\'s time','The Plishtim','Paroh']},
{how:'Later the Babylonians under Nevuchadnetzar destroyed the first Beis Hamikdash on Tishah B\'Av and took the people into galus in Bavel.', q:'Who destroyed the first Beis Hamikdash?', o:['Nevuchadnetzar of Bavel','Antiochus','Haman']}
],
practice:[
{q:'What happened to the ten shevatim of the north?', o:['They were exiled by Ashur','They became kings of Bavel','They built the Beis Hamikdash'], h:'Long before the first churban.'},
{q:'Which king found a Sefer Torah in the Beis Hamikdash and led teshuvah?', o:['Yoshiyahu','Achav','Yeravam'], h:'A young righteous king of Yehudah.'},
{q:'Which navi warned of the churban and wrote Eichah?', o:['Yirmiyahu','Yonah','Shmuel'], h:'He cried over Yerushalayim.'},
{q:'On what day was the Beis Hamikdash destroyed?', o:['Tishah B\'Av','Purim','Yom Kippur'], h:'The ninth of Av.'},
{q:'How long did the galus Bavel last before the return?', o:['Seventy years','Seven years','Four hundred years'], h:'As Yirmiyahu foretold.'},
{q:'Who led the return and rebuilt the second Beis Hamikdash?', o:['Ezra and Nechemiah, with Zerubavel','Haman','Shaul'], h:'In Kesuvim, Sefer Ezra.'}
],
check:[
{q:'Into what did the kingdom split after Shlomo?', o:['Yehudah and Yisrael','Mitzrayim and Bavel','Two cities']},
{q:'Who destroyed the first Beis Hamikdash?', o:['Nevuchadnetzar','Sancheirev','Titus']},
{q:'Which tzaddik king spread Torah in Yehudah?', o:['Chizkiyahu','Achav','Menashe']}
]},
'LK.NAV.L03.04':{name:'Navi 10: Daniel and Esther',
teach:[
{how:'In galus Bavel, Daniel kept davening three times a day toward Yerushalayim even when the king forbade it. He was thrown into a lions\' den, and Hashem closed the lions\' mouths.', q:'Why was Daniel thrown to the lions?', o:['He kept davening to Hashem','He stole','He ran away']},
{how:'Chananyah, Mishael and Azaryah refused to bow to Nevuchadnetzar\'s statue. They were thrown into a fiery furnace and came out unharmed.', q:'What happened to Chananyah, Mishael and Azaryah in the furnace?', o:['They came out unharmed','They escaped by running','They were not thrown in']},
{how:'In Persia, Esther became queen. When Haman plotted against the Jews, Esther fasted three days with all the Jews and then risked her life to go to the king. The Jews were saved: that is Purim.', q:'What did Esther and the Jews do before she went to the king?', o:['Fasted three days','Had a party','Ran away']}
],
practice:[
{q:'Which way did Daniel face when he davened?', o:['Toward Yerushalayim','Toward Bavel\'s palace','Toward the sea'], h:'We still face Yerushalayim.'},
{q:'Who was Mordechai to Esther?', o:['Her cousin who raised her','Her brother','Her teacher only'], h:'He raised her after her parents died.'},
{q:'Why did Haman hate Mordechai?', o:['Mordechai would not bow to him','Mordechai took his house','Mordechai was the king'], h:'Mordechai bowed only to Hashem.'},
{q:'What happened to Haman in the end?', o:['He was hanged on the gallows he built for Mordechai','He became king','He moved away'], h:'V\'nahafoch hu: everything turned around.'},
{q:'Which sefer is Esther in?', o:['Kesuvim, as one of the five Megillos','Torah','Nevi\'im Rishonim'], h:'We read it from a scroll on Purim.'},
{q:'Which wicked king\'s statue did the three friends refuse to bow to?', o:['Nevuchadnetzar','Achashveirosh','Paroh'], h:'King of Bavel.'}
],
check:[
{q:'Who was saved in the lions\' den?', o:['Daniel','Haman','Yonah']},
{q:'Who risked her life to save the Jews of Persia?', o:['Esther','Devorah','Chana']},
{q:'Who would not bow to Haman?', o:['Mordechai','Achashveirosh','Zeresh']}
]},
'LK.TEF.L02.03':{name:'Tefillah 7: Birkas Hamazon',
teach:[
{how:'Birkas Hamazon has four brachos. The first, Hazan, thanking Hashem for food for the whole world, was written by Moshe Rabbeinu when the mann fell.', q:'Who wrote the first brachah of bentching?', o:['Moshe Rabbeinu','Dovid HaMelech','Mordechai']},
{how:'The second brachah, for the Land, was written by Yehoshua when Klal Yisrael entered Eretz Yisrael. The third, Boneh Yerushalayim, by Dovid and Shlomo.', q:'Who wrote the brachah for the Land?', o:['Yehoshua','Moshe','Eliyahu']},
{how:'The fourth brachah, Hatov V\'hameitiv, was added by the Chachamim in Yavneh after the people killed at Beitar were finally allowed to be buried, and their bodies had not decayed.', q:'Where was the fourth brachah added?', o:['In Yavneh, after Beitar','At Har Sinai','In Mitzrayim']}
],
practice:[
{q:'How many brachos are in Birkas Hamazon (from the Torah and Chazal)?', o:['Four','Two','Seven'], h:'Hazan, Ha\'aretz, Boneh Yerushalayim, Hatov V\'hameitiv.'},
{q:'When three or more men eat bread together, what do they say before bentching?', o:['Zimun','Kiddush','Hallel'], h:'One invites the others: Rabbosai, nevarech.'},
{q:'What do we add on Shabbos in bentching?', o:['Retzei','Al Hanissim','Ya\'aleh V\'yavo only on weekdays'], h:'Retzei v\'hachalitzeinu.'},
{q:'What do we add on Chanukah and Purim?', o:['Al Hanissim','Retzei','Aneinu'], h:'For the miracles.'},
{q:'What do we add on Rosh Chodesh and Yom Tov?', o:['Ya\'aleh V\'yavo','Al Hanissim','Retzei only'], h:'May our remembrance rise and come.'},
{q:'Which psalm do many sing before bentching on Shabbos?', o:['Shir Hama\'alos','Ashrei','Aleinu'], h:'When Hashem returns the captives of Tziyon.'}
],
check:[
{q:'Who wrote Boneh Yerushalayim?', o:['Dovid and Shlomo','Moshe','Yehoshua']},
{q:'What is zimun?', o:['Inviting others to bentch together','A kind of food','A song for Purim']},
{q:'When was the first brachah written?', o:['When the mann fell','At the Yam Suf','At Chanukah']}
]},
'LK.TEF.L02.04':{name:'Tefillah 8: Special Brachos',
teach:[
{how:'Brachos are not only for food. Before many mitzvos we say a brachah like Asher kideshanu b\'mitzvosav, Who made us holy with His mitzvos.', q:'What do brachos on mitzvos say?', o:['Who made us holy with His mitzvos','Who made the fruit of the tree','Who gave us bread']},
{how:'We say Shehecheyanu for something new and happy: a new fruit of the season, new clothes, and on the first night of Yom Tov.', q:'When do we say Shehecheyanu?', o:['For a new fruit or the first night of Yom Tov','After every meal','When we wake up']},
{how:'There are brachos on wonders of nature: on lightning, Oseh ma\'aseh vereishis; on thunder, Shekocho ugvuraso malei olam; on a rainbow, Zocheir habris.', q:'What do we say on seeing a rainbow?', o:['Zocheir habris','Shehecheyanu','Hamotzi']}
],
practice:[
{q:'Why do we say Zocheir habris on a rainbow?', o:['Hashem remembers His promise after the mabul','Rainbows are pretty','It is a new fruit'], h:'The keshes was the sign to Noach.'},
{q:'What do we say on hearing thunder?', o:['Shekocho ugvuraso malei olam','Borei pri ha\'eitz','Asher yatzar'], h:'His strength and might fill the world.'},
{q:'Which mitzvah do we make a brachah on before doing it?', o:['Lighting Shabbos and Chanukah candles','Saying thank you','Visiting a friend'], h:'Asher kideshanu b\'mitzvosav, l\'hadlik ner.'},
{q:'What does Shehecheyanu thank Hashem for?', o:['Keeping us alive to reach this time','Giving us bread','Making the rain'], h:'Shehecheyanu v\'kiyemanu v\'higiyanu.'},
{q:'On seeing a very big sea or a great mountain, which feeling do the brachos teach?', o:['Wonder at Hashem\'s creation','Fear only','Nothing'], h:'Brachos help us notice Hashem everywhere.'},
{q:'Is it right to say a brachah in vain, without a reason?', o:['No, that is a brachah levatalah','Yes, more is better','Only on Sunday'], h:'We use Hashem\'s Name carefully.'}
],
check:[
{q:'What do we say on lightning?', o:['Oseh ma\'aseh vereishis','Zocheir habris','Hamotzi']},
{q:'When do we say Shehecheyanu?', o:['For something new and joyful','On every apple','Before sleeping']},
{q:'What do we say before many mitzvos?', o:['Asher kideshanu b\'mitzvosav','Modeh Ani','Shema']}
]},
'LK.TEF.L03.02':{name:'Tefillah 9: Hallel, Kiddush and Havdalah',
teach:[
{how:'Hallel is chapters of praise from Tehillim, 113 to 118. We say it on Yom Tov, Chanukah and Rosh Chodesh, thanking Hashem for His miracles.', q:'On which of these days do we say Hallel?', o:['Chanukah','Tishah B\'Av','A regular Tuesday']},
{how:'On Rosh Chodesh and the last days of Pesach we say half-Hallel, skipping two paragraphs. Chazal say Hashem said: My creations drowned in the sea, and you sing?', q:'Why is only half-Hallel said on the last days of Pesach?', o:['Hashem\'s creations, the Mitzrim, drowned','We are tired','It is too long']},
{how:'Kiddush makes Shabbos holy at its start; Havdalah separates it at the end, with wine, besamim and a candle with more than one wick.', q:'What are the parts of Havdalah?', o:['Wine, besamim and a candle','Matzah and maror','Challah and salt']}
],
practice:[
{q:'Why do we use a candle with more than one wick at Havdalah?', o:['The brachah is Borei me\'orei ha\'eish, lights of fire','It is prettier','For safety'], h:'Me\'orei is plural.'},
{q:'Why do we smell besamim at Havdalah?', o:['To comfort the soul as the extra neshamah leaves','Because it is a Yom Tov','To wake up'], h:'The neshamah yeseirah.'},
{q:'Is Hallel said on Purim?', o:['No; the Megillah reading is our Hallel','Yes, full Hallel','Only half'], h:'Chazal explain the reading takes its place.'},
{q:'Which psalms make up Hallel?', o:['Tehillim 113 to 118','Tehillim 1 to 5','Tehillim 150 only'], h:'Halleluyah, praise servants of Hashem.'},
{q:'Over what is Shabbos Kiddush usually said?', o:['Wine or grape juice','Water','Milk'], h:'If none, on challah.'},
{q:'Which Kiddush comes first in the week?', o:['Friday night Kiddush','Havdalah','Shabbos morning Kiddush'], h:'Shabbos begins Friday at sunset.'}
],
check:[
{q:'What is Hallel?', o:['Praise from Tehillim','A brachah on bread','A kind of fast']},
{q:'What does Havdalah do?', o:['Separates Shabbos from the week','Starts Shabbos','Ends a fast only']},
{q:'When do we say half-Hallel?', o:['Rosh Chodesh','Yom Kippur','Purim']}
]},
'LK.YT.L02.03':{name:'Yom Tov 7: Halachos of Chanukah',
teach:[
{how:'We light the menorah at the door, on the left side, opposite the mezuzah, or in a window, to publicize the neis: pirsumei nisa.', q:'Why do we light where people can see?', o:['To publicize the neis, pirsumei nisa','So it stays warm','To save candles']},
{how:'The lights must burn at least half an hour after nightfall. On Friday we light before the Shabbos candles, with candles that will last.', q:'On Friday, when do we light the menorah?', o:['Before the Shabbos candles','After Shabbos ends','We do not light']},
{how:'We may not use the Chanukah lights for reading or working; they are only to see. That is why we have the shamash.', q:'May we read by the Chanukah lights?', o:['No, they are only to look at','Yes, that is their purpose','Only on the eighth night']}
],
practice:[
{q:'Which side of the door is the menorah placed?', o:['The left, opposite the mezuzah','The right, on top of the mezuzah','Inside a closet'], h:'So we are surrounded by mitzvos.'},
{q:'Which candle do we light first on the second night?', o:['The newest one, on the left','The rightmost one','Any one'], h:'We add from the right and light the new one first.'},
{q:'How many brachos on the first night?', o:['Three','Two','One'], h:'L\'hadlik, She\'asah nissim, Shehecheyanu.'},
{q:'How many brachos on the other nights?', o:['Two','Three','Zero'], h:'Shehecheyanu only on the first night.'},
{q:'How long must the candles burn after nightfall?', o:['At least half an hour','One minute','All night'], h:'Chatzi sha\'ah.'},
{q:'What do we add to Shemoneh Esrei and bentching on Chanukah?', o:['Al Hanissim','Ya\'aleh V\'yavo','Aneinu'], h:'For the miracles.'}
],
check:[
{q:'What is pirsumei nisa?', o:['Publicizing the miracle','Eating latkes','Spinning the dreidel']},
{q:'On Friday, light the menorah…', o:['Before Shabbos candles','After Havdalah only','Not at all']},
{q:'What is the shamash for?', o:['Lighting the others so we do not use the Chanukah lights','Decoration only','Counting']}
]},
'LK.YT.L02.04':{name:'Yom Tov 8: The Shalosh Regalim',
teach:[
{how:'The Shalosh Regalim are the three pilgrimage festivals: Pesach, Shavuos and Sukkos. In the time of the Beis Hamikdash, everyone went up to Yerushalayim: aliyah l\'regel.', q:'Which are the Shalosh Regalim?', o:['Pesach, Shavuos, Sukkos','Purim, Chanukah, Pesach','Rosh Hashanah, Yom Kippur, Sukkos']},
{how:'Each Regel also matches the farming year: Pesach is spring, the barley harvest; Shavuos is the wheat harvest and bikurim; Sukkos is the gathering at the end of summer.', q:'Which Regel is the time of bikurim, first fruits?', o:['Shavuos','Sukkos','Pesach']},
