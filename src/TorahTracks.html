/* ===== ROUND 7 (v239, takeover3): Parsha deep dives for all of Sefer Shemos, Shemos to Pekudei (LK.PAR.L02.12 to .22) ===== */
'LK.PAR.L02.12':{name:'Parsha Deep Dive: Shemos', band:'5-6', op:'A new Pharaoh, a terrible decree, a baby in a basket on the river, and a bush that burns but does not burn up.', peg:{kind:'basket and bush',show:'Basket · Bush',say:'Two pictures hold the parsha: baby Moshe in a basket on the river, and the burning bush where Hashem sends him back.'},
teach:[
{how:'Opener: A new Pharaoh made Bnei Yisrael slaves and ordered every baby boy thrown into the river. Yocheved hid baby Moshe for three months, then put him in a basket in the reeds while Miriam watched. Pharaoh\'s daughter Bisya found him and raised him.', q:'Who found baby Moshe in the river?', o:['Pharaoh\'s daughter, Bisya','Miriam','Yisro']},
{how:'When Moshe grew up he saw a Mitzri beating a Jew and struck the Mitzri. Moshe ran away to Midyan, married Tzipporah, and became a shepherd for her father Yisro.', q:'Where did Moshe run to?', o:['Midyan','Charan','Canaan']},
{how:'At Har Chorev Moshe saw a thornbush burning, but it was not burned up. Hashem spoke to him from the bush and sent him to take Bnei Yisrael out of Mitzrayim, with Aharon to speak for him.', q:'What was special about the bush?', o:['It burned but was not burned up','It grew fruit','It could talk by itself']}
],
we:[
{q:'Together: what did the midwives Shifrah and Puah do?', o:['They kept the babies alive','They obeyed Pharaoh','They ran away'], steps:['Pharaoh told them to harm the baby boys.','They feared Hashem more than Pharaoh.','They kept the babies alive, and Hashem rewarded them.']},
{q:'Together: why did Moshe say he should not be the messenger?', o:['He felt he did not speak well','He was too young','He wanted to stay a shepherd forever'], steps:['Moshe said: I am heavy of mouth.','Hashem answered: Aharon your brother will speak for you.','Moshe was the humblest of all people.']}
],
practice:[
{t:'order', q:'Put Parshas Shemos in order.', tiles:['Pharaoh makes the Jews slaves','Baby Moshe in the basket','Moshe runs to Midyan','The burning bush','Moshe and Aharon go to Pharaoh'], why:'Shemos, perakim 1 to 5.'},
{t:'pairs', q:'Match each person to who they were.', pairs:[['Yocheved','Moshe\'s mother'],['Miriam','watched the basket'],['Bisya','Pharaoh\'s daughter'],['Yisro','Moshe\'s father-in-law']], why:'The family and helpers who saved and raised Moshe.'},
{t:'spotall', q:'Tap everything that happened in Parshas Shemos.', cells:[{label:'the burning bush',ok:true},{label:'baby Moshe in a basket',ok:true},{label:'Pharaoh takes away the straw',ok:true},{label:'the ten makos',ok:false},{label:'the sea splits',ok:false}], why:'The makos begin in Va\'eira, and the sea splits in Beshalach.'},
{t:'type', q:'How many months did Yocheved hide baby Moshe? Type the number.', a:'3', alt:['three'], kb:'num', why:'After three months she could hide him no longer, so she made the basket.'},
{q:'What did Pharaoh do after Moshe first asked him to let the people go?', o:['Made the work harder','Let them go','Gave them gifts'], h:'He did not want to listen.', why:'He took away the straw but demanded the same number of bricks.'},
{q:'Why did Hashem speak from a lowly thornbush?', o:['To show He is with His people in their pain','Because it was the only tree','Fire looks nice on bushes'], h:'Think of how the Jews felt in Mitzrayim.', why:'Rashi: from a thornbush and not a tall tree, as if to say: I am with them in their trouble.'}
],
check:[
{q:'Who spoke for Moshe to Pharaoh?', o:['Aharon','Yisro','Kalev']},
{q:'Where was baby Moshe placed?', o:['In a basket in the reeds','In a cave','In the palace kitchen']},
{q:'Whose sheep was Moshe watching at the bush?', o:['Yisro\'s','Pharaoh\'s','Lavan\'s']}
]},
'LK.PAR.L02.13':{name:'Parsha Deep Dive: Va\'eira', band:'5-6', op:'Two brothers with a staff stand before the most powerful king in the world. The river turns red, and the first seven makos begin.', peg:{kind:'count',show:'Makos 1 to 7',say:'Va\'eira has the first seven makos: Dam, Tzefardeia, Kinim, Arov, Dever, Shechin, Barad.'},
teach:[
{how:'Opener: Hashem promised Moshe with four words of geulah: I will take you out, I will save you, I will redeem you, I will take you as My nation. At the Seder we drink four cups to remember them.', q:'What do the four words of geulah remind us of at the Seder?', o:['The four cups of wine','The four questions','The four sons']},
{how:'Aharon threw down his staff before Pharaoh and it became a snake. Pharaoh\'s magicians did the same, but Aharon\'s staff swallowed their staffs.', q:'What happened to the magicians\' staffs?', o:['Aharon\'s staff swallowed them','They turned to gold','They flew away']},
{how:'The first makka was Dam: the water turned to blood. Aharon struck the river, not Moshe, because the river had protected baby Moshe. Even water deserves hakaras hatov!', q:'Why did Aharon, and not Moshe, strike the river?', o:['The river had saved Moshe as a baby','Moshe was tired','Aharon was older']}
],
we:[
{q:'Together: what was special about Barad, the hail?', o:['Fire and ice came down together','It was made of sand','It fell only at night'], steps:['Hail came down on Mitzrayim.','Inside each hailstone was fire.','Fire and water made peace to do Hashem\'s will.']},
{q:'Together: what did Pharaoh do each time a makka stopped?', o:['He hardened his heart and said no','He let them go forever','He thanked Moshe'], steps:['During the makka Pharaoh begged Moshe to daven.','The makka stopped.','Then Pharaoh changed his mind and said no.']}
],
practice:[
{t:'order', q:'Put the first seven makos in order.', tiles:['Dam','Tzefardeia','Kinim','Arov','Dever','Shechin','Barad'], why:'Rabbi Yehudah\'s sign: Detzach, Adash, Be\'achav.'},
{t:'pairs', q:'Match each makka to what it was.', pairs:[['Dam','blood'],['Tzefardeia','frogs'],['Kinim','lice'],['Arov','wild animals'],['Shechin','boils']], why:'Each makka struck Mitzrayim in a new way.'},
{t:'spotall', q:'Tap the makos that are in Parshas Va\'eira.', cells:[{label:'Dam',ok:true},{label:'Kinim',ok:true},{label:'Dever',ok:true},{label:'Barad',ok:true},{label:'Arbeh',ok:false},{label:'Choshech',ok:false}], why:'Arbeh and Choshech come in Parshas Bo.'},
{t:'type', q:'How many makos are in Parshas Va\'eira? Type the number.', a:'7', alt:['seven'], kb:'num', why:'Seven here, and the last three in Bo.'},
{q:'At which makka did the magicians admit it was the finger of Elokim?', o:['Kinim, lice','Dam, blood','Barad, hail'], h:'They could copy the first two.', why:'They could not make lice, so they said: this is the finger of Elokim.'},
{q:'Who struck the dust to bring the Kinim?', o:['Aharon','Moshe','Pharaoh'], h:'Think about hakaras hatov again.', why:'The dust had hidden the Mitzri Moshe struck, so Moshe did not strike it.'}
],
check:[
{q:'What came in the second makka?', o:['Frogs','Locusts','Lions']},
{q:'How many makos were there in all?', o:['Ten','Seven','Twelve']},
{q:'What do the four words of geulah match at the Seder?', o:['The four cups','The four sons','The matzos']}
]},
'LK.PAR.L02.14':{name:'Parsha Deep Dive: Bo', band:'5-6', op:'Locusts cover the sky, darkness you can touch, blood on the doorposts, and at midnight: freedom!', peg:{kind:'doorpost',show:'Blood on the doorpost',say:'The blood of the Korban Pesach on the doorposts: Hashem passed over the Jewish homes.'},
teach:[
{how:'Opener: Arbeh, locusts, ate everything the hail had left. Then came Choshech: thick darkness for three days. The Mitzrim could not move, but the Jews had light in their homes.', q:'During Choshech, what did the Jews have?', o:['Light in their homes','Darkness too','Snow']},
{how:'The first mitzvah given to all of Bnei Yisrael was Rosh Chodesh: watching the new moon and setting the months. Nissan became the first month.', q:'What was the first mitzvah given to all of Bnei Yisrael?', o:['Rosh Chodesh, setting the months','Shabbos','Tefillin']},
{how:'Each family brought a Korban Pesach and put its blood on the doorposts. At midnight came Makas Bechoros. They left so fast that the dough had no time to rise, and that is why we eat matzah.', q:'Why do we eat matzah on Pesach?', o:['The dough had no time to rise','Bread was not allowed in Mitzrayim','It was cheaper']}
],
we:[
{q:'Together: where did they put the blood of the Korban Pesach?', o:['On the doorposts and over the door','On their clothes','In the river'], steps:['Each family took a lamb.','They put its blood on the two doorposts and above the door.','Hashem passed over those homes.']},
{q:'Together: what did the Jews take with them from Mitzrayim?', o:['Silver and gold vessels','Only horses','Nothing at all'], steps:['Hashem promised Avraham they would leave with great wealth.','The Jews asked the Mitzrim for vessels.','They left with silver, gold and clothing.']}
],
practice:[
{t:'order', q:'Put Parshas Bo in order.', tiles:['Arbeh, locusts','Choshech, darkness','The Korban Pesach','Makas Bechoros at midnight','Leaving Mitzrayim'], why:'Shemos, perakim 10 to 13.'},
{t:'pairs', q:'Match each Bo word to its meaning.', pairs:[['Arbeh','locusts'],['Choshech','darkness'],['Makas Bechoros','the firstborn'],['Matzah','bread that had no time to rise']], why:'The last three makos and the Pesach we still keep.'},
{t:'spotall', q:'Tap the mitzvos we learn from Parshas Bo.', cells:[{label:'Rosh Chodesh',ok:true},{label:'the Korban Pesach',ok:true},{label:'eating matzah',ok:true},{label:'tefillin',ok:true},{label:'shofar',ok:false},{label:'sukkah',ok:false}], why:'Bo teaches Rosh Chodesh, the Korban Pesach, matzah, and two of the parshiyos in our tefillin.'},
{t:'type', q:'How many days did Choshech last? Type the number.', a:'3', alt:['three'], kb:'num', why:'The pasuk says three days of thick darkness.'},
{q:'At what time was Makas Bechoros?', o:['Midnight','Sunrise','Noon'], h:'Kachatzos halaylah.', why:'Exactly at midnight, as Moshe had warned.'},
{q:'In the Haggadah, which son asks: what is this service to you?', o:['The rasha','The chacham','The tam'], h:'He says "to you," not "to us."', why:'The rasha leaves himself out, and his words come from a pasuk in Parshas Bo.'}
],
check:[
{q:'Which month became the first month?', o:['Nissan','Tishrei','Adar']},
{q:'What was the last makka?', o:['Makas Bechoros','Arbeh','Choshech']},
{q:'Why did the dough not rise?', o:['They left in a hurry','It was too cold','No one baked it']}
]},
'LK.PAR.L02.15':{name:'Parsha Deep Dive: Beshalach', band:'5-6', op:'The sea in front, the whole army of Mitzrayim behind, and nowhere to run. Then one brave man walks into the water.', peg:{kind:'walls of water',show:'Right and left',say:'The water stood like walls on the right and on the left, and Bnei Yisrael walked through on dry land.'},
teach:[
{how:'Opener: Hashem led them with a pillar of cloud by day and a pillar of fire by night. Pharaoh chased them to the Yam Suf. Nachshon ben Aminadav walked into the water first, Moshe lifted his staff, and the sea split.', q:'Who walked into the sea first?', o:['Nachshon ben Aminadav','Pharaoh','Yisro']},
{how:'On the other side they saw the Mitzrim drown. Moshe and Bnei Yisrael sang Az Yashir, and Miriam led the women with drums and dancing.', q:'What song did they sing after the sea?', o:['Az Yashir, the Shirah','Adon Olam','Lecha Dodi']},
{how:'In the desert, mann fell from the sky every morning. On Friday a double portion fell, and none fell on Shabbos. Then Amalek attacked, and Yehoshua led the battle.', q:'What fell from the sky every morning?', o:['The mann','Gold coins','Snow']}
],
we:[
{q:'Together: why did a double portion of mann fall on Friday?', o:['No mann fell on Shabbos','They were extra hungry','It was a mistake'], steps:['Every day each person gathered one portion.','On Friday they found two.','Shabbos has no gathering, so its food came the day before.']},
{q:'Together: what happened when Moshe raised his hands in the war with Amalek?', o:['Bnei Yisrael won','It rained','The sun set'], steps:['Moshe stood on the hill.','When his hands were up, Yisrael won.','Chazal: they looked up and turned their hearts to Hashem.']}
],
practice:[
{t:'order', q:'Put Parshas Beshalach in order.', tiles:['The pillar of cloud and fire','Pharaoh chases them','The sea splits','Az Yashir','The mann falls','War with Amalek'], why:'Shemos, perakim 13 to 17.'},
{t:'pairs', q:'Match each person to what they did.', pairs:[['Nachshon','first into the sea'],['Miriam','led the women in song'],['Yehoshua','fought Amalek'],['Chur','held up Moshe\'s hands with Aharon']], why:'Each one played a part in Beshalach.'},
{t:'spotall', q:'Tap everything that happened in Parshas Beshalach.', cells:[{label:'the sea splits',ok:true},{label:'the mann',ok:true},{label:'water from a rock',ok:true},{label:'war with Amalek',ok:true},{label:'the Aseres Hadibros',ok:false},{label:'the golden calf',ok:false}], why:'The Aseres Hadibros are in Yisro and the golden calf is in Ki Sisa.'},
{t:'type', q:'On which day of the week did no mann fall? Type the day.', a:'Shabbos', alt:['shabbat','saturday','shabbes','shabbos kodesh'], kb:'abc', why:'That is why we have two challos, lechem mishneh, on Shabbos.'},
{q:'How did Hashem lead them at night?', o:['A pillar of fire','A lantern','Only the moon'], h:'By day it was a cloud.', why:'A pillar of cloud by day and a pillar of fire by night.'},
{q:'Why is this Shabbos called Shabbos Shirah?', o:['We read Az Yashir, the Shirah','We sing all day without stopping','It comes in winter'], h:'Shirah means song.', why:'The Torah reading has the Song of the Sea.'}
],
check:[
{q:'What did Moshe do to split the sea?', o:['Lifted his staff over the sea','Shouted at the water','Threw a stone']},
{q:'Who attacked Bnei Yisrael after the sea?', o:['Amalek','Moav','The Plishtim']},
{q:'How much mann fell on Friday?', o:['A double portion','None','Half']}
]},
'LK.PAR.L02.16':{name:'Parsha Deep Dive: Yisro', band:'5-6', op:'A father-in-law with great advice, a mountain covered in smoke, and the voice of Hashem speaking to a whole nation.', peg:{kind:'two luchos',show:'Five and five',say:'Two luchos: the first five dibros are between us and Hashem, the last five between us and people.'},
teach:[
{how:'Opener: Yisro heard about the splitting of the sea and the war with Amalek, and came to join Bnei Yisrael. He saw Moshe judging the people from morning to night and advised him to appoint judges to help.', q:'What advice did Yisro give Moshe?', o:['Appoint judges to help him','Go back to Mitzrayim','Build a palace']},
{how:'Bnei Yisrael camped at Har Sinai like one man with one heart, and said: everything Hashem says, we will do. They got ready for three days.', q:'How did Bnei Yisrael camp at Har Sinai?', o:['Like one man with one heart','In two arguing groups','Far from the mountain']},
{how:'On the third day there was thunder, lightning and thick smoke, and the sound of the shofar grew louder and louder. Hashem gave the Aseres Hadibros to the whole nation.', q:'What sound grew louder and louder at Har Sinai?', o:['The shofar','A drum','A bell']}
],
we:[
{q:'Together: what is the first of the Aseres Hadibros?', o:['I am Hashem, Who took you out of Mitzrayim','Do not steal','Honor your parents'], steps:['The first dibrah is about believing.','Hashem introduces Himself.','I am Hashem, Who took you out of Mitzrayim.']},
{q:'Together: which dibrah is about Shabbos?', o:['Remember Shabbos to keep it holy','Do not be jealous','Do not murder'], steps:['It is the fourth dibrah.','It says Zachor, remember.','Remember Shabbos to keep it holy.']}
],
practice:[
{t:'order', q:'Put Parshas Yisro in the order the Torah tells it.', tiles:['Yisro comes to the camp','Judges are appointed','Three days of getting ready','Har Sinai smokes and shakes','The Aseres Hadibros'], why:'Shemos, perakim 18 to 20.'},
{t:'sort', q:'Sort the dibros: which luach is each one on?', bins:[{id:'H',label:'First luach'},{id:'P',label:'Second luach'}], items:[{label:'Believe in Hashem',bin:'H'},{label:'Remember Shabbos',bin:'H'},{label:'Honor your parents',bin:'H'},{label:'Do not steal',bin:'P'},{label:'Do not be jealous',bin:'P'},{label:'Do not murder',bin:'P'}], why:'Dibros 1 to 5 are on the first luach, including honoring parents, who are partners with Hashem in making us. 6 to 10 are on the second.'},
{t:'pairs', q:'Match each word to what it means.', pairs:[['Yisro','Moshe\'s father-in-law'],['Har Sinai','where the Torah was given'],['Luchos','two stone tablets'],['Shofar','grew louder and louder']], why:'The people and places of Matan Torah.'},
{t:'type', q:'How many dibros are on the two luchos? Type the number.', a:'10', alt:['ten'], kb:'num', why:'Five on each luach.'},
{q:'Why was the Torah given in a desert?', o:['It belongs to everyone, like the open desert','There was no other place','The desert is warm'], h:'A desert belongs to no one.', why:'Chazal: in a place that belongs to no one, so anyone who wants can take it.'},
{q:'What did Yisro hear that made him come?', o:['The splitting of the sea and the war with Amalek','That Moshe was rich','That there was a party'], h:'Rashi tells us at the start of the parsha.', why:'Rashi: he heard about Krias Yam Suf and the war with Amalek.'}
],
check:[
{q:'What is the fifth dibrah?', o:['Honor your father and mother','Do not steal','Remember Shabbos']},
{q:'What did the people see at Har Sinai?', o:['Thunder, lightning and smoke','A rainbow','Snow']},
{q:'Who advised Moshe to appoint judges?', o:['Yisro','Aharon','Yehoshua']}
]},
'LK.PAR.L02.17':{name:'Parsha Deep Dive: Mishpatim', band:'5-6', op:'Right after Har Sinai, the Torah teaches how to live with people: honest business, returning lost things, even helping an enemy\'s donkey.', peg:{kind:'scale',show:'Fair and kind',say:'Mishpatim are the laws that make life fair and kind, and they come from Sinai too.'},
teach:[
{how:'Opener: Mishpatim are laws between people: paying for damage, an ox that gores, an open pit, guarding someone\'s things, and being honest in business.', q:'What are mishpatim?', o:['Laws that keep things fair between people','Songs of praise','Stories of the Avos']},
{how:'If you see your enemy\'s donkey fallen under its load, you must help him unload it. If you find a lost animal, you must return it to its owner.', q:'If your enemy\'s donkey falls under its load, what does the Torah say?', o:['Help him unload it','Walk away','Laugh at him']},
{how:'At the end of the parsha, Bnei Yisrael said: na\'aseh v\'nishma, we will do and we will listen. They promised to keep the Torah even before hearing all of it. Then Moshe went up the mountain for forty days.', q:'What did Bnei Yisrael say at the end of Mishpatim?', o:['Na\'aseh v\'nishma','We will think about it','Only if it is easy']}
],
we:[
{q:'Together: why does Mishpatim come right after the Aseres Hadibros?', o:['Everyday honesty is from Sinai too','The laws were forgotten','They are less important'], steps:['The parsha starts with V\'eileh: AND these.','Rashi: the "and" joins it to what came before.','These laws are also from Har Sinai.']},
{q:'Together: what do we learn from "do not cook a kid in its mother\'s milk"?', o:['Not to mix meat and milk','Not to eat goats','To drink milk every day'], steps:['The Torah says it three times.','Chazal: do not cook, eat, or benefit from meat and milk together.','That is why we wait between meat and milk.']}
],
practice:[
{t:'sort', q:'Sort each mitzvah from Mishpatim.', bins:[{id:'P',label:'Between people'},{id:'R',label:'The three Regalim'}], items:[{label:'return a lost animal',bin:'P'},{label:'pay for damage you caused',bin:'P'},{label:'lend to the poor without interest',bin:'P'},{label:'Pesach',bin:'R'},{label:'Shavuos',bin:'R'},{label:'Sukkos',bin:'R'}], why:'Mishpatim has laws between people and the three Regalim, when everyone went up to Yerushalayim.'},
{t:'pairs', q:'Match each case to what the Torah says.', pairs:[['a pit someone left open','he pays for the damage'],['a lost animal','return it to its owner'],['a poor borrower','do not charge interest'],['a widow or orphan','never hurt their feelings']], why:'Mishpatim protects everyone, especially the weak.'},
{t:'spotall', q:'Tap the mitzvos that are in Parshas Mishpatim.', cells:[{label:'helping unload a donkey',ok:true},{label:'not cooking meat and milk',ok:true},{label:'the three Regalim',ok:true},{label:'returning a lost animal',ok:true},{label:'lighting the Menorah',ok:false},{label:'tefillin',ok:false}], why:'Tefillin comes in Bo, and the Menorah\'s oil in Tetzaveh.'},
{t:'type', q:'They said: na\'aseh v\'… what? Type the missing word.', a:'nishma', alt:['v\'nishma','venishma','nishmah','vnishma'], kb:'abc', why:'Na\'aseh v\'nishma: we will do, and we will listen.'},
{q:'How long did Moshe stay on the mountain?', o:['Forty days and forty nights','Seven days','One day'], h:'The same number as the mabul\'s rain.', why:'The last pasuk of Mishpatim: forty days and forty nights.'},
{q:'Which three Yomim Tovim are the Shalosh Regalim?', o:['Pesach, Shavuos, Sukkos','Rosh Hashanah, Yom Kippur, Chanukah','Purim, Pesach, Chanukah'], h:'Regel means foot: they walked to Yerushalayim.', why:'Three times a year everyone came to the Beis Hamikdash.'}
],
check:[
{q:'What does na\'aseh v\'nishma mean?', o:['We will do and we will listen','We will rest','We will eat']},
{q:'What should you do with a lost animal you find?', o:['Return it to its owner','Keep it','Sell it']},
{q:'Where did Moshe go for forty days?', o:['Up Har Sinai','To Mitzrayim','To Midyan']}
]},
'LK.PAR.L02.18':{name:'Parsha Deep Dive: Terumah', band:'5-6', op:'Hashem says: make Me a Mishkan, and I will dwell among you. Every Jew brings what his heart wants to give.', peg:{kind:'heart',show:'Every heart gives',say:'From every person whose heart moves him: the Mishkan was built from gifts given with love.'},
teach:[
{how:'Opener: Terumah means a gift. Hashem asked for gold, silver, copper, colored wool, wood, oil, spices and precious stones, from everyone whose heart wanted to give.', q:'Who was asked to bring gifts for the Mishkan?', o:['Everyone whose heart wanted to give','Only the rich','Only the Kohanim']},
{how:'The Aron was made of wood covered with gold inside and outside, and the luchos were kept in it. On its cover stood two Keruvim with their wings spread.', q:'What was on top of the Aron?', o:['Two Keruvim','A crown of fire','A menorah']},
{how:'The Shulchan held twelve loaves, the Lechem Hapanim. The Menorah was hammered from one piece of gold. The copper Mizbe\'ach stood outside in the courtyard.', q:'What was on the Shulchan?', o:['Twelve loaves, the Lechem Hapanim','Fruit','The luchos']}
],
we:[
{q:'Together: why was the Aron gold inside and out?', o:['To teach us to be the same inside and out','To make it heavy','They had extra gold'], steps:['The Aron held the Torah.','It was gold on the outside AND the inside.','Chazal: a talmid chacham must be the same inside as outside.']},
{q:'Together: what do we learn from "and I will dwell among them"?', o:['Hashem dwells within each of us','The Mishkan was very big','Only Moshe could build'], steps:['The pasuk says among THEM, not inside IT.','Hashem rests among the people.','Each Jew can be a small Mishkan.']}
],
practice:[
{t:'pairs', q:'Match each keli to what it held or did.', pairs:[['Aron','held the luchos'],['Shulchan','twelve loaves'],['Menorah','seven branches'],['Mizbe\'ach','korbanos']], why:'The keilim of the Mishkan.'},
{t:'sort', q:'Sort: where did each one stand?', bins:[{id:'I',label:'Inside the Mishkan'},{id:'O',label:'Outside, in the courtyard'}], items:[{label:'the Aron',bin:'I'},{label:'the Shulchan',bin:'I'},{label:'the Menorah',bin:'I'},{label:'the copper Mizbe\'ach',bin:'O'},{label:'the Kiyor, the washing basin',bin:'O'},{label:'the courtyard fence',bin:'O'}], why:'The gold keilim stood inside; the copper Mizbe\'ach and the Kiyor stood in the courtyard.'},
{t:'spotall', q:'Tap the things made of gold or covered in gold.', cells:[{label:'the Aron',ok:true},{label:'the Menorah',ok:true},{label:'the Shulchan',ok:true},{label:'the Keruvim',ok:true},{label:'the outer Mizbe\'ach',ok:false},{label:'the courtyard pegs',ok:false}], why:'The outer Mizbe\'ach and the courtyard pegs were copper.'},
{t:'type', q:'How many branches did the Menorah have? Type the number.', a:'7', alt:['seven'], kb:'num', why:'Seven branches with cups, knobs and flowers.'},
{q:'How was the Menorah made?', o:['Hammered from one piece of gold','Many pieces glued together','Carved from wood'], h:'Miksha means hammered.', why:'One solid piece of gold, hammered into shape.'},
{q:'What lay inside the Aron?', o:['The luchos','Gold coins','The mann only'], h:'It is called the Aron Ha\'eidus.', why:'The luchos; next to it were a jar of mann and Aharon\'s staff.'}
],
check:[
{q:'How many loaves were on the Shulchan?', o:['Twelve','Seven','Ten']},
{q:'What did the Keruvim look like?', o:['Faces like children, with wings','Lions','Eagles']},
{q:'What is the main mitzvah of Terumah?', o:['Building the Mishkan','Shabbos','Kashrus']}
]},
'LK.PAR.L02.19':{name:'Parsha Deep Dive: Tetzaveh', band:'5-6', op:'Pure olive oil for the Menorah, and the clothes of the Kohen Gadol, shining with gold and twelve precious stones.', peg:{kind:'eight',show:'Eight garments',say:'The Kohen Gadol wore eight garments; a regular Kohen wore four.'},
teach:[
{how:'Opener: Tetzaveh begins with pure olive oil, the first drop from each olive, for the Menorah. It was lit every evening.', q:'What oil was used for the Menorah?', o:['Pure olive oil','Any cooking oil','Candle wax']},
{how:'The Kohen Gadol wore eight garments. On his heart was the Choshen with twelve precious stones, one for each shevet, with their names engraved.', q:'How many stones were on the Choshen?', o:['Twelve','Ten','Seven']},
{how:'Moshe\'s name does not appear even once in Parshas Tetzaveh. After the golden calf Moshe said: erase me, if You will not forgive them. His words came true in this one parsha.', q:'Whose name is missing from Parshas Tetzaveh?', o:['Moshe','Aharon','Yisro']}
],
we:[
{q:'Together: why did the Me\'il have bells on its hem?', o:['So his coming in would be heard','To play music','To scare birds'], steps:['The Me\'il was a blue robe.','Its hem had golden bells and woolen pomegranates.','The sound was heard when he entered the Kodesh.']},
{q:'Together: what was engraved on the Tzitz?', o:['Holy to Hashem','The names of the shevatim','The Aseres Hadibros'], steps:['The Tzitz was a gold plate.','The Kohen Gadol wore it on his forehead.','It said: Holy to Hashem.']}
],
practice:[
{t:'pairs', q:'Match each garment to what it had.', pairs:[['Choshen','twelve stones'],['Me\'il','bells and pomegranates'],['Tzitz','gold plate on the forehead'],['Eifod','two stones on the shoulders']], why:'The special garments of the Kohen Gadol.'},
{t:'sort', q:'Sort the garments: who wore them?', bins:[{id:'G',label:'Kohen Gadol only'},{id:'K',label:'Every Kohen'}], items:[{label:'Choshen',bin:'G'},{label:'Eifod',bin:'G'},{label:'Me\'il',bin:'G'},{label:'Tzitz',bin:'G'},{label:'Kesones, the tunic',bin:'K'},{label:'Michnasayim, the pants',bin:'K'}], why:'Every Kohen wore four: tunic, pants, belt and hat. The Kohen Gadol added four more.'},
{t:'spotall', q:'Tap what is in Parshas Tetzaveh.', cells:[{label:'oil for the Menorah',ok:true},{label:'the Kohen Gadol\'s clothes',ok:true},{label:'the Mizbe\'ach for the ketores',ok:true},{label:'the golden calf',ok:false},{label:'the Aseres Hadibros',ok:false}], why:'The golden calf is in Ki Sisa and the Aseres Hadibros in Yisro.'},

{q:'What was engraved on the Choshen stones?', o:['The names of the twelve shevatim','The Aseres Hadibros','Numbers']},
{q:'Who wore the eight garments?', o:['The Kohen Gadol','Every Levi','Moshe']}
]},
'LK.PAR.L02.20':{name:'Parsha Deep Dive: Ki Sisa', band:'5-6', op:'A half-shekel for every Jew, the promise of Shabbos, then the saddest day: a golden calf. But the story ends with forgiveness.', peg:{kind:'broken and new',show:'Luchos broken · luchos again',say:'The first luchos broke; Moshe davened, and Hashem gave the second luchos on Yom Kippur.'},
teach:[
{how:'Opener: To count the people, everyone gave a half-shekel, rich and poor the same. Then Hashem gave the mitzvah of Shabbos as a sign forever: V\'shamru.', q:'How much did every person give for the counting?', o:['A half-shekel','A whole shekel','Nothing']},
{how:'The people thought Moshe was late coming down and made a golden calf. When Moshe came down and saw it, he broke the luchos.', q:'What did Moshe do when he saw the golden calf?', o:['Broke the luchos','Danced','Went home']},
{how:'Moshe davened for the people. Hashem taught him the Thirteen Middos of Rachamim and forgave them. Moshe came down with the second luchos, and his face shone with light.', q:'What tefillah did Hashem teach Moshe?', o:['The Thirteen Middos of Rachamim','Modeh Ani','Shema']}
],
we:[
{q:'Together: why did everyone give exactly a half-shekel?', o:['Every Jew counts the same','Coins were small','To save money'], steps:['The rich could not give more, the poor not less.','Every Jew counts the same.','And a half reminds us: we are whole only together.']},
{q:'Together: which shevet did not serve the golden calf?', o:['Levi','Yehudah','Dan'], steps:['Moshe called out: whoever is for Hashem, come to me!','Shevet Levi came.','They had not served the calf.']}
],
practice:[
{t:'order', q:'Put Parshas Ki Sisa in order.', tiles:['The half-shekel','Shabbos is a sign','The golden calf','Moshe breaks the luchos','The second luchos'], why:'Shemos, perakim 30 to 34.'},
{t:'pairs', q:'Match each Ki Sisa word to its meaning.', pairs:[['Machatzis hashekel','counting the people'],['V\'shamru','Shabbos is a sign'],['Eigel hazahav','the golden calf'],['Bezalel','builder of the Mishkan']], why:'The big moments of Ki Sisa.'},
{t:'spotall', q:'Tap what happened in Parshas Ki Sisa.', cells:[{label:'the golden calf',ok:true},{label:'the broken luchos',ok:true},{label:'Moshe\'s shining face',ok:true},{label:'the Thirteen Middos',ok:true},{label:'the sea splits',ok:false},{label:'the ladder dream',ok:false}], why:'The sea splits in Beshalach and the ladder dream is in Vayeitzei.'},
{t:'type', q:'How many days was Moshe on the mountain for the second luchos? Type the number.', a:'40', alt:['forty'], kb:'num', why:'Another forty days and nights.'},
{q:'On which day did Moshe bring down the second luchos?', o:['Yom Kippur','Pesach','Shavuos'], h:'The day of forgiveness.', why:'That is why Yom Kippur is a day of forgiveness forever.'},
{q:'Who was chosen to build the Mishkan?', o:['Bezalel','Pharaoh','Korach'], h:'His name means in the shadow of Hashem.', why:'Bezalel ben Uri ben Chur, filled with wisdom.'}
],
check:[
{q:'Why did Moshe break the luchos?', o:['The people made the golden calf','He dropped them by mistake','They were too heavy']},
{q:'Which shevet stood with Moshe?', o:['Levi','Reuven','Dan']},
{q:'What shone when Moshe came down?', o:['His face','His staff','The Mishkan']}
]},
'LK.PAR.L02.21':{name:'Parsha Deep Dive: Vayakhel', band:'5-6', op:'Moshe gathers everyone together. The people bring so much for the Mishkan that Moshe has to announce: stop, it is enough!', peg:{kind:'more than enough',show:'Enough!',say:'They gave with such joy that Moshe had to announce: stop bringing!'},
teach:[
{how:'Opener: Vayakhel means and he gathered. Moshe gathered everyone and first taught them Shabbos: no melachah, not even to build the Mishkan.', q:'What did Moshe teach first when he gathered everyone?', o:['Shabbos','The Menorah','Pesach']},
{how:'Men and women brought gold, jewelry, wool and wood. Wise women spun goat hair. They brought so much that Moshe told them to stop.', q:'Why did Moshe tell them to stop bringing?', o:['There was more than enough','They were tired','It was Shabbos']},
{how:'Bezalel and Oholiav led the building. Bezalel made the Aron with his own hands.', q:'Who were the two master builders?', o:['Bezalel and Oholiav','Moshe and Aharon','Nadav and Avihu']}
],
we:[
{q:'Together: what did the women give for the Kiyor?', o:['Their copper mirrors','Their shoes','Their bread'], steps:['The women brought their copper mirrors.','Moshe was not sure he should take them.','Hashem said: these are the dearest to Me of all.']},
{q:'Together: why does building the Mishkan stop for Shabbos?', o:['Shabbos is even holier than the building','The builders needed sleep','They ran out of wood'], steps:['The Mishkan was the holiest building.','Still, the Torah puts Shabbos first.','From the Mishkan\'s work we learn the 39 melachos.']}
],
practice:[
{t:'order', q:'Put Parshas Vayakhel in order.', tiles:['Moshe gathers the people','He teaches Shabbos','Everyone brings gifts','Moshe says: enough!','Bezalel builds'], why:'Shemos, perakim 35 to 38.'},
{t:'pairs', q:'Match each giver or builder to the gift.', pairs:[['Bezalel','made the Aron'],['the wise women','spun goat hair'],['the nesi\'im','precious stones'],['the women','copper mirrors']], why:'Everyone gave in his own way.'},
{t:'spotall', q:'Tap the things given for the Mishkan.', cells:[{label:'gold',ok:true},{label:'copper mirrors',ok:true},{label:'goat hair',ok:true},{label:'olive oil',ok:true},{label:'iron swords',ok:false},{label:'bricks',ok:false}], why:'Bricks were for Pharaoh, and no swords were used in the Mishkan.'},
{t:'type', q:'Which day did Moshe teach about first? Type it.', a:'Shabbos', alt:['shabbat','shabbes','saturday'], kb:'abc', why:'Even the Mishkan stops for Shabbos.'},
{q:'Why is the parsha called Vayakhel?', o:['Moshe gathered everyone together','A song was sung','They traveled'], h:'Kahal means a gathering.', why:'And Moshe gathered the whole congregation.'},
{q:'Who was Bezalel\'s grandfather?', o:['Chur','Aharon','Yisro'], h:'He held up Moshe\'s hands against Amalek.', why:'Bezalel ben Uri ben Chur.'}
],
check:[
{q:'What did Moshe teach first in Vayakhel?', o:['Shabbos','The makos','The luchos']},
{q:'Who made the Aron?', o:['Bezalel','Pharaoh','Lavan']},
{q:'Why did the people stop bringing gifts?', o:['There was more than enough','It rained','Moshe was angry']}
]},
'LK.PAR.L02.22':{name:'Parsha Deep Dive: Pekudei', band:'5-6', op:'Every coin counted, every piece finished, and on Rosh Chodesh Nissan the Mishkan stands. A cloud of glory fills it.', peg:{kind:'cloud',show:'The cloud fills it',say:'When the Mishkan was finished, Hashem\'s cloud of glory rested on it.'},
teach:[
{how:'Opener: Pekudei means the accounts. Moshe gave an exact count of every bit of gold, silver and copper, so everyone could see that the gifts were used honestly.', q:'Why did Moshe give an exact count of the gold and silver?', o:['To show everyone he was honest','He liked numbers','To sell it']},
{how:'The Kohanim\'s clothes were made, and again and again the Torah says: as Hashem commanded Moshe. Every detail was done exactly right.', q:'Which words repeat again and again in Pekudei?', o:['As Hashem commanded Moshe','Let My people go','Na\'aseh v\'nishma']},
{how:'On Rosh Chodesh Nissan the Mishkan was set up, and a cloud filled it. Whenever the cloud lifted, Bnei Yisrael traveled. When we finish Sefer Shemos we call out: Chazak chazak v\'nischazek!', q:'When was the Mishkan set up?', o:['Rosh Chodesh Nissan','Purim','Rosh Hashanah']}
],
we:[
{q:'Together: how did they know when to travel?', o:['The cloud lifted from the Mishkan','A trumpet only','Moshe guessed'], steps:['The cloud rested on the Mishkan.','When it lifted, they traveled.','When it rested, they camped.']},
{q:'Together: what do we call out when we finish a sefer of the Torah?', o:['Chazak chazak v\'nischazek','Mazel tov','Amen'], steps:['Sefer Shemos ends with Pekudei.','The whole shul stands.','Everyone calls out: be strong, be strong, and we will be strengthened!']}
],
practice:[
{t:'order', q:'Put Parshas Pekudei in order.', tiles:['Counting the gold and silver','Making the Kohanim\'s clothes','Bringing the pieces to Moshe','Setting up the Mishkan','The cloud fills it'], why:'Shemos, perakim 38 to 40.'},
{t:'pairs', q:'Match each Pekudei word to its meaning.', pairs:[['Pekudei','the accounts'],['Rosh Chodesh Nissan','the Mishkan is set up'],['the cloud','Hashem\'s glory'],['Chazak chazak','we finished a sefer']], why:'The last parsha of Sefer Shemos.'},
{t:'spotall', q:'Review: tap every parsha of Sefer Shemos.', cells:[{label:'Shemos',ok:true},{label:'Va\'eira',ok:true},{label:'Bo',ok:true},{label:'Yisro',ok:true},{label:'Pekudei',ok:true},{label:'Noach',ok:false},{label:'Vayikra',ok:false}], why:'Noach is in Bereishis, and Vayikra starts the next sefer.'},
{t:'type', q:'How many parshiyos are in Sefer Shemos? Type the number.', a:'11', alt:['eleven'], kb:'num', why:'Shemos, Va\'eira, Bo, Beshalach, Yisro, Mishpatim, Terumah, Tetzaveh, Ki Sisa, Vayakhel, Pekudei.'},
{q:'What happened when the Mishkan was finished?', o:['Hashem\'s cloud filled it','It fell down','They went back to Mitzrayim'], h:'Hashem promised: I will dwell among them.', why:'The glory of Hashem filled the Mishkan.'},
{q:'Which sefer comes after Shemos?', o:['Vayikra','Bamidbar','Bereishis'], h:'It is about the korbanos.', why:'Bereishis, Shemos, Vayikra, Bamidbar, Devarim.'}
],
check:[
{q:'What does Pekudei mean?', o:['The accounts','The songs','The journeys']},
{q:'What filled the Mishkan?', o:['A cloud of glory','Water','Smoke from a fire']},
{q:'What do we call out at the end of Sefer Shemos?', o:['Chazak chazak v\'nischazek','Good Shabbos','L\'chaim']}
]},

/* ===== ROUND 8 (v242, takeover3): Parsha deep dives for all of Sefer Vayikra (LK.PAR.L02.23 to .32) ===== */
'LK.PAR.L02.23':{name:'Parsha Deep Dive: Vayikra', band:'5-6', op:'Hashem calls Moshe from the Mishkan with a small letter and a big lesson. Then: the korbanos, the way we come close to Hashem.', peg:{kind:'come close',show:'Korban = karov',say:'Korban comes from karov, close: a korban brings a person close to Hashem.'},
teach:[
{how:'Opener: The first word, Vayikra, is written with a small Aleph. Moshe was so humble that he wanted to write it without the Aleph at all. Hashem called to Moshe from the Ohel Moed.', q:'Why is the Aleph of Vayikra small?', o:['Moshe was humble','The scribe ran out of ink','It is a mistake']},
{how:'The word korban comes from karov, close. A korban brings a person closer to Hashem. Some korbanos were animals, some flour, some birds.', q:'What does the word korban come from?', o:['Karov, close','Kesef, money','Kodesh, holy']},
{how:'An Olah was burned completely on the Mizbe\'ach. A Mincha was a flour offering, often brought by a poor person. Every korban had salt on it.', q:'What was put on every korban?', o:['Salt','Honey','Sugar']}
],
we:[
{q:'Together: why does the Torah say "a soul" brings a Mincha?', o:['Hashem treasures the poor man\'s gift like his whole soul','Only souls can bring flour','The Mincha was expensive'], steps:['A Mincha is cheap flour, brought by a poor man.','The Torah calls him nefesh, a soul.','Rashi: Hashem says it is as if he offered his own soul.']},
{q:'Together: what replaces korbanos today, without a Beis Hamikdash?', o:['Tefillah','Nothing at all','Playing music'], steps:['We have no Beis Hamikdash today.','The navi says: our lips will take the place of the bulls.','Our tefillos stand in place of the korbanos.']}
],
practice:[
{t:'pairs', q:'Match each korban to what it was.', pairs:[['Olah','burned completely'],['Mincha','a flour offering'],['Chatas','for a mistake'],['Shelamim','a peace offering shared']], why:'Each korban had its own reason and its own way.'},
{t:'spotall', q:'Tap what could be a korban.', cells:[{label:'a sheep',ok:true},{label:'a dove',ok:true},{label:'fine flour',ok:true},{label:'a cow',ok:true},{label:'a lion',ok:false},{label:'honey',ok:false}], why:'Animals like sheep, cows and goats, certain birds and flour. Honey was never put on the Mizbe\'ach.'},
{t:'order', q:'Put the first five sefarim of the Torah in order.', tiles:['Bereishis','Shemos','Vayikra','Bamidbar','Devarim'], why:'Vayikra is the third sefer, in the middle of the Torah.'},
{t:'type', q:'What was put on every korban? Type one word.', a:'salt', alt:['melach','salt.'], kb:'abc', why:'A covenant of salt: salt never spoils.'},
{q:'Where did Hashem call Moshe from?', o:['The Ohel Moed','Har Sinai','The sea'], h:'The Mishkan was just finished.', why:'From the Ohel Moed, the Mishkan.'},
{q:'Why do young children traditionally start Chumash with Vayikra?', o:['Pure children learn about pure korbanos','It is the shortest','It has no stories'], h:'Chazal said it about purity.', why:'Chazal: let the pure ones come and learn about pure things.'}
],
check:[
{q:'Which letter is small in Vayikra?', o:['Aleph','Beis','Tav']},
{q:'What was a Mincha made of?', o:['Flour','Wool','Gold']},
{q:'Which korban was burned completely?', o:['The Olah','The Shelamim','The Chatas']}
]},
'LK.PAR.L02.24':{name:'Parsha Deep Dive: Tzav', band:'5-6', op:'A fire that must never go out, and seven days of training for the Kohanim before they begin.', peg:{kind:'eish tamid',show:'Fire always',say:'Eish tamid: the fire on the Mizbe\'ach must always burn and never go out.'},
teach:[
{how:'Opener: Tzav means command. Every morning the Kohen removed the ashes, terumas hadeshen, and added wood. The fire on the Mizbe\'ach must never go out.', q:'What must never go out on the Mizbe\'ach?', o:['The fire','The candles of the Menorah','The salt']},
{how:'The Kohen wore his special clothes to remove the ashes, then changed into older clothes to carry them out. Even simple jobs in the Mikdash are done with honor.', q:'What did the Kohen do first each morning at the Mizbe\'ach?', o:['Removed the ashes','Ate breakfast','Lit the Menorah']},
{how:'Aharon and his sons were dressed and anointed with oil, and stayed seven days at the Ohel Moed to prepare, the milu\'im.', q:'How many days did the Kohanim prepare before serving?', o:['Seven','Three','Forty']}
],
we:[
{q:'Together: what does "eish tamid" teach a person?', o:['Keep your love for Hashem always burning','Fire is dangerous','Light candles daily'], steps:['The fire on the Mizbe\'ach never went out.','Our hearts are like a small Mizbe\'ach.','We keep our love for Torah and mitzvos always burning.']},
{q:'Together: what is the Korban Todah, the thank-you korban?', o:['A korban brought after being saved from danger','A korban for a mistake','A korban for Shabbos'], steps:['People who crossed the sea or desert, left prison, or got better brought it.','They brought it with forty loaves.','Today we say Birchas Hagomel instead.']}
],
practice:[
{t:'pairs', q:'Match each Tzav word to its meaning.', pairs:[['Tzav','command'],['Eish tamid','a fire that always burns'],['Terumas hadeshen','removing the ashes'],['Milu\'im','seven days of preparing']], why:'Key ideas of Parshas Tzav.'},
{t:'spotall', q:'Tap the four who bring a Korban Todah.', cells:[{label:'one who crossed the sea',ok:true},{label:'one who crossed a desert',ok:true},{label:'one freed from prison',ok:true},{label:'one who got better from illness',ok:true},{label:'one who won a game',ok:false},{label:'one who bought shoes',ok:false}], why:'These four thank Hashem, and today they say Birchas Hagomel.'},
{t:'order', q:'Put the Kohen\'s morning job in order.', tiles:['Wear the special clothes','Remove some ashes','Change into older clothes','Carry the ashes out','Add wood to the fire'], why:'Vayikra perek 6.'},
{t:'type', q:'How many days were the milu\'im? Type the number.', a:'7', alt:['seven'], kb:'num', why:'Seven days, and on the eighth they began to serve.'},
{q:'Why is this parsha called Tzav and not just Daber?', o:['Tzav means hurry and do it with energy','It is shorter','It is louder'], h:'Rashi on the first pasuk.', why:'Rashi: tzav is an expression of urging, now and for all generations.'},
{q:'What blessing do we say today in place of the Korban Todah?', o:['Birchas Hagomel','Shehecheyanu','Hamotzi'], h:'It is said at the Torah reading.', why:'We say Birchas Hagomel after being saved.'}
],
check:[
{q:'What does Tzav mean?', o:['Command','Thank','Rest']},
{q:'What was removed from the Mizbe\'ach every morning?', o:['Some of the ashes','The stones','The salt']},
{q:'Who was anointed with oil?', o:['Aharon and his sons','Pharaoh','Bezalel']}
]},
'LK.PAR.L02.25':{name:'Parsha Deep Dive: Shemini', band:'5-6', op:'The eighth day: the Mishkan begins, fire comes down from Shamayim, and then a sad surprise. The parsha ends with which animals we may eat.', peg:{kind:'two signs',show:'Split hooves · chews cud',say:'A kosher animal has two signs: split hooves AND it chews its cud. A kosher fish: fins AND scales.'},
teach:[
{how:'Opener: On the eighth day Aharon brought the korbanos, and fire came down from Shamayim and burned them. All the people sang and bowed down.', q:'What came down from Shamayim on the eighth day?', o:['Fire','Rain','Mann']},
{how:'Nadav and Avihu, Aharon\'s sons, brought a fire that Hashem had not commanded and died. Aharon was silent, vayidom Aharon, accepting Hashem\'s judgment.', q:'How did Aharon respond when his sons died?', o:['He was silent','He shouted','He ran away']},
{how:'A kosher animal must have split hooves and chew its cud. A kosher fish must have fins and scales. Most birds of prey are not kosher.', q:'What two signs does a kosher animal have?', o:['Split hooves and chewing its cud','Long tail and fur','Wings and a beak']}
],
we:[
{q:'Together: is a pig kosher?', o:['No, it has split hooves but does not chew its cud','Yes, it has split hooves','Yes, it chews its cud'], steps:['A pig has split hooves.','But it does not chew its cud.','It needs BOTH signs, so it is not kosher.']},
{q:'Together: is a salmon kosher?', o:['Yes, it has fins and scales','No, fish are never kosher','Only on Shabbos'], steps:['Check for fins: yes.','Check for scales: yes.','Both signs: a kosher fish.']}
],
practice:[
{t:'sort', q:'Sort the animals: kosher or not kosher?', bins:[{id:'K',label:'Kosher'},{id:'N',label:'Not kosher'}], items:[{label:'cow',bin:'K'},{label:'sheep',bin:'K'},{label:'deer',bin:'K'},{label:'pig',bin:'N'},{label:'camel',bin:'N'},{label:'rabbit',bin:'N'}], why:'Cow, sheep and deer have both signs. Pig, camel and rabbit are each missing a sign.'},
{t:'spotall', q:'Tap every kosher fish.', cells:[{label:'salmon',ok:true},{label:'tuna',ok:true},{label:'carp',ok:true},{label:'shark',ok:false},{label:'catfish',ok:false},{label:'lobster',ok:false}], why:'Kosher fish have fins and scales. Sharks and catfish have no real scales, and lobster is not a fish with fins and scales.'},
{t:'pairs', q:'Match each name to what happened.', pairs:[['Aharon','was silent'],['Nadav and Avihu','brought a strange fire'],['Moshe','comforted Aharon'],['the people','sang and bowed down']], why:'The eighth day: joy and a sad lesson about doing exactly what Hashem commands.'},
{t:'type', q:'Which day was the Mishkan\'s first full day of service? Type the number.', a:'8', alt:['eight','eighth','8th'], kb:'num', why:'Shemini means eighth: after seven days of milu\'im.'},
{q:'What signs does a kosher fish need?', o:['Fins and scales','A long tail','Bright colors'], h:'Two signs, like animals.', why:'Every fish with scales also has fins.'},
{q:'What does vayidom Aharon teach us?', o:['To accept Hashem\'s ways even when it hurts','To never speak','To be angry'], h:'Vayidom means he was silent.', why:'Aharon\'s silence showed perfect trust, and Hashem spoke to him directly next.'}
],
check:[
{q:'What does Shemini mean?', o:['Eighth','Seventh','First']},
{q:'Is a camel kosher?', o:['No, it does not have split hooves','Yes','Only its milk']},
{q:'Who brought a fire not commanded?', o:['Nadav and Avihu','Moshe and Aharon','Elazar and Isamar']}
]},
'LK.PAR.L02.26':{name:'Parsha Deep Dive: Tazria', band:'5-6', op:'A new baby, a bris milah on the eighth day, and a strange skin mark called tzara\'as that only a Kohen can judge.', peg:{kind:'mirror',show:'Tzara\'as was a message',say:'Tzara\'as was not a regular sickness. It was a message from Hashem, mostly for speaking lashon hara.'},
teach:[
{how:'Opener: A baby boy has a bris milah on the eighth day, even on Shabbos. It is the sign of the covenant of Avraham Avinu.', q:'On which day is a bris milah?', o:['The eighth day','The first day','The thirtieth day']},
{how:'Tzara\'as was a white skin mark. It was not a regular sickness; Chazal teach it came mostly for lashon hara, speaking badly about others.', q:'What did tzara\'as mostly come for?', o:['Lashon hara','Eating too much','Being late']},
{how:'Only a Kohen could decide if a mark was tzara\'as. If he was not sure, the person waited seven days and the Kohen looked again.', q:'Who decided if a mark was tzara\'as?', o:['A Kohen','A doctor','The king']}
],
we:[
{q:'Together: why did a metzora live outside the camp?', o:['He separated people with lashon hara, so he was separated','He was dangerous','He wanted to travel'], steps:['Lashon hara pushes people apart.','So the metzora sat alone for a while.','Alone, he could think about the power of words.']},
{q:'Together: why is a bris milah done even on Shabbos?', o:['The eighth day is so important it pushes off Shabbos','Shabbos is not important','Babies are not counted'], steps:['The Torah says: on the eighth day.','That day is set, even if it is Shabbos.','So the bris is done on Shabbos.']}
],
practice:[
{t:'pairs', q:'Match each Tazria word to its meaning.', pairs:[['Bris milah','the covenant of Avraham'],['Tzara\'as','a white skin mark'],['Metzora','a person with tzara\'as'],['Kohen','judges the mark']], why:'Key ideas of Parshas Tazria.'},
{t:'spotall', q:'Tap every example of lashon hara.', cells:[{label:'telling others a friend failed a test',ok:true},{label:'saying a classmate is lazy',ok:true},{label:'laughing about someone\'s mistake behind his back',ok:true},{label:'praising a friend\'s chesed',ok:false},{label:'asking a rebbe for help',ok:false}], why:'Lashon hara is saying something negative about another person, even if it is true.'},
{t:'order', q:'Put the steps for a skin mark in order.', tiles:['A person sees a white mark','He goes to a Kohen','The Kohen looks','He waits seven days if unsure','The Kohen decides'], why:'Vayikra perek 13.'},
{t:'type', q:'How many days did an unsure case wait? Type the number.', a:'7', alt:['seven'], kb:'num', why:'Seven days, then the Kohen looked again.'},
{q:'Where else could tzara\'as appear besides skin?', o:['On clothes and on houses','On trees','On animals'], h:'Next week\'s parsha has houses.', why:'Tzara\'as could come on skin, clothing and houses.'},
{q:'What is the best way to avoid tzara\'as\'s lesson today?', o:['Guard our words','Wash more often','Stay inside'], h:'Think about why it came.', why:'Shemiras halashon: speak only good about others.'}
],
check:[
{q:'What was tzara\'as a sign of?', o:['Mostly lashon hara','Hard work','Rain']},

'LK.PAR.L02.27':{name:'Parsha Deep Dive: Metzora', band:'5-6', op:'Two birds, cedar wood, red wool and a hyssop branch: the way a metzora becomes pure again. Even a house can get tzara\'as!', peg:{kind:'two birds',show:'Chirping birds',say:'The metzora brought chirping birds because he sinned by chattering words.'},
teach:[
{how:'Opener: To become pure, the metzora brought two birds, cedar wood, red wool and hyssop. Birds chirp all day, like a person who chatters lashon hara.', q:'Why did the metzora bring birds?', o:['Birds chirp, like his chattering lashon hara','Birds are cheap','Birds can fly away']},
{how:'Cedar is a tall, proud tree. Hyssop is a low, humble plant. The lesson: lower your pride, and be humble like the hyssop.', q:'What does the low hyssop plant teach?', o:['To be humble','To grow tall','To be green']},
{how:'Tzara\'as could also appear on the walls of a house. The owner said to the Kohen: it seems like a mark in my house. He did not say for sure.', q:'What did the owner say about a mark in his house?', o:['It seems like a mark','It is definitely tzara\'as','It is nothing']}
],
we:[
{q:'Together: why did the owner say "it SEEMS like a mark"?', o:['Only the Kohen may decide, so we speak carefully','He could not see well','He was shy'], steps:['Even an expert does not decide by himself.','Only the Kohen declares it tzara\'as.','We learn to speak carefully and not jump to conclusions.']},
{q:'Together: what good thing sometimes happened when a house had tzara\'as?', o:['Treasure was found in the walls','The house became bigger','It turned to gold'], steps:['The stones with the mark were taken out.','Rashi: the Emori had hidden gold in their walls.','Taking out stones uncovered treasure!']}
],
practice:[
{t:'pairs', q:'Match each item to its lesson.', pairs:[['birds','chirping chatter'],['cedar','proud and tall'],['hyssop','low and humble'],['red wool','a sign of sin made clean']], why:'Each item of the purification taught a lesson.'},
{t:'order', q:'Put the metzora\'s return in order.', tiles:['The mark heals','The Kohen goes out to see','Two birds, cedar, wool, hyssop','He shaves and immerses','He returns to the camp'], why:'Vayikra perek 14.'},
{t:'spotall', q:'Tap where tzara\'as could appear.', cells:[{label:'skin',ok:true},{label:'clothing',ok:true},{label:'house walls',ok:true},{label:'trees',ok:false},{label:'animals',ok:false}], why:'On skin, clothes and houses only.'},
{t:'type', q:'How many birds did the metzora bring? Type the number.', a:'2', alt:['two'], kb:'num', why:'One was a korban and one was sent free.'},
{q:'What does the word metzora hint at?', o:['Motzi ra, bringing out bad talk','A kind of bird','A king'], h:'Chazal split the word.', why:'Chazal: metzora is motzi shem ra, one who spreads bad things.'},
{q:'What happened to the second bird?', o:['It was set free','It was eaten','It was sold'], h:'It flew away.', why:'It was sent away to the open field.'}
],
check:[
{q:'Which plant teaches humility?', o:['Hyssop','Cedar','Palm']},
{q:'Who decided if a house had tzara\'as?', o:['A Kohen','The owner','The neighbors']},
{q:'What hint is in the word metzora?', o:['Motzi ra, spreading bad things','Mitzvah','Matzah']}
]},
'LK.PAR.L02.28':{name:'Parsha Deep Dive: Acharei Mos', band:'5-6', op:'Once a year, on Yom Kippur, one man goes into the holiest room in the world. The parsha teaches the avodah of Yom Kippur.', peg:{kind:'once a year',show:'Kohen Gadol · Kodesh Hakodashim',say:'Only the Kohen Gadol, only on Yom Kippur, entered the Kodesh Hakodashim.'},
teach:[
{how:'Opener: After the death of Nadav and Avihu, Hashem said: Aharon may not come into the Kodesh Hakodashim whenever he wants. Only on Yom Kippur, with the special avodah.', q:'When could the Kohen Gadol enter the Kodesh Hakodashim?', o:['Only on Yom Kippur','Every Shabbos','Every morning']},
{how:'On Yom Kippur the Kohen Gadol wore simple white linen clothes, not his golden ones, to enter the Kodesh Hakodashim.', q:'What did the Kohen Gadol wear inside the Kodesh Hakodashim?', o:['Simple white linen','His gold clothes','A crown']},
{how:'Two goats were chosen by lottery: one for Hashem, and one sent away to Azazel, carrying away the sins of the people.', q:'How were the two goats chosen?', o:['By a lottery','By size','By color']}
],
we:[
{q:'Together: why white clothes and not gold on Yom Kippur?', o:['Gold reminds of the golden calf','White is cheaper','Gold is too heavy'], steps:['The golden calf was a terrible sin.','On the day of forgiveness we do not remind of it.','So the Kohen Gadol wore white.']},
{q:'Together: how do we remember the Yom Kippur avodah today?', o:['We say it in the Musaf of Yom Kippur','We do it in our homes','We do not remember it'], steps:['We have no Beis Hamikdash.','On Yom Kippur we say the Seder Ha\'avodah in Musaf.','We bow when we say how the Kohen Gadol said the Name.']}
],
practice:[
{t:'order', q:'Put parts of the Yom Kippur avodah in order.', tiles:['The Kohen Gadol immerses','He wears white linen','The lottery for the two goats','He enters with the ketores','The goat is sent to Azazel'], why:'Vayikra perek 16, in short.'},
{t:'pairs', q:'Match each word to its meaning.', pairs:[['Kodesh Hakodashim','the holiest room'],['Azazel','where the goat was sent'],['Ketores','the incense'],['Goral','a lottery']], why:'The words of the Yom Kippur avodah.'},
{t:'spotall', q:'Tap what is true about Yom Kippur.', cells:[{label:'we fast',ok:true},{label:'we ask forgiveness',ok:true},{label:'the Kohen Gadol entered the Kodesh Hakodashim',ok:true},{label:'we eat matzah',ok:false},{label:'we sit in a sukkah',ok:false}], why:'Matzah is Pesach and the sukkah is Sukkos.'},
{t:'type', q:'How many goats were in the lottery? Type the number.', a:'2', alt:['two'], kb:'num', why:'One for Hashem and one for Azazel.'},
{q:'Why does the parsha start "after the death of Aharon\'s two sons"?', o:['To warn: enter the holy places only as Hashem commands','To tell a sad story only','To count the years'], h:'Nadav and Avihu entered without a command.', why:'Rashi: like a doctor warning, do not do what killed the other patient.'},
{q:'Which mitzvah about blood is in Acharei Mos?', o:['Not to eat blood','To drink blood','To sell blood'], h:'That is why we salt meat.', why:'We may not eat blood, so meat is soaked and salted.'}
],
check:[
{q:'Who entered the Kodesh Hakodashim?', o:['The Kohen Gadol','Every Kohen','Moshe']},
{q:'On which day?', o:['Yom Kippur','Pesach','Rosh Chodesh']},
{q:'Why do we salt meat?', o:['To remove the blood','For taste only','To keep it cold']}
]},
'LK.PAR.L02.29':{name:'Parsha Deep Dive: Kedoshim', band:'5-6', op:'Be holy! And then the Torah tells us how: love your friend like yourself, leave food for the poor, respect the elderly.', peg:{kind:'big rule',show:'V\'ahavta l\'rei\'acha',say:'Love your fellow as yourself: Rabbi Akiva calls it a great rule of the Torah.'},
teach:[
{how:'Opener: Hashem said: be holy, because I am holy. Kedoshim was taught to everyone together, because it has so many basic mitzvos.', q:'What does Kedoshim tell us to be?', o:['Holy','Rich','Famous']},
{how:'V\'ahavta l\'rei\'acha kamocha: love your fellow as yourself. Rabbi Akiva said this is a great rule of the Torah. Hillel said: what you hate, do not do to your friend.', q:'What did Rabbi Akiva call "love your fellow as yourself"?', o:['A great rule of the Torah','A small mitzvah','A story']},
{how:'A farmer leaves the corner of his field, pe\'ah, and dropped stalks, leket, for the poor. Stand up for an elderly person and honor a talmid chacham.', q:'What is pe\'ah?', o:['The corner of the field left for the poor','A kind of fruit','A tax']}
],
we:[
{q:'Together: what does "do not put a stumbling block before the blind" mean?', o:['Do not give someone bad advice','Only do not trip blind people','Do not walk at night'], steps:['Simply: do not trip a blind person.','Rashi: also do not give bad advice to someone who cannot see where it leads.','Help people, never trick them.']},
{q:'Together: what does the Torah say about revenge?', o:['Do not take revenge or hold a grudge','Take revenge quickly','Revenge is fine if fair'], steps:['Someone would not lend you a tool.','Next week he asks to borrow yours.','Lend it, and do not even say: I am not like you!']}
],
practice:[
{t:'spotall', q:'Tap the mitzvos of Parshas Kedoshim.', cells:[{label:'love your fellow as yourself',ok:true},{label:'leave pe\'ah for the poor',ok:true},{label:'stand up for the elderly',ok:true},{label:'do not take revenge',ok:true},{label:'eat matzah',ok:false},{label:'light Chanukah candles',ok:false}], why:'Kedoshim is full of mitzvos between people.'},
{t:'pairs', q:'Match each mitzvah to its meaning.', pairs:[['Pe\'ah','the corner of the field'],['Leket','fallen stalks for the poor'],['Lo sikom','do not take revenge'],['Lo sitor','do not hold a grudge']], why:'Kedoshim, Vayikra perek 19.'},
{t:'sort', q:'Sort: is it a mitzvah of Kedoshim, or the opposite?', bins:[{id:'Y',label:'Kedoshim says do it'},{id:'N',label:'Kedoshim says do not'}], items:[{label:'honor a talmid chacham',bin:'Y'},{label:'pay a worker on time',bin:'Y'},{label:'judge fairly',bin:'Y'},{label:'steal',bin:'N'},{label:'lie',bin:'N'},{label:'curse a deaf person',bin:'N'}], why:'Kedoshim: pay workers the same day, judge fairly, no stealing, no lying, do not curse even someone who cannot hear.'},
{t:'type', q:'Finish Hillel\'s rule: what you hate, do not do to your ___. Type one word.', a:'friend', alt:['fellow','friend.','neighbor','chaver'], kb:'abc', why:'Hillel taught the whole Torah on one foot with this rule.'},
{q:'When must a worker be paid?', o:['The same day','After a year','Whenever you remember'], h:'He is counting on it.', why:'Do not keep a worker\'s wages overnight.'},
{q:'Why does Kedoshim say "be holy"?', o:['Because Hashem is holy','Because it is easy','Because the neighbors watch'], h:'Ki kadosh Ani.', why:'We copy Hashem\'s ways.'}
],
check:[
{q:'What is leket?', o:['Fallen stalks left for the poor','A kind of bread','A bracha']},
{q:'Who said "what you hate, do not do to your friend"?', o:['Hillel','Pharaoh','Lavan']},
{q:'Whom must we stand up for?', o:['An elderly person','Only our friends','No one']}
]},
'LK.PAR.L02.30':{name:'Parsha Deep Dive: Emor', band:'5-6', op:'The holiness of the Kohanim, and a calendar of every Yom Tov of the year: Shabbos, Pesach, Shavuos, Rosh Hashanah, Yom Kippur, Sukkos.', peg:{kind:'calendar',show:'The Moadim',say:'Emor is the Torah\'s calendar: Shabbos and all the Moadim, in order.'},
teach:[
{how:'Opener: Emor teaches extra holiness for Kohanim. A Kohen must not become tamei from a dead body, except for close family.', q:'What must a Kohen avoid?', o:['Becoming tamei from a dead body','Eating bread','Wearing white']},
{how:'Emor lists the Moadim: Shabbos, Pesach, the Omer, Shavuos, Rosh Hashanah, Yom Kippur and Sukkos.', q:'Which day is listed first in the Moadim?', o:['Shabbos','Pesach','Rosh Hashanah']},
{how:'We count the Omer for forty-nine days from the second night of Pesach until Shavuos.', q:'How many days do we count the Omer?', o:['Forty-nine','Seven','Fifty-two']}
],
we:[
{q:'Together: why is Shabbos listed with the Yomim Tovim?', o:['Whoever keeps the Yomim Tovim is like keeping Shabbos too','It was a mistake','It is not a holy day'], steps:['The list starts with Shabbos.','Rashi: honoring the Yomim Tovim is like keeping Shabbos.','Shabbos is the root of all holy times.']},
{q:'Together: what are the arba minim of Sukkos?', o:['Lulav, esrog, hadassim and aravos','Matzah, maror, wine and egg','Shofar, candles, challah and wine'], steps:['Emor gives the mitzvah of the four kinds.','Lulav (palm), esrog, hadassim (myrtle), aravos (willow).','We shake them on Sukkos.']}
],
practice:[
{t:'order', q:'Put the Moadim of Emor in the order of the year, from Nissan.', tiles:['Pesach','Shavuos','Rosh Hashanah','Yom Kippur','Sukkos'], why:'The Torah counts months from Nissan.'},
{t:'pairs', q:'Match each Yom Tov to its mitzvah.', pairs:[['Pesach','matzah'],['Rosh Hashanah','shofar'],['Yom Kippur','fasting'],['Sukkos','sukkah and arba minim']], why:'Each Moed has its own special mitzvah.'},
{t:'spotall', q:'Tap the arba minim.', cells:[{label:'lulav',ok:true},{label:'esrog',ok:true},{label:'hadassim',ok:true},{label:'aravos',ok:true},{label:'apple',ok:false},{label:'olive branch',ok:false}], why:'Palm, citron, myrtle and willow.'},
{t:'type', q:'How many days do we count the Omer? Type the number.', a:'49', alt:['forty-nine','forty nine'], kb:'num', why:'Seven full weeks, and the fiftieth day is Shavuos.'},
{q:'What lesson is in the story of the blasphemer at the end of Emor?', o:['Words about Hashem must be holy','Fighting is fun','Names do not matter'], h:'He cursed with the Name.', why:'Speaking against Hashem is the most serious misuse of speech.'},
{q:'What happens on the fiftieth day after Pesach?', o:['Shavuos','Purim','Chanukah'], h:'Count 49, then the next day.', why:'Shavuos, the day of Matan Torah.'}
],
check:[
{q:'What is counted between Pesach and Shavuos?', o:['The Omer','The stars','The coins']},
{q:'Which Yom Tov has the shofar?', o:['Rosh Hashanah','Pesach','Shavuos']},
{q:'How many minim do we take on Sukkos?', o:['Four','Two','Seven']}
]},
'LK.PAR.L02.31':{name:'Parsha Deep Dive: Behar', band:'5-6', op:'Every seventh year, the land of Eretz Yisrael rests. Every fiftieth year, the shofar sounds and everyone goes free.', peg:{kind:'seven and fifty',show:'Shemittah · Yovel',say:'Year seven: the land rests, Shemittah. Year fifty: everyone goes free, Yovel.'},
teach:[
{how:'Opener: Behar means on the mountain: these mitzvos were given at Har Sinai. Every seventh year in Eretz Yisrael is Shemittah: no planting or plowing, and fruit is free for all.', q:'What happens in the Shemittah year?', o:['The land rests','Double planting','Everyone moves']},
{how:'After seven Shemittos, the fiftieth year is Yovel. The shofar is blown on Yom Kippur, servants go free, and fields return to their families.', q:'Which year is Yovel?', o:['The fiftieth','The seventh','The hundredth']},
{how:'Do not cheat in business: ona\'as mamon. Also do not hurt with words: ona\'as devarim. Lend to a poor brother without interest.', q:'What is ona\'as devarim?', o:['Hurting someone with words','A business deal','A kind of field']}
],
we:[
{q:'Together: how will we eat in the Shemittah year if we do not plant?', o:['Hashem promised a triple harvest in the sixth year','We will go hungry','We buy from Mitzrayim'], steps:['The people might worry.','Hashem promised: the sixth year will give enough for three years.','Shemittah teaches bitachon, trust in Hashem.']},
{q:'Together: why does the parsha say these mitzvos were given "at Har Sinai"?', o:['All mitzvos, with their details, came from Sinai','Only Shemittah came from Sinai','Moshe forgot'], steps:['Rashi asks: what does Shemittah have to do with Har Sinai?','Just like Shemittah\'s details came from Sinai,','so did all the mitzvos with their details.']}
],
practice:[
{t:'pairs', q:'Match each Behar word to its meaning.', pairs:[['Shemittah','the seventh year'],['Yovel','the fiftieth year'],['Ona\'as devarim','hurting with words'],['Ribbis','interest on a loan']], why:'Key ideas of Parshas Behar.'},
{t:'spotall', q:'Tap what happens in the Yovel year.', cells:[{label:'the shofar sounds',ok:true},{label:'servants go free',ok:true},{label:'fields return to their families',ok:true},{label:'everyone gets a crown',ok:false},{label:'the Beis Hamikdash moves',ok:false}], why:'Yovel: freedom and return.'},
{t:'sort', q:'Sort: allowed or not allowed in the Shemittah year?', bins:[{id:'Y',label:'Allowed'},{id:'N',label:'Not allowed'}], items:[{label:'eating fruit that grew by itself',bin:'Y'},{label:'sharing fruit with everyone',bin:'Y'},{label:'learning Torah more',bin:'Y'},{label:'planting',bin:'N'},{label:'plowing',bin:'N'},{label:'selling the fruit for business',bin:'N'}], why:'The land rests; its fruit is free for everyone.'},
{t:'type', q:'Every how many years is Shemittah? Type the number.', a:'7', alt:['seven'], kb:'num', why:'Six years we work the land, and the seventh it rests.'},
{q:'What does Shemittah teach?', o:['Trust that Hashem provides','Farming is hard','Rest is lazy'], h:'Think of the triple harvest.', why:'Bitachon: the land belongs to Hashem.'},
{q:'When was the Yovel shofar blown?', o:['On Yom Kippur','On Purim','On Pesach'], h:'A day of freedom for the soul too.', why:'On Yom Kippur of the fiftieth year.'}
],
check:[
{q:'What does Behar mean?', o:['On the mountain','By the river','In the field']},
{q:'Is it allowed to hurt someone with words?', o:['No, that is ona\'as devarim','Yes, if it is true','Only on weekdays']},
{q:'May we charge interest to a fellow Jew?', o:['No','Yes','Only a little']}
]},
'LK.PAR.L02.32':{name:'Parsha Deep Dive: Bechukosai', band:'5-6', op:'If you walk in My ways: rain in its time, peace in the land, and Hashem\'s presence among you. Sefer Vayikra ends with a great promise.', peg:{kind:'walk',show:'Im bechukosai teileichu',say:'If you walk in My ways: walking means toiling in Torah, step by step.'},
teach:[
{how:'Opener: Im bechukosai teileichu: if you walk in My laws. Rashi says it means to toil in Torah learning.', q:'What does "walking in My laws" mean, according to Rashi?', o:['Toiling in Torah learning','Going on long walks','Traveling to Yerushalayim']},
{how:'Hashem promises brachos: rain in its time, plenty of food, peace in the land, and "I will walk among you."', q:'Which is one of the brachos in Bechukosai?', o:['Rain in its time','Gold falling from the sky','No more winter']},
{how:'The parsha also warns what happens if we leave the Torah, the tochachah. It ends with a promise: Hashem will remember His covenant with the Avos and never abandon us.', q:'How does the warning end?', o:['Hashem will remember His covenant and never abandon us','With nothing','With a song']}
],
we:[
{q:'Together: why do we read the tochachah quietly?', o:['It is sad, so the reader reads it softly','The words are secret','To finish fast'], steps:['The tochachah describes hard times.','The reader reads it in a low voice.','But the promise at the end is said clearly.']},
{q:'Together: what do we call out at the end of Sefer Vayikra?', o:['Chazak chazak v\'nischazek','Mazel tov','L\'chaim'], steps:['Vayikra ends with Bechukosai.','The whole shul stands.','We call out: be strong, be strong, and we will be strengthened!']}
],
practice:[
{t:'spotall', q:'Tap the brachos promised in Bechukosai.', cells:[{label:'rain in its time',ok:true},{label:'plenty of food',ok:true},{label:'peace in the land',ok:true},{label:'Hashem walks among us',ok:true},{label:'no homework ever',ok:false},{label:'everyone becomes king',ok:false}], why:'Vayikra perek 26.'},
{t:'order', q:'Review: put the parshiyos of Sefer Vayikra in order.', tiles:['Vayikra','Tzav','Shemini','Tazria','Metzora','Acharei Mos','Kedoshim','Emor','Behar','Bechukosai'], why:'Ten parshiyos in Sefer Vayikra.'},
{t:'pairs', q:'Match each Vayikra parsha to its big idea.', pairs:[['Shemini','kosher animals'],['Kedoshim','love your fellow'],['Emor','the Moadim'],['Behar','Shemittah']], why:'A review of Sefer Vayikra.'},
{t:'type', q:'How many parshiyos are in Sefer Vayikra? Type the number.', a:'10', alt:['ten'], kb:'num', why:'Vayikra through Bechukosai.'},
{q:'What is the tochachah?', o:['The warning of what happens if we leave the Torah','A Yom Tov song','A korban'], h:'It is read softly.', why:'Hard words meant to bring us back, ending with hope.'},
{q:'Which sefer comes after Vayikra?', o:['Bamidbar','Devarim','Shemos'], h:'It begins with counting the people in the desert.', why:'Bereishis, Shemos, Vayikra, Bamidbar, Devarim.'}
],
check:[
{q:'What does Rashi say walking in Hashem\'s laws means?', o:['Toiling in Torah','Taking walks','Building houses']},
{q:'What is promised at the end of the warning?', o:['Hashem will never abandon us','Nothing','A new king']},
{q:'What do we call out at the end of Vayikra?', o:['Chazak chazak v\'nischazek','Good morning','Amen']}
]},

/* ===== ROUND 9 (v244, takeover3): Parsha deep dives for all of Sefer Bamidbar (LK.PAR.L02.33 to .42).
   HoS 2026-11-15: "not just a question and three choices; the learning moments much more exciting". New standard for these:
   teach = a short scene that puts the boy inside the story; practice = 6 hands-on activities (sort, pairs, spotall, order, type), no plain multiple choice;
   check = one order + two taps (check[] allows only tap and order). ===== */
'LK.PAR.L02.33':{name:'Parsha Deep Dive: Bamidbar', band:'5-6', op:'Picture a giant camp in the desert: twelve shevatim, each under its own flag, all around the Mishkan in the middle.', peg:{kind:'camp map',show:'Mishkan in the middle',say:'The Mishkan stood in the center, the Leviim right around it, and the twelve shevatim in four groups of three, each under its flag.'},
teach:[
{how:'Opener: You are standing on a hill above the camp. Below you, more than six hundred thousand men, counted one by one. Hashem counts us again and again because each one is precious, like a person counting his treasures.', q:'Why does Hashem count Bnei Yisrael so often?', o:['Because each one is precious to Him','Because He forgot','To make a list for taxes']},
{how:'Look closer: four groups of three shevatim, east, south, west and north, each shevet with its own flag and color. Yehudah camps on the east side, in front, with a lion on its flag.', q:'Which shevet camped on the east, leading the way?', o:['Yehudah','Reuven','Dan']},
{how:'Right around the Mishkan are the tents of Shevet Levi. They are not counted with the others. They carry the Mishkan: Kehas the holy keilim, Gershon the curtains, Merari the boards and posts.', q:'Who camped right around the Mishkan?', o:['Shevet Levi','Shevet Yehudah','The Egyptians']}
],
we:[
{q:'Together: why was Shevet Levi counted from one month old?', o:['They were the guardians of the Mishkan from birth','Babies are easy to count','They were the biggest shevet'], steps:['Every other shevet counted men from twenty.','Levi was counted from one month old.','From the start of life they belonged to the Mishkan.']},
{q:'Together: why did each shevet get its own flag?', o:['Every shevet has its own special job and strength','To decorate the desert','To know who won'], steps:['The colors matched each shevet\'s stone on the Choshen.','Each shevet had its own path in serving Hashem.','Together they made one camp around the Mishkan.']}
],
practice:[
{t:'sort', q:'Build the camp: which side did each shevet camp on?', bins:[{id:'E',label:'East: Yehudah\'s group'},{id:'S',label:'South: Reuven\'s group'}], items:[{label:'Yehudah',bin:'E'},{label:'Yissachar',bin:'E'},{label:'Zevulun',bin:'E'},{label:'Reuven',bin:'S'},{label:'Shimon',bin:'S'},{label:'Gad',bin:'S'}], why:'East: Yehudah, Yissachar, Zevulun. South: Reuven, Shimon, Gad.'},
{t:'pairs', q:'Match each family of Levi to what it carried.', pairs:[['Kehas','the holy keilim'],['Gershon','the curtains'],['Merari','the boards and posts'],['Aharon\'s sons','covered the keilim first']], why:'Every family of Levi had its own job when the camp traveled.'},
{t:'spotall', q:'Tap what is true about the camp in the desert.', cells:[{label:'the Mishkan was in the middle',ok:true},{label:'Levi camped closest',ok:true},{label:'each shevet had a flag',ok:true},{label:'everyone camped in one long line',ok:false},{label:'Levi was counted from age twenty',ok:false}], why:'A square camp with the Mishkan at the heart; Levi was counted from one month.'},
{t:'order', q:'Put the four directions of the camp in the order they traveled.', tiles:['East: Yehudah','South: Reuven','West: Ephraim','North: Dan'], why:'Yehudah led, Reuven next, then Ephraim, and Dan gathered everyone at the end.'},
{t:'type', q:'Bamidbar means "in the ___." Type the missing word.', a:'desert', alt:['wilderness','midbar','the desert'], kb:'abc', why:'The whole sefer happens in the midbar, the desert.'},
{t:'spotall', q:'Tap the shevatim of Yehudah\'s group, the first to travel.', cells:[{label:'Yehudah',ok:true},{label:'Yissachar',ok:true},{label:'Zevulun',ok:true},{label:'Dan',ok:false},{label:'Ephraim',ok:false}], why:'Yehudah, Yissachar and Zevulun: the lion group in front.'}
],
check:[
{t:'order', q:'Put the Levi families\' jobs in order: holiest first.', tiles:['Kehas: the holy keilim','Gershon: the curtains','Merari: the boards']},
{q:'What stood in the middle of the camp?', o:['The Mishkan','Moshe\'s tent','A well']},

]},
'LK.PAR.L02.34':{name:'Parsha Deep Dive: Nasso', band:'5-6', op:'Twelve princes, twelve wagons of gifts, and every single one gave the exact same thing. Yet the Torah writes each gift out, one by one!', peg:{kind:'same gift, new heart',show:'12 × the same',say:'Each nasi brought the same gift, but each with his own thoughts, so the Torah tells each one separately.'},
teach:[
{how:'Opener: The Mishkan is finished! A line of six covered wagons pulled by oxen arrives: a gift from the nesi\'im, the princes of the shevatim, to carry the Mishkan.', q:'What did the nesi\'im give to carry the Mishkan?', o:['Covered wagons and oxen','Camels','Boats']},
{how:'Then, for twelve days, one nasi each day brings the same korbanos: a silver bowl, a gold spoon full of ketores, and animals. The Torah repeats the whole list twelve times.', q:'Why does the Torah repeat the same gift twelve times?', o:['Each nasi gave with his own heart and meaning','The scribe forgot','To make the Torah longer']},
{how:'In Nasso is Birchas Kohanim, the three blessings the Kohanim say: Yevarechecha, Ya\'er, Yisa. They still bless us in shul today.', q:'What blessing is in Parshas Nasso?', o:['Birchas Kohanim','Hamotzi','Birkas Hamazon']}
],
we:[
{q:'Together: who was the first nasi to bring his gift?', o:['Nachshon of Yehudah','Elitzur of Reuven','Gamliel of Menashe'], steps:['Day one belongs to the shevet that leads.','That is Yehudah.','Its nasi was Nachshon ben Aminadav, the first into the sea!']},
{q:'Together: what is a nazir?', o:['Someone who takes on extra holiness: no wine, no haircut','A king','A merchant'], steps:['A person can make a special promise.','He drinks no wine and does not cut his hair.','He becomes extra holy for a while.']}
],
practice:[
{t:'order', q:'Put the three blessings of Birchas Kohanim in order.', tiles:['Yevarechecha: may Hashem bless you','Ya\'er: may Hashem shine His face','Yisa: may Hashem grant you peace'], why:'Three blessings, ending with the greatest: shalom.'},
{t:'pairs', q:'Match each gift of the nasi to what it was.', pairs:[['silver bowl','for flour and oil'],['gold spoon','full of ketores'],['wagons','to carry the Mishkan'],['oxen','to pull the wagons']], why:'Each nasi brought the same set.'},
{t:'spotall', q:'Tap the things a nazir does not do.', cells:[{label:'drink wine',ok:true},{label:'cut his hair',ok:true},{label:'eat grapes',ok:true},{label:'daven',ok:false},{label:'learn Torah',ok:false}], why:'A nazir stays away from grape products and haircuts; he davens and learns even more.'},
{t:'sort', q:'Sort: who did what in Nasso?', bins:[{id:'K',label:'The Kohanim'},{id:'N',label:'The nesi\'im'}], items:[{label:'bless the people',bin:'K'},{label:'lift their hands in shul',bin:'K'},{label:'bring silver bowls',bin:'N'},{label:'give wagons',bin:'N'}], why:'Kohanim bless; the nesi\'im brought gifts for the Mishkan.'},

],
