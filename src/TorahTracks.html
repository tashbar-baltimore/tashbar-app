ch friend is in.\nYour turn: sort each one to the sefer.\nTap a card, then its box.", "Match each navi to his story.": "Story Match!\nLike matching a hero to his adventure.\nYour turn: match each navi to his story.\nTap a word, then its match.", "Match each woman prophet to her story.": "Her Story!\nLike matching each hero to a brave deed.\nYour turn: match each woman prophet to her story.\nTap a word, then its match.", "Match each woman prophet to where we read about her.": "Find Her Sefer!\nLike finding which shelf a book is on.\nYour turn: match each one to her sefer.\nTap a word, then its match.", "Tap every sefer of Nevi'im.": "Navi Spotter!\nLike finding every square in a box of shapes.\nYour turn: tap every sefer of Nevi'im.\nTap every right one, then Check.", "Tap every true sentence about the women prophets.": "Truth Finder!\nLike checking which answers on a quiz are right.\nYour turn: tap every true sentence.\nTap every right one, then Check.", "Trei Asar means how many? Type the number.": "Number Code!\nLike a dozen eggs means twelve.\nYour turn: type what Trei Asar means.\nType your answer, then Check."}}, "LK.CHEM.L03.01": {"s": "Thirteen Steps!\nLike counting the floors of a building, one by one.\nYour turn: learn the thirteen principles in order.\nTap, sort and match as you go.", "q": {"Together: which number says the Torah will never be changed?": "Number Detective!\nLike finding a page: 7, then 8, then the next page.\nYour turn: find the number of this principle.\nTap your answer.", "Together: what is the very last principle?": "Last Stop!\nLike the last car on a train: count to the end.\nYour turn: find the thirteenth principle.\nTap your answer.", "Put the first five principles in order.": "Foundation Five!\nLike stacking blocks: the bottom one goes first.\nYour turn: put principles 1 to 5 in order.\nTap the tiles in order.", "Put principles 6 to 9 in order.": "Middle Four!\nLike the middle of a week: Monday, Tuesday, Wednesday.\nYour turn: put principles 6 to 9 in order.\nTap the tiles in order.", "Put the last four principles in order.": "Final Four!\nLike the end of a race: the finish line is last.\nYour turn: put principles 10 to 13 in order.\nTap the tiles in order.", "Sort: which group is each principle in?": "Three Shelves!\nLike a closet: shirts on one shelf, socks on another.\nYour turn: put each principle on its shelf.\nTap a card, then its box.", "Match the number to its principle.": "Number Match!\nLike matching a house number to its house.\nYour turn: match each number to its principle.\nTap a word, then its match.", "Match these numbers to their principles.": "Jump Match!\nLike matching a page number to a chapter.\nYour turn: match each number to its principle.\nTap a word, then its match.", "Tap every one of the Thirteen Principles.": "Principle Spotter!\nLike finding every red apple in a basket.\nYour turn: find every true principle.\nTap every right one, then Check.", "Tap every principle that is about Hashem Himself.": "Group Finder!\nLike finding every fruit in a list of foods.\nYour turn: find every principle about Hashem.\nTap every right one, then Check.", "How many principles of faith did the Rambam count? Type the number.": "Count and Type!\nLike counting the days in a week: seven.\nYour turn: type how many principles there are.\nType your answer, then Check.", "Sort: a true principle, or its false opposite?": "True or Opposite?\nLike hot and cold: one fact, one opposite.\nYour turn: sort each card.\nTap a card, then its box.", "Build the words of the twelfth principle in order.": "Sentence Builder!\nLike building: I am, going, to school, today.\nYour turn: build the twelfth principle.\nTap the tiles in order.", "Match each group to its numbers.": "Map the Groups!\nLike matching floors to rooms in a building.\nYour turn: match each group to its numbers.\nTap a word, then its match.", "Put these principles in order.": "Quick Line Up!\nLike lining up by height, shortest first.\nYour turn: put these four in order.\nTap the tiles in order.", "Which principle says Moshe Rabbeinu was the greatest navi?": "Think It Through!\nLike remembering your seat number in class.\nYour turn: pick the right number.\nTap your answer.", "Where do we find the Thirteen Principles printed?": "Choose Smart!\nLike knowing where the cereal is in the kitchen.\nYour turn: pick the right place.\nTap your answer."}}, "LK.CHEM.L03.02": {"s": "Chain Builder!\nLike a family tree, one generation after another.\nYour turn: build the chain from Sinai to today.\nTap, sort and match each link.", "q": {"Together: who passed the Torah to the Nevi'im?": "Follow the Chain!\nLike a bucket line: each person hands it to the next.\nYour turn: find who handed the Torah to the Nevi'im.\nTap your answer.", "Together: which era comes right before the Acharonim?": "Word Clue!\nLike first and last: first comes before last.\nYour turn: use the meaning of the names.\nTap your answer.", "Put the chain of the first mishnah in Pirkei Avos in order.": "Link by Link!\nLike a relay race: each runner passes the stick.\nYour turn: build the chain from Moshe.\nTap the tiles in order.", "Put the five eras of Torah teachers in order.": "Era Line!\nLike seasons: fall, winter, spring, summer.\nYour turn: put the five eras in order.\nTap the tiles in order.", "Match each era to what it is known for.": "Era Match!\nLike matching a team to its sport.\nYour turn: match each era to its job.\nTap a word, then its match.", "Sort: Rishon or Acharon?": "Early or Later?\nLike sorting old coins from new coins.\nYour turn: sort each great teacher.\nTap a card, then its box.", "Tap every link in the first mishnah of Pirkei Avos.": "Link Finder!\nLike finding every gold link in a necklace.\nYour turn: find every link in that mishnah.\nTap every right one, then Check.", "Tap every thing the Men of the Great Assembly said.": "Three Sayings!\nLike a team motto: work hard, play fair, help others.\nYour turn: find their three sayings.\nTap every right one, then Check.", "Match who passed the Torah to whom.": "Hand-Off Match!\nLike a mail carrier: from the post office to your door.\nYour turn: match each giver to who received it.\nTap a word, then its match.", "Sort: a link in the first mishnah of Pirkei Avos, or a later era?": "Then or Later?\nLike sorting baby pictures from new pictures.\nYour turn: sort each name.\nTap a card, then its box.", "Put these Torah giants in order of time.": "Time Travel!\nLike a family line: great-grandfather, grandfather, father, son.\nYour turn: put these giants in order.\nTap the tiles in order.", "Moshe received the Torah from which mountain? Type its name.": "Name and Type!\nLike typing the name of your city.\nYour turn: type the name of the mountain.\nType your answer, then Check.", "Tap every era that came after the Gemara was finished.": "After Spotter!\nLike finding every day after Wednesday.\nYour turn: find every era after the Gemara.\nTap every right one, then Check.", "Put the chain in order.": "Quick Chain!\nLike counting links on a bike chain.\nYour turn: build the chain once more.\nTap the tiles in order.", "Where is the chain from Moshe written?": "Choose Smart!\nLike knowing which shelf holds the atlas.\nYour turn: pick the right place.\nTap your answer.", "Which era came right after the Amoraim?": "Next in Line!\nLike knowing what comes after Tuesday.\nYour turn: pick the next era.\nTap your answer."}}, "LK.CHEM.L03.03": {"s": "Shelf of Giants!\nLike a family album, from the oldest picture to the newest.\nYour turn: match each great sefer to its author and era.\nTap, sort and match as you go.", "q": {"Together: which came first, Rashi or the Shulchan Aruch?": "Which Came First?\nLike asking: the seed or the tree it grew into?\nYour turn: pick the earlier one.\nTap your answer.", "Together: the Mishnah Berurah explains which sefer?": "Clue Hunt!\nLike a map with notes written in the margin.\nYour turn: find which sefer it explains.\nTap your answer.", "Put these sefarim in the order they were written.": "Bookshelf Line!\nLike a photo album: baby, child, grown up.\nYour turn: put the sefarim in order.\nTap the tiles in order.", "Match each sefer to its author.": "Author Match!\nLike matching a song to its singer.\nYour turn: match each sefer to who wrote it.\nTap a word, then its match.", "Put these authors in order of time.": "Giants in a Row!\nLike lining up grandfather, father and son.\nYour turn: put the authors in order.\nTap the tiles in order.", "Sort: Tanna, Rishon, or Acharon?": "Three Eras!\nLike sorting toys into three bins by size.\nYour turn: put each giant in his era.\nTap a card, then its box.", "Tap every thing the Rambam wrote.": "Rambam Spotter!\nLike finding every book by one writer in a library.\nYour turn: find every work of the Rambam.\nTap every right one, then Check.", "Match each sefer to what it is.": "What Is It?\nLike matching a tool to its job: a hammer hits nails.\nYour turn: match each sefer to what it does.\nTap a word, then its match.", "Who wrote the Shulchan Aruch? Type his first name: Rabbi ___ Karo.": "Fill the Name!\nLike filling in: the first name of your rebbe.\nYour turn: type the missing first name.\nType your answer, then Check.", "Tap every true fact about Rashi.": "Fact Finder!\nLike checking every true sentence about the sun.\nYour turn: find every true fact about Rashi.\nTap every right one, then Check.", "Sort: written before the Rambam, or after?": "Before or After?\nLike breakfast is before lunch, supper is after.\nYour turn: sort each sefer.\nTap a card, then its box.", "Match each author to what else he is known for.": "Famous For!\nLike matching a builder to the house he built.\nYour turn: match each author to his fame.\nTap a word, then its match.", "Tap every sefer of halachah.": "Halachah Hunt!\nLike finding every cookbook on a shelf.\nYour turn: find every sefer of halachah.\nTap every right one, then Check.", "Put the sefarim in order.": "Quick Shelf!\nLike stacking books by age, oldest first.\nYour turn: put these four in order.\nTap the tiles in order.", "Who wrote the Mishneh Torah?": "Think It Through!\nLike remembering who painted a picture.\nYour turn: pick the author.\nTap your answer.", "Who wrote the Shulchan Aruch?": "Choose Smart!\nLike remembering who built your shul.\nYour turn: pick the author.\nTap your answer."}}, "LK.CHEM.L03.04": {"s": "Two Houses!\nLike the story of a house built, lost, and built again.\nYour turn: who built each one, who destroyed it, and when.\nTap, sort and match as you go.", "q": {"Together: who destroyed the first Beis Hamikdash?": "Clue Hunt!\nLike asking which team won the first game, not the second.\nYour turn: find who destroyed the first.\nTap your answer.", "Together: why was the second Beis Hamikdash destroyed?": "Think It Through!\nLike a team that loses because the players fight.\nYour turn: find the reason the Gemara gives.\nTap your answer.", "Sort: first Beis Hamikdash or second?": "Two Houses!\nLike sorting facts about your first school and your second school.\nYour turn: sort each fact.\nTap a card, then its box.", "Put the history in order.": "History Line!\nLike a story: build a sand castle, a wave comes, build again.\nYour turn: put the history in order.\nTap the tiles in order.", "Match each part of the story to the king or army.": "Who Did It?\nLike matching a player to the goal he scored.\nYour turn: match each part to its king or army.\nTap a word, then its match.", "Tap every true fact about Tisha B'Av.": "Sad Day Facts!\nLike finding every true fact about winter.\nYour turn: find every true fact.\nTap every right one, then Check.", "How many years did the first Beis Hamikdash stand? Type the number.": "Number Type!\nLike typing how many days are in a year.\nYour turn: type the number of years.\nType your answer, then Check.", "Match each number to its fact.": "Number Match!\nLike matching 7 to the days of the week.\nYour turn: match each number to its fact.\nTap a word, then its match.", "Sort: did they build it, or destroy it?": "Builders and Breakers!\nLike sorting a hammer from a wrecking ball.\nYour turn: sort each name.\nTap a card, then its box.", "Put the four kingdoms that ruled over the Jews in order.": "Kingdom Line!\nLike a relay: each runner takes over from the last.\nYour turn: put the kingdoms in order.\nTap the tiles in order.", "Tap every true fact about the second Beis Hamikdash.": "Second House Spotter!\nLike finding every true fact about a new bike.\nYour turn: find every true fact.\nTap every right one, then Check.", "Match the person to his part in the story.": "People Match!\nLike matching a coach and a player to their jobs.\nYour turn: match each person to his part.\nTap a word, then its match.", "Tap every way we remember the Beis Hamikdash.": "Remember Spotter!\nLike finding every way to remember a friend far away.\nYour turn: find every way we remember.\nTap every right one, then Check.", "Put it in order.": "Quick Story!\nLike: wake up, eat, go to school, come home.\nYour turn: put the four steps in order.\nTap the tiles in order.", "Who built the first Beis Hamikdash?": "Choose Smart!\nLike remembering who built the first house on your street.\nYour turn: pick the builder.\nTap your answer.", "Both Batei Mikdash were destroyed on...": "Think It Through!\nLike remembering the date of your birthday.\nYour turn: pick the day.\nTap your answer."}}, "LK.CHEM.L03.05": {"s": "Four Steps of Sadness!\nLike four chapters of one story.\nYour turn: match each fast to its date and its event.\nTap, sort and match as you go.", "q": {"Together: what happened on the Seventeenth of Tammuz?": "Story Step!\nLike a game of chess: first surround, then break through.\nYour turn: find what happened that day.\nTap your answer.", "Together: about how long is it from the Seventeenth of Tammuz to Tisha B'Av?": "Count the Days!\nLike counting from one Sunday to the third Sunday after.\nYour turn: find about how long it is.\nTap your answer.", "Put the four fasts in calendar order, starting from Tishrei.": "Calendar Line!\nLike the seasons: fall, winter, spring, summer.\nYour turn: put the fasts in calendar order.\nTap the tiles in order.", "Put the story of the destruction in order.": "Story Line!\nLike a snowman melting: drip, slump, puddle, gone.\nYour turn: put the story in order.\nTap the tiles in order.", "Match each fast to what it remembers.": "Fast Match!\nLike matching a holiday picture to its day.\nYour turn: match each fast to what it remembers.\nTap a word, then its match.", "Match each date to what happened.": "Date Match!\nLike matching a date on a calendar to a trip.\nYour turn: match each date to its event.\nTap a word, then its match.", "Sort: when does the fast begin?": "Long or Short?\nLike a sleepover that starts at night, or a trip that starts in the morning.\nYour turn: sort each fast.\nTap a card, then its box.", "Tap every thing that happened on the Seventeenth of Tammuz.": "Day Detective!\nLike finding everything that happened on one school trip.\nYour turn: find every event of that day.\nTap every right one, then Check.", "Tap every thing that happened on Tisha B'Av.": "Sad Day Spotter!\nLike finding every rainy day on a calendar.\nYour turn: find every event of that day.\nTap every right one, then Check.", "Sort: one of the four fasts of the destruction, or not?": "In or Out?\nLike sorting which games belong to one set.\nYour turn: sort each fast.\nTap a card, then its box.", "On which day of Teves do we fast? Type the number.": "Date Type!\nLike typing the day of your birthday.\nYour turn: type the day of the month.\nType your answer, then Check.", "Put the sad weeks of summer in order.": "Countdown Line!\nLike a countdown: three weeks, then nine days, then the day.\nYour turn: put the summer days in order.\nTap the tiles in order.", "Tap every fast that comes in the summer.": "Season Spotter!\nLike finding every month with a long, hot day.\nYour turn: find every summer fast.\nTap every right one, then Check.", "Put the four fasts in the order of the story.": "Quick Story!\nLike: knock, open the door, walk in, sit down.\nYour turn: put the story in order.\nTap the tiles in order.", "What does the Tenth of Teves remember?": "Think It Through!\nLike remembering what happened on the first day of camp.\nYour turn: pick the right event.\nTap your answer.", "When is the Fast of Gedaliah?": "Choose Smart!\nLike remembering the day after your birthday.\nYour turn: pick the right day.\nTap your answer."}}, "LK.CHEM.L03.06": {"s": "Count the Mitzvos!\nLike a calendar and a body: 365 days, 248 limbs.\nYour turn: count, sort and match the mitzvos.\nTap, sort and match as you go.", "q": {"Together: 248 plus 365 is...": "Add It Up!\nLike adding 25 plus 75 to make 100.\nYour turn: add the two numbers.\nTap your answer.", "Together: which is one of the seven mitzvos of Bnei Noach?": "Choose Smart!\nLike asking which rule is for everyone, not only for one class.\nYour turn: pick the mitzvah for all people.\nTap your answer.", "Sort: a mitzvah to do, or not to do?": "Do or Do Not?\nLike a sign that says Walk, and a sign that says Stop.\nYour turn: sort each mitzvah.\nTap a card, then its box.", "Match each number to its meaning.": "Number Match!\nLike matching 12 to the months of the year.\nYour turn: match each number to its meaning.\nTap a word, then its match.", "Match each number to what it is like.": "Memory Hook!\nLike 7 is like the days of the week.\nYour turn: match each number to its sign.\nTap a word, then its match.", "Tap every one of the seven mitzvos of Bnei Noach.": "For Everyone!\nLike the rules every driver keeps, in every country.\nYour turn: find every mitzvah of Bnei Noach.\nTap every right one, then Check.", "248 to do plus 365 not to do: how many mitzvos in all? Type the number.": "Add and Type!\nLike 100 plus 50 is 150.\nYour turn: type the total.\nType your answer, then Check.", "Sort: for all people, or only for Jews?": "Who Keeps It?\nLike a rule for the whole school, or only for one grade.\nYour turn: sort each mitzvah.\nTap a card, then its box.", "Build the teaching of the Gemara in Makkos in order.": "Teaching Builder!\nLike: first the total, then the parts.\nYour turn: build the Gemara's teaching.\nTap the tiles in order.", "Tap every mitzvah to do.": "Action Spotter!\nLike finding every verb in a sentence.\nYour turn: find every mitzvah to do.\nTap every right one, then Check.", "Put the numbers in order, smallest to biggest.": "Small to Big!\nLike lining up a mouse, a dog, a horse, an elephant.\nYour turn: put the numbers in order.\nTap the tiles in order.", "Match the teacher to what he did.": "Teacher Match!\nLike matching an inventor to his invention.\nYour turn: match each teacher to his work.\nTap a word, then its match.", "Sort these mitzvos of the year: to do, or not to do?": "Yom Tov Sort!\nLike sorting a Go sign and a Stop sign.\nYour turn: sort each mitzvah of the year.\nTap a card, then its box.", "Build the count.": "Quick Count!\nLike: 2 plus 3 is 5.\nYour turn: build the number sentence.\nTap the tiles in order.", "The 365 mitzvos not to do are like...": "Think It Through!\nLike 12 is like the months of the year.\nYour turn: pick what 365 is like.\nTap your answer.", "Which is one of the seven mitzvos of Bnei Noach?": "Choose Smart!\nLike picking the rule that is for everyone.\nYour turn: pick the mitzvah for all people.\nTap your answer."}}}; if(typeof TL_DO!=='undefined'&&TL_DO) Object.keys(CD).forEach(k=>{ const e=TL_DO[k]=TL_DO[k]||{}; if(CD[k].s) e.s=CD[k].s; e.q=Object.assign(e.q||{},CD[k].q||{}); }); }catch(e){ console.error('CHEM TL_DO',e); }

   Hebrew is copied from the booklet sheets; the Name is always written ה׳. REBBE review after live. Same lesson shape as CHEM L01-L03. ===== */
const CHEM4={"LK.CHEM.L04.01": {"name": "Chemdas 19: Al Hamichya: Bracha Me'ein Shalosh", "peg": {"kind": "song", "show": "עַל הַמִּחְיָה · עַל הַגֶּפֶן · עַל הָעֵץ", "say": "One bracha, three kinds: cake, wine, and the special fruits."}, "op": "You ate a cookie, a grape juice or some dates. What bracha do you say after? Let us sing it!", "teach": [{"how": "After cake or cookies from the five grains, after wine or grape juice, and after the special fruits of Eretz Yisrael, we say one short bracha. It is called מֵעֵין שָׁלֹשׁ.", "q": "After which foods do we say Al Hamichya?", "o": ["cake, wine and the special fruits", "only bread", "only water"], "h": "Cake, wine, special fruits."}, {"how": "The start changes with the food. After cake: עַל הַמִּחְיָה וְעַל הַכַּלְכָּלָה. After wine: עַל הַגֶּפֶן וְעַל פְּרִי הַגֶּפֶן. After the special fruits: עַל הָעֵץ וְעַל פְּרִי הָעֵץ.", "q": "After grape juice, which words do we say?", "o": ["עַל הַגֶּפֶן וְעַל פְּרִי הַגֶּפֶן", "עַל הַמִּחְיָה וְעַל הַכַּלְכָּלָה", "עַל הָעֵץ וְעַל פְּרִי הָעֵץ"], "h": "Gefen means the vine."}, {"how": "In the middle we thank Hashem for Eretz Yisrael and ask Him to rebuild Yerushalayim. The end matches the start: עַל הָאָרֶץ וְעַל הַמִּחְיָה for cake.", "q": "What do we ask Hashem in the middle of the bracha?", "o": ["to rebuild Yerushalayim", "for rain", "for a good week"], "h": "וּבְנֵה יְרוּשָׁלַיִם"}], "we": [{"q": "Together: Shmuel ate dates. Which start does he say?", "o": ["עַל הָעֵץ וְעַל פְּרִי הָעֵץ", "עַל הַגֶּפֶן וְעַל פְּרִי הַגֶּפֶן", "עַל הַמִּחְיָה וְעַל הַכַּלְכָּלָה"], "steps": ["Dates are one of the seven special kinds.", "They grow on a tree.", "So he says עַל הָעֵץ."]}, {"q": "Together: How does the bracha end after cake?", "o": ["עַל הָאָרֶץ וְעַל הַמִּחְיָה", "עַל הָאָרֶץ וְעַל הַפֵּרוֹת", "עַל הָאָרֶץ וְעַל פְּרִי הַגָּפֶן"], "steps": ["The end matches the start.", "Cake starts with עַל הַמִּחְיָה.", "So it ends עַל הַמִּחְיָה."]}], "practice": [{"t": "order", "q": "Put the first lines of the bracha in order.", "tiles": ["וְעַל תְּנוּבַת הַשָּׂדֶה, וְעַל אֶרֶץ חֶמְדָּה טוֹבָה וּרְחָבָה", "שֶׁרָצִיתָ וְהִנְחַלְתָּ לַאֲבוֹתֵינוּ, לֶאֱכֹל מִפִּרְיָהּ וְלִשְׂבֹּעַ מִטּוּבָהּ.", "רַחֵם נָא ה׳ אֱלֹקֵינוּ עַל יִשְׂרָאֵל עַמֶּךָ, וְעַל יְרוּשָׁלַיִם עִירֶךָ,", "וְעַל צִיּוֹן מִשְׁכַּן כְּבוֹדֶךָ, וְעַל מִזְבְּחֶךָ, וְעַל הֵיכָלֶךָ."], "h": "It starts with the field and the land.", "why": "First the land, then we ask for mercy on Yisrael, Yerushalayim and Tziyon."}, {"t": "order", "q": "Put the next lines of the bracha in order.", "tiles": ["וּבְנֵה יְרוּשָׁלַיִם עִיר הַקֹּדֶשׁ בִּמְהֵרָה בְיָמֵינוּ,", "וְהַעֲלֵנוּ לְתוֹכָהּ, וְשַׂמְּחֵנוּ בְּבִנְיָנָהּ,", "וְנֹאכַל מִפִּרְיָהּ, וְנִשְׂבַּע מִטּוּבָהּ, וּנְבָרֶכְךָ עָלֶיהָ בִּקְדֻשָּׁה וּבְטָהֳרָה.", "כִּי אַתָּה ה׳ טוֹב וּמֵטִיב לַכֹּל, וְנוֹדֶה לְּךָ עַל הָאָרֶץ"], "h": "First we ask Hashem to build.", "why": "Build Yerushalayim, bring us up, we eat and bless, for Hashem is good."}, {"t": "pairs", "q": "Match each food to how the bracha starts.", "pairs": [["cake or cookies", "עַל הַמִּחְיָה"], ["grape juice", "עַל הַגֶּפֶן"], ["dates or figs", "עַל הָעֵץ"]], "h": "Gefen is the vine.", "why": "The start names what you ate."}, {"t": "pairs", "q": "Match each start to its ending.", "pairs": [["עַל הַמִּחְיָה", "וְעַל הַמִּחְיָה"], ["עַל הַגֶּפֶן", "וְעַל פְּרִי הַגָּפֶן"], ["עַל הָעֵץ", "וְעַל הַפֵּרוֹת"]], "h": "The end matches the start.", "why": "Whatever you named at the start, you name again at the end."}, {"t": "sort", "q": "Sort: which start do you say after this food?", "bins": [{"id": "M", "label": "עַל הַמִּחְיָה"}, {"id": "G", "label": "עַל הַגֶּפֶן"}, {"id": "E", "label": "עַל הָעֵץ"}], "items": [{"label": "a cookie", "bin": "M"}, {"label": "a piece of cake", "bin": "M"}, {"label": "grape juice", "bin": "G"}, {"label": "wine for Kiddush", "bin": "G"}, {"label": "figs", "bin": "E"}, {"label": "pomegranate", "bin": "E"}], "h": "Grain, vine or tree?", "why": "Grain foods: hamichya. Wine: hagefen. Special fruits: ha'etz."}, {"t": "spotall", "q": "Tap every food you say Al Hamichya after.", "cells": [{"label": "a cookie", "ok": true}, {"label": "grape juice", "ok": true}, {"label": "dates", "ok": true}, {"label": "olives", "ok": true}, {"label": "a banana", "ok": false}, {"label": "water", "ok": false}, {"label": "a candy", "ok": false}], "h": "Cake, wine and the seven special kinds.", "why": "A banana, water and candy get בּוֹרֵא נְפָשׁוֹת."}, {"q": "Which words come right after וְעַל תְּנוּבַת הַשָּׂדֶה?", "o": ["וְעַל אֶרֶץ חֶמְדָּה טוֹבָה וּרְחָבָה", "וּבְנֵה יְרוּשָׁלַיִם", "בָּרוּךְ חֵי הָעוֹלָמִים"], "h": "A lovely, good, wide land."}, {"q": "Which line asks Hashem to bring us up to Yerushalayim?", "o": ["וְהַעֲלֵנוּ לְתוֹכָהּ", "וְנוֹדֶה לְּךָ עַל הָאָרֶץ", "לֶאֱכֹל מִפִּרְיָהּ"], "h": "Ha'alenu: bring us up."}, {"t": "type", "q": "How many kinds of food does this one bracha cover? Type the number.", "a": "3", "alt": ["three"], "h": "Cake, wine, fruit.", "why": "That is why it is called מֵעֵין שָׁלֹשׁ: a short form of three brachos."}, {"t": "order", "q": "Put the ending after cake in order.", "tiles": ["וְעַל הַמִּחְיָה.", "בָּרוּךְ אַתָּה ה׳,", "עַל הָאָרֶץ", "וְעַל הַמִּחְיָה."], "h": "Name it, then the closing bracha.", "why": "וְעַל הַמִּחְיָה. בָּרוּךְ אַתָּה ה׳, עַל הָאָרֶץ וְעַל הַמִּחְיָה."}, {"q": "Eli drank grape juice and ate cookies. What does he say?", "o": ["both: עַל הַמִּחְיָה וְעַל הַכַּלְכָּלָה and עַל הַגֶּפֶן", "only עַל הַגֶּפֶן", "only בּוֹרֵא נְפָשׁוֹת"], "h": "One bracha can name both.", "why": "We name each kind in the one bracha."}], "check": [{"q": "You ate figs. How does the bracha after start?", "o": ["עַל הָעֵץ", "עַל הַמִּחְיָה", "עַל הַגֶּפֶן"]}, {"q": "After a piece of cake, how does the bracha end?", "o": ["עַל הָאָרֶץ וְעַל הַמִּחְיָה", "עַל הָאָרֶץ וְעַל הַפֵּרוֹת", "בָּרוּךְ חֵי הָעוֹלָמִים"]}, {"q": "What do we ask Hashem in this bracha?", "o": ["to rebuild Yerushalayim", "to give us a new toy", "for snow"]}], "re": [{"how": "Think of the food. Grain? Say עַל הַמִּחְיָה. Wine? Say עַל הַגֶּפֶן. Special fruit? Say עַל הָעֵץ.", "q": "Dates come from a tree. Which start?", "o": ["עַל הָעֵץ", "עַל הַמִּחְיָה", "עַל הַגֶּפֶן"], "h": "Tree means etz."}, {"how": "The end always repeats the start.", "q": "You started עַל הַגֶּפֶן. How do you end?", "o": ["וְעַל פְּרִי הַגָּפֶן", "וְעַל הַפֵּרוֹת", "וְעַל הַמִּחְיָה"], "h": "Same as the start."}, {"how": "The middle is the same for every food: the land, Yerushalayim, and Hashem is good.", "q": "Which words are in the middle for every food?", "o": ["רַחֵם נָא ה׳ אֱלֹקֵינוּ", "בּוֹרֵא נְפָשׁוֹת רַבּוֹת", "שֶׁהַכֹּל נִהְיָה"], "h": "Have mercy, Hashem."}], "band": "3-5"}, "LK.CHEM.L04.02": {"name": "Chemdas 20: Borei Nefashos", "peg": {"kind": "song", "show": "בּוֹרֵא נְפָשׁוֹת רַבּוֹת", "say": "Many creations, and all they need: Hashem gives life to all."}, "op": "An apple, a glass of water, a piece of chicken. One short bracha after all of them!", "teach": [{"how": "After most foods that are not bread, not cake, not wine and not the special fruits, we say בּוֹרֵא נְפָשׁוֹת. Water, apples, chicken and candy all get Borei Nefashos.", "q": "After a cup of water, which bracha?", "o": ["בּוֹרֵא נְפָשׁוֹת", "עַל הַמִּחְיָה", "bentching"], "h": "Most foods."}, {"how": "The words mean: Hashem creates many living things and what they need. We thank Him for everything He made to keep us alive.", "q": "What does נְפָשׁוֹת רַבּוֹת mean?", "o": ["many living things", "many fruits", "many days"], "h": "Nefesh is a living soul."}, {"how": "It ends בָּרוּךְ חֵי הָעוֹלָמִים: blessed is the One who gives life to the worlds.", "q": "How does Borei Nefashos end?", "o": ["בָּרוּךְ חֵי הָעוֹלָמִים", "עַל הָאָרֶץ וְעַל הַמִּחְיָה", "הַמּוֹצִיא לֶחֶם"], "h": "Chei ha'olamim."}], "we": [{"q": "Together: Yosef ate an apple. Which bracha after?", "o": ["בּוֹרֵא נְפָשׁוֹת", "עַל הָעֵץ", "bentching"], "steps": ["An apple is a fruit.", "But it is not one of the seven special kinds.", "So he says בּוֹרֵא נְפָשׁוֹת."]}, {"q": "Together: Which word comes right after בּוֹרֵא?", "o": ["נְפָשׁוֹת", "פְּרִי", "הַמּוֹצִיא"], "steps": ["Say it slowly.", "בּוֹרֵא נְפָשׁוֹת רַבּוֹת."]}], "practice": [{"t": "order", "q": "Put Borei Nefashos in order.", "tiles": ["בּוֹרֵא נְפָשׁוֹת רַבּוֹת, וְחֶסְרוֹנָן,", "עַל כָּל מַה שֶּׁבָּרָא(תָ),", "לְהַחֲיוֹת בָּהֶם נֶפֶשׁ כָּל חָי.", "בָּרוּךְ חֵי הָעוֹלָמִים:"], "h": "It ends with chei ha'olamim.", "why": "בּוֹרֵא נְפָשׁוֹת רַבּוֹת, וְחֶסְרוֹנָן, עַל כָּל מַה שֶּׁבָּרָא(תָ), לְהַחֲיוֹת בָּהֶם נֶפֶשׁ כָּל חָי. בָּרוּךְ חֵי הָעוֹלָמִים."}, {"t": "sort", "q": "Sort: Borei Nefashos or Al Hamichya after this food?", "bins": [{"id": "B", "label": "בּוֹרֵא נְפָשׁוֹת"}, {"id": "A", "label": "עַל הַמִּחְיָה / הַגֶּפֶן / הָעֵץ"}], "items": [{"label": "an apple", "bin": "B"}, {"label": "water", "bin": "B"}, {"label": "chicken", "bin": "B"}, {"label": "a cookie", "bin": "A"}, {"label": "grape juice", "bin": "A"}, {"label": "dates", "bin": "A"}], "h": "Grain, wine, special fruits go to Al Hamichya.", "why": "Most other foods get Borei Nefashos."}, {"t": "spotall", "q": "Tap every food you say Borei Nefashos after.", "cells": [{"label": "an apple", "ok": true}, {"label": "a banana", "ok": true}, {"label": "water", "ok": true}, {"label": "an egg", "ok": true}, {"label": "a cookie", "ok": false}, {"label": "grape juice", "ok": false}, {"label": "figs", "ok": false}], "h": "Not grain, wine or the special fruits.", "why": "Cookies, grape juice and figs get Al Hamichya."}, {"t": "pairs", "q": "Match the words to what they mean.", "pairs": [["בּוֹרֵא", "who creates"], ["נְפָשׁוֹת רַבּוֹת", "many living things"], ["וְחֶסְרוֹנָן", "and what they need"], ["חֵי הָעוֹלָמִים", "life of the worlds"]], "h": "Borei means creates.", "why": "Hashem creates many living things and everything they need."}, {"q": "Which words come right after בּוֹרֵא נְפָשׁוֹת רַבּוֹת?", "o": ["וְחֶסְרוֹנָן", "בָּרוּךְ חֵי הָעוֹלָמִים", "וְעַל הַכַּלְכָּלָה"], "h": "And what they lack."}, {"q": "Which line comes last?", "o": ["בָּרוּךְ חֵי הָעוֹלָמִים", "לְהַחֲיוֹת בָּהֶם נֶפֶשׁ כָּל חָי", "וְחֶסְרוֹנָן"], "h": "It ends with chei."}, {"t": "order", "q": "Put these foods' brachos from first to last: before, then after an apple.", "tiles": ["בּוֹרֵא פְּרִי הָעֵץ", "eat the apple", "בּוֹרֵא נְפָשׁוֹת"], "h": "Bracha first, then eat.", "why": "Before: borei pri ha'etz. After: borei nefashos."}, {"t": "type", "q": "What does בּוֹרֵא mean? Type one English word.", "a": "creates", "alt": ["create", "creator", "makes", "maker", "creating"], "h": "Hashem is the Borei of the world.", "why": "בּוֹרֵא means who creates."}, {"t": "pairs", "q": "Match each food to its bracha after.", "pairs": [["a carrot", "בּוֹרֵא נְפָשׁוֹת"], ["a cookie", "עַל הַמִּחְיָה"], ["grape juice", "עַל הַגֶּפֶן"], ["chicken", "בּוֹרֵא נְפָשׁוֹת"]], "h": "Only grain, wine and special fruits are Al Hamichya.", "why": "A carrot and chicken get Borei Nefashos."}, {"q": "Moshe ate a pear. Which bracha after?", "o": ["בּוֹרֵא נְפָשׁוֹת", "עַל הָעֵץ", "bentching"], "h": "A pear is not a special fruit.", "why": "Only the seven special kinds get עַל הָעֵץ."}, {"q": "What does לְהַחֲיוֹת בָּהֶם נֶפֶשׁ כָּל חָי thank Hashem for?", "o": ["keeping every living thing alive", "the rain", "Shabbos"], "h": "Lehachayos: to give life."}], "check": [{"t": "order", "q": "Put Borei Nefashos in order.", "tiles": ["בּוֹרֵא נְפָשׁוֹת רַבּוֹת, וְחֶסְרוֹנָן,", "עַל כָּל מַה שֶּׁבָּרָא(תָ),", "לְהַחֲיוֹת בָּהֶם נֶפֶשׁ כָּל חָי.", "בָּרוּךְ חֵי הָעוֹלָמִים:"]}, {"q": "After a glass of water, which bracha?", "o": ["בּוֹרֵא נְפָשׁוֹת", "עַל הַגֶּפֶן", "עַל הַמִּחְיָה"]}, {"q": "How does Borei Nefashos end?", "o": ["בָּרוּךְ חֵי הָעוֹלָמִים", "עַל הָאָרֶץ וְעַל הַפֵּרוֹת", "הַמּוֹצִיא לֶחֶם מִן הָאָרֶץ"]}], "re": [{"how": "Ask: is it grain, wine, or one of the special fruits? If not, it is Borei Nefashos.", "q": "A banana. Which bracha after?", "o": ["בּוֹרֵא נְפָשׁוֹת", "עַל הָעֵץ", "עַל הַמִּחְיָה"], "h": "Not a special fruit."}, {"how": "Borei means creates. Nefashos are living things.", "q": "Who creates many living things?", "o": ["Hashem", "the farmer", "the store"], "h": "Borei."}, {"how": "The last words: בָּרוּךְ חֵי הָעוֹלָמִים.", "q": "Which words end the bracha?", "o": ["בָּרוּךְ חֵי הָעוֹלָמִים", "וְעַל הַמִּחְיָה", "שֶׁהַכֹּל"], "h": "Chei ha'olamim."}], "band": "3-5"}, "LK.CHEM.L04.03": {"name": "Chemdas 21: The Parshiyos of Bereishis and Shemos", "peg": {"kind": "song", "show": "בְּרֵאשִׁית · שְׁמוֹת", "say": "Sing the parshiyos like a train: one car after the other."}, "op": "Every Shabbos we read one parsha. Can you sing them all in order?", "teach": [{"how": "The Torah has five sefarim, and each sefer is split into parshiyos. In all there are 54 parshiyos. Here: 12 in Bereishis + 11 in Shemos.", "q": "How many parshiyos are in the whole Torah?", "o": ["54", "24", "63"], "h": "Fifty-four."}, {"how": "Each sefer starts with a parsha that has the same name as the sefer. Bereishis starts with Parshas Bereishis.", "q": "Which parsha starts Sefer Bereishis?", "o": ["Bereishis", "Mishpatim", "Pekudei"], "h": "Same name as the sefer."}, {"how": "The last parsha of Shemos is Pekudei.", "q": "Which parsha ends Sefer Shemos?", "o": ["Pekudei", "Beshalach", "Lech Lecha"], "h": "The end of the sefer."}], "we": [{"q": "Together: what comes after נֹחַ · Noach?", "o": ["לֶךְ לְךָ · Lech Lecha", "בְּשַׁלַּח · Beshalach", "וַיֵּרָא · Vayeira"], "steps": ["Sing from the start.", "בְּרֵאשִׁית · Bereishis, נֹחַ · Noach...", "Next is לֶךְ לְךָ · Lech Lecha."]}, {"q": "Together: which is last in the song?", "o": ["פְּקוּדֵי · Pekudei", "וַיְחִי · Vayechi", "בְּרֵאשִׁית · Bereishis"], "steps": ["Sing to the end.", "The last one is פְּקוּדֵי · Pekudei."]}], "practice": [{"t": "order", "q": "Put these in the order of the song.", "tiles": ["בְּרֵאשִׁית · Bereishis", "נֹחַ · Noach", "לֶךְ לְךָ · Lech Lecha", "וַיֵּרָא · Vayeira m", "יָדַיִם · Yadayim", "עוּקְצִין · Uktzin"], "h": "Sing the end of the song.", "why": "In order: מַכְשִׁירִין · Machshirin, זָבִים · Zavim, טְבוּל יוֹם · Tevul Yom, יָדַיִם · Yadayim, עוּקְצִין · Uktzin."}, {"t": "order", "q": "Put these from the middle of the song in order.", "tiles": ["מִדּוֹת · Middos", "קִנִּים · Kinnim", "כֵּלִים · Keilim", "אָהֳלוֹת · Ohalos", "נְגָעִים · Nega'im"], "h": "Sing it from Middos.", "why": "In order: מִדּוֹת · Middos, קִנִּים · Kinnim, כֵּלִים · Keilim, אָהֳלוֹת · Ohalos, נְגָעִים · Nega'im."}, {"t": "pairs", "q": "Match the Hebrew to the English.", "pairs": [["מְנָחוֹת", "Menachos"], ["מַכְשִׁירִין", "Machshirin"], ["נְגָעִים", "Nega'im"], ["נִדָּה", "Niddah"]], "h": "Read the Hebrew slowly.", "why": "מְנָחוֹת is Menachos; מַכְשִׁירִין is Machshirin; נְגָעִים is Nega'im; נִדָּה is Niddah."}, {"t": "pairs", "q": "Match each one to its number in the song.", "pairs": [["תָּמִיד · Tamid", "9"], ["מַכְשִׁירִין · Machshirin", "19"], ["זָבִים · Zavim", "20"], ["יָדַיִם · Yadayim", "22"]], "h": "Count from the start of the song.", "why": "תָּמִיד · Tamid is number 9; מַכְשִׁירִין · Machshirin is number 19; זָבִים · Zavim is number 20; יָדַיִם · Yadayim is number 22."}, {"t": "sort", "q": "Sort each one into its seder.", "bins": [{"id": "g0", "label": "קָדָשִׁים · Kodashim"}, {"id": "g1", "label": "טָהֳרוֹת · Taharos"}], "items": [{"label": "מִדּוֹת · Middos", "bin": "g0"}, {"label": "מְנָחוֹת · Menachos", "bin": "g0"}, {"label": "טָהֳרוֹת · Taharos", "bin": "g1"}, {"label": "נִדָּה · Niddah", "bin": "g1"}], "h": "Which part of the song is it in?", "why": "Each one is in its own seder."}, {"t": "spotall", "q": "Tap every one in קָדָשִׁים · Kodashim.", "cells": [{"label": "כֵּלִים · Keilim", "ok": false}, {"label": "תָּמִיד · Tamid", "ok": true}, {"label": "זְבָחִים · Zevachim", "ok": true}, {"label": "חוּלִּין · Chullin", "ok": true}, {"label": "אָהֳלוֹת · Ohalos", "ok": false}, {"label": "טָהֳרוֹת · Taharos", "ok": false}, {"label": "עֲרָכִין · Arachin", "ok": true}], "h": "Sing the Kodashim part of the song.", "why": "Only these are in Kodashim."}, {"t": "type", "q": "How many are in טָהֳרוֹת · Taharos? Type the number.", "a": "12", "alt": [], "h": "Count them in the song.", "why": "Taharos has 12."}, {"q": "What comes right after מַכְשִׁירִין · Machshirin?", "o": ["זָבִים · Zavim", "נִדָּה · Niddah", "עוּקְצִין · Uktzin"], "h": "Sing it from Machshirin."}, {"q": "What comes right before כְּרִיתוֹת · Kerisos?", "o": ["תְּמוּרָה · Temurah", "עֲרָכִין · Arachin", "נִדָּה · Niddah"], "h": "Sing the line just before."}, {"q": "נִדָּה · Niddah is in which seder?", "o": ["טָהֳרוֹת · Taharos", "קָדָשִׁים · Kodashim"], "h": "Where is it in the song?"}], "check": [{"t": "order", "q": "Put these in the order of the song.", "tiles": ["מִדּוֹת · Middos", "קִנִּים · Kinnim", "כֵּלִים · Keilim", "אָהֳלוֹת · Ohalos"]}, {"q": "What comes right after פָּרָה · Parah?", "o": ["טָהֳרוֹת · Taharos", "זָבִים · Zavim", "מְנָחוֹת · Menachos"]}, {"q": "Which one is first in the song?", "o": ["זְבָחִים · Zevachim", "נִדָּה · Niddah", "נְגָעִים · Nega'im"]}], "re": [{"how": "Sing the song slowly from the start. Each name has its place.", "q": "Which is first?", "o": ["זְבָחִים · Zevachim", "מִקְוָאוֹת · Mikva'os", "עוּקְצִין · Uktzin"], "h": "The very start of the song."}, {"how": "If you forget, sing from the start until you reach it.", "q": "Which is last?", "o": ["עוּקְצִין · Uktzin", "מִדּוֹת · Middos", "מִקְוָאוֹת · Mikva'os"], "h": "The very end of the song."}, {"how": "Two in a row: say them together, like one word.", "q": "What comes after זְבָחִים · Zevachim?", "o": ["מְנָחוֹת · Menachos", "פָּרָה · Parah", "זָבִים · Zavim"], "h": "The second name."}], "band": "3-5"}};

try{ const CT4={"LK.CHEM.L04.01": {"big": "After cake, wine or the special fruits we say one bracha: מֵעֵין שָׁלֹשׁ, Al Hamichya.", "hook": "A cookie and a cup of grape juice: one bracha thanks Hashem for both!", "nojoke": true, "remember": "This is the bracha on Rabbi Brody's Chemdas booklet page 1. Sing it until you know it by heart.", "intro": ["Cake from the five grains: עַל הַמִּחְיָה.", "Wine or grape juice: עַל הַגֶּפֶן.", "The special fruits: עַל הָעֵץ.", "In the middle: the land and Yerushalayim.", "The end matches the start."], "ex": [{"q": "Avi ate an oatmeal cookie. Which start?", "steps": ["Oats are one of the five grains.", "So it is עַל הַמִּחְיָה."], "a": "עַל הַמִּחְיָה", "pic": "עַל הַמִּחְיָה וְעַל הַכַּלְכָּלָה"}, {"q": "How does it end after grape juice?", "steps": ["It started עַל הַגֶּפֶן.", "So it ends עַל פְּרִי הַגָּפֶן."], "a": "עַל הָאָרֶץ וְעַל פְּרִי הַגָּפֶן"}], "oops": {"q": "After a banana, do we say Al Hamichya?", "wrong": "yes", "right": "no, בּוֹרֵא נְפָשׁוֹת", "why": "Al Hamichya is only for grain foods, wine and the seven special fruits."}, "idea": ["One short bracha instead of three long ones.", "We thank Hashem for Eretz Yisrael, a good and wide land."], "try": {"q": "After figs, which start?", "o": ["עַל הָעֵץ", "עַל הַמִּחְיָה", "עַל הַגֶּפֶן"], "a": "עַל הָעֵץ", "steps": ["Figs are one of the seven special kinds.", "They grow on a tree."]}}, "LK.CHEM.L04.02": {"big": "After most foods we say בּוֹרֵא נְפָשׁוֹת: Hashem creates many living things and all they need.", "hook": "Water, apples, chicken, candy: one bracha after all of them!", "nojoke": true, "remember": "Booklet page 1. Sing it after every snack this week.", "intro": ["Not grain, not wine, not a special fruit?", "Then it is בּוֹרֵא נְפָשׁוֹת.", "Nefashos are living things.", "Hashem gives them all they need.", "It ends בָּרוּךְ חֵי הָעוֹלָמִים."], "ex": [{"q": "Dovid drank water. Which bracha after?", "steps": ["Water is not grain, wine or a special fruit.", "So it is Borei Nefashos."], "a": "בּוֹרֵא נְפָשׁוֹת"}, {"q": "Which words come after בּוֹרֵא נְפָשׁוֹת רַבּוֹת?", "steps": ["Many living things...", "...and what they need."], "a": "וְחֶסְרוֹנָן", "pic": "בּוֹרֵא נְפָשׁוֹת רַבּוֹת, וְחֶסְרוֹנָן"}], "oops": {"q": "After a cookie, Borei Nefashos?", "wrong": "yes", "right": "no, עַל הַמִּחְיָה", "why": "Cookies are from the five grains."}, "idea": ["One short bracha thanks Hashem for so many foods.", "Every sip of water is a gift from Hashem."], "try": {"q": "After chicken, which bracha?", "o": ["בּוֹרֵא נְפָשׁוֹת", "עַל הַמִּחְיָה", "עַל הָעֵץ"], "a": "בּוֹרֵא נְפָשׁוֹת", "steps": ["Chicken is not grain, wine or a special fruit."]}}, "LK.CHEM.L04.03": {"big": "The parshiyos of Bereishis and Shemos, in order, from the Chemdas booklet song.", "hook": "All aboard the parsha train! Every car is one Shabbos.", "remember": "Booklet page 2: חֲמִשָּׁה חוּמְשֵׁי תוֹרָה. Sing it until you know every parsha.", "intro": ["Bereishis: Bereishis, Noach, Lech Lecha, Vayeira, Chayei Sarah, Toldos, Vayeitzei, Vayishlach, Vayeishev, Mikeitz, Vayigash, Vayechi.", "Shemos: Shemos, Va'eira, Bo, Beshalach, Yisro, Mishpatim, Terumah, Tetzaveh, Ki Sisa, Vayakhel, Pekudei."], "ex": [{"q": "What comes after Bereishis?", "steps": ["Sing from the start.", "Bereishis, Noach."], "a": "Noach", "pic": "נֹחַ · Noach"}, {"q": "How many parshiyos in Shemos?", "steps": ["Count them in the song.", "11."], "a": "11"}], "oops": {"q": "Is Noach the first parsha of Bereishis?", "wrong": "yes", "right": "no, Bereishis is first", "why": "Each sefer starts with the parsha of the same name."}, "idea": ["Fifty-four parshiyos, one for each Shabbos, some read together.", "Learning the parsha names helps you follow the Torah all year."], "try": {"q": "What comes after Shemos?", "o": ["Va'eira", "Ki Sisa", "Bo"], "a": "Va'eira", "steps": ["Sing it from the start of Shemos."]}, "joke": "Why did the train love the parsha song? Every stop was a Shabbos!"}, "LK.CHEM.L04.04": {"big": "The parshiyos of Vayikra and Bamidbar and Devarim, in order, from the Chemdas booklet song.", "hook": "All aboard the parsha train! Every car is one Shabbos.", "remember": "Booklet page 2: חֲמִשָּׁה חוּמְשֵׁי תוֹרָה. Sing it until you know every parsha.", "intro": ["Vayikra: Vayikra, Tzav, Shemini, Tazria, Metzora, Acharei Mos, Kedoshim, Emor, Behar, Bechukosai.", "Bamidbar: Bamidbar, Naso, Beha'aloscha, Shelach, Korach, Chukas, Balak, Pinchas, Matos, Masei.", "Devarim: Devarim, Va'eschanan, Eikev, Re'eh, Shoftim, Ki Seitzei, Ki Savo, Nitzavim, Vayeilech, Ha'azinu, V'zos Habracha."], "ex": [{"q": "What comes after Vayikra?", "steps": ["Sing from the start.", "Vayikra, Tzav."], "a": "Tzav", "pic": "צַו · Tzav"}, {"q": "How many parshiyos in Devarim?", "steps": ["Count them in the song.", "11."], "a": "11"}], "oops": {"q": "Is Tzav the first parsha of Vayikra?", "wrong": "yes", "right": "no, Vayikra is first", "why": "Each sefer starts with the parsha of the same name."}, "idea": ["Fifty-four parshiyos, one for each Shabbos, some read together.", "Learning the parsha names helps you follow the Torah all year."], "try": {"q": "What comes after Devarim?", "o": ["Va'eschanan", "Nitzavim", "Shoftim"], "a": "Va'eschanan", "steps": ["Sing it from the start of Devarim."]}, "joke": "Why did the train love the parsha song? Every stop was a Shabbos!"}, "LK.CHEM.L04.05": {"big": "Tanach is 24 sefarim: 5 in Torah, 8 in Nevi'im, 11 in Kesuvim.", "hook": "Twenty-four sefarim, three shelves: can you fill them all?", "remember": "Booklet page 3: כ״ד סִפְרֵי תַּנַ״ךְ. The twelve of Trei Asar are on the sheet too: הוֹשֵׁעַ, יוֹאֵל, עָמוֹס, עוֹבַדְיָה, יוֹנָה, מִיכָה, נַחוּם, חֲבַקּוּק, צְפַנְיָה, חַגַּי, זְכַרְיָה, מַלְאָכִי.", "intro": ["Torah: the five Chumashim.", "Nevi'im: Yehoshua, Shoftim, Shmuel, Melachim.", "Then Yeshayah, Yirmiyah, Yechezkel, Trei Asar.", "Kesuvim: Tehillim, Mishlei, Iyov, five megillos.", "Then Daniel, Ezra and Nechemyah, Divrei Hayamim."], "ex": [{"q": "Which part has Tehillim?", "steps": ["Tehillim is sung and said.", "It is the first of Kesuvim."], "a": "Kesuvim", "pic": "תְּהִלִּים"}, {"q": "How many sefarim in Nevi'im?", "steps": ["4 early, 4 later.", "4 + 4 = 8."], "a": "8"}], "oops": {"q": "Is Ezra a separate sefer from Nechemyah in the count of 24?", "wrong": "yes", "right": "no, Ezra and Nechemyah count as one", "why": "That is how Kesuvim has 11 and Tanach has 24."}, "idea": ["Ta-Na-Ch: Torah, Nevi'im, Kesuvim.", "5 + 8 + 11 = 24."], "try": {"q": "Which sefer is in Nevi'im?", "o": ["Shmuel", "Tehillim", "Esther"], "a": "Shmuel", "steps": ["Shmuel is an early navi sefer."]}, "joke": "Why did the boy bring a ladder to the library? To reach the twenty-fourth sefer!"}, "LK.CHEM.L04.06": {"big": "Twelve months, from Nissan to Adar, each with its own picture.", "hook": "A calendar with twelve windows: what is behind each one?", "remember": "Booklet page 5: חָדְשֵׁי הַשָּׁנָה. Look at each picture while you sing.", "intro": ["Nissan, Iyar, Sivan, Tammuz, Av, Elul.", "Tishrei, Cheshvan, Kislev, Teves, Shevat, Adar.", "Nissan: Pesach. Sivan: Shavuos. Tishrei: Rosh Hashanah.", "Kislev: Chanukah. Adar: Purim."], "ex": [{"q": "Which month has the luchos on Har Sinai?", "steps": ["The Torah was given on Shavuos.", "Shavuos is in Sivan."], "a": "Sivan", "pic": "סִיוָן"}, {"q": "Which month comes after Shevat?", "steps": ["Shevat is the eleventh.", "Then comes Adar."], "a": "Adar"}], "oops": {"q": "Is Chanukah in Teves?", "wrong": "only Teves", "right": "it starts in Kislev", "why": "Chanukah starts on the 25th of Kislev."}, "idea": ["The Torah counts from Nissan.", "Rosh Hashanah, the new year, is in Tishrei."], "try": {"q": "Which month has the Purim seudah?", "o": ["Adar", "Nissan", "Kislev"], "a": "Adar", "steps": ["Purim is in the twelfth month."]}, "nojoke": true}, "LK.CHEM.L04.07": {"big": "The ten makkos in Hebrew and English, in order, the way the booklet shows them.", "hook": "Ten pictures, ten words: say each one in Hebrew!", "remember": "Booklet page 8: עֶשֶׂר מַכּוֹת. Say each one in Hebrew and English.", "intro": ["דָּם blood, צְפַרְדֵּעַ frogs, כִּנִּים lice.", "עָרוֹב wild beasts, דֶּבֶר animal disease, שְׁחִין boils.", "בָּרָד hail, אַרְבֶּה locusts, חֹשֶׁךְ darkness.", "מַכַּת בְּכוֹרוֹת: the death of the firstborn."], "ex": [{"q": "What is כִּנִּים in English?", "steps": ["It is the third makah.", "Tiny bugs: lice."], "a": "Lice", "pic": "כִּנִּים"}, {"q": "Which makah is number 8?", "steps": ["7 is hail.", "8 is אַרְבֶּה, locusts."], "a": "אַרְבֶּה"}], "oops": {"q": "Is דֶּבֶר the same as דָּם?", "wrong": "yes", "right": "no: דָּם is blood, דֶּבֶר is animal disease", "why": "They sound alike, but they are different makkos."}, "idea": ["At the seder we say each makah and spill a drop for each.", "Hashem showed everyone that He runs the world."], "try": {"q": "What is חֹשֶׁךְ?", "o": ["Darkness", "Hail", "Boils"], "a": "Darkness", "steps": ["Number 9: nobody could see."]}, "nojoke": true}, "LK.CHEM.L04.08": {"big": "Seven special kinds praise Eretz Yisrael: wheat, barley, grapes, figs, pomegranates, olives and dates.", "hook": "Seven baskets from Eretz Yisrael: what is in each one?", "remember": "Booklet page 9: שִׁבְעַת הַמִּינִים, from Devarim 8:8.", "intro": ["חִטָּה wheat, שְׂעֹרָה barley.", "גֶפֶן grapes, תְאֵנָה figs.", "רִמּוֹן pomegranate.", "זֵית שֶׁמֶן olives for oil, דְבָשׁ honey from dates."], "ex": [{"q": "Which fruit comes after figs in the pasuk?", "steps": ["...וְגֶפֶן וּתְאֵנָה", "...וְרִמּוֹן."], "a": "pomegranate", "pic": "וְרִמּוֹן"}, {"q": "What is the honey made from?", "steps": ["The pasuk means date honey."], "a": "dates"}], "oops": {"q": "Is the honey in the pasuk from bees?", "wrong": "yes", "right": "no, it is from dates", "why": "Chazal explain דְבָשׁ here as date honey."}, "idea": ["Eretz Yisrael is a blessed land.", "We thank Hashem for it in Al Hamichya."], "try": {"q": "Which is a grain of the seven?", "o": ["barley", "grapes", "olives"], "a": "barley", "steps": ["Two grains: wheat and barley."]}, "joke": "Why was the fig so happy? It made the list of seven!"}, "LK.CHEM.L04.09": {"big": "Twelve sons of Yaakov Avinu: six of Leah, two of Bilhah, two of Zilpah, two of Rochel.", "hook": "Twelve brothers, one family: who sits with whom?", "remember": "Booklet page 9: the sons of Yaakov Avinu, by their mothers.", "intro": ["Leah: Reuven, Shimon, Levi, Yehudah, Yissachar, Zevulun.", "Bilhah: Dan, Naftali.", "Zilpah: Gad, Asher.", "Rochel: Yosef, Binyamin."], "ex": [{"q": "Who was the mother of Yehudah?", "steps": ["Yehudah is in the first group.", "That group is Leah's."], "a": "Leah", "pic": "יְהוּדָה"}, {"q": "Who was Yaakov's youngest son?", "steps": ["Rochel's second son.", "Binyamin."], "a": "Binyamin"}], "oops": {"q": "Was Dan a son of Rochel?", "wrong": "yes", "right": "no, of Bilhah", "why": "Rochel's sons were Yosef and Binyamin."}, "idea": ["6 + 2 + 2 + 2 = 12.", "The twelve shevatim became Klal Yisrael."], "try": {"q": "Who was the mother of Naftali?", "o": ["Bilhah", "Zilpah", "Leah"], "a": "Bilhah", "steps": ["Dan and Naftali go together."]}, "nojoke": true}, "LK.CHEM.L04.10": {"big": "Seder Zeraim has 11 masechtos and Seder Moed has 12.", "hook": "Two scrolls of masechtos: let us unroll them!", "remember": "Booklet page 12: מַסֶּכְתּוֹת הַשַּׁ״ס. Learn one scroll at a time.", "intro": ["Zeraim: Brachos, Pe'ah, Demai, Kilayim, Shevi'is, Terumos, Ma'asros, Ma'aser Sheni, Challah, Orlah, Bikkurim.", "Moed: Shabbos, Eruvin, Pesachim, Shekalim, Yoma, Sukkah, Beitzah, Rosh Hashanah, Ta'anis, Megillah, Moed Katan, Chagigah."], "ex": [{"q": "What comes after Brachos?", "steps": ["Sing Zeraim from the start.", "Brachos, Pe'ah."], "a": "Pe'ah", "pic": "פֵּאָה · Pe'ah"}, {"q": "Which seder is Pesachim in?", "steps": ["Sing both scrolls.", "It is in Moed."], "a": "Moed"}], "oops": {"q": "Is Shabbos in Seder Zeraim?", "wrong": "yes", "right": "no, in Moed", "why": "Each masechta belongs to one seder."}, "idea": ["Six sedarim, 63 masechtos.", "The Gemara is built on the Mishnah."], "try": {"q": "Which seder has Bikkurim?", "o": ["Zeraim", "Moed", "Taharos"], "a": "Zeraim", "steps": ["It is the last of Zeraim."]}, "nojoke": true}, "LK.CHEM.L04.11": {"big": "Seder Nashim has 7 masechtos and Seder Nezikin has 10.", "hook": "Two scrolls of masechtos: let us unroll them!", "remember": "Booklet page 12: מַסֶּכְתּוֹת הַשַּׁ״ס. Learn one scroll at a time.", "intro": ["Nashim: Yevamos, Kesubos, Nedarim, Nazir, Sotah, Gittin, Kiddushin.", "Nezikin: Bava Kamma, Bava Metzia, Bava Basra, Sanhedrin, Makkos, Shevuos, Eduyos, Avodah Zarah, Avos, Horayos."], "ex": [{"q": "What comes after Yevamos?", "steps": ["Sing Nashim from the start.", "Yevamos, Kesubos."], "a": "Kesubos", "pic": "כְּתוּבּוֹת · Kesubos"}, {"q": "Which seder is Bava Basra in?", "steps": ["Sing both scrolls.", "It is in Nezikin."], "a": "Nezikin"}], "oops": {"q": "Is Bava Kamma in Seder Nashim?", "wrong": "yes", "right": "no, in Nezikin", "why": "Each masechta belongs to one seder."}, "idea": ["Six sedarim, 63 masechtos.", "The Gemara is built on the Mishnah."], "try": {"q": "Which seder has Kiddushin?", "o": ["Nashim", "Nezikin", "Taharos"], "a": "Nashim", "steps": ["It is the last of Nashim."]}, "nojoke": true}, "LK.CHEM.L04.12": {"big": "Seder Kodashim has 11 masechtos and Seder Taharos has 12.", "hook": "Two scrolls of masechtos: let us unroll them!", "remember": "Booklet page 12: מַסֶּכְתּוֹת הַשַּׁ״ס. Learn one scroll at a time.", "intro": ["Kodashim: Zevachim, Menachos, Chullin, Bechoros, Arachin, Temurah, Kerisos, Me'ilah, Tamid, Middos, Kinnim.", "Taharos: Keilim, Ohalos, Nega'im, Parah, Taharos, Mikva'os, Niddah, Machshirin, Zavim, Tevul Yom, Yadayim, Uktzin."], "ex": [{"q": "What comes after Zevachim?", "steps": ["Sing Kodashim from the start.", "Zevachim, Menachos."], "a": "Menachos", "pic": "מְנָחוֹת · Menachos"}, {"q": "Which seder is Nega'im in?", "steps": ["Sing both scrolls.", "It is in Taharos."], "a": "Taharos"}], "oops": {"q": "Is Keilim in Seder Kodashim?", "wrong": "yes", "right": "no, in Taharos", "why": "Each masechta belongs to one seder."}, "idea": ["Six sedarim, 63 masechtos.", "The Gemara is built on the Mishnah."], "try": {"q": "Which seder has Kinnim?", "o": ["Kodashim", "Taharos", "Taharos"], "a": "Kodashim", "steps": ["It is the last of Kodashim."]}, "nojoke": true}}; if(typeof TL_TEACH!=='undefined'&&TL_TEACH) Object.keys(CT4).forEach(k=>{ TL_TEACH[k]=CT4[k]; }); }catch(e){ console.error('CHEM4 TL_TEACH',e); }

.\nTap every right one.", "Which words come right after וְעַל תְּנוּבַת הַשָּׂדֶה?": "Sing to Find It!\nLike: humming helps you remember.\nYour turn: sing the song up to that spot.\nTap your answer.", "Which line asks Hashem to bring us up to Yerushalayim?": "Sing to Find It!\nLike: humming helps you remember.\nYour turn: sing the song up to that spot.\nTap your answer.", "How many kinds of food does this one bracha cover? Type the number.": "Count It Up!\nLike: counting train cars.\nYour turn: sing that part and count on your fingers.\nType it, then Check.", "Put the ending after cake in order.": "Sing It in Order!\nLike: a song keeps every name in place.\nYour turn: sing it and find the first tile.\nDrag the tiles in order.", "Eli drank grape juice and ate cookies. What does he say?": "Sing to Find It!\nLike: humming helps you remember.\nYour turn: sing the song up to that spot.\nTap your answer.", "You ate figs. How does the bracha after start?": "Sing to Find It!\nLike: humming helps you remember.\nYour turn: sing the song up to that spot.\nTap your answer.", "After a piece of cake, how does the bracha end?": "Sing to Find It!\nLike: humming helps you remember.\nYour turn: sing the song up to that spot.\nTap your answer.", "What do we ask Hashem in this bracha?": "Sing to Find It!\nLike: humming helps you remember.\nYour turn: sing the song up to that spot.\nTap your answer.", "Dates come from a tree. Which start?": "Sing to Find It!\nLike: humming helps you remember.\nYour turn: sing the song up to that spot.\nTap your answer.", "You started עַל הַגֶּפֶן. How do you end?": "Sing to Find It!\nLike: humming helps you remember.\nYour turn: sing the song up to that spot.\nTap your answer.", "Which words are in the middle for every food?": "Sing to Find It!\nLike: humming helps you remember.\nYour turn: sing the song up to that spot.\nTap your answer."}}, "LK.CHEM.L04.02": {"s": "Song Power!\nLike: humming a tune helps you remember.\nYour turn: sing the booklet song, then answer.\nTap, sort and match as you go.", "q": {"After a cup of water, which bracha?": "Sing to Find It!\nLike: humming helps you remember.\nYour turn: sing the song up to that spot.\nTap your answer.", "What does נְפָשׁוֹת רַבּוֹת mean?": "Sing to Find It!\nLike: humming helps you remember.\nYour turn: sing the song up to that spot.\nTap your answer.", "How does Borei Nefashos end?": "Sing to Find It!\nLike: humming helps you remember.\nYour turn: sing the song up to that spot.\nTap your answer.", "Together: Yosef ate an apple. Which bracha after?": "Sing to Find It!\nLike: humming helps you remember.\nYour turn: sing the song up to that spot.\nTap your answer.", "Together: Which word comes right after בּוֹרֵא?": "Sing to Find It!\nLike: humming helps you remember.\nYour turn: sing the song up to that spot.\nTap your answer.", "Put Borei Nefashos in order.": "Sing It in Order!\nLike: a song keeps every name in place.\nYour turn: sing it and find the first tile.\nDrag the tiles in order.", "Sort: Borei Nefashos or Al Hamichya after this food?": "Find Its Group!\nLike: each name lives in one part of the song.\nYour turn: which part is it in?\nDrag each card to its box.", "Tap every food you say Borei Nefashos after.": "Spot Them All!\nLike: finding your team in a crowd.\nYour turn: sing that part and tap each one.\nTap every right one.", "Match the words to what they mean.": "Match Them Up!\nLike: a key fits one lock.\nYour turn: start with the one you know.\nTap a card, then its match.", "Which words come right after בּוֹרֵא נְפָשׁוֹת רַבּוֹת?": "Sing to Find It!\nLike: humming helps you remember.\nYour turn: sing the song up to that spot.\nTap your answer.", "Which line comes last?": "Sing to Find It!\nLike: humming helps you remember.\nYour turn: sing the song up to that spot.\nTap your answer.", "Put these foods' brachos from first to last: before, then after an apple.": "Sing It in Order!\nLike: a song keeps every name in place.\nYour turn: sing it and fi window.TL_CHEM_SONGS=Object.assign(window.TL_CHEM_SONGS||{},{"LK.CHEM.L04.01": {"title": "בְּרָכָה מֵעֵין שָׁלֹשׁ · Al Hamichya", "lines": ["בָּרוּךְ אַתָּה ה׳ אֱלֹקֵינוּ מֶלֶךְ הָעוֹלָם, עַל הַמִּחְיָה וְעַל הַכַּלְכָּלָה", "וְעַל תְּנוּבַת הַשָּׂדֶה, וְעַל אֶרֶץ חֶמְדָּה טוֹבָה וּרְחָבָה", "שֶׁרָצִיתָ וְהִנְחַלְתָּ לַאֲבוֹתֵינוּ, לֶאֱכֹל מִפִּרְיָהּ וְלִשְׂבֹּעַ מִטּוּבָהּ.", "רַחֵם נָא ה׳ אֱלֹקֵינוּ עַל יִשְׂרָאֵל עַמֶּךָ, וְעַל יְרוּשָׁלַיִם עִירֶךָ,", "וְעַל צִיּוֹן מִשְׁכַּן כְּבוֹדֶךָ, וְעַל מִזְבְּחֶךָ, וְעַל הֵיכָלֶךָ.", "וּבְנֵה יְרוּשָׁלַיִם עִיר הַקֹּדֶשׁ בִּמְהֵרָה בְיָמֵינוּ,", "וְהַעֲלֵנוּ לְתוֹכָהּ, וְשַׂמְּחֵנוּ בְּבִנְיָנָהּ,", "וְנֹאכַל מִפִּרְיָהּ, וְנִשְׂבַּע מִטּוּבָהּ, וּנְבָרֶכְךָ עָלֶיהָ בִּקְדֻשָּׁה וּבְטָהֳרָה.", "כִּי אַתָּה ה׳ טוֹב וּמֵטִיב לַכֹּל, וְנוֹדֶה לְּךָ עַל הָאָרֶץ", "וְעַל הַמִּחְיָה. בָּרוּךְ אַתָּה ה׳, עַל הָאָרֶץ וְעַל הַמִּחְיָה."], "sub": "After cake. For wine say עַל הַגֶּפֶן, for the special fruits עַל הָעֵץ."}, "LK.CHEM.L04.02": {"title": "בּוֹרֵא נְפָשׁוֹת · Borei Nefashos", "lines": ["בָּרוּךְ אַתָּה ה׳ אֱלֹקֵינוּ מֶלֶךְ הָעוֹלָם", "בּוֹרֵא נְפָשׁוֹת רַבּוֹת, וְחֶסְרוֹנָן,", "עַל כָּל מַה שֶּׁבָּרָא(תָ),", "לְהַחֲיוֹת בָּהֶם נֶפֶשׁ כָּל חָי.", "בָּרוּךְ חֵי הָעוֹלָמִים:"], "sub": "After most foods."}, "LK.CHEM.L04.03": {"title": "חֲמִשָּׁה חוּמְשֵׁי תוֹרָה · The Parshiyos", "lines": ["בְּרֵאשִׁית: בְּרֵאשִׁית, נֹחַ, לֶךְ לְךָ, וַיֵּרָא, חַיֵּי שָׂרָה, תּוֹלְדֹת, וַיֵּצֵא, וַיִּשְׁלַח, וַיֵּשֶׁב, מִקֵּץ, וַיִּגַּשׁ, וַיְחִי", "שְׁמוֹת: שְׁמוֹת, וָאֵרָא, בֹּא, בְּשַׁלַּח, יִתְרוֹ, מִשְׁפָּטִים, תְּרוּמָה, תְּצַוֶּה, כִּי תִשָּׂא, וַיַּקְהֵל, פְּקוּדֵי"], "sub": "Bereishis · Shemos"}, "LK.CHEM.L04.04": {"title": "חֲמִשָּׁה חוּמְשֵׁי תוֹרָה · The Parshiyos", "lines": ["וַיִּקְרָא: וַיִּקְרָא, צַו, שְׁמִינִי, תַּזְרִיעַ, מְצֹרָע, אַחֲרֵי מוֹת, קְדֹשִׁים, אֱמֹר, בְּהַר, בְּחֻקֹּתַי", "בְּמִדְבַּר: בְּמִדְבַּר, נָשֹׂא, בְּהַעֲלֹתְךָ, שְׁלַח, קֹרַח, חֻקַּת, בָּלָק, פִּינְחָס, מַטּוֹת, מַסְעֵי", "דְּבָרִים: דְּבָרִים, וָאֶתְח
