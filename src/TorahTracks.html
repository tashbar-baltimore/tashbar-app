]},
'LK.NAV.L02.05':{name:'Navi 11: Shaul HaMelech', band:'5-6', peg:{kind:'rise and fall',show:'Humble → King → Disobeys → Loses',say:'Shaul rose because he was humble and fell because he did not obey fully.'},
teach:[
{how:'Opener: a tall young man searching for his father\'s lost donkeys ends up being anointed king! The people asked for a king, and Shmuel anointed Shaul, from shevet Binyamin, the first king of Yisrael.', q:'Who was the first king of Yisrael?', o:['Shaul','Dovid','Shlomo']},
{how:'Shaul was humble: when they came to make him king, he hid among the baggage.', q:'Where did Shaul hide when they came to crown him?', o:['Among the baggage','In a cave','On a ship']},
{how:'Hashem commanded Shaul to destroy Amalek completely. Shaul spared King Agag and the best animals. Shmuel told him: obeying is better than sacrifices. The kingdom would pass to Dovid.', q:'Why did Shaul lose the kingdom?', o:['He did not fully obey Hashem about Amalek','He lost a battle','He moved away']}
],
we:[
{q:'Together: from which shevet was Shaul?', o:['Binyamin','Yehudah','Levi'], steps:['Shaul was the son of Kish.','From the smallest shevet.','Binyamin.']},
{q:'Together: who would be king after Shaul?', o:['Dovid','Yonasan','Shmuel'], steps:['Shaul lost the kingdom.','Shmuel anointed a shepherd boy.','Dovid.']}
],
practice:[
{t:'order', q:'Put Shaul\'s story in order.', tiles:['Searching for donkeys','Anointed by Shmuel','Hides among the baggage','Spares Agag','The kingdom passes to Dovid'], why:'Shmuel I, chapters 9-16.'},
{t:'pairs', q:'Match each person.', pairs:[['Shaul','first king'],['Shmuel','anointed him'],['Yonasan','Shaul\'s son, Dovid\'s friend'],['Agag','king of Amalek']], why:'Sefer Shmuel.'},
{t:'spotall', q:'Tap every true fact about Shaul.', cells:[{label:'he was humble at first',ok:true},{label:'he was from Binyamin',ok:true},{label:'he was very tall',ok:true},{label:'he built the Beis Hamikdash',ok:false},{label:'he wrote Tehillim',ok:false}], why:'Shaul was head and shoulders taller than the people.'},
{t:'type', q:'Finish Shmuel\'s words: obeying is better than ____. Type one word.', a:'sacrifices', alt:['sacrifice','korbanos','korbanot'], kb:'abc', why:'Shmuel I 15:22: hinei shemoa mizevach tov.'},
{q:'What lesson do we learn from Shaul and Amalek?', o:['Do exactly what Hashem says','Keep the best for yourself','Kings may do anything'], h:'Obedience is greater than any offering.', why:'Partial obedience is not obedience.'},
{q:'Which battle did Shaul fight with Dovid\'s help?', o:['Against the Plishtim, when Golyas fell','Against Mitzrayim','Against Bavel'], h:'The Golyas story happened in Shaul\'s time.', why:'Shmuel I 17.'}
],
check:[
{q:'Who anointed Shaul?', o:['Shmuel','Eli','Dovid']},
{q:'Why did Shaul lose the kingdom?', o:['He spared Agag against Hashem\'s command','He was too humble','He was too short']},
{q:'Who was Shaul\'s son?', o:['Yonasan','Avshalom','Shlomo']}
]},
'LK.NAV.L03.05':{name:'Navi 12: Elisha the Navi', band:'7-8', peg:{kind:'double',show:'Pi shnayim',say:'Elisha asked for a double portion of Eliyahu\'s spirit, and did twice as many miracles.'},
teach:[
{how:'Opener: Eliyahu rose to Shamayim in a fiery chariot, and his cloak fell to his student. Elisha asked for pi shnayim, a double portion of Eliyahu\'s spirit.', q:'What did Elisha ask from Eliyahu?', o:['A double portion of his spirit','His house','His donkey']},
{how:'A poor widow had only a little jug of oil. Elisha told her to borrow empty vessels. The oil kept flowing until every vessel was full, and she sold it to pay her debts.', q:'What filled the widow\'s vessels?', o:['Oil from her one small jug','Water from the river','Wine']},
{how:'The Shunamis woman made a room for Elisha. Elisha blessed her with a son. Years later the boy died, and Elisha davened and brought him back to life.', q:'How did the Shunamis woman help Elisha?', o:['She made a room for him','She gave him a horse','She wrote a sefer']}
],
we:[
{q:'Together: why borrow many empty vessels?', o:['The oil would fill as many as she had','For decoration','To sell the vessels'], steps:['The neis would flow into every vessel.','More vessels, more oil.','Her faith brought more brachah.']},
{q:'Together: who was Eliyahu\'s student?', o:['Elisha','Yonah','Achav'], steps:['Eliyahu found him plowing.','He threw his cloak on him.','Elisha followed him.']}
],
practice:[
{t:'pairs', q:'Match each story to its neis.', pairs:[['the widow','oil that kept flowing'],['the Shunamis','her son brought back to life'],['Na\'aman','healed in the Yarden'],['the Yarden','split with Eliyahu\'s cloak']], why:'Melachim II, chapters 2-5.'},
{t:'order', q:'Put Elisha\'s beginning in order.', tiles:['Eliyahu throws his cloak on him','Follows Eliyahu','Asks for a double portion','Eliyahu goes up in a fiery chariot','Splits the Yarden with the cloak'], why:'Melachim I 19 and Melachim II 2.'},
{t:'spotall', q:'Tap what the Shunamis put in Elisha\'s room.', cells:[{label:'a bed',ok:true},{label:'a table',ok:true},{label:'a chair',ok:true},{label:'a lamp',ok:true},{label:'a throne of gold',ok:false}], why:'Melachim II 4:10.'},
{t:'type', q:'In which river did Na\'aman dip to be healed? Type it.', a:'yarden', alt:['jordan','the yarden'], kb:'abc', why:'Seven times in the Yarden.'},
{q:'How many times did Na\'aman dip in the river?', o:['Seven','One','Forty'], h:'Elisha told him a number.', why:'Melachim II 5:14.'},
{q:'What lesson does the Shunamis teach?', o:['Hachnasas orchim brings great brachah','Never host guests','Only kings matter'], h:'She made a room for a tzaddik.', why:'Her chesed was repaid with a son.'}
],
check:[
{q:'What fell from Eliyahu to Elisha?', o:['His cloak','His staff','His crown']},
{q:'What happened to the widow\'s oil?', o:['It filled every vessel she gathered','It spilled','It froze']},
{q:'Whom did Elisha bring back to life?', o:['The Shunamis\'s son','Na\'aman','Achav']}
]},
'LK.NAV.L03.06':{name:'Navi 13: Ezra and Nechemiah', band:'7-8', peg:{kind:'two builders',show:'Ezra: Torah · Nechemiah: Walls',say:'Ezra rebuilt the Torah in people\'s hearts; Nechemiah rebuilt the walls of Yerushalayim.'},
teach:[
{how:'Opener: after seventy years in Bavel, Koresh of Persia allowed the Jews to return. The second Beis Hamikdash was built. Later Ezra HaSofer came and taught Torah to the people.', q:'Which king allowed the Jews to return?', o:['Koresh of Persia','Nevuchadnetzar','Paroh']},
{how:'Ezra stood on a wooden platform and read the Torah to everyone. He set up Krias HaTorah on Monday and Thursday, so three days would never pass without Torah.', q:'What did Ezra set up?', o:['Krias HaTorah on Monday and Thursday','A new Yom Tov','A new language']},
{how:'Nechemiah, the king\'s cupbearer, heard Yerushalayim\'s walls were broken. He got permission, came, and rebuilt the walls in fifty-two days, with a tool in one hand and a weapon in the other.', q:'How long did it take to rebuild the walls?', o:['Fifty-two days','Seven years','One day']}
],
we:[
{q:'Together: why read the Torah on Monday and Thursday?', o:['So three days never pass without Torah','Because of the market','Because of Shabbos'], steps:['Shabbos we read.','Monday and Thursday in between.','Never three days without Torah.']},
{q:'Together: what was Nechemiah\'s job in Persia?', o:['The king\'s cupbearer','A soldier','A farmer'], steps:['He served the king wine.','He was close to the king.','So he could ask for permission.']}
],
practice:[
{t:'pairs', q:'Match each leader to his work.', pairs:[['Koresh','let the Jews return'],['Ezra','taught Torah to everyone'],['Nechemiah','rebuilt the walls'],['Zerubavel','led the first return']], why:'Sefer Ezra and Nechemiah.'},
{t:'order', q:'Put the return in order.', tiles:['Galus Bavel','Koresh allows the return','The second Beis Hamikdash is built','Ezra teaches Torah','Nechemiah rebuilds the walls'], why:'The story of shivas Tziyon.'},
{t:'spotall', q:'Tap every thing Ezra did.', cells:[{label:'read the Torah publicly',ok:true},{label:'set Krias HaTorah on Monday and Thursday',ok:true},{label:'taught Torah to the returnees',ok:true},{label:'built the first Beis Hamikdash',ok:false},{label:'fought Golyas',ok:false}], why:'Ezra HaSofer, the great teacher.'},
{t:'type', q:'In how many days did Nechemiah rebuild the walls? Type the number.', a:'52', alt:['fifty-two','fifty two'], kb:'num', why:'Nechemiah 6:15.'},
{q:'Who made up the Anshei Knesses Hagedolah?', o:['Ezra and the Sages of his time','The kings of Yehudah','The Plishtim'], h:'They wrote much of our davening.', why:'They gave us Shemoneh Esrei\'s form.'},
{q:'Why did they work with a tool and a weapon?', o:['Enemies tried to stop the building','It was a custom','To look strong'], h:'Sanvalat and his friends.', why:'Nechemiah 4.'}
],
check:[
{q:'Who taught Torah to the people who returned?', o:['Ezra HaSofer','Haman','Achav']},
{q:'What did Nechemiah rebuild?', o:['The walls of Yerushalayim','The Mishkan','The Teivah']},
{q:'When do we read the Torah on weekdays?', o:['Monday and Thursday','Sunday only','Every day']}
]},
/* ===== ROUND 5 (v209) ===== */
'LK.TEF.L01.04':{name:'Tefillah 13: Birchos Hashachar', band:'K-2', op:'Every morning is a brand-new gift: opening our eyes, getting dressed, standing up straight. Chazal gave us a thank-you for each one!', peg:{kind:'body',show:'Eyes · Clothes · Standing · Shoes',say:'Each morning brachah matches something we do as we wake up.'},
teach:[
{how:'Opener: Birchos Hashachar are the morning brachos. We thank Hashem for each thing that happens as we wake up. Pokei\'ach ivrim: Who opens the eyes of the blind, because we can see!', q:'What does pokei\'ach ivrim thank Hashem for?', o:['That we can see','That we can eat','That it is Shabbos']},
{how:'Malbish arumim: Who clothes the naked, because we get dressed. Zokeif kefufim: Who straightens the bent, because we stand up straight.', q:'Which brachah is for getting dressed?', o:['Malbish arumim','Pokei\'ach ivrim','Zokeif kefufim']},
{how:'The first brachah thanks Hashem for giving the rooster understanding to tell day from night. Long ago, the rooster\'s crow woke everyone up!', q:'Which animal is in the first morning brachah?', o:['The rooster','The lion','The fish']}
],
we:[
{q:'Together: you put on your shoes. Which idea is that?', o:['She\'asah li kol tzarki, Who gave me all I need','Hamotzi','Shehakol'], steps:['Shoes help us walk anywhere.','Chazal connected shoes to having all we need.','She\'asah li kol tzarki.']},
{q:'Together: you stretch and stand up tall. Which brachah?', o:['Zokeif kefufim','Malbish arumim','Pokei\'ach ivrim'], steps:['We were lying bent in bed.','Now we stand straight.','Zokeif kefufim: Who straightens the bent.']}
],
practice:[
{t:'pairs', q:'Match each brachah to its morning moment.', pairs:[['pokei\'ach ivrim','opening our eyes'],['malbish arumim','getting dressed'],['zokeif kefufim','standing up straight'],['hanosein laya\'eif ko\'ach','getting energy back']], why:'Each brachah fits something we do when we wake.'},
{t:'order', q:'Put your morning in order.', tiles:['Open your eyes','Get dressed','Stand up straight','Put on shoes'], why:'The brachos follow the order of waking up.'},
{t:'spotall', q:'Tap every thing we thank Hashem for in Birchos Hashachar.', cells:[{label:'seeing',ok:true},{label:'clothes',ok:true},{label:'standing up',ok:true},{label:'winning a game',ok:false},{label:'a new toy',ok:false}], why:'The morning brachos thank Hashem for the gifts of a new day.'},
{q:'Who gave the rooster understanding?', o:['Hashem','The farmer','The sun'], h:'The first brachah: asher nasan lasechvi vinah.', why:'Hashem gave the rooster the sense to know day from night.'},
{t:'type', q:'Birchos Hashachar are the ____ brachos. Type one word.', a:'morning', alt:['morning.'], kb:'abc', why:'Shachar means dawn.'},
{q:'What do we answer when someone says a brachah?', o:['Amen','Good morning','Thank you'], h:'Amen means it is true.', why:'Answering Amen is a big mitzvah.'}
],
check:[
{q:'Which brachah is for seeing?', o:['Pokei\'ach ivrim','Malbish arumim','Hamotzi']},
{q:'When do we say Birchos Hashachar?', o:['In the morning','At night','After lunch']},
{q:'Which brachah is for getting dressed?', o:['Malbish arumim','Zokeif kefufim','Shehakol']}
]},
'LK.YT.L03.04':{name:'Yom Tov 13: Halachos of the Sukkah and Arba Minim', band:'7-8', op:'Can a sukkah be built under a tree? Can its roof be a bed sheet? Every detail of the sukkah has a halachah.', peg:{kind:'rule of shade',show:'More shade than sun',say:'Kosher s\'chach gives more shade than sun, but lets you see stars.'},
teach:[
{how:'Opener: s\'chach must be something that grew from the ground, is cut off, and cannot become tamei, like branches, bamboo or reeds. It must give more shade than sun.', q:'Which is kosher s\'chach?', o:['Cut branches','A metal sheet','A living tree\'s branches still attached']},
{how:'A sukkah must not be under a tree or a roof. It needs at least two full walls and part of a third. It may not be more than twenty amos high.', q:'How many walls does a kosher sukkah need at least?', o:['Two and a bit of a third','One','Four always']},
{how:'The Arba Minim must be kosher: the esrog without blemishes, the lulav straight with its middle leaf whole, hadasim with leaves in groups of three. We shake them in all six directions.', q:'In how many directions do we shake the lulav?', o:['Six','Two','Ten']}
],
we:[
{q:'Together: a sukkah under a big tree. Kosher?', o:['No, the tree covers it','Yes','Only by day'], steps:['S\'chach must be the only roof.','A tree above makes it invalid.','Build it under the open sky.']},
{q:'Together: it is raining hard on Sukkos. Must we eat in the sukkah?', o:['No, one who is uncomfortable from rain is exempt (ask your rav about the first night)','Yes, always','We may never eat'], steps:['Mitzta\'eir patur min hasukkah.','Rain that would spoil the food exempts us.','The first night has special rules: ask your rav.']}
],
practice:[
{t:'sort', q:'Sort: kosher s\'chach or not?', bins:[{id:'K',label:'Kosher s\'chach'},{id:'N',label:'Not kosher'}], items:[{label:'bamboo poles',bin:'K'},{label:'pine branches',bin:'K'},{label:'reed mats made for s\'chach',bin:'K'},{label:'a plastic tarp',bin:'N'},{label:'a metal roof',bin:'N'},{label:'branches still on the tree',bin:'N'}], why:'S\'chach grows from the ground, is detached, and cannot become tamei.'},
{t:'spotall', q:'Tap every halachah of the Arba Minim.', cells:[{label:'shake in six directions',ok:true},{label:'three hadasim, two aravos',ok:true},{label:'the esrog must be without blemishes',ok:true},{label:'shake on Shabbos too',ok:false},{label:'any fruit can be the esrog',ok:false}], why:'We do not take the Arba Minim on Shabbos.'},
{t:'pairs', q:'Match each rule.', pairs:[['s\'chach','more shade than sun'],['walls','two and part of a third'],['height','not over twenty amos'],['the lulav','straight, middle leaf whole']], why:'Hilchos Sukkah and Lulav.'},
{t:'type', q:'How many days do we eat in the sukkah outside Eretz Yisrael (minimum, before Shemini Atzeres)? Type the number.', a:'7', alt:['seven'], kb:'num', why:'Seven days of Sukkos.'},
{q:'Why don\'t we take the lulav on Shabbos?', o:['Chazal feared someone would carry it in public','It is too heavy','It is muktzeh always'], h:'A gezeirah of Chazal.', why:'Like shofar on Shabbos Rosh Hashanah.'},
{q:'Who is exempt from the sukkah?', o:['One who is suffering there, like from rain','Everyone on weekdays','Only kings'], h:'Mitzta\'eir patur.', why:'The sukkah is meant to be lived in comfortably.'}
],
check:[
{q:'What must s\'chach give?', o:['More shade than sun','Full darkness','Only sun']},
{q:'May a sukkah be under a tree?', o:['No','Yes','Only small trees']},
{q:'Do we shake the lulav on Shabbos?', o:['No','Yes','Only at night']}
]},
'LK.YT.L02.06':{name:'Yom Tov 14: Purim, Going Deeper', band:'5-6', op:'A king, a wicked plan, a brave queen, and Hashem hiding behind every scene. Hashem\'s Name does not appear even once in the Megillah!', peg:{kind:'hidden',show:'Hester panim',say:'Hashem is hidden in the Megillah, but His hand is everywhere.'},
teach:[
{how:'Opener: the Megillah never mentions Hashem\'s Name, yet every "coincidence" shows His hand. That is why we dress up: things are not what they seem.', q:'Why do many dress up on Purim?', o:['To show that Hashem\'s hand was hidden in the story','To scare people','For a contest']},
{how:'Before Purim we hear Parshas Zachor, remembering what Amalek did, since Haman came from Amalek. The day before Purim is Ta\'anis Esther.', q:'Which parsha do we hear on the Shabbos before Purim?', o:['Parshas Zachor','Parshas Bereishis','Parshas Noach']},
{how:'Cities that had walls in the time of Yehoshua, like Yerushalayim, celebrate on the fifteenth: Shushan Purim, because in Shushan the Jews fought one extra day.', q:'Why is Purim in Yerushalayim on the fifteenth?', o:['Walled cities follow Shushan, where they fought an extra day','By mistake','It is a fast']}
],
we:[
{q:'Together: from which nation did Haman come?', o:['Amalek','Mitzrayim','Bavel'], steps:['Haman was the Agagi.','Agag was king of Amalek.','So Haman came from Amalek.']},
{q:'Together: how many times do we hear the Megillah?', o:['Twice: night and day','Once','Seven times'], steps:['Purim night.','Purim day.','Twice.']}
],
practice:[
{t:'order', q:'Put the Purim season in order.', tiles:['Parshas Zachor','Ta\'anis Esther','Purim (14 Adar)','Shushan Purim (15 Adar)'], why:'Zachor on Shabbos before, then the fast, then Purim, then Shushan Purim.'},
{t:'pairs', q:'Match each person to his part.', pairs:[['Achashveirosh','the king'],['Haman','descendant of Amalek'],['Mordechai','would not bow'],['Esther','the brave queen']], why:'Megillas Esther.'},
{t:'spotall', q:'Tap every way Hashem\'s hidden hand shows in the Megillah.', cells:[{label:'the king could not sleep that night',ok:true},{label:'Mordechai had saved the king earlier',ok:true},{label:'Esther became queen just in time',ok:true},{label:'a voice from Shamayim spoke openly',ok:false},{label:'the sea split',ok:false}], why:'No open miracles, only hidden ones.'},
{t:'type', q:'On which day of Adar is Shushan Purim? Type the number.', a:'15', alt:['fifteen','15th'], kb:'num', why:'The 15th of Adar.'},
{q:'What do we add to Shemoneh Esrei on Purim?', o:['Al Hanissim','Ya\'aleh V\'yavo','Aneinu'], h:'Bimei Mordechai v\'Esther.', why:'For the miracles of Purim.'},
{q:'Why do we make noise at Haman\'s name?', o:['To blot out the memory of Amalek','To wake people up','For music'], h:'Zachor: remember what Amalek did.', why:'A minhag to erase his name.'}
],
check:[
{q:'Whose Name is not written in the Megillah?', o:['Hashem\'s','Esther\'s','Haman\'s']},
{q:'What is Ta\'anis Esther?', o:['The fast before Purim','A Purim song','The Purim meal']},
{q:'Where is Purim celebrated on the 15th?', o:['Walled cities like Yerushalayim','Everywhere','Nowhere']}
]},
'LK.HAL.L02.05':{name:'Halacha 13: Honoring Rebbeim and Elders', band:'5-6', op:'When a great talmid chacham walks in, the whole room rises. Standing up is a mitzvah from the Torah: mipnei seivah takum.', peg:{kind:'stand',show:'Rise · Respect · Listen',say:'Rise for elders and talmidei chachamim; respect your rebbe like a parent.'},
teach:[
{how:'Opener: the Torah says: mipnei seivah takum, rise before the elderly, and v\'hadarta pnei zakein, honor the face of a sage. We stand for a person of seventy and for a talmid chacham.', q:'Which mitzvah tells us to stand for elders?', o:['Mipnei seivah takum','Shema Yisrael','Lech lecha']},
{how:'A rebbe who teaches us Torah brings us to Olam Haba. We honor him like a parent: greet him, listen, and do not sit in his place.', q:'Why is a rebbe honored so much?', o:['He teaches us Torah, which brings us to Olam Haba','He is tall','He gives prizes']},
{how:'Rabbi Akiva\'s students were great, yet Chazal teach they did not give each other enough honor. Kavod for others is part of Torah.', q:'What lesson do Rabbi Akiva\'s students teach?', o:['Give honor to others','Learn alone','Speak loudly']}
],
we:[
{q:'Together: your rebbe walks into the room. What do you do?', o:['Stand up respectfully','Keep talking','Hide'], steps:['A rebbe is a talmid chacham.','We rise for a talmid chacham.','Stand until he passes or sits.']},
{q:'Together: an old man boards the bus. What is the mitzvah?', o:['Offer him your seat','Look away','Take a bigger seat'], steps:['Mipnei seivah takum.','Rise for the elderly.','Offer your seat.']}
],
practice:[
{t:'spotall', q:'Tap every way to honor a rebbe.', cells:[{label:'standing when he enters',ok:true},{label:'greeting him first',ok:true},{label:'listening carefully',ok:true},{label:'sitting in his chair',ok:false},{label:'calling him by first name',ok:false}], why:'Kavod haTorah.'},
{t:'pairs', q:'Match the words.', pairs:[['seivah','old age'],['takum','you shall rise'],['zakein','sage or elder'],['talmid chacham','Torah scholar']], why:'Vayikra 19:32.'},
{t:'type', q:'From what age is a person called a seivah for standing up? Type the number.', a:'70', alt:['seventy'], kb:'num', why:'Chazal: seventy.'},
{q:'In which parsha is mipnei seivah takum?', o:['Kedoshim','Bereishis','Noach'], h:'Vayikra 19.', why:'Next to many mitzvos of kindness.'},
{q:'Why don\'t we sit in our rebbe\'s place?', o:['It is a sign of respect','It is uncomfortable','It is muktzeh'], h:'Like a parent\'s place.', why:'Yirah for a rebbe, as for a parent.'},
{t:'order', q:'Put the chain of honor in order, from the source.', tiles:['Hashem gives the Torah','Moshe teaches it','Rebbeim pass it on','We learn it'], why:'Honoring a rebbe honors the Torah itself.'}
],
check:[
{q:'For whom does the Torah say to stand?', o:['Elders and talmidei chachamim','Only parents','Nobody']},
{q:'How do we treat our rebbe?', o:['With honor like a parent','Like a friend only','Ignore him']},
{q:'Where is mipnei seivah takum?', o:['Parshas Kedoshim','Parshas Noach','Megillas Esther']}
]},
'LK.MID.L02.07':{name:'Middos 10: Zerizus, Doing Mitzvos Quickly', band:'5-6', op:'Avraham Avinu woke up early to do Hashem\'s will. Rivkah ran to give water. Tzaddikim do not wait.', peg:{kind:'run',show:'Mitzvah? Run!',say:'Mitzvah haba\'ah l\'yadcha al tachmitzena: when a mitzvah comes, do not let it sour.'},
teach:[
{how:'Opener: Chazal say: just as we watch matzah so it does not become chametz, we watch mitzvos so they do not "sour" by waiting. Zerizus means doing mitzvos eagerly and quickly.', q:'What does zerizus mean?', o:['Doing mitzvos eagerly and quickly','Running in the hallway','Being lazy']},
{how:'Avraham woke early in the morning for the Akeidah: vayashkeim Avraham baboker. From here we learn zerizin makdimin l\'mitzvos, the eager do mitzvos early.', q:'What did Avraham do the morning of the Akeidah?', o:['Woke up early','Slept late','Waited a week']},
{how:'Rivkah ran (vatarotz) to bring water for Eliezer\'s camels. Avraham ran to the guests. Running for a mitzvah shows how much we love it.', q:'What did Rivkah do quickly?', o:['Brought water for the camels','Built a house','Wrote a sefer']}
],
we:[
{q:'Together: Ima asks for help with groceries. Zerizus means…', o:['Help right away with a smile','Finish my game first','Pretend not to hear'], steps:['A mitzvah has come to you.','Do not let it sour.','Help now!']},
{q:'Together: a bris is in the morning. Why so early?', o:['Zerizin makdimin l\'mitzvos','The baby is hungry','No reason'], steps:['Avraham woke early for a mitzvah.','We do the same.','Mitzvos as early as possible.']}
],
practice:[
{t:'sort', q:'Sort: zerizus or laziness?', bins:[{id:'Z',label:'Zerizus'},{id:'L',label:'Atzlus (laziness)'}], items:[{label:'jumping up for Shacharis',bin:'Z'},{label:'helping right away',bin:'Z'},{label:'starting homework now',bin:'Z'},{label:'I will do it later',bin:'L'},{label:'snoozing again and again',bin:'L'}], why:'A mitzvah done eagerly is a mitzvah loved.'},
{t:'pairs', q:'Match each tzaddik to his zerizus.', pairs:[['Avraham','woke early for the Akeidah'],['Rivkah','ran to water the camels'],['Avraham, again','ran to the guests'],['Yaakov','rose early at Beis El']], why:'The Torah shows zerizus again and again.'},
{t:'type', q:'Type the Hebrew word for eagerness in mitzvos.', a:'zerizus', alt:['zrizus','zerizut','zerizus.'], kb:'abc', why:'Zerizus: זְרִיזוּת.'},
{q:'Why compare mitzvos to matzah?', o:['Both can "spoil" if we wait too long','Both are flat','Both are eaten on Purim'], h:'Mitzvos, matzos: the same letters.', why:'Rashi on Shemos 12:17.'},
{t:'spotall', q:'Tap every example of zerizus.', cells:[{label:'coming to davening on time',ok:true},{label:'returning a lost item today',ok:true},{label:'thanking someone right away',ok:true},{label:'leaving the dishes for tomorrow',ok:false},{label:'saying I will start Monday',ok:false}], why:'Now, not later.'},
{q:'Which sefer of mussar teaches zerizus as a step to holiness?', o:['Mesillas Yesharim','Megillas Esther','Sefer Bereishis only'], h:'By the Ramchal.', why:'Zehirus, zerizus, nekiyus… the steps of Rabbi Pinchas ben Yair.'}
],
check:[
{q:'What is zerizus?', o:['Doing mitzvos eagerly','Being slow','Being loud']},
{q:'Who woke early for the Akeidah?', o:['Avraham','Lavan','Paroh']},
{q:'Mitzvah haba\'ah l\'yadcha means…', o:['When a mitzvah comes, do not delay it','Mitzvos are heavy','Wait for a better one']}
]},
'LK.NAV.L02.06':{name:'Navi 14: Megillas Rus', band:'5-6', op:'A princess from Moav leaves everything to follow her mother-in-law and join the Jewish people. Her great-grandson becomes King Dovid!', peg:{kind:'promise',show:'Your people = my people',say:'Rus said: Your people is my people, and your G-d is my G-d.'},
teach:[
{how:'Opener: in a time of famine, Naomi\'s family moved to Moav. Her husband and sons died. When Naomi went home, her daughter-in-law Rus would not leave her: Where you go, I will go; your people is my people.', q:'What did Rus say to Naomi?', o:['Where you go, I will go','Goodbye forever','I will stay in Moav']},
{how:'In Beis Lechem, Rus gathered leftover grain in the field of Boaz, a relative of Naomi. Boaz saw her modesty and kindness and treated her kindly.', q:'In whose field did Rus gather grain?', o:['Boaz','Lavan','Eliezer']},
{how:'Boaz married Rus. Their son was Oved, father of Yishai, father of Dovid HaMelech. We read Megillas Rus on Shavuos.', q:'Who was Rus\'s great-grandson?', o:['Dovid HaMelech','Shlomo','Shaul']}
],
we:[
{q:'Together: when do we read Megillas Rus?', o:['Shavuos','Purim','Tishah B\'Av'], steps:['Rus accepted the Torah.','We accepted the Torah on Shavuos.','So we read Rus on Shavuos.']},
{q:'Together: from Rus to Dovid, how many generations?', o:['Rus → Oved → Yishai → Dovid','Rus → Dovid directly','Rus → Shaul'], steps:['Rus and Boaz had Oved.','Oved had Yishai.','Yishai had Dovid.']}
],
practice:[
{t:'order', q:'Put the family line in order.', tiles:['Rus and Boaz','Oved','Yishai','Dovid HaMelech'], why:'Rus 4:17.'},
{t:'pairs', q:'Match each person.', pairs:[['Naomi','Rus\'s mother-in-law'],['Rus','gave up Moav to join Klal Yisrael'],['Boaz','owner of the field'],['Orpah','went back to Moav']], why:'Megillas Rus.'},
{t:'spotall', q:'Tap every middah Rus showed.', cells:[{label:'loyalty to Naomi',ok:true},{label:'modesty',ok:true},{label:'chesed',ok:true},{label:'laziness',ok:false},{label:'pride',ok:false}], why:'Chazal say the Megillah teaches the reward of chesed.'},
{t:'type', q:'In which town did Boaz live? Type it.', a:'beis lechem', alt:['bethlehem','beit lechem','beis lechem.'], kb:'abc', why:'Beis Lechem in Yehudah.'},
{q:'Why is Rus read on Shavuos?', o:['She accepted the Torah, and Dovid, born and died on Shavuos, came from her','It is short','It is about harvest only'], h:'Two reasons.', why:'Rus\'s conversion and Dovid\'s yahrzeit.'},
{q:'What did Rus do in the field?', o:['Gathered leftover grain, leket','Planted trees','Built a house'], h:'A mitzvah for the poor.', why:'Leket: farmers leave fallen stalks for the poor.'}
],
check:[
{q:'Who said: your people is my people?', o:['Rus','Orpah','Naomi']},
{q:'Whom did Rus marry?', o:['Boaz','Oved','Yishai']},
{q:'When is Megillas Rus read?', o:['Shavuos','Chanukah','Purim']}
]},
'LK.NAV.L03.07':{name:'Navi 15: Sefer Tehillim', band:'7-8', op:'One hundred fifty songs, written in caves, palaces and battlefields. For three thousand years, Jews have cried and sung with Dovid\'s words.', peg:{kind:'number',show:'150 · 145 · 23',say:'150 chapters; Ashrei is 145; Mizmor l\'Dovid, Hashem ro\'i is 23.'},
teach:[
{how:'Opener: Sefer Tehillim, in Kesuvim, has 150 chapters, mostly by Dovid HaMelech, with others by Moshe, Asaf, the sons of Korach and more.', q:'How many chapters are in Tehillim?', o:['One hundred fifty','Fifty-four','Thirteen']},
{how:'Ashrei is chapter 145 (with two pesukim added before it). It goes in Aleph-Beis order, and Chazal say one who says it three times a day is a ben Olam Haba.', q:'Which chapter is Ashrei?', o:['145','1','23']},
{how:'Each day has its Shir shel Yom, the song the Levi\'im sang in the Beis Hamikdash: for example, Sunday is chapter 24, and Shabbos is chapter 92, Mizmor shir l\'yom haShabbos.', q:'Which chapter is the song for Shabbos?', o:['92','145','150']}
],
we:[
{q:'Together: why is Ashrei in Aleph-Beis order?', o:['To praise Hashem with every letter','It is easier to spell','By chance'], steps:['Each pasuk starts with the next letter.','Praise with the whole Aleph-Beis.','One letter, Nun, is missing.']},
{q:'Together: what do Jews often say for a sick person?', o:['Tehillim','Hallel only','Havdalah'], steps:['Tehillim are heartfelt prayers.','Communities divide the chapters.','They daven for refuah.']}
],
practice:[
{t:'pairs', q:'Match each chapter number.', pairs:[['145','Ashrei'],['23','Hashem ro\'i'],['92','Shabbos song'],['150','the last chapter, Halleluyah']], why:'Famous chapters of Tehillim.'},
{t:'spotall', q:'Tap every author of chapters in Tehillim.', cells:[{label:'Dovid HaMelech',ok:true},{label:'Moshe Rabbeinu',ok:true},{label:'the sons of Korach',ok:true},{label:'Asaf',ok:true},{label:'Paroh',ok:false}], why:'Chazal list ten authors; Dovid gathered them.'},
{t:'type', q:'Which letter is missing from Ashrei\'s Aleph-Beis? Type its name.', a:'nun', alt:['noon','נ'], kb:'abc', why:'Chazal: Nun hints to a fall, so it is left out.'},
{q:'Which part of Tanach is Tehillim in?', o:['Kesuvim','Torah','Nevi\'im Rishonim'], h:'Writings.', why:'The first book of Kesuvim.'},
{t:'order', q:'Put these chapters in order.', tiles:['Chapter 1: Ashrei ha\'ish','Chapter 23: Hashem ro\'i','Chapter 92: Shabbos','Chapter 145: Ashrei','Chapter 150: Halleluyah'], why:'Tehillim from beginning to end.'},
{q:'How many times a day is Ashrei said?', o:['Three','Once','Ten'], h:'Twice in Shacharis, once at Mincha.', why:'Berachos 4b.'}
],
check:[
{q:'Who wrote most of Tehillim?', o:['Dovid HaMelech','Shlomo','Yeshayahu']},
{q:'Which chapter is Ashrei?', o:['145','92','1']},
{q:'How many chapters in Tehillim?', o:['150','100','54']}
]},
'LK.PAR.L02.05':{name:'Parsha 13: Who Said It?', band:'5-6', op:'Famous words echo through the Torah. Can you tell who said each one, and when?', peg:{kind:'quote',show:'Words → Speaker → Moment',say:'For each quote ask: who spoke, to whom, and what was happening?'},
teach:[
{how:'Opener: Hineni, here I am, was said by Avraham when Hashem called him for the Akeidah, and later by Moshe at the burning bush.', q:'Who said Hineni when Hashem called him for the Akeidah?', o:['Avraham','Lot','Lavan']},
{how:'Am I my brother\'s keeper? Kayin said this to Hashem after Hevel was killed. Let My people go! Moshe said to Paroh in Hashem\'s Name.', q:'Who said Let My people go to Paroh?', o:['Moshe, in Hashem\'s Name','Yosef','Aharon\'s sons']},
{how:'Na\'aseh v\'nishma was said by all Klal Yisrael at Har Sinai. The voice is the voice of Yaakov, but the hands are the hands of Eisav: Yitzchak said it when blessing Yaakov.', q:'Who said The voice is the voice of Yaakov?', o:['Yitzchak','Rivkah','Eisav']}
],
we:[
{q:'Together: Ani Yosef! Who and when?', o:['Yosef, revealing himself to his brothers','Yaakov, in Charan','Paroh, in a dream'], steps:['The speaker names himself.','He was hiding his identity.','Yosef to his brothers in Vayigash.']},
{q:'Together: Mah tovu ohalecha Yaakov. Who?', o:['Bilam','Moshe','Balak'], steps:['A blessing that came instead of a curse.','From the hired prophet.','Bilam.']}
],
practice:[
{t:'pairs', q:'Match each quote to its speaker.', pairs:[['Hineni (at the Akeidah)','Avraham'],['Am I my brother\'s keeper?','Kayin'],['Ani Yosef','Yosef'],['Mah tovu ohalecha Yaakov','Bilam']], why:'Famous words from the Torah.'},
{t:'sort', q:'Sort each quote into its sefer.', bins:[{id:'B',label:'Bereishis'},{id:'S',label:'Shemos'},{id:'N',label:'Bamidbar'}], items:[{label:'the voice is the voice of Yaakov',bin:'B'},{label:'Ani Yosef',bin:'B'},{label:'Na\'aseh v\'nishma',bin:'S'},{label:'Let My people go',bin:'S'},{label:'Mah tovu ohalecha',bin:'N'},{label:'the land is very, very good (Yehoshua and Kalev)',bin:'N'}], why:'Knowing the sefer helps you find the story.'},
{t:'spotall', q:'Tap every person who answered Hineni in the Torah.', cells:[{label:'Avraham',ok:true},{label:'Moshe',ok:true},{label:'Yaakov',ok:true},{label:'Paroh',ok:false},{label:'Bilam',ok:false}], why:'Avraham, Yaakov and Moshe answered Hashem\'s call with Hineni.'},
{q:'Who said: Give me children, or I will die?', o:['Rochel','Leah','Sarah'], h:'To Yaakov, in Vayeitzei.', why:'Bereishis 30:1.'},
{t:'type', q:'Klal Yisrael said Na\'aseh v\'____ at Sinai. Type the missing word.', a:"nishma", alt:['nishmah','nishma.'], kb:'abc', why:'We will do and we will listen.'},
{q:'Who said: Who is Hashem that I should listen to Him?', o:['Paroh','Bilam','Korach'], h:'To Moshe and Aharon.', why:'Shemos 5:2.'}
],
check:[
{q:'Who said Ani Yosef?', o:['Yosef','Yehudah','Yaakov']},
{q:'Who said Am I my brother\'s keeper?', o:['Kayin','Hevel','Noach']},
{q:'Who said Na\'aseh v\'nishma?', o:['All Klal Yisrael at Sinai','Moshe alone','Yisro']}
]},
/* ===== ROUND 6 (v220): Parsha deep dives for the coming weeks, Vayeitzei to Vayechi ===== */
'LK.PAR.L02.06':{name:'Parsha Deep Dive: Vayeitzei', band:'5-6', op:'A young man alone at night, a stone for a pillow, and a ladder that reaches the sky. Yaakov is about to discover that Hashem is with him everywhere.', peg:{kind:'ladder',show:'Up and down',say:'Malachim go up and down the ladder: Hashem watches over Yaakov wherever he goes.'},
teach:[
{how:'Opener: Yaakov left Be\'er Sheva for Charan, running from Eisav. At night he slept on the way and dreamed of a ladder with malachim going up and down. Hashem promised to protect him and give the land to his children.', q:'What did Hashem promise Yaakov in the dream?', o:['To protect him and give the land to his children','A palace in Charan','That Eisav would leave']},
{how:'Yaakov woke and said: Hashem is in this place and I did not know! He called the place Beis El, the House of Hashem. Chazal say it was Har Hamoriah, where the Beis Hamikdash would stand.', q:'What did Yaakov call the place?', o:['Beis El','Charan','Chevron']},
{how:'In Charan, Yaakov worked seven years for Rochel, but Lavan gave him Leah. He worked seven more years for Rochel. His children were born there: the beginning of the shevatim.', q:'How many years did Yaakov work in all for his wives?', o:['Fourteen','Seven','Twenty']}
],
we:[
{q:'Together: why did Yaakov leave home?', o:['To escape Eisav and find a wife','To trade sheep','To visit Yishmael'], steps:['Eisav was angry about the brachos.','Rivkah sent Yaakov to her brother Lavan.','Also to marry from the family.']},
{q:'Together: who tricked Yaakov in Charan?', o:['Lavan','Rochel','Leah'], steps:['Yaakov worked for Rochel.','At the wedding Lavan gave him Leah.','Lavan was the trickster.']}
],
practice:[
{t:'order', q:'Put Vayeitzei in order.', tiles:['Yaakov leaves Be\'er Sheva','The ladder dream','Meets Rochel at the well','Works seven years','Marries Leah, then Rochel'], why:'Bereishis 28-29.'},
{t:'pairs', q:'Match each name to its meaning.', pairs:[['Reuven','see, a son!'],['Shimon','Hashem heard'],['Levi','he will accompany me'],['Yehudah','I thank Hashem']], why:'Leah named each son for her feelings (Bereishis 29).'},
{t:'spotall', q:'Tap everything that happened in Parshas Vayeitzei.', cells:[{label:'the ladder dream',ok:true},{label:'Yaakov rolls the stone off the well',ok:true},{label:'Lavan switches Rochel and Leah',ok:true},{label:'Yosef is sold',ok:false},{label:'Yaakov wrestles a malach',ok:false}], why:'Yosef is sold in Vayeishev; the wrestling is in Vayishlach.'},
{t:'type', q:'How many years did Yaakov work for Rochel the first time? Type the number.', a:'7', alt:['seven'], kb:'num', why:'Seven years that seemed like a few days, because he loved her.'},
{q:'What did Yaakov use as a pillow?', o:['Stones','A sack of wheat','A sheepskin'], h:'He slept outside on the road.', why:'Chazal: the stones argued which would be under his head, and became one.'},
{q:'What lesson do we learn from the ladder?', o:['Hashem is with us wherever we go','Ladders are dangerous','Dreams are not important'], h:'Hashem stood over Yaakov.', why:'Hashem promised: I am with you and will guard you wherever you go.'}
],
check:[
{q:'Whom did Yaakov marry first?', o:['Leah','Rochel','Bilhah']},
{q:'Where did Yaakov have the ladder dream?', o:['On the way to Charan','In Mitzrayim','In Lavan\'s house']},
{q:'Who were the malachim going up and down?', o:['Malachim on a ladder to Shamayim','Lavan\'s shepherds','Yaakov\'s sons']}
]},
'LK.PAR.L02.07':{name:'Parsha Deep Dive: Vayishlach', band:'5-6', op:'Twenty years later, Yaakov returns home. Eisav is coming with four hundred men. What do you do when you are afraid?', peg:{kind:'three steps',show:'Gift · Tefillah · Battle-ready',say:'Yaakov prepared three ways: a gift, a tefillah, and getting ready to defend.'},
teach:[
{how:'Opener: Yaakov sent messengers to Eisav and heard Eisav was coming with 400 men. Yaakov prepared in three ways: he sent gifts, he davened to Hashem, and he split his camp in case of a battle.', q:'What three ways did Yaakov prepare to meet Eisav?', o:['Gifts, tefillah, and getting ready to defend','Running away, hiding, crying','Building a wall, a tower, a moat']},
{how:'At night Yaakov wrestled with a malach until dawn. The malach could not win and touched his hip. Yaakov\'s name became Yisrael. That is why we do not eat the gid hanasheh.', q:'What mitzvah comes from Yaakov\'s wrestling?', o:['Not eating the gid hanasheh','Wearing tzitzis','Lighting candles']},
{how:'Eisav ran to Yaakov and hugged him. They parted in peace. Later, Rochel died giving birth to Binyamin and was buried on the road to Beis Lechem.', q:'Where was Rochel buried?', o:['On the way to Beis Lechem','In Me\'aras Hamachpelah','In Charan']}
],
we:[
{q:'Together: why was Rochel buried on the road?', o:['So she could daven for her children going into galus','Because it was raining','By mistake'], steps:['Chazal teach a reason.','Klal Yisrael would pass there going into galus.','Rochel cries for her children.']},
{q:'Together: what new name did Yaakov get?', o:['Yisrael','Yosef','Yehudah'], steps:['The malach could not beat him.','He blessed Yaakov with a new name.','Yisrael: you struggled and won.']}
],
practice:[
{t:'order', q:'Put Vayishlach in order.', tiles:['Messengers to Eisav','Yaakov davens','Wrestling the malach','Meeting Eisav','Binyamin is born'], why:'Bereishis 32-35.'},
{t:'sort', q:'Sort Yaakov\'s three preparations.', bins:[{id:'G',label:'Gift'},{id:'T',label:'Tefillah'},{id:'B',label:'Ready to defend'}], items:[{label:'herds of goats, sheep and camels',bin:'G'},{label:'Save me from my brother!',bin:'T'},{label:'splitting into two camps',bin:'B'}], why:'Rashi on Bereishis 32:9.'},
{t:'spotall', q:'Tap every true fact about Vayishlach.', cells:[{label:'Eisav came with 400 men',ok:true},{label:'Yaakov became Yisrael',ok:true},{label:'Binyamin was born',ok:true},{label:'Yosef dreamed of sheaves',ok:false},{label:'the ladder dream',ok:false}], why:'Vayishlach: the meeting, the wrestling, Binyamin.'},
{t:'type', q:'How many men came with Eisav? Type the number.', a:'400', alt:['four hundred'], kb:'num', why:'Bereishis 32:7.'},
{q:'What did Yaakov say: I am small from all the…', o:['kindnesses You have done for me','money I have','people around me'], h:'Katonti mikol hachasadim.', why:'Yaakov felt unworthy of Hashem\'s kindness: a lesson in humility.'},
{q:'What do we learn from how Yaakov prepared?', o:['Daven and also do our part','Only daven','Only fight'], h:'Hishtadlus and tefillah together.', why:'The Ramban: Yaakov\'s way is a guide for every generation.'}
],
check:[
{q:'Who wrestled with Yaakov?', o:['A malach','Eisav','Lavan']},
{q:'What happened when Yaakov met Eisav?', o:['Eisav hugged him and they parted in peace','They fought a battle','Eisav took his sheep']},
{q:'Which son was born at the end of Vayishlach?', o:['Binyamin','Yosef','Levi']}
]},
'LK.PAR.L02.08':{name:'Parsha Deep Dive: Vayeishev', band:'5-6', op:'A coat of many colors, two dreams, a pit, and a caravan heading to Mitzrayim. One boy\'s journey from his father\'s favorite to a slave.', peg:{kind:'down',show:'Pit → Mitzrayim → Prison',say:'Yosef went down three times, but Hashem was with him every time.'},
teach:[
{how:'Opener: Yaakov loved Yosef and gave him a special coat. Yosef dreamed that his brothers\' sheaves bowed to his sheaf, and that the sun, moon and eleven stars bowed to him. The brothers grew jealous.', q:'What bowed to Yosef in his second dream?', o:['The sun, the moon and eleven stars','Twelve sheep','Paroh\'s servants']},
{how:'The brothers threw Yosef into a pit and sold him to a caravan going to Mitzrayim. Yehudah suggested selling instead of killing.', q:'Who suggested selling Yosef instead of killing him?', o:['Yehudah','Reuven','Shimon']},
{how:'In Mitzrayim Yosef worked for Potifar, and Hashem made everything succeed for him. He was falsely accused and thrown into prison, where he explained the dreams of the butler and the baker.', q:'Whose dreams did Yosef explain in prison?', o:['The butler and the baker','Paroh and his son','Potifar and his wife']}
],
we:[
{q:'Together: why were the brothers jealous?', o:['The coat and the dreams','Yosef was rich','Yosef was the oldest'], steps:['Yaakov gave Yosef a special coat.','Yosef told his dreams of ruling.','The brothers grew jealous.']},
{q:'Together: what did Reuven want to do?', o:['Save Yosef from the pit later','Sell him','Take his coat'], steps:['Reuven said: do not kill him.','Throw him in the pit.','He planned to return and save him.']}
],
practice:[
{t:'order', q:'Put Yosef\'s story in order.', tiles:['The special coat','The two dreams','Thrown into the pit','Sold to Mitzrayim','Prison'], why:'Bereishis 37 and 39-40.'},
{t:'pairs', q:'Match each dream to its dreamer.', pairs:[['sheaves bowing','Yosef'],['three branches of grapes','the butler'],['three baskets of bread','the baker'],['sun, moon and stars','Yosef again']], why:'Bereishis 37 and 40.'},
{t:'spotall', q:'Tap every place Hashem was with Yosef.', cells:[{label:'in Potifar\'s house',ok:true},{label:'in prison',ok:true},{label:'everywhere he went',ok:true},{label:'nowhere',ok:false}], why:'Vayehi Hashem es Yosef: Hashem was with Yosef (39:2, 39:21).'},
{t:'type', q:'How many days until the butler went back to his job, said Yosef? Type the number.', a:'3', alt:['three'], kb:'num', why:'Three branches = three days.'},
{q:'What did the butler do after he was freed?', o:['Forgot about Yosef','Freed Yosef right away','Told Paroh immediately'], h:'The last pasuk of Vayeishev.', why:'Two more years passed (Rashi: for trusting the butler).'},
{q:'Which brother\'s story with Tamar is in Vayeishev?', o:['Yehudah','Dan','Asher'], h:'Peretz and Zerach were born.', why:'From Peretz came Dovid HaMelech.'}
],
check:[
{q:'What did Yaakov give Yosef?', o:['A special coat','A sword','A crown']},
{q:'Where did Yosef end up?', o:['Mitzrayim','Charan','Shechem']},
{q:'Whose dreams did Yosef explain in prison?', o:['The butler and the baker','His brothers','Lavan']}
]},
'LK.PAR.L02.09':{name:'Parsha Deep Dive: Mikeitz', band:'5-6', op:'Two years in prison. Then one night Paroh dreams of cows and grain, and no one in Mitzrayim can explain it. A prisoner is rushed to the palace.', peg:{kind:'seven and seven',show:'7 full · 7 empty',say:'Seven years of plenty, then seven of hunger: store up while you can.'},
teach:[
{how:'Opener: Paroh dreamed of seven fat cows eaten by seven thin cows, and seven full ears of grain swallowed by seven thin ones. Yosef said: It is not me, Hashem will answer. Seven years of plenty, then seven years of hunger.', q:'What did Yosef say before explaining the dream?', o:['It is not me; Hashem will answer','I know everything','Pay me first']},
{how:'Yosef advised storing food during the good years. Paroh made him viceroy. The famine came, and Yaakov\'s sons came to buy food.', q:'What did Paroh make Yosef?', o:['Viceroy, second only to Paroh','A cook','A soldier']},
{how:'Yosef recognized his brothers, but they did not recognize him. He tested them, kept Shimon, and asked for Binyamin. At the end, his silver cup was found in Binyamin\'s sack.', q:'Where was Yosef\'s cup found?', o:['In Binyamin\'s sack','In Reuven\'s tent','In Paroh\'s palace']}
],
we:[
{q:'Together: why did Yosef say "Hashem will answer"?', o:['He gave Hashem the credit','He was shy','He forgot the answer'], steps:['Paroh praised Yosef as a dream reader.','Yosef said: it is not from me.','He gave the credit to Hashem.']},
{q:'Together: why didn\'t the brothers recognize Yosef?', o:['He had grown a beard and looked like a Mitzri ruler','He wore a mask','It was dark'], steps:['They sold him as a young boy.','Now he was a ruler with a beard.','Rashi explains they did not recognize him.']}
],
practice:[
{t:'order', q:'Put Mikeitz in order.', tiles:['Paroh\'s dreams','Yosef explains them','Yosef becomes viceroy','The brothers come for food','The cup in Binyamin\'s sack'], why:'Bereishis 41-44.'},

'LK.PAR.L02.10':{name:'Parsha Deep Dive: Vayigash', band:'5-6', op:'Yehudah steps forward and offers to be a slave instead of Binyamin. Yosef cannot hold back any longer: Ani Yosef!', peg:{kind:'two words',show:'Ani Yosef',say:'Two words changed everything: I am Yosef. Is my father still alive?'},

{how:'Yosef told his brothers: do not be upset. Hashem sent me here before you to save lives. He sent wagons to bring Yaakov down to Mitzrayim.', q:'What did Yosef tell his brothers?', o:['Hashem sent me here to save lives','I will punish you','Go away forever']},
{how:'Yaakov came down to Mitzrayim with seventy family members and settled in Goshen. Yaakov and Yosef met and cried, and Yaakov said Shema.', q:'Where did Yaakov\'s family settle?', o:['Goshen','Shushan','Charan']}
],
we:[
{q:'Together: why did Yehudah step forward?', o:['He had promised to bring Binyamin back','He was the oldest','He wanted the cup'], steps:['Yaakov would not let Binyamin go.','Yehudah promised to be responsible.','So he offered himself.']},
{q:'Together: how many came down to Mitzrayim?', o:['Seventy','Twelve','Six hundred thousand'], steps:['Yaakov, his sons and their families.','The Torah counts them.','Seventy souls.']}
],

{t:'order', q:'Put Vayigash in order.', tiles:['Yehudah\'s plea','Ani Yosef!','Wagons sent for Yaakov','Yaakov comes to Mitzrayim','They settle in Goshen'], why:'Bereishis 44:18-47:27.'},

{t:'pairs', q:'Match each to Vayigash.', pairs:[['Yehudah','offered himself for Binyamin'],['Yosef','Ani Yosef'],['Yaakov','came to Mitzrayim'],['Goshen','where they settled']], why:'Bereishis 44-47.'},

{q:'Which son did Yaakov send ahead to set up a place of Torah in Goshen?', o:['Yehudah','Reuven','Levi'], h:'Rashi on 46:28.', why:'A yeshivah first: Torah comes before everything.'}
],

{q:'Who offered himself as a slave for Binyamin?', o:['Yehudah','Shimon','Levi']},
{q:'Where did the family settle?', o:['Goshen','Yerushalayim','Ninveh']}
]},
'LK.PAR.L02.11':{name:'Parsha Deep Dive: Vayechi', band:'5-6', op:'Yaakov\'s last days: he blesses his grandsons, then his twelve sons, each with his own brachah. Sefer Bereishis ends: chazak!', peg:{kind:'blessing',show:'Ephraim and Menashe',say:'Every Friday night: Yesimcha Elokim k\'Ephraim v\'chi\'Menashe.'},

{how:'Opener: Yaakov lived seventeen years in Mitzrayim. Before he died he blessed Yosef\'s sons, Ephraim and Menashe, crossing his hands to put the right hand on the younger, Ephraim.', q:'Whom did Yaakov bless first, with his right hand?', o:['Ephraim, the younger','Menashe, the older','Yosef']},
{how:'Yaakov blessed each of his twelve sons. Yehudah was called a lion, the one from whom kings would come. Yissachar would learn Torah, and Zevulun would support him through business.', q:'Which son was compared to a lion?', o:['Yehudah','Dan','Naftali']},
{how:'Yaakov was buried in Me\'aras Hamachpelah in Chevron. Yosef promised his brothers to take care of them. Sefer Bereishis ends, and we say chazak, chazak, v\'nischazeik.', q:'Where was Yaakov buried?', o:['Me\'aras Hamachpelah','Mitzrayim','Beis El']}
],
we:[
{q:'Together: why do we bless sons to be like Ephraim and Menashe?', o:['They stayed great Jews even in Mitzrayim','They were the oldest','They were kings'], steps:['They grew up in Mitzrayim.','They stayed loyal to Hashem.','Yaakov said: Yisrael will bless with your names.']},
{q:'Together: what partnership did Yissachar and Zevulun have?', o:['Zevulun supported Yissachar\'s Torah learning','They were enemies','They shared sheep'], steps:['Yissachar learned Torah.','Zevulun worked and supported him.','They share the reward.']}
],
practice:[
{t:'pairs', q:'Match each son to his brachah.', pairs:[['Yehudah','a lion; kings will come from him'],['Zevulun','lives by the sea, in business'],['Yissachar','carries the burden of Torah'],['Naftali','a swift deer']], why:'Bereishis 49.'},
{t:'spotall', q:'Tap every true fact about Vayechi.', cells:[{label:'Yaakov lived 17 years in Mitzrayim',ok:true},{label:'he crossed his hands to bless',ok:true},{label:'he was buried in Chevron',ok:true},{label:'he was buried in Mitzrayim',ok:false},{label:'he blessed only Yosef',ok:false}], why:'Bereishis 47-50.'},
{t:'order', q:'Put Vayechi in order.', tiles:['Yaakov makes Yosef promise to bury him in Eretz Yisrael','Blessing Ephraim and Menashe','Blessing the twelve sons','Burial in Me\'aras Hamachpelah','Yosef comforts his brothers'], why:'Bereishis 47:28-50:26.'},

],

{q:'What is the last parsha of Sefer Bereishis?', o:['Vayechi','Vayigash','Shemos']}
]},
/* ===== ROUND 7 (v222): the Chanukah unit ===== */
'LK.YT.L01.05':{name:'Chanukah 1: The Story of the Little Jar', band:'K-2', op:'Long ago the Beis Hamikdash was dark and messy. The menorah was cold. Then a few brave Jews found one tiny jar of oil…', peg:{kind:'count',show:'1 jar → 8 days',say:'One little jar, eight bright days.'},
teach:[
{how:'Opener: the Yevanim, the Greeks, ruled Eretz Yisrael. They did not let Jews learn Torah, keep Shabbos or make a bris. They made the Beis Hamikdash tamei.', q:'What did the Yevanim try to stop?', o:['Learning Torah and keeping mitzvos','Eating breakfast','Playing ball']},
{how:'A small group of brave Jews, the Chashmona\'im, led by Matisyahu and his son Yehudah HaMaccabi, fought the big Greek army. Hashem helped them win: the few beat the many.', q:'Who won the war?', o:['The few Chashmona\'im, with Hashem\'s help','The big Greek army','Nobody']},
{how:'They cleaned the Beis Hamikdash and wanted to light the menorah. They found only one small jar of pure oil with the Kohen Gadol\'s seal, enough for one day. It burned for eight days!', q:'How long did the little jar of oil burn?', o:['Eight days','One day','One hour']}
],
we:[
{q:'Together: why do we light for eight nights?', o:['The oil burned for eight days','We like candles','There are eight children'], steps:['The jar had oil for one day.','Hashem made it last eight.','So eight nights of lights.']},
{q:'Together: who led the brave Jews?', o:['Matisyahu and Yehudah HaMaccabi','Paroh','Haman'], steps:['A Kohen named Matisyahu started.','His son Yehudah led the army.','He was called HaMaccabi.']}
],
practice:[
{t:'order', q:'Put the Chanukah story in order.', tiles:['The Yevanim make rules against Torah','The Chashmona\'im fight','They win','They find one jar of oil','The oil burns eight days'], why:'The miracle of the war, then the miracle of the oil.'},
{t:'pairs', q:'Match the Chanukah words.', pairs:[['menorah','the lamp we light'],['shamash','the helper candle'],['dreidel','the spinning top'],['latkes','fried in oil']], why:'Everything reminds us of the neis.'},
{t:'spotall', q:'Tap everything we do on Chanukah.', cells:[{label:'light the menorah',ok:true},{label:'eat foods fried in oil',ok:true},{label:'play dreidel',ok:true},{label:'eat matzah',ok:false},{label:'sit in a sukkah',ok:false}], why:'Matzah is Pesach; the sukkah is Sukkos.'},
{t:'type', q:'How many nights is Chanukah? Type the number.', a:'8', alt:['eight'], kb:'num', why:'One for each day the oil burned.'},
{q:'What did the Chashmona\'im find in the Beis Hamikdash?', o:['One jar of pure oil','A box of gold','A Sefer Torah only'], h:'It had the Kohen Gadol\'s seal.', why:'The seal showed the oil was pure.'},
{q:'What does Chanukah mean?', o:['Dedication: the Beis Hamikdash was made ready again','Candle','Eight'], h:'They re-dedicated the Beis Hamikdash.', why:'Chanukah also hints: chanu kah, they rested on the 25th.'}
],
check:[
{q:'Who tried to stop the Jews from keeping the Torah?', o:['The Yevanim','The Plishtim','The Mitzrim']},
{q:'How much oil did they find?', o:['One small jar','Ten big barrels','None']},
{q:'How many days did it burn?', o:['Eight','Three','Forty']}
]},
'LK.YT.L02.07':{name:'Chanukah 2: The Heroes of Chanukah', band:'5-6', op:'An old Kohen who would not bow, five brave brothers, and a whole people who refused to give up the Torah.', peg:{kind:'name',show:'Mi Kamocha Ba\'eilim Hashem',say:'Many say Maccabi stands for Mi kamocha ba\'eilim Hashem: who is like You among the mighty, Hashem?'},
teach:[
{how:'Opener: in the town of Modiin, Greek soldiers ordered the Jews to bow to an idol. Matisyahu the Kohen refused and called out: Whoever is for Hashem, come with me! The Chashmona\'im were born.', q:'What did Matisyahu call out?', o:['Whoever is for Hashem, come with me!','Let us surrender','Run away']},
{how:'Matisyahu had five sons. Yehudah HaMaccabi led the army. Many say the name Maccabi comes from the first letters of Mi kamocha ba\'eilim Hashem.', q:'Who led the army after Matisyahu?', o:['Yehudah HaMaccabi','Yonasan','Shimon']},
{how:'Al Hanissim, which we add on Chanukah, says Hashem gave the strong into the hands of the weak, the many into the hands of the few. The real victory was keeping the Torah.', q:'What does Al Hanissim say Hashem did?', o:['Gave the many into the hands of the few','Made the Jews the biggest army','Gave the Jews gold']}
],
we:[
{q:'Together: where did the revolt begin?', o:['Modiin','Yerushalayim','Mitzrayim'], steps:['Soldiers came to a small town.','They wanted the Jews to bow to an idol.','Matisyahu refused, in Modiin.']},
{q:'Together: what was the war really about?', o:['Keeping the Torah and mitzvos','Land only','Money'], steps:['The Yevanim wanted the Jews to stop the Torah.','The Chashmona\'im fought for the Torah.','Al Hanissim praises Hashem for this.']}
],
practice:[
{t:'pairs', q:'Match each hero.', pairs:[['Matisyahu','the Kohen who refused to bow'],['Yehudah HaMaccabi','led the army'],['Antiochus','the Greek king'],['Modiin','where it began']], why:'The story of Chanukah.'},
{t:'spotall', q:'Tap the phrases from Al Hanissim.', cells:[{label:'the strong into the hands of the weak',ok:true},{label:'the many into the hands of the few',ok:true},{label:'the wicked into the hands of the righteous',ok:true},{label:'the sea split',ok:false}], why:'Al Hanissim lists the miracles of the war.'},
{t:'order', q:'Put the events in order.', tiles:['The Yevanim forbid mitzvos','Matisyahu refuses in Modiin','Yehudah leads the war','The Beis Hamikdash is cleaned','The menorah is lit'], why:'From the decrees to the rededication.'},
{t:'type', q:'How many sons did Matisyahu have? Type the number.', a:'5', alt:['five'], kb:'num', why:'Yochanan, Shimon, Yehudah, Elazar, Yonasan.'},
{q:'Which great women are remembered at Chanukah time?', o:['Yehudis, and Chana with her seven sons','Sarah and Rivkah only','Esther and Vashti'], h:'Their courage is part of the story.', why:'Yehudis helped save the Jews; many have a minhag to eat dairy for her.'},
{q:'What do we add to Shemoneh Esrei and bentching on Chanukah?', o:['Al Hanissim','Ya\'aleh V\'yavo','Aneinu'], h:'For the miracles.', why:'Thanking Hashem for the victory and the light.'}
],
check:[
{q:'Where did the revolt begin?', o:['Modiin','Shushan','Bavel']},
{q:'Who led the Jewish army?', o:['Yehudah HaMaccabi','Antiochus','Haman']},
{q:'What did the Chashmona\'im fight for?', o:['The Torah and the mitzvos','Gold','A new king']}
]},
'LK.YT.L02.08':{name:'Chanukah 3: Dreidel, Gelt and Minhagim', band:'5-6', op:'Why spin a top? Why fried food? Why dairy? Every Chanukah minhag tells part of the story.', peg:{kind:'letters',show:'נ ג ה ש',say:'Neis Gadol Hayah Sham: a great miracle happened there. In Eretz Yisrael: Poh, here!'},
teach:[
{how:'Opener: the dreidel has four letters: Nun, Gimmel, Hei, Shin: Neis Gadol Hayah Sham, a great miracle happened there. In Eretz Yisrael dreidels have a Pei: Poh, here!', q:'What do the dreidel letters stand for?', o:['A great miracle happened there','Happy Chanukah to all','Spin, win, lose, share']},
{how:'One story says that when learning Torah was forbidden, children kept tops nearby. When soldiers came, they pretended to play.', q:'Why, says one story, did children play dreidel?', o:['To hide that they were learning Torah','Because school was closed','For prizes']},
{how:'We eat latkes and sufganiyos fried in oil to remember the neis of the oil. Many eat dairy to remember Yehudis. Many give Chanukah gelt, and some use it to teach giving tzedakah.', q:'Why do many eat dairy foods on Chanukah?', o:['To remember Yehudis','Because meat is forbidden','Because it is cold']}
],
we:[
{q:'Together: which letter is on a dreidel in Eretz Yisrael but not here?', o:['Pei, for Poh, here','Shin','Gimmel'], steps:['Outside Eretz Yisrael: Sham, there.','In Eretz Yisrael the miracle happened here.','So Pei for Poh.']},
{q:'Together: why fried foods?', o:['To remember the oil','They are easier to cook','Tradition with no reason'], steps:['The neis was with oil.','Fried foods use oil.','Latkes and doughnuts remind us.']}
],
practice:[
{t:'pairs', q:'Match each dreidel letter to its word.', pairs:[['נ','Neis'],['ג','Gadol'],['ה','Hayah'],['ש','Sham']], why:'Neis Gadol Hayah Sham.'},
{t:'sort', q:'Sort each minhag by its reason.', bins:[{id:'O',label:'The oil'},{id:'Y',label:'Yehudis'},{id:'T',label:'Learning Torah in secret'}], items:[{label:'latkes',bin:'O'},{label:'sufganiyos',bin:'O'},{label:'cheese',bin:'Y'},{label:'dreidel',bin:'T'}], why:'Each minhag remembers part of the story.'},
{t:'spotall', q:'Tap every Chanukah minhag.', cells:[{label:'dreidel',ok:true},{label:'Chanukah gelt',ok:true},{label:'foods fried in oil',ok:true},{label:'eating in a sukkah',ok:false},{label:'shaking a lulav',ok:false}], why:'Sukkah and lulav belong to Sukkos.'},
{t:'type', q:'Which letter replaces Shin on dreidels in Eretz Yisrael? Type its name.', a:'pei', alt:['pe','pey','peh','fei'], kb:'abc', why:'Pei for Poh: the miracle happened here.'},
{q:'What can Chanukah gelt help teach?', o:['Giving tzedakah and rewarding learning','Gambling','Nothing'], h:'Many give gelt with a learning reward.', why:'A minhag to encourage Torah learning.'},
{q:'How many letters are on a dreidel?', o:['Four','Two','Eight'], h:'One on each side.', why:'Nun, Gimmel, Hei, Shin (or Pei).'}
],
check:[
{q:'What does Neis Gadol Hayah Sham mean?', o:['A great miracle happened there','Happy Chanukah','Light the candles']},
{q:'Why do we eat latkes?', o:['They are fried in oil, for the neis','They are round','Because of Purim']},
{q:'Why do many eat dairy on Chanukah?', o:['To remember Yehudis','For health','For Shavuos']}
]},
'LK.YT.L03.05':{name:'Chanukah 4: Mehadrin and the Halachos in Depth', band:'7-8', op:'The Gemara gives three levels of lighting: the basic mitzvah, the mehadrin, and the mehadrin min hamehadrin. Which one do we do, and why?', peg:{kind:'three levels',show:'1 → each person → add each night',say:'Basic: one light per home. Mehadrin: one for each person. Mehadrin min hamehadrin: adding each night.'},
teach:[
{how:'Opener: the Gemara (Shabbos 21b) says the basic mitzvah is one light per household each night. Mehadrin, those who beautify the mitzvah, light one for each person. Mehadrin min hamehadrin add a light each night.', q:'What is the basic mitzvah, says the Gemara?', o:['One light per household each night','Eight lights every night','One light for all eight days']},
{how:'Beis Hillel say we add a light each night, going up, because in matters of kedushah we go up and not down (ma\'alin bakodesh). Beis Shammai said to go down. The halachah follows Beis Hillel.', q:'Why do we add a light each night?', o:['Ma\'alin bakodesh: we go up in holiness','It is cheaper','Beis Shammai said so']},
{how:'Ashkenazim follow the Rema: each person in the home lights his own menorah. Many Sefardim light one menorah for the household. Lights must be placed where they publicize the neis.', q:'According to the Rema, who lights?', o:['Each person lights his own menorah','Only the father','Only the youngest']}
],
we:[
{q:'Together: why do we go up each night and not down?', o:['Ma\'alin bakodesh','To save oil','Beis Shammai'], steps:['Beis Shammai: count down the days left.','Beis Hillel: count up the days passed.','We go up in holiness: Beis Hillel.']},
{q:'Together: the eighth day of Chanukah is called…', o:['Zos Chanukah','Rosh Chodesh','Shushan'], steps:['On the eighth day we read the Torah.','The reading ends: zos chanukas hamizbeach.','So it is called Zos Chanukah.']}
],
practice:[
{t:'order', q:'Put the three levels in order from basic to best.', tiles:['One light per household','One light for each person','Adding a light each night'], why:'Shabbos 21b: ikar, mehadrin, mehadrin min hamehadrin.'},
{t:'pairs', q:'Match each opinion.', pairs:[['Beis Hillel','add a light each night'],['Beis Shammai','start with eight and go down'],['the Rema','each person lights'],['ma\'alin bakodesh','we go up in holiness']], why:'The halachah follows Beis Hillel; Ashkenazim follow the Rema.'},
{t:'spotall', q:'Tap every true halachah.', cells:[{label:'we say full Hallel all eight days',ok:true},{label:'the Torah is read every day of Chanukah',ok:true},{label:'Al Hanissim is added',ok:true},{label:'we may use the light to read',ok:false},{label:'there is a fast on Chanukah',ok:false}], why:'Full Hallel, Krias HaTorah each day, Al Hanissim; no use of the lights; no fasting.'},
{t:'type', q:'On which daf of Maseches Shabbos is the Gemara of Chanukah? Type the number.', a:'21', alt:['21b','21 b'], kb:'num', why:'Shabbos 21b: mai Chanukah?'},
{q:'Why do many women not do work while the candles burn?', o:['A miracle came through Yehudis and the women, and in honor of the lights','It is a fast','It is Shabbos'], h:'A minhag with deep roots.', why:'Women had a special role in the miracle.'},
{q:'Which parsha is read on Zos Chanukah?', o:['The end of Nasso: the korbanos of the nesi\'im and the menorah','Bereishis','Yisro'], h:'The nesi\'im dedicating the Mishkan.', why:'Chanukah is about dedication; so is the reading.'}
],
check:[
{q:'What is mehadrin min hamehadrin?', o:['Adding a light each night','One light only','No lights']},
{q:'Whom does the halachah follow about adding lights?', o:['Beis Hillel','Beis Shammai','Neither']},
{q:'What is the eighth day called?', o:['Zos Chanukah','Hoshana Rabbah','Shabbos Shuvah']}
]},
};

/* ---------- v207 LESSON UPGRADE (HoS: "not just a question with three options"): every lesson gets an Opener, a peg (memory hook,
   shown on the stuck path), two "Try together" worked examples with fading steps, and three new-kind practice items
   (sort / pairs / spotall / type / order) with a Why? explanation (Why? cards show for bands 5-6 and 7-8). Engine: Activities.html. */
