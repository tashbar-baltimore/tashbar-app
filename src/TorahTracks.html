daily offering stopped", "ok": true}, {"label": "the siege began", "ok": false}, {"label": "Gedaliah was killed", "ok": false}], "h": "Think of breaking: the Tablets and the walls.", "why": "The Mishnah lists these sad events on the Seventeenth of Tammuz."}, {"t": "spotall", "q": "Tap every thing that happened on Tisha B'Av.", "cells": [{"label": "the first Beis Hamikdash was destroyed", "ok": true}, {"label": "the second Beis Hamikdash was destroyed", "ok": true}, {"label": "it was decreed that the generation in the desert would not enter Eretz Yisrael", "ok": true}, {"label": "the city of Beitar was captured", "ok": true}, {"label": "Moshe broke the first Tablets", "ok": false}, {"label": "the siege began", "ok": false}], "h": "The Tablets were broken on the Seventeenth of Tammuz.", "why": "The Mishnah lists these sad events on Tisha B'Av."}, {"t": "sort", "q": "Sort: one of the four fasts of the destruction, or not?", "bins": [{"id": "Y", "label": "One of the four"}, {"id": "N", "label": "Not one of the four"}], "items": [{"label": "Tisha B'Av", "bin": "Y"}, {"label": "The Tenth of Teves", "bin": "Y"}, {"label": "The Fast of Gedaliah", "bin": "Y"}, {"label": "The Seventeenth of Tammuz", "bin": "Y"}, {"label": "Yom Kippur", "bin": "N"}, {"label": "The Fast of Esther", "bin": "N"}], "h": "Two of these are fasts, but not about the destruction.", "why": "The four fasts remember the destruction. Yom Kippur is from the Torah, and the Fast of Esther is named for Queen Esther, who asked all the Jews to fast and daven before she went to the king to save them."}, {"t": "type", "q": "On which day of Teves do we fast? Type the number.", "a": "10", "alt": ["ten", "tenth", "10th"], "h": "The fast is called the ___ of Teves.", "why": "The Tenth of Teves, when the siege began."}, {"t": "order", "q": "Put the sad weeks of summer in order.", "tiles": ["The Seventeenth of Tammuz", "Rosh Chodesh Av: the Nine Days begin", "Tisha B'Av"], "h": "The Three Weeks begin with a fast and end with a fast.", "why": "The Three Weeks start on the Seventeenth of Tammuz; the Nine Days start at Rosh Chodesh Av; then Tisha B'Av."}, {"t": "spotall", "q": "Tap every fast that comes in the summer.", "cells": [{"label": "the Seventeenth of Tammuz", "ok": true}, {"label": "Tisha B'Av", "ok": true}, {"label": "the Tenth of Teves", "ok": false}, {"label": "the Fast of Gedaliah", "ok": false}], "h": "Tammuz and Av are summer months.", "why": "Teves is in winter and Tishrei is in the fall."}], "check": [{"t": "order", "q": "Put the four fasts in the order of the story.", "tiles": ["The Tenth of Teves", "The Seventeenth of Tammuz", "Tisha B'Av", "The Fast of Gedaliah"]}, {"q": "What does the Tenth of Teves remember?", "o": ["The siege of Yerushalayim began", "The walls were broken", "Gedaliah was killed"]}, {"q": "When is the Fast of Gedaliah?", "o": ["The day after Rosh Hashanah", "The day before Pesach", "The day after Purim"]}]},
'LK.CHEM.L03.06':{name:"Chemdas 18: The 613 Mitzvos and the Seven Mitzvos of Bnei Noach","band": "6-8", "peg": {"kind": "rhyme", "show": "248 + 365 = 613", "say": "248 to do, like our limbs; 365 not to do, like the days of the year."}, "op": "613 mitzvos, and every part of you and every day of the year helps you remember them!", "teach": [{"how": "The Gemara in Makkos teaches: 613 mitzvos were given to Moshe. 365 are mitzvos not to do, like the 365 days of the year. 248 are mitzvos to do, like the 248 limbs of a person.", "q": "How many mitzvos are mitzvos to do?", "o": ["248", "365", "613"], "h": "Like the limbs of a person."}, {"how": "Mitzvos to do: say Shema, honor your father and mother, put on tefillin. Mitzvos not to do: do not steal, do not take revenge. The Rambam listed all 613 in his Sefer Hamitzvos.", "q": "Is \"do not steal\" a mitzvah to do, or not to do?", "o": ["Not to do", "To do", "Neither one"], "h": "It starts with: do not."}, {"how": "All people, not only Jews, must keep the seven mitzvos of Bnei Noach: no idol worship, no cursing Hashem, no murder, no stealing, no immorality, no eating a limb from a living animal, and setting up courts of justice.", "q": "How many mitzvos must all people keep?", "o": ["Seven", "Ten", "613"], "h": "Named for Noach and his children."}], "we": [{"q": "Together: 248 plus 365 is...", "o": ["613", "603", "713"], "steps": ["248 plus 300 is 548.", "548 plus 65 is 613.", "613 mitzvos in all."]}, {"q": "Together: which is one of the seven mitzvos of Bnei Noach?", "o": ["Set up courts of justice", "Keep Shabbos", "Eat matzah on Pesach"], "steps": ["Bnei Noach means all people, the children of Noach.", "Shabbos and matzah are mitzvos for Jews.", "All people must set up courts of justice."]}], "practice": [{"t": "sort", "q": "Sort: a mitzvah to do, or not to do?", "bins": [{"id": "D", "label": "To do (248)"}, {"id": "N", "label": "Not to do (365)"}], "items": [{"label": "honor your father and mother", "bin": "D"}, {"label": "say Shema morning and night", "bin": "D"}, {"label": "love your fellow Jew as yourself", "bin": "D"}, {"label": "do not steal", "bin": "N"}, {"label": "do not take revenge", "bin": "N"}, {"label": "do not hate your brother in your heart", "bin": "N"}], "h": "Look for the words: do not.", "why": "Mitzvos to do tell us to act; mitzvos not to do tell us to stop."}, {"t": "pairs", "q": "Match each number to its meaning.", "pairs": [["613", "all the mitzvos"], ["248", "mitzvos to do"], ["365", "mitzvos not to do"], ["7", "mitzvos of Bnei Noach"]], "h": "The biggest number is all of them.", "why": "613 in all: 248 to do and 365 not to do. All people keep 7."}, {"t": "pairs", "q": "Match each number to what it is like.", "pairs": [["248", "the limbs of a person"], ["365", "the days of the year"], ["613", "all the mitzvos given to Moshe"]], "h": "A year has 365 days.", "why": "The Gemara in Makkos gives these two signs."}, {"t": "spotall", "q": "Tap every one of the seven mitzvos of Bnei Noach.", "cells": [{"label": "no idol worship", "ok": true}, {"label": "no murder", "ok": true}, {"label": "no stealing", "ok": true}, {"label": "set up courts of justice", "ok": true}, {"label": "no eating a limb from a living animal", "ok": true}, {"label": "keep Shabbos", "ok": false}, {"label": "fast on Yom Kippur", "ok": false}], "h": "They are for all people, not only for Jews.", "why": "Shabbos and Yom Kippur are mitzvos for Jews."}, {"t": "type", "q": "248 to do plus 365 not to do: how many mitzvos in all? Type the number.", "a": "613", "alt": ["six hundred thirteen", "six hundred and thirteen"], "h": "Add them up.", "why": "248 plus 365 is 613."}, {"t": "sort", "q": "Sort: for all people, or only for Jews?", "bins": [{"id": "A", "label": "All people (Bnei Noach)"}, {"id": "J", "label": "Only for Jews"}], "items": [{"label": "no murder", "bin": "A"}, {"label": "no stealing", "bin": "A"}, {"label": "set up courts of justice", "bin": "A"}, {"label": "keep Shabbos", "bin": "J"}, {"label": "say Shema", "bin": "J"}, {"label": "eat matzah on Pesach night", "bin": "J"}], "h": "Bnei Noach have only seven.", "why": "Jews keep all 613; all people keep the seven."}, {"t": "order", "q": "Build the teaching of the Gemara in Makkos in order.", "tiles": ["613 mitzvos were given to Moshe", "365 not to do, like the days of the year", "248 to do, like the limbs of a person"], "h": "The Gemara says the not-to-do number first.", "why": "Rabbi Simlai taught: 613 mitzvos, 365 not to do, 248 to do."}, {"t": "spotall", "q": "Tap every mitzvah to do.", "cells": [{"label": "give tzedakah", "ok": true}, {"label": "learn Torah", "ok": true}, {"label": "put a mezuzah on the door", "ok": true}, {"label": "hear the shofar on Rosh Hashanah", "ok": true}, {"label": "do not take revenge", "ok": false}, {"label": "do not hold a grudge", "ok": false}], "h": "A mitzvah to do is something we act on.", "why": "Tzedakah, learning, mezuzah and shofar are mitzvos to do."}, {"t": "order", "q": "Put the numbers in order, smallest to biggest.", "tiles": ["7 mitzvos of Bnei Noach", "248 to do", "365 not to do", "613 in all"], "h": "Seven is the smallest.", "why": "7, 248, 365, 613."}, {"t": "pairs", "q": "Match the teacher to what he did.", "pairs": [["Rabbi Simlai", "taught 613 is 365 and 248"], ["the Rambam", "listed every mitzvah in Sefer Hamitzvos"], ["Moshe Rabbeinu", "received the 613 mitzvos"]], "h": "Moshe received them at Sinai.", "why": "Moshe received them; Rabbi Simlai taught the count; the Rambam listed them."}, {"t": "sort", "q": "Sort these mitzvos of the year: to do, or not to do?", "bins": [{"id": "D", "label": "To do"}, {"id": "N", "label": "Not to do"}], "items": [{"label": "eat matzah on Pesach night", "bin": "D"}, {"label": "sit in the sukkah", "bin": "D"}, {"label": "do not eat chametz on Pesach", "bin": "N"}, {"label": "do not do work on Yom Kippur", "bin": "N"}], "h": "Look for the words: do not.", "why": "Matzah and sukkah are to do; chametz and work on Yom Kippur are not to do."}], "check": [{"t": "order", "q": "Build the count.", "tiles": ["248 to do", "plus 365 not to do", "is 613"]}, {"q": "The 365 mitzvos not to do are like...", "o": ["the days of the year", "the limbs of a person", "the months of the year"]}, {"q": "Which is one of the seven mitzvos of Bnei Noach?", "o": ["No stealing", "Keep Shabbos", "Say Shema"]}]}
};

try{ const CT={"LK.CHEM.L01.01": {"big": "Three fathers and four mothers: the great first family of Klal Yisrael.", "hook": "A tent open to guests, a well, and many thirsty camels!", "intro": ["Three fathers: Avraham, Yitzchak and Yaakov.", "We call them the fathers, אָבוֹת.", "Four mothers: Sarah, Rivkah, Rochel and Leah.", "Sarah welcomed guests with Avraham.", "Rivkah gave water to all the camels."], "ex": [{"q": "Who gave water to all the camels?", "pic": "גַּם לִגְמַלֶּיךָ אֶשְׁאָב עַד אִם כִּלּוּ לִשְׁתֹּת", "steps": ["Avraham's servant came to a well.", "Rivkah gave him water to drink.", "Then she said: I will draw for your camels too!"], "a": "Rivkah"}, {"q": "Where are the fathers buried?", "pic": "מְעָרַת הַמַּכְפֵּלָה", "steps": ["Avraham and Sarah, Yitzchak and Rivkah.", "Yaakov and Leah, all in Me'aras Hamachpelah.", "Rochel is on the way to Beis Lechem."], "a": "Me'aras Hamachpelah"}], "oops": {"q": "Is Rochel buried in Me'aras Hamachpelah?", "wrong": "yes", "right": "no, on the way to Beis Lechem", "why": "Sarah, Rivkah and Leah rest there with the fathers."}, "idea": ["Three fathers, four mothers, one great family.", "Sarah welcomed guests; Rivkah watered the camels."], "try": {"q": "Who was Yitzchak's mother?", "o": ["Sarah", "Rivkah", "Leah"], "a": "Sarah", "steps": ["Yitzchak was the son of Avraham.", "The wife of Avraham was Sarah."]}, "joke": "How many camels did Rivkah water? All of them, with a smile!"}, "LK.CHEM.L01.02": {"big": "Yaakov had twelve sons, from Reuven to Binyamin.", "hook": "Twelve brothers at one table! Can we name them all?", "remember": "Yaakov was the third father. Now meet his sons!", "intro": ["Yaakov had twelve sons.", "They are the fathers of the tribes.", "We call them the שְׁבָטִים.", "Leah was the mother of six. Rochel: Yosef and Binyamin.", "We learn them in birth order, as Bereishis tells."], "ex": [{"q": "Who are the first four sons?", "pic": "וְאֵלֶּה שְׁמוֹת בְּנֵי יִשְׂרָאֵל הַבָּאִים מִצְרָיְמָה אֵת יַעֲקֹב אִישׁ וּבֵיתוֹ בָּאוּ", "steps": ["The Chumash tells the names of the sons.", "First Reuven, then Shimon.", "Then Levi, then Yehudah."], "a": "Reuven, Shimon, Levi, Yehudah"}, {"q": "Who was born right before Binyamin?", "steps": ["Binyamin was the youngest.", "Say the end: Yissachar, Zevulun, Yosef, Binyamin.", "Right before him is Yosef."], "a": "Yosef"}], "oops": {"q": "Was Yosef the oldest son?", "wrong": "yes", "right": "no, Reuven was the oldest", "why": "Yosef was born near the end. Only Binyamin came after him."}, "idea": ["Twelve sons of Yaakov.", "Oldest Reuven, youngest Binyamin."], "try": {"q": "Who was the oldest son of Yaakov?", "o": ["Reuven", "Binyamin", "Dan"], "a": "Reuven", "steps": ["He was born first.", "His name starts the list."]}, "joke": "Why did Yaakov need a big table? Twelve hungry sons!"}, "LK.CHEM.L01.03": {"big": "The Chumash has five books, from Bereishis to Devarim.", "hook": "Hold up one hand. Five fingers, five books!", "intro": ["The Chumash has five books.", "Moshe Rabbeinu wrote them, as Hashem told him.", "Bereishis, Shemos, Vayikra, Bamidbar, Devarim.", "One finger for each book."], "ex": [{"q": "Who gave us the Torah, as Hashem told him?", "pic": "תּוֹרָה צִוָּה־לָנוּ מֹשֶׁה מוֹרָשָׁה קְהִלַּת יַעֲקֹב", "steps": ["Moshe gave us the Torah.", "It belongs to all of Klal Yisrael."], "a": "Moshe Rabbeinu"}, {"q": "Which book is third?", "steps": ["Bereishis is one.", "Shemos is two.", "Vayikra is three."], "a": "Vayikra"}], "oops": {"q": "Is Devarim the first book?", "wrong": "yes", "right": "no, Bereishis is first", "why": "Devarim is the fifth and last book."}, "idea": ["Five books: Bereishis, Shemos, Vayikra, Bamidbar, Devarim.", "Bereishis first, Devarim last."], "try": {"q": "Which book comes right after Bereishis?", "o": ["Shemos", "Devarim", "Bamidbar"], "a": "Shemos", "steps": ["Bereishis is one.", "The next one is two."]}, "joke": "Why was the Chumash so calm? Five books to lean on!"}, "LK.CHEM.L01.04": {"big": "Hashem made the world in six days, and rested on Shabbos.", "hook": "Sun first or trees first? You might be surprised!", "intro": ["Day one: light. Day two: the sky.", "Day three: land, seas, grass and trees.", "Day four: sun, moon and stars.", "Day five: fish and birds. Day six: animals, Adam and Chava.", "Day seven: Shabbos. Hashem stopped creating."], "ex": [{"q": "What does the Torah say after each day?", "pic": "וַיְהִי עֶרֶב וַיְהִי בֹקֶר יוֹם אֶחָד", "steps": ["There was evening.", "There was morning.", "That is day one."], "a": "evening and morning, one day"}, {"q": "What was made the day after the trees?", "pic": "וַיְכֻלּוּ הַשָּׁמַיִם וְהָאָרֶץ וְכָל־צְבָאָם", "steps": ["Trees were made on day three.", "The next day is day four.", "Sun, moon and stars."], "a": "sun, moon and stars"}], "oops": {"q": "Were the trees made after the sun?", "wrong": "yes", "right": "no, trees came on day three", "why": "The sun came on day four, after the trees."}, "idea": ["Six days of making, one day of rest.", "Light first, Adam and Chava last, then Shabbos."], "try": {"q": "On which day were the fish made?", "o": ["Day five", "Day one", "Day three"], "a": "Day five", "steps": ["Fish and birds came together.", "That was day five."]}, "joke": "Why are fish and birds friends? Same birthday: day five!"}, "LK.CHEM.L01.05": {"big": "Twelve months, from Tishrei to Elul, and round again.", "hook": "The months go round like a wheel. Hop on!", "intro": ["A regular year has twelve months.", "Tishrei, Cheshvan, Kislev, Teves.", "Shevat, Adar, Nissan, Iyar.", "Sivan, Tammuz, Av, Elul."], "ex": [{"q": "Which month does the Torah call the first month?", "pic": "הַחֹדֶשׁ הַזֶּה לָכֶם רֹאשׁ חֳדָשִׁים רִאשׁוֹן הוּא לָכֶם לְחׇדְשֵׁי הַשָּׁנָה", "steps": ["Hashem told Moshe about this month.", "It is the month we left Mitzrayim.", "It is Nissan."], "a": "Nissan"}, {"q": "Which month comes after Elul?", "steps": ["Elul is the last month.", "Then the wheel goes round.", "Tishrei starts again."], "a": "Tishrei"}], "oops": {"q": "Is Rosh Hashanah in Nissan?", "wrong": "yes", "right": "no, Rosh Hashanah is in Tishrei", "why": "The Torah calls Nissan first, but the new year starts in Tishrei."}, "idea": ["Twelve months, Tishrei to Elul.", "Some years, two months of Adar."], "try": {"q": "Which month comes right after Nissan?", "o": ["Iyar", "Adar", "Sivan"], "a": "Iyar", "steps": ["Say: Adar, Nissan...", "Next comes Iyar."]}, "joke": "Why is Adar so happy? Some years it comes twice!"}, "LK.CHEM.L01.06": {"big": "Each Yom Tov has its own month in the year.", "hook": "Twelve month boxes. Which ones hold a Yom Tov?", "remember": "Remember the months? Now let us fill them!", "intro": ["Tishrei: Rosh Hashanah, Yom Kippur, Sukkos, Simchas Torah.", "Kislev: Chanukah starts.", "Adar: Purim. Queen Esther and Mordechai saved us.", "Nissan: Pesach. Sivan: Shavuos and Megillas Rus."], "ex": [{"q": "In which month is Pesach?", "pic": "פֶּסַח", "steps": ["We left Mitzrayim in Nissan.", "Chazal teach: in the merit of the righteous women.", "So Pesach is in Nissan."], "a": "Nissan"}, {"q": "Which Yom Tov is in Sivan?", "pic": "שָׁבוּעוֹת", "steps": ["We got the Torah in Sivan.", "On Shavuos we read Megillas Rus.", "So Shavuos is in Sivan."], "a": "Shavuos"}], "oops": {"q": "Is Chanukah in Tishrei?", "wrong": "yes", "right": "no, Chanukah starts in Kislev", "why": "Tishrei has Rosh Hashanah, Yom Kippur and Sukkos."}, "idea": ["Say the month, find the Yom Tov.", "Purim: Queen Esther and Mordechai saved Klal Yisrael."], "try": {"q": "In which month is Rosh Hashanah?", "o": ["Tishrei", "Adar", "Sivan"], "a": "Tishrei", "steps": ["Rosh Hashanah starts the new year.", "The year starts in Tishrei."]}, "joke": "Which month is never bored? Tishrei, it has the most Yomim Tovim!"}, "LK.CHEM.L02.01": {"big": "Tanach has three parts and 24 sefarim: תּוֹרָה (5), נְבִיאִים (8), כְּתוּבִים (11).", "hook": "Imagine a library with only three shelves, and every sefer has its place!", "remember": "You already know the five Chumashim. They are the first shelf!", "intro": ["Shelf one: תּוֹרָה, the five Chumashim.", "Shelf two: נְבִיאִים, eight sefarim.", "Shelf three: כְּתוּבִים, eleven sefarim.", "Five plus eight plus eleven is twenty-four."], "ex": [{"q": "Where does Sefer Shmuel go?", "steps": ["Is it one of the five Chumashim? No.", "Is it one of the eight sefarim of Nevi'im? Yes!"], "a": "Nevi'im"}, {"q": "Where does Tehillim go?", "steps": ["Not a Chumash.", "Not one of the eight Nevi'im.", "So it is in Kesuvim."], "a": "Kesuvim", "pic": "Three shelves: 5, 8, 11"}], "oops": {"q": "Trei Asar has twelve nevi'im. Does it count as twelve sefarim?", "wrong": "yes, twelve", "right": "no, one sefer", "why": "All twelve are in one sefer, so Tanach has 24."}, "idea": ["Torah, Nevi'im, Kesuvim: five, eight, eleven.", "Twenty-four sefarim in all."], "try": {"q": "Mishlei goes on which shelf?", "o": ["Kesuvim", "Torah", "Nevi'im"], "a": "Kesuvim", "steps": ["Not a Chumash.", "Not one of the eight Nevi'im."]}, "joke": "Why did the bookshelf smile? It had 24 good friends to hold!"}, "LK.CHEM.L02.02": {"big": "Each פָּרָשָׁה belongs to one Chumash, and they go in order all year.", "hook": "Every Shabbos a new parsha. Can you sing them like a train?", "remember": "Remember the five Chumashim? Each one is full of parshiyos.", "intro": ["The Torah has 54 parshiyos.", "בְּרֵאשִׁית has 12, from Bereishis to Vayechi.", "שְׁמוֹת has 11, from Shemos to Pekudei.", "Each sefer starts with a parsha of its own name."], "ex": [{"q": "Which sefer is Vayigash in?", "steps": ["Bereishis ends with Mikeitz, Vayigash, Vayechi.", "So Vayigash is in Bereishis."], "a": "Bereishis"}, {"q": "What comes after Bo?", "steps": ["Shemos, Va'eira, Bo...", "Next is Beshalach, when the sea splits."], "a": "Beshalach", "pic": "A train: Shemos, Va'eira, Bo, Beshalach"}], "oops": {"q": "Is Parshas Shemos in Sefer Bereishis?", "wrong": "yes", "right": "no, it starts Sefer Shemos", "why": "Each sefer starts with a parsha of its own name."}, "idea": ["Twelve in Bereishis, eleven in Shemos.", "Sing them in order and you will never forget."], "try": {"q": "What comes after Lech Lecha?", "o": ["Vayera", "Noach", "Toldos"], "a": "Vayera", "steps": ["Bereishis, Noach, Lech Lecha...", "Then Vayera."]}, "joke": "Why is the parsha train never late? It always runs on Torah time!"}, "LK.CHEM.L02.03": {"big": "Hashem sent ten מַכּוֹת on מִצְרַיִם, in order, until פַּרְעֹה let Klal Yisrael go.", "hook": "A river turns red! Frogs everywhere! What comes next? Ten in a row!", "remember": "This is the story we tell at the Pesach seder. Chazal teach: in the merit of the righteous women, Klal Yisrael was redeemed from Mitzrayim.", "intro": ["One: blood. Two: frogs. Three: lice.", "Four: wild animals. Five: cattle disease. Six: boils.", "Seven: hail. Eight: locusts. Nine: darkness.", "Ten: the death of the firstborn."], "ex": [{"q": "What came right after boils?", "steps": ["Boils is six.", "Seven is hail, with fire inside it."], "a": "hail"}, {"q": "Which plague ate what the hail left?", "steps": ["After hail came number eight.", "Locusts covered the land."], "a": "locusts", "pic": "אַרְבֶּה after the hail"}], "oops": {"q": "Was darkness the last plague?", "wrong": "yes", "right": "no, it was ninth", "why": "The tenth was the death of the firstborn."}, "idea": ["Ten plagues, in groups of three, three and four.", "Pharaoh was stubborn, but Hashem's plan came true.", "At the sea, מִרְיָם led the women in שִׁירָה with drums."], "try": {"q": "Which plague came right after wild animals?", "o": ["Cattle disease", "Lice", "Hail"], "a": "Cattle disease", "steps": ["Wild animals is four.", "Five is cattle disease."]}, "joke": "Why did the frog visit Pharaoh's palace? He wanted to hop to the top!"}, "LK.CHEM.L02.04": {"big": "After Moshe came Yehoshua, then the judges, then the kings: שָׁאוּל, דָּוִד, שְׁלֹמֹה.", "hook": "A relay race of heroes! Who takes the baton after Moshe?", "remember": "Sefer Yehoshua, Shoftim and Shmuel are the first sefarim of Nevi'im.", "intro": ["יְהוֹשֻׁעַ led the people into Eretz Yisrael.", "The judges led next: Devorah, Gideon, Shimshon and more.", "Devorah, a prophet, judged Klal Yisrael under a palm tree.", "שְׁמוּאֵל was a great navi and the last judge.", "Then came the kings: Shaul, Dovid and Shlomo."], "ex": [{"q": "What does the pasuk tell us about Devorah?", "pic": "וּדְבוֹרָה אִשָּׁה נְבִיאָה אֵשֶׁת לַפִּידוֹת הִיא שֹׁפְטָה אֶת־יִשְׂרָאֵל בָּעֵת הַהִיא", "steps": ["Devorah was a prophet.", "She was the judge of Klal Yisrael at that time.", "With Barak she led the victory over Sisra."], "a": "a prophet who judged Klal Yisrael"}, {"q": "Who was king after Dovid?", "steps": ["Dovid had a son.", "His son was the wisest of all."], "a": "Shlomo", "pic": "A מֶלֶךְ crown passed from father to son"}], "oops": {"q": "Was Dovid the first king?", "wrong": "yes", "right": "no, Shaul was first", "why": "Shmuel anointed Shaul first, and later Dovid."}, "idea": ["Leader, then judges like Devorah, Gideon and Shimshon, then kings.", "Shaul, Dovid, Shlomo."], "try": {"q": "Which tribe was Shaul from?", "o": ["Binyamin", "Yehudah", "Levi"], "a": "Binyamin", "steps": ["Dovid was from Yehudah.", "Shaul was from Binyamin."]}, "joke": "Why did Shimshon never need a moving truck? He carried the city gates himself!"}, "LK.CHEM.L02.05": {"big": "The מִשְׁנָה has six sedarim: זְרָעִים, מוֹעֵד, נָשִׁים, נְזִיקִין, קָדָשִׁים, טָהֳרוֹת.", "hook": "Six letters hold the whole Mishnah. Ready to crack the code?", "remember": "Rabbi Yehudah Hanasi wrote the Mishnah down so it would never be forgotten.", "intro": ["Zeraim: plants and farming.", "Moed: Shabbos and Yom Tov.", "Nashim: marriage, the Jewish home, and promises. Nezikin: damages and courts.", "Kodashim: offerings. Taharos: purity.", "First letters: זְמַן נָקַט."], "ex": [{"q": "Masechta Sukkah is in which seder?", "steps": ["Sukkos is a Yom Tov.", "Yom Tov is in Moed."], "a": "Moed"}, {"q": "What is the fourth seder?", "steps": ["Zeraim, Moed, Nashim...", "Fourth is Nezikin."], "a": "Nezikin", "pic": "Six shelves: זְרָעִים מוֹעֵד נָשִׁים נְזִיקִין קָדָשִׁים טָהֳרוֹת"}], "oops": {"q": "Is Masechta Brachos in Moed?", "wrong": "yes", "right": "no, it is in Zeraim", "why": "Brachos opens the very first seder, Zeraim."}, "idea": ["Six sedarim, always in the same order.", "Every masechta has its own seder."], "try": {"q": "Pirkei Avos is in which seder?", "o": ["Nezikin", "Zeraim", "Taharos"], "a": "Nezikin", "steps": ["Avos is with the courts and judges.", "That is Nezikin."]}, "joke": "Why did the talmid bring a ladder to the Mishnah? To reach all six shelves!"}, "LK.CHEM.L02.06": {"big": "A נָבִיא brings Hashem's message. נְבִיאִים has eight sefarim, and Chazal count seven women prophets.", "hook": "A big fish, fire from the sky, dry bones! Which navi was that?", "remember": "Nevi'im is the second shelf of Tanach, with eight sefarim.", "intro": ["Early four: Yehoshua, Shoftim, Shmuel, Melachim.", "Late four: Yeshayahu, Yirmiyahu, Yechezkel, Trei Asar.", "Trei Asar holds twelve nevi'im, like יוֹנָה.", "אֵלִיָּהוּ and אֱלִישָׁע are in Sefer Melachim.", "Seven women prophets: Sarah, Miriam, Devorah, Chana, Avigail, Chuldah, אֶסְתֵּר.", "Chana's תְּפִלָּה teaches us how to daven."], "ex": [{"q": "Where do we read about Elisha?", "steps": ["He has no sefer of his own.", "He was Eliyahu's student.", "Both are in Melachim."], "a": "Melachim"}, {"q": "Is Yechezkel early or late?", "steps": ["Early four: Yehoshua, Shoftim, Shmuel, Melachim.", "Yechezkel is not there.", "So he is late."], "a": "late", "pic": "Two rows of four books"}], "oops": {"q": "Does Yonah have a big sefer of his own?", "wrong": "yes", "right": "no, he is in Trei Asar", "why": "Yonah is one of the twelve in Trei Asar."}, "idea": ["Four early, four late.", "Seven women prophets, from Sarah to Esther."], "try": {"q": "Where do we read about Nasan?", "o": ["Shmuel", "Melachim", "Trei Asar"], "a": "Shmuel", "steps": ["Nasan spoke to King Dovid.", "Dovid is in Sefer Shmuel."]}, "joke": "Why was Yonah never lonely at sea? He was too busy having a fin-tastic time!"}, "LK.CHEM.L03.01": {"big": "The Rambam taught thirteen principles of faith: five about Hashem, four about the nevi'im and the Torah, four about reward and the future.", "hook": "If the Torah is a building, these thirteen are its foundation stones. Let us lay them, one by one!", "remember": "We already know the sefarim of Tanach and the nevi'im. Today: what every Jew believes.", "intro": ["The Rambam counted thirteen principles of faith.", "Each line in the siddur begins with the words אֲנִי מַאֲמִין: I believe.", "Principles 1 to 5 are about Hashem.", "Principles 6 to 9 are about the nevi'im and the Torah.", "Principles 10 to 13 are about reward and the future."], "ex": [{"q": "What does the eighth principle say?", "pic": "אֲנִי מַאֲמִין בֶּאֱמוּנָה שְׁלֵמָה שֶׁכָּל הַתּוֹרָה הַמְּצוּיָה עַתָּה בְיָדֵינוּ הִיא הַנְּתוּנָה לְמשֶׁה רַבֵּנוּ עָלָיו הַשָּׁלוֹם", "steps": ["Read: the whole Torah that we have now.", "It is the same Torah given to Moshe Rabbeinu."], "a": "The whole Torah we have was given to Moshe"}, {"q": "What is the fifth principle?", "steps": ["Principles 1 to 4 tell us who Hashem is.", "Principle 5 tells us what we do: daven only to Hashem."], "a": "We daven only to Hashem"}], "oops": {"q": "Is \"Moshiach will come\" the last principle?", "wrong": "yes", "right": "no, it is the twelfth", "why": "The thirteenth and last is that the dead will live again."}, "idea": ["Thirteen principles: Hashem, the Torah, and the future.", "Saying them keeps our faith strong every day."], "try": {"q": "Which principle says Hashem is One?", "o": ["The second", "The fifth", "The ninth"], "a": "The second", "steps": ["First: Hashem created everything.", "Second: Hashem is One."]}, "joke": "Why did the boy bring a ladder to learn the principles? He wanted to climb all thirteen steps!"}, "LK.CHEM.L03.02": {"big": "The Torah came to us link by link: Moshe, Yehoshua, the Elders, the Nevi'im, the Great Assembly; then Tannaim, Amoraim, Geonim, Rishonim, Acharonim.", "hook": "Could a message pass from person to person for thousands of years and stay perfect? Only if every link is a great Torah teacher!", "remember": "Last time: the Thirteen Principles. Number 8 says the whole Torah was given to Moshe.", "intro": ["Pirkei Avos begins with a chain.", "Moshe received the Torah at Sinai.", "He passed it to Yehoshua.", "Then the Elders, the Nevi'im, and the Great Assembly.", "After them: Tannaim, Amoraim, Geonim, Rishonim, Acharonim."], "ex": [{"q": "What does the first mishnah of Pirkei Avos say?", "pic": "מֹשֶׁה קִבֵּל תּוֹרָה מִסִּינַי, וּמְסָרָהּ לִיהוֹשֻׁעַ, וִיהוֹשֻׁעַ לִזְקֵנִים, וּזְקֵנִים לִנְבִיאִים, וּנְבִיאִים מְסָרוּהָ לְאַנְשֵׁי כְנֶסֶת הַגְּדוֹלָה", "steps": ["Moshe received the Torah from Sinai.", "He passed it to Yehoshua, then the Elders, then the Nevi'im.", "The Nevi'im passed it to the Men of the Great Assembly."], "a": "Moshe, Yehoshua, the Elders, the Nevi'im, the Great Assembly"}, {"q": "After the Great Assembly, which eras came?", "steps": ["Tannaim: the Mishnah.", "Amoraim: the Gemara.", "Then the Geonim, the Rishonim and the Acharonim."], "a": "Tannaim, Amoraim, Geonim, Rishonim, Acharonim"}], "oops": {"q": "Did Moshe give the Torah straight to the Elders?", "wrong": "yes", "right": "no, first to Yehoshua", "why": "Yehoshua was Moshe's student. Then came the Elders."}, "idea": ["Every link learned from the one before.", "Our rebbeim are links in that same chain."], "try": {"q": "Who received the Torah from the Nevi'im?", "o": ["The Men of the Great Assembly", "The Elders", "The Geonim"], "a": "The Men of the Great Assembly", "steps": ["Moshe, Yehoshua, the Elders, the Nevi'im...", "Next: the Men of the Great Assembly."]}, "joke": "Why is the chain of Torah never rusty? Every link keeps learning!"}, "LK.CHEM.L03.03": {"big": "Each era gave us a great sefer: Mishnah, Gemara, Rashi, the Rambam's Mishneh Torah, the Shulchan Aruch, and the Mishnah Berurah.", "hook": "Your rebbe's bookshelf is a time machine. Let us travel from the Mishnah all the way to today!", "remember": "Last time: the eras, from the Tannaim to the Acharonim.", "intro": ["Rabbi Yehudah Hanasi wrote down the Mishnah.", "The Amoraim discussed it: that is the Gemara.", "Rashi explained Chumash and Gemara.", "The Rambam wrote the Mishneh Torah.", "Then came the Shulchan Aruch and the Mishnah Berurah."], "ex": [{"q": "Who wrote the Shulchan Aruch, and who explained it?", "steps": ["Rabbi Yosef Karo wrote the Shulchan Aruch.", "The Chofetz Chaim explained the part about daily life, in the Mishnah Berurah."], "a": "Rabbi Yosef Karo; the Chofetz Chaim wrote the Mishnah Berurah"}, {"q": "Mishnah or Mishneh Torah: which did the Rambam write?", "steps": ["The Mishnah: Rabbi Yehudah Hanasi, a Tanna.", "The Mishneh Torah: the Rambam, a Rishon."], "a": "the Mishneh Torah"}], "oops": {"q": "Did Rashi write the Mishnah Berurah?", "wrong": "yes", "right": "no, the Chofetz Chaim did", "why": "Rashi lived long before. He explained Chumash and Gemara."}, "idea": ["Match each sefer to its author.", "Each great sefer builds on the ones before it."], "try": {"q": "Who wrote down the Mishnah?", "o": ["Rabbi Yehudah Hanasi", "the Rambam", "the Chofetz Chaim"], "a": "Rabbi Yehudah Hanasi", "steps": ["The Mishnah is from the Tannaim.", "Their leader wrote it down: Rabbi Yehudah Hanasi."]}, "joke": "Why was the bookshelf so proud? It held up the whole Shulchan Aruch and never got tired!"}, "LK.CHEM.L03.04": {"big": "Shlomo built the first Beis Hamikdash and Bavel destroyed it. The Jews who returned built the second and Rome destroyed it. Both fell on Tisha B'Av.", "hook": "Imagine the most beautiful building in the world, where Hashem's Presence rests. We had it twice!", "remember": "Last time: the great sefarim. Today: the Beis Hamikdash, which we daven for every day.", "intro": ["Shlomo Hamelech built the first Beis Hamikdash.", "Nevuchadnetzar of Bavel destroyed it.", "The Jews returned from Bavel and built the second.", "The Romans destroyed it, on the same day of the year."], "ex": [{"q": "On which day did both fall?", "pic": "תִּשְׁעָה בְּאָב · בֵּית הַמִּקְדָּשׁ", "steps": ["The ninth day of the month of Av.", "We call it Tisha B'Av."], "a": "Tisha B'Av"}, {"q": "How long did each one stand?", "steps": ["The first stood 410 years.", "The second stood 420 years."], "a": "410 years and 420 years"}], "oops": {"q": "Did Dovid Hamelech build the first Beis Hamikdash?", "wrong": "yes", "right": "no, his son Shlomo did", "why": "Dovid prepared for it. Shlomo built it."}, "idea": ["Built twice, destroyed twice, both on Tisha B'Av.", "We daven every day for the third."], "try": {"q": "Who destroyed the second Beis Hamikdash?", "o": ["the Romans", "Bavel", "Persia"], "a": "the Romans", "steps": ["Bavel destroyed the first.", "The Romans, led by Titus, destroyed the second."]}, "joke": "What is the best address in the world? Right next door to the third Beis Hamikdash!"}, "LK.CHEM.L03.05": {"big": "Four fasts tell the story of the destruction: the siege (10 Teves), the walls (17 Tammuz), the fire (9 Av), and Gedaliah (3 Tishrei).", "hook": "Four fast days, four chapters of one sad story. Let us put the story together!", "remember": "Last time: the two Batei Mikdash, both destroyed on Tisha B'Av.", "intro": ["The Tenth of Teves: the siege began.", "The Seventeenth of Tammuz: the walls were broken.", "Tisha B'Av: the Beis Hamikdash was destroyed.", "The Fast of Gedaliah: the good governor was killed."], "ex": [{"q": "What are the four fasts called?", "pic": "צוֹם גְּדַלְיָה · עֲשָׂרָה בְּטֵבֵת · שִׁבְעָה עָשָׂר בְּתַמּוּז · תִּשְׁעָה בְּאָב", "steps": ["The Fast of Gedaliah and the Tenth of Teves.", "The Seventeenth of Tammuz and Tisha B'Av."], "a": "Gedaliah, Teves, Tammuz, Av"}, {"q": "Which fast comes first in the story?", "steps": ["First the enemy must surround the city.", "That is the siege: the Tenth of Teves."], "a": "the Tenth of Teves"}], "oops": {"q": "Does the Fast of Gedaliah remember the Beis Hamikdash burning?", "wrong": "yes", "right": "no, it remembers Gedaliah being killed", "why": "The burning is Tisha B'Av. Gedaliah was killed after it."}, "idea": ["Siege, walls, fire, Gedaliah.", "When Moshiach comes, these days will become days of joy."], "try": {"q": "Which fast remembers the walls being broken?", "o": ["the Seventeenth of Tammuz", "the Tenth of Teves", "Tisha B'Av"], "a": "the Seventeenth of Tammuz", "steps": ["The siege came first, in Teves.", "Then the walls broke, in Tammuz."]}, "joke": "Why did the calendar feel hungry? It had four fast days on it!"}, "LK.CHEM.L03.06": {"big": "613 mitzvos: 248 to do, like the limbs of a person; 365 not to do, like the days of the year. All people must keep seven.", "hook": "Every part of you and every day of the year has a mitzvah waiting for it!", "remember": "Last time: the four fasts. Today: what the Torah asks of us.", "intro": ["The Gemara counts 613 mitzvos.", "248 are to do, like the limbs of a person.", "365 are not to do, like the days of the year.", "All people must keep seven mitzvos."], "ex": [{"q": "Is \"love your fellow Jew as yourself\" to do, or not to do?", "steps": ["It tells us something to do: love.", "So it is one of the 248."], "a": "a mitzvah to do"}, {"q": "Name one of the seven mitzvos of Bnei Noach.", "steps": ["Bnei Noach means all people, the children of Noach.", "They must set up courts of justice."], "a": "set up courts of justice"}], "oops": {"q": "Are the 248 the mitzvos not to do?", "wrong": "yes", "right": "no, the 248 are to do", "why": "248 like the limbs, to do. 365 like the days, not to do."}, "idea": ["248 plus 365 is 613.", "Seven mitzvos for all people."], "try": {"q": "How many mitzvos are there in all?", "o": ["613", "248", "365"], "a": "613", "steps": ["248 to do.", "Plus 365 not to do: 613."]}, "joke": "Why did the boy count his fingers and toes? He wanted to know how many limbs were ready for mitzvos!"}}; if(typeof TL_TEACH!=='undefined'&&TL_TEACH) Object.keys(CT).forEach(k=>{ TL_TEACH[k]=CT[k]; }); }catch(e){ console.error('CHEM TL_TEACH',e); }
try{ const CD={"LK.CHEM.L01.01": {"s": "Family Line!\nLike: Grandpa and Grandma, then Abba and Ima.\nYour turn: learn the three fathers and the four mothers.\nTap, sort and match as you go.", "q": {"Put the three fathers in order.": "Father Line!\nLike: Grandpa, then Abba, then me.\nYour turn: line up the three fathers.\nTap the tiles in order.", "Put the four mothers in the order we say them.": "Mother Line!\nLike counting: one, two, three, four.\nYour turn: line up the four mothers.\nTap the tiles in order.", "Put the families in order.": "Family Train!\nLike train cars: engine first, then the rest.\nYour turn: line up the families.\nTap the tiles in order.", "Sort: a father or a mother?": "Two Teams!\nLike sorting socks and shoes.\nYour turn: sort the fathers and the mothers.\nTap a card, then its box.", "Sort: whose kindness was this?": "Kindness Boxes!\nLike: who set the table, who washed the cups?\nYour turn: sort each kindness.\nTap a card, then its box.", "Sort: buried in Me'aras Hamachpelah, or on the way to Beis Lechem?": "Two Places!\nLike: some books on the shelf, one on the desk.\nYour turn: sort each one to the place.\nTap a card, then its box.", "Match each mother to her husband.": "Family Match!\nLike matching a lid to its pot.\nYour turn: match each mother to her husband.\nTap a word, then its match.", "Match each mother to her son.": "Whose Son?\nLike: a duckling follows its mother duck.\nYour turn: match each mother to her son.\nTap a word, then its match.", "Match the number.": "Count Them!\nLike: a tricycle has three wheels.\nYour turn: match each group to its number.\nTap a word, then its match.", "Tap every one of the four mothers.": "Mother Finder!\nLike finding every red apple in a basket.\nYour turn: find the four mothers.\nTap every right one, then Check.", "Tap every true sentence.": "True Spotter!\nLike: is the sky blue? True!\nYour turn: find every true sentence.\nTap every right one, then Check.", "How many fathers do we have? Type the number.": "Count and Type!\nLike: how many wheels on a bike? 2.\nYour turn: count the fathers.\nType your answer, then Check.", "Together: whose mother was Rivkah?": "Think It Through!\nRead the question and every choice.\nYour turn: think back to the lesson.\nTap your answer.", "Together: who was the mother of Yitzchak?": "Think It Through!\nRead the question and every choice.\nYour turn: think back to the lesson.\nTap your answer.", "Check: the four mothers, in the order we say them.": "Line It Up!\nLike: wake up, wash, then eat.\nYour turn: put them in order.\nTap the tiles in order.", "Who was the mother of Yaakov?": "Choose Smart!\nCross out the choices that cannot be right.\nYour turn: tap the one the lesson taught.\nTap your answer.", "Where are Sarah, Rivkah and Leah buried?": "Choose Smart!\nCross out the choices that cannot be right.\nYour turn: tap the one the lesson taught.\nTap your answer."}}, "LK.CHEM.L01.02": {"s": "Brother Line!\nLike: counting the days of the week in order.\nYour turn: learn the twelve sons of Yaakov.\nTap, sort and match as you go.", "q": {"Put the first four sons in birth order.": "Big Brothers!\nLike: one, two, three, four.\nYour turn: line up the first four sons.\nTap the tiles in order.", "Put the middle four sons in birth order.": "Middle March!\nLike the middle cars of a train.\nYour turn: line up the middle sons.\nTap the tiles in order.", "Put the last four sons in birth order.": "Little Brothers!\nLike the last four steps to the door.\nYour turn: line up the last four sons.\nTap the tiles in order.", "Sort: first four sons, or last four sons?": "Front or Back?\nLike the front and back of a line.\nYour turn: sort the first and last sons.\nTap a card, then its box.", "Sort: a son of Yaakov, or not?": "Brother Check!\nLike: is this your sock? Yes or no.\nYour turn: find the sons of Yaakov.\nTap a card, then its box.", "Sort: a son of Leah, or a son of Rochel?": "Whose Son?\nLike: this puppy belongs to that dog.\nYour turn: sort each son to his mother.\nTap a card, then its box.", "Match each place to the son.": "Who Is Where?\nLike: first, second, third in a race.\nYour turn: match each place to a son.\nTap a word, then its match.", "Match each son to the brother born right after him.": "Next in Line!\nLike: after Sunday comes Monday.\nYour turn: match each brother to the next one.\nTap a word, then its match.", "Match: who is this?": "Clue Match!\nLike: the tallest kid in class.\nYour turn: match each clue to a name.\nTap a word, then its match.", "Tap every son of Yaakov.": "Son Spotter!\nLike finding every green leaf on a tree.\nYour turn: find the sons of Yaakov.\nTap every right one, then Check.", "Tap every son born before Yehudah.": "Early Birds!\nLike: who woke up before you?\nYour turn: find the sons before Yehudah.\nTap every right one, then Check.", "How many sons did Yaakov have? Type the number.": "Count and Type!\nLike: how many eggs in a carton? 12.\nYour turn: count the sons.\nType your answer, then Check.", "Together: who came right after Levi?": "Think It Through!\nRead the question and every choice.\nYour turn: think back to the lesson.\nTap your answer.", "Together: which son came right before Yosef?": "Think It Through!\nRead the question and every choice.\nYour turn: think back to the lesson.\nTap your answer.", "Check: put these sons in birth order.": "Line It Up!\nLike: wake up, wash, then eat.\nYour turn: put them in order.\nTap the tiles in order.", "Which one is NOT a son of Yaakov?": "Choose Smart!\nCross out the choices that cannot be right.\nYour turn: tap the one the lesson taught.\nTap your answer.", "Who was born last?": "Choose Smart!\nCross out the choices that cannot be right.\nYour turn: tap the one the lesson taught.\nTap your answer."}}, "LK.CHEM.L01.03": {"s": "Five-Finger Books!\nLike: thumb, pointer, middle, ring, pinky.\nYour turn: learn the five books of the Chumash.\nTap, sort and match as you go.", "q": {"Put the five books in order.": "Book Shelf!\nLike the five fingers of your hand, thumb first.\nYour turn: line up the five books.\nTap the tiles in order.", "Put the first three books in order.": "Start Strong!\nLike: ready, set, go!\nYour turn: line up the first three books.\nTap the tiles in order.", "Put the last three books in order.": "Finish Line!\nLike the last three steps up the stairs.\nYour turn: line up the last three books.\nTap the tiles in order.", "Sort: a book of the Chumash, or not?": "Book or Not?\nLike: is a spoon a toy? No!\nYour turn: find the books.\nTap a card, then its box.", "Sort: before Vayikra, or after Vayikra?": "Middle Book!\nLike Wednesday in the middle of the week.\nYour turn: sort around the middle book.\nTap a card, then its box.", "Sort: which book tells this?": "Story Shelf!\nLike putting each toy back in its own box.\nYour turn: put each story in its book.\nTap a card, then its box.", "Match each place to the book.": "Finger Count!\nLike: thumb is first, pinky is fifth.\nYour turn: match each place to a book.\nTap a word, then its match.", "Match each book to what it tells.": "Book Report!\nLike: a cookbook has recipes.\nYour turn: match each book to its story.\nTap a word, then its match.", "Match each book to the book right after it.": "What Comes Next?\nLike: after one comes two.\nYour turn: match each book to the next one.\nTap a word, then its match.", "Tap every book of the Chumash.": "Book Spotter!\nLike finding every book on a messy table.\nYour turn: find the books of the Chumash.\nTap every right one, then Check.", "Tap every book that comes before Bamidbar.": "Early Books!\nLike: who came to class before you?\nYour turn: find the books before Bamidbar.\nTap every right one, then Check.", "How many books are in the Chumash? Type the number.": "Count and Type!\nLike: how many legs on a chair? 4.\nYour turn: count the books.\nType your answer, then Check.", "Together: which book is last?": "Think It Through!\nRead the question and every choice.\nYour turn: think back to the lesson.\nTap your answer.", "Together: which book tells about the six days of creation?": "Think It Through!\nRead the question and every choice.\nYour turn: think back to the lesson.\nTap your answer.", "Check: the five books, first to last.": "Line It Up!\nLike: wake up, wash, then eat.\nYour turn: put them in order.\nTap the tiles in order.", "Which book comes right after Vayikra?": "Choose Smart!\nCross out the choices that cannot be right.\nYour turn: tap the one the lesson taught.\nTap your answer.", "Which book is Moshe's last words?": "Choose Smart!\nCross out the choices that cannot be right.\nYour turn: tap the one the lesson taught.\nTap your answer."}}, "LK.CHEM.L01.04": {"s": "Seven Days Story!\nLike: first the floor, then the walls, then the roof.\nYour turn: learn what Hashem made each day.\nTap, sort and match as you go.", "q": {"Put the days in order: what was made?": "Seven Steps!\nLike the steps of building a house: floor, walls, roof.\nYour turn: line up the seven days.\nTap the tiles in order.", "Put these in the order Hashem made them.": "Who Came First?\nLike: seed, then sprout, then flower.\nYour turn: line them up by day.\nTap the tiles in order.", "Which came first? Put them in order.": "Day by Day!\nLike: Sunday, Monday, Tuesday.\nYour turn: line them up by day.\nTap the tiles in order.", "Sort: made on day three, or day four?": "Ground or Sky?\nLike sorting rocks and clouds.\nYour turn: sort day three and day four.\nTap a card, then its box.", "Sort: made on day five, or day six?": "Swim, Fly or Walk?\nLike sorting boats and cars.\nYour turn: sort day five and day six.\nTap a card, then its box.", "Sort: first three days, or next three days?": "Two Halves!\nLike the two halves of a sandwich.\nYour turn: sort the first and next three days.\nTap a card, then its box.", "Match each day to what was made.": "Day Match!\nLike matching a sock to its pair.\nYour turn: match the first three days.\nTap a word, then its match.", "Match the next days to what was made.": "Day Match Two!\nLike matching a key to its lock.\nYour turn: match the last four days.\nTap a word, then its match.", "Match each one to its partner from the same day.": "Same Day Buddies!\nLike twins with the same birthday.\nYour turn: match the buddies.\nTap a word, then its match.", "Tap every thing made on day six.": "Day Six Finder!\nLike finding every round thing in the room.\nYour turn: find what was made on day six.\nTap every right one, then Check.", "Tap every thing made before the sun.": "Before the Sun!\nLike: what did you do before breakfast?\nYour turn: find what came before the sun.\nTap every right one, then Check.", "On which day did Hashem make light? Type the number.": "Count and Type!\nLike: how many noses do you have? 1.\nYour turn: find the day of light.\nType your answer, then Check.", "Together: on which day were the birds made?": "Think It Through!\nRead the question and every choice.\nYour turn: think back to the lesson.\nTap your answer.", "Together: what came first, trees or animals?": "Think It Through!\nRead the question and every choice.\nYour turn: think back to the lesson.\nTap your answer.", "Check: put creation in order.": "Line It Up!\nLike: wake up, wash, then eat.\nYour turn: put them in order.\nTap the tiles in order.", "What did Hashem make on day four?": "Choose Smart!\nCross out the choices that cannot be right.\nYour turn: tap the one the lesson taught.\nTap your answer.", "What did Hashem make last, on day six?": "Choose Smart!\nCross out the choices that cannot be right.\nYour turn: tap the one the lesson taught.\nTap your answer."}}, "LK.CHEM.L01.05": {"s": "Month Wheel!\nLike the days of the week going round and round.\nYour turn: learn the twelve months in order.\nTap, sort and match as you go.", "q": {"Put the first four months in order, from Tishrei.": "Month Train!\nLike the first four cars of a long train.\nYour turn: line up the first four months.\nTap the tiles in order.", "Put the middle four months in order.": "Middle Months!\nLike the middle beads on a necklace.\nYour turn: line up the middle months.\nTap the tiles in order.", "Put the last four months in order.": "Year End!\nLike the last four laps of a race.\nYour turn: line up the last four months.\nTap the tiles in order.", "Sort: Tishrei to Adar, or Nissan to Elul?": "Two Halves!\nLike the morning and the afternoon.\nYour turn: sort the months into halves.\nTap a card, then its box.", "Sort: a Jewish month, or not?": "Month or Not?\nLike: is a banana a color? No!\nYour turn: find the months.\nTap a card, then its box.", "Sort: in the first four months, or the last four months?": "Early or Late?\nLike the start and end of a book.\nYour turn: sort early and late months.\nTap a card, then its box.", "Match each month to the month right after it.": "Next Month!\nLike: after Monday comes Tuesday.\nYour turn: match each month to the next.\nTap a word, then its match.", "Match each place to the month, counting from Tishrei.": "Month Count!\nLike counting floors in a building.\nYour turn: match each place to its month.\nTap a word, then its match.", "Match: which month is this?": "Clue Match!\nLike: the coldest day of the year.\nYour turn: match each clue to its month.\nTap a word, then its match.", "Tap every month between Nissan and Elul.": "In Between!\nLike the days between Sunday and Friday.\nYour turn: find the months in between.\nTap every right one, then Check.", "Tap every Jewish month.": "Month Spotter!\nLike finding every star sticker on a page.\nYour turn: find every month.\nTap every right one, then Check.", "How many months are in a regular Jewish year? Type the number.": "Count and Type!\nLike: how many days in a week? 7.\nYour turn: count the months.\nType your answer, then Check.", "Together: which month comes right before Tishrei?": "Think It Through!\nRead the question and every choice.\nYour turn: think back to the lesson.\nTap your answer.", "Together: which month comes right after Kislev?": "Think It Through!\nRead the question and every choice.\nYour turn: think back to the lesson.\nTap your answer.", "Check: put these months in order, from Tishrei.": "Line It Up!\nLike: wake up, wash, then eat.\nYour turn: put them in order.\nTap the tiles in order.", "Which month comes right after Elul?": "Choose Smart!\nCross out the choices that cannot be right.\nYour turn: tap the one the lesson taught.\nTap your answer.", "Which month can come twice in one year?": "Choose Smart!\nCross out the choices that cannot be right.\nYour turn: tap the one the lesson taught.\nTap your answer."}}, "LK.CHEM.L01.06": {"s": "Yom Tov Calendar!\nLike: birthdays go on the calendar, each in its month.\nYour turn: put each Yom Tov in its month.\nTap, sort and match as you go.", "q": {"Put these Yomim Tovim in order, starting from Tishrei.": "Year Path!\nLike the stops of a bus, one after another.\nYour turn: line up the Yomim Tovim.\nTap the tiles in order.", "Put the Tishrei Yomim Tovim in order.": "Tishrei Parade!\nLike a parade: the drums, then the flags.\nYour turn: line up the Tishrei Yomim Tovim.\nTap the tiles in order.", "Put these Yom Tov months in order, from Tishrei.": "Month Map!\nLike: winter, spring, summer.\nYour turn: line up the months.\nTap the tiles in order.", "Sort: in Tishrei, or in Nissan?": "Month Boxes!\nLike putting letters in the right mailbox.\nYour turn: sort each Yom Tov.\nTap a card, then its box.", "Sort: Kislev, Adar or Sivan?": "Three Boxes!\nLike sorting cups, plates and spoons.\nYour turn: sort into three months.\nTap a card, then its box.", "Sort: Tishrei to Adar, or Nissan to Elul?": "Two Halves!\nLike the first and second half of a game.\nYour turn: sort into halves of the year.\nTap a card, then its box.", "Match each Yom Tov to its month.": "Yom Tov Match!\nLike matching each coat to its hook.\nYour turn: match each Yom Tov to its month.\nTap a word, then its match.", "Match each Yom Tov to what it remembers.": "Story Match!\nLike: a birthday cake remembers a birthday.\nYour turn: match each Yom Tov to its story.\nTap a word, then its match.", "Match each Tishrei Yom Tov to its clue.": "Clue Match!\nLike: the umbrella goes with the rain.\nYour turn: match each clue.\nTap a word, then its match.", "Tap every Yom Tov in Tishrei.": "Tishrei Finder!\nLike finding every apple in the fruit bowl.\nYour turn: find the Tishrei Yomim Tovim.\nTap every right one, then Check.", "Tap every true sentence.": "True Spotter!\nLike: is snow cold? True!\nYour turn: find every true sentence.\nTap every right one, then Check.", "In which month is Pesach? Type the month.": "Think and Type!\nLike: which day comes after Sunday? Monday.\nYour turn: type the month.\nType your answer, then Check.", "Together: Yom Kippur is in which month?": "Think It Through!\nRead the question and every choice.\nYour turn: think back to the lesson.\nTap your answer.", "Together: which comes first in the year, Purim or Pesach?": "Think It Through!\nRead the question and every choice.\nYour turn: think back to the lesson.\nTap your answer.", "Check: put these in order through the year, from Tishrei.": "Line It Up!\nLike: wake up, wash, then eat.\nYour turn: put them in order.\nTap the tiles in order.", "On Purim, who saved Klal Yisrael with Mordechai?": "Choose Smart!\nCross out the choices that cannot be right.\nYour turn: tap the one the lesson taught.\nTap your answer.", "Which Yom Tov is in Sivan?": "Choose Smart!\nCross out the choices that cannot be right.\nYour turn: tap the one the lesson taught.\nTap your answer."}}, "LK.CHEM.L02.01": {"s": "Library Shelves!\nLike a library: one shelf for stories, one for science.\nYour turn: put every sefer on its shelf of Tanach.\nTap, sort and match to learn it.", "q": {"Put the three parts of Tanach in order.": "Three Shelves!\nLike breakfast, lunch, supper: first, middle, last.\nYour turn: line up the three parts.\nTap the tiles in order.", "Put the first four sefarim of Nevi'im in order.": "Story Shelf!\nLike a photo album: baby, child, grown-up.\nYour turn: line up the first four sefarim of Nevi'im.\nTap the tiles in order.", "Put the last four sefarim of Nevi'im in order.": "Back Shelf!\nLike the last four stops on a bus line.\nYour turn: line up the last four sefarim of Nevi'im.\nTap the tiles in order.", "Sort each sefer: Torah or Nevi'im?": "Two Shelves!\nLike sorting socks: these go in one drawer, those in the other.\nYour turn: sort each sefer.\nTap a card, then its box.", "Sort each sefer: Nevi'im or Kesuvim?": "Shelf Two or Three?\nLike putting forks and spoons in their own slots.\nYour turn: sort each sefer.\nTap a card, then its box.", "Sort into the three parts of Tanach.": "Three Shelves!\nLike sorting toys into three bins: balls, blocks, cars.\nYour turn: put each sefer on its shelf.\nTap a card, then its box.", "Match each part to how many sefarim it has.": "Count Match!\nLike matching a hand to five fingers.\nYour turn: match each part to its number.\nTap a word, then its match.", "Match each sefer to its part.": "Shelf Match!\nLike matching a coat to its hook.\nYour turn: match each sefer to its part.\nTap a word, then its match.", "Match the sefer to what it holds.": "What Is Inside?\nLike a cookbook holds recipes.\nYour turn: match each sefer to what it holds.\nTap a word, then its match.", "Tap every sefer that is in Kesuvim.": "Kesuvim Hunt!\nLike finding every red apple in a basket.\nYour turn: find every sefer of Kesuvim.\nTap every right one, then Check.", "Tap every true sentence about Tanach.": "Truth Finder!\nLike checking which lights in the house are on.\nYour turn: tap every true sentence.\nTap every right one, then Check.", "How many sefarim are in all of Tanach? Type the number.": "Add It Up!\nLike 2 + 3 + 4 = 9.\nYour turn: add up the sefarim.\nType your answer, then Check."}}, "LK.CHEM.L02.02": {"s": "Parsha Train!\nLike the cars of a train: each one hooks to the next.\nYour turn: learn the parshiyos in order and their sefer.\nTap, sort and match to learn it.", "q": {"Put the first six parshiyos of Bereishis in order.": "Parsha Train!\nLike the days of the week: Sunday, Monday, Tuesday.\nYour turn: line up the first six parshiyos.\nTap the tiles in order.", "Put the last six parshiyos of Bereishis in order.": "Train Part Two!\nLike counting down the last minutes of recess.\nYour turn: line up the last six of Bereishis.\nTap the tiles in order.", "Put the first six parshiyos of Shemos in order.": "Shemos Train!\nLike the steps of tying a shoe.\nYour turn: line up the first six of Shemos.\nTap the tiles in order.", "Put the last five parshiyos of Shemos in order.": "Mishkan Train!\nLike building a house: plan, walls, roof.\nYour turn: line up the last five of Shemos.\nTap the tiles in order.", "Sort each parsha: Bereishis or Shemos?": "Which Sefer?\nLike sorting fruit and vegetables.\nYour turn: sort each parsha into its sefer.\nTap a card, then its box.", "Sort each parsha into its sefer.": "Three Sefarim!\nLike sorting coins: pennies, nickels, dimes.\nYour turn: sort each parsha.\nTap a card, then its box.", "Sort: first parsha of a sefer, or not?": "First in Line!\nLike the line leader at the front of the class.\nYour turn: find which parshiyos start a sefer.\nTap a card, then its box.", "Match each parsha to what happens in it.": "Story Match!\nLike matching a birthday to a cake.\nYour turn: match each parsha to its story.\nTap a word, then its match.", "Match each Chumash to its first parsha.": "Same Name Match!\nLike a twin finding his twin.\nYour turn: match each Chumash to its first parsha.\nTap a word, then its match.", "Match the parsha to the one that comes right after it.": "Next Door!\nLike Monday and Tuesday are neighbors.\nYour turn: match each parsha to the next one.\nTap a word, then its match.", "Tap every parsha in Sefer Shemos.": "Shemos Spotter!\nLike finding every blue car in a parking lot.\nYour turn: find every parsha of Shemos.\nTap every right one, then Check.", "How many parshiyos are in Sefer Shemos? Type the number.": "Count and Type!\nLike counting the players on a team.\nYour turn: count the parshiyos of Shemos.\nType your answer, then Check."}}, "LK.CHEM.L02.03": {"s": "Ten in a Row!\nLike counting fingers: one, two, three, all the way to ten.\nYour turn: learn the ten plagues in order.\nTap, sort and match to learn it.", "q": {"Put the first five plagues in order.": "Plague Line!\nLike the first five letters: A, B, C, D, E.\nYour turn: line up the first five plagues.\nTap the tiles in order.", "Put the last five plagues in order.": "Plague Line Part Two!\nLike counting six, seven, eight, nine, ten.\nYour turn: line up the last five plagues.\nTap the tiles in order.", "Put Rabbi Yehudah's first group in order.": "Group of Three!\nLike ready, set, go.\nYour turn: line up the first group.\nTap the tiles in order.", "Put the end of the story in order.": "Story End!\nLike the end of a game: last play, whistle, go home.\nYour turn: line up how it ended.\nTap the tiles in order.", "Sort: first five plagues or last five?": "Half and Half!\nLike splitting ten pennies into two piles of five.\nYour turn: sort each plague.\nTap a card, then its box.", "Sort: Rabbi Yehudah's three groups.": "Three Groups!\nLike a phone number split into small groups.\nYour turn: sort each plague into its group.\nTap a card, then its box.", "Sort: in Parshas Va'eira or Parshas Bo?": "Which Parsha?\nLike sorting homework into two folders.\nYour turn: sort each plague into its parsha.\nTap a card, then its box.", "Match each plague to its number.": "Number Match!\nLike matching a house to its address.\nYour turn: match each plague to its number.\nTap a word, then its match.", "Match each plague to what happened.": "What Happened?\nLike matching weather to a picture: sun, rain, snow.\nYour turn: match each plague to what happened.\nTap a word, then its match.", "Match each person in the story of Mitzrayim.": "Who Is Who?\nLike matching each player to his position.\nYour turn: match each person to his or her part.\nTap a word, then its match.", "Tap every one of the ten plagues.": "Plague Spotter!\nLike finding every real fruit in a basket of toys.\nYour turn: tap every real plague.\nTap every right one, then Check.", "Which number plague was darkness? Type the number.": "Count It!\nLike finding which floor you are on: count up from one.\nYour turn: count to darkness.\nType your answer, then Check."}}, "LK.CHEM.L02.04": {"s": "Heroes in a Row!\nLike a relay race: each runner hands on the baton.\nYour turn: learn who led Klal Yisrael, one after another.\nTap, sort and match to learn it.", "q": {"Put the three first kings in order.": "Crown Line!\nLike grandfather, father, son.\nYour turn: line up the three kings.\nTap the tiles in order.", "Put these leaders in order.": "Leader Line!\nLike the order of grades: first, second, third.\nYour turn: line up the leaders.\nTap the tiles in order.", "Put the big eras in order.": "Big Steps!\nLike seed, sprout, flower, fruit.\nYour turn: line up the eras.\nTap the tiles in order.", "Put these people in order.": "Time Line!\nLike morning, noon, evening, night.\nYour turn: line them up in time.\nTap the tiles in order.", "Sort: a judge or a king?": "Judge or King?\nLike sorting a teacher and a principal.\nYour turn: sort each person.\nTap a card, then its box.", "Sort: which tribe was each king from?": "Family Tree!\nLike sorting cousins by which family they come from.\nYour turn: sort each king by tribe.\nTap a card, then its box.", "Sort each fact to its judge.": "Hero Facts!\nLike sorting tools to the worker who uses them.\nYour turn: sort each fact to its judge.\nTap a card, then its box.", "Match each leader to what he or she did.": "Who Did It?\nLike matching a builder to a house.\nYour turn: match each leader to what he or she did.\nTap a word, then its match.", "Match each king to a fact.": "King Match!\nLike matching a coin to its picture.\nYour turn: match each king to a fact.\nTap a word, then its match.", "Match the teacher to the student.": "Who Came Next?\nLike a big brother handing down his coat.\nYour turn: match each leader to the one after him.\nTap a word, then its match.", "Tap every king of Klal Yisrael.": "Crown Spotter!\nLike finding every gold coin in a pile of buttons.\nYour turn: tap every king.\nTap every right one, then Check.", "How many men did Gideon take to fight Midyan? Type the number.": "Number Hunt!\nLike remembering how many players are on a team.\nYour turn: type how many men.\nType your answer, then Check."}}, "LK.CHEM.L02.05": {"s": "Six Shelves!\nLike a toolbox with six drawers, each for its own tools.\nYour turn: learn the six sedarim and what is inside each.\nTap, sort and match to learn it.", "q": {"Put the six sedarim in order.": "Six Shelves!\nLike the six school days in order.\nYour turn: line up the six sedarim.\nTap the tiles in order.", "Put the first three sedarim in order.": "First Three!\nLike gold, silver, bronze.\nYour turn: line up the first three.\nTap the tiles in order.", "Put the last three sedarim in order.": "Last Three!\nLike the last three pages of a book.\nYour turn: line up the last three.\nTap the tiles in order.", "Sort each masechta: Zeraim or Moed?": "Shelf One or Two?\nLike sorting summer clothes and winter clothes.\nYour turn: sort each masechta.\nTap a card, then its box.", "Sort each masechta: Nezikin or Kodashim?": "Shelf Four or Five?\nLike sorting pens and pencils.\nYour turn: sort each masechta.\nTap a card, then its box.", "Sort into three sedarim.": "Three Shelves!\nLike sorting mail for three neighbors.\nYour turn: sort each masechta.\nTap a card, then its box.", "Match each seder to what it teaches.": "Subject Match!\nLike matching a school subject to its book.\nYour turn: match each seder to its subject.\nTap a word, then its match.", "Match each seder to its number.": "Number Match!\nLike matching a player to his jersey
