{q:'Who says Birchas Kohanim?', o:['The Kohanim','The Leviim','The king']},
{q:'What does a nazir not drink?', o:['Wine','Water','Milk']}
]},
'LK.PAR.L02.35':{name:'Parsha Deep Dive: Beha\'aloscha', band:'5-6', op:'Aharon climbs the steps and lights the Menorah. Later the people complain about the mann, and Miriam learns how serious a few words can be.', peg:{kind:'flame rises',show:'Light it until it rises',say:'Beha\'aloscha: light the flame until it rises by itself. A good teacher lights a spark until it burns on its own.'},
teach:[
{how:'Opener: Watch Aharon climb three steps to the Menorah. He holds the flame to each wick until it burns by itself. That is the meaning of Beha\'aloscha: when you make it rise.', q:'What does Beha\'aloscha mean?', o:['When you make the flame rise','When you travel','When you sing']},
{how:'The camp travels when silver trumpets sound and the cloud lifts. But some people complain: we are tired of mann, we want meat! Hashem sends quail, and many who grabbed too greedily are punished.', q:'What did the people complain about?', o:['They were tired of the mann','There was too much water','The camp was too quiet']},
{how:'Miriam spoke about her brother Moshe. Even though she meant well, she was struck with tzara\'as. The whole camp waited seven days for her, because she once waited for baby Moshe at the river.', q:'Why did the whole camp wait for Miriam?', o:['She once waited for baby Moshe','They were lost','It was Shabbos']}
],
we:[
{q:'Together: what was Pesach Sheini?', o:['A second chance to bring the Korban Pesach','A second Seder for everyone','A fast day'], steps:['Some people were tamei on Pesach.','They asked Moshe: why should we lose out?','Hashem gave a second chance a month later: Pesach Sheini.']},
{q:'Together: how was Moshe described after Miriam spoke?', o:['The humblest person on earth','The richest king','A great warrior'], steps:['Moshe did not answer back.','He even davened for Miriam.','The Torah calls him the most humble of all people.']}
],
practice:[
{t:'order', q:'Put Beha\'aloscha in order.', tiles:['Aharon lights the Menorah','Pesach Sheini','The silver trumpets','Complaining about the mann','The quail','Miriam speaks about Moshe'], why:'Bamidbar, perakim 8 to 12.'},
{t:'pairs', q:'Match each Beha\'aloscha moment to its lesson.', pairs:[['lighting the Menorah','light a spark until it burns alone'],['Pesach Sheini','a second chance'],['Miriam','careful with words'],['Moshe','humility']], why:'Each moment has its own lesson.'},
{t:'spotall', q:'Tap how the camp knew it was time to travel.', cells:[{label:'the cloud lifted',ok:true},{label:'the silver trumpets sounded',ok:true},{label:'a rooster crowed',ok:false},{label:'it started to rain',ok:false}], why:'The cloud and the trumpets told them when to go.'},
{t:'sort', q:'Sort: good choice or bad choice in Beha\'aloscha?', bins:[{id:'G',label:'Good choice'},{id:'B',label:'Bad choice'}], items:[{label:'asking for a second chance to do a mitzvah',bin:'G'},{label:'waiting seven days for Miriam',bin:'G'},{label:'Moshe davening for Miriam',bin:'G'},{label:'complaining about the mann',bin:'B'},{label:'speaking about someone',bin:'B'}], why:'Wanting mitzvos and caring for others are good; complaining and talking about others are not.'},
{t:'type', q:'How many days did the camp wait for Miriam? Type the number.', a:'7', alt:['seven'], kb:'num', why:'Midah k\'neged midah: she waited for Moshe, so the people waited for her.'},
{t:'spotall', q:'Tap what Moshe did when Miriam was punished.', cells:[{label:'davened for her',ok:true},{label:'stayed humble',ok:true},{label:'got angry at her',ok:false},{label:'left the camp',ok:false}], why:'Moshe said a short tefillah: please, Hashem, heal her.'}
],
check:[
{t:'order', q:'Put these in order.', tiles:['The Menorah is lit','The people complain','Miriam speaks','The camp waits for her']},
{q:'What did Hashem send when the people wanted meat?', o:['Quail','Fish','Nothing']},
{q:'What is Pesach Sheini?', o:['A second chance for the Korban Pesach','A Yom Tov in winter','A fast']}
]},
'LK.PAR.L02.36':{name:'Parsha Deep Dive: Shelach', band:'5-6', op:'Twelve spies, giant grapes, and ten words of fear that changed history. Two brave men saw the truth.', peg:{kind:'two vs ten',show:'Yehoshua · Kalev',say:'Ten spies spread fear; two, Yehoshua and Kalev, said: we can do it, Hashem is with us!'},
teach:[
{how:'Opener: Twelve men walk into Eretz Yisrael, one from each shevet. For forty days they explore. They come back carrying a cluster of grapes so huge it takes two men and a pole!', q:'How many spies went into Eretz Yisrael?', o:['Twelve','Two','Forty']},
{how:'Ten spies said: the land is good, BUT the people are giants and we cannot win. The people cried all night. That night became Tisha B\'Av, a night of crying for generations.', q:'What night did the people cry?', o:['The night that became Tisha B\'Av','Pesach night','Purim night']},
{how:'Yehoshua and Kalev said: the land is very, very good, and Hashem is with us! For the forty days of spying, Bnei Yisrael stayed forty years in the desert.', q:'Why forty years in the desert?', o:['One year for each day of spying','The desert was big','They got lost']}
],
we:[
{q:'Together: what did Moshe add to Hoshea\'s name?', o:['A Yud, making him Yehoshua','An Aleph','Nothing'], steps:['Moshe was worried about the mission.','He davened: may Hashem save you from the spies\' plan.','He added a Yud: Yehoshua, Hashem will save.']},
{q:'Together: where did Kalev go on his own?', o:['To daven at the Avos\' graves in Chevron','To the sea','Back home'], steps:['Kalev felt the danger of the group.','He went to Me\'aras Hamachpelah in Chevron.','He davened to stay strong.']}
],
practice:[
{t:'sort', q:'Sort the spies\' words: fear or faith?', bins:[{id:'F',label:'Words of fear'},{id:'T',label:'Words of faith'}], items:[{label:'The people are giants',bin:'F'},{label:'We look like grasshoppers',bin:'F'},{label:'The cities are too strong',bin:'F'},{label:'The land is very, very good',bin:'T'},{label:'Hashem is with us',bin:'T'},{label:'We can surely do it',bin:'T'}], why:'Ten spoke from fear; Yehoshua and Kalev spoke from faith.'},
{t:'pairs', q:'Match each name to what he did.', pairs:[['Yehoshua','Moshe added a Yud to his name'],['Kalev','davened in Chevron'],['the ten spies','spread fear'],['the people','cried all night']], why:'Parshas Shelach, Bamidbar 13 to 14.'},
{t:'order', q:'Put Shelach in order.', tiles:['Twelve spies are sent','They carry back giant grapes','Ten spies speak fear','The people cry all night','Forty years in the desert'], why:'Bamidbar, perakim 13 to 14.'},
{t:'spotall', q:'Tap the fruits the spies brought back.', cells:[{label:'grapes',ok:true},{label:'pomegranates',ok:true},{label:'figs',ok:true},{label:'bananas',ok:false},{label:'apples',ok:false}], why:'Grapes, pomegranates and figs, from the seven special fruits.'},
{t:'type', q:'How many days did the spies explore the land? Type the number.', a:'40', alt:['forty'], kb:'num', why:'Forty days, and so forty years.'},
{t:'pairs', q:'Match the mitzvah at the end of Shelach to its meaning.', pairs:[['tzitzis','strings on four corners'],['techeles','a thread of blue'],['remember','all the mitzvos'],['do not follow','your eyes and heart']], why:'Tzitzis remind us of all the mitzvos, so we do not stray.'}
],
check:[
{t:'order', q:'Put the spies\' story in order.', tiles:['The spies go','The bad report','The crying','Forty years']},
{q:'Which two spies were faithful?', o:['Yehoshua and Kalev','Moshe and Aharon','Dasan and Aviram']},
{q:'What mitzvah ends Parshas Shelach?', o:['Tzitzis','Tefillin','Shofar']}
]},
'LK.PAR.L02.37':{name:'Parsha Deep Dive: Korach', band:'5-6', op:'A rebellion! Korach gathers 250 men against Moshe and Aharon. Then the ground opens up, and a dry staff blossoms overnight.', peg:{kind:'blossoming staff',show:'Almonds overnight',say:'Aharon\'s dry staff grew flowers and almonds overnight: proof that Hashem chose him.'},
teach:[
{how:'Opener: Korach, a rich and clever Levi, stands up with 250 important men: why should Moshe and Aharon be in charge? Everyone is holy! But Korach really wanted honor for himself.', q:'What did Korach really want?', o:['Honor and power for himself','Peace for everyone','To help the poor']},
{how:'Moshe said: tomorrow, everyone bring ketores, and Hashem will show whom He chose. The ground opened its mouth and swallowed Korach\'s group, and fire consumed the 250 men.', q:'What happened to Korach and his group?', o:['The ground swallowed them','They became kings','They moved to Mitzrayim']},
{how:'Each shevet\'s leader put a staff in the Mishkan overnight. In the morning, Aharon\'s staff had sprouted flowers and ripe almonds!', q:'What grew on Aharon\'s staff?', o:['Flowers and almonds','Grapes','Leaves only']}
],
we:[
{q:'Together: why is Korach\'s argument called a bad machlokes?', o:['It was for his own honor, not for Heaven','It was too loud','It was in the desert'], steps:['Pirkei Avos compares two arguments.','Hillel and Shammai argued for the sake of Heaven: good.','Korach argued for himself: that machlokes did not last.']},
{q:'Together: who was saved by his wife\'s wisdom?', o:['On ben Peles','Dasan','Korach'], steps:['On ben Peles joined Korach at first.','His wife kept him home and away from the group.','He was saved.']}
],
practice:[
{t:'sort', q:'Sort: a machlokes for Heaven, or for yourself?', bins:[{id:'H',label:'For the sake of Heaven'},{id:'S',label:'For yourself'}], items:[{label:'Hillel and Shammai on a halachah',bin:'H'},{label:'two chavrusos arguing to find the truth',bin:'H'},{label:'Korach wanting to be Kohen Gadol',bin:'S'},{label:'fighting to be first in line',bin:'S'}], why:'An argument to find the truth lasts; one for honor falls apart.'},
{t:'order', q:'Put Korach\'s story in order.', tiles:['Korach gathers 250 men','Moshe tells them to bring ketores','The ground opens','Fire takes the 250','Aharon\'s staff blossoms'], why:'Bamidbar, perakim 16 to 17.'},
{t:'pairs', q:'Match each person to his part.', pairs:[['Korach','led the rebellion'],['On ben Peles','saved by his wife'],['Aharon','his staff blossomed'],['Moshe','fell on his face and davened']], why:'Parshas Korach.'},
{t:'spotall', q:'Tap what grew on Aharon\'s staff.', cells:[{label:'buds',ok:true},{label:'flowers',ok:true},{label:'almonds',ok:true},{label:'apples',ok:false},{label:'thorns',ok:false}], why:'It sprouted, blossomed and gave ripe almonds overnight.'},
{t:'type', q:'How many men offered ketores with Korach? Type the number.', a:'250', alt:['two hundred fifty','two hundred and fifty'], kb:'num', why:'Two hundred and fifty leaders.'},
{t:'spotall', q:'Tap the good ways to settle an argument.', cells:[{label:'listen to the other side',ok:true},{label:'look for the truth together',ok:true},{label:'ask a rebbe',ok:true},{label:'gather a gang',ok:false},{label:'shout louder',ok:false}], why:'The opposite of Korach: seek truth, not victory.'}
],
check:[
{t:'order', q:'Put these moments of Korach in order.', tiles:['The rebellion','The ground opens','The staffs in the Mishkan','The almonds']},
{q:'What did the staff test prove?', o:['Hashem chose Aharon','Korach was right','Staffs grow in the desert']},
{q:'Why was Korach\'s machlokes wrong?', o:['It was for his own honor','It was about food','It was too short']}
]},
'LK.PAR.L02.38':{name:'Parsha Deep Dive: Chukas', band:'5-6', op:'A red cow that purifies, a well that disappears, and a rock that should have been spoken to. A parsha of mysteries and goodbyes.', peg:{kind:'speak, not hit',show:'Speak to the rock',say:'Hashem said: speak to the rock. Moshe hit it instead, and could not enter Eretz Yisrael.'},
teach:[
{how:'Opener: A completely red cow, without even two black hairs, is burned. Its ashes purify people who touched the dead. Even Shlomo Hamelech, the wisest man, said he could not understand it. A chok is a mitzvah we keep even without knowing the reason.', q:'What is a chok?', o:['A mitzvah we keep even without knowing its reason','A story','A song']},
{how:'Miriam passes away, and the water that had followed the camp in her merit, the well of Miriam, disappears. The people are thirsty.', q:'What disappeared when Miriam died?', o:['Her well of water','The cloud','The mann']},
{how:'Hashem tells Moshe: speak to the rock. Moshe, upset with the people, hits it instead. Water gushes out, but Hashem says Moshe will not lead them into the land.', q:'What did Hashem tell Moshe to do to the rock?', o:['Speak to it','Hit it twice','Ignore it']}
],
we:[
{q:'Together: why was hitting the rock such a big deal?', o:['Speaking would have shown even a rock listens to Hashem','The rock broke','The water was salty'], steps:['A rock that obeys words is a lesson for people.','Hitting made it look ordinary.','A leader on Moshe\'s level is judged very exactly.']},
{q:'Together: who passed away on Hor Hahar?', o:['Aharon','Yehoshua','Kalev'], steps:['Moshe, Aharon and Elazar went up the mountain.','Aharon\'s clothes were put on Elazar.','Aharon passed away, and the people cried thirty days.']}
],
practice:[
{t:'order', q:'Put Chukas in order.', tiles:['The Parah Adumah','Miriam passes away','The well disappears','Moshe hits the rock','Aharon passes away'], why:'Bamidbar, perakim 19 to 20.'},
{t:'pairs', q:'Match each event to its person.', pairs:[['the well','Miriam'],['the rock','Moshe'],['Hor Hahar','Aharon'],['the clothes of the Kohen Gadol','Elazar']], why:'A parsha of three great leaders.'},
{t:'sort', q:'Sort the mitzvos: a chok or a mishpat?', bins:[{id:'C',label:'Chok: reason not known'},{id:'M',label:'Mishpat: we understand why'}], items:[{label:'the Parah Adumah',bin:'C'},{label:'not mixing wool and linen',bin:'C'},{label:'do not steal',bin:'M'},{label:'return a lost object',bin:'M'}], why:'We keep both kinds, the ones we understand and the ones we do not.'},
{t:'spotall', q:'Tap what made the Parah Adumah special.', cells:[{label:'completely red',ok:true},{label:'never wore a yoke',ok:true},{label:'its ashes purified',ok:true},{label:'it could talk',ok:false},{label:'it was black and white',ok:false}], why:'Perfectly red, never worked, and its ashes purified people.'},
{t:'type', q:'How many days did the people cry for Aharon? Type the number.', a:'30', alt:['thirty'], kb:'num', why:'Aharon loved peace, so everyone cried for him.'},
{t:'pairs', q:'Match the snake story to its meaning.', pairs:[['the people complained','about bread and water'],['snakes came','as a punishment'],['the copper snake','they looked up to Hashem'],['they were healed','when they looked up']], why:'Looking up to the copper snake turned their hearts to Hashem.'}
],
check:[
{t:'order', q:'Put these moments of Chukas in order.', tiles:['Miriam passes away','The well disappears','The rock is hit','Aharon passes away']},
{q:'What should Moshe have done to the rock?', o:['Spoken to it','Hit it','Climbed it']},
{q:'Who became Kohen Gadol after Aharon?', o:['Elazar','Pinchas','Yehoshua']}
]},
'LK.PAR.L02.39':{name:'Parsha Deep Dive: Balak', band:'5-6', op:'A king hires a famous prophet to curse Bnei Yisrael. But every time he opens his mouth, blessings come out! And his donkey talks!', peg:{kind:'curse to blessing',show:'Mah tovu',say:'Bilam came to curse, and said: Mah tovu, how good are your tents, Yaakov. Hashem turned the curse into a blessing.'},
teach:[
{how:'Opener: Balak, king of Moav, is scared of Bnei Yisrael. He sends messengers with gold to Bilam: come curse this nation for me!', q:'Why did Balak want Bnei Yisrael cursed?', o:['He was afraid of them','He loved them','He wanted to trade']},
{how:'On the road, Bilam\'s donkey sees a malach with a sword and stops three times. Bilam hits her. Then the donkey speaks: why did you hit me three times?', q:'Why did the donkey stop?', o:['She saw a malach with a sword','She was tired','She was hungry']},
{how:'Bilam tries to curse three times, and each time blessings pour out. He sees the camp with doors not facing each other, everyone\'s privacy respected, and says: Mah tovu, how good are your tents.', q:'What blessing do we say every morning from Bilam?', o:['Mah tovu','Modeh Ani','Adon Olam']}
],
we:[
{q:'Together: why did Bilam praise the tents?', o:['Their doors did not face each other, respecting privacy','They were made of gold','They were very tall'], steps:['Bilam looked down at the camp.','No tent door faced another door.','He saw modesty and respect, and blessed them.']},
{q:'Together: what lesson does the talking donkey teach?', o:['Even the great Bilam could not see what a donkey saw','Donkeys are smart','Animals can daven'], steps:['Bilam thought he was a great prophet.','His donkey saw the malach before he did.','Pride blinds a person.']}
],
practice:[
{t:'order', q:'Put Balak in order.', tiles:['Balak sends for Bilam','The donkey sees the malach','The donkey talks','Bilam tries to curse','Mah tovu: blessings instead'], why:'Bamidbar, perakim 22 to 24.'},
{t:'pairs', q:'Match each name to who he was.', pairs:[['Balak','king of Moav'],['Bilam','a prophet of the nations'],['the donkey','saw the malach first'],['the malach','stood with a sword']], why:'The cast of Parshas Balak.'},
{t:'spotall', q:'Tap the things Bilam saw that made him bless.', cells:[{label:'tents with doors not facing each other',ok:true},{label:'a nation dwelling by itself',ok:true},{label:'a camp like a lion',ok:true},{label:'people fighting',ok:false},{label:'an empty desert',ok:false}], why:'He saw modesty, a special nation, and strength.'},
{t:'type', q:'How many times did the donkey stop? Type the number.', a:'3', alt:['three'], kb:'num', why:'Three times, and Bilam hit her each time.'},
{t:'sort', q:'Sort: what Balak wanted, and what Hashem gave.', bins:[{id:'B',label:'What Balak wanted'},{id:'H',label:'What Hashem gave'}], items:[{label:'a curse',bin:'B'},{label:'to drive them away',bin:'B'},{label:'a blessing',bin:'H'},{label:'Mah tovu',bin:'H'}], why:'Hashem turned the curse into a blessing.'},
{t:'pairs', q:'Match to finish the story of Pinchas at the end of Balak.', pairs:[['the people sinned','led astray by Moav'],['a plague began','in the camp'],['Pinchas acted','zealously for Hashem'],['the plague stopped','because of Pinchas']], why:'Next week Pinchas receives his reward.'}
],
check:[
{t:'order', q:'Put these moments of Balak in order.', tiles:['Balak sends messengers','The donkey talks','Bilam blesses']},
{q:'Who saw the malach first?', o:['The donkey','Bilam','Balak']},
{q:'What words of Bilam do we say every morning?', o:['Mah tovu','Shema Yisrael','Aleinu']}
]},
'LK.PAR.L02.40':{name:'Parsha Deep Dive: Pinchas', band:'5-6', op:'A reward of peace, five brave sisters who asked for their share, and Moshe choosing the next leader.', peg:{kind:'five sisters',show:'Bnos Tzelafchad',say:'Five sisters loved Eretz Yisrael so much they asked for their father\'s portion, and Hashem said: they are right.'},
teach:[
{how:'Opener: Pinchas stopped the plague with his zeal for Hashem. Hashem gives him a covenant of peace: Pinchas and his children will be Kohanim forever.', q:'What reward did Pinchas get?', o:['A covenant of peace and Kehunah','Gold','A palace']},
{how:'Five sisters, the daughters of Tzelafchad, come to Moshe: our father had no sons. Should his share of Eretz Yisrael be lost? Moshe asks Hashem, who says: they are right.', q:'What did the daughters of Tzelafchad ask for?', o:['Their father\'s share in Eretz Yisrael','A new house in Mitzrayim','Money for food']},
{how:'Moshe asks Hashem to appoint a leader after him. Hashem chooses Yehoshua, who never left the tent of Torah. Moshe places his hands on him.', q:'Who was chosen to lead after Moshe?', o:['Yehoshua','Kalev','Pinchas']}
],
we:[
{q:'Together: why was Yehoshua chosen and not Moshe\'s sons?', o:['He served Moshe and stayed in the tent of Torah','He was the oldest','He was the tallest'], steps:['Moshe hoped his sons would lead.','Yehoshua had served Moshe faithfully every day.','Chazal: whoever guards the tree eats its fruit.']},
{q:'Together: what list is at the end of Pinchas?', o:['The korbanos of every Shabbos and Yom Tov','The names of the spies','The makos'], steps:['Pinchas lists the musaf korbanos.','For Shabbos, Rosh Chodesh and each Yom Tov.','We read these in shul on the Yomim Tovim.']}
],
practice:[
{t:'order', q:'Put the daughters of Tzelafchad\'s story in order.', tiles:['Their father has no sons','They come to Moshe','Moshe asks Hashem','Hashem says: they are right','They receive a share'], why:'Bamidbar perek 27.'},
{t:'pairs', q:'Match each person to Parshas Pinchas.', pairs:[['Pinchas','covenant of peace'],['Bnos Tzelafchad','asked for a share of the land'],['Yehoshua','the next leader'],['Moshe','placed his hands on Yehoshua']], why:'Parshas Pinchas.'},
{t:'spotall', q:'Tap the days with a musaf korban listed in Pinchas.', cells:[{label:'Shabbos',ok:true},{label:'Rosh Chodesh',ok:true},{label:'Pesach',ok:true},{label:'Sukkos',ok:true},{label:'Chanukah',ok:false},{label:'Purim',ok:false}], why:'Chanukah and Purim are from later; they have no musaf korban in the Torah.'},
{t:'type', q:'How many daughters did Tzelafchad have? Type the number.', a:'5', alt:['five'], kb:'num', why:'Machlah, Noa, Choglah, Milkah and Tirtzah.'},
{t:'sort', q:'Sort: what made Yehoshua ready to lead?', bins:[{id:'Y',label:'Helped make him a leader'},{id:'N',label:'Not a reason'}], items:[{label:'served Moshe every day',bin:'Y'},{label:'stayed in the tent of Torah',bin:'Y'},{label:'was brave with the spies',bin:'Y'},{label:'was the richest',bin:'N'},{label:'was the loudest',bin:'N'}], why:'Service, Torah and courage made Yehoshua a leader.'},
{t:'spotall', q:'Tap the names of the five daughters.', cells:[{label:'Machlah',ok:true},{label:'Noa',ok:true},{label:'Choglah',ok:true},{label:'Milkah',ok:true},{label:'Tirtzah',ok:true},{label:'Miriam',ok:false}], why:'Five wise, brave sisters.'}

{how:'Opener: Matos begins with nedarim, promises. If a person promises, he must keep his word: do not break your word, do everything that came out of your mouth.', q:'What does the Torah say about a promise?', o:['Keep it','Forget it','Change it any time']},
{how:'Bnei Reuven and Bnei Gad had many cattle. They saw green land on the east side of the Yarden and asked: may we live here?', q:'Why did Reuven and Gad want the land east of the Yarden?', o:['It was good for their cattle','It had gold','It was close to Mitzrayim']},

],
we:[

{q:'Together: which shevet joined Reuven and Gad?', o:['Half of Menashe','Dan','Levi'], steps:['Part of Menashe also settled east of the Yarden.','So two and a half shevatim lived there.','They kept their promise and fought first.']}
],

'LK.PAR.L02.42':{name:'Parsha Deep Dive: Masei', band:'5-6', op:'Forty-two stops on a forty-year journey, all written down. Then the borders of Eretz Yisrael and cities of refuge. Chazak!', peg:{kind:'journey map',show:'42 stops',say:'The Torah lists all 42 stops, because every step of the journey mattered.'},

],

{q:'Together: how many arei miklat were there?', o:['Six','Twelve','Two'], steps:['Three on the east side of the Yarden.','Three in Eretz Yisrael itself.','Six in all.']}
],

'LK.PAR.L02.43':{name:'Parsha Deep Dive: Devarim', band:'5-6', op:'Moshe stands before the whole nation for the last weeks of his life and begins his farewell speech: remember the journey.', peg:{kind:'farewell speech',show:'Moshe looks back',say:'Sefer Devarim is Moshe\'s goodbye: thirty-six days of teaching before he passes away.'},
teach:[
{how:'Opener: Imagine the whole nation gathered on the plains of Moav, the Yarden river shining ahead. Old Moshe stands up and begins to speak. These are the words, Eileh hadevarim. Sefer Devarim is Moshe\'s own farewell to his people.', q:'Who is speaking in most of Sefer Devarim?', o:['Moshe, saying goodbye','Hashem to Avraham','Yehoshua to the soldiers']},
{how:'Moshe hints at the places where the people stumbled, without shaming them by name: here you complained, there you made the calf. A loving rebuke, said gently.', q:'How did Moshe rebuke the people?', o:['Gently, with hints, to not shame them','By shouting names','He did not rebuke at all']},
{how:'Parshas Devarim is always read on the Shabbos before Tisha B\'Av, Shabbos Chazon. Moshe says: eichah, how can I carry you alone? The same word starts Megillas Eichah.', q:'Before which day is Parshas Devarim read?', o:['Tisha B\'Av','Purim','Shavuos']}
],
we:[
{q:'Together: why did Moshe only hint at the sins?', o:['To protect the people\'s dignity','He forgot the details','There were no sins'], steps:['Moshe needed to remind them of mistakes.','He named places, not the sins.','A rebbe corrects with love and respect.']},
{q:'Together: why did Moshe appoint judges?', o:['He could not carry the whole nation alone','He was tired of judging','The judges asked for it'], steps:['The people grew to millions.','Moshe said: how can I carry you alone?','Wise, understanding judges helped him.']}
],
practice:[
{t:'order', q:'Put the five sefarim in order and find where we are.', tiles:['Bereishis','Shemos','Vayikra','Bamidbar','Devarim'], why:'Devarim is the fifth and last sefer.'},
{t:'pairs', q:'Match each Devarim idea to its meaning.', pairs:[['Eileh hadevarim','these are the words'],['Eichah','how can I carry you alone'],['Shabbos Chazon','the Shabbos before Tisha B\'Av'],['Arvos Moav','the plains where Moshe spoke']], why:'Key ideas of Parshas Devarim.'},
{t:'sort', q:'Sort: a good way to correct someone, or not?', bins:[{id:'G',label:'Good way'},{id:'N',label:'Not a good way'}], items:[{label:'speak gently',bin:'G'},{label:'say it privately',bin:'G'},{label:'show you care',bin:'G'},{label:'embarrass him in public',bin:'N'},{label:'shout and insult',bin:'N'}], why:'Moshe corrected with hints and love.'},
{t:'spotall', q:'Tap what Moshe looked for in a judge.', cells:[{label:'wise',ok:true},{label:'understanding',ok:true},{label:'known for good deeds',ok:true},{label:'rich',ok:false},{label:'loud',ok:false}], why:'Wise, understanding, and known to the people.'},
{t:'type', q:'Which sefer of the Torah is Devarim? Type the number.', a:'5', alt:['five','fifth','5th'], kb:'num', why:'Bereishis, Shemos, Vayikra, Bamidbar, Devarim.'},
{t:'order', q:'Put Moshe\'s review in order.', tiles:['Leaving Har Sinai','Appointing judges','The spies','Forty years in the desert','Reaching the plains of Moav'], why:'Moshe retells the journey in order.'}
],

{q:'What is Sefer Devarim mostly?', o:['Moshe\'s farewell speeches','Stories of the Avos','The building of the Mishkan']},
{q:'Which Shabbos is Parshas Devarim?', o:['Shabbos Chazon','Shabbos Shirah','Shabbos Hagadol']}
]},
'LK.PAR.L02.44':{name:'Parsha Deep Dive: Va\'eschanan', band:'5-6', op:'Moshe begs 515 times to enter Eretz Yisrael. Then he teaches the words every Jew says every day: Shema Yisrael.', peg:{kind:'shema',show:'Hashem is One',say:'Shema Yisrael: the first pasuk a Jewish child learns, and the last words on a Jew\'s lips.'},
teach:[
{how:'Opener: Moshe tells the people: I begged Hashem, please let me cross and see the good land. Chazal say he davened 515 times, the number of the word Va\'eschanan. Hashem said: enough, go up the mountain and look.', q:'What did Moshe beg for?', o:['To enter Eretz Yisrael','To become king','To go back to Mitzrayim']},
{how:'Moshe repeats the Aseres Hadibros, the same Ten Dibros from Har Sinai, so the new generation hears them from him.', q:'What did Moshe repeat in Va\'eschanan?', o:['The Aseres Hadibros','The list of the makos','The names of the spies']},
{how:'Then the most famous pasuk: Shema Yisrael, Hashem is our Elokim, Hashem is One. And: love Hashem with all your heart, teach these words to your children, tefillin, mezuzah.', q:'Which famous words are in Va\'eschanan?', o:['Shema Yisrael','Mah tovu','Az yashir']}
],
we:[
{q:'Together: what does "with all your heart" mean in the Shema?', o:['With both the good and the bad inclination','With half your heart','Only on Shabbos'], steps:['Levavcha has two Beis letters.','Chazal: two inclinations, good and bad.','Serve Hashem even with your energy and drives.']},
{q:'Together: where do we write the Shema?', o:['In tefillin and in the mezuzah','On our shoes','On the walls of shul only'], steps:['Tie them as a sign on your hand: tefillin.','Between your eyes: tefillin shel rosh.','On your doorposts: mezuzah.']}
],
practice:[
{t:'order', q:'Put the beginning of Shema in order.', tiles:['Shema Yisrael','Hashem is our Elokim','Hashem is One'], why:'The first pasuk every Jewish child learns.'},
{t:'spotall', q:'Tap the mitzvos in the first parsha of Shema.', cells:[{label:'love Hashem',ok:true},{label:'teach your children',ok:true},{label:'tefillin',ok:true},{label:'mezuzah',ok:true},{label:'sukkah',ok:false},{label:'shofar',ok:false}], why:'Love, learning, tefillin and mezuzah are all in the Shema.'},
{t:'pairs', q:'Match each part of the Shema to its mitzvah.', pairs:[['a sign on your hand','tefillin shel yad'],['between your eyes','tefillin shel rosh'],['on your doorposts','mezuzah'],['teach your children','Torah learning']], why:'Vedibarta bam: speak of them always.'},
{t:'sort', q:'Sort the times: when do we say Shema?', bins:[{id:'Y',label:'We say Shema'},{id:'N',label:'Not a set time for Shema'}], items:[{label:'in the morning',bin:'Y'},{label:'at night',bin:'Y'},{label:'before going to sleep',bin:'Y'},{label:'at lunch',bin:'N'},{label:'during recess',bin:'N'}], why:'Beshochbecha uvkumecha: when you lie down and when you rise.'},
{t:'type', q:'How many times did Moshe daven to enter the land? Type the number.', a:'515', alt:['five hundred fifteen','five hundred and fifteen'], kb:'num', why:'The gematria of Va\'eschanan is 515.'},
{t:'pairs', q:'Match to finish: love Hashem with all your…', pairs:[['heart','both inclinations'],['soul','even giving up your life'],['might','all your money and strength']], why:'Chazal explain each part of V\'ahavta.'}
],

{q:'Where is the Shema written?', o:['In tefillin and mezuzos','In a siddur only','On coins']},
{q:'What did Moshe repeat for the new generation?', o:['The Aseres Hadibros','The makos','The flags']}

'LK.PAR.L02.45':{name:'Parsha Deep Dive: Eikev', band:'5-6', op:'Remember the desert: mann every morning, clothes that never wore out, and the second luchos. And then, after you eat and are satisfied: bless Hashem!', peg:{kind:'eat, be full, bless',show:'V\'achalta v\'savata u\'veirachta',say:'You will eat, be satisfied, and bless: the mitzvah of bentching comes from Eikev.'},
teach:[
{how:'Opener: Moshe says: for forty years your clothes did not wear out and your feet did not swell. Hashem fed you mann to teach that a person lives not on bread alone, but on everything that comes from Hashem.', q:'What did not wear out in the desert?', o:['Their clothes','Their tents','Their shoes only']},
{how:'Eretz Yisrael is a land of wheat, barley, grapes, figs, pomegranates, olives and dates: the seven species. Then: you will eat, be satisfied, and bless Hashem.', q:'Which mitzvah comes from "you will eat, be satisfied, and bless"?', o:['Birkas Hamazon, bentching','Hamotzi','Kiddush']},
{how:'Do not say: my strength made me rich. Remember it is Hashem who gives you the power to succeed.', q:'Who gives a person the power to succeed?', o:['Hashem','Only himself','Luck']}
],
we:[
{q:'Together: what is the second parsha of Shema?', o:['Vehaya im shamo\'a, in Parshas Eikev','Aleinu','Ashrei'], steps:['The first parsha is in Va\'eschanan.','The second, Vehaya im shamo\'a, is in Eikev.','It promises rain when we keep the mitzvos.']},
{q:'Together: what does Hashem ask of us, according to Eikev?', o:['To fear Him, walk in His ways, and love Him','Only to bring korbanos','Nothing at all'], steps:['Moshe asks: what does Hashem want from you?','Only to fear Him and walk in His ways.','And love Him and serve Him with all your heart.']}
],
practice:[
{t:'spotall', q:'Tap the seven species of Eretz Yisrael.', cells:[{label:'wheat',ok:true},{label:'barley',ok:true},{label:'grapes',ok:true},{label:'figs',ok:true},{label:'pomegranates',ok:true},{label:'olives',ok:true},{label:'dates',ok:true},{label:'bananas',ok:false},{label:'apples',ok:false}], why:'The seven: wheat, barley, grapes, figs, pomegranates, olives and dates.'},
{t:'order', q:'Put V\'achalta in order.', tiles:['You will eat','You will be satisfied','You will bless Hashem'], why:'Eat, be full, bless: the source of bentching.'},
{t:'sort', q:'Sort: whose power is it really?', bins:[{id:'H',label:'A gift from Hashem'},{id:'X',label:'The wrong thought'}], items:[{label:'my strength to work',bin:'H'},{label:'my good grades',bin:'H'},{label:'my money',bin:'H'},{label:'I did it all by myself',bin:'X'},{label:'I do not need anyone',bin:'X'}], why:'Kochi v\'otzem yadi, my own power, is the thought Eikev warns against.'},
{t:'pairs', q:'Match each miracle of the desert to what it taught.', pairs:[['the mann','we live on what Hashem gives'],['clothes that did not wear out','Hashem cares for every detail'],['water from the rock','Hashem provides in a dry land'],['the cloud','Hashem guides us']], why:'Forty years of care from Hashem.'},
{t:'type', q:'How many species is Eretz Yisrael praised for? Type the number.', a:'7', alt:['seven'], kb:'num', why:'The shiv\'as haminim.'},
{t:'spotall', q:'Tap the brachos in Birkas Hamazon\'s first part.', cells:[{label:'thanking Hashem for food',ok:true},{label:'thanking Hashem for the land',ok:true},{label:'Yerushalayim',ok:true},{label:'Hamotzi',ok:false},{label:'Havdalah',ok:false}], why:'Bentching thanks Hashem for food, the land and Yerushalayim.'}
],

'LK.PAR.L02.46':{name:'Parsha Deep Dive: Re\'eh', band:'5-6', op:'See! I place before you today a blessing and a curse. The choice is yours. Plus: open your hand to the poor, and the three Regalim.', peg:{kind:'two paths',show:'Re\'eh: choose',say:'Hashem shows two paths and says: see, choose the blessing.'},
teach:[
{how:'Opener: Picture two mountains facing each other. Moshe says: see, I put before you a blessing and a curse. The blessing, if you listen to the mitzvos. The choice is in your hands.', q:'Who chooses between the blessing and the curse?', o:['Each person','Only the kings','No one']},
{how:'If there is a poor person, do not close your hand. Open your hand and give him what he needs. That is the mitzvah of tzedakah.', q:'What does the Torah say to do for a poor person?', o:['Open your hand and give','Close your hand','Walk past']},
{how:'Re\'eh teaches the kosher signs again, maaser, and the three Regalim when everyone came to the place Hashem chose: Yerushalayim.', q:'Where did everyone go on the Regalim?', o:['The place Hashem chose, Yerushalayim','Mitzrayim','The desert']}
],
we:[
{q:'Together: why does the Torah say "open, you shall open your hand"?', o:['Give again and again, even many times','Open your hand once','Wave your hand'], steps:['The word open is said twice.','Chazal: give even a hundred times.','Tzedakah is a habit, not one time.']},
{q:'Together: why does Re\'eh start with "see"?', o:['To look at the choice clearly','Because it was dark','To count people'], steps:['Moshe says: re\'eh, see.','Look at both paths with open eyes.','Then choose the good one.']}
],

{t:'sort', q:'Sort: which path is it?', bins:[{id:'B',label:'Path of blessing'},{id:'C',label:'Path of curse'}], items:[{label:'keeping the mitzvos',bin:'B'},{label:'giving tzedakah',bin:'B'},{label:'learning Torah',bin:'B'},{label:'serving idols',bin:'C'},{label:'ignoring the poor',bin:'C'}], why:'Choose the blessing: listen to Hashem\'s mitzvos.'},
{t:'order', q:'Put the Regalim in order of the year from Nissan.', tiles:['Pesach','Shavuos','Sukkos'], why:'Three times a year everyone went up to Yerushalayim.'},
{t:'spotall', q:'Tap good ways to give tzedakah.', cells:[{label:'give with a smile',ok:true},{label:'give again and again',ok:true},{label:'give without embarrassing the poor',ok:true},{label:'give and then brag',ok:false},{label:'give only if people see',ok:false}], why:'Open your hand and your heart.'},
{t:'pairs', q:'Match each Re\'eh mitzvah to its meaning.', pairs:[['tzedakah','open your hand'],['maaser','a tenth of crops'],['Regalim','three pilgrimages'],['kashrus','signs of kosher animals']], why:'Key mitzvos of Parshas Re\'eh.'},
{t:'type', q:'How many Regalim are there? Type the number.', a:'3', alt:['three'], kb:'num', why:'Pesach, Shavuos and Sukkos.'},
{t:'spotall', q:'Tap the kosher birds.', cells:[{label:'chicken',ok:true},{label:'dove',ok:true},{label:'duck',ok:true},{label:'eagle',ok:false},{label:'raven',ok:false}], why:'The Torah lists non-kosher birds, mostly birds of prey; we eat only birds with a tradition.'}
],

{q:'What must we do for a poor person?', o:['Open our hand and give','Ignore him','Tell him to leave']}
]},
'LK.PAR.L02.47':{name:'Parsha Deep Dive: Shoftim', band:'5-6', op:'Judges at every gate, a king who writes his own Sefer Torah, and an army that sends home anyone who is afraid.', peg:{kind:'justice',show:'Tzedek tzedek tirdof',say:'Justice, justice you shall chase: Shoftim is about a fair society.'},
teach:[
{how:'Opener: Picture every city gate with honest judges sitting there. The Torah says: tzedek tzedek tirdof, justice, justice you shall pursue. A judge may never take a bribe, not even a small gift.', q:'What may a judge never take?', o:['A bribe','Notes','Water']},
{how:'A king in Yisrael must write his own Sefer Torah and keep it with him always, so he stays humble and remembers Hashem.', q:'What must a Jewish king write?', o:['His own Sefer Torah','A long poem','A list of soldiers']},
{how:'Before a battle, the officers call: whoever built a new house, planted a vineyard, or is afraid, go home! A soldier who is afraid can make others afraid.', q:'Who was sent home before a battle?', o:['Anyone who was afraid','The bravest soldiers','The Kohanim']}
],
we:[
{q:'Together: why can a judge not take even a small gift?', o:['A gift makes the eyes of the wise blind','Gifts are heavy','It is rude'], steps:['The Torah says bribery blinds the eyes of the wise.','Even a tiny favor tilts the heart.','So a judge takes nothing.']},
{q:'Together: why does the Torah say "justice" twice?', o:['Pursue justice in a just way too','It was a typo','To make it rhyme'], steps:['Tzedek, tzedek.','Seek the right result.','And reach it only in a fair way.']}
],

{t:'pairs', q:'Match each Shoftim idea to its meaning.', pairs:[['shoftim','judges'],['shotrim','officers'],['tzedek','justice'],['shochad','a bribe']], why:'The words of a fair society.'},
{t:'order', q:'Put the king\'s mitzvos in order of the pasukim.', tiles:['Do not have too many horses','Do not have too many wives','Do not have too much gold','Write a Sefer Torah'], why:'Devarim perek 17: limits on the king, then the Torah.'},

],

{q:'What does tzedek tzedek tirdof mean?', o:['Justice, justice you shall pursue','Run, run fast','Be happy, be happy']},
{q:'May we cut down fruit trees for no reason?', o:['No, bal tashchis','Yes','Only on Sundays']}
]},
'LK.PAR.L02.48':{name:'Parsha Deep Dive: Ki Seitzei', band:'5-6', op:'Seventy-four mitzvos in one parsha! Return a lost object, send away the mother bird, build a fence on your roof, and remember Amalek.', peg:{kind:'everyday mitzvos',show:'74 mitzvos',say:'Ki Seitzei has more mitzvos than any other parsha: mitzvos for every part of life.'},
teach:[
{how:'Opener: You find a lost jacket on the way to school. The Torah says: you may not hide your eyes. Return it! That is hashavas aveidah.', q:'What is hashavas aveidah?', o:['Returning a lost object','Building a sukkah','Giving charity']},
{how:'If you find a bird\'s nest, send away the mother bird before taking the eggs. The Torah promises long life for this mitzvah, shiluach haken.', q:'What do we do before taking eggs from a nest?', o:['Send the mother bird away','Take the mother too','Break the nest']},
{how:'Build a fence, a maakeh, around your roof so no one falls. At the end: remember what Amalek did, attacking the weak at the back of the camp.', q:'Why build a fence on the roof?', o:['So no one falls','To keep birds away','To look nice']}
],
we:[
{q:'Together: why does the Torah care about the mother bird\'s feelings?', o:['To teach us to be compassionate','Birds are holy','To save eggs'], steps:['The mother would suffer seeing her eggs taken.','The Torah tells us to send her away first.','It trains our hearts to be kind.']},
{q:'Together: why do we remember Amalek?', o:['They attacked the weak and tired from behind','They were our neighbors','They gave us water'], steps:['Amalek hit the weakest, at the back.','They had no fear of Hashem.','We remember it on Shabbos Zachor before Purim.']}
],
practice:[
{t:'spotall', q:'Tap mitzvos found in Ki Seitzei.', cells:[{label:'return a lost object',ok:true},{label:'send away the mother bird',ok:true},{label:'build a roof fence',ok:true},{label:'pay a worker on time',ok:true},{label:'remember Amalek',ok:true},{label:'light the Menorah',ok:false}], why:'Ki Seitzei is full of mitzvos for daily life.'},
{t:'order', q:'Put hashavas aveidah in order.', tiles:['See a lost object','Do not ignore it','Pick it up and keep it safe','Find the owner','Give it back'], why:'You may not hide your eyes.'},
{t:'sort', q:'Sort: kind to animals or not?', bins:[{id:'K',label:'The Torah way'},{id:'N',label:'Not allowed'}], items:[{label:'send the mother bird away first',bin:'K'},{label:'let an ox eat while it works',bin:'K'},{label:'help an animal under its load',bin:'K'},{label:'muzzle a working ox',bin:'N'},{label:'plow with an ox and a donkey together',bin:'N'}], why:'Ki Seitzei protects animals too.'},
{t:'pairs', q:'Match each mitzvah to its Hebrew name.', pairs:[['returning a lost object','hashavas aveidah'],['sending away the mother bird','shiluach haken'],['a fence on the roof','maakeh'],['remembering Amalek','zechiras Amalek']], why:'Mitzvos of Ki Seitzei.'},
{t:'type', q:'About how many mitzvos are in Ki Seitzei? Type the number.', a:'74', alt:['seventy-four','seventy four'], kb:'num', why:'The most of any parsha.'},
{t:'spotall', q:'Tap where a maakeh, a safety fence, is needed.', cells:[{label:'a flat roof people walk on',ok:true},{label:'an open pit',ok:true},{label:'a balcony',ok:true},{label:'a closed cupboard',ok:false}], why:'Anything dangerous must be made safe.'}
],
check:[
{t:'order', q:'Put these steps in order.', tiles:['Find the nest','Send away the mother','Take the eggs']},
{q:'What is a maakeh?', o:['A safety fence','A lost object','A bird']},
{q:'When do we read Zachor about Amalek?', o:['The Shabbos before Purim','Rosh Hashanah','Shavuos']}
]},
'LK.PAR.L02.49':{name:'Parsha Deep Dive: Ki Savo', band:'5-6', op:'A farmer carries his first fruits in a basket all the way to Yerushalayim, and tells the whole story of his people with thanks.', peg:{kind:'first fruits',show:'Bikkurim',say:'The first fruits go to Hashem with a declaration of thanks: never forget where everything comes from.'},
teach:[
{how:'Opener: Imagine a farmer walking up to Yerushalayim with a basket of his first figs and grapes. Music plays, oxen lead the way with gold horns. He gives the basket to the Kohen.', q:'What did the farmer bring to the Beis Hamikdash?', o:['Bikkurim, his first fruits','Gold coins','A lamb only']},
{how:'He says: Lavan tried to destroy our father Yaakov, we went down to Mitzrayim, Hashem took us out, and brought us to this land. Now I bring the first fruit. Hakaras hatov, saying thanks, out loud.', q:'What did the farmer say when he brought bikkurim?', o:['The story of our people and thanks to Hashem','A complaint','Nothing']},
{how:'Ki Savo has blessings for keeping the Torah and a long warning, the tochachah. Moshe says: you will be a treasured nation to Hashem.', q:'What does Hashem call us in Ki Savo?', o:['A treasured nation','A small group','Strangers']}
],
we:[
{q:'Together: why bring the FIRST fruit?', o:['To show the best goes to Hashem first','The first are smallest','To get rid of them'], steps:['The farmer waited all year.','The first ripe fruit is the most exciting.','He gives it to Hashem first, with thanks.']},
{q:'Together: how did a farmer mark his first fruits?', o:['He tied a reed around them in the field','He painted them','He counted them'], steps:['He walks in the field and sees the first ripe fig.','He ties a reed around it.','He says: this is bikkurim.']}
],
practice:[
{t:'order', q:'Put the bikkurim journey in order.', tiles:['See the first ripe fruit','Tie a reed around it','Walk up to Yerushalayim','Give the basket to the Kohen','Say the declaration of thanks'], why:'Devarim perek 26.'},
{t:'spotall', q:'Tap the fruits that could be bikkurim.', cells:[{label:'figs',ok:true},{label:'grapes',ok:true},{label:'pomegranates',ok:true},{label:'dates',ok:true},{label:'bananas',ok:false},{label:'oranges',ok:false}], why:'Bikkurim come only from the seven species.'},
{t:'sort', q:'Sort: is it hakaras hatov or not?', bins:[{id:'Y',label:'Saying thanks'},{id:'N',label:'Forgetting to thank'}], items:[{label:'thanking your mother for dinner',bin:'Y'},{label:'bringing bikkurim',bin:'Y'},{label:'saying Modeh Ani',bin:'Y'},{label:'taking without a word',bin:'N'},{label:'saying it is all mine',bin:'N'}], why:'Bikkurim trains us in gratitude.'},
{t:'pairs', q:'Match each Ki Savo word to its meaning.', pairs:[['bikkurim','first fruits'],['am segulah','a treasured nation'],['tochachah','a warning'],['hakaras hatov','recognizing the good']], why:'Key ideas of Parshas Ki Savo.'},
{t:'type', q:'From how many species were bikkurim brought? Type the number.', a:'7', alt:['seven'], kb:'num', why:'Only the shiv\'as haminim.'},
{t:'order', q:'Put the farmer\'s declaration in order.', tiles:['Lavan tried to destroy Yaakov','We went down to Mitzrayim','Hashem took us out','He brought us to this land','I bring the first fruit'], why:'The same story we tell at the Seder.'}
],
check:[
{t:'order', q:'Put these moments of Ki Savo in order.', tiles:['Tie a reed','Carry to Yerushalayim','Give to the Kohen']},
{q:'What are bikkurim?', o:['First fruits','Last fruits','Bread']},
{q:'What middah does bikkurim teach?', o:['Hakaras hatov','Anger','Laziness']}
]},
'LK.PAR.L02.50':{name:'Parsha Deep Dive: Nitzavim and Vayeilech', band:'5-6', op:'Everyone stands together: leaders, children, woodchoppers and water carriers. The Torah is not far away. And Moshe passes the leadership to Yehoshua.', peg:{kind:'close to you',show:'Not in the sky',say:'The Torah is not in the heavens or across the sea: it is very close to you, in your mouth and in your heart.'},
teach:[
{how:'Opener: Atem nitzavim hayom kulchem: you are all standing here today. Leaders, children, woodchoppers, water carriers: every single Jew, together, entering the covenant with Hashem.', q:'Who stood together in Nitzavim?', o:['Every Jew, from leaders to water carriers','Only the leaders','Only Moshe']},
{how:'The Torah is not in Shamayim, so that you need someone to fly up and get it. It is not across the sea. It is very close to you, in your mouth and your heart, to do it.', q:'Where does the Torah say it is?', o:['Very close to you','In the sky','Across the sea']},
{how:'In Vayeilech, Moshe is 120 years old. He tells Yehoshua: be strong and brave. He writes the Torah and gives the mitzvah of Hakhel: everyone gathers to hear the Torah once in seven years.', q:'What did Moshe tell Yehoshua?', o:['Be strong and brave','Go back to Mitzrayim','Rest']}
],
we:[
{q:'Together: what is teshuvah, from Nitzavim?', o:['Returning to Hashem with all your heart','Running away','Forgetting'], steps:['Nitzavim says: you will return to Hashem.','With all your heart and soul.','Hashem welcomes us back. It is read before Rosh Hashanah.']},
{q:'Together: what is the last mitzvah in the Torah?', o:['Every Jew should write a Sefer Torah','Light candles','Eat matzah'], steps:['Vayeilech: write this song for yourselves.','Chazal: each Jew should write a Sefer Torah.','Today we fulfill it by buying sefarim and learning.']}
],
practice:[
{t:'spotall', q:'Tap who stood together in Nitzavim.', cells:[{label:'leaders',ok:true},{label:'children',ok:true},{label:'woodchoppers',ok:true},{label:'water carriers',ok:true},{label:'only the rich',ok:false}], why:'Every single Jew, together.'},
{t:'sort', q:'Sort: is the Torah far or close?', bins:[{id:'C',label:'What the Torah says'},{id:'F',label:'Not what it says'}], items:[{label:'it is in your mouth',bin:'C'},{label:'it is in your heart',bin:'C'},{label:'you can do it',bin:'C'},{label:'it is in the sky',bin:'F'},{label:'it is too hard',bin:'F'}], why:'Ki karov eilecha hadavar meod.'},
{t:'order', q:'Put Vayeilech in order.', tiles:['Moshe turns 120','He tells Yehoshua: be strong','He writes the Torah','He gives the mitzvah of Hakhel'], why:'Devarim perek 31.'},
{t:'pairs', q:'Match each Nitzavim and Vayeilech word to its meaning.', pairs:[['nitzavim','standing'],['teshuvah','returning to Hashem'],['Hakhel','gathering to hear the Torah'],['chazak ve\'ematz','be strong and brave']], why:'Key ideas of Nitzavim and Vayeilech.'},
{t:'type', q:'How old was Moshe in Vayeilech? Type the number.', a:'120', alt:['one hundred twenty','a hundred and twenty'], kb:'num', why:'That is why we bless: till 120!'},
{t:'spotall', q:'Tap ways to do teshuvah.', cells:[{label:'regret the mistake',ok:true},{label:'say sorry to Hashem',ok:true},{label:'decide not to do it again',ok:true},{label:'blame someone else',ok:false},{label:'hide it',ok:false}], why:'Regret, confession and a firm decision.'}
],
check:[
{t:'order', q:'Put these moments of Nitzavim and Vayeilech in order.', tiles:['Everyone stands together','The Torah is close','Moshe gives Yehoshua strength']},
{q:'Where is the Torah, says Nitzavim?', o:['Close to you','In the sky','In the sea']},
{q:'What happens at Hakhel?', o:['Everyone gathers to hear the Torah','A war','A wedding']}
]},
'LK.PAR.L02.51':{name:'Parsha Deep Dive: Haazinu', band:'5-6', op:'Listen, heavens! Hear, earth! Moshe\'s last song, a poem of the whole history of our people, and then he climbs Har Nevo.', peg:{kind:'a song',show:'Shiras Haazinu',say:'Haazinu is a song, written in two columns like a brick wall, so it is remembered forever.'},
teach:[
{how:'Opener: Moshe calls heaven and earth as witnesses: listen! Haazinu is a song that tells the whole story of Bnei Yisrael, the good times, the hard times, and how Hashem never leaves us.', q:'Whom does Moshe call to listen in Haazinu?', o:['The heavens and the earth','The fish','The kings']},
{how:'Moshe says: ask your father, and he will tell you; your grandparents, and they will say. We learn from the generations before us.', q:'Whom does Haazinu tell us to ask?', o:['Our fathers and grandparents','Strangers','No one']},
{how:'After the song, Hashem tells Moshe: go up Har Nevo, look at the land of Canaan, and there you will pass away.', q:'Which mountain did Moshe climb?', o:['Har Nevo','Har Sinai','Har Hamoriah']}
],
we:[
{q:'Together: why is Haazinu written as a song?', o:['A song is remembered forever','Songs are shorter','It was Purim'], steps:['Moshe wanted the words never forgotten.','People remember songs.','So it is written as a song, in two columns.']},
{q:'Together: what does Hashem do like an eagle?', o:['Carries and protects us','Flies away','Hunts'], steps:['An eagle carries its young on its wings.','No arrow can hit the young without hitting the eagle first.','So Hashem protects us.']}
],
practice:[
{t:'pairs', q:'Match each Haazinu picture to its meaning.', pairs:[['heavens and earth','witnesses forever'],['an eagle','Hashem carries us'],['rain and dew','Torah falls softly'],['a rock','Hashem is strong and fair']], why:'The images of Shiras Haazinu.'},
{t:'spotall', q:'Tap whom Haazinu tells us to ask.', cells:[{label:'your father',ok:true},{label:'your grandparents',ok:true},{label:'your elders',ok:true},{label:'a stranger on the street',ok:false}], why:'We learn from the generations before us.'},
{t:'order', q:'Put the end of Moshe\'s life in order.', tiles:['Moshe sings Haazinu','He teaches it to the people','Hashem says: climb Har Nevo','Moshe sees the land'], why:'Devarim perek 32.'},
{t:'sort', q:'Sort the Haazinu picture: Hashem\'s care or the people\'s forgetting?', bins:[{id:'H',label:'Hashem\'s care'},{id:'P',label:'The people forgot'}], items:[{label:'found them in a desert',bin:'H'},{label:'like an eagle over its young',bin:'H'},{label:'honey from a rock',bin:'H'},{label:'grew fat and kicked',bin:'P'},{label:'forgot the Rock who made them',bin:'P'}], why:'Haazinu tells of Hashem\'s love and our forgetting, and hope at the end.'},
{t:'type', q:'Which mountain did Moshe climb at the end? Type the name.', a:'Nevo', alt:['har nevo','mount nevo','mt nevo'], kb:'abc', why:'From Har Nevo he saw the whole land.'},
{t:'pairs', q:'Match the Yomim Tovim around Haazinu.', pairs:[['Rosh Hashanah','the shofar'],['Yom Kippur','fasting'],['Sukkos','the sukkah'],['Simchas Torah','dancing with the Torah']], why:'Haazinu is read in the season of the Yomim Tovim.'}
],
check:[
{t:'order', q:'Put these moments of Haazinu in order.', tiles:['The song','Climbing Har Nevo','Seeing the land']},
{q:'Why is Haazinu a song?', o:['So it is remembered forever','Because it is short','For dancing only']},
{q:'What is Hashem compared to, protecting us?', o:['An eagle','A lion','A fish']}
]},
'LK.PAR.L02.52':{name:'Parsha Deep Dive: Vezos Habrachah', band:'5-6', op:'Moshe blesses every shevet, looks at the land, and passes away. The Torah ends, and on Simchas Torah we begin again!', peg:{kind:'circle',show:'End → Beginning',say:'We finish the Torah on Simchas Torah and right away start Bereishis again: Torah never ends.'},
teach:[
{how:'Opener: Like Yaakov before him, Moshe blesses each shevet before he dies: Yehudah, Levi, Binyamin, Yosef, Zevulun and Yissachar, and the rest.', q:'What did Moshe give each shevet?', o:['A brachah','Gold','A new name']},
{how:'Moshe passes away on Har Nevo, at 120 years. No one knows where he is buried. Never again was there a navi like Moshe, who knew Hashem face to face.', q:'Who knows where Moshe is buried?', o:['No one','Everyone','Only the Kohanim']},
{how:'The Torah ends with the words before the eyes of all Yisrael. The last letter is Lamed, and the first letter of the Torah is Beis: together they spell lev, heart. On Simchas Torah we finish and start again!', q:'What do we do on Simchas Torah?', o:['Finish the Torah and start it again','Start a new book','Close the Torah forever']}
],
we:[
{q:'Together: why is no one told where Moshe is buried?', o:['So people would not worship his grave','It was too far','He was never buried'], steps:['Moshe was the greatest navi.','People might make his grave into a shrine.','Hashem kept it hidden.']},
{q:'Together: what does Zevulun and Yissachar\'s brachah teach?', o:['Business people can support Torah learners and share the reward','Only rich people learn','Ships are holy'], steps:['Zevulun traded by sea.','Yissachar sat and learned Torah.','Zevulun supported Yissachar, and they share the merit.']}
],
practice:[
{t:'pairs', q:'Match each shevet to its brachah.', pairs:[['Zevulun','rejoice in your travels'],['Yissachar','in your tents of learning'],['Levi','teaches the Torah'],['Binyamin','Hashem dwells in his land']], why:'Moshe\'s brachos, Devarim perek 33.'},
{t:'order', q:'Put the end of the Torah in order.', tiles:['Moshe blesses the shevatim','He climbs Har Nevo','He sees the whole land','Moshe passes away','Yehoshua leads'], why:'Devarim perakim 33 to 34.'},
{t:'spotall', q:'Tap what happens on Simchas Torah.', cells:[{label:'finish Vezos Habrachah',ok:true},{label:'start Bereishis',ok:true},{label:'dance with the Sifrei Torah',ok:true},{label:'eat matzah',ok:false},{label:'blow the shofar',ok:false}], why:'We end and begin, with great joy.'},
{t:'sort', q:'Sort: which Torah word is it?', bins:[{id:'L',label:'Last word of the Torah: Yisrael'},{id:'F',label:'First word of the Torah: Bereishis'}], items:[{label:'ends with Lamed',bin:'L'},{label:'before the eyes of all',bin:'L'},{label:'starts with Beis',bin:'F'},{label:'in the beginning',bin:'F'}], why:'Lamed and Beis make lev, a heart.'},
{t:'type', q:'How many parshiyos are in the whole Torah? Type the number.', a:'54', alt:['fifty-four','fifty four'], kb:'num', why:'Fifty-four parshiyos, from Bereishis to Vezos Habrachah.'},
{t:'order', q:'Review: put the parshiyos of Sefer Devarim in order.', tiles:['Devarim','Va\'eschanan','Eikev','Re\'eh','Shoftim','Ki Seitzei','Ki Savo','Nitzavim','Vayeilech','Haazinu','Vezos Habrachah'], why:'Eleven parshiyos in Sefer Devarim.'}
],
check:[
{t:'order', q:'Put these moments of Vezos Habrachah in order.', tiles:['The brachos','Moshe passes away','Simchas Torah: start again']},
{q:'Which two letters make "lev"?', o:['The last and first letters of the Torah','The first two letters of Shema','Two random letters']},
{q:'Was there ever a navi like Moshe again?', o:['No','Yes, many','Only one']}
]},

/* ===== ROUND 10b (takeover3): "and we start again", deep dives for Bereishis to Toldos (LK.PAR.L03.03 to .08), placed after Vezos Habrachah
   on the Parsha Trail like Simchas Torah. Same hands-on standard. With these, every one of the 54 parshiyos has a deep dive. ===== */
'LK.PAR.L03.03':{name:'Parsha Deep Dive: Bereishis', band:'5-6', op:'Nothing at all, and then: let there be light! Six days of creation, a garden, and the first mistake.', peg:{kind:'seven days',show:'Six days and Shabbos',say:'Hashem created the world in six days and rested on the seventh: Shabbos.'},
teach:[
{how:'Opener: Close your eyes. Darkness, nothing. Then Hashem says: let there be light! And there was light. Day by day, the world fills up: sky, seas, plants, sun and moon, fish and birds, animals, and on the sixth day, man.', q:'What did Hashem create on the very first day?', o:['Light','Animals','The sun']},
{how:'Adam and Chavah live in Gan Eden. Hashem says: eat from every tree except one, the Eitz Hada\'as. The snake tricks Chavah, they eat, and they must leave the garden.', q:'Which tree were Adam and Chavah told not to eat from?', o:['The Eitz Hada\'as','The apple orchard','The olive tree']},
{how:'On the seventh day Hashem rested and blessed it: Shabbos. When we keep Shabbos, we testify that Hashem created the world.', q:'What did Hashem make holy on the seventh day?', o:['Shabbos','The moon','The sea']}
],
we:[
{q:'Together: why was man created last?', o:['So everything would be ready for him, like a guest at a set table','Hashem forgot him','Animals were more important'], steps:['A host prepares the house before the guest arrives.','The whole world was set up first.','Then Adam came in, and everything was ready.']},
{q:'Together: what did Kayin answer when asked where Hevel was?', o:['Am I my brother\'s keeper?','He is in the field','I will find him'], steps:['Kayin was jealous and killed Hevel.','Hashem asked: where is Hevel your brother?','Kayin said: am I my brother\'s keeper? We learn: yes, we are.']}
],
practice:[
{t:'order', q:'Put the six days of creation in order.', tiles:['Light','Sky','Land, seas and plants','Sun, moon and stars','Fish and birds','Animals and man'], why:'Bereishis perek 1.'},
{t:'sort', q:'Sort: created in the first three days or the last three?', bins:[{id:'A',label:'Days 1 to 3: the places'},{id:'B',label:'Days 4 to 6: what fills them'}], items:[{label:'light',bin:'A'},{label:'sky and water',bin:'A'},{label:'land',bin:'A'},{label:'sun and moon',bin:'B'},{label:'fish and birds',bin:'B'},{label:'animals',bin:'B'}], why:'The first three days make the spaces; the next three fill them.'},
{t:'pairs', q:'Match each person to Parshas Bereishis.', pairs:[['Adam','the first man'],['Chavah','mother of all life'],['Kayin','was jealous of his brother'],['Hevel','brought the best of his flock']], why:'The first family.'},
{t:'spotall', q:'Tap what happened in Parshas Bereishis.', cells:[{label:'creation of the world',ok:true},{label:'Gan Eden',ok:true},{label:'the first Shabbos',ok:true},{label:'Kayin and Hevel',ok:true},{label:'the mabul',ok:false},{label:'the Tower of Bavel',ok:false}], why:'The mabul and the Tower are in Noach.'},
{t:'type', q:'On which day was man created? Type the number.', a:'6', alt:['six','sixth','6th'], kb:'num', why:'On the sixth day, last of all.'},
{t:'spotall', q:'Tap ways we testify that Hashem created the world.', cells:[{label:'keeping Shabbos',ok:true},{label:'saying Kiddush',ok:true},{label:'saying brachos',ok:true},{label:'ignoring the world',ok:false}], why:'Every Shabbos and every brachah says: Hashem made this.'}
],
check:[
{t:'order', q:'Put the first three days in order.', tiles:['Light','Sky','Land and plants']},
{q:'Which day is Shabbos?', o:['The seventh','The first','The fifth']},
{q:'Who tricked Chavah?', o:['The snake','Kayin','A lion']}
]},
'LK.PAR.L03.04':{name:'Parsha Deep Dive: Noach', band:'5-6', op:'One good man in a world gone wrong builds a giant teivah. Forty days of rain, a dove with an olive leaf, and a rainbow promise.', peg:{kind:'rainbow',show:'A promise',say:'The rainbow is Hashem\'s sign: never again a flood to destroy the whole world.'},
teach:[
{how:'Opener: The world is full of robbery and evil. Only Noach is a tzaddik. Hashem tells him: build a teivah, an ark, of gopher wood. For 120 years Noach builds, and people ask what he is doing, giving them time to do teshuvah.', q:'Why did Noach build the teivah slowly, for 120 years?', o:['To give people time to do teshuvah','He was a slow builder','He had no wood']},
{how:'Noach, his family and the animals enter the teivah. Rain falls forty days and nights. The water covers even the mountains.', q:'How long did the rain fall?', o:['Forty days and forty nights','Seven days','One year']},
{how:'Noach sends a dove. It comes back with an olive leaf: the water is going down! When they leave, Hashem puts a rainbow in the clouds as a promise.', q:'What did the dove bring back?', o:['An olive leaf','A fish','A stone']}
],
we:[
{q:'Together: why did Noach send a raven first and then a dove?', o:['The raven did not do the job; the dove did','Ravens are faster','He liked birds'], steps:['The raven flew back and forth.','The dove came back with an olive leaf.','Now Noach knew the water was going down.']},
{q:'Together: what went wrong at the Migdal Bavel?', o:['People wanted to fight Hashem with a tower','They built too slowly','They ran out of bricks'], steps:['Everyone spoke one language.','They built a tower to reach the heavens and make a name for themselves.','Hashem mixed their languages and scattered them.']}
],
practice:[
{t:'order', q:'Put the story of the mabul in order.', tiles:['Noach builds the teivah','The animals come in','Forty days of rain','The dove brings an olive leaf','The rainbow'], why:'Bereishis perakim 6 to 9.'},
{t:'pairs', q:'Match each Noach word to its meaning.', pairs:[['teivah','the ark'],['mabul','the flood'],['keshes','the rainbow'],['Migdal Bavel','the tower']], why:'Key words of Parshas Noach.'},
{t:'sort', q:'Sort: how many of each animal came into the teivah?', bins:[{id:'T',label:'Two of each'},{id:'S',label:'Seven pairs'}], items:[{label:'lions',bin:'T'},{label:'camels',bin:'T'},{label:'pigs',bin:'T'},{label:'sheep',bin:'S'},{label:'cows',bin:'S'},{label:'goats',bin:'S'}], why:'Non-kosher animals came in pairs; kosher animals came seven pairs, also for korbanos after the mabul.'},

}, {"t": "sort", "q": "Sort: first four sons, or last four sons?", "bins": [{"id": "A", "label": "First four"}, {"id": "B", "label": "Last four"}], "items": [{"label": "Reuven", "bin": "A"}, {"label": "Shimon", "bin": "A"}, {"label": "Levi", "bin": "A"}, {"label": "Yehudah", "bin": "A"}, {"label": "Yissachar", "bin": "B"}, {"label": "Zevulun", "bin": "B"}, {"label": "Yosef", "bin": "B"}, {"label": "Binyamin", "bin": "B"}], "h": "Reuven starts the first four.", "why": "First: Reuven, Shimon, Levi, Yehudah. Last: Yissachar, Zevulun, Yosef, Binyamin."}, {"t": "sort", "q": "Sort: a son of Yaakov, or not?", "bins": [{"id": "Y", "label": "Son of Yaakov"}, {"id": "N", "label": "Not a son"}], "items": [{"label": "Levi", "bin": "Y"}, {"label": "Gad", "bin": "Y"}, {"label": "Asher", "bin": "Y"}, {"label": "Dan", "bin": "Y"}, {"label": "Avraham", "bin": "N"}, {"label": "Moshe", "bin": "N"}, {"label": "Yitzchak", "bin": "N"}], "h": "Avraham and Yitzchak came before Yaakov.", "why": "Levi, Gad, Asher and Dan are sons of Yaakov."}, {"t": "sort", "q": "Sort: a son of Leah, or a son of Rochel?", "bins": [{"id": "L", "label": "Son of Leah"}, {"id": "R", "label": "Son of Rochel"}], "items": [{"label": "Reuven", "bin": "L"}, {"label": "Shimon", "bin": "L"}, {"label": "Levi", "bin": "L"}, {"label": "Yehudah", "bin": "L"}, {"label": "Yissachar", "bin": "L"}, {"label": "Zevulun", "bin": "L"}, {"label": "Yosef", "bin": "R"}, {"label": "Binyamin", "bin": "R"}], "h": "Rochel had two sons.", "why": "Leah: Reuven, Shimon, Levi, Yehudah, Yissachar, Zevulun. Rochel: Yosef and Binyamin."}, {"t": "pairs", "q": "Match each place to the son.", "pairs": [["first", "Reuven"], ["second", "Shimon"], ["third", "Levi"], ["fourth", "Yehudah"]], "h": "Say the first four in order.", "why": "Reuven, Shimon, Levi, Yehudah."}, {"t": "pairs", "q": "Match each son to the brother born right after him.", "pairs": [["Reuven", "Shimon"], ["Dan", "Naftali"], ["Gad", "Asher"], ["Yissachar", "Zevulun"], ["Yosef", "Binyamin"]], "h": "They go in twos.", "why": "Say the twelve in order to check each pair."}, {"t": "pairs", "q": "Match: who is this?", "pairs": [["the oldest son", "Reuven"], ["the youngest son", "Binyamin"], ["the father of the twelve", "Yaakov"], ["born right before Binyamin", "Yosef"]], "h": "Think: first, last, and the father.", "why": "Reuven oldest, Binyamin youngest, Yosef just before him, Yaakov their father."}, {"t": "spotall", "q": "Tap every son of Yaakov.", "cells": [{"label": "Reuven", "ok": true}, {"label": "Naftali", "ok": true}, {"label": "Zevulun", "ok": true}, {"label": "Yosef", "ok": true}, {"label": "Avraham", "ok": false}, {"label": "Aharon", "ok": false}], "h": "Two names are not his sons.", "why": "Reuven, Naftali, Zevulun and Yosef are sons of Yaakov."}, {"t": "spotall", "q": "Tap every son born before Yehudah.", "cells": [{"label": "Reuven", "ok": true}, {"label": "Shimon", "ok": true}, {"label": "Levi", "ok": true}, {"label": "Dan", "ok": false}, {"label": "Binyamin", "ok": false}, {"label": "Asher", "ok": false}], "h": "Yehudah was fourth.", "why": "Reuven, Shimon and Levi came before Yehudah."}, {"t": "type", "q": "How many sons did Yaakov have? Type the number.", "a": "12", "alt": ["twelve", "Twelve"], "h": "More than ten.", "why": "Yaakov had twelve sons."}], "check": [{"t": "order", "q": "Check: put these sons in birth order.", "tiles": ["Reuven", "Levi", "Dan", "Yosef", "Binyamin"]}, {"q": "Which one is NOT a son of Yaakov?", "o": ["Moshe", "Gad", "Asher"]}, {"q": "Who was born last?", "o": ["Binyamin", "Yosef", "Reuven"]}]},
'LK.CHEM.L01.03':{name:"Chemdas 3: The Five Books of the Chumash","band": "K-2", "peg": {"kind": "song", "show": "Bereishis, Shemos, Vayikra, Bamidbar, Devarim", "say": "Five books in a row: sing them every time you open your Chumash."}, "op": "Count on one hand: five fingers, five books of the Chumash!", "teach": [{"how": "The Chumash has five books. Moshe Rabbeinu wrote them, as Hashem told him. The first book is Bereishis.", "q": "Which book is first?", "o": ["Bereishis", "Devarim", "Shemos"], "h": "It starts with the creation of the world."}, {"how": "The order is Bereishis, Shemos, Vayikra, Bamidbar, Devarim. Say it like a song, one finger for each book.", "q": "Which book comes right after Shemos?", "o": ["Vayikra", "Devarim", "Bereishis"], "h": "Count: one, two, three."}, {"how": "Bereishis tells about creation and our fathers. Shemos tells how we left Mitzrayim and got the Torah. Vayikra teaches the offerings and the kohanim. Bamidbar tells our travels in the desert. Devarim is the last words of Moshe.", "q": "Which book tells how we left Mitzrayim?", "o": ["Shemos", "Bereishis", "Devarim"], "h": "It is the second book."}], "we": [{"q": "Together: which book is last?", "o": ["Devarim", "Bamidbar", "Vayikra"], "steps": ["Say the five books.", "Count to five.", "The fifth is Devarim."]}, {"q": "Together: which book tells about the six days of creation?", "o": ["Bereishis", "Shemos", "Bamidbar"], "steps": ["Creation is the very beginning.", "So it is in the first book.", "That is Bereishis."]}], "practice": [{"t": "order", "q": "Put the five books in order.", "tiles": ["Bereishis", "Shemos", "Vayikra", "Bamidbar", "Devarim"], "h": "Bereishis is first.", "why": "Bereishis, Shemos, Vayikra, Bamidbar, Devarim."}, {"t": "order", "q": "Put the first three books in order.", "tiles": ["Bereishis", "Shemos", "Vayikra"], "h": "Start at the beginning.", "why": "Bereishis, Shemos, Vayikra."}, {"t": "order", "q": "Put the last three books in order.", "tiles": ["Vayikra", "Bamidbar", "Devarim"], "h": "The middle book starts this line.", "why": "Vayikra, Bamidbar, Devarim."}, {"t": "sort", "q": "Sort: a book of the Chumash, or not?", "bins": [{"id": "Y", "label": "Book of the Chumash"}, {"id": "N", "label": "Not a book"}], "items": [{"label": "Bereishis", "bin": "Y"}, {"label": "Shemos", "bin": "Y"}, {"label": "Vayikra", "bin": "Y"}, {"label": "Devarim", "bin": "Y"}, {"label": "Shabbos", "bin": "N"}, {"label": "Pesach", "bin": "N"}, {"label": "Avraham", "bin": "N"}], "h": "Only five names are books.", "why": "The books are Bereishis, Shemos, Vayikra, Bamidbar and Devarim."}, {"t": "sort", "q": "Sort: before Vayikra, or after Vayikra?", "bins": [{"id": "A", "label": "Before Vayikra"}, {"id": "B", "label": "After Vayikra"}], "items": [{"label": "Bereishis", "bin": "A"}, {"label": "Shemos", "bin": "A"}, {"label": "Bamidbar", "bin": "B"}, {"label": "Devarim", "bin": "B"}], "h": "Vayikra is right in the middle.", "why": "Two books come before Vayikra and two after."}, {"t": "sort", "q": "Sort: which book tells this?", "bins": [{"id": "B", "label": "Bereishis"}, {"id": "S", "label": "Shemos"}, {"id": "D", "label": "Devarim"}], "items": [{"label": "creation of the world", "bin": "B"}, {"label": "our three fathers", "bin": "B"}, {"label": "leaving Mitzrayim", "bin": "S"}, {"label": "getting the Torah at Mount Sinai", "bin": "S"}, {"label": "Moshe's last words", "bin": "D"}], "h": "The beginning is in the first book.", "why": "Creation and the fathers in Bereishis, Mitzrayim and Sinai in Shemos, last words in Devarim."}, {"t": "pairs", "q": "Match each place to the book.", "pairs": [["first", "Bereishis"], ["second", "Shemos"], ["third", "Vayikra"], ["fourth", "Bamidbar"], ["fifth", "Devarim"]], "h": "Count on your fingers.", "why": "Bereishis one, Shemos two, Vayikra three, Bamidbar four, Devarim five."}, {"t": "pairs", "q": "Match each book to what it tells.", "pairs": [["Bereishis", "creation and the fathers"], ["Shemos", "leaving Mitzrayim"], ["Vayikra", "offerings and the kohanim"], ["Bamidbar", "travels in the desert"], ["Devarim", "Moshe's last words"]], "h": "Start with the first book.", "why": "Each book has its own big story."}, {"t": "pairs", "q": "Match each book to the book right after it.", "pairs": [["Bereishis", "Shemos"], ["Shemos", "Vayikra"], ["Vayikra", "Bamidbar"], ["Bamidbar", "Devarim"]], "h": "Sing the order.", "why": "Bereishis, Shemos, Vayikra, Bamidbar, Devarim."}, {"t": "spotall", "q": "Tap every book of the Chumash.", "cells": [{"label": "Bereishis", "ok": true}, {"label": "Shemos", "ok": true}, {"label": "Bamidbar", "ok": true}, {"label": "Devarim", "ok": true}, {"label": "Pesach", "ok": false}, {"label": "Yaakov", "ok": false}, {"label": "Shabbos", "ok": false}], "h": "Three names are not books.", "why": "Bereishis, Shemos, Bamidbar and Devarim are books of the Chumash."}, {"t": "spotall", "q": "Tap every book that comes before Bamidbar.", "cells": [{"label": "Bereishis", "ok": true}, {"label": "Shemos", "ok": true}, {"label": "Vayikra", "ok": true}, {"label": "Devarim", "ok": false}], "h": "Bamidbar is fourth.", "why": "Bereishis, Shemos and Vayikra come before Bamidbar."}, {"t": "type", "q": "How many books are in the Chumash? Type the number.", "a": "5", "alt": ["five", "Five"], "h": "Count your fingers on one hand.", "why": "The Chumash has five books."}], "check": [{"t": "order", "q": "Check: the five books, first to last.", "tiles": ["Bereishis", "Shemos", "Vayikra", "Bamidbar", "Devarim"]}, {"q": "Which book comes right after Vayikra?", "o": ["Bamidbar", "Shemos", "Bereishis"]}, {"q": "Which book is Moshe's last words?", "o": ["Devarim", "Vayikra", "Shemos"]}]},
'LK.CHEM.L01.04':{name:"Chemdas 4: Six Days of Creation and Shabbos","band": "K-2", "peg": {"kind": "rhyme", "show": "Light, sky, trees; sun, fish, me; then Shabbos!", "say": "Light, sky, trees; sun, fish, me; and day seven we rest happily."}, "op": "What did Hashem make first, the sun or the trees? Let us find out!", "teach": [{"how": "Hashem made the world in six days. On day one, Hashem made light. On day two, Hashem made the sky.", "q": "What did Hashem make on day one?", "o": ["Light", "Fish", "Trees"], "h": "The very first thing, so we can see."}, {"how": "On day three, Hashem made dry land and seas, with grass and trees. On day four, Hashem made the sun, the moon and the stars.", "q": "On which day were the sun and moon made?", "o": ["Day four", "Day one", "Day six"], "h": "After the trees."}, {"how": "On day five, Hashem made the fish and the birds. On day six, the animals, and then Adam and Chava, the first people. Day seven is Shabbos: Hashem stopped creating.", "q": "What is day seven?", "o": ["Shabbos, Hashem stopped creating", "The day of the birds", "The day of the light"], "h": "The day we rest too."}], "we": [{"q": "Together: on which day were the birds made?", "o": ["Day five", "Day two", "Day seven"], "steps": ["Fish swim in the water.", "Birds fly in the sky.", "Both were made on day five."]}, {"q": "Together: what came first, trees or animals?", "o": ["Trees", "Animals", "Both on the same day"], "steps": ["Trees were made on day three.", "Animals were made on day six.", "So trees came first."]}], "practice": [{"t": "order", "q": "Put the days in order: what was made?", "tiles": ["light", "sky", "land, seas and trees", "sun, moon and stars", "fish and birds", "animals, Adam and Chava", "Shabbos"], "h": "Light came first.", "why": "Day one light, two sky, three land and trees, four sun, five fish, six animals, Adam and Chava, seven Shabbos."}, {"t": "order", "q": "Put these in the order Hashem made them.", "tiles": ["light", "trees", "fish", "Adam and Chava"], "h": "Adam and Chava were made last.", "why": "Light day one, trees day three, fish day five, Adam and Chava day six."}, {"t": "order", "q": "Which came first? Put them in order.", "tiles": ["sky", "sun", "birds", "animals"], "h": "The sky came on day two.", "why": "Sky day two, sun day four, birds day five, animals day six."}, {"t": "sort", "q": "Sort: made on day three, or day four?", "bins": [{"id": "A", "label": "Day three"}, {"id": "B", "label": "Day four"}], "items": [{"label": "grass", "bin": "A"}, {"label": "trees", "bin": "A"}, {"label": "seas", "bin": "A"}, {"label": "sun", "bin": "B"}, {"label": "moon", "bin": "B"}, {"label": "stars", "bin": "B"}], "h": "Day four filled the sky with lights.", "why": "Land, seas, grass and trees on day three; sun, moon and stars on day four."}, {"t": "sort", "q": "Sort: made on day five, or day six?", "bins": [{"id": "A", "label": "Day five"}, {"id": "B", "label": "Day six"}], "items": [{"label": "fish", "bin": "A"}, {"label": "birds", "bin": "A"}, {"label": "lions", "bin": "B"}, {"label": "cows", "bin": "B"}, {"label": "Adam and Chava", "bin": "B"}], "h": "Swimming and flying came first.", "why": "Fish and birds on day five; animals, Adam and Chava on day six."}, {"t": "sort", "q": "Sort: first three days, or next three days?", "bins": [{"id": "A", "label": "Days one to three"}, {"id": "B", "label": "Days four to six"}], "items": [{"label": "light", "bin": "A"}, {"label": "sky", "bin": "A"}, {"label": "trees", "bin": "A"}, {"label": "sun", "bin": "B"}, {"label": "fish", "bin": "B"}, {"label": "animals", "bin": "B"}], "h": "Light, sky and trees came first.", "why": "Days one to three: light, sky, trees. Days four to six: sun, fish, animals."}, {"t": "pairs", "q": "Match each day to what was made.", "pairs": [["Day 1", "light"], ["Day 2", "sky"], ["Day 3", "land and trees"]], "h": "Start with light.", "why": "Light, sky, then land and trees."}, {"t": "pairs", "q": "Match the next days to what was made.", "pairs": [["Day 4", "sun, moon and stars"], ["Day 5", "fish and birds"], ["Day 6", "animals, Adam and Chava"], ["Day 7", "Shabbos"]], "h": "Day seven is the day of rest.", "why": "Sun, fish, animals, Adam and Chava, then Shabbos."}, {"t": "pairs", "q": "Match each one to its partner from the same day.", "pairs": [["sun", "moon"], ["fish", "birds"], ["land", "seas"], ["animals", "Adam and Chava"]], "h": "Think: same day, same team.", "why": "Sun and moon day four, fish and birds day five, land and seas day three, animals and Adam and Chava day six."}, {"t": "spotall", "q": "Tap every thing made on day six.", "cells": [{"label": "cows", "ok": true}, {"label": "lions", "ok": true}, {"label": "Adam and Chava", "ok": true}, {"label": "fish", "ok": false}, {"label": "sun", "ok": false}, {"label": "trees", "ok": false}], "h": "Day six had walking animals.", "why": "Animals, Adam and Chava were made on day six."}, {"t": "spotall", "q": "Tap every thing made before the sun.", "cells": [{"label": "light", "ok": true}, {"label": "sky", "ok": true}, {"label": "trees", "ok": true}, {"label": "grass", "ok": true}, {"label": "birds", "ok": false}, {"label": "Adam and Chava", "ok": false}], "h": "The sun came on day four.", "why": "Light, sky, grass and trees came before the sun."}, {"t": "type", "q": "On which day did Hashem make light? Type the number.", "a": "1", "alt": ["one", "One", "day 1", "day one"], "h": "It was the very first day.", "why": "Light was made on day one."}], "check": [{"t": "order", "q": "Check: put creation in order.", "tiles": ["light", "sky", "trees", "sun", "fish", "Adam and Chava", "Shabbos"]}, {"q": "What did Hashem make on day four?", "o": ["The sun, moon and stars", "Fish and birds", "Light"]}, {"q": "What did Hashem make last, on day six?", "o": ["Adam and Chava, the first people", "The sky", "Trees"]}]},
