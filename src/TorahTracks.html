{how:'Each Regel has a mitzvah of simchah. On Sukkos especially: v\'samachta b\'chagecha, rejoice on your festival. It is called Zman Simchaseinu.', q:'Which Yom Tov is called Zman Simchaseinu, the time of our joy?', o:['Sukkos','Pesach','Shavuos']}
],
practice:[
{q:'What is Pesach called in davening?', o:['Zman Cheiruseinu, the time of our freedom','Zman Simchaseinu','Zman Matan Toraseinu'], h:'We went free from Mitzrayim.'},
{q:'What is Shavuos called in davening?', o:['Zman Matan Toraseinu, the time of the giving of our Torah','Zman Cheiruseinu','Zman Simchaseinu'], h:'Har Sinai.'},
{q:'What is aliyah l\'regel?', o:['Going up to Yerushalayim for the Yom Tov','A kind of aliyah to the Torah','Climbing a tree'], h:'Regel means foot: walking up.'},
{q:'Which korban did every family bring on Pesach?', o:['The Korban Pesach, a lamb','Two loaves','A bull'], h:'Eaten roasted at night.'},
{q:'What did farmers bring on Shavuos?', o:['Bikurim, first fruits','Lulavim','Matzos'], h:'In decorated baskets.'},
{q:'Which Regel ends with Shemini Atzeres?', o:['Sukkos','Pesach','Shavuos'], h:'The eighth day of gathering.'}
],
check:[
{q:'How many Regalim are there?', o:['Three','Two','Seven']},
{q:'What did everyone do on a Regel in the Beis Hamikdash times?', o:['Go up to Yerushalayim','Stay home','Fast']},
{q:'Which Regel is Zman Matan Toraseinu?', o:['Shavuos','Sukkos','Pesach']}
]},
'LK.YT.L03.01':{name:'Yom Tov 9: The Fast Days and the Three Weeks',
teach:[
{how:'Four fasts remember the churban: Tzom Gedalyah (3 Tishrei), Asarah B\'Teves (10 Teves, the siege of Yerushalayim began), Shivah Asar B\'Tammuz (the walls were broken), and Tishah B\'Av.', q:'What happened on Asarah B\'Teves?', o:['The siege of Yerushalayim began','The Beis Hamikdash was built','Purim began']},
{how:'From 17 Tammuz to 9 Av are the Three Weeks, a time of mourning. We do not make weddings or listen to music. The last nine days are stricter.', q:'What are the Three Weeks?', o:['17 Tammuz to 9 Av, a time of mourning','A vacation','The weeks of Sefirah']},
{how:'Tishah B\'Av is the saddest day: both Batei Mikdash were destroyed on it. We fast, sit low, and read Eichah. Yet it will become a Yom Tov when Mashiach comes.', q:'What do we read on Tishah B\'Av?', o:['Eichah','Esther','Rus']}
],
practice:[
{q:'Who was Gedalyah?', o:['The Jewish governor after the churban, who was murdered','A king of Persia','A Kohen Gadol'], h:'After his death the last Jews left Eretz Yisrael then.'},
{q:'What happened on Shivah Asar B\'Tammuz?', o:['The walls of Yerushalayim were broken','The Torah was given','Haman was hanged'], h:'Also the day Moshe broke the Luchos.'},
{q:'Which fast is the day before Purim?', o:['Ta\'anis Esther','Tzom Gedalyah','Tishah B\'Av'], h:'For Esther\'s three-day fast.'},
{q:'Which fasts last from sunset to nightfall the next day?', o:['Yom Kippur and Tishah B\'Av','All of them','None'], h:'The other fasts start at dawn.'},
{q:'Why do we not wear leather shoes on Tishah B\'Av?', o:['As a sign of mourning','For comfort','To keep dry'], h:'Like a mourner.'},
{q:'What will happen to the fast days when Mashiach comes?', o:['They will become days of joy','They will be longer','Nothing'], h:'The navi Zechariah says so.'}
],
check:[
{q:'How many fasts remember the churban?', o:['Four','One','Seven']},
{q:'What happened on Tishah B\'Av?', o:['Both Batei Mikdash were destroyed','Purim','Chanukah began']},
{q:'When are the Three Weeks?', o:['17 Tammuz to 9 Av','Nisan to Sivan','All of Elul']}
]},
'LK.YT.L03.02':{name:'Yom Tov 10: Rosh Chodesh, Tu B\'Shvat and Lag Ba\'omer',
teach:[
{how:'Rosh Chodesh is the first day of each month. In the times of the Sanhedrin, witnesses who saw the new moon came to Yerushalayim, and the Beis Din declared the new month. We say half-Hallel and Ya\'aleh V\'yavo.', q:'Who declared the new month long ago?', o:['The Beis Din, after witnesses saw the moon','The king','Anyone who wanted']},
{how:'Tu B\'Shvat, the fifteenth of Shevat, is the Rosh Hashanah for trees, used for counting the years of fruit for mitzvos like ma\'aser. Many eat fruits of Eretz Yisrael.', q:'What is Tu B\'Shvat?', o:['The new year for trees','A fast day','The start of Pesach']},
{how:'Lag Ba\'omer, the 33rd day of the Omer, is joyful: Rabbi Akiva\'s students stopped dying, and it is the yahrzeit of Rabbi Shimon bar Yochai. Many make bonfires.', q:'Whose yahrzeit is on Lag Ba\'omer?', o:['Rabbi Shimon bar Yochai','Moshe Rabbeinu','Dovid HaMelech']}
],
practice:[
{q:'Which fruits do many eat on Tu B\'Shvat?', o:['The fruits Eretz Yisrael is praised for, like dates, figs and pomegranates','Only bananas','Only candy'], h:'The seven species include them.'},
{q:'Why do we count the Omer at all?', o:['To count up to Shavuos and receiving the Torah','To count the barley','For fun'], h:'Excited counting, like waiting for a wedding.'},
{q:'What do we add to Shemoneh Esrei on Rosh Chodesh?', o:['Ya\'aleh V\'yavo','Al Hanissim','Aneinu'], h:'Also in bentching.'},
{q:'Which mitzvah of fruit uses the Tu B\'Shvat date?', o:['Orlah and ma\'aser of fruit','Matzah','Shofar'], h:'Counting the tree\'s years.'},
{q:'Why are bonfires lit on Lag Ba\'omer?', o:['For the light of Torah of Rabbi Shimon bar Yochai, the Zohar','To cook dinner','For warmth only'], h:'His Torah lit up the world.'},
{q:'How many days in a Jewish month?', o:['Twenty-nine or thirty','Thirty-one','Twenty-eight always'], h:'The moon cycle is about twenty-nine and a half days.'}
],
check:[
{q:'What is Rosh Chodesh?', o:['The first day of a month','The middle of the month','A fast day']},
{q:'What date is Tu B\'Shvat?', o:['15 Shevat','1 Shevat','15 Nisan']},
{q:'What happened on Lag Ba\'omer for Rabbi Akiva\'s students?', o:['They stopped dying','They graduated','They went to war']}
]},
'LK.HAL.L02.03':{name:'Halacha 7: Tzitzis',
teach:[
{how:'The Torah commands us to put tzitzis on four-cornered garments. A boy wears a tallis katan every day, and grown men wear a tallis in davening.', q:'On what kind of garment do we put tzitzis?', o:['A four-cornered garment','Any shirt','Shoes']},
{how:'Each corner has eight strings and five double knots. The gematria of tzitzis is 600, plus 8 strings and 5 knots, makes 613: the tzitzis remind us of all 613 mitzvos.', q:'What do the tzitzis remind us of?', o:['All 613 mitzvos','Only Shabbos','Our birthday']},
{how:'When putting on a tallis katan, many say the brachah Al Mitzvas Tzitzis. The third paragraph of Shema talks about tzitzis: look at them and remember.', q:'Which paragraph of Shema is about tzitzis?', o:['The third, Vayomer','The first, Shema','The second, V\'hayah']}
],
practice:[
{q:'How many strings hang from each corner?', o:['Eight','Four','Thirteen'], h:'Four strings folded in half.'},
{q:'How many double knots on each corner?', o:['Five','Three','Eight'], h:'600 + 8 + 5 = 613.'},
{q:'Before putting on tzitzis, what should we check?', o:['That the strings are whole','The color of the shirt','Nothing'], h:'Torn strings can make them pasul.'},
{q:'Do we wear a tallis katan at night to sleep?', o:['Many do not need to; the mitzvah is for daytime clothing, ask your minhag','Only on Shabbos','Always required'], h:'The Torah says u\'reisem oso, you will see it.'},
{q:'In which parsha is the mitzvah of tzitzis?', o:['Shelach','Bereishis','Ki Sisa'], h:'Right after the story of the spies.'},
{q:'What is the blue string some use called?', o:['Techeiles','Gold thread','Shatnez'], h:'The Torah mentions a thread of blue.'}
],
check:[
{q:'What do tzitzis remind us of?', o:['The 613 mitzvos','Chanukah','Our friends']},
{q:'How many corners must the garment have?', o:['Four','Two','Six']},
{q:'Which paragraph of Shema mentions tzitzis?', o:['The third','The first','None']}
]},
'LK.HAL.L02.04':{name:'Halacha 8: Basar V\'Chalav, Meat and Milk',
teach:[
{how:'The Torah says three times: do not cook a kid in its mother\'s milk. From this we learn not to cook, eat, or benefit from meat and milk together.', q:'May we eat a cheeseburger?', o:['No, meat and milk together are forbidden','Yes','Only on Sundays']},
{how:'Food is fleishig (meat), milchig (dairy), or pareve (neither, like fruit, vegetables, eggs and fish). Pareve can be eaten with either.', q:'What is pareve?', o:['Neither meat nor milk','Only meat','Only milk']},
{how:'Kosher kitchens have separate dishes for meat and milk. After eating meat we wait before eating dairy. Families have different minhagim: many wait six hours. Ask your parents about yours.', q:'After eating meat, what do we do before dairy?', o:['Wait, according to our family\'s minhag','Nothing','Drink milk right away']}
],
practice:[
{q:'Is an apple meat, milk or pareve?', o:['Pareve','Meat','Milk'], h:'Fruits and vegetables are pareve.'},
{q:'Is chicken fleishig?', o:['Yes, the Rabbis made chicken like meat','No, it is pareve','It is milchig'], h:'Even chicken is not eaten with milk.'},
{q:'How many times does the Torah repeat the law of meat and milk?', o:['Three times','Once','Ten times'], h:'Each time teaches a different part.'},
{q:'Which dishes do we use for milk?', o:['Separate dairy dishes','The meat dishes','Any dishes'], h:'A kosher kitchen keeps them apart.'},
{q:'Is fish pareve (though many do not eat it with meat)?', o:['Yes, fish is pareve','No, it is meat','No, it is milk'], h:'Kosher fish need fins and scales.'},
{q:'After dairy, before meat, many…', o:['Rinse the mouth and eat something, then may eat meat (ask your minhag)','Wait six hours always','Never eat meat again'], h:'Different minhagim; ask your rebbe.'}
],
check:[
{q:'What are the three groups of food?', o:['Fleishig, milchig, pareve','Hot, cold, warm','Sweet, salty, sour']},
{q:'May we eat meat and milk together?', o:['No','Yes','Only cold']},
{q:'Is a carrot pareve?', o:['Yes','No, it is meat','No, it is milk']}
]},
'LK.HAL.L03.02':{name:'Halacha 9: Tefillin',
teach:[
{how:'From his bar mitzvah, at thirteen, a boy puts on tefillin every weekday morning. Many begin a month or two before, to practice.', q:'At what age does the mitzvah of tefillin begin?', o:['Thirteen, at bar mitzvah','Five','Twenty']},
{how:'The shel yad goes on the weaker arm (the left for a righty), facing the heart. The shel rosh goes above the hairline, between the eyes. They remind us to serve Hashem with heart and mind.', q:'Where does the shel yad go?', o:['On the weaker arm, facing the heart','On the forehead','On the leg']},
{how:'Inside each tefillin are four parshiyos from the Torah, including Shema and V\'hayah im shamoa. We do not wear tefillin on Shabbos and Yom Tov, which are themselves a sign.', q:'When do we not wear tefillin?', o:['Shabbos and Yom Tov','Mondays','In the morning']}
],
practice:[
{q:'Which do we put on first?', o:['The shel yad','The shel rosh','Both at once'], h:'Hand, then head; remove in reverse.'},
{q:'How many parshiyos are inside tefillin?', o:['Four','Ten','One'], h:'Kadesh, V\'hayah ki yeviacha, Shema, V\'hayah im shamoa.'},
{q:'How many compartments does the shel rosh have?', o:['Four','One','Two'], h:'The shel yad has one with all four parshiyos together.'},
{q:'Why do tefillin face the heart and sit on the head?', o:['To serve Hashem with heart and mind','For balance','By chance'], h:'Think and feel.'},
{q:'Who writes the parshiyos for tefillin?', o:['A sofer','Any boy','A printer'], h:'They must be handwritten on parchment.'},
{q:'What should a person be careful about while wearing tefillin?', o:['To keep his mind on them and act with holiness','Running fast','Eating a meal'], h:'They are holy.'}
],
check:[
{q:'Which comes first, shel yad or shel rosh?', o:['Shel yad','Shel rosh','Either']},
{q:'Do we wear tefillin on Shabbos?', o:['No','Yes','Only in shul']},
{q:'What do tefillin contain?', o:['Four parshiyos from the Torah','Gold','Pictures']}
]},
'LK.HAL.L03.03':{name:'Halacha 10: Hashavas Aveidah and Tzedakah',
teach:[
{how:'Hashavas aveidah means returning a lost object. If we find something with a sign, like a name, we must try to return it. The Torah says: you may not hide your eyes.', q:'What is hashavas aveidah?', o:['Returning a lost object','Finding a new toy for yourself','Buying a gift']},
{how:'Tzedakah means giving to those in need. Many give ma\'aser, a tenth of what they earn. Even a small coin is a mitzvah.', q:'What is ma\'aser?', o:['Giving a tenth of what we earn','Giving everything','Giving nothing']},
{how:'The Rambam lists levels of tzedakah. The highest is helping a person support himself, with a job or a loan, so he will not need tzedakah.', q:'What is the highest level of tzedakah, says the Rambam?', o:['Helping someone support himself','Giving with a frown','Giving only when asked many times']}
],
practice:[
{q:'You find a hat with a name tag. What do you do?', o:['Return it to its owner','Keep it','Throw it away'], h:'It has a siman, a sign.'},
{q:'What is a better way to give tzedakah?', o:['Quietly, so the poor person is not embarrassed','Loudly so everyone sees','Never'], h:'Matan b\'seser, giving in secret.'},
{q:'What does the word tzedakah come from?', o:['Tzedek, justice: doing what is right','Food','Money only'], h:'It is the right thing, not just kindness.'},
{q:'Which is a way to give tzedakah as a child?', o:['Putting a coin in the pushka','Taking from the pushka','Ignoring a collector'], h:'A little every day.'},
{q:'What does you may not hide your eyes mean?', o:['We may not ignore a lost object','Close your eyes in Shema','Do not look at the sun'], h:'Lo suchal l\'hisaleim.'},
{q:'Before which Yom Tov do we give matanos la\'evyonim?', o:['Purim','Shavuos','Sukkos'], h:'Gifts to the poor on Purim day.'}
],
check:[
{q:'What should we do with something lost that has a name on it?', o:['Return it','Keep it','Sell it']},
{q:'What is the highest tzedakah?', o:['Helping someone support himself','Giving a little sometimes','Not giving']},
{q:'What is ma\'aser?', o:['A tenth','A half','Nothing']}
]},
'LK.MID.L02.03':{name:'Middos 7: Simchah, Serving Hashem with Joy',
teach:[
{how:'Ivdu es Hashem b\'simchah: serve Hashem with joy. A mitzvah done happily is greater. Rebbe Nachman said: it is a great mitzvah to always be happy.', q:'How should we serve Hashem?', o:['With joy, b\'simchah','Grumbling','Only when told']},
{how:'Simchah does not mean everything is easy. It means trusting that Hashem is with us and being glad for what we have. Eizehu ashir? Who is rich? One who is happy with his portion.', q:'Who is rich, says Pirkei Avos?', o:['One who is happy with what he has','One with the most money','One with the biggest house']},
{how:'Dovid HaMelech danced with all his strength when the Aron came to Yerushalayim. He was not embarrassed to show joy for Hashem.', q:'Who danced with joy before the Aron?', o:['Dovid HaMelech','Shaul','Golyas']}
],
practice:[
{q:'Which Yom Tov is called the time of our joy?', o:['Sukkos','Tishah B\'Av','Yom Kippur'], h:'Zman Simchaseinu.'},
{q:'What makes a mitzvah more beautiful?', o:['Doing it with simchah','Doing it slowly and sadly','Complaining'], h:'Joy is part of the avodah.'},
{q:'When Adar comes, what do we increase?', o:['Simchah','Fasting','Sleep'], h:'Mishenichnas Adar marbin b\'simchah.'},
{q:'Your friend got a prize and you did not. What shows simchah?', o:['Be happy for him','Feel jealous and sulk','Say it is not fair'], h:'Happy with our own portion.'},
{q:'What is one way to feel simchah?', o:['Thinking about the good Hashem gives us','Comparing to others','Remembering only problems'], h:'Count your brachos.'},
{q:'Which word means joy?', o:['שִׂמְחָה','כַּעַס','עַצְבוּת'], h:'Simchah.'}
],
check:[
{q:'What does b\'simchah mean?', o:['With joy','With anger','With fear']},
{q:'Who is truly rich?', o:['One happy with his portion','The strongest','The tallest']},
{q:'When do we add simchah?', o:['When Adar comes','When Av comes','Never']}
]},
'LK.MID.L03.03':{name:'Middos 8: Shalom, Peace Like Aharon',
teach:[
{how:'Hillel said: Be like the students of Aharon, loving peace and pursuing peace. Aharon HaKohen would make peace between people who had argued.', q:'Who was known for loving and pursuing peace?', o:['Aharon HaKohen','Korach','Lavan']},
{how:'When two people argued, Aharon would tell each one: your friend is so sorry and wants to make up. When they met, they hugged. When Aharon died, all of Klal Yisrael cried, men and women.', q:'How did Aharon make peace?', o:['He told each one the other wanted to make up','He punished them','He ignored them']},
{how:'Shalom is so great that Hashem\'s Name may be erased in the sotah waters to bring peace between husband and wife. Shalom is also one of Hashem\'s names.', q:'What do we learn about how important shalom is?', o:['Hashem allows His Name to be erased for peace at home','Shalom is not important','Only kings need peace']}
],
practice:[
{q:'Two friends are fighting. What can you do like Aharon?', o:['Help each understand the other and make up','Take a side and shout','Tell everyone about it'], h:'Ohev shalom v\'rodef shalom.'},
{q:'What does rodef shalom mean?', o:['Chasing after peace','Running away','Fighting'], h:'Not just loving peace but working for it.'},
{q:'How does Shemoneh Esrei end?', o:['With a brachah for shalom','With a brachah for food','With Shema'], h:'Sim shalom, the last brachah.'},
{q:'Which is a way to keep shalom at home?', o:['Letting a sibling go first sometimes','Always being first','Grabbing the best seat'], h:'Giving in is strength.'},
{q:'What is machlokes?', o:['Arguing and fighting','Peace','A brachah'], h:'Korach\'s machlokes ended badly.'},
{q:'Which word means peace?', o:['שָׁלוֹם','מַחְלֹקֶת','כַּעַס'], h:'Shalom aleichem!'}
],
check:[
{q:'Who loved and pursued peace?', o:['Aharon HaKohen','Bilam','Paroh']},
{q:'What does Hillel tell us to be?', o:['Like the students of Aharon','Like Korach','Like a king']},
{q:'What is the last brachah of Shemoneh Esrei about?', o:['Peace','Rain','Food']}
]},
'LK.MID.L03.04':{name:'Middos 9: Ahavas Yisrael',
teach:[
{how:'V\'ahavta l\'reiacha kamocha: love your fellow as yourself. Rabbi Akiva called it a great rule of the Torah.', q:'What did Rabbi Akiva call v\'ahavta l\'reiacha kamocha?', o:['A great rule of the Torah','A small detail','A story']},
{how:'A man asked Hillel to teach him the whole Torah on one foot. Hillel said: What is hateful to you, do not do to your friend. That is the whole Torah; the rest is explanation. Go and learn.', q:'What did Hillel teach on one foot?', o:['What is hateful to you, do not do to your friend','Eat well','Run fast']},
{how:'Klal Yisrael is like one body: if one part hurts, the whole body feels it. That is why we daven in the plural: heal us, bless us.', q:'Why are most tefillos in the plural, we and us?', o:['We care for all of Klal Yisrael as one','It sounds nicer','By mistake']}
],
practice:[
{q:'A boy in your class is sad. Ahavas Yisrael means…', o:['Asking how he is and helping','Ignoring him','Laughing'], h:'His pain is our pain.'},
{q:'Which parsha has v\'ahavta l\'reiacha kamocha?', o:['Kedoshim','Noach','Bo'], h:'In Sefer Vayikra.'},
{q:'Why was the second Beis Hamikdash destroyed, say Chazal?', o:['Sinas chinam, baseless hatred','Too much tzedakah','The weather'], h:'The fix is ahavas chinam.'},
{q:'What fixes sinas chinam?', o:['Ahavas chinam, love without a reason','More fasting only','Building walls'], h:'Love every Jew.'},
{q:'Before davening, many say: I accept the mitzvah of…', o:['Loving my fellow as myself','Eating breakfast','Going to sleep'], h:'Hareini mekabel alai.'},
{q:'Who gets ahavas Yisrael?', o:['Every Jew, even one we do not know','Only friends','Only family'], h:'Kol Yisrael areivim zeh lazeh.'}
],
check:[
{q:'What is ahavas Yisrael?', o:['Loving every Jew','Loving only friends','Loving only myself']},
{q:'What is the whole Torah on one foot, per Hillel?', o:['Do not do to your friend what is hateful to you','Keep Shabbos only','Eat matzah']},
{q:'What destroyed the second Beis Hamikdash?', o:['Sinas chinam','Rain','A fire by accident']}
]},
/* ===== ROUND 3 (v209): Pirkei Avos + the 13 Ani Ma'amins — rich format from the start ===== */
'LK.MID.L02.04':{name:'Pirkei Avos 1: The Chain of Torah', band:'5-6', peg:{kind:'chain',show:'Moshe → Yehoshua → Zekeinim → Nevi\'im → Anshei Knesses Hagedolah',say:'Five links in the chain: say them like a train, car by car.'},
teach:[
{how:'Opener: imagine a chain of hands, each passing a precious light to the next, for over 3,000 years. Pirkei Avos begins: Moshe received the Torah from Sinai and passed it to Yehoshua, Yehoshua to the Zekeinim, the Zekeinim to the Nevi\'im, and the Nevi\'im to the Anshei Knesses Hagedolah.', q:'Who received the Torah at Sinai first, says Pirkei Avos?', o:['Moshe Rabbeinu','Yehoshua','Avraham Avinu']},
{how:'The Anshei Knesses Hagedolah, the Men of the Great Assembly, gave three lessons: be patient in judgment, raise up many students, and make a fence around the Torah.', q:'Which is one of the three lessons of the Anshei Knesses Hagedolah?', o:['Raise up many students','Build tall buildings','Eat three meals']},
{how:'A fence around the Torah means extra care so we never come close to breaking a mitzvah, like not even touching muktzeh things on Shabbos.', q:'What is a fence around the Torah?', o:['Extra care that keeps us far from an aveirah','A real wooden fence','A wall around the shul']}
],
we:[
{q:'Together: who received the Torah from Moshe?', o:['Yehoshua','The Nevi\'im','Shmuel'], steps:['Moshe is the first link.','He passed it to his student.','Yehoshua.']},
{q:'Together: when do many people learn Pirkei Avos?', o:['Shabbos afternoons in the summer','Only on Purim','Never on Shabbos'], steps:['Pirkei Avos is learned between Pesach and Rosh Hashanah.','On Shabbos afternoon.','One perek each week.']}
],
practice:[
{t:'order', q:'Put the chain of Torah in order.', tiles:['Moshe','Yehoshua','The Zekeinim','The Nevi\'im','Anshei Knesses Hagedolah'], why:'Avos 1:1: each generation passed the Torah to the next.'},
{t:'spotall', q:'Tap the three lessons of the Anshei Knesses Hagedolah.', cells:[{label:'be patient in judgment',ok:true},{label:'raise up many students',ok:true},{label:'make a fence around the Torah',ok:true},{label:'travel far away',ok:false},{label:'stay quiet always',ok:false}], why:'Avos 1:1 ends with these three teachings.'},
{t:'pairs', q:'Match each word to its meaning.', pairs:[['Avos','fathers'],['kibel','received'],['masar','passed on'],['seyag','fence']], why:'Moshe kibel Torah miSinai u\'masrah l\'Yehoshua.'},
{q:'Why is it called Pirkei Avos?', o:['It holds the teachings of our fathers, the great Sages','It is about fathers only','It was written by Avraham'], h:'Avos means fathers: the founders of our tradition.', why:'The Tanna\'im are the fathers of the Oral Torah.'},
{t:'type', q:'How many lessons did the Anshei Knesses Hagedolah teach? Type the number.', a:'3', alt:['three'], kb:'num', why:'Three: patience in judgment, many students, a fence.'},
{q:'Many say a Mishnah before each perek: All Yisrael have a share in…', o:['Olam Haba','gold','the land only'], h:'Kol Yisrael yesh lahem chelek l\'Olam Haba.', why:'From Sanhedrin 10:1, said before each perek.'}
],
check:[
{q:'Who passed the Torah to the Zekeinim?', o:['Yehoshua','Moshe','The Nevi\'im']},
{q:'What does make a fence around the Torah mean?', o:['Extra care to stay far from aveiros','Build walls','Close the shul']},
{q:'Where did Moshe receive the Torah?', o:['Sinai','Mitzrayim','Yerushalayim']}
]},
'LK.MID.L02.05':{name:'Pirkei Avos 2: The World Stands on Three Things', band:'5-6', peg:{kind:'stool',show:'Torah · Avodah · Chesed',say:'The world is a three-legged stool: Torah, avodah, gemilus chasadim. Take one leg away and it falls.'},
teach:[
{how:'Opener: what holds up the whole world? Not pillars of stone. Shimon HaTzaddik said: the world stands on three things: on Torah, on avodah (serving Hashem, today davening), and on gemilus chasadim (acts of kindness).', q:'What are the three things the world stands on?', o:['Torah, avodah, gemilus chasadim','Gold, silver, copper','Sun, moon, stars']},
{how:'Rabban Shimon ben Gamliel said the world endures on three things: din (justice), emes (truth) and shalom (peace).', q:'What three things keep the world going, says Rabban Shimon ben Gamliel?', o:['Justice, truth and peace','Food, water and air','Money, power and fame']},
{how:'Today, without the Beis Hamikdash, avodah is our tefillah: davening is called avodah shebalev, service of the heart.', q:'What is avodah today?', o:['Tefillah, davening','Building houses','Farming']}
],
we:[
{q:'Together: you helped an old man carry his bags. Which pillar?', o:['Gemilus chasadim','Torah','Avodah'], steps:['Helping someone is kindness.','Kindness is gemilus chasadim.','You held up one leg of the world!']},
{q:'Together: you davened Mincha with kavanah. Which pillar?', o:['Avodah','Torah','Gemilus chasadim'], steps:['Davening is serving Hashem.','Serving Hashem is avodah.','Avodah shebalev.']}
],
practice:[
{t:'sort', q:'Sort each act into its pillar.', bins:[{id:'T',label:'Torah'},{id:'A',label:'Avodah'},{id:'G',label:'Gemilus chasadim'}], items:[{label:'learning Chumash',bin:'T'},{label:'reviewing a Mishnah',bin:'T'},{label:'davening Shacharis',bin:'A'},{label:'saying Tehillim',bin:'A'},{label:'visiting a sick friend',bin:'G'},{label:'sharing lunch',bin:'G'}], why:'Avos 1:2: Torah, avodah, and kindness hold up the world.'},
{t:'pairs', q:'Match each Sage to his three things.', pairs:[['Shimon HaTzaddik','Torah, avodah, chesed'],['Rabban Shimon ben Gamliel','din, emes, shalom']], why:'Avos 1:2 and 1:18.'},
{t:'spotall', q:'Tap every way to show gemilus chasadim.', cells:[{label:'lending a pencil',ok:true},{label:'comforting a sad friend',ok:true},{label:'helping set the table',ok:true},{label:'keeping all the toys',ok:false},{label:'making fun of someone',ok:false}], why:'Chesed is giving of yourself.'},
{q:'What is avodah shebalev?', o:['Service of the heart: tefillah','Work in the field','A korban of sheep'], h:'The Gemara calls tefillah service of the heart.', why:'Taanis 2a.'},
{t:'type', q:'On how many things does the world stand? Type the number.', a:'3', alt:['three'], kb:'num', why:'Three pillars.'},
{q:'Which of the three does a boy do when he learns Gemara?', o:['Torah','Avodah','Gemilus chasadim'], h:'Learning is Torah.', why:'Talmud Torah is the first pillar.'}
],
check:[
{q:'What does the world stand on, says Shimon HaTzaddik?', o:['Torah, avodah, gemilus chasadim','Wind, fire, water','Kings and armies']},
{q:'What is avodah today?', o:['Tefillah','Farming','Building']},
{q:'Which is gemilus chasadim?', o:['Helping someone in need','Sleeping late','Winning a game']}
]},
'LK.MID.L02.06':{name:'Pirkei Avos 3: A Rav, a Friend, a Smile', band:'5-6', peg:{kind:'three gifts',show:'Rav · Chaver · Kaf Zechus',say:'Make a rav, get a friend, judge everyone favorably.'},
teach:[
{how:'Opener: who will help you grow? Yehoshua ben Perachyah said: Make for yourself a rav, acquire for yourself a friend, and judge every person favorably.', q:'What does Yehoshua ben Perachyah say to make for yourself?', o:['A rav','A fortune','A tower']},
{how:'Acquire a friend: a good chavrusa is worth paying for. Two who learn together sharpen each other like iron sharpens iron.', q:'Why acquire a good friend?', o:['To learn and grow together','To have someone do your work','To win arguments']},
{how:'Shammai said: receive every person with a pleasant face, b\'sever panim yafos. And: say little and do much, like Avraham who promised a little bread and served a feast.', q:'How should we greet people, says Shammai?', o:['With a pleasant face','With a frown','Without looking']}
],
we:[
{q:'Together: a classmate is late. Judge favorably:', o:['Maybe his bus was late','He is lazy','He does not care'], steps:['We do not know the reason.','Tilt the scale toward merit.','Maybe something held him up.']},
{q:'Together: say little and do much. Who did this?', o:['Avraham, who promised bread and made a feast','Paroh','Lavan'], steps:['Avraham offered the guests a little bread.','Then he served cakes, meat and butter.','He said little and did much.']}
],
practice:[
{t:'pairs', q:'Match each Sage to his teaching.', pairs:[['Yehoshua ben Perachyah','make a rav, get a friend'],['Shammai','a pleasant face for everyone'],['Hillel','love peace like Aharon'],['Shimon HaTzaddik','three pillars of the world']], why:'Avos chapter 1.'},
{t:'sort', q:'Sort: judging favorably, or not?', bins:[{id:'Y',label:'Dan l\'kaf zechus'},{id:'N',label:'Judging harshly'}], items:[{label:'Maybe he did not hear me',bin:'Y'},{label:'Maybe she had a hard morning',bin:'Y'},{label:'He did it on purpose to hurt me',bin:'N'},{label:'She always ruins things',bin:'N'}], why:'Avos 1:6: judge every person favorably.'},
{t:'spotall', q:'Tap every way to greet with a pleasant face.', cells:[{label:'smiling',ok:true},{label:'saying good morning',ok:true},{label:'looking at the person',ok:true},{label:'ignoring him',ok:false},{label:'rolling your eyes',ok:false}], why:'Avos 1:15: b\'sever panim yafos.'},
{q:'Why make for yourself a rav?', o:['To have someone to guide and teach you','To have someone to boss','To avoid learning'], h:'A rav helps us decide what is right.', why:'Avos 1:6 and 1:16.'},
{t:'type', q:'Type the Hebrew word for a learning partner.', a:'chavrusa', alt:['chavrusah','chavruta','chavrusa.'], kb:'abc', why:'Chavrusa: a learning friend.'},
{q:'Say little and do much means…', o:['Promise less and do more','Never talk','Talk a lot'], h:'Like Avraham with the guests.', why:'Avos 1:15.'}
],
check:[
{q:'What three things does Yehoshua ben Perachyah teach?', o:['A rav, a friend, judge favorably','Eat, drink, sleep','Run, jump, swim']},
{q:'How does Shammai tell us to greet everyone?', o:['With a pleasant face','Quickly','Silently']},
{q:'What is dan l\'kaf zechus?', o:['Judging favorably','Judging harshly','Not judging at all']}
]},
'LK.MID.L03.05':{name:'Pirkei Avos 4: Hillel\'s Three Questions', band:'7-8', peg:{kind:'three questions',show:'Me? Only me? When?',say:'If not me, who? If only me, what am I? If not now, when?'},
teach:[
{how:'Opener: three short questions that can change a life. Hillel said: If I am not for myself, who will be for me? And when I am only for myself, what am I? And if not now, when?', q:'What is Hillel\'s last question?', o:['If not now, when?','Who is wise?','Why me?']},
{how:'If I am not for myself: no one can do my growing for me. If I am only for myself: a person who cares only about himself is missing what makes him human.', q:'What does if I am only for myself, what am I? teach?', o:['We must care about others too','Only think of yourself','Never help yourself']},
{how:'Hillel also said: do not judge your friend until you reach his place, and do not say I will learn when I have time, perhaps you will not have time.', q:'What does do not judge your friend until you reach his place mean?', o:['You cannot know his situation until you are in it','Visit his house first','Never judge anyone ever']}
],
we:[
{q:'Together: you planned to start learning Mishnayos next month. Hillel says…', o:['If not now, when? Start today','Wait for a better time','Never start'], steps:['Notice the plan to delay.','Hillel: if not now, when?','Start with one Mishnah today.']},
{q:'Together: your friend snapped at you today. Hillel would say…', o:['Do not judge him until you reach his place','He is mean','Get back at him'], steps:['You do not know his day.','Maybe something hard happened.','Judge kindly; ask if he is okay.']}
],
practice:[
{t:'pairs', q:'Match each of Hillel\'s questions to its lesson.', pairs:[['If I am not for myself, who is for me?','take responsibility for your own growth'],['If I am only for myself, what am I?','care for others'],['If not now, when?','do not delay good things']], why:'Avos 1:14.'},
{t:'spotall', q:'Tap every teaching of Hillel.', cells:[{label:'love peace like Aharon',ok:true},{label:'if not now, when?',ok:true},{label:'do not judge until you reach his place',ok:true},{label:'the world stands on three things',ok:false},{label:'say little, do much',ok:false}], why:'The pillars are Shimon HaTzaddik\'s; say little do much is Shammai\'s.'},
{t:'sort', q:'Sort: following Hillel, or delaying?', bins:[{id:'H',label:'If not now, when?'},{id:'D',label:'Delaying'}], items:[{label:'doing homework right away',bin:'H'},{label:'apologizing today',bin:'H'},{label:'starting a learning seder now',bin:'H'},{label:'I will daven better next year',bin:'D'},{label:'I will say sorry someday',bin:'D'}], why:'Avos 1:14 and 2:4.'},
{q:'Hillel says: do not say, when I have time I will learn. Why?', o:['Perhaps you will never have time','Time is unlimited','Learning is not important'], h:'Avos 2:4.', why:'The free time we wait for may never come.'},
{t:'type', q:'Finish Hillel\'s question: If not now, ____? Type one word.', a:'when', alt:['when?'], kb:'abc', why:'V\'im lo achshav, eimasai.'},
{q:'Hillel told us to be students of whom?', o:['Aharon HaKohen','Moshe Rabbeinu','Shlomo HaMelech'], h:'Loving peace and pursuing peace.', why:'Avos 1:12.'}
],
check:[
{q:'Which question teaches us to care for others?', o:['If I am only for myself, what am I?','If not now, when?','Who is wise?']},
{q:'What does Hillel say about judging a friend?', o:['Not until you reach his place','Always judge quickly','Ask others to judge']},
{q:'If not now, when? teaches…', o:['Do good things now','Wait for later','Rest first']}
]},
'LK.MID.L03.06':{name:'Pirkei Avos 5: Ben Zoma\'s Four Questions', band:'7-8', peg:{kind:'four questions',show:'Wise · Strong · Rich · Honored',say:'Wise learns from all; strong conquers himself; rich is happy with his lot; honored honors others.'},
teach:[
{how:'Opener: the world says wise means a big degree, strong means big muscles, rich means a big bank account. Ben Zoma turns it upside down. Who is wise? One who learns from every person.', q:'Who is wise, says Ben Zoma?', o:['One who learns from every person','One who knows everything','One who went to school longest']},
{how:'Who is strong? One who conquers his yetzer hara. Who is rich? One who is happy with his portion.', q:'Who is strong, says Ben Zoma?', o:['One who conquers his yetzer hara','One who lifts the heaviest','One who wins every fight']},
{how:'Who is honored? One who honors other people. Honor is not grabbed; it is given, and it comes back.', q:'Who is honored, says Ben Zoma?', o:['One who honors others','One who demands respect','One with the biggest house']}
],
we:[
{q:'Together: you wanted a second dessert but stopped yourself. Ben Zoma calls you…', o:['Strong','Rich','Wise'], steps:['You conquered your desire.','Conquering the yetzer is strength.','Gibor: strong.']},
{q:'Together: a younger boy teaches you a new fact and you listen. Ben Zoma calls you…', o:['Wise','Honored','Rich'], steps:['You learned from someone younger.','Learning from everyone is wisdom.','Chacham: wise.']}
],
practice:[
{t:'pairs', q:'Match each question to Ben Zoma\'s answer.', pairs:[['Who is wise?','learns from every person'],['Who is strong?','conquers his yetzer'],['Who is rich?','happy with his portion'],['Who is honored?','honors others']], why:'Avos 4:1.'},
{t:'sort', q:'Sort each act into Ben Zoma\'s four.', bins:[{id:'W',label:'Wise'},{id:'S',label:'Strong'},{id:'R',label:'Rich'},{id:'H',label:'Honored'}], items:[{label:'listening to a younger boy\'s idea',bin:'W'},{label:'staying calm when insulted',bin:'S'},{label:'being happy with your old bike',bin:'R'},{label:'standing up for an elder',bin:'H'}], why:'Ben Zoma\'s four kinds of greatness are all inside us.'},
{t:'type', q:'Type the Hebrew word for strong (one word).', a:'gibor', alt:['gibbor','gibor.'], kb:'abc', why:'Eizehu gibor? Hakoveish es yitzro.'},
{t:'spotall', q:'Tap every way to be strong like Ben Zoma means.', cells:[{label:'not answering back when angry',ok:true},{label:'getting up for davening when tired',ok:true},{label:'sharing when you want to keep',ok:true},{label:'pushing to the front',ok:false},{label:'winning every argument',ok:false}], why:'Real strength is self-control.'},
{q:'Where in Pirkei Avos is Ben Zoma\'s teaching?', o:['Perek 4','Perek 1','Perek 6'], h:'Avos 4:1.', why:'Chapter four, Mishnah one.'},
{q:'Why does one who honors others become honored?', o:['Hashem says: those who honor Me I will honor','People are forced to','By luck'], h:'Ben Zoma brings a pasuk from Shmuel.', why:'Ki mechabdai achabed.'}
],
check:[

{q:'Who is wise?', o:['One who learns from everyone','One who never asks','One who is oldest']},
{q:'Who is strong?', o:['One who conquers his yetzer','The tallest','The fastest']}
]},
'LK.MID.L03.07':{name:'Pirkei Avos 6: The Day Is Short', band:'7-8', peg:{kind:'clock',show:'Short day · Big work',say:'The day is short, the work is great: you do not have to finish, but you may not stop.'},
teach:[
{how:'Opener: imagine a huge field and only a few hours of daylight. Rabbi Tarfon said: The day is short, the work is great, the workers are lazy, the reward is great, and the Master of the house is pressing.', q:'According to Rabbi Tarfon, the day is…', o:['short','long','boring']},
{how:'He also said: It is not your job to finish the work, but you are not free to stop doing it. Every bit of Torah and mitzvos counts, even if the whole job is too big for one person.', q:'What does it is not your job to finish mean?', o:['Do your part; you do not have to do it all','Do nothing','Finish everything today']},
{how:'Yehudah ben Teima gave a timetable: five years old for Mikra, ten for Mishnah, thirteen for mitzvos, fifteen for Gemara.', q:'At what age does a boy become obligated in mitzvos, says Pirkei Avos?', o:['Thirteen','Five','Twenty']}
],
we:[
{q:'Together: a long masechta feels impossible to finish. Rabbi Tarfon says…', o:['You need not finish, but do not stop','Give up','Only start if you can finish'], steps:['The work is great.','You are not required to finish it all.','But keep learning, daf by daf.']},
{q:'Together: at what age does Gemara learning begin in Avos\' timetable?', o:['Fifteen','Ten','Five'], steps:['Five: Mikra (Chumash).','Ten: Mishnah. Thirteen: mitzvos.','Fifteen: Gemara.']}
],
practice:[
{t:'order', q:'Put Yehudah ben Teima\'s timetable in order.', tiles:['5: Mikra','10: Mishnah','13: Mitzvos','15: Gemara'], why:'Avos 5:21.'},
{t:'pairs', q:'Match Rabbi Tarfon\'s words.', pairs:[['the day','is short'],['the work','is great'],['the workers','are lazy'],['the Master of the house','is pressing']], why:'Avos 2:15.'},
{t:'spotall', q:'Tap every way to not stop the work.', cells:[{label:'learning one more Mishnah',ok:true},{label:'reviewing yesterday\'s lesson',ok:true},{label:'doing one more chesed',ok:true},{label:'quitting because it is too long',ok:false},{label:'waiting until everything is perfect',ok:false}], why:'Avos 2:16: you are not free to stop.'},
{t:'type', q:'At what age is a boy ready for Mishnah, says Avos? Type the number.', a:'10', alt:['ten'], kb:'num', why:'Ben eser l\'Mishnah.'},
{q:'Who said the day is short and the work is great?', o:['Rabbi Tarfon','Hillel','Shammai'], h:'Avos 2:15.', why:'Rabbi Tarfon, a student of Rabban Yochanan ben Zakkai\'s time.'},
{q:'Is a small bit of learning worth it if we cannot finish everything?', o:['Yes, every bit counts','No','Only big amounts count'], h:'You are not free to stop.', why:'Avos 2:16.'}
],
check:[
{q:'It is not your job to finish the work, but…', o:['you are not free to stop','you can rest','someone else will do it']},
{q:'At what age does a boy become bar mitzvah?', o:['Thirteen','Twelve','Fifteen']},
{q:'Who said the day is short?', o:['Rabbi Tarfon','Rabbi Akiva','Moshe']}
]},
'LK.TEF.L03.03':{name:'Tefillah 10: Ani Ma\'amin 1 to 7', band:'7-8', peg:{kind:'seven',show:'Creator · One · No body · First & Last · Pray to Him · Nevi\'im · Moshe',say:'Seven about Hashem and His nevi\'im.'},
teach:[
{how:'Opener: what does a Jew believe? The Rambam wrote thirteen principles. Many say them after Shacharis, each starting Ani ma\'amin b\'emunah sheleimah, I believe with complete faith. The first: Hashem created and guides everything.', q:'What does Ani ma\'amin b\'emunah sheleimah mean?', o:['I believe with complete faith','I am thankful','I am ready']},
{how:'Hashem is One, with no other like Him. Hashem has no body and no form. Hashem is first and last: He always was and always will be.', q:'Which is one of the Ani Ma\'amins?', o:['Hashem has no body','Hashem is in a statue','There are many gods']},
{how:'We pray only to Hashem, not to anything else. The words of the nevi\'im are true. And Moshe Rabbeinu was the greatest of all the nevi\'im.', q:'To whom do we pray, says the fifth principle?', o:['Only to Hashem','To malachim','To the sun']}
],
we:[
{q:'Together: why can\'t we draw a picture of Hashem?', o:['Hashem has no body or form','It is too hard','We forgot'], steps:['Principle three: Hashem has no body.','A picture needs a form.','So Hashem cannot be drawn.']},
{q:'Together: who was the greatest navi?', o:['Moshe Rabbeinu','Eliyahu','Yeshayahu'], steps:['Principle seven.','Hashem spoke to Moshe face to face.','No navi was ever like him.']}
],
practice:[
{t:'order', q:'Put principles 1 to 4 in order.', tiles:['Hashem creates and guides all','Hashem is One','Hashem has no body','Hashem is first and last'], why:'The Rambam\'s order of the Thirteen Ikarim.'},
{t:'pairs', q:'Match each number to its principle.', pairs:[['1','Hashem creates and guides'],['2','Hashem is One'],['5','pray only to Hashem'],['7','Moshe is the greatest navi']], why:'The Thirteen Ikarim of the Rambam.'},
{t:'spotall', q:'Tap every one of the first seven principles.', cells:[{label:'Hashem has no body',ok:true},{label:'the nevi\'im are true',ok:true},{label:'we pray only to Hashem',ok:true},{label:'there are two powers',ok:false},{label:'Hashem can be seen with eyes',ok:false}], why:'Principles 3, 6 and 5.'},
{t:'type', q:'How many principles of faith did the Rambam write? Type the number.', a:'13', alt:['thirteen'], kb:'num', why:'The Thirteen Ikarim.'},
{q:'Which song in the siddur puts all thirteen into poetry?', o:['Yigdal','Adon Olam only','Aleinu'], h:'Sung at the start or end of davening.', why:'Yigdal follows the Rambam\'s thirteen.'},
{q:'Who wrote the thirteen principles?', o:['The Rambam','Rashi','The Chofetz Chaim'], h:'In his commentary on the Mishnah, Sanhedrin chapter 10.', why:'Rabbi Moshe ben Maimon.'}
],
check:[
{q:'What is the second principle?', o:['Hashem is One','Moshe is the greatest navi','Mashiach will come']},
{q:'Does Hashem have a body?', o:['No','Yes','Sometimes']},
{q:'Who was the greatest navi?', o:['Moshe Rabbeinu','Shmuel','Yonah']}
]},
'LK.TEF.L03.04':{name:'Tefillah 11: Ani Ma\'amin 8 to 13', band:'7-8', peg:{kind:'six',show:'Same Torah · Never changes · Hashem knows · Reward · Mashiach · Techiyas Hameisim',say:'Six about the Torah, Hashem\'s knowledge and the future.'},
teach:[
{how:'Opener: the Torah you hold today is the same Torah Moshe received. Principle eight: the whole Torah we have was given to Moshe. Principle nine: the Torah will never be changed or replaced.', q:'What does principle nine say?', o:['The Torah will never be changed','The Torah is new each year','Some mitzvos expire']},
{how:'Principle ten: Hashem knows every deed and thought of people. Principle eleven: Hashem rewards those who keep His mitzvos and punishes those who transgress.', q:'What does principle ten teach?', o:['Hashem knows all our deeds and thoughts','Hashem does not see us','Only kings matter']},
{how:'Principle twelve: Mashiach will come; even if he delays, we wait for him every day. Principle thirteen: techiyas hameisim, the dead will come back to life.', q:'What is techiyas hameisim?', o:['The dead coming back to life','A new Yom Tov','A kind of korban']}
],
we:[
{q:'Together: what do we do while Mashiach delays?', o:['Wait for him every day','Give up','Forget about it'], steps:['Principle twelve.','Af al pi sheyismahmeiah: even if he delays.','We wait every day.']},
{q:'Together: which principle says Hashem rewards mitzvos?', o:['Eleven','Two','Thirteen'], steps:['Ten: Hashem knows.','Eleven: Hashem rewards and punishes.','So, eleven.']}
],
practice:[
{t:'order', q:'Put principles 10 to 13 in order.', tiles:['Hashem knows all','Reward and punishment','Mashiach will come','Techiyas hameisim'], why:'The last four of the Thirteen.'},
{t:'pairs', q:'Match each number to its principle.', pairs:[['8','the Torah was given to Moshe'],['9','the Torah never changes'],['12','Mashiach will come'],['13','techiyas hameisim']], why:'The Thirteen Ikarim, 8-13.'},
{t:'sort', q:'Sort: is it about the Torah, or about the future?', bins:[{id:'T',label:'The Torah'},{id:'F',label:'The future'}], items:[{label:'given to Moshe',bin:'T'},{label:'will never be changed',bin:'T'},{label:'Mashiach will come',bin:'F'},{label:'the dead will live again',bin:'F'}], why:'Principles 8-9 are about the Torah, 12-13 about the end of days.'},
{t:'type', q:'Which principle number is about Mashiach? Type the number.', a:'12', alt:['twelve'], kb:'num', why:'Ani ma\'amin b\'vias haMashiach.'},
{q:'Which brachah in Shemoneh Esrei speaks of techiyas hameisim?', o:['The second, Gevuros: mechayeh meisim','Modim','Refa\'einu'], h:'Atah gibor... mechayeh meisim.', why:'The second brachah praises Hashem Who revives the dead.'},
{t:'spotall', q:'Tap every one of principles 8 to 13.', cells:[{label:'Hashem knows our thoughts',ok:true},{label:'Mashiach will come',ok:true},{label:'the Torah will not change',ok:true},{label:'the Torah was replaced',ok:false},{label:'Hashem does not care what we do',ok:false}], why:'Principles 10, 12 and 9.'}
],
check:[
{q:'What does principle eight say?', o:['The Torah we have was given to Moshe','Hashem is One','Mashiach will come']},
{q:'Do we wait for Mashiach every day?', o:['Yes','Only on Shabbos','No']},
{q:'What is principle thirteen?', o:['Techiyas hameisim','Hashem is One','Pray only to Hashem']}
]},

'LK.YT.L02.05':{name:'Yom Tov 11: The Seder, Step by Step', band:'5-6', peg:{kind:'song',show:'Kadesh Urchatz Karpas Yachatz…',say:'Sing the fifteen simanim: Kadesh, Urchatz, Karpas, Yachatz, Maggid, Rachtzah, Motzi, Matzah, Maror, Korech, Shulchan Orech, Tzafun, Bareich, Hallel, Nirtzah.'},
teach:[
{how:'Opener: the Seder is a map with fifteen stops. Kadesh: Kiddush on the first cup. Urchatz: washing without a brachah. Karpas: a vegetable dipped in salt water. Yachatz: breaking the middle matzah.', q:'What do we do at Yachatz?', o:['Break the middle matzah','Drink the second cup','Eat maror']},
{how:'Maggid: telling the story, with the Mah Nishtanah. Rachtzah: washing with a brachah. Motzi and Matzah: the brachos on the matzah. Maror: bitter herbs. Korech: Hillel\'s sandwich of matzah and maror.', q:'Whose sandwich is Korech?', o:['Hillel\'s','Moshe\'s','Paroh\'s']},
{how:'Shulchan Orech: the festive meal. Tzafun: eating the hidden afikoman. Bareich: bentching. Hallel: songs of praise. Nirtzah: our Seder is accepted: L\'shanah haba\'ah b\'Yerushalayim!', q:'What do we eat at Tzafun?', o:['The afikoman','Karpas','Charoses']}
],
we:[
{q:'Together: what comes right after Karpas?', o:['Yachatz','Maggid','Kadesh'], steps:['Kadesh, Urchatz, Karpas…','Next we break the matzah.','Yachatz.']},
{q:'Together: what is dipped in salt water?', o:['Karpas','Maror','Matzah'], steps:['Salt water reminds us of tears.','We dip a vegetable.','That is Karpas.']}
],
practice:[
{t:'order', q:'Put the first eight simanim in order.', tiles:['Kadesh','Urchatz','Karpas','Yachatz','Maggid','Rachtzah','Motzi','Matzah'], why:'The Seder simanim, as sung.'},
{t:'order', q:'Put the last seven simanim in order.', tiles:['Maror','Korech','Shulchan Orech','Tzafun','Bareich','Hallel','Nirtzah'], why:'From maror to Nirtzah.'},
{t:'pairs', q:'Match each item on the Seder plate to its meaning.', pairs:[['maror','the bitter slavery'],['charoses','the mortar of the bricks'],['zeroa','the Korban Pesach'],['salt water','tears']], why:'Every item on the ke\'arah tells part of the story.'},
{t:'spotall', q:'Tap every siman where we wash our hands.', cells:[{label:'Urchatz',ok:true},{label:'Rachtzah',ok:true},{label:'Korech',ok:false},{label:'Maggid',ok:false}], why:'Urchatz (no brachah) and Rachtzah (with a brachah).'},
{t:'type', q:'How many simanim are in the Seder? Type the number.', a:'15', alt:['fifteen'], kb:'num', why:'Fifteen, like the fifteen steps in the Beis Hamikdash.'},
{q:'When do we say Mah Nishtanah?', o:['At Maggid','At Korech','At Nirtzah'], h:'Maggid is telling the story.', why:'The questions open Maggid.'}
],
check:[
{q:'What is Korech?', o:['Matzah and maror together','Washing hands','The meal']},
{q:'Which siman is the festive meal?', o:['Shulchan Orech','Karpas','Hallel']},
{q:'What do we say at Nirtzah?', o:['L\'shanah haba\'ah b\'Yerushalayim','Good Shabbos','Mazel tov']}
]},
'LK.YT.L03.03':{name:'Yom Tov 12: Getting Ready for Pesach', band:'7-8', peg:{kind:'four steps',show:'Search · Burn · Sell · Nullify',say:'Bedikah at night, biur in the morning, mechirah through the rav, bittul with the words Kol Chamira.'},
teach:[
{how:'Opener: for eight days, not a crumb of chametz may be in our possession. Chametz is any of the five grains that rose after mixing with water for more than eighteen minutes.', q:'What is chametz?', o:['Grain that rose after mixing with water','Any food','Only bread crusts']},
{how:'The night before Pesach (14 Nisan) we do bedikas chametz: searching with a candle (or flashlight) for chametz. The next morning we burn it: biur chametz.', q:'When do we search for chametz?', o:['The night before Pesach','During the Seder','A month before']},
{how:'Chametz we keep is sold to a non-Jew through the rav: mechiras chametz. After the search and the burning we say Kol Chamira, nullifying any chametz we missed.', q:'What is mechiras chametz?', o:['Selling our chametz through the rav','Burning matzah','Eating extra bread']}
],
we:[
{q:'Together: a box of pasta in the cupboard on Pesach. Allowed to own?', o:['No, it must be sold or removed','Yes','Only if closed'], steps:['Pasta is made from wheat.','It is chametz.','Sell it through the rav or remove it.']},
{q:'Together: how long until flour and water become chametz?', o:['Eighteen minutes','Two hours','One minute'], steps:['Matzah is baked quickly.','The halachah gives eighteen minutes.','After that it is chametz.']}
],
practice:[
{t:'order', q:'Put the steps in order.', tiles:['Clean the house','Bedikas chametz at night','Say Kol Chamira','Biur chametz in the morning'], why:'Search, nullify, burn, and nullify again in the morning.'},
{t:'sort', q:'Sort: chametz or not chametz?', bins:[{id:'C',label:'Chametz'},{id:'N',label:'Not chametz'}], items:[{label:'regular bread',bin:'C'},{label:'cookies',bin:'C'},{label:'cereal from wheat',bin:'C'},{label:'matzah',bin:'N'},{label:'apples',bin:'N'},{label:'potatoes',bin:'N'}], why:'Only the five grains can become chametz.'},
{t:'pairs', q:'Match each step to its meaning.', pairs:[['bedikah','searching'],['biur','burning'],['mechirah','selling'],['bittul','nullifying']], why:'Four ways to remove chametz.'},
{t:'type', q:'How many minutes until dough becomes chametz? Type the number.', a:'18', alt:['eighteen'], kb:'num', why:'Eighteen minutes, as the poskim teach.'},
{q:'Ashkenazim do not eat kitniyos on Pesach. Which is kitniyos?', o:['Rice and beans','Potatoes','Apples'], h:'A minhag of Ashkenaz: ask your rav.', why:'Kitniyos look like grains and could be confused with them.'},
{q:'Why ten pieces of bread for bedikah, in many homes?', o:['So the search will find something and the brachah is not in vain','For a snack','For the birds'], h:'A minhag of many.', why:'So the bedikah is a real search that finds chametz.'}
],
check:[
{q:'When is biur chametz?', o:['The morning before Pesach','The night of the Seder','After Pesach']},
{q:'Which grains can become chametz?', o:['The five grains','All foods','Only rice']},
{q:'What do we say to nullify chametz?', o:['Kol Chamira','Modeh Ani','Hallel']}
]},
'LK.HAL.L01.04':{name:'Halacha 11: The Mezuzah', band:'K-2', peg:{kind:'touch',show:'Door → right side → kiss',say:'Mezuzah on the right side of the door; touch it and kiss your fingers.'},
teach:[
{how:'Opener: every Jewish home has a little guard at the door. A mezuzah is a klaf, a parchment, with Shema and V\'hayah written on it, rolled up in a case on the doorpost.', q:'What is written in a mezuzah?', o:['Shema and V\'hayah im shamoa','A list of names','A drawing']},
{how:'The mezuzah goes on the right side of the door as you walk in, in the top third of the doorpost, slanted in many Ashkenazi homes.', q:'On which side of the door is the mezuzah?', o:['The right side as you walk in','The left side','On the floor']},
{how:'When we walk past, many touch the mezuzah and kiss their fingers, to remember Hashem is with us. A sofer writes the klaf by hand.', q:'Who writes the mezuzah klaf?', o:['A sofer','A printer','A teacher']}
],
we:[
{q:'Together: you walk into your room. Where is the mezuzah?', o:['On the right side of the doorway','Above the bed','On the window'], steps:['Stand outside the door, facing in.','Look to your right.','The mezuzah is on that post.']},
{q:'Together: why kiss the mezuzah?', o:['To show love for Hashem\'s mitzvah','For luck','Because it is shiny'], steps:['The mezuzah has the Shema.','Touching it reminds us of Hashem.','We show love for the mitzvah.']}
],
practice:[
{t:'spotall', q:'Tap every true fact about a mezuzah.', cells:[{label:'it has the Shema',ok:true},{label:'a sofer writes it',ok:true},{label:'it goes on the right side',ok:true},{label:'it is printed on paper',ok:false},{label:'it goes on the floor',ok:false}], why:'Devarim 6:9: write them on the doorposts of your house.'},
{t:'pairs', q:'Match the words.', pairs:[['mezuzah','doorpost'],['klaf','parchment'],['sofer','scribe'],['bayis','house']], why:'Mezuzah literally means doorpost.'},
{t:'type', q:'Which side of the door gets the mezuzah? Type one word.', a:'right', alt:['the right','right side'], kb:'abc', why:'The right side as you enter.'},
{q:'Which paragraph of Shema says to put mezuzos on our doors?', o:['The first, V\'ahavta','The third, Vayomer','None'], h:'U\'chesavtam al mezuzos beisecha.', why:'Also in V\'hayah im shamoa.'},
{q:'Is a mezuzah checked from time to time?', o:['Yes, twice in seven years','Never','Every day'], h:'Letters can fade or crack.', why:'The halachah is to check twice in seven years.'},
{q:'Which rooms need a mezuzah?', o:['Rooms we live in, like bedrooms and the kitchen','Only the front door','Bathrooms'], h:'Not bathrooms.', why:'Living spaces need a mezuzah; bathrooms do not.'}
],
check:[
{q:'What is inside a mezuzah?', o:['A klaf with Shema','Money','A picture']},
{q:'Where does the mezuzah go?', o:['The right doorpost','The ceiling','The left window']},
{q:'Who writes the mezuzah?', o:['A sofer','A baker','Anyone']}
]},
'LK.HAL.L03.04':{name:'Halacha 12: Shabbos, Going Deeper', band:'7-8', peg:{kind:'three Bs',show:'Borer: Ochel, B\'yad, Miyad',say:'Borer is allowed: food from waste, by hand, for right now.'},
teach:[
{how:'Opener: Shabbos is a palace in time, and its walls are the halachos. Borer, selecting, is a melachah. It is allowed only in three conditions: taking the food (ochel) from the waste, by hand (b\'yad), to use right away (miyad).', q:'What are the three conditions for selecting on Shabbos?', o:['Food from waste, by hand, for right now','Waste from food, with a tool, for later','Any way at all']},
{how:'Muktzeh means set aside: things not meant for Shabbos use, like money, a pen, or a phone, may not be moved.', q:'Which is muktzeh?', o:['Money','A siddur','A chair']},
{how:'Carrying from a private place to a public place is a melachah. Where there is a kosher eruv, the rabbis allow carrying. Ask your rav if your eruv is up.', q:'What does an eruv allow?', o:['Carrying in the area it surrounds','Cooking','Writing']}
],
we:[
{q:'Together: you want a grape from a bowl of grapes and leaves. Allowed?', o:['Take the grape by hand to eat now','Pick out the leaves','Use a sieve'], steps:['Food from waste: take the grape, not the leaves.','By hand: no sieve.','For now: eat it right away.']},
{q:'Together: a pen fell on your chair. May you move it on Shabbos?', o:['Ask: it is muktzeh; there are ways like tilting the chair (ask your rav)','Pick it up freely','Write with it'], steps:['A pen is for writing, a melachah.','So it is muktzeh.','Ask how to deal with it.']}
],
practice:[
{t:'sort', q:'Sort: muktzeh or not?', bins:[{id:'M',label:'Muktzeh'},{id:'N',label:'Not muktzeh'}], items:[{label:'money',bin:'M'},{label:'a pen',bin:'M'},{label:'a phone',bin:'M'},{label:'a siddur',bin:'N'},{label:'a fork',bin:'N'},{label:'a pillow',bin:'N'}], why:'Things not used on Shabbos are muktzeh.'},
{t:'spotall', q:'Tap every allowed way of selecting on Shabbos.', cells:[{label:'taking a cookie out of a mixed plate to eat now',ok:true},{label:'picking the food, not the waste',ok:true},{label:'using a sieve',ok:false},{label:'sorting for tomorrow',ok:false}], why:'Ochel, b\'yad, miyad.'},
{t:'pairs', q:'Match each term to its meaning.', pairs:[['borer','selecting'],['muktzeh','set aside, not moved'],['eruv','allows carrying'],['hotza\'ah','carrying out']], why:'Basic Shabbos terms.'},
{t:'type', q:'How many minutes before sunset do many light Shabbos candles? Type the number.', a:'18', alt:['eighteen'], kb:'num', why:'A widespread minhag; some cities differ (Yerushalayim 40).'},
{q:'Who lights Shabbos candles in most homes?', o:['The mother','The youngest child','The guests'], h:'Women have a special mitzvah.', why:'Hadlakas neiros is the woman\'s mitzvah.'},
{q:'Is reading a Torah book on Shabbos borer?', o:['No, borer is about separating mixtures','Yes','Only aloud'], h:'Borer = selecting from a mixture.', why:'Reading involves no mixture.'}
],
check:[
{q:'What does muktzeh mean?', o:['Set aside, not to be moved on Shabbos','Holy food','A Shabbos song']},
{q:'Selecting is allowed when it is…', o:['Food from waste, by hand, for now','Waste from food','With a tool']},
{q:'What lets us carry outside on Shabbos?', o:['A kosher eruv','A permit slip','Nothing ever']}
]},
'LK.TEF.L02.05':{name:'Tefillah 12: The Three Paragraphs of Shema', band:'5-6', peg:{kind:'three',show:'Love · Reward · Tzitzis',say:'Paragraph one: love Hashem. Two: reward for mitzvos. Three: tzitzis and leaving Mitzrayim.'},
teach:[
{how:'Opener: Krias Shema has three paragraphs from the Torah. The first, Shema and V\'ahavta (Devarim 6), is about loving Hashem with all your heart, soul and might.', q:'What is the first paragraph about?', o:['Loving Hashem','Tzitzis','Rain']},
{how:'The second, V\'hayah im shamoa (Devarim 11), teaches that when we keep the mitzvos, Hashem gives rain in its time. It also has tefillin, mezuzah and teaching our children.', q:'What does the second paragraph promise?', o:['Rain in its time for keeping mitzvos','A new house','Snow']},
{how:'The third, Vayomer (Bamidbar 15), is about tzitzis, and ends with remembering yetzias Mitzrayim, which we must mention every day and night.', q:'Which mitzvah is in the third paragraph?', o:['Tzitzis','Mezuzah only','Shofar']}
],
we:[
{q:'Together: which paragraphs mention tefillin?', o:['The first and the second','Only the third','None'], steps:['First: u\'keshartam l\'os al yadecha.','Second: the same words.','Both.']},
{q:'Together: where is the mitzvah to remember leaving Mitzrayim?', o:['The end of the third paragraph','The first line','Nowhere'], steps:['Vayomer is about tzitzis.','It ends: I am Hashem who took you out of Mitzrayim.','So we remember every day.']}
],
practice:[
{t:'sort', q:'Sort each mitzvah into the paragraph that has it.', bins:[{id:'1',label:'First (V\'ahavta)'},{id:'3',label:'Third (Vayomer)'}], items:[{label:'love Hashem with all your heart',bin:'1'},{label:'teach your children',bin:'1'},{label:'tzitzis',bin:'3'},{label:'remember leaving Mitzrayim',bin:'3'}], why:'V\'ahavta and Vayomer.'},
{t:'pairs', q:'Match each paragraph to its sefer.', pairs:[['Shema / V\'ahavta','Devarim 6'],['V\'hayah im shamoa','Devarim 11'],['Vayomer','Bamidbar 15']], why:'Two from Devarim, one from Bamidbar.'},

{q:'With all your heart, soul and might: what does might (me\'odecha) mean, say Chazal?', o:['With all your money and means','With your muscles','With your voice'], h:'Rashi brings both meanings.', why:'Rashi: with all your money.'},
{q:'Which paragraph do we say to accept the yoke of mitzvos?', o:['The second','The first','The third'], h:'The Mishnah: first kabalas ol malchus Shamayim, then ol mitzvos.', why:'Berachos 2:2.'}
],
