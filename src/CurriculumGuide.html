<style>
/* Curriculum Guide (HoS DECISION 2026-11-15 2000Z). Layered on Curriculum Preview: Overview, subject guides (intention, scope and
   sequence, method), coverage dashboard, What's new, review queue, review buttons. Staff only. No student data. */
.cgz{--ink:#1F2937;--mute:#6B7280;--line:#E5E7EB;--ok:#047857;--okb:#ECFDF5;--warn:#B45309;--warnb:#FFFBEB;--bad:#B91C1C;--badb:#FEF2F2;--blue:#4338CA;--blueb:#EEF2FF}
.cgz .cg-hero{background:linear-gradient(135deg,#1E293B,#334155);color:#fff;border-radius:18px;padding:18px 20px;margin:4px 0 14px}
.cgz .cg-hero h2{margin:0 0 4px;font-size:22px}
.cgz .cg-hero p{margin:4px 0 0;opacity:.85;max-width:820px}
.cgz .cg-kpis{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.cgz .cg-kpi{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 12px;min-width:130px}
.cgz .cg-kpi b{display:block;font-size:22px}
.cgz .cg-kpi span{font-size:12px;opacity:.85}
.cgz .cg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cgz .cg-tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;text-align:left;transition:transform .12s,box-shadow .12s;font:inherit;color:var(--ink);width:100%}
.cgz .cg-tile:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,23,42,.08)}
.cgz .cg-tile h3{margin:0 0 2px;font-size:17px;display:flex;align-items:center;gap:8px}
.cgz .cg-tile .cg-em{font-size:24px}
.cgz .cg-sub{color:var(--mute);font-size:13px}
.cgz .cg-m{margin-top:8px}
.cgz .cg-mr{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:4px 0}
.cgz .cg-mr label{width:92px;color:var(--mute)}
.cgz .cg-bar{flex:1;height:8px;background:#F1F5F9;border-radius:99px;overflow:hidden}
.cgz .cg-bar i{display:block;height:100%;border-radius:99px}
.cgz .cg-mr b{width:38px;text-align:right}
.cgz .g{background:#10B981}.cgz .y{background:#F59E0B}.cgz .r{background:#EF4444}.cgz .b{background:#6366F1}
.cgz .cg-sec{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0}
.cgz .cg-sec h3{margin:0 0 6px;font-size:17px}
.cgz .cg-int{font-size:15.5px;line-height:1.55}
.cgz .cg-lv{border-left:4px solid #C7D2FE;padding:6px 0 6px 12px;margin:12px 0}
.cgz .cg-lvh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cgz .cg-lvh b{font-size:16px}
.cgz .cg-goal{color:#374151;margin:4px 0 6px}
.cgz .cg-sk{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:8px 0;border-top:1px dashed var(--line)}
.cgz .cg-sk:first-of-type{border-top:0}
.cgz .cg-skn{font-weight:700}
.cgz .cg-meth{color:#374151;font-size:13.5px}
.cgz .cg-kinds{display:flex;height:10px;border-radius:99px;overflow:hidden;width:150px;background:#F1F5F9;margin-top:4px}
.cgz .cg-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.cgz .cg-c{font-size:11.5px;border-radius:99px;padding:2px 8px;background:#F1F5F9;color:#475569;white-space:nowrap}
.cgz .cg-c.ok{background:var(--okb);color:var(--ok)}.cgz .cg-c.warn{background:var(--warnb);color:var(--warn)}.cgz .cg-c.bad{background:var(--badb);color:var(--bad)}.cgz .cg-c.blue{background:var(--blueb);color:var(--blue)}
.cgz .cg-act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:flex-start}
.cgz .cg-btn{font:inherit;font-size:12.5px;border:1px solid #D1D5DB;background:#fff;border-radius:9px;padding:5px 9px;cursor:pointer;color:var(--ink)}
.cgz .cg-btn.pri{background:#4F46E5;border-color:#4F46E5;color:#fff}
.cgz .cg-btn.on-ok{background:var(--okb);border-color:#6EE7B7;color:var(--ok)}
.cgz .cg-btn.on-rebbe{background:#FEF3C7;border-color:#FCD34D;color:#92400E}
.cgz .cg-btn.on-flag{background:var(--badb);border-color:#FCA5A5;color:var(--bad)}
.cgz .cg-note{grid-column:1/-1;display:flex;gap:6px}
.cgz .cg-note textarea{flex:1;min-height:54px;border:2px solid var(--line);border-radius:10px;padding:8px;font:inherit}
.cgz .cg-back{font:inherit;border:0;background:none;color:var(--blue);cursor:pointer;padding:0;margin-bottom:6px;font-weight:700}
.cgz .cg-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:6px 0}
.cgz .cg-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.cgz .cg-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.cgz .cg-tab{font:inherit;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;cursor:pointer}
.cgz .cg-tab.on{background:#1E293B;color:#fff;border-color:#1E293B}
.cgz .cg-hero .cg-tab{background:rgba(255,255,255,.95);color:#1E293B;border-color:transparent;font-weight:600}
.cgz .cg-empty{color:var(--mute);text-align:center;padding:24px}
.cgz .cg-tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.cgz .cg-tbl th,.cgz .cg-tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.cgz .cg-tbl th{color:var(--mute);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.cgz .cg-tbl tr.cg-click{cursor:pointer}.cgz .cg-tbl tr.cg-click:hover{background:#F8FAFC}
#cpN .cg-navb{display:flex;justify-content:space-between;width:100%;text-align:left;background:#F8FAFC;padding:9px 10px;margin:1px 0;border-radius:10px;font-weight:700;color:#1E293B}
#cpN .cg-navb.on{background:#1E293B;color:#fff}
#cpN .cg-navb span{font-weight:400;opacity:.8}
#cpN .cg-sep{height:1px;background:#E5E7EB;margin:8px 4px}
.cp-sk .cg-dec{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
@media(max-width:720px){.cgz .cg-sk{grid-template-columns:1fr}.cgz .cg-act{justify-content:flex-start}.cgz .cg-mr label{width:80px}}
@media print{.cgz .cg-act,.cgz .cg-tabs,.cgz .cg-back{display:none!important}.cgz .cg-sec,.cgz .cg-tile{break-inside:avoid}}
</style>
<script>
(function(){
 var SUBJ=[['MATH','Math','🔢'],['READ','Reading','📖'],['LANG','Writing & Language','✏️'],['SCI','Science','🔬'],['SS','Social Studies','🗺️'],['COMP','Computing','💻'],['LIFE','Life & Money','💵'],['SIM',"B'Simcha",'🌈'],['ELEC','Electives','🎨'],['LK','Limudei Kodesh','📜'],['HEB','Lashon Hakodesh','🔤'],['VOC','Trades','🛠️']];
 var INTENT={
  MATH:'Students build real number sense step by step: counting and place value, then the four operations, fractions and decimals, ratios, integers and equations, geometry, measurement and data. Every skill is taught with worked examples, then practiced with fresh numbers each time, so a student cannot memorize answers. The goal is a boy who understands WHY a method works and can use math in daily life, in the shop and in learning.',
  READ:'Students move from hearing sounds and blending them into words, to phonics and fluent reading, then to understanding: main idea, inference, evidence, theme and point of view. Stories use names, settings and values from our world. The goal is a confident reader who reads smoothly, understands deeply and can prove his answer from the text.',
  LANG:'Students learn to write clearly and correctly: letters and neat handwriting, complete sentences, grammar and punctuation, then paragraphs, essays, arguments and short research. The goal is a boy who can say what he means in writing, for a letter, a report or a thank-you, with clear thinking and correct form.',
  SCI:'Students explore the world Hashem made through observation, simple experiments and clear explanations: living things, the body, matter and energy, earth and sky. Lessons use pictures, sorting, ordering and real-life examples, with a sense of wonder (Mah rabu maasecha). The goal is curiosity plus the habit of asking how and why, and checking with evidence.',
  SS:'Students learn about community, maps, history, government and the world, starting close to home and widening out. The goal is a boy who knows where he lives, how communities and countries work, and how to read maps, timelines and sources with good judgment.',
  COMP:'Students learn to use a computer well and safely: typing, files, documents and spreadsheets, online safety, and step-by-step thinking through block coding and then real programming. The goal is a capable, careful user who can build useful things and solve problems.',
  LIFE:'Students learn money and life skills: earning, saving, budgeting, smart spending, honest dealing and planning time. The goal is a responsible young man who handles money and commitments wisely.',
  SIM:"B'Simcha teaches emunah, bitachon and joyful living: seeing Hashem's kindness, gam zu l'tovah, gratitude, chizuk and middos in everyday moments. The goal is a boy who learns and lives with simcha and trust.",

  LK:'Limudei Kodesh builds the core of a ben Torah: Kriyah (reading with nekudos and trop), Chumash with Rashi, Mishnayos, Gemara, Tefillah, Halacha, Yom Tov, Middos, Navi and Parsha. Texts are shown whole from reliable sources, taught with the methods of a good rebbe, and checked by a rebbe. The goal is a boy who can learn on his own, understands what he says and learns, and loves it.',
  HEB:'Lashon Hakodesh teaches the language of the Torah: vocabulary, shorashim, binyanim, prefixes and suffixes, and reading pesukim with understanding. The goal is a boy who can open a sefer and work out the meaning himself.',
  VOC:'Trades teach hands-on skills such as electricity and shop safety, with careful measuring and following procedures. The goal is safe, competent work with the hands.'
 };
 var KIND={tap:['Pick the answer','#94A3B8'],mc:['Multiple choice','#A5B4FC'],num:['Type a number','#93C5FD'],order:['Put in order','#F59E0B'],pairs:['Match pairs','#10B981'],sort:['Sort into groups','#8B5CF6'],spotall:['Find all','#EC4899'],type:['Type the answer','#06B6D4'],write:['Write it','#EF4444']};
 var TAPLIKE={tap:1,mc:1,num:1};
 var STR={NUM:'Numbers',OPS:'Operations',PV:'Place value',FRAC:'Fractions',ALG:'Algebra',GEO:'Geometry',MEAS:'Measurement',STAT:'Data',PA:'Sounds',PHON:'Phonics',LV:'Long vowels',FLU:'Fluency',VOC:'Vocabulary',LIT:'Stories',COMP:'Understanding',GRAM:'Grammar',MECH:'Spelling and punctuation',SENT:'Sentences',USE:'Word use',HAND:'Handwriting',PARA:'Paragraphs',ESSAY:'Essays',RES:'Research',KRI:'Kriyah',CHU:'Chumash',RAS:'Rashi',MSH:'Mishnayos',GEM:'Gemara',TEF:'Tefillah',YT:'Yom Tov',HAL:'Halacha',MID:'Middos',NAV:'Navi',PAR:'Parsha',READ:'Reading',DIG:'Digital skills',PROG:'Programming',TYPE:'Typing',FIN:'Money',BUD:'Budgeting',STUDY:'Study skills',NUC:'Journey Into the Atom',ART:'Art',MUS:'Music',LOGIC:'Logic',SPEAK:'Speaking'};
 var G={ready:false,model:{},bySubj:{},rev:{},sync:'',me:'',view:'ov',subj:null,open:{},filt:'all'};

 function BK(){ try{ return typeof BANK_ALL!=='undefined'&&BANK_ALL?BANK_ALL:{}; }catch(e){ return {}; } }
 function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
 function he(s){ return /[֐-׿]/.test(String(s))?'<span class="cp-he" dir="rtl">'+esc(s)+'</span>':esc(s); }
 function call(fn){ var a=[].slice.call(arguments,1); return new Promise(function(res,rej){ google.script.run.withSuccessHandler(res).withFailureHandler(function(e){ rej(e&&e.message?e.message:String(e)); })[fn].apply(null,a); }); }
 function sess(){ try{ return JSON.parse(sessionStorage.getItem('tl-session')||'null'); }catch(e){ return null; } }
 function subjOf(id){ var p=String(id).split('.')[0]; return p==='WRIT'?'LANG':p; }
 function lvl(id){ var m=/\.L(\d+)/.exec(id); return m?Number(m[1]):0; }
 function grade(L){ return L<=0?'':L===1?'about Kindergarten':L<=9?'about Grade '+(L-1):L<=13?'about Grade '+(L-1)+' (high school)':'advanced'; }
 function nm(id){ try{ return skillName(id)||id; }catch(e){ var s=(BK())[id]; return (s&&s.name)||id; } }
 function fnv(str){ var h=0x811c9dc5; for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=(h+((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24)))>>>0; } return ('0000000'+h.toString(16)).slice(-8); }
 function allIds(){ var B=BK(), o={}; Object.keys(B).forEach(function(k){ o[k]=1; });
  [typeof MK8!=='undefined'?MK8:{}, window.TL_TEACH||{}, window.TL_DO||{}].forEach(function(src){ Object.keys(src).forEach(function(k){ if(o[k]||!/^[A-Z]+\.[A-Z]*\.?L\d+/.test(k)) return; try{ var n=skillName(k); if(n&&n!==k) o[k]=1; }catch(e){} }); });
  return Object.keys(o); }

 function method(id,T){ var M=window.TL_METHOD||{}; if(M[id]) return M[id];
  if(T&&T.big) return T.big;
  try{ var mk=typeof MK8!=='undefined'?MK8[id]:null; if(mk&&mk.how&&mk.how[0]) return mk.how[0]; }catch(e){}
  try{ var d=(window.TL_DO||{})[id]; if(d&&d.s) return String(d.s).split('\n')[0]; }catch(e){}
  return ''; }

 function analyze(){
  var B=BK(), T=window.TL_TEACH||{}, D=window.TL_DO||{}, model={}, by={};
  allIds().forEach(function(id){
   var s=B[id], gen=false, list=[];
   function take(sk){ ['teach','we','practice','check'].forEach(function(ph){ (sk[ph]||[]).forEach(function(it){ if(it&&typeof it==='object') list.push(it.t||'tap'); }); }); }
   if(s) take(s);
   if(!list.length){ try{ var m=buildMission(id); (m.items||m||[]).forEach(function(it){ if(it&&typeof it==='object') list.push(it.t||'tap'); }); gen=true; }catch(e){} }
   var kc={}; list.forEach(function(k){ kc[k]=(kc[k]||0)+1; });
   var n=list.length, kinds=Object.keys(kc).length, taps=0; Object.keys(kc).forEach(function(k){ if(TAPLIKE[k]) taps+=kc[k]; });
   var top=0; Object.keys(kc).forEach(function(k){ if(kc[k]>top) top=kc[k]; });
   var L=lvl(id), need=L<=3?3:4, mixOk=n>0&&kinds>=need&&top/n<=0.40;
   var t=T[id], hasT=!!t, how=!!(D[id]&&(D[id].s||(D[id].q&&Object.keys(D[id].q).length)));
   var fp=''; try{ fp=fnv(JSON.stringify(s||{name:nm(id)})+'|'+JSON.stringify(t||'')+'|'+JSON.stringify(D[id]||'')); }catch(e){ fp=fnv(id); }
   var sj=subjOf(id), rec={id:id,subj:sj,L:L,name:nm(id),n:n,kc:kc,kinds:kinds,taps:n?taps/n:0,mixOk:mixOk,need:need,gen:gen,teach:hasT,how:how,meth:method(id,t),big:t&&t.big||'',hash:fp,kodesh:(sj==='LK'||sj==='HEB')};
   model[id]=rec; (by[sj]=by[sj]||[]).push(rec);
  });
  Object.keys(by).forEach(function(s){ by[s].sort(function(a,b){ return a.L-b.L||(a.id<b.id?-1:1); }); });
  G.model=model; G.bySubj=by;
 }

 function rv(id){ var r=G.rev[id]; if(!r) return {first:'',changed:'',status:'',note:'',by:'',at:'',rh:''}; return {first:r[0],changed:r[1],status:r[2],note:r[3],by:r[4],at:r[5],rh:r[6]}; }
 function stale(rec){ var r=rv(rec.id); return !!(r.status&&r.rh&&r.rh!==rec.hash); }
 function reviewed(rec){ var r=rv(rec.id); return !!(r.status==='ok'||r.status==='rebbe')&&!stale(rec); }
 function isNew(rec){ var r=rv(rec.id), d=r.changed||r.first; if(!d) return false; var age=(Date.now()-Date.parse(d))/864e5; return age<=14&&!reviewed(rec); }
 function needsReview(rec){ var r=rv(rec.id); return r.status==='flag'||stale(rec)||!reviewed(rec); }

 function pct(a,b){ return b?Math.round(100*a/b):0; }
 function cls(p){ return p>=80?'g':p>=40?'y':'r'; }
 function meter(label,a,b){ var p=pct(a,b); return '<div class="cg-mr"><label>'+label+'</label><div class="cg-bar"><i class="'+cls(p)+'" style="width:'+p+'%"></i></div><b>'+p+'%</b></div>'; }
 function stats(list){ var o={n:list.length,teach:0,mix:0,how:0,rev:0,flag:0,neu:0,taps:0}; list.forEach(function(r){ if(r.teach) o.teach++; if(r.mixOk) o.mix++; if(r.how) o.how++; if(reviewed(r)) o.rev++; if(rv(r.id).status==='flag') o.flag++; if(isNew(r)) o.neu++; o.taps+=r.taps; }); o.taps=list.length?o.taps/list.length:0; return o; }

 function kindsBar(rec){ var h='', n=rec.n||1; Object.keys(rec.kc).sort(function(a,b){ return rec.kc[b]-rec.kc[a]; }).forEach(function(k){ var c=(KIND[k]||[k,'#CBD5E1'])[1]; h+='<i title="'+esc((KIND[k]||[k])[0])+': '+rec.kc[k]+'" style="width:'+(100*rec.kc[k]/n)+'%;background:'+c+'"></i>'; }); return '<div class="cg-kinds" title="Activity mix">'+h+'</div>'; }
 function chips(rec){ var r=rv(rec.id), h='';
  h+=rec.teach?'<span class="cg-c ok">🧑‍🏫 Teacher Time</span>':'<span class="cg-c bad">No teacher lesson yet</span>';
  h+=rec.mixOk?'<span class="cg-c ok">✓ Varied activities</span>':'<span class="cg-c warn" title="Rule: '+rec.need+'+ kinds, none over 40%">'+Math.round(rec.taps*100)+'% tap-style · '+rec.kinds+' kind'+(rec.kinds===1?'':'s')+'</span>';
  if(rec.gen) h+='<span class="cg-c blue">Fresh numbers each time</span>';
  if(!rec.how) h+='<span class="cg-c bad">No How-to box</span>';
  if(r.status==='ok') h+='<span class="cg-c ok">✔ Approved'+(r.by?' · '+esc(r.by):'')+'</span>';
  if(r.status==='rebbe') h+='<span class="cg-c ok">📜 Rebbe-checked'+(r.by?' · '+esc(r.by):'')+'</span>';
  if(r.status==='flag') h+='<span class="cg-c bad">🚩 Flagged'+(r.by?' · '+esc(r.by):'')+'</span>';
  if(stale(rec)) h+='<span class="cg-c warn">Changed since it was reviewed</span>';
  else if(isNew(rec)) h+='<span class="cg-c blue">🆕 New or changed</span>';
  if(rec.kodesh&&r.status!=='rebbe') h+='<span class="cg-c warn">Needs a rebbe check</span>';
  return '<div class="cg-chips">'+h+'</div>'; }

 function skillRow(rec){ var r=rv(rec.id);
  var act='<button class="cg-btn pri" data-go="'+esc(rec.id)+'">📄 See the lesson</button><button class="cg-btn" data-kidv="'+esc(rec.id)+'">▶ Kid view</button>'
   +'<button class="cg-btn'+(r.status==='ok'?' on-ok':'')+'" data-st="ok" data-id="'+esc(rec.id)+'">✔ Approve</button>'
   +(rec.kodesh?'<button class="cg-btn'+(r.status==='rebbe'?' on-rebbe':'')+'" data-st="rebbe" data-id="'+esc(rec.id)+'">📜 Rebbe-checked</button>':'')
   +'<button class="cg-btn'+(r.status==='flag'?' on-flag':'')+'" data-st="flag" data-id="'+esc(rec.id)+'">🚩 Flag</button>';
  return '<div class="cg-sk" data-row="'+esc(rec.id)+'"><div><div class="cg-skn">'+esc(rec.name)+' <span class="cp-id">'+esc(rec.id)+'</span></div>'

   +(G.open[rec.id]?'<div class="cg-note"><textarea placeholder="What needs fixing? (seen by staff and writers)" data-note="'+esc(rec.id)+'">'+esc(r.note)+'</textarea><button class="cg-btn pri" data-save="'+esc(rec.id)+'">Save flag</button></div>':'')+'</div>'; }

 function legend(){ var h='<div class="cg-legend"><span>Activity mix:</span>'; ['tap','mc','num','order','pairs','sort','spotall','type','write'].forEach(function(k){ h+='<span><i style="background:'+KIND[k][1]+'"></i>'+KIND[k][0]+'</span>'; }); return h+'</div>'; }

 function overview(){ var all=Object.keys(G.model).map(function(k){ return G.model[k]; }), st=stats(all);
  var h='<div class="cg-hero"><h2>What we teach, at a glance</h2><p>Every subject, level and skill the students learn, with its purpose, how it is taught, and how complete it is. Tap a subject to see its goals and its ladder of skills. Nothing here changes any student\'s work.</p>'
   +'<div class="cg-kpis"><div class="cg-kpi"><b>'+st.n+'</b><span>skills in '+Object.keys(G.bySubj).length+' subjects</span></div>'
   +'<div class="cg-kpi"><b>'+pct(st.teach,st.n)+'%</b><span>have a Teacher Time lesson</span></div>'
   +'<div class="cg-kpi"><b>'+pct(st.mix,st.n)+'%</b><span>have varied activities</span></div>'
   +'<div class="cg-kpi"><b>'+pct(st.rev,st.n)+'%</b><span>reviewed by staff</span></div>'
   +'<div class="cg-kpi"><b>'+st.neu+'</b><span>new or changed to review</span></div>'
   +'<div class="cg-kpi"><b>'+st.flag+'</b><span>flagged for fixing</span></div></div>'
   +'<div class="cg-tabs" style="margin:12px 0 0"><button class="cg-tab" data-v2="new">🆕 Review what is new ('+st.neu+')</button><button class="cg-tab" data-v2="flag">🚩 Flagged ('+st.flag+')</button><button class="cg-tab" data-v2="gaps">📊 Coverage and gaps</button><button class="cg-tab" data-print="1">🖨 Print this page</button></div></div>';
  h+='<div class="cg-grid">'+SUBJ.filter(function(x){ return G.bySubj[x[0]]; }).map(function(x){ var list=G.bySubj[x[0]], s=stats(list), Ls=list.map(function(r){ return r.L; }).filter(Boolean), lo=Math.min.apply(null,Ls), hi=Math.max.apply(null,Ls);
   return '<button class="cg-tile" data-subj="'+x[0]+'"><h3><span class="cg-em">'+x[2]+'</span>'+esc(x[1])+'</h3><div class="cg-sub">'+s.n+' skills · Levels '+lo+'–'+hi+(s.neu?' · <b style="color:#4338CA">'+s.neu+' new</b>':'')+(s.flag?' · <b style="color:#B91C1C">'+s.flag+' flagged</b>':'')+'</div><div class="cg-m">'
    +meter('Teacher Time',s.teach,s.n)+meter('Varied activities',s.mix,s.n)+meter('How-to boxes',s.how,s.n)+meter('Reviewed',s.rev,s.n)+'</div></button>'; }).join('')+'</div>';
  h+='<div class="cg-sec"><h3>How to read this</h3><div class="cg-int">🧑‍🏫 <b>Teacher Time</b>: a drawn teacher teaches the skill on a chalkboard before practice (big idea, worked examples, a common mistake, a guided try). '
   +'<br>🎯 <b>Varied activities</b>: the school rule (DECISION 0050). Each lesson uses at least 3 kinds of activity (K–2) or 4 kinds (Grade 3 and up), and no single kind is more than 40%. '
   +'<br>💡 <b>How-to box</b>: every question has a hint that teaches the method without giving the answer. '
   +'<br>✔ <b>Reviewed</b>: a staff member approved it (Kodesh: a rebbe checked it). If the lesson changes later, it shows "changed since it was reviewed".</div></div>';
  return h; }

 function strandOf(r){ var nmx=String(r.name), m=/^([^:]{2,40}?)\s*\d+[a-z]?\s*:/.exec(nmx); if(m) return m[1].trim(); var c=String(r.id).split('.')[1]||''; return STR[c]||c; }
 function shortName(r){ var nmx=String(r.name); return nmx.indexOf(':')>0?nmx.slice(nmx.indexOf(':')+1).trim():nmx; }
 function levelGoal(list){ var g={}, order=[]; list.forEach(function(r){ var k=strandOf(r); if(!g[k]){ g[k]=[]; order.push(k); } g[k].push(shortName(r)); });
  return order.map(function(k){ return '<b>'+esc(k)+':</b> '+g[k].map(esc).join(', '); }).join(' · '); }
 function subjectPage(sj){ var x=SUBJ.filter(function(y){ return y[0]===sj; })[0]||[sj,sj,'📘'], list=G.bySubj[sj]||[], s=stats(list), I=(window.TL_INTENT||{});
  var h='<button class="cg-back" data-home="1">← All subjects</button><div class="cg-hero"><h2>'+x[2]+' '+esc(x[1])+'</h2><p>'+esc(I[sj]||INTENT[sj]||'')+'</p>'
   +'<div class="cg-kpis"><div class="cg-kpi"><b>'+s.n+'</b><span>skills</span></div><div class="cg-kpi"><b>'+pct(s.teach,s.n)+'%</b><span>Teacher Time</span></div><div class="cg-kpi"><b>'+pct(s.mix,s.n)+'%</b><span>varied activities</span></div><div class="cg-kpi"><b>'+Math.round(s.taps*100)+'%</b><span>of questions are tap-style</span></div><div class="cg-kpi"><b>'+pct(s.rev,s.n)+'%</b><span>reviewed</span></div></div></div>';
  h+='<div class="cg-tabs">'+[['all','Everything'],['new','🆕 New or changed'],['todo','Needs review'],['flag','🚩 Flagged'],['gap','Gaps to fix']].map(function(t){ return '<button class="cg-tab'+(G.filt===t[0]?' on':'')+'" data-filt="'+t[0]+'">'+t[1]+'</button>'; }).join('')+'</div>'+legend();
  var levels={}; list.forEach(function(r){ (levels[r.L]=levels[r.L]||[]).push(r); });
  var shown=0;
  Object.keys(levels).map(Number).sort(function(a,b){ return a-b; }).forEach(function(L){ var all=levels[L], f=all.filter(filt); if(!f.length) return; shown+=f.length; var ls=stats(all), LI=I[sj+'.L'+(L<10?'0':'')+L]||I[sj+'.L'+L];
   h+='<div class="cg-sec cg-lv"><div class="cg-lvh"><b>Level '+L+'</b><span class="cg-sub">'+grade(L)+' · '+all.length+' skills · Teacher Time '+pct(ls.teach,ls.n)+'% · varied '+pct(ls.mix,ls.n)+'% · reviewed '+pct(ls.rev,ls.n)+'%</span></div>'
    +'<div class="cg-goal">'+(LI?'<b>By the end of this level a student can:</b> '+esc(LI):'<b>This level teaches</b> · '+levelGoal(all))+'</div>'+f.map(skillRow).join('')+'</div>'; });
  if(!shown) h+='<div class="cg-empty">Nothing in this view right now. '+(G.filt==='new'?'No new or changed skills waiting for review.':'')+'</div>';
  return h; }
 function filt(r){ var st=rv(r.id).status; if(G.filt==='new') return isNew(r)||stale(r); if(G.filt==='todo') return needsReview(r); if(G.filt==='flag') return st==='flag'; if(G.filt==='gap') return !r.teach||!r.mixOk||!r.how; return true; }

 function queuePage(kind){ var all=Object.keys(G.model).map(function(k){ return G.model[k]; });
  var list=all.filter(kind==='new'?function(r){ return isNew(r)||stale(r); }:function(r){ return rv(r.id).status==='flag'; });
  var title=kind==='new'?'🆕 New or changed lessons to review':'🚩 Flagged lessons';
  var sub=kind==='new'?'Lessons added or changed in the last 14 days that nobody has approved yet, plus approved lessons that changed afterward. Approve each one, or flag it with a note for the writers.':'Lessons a staff member flagged, with their note. Writers fix these first.';
  var h='<div class="cg-hero"><h2>'+title+'</h2><p>'+sub+'</p><div class="cg-kpis"><div class="cg-kpi"><b>'+list.length+'</b><span>lessons</span></div></div></div>';
  if(G.sync==='baseline'&&kind==='new') h+='<div class="cg-sec"><div class="cg-int">This is the first time the guide has run, so today\'s lessons are the starting point. From now on, every lesson Claude or a writer adds or changes appears here automatically.</div></div>';
  if(!list.length) return h+'<div class="cg-empty">All clear. Nothing waiting here.</div>';
  var by={}; list.forEach(function(r){ (by[r.subj]=by[r.subj]||[]).push(r); });
  SUBJ.forEach(function(x){ if(!by[x[0]]) return; h+='<div class="cg-sec"><h3>'+x[2]+' '+esc(x[1])+' <span class="cg-sub">'+by[x[0]].length+'</span></h3>'+by[x[0]].map(skillRow).join('')+'</div>'; });
  return h; }

 function gapsPage(){ var h='<div class="cg-hero"><h2>📊 Coverage and gaps</h2><p>How complete each subject is, measured live from the lessons. Tap a subject row to see its gaps.</p></div>';
  h+='<div class="cg-sec" style="overflow:auto"><table class="cg-tbl"><tr><th>Subject</th><th>Skills</th><th>Teacher Time</th><th>Varied activities</th><th>Tap-style share</th><th>How-to</th><th>Reviewed</th><th>Flagged</th></tr>';
  SUBJ.forEach(function(x){ var list=G.bySubj[x[0]]; if(!list) return; var s=stats(list);
   h+='<tr class="cg-click" data-subj="'+x[0]+'" data-f="gap"><td>'+x[2]+' '+esc(x[1])+'</td><td>'+s.n+'</td><td>'+s.teach+' <span class="cg-sub">('+pct(s.teach,s.n)+'%)</span></td><td>'+s.mix+' <span class="cg-sub">('+pct(s.mix,s.n)+'%)</span></td><td>'+Math.round(s.taps*100)+'%</td><td>'+pct(s.how,s.n)+'%</td><td>'+pct(s.rev,s.n)+'%</td><td>'+s.flag+'</td></tr>'; });
  return h+'</table></div>'; }

 function render(){ var m=document.getElementById('cpM'); if(!m) return; var h='<div id="cg" class="cgz">';
  if(!G.ready) h+='<div class="cg-empty">Reading every lesson…</div>';
  else if(G.view==='ov') h+=overview(); else if(G.view==='subj') h+=subjectPage(G.subj); else if(G.view==='new') h+=queuePage('new'); else if(G.view==='flag') h+=queuePage('flag'); else if(G.view==='gaps') h+=gapsPage();
  m.innerHTML=h+'</div>'; m.scrollTop=0; wire(m); navMark(); }

 function wire(m){
  m.querySelectorAll('[data-subj]').forEach(function(b){ b.onclick=function(){ G.view='subj'; G.subj=b.getAttribute('data-subj'); G.filt=b.getAttribute('data-f')||'all'; render(); }; });
  m.querySelectorAll('[data-v2]').forEach(function(x){ x.onclick=function(){ G.view=x.getAttribute('data-v2'); render(); }; });
  m.querySelectorAll('[data-print]').forEach(function(x){ x.onclick=function(){ window.print(); }; });
  m.querySelectorAll('[data-home]').forEach(function(b){ b.onclick=function(){ G.view='ov'; render(); }; });
  m.querySelectorAll('[data-filt]').forEach(function(b){ b.onclick=function(){ G.filt=b.getAttribute('data-filt'); var y=m.scrollTop; render(); }; });
  m.querySelectorAll('[data-go]').forEach(function(b){ b.onclick=function(){ openLesson(b.getAttribute('data-go'),false); }; });
  m.querySelectorAll('[data-kidv]').forEach(function(b){ b.onclick=function(){ openLesson(b.getAttribute('data-kidv'),true); }; });
  m.querySelectorAll('[data-st]').forEach(function(b){ b.onclick=function(){ var id=b.getAttribute('data-id'), st=b.getAttribute('data-st'), cur=rv(id).status;
    if(st==='flag'&&cur!=='flag'){ G.open[id]=!G.open[id]; rerow(id); return; }
    save(id,cur===st?'':st,cur===st?'':rv(id).note); }; });
  m.querySelectorAll('[data-save]').forEach(function(b){ b.onclick=function(){ var id=b.getAttribute('data-save'), t=m.querySelector('[data-note="'+id+'"]'); save(id,'flag',t?t.value:''); }; });
 }
 function rerow(id){ var el=document.querySelector('#cg [data-row="'+id+'"]'); if(!el||!G.model[id]) return; var d=document.createElement('div'); d.innerHTML=skillRow(G.model[id]); var n=d.firstChild; el.parentNode.replaceChild(n,el); wire(n.parentNode); }
 function save(id,status,note){ var rec=G.model[id]; if(!rec) return; var s=sess(); if(!s||!s.token){ alert('Please sign in again from the staff screen.'); return; }
  var old=G.rev[id]; G.rev[id]=[(old||[])[0]||'',(old||[])[1]||'',status,note||'',status?G.me:'',status?new Date().toISOString():'',status?rec.hash:'']; G.open[id]=false; rerow(id); navMark();
  call('cgReview',s.token,id,status,note||'',rec.hash).then(function(r){ if(r&&r.row){ G.rev[id]=r.row; rerow(id); navMark(); } }).catch(function(e){ G.rev[id]=old; rerow(id); alert('Could not save: '+e); }); }

 function openLesson(id,kid){ var sj=subjOf(id), nb=document.querySelector('#cpN [data-s="'+sj+'"]'); if(!nb) return; G.view='browse'; nb.click();
  setTimeout(function(){ var row=document.querySelector('#cpM .cp-sk[data-id="'+id+'"]'); if(!row) return; var d=row.closest('details'); if(d) d.open=true;
   if(kid){ var k=row.querySelector('[data-kid]'); if(k) k.click(); return; }
   var b=row.querySelector('[data-mat]'); if(b&&!row.querySelector('.cp-matw').innerHTML) b.click(); row.scrollIntoView({block:'start'}); row.style.outline='3px solid #A5B4FC'; setTimeout(function(){ row.style.outline=''; },2500); },60); }

 function navMark(){ var n=document.getElementById('cpN'); if(!n) return;
  n.querySelectorAll('.cg-nv').forEach(function(x){ x.remove(); });
  var all=Object.keys(G.model).map(function(k){ return G.model[k]; }), neu=all.filter(function(r){ return isNew(r)||stale(r); }).length, fl=all.filter(function(r){ return rv(r.id).status==='flag'; }).length;
  var box=document.createElement('div'); box.innerHTML='<button class="cg-navb cg-nv" data-v="ov">🏠 Overview</button><button class="cg-navb cg-nv" data-v="new">🆕 New or changed<span>'+neu+'</span></button><button class="cg-navb cg-nv" data-v="flag">🚩 Flagged<span>'+fl+'</span></button><button class="cg-navb cg-nv" data-v="gaps">📊 Coverage and gaps</button><div class="cg-sep cg-nv"></div><div class="cg-nv" style="font-size:12px;color:#6B7280;padding:2px 10px 4px">Browse every question</div>';
  while(box.lastChild) n.insertBefore(box.lastChild,n.firstChild);
  n.querySelectorAll('.cg-navb').forEach(function(b){ b.classList.toggle('on',b.getAttribute('data-v')===G.view); b.onclick=function(){ G.view=b.getAttribute('data-v'); n.classList.remove('open'); render(); }; });
  n.querySelectorAll('[data-s]').forEach(function(b){ if(b.__cg) return; b.__cg=1; b.addEventListener('click',function(){ G.view='browse'; setTimeout(function(){ navMark(); decorate(); },30); }); });
  if(G.view!=='browse') n.querySelectorAll('[data-s]').forEach(function(b){ b.classList.remove('on'); }); }

 function decorate(){ if(!G.ready) return; document.querySelectorAll('#cpM .cp-sk[data-id]').forEach(function(row){ if(row.querySelector('.cg-dec')) return; var rec=G.model[row.getAttribute('data-id')]; if(!rec) return;
   var d=document.createElement('div'); d.className='cg-dec'; d.innerHTML=(rec.meth?'<span class="cg-meth" style="font-size:13px;color:#374151">'+he(rec.meth)+'</span>':'')+chips(rec).replace('cg-chips','cg-chips" style="margin:0'); var wrap=document.createElement('div'); wrap.className='cgz'; wrap.style.cssText='display:contents'; wrap.appendChild(d); row.insertBefore(wrap,row.querySelector('.cp-matw')); }); }

 function start(){ analyze(); G.ready=true; var s=sess(), hashes={}; Object.keys(G.model).forEach(function(id){ hashes[id]=G.model[id].hash; });
  render();
  if(s&&s.token) call('cgSync',s.token,hashes).then(function(r){ if(r&&r.map){ G.rev=r.map; G.sync=r.baseline?'baseline':'ok'; G.me=r.me||''; if(G.view!=='browse') render(); else { navMark(); decorate(); } } }).catch(function(e){ G.sync='off'; });
  var mo=new MutationObserver(function(){ if(G.view==='browse') decorate(); var n=document.getElementById('cpN'); if(n&&!n.querySelector('.cg-nv')) navMark(); });
  mo.observe(document.getElementById('cpM'),{childList:true,subtree:false}); mo.observe(document.getElementById('cpN'),{childList:true}); }

 window.TL_CG={start:start,model:function(){ return G.model; },render:render};
 function wait(n){ var m=document.getElementById('cpM'), nav=document.getElementById('cpN'); if(m&&nav&&nav.querySelector('[data-s]')&&Object.keys(BK()).length>200){ try{ start(); }catch(e){ console.error('Curriculum Guide',e); } return; } if(n>240) return; setTimeout(function(){ wait(n+1); },500); }
 var s0=sess(); if(s0&&s0.role==='staff') wait(0);
})();
</script>
