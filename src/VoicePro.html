<script>
/* VoicePro.html (Head of School 2026-11-18: "get a different voice for everything ... better audio with expression and passion").
   Everything the app says with the device voice (speechSynthesis) is played instead in a natural Google voice (Chirp 3 HD), made by the
   Firebase server (GET ?tts=1) and saved there, so each phrase is made once. Hebrew uses Google's Israeli-Hebrew voice FOR NOW; Litvish
   recordings replace it item by item. If a phrase does not arrive within 7 seconds, or anything fails, the device voice says it as before.
   Also inside sealed lesson frames (e.g. Kindergarten Math): this same code is put at the top of every srcdoc frame.
   Changes no data, money or mastery. No double slash in this file (HtmlService rule). */
(function(){
const SRC=String(arguments.callee);
if(typeof window==='undefined'||!window.speechSynthesis||window.__VP) return; window.__VP=1;
const API='https:'+String.fromCharCode(47,47)+'api-q26c275eaa-uk.a.run.app/';
const ss=window.speechSynthesis, realSpeak=ss.speak.bind(ss), realCancel=ss.cancel.bind(ss);
let cur=null, q=[], off=false;
const HE=/[֐-׿]/, LAT=/[A-Za-z]{2,}/;
/* HEBREW (Head of School 2026-11-18): a phrase that is only Hebrew is said by Google's Hebrew voice, a little slower. A Hebrew letter inside an
   English sentence ("This letter is א") is said by its name (Aleph) so the English voice does not skip it. Fix names one by one in LIT. */
const LIT={'א':['Aleph',''],'ב':['Veis','v','Beis','b'],'ג':['Gimmel','g'],'ד':['Daled','d'],'ה':['Hei','h'],'ו':['Vav','v'],'ז':['Zayin','z'],'ח':['Ches','kh'],'ט':['Tes','t'],'י':['Yud','y'],'כ':['Chaf','kh','Kaf','k'],'ך':['Final Chaf','kh'],'ל':['Lamed','l'],'מ':['Mem','m'],'ם':['Final Mem','m'],'נ':['Nun','n'],'ן':['Final Nun','n'],'ס':['Samech','s'],'ע':['Ayin',''],'פ':['Fei','f','Pei','p'],'ף':['Final Fei','f'],'צ':['Tzadi','tz'],'ץ':['Final Tzadi','tz'],'ק':['Kuf','k'],'ר':['Reish','r'],'ש':['Shin','sh'],'ת':['Sav','s','Tav','t']};
const VOW={'ָ':'aw','ַ':'ah','ֵ':'ay','ֶ':'eh','ִ':'ee','ֹ':'oy','ֺ':'oy','ֻ':'oo','ְ':'uh','ֲ':'ah','ֳ':'aw','ֱ':'eh'};
function cl(c){ const L=LIT[c[0]]; if(!L) return null; const dag=c.indexOf('ּ')>0, sin=c.indexOf('ׂ')>0; const name=sin?'Sin':(dag&&L[2]?L[2]:L[0]), snd=sin?'s':(dag&&L[3]!=null?L[3]:L[1]);
 let v=''; for(const k in VOW) if(c.indexOf(k)>0){ v=VOW[k]; break; } return {name,snd,v}; }
function heWord(w){ const cs=w.match(/[א-ת][֑-ׇ]*/g)||[]; const parts=cs.map(cl).filter(Boolean); if(!parts.length) return '';
 if(parts.length===1&&!parts[0].v) return parts[0].name;
 if(parts.length===2&&parts[1].name==='Vav'&&!parts[0].v){ const vv=cs[1].indexOf('ּ')>0?'oo':(cs[1].indexOf('ֹ')>0?'oy':''); if(vv) return parts[0].snd+vv; }
 const out=parts.map(p=>(p.snd||'')+(p.v||'')).join(''); return out||parts[0].name; }
function langOf(t){ return HE.test(t)&&!LAT.test(t)?'he':'en'; }   /* Hebrew-only phrases: Google's Hebrew voice, slower (HoS 2026-11-18 chose this over spelled-out sounds) */
function hasHe(t){ return HE.test(t); }
function clean(t,l){ t=String(t||'').replace(/\s+/g,' ').trim(); if(l==='he') return t; t=t.replace(/[א-ת][א-ת֑-ׇ]*/g,w=>' '+heWord(w)+' ').replace(/\s+([.,!?])/g,'$1').replace(/\s+/g,' ').trim(); return t; }
function fire(u,n){ try{ const f=u['on'+n]; if(typeof f==='function') f.call(u,{type:n,utterance:u}); }catch(e){} try{ u.dispatchEvent(new Event(n)); }catch(e){} }
/* ONE VOICE AT A TIME (HoS 2026-11-22: "the new voice and the old voice sometimes say together"). Three fixes:
   1. A phrase that was stopped (cancel, or a new phrase took over) never falls back to the device voice later: each phrase carries a
      generation number, and a stopped generation is dropped. Before, a stop while the new voice was still loading made the old voice say it.
   2. When the device voice has to say a phrase (the new voice failed), the next phrase waits until the device voice has finished.
   3. Frames and the page share one voice: when any of them starts a phrase, the others stop (a channel between them). */
let gen=0, devBusy=false; const VID=Math.random().toString(36).slice(2);
let bc=null; try{ bc=new BroadcastChannel('tl-voice'); bc.onmessage=e=>{ const d=e.data||{}; if(d.v===1&&d.id!==VID) stopAll(); }; }catch(e){}
function claim(){ try{ if(bc) bc.postMessage({v:1,id:VID}); }catch(e){} }
function stopAll(){ gen++; q=[]; devBusy=false; if(cur){ try{ cur.pause(); }catch(e){} cur=null; } try{ realCancel(); }catch(e){} }
function device(u,g){ let moved=false; devBusy=true; const go=()=>{ if(moved) return; moved=true; clearTimeout(t2); if(g===gen){ devBusy=false; next(); } };
 const t2=setTimeout(go,Math.min(30000,2500+String(u.text||'').length*90));
 try{ u.addEventListener('end',go,{once:true}); u.addEventListener('error',go,{once:true}); realSpeak(u); }catch(e){ go(); } }
function next(){ if(cur||devBusy||!q.length) return; const it=q.shift(), u=it.u, g=gen; let done=false, started=false;
 const a=new Audio(it.url); cur=a; a.preload='auto'; try{ a.volume=Math.max(0,Math.min(1,u.volume==null?1:u.volume)); }catch(e){}
 const finish=ok=>{ if(done) return; done=true; clearTimeout(tm); if(cur===a) cur=null; if(g!==gen) return; if(!ok){ device(u,g); return; } fire(u,'end'); next(); };
 const tm=setTimeout(()=>{ if(!started&&!waitTap){ try{ a.pause(); }catch(e){} finish(false); } },7000); let waitTap=false;
 a.onplaying=()=>{ if(g!==gen){ try{ a.pause(); }catch(e){} return; } if(!started){ started=true; clearTimeout(tm); try{ realCancel(); }catch(e){} fire(u,'start'); } };
 a.onended=()=>finish(true); a.onerror=()=>finish(false);
 const p=a.play(); if(p&&p.catch) p.catch(err=>{ if(g!==gen||done) return; if(err&&err.name==='NotAllowedError'){ waitTap=true; const go=()=>{ document.removeEventListener('pointerdown',go,true); document.removeEventListener('keydown',go,true); if(done||g!==gen) return; const p2=a.play(); if(p2&&p2.catch) p2.catch(()=>finish(false)); }; document.addEventListener('pointerdown',go,true); document.addEventListener('keydown',go,true); } else finish(false); }); }   /* Chrome blocks sound before the first tap: wait for the tap, keep the new voice (HoS 2026-11-19) */
ss.speak=function(u){ try{ if(off||!u||!u.text) return realSpeak(u); const l=langOf(u.text), t=clean(u.text,l); if(!t||t.length>600) return realSpeak(u);
  const r=Math.max(.75,Math.min(1.25,(Number(u.rate)||1)*(l==='he'?0.85:1))).toFixed(2);
  if(!cur&&!devBusy&&!q.length) claim(); q.push({u,url:API+'?tts=1&l='+l+'&r='+r+'&t='+encodeURIComponent(t)}); next(); }catch(e){ return realSpeak(u); } };
ss.cancel=function(){ stopAll(); };
try{ Object.defineProperty(ss,'speaking',{configurable:true,get:()=>!!cur||devBusy||q.length>0}); }catch(e){}
try{ Object.defineProperty(ss,'pending',{configurable:true,get:()=>q.length>0}); }catch(e){}
window.TL_VOICE={ off:v=>{ off=!!v; }, on:()=>!off, now:()=>cur&&isFinite(cur.duration)&&cur.duration>0?{t:cur.currentTime,d:cur.duration}:null };   /* now: how far the playing phrase is (the home's Read-it-to-me ring) */
/* sealed lesson frames: put this same code at the top of every srcdoc */
try{ const d=Object.getOwnPropertyDescriptor(HTMLIFrameElement.prototype,'srcdoc');
 if(d&&d.set){ Object.defineProperty(HTMLIFrameElement.prototype,'srcdoc',{configurable:true,get:d.get,set:function(v){ v=String(v); const tag='<scr'+'ipt>('+SRC+')();<'+'/script>'; if(v.indexOf('__VP')<0){ v=/<head[^>]*>/i.test(v)?v.replace(/<head[^>]*>/i,m=>m+tag):tag+v; } return d.set.call(this,v); }}); } }catch(e){}
})();
</script>
