c45f_silver: { title: "Inside the Silver Box", text: "On Monday morning, Rabbi Feldman walked into the classroom with a silver box in his hands. He held it the way you hold a full cup of hot tea. Slowly. Carefully. With both hands.\n\"Boys,\" he said, \"please clear your desks.\"\nInside, on a soft white cloth, lay an esrog.\n\"Whoa!\" whispered Dovid Lerner.\n\"Is it real?\" asked Binyamin.\n\"Look with your eyes,\" said the rebbe, \"not with your fingers!\"" },
    c45f_kite: { title: "The Runaway Kite", text: "On Sunday, Shmuli and his cousin Ari flew a red kite in the park. The wind pulled hard.\n\"Hold on tight!\" shouted Ari.\nShmuli held on, but the string slipped out of his hand.\n\"Where is it going?\" he asked.\nThe kite flew over the trees and landed on a roof. Shmuli sighed. \"Now we need a very tall ladder.\"" },
    c45f_emptybox: { title: "The Empty Box (a play)", text: "DOVID: It's empty! The esrog is gone!\nTZVI HIRSCH: Somebody took it. Somebody stole the rebbe's esrog!\nYEHUDA: Wait. Don't touch anything.\nTZVI HIRSCH: Why not?\nYEHUDA: Because there might be clues.\nBINYAMIN: Let's stay calm. In chess, you list every piece that can move. Then you check them, one by one." },
    c45f_lostdog: { title: "Where Is Biscuit? (a play)", text: "SHLOMO: Has anybody seen Biscuit?\nEZRA: Your dog? Not since breakfast.\nSHLOMO: The gate was open! He could be anywhere!\nRABBI GREEN: Stay calm, boys. Let's look in the garden first.\nEZRA: There! Under the bench! He's eating my sandwich!" },
    c45f_montreal: { title: "A Letter to Montreal", text: "Before recess, the rebbe asked me to bring his magnifying glass to the office. The office was locked, so I waited on the bench outside it. When the bell rang, I walked back up the stairs, holding the glass behind my back so nobody would think I took it.\nWhen I came into the room, everybody was staring at me. The silver box was empty. The esrog was gone!\nOne boy, Tzvi Hirsch, said it out loud: he thinks I took it. My face got so hot. I did not know what to say, so I said nothing at all. Was that the right thing to do?" },
    c45f_camp: { title: "A Letter from Camp", text: "Dear Abba and Ima,\nCamp is great, but on the first night, when the lights went out and the crickets started, I missed home so much that I could not fall asleep. Then my counselor, Reb Nachum, sat on the edge of my bed and told a story about his first night at camp. Can you believe he was scared too?\nPlease send more socks.\nLove, Gavriel" },
    c45f_camel: { title: "Ship of the Desert", text: "Look at her feet. They are wide and flat, like big soft pillows. When a camel walks on hot sand, her feet spread out, so she does not sink. That is why people call the camel the ship of the desert.\nAnd her hump? Many people think the hump is full of water. It is not! The hump is full of fat." },
    c45f_cactus: { title: "The Cactus Keeps a Secret", text: "Good morning, everyone, and welcome to the desert garden! This tall green plant is a cactus. Do you see its sharp spines? They are really leaves, very thin and very hard. When rain falls in the desert, the cactus drinks fast and stores the water inside its thick stem, so it can stay green for months without one drop. Please, do not touch!" },
    c45f_desertnight: { title: "Desert Night", text: "All day the desert burns and glows,\nthe sand too hot for feet or toes.\nThe lizard hides beneath a stone.\nThe hawk is circling, high, alone.\nThen slowly, slowly, sinks the sun.\nThe long and burning day is done." },
    c45f_snowpoem: { title: "First Snow on Glen Avenue", text: "The snow came softly in the night,\nand made the whole street clean and white.\nIt hushed the cars, it hid the gate,\nit capped the mailbox, round and straight.\nAt dawn, we ran out in a row.\nHurray, hurray! It's really snow!" },
    c45f_flood: { title: "Flash Flood Warning", text: "Here, the sky is blue. The sun is shining. There is not one drop of rain. But listen carefully, because there is danger on the way.\nIn just a few minutes, a quiet wadi can turn into a roaring river! A flash flood can be taller than a grown man.\nNumber one: stay out of every wadi, even if the sky above you is blue.\nNumber two: if you hear a roar, climb to high ground right away.\nNumber three: never, ever try to cross moving water." },
    c45f_snowday: { title: "The Snow Report", text: "Good morning, Baltimore! Here is the snow report. Last night, eight inches of snow fell on the city. All the yeshivos in the area are closed today.\nNumber one: stay off the roads. Number two: if you shovel, take breaks and drink water.\nAnd the good news? The sleds are ready!" },
    c45f_chess: { title: "Binyamin's Hardest Game", text: "Binyamin took one of Zeidy's bishops, and he could not stop smiling.\nBut then Zeidy moved his queen, very quietly, all the way across the board.\n\"Check,\" said Zeidy.\nBinyamin stared. He moved his king. Zeidy moved his rook.\n\"Check,\" said Zeidy again, softly.\nBinyamin's face grew hot. His hands felt cold.\n\"Checkmate,\" said Zeidy." },
    c45f_spelling: { title: "The Spelling Bee", text: "Moshe Chaim stood at the front of the room. His word was \"neighbor.\" His hands were shaking.\n\"N... E... I...\" he began. He stopped. The room was silent.\nThen he took a breath and finished: \"G... H... B... O... R.\"\n\"Correct!\" said Rabbi Weiss.\nMoshe Chaim grinned all the way back to his seat." },
    c45f_rugelach: { title: "Who Ate the Rugelach? (a play)", text: "ABBA: Now the tray is empty!\nTZVI HIRSCH: Empty? All twenty-four?\nABBA: All twenty-four. Not even a crumb.\nTZVI HIRSCH: Abba! You don't think we ate them?\nYEHUDA: There are no crumbs at all. When a person eats rugelach, there are always crumbs. Always!" },
    c45f_carkey: { title: "The Missing Car Key (a play)", text: "AVI: Abba, the car key is gone!\nABBA: Gone? I put it on the hook.\nAVI: The hook is empty!\nZEIDY: Did anyone check the coat pocket?\nABBA: The coat pocket? Oh! Here it is." },
    c45f_windpoem: { title: "The Sukkah in the Wind", text: "The wind came running down our street.\nIt tugged the schach. It shook the sheet.\nIt rattled every paper chain\nand whistled, \"I will come again!\"\nThe lanterns swung. The pictures flew.\nMy hat went sailing, and my shoe!\nThe wind went \"WHOOSH!\" The wind went \"ROAR!\"\nIt banged against the sukkah door." },
    c45f_rainpoem: { title: "Rain on the Roof", text: "The rain came tapping on the roof,\ntap-tap, a quiet sound.\nThen BOOM! the thunder shook the house\nand rattled all around.\nBut Zeidy smiled and lit a lamp,\nand told us, \"Do not fear.\"\nWe sat together, warm and dry,\nwith Zeidy sitting near." },

      teach:[

        {p:"c45f_spelling", q:"\"He stopped. The room was silent.\" How do you read these two short sentences?", o:["Slowly, with a little stop after each", "Fast, as one sentence", "Loud and cheerful"], how:"Think about how the short sentences in Binyamin's game sounded."}
