    c45f_bakery: { title: 'Friday at the Bakery (told by Tzvi Hirsch Gold)', text: 'Friday morning in my family\'s bakery is the best morning of the week, and nobody can change my mind. By seven o\'clock, the line of customers already reaches the door. The big ovens roar like happy lions. Trays of golden challah slide out one after another, and the whole store smells as if Shabbos came early. My job is the bags. I snap a bag open, slide in two challos and twist the top, faster than anyone in Baltimore. Old Mr. Hoffman complains every single week that the line is too slow. I don\'t mind him. I hand him a warm rugelach, and he smiles, just a tiny bit. At ten o\'clock the ovens finally go quiet. There is flour on my yarmulka, on my shoes, even in my ears, and my feet ache. But when I look at the empty shelves, I feel as if I built something.' },
    c45f_chess: { title: 'My First Tournament (told by Binyamin Yusupov)', text: 'The tournament hall was as silent as a cave. Forty tables stood in long rows, and on each one a chessboard waited. At nine o\'clock, a man with a whistle read out the names. Mine was called last. My opponent was already sitting down: a tall boy from Philadelphia who looked as if he had never lost a game in his life. I shook his hand. Mine was cold. When the clock started, it ticked like a hammer on my head. I moved my first pawn, and my hand shook so much that I almost knocked over my own king. Then I remembered what Zeidy Yusupov always says: "The board does not know who is scared. Just look at the squares." I took a slow breath, and I looked at the squares.' },
    c45f_oven: { title: 'The Bang on Friday Morning (one scene, two tellers)', text: 'TOLD BY TZVI HIRSCH: At six-thirty on Friday morning, the big oven made a terrible BANG and went cold. Disaster! Two hundred challos were waiting, and we had no oven. I was sure that Shabbos in half of Baltimore was ruined. And what did Abba do? He just stood there and looked at his watch. Why wasn\'t he running? Then he picked up the phone and talked very quietly, and I could not hear a word.\nTOLD BY MR. GOLD, HIS ABBA: At six-thirty on Friday morning, the belt inside the big oven snapped with a bang. I have heard that bang three times in twenty years. I knew the new belt was in the back closet, and I knew Reuven the repairman gets up early. I looked at my watch. If Reuven came by seven, we would lose only half an hour. I called him. Across the room, Tzvi Hirsch was as white as flour. I wanted to tell him not to worry, but the line of customers was watching, so I gave him a wink instead.' },
    c45f_snow: { title: 'The Snow Day (one scene, two tellers)', text: 'TOLD BY DOVID: I woke up, and the whole world was white! The radio said our school was closed. A SNOW DAY! I ran to the window. The snow was up to the car tires, the most snow I had ever seen in my whole life. I put on two pairs of socks and ran to get Nosson for a snowball fight.\nTOLD BY NOSSON: When I woke up, there were about six inches of snow outside. The radio said that our school was closed. In Montreal, where I grew up, school would never close for six inches of snow. We would just put on our boots and walk. But Dovid was at my door in two minutes, jumping up and down, so I got my boots. It was nice to see Baltimore so excited about a little snow.' },
    c45f_accounts: { title: 'Three Accounts of the Great Baltimore Fire, 1904', text: 'THE FIREFIGHTER (Captain Briggs, telling it fifty years later): "I pushed the end of the hose against the hydrant and began to turn it. It would not turn. Our captain stood up and said, \'It doesn\'t fit.\' We wrapped the joint with canvas and held it together with our hands."\nTHE NEWSPAPER (The Messenger, Monday morning, while the fire still burned): "Our reporter saw firemen from out of town standing beside their engines with their hoses in their hands, unable to use them. He was told the hoses did not fit our hydrants. We cannot yet say how many engines had this trouble."\nTHE SHOPKEEPER (Moshe Kaplan, in a letter two days later): "Shloimy and I took the pushcart and hurried to the shop. We filled it with bolts of cloth. When we turned around at the corner, the roof of the building across from my shop was on fire. That was the last time I saw my shop."' },
    c45f_blackout: { title: 'Three Accounts of the Night the Lights Went Out', text: 'ELI\'S DIARY, Thursday night: The lights went out in the middle of supper! At first my little brothers yelled, but then Abba lit the candles we keep in the drawer, and it felt like a party. Ima kept the soup hot on the gas stove. We played word games by candlelight until we fell asleep.\nTHE POWER COMPANY\'S NOTICE, Friday morning: During Thursday\'s storm, a large tree branch fell onto a power line on Glen Avenue at 6:15 p.m. About 3,200 homes lost power. Our crews removed the branch and repaired the line. Power came back at 11:40 p.m.\nTHE SHUL\'S NEWSLETTER, the next week: Thank you to everyone who came to Maariv by flashlight on Thursday night! Thank you also to the families with generators who kept their neighbors\' food cold until the power came back.' },
    c45f_scroll: { title: 'Two Accounts of the Sefer Torah (from The Map in Zeidy\'s Attic)', text: 'ACCOUNT 1, The Messenger newspaper, February 10, 1904, two days after the fire: "Among the many losses was a small Hebrew congregation which met in a room on the top floor of the Hollander building, German Street. Nothing remains of the room. Its members fear that their sacred scroll was lost in the flames."\nACCOUNT 2, the minute book of another shul, March 13, 1904, five weeks after the fire: "It was decided that the members of the Cap-Makers\' Minyan, whose room was burned in the great fire, may daven with us until they find a home of their own. Their holy sefer Torah, which the young man Mordechai Rosen carried out of the fire with his own hands, wrapped in his tallis, will rest in our aron kodesh."' },
    c45f_dog: { title: 'Two Accounts of the Dog on Glen Avenue', text: 'ACCOUNT 1, an email from a neighbor, 8:05 in the morning: "Be careful on Glen Avenue! A huge dog is running loose near the corner. It barked at me and chased a squirrel up a tree. Keep your children inside until someone catches it!"\nACCOUNT 2, a note from the dog\'s owner, Mr. Tanaka, 6:00 in the evening: "Thank you, neighbors! Our dog, Max, slipped out of the yard this morning when the wind blew the gate open. He is big, but he is gentle and loves children. Yehuda Benaim and his Abba found him in the park at noon and walked him home. He is safe now."' },
    c45f_hoseplay: { title: 'The Hose That Would Not Fit (a play for Readers\' Theatre)', text: 'NARRATOR: Baltimore, Sunday night, February 7, 1904. The fire has burned since morning.\nCAPTAIN (shouting over the roar): Joe! Hook up the hose. Fast!\nJOE (pushing hard, then stopping): Captain... it won\'t turn.\nCAPTAIN: Let me try. (He pulls, then slowly stands up.) It doesn\'t fit. Our hose doesn\'t fit their hydrant.\nJOE (quietly): Then what do we do?\nCAPTAIN (firmly): We don\'t give up. Get the canvas. Wrap the joint, and hold it with both hands.\nNARRATOR: Water sprays everywhere. But some of it reaches the engine.\nJOE (laughing, soaking wet): Captain! The water\'s coming through!\nNARRATOR: Hours later, a baker pulls up in a wagon.\nMR. FRIEDMAN (kindly): Hot coffee and fresh bread, boys. No, no, put away your money.\nJOE (holding the warm bread in his cold hands): Thank you, sir.\nCAPTAIN: Rest five minutes, Joe. Then back to the hose.' },
    c45f_trainplay: { title: 'The Last Train Home (a play for Readers\' Theatre)', text: 'NARRATOR: A Friday afternoon in winter. The crew is downtown, and Shabbos starts at 4:45.\nDOVID (looking at his watch): It\'s four o\'clock. The last train home leaves in six minutes!\nTZVI HIRSCH: Six minutes? Then why are we standing here? Run!\nNARRATOR: The boys race down the long platform.\nNOSSON (out of breath): I see it... the doors are closing...\nBINYAMIN (calling out): Please, wait for us!\nNARRATOR: The conductor holds the door open.\nTZVI HIRSCH (laughing and puffing): We made it! We made it!\nDOVID (sitting down slowly): Next time, we leave early.' }

  var TEACH = {
    'READ.LIT.L06.12':{
      hook:'Two boys can walk into the same room. One says "What a mess!" and one says "What fun!" The room did not change. The teller did.',
      big:'A narrator who tells his own story colors it with his feelings. His word choices show how he sees things. A good reader enjoys the colors, and still sorts the plain facts from the narrator\'s view.',
      intro:['Find out who is telling: look for "I" and "my."', 'Find the colored words: comparisons, big feelings, words like "best" and "worst."', 'Ask what those words show about how the narrator feels.', 'Ask what the plain facts are, the things anyone there could see.'],
      ex:[{q:'"The big ovens roar like happy lions."', steps:['Who says it? Tzvi Hirsch, who loves the bakery.', 'The plain fact: the ovens are loud.', '"Happy lions" is his coloring: he finds the noise exciting.'], a:'The narrator\'s view: he loves the noise'},
          {q:'"I snap a bag open... faster than anyone in Baltimore."', steps:['The plain fact: he bags challos quickly.', '"Faster than anyone in Baltimore" is a boast.', 'It shows he is proud, not that it is true.'], a:'The narrator\'s view: he is proud'}],
      oops:{q:'"Friday is the best morning of the week." What can we learn?', wrong:'Friday is the best morning of the week.', right:'Tzvi Hirsch loves Fridays at the bakery.', why:'That is the narrator\'s view. It tells us about him, not about everyone.'},
      idea:['A narrator is like a pair of colored glasses. Everything you see comes through his color.'],
      try:{q:'"My little brother\'s room is a jungle of toys." What does this coloring show?', o:['The narrator thinks the room is very messy', 'Real animals live in the room', 'Nothing at all'], a:'The narrator thinks the room is very messy', steps:['Find the comparison.', 'Ask what feeling or view it gives.']}
    },
    'READ.LIT.L06.13':{
      hook:'Ask two people at the same wedding what happened. You will hear two different stories, and both can be true.',
      big:'When a different narrator tells the same scene, the facts stay the same, but what he notices, what he knows and how he feels can change. Comparing two tellers shows you more than either one alone.',

    'READ.COMP.L06.14':{
      hook:'One fire. Thousands of people saw it. Every one of them could tell you a different story about that night.',
      big:'An account is one person\'s telling of an event. Different accounts of the same event agree on the big facts but tell different details, because each writer was in a different place, saw a different part and cared about different things. A firsthand account comes from someone who was there; a secondhand account comes from someone who heard or read about it.',
      intro:['Name the event that all the accounts tell about.', 'For each account, ask: who wrote it, and where was he?', 'Find what the accounts agree on.', 'Find what is different, and explain it by the writer\'s place and point of view.'],
      ex:[{q:'The firefighter and the newspaper both tell about the hoses.', steps:['Both say the hoses did not fit.', 'The firefighter turned the hose himself: firsthand.', 'The reporter "was told": secondhand.'], a:'They agree, but one saw it and one heard it'},
          {q:'The shopkeeper never mentions hoses.', steps:['He was at his shop, not at a hydrant.', 'He cared most about his cloth and his family.', 'So he tells about the pushcart and the shop.'], a:'He tells the part he saw and cared about'}],
      oops:{q:'The three accounts tell different details. What does that show?', wrong:'Two of the writers must be lying.', right:'Each writer saw and cared about a different part.', why:'Different is not the same as false. Check where each writer was.'},
      idea:['Accounts are like puzzle pieces. Each one shows part of the picture. Put them together to see more.'],
      try:{q:'The coach\'s report gives the final score. A player\'s diary tells how nervous he was. Why do they differ?', o:['Each writer cared about a different part', 'One of them is wrong', 'They are about different games'], a:'Each writer cared about a different part', steps:['Where was each writer?', 'What did each one care about?']}
    },
    'READ.COMP.L06.15':{

      intro:['Find where the accounts disagree.', 'Ask four questions of each one: who, where, when and why.', 'Decide which writer was in a better place to know.', 'Explain the difference in your own words, with "because."'],
      ex:[{q:'The Messenger, February 10, 1904', steps:['Who: a reporter who did not know the minyan.', 'When: two days after; the city was still smoking.', 'Its own word "fear" shows it was not sure.'], a:'It knew the least, because it was written first'},
          {q:'The minute book, March 13, 1904', steps:['Who: another shul that took the minyan in.', 'When: five weeks later.', 'It names the young man who carried the sefer Torah.'], a:'It knew more, because of who wrote it and when'}],
      oops:{q:'The newspaper and the minute book disagree. Why?', wrong:'Old newspapers always lie.', right:'The newspaper was written before the shul learned the truth the truth.', why:'Do not judge by age or length. Ask who, where, when and why.'},

      try:{q:'At recess, a boy says the class trip is canceled. That night, the principal\'s letter says it moved to Tuesday. Why do they differ?', o:['The boy heard a rumor early; the principal knew later', 'The letter is longer', 'Trips change by themselves'], a:'The boy heard a rumor early; the principal knew later', steps:['Who knew more?', 'Which one came later?']}
