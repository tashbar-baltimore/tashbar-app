B["MATH.MEAS.L01.01"]={"band": "K1", "pic": "📏", "today": "Line up the ends to compare", "why": "Who is taller, you or your chair? Lining up tells the truth.", "watch": {"q": "A pencil and a crayon. Which is longer?", "steps": ["Guess: the pencil looks long.", "Check: put both at the same start line.", "The pencil sticks out farther. It is longer!", "Heavier pulls your hand down more: a brick is heavier than a feather.", {"t": "Be a scale! Heavy hand down low, light hand up high.", "m": {"type": "move", "t": "Heavy hand down, light hand up!"}}], "a": "the pencil"}, "ways": ["hands-on", "picture", "Mistake Detective"], "done": "You can compare longer, shorter, heavier and lighter.", "oops": {"q": "Comparing two sticks that do not start at the same line", "wrong": "Just look at which end is farther", "right": "Line them up first", "why": "If the starts are different, the ends can fool you."}};
B["MATH.STAT.L01.01"]={"band": "K1", "pic": "🧺", "today": "Sort into groups, then count", "why": "Clean-up time! Every toy goes in its own bin, and then you know how many.", "ready": [{"q": "How many?", "o": ["3", "2", "4"], "a": "3", "m": {"type": "emoji", "e": "🍌", "n": 3}}], "bridge": "MATH.NUM.L01.02", "watch": {"q": "Apple, banana, apple, apple, banana. How many apples?", "steps": [{"t": "Apples in one bin. Bananas in another.", "m": {"type": "emoji", "e": "🍎", "n": 3}}, "Count the apples: 1, 2, 3.", "3 apples.", "More apples or more bananas? 3 is more than 2.", "Use one rule at a time.", {"t": "Clean-up song! Same with same, then count!", "m": {"type": "chant", "lines": ["Same with same, in the bin,", "count them up, and we win!"]}}], "a": "3 apples"}, "ways": ["sort it", "picture", "Mistake Detective"], "done": "You can sort into groups and count each group.", "oops": {"q": "Sorting by color and by shape at once", "wrong": "Mixing rules", "right": "Use one rule at a time", "why": "One rule keeps every bin clear."}};
B["MATH.NUM.L02.01"]={"band": "K1", "pic": "🛤️", "today": "Count past 100 to 120", "why": "After 100 the same pattern starts again. You already know it!", "ready": [{"q": "What comes after 99?", "o": ["100", "90", "109"], "a": "100"}], "bridge": "MATH.NUM.L01.05", "watch": {"q": "After 109 comes…", "steps": ["After 9 comes 10.", "Same pattern: keep the hundred in front.", "After 109 comes 110.", "Count by tens: 90, 100, 110, 120.", "One hundred thirteen is written 113: a 1, then 13.", "One hundred seven is 107: 1, then 0 for no tens, then 7.", {"t": "Chant the big tens!", "m": {"type": "chant", "lines": ["Ninety, one hundred,", "one hundred ten,", "one hundred twenty, and count again!"]}}], "a": "110"}, "ways": ["pattern", "chant", "Mistake Detective"], "done": "You can count and write numbers to 120.", "oops": {"q": "Write one hundred four", "wrong": "1004", "right": "104", "why": "Not 100 then 4. The 4 goes in the ones place."}};
B["MATH.OPS.L02.01"]={"band": "K1", "pic": "🧰", "today": "Pick the best trick to add", "why": "You have a toolbox: doubles, make ten, count on. Pick the fastest tool!", "ready": [{"q": "5 + 5 = ?", "o": ["10", "9", "11"], "a": "10"}], "bridge": "MATH.OPS.L02.05", "bridgeName": "Make ten to add", "watch": {"q": "9 + 7 = ?", "m": {"type": "tenframe", "n": 9, "n2": 7}, "steps": ["9 is near 10. Make ten!", {"t": "9 + 1 = 10. 6 are left.", "m": {"type": "tenframe", "n": 10, "n2": 6}}, "10 + 6 = 16.", "7 + 8? Near double: 7 + 7 + 1 = 15.", {"t": "Chant your toolbox!", "m": {"type": "chant", "lines": ["Is it a double? Is it near ten?", "Pick the fast trick, and add again!"]}}], "a": "16"}, "ways": ["ten-frame", "strategy", "Mistake Detective"], "done": "You can add within 20 with the best trick.", "oops": {"q": "11 + 2", "wrong": "Making ten with 11", "right": "Count on: 12, 13", "why": "Adding just 2? Counting on is the fastest tool."}};
B["MATH.OPS.L02.02"]={"band": "K1", "pic": "🔍", "today": "Subtract by thinking addition", "why": "Subtraction is a mystery: find the missing part!", "ready": [{"q": "7 + ? = 10", "o": ["3", "2", "4"], "a": "3", "m": {"type": "tenframe", "n": 7, "n2": 0}}], "bridge": "MATH.OPS.L01.04", "watch": {"q": "15 − 7 = ?", "steps": ["Clue: 7 + ? = 15.", "7 + 3 = 10, and 5 more is 15. That is 8.", "Case solved: 15 − 7 = 8.", "Check: 8 + 7 = 15.", {"t": "Be a detective! Hand on chin: what plus 7 makes 15?", "m": {"type": "move", "t": "Hand on chin. Think addition!"}}], "a": "8"}, "ways": ["worked example", "strategy", "Mistake Detective"], "done": "You can subtract within 20.", "oops": {"q": "14 − 6", "wrong": "12 (6 − 4 = 2, made into 12)", "right": "8", "why": "You cannot flip the numbers. Take 6 from 14."}};
B["MATH.OPS.L02.03"]={"band": "K1", "pic": "🐸", "today": "Hop on to add, hop back to subtract", "why": "Meet Hoppy the frog. He solves problems on a number line!", "ready": [{"q": "Which is farther along the line?", "o": ["12", "8", "5"], "a": "12", "m": {"type": "line", "from": 0, "to": 15}}], "bridge": "MATH.NUM.L01.06", "watch": {"q": "12 + 3 = ?", "m": {"type": "line", "from": 8, "to": 18}, "steps": ["Hoppy sits on 12.", {"t": "Hop, hop, hop: 13, 14, 15.", "m": {"type": "line", "from": 8, "to": 18, "hops": [12, 13, 14, 15]}}, "He lands on 15!", "To take away, hop back. The start is not a hop.", {"t": "Stand up! Hop forward to add. Hop back to subtract.", "m": {"type": "move", "t": "Hop on 2! Hop back 2!"}}], "a": "15"}, "ways": ["number line", "story", "Mistake Detective"], "done": "You can hop on and hop back on a number line.", "oops": {"q": "10 − 3 = ?", "wrong": "Saying 10, 9, 8 and stopping at 8", "right": "Hop from 10: 9, 8, 7", "why": "The start is where you sit. It is not a hop."}};
B["MATH.OPS.L02.04"]={"band": "K1", "pic": "🧤", "today": "Use doubles and near doubles", "why": "Doubles are everywhere: 2 hands, 2 shoes, an egg carton!", "ready": [{"q": "3 + 3 = ?", "o": ["6", "5", "7"], "a": "6"}], "bridge": "MATH.OPS.L01.01", "watch": {"q": "6 + 7 = ?", "m": {"type": "emoji", "e": "🥚", "n": 12, "group": 6}, "steps": ["6 + 6 is a double: 12, like an egg carton.", "7 is one more than 6.", "So 6 + 7 = 12 + 1 = 13.", {"t": "Chant the doubles!", "m": {"type": "chant", "lines": ["6 and 6 make 12,", "7 and 7 make 14,", "8 and 8 make 16!"]}}], "a": "13"}, "ways": ["picture", "chant", "Mistake Detective"], "done": "You know doubles and near doubles.", "oops": {"q": "6 + 7", "wrong": "6 + 6 = 12, so 12", "right": "12 + 1 = 13", "why": "A near double needs the 1 more!"}};
B["MATH.OPS.L02.06"]={"band": "K1", "pic": "👨‍👩‍👦", "today": "Find the missing piece in a fact family", "why": "Fact families stick together. Know one fact and you know four!", "ready": [{"q": "5 + 3 = ?", "o": ["8", "7", "2"], "a": "8"}], "bridge": "MATH.OPS.L01.03", "watch": {"q": "8 + ? = 13", "m": {"type": "line", "from": 6, "to": 15}, "steps": [{"t": "Count up from 8 to 13.", "m": {"type": "line", "from": 6, "to": 15, "hops": [8, 10, 13]}}, "That is 5.", "The family: 5 + 8 = 13 and 8 + 5 = 13.", "And back: 13 − 8 = 5 and 13 − 5 = 8.", {"t": "Chant the family!", "m": {"type": "chant", "lines": ["Same three numbers,", "add or take away,", "the family stays together every day!"]}}], "a": "5"}, "ways": ["number line", "fact family", "Mistake Detective"], "done": "You can find the missing number in a fact family.", "oops": {"q": "4 + __ = 11", "wrong": "15", "right": "7", "why": "The missing part is smaller than the whole."}};
B["MATH.OPS.L02.07"]={"band": "K1", "pic": "🎯", "today": "Add three numbers: find an easy pair", "why": "Three numbers? Find the easy pair first and the rest is easy.", "ready": [{"q": "7 + 3 = ?", "o": ["10", "9", "11"], "a": "10"}], "bridge": "MATH.OPS.L01.04", "watch": {"q": "7 + 5 + 3 = ?", "steps": ["Hunt! 7 and 3 are ten friends.", {"t": "7 + 3 = 10.", "m": {"type": "tenframe", "n": 7, "n2": 3}}, "10 + 5 = 15.", "You can add in any order.", {"t": "Hunt for ten friends! Hands like binoculars. Find the 10!", "m": {"type": "move", "t": "Binocular hands: hunt for 10!"}}], "a": "15"}, "ways": ["ten-frame", "strategy", "Mistake Detective"], "done": "You can add three numbers.", "oops": {"q": "2 + 8 + 5", "wrong": "Adding 2 + 5 first and losing the 8", "right": "2 + 8 = 10, then + 5 = 15", "why": "Cross out each number as you use it."}};
B["MATH.OPS.L02.08"]={"band": "K1", "pic": "⚖️", "today": "The equal sign means balanced", "why": "The = sign is a seesaw. Both sides must be worth the same.", "ready": [{"q": "4 + 4 = ?", "o": ["8", "7", "9"], "a": "8"}], "bridge": "MATH.OPS.L02.01", "watch": {"q": "5 + 3 = 4 + 4. True or false?", "steps": ["Left side: 5 + 3 = 8.", "Right side: 4 + 4 = 8.", "8 and 8. Balanced: true!", "4 + 1 = 6 is false: 5 and 6 do not balance.", {"t": "Be a balance! Arms out. Same on both sides: level!", "m": {"type": "move", "t": "Arms out wide. Level means equal!"}}], "a": "true"}, "ways": ["balance picture", "worked example", "Mistake Detective"], "done": "You know the equal sign means both sides are the same.", "oops": {"q": "6 = 6", "wrong": "False, there is nothing to add", "right": "True", "why": "Same amount on both sides is balanced."}};
B["MATH.OPS.L02.09"]={"band": "K1", "pic": "🎬", "today": "Picture the story: join or take away", "why": "Every story problem is a little movie. Picture it and you know what to do.", "ready": [{"q": "8 + 5 = ?", "o": ["13", "12", "3"], "a": "13"}], "bridge": "MATH.OPS.L02.01", "watch": {"q": "Ari has 8 stickers. He gets 5 more. How many now?", "m": {"type": "scene", "e": "🎬", "t": "Ari collects stickers from his rebbe."}, "steps": ["He gets more. Bigger! Add.", "8 + 5: make ten. 8 + 2 = 10, 3 left.", "10 + 3 = 13.", "Gave away, ate, left: take away. The answer gets smaller.", "How many more? Line them up. Count the extras.", "Some, then 7 more, makes 16? Think 7 + ? = 16.", "Count up from 7 to 16: 9. So 9 were there first.", {"t": "Chant the story clues!", "m": {"type": "chant", "lines": ["Gets more? Add!", "Gives away? Take away!", "How many more? Compare!"]}}], "a": "13 stickers"}, "ways": ["family scene", "worked example", "Mistake Detective"], "done": "You can solve story problems within 20.", "oops": {"q": "Chaim had 15. He gave 6 away.", "wrong": "15 + 6 = 21", "right": "15 − 6 = 9", "why": "Gave away means fewer. The answer must be smaller."}};
B["MATH.PV.L02.01"]={"band": "K1", "pic": "🧱", "today": "Tens on the left, ones on the right", "why": "47 and 74 use the same digits but are very different numbers!", "ready": [{"q": "How many make a ten?", "o": ["10", "5", "100"], "a": "10"}], "bridge": "MATH.PV.L01.01", "watch": {"q": "How many tens in 63?", "m": {"type": "blocks", "tens": 6, "ones": 3}, "steps": ["The left digit tells the tens.", {"t": "6 bundles of ten.", "m": {"type": "blocks", "tens": 6, "ones": 0}}, "The right digit tells the ones: 3.", "63 is 6 tens and 3 ones.", {"t": "Left hand up: tens! Right hand up: ones!", "m": {"type": "move", "t": "Left hand tens, right hand ones!"}}], "a": "6 tens"}, "ways": ["base-ten blocks", "worked example", "Mistake Detective"], "done": "You know tens and ones.", "oops": {"q": "3 tens and 8 ones", "wrong": "83", "right": "38", "why": "Tens always go on the left."}};
B["MATH.PV.L02.02"]={"band": "K1", "pic": "🐊", "today": "Compare tens first, then ones", "why": "Number battle! The tens fight first. The ones fight only in a tie.", "ready": [{"q": "How many tens in 52?", "o": ["5", "2", "52"], "a": "5", "m": {"type": "blocks", "tens": 5, "ones": 2}}], "bridge": "MATH.PV.L02.01", "watch": {"q": "52 ☐ 47", "steps": ["Tens battle: 5 tens and 4 tens.", "5 tens wins!", "52 > 47. The alligator eats the bigger number.", "Tens tie? Then compare the ones.", {"t": "Make an alligator mouth with your arms. Chomp the bigger number!", "m": {"type": "move", "t": "Arms open wide. Chomp the bigger one!"}}], "a": "52 > 47"}, "ways": ["story", "worked example", "Mistake Detective"], "done": "You can compare numbers with >, < and =.", "oops": {"q": "29 __ 31", "wrong": "29 > 31 because 9 is big", "right": "29 < 31", "why": "Tens first! 3 tens beats 2 tens."}};
B["MATH.PV.L02.03"]={"band": "K1", "pic": "🛗", "today": "10 more or 10 less changes the tens", "why": "Ride the hundred-chart elevator: one row down is 10 more!", "ready": [{"q": "How many tens in 34?", "o": ["3", "4", "34"], "a": "3", "m": {"type": "blocks", "tens": 3, "ones": 4}}], "bridge": "MATH.PV.L02.01", "watch": {"q": "10 more than 34", "m": {"type": "blocks", "tens": 3, "ones": 4}, "steps": ["Ride down one row.", {"t": "Tens: 3 becomes 4. Ones stay 4.", "m": {"type": "blocks", "tens": 4, "ones": 4}}, "10 more than 34 is 44.", "10 less: the tens go down one.", {"t": "Elevator! Crouch down for 10 more. Stand up for 10 less.", "m": {"type": "move", "t": "Down 10 more! Up 10 less!"}}], "a": "44"}, "ways": ["base-ten blocks", "story", "Mistake Detective"], "done": "You can find 10 more and 10 less.", "oops": {"q": "10 more than 27", "wrong": "28", "right": "37", "why": "10 more changes the tens, not the ones."}};
B["MATH.OPS.L02.10"]={"band": "K1", "pic": "🧦", "today": "Add tens to tens, ones to ones", "why": "Tens with tens, ones with ones, like socks with socks!", "ready": [{"q": "How many tens in 46?", "o": ["4", "6", "46"], "a": "4", "m": {"type": "blocks", "tens": 4, "ones": 6}}], "bridge": "MATH.PV.L02.01", "watch": {"q": "46 + 30 = ?", "m": {"type": "blocks", "tens": 4, "ones": 6}, "steps": ["30 is 3 tens.", {"t": "4 tens + 3 tens = 7 tens.", "m": {"type": "blocks", "tens": 7, "ones": 6}}, "The ones stay 6.", "46 + 30 = 76.", {"t": "Chant it like socks!", "m": {"type": "chant", "lines": ["Tens with tens,", "ones with ones,", "match them up and the adding is done!"]}}], "a": "76"}, "ways": ["base-ten blocks", "worked example", "Mistake Detective"], "done": "You can add tens and ones.", "oops": {"q": "23 + 40", "wrong": "27", "right": "63", "why": "40 is 4 tens, not 4 ones."}};
B["MATH.OPS.L02.11"]={"band": "K1", "pic": "🪙", "today": "Take away tens", "why": "A pocket full of dimes: spend some and count what is left.", "ready": [{"q": "8 − 5 = ?", "o": ["3", "4", "2"], "a": "3"}], "bridge": "MATH.OPS.L01.01", "watch": {"q": "80 − 50 = ?", "m": {"type": "blocks", "tens": 8, "ones": 0}, "steps": ["8 dimes. Spend 5.", {"t": "3 dimes are left.", "m": {"type": "blocks", "tens": 3, "ones": 0}}, "80 − 50 = 30.", "It works like 8 − 5, with tens.", {"t": "Hold up 8 fingers: 8 tens. Fold 5. 3 tens left!", "m": {"type": "move", "t": "8 fingers up. Fold 5: 30!"}}], "a": "30"}, "ways": ["base-ten blocks", "real-life money", "Mistake Detective"], "done": "You can take away tens.", "oops": {"q": "60 − 20", "wrong": "4", "right": "40", "why": "4 tens is 40, not 4."}};
B["MATH.MEAS.L02.01"]={"band": "K1", "pic": "📎", "today": "Measure with units, no gaps", "why": "How many paper clips long is your pencil? Units tell you exactly.", "ready": [{"q": "How many?", "o": ["6", "5", "7"], "a": "6", "m": {"type": "emoji", "e": "📎", "n": 6}}], "bridge": "MATH.MEAS.L01.01", "watch": {"q": "How long is Yosef’s pencil?", "steps": ["Start at the very end.", {"t": "Clips touch end to end, no gaps.", "m": {"type": "emoji", "e": "📎", "n": 6}}, "Count them: 1, 2, 3, 4, 5, 6.", "The pencil is 6 clips long.", {"t": "Chant the measuring rule!", "m": {"type": "chant", "lines": ["Start at the end,", "no gaps, no space,", "count every unit, each in its place!"]}}], "a": "6 paper clips"}, "ways": ["hands-on", "picture", "Mistake Detective"], "done": "You can measure with units.", "oops": {"q": "Measuring with gaps between the clips", "wrong": "Count anyway", "right": "Push them together", "why": "Gaps make the count wrong."}};
B["MATH.MEAS.L02.02"]={"band": "K1", "pic": "🕒", "today": "Tell time to the hour and half hour", "why": "When is Mincha? When does the bus come? Clocks tell you.", "watch": {"q": "Short hand on 3. Long hand on 12. What time?", "steps": ["The short hand shows the hour. The long hand shows the minutes.", "Long hand on 12: o’clock.", "Short hand on 3: it is 3:00.", "Long hand on 6: half past, like 3:30.", {"t": "Be a clock! One arm up for 12, then down for 6.", "m": {"type": "move", "t": "Arm up: o’clock! Arm down: half past!"}}], "a": "3:00"}, "ways": ["picture", "worked example", "Mistake Detective"], "done": "You can tell time to the hour and half hour.", "oops": {"q": "Short hand between 7 and 8, long hand on 6", "wrong": "8:30", "right": "7:30", "why": "The short hand has not reached 8 yet."}};
B["MATH.MEAS.L02.03"]={"band": "K1", "pic": "🪙", "today": "Count coins: biggest first", "why": "At the corner store, counting coins lets you buy your snack yourself.", "watch": {"q": "Avi has 1 dime and 2 pennies. How much?", "steps": ["Penny 1¢. Nickel 5¢. Dime 10¢. Quarter 25¢.", "Biggest first: the dime is 10.", "Count on the pennies: 11, 12.", "12¢.", {"t": "Sing the coin song!", "m": {"type": "chant", "lines": ["Penny one, nickel five,", "dime is ten, it’s small but fine,", "quarter twenty-five!"]}}], "a": "12¢"}, "ways": ["real-life money", "chant", "Mistake Detective"], "done": "You know coins and can count them.", "oops": {"q": "Which is worth more, a nickel or a dime?", "wrong": "The nickel, it is bigger", "right": "The dime: 10¢", "why": "Size does not tell the value. The coin's name does."}};
B["MATH.STAT.L02.01"]={"band": "K1", "pic": "📊", "today": "Read a picture graph", "why": "A picture graph tells a story with pictures. Read it like a book!", "ready": [{"q": "How many?", "o": ["5", "4", "6"], "a": "5", "m": {"type": "emoji", "e": "🍎", "n": 5}}], "bridge": "MATH.STAT.L01.01", "watch": {"q": "Apples: 5. Pears: 3. How many more apples?", "steps": ["Each picture stands for one.", {"t": "Line up the two rows.", "m": {"type": "emoji", "e": "🍎", "n": 5}}, "2 apples have no partner.", "2 more apples. How many more means compare, not add.", "In all means add every row together.", {"t": "Point to each picture and count it out loud.", "m": {"type": "move", "t": "Point and count: one picture is one!"}}], "a": "2 more"}, "ways": ["picture graph", "worked example", "Mistake Detective"], "done": "You can read a picture graph.", "oops": {"q": "How many more apples than pears (5 and 3)?", "wrong": "8", "right": "2", "why": "How many more means compare, not add."}};
B["MATH.GEO.L02.01"]={"band": "K1", "pic": "🔷", "today": "Sides and corners name a shape", "why": "Turn a square, paint it red, make it tiny: it is still a square!", "ready": [{"q": "A triangle has how many sides?", "o": ["3", "4", "5"], "a": "3"}], "bridge": "MATH.GEO.L01.01", "watch": {"q": "A square tipped on its corner. Still a square?", "steps": ["Count the sides: 4, all the same.", "Count the corners: 4.", "Turning does not change it. Still a square!", "Color and size never change a shape’s name.", "A pentagon has 5 sides and 5 corners. A hexagon has 6.", {"t": "Draw a square in the air. Count the corners: 4!", "m": {"type": "move", "t": "Draw it in the air: 1, 2, 3, 4 corners!"}}], "a": "yes"}, "ways": ["picture", "worked example", "Mistake Detective"], "done": "You know sides and corners name a shape.", "oops": {"q": "A red triangle and a blue triangle", "wrong": "Different shapes, because of the colors", "right": "Both are triangles", "why": "Color is never part of a shape's name."}};
B["MATH.GEO.L02.02"]={"band": "K1", "pic": "🍕", "today": "Halves and quarters are equal parts", "why": "Two brothers, one pizza. Halves keep it fair!", "ready": [{"q": "Are these the same size?", "o": ["Yes", "No"], "a": "Yes", "m": {"type": "fbar", "n": 1, "d": 2}}], "bridge": "MATH.GEO.L02.01", "watch": {"q": "Moshe and Eli share a pizza in 2 equal parts.", "m": {"type": "fbar", "n": 1, "d": 2}, "steps": ["2 boys, 2 equal parts.", {"t": "One of 2 equal parts is a half.", "m": {"type": "fbar", "n": 1, "d": 2}}, {"t": "4 equal parts are quarters.", "m": {"type": "fbar", "n": 1, "d": 4}}, "The parts must be the same size.", "4 quarters make one whole. 2 halves make one whole.", {"t": "Make a whole circle with your arms. Cut it in half!", "m": {"type": "move", "t": "Arms make a circle. Chop: two halves!"}}], "a": "a half"}, "ways": ["fraction bars", "family scene", "Mistake Detective"], "done": "You know halves and quarters.", "oops": {"q": "A cookie cut into 2 pieces, one big and one small", "wrong": "Halves", "right": "Not halves", "why": "Halves must be the same size."}};
