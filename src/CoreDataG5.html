(function () {

    'LANG.MECH.L03.02':{name:"Big Names", teach:[{"how": "Names of holidays get a capital letter: Pesach, Sukkos, Purim, Chanukah.", "q": "Which holiday name is written the right way?", "o": ["Sukkos", "sukkos", "suKKos"]}, {"how": "Names of places get capitals: Baltimore, Maryland, Lake Roland, Park Heights Avenue. Every big word in the name gets one.", "q": "Which place name is written the right way?", "o": ["Lake Roland", "lake roland", "Lake roland"]}, {"how": "The name of one special thing gets a capital. The plain word does not: Sunny Day juice, but just juice.", "q": "In \"We bought Sunny Day juice,\" which words are the special name?", "o": ["Sunny Day", "juice", "bought"]}], practice:[{"t": "sort", "q": "Sort: a special name, or a plain word?", "bins": [{"id": "0", "label": "Gets a capital"}, {"id": "1", "label": "No capital"}], "items": [{"label": "Pesach", "bin": "0"}, {"label": "holiday", "bin": "1"}, {"label": "Baltimore", "bin": "0"}, {"label": "city", "bin": "1"}, {"label": "Lake Roland", "bin": "0"}, {"label": "lake", "bin": "1"}], "h": "Special names get capitals. Plain words do not."}, {"t": "pairs", "q": "Match each name to its fixed spelling.", "pairs": [["purim", "Purim"], ["maryland", "Maryland"], ["jerusalem", "Jerusalem"], ["main street", "Main Street"]], "h": "Give every big word in the name a capital."}, {"t": "sort", "q": "Mistake Detective: right, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "We light candles on Chanukah.", "bin": "0"}, {"label": "We light candles on chanukah.", "bin": "1"}, {"label": "Zeidy lives in Baltimore.", "bin": "0"}, {"label": "Zeidy lives in baltimore.", "bin": "1"}], "h": "Look at each holiday name and place name."}, {"t": "spotall", "q": "\"On Shavuos we ate cheesecake and talked about our trip to Israel.\" Tap every holiday or place name.", "cells": [{"label": "Shavuos", "ok": true}, {"label": "Israel", "ok": true}, {"label": "cheesecake", "ok": false}, {"label": "trip", "ok": false}], "h": "Holidays and places are special names."}, {"t": "order", "q": "Build the sentence.", "tiles": ["On Sukkos,", "we", "ate", "in the sukkah."], "h": "Sukkos is a holiday name, so it gets a capital. Sukkah is a plain word."}, {"t": "pairs", "q": "Match each plain word to a special name.", "pairs": [["holiday", "Purim"], ["city", "Baltimore"], ["state", "Maryland"], ["country", "Israel"]], "h": "The special name gets the capital."}], check:[{"q": "\"Next week is ___.\" Which is written the right way?", "o": ["Shavuos", "shavuos", "shaVuos"]}, {"q": "\"Shimon's house is on ___.\" Which is written the right way?", "o": ["Park Heights Avenue", "park heights avenue", "Park heights avenue"]}, {"q": "\"Our family drove to Lakewood for Purim.\" Which word does NOT get a capital?", "o": ["family", "Lakewood", "Purim"]}], re:[{"q": "Which is written the right way?", "o": ["Purim", "purim", "PUrim"], "h": "A holiday name gets a capital."}, {"q": "Which is written the right way?", "o": ["Maryland", "maryland", "marYland"], "h": "A state name gets a capital."}, {"q": "Which word is a special name?", "o": ["Jerusalem", "city", "street"], "h": "The name of a place gets a capital."}]},
    'LANG.MECH.L03.03':{name:"Dear and Love", teach:[{"how": "A letter starts with a greeting, like Dear Zeidy. Put a comma right after the name.", "q": "Which greeting is written the right way?", "o": ["Dear Zeidy,", "Dear, Zeidy", "Dear Zeidy"]}, {"how": "A letter ends with a closing, like Love or Sincerely. Put a comma after the closing, then sign your name on the next line.", "q": "Which closing is written the right way?", "o": ["Love,", "Love", ",Love"]}, {"how": "Only the first word of a closing gets a capital: Your grandson,", "q": "Which closing is written the right way?", "o": ["Your grandson,", "Your Grandson,", "your grandson,"]}], practice:[{"t": "sort", "q": "Sort: does it start the letter, or end it?", "bins": [{"id": "0", "label": "Greeting"}, {"id": "1", "label": "Closing"}], "items": [{"label": "Dear Bubby,", "bin": "0"}, {"label": "Love,", "bin": "1"}, {"label": "Dear Rebbe,", "bin": "0"}, {"label": "Sincerely,", "bin": "1"}, {"label": "Dear Avi,", "bin": "0"}, {"label": "Your grandson,", "bin": "1"}], "h": "A greeting starts with Dear. A closing comes at the end."}, {"t": "pairs", "q": "Match each letter to its greeting.", "pairs": [["to Zeidy", "Dear Zeidy,"], ["to my rebbe", "Dear Rebbe,"], ["to Uncle Moshe", "Dear Uncle Moshe,"]], "h": "Dear, the name, then a comma."}, {"t": "sort", "q": "Mistake Detective: right, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "Dear Zeidy,", "bin": "0"}, {"label": "Dear, Zeidy", "bin": "1"}, {"label": "Love,", "bin": "0"}, {"label": "Love.", "bin": "1"}], "h": "The comma goes at the end of the greeting and the closing."}, {"t": "spotall", "q": "Tap every greeting or closing that is written the right way.", "cells": [{"label": "Dear Chaim,", "ok": true}, {"label": "Sincerely,", "ok": true}, {"label": "Dear, Chaim", "ok": false}, {"label": "Love", "ok": false}], "h": "Look for the comma at the very end."}, {"t": "order", "q": "Build the letter in order.", "tiles": ["Dear Zeidy,", "Thank you for the sefer.", "Love,", "Avi"], "h": "Greeting, message, closing, then your name."}, {"t": "pairs", "q": "Match each letter to its closing.", "pairs": [["to Bubby", "Your grandson,"], ["to the menahel", "Sincerely,"], ["to a cousin", "Your cousin,"]], "h": "Sincerely is for a letter to a grown-up you do not know well, like the menahel."}], check:[{"q": "Yaakov writes \"Dear Rabbi Gold\" at the top of his letter. Which mark comes next?", "o": ["a comma", "a period", "a question mark"]}, {"q": "Where does the comma go in a closing?", "o": ["after the closing", "before the closing", "under your name"]}, {"q": "Yaakov is writing to Zeidy. Which closing is written the right way?", "o": ["Your grandson,", "Your Grandson,", "Your grandson"]}], re:[{"q": "Which greeting is right?", "o": ["Dear Bubby,", "Dear Bubby", "Dear, Bubby"], "h": "The comma goes after the name."}, {"q": "Which closing is right?", "o": ["Love,", "Love", "love,"], "h": "A capital, then a comma."}, {"q": "What goes on the line under the closing?", "o": ["your name", "Dear", "a comma"], "h": "Sign your name under the closing."}]},
    'LANG.USE.L03.01':{name:"Talk or Write?", teach:[{"how": "When we talk with friends, we use easy, everyday words: yeah, gonna, wanna. That is friend talk.", "q": "Which word is friend talk?", "o": ["gonna", "going to", "will"]}, {"how": "When we write for school, we use full words and whole sentences: yes, going to, want to. That is school writing.", "q": "Which sentence fits school writing?", "o": ["I want to read the book.", "I wanna read the book.", "wanna read"]}, {"how": "Ask: who is it for? A friend at recess, or a report for my rebbe?", "q": "Naftali is writing a report for his rebbe. Which way should he write?", "o": ["school writing", "friend talk", "in a silly song"]}], practice:[{"t": "sort", "q": "Sort: friend talk, or school writing?", "bins": [{"id": "0", "label": "Friend talk"}, {"id": "1", "label": "School writing"}], "items": [{"label": "yeah", "bin": "0"}, {"label": "yes", "bin": "1"}, {"label": "gonna", "bin": "0"}, {"label": "going to", "bin": "1"}, {"label": "wanna", "bin": "0"}, {"label": "want to", "bin": "1"}], "h": "School writing uses full words."}, {"t": "pairs", "q": "Match each friend word to its school word.", "pairs": [["yeah", "yes"], ["gonna", "going to"], ["wanna", "want to"], ["dunno", "do not know"]], "h": "Say the full words."}, {"t": "sort", "q": "Mistake Detective: right for a school report, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "We are going to learn about bees.", "bin": "0"}, {"label": "We are gonna learn about bees.", "bin": "1"}, {"label": "Bees make honey.", "bin": "0"}, {"label": "Yeah, bees make honey.", "bin": "1"}], "h": "A school report uses full words, not friend talk."}, {"t": "spotall", "q": "\"Yeah, I wanna go, but I dunno the way.\" Tap every friend-talk word.", "cells": [{"label": "Yeah", "ok": true}, {"label": "wanna", "ok": true}, {"label": "dunno", "ok": true}, {"label": "go", "ok": false}, {"label": "way", "ok": false}], "h": "Friend talk words are short, everyday words."}, {"t": "order", "q": "Build the sentence the school way.", "tiles": ["We", "are going to", "visit", "the zoo."], "h": "Use full words: going to."}, {"t": "sort", "q": "Sort: which way fits?", "bins": [{"id": "0", "label": "Friend talk"}, {"id": "1", "label": "School writing"}], "items": [{"label": "joking with your cousin", "bin": "0"}, {"label": "a letter to the menahel", "bin": "1"}, {"label": "a story for class", "bin": "1"}, {"label": "a game with your brother", "bin": "0"}], "h": "Ask: who is it for?"}], check:[{"q": "Chaim is writing a science report for school. Which way should he write?", "o": ["school writing", "friend talk", "any way at all"]}, {"q": "\"I wanna help Bubby.\" What is the school way to write \"wanna\"?", "o": ["want to", "wants", "wanted"]}, {"q": "At recess, Avi told Dovid, \"Yeah, the game was fun!\" Which way is that?", "o": ["friend talk", "school writing", "a letter"]}], re:[{"q": "Which is friend talk?", "o": ["dunno", "do not know", "I know"], "h": "Dunno is how we talk with friends."}, {"q": "Which word fits a school report?", "o": ["yes", "yeah", "yup"], "h": "School writing uses full words."}, {"q": "A letter to the menahel is...", "o": ["school writing", "friend talk", "a joke"], "h": "Ask: who is it for?"}]},
    'LANG.MECH.L04.03':{name:"Street, City, State", teach:[{"how": "Put a comma between the city and the state: Baltimore, Maryland, or Silver Spring, Maryland.", "q": "Which is written the right way?", "o": ["Baltimore, Maryland", "Baltimore Maryland", "Baltimore Maryland,"]}, {"how": "When a full address ends a sentence, it needs two commas: one after the street and one after the city. Zeidy lives at 27 Maple Road, Baltimore, Maryland.", "q": "Where else does a comma go in a full address?", "o": ["between the street and the city", "between 27 and Maple", "between Maple and Road"]}, {"how": "No comma inside the street part: 27 Maple Road. The number and the street name stay together.", "q": "Which street part is right?", "o": ["27 Maple Road", "27, Maple Road", "27 Maple, Road"]}], practice:[{"t": "sort", "q": "Mistake Detective: right, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "Monsey, New York", "bin": "0"}, {"label": "Monsey New York", "bin": "1"}, {"label": "Cleveland, Ohio", "bin": "0"}, {"label": "Cleveland Ohio", "bin": "1"}, {"label": "14 Oak Street", "bin": "0"}, {"label": "14, Oak Street", "bin": "1"}], "h": "A comma between city and state. No comma inside the street part."}, {"t": "pairs", "q": "Match each place to its fixed version.", "pairs": [["Monsey New York", "Monsey, New York"], ["Chicago Illinois", "Chicago, Illinois"], ["Lakewood New Jersey", "Lakewood, New Jersey"]], "h": "The comma goes after the city."}, {"t": "order", "q": "Build the sentence.", "tiles": ["Zeidy", "lives in", "Baltimore,", "Maryland."], "h": "City, comma, then the state."}, {"t": "spotall", "q": "\"Bubby lives at 9 Pine Road Monsey New York.\" Tap every word that needs a comma after it.", "cells": [{"label": "Road", "ok": true}, {"label": "Monsey", "ok": true}, {"label": "Pine", "ok": false}, {"label": "New", "ok": false}, {"label": "9", "ok": false}], "h": "After the street, and after the city."}, {"t": "order", "q": "Build the full address sentence.", "tiles": ["Our shul is at", "305 Cedar Avenue,", "Baltimore,", "Maryland."], "h": "Street, comma, city, comma, state."}, {"t": "sort", "q": "Sort: comma, or no comma?", "bins": [{"id": "0", "label": "Comma goes here"}, {"id": "1", "label": "No comma here"}], "items": [{"label": "between the city and the state", "bin": "0"}, {"label": "between the street and the city", "bin": "0"}, {"label": "between the number and the street name", "bin": "1"}, {"label": "between New and York", "bin": "1"}], "h": "New York is one state name. Keep it together."}], check:[{"q": "Which is written the right way?", "o": ["Silver Spring, Maryland", "Silver Spring Maryland", "Silver, Spring Maryland"]}, {"q": "\"Avi lives at 52 Birch Lane Baltimore Maryland.\" How many commas does it need?", "o": ["two", "one", "three"]}, {"q": "\"Our cousins moved to Passaic New Jersey.\" Where does the comma go?", "o": ["between the city and the state", "between New and Jersey", "after Jersey"]}], re:[{"q": "Which is right?", "o": ["Cleveland, Ohio", "Cleveland Ohio", "Cleveland Ohio,"], "h": "Comma between the city and the state."}, {"q": "Which street part is right?", "o": ["14 Oak Street", "14, Oak Street", "14 Oak, Street"], "h": "No comma inside the street part."}, {"q": "\"9 Pine Road___ Monsey\" What goes in the gap?", "o": ["a comma", "a period", "nothing"], "h": "A comma goes after the street."}]},
    'LANG.MECH.L04.04':{name:"The Boys' Bikes", teach:[{"how": "One boy owns it: the boy's bike. Add an apostrophe and s.", "q": "One boy has a bike. Which is right?", "o": ["the boy's bike", "the boys' bike", "the boys bike"]}, {"how": "Many boys own them: the boys' bikes. Boys already ends in s, so add only an apostrophe after the s: the cousins' tent.", "q": "Three boys have bikes. Which is right?", "o": ["the boys' bikes", "the boy's bikes", "the boys's bikes"]}, {"how": "Some plurals do not end in s, like children and men. Add an apostrophe and s: the children's books, the men's hats, the people's coats.", "q": "Which is right?", "o": ["the men's hats", "the mens' hats", "the mens hats"]}], practice:[{"t": "sort", "q": "Sort: one owner, or many owners?", "bins": [{"id": "0", "label": "One owner"}, {"id": "1", "label": "Many owners"}], "items": [{"label": "the boy's bike", "bin": "0"}, {"label": "the boys' bikes", "bin": "1"}, {"label": "the brother's ball", "bin": "0"}, {"label": "the brothers' ball", "bin": "1"}, {"label": "the teacher's desk", "bin": "0"}, {"label": "the teachers' room", "bin": "1"}], "h": "One owner: 's. Many owners ending in s: s'."}, {"t": "pairs", "q": "Match each plural to its owner form.", "pairs": [["boys", "boys'"], ["men", "men's"], ["children", "children's"], ["students", "students'"]], "h": "Ends in s? Add only '. No s? Add 's."}, {"t": "sort", "q": "Mistake Detective: right, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "the boys' coats", "bin": "0"}, {"label": "the boys's coats", "bin": "1"}, {"label": "the men's coats", "bin": "0"}, {"label": "the mens' coats", "bin": "1"}], "h": "Boys ends in s: add only '. Men does not: add 's."}, {"t": "spotall", "q": "\"The children's toys and the players' caps were in the boy's room.\" Tap every plural owner.", "cells": [{"label": "children's", "ok": true}, {"label": "players'", "ok": true}, {"label": "boy's", "ok": false}, {"label": "toys", "ok": false}, {"label": "caps", "ok": false}], "h": "A plural owner means many people own it."}, {"t": "order", "q": "Build the sentence about many boys and their bikes.", "tiles": ["The", "boys'", "bikes", "are outside."], "h": "Many boys: boys'."}, {"t": "order", "q": "Build the sentence about the men and their hats.", "tiles": ["The", "men's", "hats", "are on the shelf."], "h": "Men does not end in s: men's."}], check:[{"q": "Four players left their caps on the bench. Whose caps are they?", "o": ["the players' caps", "the player's caps", "the players caps"]}, {"q": "Many people came to the simcha. Whose coats are on the bed?", "o": ["the people's coats", "the peoples' coats", "the peoples coats"]}, {"q": "Two cousins share one tent. Which is right?", "o": ["the cousins' tent", "the cousin's tent", "the cousins's tent"]}], re:[{"q": "One boy has a hat. Which is right?", "o": ["the boy's hat", "the boys' hat", "the boys hat"], "h": "One owner: add 's."}, {"q": "Two brothers share a room. Which is right?", "o": ["the brothers' room", "the brother's room", "the brothers's room"], "h": "Brothers ends in s: add only the apostrophe."}, {"q": "Which is right for many men?", "o": ["men's", "mens'", "mens"], "h": "Men does not end in s: add 's."}]},
    'LANG.MECH.L04.05':{name:"Add the Ending", teach:[{"how": "If a word ends in a silent e, drop the e before -ed or -ing: bake → baked, baking; write → writing.", "q": "bake + ing = ?", "o": ["baking", "bakeing", "bakking"]}, {"how": "A short word with a short vowel and one last consonant? Double the consonant before -ed or -ing: hop → hopped, hopping; clap → clapped.", "q": "stop + ed = ?", "o": ["stopped", "stoped", "stopd"]}, {"how": "A word ending in a consonant + y? Change y to i before -ed or -es: cry → cried, cries; hurry → hurried. Keep the y before -ing: crying.", "q": "carry + ed = ?", "o": ["carried", "carryed", "carrid"]}], practice:[{"t": "sort", "q": "Sort: what happened to the base word?", "bins": [{"id": "0", "label": "Drop the e"}, {"id": "1", "label": "Double the last letter"}, {"id": "2", "label": "Change y to i"}], "items": [{"label": "baking", "bin": "0"}, {"label": "hopped", "bin": "1"}, {"label": "cried", "bin": "2"}, {"label": "smiled", "bin": "0"}, {"label": "running", "bin": "1"}, {"label": "tries", "bin": "2"}], "h": "Silent e, short vowel, or consonant + y?"}, {"t": "pairs", "q": "Match each word sum to its answer.", "pairs": [["hop + ing", "hopping"], ["bake + ed", "baked"], ["carry + ed", "carried"], ["ride + ing", "riding"]], "h": "Check the end of the base word first."}, {"t": "sort", "q": "Mistake Detective: right, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "making", "bin": "0"}, {"label": "makeing", "bin": "1"}, {"label": "stopped", "bin": "0"}, {"label": "stoped", "bin": "1"}, {"label": "cried", "bin": "0"}, {"label": "cryed", "bin": "1"}], "h": "Drop the e, double it, or change y to i."}, {"t": "spotall", "q": "\"Moshe was baking while Dovid was hopping and Eli was playing.\" Tap every word where the base word changed.", "cells": [{"label": "baking", "ok": true}, {"label": "hopping", "ok": true}, {"label": "playing", "ok": false}, {"label": "was", "ok": false}], "h": "Play ends in a vowel + y, so it does not change."}, {"t": "order", "q": "Build the sentence with hop + ed.", "tiles": ["Avi", "hopped", "over", "the puddle."], "h": "Double the p: hopped."}, {"t": "pairs", "q": "Match each sum to its spelling.", "pairs": [["cry + ing", "crying"], ["cry + ed", "cried"], ["cry + es", "cries"]], "h": "Keep the y before -ing."}], check:[{"q": "\"Chaim is ___ a card for Bubby.\" Use write + ing.", "o": ["writing", "writeing", "writting"]}, {"q": "\"The boys ___ along with the song.\" Use clap + ed.", "o": ["clapped", "claped", "clapt"]}, {"q": "\"Eli ___ to catch the bus.\" Use hurry + ed.", "o": ["hurried", "hurryed", "hurred"]}], re:[{"q": "ride + ing = ?", "o": ["riding", "rideing", "ridding"], "h": "Drop the e, then add -ing."}, {"q": "run + ing = ?", "o": ["running", "runing", "runeing"], "h": "Short vowel, one last consonant: double it."}, {"q": "try + ed = ?", "o": ["tried", "tryed", "tryd"], "h": "Change y to i, then add -ed."}]},
    'LANG.MECH.L05.02':{name:"\"Quote,\" He Said", teach:[{"how": "A speaker tag tells who is talking: Yehuda said. When the tag comes first, put a comma after the tag, then the quotation marks: Yehuda said, \"Let's go.\"", "q": "Which is right?", "o": ["Yehuda said, \"Let's go.\"", "Yehuda said \"Let's go.\"", "Yehuda said, \"Let's go\"."]}, {"how": "When the tag comes after, end the spoken words with a comma INSIDE the quotation marks. Put a period after the tag: \"Let's go,\" Yehuda said.", "q": "Which is right?", "o": ["\"Let's go,\" Yehuda said.", "\"Let's go.\" Yehuda said.", "\"Let's go\", Yehuda said."]}, {"how": "Commas and periods always go inside the closing quotation marks. A question mark or exclamation mark from the speaker stays inside too, with no comma: \"Can I help?\" Dovid asked.", "q": "Which is right?", "o": ["\"Can I help?\" Dovid asked.", "\"Can I help?,\" Dovid asked.", "\"Can I help,\" Dovid asked?"]}], practice:[{"t": "sort", "q": "Sort: does the speaker tag come first or after?", "bins": [{"id": "0", "label": "Tag first"}, {"id": "1", "label": "Tag after"}], "items": [{"label": "Avrumi said, \"The bus is here.\"", "bin": "0"}, {"label": "\"The bus is here,\" Avrumi said.", "bin": "1"}, {"label": "Zeidy asked, \"Who wants tea?\"", "bin": "0"}, {"label": "\"Who wants tea?\" Zeidy asked.", "bin": "1"}, {"label": "Rabbi Feldman said, \"Open your Chumash.\"", "bin": "0"}, {"label": "\"Open your Chumash,\" Rabbi Feldman said.", "bin": "1"}], "h": "Find who is talking. Is that part at the start or the end?"}, {"t": "order", "q": "Build it: the tag comes first.", "tiles": ["Dovid", "said,", "\"Shabbos starts soon.\""], "h": "Who said it, a comma, then the quote."}, {"t": "order", "q": "Build it: the tag comes after.", "tiles": ["\"Please pass the challah,\"", "Binyamin", "said."], "h": "The quote with its comma inside, then who said it, then a period."}, {"t": "sort", "q": "Mistake Detective: right, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "\"I am ready,\" Tzvi Hirsch said.", "bin": "0"}, {"label": "\"I am ready.\" Tzvi Hirsch said.", "bin": "1"}, {"label": "Mr. Halpern said, \"Line up.\"", "bin": "0"}, {"label": "Mr. Halpern said \"Line up.\"", "bin": "1"}], "h": "Check each comma and where it sits."}, {"t": "pairs", "q": "Match each sentence to its rule.", "pairs": [["Yehuda said, \"We won.\"", "comma after the tag"], ["\"We won,\" Yehuda said.", "comma inside the quote"], ["\"Did we win?\" Yehuda asked.", "question mark inside, no comma"]], "h": "Look at where each mark sits."}, {"t": "spotall", "q": "Tap every sentence that is punctuated right.", "cells": [{"label": "\"Come in,\" Zeidy said.", "ok": true}, {"label": "Avrumi asked, \"Is it time?\"", "ok": true}, {"label": "\"Come in\", Zeidy said.", "ok": false}, {"label": "Avrumi asked \"Is it time?\"", "ok": false}], "h": "A comma after a tag that comes first. A comma inside the quote when the tag comes after."}], check:[{"q": "Moshe said___ \"The sukkah is ready.\" Which mark fills the gap?", "o": [",", ".", "!"]}, {"q": "\"We are late,\" Shmuel said. Where is the comma?", "o": ["inside the quotation marks", "outside the quotation marks", "after said"]}, {"q": "\"Where is my siddur___\" Eli asked. Which mark fills the gap?", "o": ["?", ",", "."]}], re:[{"q": "Which is right?", "o": ["\"Time to daven,\" Rabbi Feldman said.", "\"Time to daven.\" Rabbi Feldman said.", "\"Time to daven\", Rabbi Feldman said."], "h": "A comma inside the quote, a period after the tag."}, {"q": "The tag comes first. Where does the comma go?", "o": ["after the tag", "after the last word", "nowhere"], "h": "Yehuda said, then the quote."}, {"q": "\"Is it raining___\" Dovid asked.", "o": ["?", ",", "."], "h": "A question keeps its question mark inside, with no comma."}]},
    'LANG.MECH.L05.03':{name:"Capital Rules Review", teach:[{"how": "Names of people get capitals: Dovid Lerner, Binyamin Yusupov. A title right before a name gets a capital too: Rabbi Feldman, Mr. Halpern.", "q": "Which is right?", "o": ["Rabbi Feldman", "rabbi Feldman", "rabbi feldman"]}, {"how": "Names of exact places get capitals: Baltimore, Glen Avenue, Lake Erie. A plain place word like city, street or lake stays small: our city, a quiet street.", "q": "Which is right?", "o": ["We live on Glen Avenue.", "We live on glen avenue.", "We live on Glen avenue."]}, {"how": "In a title, capitalize the first word and every important word. Short words like a, an, the, and, of, to, in, for stay small in the middle: The Boy and the Sukkah.", "q": "Which title is right?", "o": ["A Trip to the Kosel", "A Trip To The Kosel", "a trip to the Kosel"]}], practice:[{"t": "sort", "q": "Sort: is it an exact name, or a plain word?", "bins": [{"id": "0", "label": "Exact name: capital"}, {"id": "1", "label": "Plain word: small"}], "items": [{"label": "Baltimore", "bin": "0"}, {"label": "city", "bin": "1"}, {"label": "Mr. Halpern", "bin": "0"}, {"label": "teacher", "bin": "1"}, {"label": "Glen Avenue", "bin": "0"}, {"label": "street", "bin": "1"}], "h": "An exact name gets a capital. A plain word does not."}, {"t": "order", "q": "Build the book title.", "tiles": ["Stories", "of", "the", "Gedolim"], "h": "Capital first word, small short words in the middle."}, {"t": "sort", "q": "Mistake Detective: right, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "Stories of the Gedolim", "bin": "0"}, {"label": "Stories Of The Gedolim", "bin": "1"}, {"label": "We visited Lakewood.", "bin": "0"}, {"label": "We visited lakewood.", "bin": "1"}], "h": "Exact names get capitals. Short title words stay small."}, {"t": "spotall", "q": "Title: a gift for bubby. Tap every word that needs a capital.", "cells": [{"label": "a (the first word)", "ok": true}, {"label": "gift", "ok": true}, {"label": "for", "ok": false}, {"label": "bubby", "ok": true}], "h": "The first word and important words get capitals. Short words in the middle do not."}, {"t": "pairs", "q": "Match each to its kind of name.", "pairs": [["Rabbi Feldman", "a title and a name"], ["Glen Avenue", "a street name"], ["Baltimore", "a city name"], ["The Boy and the Sukkah", "a book title"]], "h": "Who, which street, which city, or which book?"}, {"t": "order", "q": "Build the sentence.", "tiles": ["Zeidy Benaim", "drove us", "to", "Lake Erie."], "h": "A name starts it. A place name ends it."}], check:[{"q": "In the title \"A Mitzvah for Moshe,\" which word stays small?", "o": ["for", "Mitzvah", "Moshe"]}, {"q": "Avrumi wrote: \"We met rabbi Gold at the shul.\" Which word needs a capital?", "o": ["Rabbi", "shul", "met"]}, {"q": "Which one needs a capital?", "o": ["a city name", "a plain place word", "a short word in the middle of a title"]}], re:[{"q": "Which title is right?", "o": ["Stories of the Gedolim", "Stories Of The Gedolim", "stories of the gedolim"], "h": "Short words stay small in the middle."}, {"q": "Which needs a capital?", "o": ["Baltimore", "city", "street"], "h": "It names an exact place."}, {"q": "Which is right?", "o": ["Mr. Halpern is our teacher.", "mr. Halpern is our teacher.", "Mr. Halpern is our Teacher."], "h": "A title with a name gets a capital. Plain teacher stays small."}]},
    'LANG.USE.L05.04':{name:"Formal or Friendly?", teach:[{"how": "Formal style is for a grown-up you respect or an important job: a letter to the menahel, a report for class, a speech to the whole school. Use full words and polite phrases.", "q": "Which needs formal style?", "o": ["a letter to the menahel", "a note to your brother", "a chat with a friend"]}, {"how": "Friendly style (informal) is for family and friends: short words, contractions like can't, and a relaxed sound.", "q": "Which needs friendly style?", "o": ["a note to your cousin", "a report for class", "a letter to the menahel"]}, {"how": "Same message, two styles. Formal: \"Thank you for the wonderful trip.\" Friendly: \"Thanks! The trip was great!\" Ask: who is my reader?", "q": "Which is formal?", "o": ["Thank you for the wonderful trip.", "Thanks! The trip was great!", "The trip was awesome!"]}], practice:[{"t": "sort", "q": "Sort: which style fits?", "bins": [{"id": "0", "label": "Formal"}, {"id": "1", "label": "Friendly"}], "items": [{"label": "a letter to the menahel", "bin": "0"}, {"label": "a note to your brother", "bin": "1"}, {"label": "a report for class", "bin": "0"}, {"label": "a chat with a friend", "bin": "1"}, {"label": "a speech to the whole school", "bin": "0"}, {"label": "a postcard to your cousin", "bin": "1"}], "h": "An important reader or job: formal. Family and friends: friendly."}, {"t": "pairs", "q": "Match each friendly word to its formal partner.", "pairs": [["Hi", "Dear"], ["Thanks", "Thank you"], ["can't", "cannot"], ["See ya", "Sincerely"]], "h": "Formal uses full words and polite phrases."}, {"t": "sort", "q": "Mistake Detective: does the style fit the reader?", "bins": [{"id": "0", "label": "Fits"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "Rabbi Feldman, thank you for your help.", "bin": "0"}, {"label": "Hey, Rabbi Feldman, thanks a bunch!", "bin": "1"}, {"label": "Hi, Avrumi! Want to play ball later?", "bin": "0"}, {"label": "Avrumi, I request that you play ball with me.", "bin": "1"}], "h": "Who is reading it? A rebbe, or a friend?"}, {"t": "spotall", "q": "Tap every formal sentence.", "cells": [{"label": "Thank you for your time.", "ok": true}, {"label": "I would like to ask a question.", "ok": true}, {"label": "Hey, what's up?", "ok": false}, {"label": "Thanks a bunch!", "ok": false}], "h": "Formal: full words, polite phrases."}, {"t": "order", "q": "Build a formal thank-you.", "tiles": ["Thank you", "for teaching", "our class."], "h": "Start with the polite phrase."}, {"t": "pairs", "q": "Match each formal sentence to its friendly partner.", "pairs": [["Thank you very much.", "Thanks a lot!"], ["I am unable to come.", "I can't make it."], ["May I borrow your pencil?", "Can I borrow your pencil?"]], "h": "Same message, two styles."}], check:[{"q": "Yehuda writes to the menahel to ask for a chess club. Which style should he use?", "o": ["formal", "friendly", "either one"]}, {"q": "Dovid writes a postcard from camp to his brother. Which style fits?", "o": ["friendly", "formal", "neither one"]}, {"q": "Which word fits the end of a formal letter?", "o": ["Sincerely", "See ya", "Bye"]}], re:[{"q": "Which is friendly style?", "o": ["I can't make it.", "I am unable to attend.", "I regret that I cannot come."], "h": "Contractions sound relaxed."}, {"q": "Which needs formal style?", "o": ["a speech to the whole school", "a note to your brother", "a chat at recess"], "h": "An important audience gets formal style."}, {"q": "Which is formal?", "o": ["Thank you very much.", "Thanks a lot!", "Thx!"], "h": "Full words and polite phrases."}]},
    'LANG.MECH.L06.05':{name:"Book or Chapter?", teach:[{"how": "A whole, long work gets underlining or italics: a book, a magazine, a newspaper. Underline it when you hand-write. Use italics (slanted letters) when you type.", "q": "Which gets underlining or italics?", "o": ["a book", "a poem", "a chapter"]}, {"how": "A short work, or a part of a bigger one, gets quotation marks: a chapter, a poem, a song, an article.", "q": "Which gets quotation marks?", "o": ["a song", "a book", "a magazine"]}, {"how": "Ask: is it the whole thing, or a short part? The book Stories of the Gedolim is underlined or in italics. Its chapter \"The Long Walk\" gets quotation marks. A period or comma after the title goes inside them.", "q": "How do you write a chapter called The Long Walk?", "o": ["in quotation marks", "underlined", "in all capitals"]}], practice:[{"t": "sort", "q": "Sort each kind of work.", "bins": [{"id": "0", "label": "Underline / italics"}, {"id": "1", "label": "Quotation marks"}], "items": [{"label": "a book", "bin": "0"}, {"label": "a poem", "bin": "1"}, {"label": "a magazine", "bin": "0"}, {"label": "a song", "bin": "1"}, {"label": "a newspaper", "bin": "0"}, {"label": "a chapter", "bin": "1"}], "h": "Whole and long, or short or a part?"}, {"t": "pairs", "q": "Match each to its rule.", "pairs": [["a book", "underline or italics"], ["a chapter", "quotation marks"], ["writing by hand", "underline"], ["typing", "italics"]], "h": "Long work or short? Pen or keyboard?"}, {"t": "sort", "q": "Mistake Detective: right, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "Avrumi read the chapter \"The Long Walk.\"", "bin": "0"}, {"label": "Avrumi read the book \"Stories of the Gedolim.\"", "bin": "1"}, {"label": "We sang \"Ani Maamin.\"", "bin": "0"}, {"label": "We sang \"Ani Maamin\".", "bin": "1"}], "h": "A book is not in quotation marks. The period goes inside."}, {"t": "order", "q": "Build it.", "tiles": ["Yehuda read", "the poem", "\"Rain on the Sukkah.\""], "h": "The poem title goes in quotation marks. The period goes inside."}, {"t": "spotall", "q": "Tap every work that gets quotation marks.", "cells": [{"label": "a song", "ok": true}, {"label": "an article", "ok": true}, {"label": "a book", "ok": false}, {"label": "a magazine", "ok": false}], "h": "Short works and parts get quotation marks."}, {"t": "order", "q": "Build it.", "tiles": ["Our class read", "the chapter", "\"A Gift for Bubby,\"", "and we loved it."], "h": "The chapter title is in quotation marks. Its comma goes inside."}], check:[{"q": "Dovid writes the title of a magazine by hand. What should he do?", "o": ["underline it", "put it in quotation marks", "write it in all capitals"]}, {"q": "Eli is typing the title of a poem. How should he show it?", "o": ["quotation marks", "italics", "underlining"]}, {"q": "Which kind of work gets quotation marks?", "o": ["an article", "a newspaper", "a book"]}], re:[{"q": "Which gets quotation marks?", "o": ["a poem", "a magazine", "a newspaper"], "h": "Short works get quotation marks."}, {"q": "You hand-write a book title. What do you do?", "o": ["underline it", "put it in quotation marks", "leave it plain"], "h": "By hand: underline."}, {"q": "Which is right?", "o": ["We sang \"Ani Maamin.\"", "We sang \"Ani Maamin\".", "We sang Ani Maamin.\""], "h": "The period goes inside the quotation marks."}]},
    'READ.VOC.L07.02':{name:"Aud, Vis, Port", teach:[{"how": "A root is the core of a word. It carries the meaning. The Latin root \"aud\" means hear: an audience is the people who hear a speech, and an audible sound is able to be heard.", "q": "What does the root \"aud\" mean?", "o": ["hear", "see", "carry"]}, {"how": "The Latin roots \"vis\" and \"vid\" mean see. Visible means able to be seen, vision is the power of seeing, and a video is something you see.", "q": "What does \"vis\" in visible mean?", "o": ["see", "hear", "carry"]}, {"how": "The Latin root \"port\" means carry, so port words are about carrying. Portable means able to be carried, transport means carry across (trans = across), and import means carry in (im = in).", "q": "What does \"port\" in portable mean?", "o": ["carry", "see", "hear"]}], practice:[{"t": "pairs", "q": "Match each word part to its meaning.", "pairs": [["aud", "hear"], ["vis", "see"], ["port", "carry"], ["trans", "across"]], "h": "Think of a word you know: audience, visible, portable, transport."}, {"t": "sort", "q": "Sort each word by what its root means.", "bins": [{"id": "0", "label": "hear"}, {"id": "1", "label": "see"}, {"id": "2", "label": "carry"}], "items": [{"label": "audience", "bin": "0"}, {"label": "audible", "bin": "0"}, {"label": "visible", "bin": "1"}, {"label": "vision", "bin": "1"}, {"label": "portable", "bin": "2"}, {"label": "import", "bin": "2"}], "h": "Find the root: aud, vis or port."}, {"t": "sort", "q": "Mistake Detective: right meaning, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "Audible means able to be heard.", "bin": "0"}, {"label": "Visible means able to be carried.", "bin": "1"}, {"label": "Portable means able to be carried.", "bin": "0"}, {"label": "Vision means the power of hearing.", "bin": "1"}], "h": "Check the root: aud = hear, vis = see, port = carry."}, {"t": "order", "q": "Build what \"a portable radio\" means.", "tiles": ["A portable", "radio", "can be", "carried."], "h": "Port = carry, -able = can be."}, {"t": "spotall", "q": "\"The speech was barely audible, but the slides were clearly visible.\" Tap every word with a root that means hear or see.", "cells": [{"label": "audible", "ok": true}, {"label": "visible", "ok": true}, {"label": "speech", "ok": false}, {"label": "slides", "ok": false}], "h": "Look for aud and vis."}, {"t": "order", "q": "Build what \"import\" means.", "tiles": ["to carry", "goods", "into", "a country"], "h": "Im = in, port = carry."}], check:[{"q": "The shul hired a porter to bring the boxes in. The root \"port\" tells you a porter's job has to do with...", "o": ["carrying", "hearing", "seeing"]}, {"q": "Rabbi Stern held an audition for the choir. The root \"aud\" tells you an audition is a chance to be...", "o": ["heard", "seen", "carried"]}, {"q": "Gavriel needs one word for \"carry the papers across town.\" Which fits?", "o": ["transport", "audience", "vision"]}], re:[{"q": "What does \"aud\" mean?", "o": ["hear", "see", "carry"], "h": "An audience hears."}, {"q": "Which word means \"able to be seen\"?", "o": ["visible", "audible", "portable"], "h": "Vis = see."}, {"q": "Which word means \"carry in\"?", "o": ["import", "vision", "audible"], "h": "Im = in, port = carry."}]},
    'READ.VOC.L07.03':{name:"Clue to Meaning", teach:[{"how": "A definition clue gives the meaning right in the sentence, often after a comma or a signal like \"which means\" or \"or.\" \"The archive, a room for old papers, was locked.\" That is a definition clue.", "q": "In \"The pamphlet, or small booklet, was handed out,\" what does pamphlet mean?", "o": ["a small booklet", "a large book", "a letter"]}, {"how": "An example clue gives examples you know, after \"such as,\" \"like,\" or \"for example.\" \"Bubby grows herbs, such as mint and dill.\" That is an example clue.", "q": "In \"Zeidy's farm has poultry, such as chickens and ducks,\" what does poultry mean?", "o": ["birds kept on a farm", "farm tools", "fruit trees"]}, {"how": "A contrast clue shows the opposite, after \"but,\" \"unlike,\" or \"however.\" \"Yoni is talkative, but Benny is taciturn.\" Taciturn means quiet, saying little. That is a contrast clue. Sometimes the clue is not in the sentence at all: read on, and look in the next sentences of the paragraph.", "q": "In \"Yoni is talkative, but Benny is taciturn,\" what does taciturn mean?", "o": ["quiet, saying little", "very talkative", "very tall"]}], practice:[{"t": "pairs", "q": "Match each signal word to its kind of clue.", "pairs": [["such as", "example clue"], ["unlike", "contrast clue"], ["which means", "definition clue"]], "h": "Examples, opposite, or the meaning itself?"}, {"t": "sort", "q": "Sort each sentence by its kind of clue.", "bins": [{"id": "0", "label": "Definition"}, {"id": "1", "label": "Example"}, {"id": "2", "label": "Contrast"}], "items": [{"label": "A deadline, the time by which work must be done, was set for Friday.", "bin": "0"}, {"label": "Zeidy's farm has poultry, such as chickens and ducks.", "bin": "1"}, {"label": "The soup was bland, but the kugel was full of flavor.", "bin": "2"}, {"label": "The pamphlet, or small booklet, was handed out at shul.", "bin": "0"}, {"label": "Bubby loves legumes, like lentils and chickpeas.", "bin": "1"}, {"label": "Unlike his noisy brother, Dovid was serene.", "bin": "2"}], "h": "Look for the signal: a comma with the meaning, such as, or but/unlike."}, {"t": "sort", "q": "Clues: \"Yoni was frugal, unlike Benny, who spent every penny.\" \"The soup was bland, but the kugel was full of flavor.\" Mistake Detective: right meaning, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "frugal = careful with money", "bin": "0"}, {"label": "frugal = spends a lot", "bin": "1"}, {"label": "bland = without much flavor", "bin": "0"}, {"label": "bland = full of flavor", "bin": "1"}], "h": "Unlike and but flip the meaning."}, {"t": "order", "q": "Put the clue steps in order.", "tiles": ["Find the hard word.", "Look for a clue in the sentence or paragraph.", "Guess a meaning.", "Test it in the sentence."], "h": "Find, look, guess, test."}, {"t": "spotall", "q": "\"Last night the ship was in peril. Its sails were torn, and water was pouring in.\" Tap every clue that shows what peril means.", "cells": [{"label": "its sails were torn", "ok": true}, {"label": "water was pouring in", "ok": true}, {"label": "the ship", "ok": false}, {"label": "last night", "ok": false}], "h": "The clue is in the next sentences. Peril means danger."}, {"t": "order", "q": "Build a sentence with a definition clue.", "tiles": ["The editor,", "the person who checks every story,", "read it twice."], "h": "The meaning sits between the commas."}], check:[{"q": "\"Chaim was jubilant, but his brother was gloomy.\" Which kind of clue helps you with jubilant?", "o": ["a contrast clue", "a definition clue", "an example clue"]}, {"q": "\"Bubby set out pastries, such as rugelach and babka.\" Which kind of clue is this?", "o": ["an example clue", "a contrast clue", "a definition clue"]}, {"q": "\"The fence was flimsy. It wobbled in the wind and fell over in the first storm.\" Where is the clue to flimsy?", "o": ["in the next sentences", "in the word fence", "there is no clue"]}], re:[{"q": "\"The archive, a room for old papers, was locked.\" Which kind of clue?", "o": ["a definition clue", "an example clue", "a contrast clue"], "h": "The meaning is right there after the comma."}, {"q": "Which word signals a contrast clue?", "o": ["unlike", "such as", "which means"], "h": "Contrast = opposite."}, {"q": "\"Unlike his noisy brother, Dovid was serene.\" Serene probably means...", "o": ["calm and quiet", "loud", "angry"], "h": "Unlike: the opposite of noisy."}]},
    'READ.VOC.L07.04':{name:"Check Your Guess", teach:[{"how": "After you guess a meaning from clues, check it in a dictionary, to make sure the guess is right. An entry shows the part of speech (noun, verb, adjective) and numbered meanings, called senses.", "q": "Why check a guessed meaning in a dictionary?", "o": ["to make sure the guess is right", "to find a longer word", "to skip the reading"]}, {"how": "Many words have more than one sense. Read them all and pick the one that fits your sentence. Entry: bank (noun) 1. land beside a river 2. a place that keeps money. \"We fished from the bank\" uses sense 1.", "q": "\"We fished from the bank.\" Which sense fits?", "o": ["sense 1: land beside a river", "sense 2: a place that keeps money", "both senses"]}, {"how": "Match the part of speech too. If the word is an action in your sentence, read the verb entry. In \"Zeidy will park near the shul,\" park is an action, so read the verb entry, not the noun entry.", "q": "\"Zeidy will park near the shul.\" Which entry should you read?", "o": ["the verb entry", "the noun entry", "any entry"]}], practice:[{"t": "pairs", "q": "Match each sentence to the sense that fits.", "pairs": [["Eli wrote the first draft.", "a first version of writing"], ["Shut the window: there is a draft.", "a flow of cold air"], ["The winter issue comes out Friday.", "one printing of a newspaper"], ["Late buses are an issue.", "a problem to discuss"]], "h": "Read the sentence, then pick the sense."}, {"t": "sort", "q": "Entry: scale (noun) 1. a tool for weighing 2. a thin plate on a fish's skin. Sort each sentence.", "bins": [{"id": "0", "label": "Sense 1"}, {"id": "1", "label": "Sense 2"}], "items": [{"label": "Bubby weighed the flour on the scale.", "bin": "0"}, {"label": "A kosher fish must have fins and scales.", "bin": "1"}, {"label": "The butcher's scale showed two pounds.", "bin": "0"}, {"label": "Yoni scraped the scales off the fish.", "bin": "1"}], "h": "Weighing, or a fish?"}, {"t": "sort", "q": "Entry: column (noun) 1. a tall pillar 2. a regular article in a newspaper. Mistake Detective: right sense, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "\"Akiva writes a weekly column.\" = sense 2", "bin": "0"}, {"label": "\"Akiva writes a weekly column.\" = sense 1", "bin": "1"}, {"label": "\"The shul has white columns.\" = sense 1", "bin": "0"}, {"label": "\"The shul has white columns.\" = sense 2", "bin": "1"}], "h": "Does the sense fit the sentence?"}, {"t": "order", "q": "Put the checking steps in order.", "tiles": ["Guess from the clues.", "Find the word in the dictionary.", "Pick the sense that fits.", "Test it in the sentence."], "h": "Guess, find, pick, test."}, {"t": "spotall", "q": "Entry: issue (noun) 1. one printing of a newspaper 2. a problem to discuss. Tap every sentence that uses sense 1.", "cells": [{"label": "The winter issue comes out Friday.", "ok": true}, {"label": "Gavriel read the last issue twice.", "ok": true}, {"label": "Noise in the library is an issue.", "ok": false}, {"label": "We discussed the issue of late buses.", "ok": false}], "h": "Is it about a newspaper?"}, {"t": "order", "q": "Build the dictionary entry in order.", "tiles": ["bat", "(noun)", "1. a stick for hitting a ball", "2. a small flying animal"], "h": "Word, part of speech, then numbered senses."}], check:[{"q": "Entry: bat (noun) 1. a stick for hitting a ball 2. a small flying animal. \"A bat flew out of the old barn.\" Which sense fits?", "o": ["sense 2", "sense 1", "neither"]}, {"q": "\"Benny will record the interview.\" Which entry for record should he read?", "o": ["the verb entry", "the noun entry", "any entry"]}, {"q": "Akiva guessed a word from clues. Why should he look it up?", "o": ["to make sure the guess is right", "to find a longer word", "to skip the reading"]}], re:[{"q": "Entry: bank (noun) 1. land beside a river 2. a place that keeps money. \"Tatty went to the bank to deposit a check.\" Which sense?", "o": ["sense 2", "sense 1", "neither"], "h": "Money: sense 2."}, {"q": "What does a dictionary entry show before the meanings?", "o": ["the part of speech", "the price", "the author"], "h": "Noun, verb, adjective..."}, {"q": "\"Please press the button.\" Which entry for press?", "o": ["the verb entry", "the noun entry", "neither entry"], "h": "Press here is an action."}]},
    'READ.VOC.L08.03':{name:"Bell, Belli: War Words", teach:[{"how": "The Latin word bellum means war, so the roots \"bell\" and \"belli\" mean war. Belligerent means hostile, eager to fight. Bellicose means warlike, eager to fight.", "q": "What does the root \"belli\" in belligerent mean?", "o": ["war", "beautiful", "ring"]}, {"how": "Rebel comes from re (again) + bell (war): to fight against those in charge. A rebellion is that kind of fight. The opposite root is \"pac,\" from the Latin pax, peace: to pacify is to calm someone, so the menahel pacified the angry boys. A pacifist is a person who is against all war.", "q": "What does the root \"pac\" mean?", "o": ["peace", "war", "pack"]}, {"how": "Careful: words can look alike without sharing a root. Belly and bell (the kind that rings) are not from the war root. They are false friends. Always check that the meaning fits.", "q": "Which word is a false friend, NOT from the war root?", "o": ["belly", "rebel", "bellicose"]}], practice:[{"t": "pairs", "q": "Match each word part to its meaning.", "pairs": [["bell, belli", "war"], ["pac", "peace"], ["re", "again"], ["-ist", "a person who"]], "h": "Think of rebel, pacifist, belligerent."}, {"t": "sort", "q": "Sort each word: war root or peace root?", "bins": [{"id": "0", "label": "war"}, {"id": "1", "label": "peace"}], "items": [{"label": "belligerent", "bin": "0"}, {"label": "bellicose", "bin": "0"}, {"label": "rebellion", "bin": "0"}, {"label": "pacify", "bin": "1"}, {"label": "pacifist", "bin": "1"}, {"label": "Pacific Ocean (named the peaceful sea)", "bin": "1"}], "h": "bell/belli = war, pac = peace."}, {"t": "sort", "q": "Mistake Detective: right, or a false friend?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "belligerent comes from the war root", "bin": "0"}, {"label": "belly comes from the war root", "bin": "1"}, {"label": "rebel comes from the war root", "bin": "0"}, {"label": "a bell that rings comes from the war root", "bin": "1"}], "h": "Looking alike is not enough. Does the meaning fit war?"}, {"t": "order", "q": "Build the meaning of pacifist.", "tiles": ["A pacifist", "is a person", "who is against", "all war."], "h": "pac = peace, -ist = a person who."}, {"t": "spotall", "q": "\"The belligerent fan yelled at the referee, but the coach tried to pacify him.\" Tap every word built on the war or peace root.", "cells": [{"label": "belligerent", "ok": true}, {"label": "pacify", "ok": true}, {"label": "referee", "ok": false}, {"label": "coach", "ok": false}], "h": "Look for bell/belli and pac."}, {"t": "order", "q": "Build the word that means a fight against those in charge.", "tiles": ["re", "bell", "ion"], "h": "re + bell + ion."}], check:[{"q": "Mr. Gross said one reader's letter was bellicose. What does bellicose mean?", "o": ["eager to fight", "calm and kind", "loud like a bell"]}, {"q": "\"The coach bellowed across the field so everyone could hear.\" Bellow means to shout loudly. What is bellow?", "o": ["a false friend", "a war-root word", "a peace-root word"]}, {"q": "The two boys were shouting until Rabbi Rosen calmed them. Rabbi Rosen ___ them.", "o": ["pacified", "rebelled", "belittled"]}], re:[{"q": "What does \"bell\" mean in rebel?", "o": ["war", "beautiful", "ring"], "h": "bellum = war."}, {"q": "A pacifist is a person who...", "o": ["is against all war", "loves to fight", "rings bells"], "h": "pac = peace."}, {"q": "Which word comes from the war root?", "o": ["belligerent", "belly", "bellhop"], "h": "Belly and bellhop are false friends."}]},
    'READ.VOC.L08.04':{name:"Check It Twice", teach:[{"how": "When you infer a meaning from context, check it twice: the sentence test and the dictionary. Check 1, the sentence test: put your guess in place of the word and reread. Does the sentence still make sense?", "q": "\"Eli was elated when his article won first prize.\" Which guess passes the sentence test?", "o": ["very happy", "sad", "sleepy"]}, {"how": "Check 2, the dictionary: look up the word and find the sense that fits. elated (adjective) very happy and excited. If it matches your guess, you are done.", "q": "What is Check 2?", "o": ["look it up in the dictionary", "ask a friend to guess", "read the title"]}, {"how": "If the two checks disagree, the dictionary wins: fix the guess. Then test the new meaning in the sentence.", "q": "If your guess and the dictionary disagree, what do you do?", "o": ["fix the guess", "keep the guess", "skip the word"]}], practice:[{"t": "pairs", "q": "Match each word to its dictionary meaning.", "pairs": [["elated", "very happy and excited"], ["obsolete", "no longer in use"], ["scrutinize", "to examine closely"], ["incessant", "never stopping"]], "h": "Use the clues you know."}, {"t": "sort", "q": "Clues: \"Eli was elated when his article won.\" \"The old map was obsolete; the new highway was not on it.\" Sort each sentence test.", "bins": [{"id": "0", "label": "Makes sense"}, {"id": "1", "label": "Does not fit"}], "items": [{"label": "Eli was very happy when his article won.", "bin": "0"}, {"label": "Eli was sad when his article won.", "bin": "1"}, {"label": "The old map was out of date.", "bin": "0"}, {"label": "The old map was brand new.", "bin": "1"}], "h": "Put the guess in place of the word. Does it still make sense?"}, {"t": "sort", "q": "Mistake Detective: right way to check, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "Put the guess in the sentence and reread.", "bin": "0"}, {"label": "Skip the check if the guess feels right.", "bin": "1"}, {"label": "If the dictionary disagrees, fix the guess.", "bin": "0"}, {"label": "If the dictionary disagrees, keep the guess.", "bin": "1"}], "h": "Check twice. The dictionary wins."}, {"t": "order", "q": "Put the steps in order.", "tiles": ["Infer a meaning from the clues.", "Test it in the sentence.", "Check the dictionary.", "Fix the guess if needed."], "h": "Infer, test, check, fix."}, {"t": "spotall", "q": "\"Benny scrutinized the photo, checking every corner for mistakes.\" Tap every guess that passes the sentence test.", "cells": [{"label": "examined closely", "ok": true}, {"label": "looked carefully at", "ok": true}, {"label": "threw away", "ok": false}, {"label": "glanced quickly at", "ok": false}], "h": "Would it make sense with \"checking every corner\"?"}, {"t": "order", "q": "Guess for succinct: short and clear. Build the sentence test for \"The menahel's speech was succinct: he spoke for two minutes.\"", "tiles": ["The menahel's speech", "was short and clear:", "he spoke", "for two minutes."], "h": "Put the guess where succinct was."}], check:[{"q": "Shimon guesses that meticulous means careless. The dictionary says: meticulous (adjective) very careful about every detail. What should he do?", "o": ["fix the guess", "keep the guess", "skip the dictionary"]}, {"q": "\"The old shul was dilapidated; its roof leaked.\" Shimon puts \"falling apart\" in place of dilapidated and rereads. Which check is that?", "o": ["the sentence test", "the dictionary", "the title"]}, {"q": "What are the two checks for an inferred meaning?", "o": ["the sentence test and the dictionary", "the title and the picture", "the spelling and the length"]}], re:[{"q": "Check 1: put your guess ___ the word and reread.", "o": ["in place of", "next to", "after"], "h": "Swap it in."}, {"q": "If the sentence test and the dictionary disagree, which wins?", "o": ["the dictionary", "the guess", "neither"], "h": "Then fix the guess."}, {"q": "\"The old map was obsolete.\" Which guess passes the sentence test?", "o": ["out of date", "brand new", "colorful"], "h": "The new highway was missing."}]},
    'LANG.SENT.L09.01':{name:"Style Moves", teach:[{"how": "Parallel structure: the items in a list match in form (a pair too). An -ing word goes with -ing words; to + verb goes with to + verb; a describing word goes with describing words. \"The night was dark, windy, and cold.\"", "q": "In parallel structure, the items in a list...", "o": ["match in form", "are all nouns", "get longer"]}, {"how": "Find the odd one out and fix it. \"Akiva likes reporting, editing, and to design pages\" becomes \"Akiva likes reporting, editing, and designing pages.\"", "q": "Fix the odd one out: \"Akiva likes reporting, editing, and to design pages.\"", "o": ["designing pages", "to design pages", "he designs pages"]}, {"how": "Whole phrases too. \"The menahel was patient, kind, and he was wise\" becomes \"The menahel was patient, kind, and wise.\" With \"not only ... but also,\" both halves match: \"not only fast but also fair.\"", "q": "Fix: \"The menahel was patient, kind, and he was wise.\"", "o": ["patient, kind, and wise", "patient, kind, and he was wise", "patient, being kind, and wise"]}], practice:[{"t": "pairs", "q": "Match each item to its parallel partner.", "pairs": [["writing", "editing"], ["to interview", "to write"], ["quickly", "carefully"], ["before Shacharis", "after Maariv"]], "h": "Same form: -ing with -ing, to with to."}, {"t": "sort", "q": "Sort: parallel, or not?", "bins": [{"id": "0", "label": "Parallel"}, {"id": "1", "label": "Not parallel"}], "items": [{"label": "We swept, mopped, and dusted.", "bin": "0"}, {"label": "We swept, mopped, and were dusting.", "bin": "1"}, {"label": "Eli likes to read and to write.", "bin": "0"}, {"label": "Eli likes to read and writing.", "bin": "1"}, {"label": "The article was short, clear, and funny.", "bin": "0"}, {"label": "The article was short, clear, and it made us laugh.", "bin": "1"}], "h": "Do all the items match in form?"}, {"t": "sort", "q": "Mistake Detective: parallel, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "Yoni likes hiking and fishing.", "bin": "0"}, {"label": "Yoni likes hiking and to fish.", "bin": "1"}, {"label": "The story was not only true but also funny.", "bin": "0"}, {"label": "The story was not only true but also it made us laugh.", "bin": "1"}], "h": "Both halves must match in form."}, {"t": "order", "q": "Fix: \"Benny likes taking photos and to edit stories.\"", "tiles": ["Benny likes", "taking photos", "and", "editing stories."], "h": "Taking matches editing."}, {"t": "spotall", "q": "\"Yoni ran, jumped, and was swimming.\" \"Bubby loves baking, frying, and to cook.\" Tap every part that breaks the pattern.", "cells": [{"label": "was swimming", "ok": true}, {"label": "to cook", "ok": true}, {"label": "ran", "ok": false}, {"label": "baking", "ok": false}], "h": "Which item does not match the others?"}, {"t": "order", "q": "Build the sentence with \"not only ... but also.\"", "tiles": ["Not only", "did the Beacon win,", "but it also", "sold out."], "h": "Not only first, but also second."}], check:[{"q": "\"Our job at the Beacon is to interview, to write, and ___.\" Which keeps it parallel?", "o": ["to edit", "editing", "we edit"]}, {"q": "What does parallel structure mean?", "o": ["the items in a list match in form", "every sentence is the same length", "every item is a noun"]}, {"q": "\"Eli was tired, hungry, and he felt cold.\" Which ending keeps the list parallel? Eli was tired, hungry, and ___", "o": ["cold", "he felt cold", "feeling cold"]}], re:[{"q": "Which pair is parallel?", "o": ["to read and to write", "to read and writing", "reading and to write"], "h": "Match the form."}, {"q": "\"We swept, mopped, and were dusting.\" Fix the last item:", "o": ["dusted", "dusting", "to dust"], "h": "Swept, mopped: past-tense verbs."}, {"q": "Parallel items in a list...", "o": ["match in form", "change form", "must be long"], "h": "Same pattern: the items in a list match in form."}]},
    'LANG.SENT.L09.02':{name:"Emphasis", teach:[{"how": "The end of a sentence is the power spot: readers remember the last words best. \"After months of work, the Beacon won first prize.\" The stress lands at the end, on won first prize.", "q": "Where in a sentence do readers feel the most stress?", "o": ["at the end", "at the start", "in the middle"]}, {"how": "To stress something, move it to the end. Put the known part first and the new or important part last. \"The storm made us late\" stresses late. \"We were late because of the storm\" stresses the storm.", "q": "Which sentence stresses the storm?", "o": ["We were late because of the storm.", "The storm made us late.", "Because of the storm, we were late."]}, {"how": "Do not waste the power spot. A weak tag at the end, such as \"I think,\" \"or something,\" or \"basically,\" steals the stress. \"The deadline is Friday, I think\" becomes \"I think the deadline is Friday.\"", "q": "What weakens \"The deadline is Friday, I think\"?", "o": ["a weak tag at the end", "the word deadline", "the word Friday"]}], practice:[{"t": "pairs", "q": "Match each sentence to the part it stresses.", "pairs": [["The prize went to the Beacon.", "the Beacon"], ["The Beacon won the prize.", "the prize"], ["Late at night, Eli finished the article.", "the article"]], "h": "Look at the last words."}, {"t": "sort", "q": "Sort: strong ending or weak ending?", "bins": [{"id": "0", "label": "Strong ending"}, {"id": "1", "label": "Weak ending"}], "items": [{"label": "The deadline is Friday.", "bin": "0"}, {"label": "The deadline is Friday, I think.", "bin": "1"}, {"label": "After weeks of work, the issue sold out.", "bin": "0"}, {"label": "The issue sold out, or something.", "bin": "1"}, {"label": "Through rain and snow, we never missed a deadline.", "bin": "0"}, {"label": "We never missed a deadline, basically.", "bin": "1"}], "h": "A weak tag at the end steals the stress."}, {"t": "sort", "q": "Mistake Detective: does the important part land at the end?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "To stress the winner: The prize went to Gavriel.", "bin": "0"}, {"label": "To stress the winner: Gavriel won the prize.", "bin": "1"}, {"label": "To stress the rain: We stayed in because of the rain.", "bin": "0"}, {"label": "To stress the rain: The rain kept us in.", "bin": "1"}], "h": "What are the last words?"}, {"t": "order", "q": "Build it so the found ring lands at the end.", "tiles": ["After three hours", "of searching,", "Eli found", "the missing ring."], "h": "Known part first, the big news last."}, {"t": "spotall", "q": "Tap every weak tag that should not end a sentence.", "cells": [{"label": "I think", "ok": true}, {"label": "or something", "ok": true}, {"label": "basically", "ok": true}, {"label": "the winner", "ok": false}, {"label": "first prize", "ok": false}], "h": "Which words add nothing at the end?"}, {"t": "order", "q": "Build it so the box of letters lands at the end.", "tiles": ["In the back", "of the archive", "sat", "a box of old letters."], "h": "Place first, then sat, then the surprise."}], check:[{"q": "Mr. Gross wants readers to remember the surprise guest. Where should the guest go in the sentence?", "o": ["at the end", "at the start", "in the middle"]}, {"q": "\"Last Sunday, in the pouring rain, our team won first prize.\" Which part lands with the most stress?", "o": ["won first prize", "last Sunday", "in the pouring rain"]}, {"q": "\"The trip is on Tuesday, or something.\" What weakens it?", "o": ["a weak tag at the end", "the word trip", "the word Tuesday"]}], re:[{"q": "Which sentence ends strong?", "o": ["The deadline is Friday.", "The deadline is Friday, I think.", "The deadline is Friday, or something."], "h": "No weak tag at the end."}, {"q": "To stress something, put it...", "o": ["at the end", "in the middle", "in brackets"], "h": "The end is the power spot."}, {"q": "Which sentence stresses the snow?", "o": ["School closed because of the snow.", "The snow closed school.", "Because of the snow, school closed."], "h": "What lands at the end?"}]}

  BITE['LANG.MECH.L03.02'] = {"band": "B23", "pic": "📛", "today": "Give holidays and places a capital letter", "why": "A capital letter tells the reader: this is a special name.", "ready": [{"q": "Which name is written the right way?", "o": ["Naftali", "naftali", "nAftali"], "a": "Naftali"}], "bridge": "LANG.MECH.L02.02", "bridgeName": "Proper Names", "watch": {"q": "On pesach we visited baltimore.", "m": {"type": "tiles", "w": ["On", "pesach", "we visited", "baltimore."], "hi": [1]}, "steps": [{"t": "Pesach is a holiday name. It gets a capital.", "m": {"type": "tiles", "w": ["On", "Pesach", "we visited", "baltimore."], "hi": [1]}}, {"t": "Baltimore is a place name. It gets a capital too.", "m": {"type": "tiles", "w": ["On", "Pesach", "we visited", "Baltimore."], "hi": [3]}}, {"t": "Every big word in a name gets one: Lake Roland.", "m": {"type": "tiles", "w": ["Lake", "Roland"], "hi": [0, 1]}}, {"t": "A plain word like city or holiday stays small."}, {"t": "Chant it and clap it!", "m": {"type": "chant", "lines": ["Pesach, Purim, Baltimore,", "Special names get capitals, for sure!"]}}], "a": "On Pesach we visited Baltimore."}, "oops": {"q": "We light candles on ___.", "wrong": "chanukah", "right": "Chanukah", "why": "Chanukah is a holiday name. Holiday names get a capital."}, "ways": ["worked example", "chant", "match", "sort", "build with tiles", "Mistake Detective"], "done": "You can give special names a capital!", "board": {"one": "Holidays, places and special names of things get capitals; plain words do not.", "activity": "Two baskets: boys toss word cards into \"special name\" or \"plain word,\" then fix the capitals.", "mistakes": ["chanukah with a small c", "Lake roland (only the first word)", "Capitals on plain words like City"]}, "do": [{"type": "match", "pairs": [["purim", "Purim"], ["maryland", "Maryland"], ["main street", "Main Street"]], "say": "Match each name to its fixed spelling.", "how": "Every big word in a name gets a capital."}, {"type": "sort",   BITE['LANG.MECH.L03.03'] = {"band": "B23", "pic": "📮", "today": "Put commas in a letter's greeting and closing", "why": "Commas in a letter make it neat and polite, like a real letter.", "ready": [{"q": "Which name is written the right way?", "o": ["Zeidy", "zeidy", "zEidy"], "a": "Zeidy"}], "bridge": "LANG.MECH.L02.02", "bridgeName": "Proper Names", "watch": {"q": "A thank-you letter to Zeidy", "m": {"type": "tiles", "w": ["Dear Zeidy,", "Thank you for the sefer.", "Love,", "Avi"], "hi": [0]}, "steps": [{"t": "The greeting: Dear, the name, then a comma.", "m": {"type": "tiles", "w": ["Dear Zeidy,", "Thank you for the sefer.", "Love,", "Avi"], "hi": [0]}}, {"t": "Then the message.", "m": {"type": "tiles", "w": ["Dear Zeidy,", "Thank you for the sefer.", "Love,", "Avi"], "hi": [1]}}, {"t": "The closing: Love, with a comma after it.", "m": {"type": "tiles", "w": ["Dear Zeidy,", "Thank you for the sefer.", "Love,", "Avi"], "hi": [2]}}, {"t": "Last, sign your name on the next line. No comma after your name.", "m": {"type": "tiles", "w": ["Dear Zeidy,", "Thank you for the sefer.", "Love,", "Avi"], "hi": [3]}}, {"t": "Chant it and draw a comma in the air!", "m": {"type": "chant", "lines": ["Dear and a name, then a comma, please!", "Love and a comma, then sign with ease!"]}}], "a": "Dear Zeidy, ... Love, Avi"}, "oops": {"q": "Greeting: Dear Bubby", "wrong": "Dear, Bubby", "right": "Dear Bubby,", "why": "The comma goes after the name, not after Dear."}, "ways": ["worked example", "chant", "match", "sort", "build with tiles", "Mistake Detective"], "done": "You can put commas in a letter!", "board": {"one": "Greeting: Dear + name + comma. Closing: Love, / Sincerely, / Your grandson, then your name.", "activity": "Each boy writes a short thank-you note to a grandparent or his rebbe and circles his two commas.", "mistakes": ["Dear, Zeidy", "Love. with a period", "Your Grandson with two capitals"]}, "do": [{"type": "match", "pairs": [["to Zeidy", "Dear Zeidy,"], ["to my rebbe"
