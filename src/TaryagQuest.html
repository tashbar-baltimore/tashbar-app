e 'it was just luck' thought today and fix it: it was Hashem.", "Take a Wonder Walk: find three amazing things Hashem made, and say the pasuk about Hashem's many works."], "pic": "📦"}], "re": [{"how": "Read the pasuk one more time: לֹא־תַעֲשׂוּן כֵּן לַה׳ אֱלֹקֵיכֶם. Then find the key word: לֹא־תַעֲשׂוּן כֵּן, it means \"you shall not do so\".", "q": "Which word means \"you shall not do so\"?", "o": ["לֹא־תַעֲשׂוּן כֵּן", "אֵלָיו תִּשְׁמָעוּן", "אֶחָד"], "h": "It is the key word of this mitzvah."}, {"how": "Use the peg: 📦 The box for holy papers. Holy papers never go in the trash. They go gently into the box for holy papers, to be buried with honor.", "q": "Which mitzvah goes with the peg The box for holy papers?", "o": ["Never erase Hashem's Name or destroy holy things", "Listen to a true navi", "Make Hashem's Name holy"], "h": "Do the motion: Two hands, place a box down carefully."}, {"how": "Gold means Do. Navy means Don't. Never erase Hashem's Name or destroy holy things is navy (a Don't).", "q": "What color is the card for Never erase Hashem's Name or destroy holy things?", "o": ["Navy", "Gold", "Red"], "h": "Does the pasuk say to do, or not to do?"}], "tq": {"num": "L65", "n": 65, "kind": "dont", "world": 1, "badge": "green", "card": "Don't #65 · World 1 · Knowing Hashem · the Lighthouse 🗼 (thumb, bottom bone) · 🔵 Navy · 🟢 Green: you can do it today (Chofetz Chaim's list)", "src": "Devarim 12:4", "pasuk": "לֹא־תַעֲשׂוּן כֵּן לַה׳ אֱלֹקֵיכֶם", "key": "לֹא־תַעֲשׂוּן כֵּן", "keyen": "you shall not do so", "live": "Check your desk. Any page with Hashem's Name or Torah on it? Put it carefully in the box for holy papers, never in the trash.", "table": "Ask: where does our family put old siddurim and Torah papers?", "hook": "Look closely at this app. Every time Hashem's Name comes up, we write ה׳. Why? Because a holy Name, once written, may never be erased or thrown away.", "hooksrc": "Sifrei, Re'eh; Rambam, Hilchos Yesodei HaTorah 6:1", "wall": ""}}, "LK.TRY.A172": st them."], "pic": "📜"}], "re": [{"how": "Read the pasuk one more time: נָבִיא מִקִּרְבְּךָ מֵאַחֶיךָ כָּמֹנִי יָקִים לְךָ ה׳ אֱלֹקֶיךָ אֵלָיו תִּשְׁמָעוּן. Then find the key word: אֵלָיו תִּשְׁמָעוּן, it means \"to him you shall listen\".", "q": "Which word means \"to him you shall listen\"?", "o": ["אֵלָיו תִּשְׁמָעוּן", "לֹא תְנַסּוּ", "תְחַלְּלוּ"], "h": "It is the key word of this mitzvah."}, {"how": "Use the peg: 📜 The messenger with a scroll. A true navi is Hashem's messenger. When the messenger comes, we listen.", "q": "Which mitzvah goes with the peg The messenger with a scroll?", "o": ["Listen to a true navi", "No other powers but Hashem", "Love Hashem"], "h": "Do the motion: Cup your hand to your ear."}, {"how": "Gold means Do. Navy means Don't. Listen to a true navi is gold (a Do).", "q": "What color is the card for Listen to a true navi?", "o": ["Gold", "Navy", "Red"], "h": "Does the pasuk say to do, or not to do?"}], "tq": {"num": "A172", "n": 172, "kind": "do", "world": 1, "badge": "", "card": "Do #172 · World 1 · Knowing Hashem · the Lighthouse 🗼 (thumb, bottom bone) · 🟡 Gold", "src": "Devarim 18:15", "pasuk": "נָבִיא מִקִּרְבְּךָ מֵאַחֶיךָ כָּמֹנִי יָקִים לְךָ ה׳ אֱלֹקֶיךָ אֵלָיו תִּשְׁמָעוּן", "key": "אֵלָיו תִּשְׁמָעוּן", "keyen": "to him you shall listen", "live": "We hope and daven for the day the nevi'im return. Today, listen carefully to your rebbe and to the words of the nevi'im in Tanach.", "table": "Ask: which navi is your favorite, and why?", "hook": "Moshe Rabbeinu told Bnei Yisrael: Hashem will send you a navi from among you, like me. To him you shall listen. And so Hashem sent nevi'im like Shmuel, Eliyahu and Yeshayahu.", "hooksrc": "Devarim 18:15", "wall": ""}}, "LK.TRY.L064": {"name": "Taryag Don't #64: Do not keep testing a true navi", "band": "2", "peg": {"kind": "picture", "show": "🤝 A handshake of trust", "say": "Once a navi is proven true, I shake his hand and trust him. No more 'prove it again'."}, "op": "🤝 In the desert, Bnei Yisrael had no water. Even after all the wonders Hashem did, they asked again: is Hashem with us or not? That place was named Massah, the place of testing.", "teach": [{"how": "Here is the pasuk, Devarim 6:16: לֹא תְנַסּוּ אֶת־ה׳ אֱלֹקֵיכֶם כַּאֲשֶׁר נִסִּיתֶם בַּמַּסָּה. Once a navi has shown he is true, we may not keep testing him for more and more signs. Testing him again is testing Hashem's word.", "q": "What does this mitzvah teach?", "o": ["Do not keep testing a true navi", "Never make Hashem's Name less honored", "Make Hashem's Name holy"], "h": "Read the first line again: what does it tell us to do or not do?", "pic": "לֹא תְנַסּוּ אֶת־ה׳ אֱלֹקֵיכֶם כַּאֲשֶׁר נִסִּיתֶם בַּמַּסָּה"}, {"how": "The peg 🤝: A handshake of trust. Once a navi is proven true, I shake his hand and trust him. No more 'prove it again'. Motion: Shake hands with the air, then fold your arms calmly.", "q": "What is the memory peg for Do not keep testing a true navi?", "o": ["A handshake of trust", "One big front window", "The King's flag held high"], "h": "Picture it: 🤝", "pic": "🤝"}, {"how": "Why? A true navi teaches the people to do teshuvah. If we keep saying 'prove it again', we never listen. So once the truth is known, we trust. (Sefer HaChinuch, mitzvah 424; Rambam, Hilchos Yesodei HaTorah 10:5)", "q": "Why did Hashem give us this mitzvah?", "o": ["A true navi teaches the people to do teshuvah.", "We say this pasuk every morning and every night, so that we always remember: Hashem is King above, below, and in all four directions.", "If a person thinks something else has power, he forgets that every good thing comes from Hashem."], "h": "Think about the reason you just read.", "pic": "🤝"}], "we": [{"q": "Together: which word in the pasuk means \"you shall not test\"?", "o": ["לֹא תְנַסּוּ", "לֹא־תַעֲשׂוּן כֵּן", "אֵלָיו תִּשְׁמָעוּן"], "pic": "לֹא תְנַסּוּ אֶת־ה׳ אֱלֹקֵיכֶם כַּאֲשֶׁר נִסִּיתֶם בַּמַּסָּה", "steps": ["Read the pasuk slowly: לֹא תְנַסּוּ אֶת־ה׳ אֱלֹקֵיכֶם כַּאֲשֶׁר נִסִּיתֶם בַּמַּסָּה", "We are looking for the words that mean: you shall not test.", "It is לֹא תְנַסּוּ."]}, {"q": "Together: is Do not keep testing a true navi a Do or a Don't?", "o": ["A Don't (navy)", "A Do (gold)", "Neither"], "pic": "🤝", "steps": ["Look at the pasuk: does it tell us to do something, or not to do something?", "It starts with \"not\": it tells us not to do it.", "So it is navy (a Don't)."]}], "practice": [{"t": "sort", "q": "Sort the mitzvos of Yesodei HaTorah: Do (gold) or Don't (navy)?", "bins": [{"id": "D", "label": "🟡 Do (gold)"}, {"id": "N", "label": "🔵 Don't (navy)"}], "items": [{"label": "Listen to a true navi", "bin": "D"}, {"label": "Love Hashem", "bin": "D"}, {"label": "Hashem is One", "bin": "D"}, {"label": "Do not keep testing a true navi", "bin": "N"}, {"label": "Make Hashem's Name holy", "bin": "D"}, {"label": "No other powers but Hashem", "bin": "N"}], "h": "A Don't tells us not to do something.", "why": "Gold mitzvos tell us what to do. Navy mitzvos tell us what not to do.", "pic": "🟡🔵"}, {"q": "Fill in the missing word of the pasuk.", "o": ["לֹא תְנַסּוּ", "תְחַלְּלוּ", "אֶחָד"], "pic": "____ אֶת־ה׳ אֱלֹקֵיכֶם כַּאֲשֶׁר נִסִּיתֶם בַּמַּסָּה", "h": "It means: you shall not test.", "why": "The pasuk says: לֹא תְנַסּוּ אֶת־ה׳ אֱלֹקֵיכֶם כַּאֲשֶׁר נִסִּיתֶם בַּמַּסָּה"}, {"q": "🧍 Mitzvah Move: Shake hands with the air, then fold your arms calmly. Then: A navi already showed he is true. The people say: give us another sign, and another. What is wrong?", "o": ["They are testing him too much. Once he is proven, we trust and listen.", "Nothing is wrong.", "They should ask for ten more signs."], "h": "Once the truth is known, we trust.", "why": "They are testing him too much. Once he is proven, we trust and listen.", "pic": "🤝"}, {"t": "pairs", "q": "Match each mitzvah to its memory peg.", "pairs": [["Do not keep testing a true navi", "🤝 A handshake of trust"], ["Love Hashem", "❤️ The right wall, covered with Hashem's wonders"], ["Never erase Hashem's Name or destroy holy things", "📦 The box for holy papers"], ["Listen to a true navi", "📜 The messenger with a scroll"]], "h": "Picture each peg.", "why": "Do not keep testing a true navi: A handshake of trust; Love Hashem: The right wall, covered with Hashem's wonders; Never erase Hashem's Name or destroy holy things: The box for holy papers; Listen to a true navi: The messenger with a scroll."}, {"t": "order", "q": "Put the words of the pasuk in order.", "tiles": ["לֹא", "תְנַסּוּ", "אֶת־ה׳", "אֱלֹקֵיכֶם", "כַּאֲשֶׁר"], "h": "Start with the first word: לֹא", "why": "The pasuk: לֹא תְנַסּוּ אֶת־ה׳ אֱלֹקֵיכֶם כַּאֲשֶׁר", "pic": "📜 Devarim 6:16"}, {"t": "spotall", "q": "Tap every one that fits the mitzvah: Do not keep testing a true navi.", "cells": [{"label": "Asking for sign after sign", "ok": false}, {"label": "Listening and doing teshuvah", "ok": true}, {"label": "Asking a question to understand", "ok": true}, {"label": "Saying 'prove it again' forever", "ok": false}, {"label": "Never listening until one more wonder", "ok": false}, {"label": "Trusting a navi once he is proven", "ok": true}], "h": "Think of the peg: A handshake of trust", "why": "These fit: Trusting a navi once he is proven, Listening and doing teshuvah, Asking a question to understand."}, {"q": "What was the place in the desert called, where Bnei Yisrael tested Hashem?", "o": ["Massah, the place of testing", "Har Sinai", "Yericho"], "h": "It is named for the testing.", "why": "Massah, the place of testing", "pic": "🤝"}, {"t": "type", "q": "In the Rambam's count, Do not keep testing a true navi is Don't number what? Type the number.", "a": "64", "alt": [], "kb": "num", "h": "Look at the card: Don't #64.", "why": "It is Don't #64 in the Rambam's count.", "pic": "🔢"}], "check": [{"q": "Which mitzvah says: לֹא תְנַסּוּ אֶת־ה׳ אֱלֹקֵיכֶם כַּאֲשֶׁר נִסִּיתֶם בַּמַּסָּה", "o": ["Do not keep testing a true navi", "Listen to a true navi", "Have awe of Hashem"], "pic": "לֹא תְנַסּוּ אֶת־ה׳ אֱלֹקֵיכֶם כַּאֲשֶׁר נִסִּיתֶם בַּמַּסָּה"}, {"q": "Do not keep testing a true navi is a ___ mitzvah, in World ___.", "o": ["Don't, World 1", "Do, World 1", "Don't, World 3"]}, {"q": "How can you live this mitzvah today?", "o": ["When your rebbe or your parents have shown you something is true, trust them.", "Check your desk.", "Take a Wonder Walk: find three amazing things Hashem made, and say the pasuk about Hashem's many works."], "pic": "🤝"}], "re": [{"how": "Read the pasuk one more time: לֹא תְנַסּוּ אֶת־ה׳ אֱלֹקֵיכֶם כַּאֲשֶׁר נִסִּיתֶם בַּמַּסָּה. Then find the key word: לֹא תְנַסּוּ, it means \"you shall not test\".", "q": "Which word means \"you shall not test\"?", "o": ["לֹא תְנַסּוּ", "אֵלָיו תִּשְׁמָעוּן", "אָנֹכִי"], "h": "It is the key word of this mitzvah."}, {"how": "Use the peg: 🤝 A handshake of trust. Once a navi is proven true, I shake his hand and trust him. No more 'prove it again'.", "q": "Which mitzvah goes with the peg A handshake of trust?", "o": ["Do not keep testing a true navi", "Love Hashem", "Believe in Hashem"], "h": "Do the motion: Shake hands with the air, then fold your arms calmly."}, {"how": "Gold means Do. Navy means Don't. Do not keep testing a true navi is navy (a Don't).", "q": "What color is the card for Do not keep testing a true navi?", "o": ["Navy", "Gold", "Red"], "h": "Does the pasuk say to do, or not to do?"}], "tq": {"num": "L64", "n": 64, "kind": "dont", "world": 1, "badge": "", "card": "Don't #64 · World 1 · Knowing Hashem · the Lighthouse 🗼 (thumb, bottom bone) · 🔵 Navy", "src": "Devarim 6:16", "pasuk": "לֹא תְנַסּוּ אֶת־ה׳ אֱלֹקֵיכֶם כַּאֲשֶׁר נִסִּיתֶם בַּמַּסָּה", "key": "לֹא תְנַסּוּ", "keyen": "you shall not test", "live": "When your rebbe or your parents have shown you something is true, trust them. Do not keep saying: prove it again.", "table": "Ask: what is the difference between asking a question to learn, and saying 'prove it' again and again?", "hook": "In the desert, Bnei Yisrael had no water. Even after all the wonders Hashem did, they asked again: is Hashem with us or not? That place was named Massah, the place of testing.", "hooksrc": "Shemos 17:7", "wall": ""}}};
const TQ_TEACH={"LK.TRY.OPEN.01": {"big": "613 mitzvos: 248 Do, like the parts of the body, and 365 Don't, like the days of the year. They live in 14 Worlds, one on each finger bone.", "hook": "Hold up your hand. It is a map of all 613 mitzvos!", "remember": "Arms wide for 248, a full spin for 365, and count 14 bones on your hand.", "intro": ["The Torah has 613 mitzvos (Makkos 23b).", "248 are Do mitzvos, like the parts of the body. 365 are Don't mitzvos, like the days of the year.", "The Rambam put them in 14 books. We call them 14 Worlds, one on each finger bone."], "ex": [{"q": "Tzitzis math: how do we get 613?", "steps": ["The word tzitzis adds up to 600.", "Each corner has 8 strings: 608.", "And 5 knots: 613 (Rashi, Bamidbar 15:39)."], "a": "613", "pic": "🧶 צִיצִת"}, {"q": "How many Worlds on the hand?", "steps": ["The thumb has 2 bones.", "Each other finger has 3 bones: 4 times 3 is 12.", "2 + 12 = 14 Worlds."], "a": "14", "pic": "✋ יָד"}], "oops": {"q": "A boy said: there are 365 Do mitzvos. Is that right?", "wrong": "365 Do", "right": "248 Do, 365 Don't", "why": "Do mitzvos are like the body (248). Don't mitzvos are like the days of the year (365)."}, "idea": ["The five master pegs: 613 = Torah + 2 · 248 + 365 · tzitzis math · 620 letters · Yad = 14.", "Mitzvah Move: arms wide for 248, a full spin for 365.", "Shabbos table: show your family the 14 Worlds on your hand."], "try": {"q": "How many mitzvos are Don't mitzvos?", "o": ["365", "248", "613"], "a": 0, "steps": ["Think: a full spin, like a whole year.", "The year has 365 days.", "365 Don't mitzvos."]}, "nojoke": true}, "LK.TRY.A001": {"big": "The very first mitzvah: know and believe that Hashem is here, made everything, and runs everything, every moment.", "hook": "Long ago, Avraham saw a palace with a light in every window. He asked: could such a palace have nobody in charge? The owner looked out and said: I am the owner. So Hashem showed Avraham: I am the Master of the world. (Bereishis Rabbah 39:1)", "remember": "⬆️ The ceiling of my room: Point up.", "intro": ["The pasuk, Shemos 20:2: אָנֹכִי ה׳ אֱלֹקֶיךָ אֲשֶׁר הוֹצֵאתִיךָ מֵאֶרֶץ מִצְרַיִם מִבֵּית עֲבָדִים", "The very first mitzvah: know and believe that Hashem is here, made everything, and runs everything, every moment.", "Do #1 · gold, a Do."], "ex": [{"q": "Shmuel's team wins with a goal in the last second. Which is a thought of believing in Hashem?", "steps": ["Think about the mitzvah: Believe in Hashem.", "Which choice remembers Who runs it?", "The answer: Hashem made it happen. Thank You, Hashem!"], "a": "Hashem made it happen. Thank You, Hashem!", "pic": "⬆️"}, {"q": "Which word in the pasuk is the key word?", "steps": ["Read the pasuk: אָנֹכִי ה׳ אֱלֹקֶיךָ אֲשֶׁר הוֹצֵאתִיךָ מֵאֶרֶץ מִצְרַיִם מִבֵּית עֲבָדִים", "Look for the words that mean \"I am\".", "It is אָנֹכִי."], "a": "אָנֹכִי", "pic": "אָנֹכִי ה׳ אֱלֹקֶיךָ אֲשֶׁר הוֹצֵאתִיךָ מֵאֶרֶץ מִצְרַיִם מִבֵּית עֲבָדִים"}], "oops": {"q": "A boy said: Believe in Hashem is a Don't. Is that right?", "wrong": "a Don't", "right": "a Do", "why": "The pasuk tells us to do it."}, "idea": ["Why: The Rambam opens his whole Mishneh Torah with this mitzvah. It is the foundation of all foundations: every other mitzvah stands on it. (Rambam, Hilchos Yesodei HaTorah 1:1)", "Live it today: Catch Hashem three times today. When something good happens, say quietly: that was Hashem.", "Shabbos table: Ask Abba or Zeidy: when did you see Hashem run something in your life?"], "try": {"q": "Ari is nervous about tomorrow's test. What does believing in Hashem tell him?", "o": ["Study hard, daven, and know Hashem decides how it goes.", "Don't study. Hashem will do it.", "Worry all night."], "a": 0, "steps": ["We do our part. The result comes from Hashem.", "The answer: Study hard, daven, and know Hashem decides how it goes."]}, "nojoke": true}, "LK.TRY.L001": {"big": "Do not think that anything else has power of its own. Not the sun, not money, not strong people, not luck. Only Hashem.", "hook": "Avraham's father Terach sold idols. Avraham broke them all and put the stick in the hand of the biggest one. Terach said: they cannot do anything! Avraham answered: then listen to what your own mouth just said. (Bereishis Rabbah 38:13)", "remember": "🦶 The floor of my room: Plant both feet.", "intro": ["The pasuk, Shemos 20:3: לֹא־יִהְיֶה־לְךָ", "Do not think that anything else has power of its own. Not the sun, not money, not strong people, not luck. Only Hashem.", "Don't #1 · navy, a Don't."], "ex": [{"q": "Yehuda says his special pencil is why he does well on tests. What do you tell him?", "steps": ["Think about the mitzvah: No other powers but Hashem.", "Who really gives the help?", "The answer: The pencil has no power. Hashem helps you when you study."], "a": "The pencil has no power. Hashem helps you when you study.", "pic": "🦶"}, {"q": "Which word in the pasuk is the key word?", "steps": ["Read the pasuk: לֹא־יִהְיֶה־לְךָ", "Look for the words that mean \"there shall not be for you\".", "It is לֹא־יִהְיֶה־לְךָ."], "a": "לֹא־יִהְיֶה־לְךָ", "pic": "לֹא־יִהְיֶה־לְךָ"}], "oops": {"q": "A boy said: No other powers but Hashem is a Do. Is that right?", "wrong": "a Do", "right": "a Don't", "why": "The pasuk tells us not to do it."}, "idea": ["Why: If a person thinks something else has power, he forgets that every good thing comes from Hashem. This mitzvah keeps our thoughts straight. (Sefer HaChinuch, mitzvah 26)", "Live it today: Catch one 'it was just luck' thought today and fix it: it was Hashem.", "Shabbos table: Ask: what are things people think have power, that really get all their power from Hashem?"], "try": {"q": "It rained on the day of the trip. A boy says: 'The weather ruined it.' What is the better thought?", "o": ["Hashem sends the rain. Hashem knows what is good.", "The clouds decided it.", "Rain has its own power."], "a": 0, "steps": ["Who sends the rain?", "The answer: Hashem sends the rain. Hashem knows what is good."]}, "nojoke": true}, "LK.TRY.A002": {"big": "Know that Hashem is One. There is no one like Him, and there is nothing besides Him.", "hook": "When Yaakov was old, his sons stood by his bed. They said: just as in your heart there is only One, so in ours. Yaakov answered: Blessed is the Name of His glorious kingdom, forever and ever. (Pesachim 56a)", "remember": "☝️ One big front window: Hold up one finger.", "intro": ["The pasuk, Devarim 6:4: שְׁמַע יִשְׂרָאֵל ה׳ אֱלֹקֵינוּ ה׳ אֶחָד", "Know that Hashem is One. There is no one like Him, and there is nothing besides Him.", "Do #2 · gold, a Do."], "ex": [{"q": "Moshe is saying Shema in a noisy room. What can he do?", "steps": ["Think about the mitzvah: Hashem is One.", "What helps us focus on Hashem being One?", "The answer: Cover his eyes and think about every word."], "a": "Cover his eyes and think about every word.", "pic": "☝️"}, {"q": "Which word in the pasuk is the key word?", "steps": ["Read the pasuk: שְׁמַע יִשְׂרָאֵל ה׳ אֱלֹקֵינוּ ה׳ אֶחָד", "Look for the words that mean \"One\".", "It is אֶחָד."], "a": "אֶחָד", "pic": "שְׁמַע יִשְׂרָאֵל ה׳ אֱלֹקֵינוּ ה׳ אֶחָד"}], "oops": {"q": "A boy said: Hashem is One is a Don't. Is that right?", "wrong": "a Don't", "right": "a Do", "why": "The pasuk tells us to do it."}, "idea": ["Why: We say this pasuk every morning and every night, so that we always remember: Hashem is King above, below, and in all four directions. (Berachos 13b)", "Live it today: Say the first pasuk of Shema slowly, with your eyes covered. Think: Hashem is King above, below and on every side.", "Shabbos table: Ask: why do we cover our eyes for the first pasuk of Shema?"], "try": {"q": "When do we say the first pasuk of Shema?", "o": ["Every morning and every night", "Only on Shabbos", "Once a year"], "a": 0, "steps": ["When you lie down and when you get up.", "The answer: Every morning and every night"]}, "nojoke": true}, "LK.TRY.A003": {"big": "Love Hashem with all your heart. Think about how great and kind He is.", "hook": "Yaakov had not seen his son Yosef for 22 years. When they met, Yosef hugged him and cried. And Yaakov? He was saying Shema, pouring out his love for Hashem. (Rashi, Bereishis 46:29)", "remember": "❤️ The right wall, covered with Hashem's wonders: Hand on your heart.", "intro": ["The pasuk, Devarim 6:5: וְאָהַבְתָּ אֵת ה׳ אֱלֹקֶיךָ", "Love Hashem with all your heart. Think about how great and kind He is.", "Do #3 · gold, a Do."], "ex": [{"q": "Dovid sees a beautiful sunset. What can he do to grow in loving Hashem?", "steps": ["Think about the mitzvah: Love Hashem.", "Looking at Hashem's work brings love.", "The answer: Think: how wise and kind Hashem is to make this!"], "a": "Think: how wise and kind Hashem is to make this!", "pic": "❤️"}, {"q": "Which word in the pasuk is the key word?", "steps": ["Read the pasuk: וְאָהַבְתָּ אֵת ה׳ אֱלֹקֶיךָ", "Look for the words that mean \"and you shall love\".", "It is וְאָהַבְתָּ."], "a": "וְאָהַבְתָּ", "pic": "וְאָהַבְתָּ אֵת ה׳ אֱלֹקֶיךָ"}], "oops": {"q": "A boy said: Love Hashem is a Don't. Is that right?", "wrong": "a Don't", "right": "a Do", "why": "The pasuk tells us to do it."}, "idea": ["Why: How do we come to love Hashem? Look at His creations, see how wise they are, and the heart fills with love. (Rambam, Hilchos Yesodei HaTorah 2:2)", "Live it today: Take a Wonder Walk: find three amazing things Hashem made, and say the pasuk about Hashem's many works.", "Shabbos table: Ask each person at the table: what is one wonder of Hashem you saw this week?"], "try": {"q": "Which is the way to come to love Hashem, says the Rambam?", "o": ["Look at His creations and see His wisdom.", "Wait until you feel it by itself.", "Only on Yom Kippur."], "a": 0, "steps": ["The Rambam says: look at what Hashem made.", "The answer: Look at His creations and see His wisdom."]}, "nojoke": true}, "LK.TRY.A004": {"big": "Have awe of Hashem: remember you always stand before the King, and act like it.", "hook": "Rabbi Yehuda HaNasi taught: know what is above you. An Eye that sees, an Ear that hears, and all your deeds are written in a book. (Pirkei Avos 2:1)", "remember": "👑 The King's wall: Bow your head a little.", "intro": ["The pasuk, Devarim 6:13: אֶת־ה׳ אֱלֹקֶיךָ תִּירָא", "Have awe of Hashem: remember you always stand before the King, and act like it.", "Do #4 · gold, a Do."], "ex": [{"q": "Nobody is in the room. Mordechai could take a cookie that is not his. What does awe of Hashem tell him?", "steps": ["Think about the mitzvah: Have awe of Hashem.", "An Eye that sees.", "The answer: Hashem sees me. I will not take it."], "a": "Hashem sees me. I will not take it.", "pic": "👑"}, {"q": "Which word in the pasuk is the key word?", "steps": ["Read the pasuk: אֶת־ה׳ אֱלֹקֶיךָ תִּירָא", "Look for the words that mean \"you shall have awe\".", "It is תִּירָא."], "a": "תִּירָא", "pic": "אֶת־ה׳ אֱלֹקֶיךָ תִּירָא"}], "oops": {"q": "A boy said: Have awe of Hashem is a Don't. Is that right?", "wrong": "a Don't", "right": "a Do", "why": "The pasuk tells us to do it."}, "idea": ["Why: This is not being scared of monsters. It is the awe of standing in front of the great King, who loves you. (Rambam, Hilchos Yesodei HaTorah 2:2)", "Live it today: Once today, before you do something, ask: would I do this in front of the King?", "Shabbos table: Ask: how would you act differently if a king were sitting at our table?"], "try": {"q": "Which is awe of Hashem?", "o": ["Remembering that I always stand before the King.", "Being scared of a shadow.", "Being afraid of the dark."], "a": 0, "steps": ["It is awe of the King, not fear of monsters.", "The answer: Remembering that I always stand before the King."]}, "nojoke": true}, "LK.TRY.A009": {"big": "Make Hashem's Name holy: act in a way that makes people see how great Hashem and His Torah are, and never give up our emunah.", "hook": "Shimon ben Shetach bought a donkey. His students found a jewel tied to its neck. He said: I bought a donkey, not a jewel! He gave it back. The seller said: Blessed is Hashem, the G-d of Shimon ben Shetach. (Yerushalmi Bava Metzia 2:5)", "remember": "🪟 A window full of light: Open your hands outward, like opening a window.", "intro": ["The pasuk, Vayikra 22:32: וְנִקְדַּשְׁתִּי בְּתוֹךְ בְּנֵי יִשְׂרָאֵל", "Make Hashem's Name holy: act in a way that makes people see how great Hashem and His Torah are, and never give up our emunah.", "Do #9 · gold, a Do."], "ex": [{"q": "The cashier gives Yossi too much change. What makes Hashem's Name holy?", "steps": ["Think about the mitzvah: Make Hashem's Name holy.", "Like Shimon ben Shetach and the jewel.", "The answer: Give the extra money back with a smile."], "a": "Give the extra money back with a smile.", "pic": "🪟"}, {"q": "Which word in the pasuk is the key word?", "steps": ["Read the pasuk: וְנִקְדַּשְׁתִּי בְּתוֹךְ בְּנֵי יִשְׂרָאֵל", "Look for the words that mean \"and I will be made holy\".", "It is וְנִקְדַּשְׁתִּי."], "a": "וְנִקְדַּשְׁתִּי", "pic": "וְנִקְדַּשְׁתִּי בְּתוֹךְ בְּנֵי יִשְׂרָאֵל"}], "oops": {"q": "A boy said: Make Hashem's Name holy is a Don't. Is that right?", "wrong": "a Don't", "right": "a Do", "why": "The pasuk tells us to do it."}, "idea": ["Why: Klal Yisrael carries Hashem's Name in the world. When people see a Jew who is honest and kind, they praise Hashem. (Yoma 86a)", "Live it today: Do one thing today that makes someone say: what a fine boy. His Torah made him that way.", "Shabbos table: Tell the story of Shimon ben Shetach and the jewel. Ask: what could we do this week to make Hashem's Name holy?"], "try": {"q": "A bus driver waits for Eli's class. What can the boys do?", "o": ["Say thank you to the driver, nicely.", "Push to get the best seats.", "Run past him."], "a": 0, "steps": ["People see how a Torah boy acts.", "The answer: Say thank you to the driver, nicely."]}, "nojoke": true}, "LK.TRY.L063": {"big": "Do not do things that make people think less of Hashem and His Torah.", "hook": "Rav, a great teacher in Bavel, said: if I buy meat from the butcher and do not pay right away, people may think a Torah scholar does not pay. That would make Hashem's Name less honored. So he always paid at once. (Yoma 86a)", "remember": "🚩 The King's flag held high: Hold an imaginary flag up high.", "intro": ["The pasuk, Vayikra 22:32: וְלֹא תְחַלְּלוּ אֶת־שֵׁם קׇדְשִׁי", "Do not do things that make people think less of Hashem and His Torah.", "Don't #63 · navy, a Don't."], "ex": [{"q": "Chaim is wearing his yarmulke at the store. The line is long. What should he do?", "steps": ["Think about the mitzvah: Never make Hashem's Name less honored.", "People see a Torah boy. What do they learn?", "The answer: Wait his turn calmly."], "a": "Wait his turn calmly.", "pic": "🚩"}, {"q": "Which word in the pasuk is the key word?", "steps": ["Read the pasuk: וְלֹא תְחַלְּלוּ אֶת־שֵׁם קׇדְשִׁי", "Look for the words that mean \"you shall not make unholy\".", "It is תְחַלְּלוּ."], "a": "תְחַלְּלוּ", "pic": "וְלֹא תְחַלְּלוּ אֶת־שֵׁם קׇדְשִׁי"}], "oops": {"q": "A boy said: Never make Hashem's Name less honored is a Do. Is that right?", "wrong": "a Do", "right": "a Don't", "why": "The pasuk tells us not to do it."}, "idea": ["Why: Everyone knows a Torah Jew stands for Hashem. When he does something wrong, people may think less of the Torah. So we are extra careful. (Yoma 86a)", "Live it today: Be extra careful today with honesty and manners when other people can see you.", "Shabbos table: Ask: why was Rav so careful to pay the butcher right away?"], "try": {"q": "Why did Rav pay the butcher right away?", "o": ["So nobody would think a Torah scholar does not pay.", "Because the meat was cheap.", "Because he was in a hurry."], "a": 0, "steps": ["He did not want Hashem's Name less honored.", "The answer: So nobody would think a Torah scholar does not pay."]}, "nojoke": true}, "LK.TRY.L065": {"big": "Do not erase Hashem's holy Names, and do not destroy or damage a shul, a beis medrash or holy sefarim.", "hook": "Look closely at this app. Every time Hashem's Name comes up, we write ה׳. Why? Because a holy Name, once written, may never be erased or thrown away. (Sifrei, Re'eh; Rambam, Hilchos Yesodei HaTorah 6:1)", "remember": "📦 The box for holy papers: Two hands, place a box down carefully.", "intro": ["The pasuk, Devarim 12:4: לֹא־תַעֲשׂוּן כֵּן לַה׳ אֱלֹקֵיכֶם", "Do not erase Hashem's holy Names, and do not destroy or damage a shul, a beis medrash or holy sefarim.", "Don't #65 · navy, a Don't."], "ex": [{"q": "Akiva finds an old torn siddur under his desk. What should he do?", "steps": ["Think about the mitzvah: Never erase Hashem's Name or destroy holy things.", "Holy things are never thrown out.", "The answer: Put it carefully in the box for holy papers."], "a": "Put it carefully in the box for holy papers.", "pic": "📦"}, {"q": "Which word in the pasuk is the key word?", "steps": ["Read the pasuk: לֹא־תַעֲשׂוּן כֵּן לַה׳ אֱלֹקֵיכֶם", "Look for the words that mean \"you shall not do so\".", "It is לֹא־תַעֲשׂוּן כֵּן."], "a": "לֹא־תַעֲשׂוּן כֵּן", "pic": "לֹא־תַעֲשׂוּן כֵּן לַה׳ אֱלֹקֵיכֶם"}], "oops": {"q": "A boy said: Never erase Hashem's Name or destroy holy things is a Do. Is that right?", "wrong": "a Do", "right": "a Don't", "why": "The pasuk tells us not to do it."}, "idea": ["Why: The Torah told us to destroy idols. Then it says: do not do so to Hashem. What is Hashem's, we treat with honor. (Devarim 12:3-4 with Rashi)", "Live it today: Check your desk. Any page with Hashem's Name or Torah on it? Put it carefully in the box for holy papers, never in the trash.", "Shabbos table: Ask: where does our family put old siddurim and Torah papers?"], "try": {"q": "Why does this app write ה׳ instead of the full Name?", "o": ["So the holy Name is never erased or thrown away.", "To save space.", "Because it looks nice."], "a": 0, "steps": ["A written Name may never be erased.", "The answer: So the holy Name is never erased or thrown away."]}, "nojoke": true}, "LK.TRY.A172": {"big": "When a true navi comes and speaks in Hashem's Name, and does not add or take away from the Torah, we must listen to him.", "hook": "Moshe Rabbeinu told Bnei Yisrael: Hashem will send you a navi from among you, like me. To him you shall listen. And so Hashem sent nevi'im like Shmuel, Eliyahu and Yeshayahu. (Devarim 18:15)", "remember": "📜 The messenger with a scroll: Cup your hand to your ear.", "intro": ["The pasuk, Devarim 18:15: נָבִיא מִקִּרְבְּךָ מֵאַחֶיךָ כָּמֹנִי יָקִים לְךָ ה׳ אֱלֹקֶיךָ אֵלָיו תִּשְׁמָעוּן", "When a true navi comes and speaks in Hashem's Name, and does not add or take away from the Torah, we must listen to him.", "Do #172 · gold, a Do."], "ex": [{"q": "A true navi never does what?", "steps": ["Think about the mitzvah: Listen to a true navi.", "The Torah stays complete forever.", "The answer: Add to the Torah or take away from it."], "a": "Add to the Torah or take away from it.", "pic": "📜"}, {"q": "Which word in the pasuk is the key word?", "steps": ["Read the pasuk: נָבִיא מִקִּרְבְּךָ מֵאַחֶיךָ כָּמֹנִי יָקִים לְךָ ה׳ אֱלֹקֶיךָ אֵלָיו תִּשְׁמָעוּן", "Look for the words that mean \"to him you shall listen\".", "It is אֵלָיו תִּשְׁמָעוּן."], "a": "אֵלָיו תִּשְׁמָעוּן", "pic": "נָבִיא מִקִּרְבְּךָ מֵאַחֶיךָ כָּמֹנִי יָקִים לְךָ ה׳ אֱלֹקֶיךָ אֵלָיו תִּשְׁמָעוּן"}], "oops": {"q": "A boy said: Listen to a true navi is a Don't. Is that right?", "wrong": "a Don't", "right": "a Do", "why": "The pasuk tells us to do it."}, "idea": ["Why: Hashem guides His people. Through the nevi'im, He told Klal Yisrael what to do in each generation. (Rambam, Hilchos Yesodei HaTorah, perek 9)", "Live it today: We hope and daven for the day the nevi'im return. Today, listen carefully to your rebbe and to the words of the nevi'im in Tanach.", "Shabbos table: Ask: which navi is your favorite, and why?"], "try": {"q": "Who said: Hashem will send you a navi like me?", "o": ["Moshe Rabbeinu", "Avraham Avinu", "Dovid HaMelech"], "a": 0, "steps": ["It is in Sefer Devarim.", "The answer: Moshe Rabbeinu"]}, "nojoke": true}, "LK.TRY.L064": {"big": "Once a navi has shown he is true, we may not keep testing him for more and more signs. Testing him again is testing Hashem's word.", "hook": "In the desert, Bnei Yisrael had no water. Even after all the wonders Hashem did, they asked again: is Hashem with us or not? That place was named Massah, the place of testing. (Shemos 17:7)", "remember": "🤝 A handshake of trust: Shake hands with the air, then fold your arms calmly.", "intro": ["The pasuk, Devarim 6:16: לֹא תְנַסּוּ אֶת־ה׳ אֱלֹקֵיכֶם כַּאֲשֶׁר נִסִּיתֶם בַּמַּסָּה", "Once a navi has shown he is true, we may not keep testing him for more and more signs. Testing him again is testing Hashem's word.", "Don't #64 · navy, a Don't."], "ex": [{"q": "A navi already showed he is true. The people say: give us another sign, and another. What is wrong?", "steps": ["Think about the mitzvah: Do not keep testing a true navi.", "Once the truth is known, we trust.", "The answer: They are testing him too much. Once he is proven, we trust and listen."], "a": "They are testing him too much. Once he is proven, we trust and listen.", "pic": "🤝"}, {"q": "Which word in the pasuk is the key word?", "steps": ["Read the pasuk: לֹא תְנַסּוּ אֶת־ה׳ אֱלֹקֵיכֶם כַּאֲשֶׁר נִסִּיתֶם בַּמַּסָּה", "Look for the words that mean \"you shall not test\".", "It is לֹא תְנַסּוּ."], "a": "לֹא תְנַסּוּ", "pic": "לֹא תְנַסּוּ אֶת־ה׳ אֱלֹקֵיכֶם כַּאֲשֶׁר נִסִּיתֶם בַּמַּסָּה"}], "oops": {"q": "A boy said: Do not keep testing a true navi is a Do. Is that right?", "wrong": "a Do", "right": "a Don't", "why": "The pasuk tells us not to do it."}, "idea": ["Why: A true navi teaches the people to do teshuvah. If we keep saying 'prove it again', we never listen. So once the truth is known, we trust. (Sefer HaChinuch, mitzvah 424; Rambam, Hilchos Yesodei HaTorah 10:5)", "Live it today: When your rebbe or your parents have shown you something is true, trust them. Do not keep saying: prove it again.", "Shabbos table: Ask: what is the difference between asking a question to learn, and saying 'prove it' again and again?"], "try": {"q": "What was the place in the desert called, where Bnei Yisrael tested Hashem?", "o": ["Massah, the place of testing", "Har Sinai", "Yericho"], "a": 0, "steps": ["It is named for the testing.", "The answer: Massah, the place of testing"]}, "nojoke": true}};

.tq-hero{background:#fff;border:3px solid #c7d2fe;border-radius:24px;padding:16px;box-shadow:0 6px 18px #4338ca1a}
.tq-hero h3{margin:0 0 4px;font-size:22px;font-weight:900}.tq-hero p{margin:6px 0;font-size:15px;line-height:1.5}
.tq-count{display:flex;align-items:center;gap:10px;margin:8px 0}.tq-count b{font-size:30px;color:#b45309}.tq-bar{flex:1;height:14px;border-radius:9px;background:#e5e7eb;overflow:hidden}.tq-bar i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.tq-go{border:0;border-radius:16px;padding:13px 18px;font:900 17px system-ui,sans-serif;color:#1e1b4b;background:linear-gradient(135deg,#fcd34d,#f59e0b);cursor:pointer;box-shadow:0 4px 0 #b45309;margin-top:6px}
.tq-go small{display:block;font-weight:600;font-size:12px}
.tq-pegs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tq-pegs span{background:#eef2ff;border:2px solid #c7d2fe;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700}
.tq-wh{margin:20px 0 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.tq-wh h3{margin:0;font-size:20px;font-weight:900}.tq-wh small{color:#64748b}
.tq-room{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:6px 0 12px}
.tq-wall{border-radius:14px;padding:8px 4px;text-align:center;font-size:12px;font-weight:800;border:2px dashed #cbd5e1;color:#94a3b8;background:#fff}
.tq-wall.ok{border:2px solid #f59e0b;color:#1e1b4b;background:#fef3c7}.tq-wall .e{display:block;font-size:22px}
.tq-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tq-c{position:relative;text-align:left;border:0;border-radius:18px;padding:12px 12px 12px 18px;background:#fff;box-shadow:0 3px 10px #0001;cursor:pointer;font:inherit;color:inherit;border:2px solid #e2e8f0;overflow:hidden}
.tq-c:before{content:'';position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--k)}
.tq-c.do{--k:#f59e0b}.tq-c.dont{--k:#1e3a8a}.tq-c.open{--k:#10b981}
.tq-c .n{font-size:12px;font-weight:900;color:var(--k);text-transform:uppercase;letter-spacing:.03em}.tq-c b{display:block;font-size:16px;margin:2px 0}.tq-c .pe{font-size:26px;float:right}
.tq-c small{color:#64748b;font-size:12px}.tq-c.ok{background:linear-gradient(180deg,#fffbeb,#fff)}.tq-c.ok:after{content:'✓';position:absolute;right:10px;bottom:8px;font-weight:900;color:#16a34a;font-size:20px}
.tq-c.nx{outline:4px solid #fbbf24;animation:tqp 1.6s ease-in-out infinite}@keyframes tqp{0%,100%{box-shadow:0 0 0 0 #f59e0b66}50%{box-shadow:0 0 0 10px #f59e0b00}}
.tq-chip{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:800;margin-top:4px}.tq-chip.g{background:#dcfce7;color:#166534}
.tq-soon{background:#fff;border:2px dashed #cbd5e1;border-radius:18px;padding:14px;color:#475569;font-size:15px}
.tq-pv{position:fixed;left:0;right:0;bottom:0;z-index:9100;background:#fff;border-top:6px solid var(--k);border-radius:24px 24px 0 0;padding:16px 18px 22px;box-shadow:0 -10px 30px #0003;max-width:760px;margin:0 auto;max-height:86vh;overflow:auto}
.tq-pv.do{--k:#f59e0b}.tq-pv.dont{--k:#1e3a8a}.tq-pv.open{--k:#10b981}
.tq-pv h3{margin:0 0 4px;font-size:21px;font-weight:900}.tq-pv .meta{font-size:13px;color:#475569;font-weight:700}
.tq-pv .pas{direction:rtl;text-align:center;font:700 26px/1.6 'Frank Ruhl Libre','Noto Serif Hebrew','Times New Roman',serif;background:#fffbeb;border-radius:14px;padding:10px;margin:10px 0}
.tq-pv .pas small{display:block;direction:ltr;font:600 12px system-ui;color:#92400e}
.tq-pv p{margin:6px 0;font-size:15px;line-height:1.5}.tq-pv .key{font-family:'Frank Ruhl Libre','Noto Serif Hebrew',serif;font-size:22px;font-weight:700}
.tq-pv .row{display:flex;gap:8px;margin-top:12px}.tq-pv .row button{flex:1;border:0;border-radius:14px;padding:13px;font:900 16px system-ui;cursor:pointer}
.tq-pv .row .s{background:var(--k);color:#fff}.tq-pv.do .row .s{color:#1e1b4b}.tq-pv .row .c{background:#eef2ff;color:#1e1b4b}
@media (max-width:700px){.tq-pv{padding-bottom:78px}.tq-in{padding-bottom:130px}.tq-top{grid-template-columns:1fr}.tq-room{grid-template-columns:repeat(3,1fr)}.tq-g{grid-template-columns:1fr}.tq-pv .pas{font-size:22px}}
@media (prefers-reduced-motion:reduce){.tq-c.nx{animation:none}}

function tile(){ const n=met(); return '<button type="button" class="hptile tq-tile" data-tq="open"><span class="hpnewtag">NEW</span><span class="tg">Limudei Kodesh</span><span class="ti" aria-hidden="true">✋</span><b>Taryag Quest</b><small>All 613 mitzvos, World by World · '+n+' of 613</small><span class="pr" title="'+n+' of 613"><i style="width:'+Math.max(2,Math.round(100*n/613))+'%"></i></span></button>'; }
const _vh=vHub;
vHub=function(){ const h=_vh.apply(this,arguments); try{ if(!A.st) return h; css(); const k='<div class="hptiles">', i=h.indexOf(k); if(i<0) return h; return h.slice(0,i+k.length)+tile()+h.slice(i+k.length); }catch(e){ console.error('Taryag tile',e); return h; } };
let SEL=1;
function station(id){ const c=CARD[id], s=TQ[id], cls=c.kind==='open'?'open':c.kind, nx=nextId()===id;
 return '<button type="button" class="tq-c '+cls+(done(id)?' ok':'')+(nx?' nx':'')+'" data-tq="pv" data-id="'+id+'"><span class="pe">'+E((s.peg.show||'').split(' ')[0])+'</span><span class="n">'+(c.kind==='open'?'Start here':(c.kind==='do'?'🟡 Do #':'🔵 Don\'t #')+c.n)+'</span><b>'+E(s.name.replace(/^[^:]*:\s*/,''))+'</b>'
  +(c.wall?'<small>Wall: '+E(c.wall)+'</small><br>':'')+(c.badge==='green'?'<span class="tq-chip g">🟢 today</span>':'')+'</button>'; }
function room(){ const W=ORDER.filter(id=>CARD[id].wall); const wl=W.map(id=>'<div class="tq-wall'+(done(id)?' ok':'')+'"><span class="e">'+E(TQ[id].peg.show.split(' ')[0])+'</span>'+E(CARD[id].wall)+'</div>').join('');
 return '<div class="tq-wh"><h3>🏠 My Six-Wall Room</h3><small>Six mitzvos never stop, like the six Cities of Refuge (Sefer HaChinuch). Each one you master builds a wall.</small></div><div class="tq-room">'+wl+'<div class="tq-wall"><span class="e">🚪</span>the back wall · later in World 1</div></div>'; }
function worldPanel(w){ const W=TQ_WORLDS[w-1], L=worldIds(w);
 if(!L.length) return '<div class="tq-wh"><h3>World '+w+' · '+E(W[2])+' '+E(W[1])+'</h3><small>the Rambam\'s book of '+E(W[0])+'</small></div><div class="tq-soon">🔒 Coming soon. The mitzvos of this World are being written now, in the Rambam\'s order. Finish World 1 first!</div>';
 return '<div class="tq-wh"><h3>World '+w+' · '+E(W[2])+' '+E(W[1])+'</h3><small>the Rambam\'s book of '+E(W[0])+' · Hilchos Yesodei HaTorah · '+L.filter(done).length+' of '+L.length+' mastered</small></div>'+(w===1?room():'')+'<div class="tq-g">'+L.map(station).join('')+'</div>'; }
function shut(){ document.querySelectorAll('.tq-ov,.tq-pv').forEach(x=>x.remove()); }
function map(){ shut(); css(); const ov=document.createElement('div'); ov.className='tq-ov'; const n=met(), nx=nextId();
 const op=ORDER.find(id=>CARD[id].kind==='open');
 ov.innerHTML='<div class="tq-hd"><h2>✋ Taryag Quest<small>All 613 mitzvos in the Rambam\'s order · 14 Worlds on your hand</small></h2>'+(window.TLK?TLK.x('data-tq="x"',''):'<button type="button" data-tq="x" aria-label="Close">✕</button>')+'</div><div class="tq-in">'
  +'<div class="tq-top"><div class="tq-handbox">'+hand(SEL)+'<p>Tap a bone to visit its World. Gold fills up as you learn.</p></div>'
  +'<div class="tq-hero"><h3>Meet all 613 mitzvos</h3><p>248 Do mitzvos, like the parts of the body. 365 Don\'t mitzvos, like the days of the year. One mitzvah at a time: <b>know it, feel it, live it</b>.</p>'
  +'<div class="tq-count"><b>'+n+'</b><span>of 613 mitzvos mastered</span></div><div class="tq-bar"><i style="width:'+Math.max(1,Math.round(100*n/613))+'%"></i></div>'
  +(nx?'<button type="button" class="tq-go" data-tq="go" data-id="'+nx+'">▶ '+(done(op)?'Next mitzvah':'Start the Quest')+'<small>'+E(TQ[nx].name.replace(/^Taryag\s*/,''))+'</small></button>':'<p><b>World 1 so far is complete. Mazel tov!</b> More Worlds are coming.</p>')
  +'<div class="tq-pegs">'+TQ_PEGS.map(p=>'<span title="'+E(p[2])+'">'+E(p[0]+' '+p[1])+'</span>').join('')+'</div></div></div>'
  +'<div class="tq-wh"><h3>🌟 Start here</h3><small>The five master pegs and the hand map</small></div><div class="tq-g">'+station(op)+'</div>'
  +'<div id="tq-world">'+worldPanel(SEL)+'</div></div>';
 document.body.appendChild(ov); }
function pick(w){ SEL=w; const box=document.getElementById('tq-world'); if(box) box.innerHTML=worldPanel(w); const svg=document.querySelector('.tq-hand'); if(svg) svg.outerHTML=hand(w); if(box) box.scrollIntoView({behavior:'smooth',block:'start'}); }
function preview(id){ document.querySelectorAll('.tq-pv').forEach(x=>x.remove()); const c=CARD[id], s=TQ[id], cls=c.kind==='open'?'open':c.kind; const pv=document.createElement('div'); pv.className='tq-pv '+cls; pv.setAttribute('role','dialog');
 pv.innerHTML=c.kind==='open'?'<h3>✋ '+E(s.name.replace(/^[^:]*:\s*/,''))+'</h3><p>'+E(s.op)+'</p><p class="meta">'+E(c.card)+'</p>'+TQ_PEGS.map(p=>'<p><b>'+E(p[0]+' '+p[1])+':</b> '+E(p[2])+'</p>').join('')
  +'<div class="row"><button class="c" data-tq="pvx">Back</button><button class="s" data-tq="go" data-id="'+id+'">'+(done(id)?'Review ▶':'Start ▶')+'</button></div>'
 :'<h3>'+E(s.peg.show.split(' ')[0])+' '+E(s.name.replace(/^[^:]*:\s*/,''))+'</h3><div class="meta">'+E(c.card)+'</div>'
  +'<div class="pas" lang="he">'+E(c.pasuk)+'<small>'+E(c.src)+'</small></div>'
  +'<p>Key word: <span class="key" lang="he" dir="rtl">'+E(c.key)+'</span> = "'+E(c.keyen)+'"</p>'
  +'<p><b>The story:</b> '+E(c.hook)+' <small>('+E(c.hooksrc)+')</small></p>'
  +'<p><b>🔑 Peg:</b> '+E(s.peg.show)+'. '+E(s.peg.say)+'</p>'
  +'<p><b>✅ Live it:</b> '+E(c.live)+'</p><p><b>🕯️ Shabbos table:</b> '+E(c.table)+'</p>'
  +'<div class="row"><button class="c" data-tq="pvx">Back to the map</button><button class="s" data-tq="go" data-id="'+id+'">'+(done(id)?'Review ▶':'Learn it ▶')+'</button></div>';
 document.body.appendChild(pv); }
document.addEventListener('click',e=>{ const b=e.target.closest&&e.target.closest('[data-tq]'); if(!b) return; const a=b.dataset.tq;
 if(a==='open'){ e.preventDefault(); e.stopPropagation(); map(); return; }
 if(a==='bone'){ pick(+b.dataset.w); return; }
 if(a==='pv'){ preview(b.dataset.id); return; }
 if(a==='pvx'){ document.querySelectorAll('.tq-pv').forEach(x=>x.remove()); return; }
 if(a==='x'){ shut(); try{ render(); }catch(x){} return; }
 if(a==='go'){ const id=b.dataset.id; shut(); try{ A.overlay=null; startMission('LK',id,'skill'); }catch(x){ console.error('Taryag start',x); } return; } },true);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&document.querySelector('.tq-ov,.tq-pv')){ if(document.querySelector('.tq-pv')) document.querySelectorAll('.tq-pv').forEach(x=>x.remove()); else shut(); }
 if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.classList&&e.target.classList.contains('tq-bone')){ e.preventDefault(); pick(+e.target.dataset.w); } });
window.TL_TRY_OPEN=map;

}catch(e){ console.error('TaryagQuest',e); } })();
