<script>
/* K1Only.html: Kindergarten and Grade 1 boys get games only (HoS 2026-11-22, morning):
   "Kindergarten and first grade to fill the screen ... a game only. There should be none of that stuff anymore ...
    The kids should open it up, and instantly, the only curriculum that's available for kindergarten and first grade are those
    game-like stuff. Nothing else ... No pop-ups, no nothing."
   WHO: a boy whose roster grade is K or 1 (the server's klMe: K = 0, 1st = 1), or a boy whose map has every subject at Level 1-2
   (a non-TEST boy a rebbe placed at K/1). TEST- boys: only by roster grade, or with ?k1=1 on the address (?k1=0 turns it off on that Chromebook).
   WHAT: (1) the home is one full-screen game path for HIS grade only: the real train / matching / balloon games
         (Kindergarten, Level 1 only: KL Math, KR ABC, KK Kriyah; Grade 1, Level 2 only: G1M Math, G1R Reading, KK Kriyah), in the order the skills build, one game at a time
         (the next unlocks when the one before is passed), with a giant PLAY for the next game. No One Bite question lessons,
         no map, tabs, store, missions, money bar or menus. (HoS follow-up, same morning: "these are not games ... stick to kindergarten ...
         games in sequential order of the skills, one on top of another, build off each other, not 24 random stuff.")
         (2) no pop-ups: welcome, Today's Vort, reminders, store payday, joke jar, "new level" checks and "find your level" never show.
         (3) K-1 game lessons fill the screen with big pictures; the "Why it matters" and "How to do it" reading is hidden.
   Saving, mastery and pay are unchanged (the lessons are the same One Bite lessons). Loads last. No double slash in this file. */
(function(){
if(window.K1O) return;
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K1O=window.K1O={sid:null,grade:null,subj:'MATH',said:''};
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} return null; }
try{ const q=String(location.search||''); if(/[?&]k1=1\b/.test(q)) ls('tl-k1only','1'); if(/[?&]k1=0\b/.test(q)) ls('tl-k1only','0'); }catch(e){}
function st(){ return (typeof A!=='undefined'&&A&&A.st)||null; }
function isTest(){ return /^TEST/i.test(String((st()||{}).id||'')); }
function mapLow(){ try{ const m=window.TL_MAP, s=m&&m.subjects; if(!s) return false; const L=Object.keys(s).map(k=>Number(s[k]&&s[k].level)).filter(n=>n>0); return L.length>0&&L.every(n=>n<=2); }catch(e){ return false; } }
function fetchGrade(){ const b=st(); if(!b||!b.id||K1O.sid===b.id) return; const sid=b.id; K1O.sid=sid; K1O.grade=null;
  const c=ls('tl-k1g:'+sid); if(c!=null&&c!=='') K1O.grade=Number(c);
  try{ if(typeof run==='function'&&typeof SRV!=='undefined'&&SRV.token) run('klMe',SRV.token).then(r=>{ if(K1O.sid!==sid) return;
    const g=(r&&typeof r.grade==='number')?r.grade:null, was=K1O.grade; K1O.grade=g; ls('tl-k1g:'+sid,g==null?'':String(g));
    if(was!==g&&typeof A!=='undefined'&&A.view==='hub') try{ render(); }catch(e){} }).catch(()=>{}); }catch(e){} }
function on(){ try{ const b=st(); if(!b||!b.id) return false; fetchGrade(); const f=ls('tl-k1only');
  if(f==='0') return false; if(f==='1') return true;
  if(K1O.grade===0||K1O.grade===1) return true;
  return !isTest()&&mapLow(); }catch(e){ return false; } }
K1O.on=on;

/* ---------- the real K-1 games (train, matching and balloon games), one grade, in skill order ----------
   Each game pack keeps its own list in the order the skills build (LIST) and saves the best check score (0-3) in the boy's state.
   Kindergarten (Level 1 games only): KL Math, KR Reading (ABC), KK Kriyah. Grade 1 (Level 2 games only): G1M Math, G1R Reading, KK Kriyah. A game counts as passed at 2 or more.
   The next game unlocks when the one before it is passed; a passed game can always be played again. */
const PACKS={0:[{k:'MATH',g:'KL',st:'klm',lv:1,i:'🔢',n:'Numbers'},{k:'READ',g:'KR',st:'klr',lv:1,i:'🔤',n:'ABC'},{k:'LK',g:'KK',st:'klk',lv:1,i:'א',n:'Kriyah'}],
             1:[{k:'MATH',g:'G1M',st:'g1m',lv:2,i:'🔢',n:'Numbers'},{k:'READ',g:'G1R',st:'g1r',lv:2,i:'📖',n:'Reading'},{k:'LK',g:'KK',st:'klk',lv:2,i:'א',n:'Kriyah'}]};   /* st = where each game pack saves its scores: KLessons st.klm, KReading st.klr, KKriyah st.klk, G1Math st.g1m, G1Reading st.g1r (2026-11-24: Reading and Kriyah read the wrong name, so their game 2 never opened) */
const OVS=['klov','krov','kkov','kkov2','g1mov','g1rov'];
function gradeNow(){ if(K1O.grade===0||K1O.grade===1) return K1O.grade;
  try{ const m=window.TL_MAP, L=m&&m.subjects&&m.subjects.MATH&&Number(m.subjects.MATH.level); if(L===2) return 1; }catch(e){} return 0; }
function subjects(){ return (PACKS[gradeNow()]||PACKS[0]).filter(p=>window[p.g]&&typeof window[p.g].list==='function'&&list(p).length); }
function list(p){ try{ const re=new RegExp('\\.L0'+p.lv+'\\.'); return window[p.g].list().map(x=>x[0]).filter(id=>re.test(id)); }catch(e){ return []; } }
function score(p,id){ const b=st(), m=b&&b[p.st]; return m&&typeof m[id]==='number'?m[id]:-1; }
function passed(p,id){ return score(p,id)>=2; }
function picOf(p,id){ const B=window.ONE_BITE||{}; return (B[id]&&B[id].pic)||p.i; }
function nameOf(p,id){ try{ const l=window[p.g].list().find(x=>x[0]===id); const n=l&&l[1]; if(n&&n!==id) return n; }catch(e){} try{ return typeof skillName==='function'?skillName(id):id; }catch(e){ return id; } }

function shelf(){ const S=subjects(); if(!S.find(s=>s.k===K1O.subj)) K1O.subj=S.length?S[0].k:'MATH';
  const p=S.find(s=>s.k===K1O.subj), ids=p?list(p):[];
  let nx=ids.findIndex(id=>!passed(p,id)); if(nx<0) nx=ids.length?0:-1;
  const name=E((st()||{}).name||''), first=name.split(' ')[0];
  let h='<div class="k1-top"><button class="k1-say" data-k1="say" aria-label="Hear it">🔊</button><div class="k1-hi">'+(first?'Hi, '+first+'!':'Let\'s play!')+'</div>'+
    '<button class="k1-out" data-act="signout" aria-label="Sign out">👋 Bye</button></div>';
  if(S.length>1) h+='<div class="k1-subj" role="tablist">'+S.map(s=>'<button role="tab" class="k1-s'+(s.k===K1O.subj?' on':'')+'" data-k1="subj" data-s="'+s.k+'" aria-label="'+E(s.n)+'"><span class="i">'+E(s.i)+'</span><span class="n">'+E(s.n)+'</span></button>').join('')+'</div>';
  if(nx>=0){ const id=ids[nx]; h+='<button class="k1-play" data-k1="play" data-id="'+E(id)+'" aria-label="Play: '+E(nameOf(p,id))+'"><span class="pic">'+E(picOf(p,id))+'</span><span class="go">▶ PLAY</span></button>'; }
  h+='<div class="k1-path">'+ids.map((id,n)=>{ const d=passed(p,id), open=d||n===nx||n===0, lock=!open;
    return '<button class="k1-t'+(d?' done':'')+(n===nx?' now':'')+(lock?' lock':'')+'" data-k1="'+(lock?'locked':'play')+'" data-id="'+E(id)+'" aria-label="'+E(nameOf(p,id))+(d?', done':lock?', locked':'')+'"'+(lock?' aria-disabled="true"':'')+'>'+
      '<span class="pic">'+E(lock?'🔒':picOf(p,id))+'</span><span class="num">'+(n+1)+'</span>'+(d?'<span class="star">⭐</span>':'')+'</button>'; }).join('')+'</div>';
  return h; }

function paint(){ const k=on(), body=document.body; if(!body) return; body.classList.toggle('k1-mode',k);
  try{ const b=st(); if(b&&b.id&&A.view!=='signin'&&(k||K1O.grade!=null)) ls('tl-k1dev',k?'1':'0'); }catch(e){}   /* K-1 FIRST: this Chromebook's last boy was K-1 (see Speed.js) */
  let el=document.getElementById('k1o'); const home=k&&typeof A!=='undefined'&&A.view==='hub';
  if(!home){ body.classList.remove('k1-home'); if(el) el.remove(); return; }
  A.overlay=null; body.classList.add('k1-home');
  if(!el){ el=document.createElement('div'); el.id='k1o'; el.setAttribute('role','main'); body.appendChild(el); }
  el.innerHTML=shelf(); K1O.sig=sig();
  const key=K1O.sid+':'+K1O.subj; if(K1O.said!==key){ K1O.said=key; setTimeout(sayHi,400); } }
function sig(){ try{ const b=st()||{}; return JSON.stringify([K1O.subj,gradeNow(),b.klm,b.klr,b.klk,b.g1m,b.g1r]); }catch(e){ return ''; } }
function sayHi(){ try{ if(typeof speak==='function') speak('Tap PLAY!'); }catch(e){} }
function gameOpen(){ return OVS.some(id=>document.getElementById(id)); }

/* ---------- inside each game: fill the whole screen, and make the voice always work (HoS 2026-11-22: "I absolutely want it to fill
   the whole screen. And I want you to make sure that the audio also works.")
   Each game page runs in a sealed frame (srcdoc). Before it loads we put two small things in front of its page:
   (1) styles: the game spans the full width and its pictures, buttons and words grow with the screen; the skill code and the
       "All lessons" button are hidden (the path is the menu, one game at a time);
   (2) a voice bridge for the device voice: each game first plays its own voices (rebbe clips, the Hebrew voice, the teacher voice).
       When it falls back to the device voice (speechSynthesis), Chrome keeps a brand-new frame silent until a tap inside it, so the
       first lines could be silent. Those lines now go to this page (which the boy has already tapped), which plays the teacher voice
       or the device voice and tells the game when the line is finished, so the game keeps its pace. Mute in the game still works.
       English lines only: Hebrew sounds keep the game's own clips and Hebrew voice (no computer voice for Hebrew is added here). */
const GAME_CSS='<style id="k1fit">@media (min-width:900px){'+
 '.wrap{max-width:none!important;padding-left:clamp(16px,3vw,48px)!important;padding-right:clamp(16px,3vw,48px)!important}'+
 '.stage{min-height:calc(100vh - 160px)!important;justify-content:center}'+
 '.o{font-size:clamp(42px,15vh,150px)!important} .frame .o{font-size:clamp(38px,7vh,70px)!important}'+
 '.ch{min-width:clamp(108px,22vh,220px)!important;height:clamp(108px,22vh,220px)!important;font-size:clamp(52px,11vh,110px)!important;border-radius:clamp(30px,4vh,44px)!important}'+
 '.ch.wide{font-size:clamp(34px,5.5vh,60px)!important;min-width:clamp(150px,24vh,260px)!important}'+
 '.cap{font-size:clamp(22px,4.4vh,42px)!important;min-height:clamp(58px,8vh,84px)!important}'+
 '.card-num{font-size:clamp(96px,17vh,170px)!important} .big-num{font-size:clamp(72px,13vh,130px)!important}'+
 '.frame{grid-template-columns:repeat(5,clamp(60px,10vh,100px))!important;grid-template-rows:repeat(2,clamp(60px,10vh,100px))!important}'+
 '.tile{width:clamp(54px,8.5vh,84px)!important;height:clamp(54px,8.5vh,84px)!important;font-size:clamp(26px,4vh,40px)!important}'+
 '.tiles{max-width:min(92vw,1000px)!important}'+
 '.basket{min-width:clamp(140px,24vh,240px)!important;min-height:clamp(110px,18vh,180px)!important}'+
 '.bin{min-width:clamp(130px,22vh,230px)!important;min-height:clamp(120px,19vh,190px)!important}'+
 '.car{min-width:clamp(70px,11vh,110px)!important;height:clamp(62px,9.5vh,96px)!important;font-size:clamp(32px,5vh,50px)!important}'+
 '.spk{width:clamp(64px,9vh,88px)!important;height:clamp(64px,9vh,88px)!important;font-size:clamp(30px,4.2vh,40px)!important}'+
 'h1{font-size:clamp(26px,3.6vh,36px)!important}'+
 '}#home,h1 small{display:none!important}</style>';
const GAME_VOICE='<scr'+'ipt>(function(){var P={},n=0;'+
 'var S={speak:function(u){var id=++n;P[id]=u;try{if(u.onstart)u.onstart();}catch(e){}try{parent.postMessage({k1say:String(u.text||""),id:id},"*");}catch(e){}},'+
 'cancel:function(){P={};try{parent.postMessage({k1hush:1},"*");}catch(e){}},getVoices:function(){return [];},pause:function(){},resume:function(){},'+
 'speaking:false,pending:false,paused:false,onvoiceschanged:null,addEventListener:function(){},removeEventListener:function(){}};'+
 'try{Object.defineProperty(window,"speechSynthesis",{value:S,configurable:true});}catch(e){}'+
 'if(!window.SpeechSynthesisUtterance){window.SpeechSynthesisUtterance=function(t){this.text=t;};}'+
 'window.addEventListener("message",function(e){var d=e.data;if(d&&d.k1said&&P[d.k1said]){var u=P[d.k1said];delete P[d.k1said];try{if(u.onend)u.onend();}catch(x){}}});'+
 'function rdy(){try{requestAnimationFrame(function(){requestAnimationFrame(function(){try{parent.postMessage({k1ready:1},"*");}catch(e){}});});}catch(e){try{parent.postMessage({k1ready:1},"*");}catch(x){}}}'+
 'if(document.readyState==="complete")rdy();else window.addEventListener("load",rdy);'+
 '})();<\/scr'+'ipt>';
function dress(ovId){ try{ const f=document.querySelector('#'+ovId+' iframe'); if(!f||f.dataset.k1) return; const src=f.srcdoc||''; if(!src) return;
  f.dataset.k1='1'; f.srcdoc=GAME_VOICE+GAME_CSS+src; }catch(e){} }
const TTS='https:'+'/'+'/'+'tts-q26c275eaa-uk.a.run.app';
const V={a:null,tok:0,cache:{}};
function hush(){ V.tok++; try{ if(V.a) V.a.pause(); }catch(e){} V.a=null; try{ window.speechSynthesis.cancel(); }catch(e){} }
function devVoice(t,done){ try{ const u=new SpeechSynthesisUtterance(t); u.rate=.92; u.pitch=1.1; u.onend=done; u.onerror=done; window.speechSynthesis.speak(u); }catch(e){ done(); } }
function voice(t,done){ hush(); const my=V.tok; let fin=false; const end=()=>{ if(fin) return; fin=true; done(); };
  const dev=()=>{ if(my===V.tok) devVoice(t,end); };
  const viaUrl=u=>{ if(my!==V.tok) return; const a=new Audio(u); V.a=a; a.onended=end; a.onerror=dev; const pr=a.play(); if(pr&&pr.catch) pr.catch(dev); };
  setTimeout(end,String(t).length*130+6000);
  if(V.cache[t]) return viaUrl(V.cache[t]);
  Promise.race([fetch(TTS,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:String(t).slice(0,300),voice:'teacher'})}).then(r=>r.json()).then(j=>{ if(j&&j.ok&&j.url){ V.cache[t]=j.url; return j.url; } throw new Error('tts'); }),
    new Promise((_,rej)=>setTimeout(()=>rej(new Error('slow')),1500))]).then(viaUrl).catch(dev); }
window.addEventListener('message',e=>{ const d=e.data; if(d&&typeof d==='object'&&d.k1ready){ OVS.forEach(id=>{ const f=document.querySelector('#'+id+' iframe'); if(f&&e.source===f.contentWindow) unshield(id); }); return; }
  if(!d||typeof d!=='object'||(d.k1say==null&&!d.k1hush)) return;
  const f=OVS.map(id=>document.querySelector('#'+id+' iframe')).find(x=>x&&e.source===x.contentWindow); if(!f) return;
  if(d.k1hush){ hush(); return; }
  const id=d.id; voice(String(d.k1say),()=>{ try{ f.contentWindow.postMessage({k1said:id},'*'); }catch(x){} }); });
K1O.voice=voice;

/* NEVER A WHITE GAME WINDOW (2026-11-23, HoS: on a real K Chromebook the game window stayed white for 20-30 s after PLAY):
   until the game page has really drawn (it says so through the voice bridge, k1ready), a bright "here comes your game" cover sits
   over the game. If the page has not drawn after 10 s it is loaded once more; after 25 s a big "Try again" opens the game afresh. */
function shield(ovId,id){ const ov=document.getElementById(ovId), f=ov&&ov.querySelector('iframe'); if(!f||ov.querySelector('.k1-wait')) return;
  const c=document.createElement('div'); c.className='k1-wait'; c.setAttribute('role','status'); c.style.top=(f.offsetTop||0)+'px';
  c.innerHTML='<div class="k1-wb">🎮</div><div class="k1-wt">Here comes your game!</div>'; ov.appendChild(c);
  const t1=setTimeout(()=>{ try{ if(c.isConnected&&f.isConnected){ const src=f.srcdoc; f.srcdoc=src; } }catch(e){} },10000);
  const t2=setTimeout(()=>{ if(!c.isConnected) return; c.insertAdjacentHTML('beforeend','<button class="k1-again" type="button">▶ Try again</button>');
    c.querySelector('.k1-again').onclick=()=>{ try{ const x=ov.querySelector('button'); if(x) x.click(); }catch(e){} try{ ov.remove(); }catch(e){} setTimeout(()=>play(id),50); }; },25000);
  c._t=[t1,t2]; }
function unshield(ovId){ const ov=document.getElementById(ovId), c=ov&&ov.querySelector('.k1-wait'); if(!c) return; (c._t||[]).forEach(clearTimeout);
  setTimeout(()=>{ c.classList.add('k1-gone'); setTimeout(()=>{ try{ c.remove(); }catch(e){} },300); },600); }
K1O.shown=ovId=>{ const ov=document.getElementById(ovId); return !!(ov&&!ov.querySelector('.k1-wait')); };
function play(id){ const p=subjects().find(x=>x.k===K1O.subj); if(!p||!window[p.g]||typeof window[p.g].open!=='function') return;
  try{ if(typeof SND!=='undefined'&&SND.tap) SND.tap(); }catch(e){}
  A.overlay=null; window[p.g].open(id); OVS.forEach(dress); OVS.forEach(ov=>shield(ov,id)); }

document.addEventListener('click',e=>{ const b=e.target&&e.target.closest&&e.target.closest('#k1o [data-k1]'); if(!b) return; e.preventDefault(); e.stopPropagation();
  const a=b.dataset.k1;
  if(a==='play') return play(b.dataset.id);
  if(a==='subj'){ K1O.subj=b.dataset.s; try{ if(typeof SND!=='undefined'&&SND.tap) SND.tap(); }catch(x){} paint(); return; }
  if(a==='locked'){ b.classList.remove('k1-no'); void b.offsetWidth; b.classList.add('k1-no'); try{ if(typeof speak==='function') speak('Play the game before it first!'); }catch(x){} return; }
  if(a==='say') sayHi(); },true);

/* ---------- hooks: every home redraw shows the shelf; no pop-ups; no level checks ---------- */
/* K1O.hook() can run again (K-1 FIRST, 2026-11-22: on a K-1 Chromebook this file loads FIRST, and the page calls K1O.hook() again
   once every other piece has loaded, so the shelf and the no-pop-up rules sit on top of anything those pieces added). Each hook is
   added only once per function (marked __k1). */
function hook(){
  const r0=window.render; if(typeof r0==='function'&&!r0.__k1){ const w=function(){ const r=r0.apply(this,arguments); try{ paint(); }catch(e){} return r; }; w.__k1=1; window.render=w; try{ render=w; }catch(e){} }
  const w0=window.welcome; if(typeof w0==='function'&&!w0.__k1){ const w=function(){ if(on()) return; return w0.apply(this,arguments); }; w.__k1=1; window.welcome=w; try{ welcome=w; }catch(e){} }
  const l0=window.tlLevelCheckFor; if(typeof l0==='function'&&!l0.__k1){ const w=function(){ if(on()) return null; return l0.apply(this,arguments); }; w.__k1=1; window.tlLevelCheckFor=w; }
  const f0=window.tlFindLevelCard; if(typeof f0==='function'&&!f0.__k1){ const w=function(){ if(on()) return ''; return f0.apply(this,arguments); }; w.__k1=1; window.tlFindLevelCard=w; } }
hook(); K1O.hook=hook;
const keepTick=()=>{ try{ if(!document.body||!document.body.classList.contains('k1-mode')||typeof A==='undefined') return;
  if(A.overlay&&A.view==='hub'){ A.overlay=null; render(); return; }
  const g=gameOpen(); if(K1O.wasGame&&!g){ try{ hush(); }catch(x){} } K1O.wasGame=g;
  if(document.body.classList.contains('k1-home')&&!g&&K1O.sig!==sig()) paint(); }catch(e){} };
keepTick.__k1keep=1;   /* always runs, also while the loader keeps the hidden big-boy home quiet (Speed.js, K-1 QUIET) */
setInterval(keepTick,1200);

/* ---------- the look ---------- */
try{ if(!document.getElementById('k1o-css')){ const c=document.createElement('style'); c.id='k1o-css'; c.textContent=`
body.k1-home > *:not(#k1o):not(#klov):not(#krov):not(#kkov):not(#kkov2):not(#g1mov):not(#g1rov){ display:none !important; }
#klov,#krov,#kkov,#kkov2,#g1mov,#g1rov{ z-index:2147483600 !important; }
.k1-wait{ position:absolute; left:0; right:0; bottom:0; z-index:5; background:linear-gradient(180deg,#C8ECFF,#FFF4D6); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; font:800 clamp(28px,5vw,48px) 'Fredoka','Nunito',system-ui,sans-serif; color:#2B2350; transition:opacity .3s; }
.k1-wait.k1-gone{ opacity:0; pointer-events:none; }
.k1-wb{ font-size:clamp(80px,16vh,150px); animation:k1wb .9s ease-in-out infinite alternate; } @keyframes k1wb{ from{ transform:translateY(0); } to{ transform:translateY(-20px); } }
.k1-again{ margin-top:10px; border:6px solid #fff; border-radius:40px; background:#22A85A; color:#fff; font:800 clamp(32px,5vw,52px) 'Fredoka','Nunito',system-ui,sans-serif; padding:18px 44px; box-shadow:0 8px 0 #17834F; cursor:pointer; }
body.k1-home{ overflow:hidden !important; background:#FFF4D6 !important; }
#k1o{ position:fixed; inset:0; z-index:2147483000; overflow-y:auto; background:linear-gradient(180deg,#8FD3FF 0%,#C8ECFF 45%,#FFF4D6 100%); font-family:'Fredoka','Nunito',system-ui,sans-serif; color:#2B2350; padding:14px clamp(12px,3vw,40px) 40px; box-sizing:border-box; }
#k1o button{ font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
.k1-top{ display:flex; align-items:center; gap:14px; max-width:1200px; margin:0 auto 12px; }
.k1-say{ width:76px; height:76px; border-radius:50%; border:0; background:#2FB5E8; color:#fff; font-size:34px; box-shadow:0 6px 0 #1E8DB8; flex:none; }
.k1-hi{ flex:1; text-align:center; font-size:clamp(30px,4.6vw,56px); font-weight:700; color:#2B2350; text-shadow:0 3px 0 rgba(255,255,255,.7); }
