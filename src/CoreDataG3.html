    'LANG.GRAM.L04.04':{name:"What Job Does It Do?", teach:[{"how": "A noun names a person, place or thing. A verb shows the action.", "q": "In \"Chaim reads,\" which word is the verb?", "o": ["reads", "Chaim", "none"]}, {"how": "An adjective describes a noun (red, tall). An adverb describes a verb: how, when or where (quickly, today, outside).", "q": "In \"Avi ran quickly,\" which word is the adverb?", "o": ["quickly", "ran", "Avi"]}, {"how": "The same word can do different jobs. Ask what it does in THIS sentence: \"a fast runner\" (adjective), \"he ran fast\" (adverb).", "q": "In \"Dovid ran fast,\" what job does \"fast\" do?", "o": ["adverb: tells how he ran", "adjective: describes Dovid", "noun: names a thing"]}], practice:[{"t": "sort", "q": "\"The tall boy kicked the red ball and jumped.\" Sort each word by its job.", "bins": [{"id": "0", "label": "Noun"}, {"id": "1", "label": "Verb"}, {"id": "2", "label": "Adjective"}], "items": [{"label": "boy", "bin": "0"}, {"label": "kicked", "bin": "1"}, {"label": "tall", "bin": "2"}, {"label": "ball", "bin": "0"}, {"label": "red", "bin": "2"}, {"label": "jumped", "bin": "1"}], "h": "Names it? Noun. Action? Verb. Describes a noun? Adjective."}, {"t": "sort", "q": "Sort: describes a noun, or describes a verb?", "bins": [{"id": "0", "label": "Adjective"}, {"id": "1", "label": "Adverb"}], "items": [{"label": "quiet", "bin": "0"}, {"label": "quietly", "bin": "1"}, {"label": "happy", "bin": "0"}, {"label": "softly", "bin": "1"}], "h": "Many adverbs end in -ly and tell how."}, {"t": "pairs", "q": "Match each word job to what it does.", "pairs": [["noun", "names a person, place or thing"], ["verb", "shows the action"], ["adjective", "describes a noun"], ["adverb", "tells how, when or where"]], "h": "Think about what each one tells."}, {"t": "spotall", "q": "\"Chaim jumped, laughed and ran home.\" Tap every verb.", "cells": [{"label": "jumped", "ok": true}, {"label": "laughed", "ok": true}, {"label": "ran", "ok": true}, {"label":     'LANG.GRAM.L04.05':{name:"Kindness and Courage", teach:[{"how": "A concrete noun is a thing you can see or touch: a hat, a shul.", "q": "Which noun can you touch?", "o": ["a siddur", "kindness", "courage"]}, {"how": "An abstract noun names an idea or a feeling you cannot touch: kindness, courage, joy, honesty.", "q": "Which is an abstract noun?", "o": ["honesty", "a ladder", "a cup"]}, {"how": "Many abstract nouns come from describing words: kind → kindness, brave → bravery, happy → happiness.", "q": "brave → ?", "o": ["bravery", "braved", "bravely"]}], practice:[{"t": "sort", "q": "Sort each noun.", "bins": [{"id": "0", "label": "Concrete (touch it)"}, {"id": "1", "label": "Abstract (cannot touch)"}], "items": [{"label": "hat", "bin": "0"}, {"label": "kindness", "bin": "1"}, {"label": "tree", "bin": "0"}, {"label": "joy", "bin": "1"}, {"label": "shul", "bin": "0"}, {"label": "courage", "bin": "1"}], "h": "Can you touch it? Concrete. An idea or feeling? Abstract."}, {"t": "pairs", "q": "Match each describing word to its abstract noun.", "pairs": [["kind", "kindness"], ["happy", "happiness"], ["honest", "honesty"], ["brave", "bravery"]], "h": "Add -ness, -y or -ry."}, {"t": "spotall", "q": "\"Chaim showed courage and kindness when he carried the heavy box for Zeidy.\" Tap every abstract noun.", "cells": [{"label": "courage", "ok": true}, {"label": "kindness", "ok": true}, {"label": "box", "ok": false}, {"label": "Zeidy", "ok": false}], "h": "You cannot touch an abstract noun."}, {"t": "sort", "q": "Mistake Detective: right, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "joy is abstract", "bin": "0"}, {"label": "a cookie is abstract", "bin": "1"}, {"label": "patience is abstract", "bin": "0"}, {"label": "a coat is abstract", "bin": "1"}], "h": "If you can touch it, it is concrete."}, {"t": "pairs", "q": "Match each clue to its abstract noun.", "pairs": [["You feel it when you laugh.", "joy"], ["You sh     'LANG.GRAM.L05.02':{name:"Was Running, Will Be Running", teach:[{"how": "A progressive verb shows an action that keeps going. It uses am, is, are, was, were or will be with an -ing verb.", "q": "Which shows an action that kept going?", "o": ["Yehuda was reading.", "Yehuda read.", "Yehuda reads."]}, {"how": "Past progressive: was or were + -ing (\"We were baking\"). Present progressive: am, is or are + -ing (\"I am baking\"). Future progressive: will be + -ing (\"We will be baking\").", "q": "\"Tomorrow at noon, we ___ challah.\"", "o": ["will be baking", "were baking", "are baking"]}, {"how": "Use was for one and were for many: \"Dovid was building\", \"The boys were building\".", "q": "\"The boys ___ building a robot.\"", "o": ["were", "was", "is"]}], practice:[{"t": "sort", "q": "Sort each verb by its time.", "bins": [{"id": "0", "label": "Past progressive"}, {"id": "1", "label": "Present progressive"}, {"id": "2", "label": "Future progressive"}], "items": [{"label": "was reading", "bin": "0"}, {"label": "is reading", "bin": "1"}, {"label": "will be reading", "bin": "2"}, {"label": "were singing", "bin": "0"}, {"label": "am singing", "bin": "1"}, {"label": "will be singing", "bin": "2"}], "h": "Was or were: past. Am, is, are: now. Will be: future."}, {"t": "order", "q": "Build the sentence with a past progressive verb.", "tiles": ["At eight o'clock,", "Binyamin", "was playing", "chess."], "h": "Time first, then who, then was + -ing."}, {"t": "pairs", "q": "Match each helper to when it is used.", "pairs": [["was", "one, in the past"], ["were", "many, in the past"], ["will be", "in the future"]], "h": "One or many? Past or future?"}, {"t": "sort", "q": "Mistake Detective: right helper, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "The boys were baking.", "bin": "0"}, {"label": "The boys was baking.", "bin": "1"}, {"label": "I am reading.", "bin": "0"}, {"label": "I is reading.", "bin": "1"}], "h":     'LANG.GRAM.L05.03':{name:"Can, May, Must", teach:[{"how": "Modal verbs are helpers that change the meaning: can (able to), may (allowed, or maybe), must (have to), should (a good idea).", "q": "Which modal means \"is able to\"?", "o": ["can", "must", "may"]}, {"how": "Must means there is no choice: \"We must wash before eating bread.\"", "q": "\"We ___ wash before hamotzi.\" There is no choice. Which fits?", "o": ["must", "may", "can"]}, {"how": "May can mean permission (\"May I go?\") or maybe (\"It may snow\").", "q": "In \"It may snow tonight,\" what does \"may\" mean?", "o": ["maybe", "allowed", "able to"]}], practice:[{"t": "pairs", "q": "Match each modal to its meaning.", "pairs": [["can", "able to"], ["may", "allowed, or maybe"], ["must", "have to"], ["should", "a good idea"]], "h": "Able, allowed, have to, or a good idea?"}, {"t": "sort", "q": "Sort each sentence by what the modal means.", "bins": [{"id": "0", "label": "Able to"}, {"id": "1", "label": "Have to"}, {"id": "2", "label": "Maybe"}], "items": [{"label": "Binyamin can play chess.", "bin": "0"}, {"label": "We must be on time.", "bin": "1"}, {"label": "It may rain.", "bin": "2"}, {"label": "Dovid can fix radios.", "bin": "0"}, {"label": "You must wear a helmet.", "bin": "1"}, {"label": "Zeidy may be late.", "bin": "2"}], "h": "Can: able. Must: no choice. May: maybe."}, {"t": "order", "q": "Build a polite question that asks to be allowed.", "tiles": ["May I", "borrow", "your flashlight?"], "h": "May I for asking to be allowed."}, {"t": "sort", "q": "Mistake Detective: does the modal fit the meaning?", "bins": [{"id": "0", "label": "Fits the meaning"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "No choice: you must.", "bin": "0"}, {"label": "No choice: you may.", "bin": "1"}, {"label": "Maybe rain: it may rain.", "bin": "0"}, {"label": "Maybe rain: it must rain.", "bin": "1"}], "h": "Must: no choice. May: maybe."}, {"t": "spotall", "q": "\"You should rest, and you must drink water, but y     'LANG.GRAM.L06.03':{name:"Time Signal", teach:[{"how": "Time words are clues. Yesterday and last week ask for the past; now and every day ask for the present; tomorrow and next week ask for the future.", "q": "\"Next week, Binyamin ___ in the tournament.\"", "o": ["will play", "played", "plays"]}, {"how": "Use had when it happened before another past action: \"By the time we arrived, the bus had left.\"", "q": "\"By the time we got there, the store ___.\"", "o": ["had closed", "closes", "will close"]}, {"how": "Keep the time clear for the reader: match each verb to its time word.", "q": "Which sentence matches its time word?", "o": ["Yesterday, Zeidy told a story.", "Yesterday, Zeidy tells a story.", "Yesterday, Zeidy will tell a story."]}], practice:[{"t": "sort", "q": "Sort each time word by the tense it asks for.", "bins": [{"id": "0", "label": "Past"}, {"id": "1", "label": "Present"}, {"id": "2", "label": "Future"}], "items": [{"label": "yesterday", "bin": "0"}, {"label": "every day", "bin": "1"}, {"label": "tomorrow", "bin": "2"}, {"label": "last week", "bin": "0"}, {"label": "right now", "bin": "1"}, {"label": "next year", "bin": "2"}], "h": "Already happened? Happening now? Not yet?"}, {"t": "pairs", "q": "Match each time word to its verb.", "pairs": [["yesterday", "played"], ["every day", "plays"], ["tomorrow", "will play"]], "h": "The time word picks the tense."}, {"t": "order", "q": "Build the sentence. The melting happened first.", "tiles": ["By the time", "Avrumi woke up,", "the snow", "had melted."], "h": "Had + the verb for what happened earlier."}, {"t": "sort", "q": "Mistake Detective: does the verb match the time word?", "bins": [{"id": "0", "label": "Matches"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "Last year, we visited Zeidy.", "bin": "0"}, {"label": "Last year, we visit Zeidy.", "bin": "1"}, {"label": "Tomorrow, we will bake.", "bin": "0"}, {"label": "Tomorrow, we baked.", "bin": "1"}], "h": "Find the time word, then check the verb."}, {"t": "spotall", "q": "\"Last Sunday, Dovid fixed the radio, and tomorrow he will fix the clock.\" Tap every time clue.", "cells": [{"label": "Last Sunday", "ok": true}, {"label": "tomorrow", "ok": true}, {"label": "radio", "ok": false}, {"label": "clock", "ok": false}], "h": "Time clues tell when."}, {"t": "order", "q": "Build it: an every-day action in the present.", "tiles": ["Every morning,", "Tzvi Hirsch", "helps", "at the bakery."], "h": "Every morning asks for the present."}], check:[{"q": "\"Every Friday, Shimmy ___ the challah to Bubby, and she always smiles.\"", "o": ["brings", "brought", "will bring"]}, {"q": "\"Last Chanukah, our class ___ a play for the parents.\"", "o": ["performed", "performs", "will perform"]}, {"q": "\"By the time Tatty got home, the boys ___ the whole sukkah.\"", "o": ["had built", "build", "will build"]}], re:[{"q": "\"Every day\" asks for which tense?", "o": ["present", "past", "future"], "h": "It keeps happening."}, {"q": "\"Yesterday we ___ challah.\"", "o": ["baked", "bake", "will bake"], "h": "Yesterday is past."}, {"q": "\"Next year Avrumi ___ in Grade 6.\"", "o": ["will be", "was", "is"], "h": "Next year is future."}]},
    'LANG.GRAM.L06.04':{name:"Tense Shift Fix", teach:[{"how": "A tense shift is when the time jumps for no reason: \"Dovid opened the box and finds a key.\" It is a mistake.", "q": "What is wrong with \"Dovid opened the box and finds a key\"?", "o": ["the tense shifts from past to present", "it needs a comma", "it has no verb"]}, {"how": "To fix it, keep every verb in the story's time: \"Dovid opened the box and found a key.\"", "q": "Fix: \"We walked to shul and sit in the front.\"", "o": ["We walked to shul and sat in the front.", "We walk to shul and sat in the front.", "We walked to shul and will sit in the front."]}, {"how": "A shift is right when the time really changes: \"Yesterday I lost it, but now I have it.\"", "q": "Which shift is right because the time really changes?", "o": ["I was sick yesterday, but today I feel fine.", "I was sick yesterday and I feel sick yesterday.", "I am sick yesterday."]}], practice:[{"t": "sort", "q": "Sort: does the time stay the same?", "bins": [{"id": "0", "label": "Stays in time"}, {"id": "1", "label": "Shifts"}], "items": [{"label": "Avrumi drew the map and hid it.", "bin": "0"}, {"label": "Avrumi drew the map and hides it.", "bin": "1"}, {"label": "The tide rose and covered the rocks.", "bin": "0"}, {"label": "The tide rises and covered the rocks.", "bin": "1"}], "h": "Check every verb against the first one."}, {"t": "pairs", "q": "Match each shift to its fix.", "pairs": [["He opened it and finds a key.", "He opened it and found a key."], ["We walk in and sat down.", "We walked in and sat down."], ["The tide rises and covered the rocks.", "The tide rose and covered the rocks."]], "h": "Keep every verb in the story's time."}, {"t": "order", "q": "Fix \"Binyamin moved his knight and wins the game.\"", "tiles": ["Binyamin moved his knight", "and", "won the game."], "h": "Moved is past, so wins becomes won."}, {"t": "sort", "q": "Mistake Detective: is the shift right?", "bins": [{"id": "0", "label": "Right shift"}, {"id": "1", "label": "Wrong shift"}], "items": [{"label": "Yesterday I lost it, but now I have it.", "bin": "0"}, {"label": "I lost it and now I had it.", "bin": "1"}, {"label": "Last year I was small, but now I am tall.", "bin": "0"}, {"label": "Last year I was small and now I was tall.", "bin": "1"}], "h": "A shift is right only when the time really changes."}, {"t": "spotall", "q": "\"Avrumi drew the map, adds a red X, and hid it.\" Tap the verb that shifts.", "cells": [{"label": "adds", "ok": true}, {"label": "drew", "ok": false}, {"label": "hid", "ok": false}, {"label": "map", "ok": false}], "h": "Two verbs are past. Find the one that is not."}, {"t": "order", "q": "Fix \"Reb Shimon lit the lamp and climbs the stairs.\"", "tiles": ["Reb Shimon", "lit the lamp", "and", "climbed the stairs."], "h": "Lit is past, so climbs becomes climbed."}], check:[{"q": "\"The storm shook the lighthouse, and the boys hide in the cellar.\" What is wrong?", "o": ["the tense shifts from past to present", "it is a run-on", "nothing"]}, {"q": "How do you fix a tense shift?", "o": ["keep every verb in the story's time", "add a comma", "start a new paragraph"]}, {"q": "Why is the shift in \"Last night I was tired, but now I feel great\" right?", "o": ["the time really changes", "it is a question", "it has a comma"]}], re:[{"q": "Which stays in one time?", "o": ["We baked and ate.", "We bake and ate.", "We baked and eat."], "h": "Both past."}, {"q": "Fix \"Tzvi Hirsch ran and grabs the tray.\"", "o": ["Tzvi Hirsch ran and grabbed the tray.", "Tzvi Hirsch runs and grabbed the tray.", "Tzvi Hirsch ran and will grab the tray."], "h": "Ran is past."}, {"q": "\"I was cold yesterday, but today I am warm.\" Is the shift right?", "o": ["yes", "no", "only with will"], "h": "The time really changes."}]},
    'LANG.SENT.L07.01':{name:"Sentence Combining Lab", teach:[{"how": "Combine three short sentences into one: keep the most important idea as the main clause and tuck the rest in.", "q": "Combine: \"The fundraiser raised $500. It was the Beacon's idea. It helped a family in need.\"", "o": ["The fundraiser, the Beacon's idea, raised $500 to help a family in need.", "The fundraiser raised $500 it was the Beacon's idea it helped.", "The Beacon's idea raised. The fundraiser helped."]}, {"how": "Four tools: an appositive (renames), a who or which clause (adds a fact), a phrase (when, where, how, why), and a joining word (and, but, so, because).", "q": "Which tool adds \"who checks every fact\" to \"Akiva edited the story\"?", "o": ["a who clause", "a joining word", "a phrase"]}, {"how": "Check the combine: one sentence, nothing lost, nothing repeated, and the main clause holds the most important idea.", "q": "What should the main clause hold?", "o": ["the most important idea", "the shortest fact", "the last sentence"]}], practice:[{"t": "pairs", "q": "Match each tool to an example.", "pairs": [["appositive", "Akiva, our editor,"], ["who clause", "Akiva, who checks every fact,"], ["phrase", "after the meeting"], ["joining word", "so"]], "h": "Renames? Adds a fact with who? Tells when? Joins?"}, {"t": "order", "q": "Combine: \"Gavriel won a prize. He took the photos. It was at the fair.\"", "tiles": ["Gavriel,", "who took the photos,", "won a prize", "at the fair."], "h": "Main idea, with the who clause after Gavriel and the phrase at the end."}, {"t": "sort", "q": "Mistake Detective: combined well, or a mistake?", "bins": [{"id": "0", "label": "Combined well"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "Eli, our sports writer, interviewed the coach after the game.", "bin": "0"}, {"label": "Eli, our sports writer, interviewed the coach, Eli did it after the game.", "bin": "1"}, {"label": "Benny found a letter in the archive.", "bin": "0"}, {"label": "Benny found a letter, it was in the archive.", "bin": "1"}], "h": "Nothing repeated, no comma splices."}, {"t": "sort", "q": "\"Yoni interviewed the custodian. The custodian has worked here 30 years. It was on Tuesday.\" Sort the parts.", "bins": [{"id": "0", "label": "Main idea"}, {"id": "1", "label": "Extra detail"}], "items": [{"label": "Yoni interviewed the custodian", "bin": "0"}, {"label": "who has worked here 30 years", "bin": "1"}, {"label": "on Tuesday", "bin": "1"}], "h": "The main idea is what the sentence is really about."}, {"t": "spotall", "q": "\"Akiva, our editor, and Gavriel, who loves maps, met after the game.\" Tap every tucked-in part.", "cells": [{"label": "our editor", "ok": true}, {"label": "who loves maps", "ok": true}, {"label": "after the game", "ok": true}, {"label": "Akiva", "ok": false}], "h": "Appositives, who clauses and phrases are tucked in."}, {"t": "order", "q": "Combine: \"The printer jammed. The Beacon came out late. Nobody minded.\"", "tiles": ["Because the printer jammed,", "the Beacon", "came out late,", "but nobody minded."], "h": "Because part first, then the main clause, then but."}], check:[{"q": "Combine: \"Shimmy fixed the printer. He is our tech helper. He did it before lunch.\"", "o": ["Shimmy, our tech helper, fixed the printer before lunch.", "Shimmy fixed the printer, he is our tech helper, before lunch.", "Shimmy, our tech helper, fixed the printer, Shimmy did it before lunch."]}, {"q": "Notes: \"The Beacon won an award. It is our school paper. The award was for best layout.\" Which keeps the main idea in the main clause?", "o": ["The Beacon, our school paper, won an award for best layout.", "The Beacon, which won an award for best layout, is our school paper.", "The award was for best layout, and the Beacon is our school paper."]}, {"q": "In \"Reb Yosef, the custodian, found the old photos,\" which tool is \"the custodian\"?", "o": ["an appositive", "a who clause", "a joining word"]}], re:[{"q": "Which tool tells when?", "o": ["a phrase like \"after the meeting\"", "an appositive", "a who clause"], "h": "Phrases tell when, where, how."}, {"q": "Which is combined well?", "o": ["Akiva, our editor, smiled.", "Akiva smiled, Akiva is our editor.", "Akiva our editor, smiled."], "h": "Nothing repeated."}, {"q": "Which tool joins two whole sentences?", "o": ["a joining word like so", "an appositive", "a phrase"], "h": "And, but, so, because."}]},
    'LANG.SENT.L07.02':{name:"Kernel to Masterpiece", teach:[{"how": "A kernel is the smallest sentence: \"The crowd cheered.\" Expand it by answering questions: who, what kind, when, where, why, how.", "q": "Which expansion answers WHY?", "o": ["because the team scored", "in the gym", "loudly"]}, {"how": "Choose details that add meaning, not just length. \"Very very loudly\" adds little; \"when Eli scored the winning point\" adds a lot.", "q": "Which detail adds the most meaning to \"The crowd cheered\"?", "o": ["when Eli scored the winning point", "very very loudly", "in a way that was loud"]}, {"how": "Keep it clear: put each detail next to what it tells about, and put a comma after a long opening part.", "q": "Which is clear?", "o": ["After the long debate, the judges announced the winner.", "The judges announced after the long debate, the winner.", "After, the long debate the judges announced the winner."]}], practice:[{"t": "sort", "q": "Sort each detail by the question it answers.", "bins": [{"id": "0", "label": "When"}, {"id": "1", "label": "Where"}, {"id": "2", "label": "Why"}], "items": [{"label": "after the debate", "bin": "0"}, {"label": "in the gym", "bin": "1"}, {"label": "because the team scored", "bin": "2"}, {"label": "during the storm", "bin": "0"}, {"label": "at the printer", "bin": "1"}, {"label": "so the paper would be ready", "bin": "2"}], "h": "Time, place, or reason?"}, {"t": "order", "q": "Expand \"The judges announced the winner\" with when and where.", "tiles": ["After the long debate,", "the judges", "announced the winner", "in the gym."], "h": "Long opening, comma, kernel, then where."}, {"t": "sort", "q": "Mistake Detective: does the detail add meaning, or just length?", "bins": [{"id": "0", "label": "Adds meaning"}, {"id": "1", "label": "Just length"}], "items": [{"label": "when Eli scored the winning point", "bin": "0"}, {"label": "very very loudly", "bin": "1"}, {"label": "to raise money for a family in need", "bin": "0"}, {"label": "in a way that was nice", "bin": "1"}], "h": "Would the reader learn something new?"}, {"t": "pairs", "q": "Match each question to its detail.", "pairs": [["when?", "during the storm"], ["where?", "at the printer"], ["why?", "so the paper would be ready"]], "h": "Time, place, reason."}, {"t": "spotall", "q": "\"The packed crowd cheered when Eli scored.\" Tap every detail added to the kernel.", "cells": [{"label": "packed", "ok": true}, {"label": "when Eli scored", "ok": true}, {"label": "crowd", "ok": false}, {"label": "cheered", "ok": false}], "h": "The kernel is \"The crowd cheered\". Everything else was added."}, {"t": "order", "q": "Expand \"The editors stayed late\" with a reason, at the front.", "tiles": ["Because the deadline was close,", "the editors", "stayed late."], "h": "Because part, comma, kernel."}], check:[{"q": "Kernel: \"The boys davened.\" Which expansion adds the most meaning?", "o": ["The boys davened with extra feeling because Zeidy was sick.", "The boys davened very, very much.", "The boys davened, and they davened a lot."]}, {"q": "Which expansion is clear?", "o": ["During the storm, the editors finished the paper.", "The editors finished during the storm, the paper.", "During, the storm the editors finished the paper."]}, {"q": "\"The bus left early so the boys would reach the siyum.\" What does \"so the boys would reach the siyum\" tell?", "o": ["why", "where", "when"]}], re:[{"q": "Which answers WHEN?", "o": ["after the meeting", "in the archive", "because it rained"], "h": "A time."}, {"q": "Which is just length?", "o": ["very very quickly", "before the deadline", "in the gym"], "h": "It adds little."}, {"q": "Which is clear?", "o": ["In the archive, Benny found a letter.", "Benny found in the archive, a letter.", "In, the archive Benny found a letter."], "h": "Comma after the opening part."}]},
    'LANG.MECH.L08.01':{name:"Coordinate Adjectives", teach:[{"how": "Coordinate adjectives describe a noun equally. Put a comma between them: \"a long, quiet night\".", "q": "Which pair of adjectives describes the noun equally?", "o": ["long and quiet in \"a long quiet night\"", "three and old in \"three old books\"", "bright and red in \"a bright red car\""]}, {"how": "Test 1, the \"and\" test: put \"and\" between them. \"A long and quiet night\" sounds right, so use a comma.", "q": "Can you say \"a cold and windy day\"?", "o": ["yes, so use a comma", "no, so no comma", "only in a question"]}, {"how": "Test 2, the switch test: switch them. \"A quiet, long night\" still works. If \"and\" or switching sounds wrong (\"three and old books\"), no comma.", "q": "Why no comma in \"three old books\"?", "o": ["\"three and old books\" sounds wrong", "three is a verb", "old is a noun"]}], practice:[{"t": "sort", "q": "Sort: do these adjectives need a comma between them?", "bins": [{"id": "0", "label": "Comma"}, {"id": "1", "label": "No comma"}], "items": [{"label": "a long quiet night", "bin": "0"}, {"label": "three old books", "bin": "1"}, {"label": "a cold windy day", "bin": "0"}, {"label": "a bright red car", "bin": "1"}, {"label": "a kind patient rebbe", "bin": "0"}, {"label": "two small boys", "bin": "1"}], "h": "Use the \"and\" test and the switch test."}, {"t": "order", "q": "Build it with the comma in the right place.", "tiles": ["It was", "a cold,", "windy", "morning."], "h": "The comma goes between the two equal describers."}, {"t": "pairs", "q": "Match each test to its example.", "pairs": [["the \"and\" test", "a long and quiet night"], ["the switch test", "a quiet, long night"], ["a number first", "no comma: three old books"]], "h": "Say it with and, then switch it."}, {"t": "sort", "q": "Mistake Detective: is the comma right?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "a happy, healthy baby", "bin": "0"}, {"label": "three, old books", "bin": "1"}, {"label": "a smart, careful editor", "bin": "0"}, {"label": "a bright, red car", "bin": "1"}], "h": "Use both tests on each pair."}, {"t": "spotall", "q": "Tap every phrase that needs a comma.", "cells": [{"label": "a careful honest editor", "ok": true}, {"label": "a cold dark night", "ok": true}, {"label": "two tall players", "ok": false}, {"label": "a dark blue coat", "ok": false}], "h": "If \"and\" fits and switching works, add a comma."}, {"t": "order", "q": "Build it with the comma in the right place.", "tiles": ["Akiva is", "a careful,", "honest", "editor."], "h": "Equal describers get a comma between them."}], check:[{"q": "Which phrase needs a comma between the adjectives?", "o": ["a warm friendly smile", "four warm rolls", "a light green shirt"]}, {"q": "Which phrase is punctuated correctly?", "o": ["a long, boring wait", "a navy, blue tie", "several, new sefarim"]}, {"q": "Does \"a soft warm blanket\" need a comma?", "o": ["yes: \"soft and warm\" works, and they switch", "no: never put a comma between adjectives", "no: warm is a color"]}], re:[{"q": "Does \"a warm sunny day\" need a comma?", "o": ["yes", "no", "only at the end"], "h": "Warm and sunny: yes."}, {"q": "Does \"two red apples\" need a comma?", "o": ["no", "yes", "only before apples"], "h": "Two and red sounds wrong."}, {"q": "Which test switches the adjectives?", "o": ["the switch test", "the \"and\" test", "the capital test"], "h": "Switch them."}]},
    'LANG.GRAM.L09.05':{name:"If I Were", teach:[{"how": "Verb mood shows the speaker's attitude. Indicative states a fact: \"The paper comes out Friday.\" Imperative gives a command: \"Check every fact.\"", "q": "\"Check every fact before printing.\" What mood is it?", "o": ["imperative", "indicative", "subjunctive"]}, {"how": "Interrogative asks a question: \"Did you check the facts?\" Conditional says what would happen: \"If we printed early, we would sleep more.\"", "q": "\"If the printer worked, we would finish tonight.\" What mood is \"we would finish\"?", "o": ["conditional", "imperative", "indicative"]}, {"how": "Subjunctive shows a wish or something not true, and uses were for every subject: \"If I were the editor...\"; \"I wish he were here.\"", "q": "Which uses the subjunctive correctly?", "o": ["If I were the editor, I would add a puzzle page.", "If I was the editor, I would add a puzzle page.", "If I am the editor, I would add a puzzle page."]}], practice:[{"t": "sort", "q": "Sort each sentence by its mood.", "bins": [{"id": "0", "label": "Indicative"}, {"id": "1", "label": "Imperative"}, {"id": "2", "label": "Subjunctive"}], "items": [{"label": "The issue is ready.", "bin": "0"}, {"label": "Print the issue.", "bin": "1"}, {"label": "I wish the issue were ready.", "bin": "2"}, {"label": "Eli writes sports.", "bin": "0"}, {"label": "Send the photos.", "bin": "1"}, {"label": "If only Eli were here.", "bin": "2"}], "h": "Fact? Command? A wish or not true?"}, {"t": "pairs", "q": "Match each mood to its job.", "pairs": [["indicative", "states a fact"], ["imperative", "gives a command"], ["interrogative", "asks a question"], ["conditional", "what would happen"]], "h": "State, command, ask, or would?"}, {"t": "order", "q": "Build a subjunctive wish.", "tiles": ["If I", "were", "the menahel,", "I would give", "a free day."], "h": "Not true, so were: If I were."}, {"t": "sort", "q": "Mistake Detective: right subjunctive, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "If I were taller", "bin": "0"}, {"label": "If I was taller", "bin": "1"}, {"label": "I wish he were here", "bin": "0"}, {"label": "I wish he was here", "bin": "1"}], "h": "A wish or not-true idea takes were."}, {"t": "spotall", "q": "Tap every interrogative sentence.", "cells": [{"label": "Did you check the facts?", "ok": true}, {"label": "Who took the photos?", "ok": true}, {"label": "Check the facts.", "ok": false}, {"label": "The facts are checked.", "ok": false}], "h": "Interrogative asks a question."}, {"t": "order", "q": "Build an interrogative sentence.", "tiles": ["Did you", "send", "the photos?"], "h": "A question starts with a helper like did."}], check:[{"q": "\"Please hand in your story by Thursday.\" What mood is it?", "o": ["imperative", "indicative", "conditional"]}, {"q": "\"Gavriel wishes he ___ at the game.\" Which is subjunctive?", "o": ["were", "was", "is"]}, {"q": "\"If the vote were tied, the editor would decide.\" What mood is \"would decide\"?", "o": ["conditional", "imperative", "interrogative"]}], re:[{"q": "\"The Beacon comes out Friday.\" What mood?", "o": ["indicative", "imperative", "subjunctive"], "h": "A fact."}, {"q": "\"If I ___ you, I would ask.\" Which fits?", "o": ["were", "was", "am"], "h": "Not true: were."}, {"q": "\"Who wrote this?\" What mood?", "o": ["interrogative", "imperative", "conditional"], "h": "It asks."}]},
    'LANG.GRAM.L09.06':{name:"Shift Check", teach:[{"how": "A shift in voice jumps from active to passive for no reason: \"Akiva checked the facts, and the headline was written by him.\"", "q": "What is wrong with \"Akiva checked the facts, and the headline was written by him\"?", "o": ["it shifts from active to passive", "it shifts from past to future", "nothing"]}, {"how": "To fix a shift in voice, keep both parts active: \"Akiva checked the facts and wrote the headline.\"", "q": "Which fixes it?", "o": ["Akiva checked the facts and wrote the headline.", "The facts were checked, and Akiva wrote the headline.", "Akiva checked the facts, and the headline was written."]}, {"how": "A shift in mood jumps from a command to a statement: \"Check every fact, and you should print it.\" Fix: keep both commands: \"Check every fact, and then print it.\"", "q": "What is wrong with \"Read the draft, and you should sign your name\"?", "o": ["it shifts from imperative to indicative", "it shifts from active to passive", "nothing"]}], practice:[{"t": "sort", "q": "Sort: steady, or does it shift?", "bins": [{"id": "0", "label": "Steady"}, {"id": "1", "label": "Shifts"}], "items": [{"label": "Benny wrote the story and took the photos.", "bin": "0"}, {"label": "Benny wrote the story, and the photos were taken by him.", "bin": "1"}, {"label": "Open the archive and dust the shelves.", "bin": "0"}, {"label": "Open the archive, and you should dust the shelves.", "bin": "1"}], "h": "Check voice (active/passive) and mood (command/statement)."}, {"t": "sort", "q": "Which kind of shift is it?", "bins": [{"id": "0", "label": "Shift in voice"}, {"id": "1", "label": "Shift in mood"}], "items": [{"label": "Eli wrote it, and it was edited by him.", "bin": "0"}, {"label": "Print it, and you should fold it.", "bin": "1"}, {"label": "Yoni asked, and answers were given by him.", "bin": "0"}, {"label": "Call the menahel, and you should thank him.", "bin": "1"}], "h": "Active to passive? Or command to statement?"}, {"t": "pairs", "q": "Match each shift to its fix.", "pairs": [["Eli wrote it, and it was edited by him.", "Eli wrote and edited it."], ["Print it, and you should fold it.", "Print it and fold it."], ["Yoni asked, and answers were given by him.", "Yoni asked and answered."]], "h": "Keep both parts the same."}, {"t": "order", "q": "Fix: \"Gavriel took the photos, and the captions were written by him.\"", "tiles": ["Gavriel", "took the photos", "and", "wrote the captions."], "h": "Keep both parts active."}, {"t": "sort", "q": "Mistake Detective: is the shift really fixed?", "bins": [{"id": "0", "label": "Fixed"}, {"id": "1", "label": "Still shifts"}], "items": [{"label": "Akiva checked and printed it.", "bin": "0"}, {"label": "Akiva checked it, and it was printed.", "bin": "1"}, {"label": "Read the draft and sign your name.", "bin": "0"}, {"label": "Read the draft, and you should sign your name.", "bin": "1"}], "h": "Both parts must match in voice and mood."}, {"t": "order", "q": "Fix: \"Open the archive, and you should dust the shelves.\"", "tiles": ["Open the archive", "and", "dust the shelves."], "h": "Keep both parts as commands."}], check:[{"q": "\"Benny wrote the story, and the photos were taken by Gavriel.\" What kind of shift?", "o": ["a shift in voice", "a shift in mood", "no shift"]}, {"q": "\"Sweep the porch, and you should water the plants.\" What kind of shift?", "o": ["a shift in mood", "a shift in voice", "no shift"]}, {"q": "Fix: \"Yitzy baked the challah, and the table was set by him.\"", "o": ["Yitzy baked the challah and set the table.", "The challah was baked, and Yitzy set the table.", "Yitzy baked the challah, and the table was set."]}], re:[{"q": "Which is steady?", "o": ["Eli wrote and edited it.", "Eli wrote it, and it was edited by him.", "Write it, and you should edit it."], "h": "Both active."}, {"q": "\"Print it, and you should fold it.\" Fix:", "o": ["Print it and fold it.", "It is printed and folded by you.", "You print it, and fold it!"], "h": "Both commands."}, {"q": "Active to passive in one sentence is a shift in...", "o": ["voice", "mood", "tense"], "h": "Active and passive are voice."}]}

  BITE['LANG.GRAM.L03.03'] = {"band": "B23", "pic": "🐦", "today": "Name a whole group with one word", "why": "One group word says a lot: a team, a class, a family.", "ready": [{"q": "Which word means more than one?", "o": ["boys", "boy", "box"], "a": "boys"}], "bridge": "LANG.GRAM.L02.01", "bridgeName": "One or Many", "watch": {"q": "a flock of birds", "m": {"type": "tiles", "w": ["a", "flock", "of birds"], "hi": [1]}, "steps": [{"t": "Many birds flying together make one group. The group word is flock.", "m": {"type": "tiles", "w": ["a", "flock", "of birds"], "hi": [1]}}, {"t": "Each group has its own word: a herd of cows, a swarm of bees.", "m": {"type": "tiles", "w": ["a", "swarm", "of bees"], "hi": [1]}}, {"t": "One group is one thing, so we say: The flock is flying."}, {"t": "Sing the group song: flap, stomp and buzz!", "m": {"type": "chant", "lines": ["Flock of birds and herd of cows,", "Swarm of bees, all buzzing now!", "Team and class and family too,", "One group word will do for you!"]}}], "a": "A flock is a group of birds."}, "oops": {"q": "a ___ of bees", "wrong": "herd", "right": "swarm", "why": "Herd is for cows. Bees fly together in a swarm."}, "ways": ["worked example", "song with movement", "match", "sort", "build with tiles", "Mistake Detective"], "done": "You can name a whole group with one word!", "board": {"one": "A collective noun names a whole group as one thing, and it takes is.", "activity": "Boys act out a group (flock, herd, choir); the class names the group word.", "mistakes": ["The wrong group word (a herd of bees)", "Saying \"the team are\"", "Calling one member a group"]}, "do": [{"type": "match", "pairs": [["flock", "birds"], ["herd", "cows"], ["swarm", "bees"]], "say": "Match each group word to its group.", "how": "Flying, mooing or buzzing?"}, {"type": "sort", "mis": true, "bins": ["Right word", "Mistake"], "cards": [["a flock of birds", 0], ["a herd of bees", 1], ["a team of players", 0], ["a swarm of cows", 1]], "say": "Mistake Detective! Right group word, or a mistake?", "how": "Each group has its own word."}], "your": [{"type": "tiles", "w": ["A flock", "of birds", "flew over", "the shul."], "extra": ["A herd"], "say": "Build it. Use the group word for birds.", "how": "Birds fly in a flock."}, {"type": "sort", "bins": ["Group word", "One thing"], "cards": [["class", 0], ["boy", 1], ["family", 0], ["brother", 1], ["crowd", 0], ["chair", 1]], "say": "A whole group, or one thing?", "how": "A group word names many as one."}, {"type": "match", "pairs": [["a choir of", "singers"], ["a stack of", "sefarim"], ["a bunch of", "grapes"]], "say": "Match each start to its ending.", "how": "Read them together."}, {"type": "tiles", "w": ["The class", "is", "davening."], "extra": ["are"], "say": "Build it. One group takes is.", "how": "The class is one group."}, {"type": "sort", "bins": ["is", "are"], "cards": [["The team ___ ready.", 0], ["The players ___ ready.", 1], ["The family ___ home.", 0], ["The cousins ___ home.", 1]], "say": "Is or are? One group, or many?", "how": "A group word is one: is."}]};
  BITE['LANG.GRAM.L03.04'] = {"band": "B23", "pic": "🪞", "today": "Use myself, himself and themselves", "why": "-self words point back to the one who did it.", "ready": [{"q": "\"Eli washed the car.\" Who did the washing?", "o": ["Eli", "the car", "the soap"], "a": "Eli"}], "watch": {"q": "Eli washed himself.", "m": {"type": "tiles", "w": ["Eli", "washed", "himself."], "hi": [2]}, "steps": [{"t": "Eli washed Eli. So we say: Eli washed himself.", "m": {"type": "tiles", "w": ["Eli", "washed", "himself."], "hi": [0, 2]}}, {"t": "Match the doer: I → myself. I washed myself.", "m": {"type": "tiles", "w": ["I", "washed", "myself."], "hi": [2]}}, {"t": "Many doers: we → ourselves, they → themselves. They washed themselves.", "m": {"type": "tiles", "w": ["They", "washed", "themselves."], "hi": [2]}}, {"t": "Careful: hisself and theirselves are not real words."}, {"t": "Point as you chant with me!", "m": {"type": "chant", "lines": ["Point to me: myself!", "Point to him: himself!", "Point to us: ourselves!", "Point to them: themselves!"]}}], "a": "Eli washed himself."}, "oops": {"q": "The boys washed ___.", "wrong": "theirselves", "right": "themselves", "why": "Theirselves is not a real word. Many boys → themselves."}, "ways": ["worked example", "chant with pointing", "match", "sort", "build with tiles", "Mistake Detective"], "done": "You can use myself, himself and themselves!", "board": {"one": "Reflexive = -self/-selves, points back to the doer. I-myself, he-himself, we-ourselves, they-themselves.", "activity": "Pointing game: the teacher says a doer, boys point and say the -self word.", "mistakes": ["hisself", "theirselves", "myself for a different doer"]}, "do": [{"type": "match", "pairs": [["I", "myself"], ["he", "himself"], ["they", "themselves"]], "say": "Match each doer to its -self word.", "how": "One: -self. Many: -selves."}, {"type": "sort", "mis": true, "bins": ["Right", "Mistake"], "cards": [["He saw himself in the mirror.", 0], ["He saw hisself in the mirror.",   BITE['LANG.GRAM.L04.04'] = {"band": "B23", "pic": "🧰", "today": "Find the job each word does", "why": "Knowing word jobs helps you build and fix any sentence.", "ready": [{"q": "Which word is an action?", "o": ["jump", "table", "green"], "a": "jump"}], "bridge": "LANG.GRAM.L01.02", "bridgeName": "Action Words", "watch": {"q": "The tall boy kicked the ball quickly.", "m": {"type": "tiles", "w": ["The", "tall", "boy", "kicked", "the ball", "quickly."], "hi": [3]}, "steps": [{"t": "Find the action first: kicked. That is the verb.", "m": {"type": "tiles", "w": ["The", "tall", "boy", "kicked", "the ball", "quickly."], "hi": [3]}}, {"t": "Who kicked? The boy. Boy names a person: a noun.", "m": {"type": "tiles", "w": ["The", "tall", "boy", "kicked", "the ball", "quickly."], "hi": [2]}}, {"t": "What kind of boy? Tall. Tall describes a noun: an adjective.", "m": {"type": "tiles", "w": ["The", "tall", "boy", "kicked", "the ball", "quickly."], "hi": [1]}}, {"t": "How did he kick? Quickly. It describes the verb: an adverb.", "m": {"type": "tiles", "w": ["The", "tall", "boy", "kicked", "the ball", "quickly."], "hi": [5]}}, {"t": "Act out each job with me!", "m": {"type": "move", "t": "Noun: point! Verb: jump! Adjective: draw a shape! Adverb: zoom your hand!"}}], "a": "kicked = verb, boy = noun, tall = adjective, quickly = adverb"}, "oops": {"q": "\"Dovid ran fast.\" What is \"fast\"?", "wrong": "an adjective, because it can describe things", "right": "an adverb: it tells how he ran", "why": "Ask what it does in this sentence. Here fast tells how he ran."}, "ways": ["worked example", "movement", "sort", "match", "build with tiles", "Mistake Detective"], "done": "You can find the job each word does!", "board": {"one": "Noun names, verb acts, adjective describes a noun, adverb tells how, when or where.", "activity": "Word cards on the board; boys move each card under its job, then act it out.", "mistakes": ["Calling every -ly word an adjective", "Judging by the word, not by its job", "Missing the verb"]}, "do": [{"type": "match", "pairs": [["noun", "names a person, place or thing"], ["verb", "shows the action"], ["adjective", "describes a noun"], ["adverb", "tells how, when or where"]], "say": "Match each word job to what it does.", "how": "Think about what each one tells."}, {"type": "sort", "mis": true, "bins": ["Right job", "Mistake"], "cards": [["ran quickly: quickly is an adverb", 0], ["a quick snack: quick is an adverb", 1], ["a fast runner: fast is an adjective", 0], ["he ran fast: fast is an adjective", 1]], "say": "Mistake Detective! Is the job named right?", "how": "Ask what the word does in this sentence."}], "your": [{"type": "tiles", "w": ["The", "happy", "baby", "laughed", "loudly."], "extra": ["happily"], "say": "Build it: adjective, noun, verb, adverb.", "how": "The happy baby, then the action, then how."}, {"type": "sort", "q": "The tall boy kicked the red ball.", "bins": ["Noun", "Verb", "Adjective"], "cards": [["boy", 0], ["kicked", 1], ["tall", 2], ["ball", 0], ["red", 2]], "say": "Sort each word by its job.", "how": "Names it, does it, or describes a noun?"}, {"type": "match", "pairs": [["shul", "noun"], ["davened", "verb"], ["gently", "adverb"]], "say": "Match each word to its job.", "how": "A place, an action, or how?"}, {"type": "sort", "bins": ["Adjective", "Adverb"], "cards": [["quiet", 0], ["quietly", 1], ["happy", 0], ["softly", 1]], "say": "Describes a noun, or a verb?", "how": "Many adverbs end in -ly."}, {"type": "tiles", "w": ["Carefully,", "Chaim", "glued", "the broken wing."], "extra": ["Careful,"], "say": "Build it. Start with the adverb.", "how": "How did he glue? Carefully."}]};
  BITE['LANG.GRAM.L04.05'] = {"band": "B23", "pic": "💛", "today": "Find nouns you cannot touch", "why": "Kindness and courage are real, even though you cannot hold them.", "ready": [{"q": "Which word is a noun?", "o": ["shul", "run", "big"], "a": "shul"}], "bridge": "LANG.GRAM.L01.01", "bridgeName": "Naming Words", "watch": {"q": "Chaim showed kindness.", "m": {"type": "tiles", "w": ["Chaim", "showed", "kindness."], "hi": [2]}, "steps": [{"t": "Kindness is a noun: it names something.", "m": {"type": "tiles", "w": ["Chaim", "showed", "kindness."], "hi": [2]}}, {"t": "Can I touch it? No. It is a feeling: abstract."}, {"t": "A siddur I can touch. That is a concrete noun."}, {"t": "Many come from describing words: kind → kindness, brave → bravery.", "m": {"type": "tiles", "w": ["kind", "ness"], "hi": [1]}}, {"t": "Show me with your hands!", "m": {"type": "move", "t": "Concrete: touch your desk! Abstract: hand on your heart!"}}], "a": "Kindness is an abstract noun."}, "oops": {"q": "Is \"joy\" a noun?", "wrong": "No: you cannot touch it", "right": "Yes: an abstract noun", "why": "Nouns can name feelings and ideas too."}, "ways": ["worked example", "movement", "sort", "match", "build with tiles", "Mistake Detective"], "done": "You can find abstract nouns: ideas and feelings!", "board": {"one": "Concrete = you can touch it. Abstract = an idea or feeling. kind → kindness.", "activity": "Boys draw a picture of an abstract noun in action (kindness: sharing).", "mistakes": ["Thinking a noun must be touchable", "Calling every feeling word a verb", "kindly for kindness"]}, "do": [{"type": "sort", "bins": ["Touch it", "Cannot touch"], "cards": [["hat", 0], ["kindness", 1], ["shul", 0], ["joy", 1]], "say": "Can you touch it? Sort each noun.", "how": "Feelings and ideas cannot be touched."}, {"type": "match", "mis": true, "pairs": [["joy", "abstract: a feeling"], ["a cookie", "concrete, not abstract"], ["courage", "abstract: an idea"]], "say": "Mistake Detective! Match each to its   BITE['LANG.GRAM.L05.02'] = {"band": "E45", "pic": "⏳", "today": "Show an action that keeps going", "why": "Progressive verbs show what was happening when something else happened.", "ready": [{"q": "\"Yehuda reads a book.\" Which word is the verb?", "o": ["reads", "Yehuda", "book", "a"], "a": "reads"}], "bridge": "LANG.GRAM.L05.01", "bridgeName": "Tense Lock", "watch": {"q": "Yehuda was reading when the phone rang.", "m": {"type": "tiles", "w": ["Yehuda", "was reading", "when the phone rang."], "hi": [1]}, "steps": [{"t": "The reading kept going. Then the phone rang in the middle of it."}, {"t": "Was + reading = past progressive. One boy, so was.", "m": {"type": "tiles", "w": ["Yehuda", "was reading"], "hi": [1]}}, {"t": "Right now: Yehuda is reading. Am, is or are + -ing.", "m": {"type": "tiles", "w": ["Yehuda", "is reading."], "hi": [1]}}, {"t": "Later: Yehuda will be reading. Will be + -ing.", "m": {"type": "tiles", "w": ["Yehuda", "will be reading."], "hi": [1]}}], "a": "Yehuda was reading when the phone rang."}, "oops": {"q": "The boys ___ building a robot.", "wrong": "was", "right": "were", "why": "Many boys take were. Was is for one."}, "ways": ["worked example", "sort", "build with tiles", "match", "tap the reason", "Mistake Detective"], "done": "You can show an action that keeps going!", "board": {"one": "Progressive = am/is/are/was/were/will be + -ing. Was for one, were for many.", "activity": "Freeze frame: boys act out an action; the class describes it in past, present and future progressive.", "mistakes": ["The boys was", "I is", "Dropping the helper (he running)"]}, "do": [{"type": "sort", "bins": ["Past", "Present", "Future"], "cards": [["was reading", 0], ["is reading", 1], ["will be reading", 2]], "say": "Past, present or future progressive?", "how": "Was or were: past. Is: now. Will be: future.", "why": {"q": "Why is \"was reading\" past progressive?", "o": ["was + an -ing verb", "it has will", "it ends in -ed", "it is one word"], "a": "was + an -ing verb"}}, {"type": "match", "mis": true, "pairs": [["The boys was baking.", "mistake: use were"], ["I is reading.", "mistake: use am"], ["The boys were baking.", "correct"]], "say": "Mistake Detective! Match each to its verdict.", "how": "Many take were. I takes am."}], "your": [{"type": "tiles", "w": ["At eight o'clock,", "Binyamin", "was playing", "chess."], "extra": ["were playing"], "say": "Build it with a past progressive verb.", "how": "Binyamin is one boy: was.", "why": {"q": "Why was, not were?", "o": ["Binyamin is one boy", "It is the future", "It is a question", "He played alone"], "a": "Binyamin is one boy"}}, {"type": "sort", "bins": ["Right", "Mistake"], "cards": [["The boys were baking.", 0], ["The boys was baking.", 1], ["I am reading.", 0], ["I is reading.", 1]], "say": "Right helper, or a mistake?", "how": "One or many? I takes am."}, {"type": "match", "pairs": [["was", "one, in the past"], ["were", "many, in the past"], ["will be", "in the future"]], "say": "Match each helper to its use.", "how": "One or many? Past or future?"}, {"type": "tiles", "w": ["Next Sunday,", "we", "will be visiting", "Zeidy."], "extra": ["was visiting"], "say": "Build it with a future progressive verb.", "how": "Will be + -ing."}, {"type": "sort", "bins": ["Past", "Present", "Future"], "cards": [["were singing", 0], ["am singing", 1], ["will be singing", 2], ["was snowing", 0]], "say": "When is each one happening?", "how": "Look at the helper."}]};
  BITE['LANG.GRAM.L05.03'] = {"band": "E45", "pic": "🚦", "today": "Use can, may and must to say what you mean", "why": "One helper word turns a rule into a choice, or a choice into a rule.", "ready": [{"q": "\"We will go.\" Which word is the helper?", "o": ["will", "go", "we", "none"], "a": "will"}], "bridge": "LANG.GRAM.L05.02", "bridgeName": "Was Running, Will Be Running", "watch": {"q": "We ___ wash before eating bread.", "m": {"type": "tiles", "w": ["We", "must", "wash before eating bread."], "hi": [1]}, "steps": [{"t": "Is there a choice? No. It is a must.", "m": {"type": "tiles", "w": ["We", "must", "wash before eating bread."], "hi": [1]}}, {"t": "Able to? Can. Binyamin can play chess.", "m": {"type": "tiles", "w": ["Binyamin", "can", "play chess."], "hi": [1]}}, {"t": "Allowed, or maybe? May. May I go? It may snow."}, {"t": "A good idea? Should. You should rest after the trip."}], "a": "We must wash before eating bread."}, "oops": {"q": "It ___ snow tonight. Nobody knows yet.", "wrong": "must", "right": "may", "why": "Must means there is no choice. When it is only maybe, use may."}, "ways": ["worked example", "match", "sort", "build with tiles", "tap the reason", "Mistake Detective"], "done": "You can use can, may, must and should to say exactly what you mean!", "board": {"one": "can = able, may = allowed or maybe, must = have to, should = a good idea.", "activity": "Rule or choice? Read class rules aloud; boys hold up a must card or a may card.", "mistakes": ["must for a maybe", "can when asking permission in formal writing", "should for a rule with no choice"]}, "do": [{"type": "match", "pairs": [["can", "able to"], ["may", "allowed, or maybe"], ["must", "have to"]], "say": "Match each modal to its meaning.", "how": "Able, allowed or maybe, or have to?", "why": {"q": "Why does must fit \"wash before eating bread\"?", "o": ["There is no choice", "It is only a maybe", "It means able to", "It asks a question"], "a": "There is no choice"}}, {"type": "sort", "mis": true, "bins": ["Fits", "Mistake"], "cards": [["No choice: you must.", 0], ["No choice: you may.", 1], ["Maybe rain: it may rain.", 0], ["Maybe rain: it must rain.", 1]], "say": "Mistake Detective! Does the modal fit?", "how": "Must: no choice. May: maybe."}], "your": [{"type": "tiles", "w": ["May I", "borrow", "your flashlight?"], "extra": ["Must I"], "say": "Build a polite question asking to be allowed.", "how": "Permission: May I.", "why": {"q": "Why \"May I\" here?", "o": ["He is asking to be allowed", "It is a rule", "It means able to", "It is about the weather"], "a": "He is asking to be allowed"}}, {"type": "sort", "bins": ["Able to", "Have to", "Maybe"], "cards": [["Binyamin can play chess.", 0], ["We must be on time.", 1], ["It may rain.", 2], ["You must wear a helmet.", 1]], "say": "What does each modal mean?", "how": "Can, must or may?"}, {"type": "match", "pairs": [["should", "a good idea"], ["must", "have to"], ["can", "able to"]], "say": "Match each modal to its meaning.", "how": "Advice, rule or ability?"}, {"type": "tiles", "w": ["You", "should", "rest", "after the trip."], "extra": ["may"], "say": "Build it: give good advice.", "how": "A good idea: should."}, {"type": "sort", "bins": ["Modal", "Not a modal"], "cards": [["can", 0], ["run", 1], ["must", 0], ["table", 1]], "say": "Is it a modal helper?", "how": "Can, may, must, should help another verb."}]};
  BITE['LANG.GRAM.L06.03'] = {"band":"E45","pic":"🕰️","today":"Let time words pick the tense","why":"Readers follow your story in time when your verbs match the time words.","bridge":"LANG.GRAM.L06.02","bridgeName":"Perfect Tense","done":"The *time word* picks the tense. The earlier past gets *had*.","board":{"one":"Find the time word first; it picks the tense. Earlier past action: had.","activity":"A timeline on the board; boys place time words on it and say a verb for each.","mistakes":["Ignoring the time word","Past verb with tomorrow","Missing had for the earlier action"]},"hook":{"kind":"mystery","pic":"⏰","t":"\"Binyamin ___ in the chess tournament.\" There is no time word.","q":"Played, plays, or will play?","o":["played","plays","will play"],"pay":"No clue, no answer! Add *next week*, and it is *will play*."},"learn":[{"t":"A *time word* tells when. It picks the *tense*.","act":{"type":"sort","bins":["Past","Present","Future"],"cards":[["yesterday",0],["every day",1],["tomorrow",2],["last week",0],["next year",2]],"say":"Which *tense* does each time word ask for?","how":"Already happened? Happens all the time? Not yet?"}},{"t":"Now match the *verb* to the time word.","act":{"type":"match","pairs":[["yesterday","played"],["every day","plays"],["tomorrow","will play"]],"say":"Match each *time word* to its verb.","how":"Past: *played*. Every day: he *plays*. Not yet: *will* play."}},{"t":"Two past actions? The *earlier* one gets *had*.","m":{"type":"tiles","w":["By the time we came,","the game","had started."],"hi":[2]}},{"who":{"q":"\"Tomorrow, we ___ to the lighthouse.\"","o":[["Gavriel","went"],["Ovadia","will go"]],"a":1,"why":"*Tomorrow* is not yet. Went is *past*."}}],"play":[{"type":"match","mis":true,"pairs":[["Tomorrow, we baked.","mistake: use will bake"],["Last year, we visit Zeidy.","mistake: use visited"],["Every day, he walks.","correct"]],"say":"Mistake Detective! Match each to its verdict.","how":"Check the *verb* against the *time word*."},{"type":"tiles","w":["By the time","Avrumi woke up,","the snow","had melted."],"extra":["will melt."],"say":"Build it. The melting happened first.","how":"*Had* + the verb for the *earlier* action.","why":{"q":"Why \"had melted\"?","o":["The melting happened before he woke up","It will happen later","It happens every day"],"a":"The melting happened before he woke up"}},{"type":"cloze","t":"Next Sunday, Zeidy ___ us to the zoo.","o":["took","has taken","will take"],"a":"will take","say":"Fill the gap. Find the time word first.","how":"*Next Sunday* has not come yet.","why":{"q":"Why \"will take\"?","o":["Next Sunday has not come yet","It already happened","It happens every day"],"a":"Next Sunday has not come yet"}},{"type":"sort","bins":["Matches","Mistake"],"cards":[["Last year, we visited Zeidy.",0],["Every week, we visit Zeidy.",0],["Tomorrow, we will bake.",0],["Yesterday, we will bake.",1]],"say":"Does the verb match the time word?","how":"Time word first, then the verb."},{"type":"tiles","w":["Every morning,","Tzvi Hirsch","helps","at the bakery."],"extra":["helped"],"say":"Challenge! Build it in the present.","how":"*Every morning* asks for the present."}]};
  BITE['LANG.GRAM.L06.04'] = {"band":"E45","pic":"🔧","today":"Find and fix a jump in tense","why":"A jump in time confuses your reader. Editors fix it first.","bridge":"LANG.GRAM.L06.03","bridgeName":"Time Signal","done":"You keep every verb in the *story's time*. Shift only when time *really* changes.","board":{"one":"Pick the story's time and keep every verb in it. Shift only when the time really changes.","activity":"Read a short story with 3 hidden shifts; boys stand up at each shift and fix it aloud.","mistakes":["Sliding into the present in the middle of a story","Fixing one verb and missing another","Calling a real time change a mistake"]},"hook":{"kind":"whatswrong","pic":"🔍","t":"\"Dovid opened the box and finds a key.\"","q":"What is wrong here?","o":["The time jumps","A word is spelled wrong","Nothing at all"],"pay":"The *time jumped*! Opened is past. Finds is present. Fix: *found*."},"learn":[{"t":"A story picks one *time*. Every verb stays there.","act":{"type":"sort","bins":["Stays in time","Shifts"],"cards":[["Avrumi drew the map and hid it.",0],["Avrumi drew the map and hides it.",1],["The tide rose and covered the rocks.",0],["The tide rises and covered the rocks.",1]],"say":"Does the *time* stay the same?","how":"Check every *verb* against the first one."}},{"t":"To fix it, change the verb that *jumped*.","act":{"type":"tiles","w":["Binyamin moved his knight","and","won the game."],"extra":["wins the game."],"say":"Fix the shift. *Moved* is past.","how":"Keep the second verb *past* too."}},{"who":{"q":"\"Yesterday I lost it, but now I have it.\" Is the shift OK?","o":[["Ari","No, it jumps to now"],["Tuvia","Yes, the time really changes"]],"a":1,"why":"*Now* is a real time change. That shift is *right*."}}],"play":[{"type":"match","mis":true,"pairs":[["He opened it and finds a key.","finds → found"],["We walk in and sat down.","walk → walked"],["The tide rises and covered it.","rises → rose"]],"say":"Mistake Detective! Match each shift to its fix.",   BITE['LANG.SENT.L07.01'] = {"band":"M68","pic":"🧪","today":"Combine three sentences into one strong one","why":"Editors turn choppy notes into one clear sentence a reader remembers.","bridge":"LANG.SENT.L06.02","bridgeName":"Appositive","done":"Combine with *tools*. Keep the *main idea* in the main clause.","board":{"one":"Main idea = main clause. Tuck the rest in with an appositive, a who/which clause, a phrase or a joining word.","activity":"Teams get three note cards from a Beacon story and race to combine them; the class checks with the four checks.","mistakes":["Comma splices","Repeating the subject","Burying the main idea in a tucked-in part"]},"hook":{"kind":"challenge","pic":"🧪","t":"Three notes: \"Gavriel took photos. He is our cameraman. It was at the siyum.\"","q":"Can you make it one sentence?","o":["Yes, easily","No, it needs three"],"pay":"Yes! *Gavriel, our cameraman, took photos at the siyum.* Tuck the *details* in."},"learn":[{"t":"Find the *main idea*. It goes in the main clause.","act":{"type":"sort","q":"Yoni interviewed the custodian. He has worked here 30 years. It was Tuesday.","bins":["Main idea","Extra detail"],"cards":[["Yoni interviewed the custodian",0],["who has worked here 30 years",1],["on Tuesday",1]],"say":"Sort the *main idea* from the *details*.","how":"What is the sentence *really* about?"}},{"t":"Four *tools* tuck details in.","act":{"type":"match","pairs":[["appositive","Akiva, our editor,"],["who clause","Akiva, who checks every fact,"],["phrase","after the meeting"],["joining word","so"]],"say":"Match each *tool* to an example.","how":"*Renames*, adds a fact, tells *when*, or *joins*?"}},{"t":"Build it: main idea, details tucked in, *nothing repeated*.","act":{"type":"tiles","w":["Gavriel,","who took the photos,","won a prize","at the fair."],"extra":["he"],"say":"Combine the three notes about *Gavriel*.","how":"Main idea, *who* clause after his name, phrase at the end."}},{"who":{"q":"Notes: \"Eli wrote the story. Eli is ou   BITE['LANG.SENT.L07.02'] = {"band":"M68","pic":"🌳","today":"Expand a kernel with details that matter","why":"Strong news sentences answer who, what, when, where, why and how.","bridge":"LANG.SENT.L05.03","bridgeName":"Add a Phrase","done":"Grow a kernel with details that add *meaning*, not just *length*.","board":{"one":"Kernel + details that answer who, what kind, when, where, why, how. Meaning, not length.","activity":"One kernel on the board; each boy adds one question's answer and the class votes whether it adds meaning.","mistakes":["Padding with very very","Details far from what they describe","No comma after a long opening"]},"hook":{"kind":"guess","pic":"🌱","t":"Kernel: \"The crowd cheered.\" Just three words.","q":"How big can it grow and stay clear?","o":["5 words","10 words","15 words"],"pay":"\"When Eli scored, the crowd in the gym cheered.\" *Details* that matter make it grow!"},"learn":[{"t":"Grow a *kernel* by asking *when*, *where*, *why*.","act":{"type":"sort","bins":["When","Where","Why"],"cards":[["after the debate",0],["in the gym",1],["because the team scored",2],["during the storm",0],["at the printer",1],["so the paper would be ready",2]],"say":"Which *question* does each detail answer?","how":"*Time*, *place*, or *reason*?"}},{"t":"Test each detail: *meaning*, or just *length*?","act":{"type":"sort","bins":["Adds meaning","Just length"],"cards":[["to raise money for a family in need",0],["in a way that was nice",1],["before the printer jammed",0],["really really fast",1]],"say":"*Meaning*, or just *length*?","how":"Does the reader learn something *new*?"}},{"who":{"q":"Expand \"The editors stayed late.\"","o":[["Yehuda","The editors stayed late, very very late."],["Nachum","The editors stayed late because the paper was due."]],"a":1,"why":"Repeating *late* adds length. A *reason* adds meaning."}},{"t":"Put each detail *next to* what it tells about.","act":{"type":"tiles","w":["After the long debate,","the judges","announced the winner","in   BITE['LANG.MECH.L08.01'] = {"band": "M68", "pic": "🔀", "today": "Put a comma between equal describers", "why": "One small comma tells readers your describers are equal partners.", "ready": [{"q": "In \"a quiet night,\" what is \"quiet\"?", "o": ["an adjective", "a verb", "a noun", "a clause"], "a": "an adjective"}], "bridge": "LANG.GRAM.L08.02", "bridgeName": "Modifier Fix", "watch": {"q": "a long quiet night", "m": {"type": "tiles", "w": ["a", "long", "quiet", "night"], "hi": [1, 2]}, "steps": [{"t": "Long and quiet both describe night. Are they equal?"}, {"t": "The \"and\" test: a long and quiet night. Sounds right."}, {"t": "The switch test: a quiet, long night. Still right, so add a comma.", "m": {"type": "tiles", "w": ["a long,", "quiet", "night"], "hi": [0]}}, {"t": "Compare: three old books. \"Three and old books\"? Wrong. No comma."}, {"t": "Teach it back: tell your chavrusa the two tests, and when the comma goes in."}], "a": "a long, quiet night"}, "oops": {"q": "a bright red car", "wrong": "a bright, red car", "right": "a bright red car", "why": "\"Bright and red car\" sounds wrong: bright tells about the red. No comma."}, "ways": ["worked example", "two tests", "sort", "build with tiles", "match", "teach it back", "Mistake Detective"], "done": "You can put a comma between equal describers, and only there!", "board": {"one": "Coordinate adjectives pass the \"and\" test and the switch test: put a comma between them.", "activity": "Boys say adjective pairs aloud with \"and\" and switched; the class calls \"comma\" or \"no comma\".", "mistakes": ["Comma after a number", "Comma in a color pair (dark blue)", "Comma between the last adjective and the noun"]}, "do": [{"type": "sort", "bins": ["Comma", "No comma"], "cards": [["a long quiet night", 0], ["three old books", 1], ["a cold windy day", 0], ["a bright red car", 1]], "say": "Do these describers need a comma?", "how": "Use the \"and\" test and the switch test."}, {"type": "match", "mis": true, "pairs": [[   BITE['LANG.GRAM.L09.05'] = {"band": "M68", "pic": "🎭", "today": "Pick the verb mood that fits what you mean", "why": "Mood shows whether you state, command, ask, imagine or wish. Speeches and letters depend on it.", "ready": [{"q": "\"Check every fact.\" What is it?", "o": ["a command", "a question", "a fact", "a wish"], "a": "a command"}], "bridge": "LANG.GRAM.L09.01", "bridgeName": "Active Voice", "watch": {"q": "If I were the editor, I would add a puzzle page.", "m": {"type": "tiles", "w": ["If I were the editor,", "I would add", "a puzzle page."], "hi": [0]}, "steps": [{"t": "Facts are indicative: The paper comes out Friday. Commands are imperative: Check every fact."}, {"t": "Questions are interrogative: Did you check the facts?"}, {"t": "What would happen is conditional, with would: I would add a puzzle page.", "m": {"type": "tiles", "w": ["If I were the editor,", "I would add", "a puzzle page."], "hi": [1]}}, {"t": "Wishes and not-true ideas are subjunctive, with were for everyone: If I were the editor.", "m": {"type": "tiles", "w": ["If I were the editor,", "I would add", "a puzzle page."], "hi": [0]}}, {"t": "Teach it back: tell your chavrusa the five moods, with one example of each."}], "a": "If I were the editor, I would add a puzzle page."}, "oops": {"q": "If I was the editor, I would add a puzzle page.", "wrong": "Fine: \"I was\" is past tense", "right": "If I were the editor, I would add a puzzle page.", "why": "He is not the editor. A not-true idea takes the subjunctive: were."}, "ways": ["worked example", "sort", "match", "build with tiles", "teach it back", "Mistake Detective"], "done": "You can choose the mood that fits, and use were for a wish!", "board": {"one": "Indicative states, imperative commands, interrogative asks, conditional would, subjunctive wishes (were).", "activity": "Each boy writes one Beacon sentence in each mood about the same event.", "mistakes": ["If I was (for a not-true idea)", "I wish he was", "Mixing would into the if pa
