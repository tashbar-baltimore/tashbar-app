 const meta=isBoss?`🏰 BOSS LEVEL! Beat it to finish ${esc(w.unitName)}`:`${esc(w.name)} · Level ${w.level} · ${left} level${left===1?'':'s'} to the BOSS 🏰`;
 const say=`Your next level: ${n[0]}.${n[1]?(/ Level \d+$/.test(n[1])?' A real '+n[1]+' skill.':' You will learn: '+n[1]+'.'):''} Tap Play to start!`;
 return `<div class="gm-goal" aria-label="Your next level"><div class="k"><span>⚡ YOUR NEXT LEVEL</span>${isPick?'<span class="pick">⭐ TODAY\'S PICK</span>':''}</div><h1>${esc(n[0])}</h1>${learnLine(n)}<div class="m">${meta}</div>
 <div class="gm-row"><button type="button" class="gm-play" data-gm="play" data-id="${esc(w.now)}">▶ Play</button><button type="button" class="gm-say" data-gm="say" data-text="${esc(say)}" aria-label="Read it to me">🔊</button></div></div>`; }
function navHTML(k2){ const items=k2?[['map','🗺️','Map'],['lib','📚','Learn'],['games','🎮','Play']]:[['map','🗺️','Map'],['lib','📚','Learn'],['games','🎮','Play'],['mine','🎒','My Stuff'],['store','💵','Store']];
 return items.map(x=>`<button type="button" data-gmnav="${x[0]}" class="${GM.tab===x[0]?'on':''}"${GM.tab===x[0]?' aria-current="page"':''}><b aria-hidden="true">${x[1]}</b>${x[2]}</button>`).join(''); }
function show(on,navOn){ document.body.classList.toggle('gm-on',!!on); document.body.classList.toggle('gm-nav',!!navOn); }
function sync(){
 css(); const g=root(), nv=nav();
 const m=M(), hub=A.view==='hub'&&!!A.st&&!document.body.classList.contains('tm-on');
 if(A.st&&GM.sid!==A.st.id){ GM.sid=A.st.id; GM.tab='map'; GM.world=''; GM.sig=''; }
 const ws=m?worldsOf(m):[];
 if(!hub||!ws.length){ show(false,false); return; }
 const k2=ws.every(w=>w.level<=2); document.body.classList.toggle('gm-k2',k2);
 if(k2&&(GM.tab==='mine'||GM.tab==='store')) GM.tab='map';
 const nh=navHTML(k2); if(nv.innerHTML!==nh) nv.innerHTML=nh;
 if(GM.tab!=='map'){ show(false,true); return; }
 const p=pick(ws), cur=ws.find(w=>w.k===GM.world)||p; GM.world=cur.k;
 const html=`<div class="gm-sky"></div><div class="gm-in"><div class="gm-top">${hud()}${worldTabs(ws,cur)}</div>
 <div class="gm-unit"><div><b>${cur.icon} ${esc(cur.unitName)}</b><small>${esc(cur.name)} · Level ${cur.level}${cur.isK?'':' unit'}</small></div><div class="left">${cur.now?(()=>{ const l=cur.ids.length-cur.ids.indexOf(cur.now)-1; return l?l+' TO 🏰':'🏰 BOSS NOW!'; })():'✓ CLEARED'}</div></div>
 ${pathHTML(cur)}</div>${goalHTML(cur,p&&cur.k===p.k)}`;
 const first=!document.body.classList.contains('gm-on')||GM.rescroll; GM.rescroll=false;
 if(html!==GM.sig){ GM.sig=html; g.innerHTML=html; }
 show(true,true);
 if(first) scrollToNow(g);
}
function scrollToNow(g){ try{ const n=g.querySelector('.gm-n.now')||g.querySelector('.gm-n.boss'); if(!n) return; const goal=g.querySelector('.gm-goal'), tp=g.querySelector('.gm-top'), top=tp?tp.getBoundingClientRect().bottom:0, bottom=goal?goal.getBoundingClientRect().top:window.innerHeight-300, r=n.getBoundingClientRect();
 if(r.bottom>bottom-16||r.top<top+8){ g.scrollTop+=Math.round((r.top+r.height/2)-(top+bottom)/2); } }catch(e){} }
function refreshLater(){ if(GM.fetching||typeof SRV==='undefined'||!SRV.token) return; GM.fetching=true; const tok=SRV.token, sid=A.st&&A.st.id;
 try{ run('kmMyMap',tok).then(r=>{ GM.fetching=false; if(r&&r.sid===sid) window.TL_MAP=r; }).catch(()=>{ GM.fetching=false; }); }catch(e){ GM.fetching=false; } }
let toastT=0;
function toast(t){ const g=root(); let el=g.querySelector('.gm-toast'); if(!el){ el=document.createElement('div'); el.className='gm-toast'; el.setAttribute('role','status'); g.appendChild(el); } el.textContent=t; clearTimeout(toastT); toastT=setTimeout(()=>{ try{ el.remove(); }catch(e){} },2600); }
function worldFor(id){ const pre=String(id).split('.')[0], map=/^(LK|HEB)$/.test(pre)?'LK':/^(READ|WRIT|LANG)$/.test(pre)?'READ':/^(SS|SOC|FACT)$/.test(pre)?'SS':/^(COMP|VOC)$/.test(pre)?'COMP':pre;
 return typeof WORLD!=='undefined'?(WORLD[pre]?pre:WORLD[map]?map:''):''; }
function play(id){ const c=worldFor(id);
 if(c&&typeof startMission==='function'&&((typeof BANK_ALL!=='undefined'&&BANK_ALL[id])||(typeof GEN!=='undefined'&&GEN[id]))){ GM.sig=''; startMission(c,id,'skill'); return; }
 GM.tab='lib'; sync(); door('lib'); }
function door(k){ const b=document.createElement('button'); b.type='button'; b.dataset.hf=k; b.style.display='none'; document.body.appendChild(b); try{ b.click(); }catch(e){} b.remove(); }
document.addEventListener('click',e=>{
 const b=e.target&&e.target.closest&&e.target.closest('[data-gm],[data-gmnav]'); if(!b) return;
 const a=b.dataset.gm, t=b.dataset.gmnav;
 if(t){ e.preventDefault(); try{ SND.tap(); }catch(x){}
  if(t==='store'){ const s=document.createElement('button'); s.dataset.st='open'; s.style.display='none'; document.body.appendChild(s); s.click(); s.remove(); return; }
  GM.tab=t; if(t==='map'){ GM.sig=''; GM.rescroll=true; sync(); return; } sync(); door(t); return; }
 if(a==='world'){ GM.world=b.dataset.k; try{ SND.tap(); }catch(x){} root().scrollTop=0; GM.rescroll=true; sync(); return; }
 if(a==='play') return play(b.dataset.id);
 if(a==='pf'){ const c=document.querySelector('.pf-card button'); if(c) c.click(); return; }
 if(a==='say'){ try{ speak(b.dataset.text); }catch(x){} return; }
 if(a==='node'){ const id=b.dataset.id, m=M(); if(!m) return; const ws=worldsOf(m), w=ws.find(x=>x.k===GM.world);
  if(mast(id)) return play(id);
  if(w&&id===w.now) return play(id);
  const n=w&&w.now?nm(w.now)[0]:''; toast('🔒 Locked! Clear '+(n||'the level before it')+' first.'); }
});
document.addEventListener('click',e=>{ const b=e.target&&e.target.closest&&e.target.closest('[data-hf="home"]'); if(b&&b.classList.contains('hf-back')&&GM.tab!=='map'&&document.body.classList.contains('gm-nav')){ setTimeout(()=>{ GM.tab='map'; GM.sig=''; GM.rescroll=true; sync(); },0); } },true);
const oldRender=render;
render=function(){ const r=oldRender.apply(this,arguments);
 try{ if(A.view==='hub'&&A.st){ const n=steps(); if(GM.lastSteps>=0&&n>GM.lastSteps&&GM.lastSid===A.st.id){ GM.world=''; GM.rescroll=true; refreshLater(); } GM.lastSteps=n; GM.lastSid=A.st.id; } sync(); }catch(e){ console.error('GameMap',e); }
 return r; };
GM.lastSteps=-1;
GM.sync=sync;
let pfWatch=null; setTimeout(function hook(){ const c=document.querySelector('.pf-card'); if(!c){ setTimeout(hook,1500); return; } pfWatch=new MutationObserver(()=>{ if(document.body.classList.contains('gm-on')) sync(); }); pfWatch.observe(c,{attributes:true,attributeFilter:['style']}); },1500);
try{ sync(); }catch(e){ console.error('GameMap',e); }
})();
</script>
