#gm-nav button:focus-visible::before{opacity:1;transform:translate(-50%,-50%) scale(1);box-shadow:inset 0 0 0 2px rgba(255,226,89,.55)}
#gm-nav button:active::before{opacity:1;transform:translate(-50%,-50%) scale(.94);transition-duration:.08s}
