   let done=false; const fin=b=>{ if(done) return; done=true; GM.themeBuf=b||null; ok(b||null); };
   oc.oncomplete=e=>fin(e&&e.renderedBuffer); const r=oc.startRendering(); if(r&&r.then) r.then(fin,()=>fin(null));
  }catch(e){ ok(null); } });
  return GM.themeP; }
 /* the speaker: made and unlocked on the boy's first tap or key (browsers only allow sound to start from a tap) */
 function themeCtx(){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null; try{ return GM.ac||(GM.ac=new AC()); }catch(e){ return null; } }
 function themeUnlock(){ const c=themeCtx(); if(!c) return; const run=()=>{ const w=GM.themeWait; if(w&&c.state==='running') w(); };
  try{ if(c.state==='running') return run(); const r=c.resume(); const s=c.createBufferSource(); s.buffer=c.createBuffer(1,1,22050); s.connect(c.destination); s.start(0);
   if(r&&r.then) r.then(run,()=>{}); else setTimeout(run,50); }catch(e){} }
 ['pointerdown','touchend','keydown','click'].forEach(ev=>document.addEventListener(ev,themeUnlock,{capture:true,passive:true}));
 /* first choice: the same tune already saved as a sound file on the site (art/sounds/theme.mp3 in the shared art library, made from themeBuild), so the tablet has
    nothing to record; it downloads while the boy types his code. If that fails, it records the tune itself (themeRender). */
 function themeLoad(){ if(GM.themeL) return GM.themeL;
  const url=/\.web\.app$|\.firebaseapp\.com$|^localhost$|^127\./.test(location.hostname)?'/sounds/theme.mp3':'https://tashbar-learning-live.web.app/sounds/theme.mp3';
  GM.themeL=new Promise(ok=>{ try{ const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext; if(!window.fetch||!OAC) return ok(null);
   fetch(url).then(r=>{ if(!r.ok) throw 0; return r.arrayBuffer(); }).then(ab=>{ const dc=new OAC(1,1,44100);
    const p=dc.decodeAudioData(ab,b=>ok(b),()=>ok(null)); if(p&&p.catch) p.catch(()=>ok(null)); }).catch(()=>ok(null));
  }catch(e){ ok(null); } }).then(b=>{ if(b){ GM.themeBuf=b; GM.themeP=Promise.resolve(b); return b; } return themeRender(); });
  return GM.themeL; }
 setTimeout(themeLoad,0);
 function themeTune(){ try{ if(typeof SND!=='undefined'&&SND.on===false) return;
  if(window.TL_THEME_URL){ const a=new Audio(window.TL_THEME_URL); a.volume=.85; a.play().catch(()=>{}); return; }
  const c=themeCtx(); if(!c) return; const asked=Date.now();
  GM.themeEnd=asked+THEME_SEC*1000;   /* hold the background music until the tune is done */
  const go=()=>{ try{ if(Date.now()-asked>8000) { GM.themeEnd=0; return; }   /* never start it very late */
   if(c.state!=='running'){ GM.themeWait=go; return; }   /* the speaker is still locked: it starts on his next tap */
   GM.themeWait=null; if(!GM.themeBuf) return;
   if(GM.themeSrc){ try{ GM.themeSrc.stop(); }catch(e){} }
   const s=c.createBufferSource(); s.buffer=GM.themeBuf; s.connect(c.destination); s.start(c.currentTime+.02); GM.themeSrc=s;
   GM.themeEnd=Date.now()+GM.themeBuf.duration*1000; }catch(e){} };
  if(c.state!=='running'){ try{ const r=c.resume(); if(r&&r.then) r.then(()=>{ if(GM.themeWait===go) go(); },()=>{}); }catch(e){} }
  themeLoad().then(b=>{ if(!b){ GM.themeEnd=0; return; } go(); });
 }catch(e){} }
 GM.themeTune=themeTune;
 /* HoS 2026-11-22: "put it as the default opening sound track as soon as someone punches in his code": it starts the moment a boy's code
    is accepted (once per sign-in), for every boy. */
 GM.tuneSid=''; setInterval(()=>{ try{ const id=A&&A.st&&A.st.id?String(A.st.id):''; if(!id||id==='PREVIEW'){ GM.tuneSid=''; return; } if(id!==GM.tuneSid){ GM.tuneSid=id; themeTune(); } }catch(e){} },250);
 if(typeof welcome!=='function') return;
 const prevW=welcome;
 welcome=function(){ try{
  if(!M()) return prevW.apply(this,arguments);
  const sid=String(A.st.id||''), now=Date.now();
  if((A.overlay&&A.overlay.html&&A.overlay.html.indexOf('class="gmw"')>=0)||(GM.wShown&&GM.wShown.sid===sid&&now-GM.wShown.at<90000)) return;
  GM.wShown={sid:sid,at:now};
  try{ localStorage.setItem('tlSimMorning:'+sid,String(today())); }catch(e){}
  const st=A.st, n=(st.streak||{}).n||1, first=String(st.name||'').trim().split(/\s+/)[0]||'friend';
  const hr=new Date().getHours(), hi=hr<12?'GOOD MORNING':hr<17?'GOOD AFTERNOON':'GOOD EVENING';
  let bank=''; try{ bank=typeof fmt==='function'?fmt(st.balance||0):'$'+Number(st.balance||0).toFixed(2); }catch(e){}
  const g=document.querySelector('#gm .gm-goal'); let t='', l='';
  if(g&&g.querySelector('h1')){ t=g.querySelector('h1').textContent.trim(); const le=g.querySelector('.learn'); l=le?le.textContent.trim():''; }
  else { const x=GM.nextLevel(); t=x.split(' · ')[0]; l=x.split(' · ')[1]||''; }
  const v=pickDay(S().vort);
  const needs=(S().need||[]).filter(x=>!/rebbe/i.test(x.label)), ci=needs.findIndex(x=>/chizuk/i.test(x.label));
  overlay(`<div class="gmw"><div class="k">⚡ ${hi}</div><h2>Welcome back, ${esc(first)}!</h2>`+
   `<div class="chips"><span>🔥 ${n} day${n===1?'':'s'} in a row</span>${bank?`<span>💵 ${esc(bank)}</span>`:''}</div>`+
   (t?`<div class="nx"><small>🎯 YOUR NEXT LEVEL</small><b>${esc(t)}</b>${l?`<em>${esc(l)}</em>`:''}</div><button type="button" class="go" data-gmw="play">▶ PLAY</button>`:'')+
   `<div class="gmhow" aria-label="How it works"><span>1 ▶ Play your next level</span><span>2 🎯 3 missions a day</span><span>3 💵 Earn for the Store</span></div>`+
   `<div class="row"><button type="button" data-act="closeov">🗺️ My map</button>${ci>=0?`<button type="button" data-act="sm-need" data-i="${ci}">🌟 Some chizuk</button>`:''}</div>`+
   (v?`<p class="vort"><b>📜 Today's vort:</b> ${esc(typeof v==='string'?v:v.text)}${v.src?`<small>${esc(v.src)}</small>`:''}</p>`:'')+`</div>`);
 }catch(e){ console.error('GameMap welcome',e); return prevW.apply(this,arguments); } };
 /* HoS 2026-11-22: "the golden cloud should never cover the clock". When the clock and the Olam Haba cloud would overlap,
   the clock moves up so it sits just above the cloud, with a gap. Checked every 1.5 seconds and on resize; no change when they are apart. */
 function clockClear(){ try{ const c=document.getElementById('tlclock'), k=document.getElementById('ohsky'); if(!c||!k) return;
  c.style.removeProperty('bottom'); const cb=c.getBoundingClientRect(), kb=k.getBoundingClientRect(); if(!cb.width||!kb.width) return;
  const kt=kb.height<innerHeight*.6?kb.top:innerHeight; const over=cb.right>kb.left&&cb.left<kb.right&&cb.bottom>kt-12;
  if(over) c.style.setProperty('bottom',Math.round(innerHeight-kt+16)+'px','important'); }catch(e){} }
 setInterval(clockClear,1500); addEventListener('resize',clockClear);
 GM.lessonLook=function(){ try{ document.body.classList.toggle('gm-lesson',A.view==='play'&&!!M()); }catch(e){} };
 document.addEventListener('click',e=>{ const b=e.target&&e.target.closest&&e.target.closest('.gmw button'); if(!b) return; music();
  if(b.dataset.gmw==='play'){ A.overlay=null; render(); setTimeout(()=>{ const p=document.querySelector('#gm .gm-goal .gm-play'); if(p) p.click(); },60); } },true);
})();
try{ sync(); }catch(e){ console.error('GameMap',e); }
})();
