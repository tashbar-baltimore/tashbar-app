 if(!D) h+='<p style="color:var(--soft)">Loading…</p>'; else if(!D.blocks.length) h+='<p style="color:var(--soft)">No answers yet today.</p>';
 else h+=D.blocks.slice().reverse().map(b=>{ const ok=b.marks.filter(Boolean).length; return `<div class="bl"><small>${E(tm(b.from))}${b.to-b.from>60000?'–'+E(tm(b.to)):''}</small><div><b>${E(nmOf(b.sk))}</b> <small>· ${b.marks.length} answer${b.marks.length===1?'':'s'} · ${ok} right</small><div class="dots" aria-hidden="true">${b.marks.map(m=>`<i class="${m?'o':''}"></i>`).join('')}</div></div></div>`; }).join('');
 d.insertAdjacentHTML('beforeend',h+'</div>'); }
function cardFix(){ dayFix(); if(!S.card||!SP.lk) return; const d=[...document.querySelectorAll('#app aside.drawer')].pop(); if(!d||d.querySelector('.sp-cardk')) return; const b=SP.lk.boys.find(x=>x.id===S.card); if(!b) return;
 d.insertAdjacentHTML('beforeend',`<div class="sp-cardk"><h3>📜 Limudei Kodesh</h3>${SP.lk.tracks.map(t=>{ const c=b.cells[t[0]]; if(!c||!c.total) return ''; return `<div class="kr"><b>${E(t[1])}</b><span>${c.status==='green'?'Track done ✅':c.done?`Level ${c.level} · ${c.done}/${c.total} · ${E(lkName(c.now))}`:'Not started'}${c.status==='red'?' · 🆘 stuck':''}</span></div>`; }).join('')}</div>`); }

/* ---------- export ---------- */
function csv(){ let rows=[];
 if(SP.tab==='lk'&&SP.lk){ const T=SP.lk.tracks; rows.push(['Student'].concat(T.map(t=>t[1]+' level'),T.map(t=>t[1]+' mastered'),T.map(t=>t[1]+' now'))); SP.lk.boys.forEach(b=>rows.push([b.name].concat(T.map(t=>b.cells[t[0]].level),T.map(t=>b.cells[t[0]].done+'/'+b.cells[t[0]].total),T.map(t=>lkName(b.cells[t[0]].now))))); }
 else if(SP.tab==='lv'&&SP.lv){ rows.push(['Student','Math','Reading','Social Studies']); SP.lv.boys.forEach(b=>rows.push([b.name].concat(['MATH','READ','SOC'].map(k=>b.place[k]?b.place[k].level:'none')))); }
 else if(SP.tab==='today'&&SP.today){ rows.push(['Student','Answers','Right','Kodesh answers','Kodesh right','Mastered','Kodesh mastered','Last']); SP.today.boys.forEach(b=>rows.push([b.name,b.answers,b.right,b.kAnswers,b.kRight,b.mastered,b.kMastered,tm(b.last)])); }
 else { const subs=S.d.subjects||[]; rows.push(['Student'].concat(subs.map(s=>s[1]))); kidsGS().filter(b=>!b.test).forEach(b=>rows.push([b.name].concat(subs.map(s=>{ const c=b.cells[s[0]]; return (c.level?'Level '+c.level+' ':'')+(STAT[c.status]||''); })))); }
 const text=rows.map(r=>r.map(x=>{ x=String(x==null?'':x); return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x; }).join(',')).join('\n');
 try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'})); a.download='tashbar-'+SP.tab+'-'+new Date().toISOString().slice(0,10)+'.csv'; document.body.appendChild(a); a.click(); a.remove(); }catch(e){ try{ toast('Could not make the file.'); }catch(x){} } }

/* ---------- render hook ---------- */
const _render=render;
render=function(){ _render.apply(this,arguments);
 try{ if(S.out||!S.d||!S.d.boys) return; css();
  if(!started){ started=true; refreshAll(); }
  const app=document.getElementById('app'); headerFix();
  const h=app.querySelector('header.top'); if(h&&!app.querySelector('.sp-tabs')) h.insertAdjacentHTML('afterend',tabsHTML()+nowLine());
  app.classList.toggle('sp-show-now',!!SP.nowOpen);
  const bar=app.querySelector('.bar'), gw=app.querySelector('.gw');
  if(SP.tab==='gs'){ if(bar) bar.style.display=''; gsFix(); }
  else { if(bar) bar.style.display='none'; if(gw){ gw.className='sp-main'; gw.innerHTML=SP.tab==='lk'?lkView():SP.tab==='lv'?lvView():SP.tab==='wk'&&window.SPD?window.SPD.week():SP.tab==='now'&&window.SPL?window.SPL.now():todayView(); }
   if(SP.tab==='lk'&&!SP.lk) loadLk(); if(SP.tab==='lv'&&!SP.lv) loadLv(); }
  if(SP.lkOpen&&!S.page&&!S.card&&!S.open&&!S.add&&!S.tm) app.insertAdjacentHTML('beforeend',lkDrawer());
  cardFix();
  const lq=document.getElementById('sp-lkq'); if(lq&&SP.lkFocus){ lq.focus(); lq.setSelectionRange(lq.value.length,lq.value.length); SP.lkFocus=false; }
 }catch(e){ console.error('StaffPlus',e); } };

/* ---------- clicks and keys ---------- */
document.addEventListener('click',e=>{ const b=e.target.closest&&e.target.closest('[data-sp]');
 if(SP.menu&&!e.target.closest('.sp-menu')){ SP.menu=false; const p=document.getElementById('sp-pop'); if(p) p.hidden=true; }
 if(!b) { if(e.target.closest&&e.target.closest('[data-act="close"],[data-act="card"]')) SP.lkOpen=null; return; }
 const a=b.dataset.sp;
 if(a==='menu'){ SP.menu=!SP.menu; const p=document.getElementById('sp-pop'); if(p) p.hidden=!SP.menu; b.setAttribute('aria-expanded',SP.menu?'true':'false'); return; }
 if(a==='tab'){ SP.tab=b.dataset.t; SP.lkOpen=null; S.page=null; try{ localStorage.setItem('sp-tab',SP.tab); }catch(x){} render(); scrollTo(0,0); return; }
 if(a==='refresh'){ b.textContent='↻ Loading…'; refreshAll(); try{ if(typeof load==='function') load(); }catch(x){} return; }
 if(a==='csv'){ csv(); return; } if(a==='print'){ window.print(); return; }
 if(a==='now'){ SP.nowOpen=!SP.nowOpen; render(); return; }
 if(a==='gsf'){ SP.gsF=b.dataset.f; render(); return; } if(a==='lkf'){ SP.lkF=b.dataset.f; render(); return; } if(a==='lvf'){ SP.lvF=b.dataset.f; render(); return; }
 if(a==='lklv'){ if(SP.lkOpen){ SP.lkOpen.lv=Number(b.dataset.v); render(); } return; }
 if(a==='lksq'){ SP.lkOpen={id:b.dataset.id,k:b.dataset.k}; loadDet(b.dataset.id,b.dataset.k,true); S.open=null; S.card=null; render(); return; }
 if(a==='lkclose'){ SP.lkOpen=null; render(); return; }
 if(a==='mark'||a==='unmark'){ const key=b.dataset.id+'|'+b.dataset.l; if(a==='mark'&&SP.arm!==key){ SP.arm=key; render(); return; }
  SP.arm=null; SP.busy=true; render(); run('sgKodeshMark',S.token,b.dataset.id,b.dataset.l,'',a==='unmark').then(r=>{ SP.busy=false; SP.lk=r; if(SP.lkOpen){ if(!SP.lkOpen.lv){ const D=SP.det[SP.lkOpen.id+'|'+SP.lkOpen.k], x=D&&D.lessons&&D.lessons.find(y=>y[0]===b.dataset.l); if(x) SP.lkOpen.lv=x[2]; } loadDet(SP.lkOpen.id,SP.lkOpen.k,true); } try{ toast(a==='mark'?'Bechina marked. The student will see it as done.':'Mark removed.'); }catch(x){} render(); }).catch(err=>{ SP.busy=false; SP.err=msg(err); try{ toast(SP.err); }catch(x){} render(); }); return; }
 if(a==='setlv'){ const id=b.dataset.id,k=b.dataset.k,sel=document.querySelector(`[data-sp-sel="${CSS.escape(id+':'+k)}"]`),lv=sel&&Number(sel.value); if(!lv){ if(sel) sel.focus(); return; }
  SP.busy=true; SP.err=''; render(); run('sgLevel',S.token,id,k,lv).then(r=>{ SP.busy=false; try{ if(r&&r.id&&typeof put==='function') put(r); }catch(x){} try{ toast('Level saved.'); }catch(x){} loadLv(); }).catch(err=>{ SP.busy=false; SP.err=msg(err); render(); }); return; }
});
document.addEventListener('change',e=>{ const s=e.target; if(s&&s.matches&&s.matches('[data-sp="gss"]')){ SP.gsSort=s.value; render(); } if(s&&s.matches&&s.matches('[data-sp="grp"]')){ SP.grp=s.value; try{ localStorage.setItem('sp-grp',SP.grp); }catch(x){} render(); } });
document.addEventListener('input',e=>{ if(e.target&&e.target.id==='sp-lkq'){ SP.lkQ=e.target.value; SP.lkFocus=true; render(); } });
document.addEventListener('keydown',e=>{ const tag=(e.target.tagName||'').toLowerCase();
 if(e.key==='/'&&tag!=='input'&&tag!=='textarea'&&tag!=='select'){ const q=document.getElementById(SP.tab==='lk'?'sp-lkq':'q'); if(q){ e.preventDefault(); q.focus(); } }
 if(e.key==='Escape'){ if(SP.lkOpen){ SP.lkOpen=null; render(); } if(SP.menu){ SP.menu=false; const p=document.getElementById('sp-pop'); if(p) p.hidden=true; } } });
window.SPX={SP,inGrp:id=>inGrp(id),grpName:()=>grpName(),lkName:id=>lkName(id)};
if(S.d&&S.d.boys) render();
})();
</script>
