(function () {
  var P = {
    c45_moonroad: { title: 'Two Texts About the Moon Landing', text: 'TEXT A: The Road to the Moon\nIn 1957, a country called the Soviet Union sent the first satellite, Sputnik, around the Earth. The race to space had begun. In 1961, President John F. Kennedy said that America should land a man on the moon before 1970. Next, in December 1968, the three astronauts of Apollo 8 became the first people to circle the moon. Then, on July 16, 1969, a giant rocket lifted Apollo 11 off the ground in Florida. Four days later, on July 20, Neil Armstrong and Buzz Aldrin landed on the moon. Michael Collins stayed above, circling the moon. Finally, on July 24, all three astronauts splashed down safely in the Pacific Ocean.\nTEXT B: How Do You Land on the Moon?\nLanding on the moon was full of problems. The first problem was that the moon has no air, so wings and parachutes cannot slow a spaceship down. The solution was a lander with a rocket engine that pointed down and fired to slow it. The second problem was getting home, since there is no launch pad on the moon. The solution was to build the lander in two parts. The bottom half became the launch pad, and the top half flew back up. The last problem came in the final minutes. The landing spot was full of boulders. To solve it, Armstrong flew the lander himself, past the rocks, to a smooth place. He landed with less than a minute of fuel left.' },
    c45_jewishmonth: { title: 'The Moon and the Jewish Month', text: 'The Jewish calendar follows the moon. Each month starts when a new moon begins, about every twenty-nine and a half days.\nAt the start of the month, the moon is between the Earth and the sun. Its sunny side faces away from us, so we cannot see it. This moment is called the molad, the "birth" of the new moon. In most months, the time of the molad is announced in shul on the Shabbos before Rosh Chodesh.\nA day or two later, a thin silver curve appears in the evening sky. Night after night, the curve grows wider. About a week into the month, half of the moon is lit. In the middle of the month, the whole moon shines. That is why Pesach and Sukkos, which start on the fifteenth of the month, always come with a full moon. Then the moon shrinks again, night after night, until it disappears and a new month begins.\nWhile the moon is growing, men and boys go outside on a clear night, often on Motzaei Shabbos, to say Kiddush Levana, a special bracha we say when we see the moon. It is said from a few days after the molad until the middle of the month.' },
    c45_cratertwo: { title: 'Two Texts About Moon Craters', text: 'TEXT A: Why the Moon Is Covered with Craters\nLook at the full moon through binoculars, and you will see round holes everywhere. These holes are called craters. They were made by rocks from space that crashed into the moon. When a big space rock hits, it blasts out a bowl-shaped hole, so a crater forms. Small space rocks burn up when they fly through air. The moon has no air, so even small rocks smash into it. And because the moon has no wind or rain to wear them away, its craters stay for billions of years.\nTEXT B: Two Neighbors in Space\nThe Earth and the moon are neighbors, but they are very different. Both were hit by rocks from space long ago. The Earth is wrapped in air, while the moon has none. On Earth, wind, rain and rivers slowly wear old craters away, and plants grow over them. On the moon, nothing wears them away. The Earth is full of color: blue seas, green forests and white clouds. The moon, unlike the Earth, is gray and dusty from end to end. Even a footprint left on the moon could last for millions of years.' },
    c45_b4chapters: { title: 'The Map in Zeidy\'s Attic: Chapters 1 to 6 in Short', text: 'Chapter 1, One Box a Year: On Chanukah, Yehuda finds an old map of Baltimore in Zeidy\'s attic, with a tiny star near the harbor and three Hebrew letters. Zeidy says his own Zeidy, Mottel, carried "the most precious thing in Baltimore" out of a great fire. What is under the star?\nChapter 2, Six Heads Around a Map: The crew studies the map. They find an old street name, shading that stops at a stream, and a building marked with a tiny cap. On the back, faint pencil says: "Messenger. February 10. Page 6."\nChapter 3, The Paper from 1904: At the library, the boys find that old newspaper page. It tells of a young man carrying a bundle away from the fire. But it also says the minyan fears its sacred scroll was lost.\nChapter 4, The Water Stain: At the history society, a shul\'s old minute book says the scroll was carried out of the fire. Then Yehuda sees Zeidy\'s umbrella there. Zeidy has been searching alone.\nChapter 5, Next Week: At the Shabbos table, Yehuda asks too many questions, and Zeidy leaves the table. After Havdalah, Zeidy tells him to lock the box. "Some things," says Zeidy, "should stay lost."\nChapter 6, Under the Tape: The crew wants to keep searching in secret, but a Rav says to honor Zeidy. In the attic, Yehuda sees tiny words under the old tape, and his hand stops.\nThe book has 12 chapters. Chapters 7 to 12 are still ahead.' },
    c45_telescope: { title: 'The Telescope on the Porch (a short chapter book)', text: 'Chapter 1, Science Night: Dovid Lerner wants to show the moon\'s craters at the class science night, one week away. His Zeidy lends him an old telescope, and Dovid sets it up on the back porch. But when he looks through it, the moon is only a gray blur.\nChapter 2, The Empty Pocket: Binyamin reads Zeidy\'s old instruction sheet. It says the telescope needs a small lens, called an eyepiece, right by your eye. Then Dovid finds an empty felt pocket in the lid of the case. Now he knows why the moon looked like a blur: the eyepiece is missing.\nChapter 3, Clouds All Week: Zeidy searches every closet, but the eyepiece is gone. The store cannot send a new one until after science night. And every night that week, thick clouds cover the sky.\nChapter 4, Science Night: Abba remembers Zeidy\'s old magnifying glass. Dovid fits its lens into a cardboard tube to make a new eyepiece. On science night, the clouds move away, and the whole class sees the craters, sharp and clear.' },
    c45_levana: { title: 'Under the New Moon (a poem by Avrumi Katz)', text: 'Shabbos is out, Havdalah done,\nthe flame is gone, the week begun,\nAbba and I step out the door\nto see the moon once more.\n\nClouds have covered every star.\nWe cannot see it, near or far.\nAbba says, "Wait patiently.\nWe say it only when we see."\n\nWind blows. The clouds slide by,\nthere\'s the moon, up in the sky!\nWe say it, and rise three times,\n"Shalom aleichem," like chimes!\n\nThe moon goes dark, then new;\nit starts again; we can too.\nLeave old mistakes behind;\na fresh start is there to find.' },
    c45_landingplay: { title: 'The Night of the Landing (a short play)', text: 'SCENE 1. A living room in Baltimore, July 20, 1969. A radio sits on the table.\nSHMUEL (age 11): Abba, the radio says they are almost at the moon!\nABBA: Sit, Shmuel\'ke. Tonight, history happens.\nSCENE 2. The same room, a few minutes later. Everyone leans toward the radio.\nRADIO: The lander is low on fuel. They are still searching for a safe place to land.\nSHMUEL (whispering): What if they cannot find one?\nABBA: Then we wait, and we hope.\nSCENE 3. The same room. A voice crackles from the radio.\nRADIO: "Houston, Tranquility Base here. The Eagle has landed."\nSHMUEL (jumping up): They did it! They are on the moon!\nSCENE 4. Many years later. Zeidy Shmuel Katz sits with his grandson, Avrumi.\nZEIDY: That night I learned something, Avrumi. Big things take patience, and many people working together.\nAVRUMI: Like a sefer Torah, Zeidy. One careful letter at a time.' },
    c45_rocketplay: { title: 'The Model Rocket (a short play)', text: 'SCENE 1. Dovid\'s basement, Sunday. Cardboard and tools cover the table.\nDOVID: Science night is Thursday. Our rocket will fly higher than the roof!\nBINYAMIN: First, we read the directions. All of them.\nSCENE 2. The park, Tuesday. Mr. Lerner stands far back, holding the launch button.\nMR. LERNER: Three, two, one!\n(The rocket wobbles, flips over and crashes into the grass. One fin snaps off.)\nDOVID: Only two days left, and it is broken!\nSCENE 3. Dovid\'s basement, Tuesday night.\nBINYAMIN: Look. The three fins were never the same size. That is why it wobbled.\nDOVID (slowly): So we make new fins and measure every one.\n(Wednesday, in the park, the new rocket shoots straight up.)\nDOVID: It works!\nSCENE 4. Science night, Thursday. The class claps for the rocket.\nDOVID: It flew straight because we slowed down and measured.\nBINYAMIN: Fast hands build a rocket. Careful hands make it fly.' },
    c45_moonmonth: { title: 'The Moon\'s Month (a poem)', text: 'A new month. A curve of white\nhangs low above the trees,\na thread of borrowed light\nthat seems to ride the breeze.\n\nEach night the silver grows\nfrom half to nearly round,\nthen, on the fifteenth, throws\nits light on all the ground.\n\nSlowly, slowly, it grows thin\nand fades into the night.\nBut wait. New months begin\nwith one more thread of light.' },
    c45_sunrises: { title: 'Sixteen Sunrises (a poem)', text: 'On the station, far from home,\nthe astronauts float free.\nThey watch the Earth below,\nall cloud and land and sea.\n\nThey race around so fast\nthe sun climbs up, and then\nin about an hour has passed\nfrom day to night again.\n\nSleeping bags hang on the wall,\nthey chase each floating drop,\nand sixteen sunrises in all\nlight up their day nonstop.' }
