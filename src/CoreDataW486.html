(function () {
  var LESSONS = {
  'WRIT.ESSAY.L05.01':{name:'POW + WWW',
  teach:[
    {how:'Good story writers plan before they write. The trick is POW. P: Pick my idea. O: Organize my notes. W: Write and say more. Say it with me: POW!', q:'Tzvi Hirsch wants to write a story. He chooses the Erev Shabbos the bakery van broke down. Which POW step is that?', o:['Pick my idea','Organize my notes','Write and say more']},
    {how:'To Organize my notes, ask the W-W-W questions, one at a time: Who? When? Where? What does he want? What happens? How does it end? How does he feel? Jot a few words for each, not whole sentences.', q:'Tzvi Hirsch’s note says: “Friday morning, Erev Shabbos.” Which W-W-W question does it answer?', o:['When?','Who?','Where?']},
    {how:'The mistake: skipping the plan and just starting to write. The story wanders and forgets its ending. Plan first. Then Write and say more: turn each note into sentences, and add details.', q:'Which boy is doing the step Write and say more?', o:['Dovid turns his notes into sentences and adds details.','Dovid chooses a story about his gadget.','Dovid jots “basement, Sunday” on his plan.']}
  ],
  practice:[
    {t:'sort', q:'Tzvi Hirsch’s plan notes. Sort each note: which W-W-W question does it answer?', bins:[{id:'O',label:'👦 Who?'},{id:'N',label:'🕐 When?'},{id:'R',label:'📍 Where?'}],
      items:[{label:'Tzvi Hirsch and Abba',bin:'O'},{label:'Erev Shabbos morning',bin:'N'},{label:'outside the bakery on the corner',bin:'R'},{label:'four hours before Shabbos',bin:'N'},{label:'the Crew from Glen Avenue',bin:'O'}],
      h:'A person is Who. A time is When. A place is Where.'},
    {t:'pairs', q:'Match each W-W-W question to Tzvi Hirsch’s note.', pairs:[['What does he want?','to get 30 challos to families before Shabbos'],['What happens?','the van will not start, so the Crew brings wagons'],['How does it end?','every challah arrives in time']],
      h:'Want is his goal. Happens is what goes on as he tries. End is how it all works out.'},
    {t:'spotall', q:'Tap every job that belongs to the O step: Organize my notes.', cells:[{label:'Answer Who? When? Where?',ok:true},{label:'Jot a few words for each W',ok:true},{label:'Note how it ends',ok:true},{label:'Choose which story to tell',ok:false},{label:'Write whole sentences with details',ok:false}],
      h:'Organize means filling in the W-W-W notes. Choosing the story comes before it. Writing sentences comes after it.'},
    {t:'order', q:'A story plan goes in story order. Put these W-W-W questions in order. Tap the tiles in order.', tiles:['Who? When? Where?','What does he want?','What happens?','How does it end?'],
      h:'First meet the character and the place. Then his goal. Then what happens. The ending comes last.'},
    {t:'sort', q:'Binyamin is writing about his chess game with Zeidy. Sort each line: a plan note, or a story sentence?', bins:[{id:'P',label:'📝 Plan note'},{id:'S',label:'📖 Story sentence'}],
      items:[{label:'Binyamin, Zeidy',bin:'P'},{label:'Motzei Shabbos, living room',bin:'P'},{label:'Binyamin set up the board while Zeidy poured the tea.',bin:'S'},{label:'wants to win one game',bin:'P'},{label:'Zeidy smiled and slid his knight forward.',bin:'S'}],
      h:'A plan note is a few words. A story sentence is a whole sentence with details: that is Write and say more.'},
    {t:'spotall', q:'Yehuda’s notes: “Yehuda, Sukkos night, his family’s sukkah, wants to find the lost lulav.” Tap every W-W-W question his notes ANSWER.', cells:[{label:'Who?',ok:true},{label:'When?',ok:true},{label:'Where?',ok:true},{label:'What does he want?',ok:true},{label:'How does it end?',ok:false},{label:'How does he feel?',ok:false}],
      h:'Check each part of his note. Which questions does it answer? Which ones still have no note?'},
    {t:'write', q:'Your turn to plan. Pick a true story: a time you helped get ready for Shabbos or Yom Tov. Your own true story uses “I”, like “I helped Abba carry the boxes.” Write POW at the top. Then write a few words for each W-W-W question.', min:0, checks:['💡 I picked one idea.','📝 I wrote a note for every W-W-W question.','✍️ My notes are a few words each, ready to write and say more.'], h:'Think of one real day. Then go down the list: Who? When? Where? What did he want? What happened? How did it end? How did he feel?'}
  ],
  check:[
    {q:'Avrumi has finished his notes. Now he writes: “Avrumi carried the rolled-up map into shul.” Then he adds two more details. Which POW step is he doing?', o:['Write and say more','Organize my notes','Pick my idea'], h:'Is he choosing a story, jotting notes, or turning notes into sentences?'},
    {q:'Binyamin’s plan note says: “scared at first, then proud.” Which W-W-W question does it answer?', o:['How does he feel?','How does it end?','What happens?'], h:'Look at the words in the note. Are they about events, the ending, or something inside him?'},
    {t:'order', q:'Dovid plans a story. Put his notes in W-W-W order. Tap the tiles in order.', tiles:['Dovid, in his basement, Sunday','wants to build a bird feeder','the glue will not hold','he uses screws, and it works'], h:'Who, when and where come first. Then what he wants. Then what happens. Then how it ends.'}
  ],
  re:[
    {how:'A new way: POW is like a trip. Pick where to go. Organize your bag. Then go!', q:'In POW, what does the O stand for?', o:['Organize my notes','Open the story','Only one idea']},
    {how:'A simpler step: answer just the first three W’s: Who? When? Where? A person, a time, a place.', q:'Note: “in the shul kitchen.” Which W does it answer?', o:['Where?','Who?','When?']},
    {how:'The skill underneath: Paragraph Builder (Level 4). A paragraph has parts in order. A story plan has parts in order, too.', q:'In a paragraph, what comes first?', o:['the topic sentence','the closing','a detail']}
  ]},

  'WRIT.PARA.L05.10':{name:'Open the Scene',
  teach:[
    {how:'A story opening drops the reader right into the scene. In the first two or three sentences, tell WHO the story is about, WHERE he is, and THE PROBLEM: what goes wrong, or what he needs.', q:'Opening: “Tzvi Hirsch stood outside the bakery on Erev Shabbos. Thirty challos sat in boxes, but the van would not start.” Which part is the problem?', o:['the van would not start','Tzvi Hirsch','outside the bakery']},
    {how:'The problem is the engine of a story. With no problem, nothing happens, and the reader stops reading. Who and where with no problem is just a picture.', q:'Which opening has a problem?', o:['Dovid sat in his basement. His robot had lost a wheel, and the fair was tomorrow.','Dovid sat in his basement. It was a sunny day.','Dovid has a basement full of gadgets.']},
    {how:'Two mistakes. A slow start: “I woke up. I davened. I ate breakfast.” The reader waits and waits for the story. Announcing: “Hi! My story is about Sukkos.” Do not announce. Jump right in, close to the problem.', q:'Which opening jumps right in?', o:['The lulav was gone, and Sukkos started in one hour.','I woke up and brushed my teeth.','Hi! My story is about Sukkos.']}
  ],
  practice:[
    {t:'sort', q:'Tzvi Hirsch’s opening, in parts. Sort each part: who, where, or the problem?', bins:[{id:'O',label:'👦 Who'},{id:'R',label:'📍 Where'},{id:'P',label:'⚠️ The problem'}],
      items:[{label:'Tzvi Hirsch and his Abba',bin:'O'},{label:'outside the bakery on the corner',bin:'R'},{label:'the van would not start',bin:'P'},{label:'in the cold parking lot',bin:'R'},{label:'thirty challos still had to go out',bin:'P'}],
      h:'A person is who. A place is where. Something that goes wrong, or something he needs, is the problem.'},
    {t:'spotall', q:'Tap every opening that tells who, where AND the problem.', cells:[{label:'Yehuda stood in the dark sukkah. The wind had blown the schach away.',ok:true},{label:'Avrumi sat in class. His map was missing from his desk.',ok:true},{label:'Dovid was in the basement.',ok:false},{label:'Binyamin played chess.',ok:false},{label:'In the kitchen, the cake was burnt.',ok:false}],
      h:'Check all three for each one: a person, a place, and something wrong.'},
    {t:'pairs', q:'Match each opening to its kind.', pairs:[['The cholent pot cracked an hour before Shabbos.','jumps right in'],['I woke up, got dressed and ate cereal.','a slow start'],['This story is about my Shabbos.','announcing']],
      h:'Does it go straight to the problem? Does it make the reader wait? Or does it tell what the story is about?'},
    {t:'order', q:'Build Tzvi Hirsch’s opening. Tap the sentences in order.', tiles:['On Erev Shabbos, Tzvi Hirsch ran out of the bakery.','His thirty challah orders waited by the door.','But the delivery van would not start.'],
      h:'Who and where come first. Then what is waiting. The problem comes last, and it starts with But.'},
    {t:'sort', q:'Sort each opening: jumps right in, or a slow start?', bins:[{id:'J',label:'🚀 Jumps right in'},{id:'S',label:'🐢 Slow start'}],
      items:[{label:'The lights went out just as the guests came in.',bin:'J'},{label:'I got up and put on my shoes and my coat.',bin:'S'},{label:'Binyamin’s king was trapped, and Zeidy was smiling.',bin:'J'},{label:'First I ate breakfast, and then I got dressed.',bin:'S'}],
      h:'Is something already going wrong? Or is it a normal morning that makes the reader wait?'},
    {t:'spotall', q:'Tap every sentence that could be THE PROBLEM in a story.', cells:[{label:'The van would not start.',ok:true},{label:'Zeidy’s glasses were lost.',ok:true},{label:'The bus left without Dovid.',ok:true},{label:'The sky was blue.',ok:false},{label:'Yehuda likes cholent.',ok:false}],
      h:'A problem is something that goes wrong, or something a character must fix.'},
    {t:'write', q:'Your turn to write. Use your POW plan from last time. Write the first 2 or 3 sentences of your story: who, where, and the problem.', min:0, checks:['👦 My opening tells who.','📍 It tells where.','⚠️ It gets to the problem fast, with no slow start.'], h:'Look at your Who, When and Where notes. Then look at What happens. Put them together in 2 or 3 sentences.'}
  ],
  check:[
    {q:'Opening: “In the shul kitchen, Binyamin held the tray. The kiddush cake had slid onto the floor.” What do the words “in the shul kitchen” tell?', o:['where','who','the problem'], h:'Is it a person, a place, or something that went wrong?'},
    {q:'Avrumi’s story begins: “I packed my bag. I zipped my coat. I walked to the corner.” What kind of opening is this?', o:['a slow start','jumps right in','announcing'], h:'Is anything going wrong yet? Does the reader have to wait?'},
    {t:'order', q:'Build Dovid’s opening. Tap the sentences in order.', tiles:['Dovid stood in the school gym on the morning of the science fair.','His robot sat on the table, ready to go.','But when he pressed the button, nothing happened.'], h:'Who and where first. Then set up the scene. The problem comes last.'}
  ],
  re:[
    {how:'A new way: an opening is a camera. Point it at WHO. Show WHERE he is. Then zoom in on the problem.', q:'What does the camera zoom in on last?', o:['the problem','the sky','the title']},
    {how:'A simpler step: find the problem first. It is the part where something goes wrong, or someone needs help.', q:'“Yehuda ran to the bus stop, but the bus was gone.” Which part is the problem?', o:['the bus was gone','Yehuda','the bus stop']},
    {how:'The skill underneath: Umbrella Sentence. A topic sentence tells the reader what a paragraph is about. A story opening tells him what the story is about.', q:'Where does the topic sentence go in a paragraph?', o:['first','last','in the middle']}
  ]},

  'WRIT.PARA.L05.11':{name:'Then What?',
  teach:[
    {how:'A story tells events in the order they happened. Time words show the reader the order. At the beginning: First, or One morning. In the middle: Next, After that, Later. At the end: Finally, or In the end.', q:'Tzvi Hirsch tells his story. Which time word fits the very first event?', o:['First,','Finally,','After that,']},
    {how:'“Just then” (or “Suddenly”) is a special time word for the middle. It shows something SURPRISING happens right at that moment. It wakes the reader up.', q:'Which sentence uses a time word for a surprise?', o:['Just then, the van’s engine coughed and died.','First, the boys packed the challos.','Finally, Shabbos came.']},
    {how:'The mistake: “and then … and then … and then.” Every event sounds the same, and the reader gets tired. Use different time words.', q:'Which one has the “and then” mistake?', o:['And then they packed, and then they loaded, and then they drove.','First they packed. After that, they loaded the wagon.','Later, they pulled the wagon to shul.']}
  ],
  practice:[
    {t:'order', q:'Put Tzvi Hirsch’s story in order. Use the time words. Tap the sentences in order.', tiles:['First, Tzvi Hirsch loaded the challos into the van.','Just then, the engine died.','After that, the Crew ran over with wagons.','In the end, every challah arrived before Shabbos.'],
      h:'Find the beginning word first. The surprise comes next. The end word goes last.'},
    {t:'sort', q:'Sort each time word: the beginning, the middle, or the end of a story?', bins:[{id:'B',label:'🟢 Beginning'},{id:'M',label:'🟡 Middle'},{id:'E',label:'🔴 End'}],
      items:[{label:'First,',bin:'B'},{label:'One morning,',bin:'B'},{label:'After that,',bin:'M'},{label:'Just then,',bin:'M'},{label:'In the end,',bin:'E'},{label:'Finally,',bin:'E'}],
      h:'Does the word start the story, keep it moving, or wrap it up?'},
    {t:'pairs', q:'Match each part of a story to its time word.', pairs:[['the start of the day','One morning,'],['a sudden surprise','Just then,'],['the very last thing','In the end,']],
      h:'Which word starts? Which one surprises? Which one wraps up?'},
    {t:'spotall', q:'Yehuda’s story: “Later, he checked under the bench. Next, he asked Abba. Finally, he found the lulav in the car.” Tap every time word.', cells:[{label:'Later',ok:true},{label:'Next',ok:true},{label:'Finally',ok:true},{label:'bench',ok:false},{label:'lulav',ok:false},{label:'car',ok:false}],
      h:'A time word tells WHEN in the story. A thing or a place is not a time word.'},
    {t:'sort', q:'Sort each story: good time words, or the “and then” mistake?', bins:[{id:'G',label:'✅ Good time words'},{id:'A',label:'🔁 And then, and then'}],
      items:[{label:'First they ate. After that, they sang.',bin:'G'},{label:'And then they ate and then they sang and then they slept.',bin:'A'},{label:'Later, Abba told a story. Finally, they bentched.',bin:'G'},{label:'And then he ran and then he fell.',bin:'A'}],
      h:'Does each event get its own time word? Or does every event start with and then?'},
    {t:'order', q:'Put Binyamin’s chess story in order. Tap the sentences in order.', tiles:['One Sunday, Binyamin asked Zeidy for a game.','Later, Zeidy trapped his queen.','Just then, Binyamin saw a way out.','In the end, he won his first game.'],
      h:'Start with the beginning word. His queen is trapped before he can see a way out of it. The end word goes last.'},
    {t:'write', q:'Your turn to write. Write the middle of your story in 4 sentences. Start each one with a different time word. Use Just then for the surprise.', min:0, checks:['🟢 My events are in the order they happened.','⏰ Each sentence starts with a different time word.','🔁 I did not write and then, and then.'], h:'Look at your What happens note. Break it into 4 steps. Give each step its own time word.'}
  ],
  check:[
    {q:'Yehuda’s story: he loses his esrog box, he searches the house, and he finds it. Where in the story do the words “After that,” belong?', o:['the middle','the beginning','the end'], h:'Does the word start a story, keep it moving, or wrap it up?'},
    {q:'Dovid is flying his kite in the park. All at once, a gust of wind snaps the string. Which time word fits that moment?', o:['Just then,','First,','In the end,'], h:'Is this the start, a sudden surprise, or the wrap-up?'},
    {t:'order', q:'Put Avrumi’s story in order. Tap the sentences in order.', tiles:['First, Avrumi drew a map for the Chanukah party.','Next, he hung it by the shul door.','Just then, a guest knocked it down.','In the end, he taped it up higher.'], h:'Beginning word first. Then the middle words, with the surprise. The end word goes last.'}
  ],
  re:[
    {how:'A new way: time words are stepping stones across a stream. Step on them in order, and the reader crosses safely.', q:'Which stepping stone comes last?', o:['In the end,','First,','Next,']},
    {how:'A simpler step: learn just two words first. One starts a story, and one ends it.', q:'Which word starts a story?', o:['First,','Finally,','Later,']},
    {how:'The skill underneath: Paragraph Builder (Level 4). The details in a paragraph go in an order that makes sense.', q:'In a paragraph, what comes right after the topic sentence?', o:['the details','the closing','the title']}
  ]},

  'WRIT.PARA.L05.12':{name:'Five-Senses Camera',
  teach:[
    {how:'Your story is a movie in the reader’s head. Be a camera with five senses: what can he SEE, HEAR, SMELL, TASTE and TOUCH? One sense detail makes the scene come alive.', q:'Tzvi Hirsch’s bakery. Which detail uses the sense of smell?', o:['The kitchen smelled of warm challah and cinnamon.','The trays were silver and shiny.','The mixer whirred loudly.']},
    {how:'Pick details the reader can almost feel. Sounds are strong: a slam, a whir, a crunch. Touch is strong too: hot, sticky, icy, rough.', q:'Which detail uses touch?', o:['The dough felt soft and sticky in his hands.','The oven bell dinged.','The rugelach tasted sweet.']},
    {how:'The mistake: a vague word like “nice”, “good” or “fun”. The reader cannot see “nice”. A vague word is not a sense detail. Swap it for one.', q:'Which sentence is vague?', o:['The bakery was nice.','The bakery smelled of fresh bread.','Flour dusted every table.']}
  ],
  practice:[
    {t:'sort', q:'Tzvi Hirsch’s bakery scene. Sort each detail: see, hear, or smell?', bins:[{id:'S',label:'👀 See'},{id:'H',label:'👂 Hear'},{id:'M',label:'👃 Smell'}],
      items:[{label:'golden braided challos',bin:'S'},{label:'the oven door banged shut',bin:'H'},{label:'warm cinnamon in the air',bin:'M'},{label:'flour on Abba’s apron',bin:'S'},{label:'the bell over the door rang',bin:'H'}],
      h:'Ask: would I know this with my eyes, my ears, or my nose?'},
    {t:'pairs', q:'Match each sense to its detail.', pairs:[['taste','sour pickles from the barrel'],['touch','the icy wagon handle'],['hear','the wagon wheels rattling']],
      h:'Which one goes in your mouth? Which one is in your hands? Which one makes a sound?'},
    {t:'spotall', q:'Fix this draft. Avrumi wrote: “The Purim seudah was fun. The hamantaschen smelled of warm jam. The room was nice. Bright costumes filled every chair. The food was great.” Tap every vague sentence that needs a sense detail.', cells:[{label:'The Purim seudah was fun.',ok:true},{label:'The hamantaschen smelled of warm jam.',ok:false},{label:'The room was nice.',ok:true},{label:'Bright costumes filled every chair.',ok:false},{label:'The food was great.',ok:true}],
      h:'Can the reader see, hear, smell, taste or touch it? If not, it is vague and needs fixing.'},
    {t:'order', q:'Build a sense detail for the walk to shul. Tap the tiles in order.', tiles:['The wagon wheels','rattled','over the','bumpy sidewalk.'],
      h:'Start with WHAT. Then the sound it makes. Then WHERE.'},
    {t:'sort', q:'Sort each sentence: a sense detail, or vague?', bins:[{id:'D',label:'🎥 Sense detail'},{id:'V',label:'🌫️ Vague'}],
      items:[{label:'The sukkah was fun.',bin:'V'},{label:'Paper chains rustled in the wind.',bin:'D'},{label:'Shabbos dinner was good.',bin:'V'},{label:'The soup steamed in the bowls.',bin:'D'}],
      h:'Could a camera with ears and a nose catch it? Or is it a vague word like nice, good or fun?'},
    {t:'pairs', q:'Match each vague sentence to a sense detail that fixes it.', pairs:[['The kiddush was good.','The kugel was crisp and peppery.'],['The night was fun.','The Lag BaOmer bonfire crackled and popped.'],['The music was nice.','The fiddle played fast and bright.']],
      h:'Find the fix that is about the same thing, but lets you taste, feel or hear it.'},
    {t:'write', q:'Your turn to write. Pick one moment from your story. Write 3 sentences about it. Use at least 3 different senses.', min:0, checks:['🎥 I used at least 3 senses.','🌫️ I did not use vague words like nice, good or fun.','📍 My details fit the moment in my story.'], h:'Close your eyes and stand in the moment. What do you see? What do you hear? What do you smell?'}
  ],
  check:[
    {q:'Which sense does this detail use: “The kettle whistled in the kitchen.”?', o:['hear','see','smell'], h:'Would you know it with your eyes, your ears, or your nose?'},
    {q:'Dovid writes: “The science fair was nice.” Mr. Halpern says it is not a sense detail. What is it?', o:['vague','smell','touch'], h:'Can the reader see, hear or feel “nice”?'},
    {t:'order', q:'Build a sense detail for a fall morning. Tap the tiles in order.', tiles:['The leaves','crunched','under','his sneakers.'], h:'Start with WHAT. Then the sound. Then WHERE.'}
  ],
  re:[
    {how:'A new way: close your eyes and stand in the scene. Ask each part of you: eyes, ears, nose, tongue, hands. What do you notice?', q:'Which part tells you a sound?', o:['ears','nose','hands']},
    {how:'A simpler step: start with just two senses: see and hear.', q:'Which one is a hear detail?', o:['the door creaked','the door was red','the door was tall']},
    {how:'The skill underneath: Say More. A sense detail is one way to say more about a moment.', q:'Detail: the bakery was busy. Which sentence says more?', o:['For example, the line went out the door.','It was very, very busy.','The bakery has a sign.']}
  ]},

  'WRIT.PARA.L05.13':{name:'Show the Feeling',
  teach:[
    {how:'“Tzvi Hirsch was worried.” tells the feeling. “Tzvi Hirsch paced by the van and kept checking the clock.” shows the feeling. Showing lets the reader SEE the feeling and figure it out himself. And “Tzvi Hirsch wore a blue jacket.” has no feeling at all.', q:'Which sentence SHOWS that Tzvi Hirsch is worried?', o:['Tzvi Hirsch paced by the van and kept checking the clock.','Tzvi Hirsch was worried.','Tzvi Hirsch wore a blue jacket.']},
    {how:'Three ways to show a feeling. ACTIONS: what his body does. FACE: his eyes, mouth and cheeks. WORDS: what he says, and how he says it. Pick one or two.', q:'“His eyes went wide, and his mouth fell open.” Which way does it show the feeling?', o:['face','actions','words']},
    {how:'The mistake: naming the feeling with a feeling word, like sad, happy, nervous, scared, proud or sleepy. “Eli was nervous.” and “Eli felt scared.” are telling. Cross out the feeling word and show it instead.', q:'Which sentence is telling, not showing?', o:['Yehuda was proud of his clue notebook.','Yehuda held up his notebook and grinned.','“I solved it!” Yehuda called.']}
  ],
  practice:[
    {t:'spotall', q:'Tap every sentence that SHOWS the feeling.', cells:[{label:'Yehuda’s face lit up.',ok:true},{label:'“Yes!” Yehuda cheered.',ok:true},{label:'Yehuda jumped up and down.',ok:true},{label:'Yehuda was glad.',ok:false},{label:'Yehuda felt very happy.',ok:false}],
      h:'Skip any sentence that names the feeling with a feeling word.'},
    {t:'pairs', q:'Match each showing sentence to the feeling it shows.', pairs:[['He yawned and rubbed his eyes.','sleepy'],['He stood up tall and smiled.','proud'],['His hands shook on the doorknob.','nervous']],
      h:'Act it out. What would make your body do that?'},
    {t:'sort', q:'Sort each sentence: does it show the feeling with actions, face, or words?', bins:[{id:'A',label:'🏃 Actions'},{id:'F',label:'🙂 Face'},{id:'W',label:'💬 Words'}],
      items:[{label:'He hugged Zeidy tight.',bin:'A'},{label:'His cheeks turned red.',bin:'F'},{label:'“We did it!” he shouted.',bin:'W'},{label:'He frowned at the board.',bin:'F'},{label:'He ran to the window.',bin:'A'}],
      h:'Quotation marks mean words. Eyes, mouth or cheeks mean face. The rest of his body means actions.'},
    {t:'order', q:'Show that Tzvi Hirsch is worried. Build the sentence. Tap the tiles in order.', tiles:['Tzvi Hirsch','chewed his lip','and stared','at the dead van.'],
      h:'Start with WHO. Then what his face does. Then what he looks at.'},
    {t:'sort', q:'Sort each sentence: shows the feeling, or tells the feeling?', bins:[{id:'S',label:'👀 Showing'},{id:'T',label:'🗣️ Telling'}],
      items:[{label:'Dovid was excited.',bin:'T'},{label:'Dovid hopped from foot to foot.',bin:'S'},{label:'Avrumi felt sad.',bin:'T'},{label:'Avrumi stared at the torn map, and his chin shook.',bin:'S'},{label:'Binyamin was happy.',bin:'T'}],
      h:'Is there a feeling word that names it? Or do you see what he does?'},
    {t:'pairs', q:'Match each telling sentence to a showing sentence for the same feeling.', pairs:[['Binyamin was sad.','Binyamin’s shoulders drooped.'],['Avrumi was nervous.','Avrumi’s knees shook.'],['Dovid was excited.','Dovid bounced on his toes.']],
      h:'Find the showing sentence that a person with that feeling would do.'},
    {t:'write', q:'Your turn to write. Pick the hardest moment in your story. Show how you felt with actions, face and words. Do not use the feeling word.', min:0, checks:['🏃 I showed the feeling with actions or face.','💬 I added words I said.','✂️ I did not name the feeling with a feeling word.'], h:'Act it out first. What did your body do? Your face? What did you say?'}
  ],
  check:[
    {q:'Nosson is new in class, and Rabbi Feldman calls on him to read aloud. “Nosson’s voice shook, and he gripped the edge of his desk.” Does this sentence show the feeling or tell it?', o:['shows the feeling','tells the feeling','has no feeling'], h:'Is there a feeling word? Or do you see what his body and voice do?'},

  'WRIT.PARA.L05.14':{name:'Story Ending',
  teach:[
    {how:'The ending ties up the story. First tell HOW IT WORKED OUT: was the problem solved? Then tell HOW HE FELT and WHAT HE LEARNED. Save what he learned for the very last line. That is the line the reader remembers.', q:'Tzvi Hirsch’s story. Which sentence tells how it worked out?', o:['The last challah reached the Katz house ten minutes before candle lighting.','Tzvi Hirsch learned that friends make heavy jobs light.','Tzvi Hirsch grinned all through Kiddush.']},
    {how:'To tell how he felt, show it with actions, face or words. To tell what he learned, use lesson words: “He learned that,” “Now he knew,” or “From that day on,”.', q:'Which sentence tells what he learned?', o:['Tzvi Hirsch learned that friends make heavy jobs light.','The van was fixed on Sunday.','Tzvi Hirsch grinned all through Kiddush.']},
    {how:'Two mistakes. It JUST STOPS: “And then they went home. The end.” The reader never finds out how it worked out. Or it adds a NEW PROBLEM at the very end, and the reader is left hanging. A good ending has neither.', q:'Which ending just stops?', o:['And then he went to sleep. The end.','In the end, Yehuda found the lulav under the bench.','Now Yehuda knew to check twice before he worried.']}
  ],

    {t:'spotall', q:'Read Dovid’s whole story: “On Erev Chanukah, Dovid stood in his basement. His homemade menorah leaned to one side. First, he checked every cup. Just then, he saw that one leg was too short. After that, Abba helped him glue on a small block. In the end, the menorah stood perfectly straight. Dovid grinned as the first flame glowed. He learned to test his gadgets before the big day.” Tap every sentence that belongs to the ending.', cells:[{label:'On Erev Chanukah, Dovid stood in his basement.',ok:false},{label:'His homemade menorah leaned to one side.',ok:false},{label:'First, he checked every cup.',ok:false},{label:'Just then, he saw that one leg was too short.',ok:false},{label:'After that, Abba helped him glue on a small block.',ok:false},{label:'In the end, the menorah stood perfectly straight.',ok:true},{label:'Dovid grinned as the first flame glowed.',ok:true},{label:'He learned to test his gadgets before the big day.',ok:true}],

    {t:'sort', q:'Sort each ending sentence: how he felt, or what he learned?', bins:[{id:'F',label:'🙂 How he felt'},{id:'L',label:'💡 What he learned'}],
      items:[{label:'He jumped up and cheered.',bin:'F'},{label:'From that day on, he always double-checked.',bin:'L'},{label:'His cheeks glowed.',bin:'F'},{label:'Now he knew that patience pays.',bin:'L'}],
      h:'A feeling shows in his body, face or words. A lesson is something he will do from now on.'},
    {t:'pairs', q:'Match each ending mistake to its fix.', pairs:[['It just stops.','Tell how the problem worked out.'],['It adds a new problem.','Take the new problem out.'],['It never says how he felt.','Show his face, actions or words.']],

    bridge:'WRIT.PARA.L04.01', bridgeName:'Paragraph: topic sentence, three details, closing',

  'WRIT.PARA.L05.12':{ band:'E45', pic:'🎥', today:'Add details for all five senses', why:'Sense details turn your story into a movie the reader can step into.',
    ready:[{q:'Detail: the bakery is busy. Which sentence says more?', o:['For example, the line went out the door.','It is very, very busy.','The sign is blue.'], a:'For example, the line went out the door.'}],
    bridge:'WRIT.PARA.L05.08', bridgeName:'Say More',

      {t:'Taste: one crumb of rugelach, sweet and buttery.'}], a:'The kitchen smelled of warm cinnamon, and the mixer whirred and thumped.' },
    oops:{ q:'Describe the bakery.', wrong:'The bakery was nice.', right:'The bakery smelled of warm cinnamon.', why:'The reader cannot see “nice”. A sense detail puts him in the room.' },
    ways:['frum-family scene','worked example','sort it','match it','word tiles','tap the reason','Mistake Detective'], done:'You can add sense details the reader can see, hear, smell, taste and touch.',

    do:[

        say:'See, hear, or smell? Sort each detail.', how:'Would you know it with your eyes, your ears, or your nose?',
        why:{q:'How do you know “the oven door banged” is a hear detail?', o:['Banged is a sound','It names a color','It is about food','It is long'], a:'Banged is a sound'}},
      {type:'match', pairs:[['Taste','sour pickles from the barrel'],['Touch','the icy wagon handle'],['Hear','the wagon wheels rattling']],
        say:'Match each sense to its detail.', how:'Mouth tastes. Hands touch. Ears hear.'}],
    your:[
      {type:'tiles', q:'Build a smell detail for Shabbos morning.', w:['The challah','smelled of','warm honey.'], extra:['was nice'],

      {type:'sort', q:'Which sentences put you in the scene?', bins:['Sense detail','Mistake: vague'], cards:[['The sukkah was fun.',1],['Paper chains rustled in the wind.',0],['Shabbos dinner was good.',1],['The soup steamed in the bowls.',0]], mis:true,
        say:'Sense detail, or vague? Sort each one.', how:'Could a camera with ears and a nose catch it? Or is it nice, good or fun?',
        why:{q:'Why is “Shabbos dinner was good” a mistake?', o:['The reader cannot see, hear or taste “good”','It is too long','It has no time word','It names Shabbos'], a:'The reader cannot see, hear or taste “good”'}},

        say:'Tap the vague sentence. Then think how to fix it.', how:'For each sentence ask: can I see, hear, smell, taste or touch it?',
        why:{q:'What would fix “The decorations were nice”?', o:['Swap nice for what you see, like shiny gold stars','Add the word very','Turn it into a question','Leave out the sukkah'], a:'Swap nice for what you see, like shiny gold stars'}},
      {type:'tiles', q:'Build a touch detail for the walk to shul.', w:['Cold wind','stung','his cheeks.'], extra:['was good'],
        say:'Build a touch detail from the tiles.', how:'Start with what it is. Then what it did. Then where he felt it.'},
      {type:'sort', bins:['Taste','Touch'], cards:[['salty pretzel twists',0],['a scratchy wool scarf',1],['sweet honey cake',0],['a smooth, cold railing',1]],
        say:'Taste or touch? Sort each detail.', how:'Does it go in your mouth, or do you feel it with your hands?'}] },

  'WRIT.PARA.L05.13':{ band:'E45', pic:'🎭', today:'Show a feeling with actions, face and words', why:'When you show a feeling, the reader feels it too.',
    ready:[{q:'Which sentence has words a character says?', o:['“We did it!” Dovid shouted.','Dovid ran home.','Dovid was tall.'], a:'“We did it!” Dovid shouted.'}],
    bridge:'WRIT.PARA.L05.03', bridgeName:'Story with Dialogue',

    ways:['frum-family scene','worked example','act it out','match it','word tiles','sort it','tap the reason','Mistake Detective'], done:'You can show a feeling with actions, face and words.',

        say:'Showing or telling? Sort each sentence.', how:'A feeling word means telling. What he does means showing.',

      {type:'match', pairs:[['Actions','He ran to hug Zeidy.'],['Face','His cheeks turned pink.'],['Words','“We won!” he cried.']],
        say:'Match each way of showing to its sentence.', how:'Body moves: actions. Eyes, mouth, cheeks: face. Quotation marks: words.'},
      {type:'tiles', q:'Show that Avrumi is proud of his map.', w:['Avrumi','held up','his map','and grinned.'], extra:['felt proud'],
        say:'Build a sentence that shows proud.', how:'Show what he does and his face. Leave out the feeling word.'},
      {type:'sort', bins:['Actions','Face','Words'], cards:[['He hugged Zeidy tight.',0],['His cheeks turned red.',1],['“Yes!” he shouted.',2],['He frowned at the board.',1]],
        say:'Actions, face, or words? Sort each one.', how:'Quotation marks mean words. Eyes, mouth or cheeks mean face.',
        why:{q:'How do you know “He frowned at the board” shows the face?', o:['A frown is on his face','It has quotation marks','He moves his feet','It names a feeling'], a:'A frown is on his face'}},
      {type:'evidence', q:'Dovid waits at the science fair. Which sentence TELLS the feeling instead of showing it?', p:['The judge called the winners up to the stage.','Dovid gripped the edge of his chair.','His knees bounced up and down.','Dovid was very nervous.','“Is it us?” he whispered.'], a:3, look:'the feeling by name',
        say:'Tap the sentence that tells instead of shows.', how:'Find the feeling word. That sentence is telling. The others show it.',
        why:{q:'Why can the writer cut “Dovid was very nervous”?', o:['The other sentences already show it','It is too short','It is a question','It names the judge'], a:'The other sentences already show it'}}] },

        why:{q:'Why is “But then the esrog went missing!” a mistake?', o:['It adds a new problem at the end','It just stops','It tells what he learned','It is too short'], a:'It adds a new problem at the end'}}],

      {type:'tiles', q:'Dovid could not fix his robot alone. Build what he learned.', w:['Now he knew','to ask','for help.'], extra:['broke again'],

      {type:'sort', bins:['How he felt','What he learned'], cards:[['He jumped up and cheered.',0],['He learned that patience pays.',1],['His cheeks glowed.',0],['Now he knew to pack spare parts.',1]],

        why:{q:'How do you know “Now he knew to pack spare parts” tells what he learned?', o:['It is something he will do from now on','It shows his face','It tells the problem','It is a surprise'], a:'It is something he will do from now on'}},

      {type:'tiles', q:'Binyamin finally beat Zeidy at chess. Show how he felt.', w:['Binyamin','smiled','at Zeidy.'], extra:['The end.'],
