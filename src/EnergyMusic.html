/* shared buses: panners and effect sends are made once per song and reused (keeps Chromebooks smooth) */
function bus(c,N,dest,pan,rev,dly){ const k=(dest.__emId||(dest.__emId=++N.ids))+'|'+Math.round(pan*10)+'|'+Math.round((rev||0)*20)+'|'+Math.round((dly||0)*20); if(N.bus[k]) return N.bus[k];

function step(c,N,P,i,t){ const bar=P.bars[i>>4]; if(!bar) return; const s=i&15, sec=bar.sec, b=bar.b, L=bar.len, sty=P.st, st=P.spb/4;

/* ---------- a player with the same shape as Music.html's club tracks ---------- */

  const tick=()=>{ if(done||!N) return; const ahead=c.currentTime+.6; if(i>0&&i<P.steps&&t0+i*P.spb/4<c.currentTime-.05&&!N.lite){ N.lite=true; }  while(i<P.steps){ const sw=(i%2===1)?P.sw*P.spb/4:0, tt=t0+i*P.spb/4+sw; if(tt>=ahead) break; try{ step(c,N,P,i,tt); }catch(e){} i++; }
   if(i>=P.steps&&timer){ clearInterval(timer); timer=null; const end=t0+P.steps*P.spb/4; setTimeout(()=>{ if(!done){ done=true; off(); if(A2.onended) A2.onended(); } },Math.max(0,(end-c.currentTime)*1000)+1800); } };
  timer=setInterval(tick,90); tick(); return c.state==='running'?Promise.resolve():c.resume(); };
