function heb(d){ try{ const p=new Intl.DateTimeFormat('en-u-ca-hebrew',{day:'numeric',month:'long'}).formatToParts(d); return {day:+p.find(x=>x.type==='day').value,month:p.find(x=>x.type==='month').value}; }catch(e){ return null; } }
function occasion(){ const d=today(), h=heb(d); if(!h) return d.getDay()===5?{k:'shabbos'}:null; const add=n=>{ const x=new Date(d); x.setDate(x.getDate()+n); return heb(x); };

 for(let i=0;i<8;i++){ const x=add(-i); if(x&&x.month==='Kislev'&&x.day===25) return {k:'chanukah',night:Math.min(8,i+2),zos:i===7,shabbos:d.getDay()===5}; }

function openStore(t){ try{ if(window.TLSTORE) TLSTORE.tab=t||'fun'; }catch(e){} if(K.go('store')) return; try{ K.closeAll(); if(window.tlStore) tlStore(true); }catch(e){} }
function openBank(){ if(K.go('bank')) return; openStore('week'); }
document.addEventListener('click',e=>{ const b=e.target&&e.target.closest&&e.target.closest('[data-shp]'); if(!b||!b.closest('.shk-page,.shk-pop')) return; const a=b.getAttribute('data-shp'), id=b.getAttribute('data-id'); e.preventDefault();
 try{ if(typeof SND!=='undefined'&&SND.tap) SND.tap(); }catch(x){}
 if(a==='pick') return openPick();
 if(a==='avk') return pickAv(b.getAttribute('data-k'));
 if(a==='sound'){ const on=soundOn(); try{ if(window.TL_MENU) TL_MENU.actions.setSound(!on); }catch(x){} setTimeout(redrawProfile,60); return; }
 if(a==='music'){ if(K.go('music')) return; try{ if(window.TL_MENU) TL_MENU.actions.openMusicPanel(); }catch(x){} return; }
 if(a==='out'){ K.closeAll(); try{ if(window.TL_MENU) TL_MENU.actions.signOut(); }catch(x){} return; }
 if(a==='check'){ K.closeAll(); try{ window.tlOpenCheck(b.getAttribute('data-s')); }catch(x){} return; }
 if(a==='tour'){ K.closeAll(); try{ window.TLTOUR&&TLTOUR.open(); }catch(x){ console.error('tour',x); } return; }
 if(a==='bank') return openBank();
 if(a==='shop') return openStore(b.getAttribute('data-t'));
 if(a==='go') return goPlace(b.getAttribute('data-k'));
 if(a==='lessons'){ LB.f='all'; LB.q=''; return inner('profile-lessons','All my lessons',IC('ycw-ic-lessons'),lessonsHTML(),'ycw-k-library'); }
 if(a==='lf'){ LB.f=b.getAttribute('data-f')||'all'; K.body('profile-lessons',lessonsHTML()); return; }
 if(a==='mr'){ K.closeAll(); try{ window.tlMasteryQuick(); }catch(x){ console.error('review',x); } return; }
 if(a==='tree'){ return inner('profile-tree','Skill tree',IC('ycw-ic-skills'),treeHTML()); }
 if(a==='treew'){ TR.k=b.getAttribute('data-k')||''; K.body('profile-tree',treeHTML()); return; }
 if(a==='node') return nodeSheet(id,b.getAttribute('data-st'));
 if(a==='week') return inner('profile-week','My week',IC('ycw-ic-week'),weekHTML(),'ycw-k-summit');
 if(a==='play'){ if(id) K.openLesson(id); return; }
 if(a==='locked'){ K.pop({id:'profile-node',world:'k',title:nm(id)[0],icon:IC('ycb-ic-lock'),body:`<p>${pill('lock','Locked')} Clear the lessons before it first. Your next one is on My map.</p>`}); return; }
 if(a==='land'){ const k=b.getAttribute('data-k'); try{ if(A.st) A.st.ttLast=k; }catch(x){} return pinner('passport-land',LANDS[k][2],LANDS[k][1],landHTML(k)); }
 if(a==='station') return stationPop(id);
 if(a==='stamps') return pinner('passport-stamps','My stamps',IC('ycw-ic-passport'),stampsHTML());
 if(a==='taryag'){ TQS.w=TQS.w||1; return pinner('passport-taryag','Taryag Quest','✋',taryagHTML()); }
 if(a==='tqw'){ TQS.w=+b.getAttribute('data-w')||1; K.body('passport-taryag',taryagHTML()); return; }
 if(a==='tqpv') return tqPop(id);
 if(a==='dav') return dav(b.getAttribute('data-d'));
 if(a==='scroll'){ css(); K.pop({id:'passport-scroll',world:'k',title:'My Torah scroll',icon:'📜',body:scrollHTML()}); return; }
 if(a==='chm') return openChumash(b.getAttribute('data-p')); });
document.addEventListener('input',e=>{ const t=e.target; if(!t||t.id!=='shp-q') return; LB.q=String(t.value||''); const pos=t.selectionStart; K.body('profile-lessons',lessonsHTML()); const n=document.getElementById('shp-q'); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(x){} } });
/* ===================================================================== THE PLACES */
K.place({id:'profile',name:'My profile',world:'k',get icon(){ return av()||IC('ycw-ic-profile'); },scene:'ycw-k-room',door:'profile',order:60,
 sub:()=>'Badges, levels, my stuff',pill:()=>pill('rank','Rank: '+rankOf(steps()).r[2]),show:()=>K.on(),open:()=>openProfile()});
K.place({id:'trophies',name:'Trophy Hall',world:'k',get icon(){ return IC('ycw-ic-trophy'); },scene:'ycw-k-trophies',door:'profile',order:62,
 sub:()=>'Rank, badges and trophies',pill:()=>{ const B=badges(); return pill('prog',B.filter(earnedB).length+' of '+B.length+' badges'); },show:()=>K.on(),open:()=>openTrophies(false)});
K.place({id:'passport',name:'Torah Tracks',world:'k',get icon(){ return IC('ycw-ic-passport'); },scene:'ycw-k-library',door:'torah',order:64,
 sub:()=>'My passport, Taryag Quest, Torah Plus',pill:()=>{ const a=allStations(); return pill('prog',a.filter(id=>done(id)).length+' of '+a.length+' stamps'); },show:()=>K.on(),open:()=>openPassport(false)});
/* for the home and others: his picture (the same one on the page, the home tile and the Arena) */
window.SHP={av,avHTML,AVS,profile:openProfile,trophies:openTrophies,passport:openPassport};
})();
</script>
