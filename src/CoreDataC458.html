(function () {
  var P = {
    c45_tides: { title: 'Why the Tide Comes In', text: 'Twice a day, the ocean creeps up the beach, and twice a day it slides back out. These changes are called tides. When the water is at its highest, it is high tide. When it is at its lowest, it is low tide.\nWhat moves all that water? Mostly the moon. The moon\'s gravity pulls on the whole Earth, but it pulls hardest on the ocean on the side facing it. The water there bulges toward the moon. A second bulge forms on the far side of the Earth. As the Earth spins, a beach passes through both bulges each day. That is why most beaches have two high tides and two low tides a day.\nThe sun pulls on the oceans too, but less, because it is so far away. Around Rosh Chodesh, and again in the middle of the Jewish month, the sun, the moon and the Earth line up. Then their pulls add together, and the tides are extra high and extra low.\nTides matter to people. Fishermen leave the harbor when the tide is right. At low tide, families can explore tide pools full of crabs and snails. In the Bay of Fundy in Canada, the water can rise more than forty feet between low tide and high tide.' },
    c45_reef: { title: 'Cities Under the Sea', text: 'A coral reef looks like a garden of colorful rocks, but it is really built by animals. Each coral is made of tiny animals called polyps, some no bigger than a pencil eraser. A polyp builds a hard cup of stone around its soft body. When it dies, the cup stays, and new polyps build on top. Over thousands of years, the cups pile up into a reef.\nReefs need warm, clear, shallow water. Tiny plant-like living things called algae live inside the polyps. The algae use sunlight to make food, and they share it with the coral. They also give the coral its bright colors.\nA reef is like a busy city. Reefs cover less than one percent of the ocean floor, but about one out of every four kinds of sea creatures lives on or near a reef. Fish hide in its cracks, and sea turtles and eels hunt among its branches. The biggest reef, the Great Barrier Reef near Australia, is so long that astronauts can see it from space.\nBut reefs are in danger. When the water gets too hot, the coral push out their algae and turn white. Without the algae, they can starve. Scientists and divers are working hard to protect the reefs that are left.' },
    c45_ships: { title: 'Why a Steel Ship Floats', text: 'Dovid Lerner dropped a steel bolt into a tub of water. Plunk! It sank straight to the bottom. "So how," he asked his Abba, "does a giant ship made of steel float?"\nThe answer has to do with pushing. When anything is set in water, it pushes some water out of the way. At the same time, the water pushes back up on it. The more water an object pushes aside, the harder the water pushes up.\nA small, solid bolt pushes aside only a little water. The push is too weak to hold it up, so it sinks. A ship is different. Its steel is spread out into a wide, hollow shape filled with air. Because the ship is so wide, it pushes aside a huge amount of water, and the water pushes up hard enough to hold it.\nDovid tested the idea with modeling clay. First he rolled a lump into a tight ball. It sank. Then he shaped the same lump into a wide, flat boat. It floated! Next he added marbles one at a time. With each marble, the boat sat lower. On the twelfth marble, water poured over the side, and the boat sank.\nReal ships work the same way. That is why every cargo ship has a line painted on its side, called a load line. If the water rises above the line, the ship is carrying too much.' },
    c45_trench: { title: 'The Deepest Place on Earth', text: 'In the Pacific Ocean, near the island of Guam, the sea floor drops into a long, narrow valley called the Mariana Trench. Its deepest spot, the Challenger Deep, is almost 36,000 feet down. Mount Everest, the tallest mountain on land, is about 29,000 feet tall. If you set Everest at the bottom of the trench, its top would still be more than a mile under water.\nDeep water is heavy. The deeper you go, the more water presses down from above. At the bottom of the trench, the water presses more than a thousand times harder than the air at the beach. A person could never survive there without a very strong shell.\nIn 1960, two explorers, Jacques Piccard and Don Walsh, tried anyway. They climbed into a small steel ball with walls about five inches thick, hanging under a diving ship called the Trieste. First they sank slowly for almost five hours. About 30,000 feet down, they heard a loud crack. An outer window had cracked, but they kept going. Then they reached the bottom and stayed about twenty minutes. Finally, they rose back up and returned safely.\nAt the bottom, it is completely dark and very cold, because sunlight cannot reach that deep. Yet scientists have found small shrimp-like animals living there.' },
    c45_kosherfish: { title: 'How Do We Know a Fish Is Kosher?', text: 'On Thursday afternoon, Yehuda Benaim went with his Abba to the fish store. They were buying fish for Savta\'s spicy fish on Friday night. Behind the counter lay salmon, carp and whitefish.\n"Which fish are kosher?" Yehuda asked. "Last week at the aquarium, I saw a shark and a long gray catfish."\n"The Torah gives us two signs," said Abba. "A kosher fish has fins and scales." Fins are the thin flaps a fish uses to swim and steer. Scales are the small, flat plates that cover its skin, like shingles on a roof.\nAbba explained that not everything that looks like a scale counts. A kosher scale can be scraped off with a knife or a fingernail without tearing the skin underneath. A shark\'s skin is covered with tiny hard points that cannot be removed that way, so a shark is not kosher. A catfish has fins but no scales at all, so it is not kosher either.\n"And what if the fish is already cut into pieces?" asked Yehuda.\n"Good question," said Abba. "Without the skin, you cannot see the scales. That is why we buy from a store with a trusted hashgacha, or we buy pieces with some skin still on. And whenever we are not sure, we ask a Rav."\nThey bought a big salmon, its silver scales shining under the lights.' },
    c45_saltsea: { title: 'Why Is the Ocean Salty?', text: 'Most rivers and lakes taste fresh, but the ocean tastes salty. Why?\nIt starts with rain. As rain falls and flows over the land, it slowly wears away tiny bits of rock. Rocks hold minerals, and some of these minerals are salts. The rainwater carries the salts into streams, the streams carry them into rivers, and the rivers carry them into the ocean.\nA river does not taste salty, because the amount of salt in it is very small, and its water keeps moving. But the ocean is where the water stops. The sun warms the ocean, and some of the water evaporates, rising into the air as water vapor. The salt cannot rise with it, so it stays behind in the sea. Then rain falls again, and the circle goes on. This has happened for millions of years, so the salt has built up.\nThere is a lot of it. Scientists say that if all the salt in the ocean were spread over the land, it would make a layer more than 500 feet thick.\nSome waters are even saltier. Yam HaMelach, the Dead Sea in Eretz Yisrael, is almost ten times saltier than the ocean. Water leaves it only by evaporating, so the salt stays behind there too. The water is so full of salt that a person floats on top like a cork.' },
    c45_deeplight: { title: 'Lights in the Deep', text: 'Far below the waves, where sunlight never reaches, the water is as dark as a closet at night. Yet the darkness is full of tiny lights. Many deep-sea animals make their own light. Scientists call this bioluminescence (bye-oh-loo-mih-NESS-ence).\nThe light comes from a chemical reaction inside the animal\'s body, or in tiny living things inside it. Most of it glows blue-green, because blue-green light travels farthest through seawater.\nAnimals use their lights in clever ways. The anglerfish has a long spine on its head with a glowing tip, like a fishing rod with a lantern. Small fish swim toward the light, and the anglerfish snaps them up. Some deep-sea shrimp squirt a glowing cloud into the water when an enemy comes near. While the enemy stares at the cloud, the shrimp darts away.\nScientists think that about three out of every four animals in the deep sea can make light. Explorers in special submarines have turned off their lamps and watched the dark water sparkle all around them.\nThe deep sea is still the least explored place on our planet. Who knows what lights are still waiting to be found?' }
