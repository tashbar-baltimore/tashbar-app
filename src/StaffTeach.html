<style id="wt-css">
/* StaffTeach.html: WHAT WE TEACH, the staff Curriculum area (HoS 2026-11-21, "One button, one job" step 5).
   One view: pick a subject, see a coverage line per grade ("Grade 4: 18 of 18 skills built"), then every skill of that grade in order,
   in plain words (the real skill, with the game name small), whether it is built or coming, and how many boys are working on it and
   have mastered it. One tap on a skill opens its "How to do it", what the boy sees, its check questions and "See it as a boy".
   Server: SkillFlow.js sfFlow (read only, one call per subject, only when the area is opened). No double slash in this file. */
#wt{--ink:#16202C;--mute:#5B6676;--line:#E6EAF2;--link:#2F5BD3;--ok:#178A5E;--thin:#B87D06;--plan:#7A8494}
#wt .wt-seg{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 16px}
#wt .wt-seg button{border:1px solid #D9DFF0;background:#fff;color:var(--ink);border-radius:999px;padding:9px 16px;font:800 15px system-ui,sans-serif;min-height:44px;cursor:pointer}
#wt .wt-seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#wt .wt-sum{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:16px}
#wt .wt-sum h2{margin:0 0 4px;font:900 20px/1.2 system-ui,sans-serif;color:var(--ink)}
#wt .wt-sum p{margin:0;color:var(--mute);font-size:14.5px}
#wt .wt-grades{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-top:14px}
#wt .wt-g{border:1px solid var(--line);background:#F8FAFF;border-radius:14px;padding:10px 12px;text-align:left;cursor:pointer;font:inherit;color:var(--ink);min-height:64px}
#wt .wt-g b{display:block;font:900 15px system-ui,sans-serif}
#wt .wt-g small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
#wt .wt-g i{display:block;height:6px;border-radius:3px;background:#E2E8F0;margin-top:7px;overflow:hidden}
#wt .wt-g i span{display:block;height:100%;background:var(--ok)}
#wt .wt-g.on{background:var(--ink);color:#fff;border-color:var(--ink)}#wt .wt-g.on small{color:#CBD5E1}#wt .wt-g.on i{background:#334155}
#wt .wt-g.gap small{color:#B45309}#wt .wt-g.on.gap small{color:#FCD34D}
#wt .wt-lvl{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin:6px 0 10px}
#wt .wt-lvl h2{margin:0;font:900 22px/1.2 system-ui,sans-serif;color:var(--ink)}
#wt .wt-lvl span{color:var(--mute);font-size:14px}
#wt .wt-lane{margin:16px 0 6px;font:800 13px/1.2 system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
#wt .wt-lane small{display:block;text-transform:none;letter-spacing:0;font-weight:600;margin-top:3px}
#wt .wt-list{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
#wt .wt-sk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-top:1px solid #EEF1F7;background:#fff;padding:12px 16px;min-height:60px;font:inherit;color:var(--ink);cursor:pointer}
#wt .wt-list > div:first-child .wt-sk{border-top:0}
#wt .wt-sk:hover,#wt .wt-sk:focus-visible{background:#F4F7FF}
#wt .wt-sk .n{flex:none;width:26px;height:26px;border-radius:50%;background:#EEF2F8;color:var(--mute);font:800 12.5px/26px system-ui,sans-serif;text-align:center}
#wt .wt-sk .t{flex:1;min-width:0}
#wt .wt-sk .t b{display:block;font-size:15.5px}
#wt .wt-sk .t small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
#wt .wt-sk .st{flex:none;font:800 12px system-ui,sans-serif;border-radius:999px;padding:4px 10px;white-space:nowrap}
#wt .st.ok{background:#E3F5EC;color:var(--ok)}#wt .st.thin{background:#FDF3DC;color:#8A5A00}#wt .st.plan{background:#EEF1F5;color:var(--plan)}
#wt .wt-sk .bo{flex:none;width:150px;text-align:right;color:var(--mute);font-size:13px}
#wt .wt-sk .bo b{color:var(--ink)}
#wt .wt-sk em{flex:none;font-style:normal;color:#9AA4B5;font-size:20px;transition:transform .15s}
#wt .wt-sk[aria-expanded="true"] em{transform:rotate(90deg)}
#wt .wt-det{padding:4px 16px 16px 54px;border-top:1px dashed #EEF1F7;background:#FBFCFF}
#wt .wt-det h4{margin:12px 0 4px;font:800 13px system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
#wt .wt-det .how{background:#FFFBEA;border:1px solid #FDE68A;border-radius:12px;padding:10px 12px;font-size:15px;color:var(--ink)}
#wt .wt-det ol{margin:4px 0 0;padding-left:20px;color:var(--ink);font-size:14px}
#wt .wt-det li{margin:3px 0}
#wt .wt-det li b{font-weight:800}
#wt .wt-det .gaps{color:#8A5A00;font-size:13.5px;margin:6px 0 0;padding-left:18px}
#wt .wt-det .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:14px}
#wt .wt-det .go{border:0;border-radius:12px;background:var(--ink);color:#fff;padding:11px 18px;font:900 15px system-ui,sans-serif;min-height:46px;cursor:pointer}
#wt .wt-det .ql{border:0;background:none;color:var(--link);font:800 14px system-ui,sans-serif;text-decoration:underline;text-underline-offset:3px;min-height:40px;cursor:pointer;padding:0}
#wt .wt-msg{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;color:var(--mute);text-align:center}
#wt .wt-help{color:var(--mute);font-size:13px;margin:10px 0 0}
#wt .wt-help b{color:var(--ink)}
@media (max-width:640px){ #wt .wt-sk{flex-wrap:wrap} #wt .wt-sk .bo{width:auto;text-align:left;flex-basis:100%;padding-left:38px} #wt .wt-det{padding-left:16px} #wt .wt-sk em{display:none} }
</style>
<script>
(function(){
if(window.TEACH) return;
var SUBJ=[['MATH','🔢','Math'],['ENGLISH','📖','Reading & Writing'],['SCIENCE','🔬','Science'],['KODESH','📜','Limudei Kodesh']];
var GORD=['K','1','2','3','4','5','6','7','8','HS'];
var W={subj:'MATH',grade:null,open:null,cache:{},busy:false,err:''};
function E(s){ return String(s==null?'':s).replace(/\*([^*\n]+)\*/g,'$1').replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function root(){ return document.getElementById('wt'); }
function tok(){ var t=null; try{ t=(new Function('try{ return S&&S.token; }catch(e){ return null; }'))(); }catch(e){} if(t) return t; try{ var x=JSON.parse(sessionStorage.getItem('tl-session')||'null'); if(x&&x.token) return x.token; }catch(e){} return null; }
function gName(g){ return g==='K'?'Kindergarten':g==='HS'?'High school':'Grade '+g; }
function built(n){ return n.depth!=='planned'; }
function full(n){ return n.depth==='taught'||n.depth==='guided'; }
function stOf(n){ return n.depth==='planned'?['plan','Coming']:n.depth==='quiz'?['thin','Check only']:['ok','Built']; }
function load(k){ if(W.cache[k]||W.busy) return; W.busy=true; W.err=''; draw();
  try{ google.script.run.withSuccessHandler(function(r){ W.busy=false; W.cache[k]=r||{flow:{nodes:[]}}; draw(); }).withFailureHandler(function(e){ W.busy=false; W.err=String(e&&e.message||e||'Could not load'); draw(); }).sfFlow(tok(),k); }
  catch(e){ W.busy=false; W.err='Could not load'; draw(); } }
function byGrade(F){ var g={}; (F.nodes||[]).forEach(function(n){ var k=String(n.g||''); (g[k]=g[k]||[]).push(n); }); return g; }
function liveOf(R,id){ var x=R&&R.live&&R.live[id]; return x||[0,0]; }
function quest(n,which){ var q=(n.quest||[]).filter(function(x){ return which.test(x.st); })[0]; return q?q.t:''; }
function detHTML(n){ var chk=quest(n,/check/i), h='';
  h+='<h4>How to do it</h4><div class="how">'+E(n.big||n.obj||'')+'</div>';
  var steps=(n.quest&&n.quest.length?n.quest:n.steps)||[];
  if(steps.length) h+='<h4>What the boy sees</h4><ol>'+steps.map(function(s){ return '<li><b>'+E(s.st)+':</b> '+E(s.t)+'</li>'; }).join('')+'</ol>';
  if(chk&&!(n.quest&&n.quest.length)) h+='<h4>Check questions</h4><div>'+E(chk)+'</div>';
  if(n.flags&&n.flags.length) h+='<h4>Still missing</h4><ul class="gaps">'+n.flags.map(function(f){ return '<li>'+E(f)+'</li>'; }).join('')+'</ul>';
  h+='<div class="row">'+(built(n)?'<button type="button" class="go" data-mp="play" data-id="'+E(n.id)+'">▶ See it as a boy</button>':'<span style="color:#5B6676">This skill is coming: no lesson yet.</span>')+(window.SF?'<button type="button" class="ql" data-wt="tree" data-id="'+E(n.id)+'">See it on the curriculum tree</button>':'')+'</div>';
  return '<div class="wt-det">'+h+'</div>'; }
function draw(){ var r=root(); if(!r) return; var h='<div class="wt-seg" role="tablist" aria-label="Subject">'+SUBJ.map(function(s){ return '<button type="button" role="tab" aria-selected="'+(W.subj===s[0])+'" class="'+(W.subj===s[0]?'on':'')+'" data-wt="subj" data-k="'+s[0]+'">'+s[1]+' '+E(s[2])+'</button>'; }).join('')+'</div>';
  var R=W.cache[W.subj];
  if(!R){ h+=W.err?'<div class="wt-msg">Could not load this subject. <button type="button" class="ql" data-wt="retry" style="color:#2F5BD3;border:0;background:none;font-weight:800;text-decoration:underline;cursor:pointer">Try again</button></div>':'<div class="wt-msg">Loading what we teach…</div>'; r.innerHTML=h; if(!W.err) load(W.subj); return; }
  var F=R.flow||{nodes:[]}, G=byGrade(F), grades=GORD.filter(function(g){ return G[g]&&G[g].length; }), all=F.nodes||[];
  if(!grades.length){ r.innerHTML=h+'<div class="wt-msg">Nothing listed for this subject yet.</div>'; return; }
  if(!W.grade||!G[W.grade]) W.grade=grades[0];
  var nf=all.filter(full).length, nq=all.filter(function(n){ return n.depth==='quiz'; }).length, np=all.filter(function(n){ return !built(n); }).length;
  var sub=SUBJ.filter(function(s){ return s[0]===W.subj; })[0];
  h+='<div class="wt-sum"><h2>'+E(sub[2])+': '+nf+' of '+all.length+' skills built</h2><p>'+(nq?nq+' more have a check only (no teaching lesson yet). ':'')+(np?np+' still coming. ':'')+(!nq&&!np?'Every skill has its lessons. ':'')+'Tap a grade to see its skills.</p><div class="wt-grades">'+grades.map(function(g){ var L=G[g], b=L.filter(full).length, pct=Math.round(100*b/L.length); return '<button type="button" class="wt-g'+(g===W.grade?' on':'')+(b<L.length?' gap':'')+'" data-wt="grade" data-g="'+E(g)+'" aria-pressed="'+(g===W.grade)+'"><b>'+E(gName(g))+'</b><small>'+b+' of '+L.length+' built</small><i><span style="width:'+pct+'%"></span></i></button>'; }).join('')+'</div>'
   +'<p class="wt-help"><b>Built</b> = has lessons the boys can play. <b>Check only</b> = a mastery check but no teaching lesson yet. <b>Coming</b> = planned, not built. <b>Working</b> = boys who tried it and have not mastered it yet.</p></div>';
  var L=G[W.grade], lv={}; L.forEach(function(n){ if(n.L) lv[n.L]=1; }); var lvs=Object.keys(lv).sort(function(a,b){ return a-b; });
  var wk=0, ms=0; L.forEach(function(n){ var x=liveOf(R,n.id); wk+=x[0]; ms+=x[1]; });
  h+='<div class="wt-lvl"><h2>'+E(gName(W.grade))+' '+E(sub[2])+(lvs.length?' · Level '+lvs.join(', '):'')+'</h2><span>'+L.length+' skills · '+L.filter(full).length+' built · '+wk+' working · '+ms+' mastered</span></div>';
  var lanes=(F.lanes||[]).filter(function(l){ return L.some(function(n){ return n.lane===l.id; }); }), i=0;
  var rest=L.filter(function(n){ return !lanes.some(function(l){ return l.id===n.lane; }); }); if(rest.length) lanes.push({id:'',name:'Other',about:''});
  lanes.forEach(function(l){ var ns=L.filter(function(n){ return l.id?n.lane===l.id:!lanes.some(function(x){ return x.id&&x.id===n.lane; }); }); if(!ns.length) return;
    h+='<div class="wt-lane">'+E(l.name)+(l.about?'<small>'+E(l.about)+'</small>':'')+'</div><div class="wt-list">'+ns.map(function(n){ i++; var s=stOf(n), x=liveOf(R,n.id), op=W.open===n.id, game=n.name&&n.name!==n.obj?n.name:'';
      return '<div><button type="button" class="wt-sk" data-wt="sk" data-id="'+E(n.id)+'" aria-expanded="'+op+'"><span class="n">'+i+'</span><span class="t"><b>'+E(n.obj||n.name)+'</b>'+(game?'<small>Game: '+E(game)+'</small>':'')+'</span><span class="st '+s[0]+'">'+s[1]+'</span><span class="bo"><b>'+x[0]+'</b> working · <b>'+x[1]+'</b> mastered</span><em>›</em></button>'+(op?detHTML(n):'')+'</div>'; }).join('')+'</div>'; });
  r.innerHTML=h; }
document.addEventListener('click',function(e){ var b=e.target.closest&&e.target.closest('#wt [data-wt]'); if(!b) return; e.preventDefault(); var a=b.dataset.wt;
  if(a==='subj'){ W.subj=b.dataset.k; W.grade=null; W.open=null; draw(); return; }
  if(a==='grade'){ W.grade=b.dataset.g; W.open=null; draw(); var l=document.querySelector('#wt .wt-lvl'); if(l) try{ l.scrollIntoView({block:'start',behavior:'smooth'}); }catch(x){} return; }
  if(a==='sk'){ var id=b.dataset.id; W.open=W.open===id?null:id; draw(); var x=document.querySelector('#wt [data-wt=sk][data-id="'+id+'"]'); if(x) try{ x.focus({preventScroll:true}); }catch(y){} return; }
  if(a==='retry'){ W.err=''; draw(); return; }
  if(a==='tree'){ if(window.SF) window.SF.open(W.subj,b.dataset.id); return; } });
window.TEACH={ html:function(){ return '<div id="wt"></div>'; }, mount:function(){ draw(); }, state:W };
})();
</script>
