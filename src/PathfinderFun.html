<style>
#pff-trail{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#16274A,#2b4c8c);color:#fff;border-radius:18px;padding:8px 14px;margin:6px 0 10px;font:700 15px system-ui,sans-serif;box-shadow:0 4px 12px rgba(10,20,40,.15)}
#pff-trail .st{white-space:nowrap}#pff-trail .path{flex:1;display:flex;gap:6px;align-items:center;justify-content:center}
#pff-trail .fs{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:13px;transition:transform .3s}
#pff-trail .fs.on{background:#F0B847;color:#16274A;transform:scale(1.12)}#pff-trail .chest{font-size:24px;filter:grayscale(.7);opacity:.75}#pff-trail .chest.near{filter:none;opacity:1;animation:pff-wig 1.2s infinite}
#pff-trail .gems{white-space:nowrap;background:rgba(255,255,255,.14);border-radius:12px;padding:3px 9px}
#pff-pip{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:9000;display:flex;align-items:flex-end;gap:6px;pointer-events:none}
#pff-pip svg{width:64px;height:64px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}#pff-pip.hop svg{animation:pff-hop .55s ease}
#pff-pip .bub{max-width:230px;background:#fff;border:3px solid #F0B847;border-radius:16px 16px 16px 4px;padding:8px 12px;font:700 15px/1.3 system-ui,sans-serif;color:#16274A;box-shadow:0 4px 12px rgba(0,0,0,.12);opacity:0;transform:translateY(6px);transition:all .25s}
#pff-pip .bub.show{opacity:1;transform:none}
#pff-go{position:fixed;inset:0;z-index:9500;display:grid;place-items:center;background:rgba(22,39,74,.25);animation:pff-in .15s}
#pff-go .card2{background:#fff;border-radius:26px;padding:18px 26px;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.25);font:800 22px system-ui,sans-serif;color:#16274A;min-width:240px}
#pff-go .card2 svg{width:96px;height:96px;animation:pff-hop .7s ease infinite}#pff-go .dots{font-size:22px;letter-spacing:6px;color:#F0B847}
#pff-burst{position:fixed;inset:0;pointer-events:none;z-index:9600;overflow:hidden}#pff-burst i{position:absolute;top:-20px;font-style:normal;font-size:26px;animation:pff-fall 1.6s ease-in forwards}
#pff-treasure{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:9700;background:#fff;border:4px solid #F0B847;border-radius:26px;padding:16px 26px;text-align:center;font:800 24px system-ui,sans-serif;color:#16274A;box-shadow:0 14px 34px rgba(0,0,0,.3);animation:pff-pop .4s ease}
#pff-treasure .big{font-size:60px;display:block}
@keyframes pff-hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px) rotate(-6deg)}70%{transform:translateY(0) rotate(4deg)}}
@keyframes pff-wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes pff-in{from{opacity:0}to{opacity:1}}@keyframes pff-pop{from{transform:translate(-50%,-50%) scale(.5);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes pff-fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){#pff-pip.hop svg,#pff-go .card2 svg,#pff-trail .chest.near{animation:none}#pff-burst{display:none}}
</style>
<script>
/* PathfinderFun.html: makes the Pathfinder something boys want to do (Head of School 2026-11-16: "a very, very boring test… add all the
   exciting things that we have throughout the rest of the program"). Claude Code builder. Page only; nothing here scores, pays or places.
   - Pip, the Pathfinder compass, cheers after EVERY answer: for effort and for trying, never "right" or "wrong" (the v7.2 rule:
     no right/wrong signal during a placement test). After "I don't know this yet" Pip says it was a smart call.
   - A treasure trail on every question: footprints, and a gem every 5 questions with a burst (gems are for fun, not money).
   - The moment he taps Next, a short "on to the next step" card covers the wait for the server, so it never feels stuck.
   Works for the general and the Kodesh Pathfinder (kqnext / kqidk). No double slash in this file (HtmlService rule). */
(function(){
 if(typeof render!=='function'||typeof P==='undefined') return;
 const F={last:null,gems:{},shownAt:0,goAt:0,msgI:Math.floor(Math.random()*8),sec:null};
 const CHEER=['Nice thinking!','You are on the trail!','Keep climbing!','Great focus!','Step by step!','You are doing it!','Brave try!','Steady work, explorer!','Way to stick with it!','Onward!'];
 const IDK=['Smart call! Saying "not yet" helps me find your spot.','Good choice! Now I know where to start you.','That helps me a lot. On we go!'];
 const GEMS=['💎','🔷','🟣','🟢','🔶','⭐'];
 const PIP=`<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="54" r="40" fill="#F0B847" stroke="#16274A" stroke-width="5"/><circle cx="50" cy="54" r="30" fill="#fffaf0"/><circle cx="50" cy="12" r="7" fill="#F0B847" stroke="#16274A" stroke-width="4"/><path d="M50 30 L58 54 L50 78 L42 54 Z" fill="#e85d5d" opacity=".25"/><circle cx="39" cy="50" r="5" fill="#16274A"/><circle cx="61" cy="50" r="5" fill="#16274A"/><circle cx="41" cy="48" r="1.6" fill="#fff"/><circle cx="63" cy="48" r="1.6" fill="#fff"/><path d="M38 64 Q50 74 62 64" fill="none" stroke="#16274A" stroke-width="4" stroke-linecap="round"/><circle cx="31" cy="62" r="4" fill="#f4a3a3"/><circle cx="69" cy="62" r="4" fill="#f4a3a3"/></svg>`;
 function el(id,html,cls){ let e=document.getElementById(id); if(!e){ e=document.createElement('div'); e.id=id; document.body.appendChild(e); } if(html!=null) e.innerHTML=html; if(cls!=null) e.className=cls; return e; }
 function pip(msg,hop){ const p=el('pff-pip'); if(!p.querySelector('svg')) p.innerHTML=PIP+'<div class="bub"></div>'; const b=p.querySelector('.bub');
  if(msg){ b.textContent=msg; b.classList.add('show'); clearTimeout(F.bt); F.bt=setTimeout(()=>b.classList.remove('show'),3200); }
  if(hop){ p.classList.remove('hop'); void p.offsetWidth; p.classList.add('hop'); } }
 function burst(){ const b=el('pff-burst',''); for(let i=0;i<22;i++){ const s=document.createElement('i'); s.textContent=['⭐','✨','💎','🎉','🌟'][i%5]; s.style.left=(Math.random()*100)+'vw'; s.style.animationDelay=(Math.random()*0.5)+'s'; b.appendChild(s); } setTimeout(()=>{ b.innerHTML=''; },2300); }
 function treasure(gem,count){ const t=el('pff-treasure',`<span class="big">${gem}</span>Treasure found!<div style="font:700 16px system-ui;margin-top:6px">${count} gem${count===1?'':'s'} on this trail</div>`); burst(); pip('A treasure! Keep exploring!',true); setTimeout(()=>{ t.remove(); },1900); }
 function goShow(idk){ F.goAt=Date.now(); el('pff-go',`<div class="card2">${PIP}<div>${idk?'Good call!':CHEER[F.msgI%CHEER.length]}</div><div class="dots">● ● ●</div><div style="font:700 15px system-ui;color:#5a6785">On to the next step…</div></div>`); }
 function goHide(){ const g=document.getElementById('pff-go'); if(!g) return; const wait=Math.max(0,450-(Date.now()-F.goAt)); setTimeout(()=>{ const x=document.getElementById('pff-go'); if(x) x.remove(); },wait); }
 function cur(){ const v=P.v; if(!v) return null; if(v.kodesh&&v.kodesh.item) return { id:v.kodesh.item.id, n:(v.kodesh.section&&v.kodesh.section.asked||0)+1, sec:'K.'+(v.kodesh.section&&v.kodesh.section.k||'') };
  if(v.cur&&v.cur.item&&!v.pause&&!v.pfuSound) return { id:v.cur.item.id, n:v.cur.item.n||1, sec:v.cur.section }; return null; }
 function trail(c){ const app=document.getElementById('app'); if(!app) return; const card=app.querySelector('.card'); if(!card) return; let t=document.getElementById('pff-trail'); if(t&&t.parentNode!==card.parentNode){ t.remove(); t=null; }
  const done=(c.n-1)%5, gems=F.gems[c.sec]||0; const html=`<span class="st">🧭 Step ${c.n}</span><span class="path">${[0,1,2,3,4].map(i=>`<span class="fs${i<done?' on':''}">${i<done?'👣':''}</span>`).join('')}<span class="chest${done>=3?' near':''}">🎁</span></span><span class="gems" title="Gems on this trail">${GEMS[0]} ${gems}</span>`;
  if(!t){ t=document.createElement('div'); t.id='pff-trail'; card.parentNode.insertBefore(t,card); } t.innerHTML=html; }
 const _render=render;
 render=function(){ const r=_render.apply(this,arguments); try{ after(); }catch(e){} return r; };
 function after(){ if(P.mode!=='kid'){ return; } const c=cur(); const pp=document.getElementById('pff-pip');
  if(!c){ goHide(); if(pp) pp.style.display=P.v&&(P.v.cur||P.v.kodesh)?'':'none'; return; }
  if(pp) pp.style.display=''; trail(c);
  if(F.last!==c.id){ const prev=F.last; F.last=c.id; goHide();
   if(prev){ const wasIdk=F.wasIdk; F.wasIdk=false; if(c.n>1&&(c.n-1)%5===0&&F.sec===c.sec){ F.gems[c.sec]=(F.gems[c.sec]||0)+1; trail(c); treasure(GEMS[(F.gems[c.sec]-1)%GEMS.length],F.gems[c.sec]); }
    else { F.msgI++; pip(wasIdk?IDK[F.msgI%IDK.length]:CHEER[F.msgI%CHEER.length],true); } }
   else pip(c.n<=1?'Hi! I am Pip. Let us find your trail together!':'Welcome back, explorer!',true);
   F.sec=c.sec; }
  if(P.busy&&!document.getElementById('pff-go')) goShow(F.wasIdk); else if(!P.busy) goHide(); }   /* the card shows only while his answer is being saved */
 document.addEventListener('click',function(e){ const t=e.target.closest&&e.target.closest('[data-act="next"],[data-act="idk"],[data-act="kqnext"],[data-act="kqidk"]'); if(!t||t.disabled||P.busy) return;
  F.wasIdk=/idk/.test(t.dataset.act); },true);
 try{ render(); }catch(e){}
})();
</script>
