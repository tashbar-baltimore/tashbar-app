<script>
/* LearnFlow.html (Head of School 2026-11-18: "the teaching and learning has to be strengthened ... question boards easier ... questions only").
   Display and flow only: changes no data, money, mastery, scoring or answers.
   1. LEARN FIRST: when a lesson's teaching ("How to do it") appears, it opens first on a big bright "Learn it" card,
      with large text, a read-aloud button and "I'm ready!". Then the question card shows only the question and the answers.
   2. HELP ME: every question card gets one friendly "Help me" button that opens the lesson's teaching card again
      (the method, never the answer). In the Learn stage the step-by-step "Teach me how" button sits on that card too.
   3. After a wrong answer the Help me button glows and wiggles to invite the boy to use it.
   4. WRONG ANSWERS TEACH: when a boy picks a wrong Hebrew letter, a friendly bubble names the letter he picked and its sound
      ("You picked ד: that is Daled. It says d."), so he learns from the miss without being shown the right answer (he tries again).
   If anything fails, the lesson shows as before. Respects reduced motion. No double slash in this file (HtmlService rule). */
(function(){
if(typeof render!=='function'||typeof A==='undefined') return;
const LF=window.LF=window.LF||{};
if(LF.on) return; LF.on=true;
LF.seen=LF.seen||{}; LF.last=LF.last||null;
const LET={'א':['Aleph','no sound by itself'],'ב':['Beis','b (with a dot) or v'],'ג':['Gimmel','g'],'ד':['Daled','d'],'ה':['Hei','h'],'ו':['Vav','v'],'ז':['Zayin','z'],'ח':['Ches','ch'],'ט':['Tes','t'],'י':['Yud','y'],'כ':['Kaf','k (with a dot) or ch'],'ך':['Final Kaf','ch'],'ל':['Lamed','l'],'מ':['Mem','m'],'ם':['Final Mem','m'],'נ':['Nun','n'],'ן':['Final Nun','n'],'ס':['Samech','s'],'ע':['Ayin','no sound by itself'],'פ':['Pei','p (with a dot) or f'],'ף':['Final Fei','f'],'צ':['Tzadi','tz'],'ץ':['Final Tzadi','tz'],'ק':['Kuf','k'],'ר':['Reish','r'],'ש':['Shin','sh (dot on the right) or s (dot on the left)'],'ת':['Tav','t (with a dot) or s']};
function why(sel){ const t=String(sel==null?'':sel).replace(/[\u0591-\u05C7]/g,'').replace(/[^\u05D0-\u05EA]/g,''); if(t.length!==1||!LET[t]) return '';
 const L=LET[t]; return `You picked <span class="lf-he">${t}</span>: that is <b>${L[0]}</b>. It says <b>${L[1]}</b>. Look again!`; }
function css(){ if(document.getElementById('lf-css')) return; const s=document.createElement('style'); s.id='lf-css'; s.textContent=`
body.lf-on .qcard .how{display:none!important}
body:has(#tqh) .lf-card{display:none!important}
.lf-help{display:inline-flex;width:auto!important;align-self:flex-start;align-items:center;gap:10px;margin:6px 0 12px;border:0;border-radius:999px;padding:12px 24px;background:linear-gradient(180deg,#FEF08A,#FACC15);color:#1E1B4B;font:900 20px var(--display,'Barlow'),sans-serif;cursor:pointer;box-shadow:0 5px 0 #CA8A04,0 10px 18px rgba(202,138,4,.25)}
.lf-help:active{transform:translateY(4px);box-shadow:0 1px 0 #CA8A04}
.lf-why{margin:4px 0 12px;padding:12px 16px;border-radius:16px;background:#FFF7ED;border:2px solid #FDBA74;color:#7C2D12;font:700 20px/1.4 'Andika',var(--body,'Nunito'),sans-serif;animation:lfpop .4s cubic-bezier(.2,1.4,.4,1) both}
.lf-why .lf-he{font:700 34px 'Frank Ruhl Libre','SBL Hebrew',serif;vertical-align:middle;margin:0 4px}
.lf-help.lf-nudge{animation:lfwig .9s ease-in-out 3;box-shadow:0 5px 0 #CA8A04,0 0 0 8px rgba(250,204,21,.35),0 10px 18px rgba(202,138,4,.25)}
@keyframes lfwig{0%,100%{transform:rotate(0)}20%{transform:rotate(-5deg) scale(1.06)}40%{transform:rotate(5deg) scale(1.06)}60%{transform:rotate(-3deg)}80%{transform:rotate(3deg)}}
.lf-card{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 50% 112%,rgba(253,224,71,.6),rgba(253,224,71,0) 60%),linear-gradient(170deg,#E0F2FE,#FFF7E0);animation:lfin .35s ease-out both}
@keyframes lfin{0%{opacity:0}100%{opacity:1}}
.lf-box{width:min(920px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:30px;border:4px solid #FDE68A;box-shadow:0 24px 60px rgba(30,27,75,.18);padding:28px 32px 26px;animation:lfpop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes lfpop{0%{transform:scale(.85) translateY(20px);opacity:0}100%{transform:none;opacity:1}}
.lf-top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.lf-top .ic{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:38px;background:radial-gradient(circle at 35% 30%,#FFFBEB,#FDE047 60%,#F59E0B)}
.lf-top h2{margin:0;font:900 clamp(30px,3.4vw,42px)/1.05 var(--display,'Barlow'),sans-serif;color:#1E1B4B}
.lf-top small{display:block;font:800 14px var(--body,'Nunito'),sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#7C3AED}
.lf-say{margin-left:auto;border:0;border-radius:999px;padding:12px 18px;background:#EEF2FF;color:#3730A3;font:800 18px var(--body,'Nunito'),sans-serif;cursor:pointer}
.lf-body{font:600 clamp(22px,2.3vw,28px)/1.55 'Andika',var(--body,'Nunito'),sans-serif;color:#1E293B}
.lf-body b:first-child{display:none}
.lf-body p{margin:0 0 12px}.lf-body li{margin:0 0 10px}
.lf-body .tbbtn{display:none}
.lf-row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:20px}
.lf-go{border:0;border-radius:999px;padding:16px 46px;background:linear-gradient(180deg,#4ADE80,#16A34A);color:#fff;font:900 26px var(--display,'Barlow'),sans-serif;cursor:pointer;box-shadow:0 6px 0 #15803D,0 12px 24px rgba(22,163,74,.3)}
.lf-go:active{transform:translateY(5px);box-shadow:0 1px 0 #15803D}
.lf-steps{border:0;border-radius:999px;padding:16px 28px;background:linear-gradient(180deg,#60A5FA,#3B82F6);color:#fff;font:900 22px var(--display,'Barlow'),sans-serif;cursor:pointer;box-shadow:0 6px 0 #1D4ED8}
.lf-go:focus-visible,.lf-steps:focus-visible,.lf-say:focus-visible,.lf-help:focus-visible{outline:4px solid #1E1B4B;outline-offset:4px}
@media (prefers-reduced-motion:reduce){.lf-card,.lf-box,.lf-help.lf-nudge{animation:none!important}}
`; document.head.appendChild(s); }
function playKey(){ try{ return A.play?String(A.play.skill||A.play.id||A.play.c||'')+'|'+String(A.play.startedAt||A.play.t0||''):''; }catch(e){ return ''; } }
function sayText(t){ try{ const u=new SpeechSynthesisUtterance(String(t).replace(/[֐-׿]+/g,' ').replace(/\s+/g,' ').trim()); u.rate=.92; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }
function close(){ const c=document.querySelector('.lf-card'); if(c) c.remove(); try{ speechSynthesis.cancel(); }catch(e){} }
function open(html,txt){ close(); css(); const hasSteps=!!document.querySelector('.qcard .how .tbbtn'); let kid=''; try{ const p=A.play, it=p&&p.items&&p.items[p.i], sk=String((it&&it.skill)||(p&&p.id)||''); if(window.KL&&KL.on&&KL.on()&&KL.has(sk)) kid=sk.replace(/[^A-Za-z0-9.]/g,''); else if(window.KR&&KR.on&&KR.on()&&KR.has(sk)) kid=sk.replace(/[^A-Za-z0-9.]/g,''); }catch(e){}
 const d=document.createElement('div'); d.className='lf-card'; d.setAttribute('role','dialog'); d.setAttribute('aria-modal','true'); d.setAttribute('aria-label','Learn it');
 d.innerHTML=`<div class="lf-box"><div class="lf-top"><span class="ic" aria-hidden="true">💡</span><div><small>Learn it</small><h2>Here’s how it works</h2></div><button type="button" class="lf-say" data-lf="say">🔊 Read it to me</button></div><div class="lf-body">${html}</div><div class="lf-row">${kid?`<button type="button" class="lf-steps" data-lf="kl" data-id="${kid}">🍎 Play the fun lesson</button>`:''}${hasSteps?'<button type="button" class="lf-steps" data-lf="steps">👣 Show me step by step</button>':''}<button type="button" class="lf-go" data-lf="go">I’m ready! ✓</button></div></div>`;
 document.body.appendChild(d); LF.txt=txt; setTimeout(()=>{ const g=d.querySelector('.lf-go'); if(g) g.focus(); },60); }
function decorate(){
 const card=document.querySelector('.play .qcard, .qcard'); const on=A.view==='play'&&!!card;
 document.body.classList.toggle('lf-on',on); if(!on){ close(); return; }
 css(); const key=playKey(); if(key!==LF.last){ LF.last=key; LF.how=null; }
 const how=card.querySelector('.how');
 if(how){ const txt=(how.textContent||'').trim(); const html=how.innerHTML; LF.how={html,txt};
  if(!LF.seen[key+'|'+txt.slice(0,80)]&&!document.getElementById('tqh')&&!A.overlay){ LF.seen[key+'|'+txt.slice(0,80)]=1; open(html,txt); } }
 if(LF.how&&!card.querySelector('.lf-help')){ const b=document.createElement('button'); b.type='button'; b.className='lf-help'; b.dataset.lf='help'; b.innerHTML='<span aria-hidden="true">💡</span> Help me';
  const opts=card.querySelector('.opts'); if(opts) opts.insertAdjacentElement('beforebegin',b); else card.appendChild(b); }
 try{ card.querySelectorAll('div,p,span').forEach(x=>{ if(x.children.length<=2&&/^\W*Stuck\? Tap Teach me how/.test((x.textContent||'').trim())&&!x.dataset.lfd){ x.dataset.lfd=1; x.innerHTML='💡 Stuck? Tap <b>Help me</b> to see how it works again.'; } }); }catch(e){}
 let wrong=false, sel=null; try{ const p=A.play; wrong=!!(p&&p.fb&&p.fb.ok===false); sel=p?p.sel:null; }catch(e){}
 const hb=card.querySelector('.lf-help'); if(hb) hb.classList.toggle('lf-nudge',wrong);
 let wb=card.querySelector('.lf-why'); const msg=wrong?why(sel):'';
 if(msg){ if(!wb||wb.dataset.sel!==String(sel)){ if(wb) wb.remove(); wb=document.createElement('div'); wb.className='lf-why'; wb.dataset.sel=String(sel); wb.setAttribute('role','status'); wb.innerHTML='🤔 '+msg; const opts=card.querySelector('.opts'); if(opts) opts.insertAdjacentElement('beforebegin',wb); else card.appendChild(wb); } }
 else if(wb) wb.remove();
}
document.addEventListener('click',e=>{ const b=e.target&&e.target.closest&&e.target.closest('[data-lf]'); if(!b) return; const k=b.dataset.lf;
 if(k==='go'){ close(); }
 else if(k==='say'){ sayText(LF.txt||''); }
 else if(k==='help'){ if(LF.how) open(LF.how.html,LF.how.txt); }
 else if(k==='kl'){ close(); try{ const id=b.dataset.id; if(window.KL&&KL.has(id)) KL.open(id); else if(window.KR&&KR.has(id)) KR.open(id); }catch(x){} }
 else if(k==='steps'){ close(); const t=document.querySelector('.qcard .how .tbbtn'); if(t){ document.body.classList.remove('lf-on'); t.click(); setTimeout(()=>{ try{ decorate(); }catch(x){} },50); } }
 e.preventDefault(); e.stopPropagation(); },true);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&document.querySelector('.lf-card')) close(); });
LF.render0=LF.render0||render;
render=function(){ const r=LF.render0.apply(this,arguments); try{ decorate(); }catch(e){ console.error('LearnFlow',e); } setTimeout(()=>{ try{ decorate(); }catch(e){} },80); return r; };
try{ new MutationObserver(()=>{ if(!document.getElementById('tqh')&&LF.pending){ LF.pending=0; decorate(); } }).observe(document.body,{childList:true}); }catch(e){}
setInterval(()=>{ try{ if(A.view==='play') decorate(); }catch(e){} },1500);
})();
</script>
