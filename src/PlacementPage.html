<!doctype html>
<html lang="en"><head><meta charset="utf-8"><base target="_top">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#14284b;--navy2:#1f3a68;--gold:#e3b341;--gold2:#f6e3a8;--teal:#1f9e8f;--ink:#1b2333;--soft:#5d6779;--line:#e2e6ee;--bg:#f4f6fa;--card:#fff;--ok:#1f9e6b;--warn:#c77d12;--bad:#c2413b;--sel:#fff6dc}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Inter,sans-serif;margin:0;letter-spacing:-.01em}
button{font:inherit;cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.top{background:var(--navy);color:#fff;border-bottom:4px solid var(--gold);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:20px}.top .sub{opacity:.75;font-size:13px}.top .sp{flex:1}
.tb{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:7px 12px;text-decoration:none;font-weight:600;font-size:14px}
.wrap{display:grid;grid-template-columns:290px 1fr;gap:18px;padding:18px 20px;max-width:1500px;margin:0 auto}
@media(max-width:860px){.wrap{grid-template-columns:1fr;padding:12px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 10px rgba(20,40,75,.05);padding:16px}
.side h2{font-size:16px;margin:2px 0 10px}.side .hint{color:var(--soft);font-size:13px;margin:0 0 10px}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin-bottom:10px}
.boys{display:flex;flex-direction:column;gap:4px;max-height:52vh;overflow:auto}
.boy{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid transparent;background:none;text-align:left;width:100%}
.boy:hover{background:#f0f3f8}.boy.on{background:var(--sel);border-color:var(--gold)}
.boy .ck{width:20px;height:20px;border-radius:6px;border:2px solid #b8c0cf;display:grid;place-items:center;font-size:13px;color:#fff;flex:none}
.boy.on .ck{background:var(--navy);border-color:var(--navy)}
.boy .nm{font-weight:600;flex:1}.boy .lv{font-size:12px;color:var(--soft)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;background:var(--navy);color:#fff}
.btn.ghost{background:#eef1f6;color:var(--navy)}.btn.gold{background:var(--gold);color:var(--navy)}.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.groups{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.grp{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.grp b{flex:1}.grp small{color:var(--soft)}
.x{background:none;border:0;color:var(--soft);font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}.x:hover{background:#f3e3e2;color:var(--bad)}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.head h2{font-size:26px}.head .who{color:var(--soft)}.head .sp{flex:1}
.tog{display:flex;background:#eef1f6;border-radius:10px;padding:3px}.tog button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;color:var(--soft)}.tog button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.gridwrap{overflow-x:auto}
table.grid{border-collapse:separate;border-spacing:4px;width:100%;min-width:640px}
.grid th{font-size:12px;color:var(--soft);font-weight:600;text-align:center;padding:2px}
.grid th.s{text-align:left;font-size:14px;color:var(--ink);white-space:nowrap;padding-right:8px}
.grid th.s small{display:block;color:var(--soft);font-weight:500;font-size:12px}
.cell{width:100%;min-width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;color:var(--soft);position:relative}
.cell:hover:not(:disabled){border-color:var(--navy);background:#f3f6fb}
.cell.below{background:#e9eef7;color:#8a94a7;border-color:#e9eef7}
.cell.at{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 0 0 3px var(--gold)}
.cell.at::after{content:'★';position:absolute;top:2px;right:5px;font-size:10px;color:var(--gold)}
.cell.some{background:var(--gold2);color:var(--navy);border-color:var(--gold)}
.cell:disabled{background:repeating-linear-gradient(45deg,#f6f7fa,#f6f7fa 5px,#eef0f4 5px,#eef0f4 10px);border-color:#eef0f4;color:transparent;cursor:default}
.cell .n{font-size:11px;display:block;font-weight:600}
.clr{background:none;border:0;color:var(--soft);font-size:12px;text-decoration:underline;padding:0 4px}
.panel{margin-top:16px}.panel h3{font-size:18px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;text-align:left;max-width:260px}
.chip b{display:block;font-size:14px}.chip small{color:var(--soft);font-size:12px}
.chip.on{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy);background:#f3f6fb}
.chip .tag{display:inline-block;font-size:11px;font-weight:700;border-radius:20px;padding:1px 8px;margin-top:4px}
.tag.ready{background:#dff3ea;color:var(--ok)}.tag.soon{background:#f1f2f5;color:var(--soft)}.tag.done{background:#e6ecfa;color:var(--navy2)}
.lineup{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.lu{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fbfcfe}
.lu h4{margin:0 0 4px;font:700 14px Inter}.lu .lvl{font:800 22px 'Bricolage Grotesque';color:var(--navy)}
.lu ol{margin:6px 0 0;padding-left:20px;font-size:13px}.lu li{margin:2px 0}.lu .muted{color:var(--soft);font-size:13px}
.ov{width:100%;border-collapse:collapse}.ov th,.ov td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;font-size:14px}
.ov th:first-child,.ov td:first-child{text-align:left}.ov td.n{font-weight:700;color:var(--navy)}.ov td.e{color:#c2c8d3}
.ov tr.click{cursor:pointer}.ov tr.click:hover{background:#f6f8fb}
.note{background:#fff8e6;border:1px solid #f1d58c;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.empty{text-align:center;color:var(--soft);padding:40px 10px}
/* sign-in + check (boys) */
.center{min-height:calc(100vh - 70px);display:grid;place-items:center;padding:20px}
.pad{max-width:420px;width:100%;text-align:center}
.pad h2{font-size:28px;margin-bottom:6px}.pad p{color:var(--soft)}
.dots{display:flex;justify-content:center;gap:12px;margin:18px 0}.dots i{width:18px;height:18px;border-radius:50%;border:3px solid var(--navy)}.dots i.f{background:var(--navy)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.keys button{height:62px;border-radius:14px;border:1px solid var(--line);background:#fff;font:800 24px 'Bricolage Grotesque';color:var(--navy)}
.keys button:active{background:#eef1f6}.err{color:var(--bad);font-weight:600;min-height:22px}
.check{max-width:680px;width:100%}
.prog{height:12px;background:#e6eaf2;border-radius:10px;overflow:hidden;margin:4px 0 16px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .4s}
.qcard{background:#fff;border-radius:22px;border:1px solid var(--line);box-shadow:0 10px 30px rgba(20,40,75,.08);padding:26px;text-align:center}
.qcard .world{display:inline-block;background:var(--gold2);color:var(--navy);font-weight:700;border-radius:20px;padding:3px 12px;font-size:13px}
.qq{font:800 30px/1.25 'Bricolage Grotesque';margin:16px 0;color:var(--navy)}
.pic{font-size:38px;letter-spacing:6px;line-height:1.4;margin:6px 0 10px}
.ans{display:flex;gap:10px;justify-content:center}.ans input{font:800 28px 'Bricolage Grotesque';width:200px;text-align:center;border:2px solid var(--line);border-radius:14px;padding:10px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.opts button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:16px;font:700 22px 'Bricolage Grotesque';color:var(--navy)}
.opts button:hover{border-color:var(--navy)}
.say{border:0;background:#eef1f6;border-radius:50%;width:44px;height:44px;font-size:20px}
.big{font-size:18px;padding:14px 24px;border-radius:14px}
.result .medal{font-size:72px}.result h2{font-size:34px}

/* staff tabs + lesson library (2026-11-09) */
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.1);border-radius:12px;padding:3px}
.tab{border:0;background:none;color:#dfe5f2;font-weight:700;font-size:14px;padding:7px 14px;border-radius:9px;min-height:36px}
.tab.on{background:#fff;color:var(--navy)}
.libwrap{padding:18px 20px;max-width:1500px;margin:0 auto}
.pill{background:var(--gold2);color:var(--navy);font-weight:700;border-radius:20px;padding:4px 12px;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--soft);margin:0 0 10px}.legend span{display:flex;align-items:center;gap:6px}
.legend .lc{width:18px;height:18px;min-width:0;border-radius:5px;display:inline-block}
.lc{display:block;width:100%;min-width:40px;height:42px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:800;color:var(--navy);font-size:15px}
button.lc:hover{border-color:var(--navy)}
.lc.mapped{background:#fff;border:2px dashed #9fd3cc}
.lc.part{background:#d8f0ec;border-color:#9fd3cc}
.lc.full{background:var(--teal);border-color:var(--teal);color:#fff}
.lc.none{background:repeating-linear-gradient(45deg,#f6f7fa,#f6f7fa 5px,#eef0f4 5px,#eef0f4 10px);border-color:#eef0f4}
.lc.sel{box-shadow:0 0 0 3px var(--gold);border-color:var(--navy)}
table.lib{min-width:760px}
@media(max-width:860px){.wrap.picked>main{order:-1}.grid.lib th.s{position:sticky;left:0;background:#fff;z-index:1;white-space:normal;min-width:92px;font-size:13px}table.lib{min-width:0}.lc{min-width:38px}.top{padding:10px 12px;gap:8px}.top .sub{display:none}.libwrap{padding:12px}.tabs{order:5;width:100%}.tab{flex:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}.wrap>main,.wrap>aside{min-width:0}.cell.at,.cell.at:hover{background:var(--navy);color:#fff;border-color:var(--navy)}a.btn{text-decoration:none;display:inline-block}.boy .ck{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:13px;flex:none;padding:0}.boy .nm{font-weight:600;flex:1;color:var(--ink);cursor:pointer}.rpass{text-align:left;background:#fbfcfe;border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:18px;line-height:1.6;margin:8px 0 6px;color:var(--ink)}.rword{font:800 34px 'Bricolage Grotesque';color:var(--navy);margin:6px 0}.qcard .opts button{font-size:19px}
.ssq .qq{font-size:22px;margin:12px 0}.ssq .opts button{font-size:17px;padding:12px;overflow-wrap:anywhere}.ssq .pic.map{font-size:15px;letter-spacing:0;line-height:1.45;white-space:pre-line;text-align:left;background:#F7F4EC;border-radius:12px;padding:10px 12px;overflow-wrap:anywhere}</style></head><body><div id="app"></div>
<script>
/* Tashbar placement page (TL-037). Staff: click a boy, then click where he is in each subject. Tick several boys (or pick a group) to place them together.
   Boys (?check=1): a short adaptive math check that finds his starting level. */
const S={token:null,data:null,sel:[],hi:false,q:'',mode:'staff',view:'loading',appUrl:'',padErr:'',mkgrp:false,page:'boys',lib:null,want:null};
const C={view:'intro',name:'',placed:false,lv:1,asked:0,solid:{},miss:{},items:[],i:0,right:0,log:[],res:null};
const run=(fn,...a)=>new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...a));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const msgOf=e=>String((e&&e.message)||e||'Something went wrong.').replace(/^Error:\s*/,'');
function store(k,v){ try{ v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function recall(k){ try{ return JSON.parse(sessionStorage.getItem(k)||'null'); }catch(e){ return null; } }
let tt; function toast(m){ let t=$('toast'); if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; t.setAttribute('role','status'); document.body.appendChild(t); } t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>{ t.hidden=true; },2800); }

/* v167 EMBED (takeover3): when the boy app opens the check in its own window (?check=1&embed=1), talk to it with messages:
   ask it for the sign-in (no code to type again), and tell it when the check is done or closed. Messages go only up the frame chain;
   a sign-in is accepted only from a frame above this one. */
function upPost(m){ try{ if(window===window.top) return; m.tlCheck=1; let w=window; for(let i=0;i<6&&w!==w.parent;i++){ w=w.parent; w.postMessage(m,'*'); } }catch(e){} }
function fromAbove(src){ try{ let w=window; for(let i=0;i<6&&w!==w.parent;i++){ w=w.parent; if(w===src) return true; } }catch(e){} return false; }

/* ---------- data helpers ---------- */
const D=()=>S.data;
const SHORT={MATH:'Math',READ:'Reading',LANG:'Writing',SCI:'Science',SOC:'Social St.',COMP:'Computing',HEB:'Lashon Hakodesh',ELEC:'Electives',VOC:'Trades'};
const subj=k=>D().subjects.find(s=>s[0]===k);
const placeOf=(id,k)=>((D().place[id]||{})[k])||null;
const nameOf=id=>(D().students.find(s=>s.id===id)||{}).name||id;
const mathLvl=id=>{ const m=/\.L(\d\d)\./.exec(String(id)); return m?+m[1]:0; };
const rung=id=>D().math.find(r=>r[0]===id)||(D().read||[]).find(r=>r[0]===id)||(D().lang||[]).find(r=>r[0]===id)||[id,id,''];
const listOf=k=>k==='READ'?(D().read||[]):k==='LANG'?(D().lang||[]):D().math;
const lab=l=>l===1?'K':l<=13?'Gr '+(l-1):'College';

/* ---------- sign in ---------- */
let PIN='';
function renderPad(msg){ S.view='pad'; PIN=''; S.padErr=msg||''; render(); }
function padHTML(){ const kid=S.mode==='check';
 return `<div class="center"><div class="card pad"><h2>${kid?'Find your '+SUBN()+' level':'Placement'}</h2><p>${kid?'Type your 4-digit code, then tap ✓.':'Staff: type your staff code, then tap ✓.'}</p>
 <div class="dots" aria-hidden="true">${[0,1,2,3].map(i=>`<i class="${i<PIN.length?'f':''}"></i>`).join('')}</div><div class="err" role="alert">${esc(S.padErr)}</div>
 <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="key" data-k="${n}">${n}</button>`).join('')}<button data-act="key" data-k="c" aria-label="Delete">⌫</button><button data-act="key" data-k="0">0</button><button data-act="key" data-k="go" aria-label="Sign in">✓</button></div></div></div>`; }
function key(k){ if(k==='c') PIN=PIN.slice(0,-1); else if(k==='go'){ if(PIN.length>=4) return signIn(); } else if(PIN.length<8) PIN+=k; S.padErr=''; render(); }
function signIn(){ const code=PIN; PIN=''; S.padErr='Checking…'; render();
 run('msSignInCode',code).then(r=>{
  if(!r||!r.ok){ S.padErr="That code didn't work. Try again."; return render(); }
  if(S.mode==='check'){ if(r.role!=='kid'){ S.padErr='This check is for students. Type your own code.'; return render(); } S.token=r.token; store('tl-check',{token:r.token,at:Date.now()}); return kidHello(); }
  if(r.role!=='staff'){ S.padErr='That is a student’s code. Staff codes only here.'; return render(); }
  S.token=r.token; store('tl-session',{role:'staff',sid:null,at:Date.now(),token:r.token}); load();
 }).catch(()=>{ S.padErr='Could not reach the school database. Check the Wi-Fi.'; render(); }); }

/* ---------- staff ---------- */
function load(){ S.view='loading'; render();
 run('plLoad',S.token).then(d=>{ S.data=d; if(S.want&&d.students.some(s=>s.id===S.want)) S.sel=[S.want]; S.want=null; S.sel=S.sel.filter(id=>d.students.some(s=>s.id===id)); S.view='staff'; render(); })
 .catch(e=>{ store('tl-session',null); S.token=null; renderPad(msgOf(e)); }); }
function place(ids,k,l,start){ if(!ids.length) return;
 const prev=JSON.stringify(D().place);
 ids.forEach(id=>{ const p=(D().place[id]=D().place[id]||{}); if(l) p[k]={level:l,start:start||'',at:Date.now(),by:'staff'}; else delete p[k]; });
 render();
 run('plPlace',S.token,ids,k,l,start||'').then(pl=>{ D().place=pl; render(); toast(l?`Saved: ${ids.length>1?ids.length+' students':nameOf(ids[0])} in ${subj(k)[1]}, Level ${l}`:`Cleared ${subj(k)[1]}`); })
 .catch(e=>{ D().place=JSON.parse(prev); render(); toast(msgOf(e)); }); }

function sideHTML(){ const d=D(), q=S.q.toLowerCase(), list=d.students.filter(s=>!q||s.name.toLowerCase().includes(q));
 return `<h2>Students</h2><p class="hint">Click a name to place them. Tick the boxes to place several students at once.</p>
 <input class="search" id="q" placeholder="Search names" value="${esc(S.q)}" aria-label="Search names" autocomplete="off">
 <div class="boys">${list.map(s=>{ const on=S.sel.includes(s.id), m=placeOf(s.id,'MATH');
   return `<div class="boy ${on?'on':''}"><button class="ck" data-act="tick" data-id="${esc(s.id)}" aria-pressed="${on}" aria-label="Tick ${esc(s.name)}" style="border:2px solid ${on?'var(--navy)':'#b8c0cf'};background:${on?'var(--navy)':'#fff'}">${on?'✓':''}</button><button class="nm" data-act="open" data-id="${esc(s.id)}" style="border:0;background:none;text-align:left;padding:0">${esc(s.name)}</button><span class="lv">${m?'Math L'+m.level:'—'}</span></div>`; }).join('')||'<p class="hint">No students on the roster yet.</p>'}</div>
 <div class="row" style="margin-top:10px"><button class="btn ghost sm" data-act="all">Tick all</button><button class="btn ghost sm" data-act="none" ${S.sel.length?'':'disabled'}>Untick</button><button class="btn ghost sm" data-act="over">Overview</button></div>
 <h2 style="margin-top:20px">Groups</h2><p class="hint">Optional. Pick a group to place all its students in one click. Each student still keeps their own lineup.</p>
 <div class="groups">${d.groups.map(g=>`<div class="grp"><button class="btn ghost sm" data-act="grp" data-id="${esc(g.id)}">${esc(g.name)}</button><small>${g.members.length} students</small><span style="flex:1"></span><button class="x" data-act="delgrp" data-id="${esc(g.id)}" aria-label="Delete group ${esc(g.name)}">×</button></div>`).join('')||'<p class="hint">No groups yet.</p>'}</div>
 ${S.mkgrp?`<div class="row" style="margin-top:8px"><input class="search" id="gname" placeholder="Group name, e.g. Math Group A" style="margin:0;flex:1" maxlength="40"><button class="btn sm" data-act="savegrp">Save</button><button class="btn ghost sm" data-act="cancelgrp">Cancel</button></div>`
  :`<div class="row" style="margin-top:8px"><button class="btn sm" data-act="newgrp" ${S.sel.length>1?'':'disabled'}>Make a group from ticked students</button></div>`}`; }

function gridHTML(ids){ const d=D(), max=S.hi?16:9, lv=Array.from({length:max},(_,i)=>i+1);
 return `<div class="gridwrap"><table class="grid"><thead><tr><th></th>${lv.map(l=>`<th>L${l}<br><span style="font-weight:500">${lab(l)}</span></th>`).join('')}</tr></thead><tbody>
 ${d.subjects.filter(s=>S.hi||s[2]<=9).map(([k,name,lo,hi])=>{ const lvls=ids.map(i=>(placeOf(i,k)||{}).level||0), placed=lvls.filter(Boolean).length;
   const cells=lv.map(l=>{ if(l<lo||l>hi) return `<td><button class="cell" disabled aria-label="${esc(name)} has no Level ${l}"></button></td>`;
     const n=lvls.filter(x=>x===l).length; let cls='';
     if(ids.length===1) cls=lvls[0]===l?'at':(lvls[0]&&l<lvls[0]?'below':''); else if(n) cls=n===ids.length?'at':'some';
     return `<td><button class="cell ${cls}" data-act="place" data-k="${k}" data-l="${l}" aria-label="${esc(name)}, Level ${l}${cls==='at'?', current':''}">${l}${ids.length>1&&n&&n<ids.length?`<span class="n">${n} students</span>`:''}</button></td>`; }).join('');
   const status=ids.length===1?(lvls[0]?'Level '+lvls[0]:'Not placed'):(placed?placed+' of '+ids.length+' placed':'Not placed');

 if(a==='page'){ S.page=b.dataset.p==='lib'?'lib':'boys'; render(); return window.scrollTo(0,0); }
 if(a==='libcell'){ S.lib={k:b.dataset.k,l:+b.dataset.l}; render(); const p=$('libpanel'); if(p&&p.getBoundingClientRect().top>window.innerHeight-120) p.scrollIntoView({behavior:'smooth',block:'start'}); return; }
 if(a==='tick'){ const id=b.dataset.id; S.sel=S.sel.includes(id)?S.sel.filter(x=>x!==id):S.sel.concat(id); return render(); }
 if(a==='all'){ S.sel=D().students.map(s=>s.id); return render(); }
 if(a==='none'||a==='over'){ S.sel=[]; S.mkgrp=false; return render(); }
 if(a==='lo'||a==='hi'){ S.hi=a==='hi'; return render(); }
 if(a==='grp'){ const g=D().groups.find(x=>x.id===b.dataset.id); if(g){ S.sel=g.members.filter(id=>D().students.some(s=>s.id===id)); render(); } return; }
 if(a==='newgrp'){ S.mkgrp=true; return render(); }
 if(a==='cancelgrp'){ S.mkgrp=false; return render(); }
 if(a==='savegrp'){ const name=($('gname')||{}).value||''; return run('plSaveGroup',S.token,{name,members:S.sel}).then(g=>{ D().groups=g; S.mkgrp=false; render(); toast('Group saved.'); }).catch(err=>toast(msgOf(err))); }
 if(a==='delgrp') return run('plDeleteGroup',S.token,b.dataset.id).then(g=>{ D().groups=g; render(); toast('Group deleted. The students keep their own placements.'); }).catch(err=>toast(msgOf(err)));
 if(a==='place') return place(S.sel,b.dataset.k,+b.dataset.l,'');
 if(a==='clear') return place(S.sel,b.dataset.k,0,'');
 if(a==='start') return place(S.sel,b.dataset.k||'MATH',mathLvl(b.dataset.s),b.dataset.s);
 if(a==='grade') return startLevel(Math.min(TOPL(),+b.dataset.l));
 if(a==='pick') return answer(b.dataset.v);
 if(a==='go'){ const v=($('na')||{}).value; if(String(v).trim()==='') return $('na').focus(); return answer(v); }
 if(a==='skip') return answer(null);
 if(a==='say'){ try{ const it=C.items[C.i]; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance((it.say||it.q).replace(/−/g,' minus ').replace(/×/g,' times ').replace(/÷/g,' divided by ').replace(/\?/g,' what ').replace(/√/g,'the square root of ')); u.rate=.95; speechSynthesis.speak(u); }catch(err){ toast('Read-aloud is not available on this device.'); } }
});
document.addEventListener('keydown',e=>{
 if(S.view==='pad'){ if(/^\d$/.test(e.key)) key(e.key); else if(e.key==='Backspace') key('c'); else if(e.key==='Enter') key('go'); return; }
 if(e.key==='Enter'&&e.target.id==='na'){ e.preventDefault(); const v=e.target.value; if(String(v).trim()!=='') answer(v); }
 if(e.key==='Enter'&&e.target.id==='gname'){ e.preventDefault(); document.querySelector('[data-act="savegrp"]').click(); }
 if(e.key==='Enter'&&e.target.closest&&e.target.closest('tr[data-act="open"]')) e.target.click();
});
document.addEventListener('input',e=>{ if(e.target.id==='q'){ S.q=e.target.value; render(); } });

/* ---------- start ---------- */
function boot(){
 run('msAppUrl').then(u=>{ S.appUrl=u; if(S.view!=='loading') render(); }).catch(()=>{});
 const go=params=>{ S.mode=params.check==='1'?'check':'staff'; C.sub=params.s==='READ'?'READ':(params.s==='SS'||params.s==='SOC')?'SOC':'MATH'; if(params.v==='lib') S.page='lib'; if(params.sid) S.want=String(params.sid).slice(0,40);
  S.embed=S.mode==='check'&&params.embed==='1';
  if(S.mode==='check'){ const t=recall('tl-check'); if(t&&t.token&&Date.now()-t.at<6*3600e3){ S.token=t.token; return kidHello(); }
   if(S.embed){ let got=false; const on=e=>{ const d=e.data; if(got||!d||d.tlCheck!==1||!d.token||!fromAbove(e.source)) return; got=true; window.removeEventListener('message',on); S.token=String(d.token); store('tl-check',{token:S.token,at:Date.now()}); kidHello(); };
     window.addEventListener('message',on); upPost({need:'token'}); setTimeout(()=>{ if(!got){ window.removeEventListener('message',on); renderPad(); } },4000); return; }
   return renderPad(); }
  const t=recall('tl-session'); if(t&&t.role==='staff'&&t.token){ S.token=t.token; return load(); } renderPad(); };
 try{ google.script.url.getLocation(loc=>go(loc.parameter||{})); }catch(e){ go({}); }
}
render(); boot();
</script>
</body></html>
