(function () {
  var LESSONS = {
  'WRIT.ESSAY.L08.05':{name:'Plot Plan',
  teach:[
    {how:'On a story mountain, each rising event makes the problem harder. A plot plan goes further: each event also RAISES THE STAKES, what the hero could lose. In Benny’s story for The Beacon, the wind knocks Shimon’s sukkah flat on Erev Sukkos. Then the s’chach mats blow over the fence. Then a wall cracks. Each event puts the first night in the sukkah in more danger. A busy event that changes nothing he could lose is the SAME STAKES.', q:'Which next event raises the stakes?', o:['Rain starts, and Zaidy’s hands get too cold to tie the knots.','Shimon’s little sister asks what color the paper chains are.','Shimon remembers that last year’s sukkah was green.']},
    {how:'A TICKING CLOCK turns the tension up: the reader always knows how much time is left. “Two hours to candle lighting.” “One hour.” “Ten minutes.” Put the MOST TENSE MOMENT near the end, after the stakes have climbed, so the whole story builds to it. Then end soon after it. Once the peak is over, the reader should not wait long.', q:'Where does the most tense moment go in a plot plan?', o:['near the end, after the stakes have climbed','first, to grab the reader','in the middle, then a long, calm ending']},
    {how:'Two mistakes let the tension leak out. In Grade 5, a story that skipped the climb was fixed at once. SOLVED TOO EARLY is sneakier: the stakes do climb, but the fix comes halfway (“Mr. Haddad lent us his sukkah”), and the rest is just decorating. PEAKS TOO SOON: the most tense moment comes first, and each event after it is smaller. A plan whose stakes keep rising to a late peak BUILDS TENSION.', q:'Yoni’s plan: his bar mitzvah speech is lost; the hall’s printer is broken; then Abba finds it in the car; then Yoni practices and eats cake. Which is it: builds tension, solved too early, or peaks too soon?', o:['solved too early','peaks too soon','builds tension']}
  ],
  practice:[
    {t:'sort', q:'Benny’s plan: the wind knocked Shimon’s sukkah flat on Erev Sukkos. Sort each possible next event.', bins:[{id:'R',label:'📈 Raises the stakes'},{id:'S',label:'➖ Same stakes'}],
      items:[{label:'The s’chach mats blow over Mr. Haddad’s fence.',bin:'R'},{label:'Shimon’s sister asks for a snack.',bin:'S'},{label:'A wall panel cracks, and there is no spare.',bin:'R'},{label:'Zaidy tells what color his coat used to be.',bin:'S'},{label:'Rain starts, and Zaidy’s cold hands cannot tie.',bin:'R'},{label:'Shimon changes into a dry shirt.',bin:'S'}],
      h:'Does it put the first night in the sukkah in more danger, or leave things where they were?'},
    {t:'pairs', q:'Match each word to its job in a plot.', pairs:[['the stakes','what the hero could lose'],['a ticking clock','how much time is left'],['the most tense moment','the peak, near the end']],
      h:'Read each word. Which part of the plan does it name?'},
    {t:'spotall', q:'Tap every line that works as a TICKING CLOCK.', cells:[{label:'Two hours to candle lighting.',ok:true},{label:'Only one hour left before Yom Tov.',ok:true},{label:'Ima called, “Ten minutes!”',ok:true},{label:'The mats were made of bamboo.',ok:false},{label:'Zaidy wore his gray coat.',ok:false}],
      h:'Does the line tell the reader how much time is left?'},
    {t:'sort', q:'Sneaky plans! Sort each story plan.', bins:[{id:'G',label:'✅ Builds tension'},{id:'E',label:'⚠️ Mistake: solved too early'},{id:'P',label:'⚠️ Mistake: peaks too soon'}],
      items:[{label:'Sukkah falls; mats blow away; rain; ten minutes to Yom Tov, a gust lifts the frame.',bin:'G'},{label:'Sukkah falls; mats blow away; a neighbor lends his sukkah; the boys decorate all afternoon.',bin:'E'},{label:'A huge gust nearly lifts the frame; then a mat slips; then a paper chain tears.',bin:'P'},{label:'Camera lost at the fort; not in the gift shop; the bus driver honks to leave.',bin:'G'},{label:'Camera lost; not in the gift shop; his teacher finds it; the class tours the fort all day.',bin:'E'}],
      h:'Where is the most tense moment? Is the problem fixed before the end?'},
    {t:'order', q:'Build Benny’s plot plan so the stakes climb. Tap the events in order.', tiles:['At noon, the wind knocks the sukkah flat.','At two, the s’chach mats blow over the fence.','At four, rain starts, and Zaidy’s hands are too cold to tie.','Ten minutes before Yom Tov, a gust lifts the frame.'], extra:['Then Shimon eats an apple.'],
      h:'Follow the clock. Each event should put the sukkah in more danger.'},
    {t:'spotall', q:'Yoni’s story: he loses his speech on the night of his bar mitzvah seudah. Tap every event that RAISES THE STAKES.', cells:[{label:'The hall’s printer is broken.',ok:true},{label:'Abba’s phone, with the only copy, is dead.',ok:true},{label:'The rav says, “Yoni, you’re next.”',ok:true},{label:'Yoni’s tie is blue.',ok:false},{label:'The cake has chocolate icing.',ok:false}],
      h:'Does it make losing the speech worse?'},
    {t:'write', q:'Your turn to write. Plan a story in four short lines: a problem, two events that raise the stakes, and the most tense moment near the end. Add a ticking clock.', min:0, checks:['📈 Each event raises the stakes.','⏰ A ticking clock tells how much time is left.','🏔️ The most tense moment comes near the end, and nothing is solved before it.'], h:'After each line, ask: what could he lose now that he could not lose before?'}
  ],
  check:[
    {q:'Eli’s plan for a debate story: his partner is sick on the morning of the final; Eli must argue alone; his notes get soaked in the rain; with one minute left, the judge asks the hardest question. Which is it: builds tension, solved too early, or peaks too soon?', o:['builds tension','solved too early','peaks too soon'], h:'Does each event raise the stakes? Where is the most tense moment?'},
    {q:'Akiva’s plan: the printer breaks the night before The Beacon is due; then the spare ink is dry too; Mr. Gross fixes both by eight o’clock; then the boys fold papers and talk about the weather. Which is it: builds tension, solved too early, or peaks too soon?', o:['solved too early','peaks too soon','builds tension'], h:'When is the problem fixed? What is left for the rest of the story?'},
    {t:'order', q:'Build Gavriel’s plot plan so the stakes climb. Tap the events in order.', tiles:['At the fort, Gavriel’s camera is gone.','He searches the gift shop, but it is not there.','Then the bus driver honks: the class is leaving.'], extra:['Also, the fort has old cannons.'], h:'Start with the problem. Each next event should make it worse.'}

  re:[
    {how:'A new way: a pot of water on the fire. It heats a little at a time and boils near the end. Take it off the fire halfway, and it never boils.', q:'Taking the pot off the fire halfway is like a story that is…', o:['solved too early','builds tension','peaks too soon']},
    {how:'A simpler step: after each event, ask one question: “What could he lose now?” If the answer is bigger than before, the stakes went up.', q:'After the mats blow away, what could Shimon lose?', o:['the first night in the sukkah','his gray coat','a pencil']},
    {how:'The skill underneath: Story Mountain (Grade 5). Each rising event makes the problem harder, up to a turning point. A plot plan goes further: each event raises what he could lose, a clock ticks, and nothing is solved before the late peak.', q:'On a story mountain, each rising event makes the problem…', o:['harder','solved','shorter']}
  ]},

  'WRIT.PARA.L08.08':{name:'Character by Dialogue',
  teach:[
    {how:'In Dialogue + Action you mixed talk with action. Now make the talk itself show WHO HE IS. Turn the dials. WORD CHOICE: the words only he would use. Zaidy says, “Nu, Shimon’ke, twice around, then pull.” His big brother Nachum says, “Forget knots. Tape it.” LENGTH: short and clipped, or long and winding. A boy in a rush talks in bits; a calm Zaidy takes his time.', q:'Nachum is in a rush and thinks the knots waste time. Which line sounds like him?', o:['“Forget knots. Tape it. Let’s go.”','“Let us take our time and tie each knot with care.”','“My dear brother, perhaps we might try another way.”']},
    {how:'The third dial is WHAT HE AVOIDS SAYING. Real people often step around the hard thing. Shimon asks, “Zaidy, are you tired?” Zaidy says, “Hand me the rope.” He never answers, and the reader sees his pride. What a character will not say tells as much as what he says.', q:'Shimon asks, “Should I call Abba to come home early?” Which answer shows Zaidy will not admit he needs help?', o:['“Your Abba has a job. Hold the pole straight.”','“Yes, I am too tired to finish.”','“Zaidy is a proud man who never asks for help.”']},
    {how:'Two mistakes. TELLS THE TRAIT: the writer names it instead of showing it (“Zaidy, who was very patient, said…”), or a character announces himself (“I am a careful man”). SAME VOICE: everyone talks alike, so if you swapped the names, nothing would change. When the words, the length and the silences fit one person, the line SHOWS BY HOW HE SPEAKS.', q:'“Nachum, who was always impatient, said, ‘Hurry up.’” Which is it: shows by how he speaks, tells the trait, or same voice?', o:['tells the trait','same voice','shows by how he speaks']}
  ],
  practice:[
    {t:'sort', q:'Benny’s sukkah story. Sort each line.', bins:[{id:'S',label:'🗣️ Shows by how he speaks'},{id:'T',label:'🏷️ Tells the trait'}],
      items:[{label:'“Twice around, then pull. A knot is a promise,” Zaidy said.',bin:'S'},{label:'Zaidy was a very patient and careful man.',bin:'T'},{label:'“Tape. It’s fine. Let’s go,” Nachum said.',bin:'S'},{label:'Nachum was always in a hurry.',bin:'T'},{label:'“A ladder? I have two! Three, with the broken one!” Mr. Haddad called.',bin:'S'},{label:'“I am a cheerful neighbor,” said Mr. Haddad.',bin:'T'}],
      h:'Does the line let you hear who he is? Or does it just name what he is like?'},
    {t:'pairs', q:'Match each dial to an example.', pairs:[['word choice','Zaidy’s “Nu” and “Shimon’ke”'],['length','“Tape. Fine. Go.” Three clipped words.'],['what he avoids','asked if he is tired, he asks for the rope']],
      h:'Which dial is turned: the words, how long he talks, or what he steps around?'},
    {t:'spotall', q:'Zaidy is warm, patient and old-fashioned. Tap every line that sounds like HIM.', cells:[{label:'“Nu, slowly. A rushed knot is two knots later.”',ok:true},{label:'“Come, Shimon’ke, I’ll show you once more.”',ok:true},{label:'“In my day, we built with what we had.”',ok:true},{label:'“Faster! Just tape it.”',ok:false},{label:'“Hurry up, we’re wasting time!”',ok:false}],
      h:'Hear each line in your head. Could it come from a warm, patient, old-fashioned Zaidy?'},
    {t:'sort', q:'Sneaky ones! Gavriel gave each boy in his camera story a voice. Moshe is nervous; Dovi is calm. Sort each try.', bins:[{id:'G',label:'✅ Shows by how he speaks'},{id:'T',label:'⚠️ Mistake: tells the trait'},{id:'V',label:'⚠️ Mistake: same voice'}],
      items:[{label:'Moshe: “Is that the bus? Is it leaving? Did we miss it?” Dovi: “It’s parked. Breathe.”',bin:'G'},{label:'Moshe, who was a nervous boy, said, “Let’s go.”',bin:'T'},{label:'Moshe: “We should look for the camera.” Dovi: “We should look for the camera.”',bin:'V'},{label:'“I am a calm person, so I am not worried,” said Dovi.',bin:'T'},{label:'Moshe: “Bus! Now! Hurry!” Dovi: “It leaves at three. We have twenty minutes.”',bin:'G'}],
      h:'Is the trait named? Could you swap the names and not notice?'},
    {t:'order', q:'Build a scene where Zaidy steps around the question. Tap the sentences in order.', tiles:['“Are you tired, Zaidy?” I asked.','“Hand me the rope,” he said.','“And hold the pole straight.”'], extra:['Zaidy was a very proud man.'],
      h:'The question comes first. Then his answer that is not an answer. Leave out the line that names a trait.'},
    {t:'spotall', q:'Yoni writes about practicing his bar mitzvah speech. His Rebbi is strict but kind. Tap every line that SHOWS it by how he speaks.', cells:[{label:'“Again. From the top. Slower.”',ok:true},{label:'“Good. Now so the back row hears you.”',ok:true},{label:'“Same word again. We fix it, then we eat.”',ok:true},{label:'Rebbi was strict but kind.',ok:false},{label:'“I am strict, but I am also kind,” said Rebbi.',ok:false}],
      h:'Do the words and the length let you hear him? Or does the line name the trait?'},
    {t:'write', q:'Your turn to write. Write two lines of dialogue, one for Zaidy and one for Nachum, about the falling sukkah. Make each voice different. Then write one line where Zaidy steps around a question.', min:0, checks:['🎚️ Word choice and length fit each speaker.','🤐 One character steps around a question.','🏷️ I never named a trait like "patient" or "impatient".'], h:'Read the lines with the names covered. Can you still tell who is talking?'}
  ],
  check:[
    {q:'Eli’s story: before the debate final, Eli asks his coach, “Well? Am I ready?” The coach straightens his tie. “You have your notes. Go.” Which is it: shows by how he speaks, tells the trait, or same voice?', o:['shows by how he speaks','tells the trait','same voice'], h:'Is a trait named? Or do his words, his length and what he skips show it?'},
    {q:'Akiva’s story: two boys at the lost-and-found. “I think the hat is mine,” says Shaya. “I think the hat is mine,” says Leib. Which is it: shows by how he speaks, tells the trait, or same voice?', o:['same voice','tells the trait','shows by how he speaks'], h:'Cover the names. Can you tell who is talking?'},
    {t:'order', q:'Build a scene where Rebbi steps around the question. Tap the sentences in order.', tiles:['“Is my speech ready, Rebbi?” Yoni asked.','“Read it to me again,” Rebbi said.','“And this time, slower.”'], extra:['Rebbi was a strict man.'], h:'The question comes first. Then the answer that is not a yes. Leave out the line that names a trait.'}
  ],
  re:[
    {how:'A new way: a phone call. You cannot see anyone, but you know Zaidy from Nachum in three words. Good dialogue works like a voice on the phone.', q:'If you can tell who is talking with the names covered, the dialogue…', o:['shows by how he speaks','tells the trait','same voice']},
    {how:'A simpler step: turn ONE dial. Make one speaker short and clipped, and the other long and winding. That alone gives you two voices.', q:'Which dial is “short and clipped, or long and winding”?', o:['length','word choice','what he avoids']},
    {how:'The skill underneath: Dialogue + Action (Grade 5). You mixed what characters say with what they do. Now the words themselves, how long he talks and what he leaves unsaid, show who each character is.', q:'Dialogue + Action mixes what a character says with…', o:['what he does','what he ate','the title']}
  ]},

  'WRIT.PARA.L08.10':{name:'Precise Detail',
  teach:[
    {how:'In Picture Words you swapped a vague word for an exact one. Now choose a whole DETAIL. A GENERAL DETAIL could be in any story: “It was very windy. It was cold. Everything was wet.” A TELLING DETAIL could only be in THIS story, at THIS moment: “The wind peeled the mat out of my hands and flung it over Mr. Haddad’s fence.” One telling detail beats three general ones.', q:'Which is a telling detail?', o:['The paper chain my sister made snapped and skittered down the driveway.','It was a really stormy day.','The weather was very bad.']},
    {how:'A telling detail captures the ACTION or the FEELING. For a feeling, do not pile up “I was nervous, worried and scared.” Find the one thing a camera would catch: “I checked the oven clock three times in one minute.” Test every detail: could it be in someone else’s story? If yes, it is general. Cut it.', q:'Shimon is afraid the sukkah will not be ready. Which detail captures the feeling?', o:['I checked the oven clock three times in one minute.','I was very, very worried.','I felt nervous and scared and upset.']},
    {how:'Two mistakes. BURIED: the telling detail is there, but general ones bury it: “It was windy and cold and wet and loud, and the rope burned my palm.” Cut the general ones. BESIDE THE POINT: the detail is exact, but it does not capture this action or feeling. In the scariest gust, “Zaidy’s coat had four brown buttons” is exact, but it tells the reader nothing about the moment.', q:'The frame is lifting in the gust. Which detail is beside the point?', o:['Zaidy’s coat had four brown buttons.','The pole jumped in my hands like a fish.','The rope burned a red line across my palm.']}
  ],
  practice:[
    {t:'sort', q:'Benny’s storm scene. Sort each detail.', bins:[{id:'T',label:'🎯 Telling detail'},{id:'G',label:'🌫️ General detail'}],
      items:[{label:'The wind peeled the mat out of my hands.',bin:'T'},{label:'It was very windy.',bin:'G'},{label:'Rain dripped off Zaidy’s hat onto the knot.',bin:'T'},{label:'Everything was wet.',bin:'G'},{label:'My sister’s paper chain snapped and blew away.',bin:'T'},{label:'It was a stormy day.',bin:'G'}],
      h:'Could this detail be in someone else’s story? If yes, it is general.'},
    {t:'pairs', q:'Match each general line to a telling detail that could replace it.', pairs:[['I was nervous.','I checked the oven clock three times.'],['It was very windy.','The mat flew over the fence.'],['Zaidy was tired.','Zaidy sat down on the wet bench.']],
      h:'Which telling detail shows the same thing?'},
    {t:'spotall', q:'Shimon holds the pole in the big gust. Tap every detail that captures the MOMENT.', cells:[{label:'The pole jumped in my hands like a fish.',ok:true},{label:'The rope burned a red line across my palm.',ok:true},{label:'The whole frame groaned.',ok:true},{label:'Zaidy’s coat had four brown buttons.',ok:false},{label:'Our street has six houses.',ok:false}],
      h:'Does the detail show this action or this feeling? Or is it true but beside the point?'},
    {t:'sort', q:'Sneaky ones! Benny tried to sharpen his sentences. Sort each one.', bins:[{id:'G',label:'✅ One telling detail'},{id:'P',label:'⚠️ Mistake: buried'},{id:'B',label:'⚠️ Mistake: beside the point'}],
      items:[{label:'The rope burned a red line across my palm.',bin:'G'},{label:'It was windy, cold, wet and loud, and the rope burned my palm.',bin:'P'},{label:'As the gust hit, I saw the fence was painted white.',bin:'B'},{label:'My fingers kept slipping off the wet knot.',bin:'G'},{label:'I was scared, worried and nervous, and my fingers slipped.',bin:'P'},{label:'As the frame lifted, I remembered our car is blue.',bin:'B'}],
      h:'Is the telling detail buried under general ones? Or is it exact but about something else?'},
    {t:'order', q:'Build a sentence with one telling detail. Tap the tiles in order.', tiles:['The wind','peeled the mat','out of my hands','and flung it over the fence.'], extra:['It was windy.'],
      h:'What did it, what it did, and where it went. Leave out the general detail.'},
    {t:'spotall', q:'Yoni’s story: he stands up to give his bar mitzvah speech. Tap every TELLING DETAIL.', cells:[{label:'My knees knocked against the shtender.',ok:true},{label:'My Zaidy, in the front row, nodded once.',ok:true},{label:'The microphone squealed when I leaned in.',ok:true},{label:'It was a big night.',ok:false},{label:'I was very nervous.',ok:false}],
      h:'Could it be in someone else’s story? Does it show this moment?'},
    {t:'write', q:'Your turn to write. Take this general sentence: “It was a stormy day, and I was scared.” Rewrite it with ONE telling detail for the action and ONE for the feeling.', min:0, checks:['🎯 Each detail could only be in this story.','✂️ I cut the general words.','🔍 Each detail shows the action or the feeling, not something beside the point.'], h:'Ask: what would a camera catch at that second? Write only that.'}
  ],
  check:[
    {q:'Gavriel’s story: he finds his lost camera just as the bus starts. He writes, “It was a crazy, stressful, wild, intense moment.” Is it a telling detail, a general detail, or beside the point?', o:['general detail','telling detail','beside the point'], h:'Could the sentence be in someone else’s story?'},
    {q:'Eli’s story: the judge reads the winner’s name. Eli writes, “My coach grabbed my sleeve so hard a button popped off.” Is it a telling detail, a general detail, or beside the point?', o:['telling detail','general detail','beside the point'], h:'Could it be in any story? Does it show this moment?'},
    {t:'order', q:'Build a sentence with one telling detail for the feeling. Tap the tiles in order.', tiles:['Gavriel','checked under','the same seat','three times.'], extra:['He was worried.'], h:'Who, what he did, where, and how often. Leave out the general detail.'}
  ],
  re:[
    {how:'A new way: a photographer at a simcha takes a hundred pictures. The album keeps the one of the chassan’s father wiping his eyes. One picture tells the whole feeling.', q:'The one picture that tells the whole feeling is like…', o:['a telling detail','a general detail','buried']},
    {how:'A simpler step: list three details for the moment. Cross out every one that could be in someone else’s story. Keep the one that is left.', q:'“It was cold.” Could it be in someone else’s story?', o:['yes, so it is a general detail','no, so it is a telling detail','it is beside the point']},
    {how:'The skill underneath: Picture Words (Grade 5). You swapped a vague word for an exact one. Now you choose the one whole detail that carries the moment, and cut the general ones around it.', q:'Picture Words swaps a vague word for…', o:['an exact one','a longer one','a feeling word']}
  ]},

  'WRIT.PARA.L08.11':{name:'Reflective Ending',
  teach:[
    {how:'In Ending That Lands you learned that a reflection shows what the main character now understands. Now make it EARNED: it grows out of one real moment in the story. Point back at that moment, then say what it meant: “When the second loop Zaidy made me tie held in the gust, I saw why he never rushed a knot.” A reflection about something the story never showed is OUT OF NOWHERE.', q:'Benny’s story is about building the sukkah with Zaidy in the storm. Which reflection is earned?', o:['When the second loop held in the gust, I finally saw why Zaidy never rushed a knot.','I realized I should be nicer to my little sister.','I realized that school is important.']},
    {how:'A strong reflection shows a CHANGE in understanding: what he used to think, and what he sees now. Use a BEFORE and a NOW. “All week I had rolled my eyes at Zaidy’s double knots. Tonight I understood: he was not slow. He was building for the worst night, not the nice one.” The reader watched the knot hold, so he believes the change.', q:'Which reflection shows a change in understanding?', o:['I used to think Zaidy was slow. Now I knew he built for the worst night.','Zaidy is a good builder.','When the rain stopped, we made kiddush in the sukkah.']},
    {how:'Two mistakes. OUT OF NOWHERE: the reflection is about something the story never showed (“I realized I should be nicer to my sister”). NO CHANGE: it is about the story, but it only says what is true, with no before: “Zaidy is a good builder.” Nothing turned in his thinking. (A pasted-on moral from Grade 6, like “I learned never to give up,” is still a mistake.) An EARNED REFLECTION points to this story’s moment and shows how his thinking changed.', q:'Which ending has no change?', o:['Zaidy is a very careful builder.','I had rolled my eyes at the double knots; tonight one held.','I used to tease my sister. Now I am nicer to her.']}
  ],
  practice:[
    {t:'sort', q:'Endings for Benny’s sukkah story. Sort each one.', bins:[{id:'E',label:'🌱 Earned reflection'},{id:'C',label:'➖ No change'}],
      items:[{label:'I used to think Zaidy’s double knots were slow. Tonight one held.',bin:'E'},{label:'Zaidy is a very careful builder.',bin:'C'},{label:'All week I wanted tape. Now I knew why Zaidy ties twice.',bin:'E'},{label:'Zaidy’s double knots are very strong.',bin:'C'},{label:'The knot I had called old-fashioned held at candle lighting.',bin:'E'},{label:'Our sukkah has strong knots.',bin:'C'}],
      h:'Does it point back to a moment and show a before and a now? Or does it just say how things are?'},
    {t:'pairs', q:'Match each part of a reflective ending to an example.', pairs:[['the moment','The second loop held in the gust.'],['before','I used to roll my eyes at his knots.'],['now','Now I knew he built for the worst night.']],
      h:'What happened? What did he think then? What does he see now?'},
    {t:'spotall', q:'Tap every ending that shows a CHANGE in understanding.', cells:[{label:'I used to think Zaidy was slow. Now I knew he was careful.',ok:true},{label:'I had called the knots old-fashioned. Tonight they held.',ok:true},{label:'Before tonight, a sukkah was a box. Now it was something we held up together.',ok:true},{label:'The sukkah was green.',ok:false},{label:'When the rain stopped, we made kiddush in the sukkah.',ok:false}],
      h:'Look for a before and a now: what he used to think, and what he sees now.'},
    {t:'sort', q:'Sneaky endings! Yoni’s story: for weeks his Rebbi made him repeat the hard line, “Again.” At the seudah the microphone died, and Yoni said the hard line with no notes. Sort each ending.', bins:[{id:'G',label:'✅ Earned reflection'},{id:'C',label:'⚠️ Mistake: no change'},{id:'N',label:'⚠️ Mistake: out of nowhere'}],
      items:[{label:'I thought Rebbi’s “Again” was a punishment. With the microphone dead, that line was already in me.',bin:'G'},{label:'Rebbi’s “Again” is a good way to practice.',bin:'C'},{label:'I used to skip the dishes. Now I help Ima every night.',bin:'N'},{label:'Rebbi is a very good teacher.',bin:'C'},{label:'I used to hate baseball. Now I love it.',bin:'N'},{label:'All those “Agains” had seemed a waste. With no notes, they were all I had.',bin:'G'}],
      h:'First ask: did the story show it? If not, it is out of nowhere. If it did, is there a before and a now?'},
    {t:'order', q:'Build an earned reflection: the moment, before, then now. Tap the sentences in order.', tiles:['The second loop Zaidy made me tie was still holding when the gust passed.','All week I had rolled my eyes at that loop.','Now I knew he had been building for the worst night, not the nice one.'], extra:['And I learned a lesson: never give up.'],
      h:'First the moment. Then what he used to think. Then what he sees now. Leave out the moral.'},
