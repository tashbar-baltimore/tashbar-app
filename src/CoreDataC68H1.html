    'READ.COMP.L08.10':{name:"Set His View Apart", teach:[{"how": "An author who argues often shows the other view first, with signals like some people say, others felt, or I understand why.", "q": "\"Some people wanted the vaccine sooner.\" Whose view is this?", "o": ["the other view", "the author's own view", "a fact"]}, {"how": "Then comes the turn, where he sets his view apart: but, however, still, I have come to the opposite view.", "q": "Which words turn to the author's own view?", "o": ["But I believe", "Some people say", "In 1954"]}, {"how": "A fair author respects the other view, then explains why he still disagrees.", "q": "\"Their impatience came from love.\" What is the author doing?", "o": ["he respects the other view", "he gives his own view", "he changes the subject"]}], practice:[{"t": "sort", "q": "Whose view is each one?", "bins": [{"id": "0", "label": "The other view"}, {"id": "1", "label": "The author's view"}], "items": [{"label": "Some people say homework should end.", "bin": "0"}, {"label": "But I believe a little homework helps.", "bin": "1"}, {"label": "Others felt the wait was cruel.", "bin": "0"}, {"label": "I think the wait was wise.", "bin": "1"}], "h": "Signals: some people, others, or I believe."}, {"t": "pairs", "q": "Match each signal to its job.", "pairs": [["Some people say", "the other view"], ["However, I think", "the turn to his view"], ["I see why they feel that way", "he respects the other view"]], "h": "What does each phrase do?"}, {"t": "order", "q": "Put the parts of a fair argument in order.", "tiles": ["the other view", "the turn", "his view", "his reasons"], "h": "Others first, then the turn, then his own."}, {"t": "spotall", "q": "Tap every turn signal.", "cells": [{"label": "But", "ok": true}, {"label": "However", "ok": true}, {"label": "Some say", "ok": false}, {"label": "Still", "ok": true}], "h": "A turn word sets his view apart."}, {"t": "sort", "q": "Mistake Detective: is each one read right?", "bins": [{"id": "0"     'READ.LIT.L08.09':{name:"Story and History", teach:[{"how": "A story about a real time invents people, talk and feelings. A history gives real people, dates and numbers.", "q": "Which one gives exact numbers?", "o": ["the history", "the story", "neither"]}, {"how": "Check the story against the history: did the author keep the facts, or change them?", "q": "The story says half the children got a shot of nothing. The history says the same. The author...", "o": ["kept the fact", "changed the fact", "left it out"]}, {"how": "Ask why the author used fiction: to make readers feel what it was like.", "q": "Why tell this spring through one family?", "o": ["to make readers feel what it was like", "to give exact numbers", "to replace the history"]}], practice:[{"t": "sort", "q": "Story or history?", "bins": [{"id": "0", "label": "Story"}, {"id": "1", "label": "History"}], "items": [{"label": "Mama signs the note at night.", "bin": "0"}, {"label": "Almost two million children took part.", "bin": "1"}, {"label": "Dovi wants to be a rebbe.", "bin": "0"}, {"label": "Dr. Francis designed the test.", "bin": "1"}], "h": "Made-up family, or real numbers and people?"}, {"t": "pairs", "q": "Match each text to what it gives best.", "pairs": [["a story", "feelings and daily life"], ["a history", "dates, numbers, real people"], ["both", "the same real events"]], "h": "What can only a story give?"}, {"t": "spotall", "q": "Tap every detail the story kept from history.", "cells": [{"label": "three shots", "ok": true}, {"label": "a Polio Pioneer button", "ok": true}, {"label": "half got nothing", "ok": true}, {"label": "Dovi's dream", "ok": false}], "h": "Check each one in the history."}, {"t": "order", "q": "Put the real events in order.", "tiles": ["the shots begin", "the summer passes", "the results are announced"], "h": "Spring, summer, the next April."}, {"t": "sort", "q": "Mistake Detective: kept or changed?", "bins": [{"id": "0", "label": "Kept the fact"}, {"id": "1", "label": "Changed it"}], "items": [{"label": "Results came the next April.", "bin": "0"}, {"label": "Results came the same summer.", "bin": "1"}, {"label": "Nobody knew who got which shot.", "bin": "0"}, {"label": "Mama knew Dovi got the real one.", "bin": "1"}], "h": "Check each line against the history."}, {"t": "pairs", "q": "Match each question to the text that answers it.", "pairs": [["How did a family feel?", "the story"], ["How many children took part?", "the history"], ["What happened that spring?", "both"]], "h": "Feelings, numbers, or events?"}], check:[{"q": "History: \"In 1916, about 27,000 Americans caught polio.\" Story: \"That summer Shloimy's street was silent; no one went to the pool.\" What does the story add?", "o": ["feelings and daily life", "exact numbers", "the date"], "h": "What can a story show that a number cannot?"}, {"q": "History: \"The results were announced on April 12, 1955.\" Story: \"That winter, the radio said the vaccine worked.\" What did the story author do?", "o": ["he changed the date", "he kept the fact", "he left it out"], "h": "Check the story's time against the history's date."}, {"q": "Why might an author write fiction about a real event?", "o": ["to make readers feel what it was like", "to give exact numbers", "to replace the history"], "h": "What does a story do that a history cannot?"}], re:[{"q": "Which text has invented talk?", "o": ["the story", "the history", "both"], "h": "Who made up the words?"}, {"q": "How do you check a story's facts?", "o": ["against the history", "against another story", "by guessing"], "h": "Use the text with real dates."}, {"q": "A story moves an event to a different year. The author...", "o": ["changed the fact", "kept the fact", "made no choice"], "h": "Compare the years."}]},
    'READ.COMP.L08.11':{name:"Read It, Hear It", teach:[{"how": "Reading the printed text, you can go back and reread, check an exact number, and see how the sections are built.", "q": "What can a reader do that a listener cannot do easily?", "o": ["go back and reread", "hear the tone", "feel the pace"]}, {"how": "Hearing a text read aloud gives you the reader's tone and pace, the pauses and the mood.", "q": "What does a voice add?", "o": ["the reader's tone and pace", "page numbers", "the spelling"]}, {"how": "To check an exact fact, find the printed text.", "q": "You need the exact year from a speech you heard. What is best?", "o": ["find the printed text", "guess from memory", "listen once at full speed"]}], practice:[{"t": "sort", "q": "Which version does each job best?", "bins": [{"id": "0", "label": "Printed text"}, {"id": "1", "label": "Heard aloud"}], "items": [{"label": "rereading a hard line", "bin": "0"}, {"label": "catching the tone", "bin": "1"}, {"label": "checking a number", "bin": "0"}, {"label": "feeling the pauses", "bin": "1"}], "h": "Rereading and exact facts, or voice and mood?"}, {"t": "pairs", "q": "Match each version to its strength.", "pairs": [["a recording of a speech", "tone and pauses"], ["the printed speech", "quote it exactly"], ["a chart with an article", "compare numbers at a glance"]], "h": "What does each do best?"}, {"t": "spotall", "q": "Tap every job the printed text does best.", "cells": [{"label": "reread", "ok": true}, {"label": "quote exactly", "ok": true}, {"label": "hear tone", "ok": false}, {"label": "see headings", "ok": true}], "h": "What can your eyes go back to?"}, {"t": "order", "q": "Put the smart steps in order.", "tiles": ["read the page", "hear it read", "compare what each gave"], "h": "Read, listen, then compare."}, {"t": "sort", "q": "Mistake Detective: true or a mistake?", "bins": [{"id": "0", "label": "True"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "A voice can change the mood.", "bin": "0"}, {     'READ.COMP.L08.12':{name:"Map the Argument", teach:[{"how": "An argument has a claim (what the writer wants you to believe), reasons (why), and evidence (facts or examples that back each reason).", "q": "\"Secrets should be told once they stop protecting anyone.\" What is this?", "o": ["the claim", "a piece of evidence", "a reason"]}, {"how": "A reason answers why. Evidence answers how do you know. Each reason should have its own evidence.", "q": "\"The Bletchley Park code breakers stayed silent for about thirty years.\" What is this?", "o": ["evidence", "the claim", "a counterclaim"]}, {"how": "A counterclaim is the other side's view, which a strong writer answers.", "q": "\"Some people say any secret might help a future enemy.\" What is this?", "o": ["a counterclaim", "the claim", "evidence"]}], practice:[{"t": "sort", "q": "Claim, reason or evidence?", "bins": [{"id": "0", "label": "Claim"}, {"id": "1", "label": "Reason"}, {"id": "2", "label": "Evidence"}], "items": [{"label": "Our school day should start later.", "bin": "0"}, {"label": "Tired boys learn less.", "bin": "1"}, {"label": "A study found that rested students scored higher.", "bin": "2"}], "h": "What he wants, why, how he knows."}, {"t": "pairs", "q": "Match each part to its question.", "pairs": [["claim", "What should I believe?"], ["reason", "Why?"], ["evidence", "How do you know?"]], "h": "Each part answers one question."}, {"t": "order", "q": "Put the argument map in order, top to bottom.", "tiles": ["claim", "reason", "evidence for that reason"], "h": "Claim on top, then each reason, then its proof."}, {"t": "spotall", "q": "Tap every piece of evidence.", "cells": [{"label": "In 2001 they got a medal.", "ok": true}, {"label": "Secrets should end.", "ok": false}, {"label": "800 messages, no mistakes.", "ok": true}, {"label": "It is only fair.", "ok": false}], "h": "Evidence is a fact or example you could check."}, {"t": "sort", "q": "Mistake Detective: named right?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "\"Keep secrets while they protect, then tell\" = the claim", "bin": "0"}, {"label": "\"Thirty years of silence\" = the claim", "bin": "1"}, {"label": "\"Thirty years of silence\" = evidence", "bin": "0"}], "h": "A fact you can check is evidence, not the claim."}, {"t": "pairs", "q": "Match each sentence to its part.", "pairs": [["Uniforms should be required.", "claim"], ["They save time each morning.", "reason"], ["Our survey: 8 minutes saved.", "evidence"]], "h": "What, why, how do you know?"}, {"t": "pairs", "q": "Match each part to its question.", "pairs": [["counterclaim", "What does the other side say?"], ["his reply to the other side", "How does the writer answer that?"]], "h": "The other side speaks; then the writer answers. The claim and the reason stay on top."}], check:[{"q": "\"Our yeshiva should start a chess club. Chess teaches boys to plan ahead: in one study, students who played chess for a year solved planning puzzles faster. Some parents worry the club will take time from learning. But it would meet only during lunch.\" \"Some parents worry the club will take time from learning\" is the ___.", "o": ["counterclaim", "claim", "evidence"], "h": "What does the other side worry about?"}, {"q": "\"Our yeshiva should start a chess club. Chess teaches boys to plan ahead: in one study, students who played chess for a year solved planning puzzles faster. Some parents worry the club will take time from learning. But it would meet only during lunch.\" \"But it would meet only during lunch\" is ___.", "o": ["his reply to the other side", "the claim", "evidence for the reason"], "h": "How does the writer answer the worry?"}, {"q": "\"Our yeshiva should start a chess club. Chess teaches boys to plan ahead: in one study, students who played chess for a year solved planning puzzles faster. Some parents worry the club will take time from learning. But it would meet only during lunch.\" The study about planning puzzles is evidence for ___.", "o": ["the reason", "the counterclaim", "his reply to the other side"], "h": "Which part does the study back up?"}], re:[{"q": "Which part answers why?", "o": ["the reason", "the claim", "the evidence"], "h": "Why = reason."}, {"q": "\"80% of boys agreed.\" This is...", "o": ["evidence", "a claim", "a counterclaim"], "h": "A fact you can check."}, {"q": "What does a strong writer do with a counterclaim?", "o": ["answers it", "hides it", "copies it"], "h": "He shows the other side, then replies."}]},
    'READ.COMP.L08.13':{name:"Is It Sound?", teach:[{"how": "Reasoning is sound when the reason really leads to the claim. One example cannot prove that something is always true.", "q": "\"One government hid a secret, so every government hides everything.\" Is it sound?", "o": ["no: one example cannot prove always", "yes: one example is enough", "yes: it names a country"]}, {"how": "A reason built on something false cannot hold up the claim.", "q": "\"Nobody uses codes anymore, so old secrets cannot matter.\" What is wrong?", "o": ["the reason is false", "it is too long", "nothing"]}, {"how": "Attacking the people who disagree is not a reason at all.", "q": "\"Anyone who disagrees does not care.\" What is this?", "o": ["an attack, not a reason", "strong evidence", "a fair counterclaim"]}], practice:[{"t": "sort", "q": "Sound or unsound?", "bins": [{"id": "0", "label": "Sound"}, {"id": "1", "label": "Unsound"}], "items": [{"label": "Many studies show it, so it is likely true.", "bin": "0"}, {"label": "My cousin did it once, so everyone does.", "bin": "1"}, {"label": "The code was replaced, so it is safe to tell.", "bin": "0"}, {"label": "Anyone who disagrees is lazy.", "bin": "1"}], "h": "Does the reason really lead to the claim?"}, {"t": "pairs", "q": "Match each problem to its name.", "pairs": [["one example → always", "too few examples"], ["\"nobody uses codes\"", "a false reason"], ["\"you just don't care\"", "attacking the person"]], "h": "What exactly goes wrong?"}, {"t": "spotall", "q": "Tap every unsound reason.", "cells": [{"label": "It happened once, so always.", "ok": true}, {"label": "Ten trials agree.", "ok": false}, {"label": "Only a fool disagrees.", "ok": true}, {"label": "The facts were checked.", "ok": false}], "h": "Look for leaps, false facts and attacks."}, {"t": "order", "q": "Put the steps for judging a reason in order.", "tiles": ["find the claim", "find a reason for it", "run the three tests"], "h": "Claim first, then the reason, then test it."}, {"t": "sort", "q": "Mistake Detective: judged right?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "\"One example proves always\" is unsound.", "bin": "0"}, {"label": "A loud writer must be right.", "bin": "1"}, {"label": "An attack is not a reason.", "bin": "0"}], "h": "Judge the reasoning, not how strongly it is said."}, {"t": "pairs", "q": "Match each reason to its problem.", "pairs": [["\"One store was rude, so all stores are rude.\"", "too few examples"], ["\"Phones never break, so no warranty is needed.\"", "a false reason"], ["\"Only babies like that game.\"", "attacking the person"]], "h": "Name what goes wrong."}], check:[{"q": "\"One boy in our class got sick after eating sushi, so sushi makes everyone sick.\" What is wrong with the reasoning?", "o": ["too few examples", "a false reason", "attacking the person"], "h": "How many examples back up \"everyone\"?"}, {"q": "\"Homework is useless because no one ever learns anything at home.\" What is wrong with the reasoning?", "o": ["a false reason", "too few examples", "attacking the person"], "h": "Is the reason itself true?"}, {"q": "\"People who want longer recess are just lazy.\" What is wrong with this?", "o": ["attacking the person", "too few examples", "a false reason"], "h": "Does it give a reason, or insult the other side?"}], re:[{"q": "Can one example prove that something is always true?", "o": ["no", "yes", "only on Sundays"], "h": "Always needs more than one case."}, {"q": "\"You only say that because you're young.\" This is...", "o": ["attacking the person", "strong evidence", "a fair reason"], "h": "It talks about the person, not the idea."}, {"q": "A reason that is not true...", "o": ["cannot hold up the claim", "makes the claim stronger", "does not matter"], "h": "A false reason is a broken support."}]},
    'READ.COMP.L08.14':{name:"Enough Evidence?", teach:[{"how": "Evidence is relevant when it is about the reason it supports. Facts about something else, even true ones, do not help.", "q": "The question is when to tell secrets. \"Code-breaking offices cost millions.\" Relevant?", "o": ["no: it is about cost, not when to tell", "yes: it is a fact", "yes: it is a big number"]}, {"how": "Evidence is enough when it is strong and has more than one example for a big claim.", "q": "A writer claims all governments hide secrets, with one example. Is it enough?", "o": ["no: one example for a big claim", "yes: one is plenty", "yes: it is famous"]}, {"how": "The strongest arguments give relevant evidence for every reason.", "q": "What makes evidence strong?", "o": ["it is relevant and enough", "it is long", "it sounds angry"]}], practice:[{"t": "sort", "q": "Relevant or not, to \"Uniforms save time\"?", "bins": [{"id": "0", "label": "Relevant"}, {"id": "1", "label": "Not relevant"}], "items": [{"label": "Boys chose outfits 8 minutes faster.", "bin": "0"}, {"label": "Uniforms come in blue.", "bin": "1"}, {"label": "Boys left home 5 minutes earlier.", "bin": "0"}, {"label": "The store opened in 1990.", "bin": "1"}], "h": "Is it about saving time?"}, {"t": "pairs", "q": "Match each problem to its name.", "pairs": [["true but off topic", "not relevant"], ["one example for \"always\"", "not enough"], ["many matching facts", "relevant and enough"]], "h": "Ask: is it about the reason? Is there enough?"}, {"t": "spotall", "q": "Tap the evidence that is relevant to \"The code talkers saved lives.\"", "cells": [{"label": "800 messages, no mistakes", "ok": true}, {"label": "Navajo has tones", "ok": false}, {"label": "Iwo Jima was taken", "ok": true}, {"label": "Arizona is hot", "ok": false}], "h": "Does it show lives were saved?"}, {"t": "order", "q": "Put the evidence test in order.", "tiles": ["name the reason", "test the evidence: relevant? enough?", "decide: strong or weak"], "h": "Reason first, then the tests, then decide."}, {"t": "sort", "q": "Mistake Detective: judged right?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "A true fact can still be off topic.", "bin": "0"}, {"label": "Any true fact is good evidence.", "bin": "1"}, {"label": "One case cannot prove always.", "bin": "0"}], "h": "True is not the same as relevant."}, {"t": "pairs", "q": "Match each piece of evidence to its verdict.", "pairs": [["\"Some waited 50 years for a medal.\" (long secrets hurt people)", "relevant"], ["\"Codes cost millions.\" (when to tell)", "not relevant"]], "h": "Is it about that reason?"}], check:[{"q": "Claim: \"Our school needs a bigger lunchroom.\" Evidence: \"The lunchroom was painted green in 2015.\" This evidence is ___.", "o": ["not relevant", "not enough", "relevant and enough"], "h": "Is paint about having room to eat?"}, {"q": "\"Every boy in Baltimore loves soccer. My brother does.\" This evidence is ___.", "o": ["not enough", "not relevant", "relevant and enough"], "h": "How many boys does the evidence show?"}, {"q": "Claim: \"Bikes need lights at night.\" Evidence: \"In three towns, night bike crashes fell by half once riders used lights.\" This evidence is ___.", "o": ["relevant and enough", "not relevant", "not enough"], "h": "Is it about lights at night? Is there more than one case?"}], re:[{"q": "A fact can be true and still be...", "o": ["not relevant", "the claim", "a reason"], "h": "Off topic facts do not help."}, {"q": "Big claims need...", "o": ["more than one example", "one example", "no evidence"], "h": "Always needs many cases."}, {"q": "Strong evidence is...", "o": ["relevant and enough", "long and loud", "a feeling"], "h": "Both tests."}]},
    'READ.COMP.L08.15':{name:"Spot the Trick", teach:[{"how": "Loaded words carry strong feelings to push you, without proving anything: sneaky, shameful, ridiculous.", "q": "\"These shameful secrets.\" Which word is loaded?", "o": ["shameful", "secrets", "these"]}, {"how": "One-sided facts tell only the part that helps the writer and leave out the rest.", "q": "A writer says the code talkers waited decades, but not why the code stayed secret. That is...", "o": ["one-sided", "balanced", "a counterclaim"]}, {"how": "To check, swap a loaded word for a plain one, and ask what the writer left out.", "q": "A plain word for \"sneaky tricks\" is...", "o": ["secret methods", "evil plots", "shameful lies"]}], practice:[{"t": "sort", "q": "Loaded or plain?", "bins": [{"id": "0", "label": "Loaded"}, {"id": "1", "label": "Plain"}], "items": [{"label": "sneaky", "bin": "0"}, {"label": "secret", "bin": "1"}, {"label": "ridiculous", "bin": "0"}, {"label": "unlikely", "bin": "1"}], "h": "Does it push a feeling, or just name the thing?"}, {"t": "pairs", "q": "Match each loaded word to a plain one.", "pairs": [["sneaky tricks", "secret methods"], ["shameful", "kept private"], ["ridiculous", "unlikely"]], "h": "Same thing, no push."}, {"t": "spotall", "q": "Tap every loaded word.", "cells": [{"label": "sneaky", "ok": true}, {"label": "thirty", "ok": false}, {"label": "shameful", "ok": true}, {"label": "ridiculous", "ok": true}], "h": "Which words push a feeling?"}, {"t": "order", "q": "Put the steps for spotting a trick in order.", "tiles": ["find the loaded words", "swap each for a plain word", "see if the point still stands"], "h": "Find, swap, then judge what is left."}, {"t": "sort", "q": "Mistake Detective: judged right?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "Strong feelings are not proof.", "bin": "0"}, {"label": "A writer who sounds angry must be right.", "bin": "1"}, {"label": "Ask what the writer left out.", "bin": "0"}], "h": "Feelings push; facts prove."}, {"t": "pairs", "q": "Match each line to its trick.", "pairs": [["\"These shameful secrets\"", "loaded words"], ["\"They waited decades\" (no reason given)", "one-sided facts"]], "h": "A pushing word, or a missing part?"}], check:[{"q": "\"The greedy, selfish store owners raised prices again.\" The words greedy and selfish are ___.", "o": ["loaded words", "plain words", "evidence"], "h": "Do they push a feeling about the owners?"}, {"q": "An ad says, \"Our cereal has 10 vitamins!\" and does not say it is half sugar. What trick is this?", "o": ["one-sided facts", "loaded words", "a counterclaim"], "h": "What did it leave out?"}, {"q": "Which is the plain way to say \"the reckless, foolish plan\"?", "o": ["the risky plan", "the crazy plan", "the idiotic plan"], "h": "Same idea, no push."}], re:[{"q": "Loaded words...", "o": ["push feelings without proof", "give facts", "answer the other side"], "h": "They push."}, {"q": "One-sided facts leave out...", "o": ["the part that does not help the writer", "the title", "nothing"], "h": "What is missing?"}, {"q": "To check a loaded word...", "o": ["swap in a plain word", "read it louder", "skip it"], "h": "Does the point still stand?"}]},
    'READ.COMP.L08.16':{name:"Agree or Disagree?", teach:[{"how": "Two writers can agree on some facts and disagree on others. List the points they share first.", "q": "Both writers say oysters filter the water. What is this?", "o": ["they agree", "they disagree", "only one text"]}, {"how": "A disagreement is a point where the writers give different answers: the cause, the fix, or what a fact means.", "q": "One says harvesting is the main problem; one says pollution. What is this?", "o": ["they disagree", "they agree", "the same claim"]}, {"how": "Writers can even read the same fact two ways. Ask what each one says the fact means.", "q": "Both mention the crab rebound after 2008, but explain it differently. What is this?", "o": ["the same fact read two ways", "two different facts", "they agree"]}], practice:[{"t": "sort", "q": "Do the two writers agree or disagree?", "bins": [{"id": "0", "label": "They agree"}, {"id": "1", "label": "They disagree"}], "items": [{"label": "The bay is less clean than in 1900.", "bin": "0"}, {"label": "The main cause of the problem.", "bin": "1"}, {"label": "Oysters filter the water.", "bin": "0"}, {"label": "Whether strict limits are the answer.", "bin": "1"}], "h": "Do both say it, or does each give a different answer?"}, {"t": "pairs", "q": "Match each kind of point to an example.", "pairs": [["they agree", "both say oysters clean water"], ["they disagree", "harvesting or pollution?"], ["the same fact read two ways", "the crab rebound after 2008"]], "h": "Same answer, different answer, or same fact with two meanings?"}, {"t": "spotall", "q": "Tap every point where View A and View B disagree.", "cells": [{"label": "the main cause", "ok": true}, {"label": "oysters filter water", "ok": false}, {"label": "the best solution", "ok": true}, {"label": "the bay is dirtier", "ok": false}], "h": "Where do they give different answers?"}, {"t": "order", "q": "Put the compare steps in order.", "tiles": ["list where they agree", "list where they disagree", "check how each reads a shared fact"], "h": "Agree first, then disagree, then shared facts."}, {"t": "sort", "q": "Mistake Detective: read right?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "Two sides can share facts.", "bin": "0"}, {"label": "If they argue, they agree on nothing.", "bin": "1"}, {"label": "One fact can be read two ways.", "bin": "0"}], "h": "Opponents often share many facts."}], check:[{"q": "Yehuda's father: \"The new park needs more trees for shade.\" His uncle: \"The park needs shade, but a roof over the benches works faster.\" On whether the park needs shade, they...", "o": ["agree", "disagree", "only the father says it needs shade"], "h": "Read past the word but. Does the uncle also say the park needs shade?"}, {"q": "Yehuda's father: \"Plant more trees for shade.\" His uncle: \"We need shade, but a roof over the benches is faster.\" On how to make shade, they...", "o": ["disagree", "agree", "only the uncle gives a way to make shade"], "h": "Trees, or a roof?"}, {"q": "Writer 1: \"Test scores rose after recess got longer, so recess helps.\" Writer 2: \"Scores rose, but a new reading program began the same year.\" What is going on?", "o": ["the same fact read two ways", "two different facts", "they agree"], "h": "Do both mention the same rise? Do they explain it the same way?"}], re:[{"q": "When both writers say the same thing...", "o": ["they agree", "they disagree", "the same fact read two ways"], "h": "Same answer."}, {"q": "When they give different answers...", "o": ["they disagree", "they agree", "only one text"], "h": "Different answers."}, {"q": "Opponents often...", "o": ["share some facts", "share nothing", "use one text"], "h": "List the agreements first."}]},
    'READ.COMP.L08.17':{name:"Put It Together", teach:[{"how": "To answer a big question, gather a piece from each text. One text rarely tells the whole story.", "q": "Why use several texts to answer a big question?", "o": ["each text adds a piece", "one text is always enough", "longer answers sound smarter"]}, {"how": "Group the pieces: which facts go together? Then join them in your own words.", "q": "After gathering the pieces, what comes next?", "o": ["group the pieces", "copy one text", "stop and guess"]}, {"how": "A strong answer names where each piece came from.", "q": "What makes a put-together answer strong?", "o": ["it names each source", "it uses one source", "it adds no facts"]}], practice:[{"t": "sort", "q": "Which text gives each piece?", "bins": [{"id": "0", "label": "Estuary article"}, {"id": "1", "label": "Oyster article"}, {"id": "2", "label": "Waterman piece"}], "items": [{"label": "Water from six states drains to the bay.", "bin": "0"}, {"label": "One oyster filters about 50 gallons a day.", "bin": "1"}, {"label": "Trotlines are baited with chicken necks.", "bin": "2"}, {"label": "MSX and Dermo killed oysters.", "bin": "1"}], "h": "Which text was about that?"}, {"t": "pairs", "q": "Match each step to what you do.", "pairs": [["ask", "name the question"], ["gather", "a piece from each text"], ["group", "put matching pieces together"], ["answer", "join them and name each source"]], "h": "Ask, gather, group, answer."}, {"t": "spotall", "q": "Tap every answer that puts texts together.", "cells": [{"label": "uses two texts and names them", "ok": true}, {"label": "copies one paragraph", "ok": false}, {"label": "joins three sources", "ok": true}, {"label": "uses only one text", "ok": false}], "h": "Does it join more than one text?"}, {"t": "order", "q": "Put the steps in order.", "tiles": ["ask", "gather", "group", "answer"], "h": "Question first, answer last."}, {"t": "sort", "q": "Mistake Detective: a strong put-together answer?", "bins": [{"id": "0", "label": "Strong"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "It joins pieces from several texts.", "bin": "0"}, {"label": "It retells only one text.", "bin": "1"}, {"label": "It names each source.", "bin": "0"}], "h": "Several texts, each named."}, {"t": "pairs", "q": "Match each answer to its verdict.", "pairs": [["names a source for each piece", "strong"], ["gives the answer with no sources", "weak"]], "h": "Several texts, each named."}], check:[{"q": "Question: why did the town's pond freeze late this year? Ari answers: \"A warm winter (Text 1), warm water from a factory (Text 2) and a deep pond (Text 3).\" Why is his answer strong?", "o": ["each text adds a different piece", "all three texts say the same thing, so it must be true", "it uses the most famous text"], "h": "What did each text give Ari?"}, {"q": "Avi has three articles about bees. He answers using one and copies its last line. What is missing?", "o": ["a piece from each text", "a stronger opinion of his own", "more words from the same article"], "h": "How many texts did he use?"}, {"q": "Question: why are bees in trouble? A: \"Bees are in trouble because of sprays.\" B: \"The farm article blames sprays; the science article adds a disease.\" What makes B stronger?", "o": ["it joins a piece from each article and says where each came from", "it is longer", "it uses the science article, and science is always right"], "h": "Count B's sources. Does it say where each piece came from?"}], re:[{"q": "A big question needs...", "o": ["a piece from each text", "one text", "a guess"], "h": "Gather from several texts."}, {"q": "After you gather, you...", "o": ["group the pieces", "copy one text", "stop"], "h": "Matching pieces go together."}, {"q": "A strong answer...", "o": ["names each source", "hides its sources", "uses one source"], "h": "Say where each piece came from."}]},
    'READ.COMP.L08.18':{name:"Read the Chart", teach:[{"how": "Start with the title: it tells what the chart measures and where. A chart shows only that.", "q": "The title says Maryland's oyster harvest. What does the chart measure?", "o": ["Maryland's oysters only", "the whole world's oysters", "all fish in the bay"]}, {"how": "Next, read the trend: compare the first number with the last. Is it a rise, a fall, or a fall and then a rise?", "q": "15 million, 2 million, 1 million, 100,000, then 300,000. What is the trend?", "o": ["a steep fall, then a small rise", "a steady rise", "no change"]}, {"how": "Then connect chart and text. The chart shows how much; the text explains why.", "q": "Which one explains why the harvest fell?", "o": ["the text explains why", "the chart explains why", "neither"]}], practice:[{"t": "sort", "q": "Chart shows, or text tells?", "bins": [{"id": "0", "label": "The chart shows"}, {"id": "1", "label": "The text tells"}], "items": [{"label": "about 15 million bushels in the 1880s", "bin": "0"}, {"label": "dredges scraped reefs flat", "bin": "1"}, {"label": "about 100,000 in the 2000s", "bin": "0"}, {"label": "MSX and Dermo killed oysters", "bin": "1"}], "h": "A number from the list, or a reason?"}, {"t": "pairs", "q": "Match each trend to its numbers.", "pairs": [["a steady rise", "20, 35, 50"], ["a steady fall", "50, 35, 20"], ["a fall, then a small rise", "50, 20, 35"]], "h": "Compare first, middle and last."}, {"t": "spotall", "q": "Tap every question the oyster chart can answer.", "cells": [{"label": "How big was the harvest in the 1950s?", "ok": true}, {"label": "Why did oysters die?", "ok": false}, {"label": "Which decade was lowest?", "ok": true}, {"label": "How many crabs were caught?", "ok": false}], "h": "Only how much, and only oysters."}, {"t": "order", "q": "Put the chart steps in order.", "tiles": ["read the title", "read the trend", "connect it to the text"], "h": "Title, trend, text."}, {"t": "sort", "q": "Mistake Detective: read right?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "The chart counts Maryland only.", "bin": "0"}, {"label": "The chart counts the whole bay.", "bin": "1"}, {"label": "The chart cannot say why.", "bin": "0"}, {"label": "Virginia is not counted.", "bin": "0"}], "h": "Check the title."}], check:[{"q": "Chart: Seforim sold at the book fair. Mon 60 · Tue 42 · Wed 30 · Thu 34. What is the trend?", "o": ["a fall, then a small rise", "a steady fall", "a steady rise"], "h": "Compare first, middle and last."}, {"q": "Chart title: Bikes sold in Ohio. A writer uses it to prove bikes sold well in Texas. In this chart, Texas is...", "o": ["not counted", "counted", "the biggest number"], "h": "Read the title: where does it count?"}, {"q": "Article: \"After the new dam opened upstream in 2015, the river rose less each spring.\" Chart: highest spring river (feet). 2013: 14 · 2014: 15 · 2015: 13 · 2016: 9 · 2017: 8. Which sentence is right?", "o": ["The chart shows the river rose less after 2015; the article gives a reason.", "The chart proves that the new dam is what made the river rise less.", "The article shows that the river was highest in 2014."], "h": "Which one shows the numbers, and which one tells why?"}], re:[{"q": "First read the chart's...", "o": ["title", "last number", "color"], "h": "What does it measure?"}, {"q": "50, 35, 20 is...", "o": ["a steady fall", "a steady rise", "no change"], "h": "Bigger to smaller."}, {"q": "The chart shows how much; the text...", "o": ["explains why", "shows how much", "hides the facts"], "h": "Reasons are in the words."}]},
    'READ.COMP.L08.19':{name:"Long Story Coach", teach:[{"how": "Before a long story, preview it and ask a question you want answered. A question pulls you through the pages.", "q": "What do you do before a long story?", "o": ["ask a question to answer", "skip to the end", "count the pages"]}, {"how": "At the end of each page, stop and sum it up in one sentence. If you cannot, you missed something.", "q": "You finish a page. What is the best stop-and-check?", "o": ["sum it up in one sentence", "start the next page fast", "read only the last line"]}, {"how": "Keep a list of open questions: things the story has not told you yet. Cross each one off when it is answered.", "q": "What is an open question?", "o": ["something the story has not told yet", "a question with no answer ever", "a question about the author"]}, {"how": "When you get lost, do not push on. Reread the page, slowly.", "q": "You cannot say what happened on a page. What now?", "o": ["reread the page", "keep going faster", "guess and move on"]}], practice:[{"t": "sort", "q": "Good reading move or not?", "bins": [{"id": "0", "label": "Good move"}, {"id": "1", "label": "Not a good move"}], "items": [{"label": "sum up each page", "bin": "0"}, {"label": "skip a page that is slow", "bin": "1"}, {"label": "reread when lost", "bin": "0"}, {"label": "read only the dialogue", "bin": "1"}], "h": "Does it help you follow the whole story?"}, {"t": "pairs", "q": "Match each problem to its fix.", "pairs": [["lost on a page", "reread the page"], ["forgot what happened", "sum it up in one sentence"], ["something is not explained yet", "add an open question"]], "h": "What fixes each problem?"}, {"t": "order", "q": "Put the reading moves in order.", "tiles": ["ask a question to answer", "read a page", "sum it up in one sentence", "cross off answered questions"], "h": "Before, during, after each page."}, {"t": "spotall", "q": "Tap every open question a reader could have after page 1.", "cells": [{"label": "Why did Zeidy stop the clock?", "ok": true}, {"label": "What street is the shop on?", "ok": false}, {"label": "Will the clock come down?", "ok": true}, {"label": "What time do the hands show?", "ok": false}], "h": "Which ones has page 1 not answered yet?"}], check:[{"q": "Dovid read every page of chapter 6, where the boys leave the camp, but now he cannot say what happened there. What is his best next move?", "o": ["go back to the part where they leave and reread it", "mark it as an open question and read on", "read the summary on the back cover"], "h": "Lost? The book already told you. Go back, slowly."}, {"q": "\"The letter arrived, but Sara's mother hid it in a drawer.\" What should a careful reader add?", "o": ["an open question", "a summary of the book", "nothing at all"], "h": "Is something not told yet?"}, {"q": "After a page about a lost dog, Moshe says: \"The dog ran off, and Eli started searching.\" What did Moshe just do?", "o": ["sum it up in one sentence", "ask a question to answer", "reread the page"], "h": "He said the page in one line."}], re:[{"q": "Lost on a page? First...", "o": ["reread the page", "skip it", "guess"], "h": "Go back, slowly."}, {"q": "After each page...", "o": ["sum it up in one sentence", "count the pages", "close the book"], "h": "One sentence."}, {"q": "Something not explained yet is...", "o": ["an open question", "a mistake", "the theme"], "h": "Keep it on your list."}]},
    'READ.LIT.L08.10':{name:"How the Parts Fit", teach:[{"how": "A story's setting can shape its problem. Ask: could this problem happen anywhere else?", "q": "Lombard Street is changing, so the old shop's lease ends. What is this?", "o": ["the setting shapes the problem", "a choice changes the plot", "the plot changes the character"]}, {"how": "A character's choice can change where the plot goes. Ask: what if he had chosen the other way?", "q": "Shuey gives back the motor, so they must fix the real wheel. What is this?", "o": ["a choice changes the plot", "the setting shapes the problem", "a cliffhanger"]}, {"how": "And the plot can change the character. Ask: who is he at the start, and who at the end?", "q": "After the ruined tooth, Shuey learns to go slowly. What is this?", "o": ["the plot changes the character", "the setting shapes the problem", "a choice changes the plot"]}], practice:[{"t": "sort", "q": "Which link is it?", "bins": [{"id": "0", "label": "Setting shapes problem"}, {"id": "1", "label": "Choice changes plot"}, {"id": "2", "label": "Plot changes character"}], "items": [{"label": "A new tower means the lease ends.", "bin": "0"}, {"label": "Shuey rushes, and the tooth is ruined.", "bin": "1"}, {"label": "Shuey comes to wind slowly.", "bin": "2"}, {"label": "Shabbos stops all work for 25 hours.", "bin": "0"}], "h": "Place, choice, or change in a person?"}, {"t": "pairs", "q": "Match each link to an example.", "pairs": [["the setting shapes the problem", "an island with one bridge washed out"], ["a choice changes the plot", "he tells the truth, so the trip is cancelled"], ["the plot changes the character", "the shy boy speaks up at the end"]], "h": "Place, choice, change."}, {"t": "order", "q": "Put the chain in order.", "tiles": ["the street changes", "the lease ends", "Shuey must fix the clock", "Shuey learns patience"], "h": "Setting, problem, plot, character."}, {"t": "sort", "q": "Mistake Detective: read right?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "The setting can cause the problem.", "bin": "0"}, {"label": "Setting is just the backdrop.", "bin": "1"}, {"label": "A choice can change the plot.", "bin": "0"}], "h": "Does the place matter to what happens?"}], check:[{"q": "In a mountain town, the only road is closed by a rockslide the day of the wedding. What is this?", "o": ["the setting shapes the problem", "the plot changes the character", "a cliffhanger"], "h": "Could it happen without the mountain road?"}, {"q": "Yaakov decides to tell the coach he broke the window. The coach benches him for the final, and the team must play without its best pitcher. What is this?", "o": ["a choice changes the plot", "the plot changes the character", "the setting shapes the problem"], "h": "What if he had kept quiet?"}, {"q": "At the start Ari laughs at the new boy. After a week of helping him, Ari defends him. What is this?", "o": ["the plot changes the character", "a choice changes the plot", "the setting shapes the problem"], "h": "Who is Ari at the start, and at the end?"}], re:[{"q": "A place that causes the problem shows...", "o": ["the setting shapes the problem", "a cliffhanger", "the theme"], "h": "Ask: could it happen anywhere?"}, {"q": "\"What if he had chosen differently?\" tests...", "o": ["a choice changes the plot", "the setting", "the title"], "h": "Choices steer the plot."}, {"q": "Who he is at the end, compared with the start, shows...", "o": ["the plot changes the character", "the setting shapes the problem", "an open question"], "h": "Start and end."}]},
    'READ.LIT.L08.11':{name:"Keep Them Reading", teach:[{"how": "A ticking deadline makes every page count. The reader keeps checking: will there be time?", "q": "\"Eighteen days. Three teeth.\" What is this?", "o": ["a ticking deadline", "a question held back", "a cliffhanger ending"]}, {"how": "A question held back: the author raises a question early and answers it late, so you keep reading to find out.", "q": "Why Zeidy stopped the clock is asked on page 1 and answered on page 6. What is this?", "o": ["a question held back", "a ticking deadline", "a flashback"]}, {"how": "A cliffhanger ending stops a page at the worst moment, so you must turn the page.", "q": "\"And then it stopped.\" ends a page. What is this?", "o": ["a cliffhanger ending", "a ticking deadline", "a summary"]}], practice:[{"t": "sort", "q": "Which suspense tool is it?", "bins": [{"id": "0", "label": "Deadline"}, {"id": "1", "label": "Question held back"}, {"id": "2", "label": "Cliffhanger"}], "items": [{"label": "\"Six days, two teeth.\"", "bin": "0"}, {"label": "the locked drawer, opened a page later", "bin": "1"}, {"label": "\"He had ruined the wheel.\"", "bin": "2"}, {"label": "\"The crew would come at eight o'clock.\"", "bin": "0"}], "h": "Time running out, a secret, or a page that stops at the worst moment?"}, {"t": "pairs", "q": "Match each tool to what it makes you ask.", "pairs": [["a ticking deadline", "Will there be time?"], ["a question held back", "Why? What is the secret?"], ["a cliffhanger ending", "What happens next?"]], "h": "What question pulls you on?"}, {"t": "order", "q": "Order the deadline as it tightens.", "tiles": ["March 31", "Eighteen days", "six days left", "eight o'clock Sunday"], "h": "From far away to very close."}, {"t": "sort", "q": "Mistake Detective: read right?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "Suspense can come from a quiet wait.", "bin": "0"}, {"label": "Suspense needs danger or action.", "bin": "1"}, {"label": "Holding back an answer builds suspense.", "bin": "0"}], "h": "Shabbos is quiet, and it is tense."}], check:[{"q": "\"The bus leaves at noon. Reuven still had to find his tefillin, and it was 11:40.\" What is this?", "o": ["a ticking deadline", "a question held back", "a cliffhanger ending"], "h": "Is time running out?"}, {"q": "On page 1 a stranger leaves a sealed box at the door. The book never says what is inside until the last chapter. What is this?", "o": ["a question held back", "a ticking deadline", "a cliffhanger ending"], "h": "Is the answer saved for later?"}, {"q": "A chapter ends: \"Behind the locked cellar door, something heavy hit the floor.\" What is this?", "o": ["a cliffhanger ending", "a question held back", "a ticking deadline"], "h": "Does the page stop at the worst moment?"}], re:[{"q": "Time running out is...", "o": ["a ticking deadline", "a cliffhanger ending", "a theme"], "h": "Will there be time?"}, {"q": "An answer saved for later is...", "o": ["a question held back", "a ticking deadline", "a summary"], "h": "Why? Keep reading."}, {"q": "A page that stops at the worst moment is...", "o": ["a cliffhanger ending", "a question held back", "a setting"], "h": "What happens next?"}]},
    'READ.LIT.L08.12':{name:"What the Whole Story Says", teach:[{"how": "A theme is a lesson about life that the whole story shows. A topic is just a word, like clocks.", "q": "\"Clocks\" is...", "o": ["a topic", "a theme", "a proof"]}, {"how": "Say a theme as a full sentence about life: what is worth keeping takes patience.", "q": "\"What is worth keeping takes patience\" is...", "o": ["a theme", "a topic", "a summary"]}, {"how": "Prove it three times: once from the beginning, once from the middle, once from the end.", "q": "Where should your three proofs come from?", "o": ["the beginning, middle and end", "the last page only", "the title"]}], practice:[{"t": "sort", "q": "Topic or theme?", "bins": [{"id": "0", "label": "Topic"}, {"id": "1", "label": "Theme"}], "items": [{"label": "clocks", "bin": "0"}, {"label": "Patience fixes what speed breaks.", "bin": "1"}, {"label": "a grandfather", "bin": "0"}, {"label": "Some things are worth doing slowly.", "bin": "1"}], "h": "A word, or a sentence about life?"}, {"t": "pairs", "q": "Match each proof to its part of the story.", "pairs": [["forty minutes on a cheap watch", "the beginning"], ["\"Fast is usually the slowest way.\"", "the middle"], ["\"He never hurries.\"", "the end"]], "h": "Beginning, middle, end."}, {"t": "order", "q": "Put the theme steps in order.", "tiles": ["name the topic", "say the theme as a sentence", "find a proof from the beginning, middle and end"], "h": "Topic, theme, proofs."}, {"t": "sort", "q": "Mistake Detective: a good theme statement?", "bins": [{"id": "0", "label": "Good"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "What is worth keeping takes patience.", "bin": "0"}, {"label": "Patience.", "bin": "1"}, {"label": "Shuey fixes a clock.", "bin": "1"}], "h": "A sentence about life, not a word or a summary."}], check:[{"q": "A story's theme is \"Help given in time is worth more than help given later.\" What is its topic?", "o": ["helping others", "Help given in time is worth more than help given later.", "The boys fill sandbags before the storm."], "h": "A topic is a word or two. A theme is a sentence about life."}, {"q": "Chaim's theme: \"Owning up takes more strength than hiding.\" Which proofs are best?", "o": ["ch. 2: Eli hides the broken lamp; ch. 5: hiding it makes him miserable; ch. 9: he tells Abba and feels lighter", "three lines from ch. 9, where Eli tells Abba", "ch. 2, 5 and 9: each describes the lamp"], "h": "Are the proofs about the theme, and spread across the story?"}, {"q": "\"A true friend tells you the hard truth\" is...", "o": ["a theme", "a topic", "a summary"], "h": "Is it a full sentence about life?"}], re:[{"q": "One word, like courage, is...", "o": ["a topic", "a theme", "a proof"], "h": "A word is a topic."}, {"q": "A sentence about life the story shows is...", "o": ["a theme", "a topic", "a setting"], "h": "Say it as a sentence."}, {"q": "Three proofs come from...", "o": ["the beginning, middle and end", "one page", "the title"], "h": "Spread across the story."}]}

  BITE['READ.COMP.L08.10'] = {"band": "M68", "pic": "⚖️", "today": "See how an author sets his view apart from others", "why": "Good arguments show the other side, then explain why the author disagrees. Spot it, and you judge fairly.", "ready": [{"q": "Which sentence gives an opinion?", "o": ["Waiting was the wisest choice.", "The test began in 1954.", "Each child got three shots."], "a": "Waiting was the wisest choice."}], "bridge": "READ.COMP.L07.04", "bridgeName": "Claim Spotter", "watch": {"q": "Akiva's opinion piece in The Beacon", "m": {"type": "scene", "e": "📰", "t": "Some people at the time felt the same way. Parents wrote letters begging for the vaccine. But after reading more about what happened, I have come to the opposite view."}, "steps": [{"t": "Find the other view first. Signals: some people, critics say, many say. Here: some people wanted the vaccine sooner."}, {"t": "Find the turn. Signals: but, however, still. Here: \"But … I have come to the opposite view.\""}, {"t": "Find his own view, in his words: the waiting was the most responsible choice."}, {"t": "Find how he treats the other side. Signals: I understand why, granted, he has a point. Here: \"The people who wanted the vaccine sooner were not foolish.\""}, {"t": "Teach it back: tell your chavrusa the three signals: the other view, the turn to his view, and his reasons."}], "a": "Others: hurry. Akiva: test first, because love means testing carefully."}, "oops": {"q": "\"Some people at the time felt the same way.\" Whose view is this?", "wrong": "Akiva's own view", "right": "Other people's view, which Akiva will answer", "why": "\"Some people\" signals a view he is describing, not one he holds. Look for the turn word after it."}, "ways": ["worked example", "read the whole article", "signal words", "Mistake Detective", "find the proof", "listen", "teach it back"], "done": "You can see how an author sets his view apart, and judge it fairly!", "board": {"one": "Other view (some people say) → the turn (but, however) → his view → his reasons. A fair author respects the other view first.", "activity": "Boys get a short opinion paragraph cut into strips and sort them: other view, turn, his view, reasons.", "mistakes": ["Taking the other view for the author's view", "Missing the turn word", "Thinking a fair author agrees with everyone"]}, "do": [{"type": "read", "text": "C68.POL.05", "say": "Read Akiva's opinion piece to the end.", "how": "Watch for the other view, the turn and his view."}, {"type": "sort", "mis": true, "bins": ["Others' view", "Akiva's view"], "cards": [["The waiting felt cruel.", 0], ["The waiting was responsible.", 1], ["Skip the tests: children are sick.", 0], ["Love means testing carefully.", 1]], "say": "Watch the trap! Whose view is each one?", "how": "Signal words tell you: some people, or I believe."}], "your": [{"type": "proof", "text": "C68.POL.05", "q": "Where does Akiva turn again, right after his kind words about the other side?", "proof": "love for children is exactly the reason", "look": "a second turn, after the kind words", "say": "Find the second turn in the text.", "how": "Read the paragraph that starts: I want to be fair."}, {"type": "match", "pairs": [["Some people say...", "the other view"], ["But I believe...", "the turn to his view"], ["I want to be fair to the other side.", "he respects the other view"], ["Here is my first reason.", "he supports his view"]], "say": "Match each signal to its job.", "how": "Ask what each phrase does in the argument."}, {"type": "evidence", "q": "Which sentence shows Akiva respects the other view?", "p": ["The waiting was the most responsible choice.", "Their impatience came from love.", "A mistake in one factory hurt hundreds."], "a": 1, "look": "kind words about the other side", "say": "Tap the sentence that is fair to the other side.", "how": "Which one speaks well of the people he disagrees with?"}, {"type": "order", "steps": ["Others wanted the vaccine sooner.", "Akiva turns to the opposite view.", "He gives three reasons.", "He says the other side was not foolish.", "He ends with what to remember."], "say": "Put the parts of Akiva's piece in order.", "how": "Follow the article from start to end."}, {"type": "listen", "hear": "My brother thinks the trip should be in winter. He has a point: summer is crowded. Even so, summer is when everyone is free.", "o": ["summer is better", "winter is better", "he has no view"], "a": "summer is better", "cap": "What is the speaker's own view?", "say": "Listen. What is the speaker's own view?", "how": "Find the turn word. His view comes after it."}]};
  BITE['READ.LIT.L08.09'] = {"band": "M68", "pic": "📜", "today": "Compare a story and a history of the same events", "why": "Fiction makes history feel real. History checks the facts. Together they show the whole picture.", "ready": [{"q": "Which is a fact a history book could prove?", "o": ["The vaccine was announced in April 1955.", "Dovi was scared in line.", "Mama felt brave."], "a": "The vaccine was announced in April 1955."}], "bridge": "READ.LIT.L08.02", "bridgeName": "Whose View", "watch": {"q": "Two texts, one spring", "m": {"type": "scene", "e": "📻", "t": "Story: \"A button that says Polio Pioneer. It means you are helping.\" History: \"Each child got a lollipop and a little button that read Polio Pioneer.\""}, "steps": [{"t": "First, remember Dovi's story: a note home, Mama signs at night, three shots, a button, and good news the next year."}, {"t": "Find what both texts share: the button, the lollipop, three shots, and the shot of nothing."}, {"t": "Find what only the history gives: numbers, dates, Dr. Francis, and how the test was designed."}, {"t": "Find what only the story gives: what people felt and did each day. A frightened boy, a mother's choice at night."}, {"t": "Check the story against the history: did the author keep each fact, or make one different?"}, {"t": "Ask why the author used fiction: so you live through that spring inside one family."}, {"t": "Try one: a story says each child got one shot. The history says three. Changed!"}, {"t": "Teach it back: tell your chavrusa the three questions: what both share, what each adds, kept or changed."}], "a": "The history gives the facts; the story gives the feelings. Here, the story kept the facts."}, "oops": {"q": "\"In the story, Mama does not know if Dovi got the real vaccine.\" A mistake by the author?", "wrong": "Yes: his mother would know", "right": "No: it matches the history", "why": "In the real test, nobody knew who got which shot. The author kept that fact."}, "ways": ["worked example", "read the history", "two-column compare", "Mistake Detective", "find the proof", "teach it back"], "done": "You can compare a story and a history, and check what the author kept or changed!", "board": {"one": "Story and history: what both share, what only the history gives (numbers, dates, real people), what only the story gives (feelings and daily life), and what the author kept or changed.", "activity": "Two columns on the board: boys call out details from each text and decide where each one goes, then circle what the author changed.", "mistakes": ["Trusting a story's date without checking", "Missing it when he changed the date or a number", "Thinking a story cannot teach anything true"]}, "do": [{"type": "read", "text": "C68.POL.04", "say": "Read the history of the Polio Pioneers.", "how": "Dovi's story was fiction. Now read the history of the same spring."}, {"type": "sort", "mis": true, "bins": ["Both texts", "Only the history", "Only the story"], "cards": [["a Polio Pioneer button", 0], ["almost two million children", 1], ["Dovi wants to be a rebbe", 2], ["Dr. Francis designed it", 1], ["half got a shot of nothing", 0], ["a mother signs at night", 2]], "say": "Watch the trap! Which text tells each detail?", "how": "Look for it in the history. Then in the story."}], "your": [{"type": "evidence", "mis": true, "q": "Which detail did the story's author invent?", "p": ["Children got three shots.", "A doctor asked Dovi what he wanted to be.", "In many areas, half the children got a shot of nothing.", "The results came the next April."], "a": 1, "look": "something the history does not report", "say": "Detective! Which detail did the author make up?", "how": "Check each detail against the history."}, {"type": "sort", "bins": ["Kept", "Changed"], "cards": [["the results came in April", 0], ["a lollipop and a button", 0], ["the first shots were in the fall", 1], ["ten shots each", 1]], "say": "A new story about the same spring. Kept, or changed?", "how": "Check each detail against the history you read."}, {"type": "proof", "text": "C68.POL.04", "q": "Which sentence explains why Mama could not know which shot Dovi got?", "proof": "Neither the children, nor their parents, nor the doctors giving the shots knew who got which", "look": "who knew which shot each child got", "say": "Find the proof in the history.", "how": "Go to the part about the placebo and the code numbers."}, {"type": "match", "pairs": [["a story", "what it felt like, day to day"], ["a history", "dates, numbers, how the test worked"], ["both", "the same real events"]], "say": "Match each text to what it gives best.", "how": "What can only a story give? Only a history?"}, {"type": "cloze", "t": "To check whether a story got its dates right, a reader should use the ___.", "o": ["history", "story", "story's last page"], "a": "history", "say": "Which text do you check against?", "how": "Which text gives real dates and numbers?"}]};
  BITE['READ.COMP.L08.11'] = {"band": "M68", "pic": "🎧", "today": "Compare reading a text and hearing it read", "why": "A speech heard aloud and the same speech on paper hit you differently. Know what each one does.", "ready": [{"q": "Which can you do only with a printed page?", "o": ["look at a chart", "hear the pauses", "hear the tone"], "a": "look at a chart"}], "bridge": "READ.COMP.L07.03", "bridgeName": "Author's Build", "watch": {"q": "The iron lung, read and heard", "m": {"type": "scene", "e": "🔊", "t": "In the Reader, tap 🔊 on any page: the voice reads it aloud and lights each word as it goes."}, "steps": [{"t": "Read the page yourself first. Your eyes can stop, look back at a line, and find the numbers and names."}, {"t": "Now close your eyes and hear it. The voice keeps moving. You cannot look back; names and numbers slip by."}, {"t": "Hearing helps too. Hard words are said for you (diaphragm, respirator). Eyes open, the lit words keep your place."}, {"t": "A live speaker adds even more: stress and pauses. \"I didn't say HE took it\" is not \"I didn't say he TOOK it.\""}, {"t": "Teach it back: three questions. What must I check exactly? What slips by if heard once? What does a voice add or change?"}], "a": "Print: look back and check facts. Hearing: hard words said for you; a live voice adds stress."}, "oops": {"q": "\"Hearing it read is the same text, so it changes nothing.\"", "wrong": "True: same words, same meaning", "right": "False: each way gives and loses something", "why": "Heard, you cannot look back, but hard words are said for you. A live voice can even change the meaning."}, "ways": ["worked example", "read, then listen", "Mistake Detective", "listen", "evidence tap", "teach it back"], "done": "You can say what reading and hearing a text each do best!", "board": {"one": "Print: look it up in a written copy, look back at a line as often as you need, see charts and headings. Hearing: hard words said for you, your place kept; a live speaker adds how the voice rises, slows and pauses. Heard once? Check the exact numbers in print.", "activity": "The teacher reads a short speech aloud once; boys write the year it names, then check against the printed copy.", "mistakes": ["Thinking hearing and reading do the same job", "Trusting memory of a number heard once", "Missing how stress changes a speaker's meaning"]}, "do": [{"type": "read", "text": "C68.POL.02", "say": "Read it, then tap 🔊 to hear a page.", "how": "Read the page first. Then tap 🔊 and listen with eyes closed."}, {"type": "sort", "bins": ["Print does it best", "Hearing does it best"], "cards": [["looking back at a line", 0], ["hearing a hard word", 1], ["checking a number", 0], ["resting your eyes", 1], ["seeing a chart", 0], ["a speaker's stress", 1]], "say": "Which version does each job best?", "how": "Can your eyes go back? Or does it need a voice?"}], "your": [{"type": "cloze", "t": "\"I didn't say HE took it.\" The stress on HE means ___.", "o": ["someone else took it", "he borrowed it", "I never spoke"], "a": "someone else took it", "say": "What does the stress change?", "how": "Stress shows which word matters. Who is being pointed at?"}, {"type": "evidence", "q": "A speaker reads the iron lung article aloud. Which line gains most from a slow, soft voice?", "p": ["The iron lung was a long metal tank, about the size of a small car.", "Families learned to be close to a person they could not hug.", "Emerson's version soon filled hospitals across the country."], "a": 1, "look": "a line about feelings, not facts", "say": "Which line does a gentle voice make stronger?", "how": "A plain fact sounds about the same in any voice. A line about feelings gets stronger with a gentle one."}, {"type": "proof", "mis": true, "text": "C68.POL.02", "q": "Moshe heard the article once. He says the first iron lung was built in 1931. Tap the sentence that proves him wrong.", "proof": "Philip Drinker and Louis Agassiz Shaw", "look": "the year the very first iron lung was built", "say": "Moshe trusted his ears. Prove his year wrong.", "how": "Heard once, two years can blur. Find the first machine, not a later one."}, {"type": "listen", "hear": "Diaphragm.", "o": ["DIE-uh-fram", "dee-AH-frum", "DIE-uh-fram-ig"], "a": "DIE-uh-fram", "cap": "Which spelling-out matches what you heard?", "say": "Listen. How is this hard word said?", "how": "Hearing a hard word saves you from guessing it."}, {"type": "cloze", "t": "A speaker reads: \"a way to survive polio, not a way to stop it.\" To show the contrast, he stresses ___.", "o": ["survive and stop", "polio and it", "way and way"], "a": "survive and stop", "say": "Which words carry the meaning?", "how": "Find the two words being set against each other."}]};
  BITE['READ.COMP.L08.12'] = {"band": "M68", "pic": "🗺️", "today": "Map an argument, including the other side", "why": "Before you can judge an argument, you have to see how it is built. A map shows it at a glance.", "ready": [{"q": "Which sentence is an opinion someone could argue about?", "o": ["Codes should be kept secret.", "Enigma had rotors.", "The war ended in 1945."], "a": "Codes should be kept secret."}], "bridge": "READ.COMP.L08.10", "bridgeName": "Set His View Apart", "watch": {"q": "Eli's letter on the debate page", "m": {"type": "scene", "e": "📰", "t": "I believe a government should keep its code-breaking secrets while they still protect people, and then it should tell the full story."}, "steps": [{"t": "Find the claim: the one thing the writer wants you to believe. Eli: keep secrets while they protect people, then tell."}, {"t": "Find each reason. Signals: my first reason, also, because. Eli has three: some secrets keep working; long secrets hurt the people who earned credit; the public learns from the truth."}, {"t": "Under each reason, find its evidence: a fact or example you could check. Reason 2: the Bletchley Park code breakers stayed silent about thirty years."}, {"t": "Find the counterclaim and his answer: \"any secret might help a future enemy\", but a replaced code cannot help anyone."}, {"t": "Teach it back: tell your chavrusa the map: claim on top, reasons under it, evidence under each reason."}], "a": "Claim → three reasons → evidence under each → the counterclaim answered."}, "oops": {"q": "\"The Bletchley Park code breakers stayed silent for about thirty years.\" Eli's claim?", "wrong": "Yes: it is the main point", "right": "No: it is evidence for a reason", "why": "It is a fact you could check. It backs up why long secrets hurt people. The claim is what he wants you to believe."}, "ways": ["worked example", "argument map", "read the whole debate page", "Mistake Detective", "find the proof", "teach it back"], "done": "You can map an argument: claim, reasons, evidence and the counterclaim!", "board": {"one": "Claim (what to believe) → reasons (why) → evidence under each (how do you know) → counterclaim and answer.", "activity": "Boys build a paper argument map of Eli's letter on the board, one strip per reason and fact.", "mistakes": ["Calling a fact the claim", "Mixing up a reason and its evidence", "Missing the counterclaim"]}, "do": [{"type": "read", "text": "C68.CODE.05", "say": "Read the debate page. Watch how each letter is built.", "how": "For each letter, ask: what does he want me to believe, and why?"}, {"type": "storymap", "slots": ["Claim", "Reason", "Evidence for it", "Counterclaim", "His answer"], "cards": ["keep secrets while they protect, then tell", "long secrets hurt the people who earned credit", "the code breakers stayed silent about thirty years", "any secret might help a future enemy", "a replaced code cannot help anyone"], "extra": ["codes have rotors"], "say": "Build the map of Eli's argument.", "how": "Claim on top, then a reason, its evidence, the other side, his answer."}], "your": [{"type": "match", "pairs": [["claim", "What should I believe?"], ["his reply", "How does he answer the other side?"], ["evidence", "How do you know?"], ["counterclaim", "What does the other side say?"]], "say": "Match each part to the question it answers.", "how": "Each part of an argument answers one question."}, {"type": "sort", "mis": true, "bins": ["Claim", "Evidence"], "cards": [["Secrets should be told once they stop protecting.", 0], ["Some waited more than fifty years for a medal.", 1], ["Enigma stayed secret until the 1970s.", 1], ["It is a fact that old secrets should be told.", 0]], "say": "Mistake Detective! Claim, or evidence? Watch the trap.", "how": "Could you check it as a fact? Then it is evidence."}, {"type": "proof", "text": "C68.CODE.05", "q": "Which sentence tells what had to change once the Enigma secret came out?", "proof": "whole chapters of history books had to be rewritten", "look": "a fact about history books", "say": "Find the evidence in the text.", "how": "Find the third reason first. Then find the fact under it."}, {"type": "cloze", "t": "Mordechai's claim is that a government should tell ___.", "o": ["everything the day a war ends", "nothing, ever", "only good news"], "a": "everything the day a war ends", "say": "What does Mordechai want you to believe?", "how": "Read the title of his letter and his last paragraph."}, {"type": "order", "steps": ["claim", "first reason", "evidence for the first reason", "second reason", "evidence for the second reason"], "say": "Put Eli's argument map in order, top to bottom.", "how": "Claim first. Each reason is followed right away by its own evidence."}]};
  BITE['READ.COMP.L08.13'] = {"band": "M68", "pic": "🧠", "today": "Judge whether an argument's reasoning is sound", "why": "An argument can sound strong and still be broken inside. A careful reader finds the crack.", "ready": [{"q": "In \"We should save water because rivers are drying up,\" what is the reason?", "o": ["rivers are drying up", "we should save water", "because"], "a": "rivers are drying up"}], "bridge": "READ.COMP.L08.12", "bridgeName": "Map the Argument", "watch": {"q": "Mordechai's letter", "m": {"type": "scene", "e": "🔍", "t": "Just look at what happened with Enigma. The British hid it for thirty years. That proves that every government will hide everything it can for as long as it can."}, "steps": [{"t": "Ask of each reason: does it really lead to the claim? Mordechai uses one example, Enigma, to prove \"every government\" and \"everything\". Too few examples."}, {"t": "Ask: is the reason true? \"Nobody uses codes anymore\" is false. Computers use codes all the time. A false reason cannot hold up a claim."}, {"t": "Ask: is it a reason at all? \"Anyone who disagrees just does not care about the heroes\" attacks the people, not their idea."}, {"t": "Now compare Eli: \"a code that has already been replaced cannot help anyone.\" True, and it leads to his claim. Sound."}, {"t": "Teach it back: tell your chavrusa the three tests: enough examples? a true reason? a reason, not an attack?"}], "a": "Mordechai: one example, a false reason, an attack. Eli: a true reason that leads to his claim."}, "oops": {"q": "\"Mordechai writes with strong, certain words, so his reasoning must be strong.\"", "wrong": "True: he sounds sure", "right": "False: sounding sure is not sound reasoning", "why": "Test the reasons, not the tone. His reasons fail the three tests."}, "ways": ["worked example", "three tests", "compare two letters", "Mistake Detective", "find the proof", "teach it back"], "done": "You can test an argument's reasoning and find where it breaks!", "board": {   BITE['READ.COMP.L08.14'] = {"band": "M68", "pic": "⚖️", "today": "Judge whether the evidence is relevant and enough", "why": "A true fact can still prove nothing. Ask whether evidence fits the reason, and whether there is enough of it.", "ready": [{"q": "\"Boys need a skate park. Three boys were hurt in the street.\" What is the evidence?", "o": ["Three boys were hurt in the street.", "Boys need a skate park.", "a skate park"], "a": "Three boys were hurt in the street."}], "bridge": "READ.COMP.L08.12", "bridgeName": "Map the Argument", "watch": {"q": "Two letters, two kinds of evidence", "m": {"type": "scene", "e": "🔎", "t": "Eli: \"Some of them waited more than fifty years for a medal.\" Mordechai: \"Millions of dollars go to people who sit in locked rooms.\""}, "steps": [{"t": "Name the reason first. Eli's: long secrets hurt the people who earned credit."}, {"t": "Test 1, relevant: is the evidence about that reason? Waiting fifty years for a medal is exactly about being forgotten. Relevant."}, {"t": "Mordechai's millions of dollars may be true, but the question is when to tell secrets, not what they cost. Not relevant."}, {"t": "Test 2, enough: does the claim have enough? Eli says long secrets can hurt people and gives two cases, Bletchley Park and the code talkers. Mordechai says nobody uses codes and gives no evidence at all. Not enough."}, {"t": "Teach it back: tell your chavrusa the two tests: is it about the reason? Is there enough for the claim?"}], "a": "Eli: relevant, and two cases. Mordechai: off topic, and no evidence that nobody uses codes."}, "oops": {"q": "\"Millions of dollars go to code-breaking offices. It's a true fact, so it's good evidence.\"", "wrong": "Yes: true facts are good evidence", "right": "No: it is true but not relevant", "why": "The question is when to tell secrets. A fact about cost does not answer it."}, "ways": ["worked example", "two tests", "compare two letters", "Mistake Detective", "find the proof", "teach it back"], "done": "You can judge whether evidence is relevant and enough!", "board": {"one": "Two tests: relevant (is it about this reason?) and enough (does a big claim have more than one case?). True is not the same as relevant.", "activity": "Boys get a claim and a pile of fact cards, and keep only the cards that pass both tests.", "mistakes": ["Thinking any true fact is good evidence", "Accepting one example for a big claim", "Not naming the reason before testing the evidence"]}, "do": [{"type": "sort", "mis": true, "bins": ["Relevant", "Not relevant"], "cards": [["Some waited 50 years for a medal.", 0], ["Code offices cost millions.", 1], ["History books had to be rewritten.", 0], ["Bletchley Park was a country estate.", 1]], "say": "Mistake Detective! Relevant to when secrets should be told?", "how": "True is not enough. Is it about when to tell?"}, {"type": "proof", "text": "C68.CODE.05", "q": "Which sentence may be true but is not about when secrets should be told?", "proof": "Millions of dollars go to people who sit in locked rooms", "look": "a fact about money", "say": "Find the off-topic evidence.", "how": "Read Mordechai's letter. Which fact is about cost?"}], "your": [{"type": "tiles", "w": ["Good evidence", "is about the reason", "and is enough", "for the claim."], "extra": ["sounds loud"], "say": "Build the rule for good evidence.", "how": "Two tests: about the reason, and enough."}, {"type": "evidence", "q": "Claim: \"The code talkers saved lives.\" Which evidence is strongest?", "p": ["Navajo has many tones.", "Six code talkers sent and received over 800 messages at Iwo Jima without a mistake.", "The code talkers were young."], "a": 1, "look": "a fact that shows saved lives", "say": "Tap the strongest evidence.", "how": "Which fact is about the battle being won?"}, {"type": "match", "pairs": [["true but off topic", "not relevant"], ["one case for \"every\"", "not enough"], ["several matching facts", "relevant and enough"]], "say": "Match each problem to its verdict.   BITE['READ.COMP.L08.15'] = {"band": "M68", "pic": "🎭", "today": "Spot loaded words and one-sided facts", "why": "Some writers push your feelings instead of proving their point. Spot the trick, and you decide for yourself.", "ready": [{"q": "Which word shows a strong feeling?", "o": ["disgusting", "large", "Tuesday"], "a": "disgusting"}], "bridge": "READ.COMP.L08.13", "bridgeName": "Is It Sound?", "watch": {"q": "Mordechai's first paragraph", "m": {"type": "scene", "e": "🎭", "t": "Every government that hides its code-breaking is simply covering up its own sneaky tricks. These shameful secrets are kept for one reason only."}, "steps": [{"t": "Find the loaded words: words that push a feeling without proving anything. Here: sneaky, shameful."}, {"t": "Swap in plain words: sneaky tricks becomes secret methods; shameful secrets becomes private secrets. Does the point still stand? It is much weaker."}, {"t": "Now look for one-sided facts. He says millions go to people in locked rooms. Maybe true. But he leaves out what their work gave back: Ultra may have shortened the war by years."}, {"t": "Compare Eli: he names the reason for the secret (\"a fair worry at the time\") before he argues against it. Balanced."}, {"t": "Teach it back: tell your chavrusa the two tricks and the three checks: find, swap, ask what was left out."}], "a": "Loaded words push; one-sided facts hide part of the story. Swap and ask."}, "oops": {"q": "\"Mordechai's letter is full of strong feeling, so he must be right.\"", "wrong": "True: he feels strongly", "right": "False: feelings are not proof", "why": "Loaded words push feelings. Swap them for plain words and see what is really proved."}, "ways": ["worked example", "swap the word", "compare two letters", "Mistake Detective", "find the proof", "teach it back"], "done": "You can spot loaded words and one-sided facts, and decide for yourself!", "board": {"one": "Two tricks: loaded words (push a feeling) and one-sided facts (leave out the rest). Chec   BITE['READ.COMP.L08.16'] = {"band": "M68", "pic": "🤝", "today": "Find where two texts agree and where they disagree", "why": "Two people who argue often share more than you think. Finding both the agreement and the real disagreement is fair, sharp reading.", "ready": [{"q": "Yossi and Moshe both want pizza, but Yossi wants it now and Moshe later. Where do they disagree?", "o": ["when to eat", "what to eat", "whether to eat"], "a": "when to eat"}], "bridge": "READ.COMP.L08.01", "bridgeName": "Side by Side", "watch": {"q": "The scientist and the waterman", "m": {"type": "scene", "e": "🤝", "t": "Dr. Levinson: \"Within a few years, scientists counted many more crabs...\" Wade Thomas: \"The bigger danger is pollution from farms and cities.\""}, "steps": [{"t": "First, list where they agree. Both say oysters filter the water. Both say the bay is less clean than in 1900."}, {"t": "Next, the real disagreement. Dr. Levinson says the main problem is harvesting. Wade Thomas says it is pollution."}, {"t": "So they disagree on the fix too: strict limits, or clean the water first."}, {"t": "Now the hardest part: the same fact read two ways. Both know crabs came back after 2008. Dr. Levinson says limits worked. Wade Thomas says crab numbers keep going up and down anyway."}, {"t": "Teach it back: tell your chavrusa the three lists: where they agree, where they disagree, and which fact each reads differently."}], "a": "They agree on the facts about oysters and the bay; they disagree on the cause, the fix, and what the crab rebound means."}, "oops": {"q": "\"The scientist and the waterman argue, so they agree on nothing.\"", "wrong": "True: they are on opposite sides", "right": "False: they share several facts", "why": "The editor points it out: both say oysters filter water and the bay is dirtier than in 1900."}, "ways": ["worked example", "agree or disagree sort", "find the proof", "Mistake Detective", "listen", "teach it back"], "done": "You can find where two texts agree and di   BITE['READ.COMP.L08.17'] = {"band": "M68", "pic": "🧩", "today": "Put several texts together to answer one question", "why": "Real questions are bigger than one article. Pulling pieces from several texts gives you the whole answer, and a reason to trust it.", "ready": [{"q": "One friend saw the start of the game, another saw the end. How do you learn the whole game?", "o": ["ask both friends", "ask one friend", "guess the end"], "a": "ask both friends"}], "bridge": "READ.COMP.L08.16", "bridgeName": "Agree or Disagree?", "watch": {"q": "A family in Pennsylvania and a waterman's catch", "m": {"type": "scene", "e": "🧩", "t": "Question: How can a family in Pennsylvania affect a waterman's catch?"}, "steps": [{"t": "Ask: name the question clearly. How can a family in Pennsylvania affect a waterman's catch?"}, {"t": "Gather, text 1: the estuary article says Pennsylvania is in the watershed. Its water runs to the bay."}, {"t": "Gather, texts 2 and 3: the oyster article says too many nutrients feed algae; when the algae rot, they use up oxygen. View B adds dead zones, where crabs and oysters cannot thrive."}, {"t": "Group and answer: water from Pennsylvania carries nutrients to the bay; they cause dead zones; fewer crabs and oysters live there; the catch is smaller. Name each source."}, {"t": "Teach it back: tell your chavrusa the four steps: ask, gather, group, answer with sources."}], "a": "Three texts together: watershed, nutrients and dead zones, smaller catches."}, "oops": {"q": "\"The estuary article mentions Pennsylvania, so it answers the whole question.\"", "wrong": "True: one text is enough", "right": "False: it gives only one piece", "why": "The estuary article never mentions crab catches. You need the oyster article and View B for the rest."}, "ways": ["worked example", "gather from three texts", "find the proof", "Mistake Detective", "build the answer", "teach it back"], "done": "You can put several texts together to answer one question!", "board": {"one": "As
