  BITE['READ.COMP.L08.10'] = {"band": "M68", "pic": "⚖️", "today": "See how an author sets his view apart from others", "why": "Good arguments show the other side, then explain why the author disagrees. Spot it, and you judge fairly.", "ready": [{"q": "Which sentence gives an opinion?", "o": ["Waiting was the wisest choice.", "The test began in 1954.", "Each child got three shots."], "a": "Waiting was the wisest choice."}], "bridge": "READ.COMP.L07.04", "bridgeName": "Claim Spotter", "watch": {"q": "Akiva's opinion piece in The Beacon", "m": {"type": "scene", "e": "📰", "t": "Some people at the time felt the same way. Parents wrote letters begging for the vaccine. But after reading more about what happened, I have come to the opposite view."}, "steps": [{"t": "Find the other view first. Signals: some people, critics say, many say. Here: some people wanted the vaccine sooner."}, {"t": "Find the turn. Signals: but, however, still. Here: \"But … I have come to the opposite view.\""}, {"t": "Find his own view, in his words: the waiting was the most responsible choice."}, {"t": "Find how he treats the other side. Signals: I understand why, granted, he has a point. Here: \"The people who wanted the vaccine sooner were not foolish.\""}, {"t": "Teach it back: tell your chavrusa the three signals: the other view, the turn to his view, and his reasons."}], "a": "Others: hurry. Akiva: test first, because love means testing carefully."}, "oops": {"q": "\"Some people at the time felt the same way.\" Whose view is this?", "wrong": "Akiva's own view", "right": "Other people's view, which Akiva will answer", "why": "\"Some people\" signals a view he is describing, not one he holds. Look for the turn word after it."}, "ways": ["worked example", "read the whole article", "signal words", "Mistake Detective", "find the proof", "listen", "teach it back"], "done": "You can see how an author sets his view apart, and judge it fairly!", "board": {"one": "Other view (some people say) → the turn (but, however) → his view → his reasons. A fair author respects the other view first.", "activity": "Boys get a short opinion paragraph cut into strips and sort them: other view, turn, his view, reasons.", "mistakes": ["Taking the other view for the author's view", "Missing the turn word", "Thinking a fair author agrees with everyone"]}, "do": [{"type": "read", "text": "C68.POL.05", "say": "Read Akiva's opinion piece to the end.", "how": "Watch for the other view, the turn and his view."}, {"type": "sort", "mis": true, "bins": ["Others' view", "Akiva's view"], "cards": [["The waiting felt cruel.", 0], ["The waiting was responsible.", 1], ["Skip the tests: children are sick.", 0], ["Love means testing carefully.", 1]], "say": "Watch the trap! Whose view is each one?", "how": "Signal words tell you: some people, or I believe."}], "your": [{"type": "proof", "text": "C68.POL.05", "q": "Where does Akiva turn again, right after his kind words about the other side?", "proof": "love for children is exactly the reason", "look": "a second turn, after the kind words", "say": "Find the second turn in the text.", "how": "Read the paragraph that starts: I want to be fair."}, {"type": "match", "pairs": [["Some people say...", "the other view"], ["But I believe...", "the turn to his view"], ["I want to be fair to the other side.", "he respects the other view"], ["Here is my first reason.", "he supports his view"]], "say": "Match each signal to its job.", "how": "Ask what each phrase does in the argument."}, {"type": "evidence", "q": "Which sentence shows Akiva respects the other view?", "p": ["The waiting was the most responsible choice.", "Their impatience came from love.", "A mistake in one factory hurt hundreds."], "a": 1, "look": "kind words about the other side", "say": "Tap the sentence that is fair to the other side.", "how": "Which one speaks well of the people he disagrees with?"}, {"type": "order", "steps": ["Others wanted the vaccine sooner.", "Akiva turns to the opposite view.", "He gives three reasons.", "He says the other side was not foolish.", "He ends with what to remember."], "say": "Put the parts of Akiva's piece in order.", "how": "Follow the article from start to end."}, {"type": "listen", "hear": "My brother thinks the trip should be in winter. He has a point: summer is crowded. Even so, summer is when everyone is free.", "o": ["summer is better", "winter is better", "he has no view"], "a": "summer is better", "cap": "What is the speaker's own view?", "say": "Listen. What is the speaker's own view?", "how": "Find the turn word. His view comes after it."}]};
  BITE['READ.LIT.L08.09'] = {"band": "M68", "pic": "📜", "today": "Compare a story and a history of the same events", "why": "Fiction makes history feel real. History checks the facts. Together they show the whole picture.", "ready": [{"q": "Which is a fact a history book could prove?", "o": ["The vaccine was announced in April 1955.", "Dovi was scared in line.", "Mama felt brave."], "a": "The vaccine was announced in April 1955."}], "bridge": "READ.LIT.L08.02", "bridgeName": "Whose View", "watch": {"q": "Two texts, one spring", "m": {"type": "scene", "e": "📻", "t": "Story: \"A button that says Polio Pioneer. It means you are helping.\" History: \"Each child got a lollipop and a little button that read Polio Pioneer.\""}, "steps": [{"t": "First, remember Dovi's story: a note home, Mama signs at night, three shots, a button, and good news the next year."}, {"t": "Find what both texts share: the button, the lollipop, three shots, and the shot of nothing."}, {"t": "Find what only the history gives: numbers, dates, Dr. Francis, and how the test was designed."}, {"t": "Find what only the story gives: what people felt and did each day. A frightened boy, a mother's choice at night."}, {"t": "Check the story against the history: did the author keep each fact, or make one different?"}, {"t": "Ask why the author used fiction: so you live through that spring inside one family."}, {"t": "Try one: a story says each child got one shot. The history says three. Changed!"}, {"t": "Teach it back: tell your chavrusa the three questions: what both share, what each adds, kept or changed."}], "a": "The history gives the facts; the story gives the feelings. Here, the story kept the facts."}, "oops": {"q": "\"In the story, Mama does not know if Dovi got the real vaccine.\" A mistake by the author?", "wrong": "Yes: his mother would know", "right": "No: it matches the history", "why": "In the real test, nobody knew who got which shot. The author kept that fact."}, "ways": ["worked example", "read the history", "two-column compare", "Mistake Detective", "find the proof", "teach it back"], "done": "You can compare a story and a history, and check what the author kept or changed!", "board": {"one": "Story and history: what both share, what only the history gives (numbers, dates, real people), what only the story gives (feelings and daily life), and what the author kept or changed.", "activity": "Two columns on the board: boys call out details from each text and decide where each one goes, then circle what the author changed.", "mistakes": ["Trusting a story's date without checking", "Missing it when he changed the date or a number", "Thinking a story cannot teach anything true"]}, "do": [{"type": "read", "text": "C68.POL.04", "say": "Read the history of the Polio Pioneers.", "how": "Dovi's story was fiction. Now read the history of the same spring."}, {"type": "sort", "mis": true, "bins": ["Both texts", "Only the history", "Only the story"], "cards": [["a Polio Pioneer button", 0], ["almost two million children", 1], ["Dovi wants to be a rebbe", 2], ["Dr. Francis designed it", 1], ["half got a shot of nothing", 0], ["a mother signs at night", 2]], "say": "Watch the trap! Which text tells each detail?", "how": "Look for it in the history. Then in the story."}], "your": [{"type": "evidence", "mis": true, "q": "Which detail did the story's author invent?", "p": ["Children got three shots.", "A doctor asked Dovi what he wanted to be.", "In many areas, half the children got a shot of nothing.", "The results came the next April."], "a": 1, "look": "something the history does not report", "say": "Detective! Which detail did the author make up?", "how": "Check each detail against the history."}, {"type": "sort", "bins": ["Kept", "Changed"], "cards": [["the results came in April", 0], ["a lollipop and a button", 0], ["the first shots were in the fall", 1], ["ten shots each", 1]], "say": "A new story about the same spring. Kept, or changed?", "how": "Check each detail against the history you read."}, {"type": "proof", "text": "C68.POL.04", "q": "Which sentence explains why Mama could not know which shot Dovi got?", "proof": "Neither the children, nor their parents, nor the doctors giving the shots knew who got which", "look": "who knew which shot each child got", "say": "Find the proof in the history.", "how": "Go to the part about the placebo and the code numbers."}, {"type": "match", "pairs": [["a story", "what it felt like, day to day"], ["a history", "dates, numbers, how the test worked"], ["both", "the same real events"]], "say": "Match each text to what it gives best.", "how": "What can only a story give? Only a history?"}, {"type": "cloze", "t": "To check whether a story got its dates right, a reader should use the ___.", "o": ["history", "story", "story's last page"], "a": "history", "say": "Which text do you check against?", "how": "Which text gives real dates and numbers?"}]};
  BITE['READ.COMP.L08.11'] = {"band": "M68", "pic": "🎧", "today": "Compare reading a text and hearing it read", "why": "A speech heard aloud and the same speech on paper hit you differently. Know what each one does.", "ready": [{"q": "Which can you do only with a printed page?", "o": ["look at a chart", "hear the pauses", "hear the tone"], "a": "look at a chart"}], "bridge": "READ.COMP.L07.03", "bridgeName": "Author's Build", "watch": {"q": "The iron lung, read and heard", "m": {"type": "scene", "e": "🔊", "t": "In the Reader, tap 🔊 on any page: the voice reads it aloud and lights each word as it goes."}, "steps": [{"t": "Read the page yourself first. Your eyes can stop, look back at a line, and find the numbers and names."}, {"t": "Now close your eyes and hear it. The voice keeps moving. You cannot look back; names and numbers slip by."}, {"t": "Hearing helps too. Hard words are said for you (diaphragm, respirator). Eyes open, the lit words keep your place."}, {"t": "A live speaker adds even more: stress and pauses. \"I didn't say HE took it\" is not \"I didn't say he TOOK it.\""}, {"t": "Teach it back: three questions. What must I check exactly? What slips by if heard once? What does a voice add or change?"}], "a": "Print: look back and check facts. Hearing: hard words said for you; a live voice adds stress."}, "oops": {"q": "\"Hearing it read is the same text, so it changes nothing.\"", "wrong": "True: same words, same meaning", "right": "False: each way gives and loses something", "why": "Heard, you cannot look back, but hard words are said for you. A live voice can even change the meaning."}, "ways": ["worked example", "read, then listen", "Mistake Detective", "listen", "evidence tap", "teach it back"], "done": "You can say what reading and hearing a text each do best!", "board": {"one": "Print: look it up in a written copy, look back at a line as often as you need, see charts and headings. Hearing: hard words said for you, your place kept; a live speaker adds how the voice rises, slows and pauses. Heard once? Check the exact numbers in print.", "activity": "The teacher reads a short speech aloud once; boys write the year it names, then check against the printed copy.", "mistakes": ["Thinking hearing and reading do the same job", "Trusting memory of a number heard once", "Missing how stress changes a speaker's meaning"]}, "do": [{"type": "read", "text": "C68.POL.02", "say": "Read it, then tap 🔊 to hear a page.", "how": "Read the page first. Then tap 🔊 and listen with eyes closed."}, {"type": "sort", "bins": ["Print does it best", "Hearing does it best"], "cards": [["looking back at a line", 0], ["hearing a hard word", 1], ["checking a number", 0], ["resting your eyes", 1], ["seeing a chart", 0], ["a speaker's stress", 1]], "say": "Which version does each job best?", "how": "Can your eyes go back? Or does it need a voice?"}], "your": [{"type": "cloze", "t": "\"I didn't say HE took it.\" The stress on HE means ___.", "o": ["someone else took it", "he borrowed it", "I never spoke"], "a": "someone else took it", "say": "What does the stress change?", "how": "Stress shows which word matters. Who is being pointed at?"}, {"type": "evidence", "q": "A speaker reads the iron lung article aloud. Which line gains most from a slow, soft voice?", "p": ["The iron lung was a long metal tank, about the size of a small car.", "Families learned to be close to a person they could not hug.", "Emerson's version soon filled hospitals across the country."], "a": 1, "look": "a line about feelings, not facts", "say": "Which line does a gentle voice make stronger?", "how": "A plain fact sounds about the same in any voice. A line about feelings gets stronger with a gentle one."}, {"type": "proof", "mis": true, "text": "C68.POL.02", "q": "Moshe heard the article once. He says the first iron lung was built in 1931. Tap the sentence that proves him wrong.", "proof": "Philip Drinker and Louis Agassiz Shaw", "look": "the year the very first iron lung was built", "say": "Moshe trusted his ears. Prove his year wrong.", "how": "Heard once, two years can blur. Find the first machine, not a later one."}, {"type": "listen", "hear": "Diaphragm.", "o": ["DIE-uh-fram", "dee-AH-frum", "DIE-uh-fram-ig"], "a": "DIE-uh-fram", "cap": "Which spelling-out matches what you heard?", "say": "Listen. How is this hard word said?", "how": "Hearing a hard word saves you from guessing it."}, {"type": "cloze", "t": "A speaker reads: \"a way to survive polio, not a way to stop it.\" To show the contrast, he stresses ___.", "o": ["survive and stop", "polio and it", "way and way"], "a": "survive and stop", "say": "Which words carry the meaning?", "how": "Find the two words being set against each other."}]};
  BITE['READ.COMP.L08.12'] = {"band": "M68", "pic": "🗺️", "today": "Map an argument, including the other side", "why": "Before you can judge an argument, you have to see how it is built. A map shows it at a glance.", "ready": [{"q": "Which sentence is an opinion someone could argue about?", "o": ["Codes should be kept secret.", "Enigma had rotors.", "The war ended in 1945."], "a": "Codes should be kept secret."}], "bridge": "READ.COMP.L08.10", "bridgeName": "Set His View Apart", "watch": {"q": "Eli's letter on the debate page", "m": {"type": "scene", "e": "📰", "t": "I believe a government should keep its code-breaking secrets while they still protect people, and then it should tell the full story."}, "steps": [{"t": "Find the claim: the one thing the writer wants you to believe. Eli: keep secrets while they protect people, then tell."}, {"t": "Find each reason. Signals: my first reason, also, because. Eli has three: some secrets keep working; long secrets hurt the people who earned credit; the public learns from the truth."}, {"t": "Under each reason, find its evidence: a fact or example you could check. Reason 2: the Bletchley Park code breakers stayed silent about thirty years."}, {"t": "Find the counterclaim and his answer: \"any secret might help a future enemy\", but a replaced code cannot help anyone."}, {"t": "Teach it back: tell your chavrusa the map: claim on top, reasons under it, evidence under each reason."}], "a": "Claim → three reasons → evidence under each → the counterclaim answered."}, "oops": {"q": "\"The Bletchley Park code breakers stayed silent for about thirty years.\" Eli's claim?", "wrong": "Yes: it is the main point", "right": "No: it is evidence for a reason", "why": "It is a fact you could check. It backs up why long secrets hurt people. The claim is what he wants you to believe."}, "ways": ["worked example", "argument map", "read the whole debate page", "Mistake Detective", "find the proof", "teach it back"], "done": "You can map an argument: claim, reasons, evidence and the counterclaim!", "board": {"one": "Claim (what to believe) → reasons (why) → evidence under each (how do you know) → counterclaim and answer.", "activity": "Boys build a paper argument map of Eli's letter on the board, one strip per reason and fact.", "mistakes": ["Calling a fact the claim", "Mixing up a reason and its evidence", "Missing the counterclaim"]}, "do": [{"type": "read", "text": "C68.CODE.05", "say": "Read the debate page. Watch how each letter is built.", "how": "For each letter, ask: what does he want me to believe, and why?"}, {"type": "storymap", "slots": ["Claim", "Reason", "Evidence for it", "Counterclaim", "His answer"], "cards": ["keep secrets while they protect, then tell", "long secrets hurt the people who earned credit", "the code breakers stayed silent about thirty years", "any secret might help a future enemy", "a replaced code cannot help anyone"], "extra": ["codes have rotors"], "say": "Build the map of Eli's argument.", "how": "Claim on top, then a reason, its evidence, the other side, his answer."}], "your": [{"type": "match", "pairs": [["claim", "What should I believe?"], ["his reply", "How does he answer the other side?"], ["evidence", "How do you know?"], ["counterclaim", "What does the other side say?"]], "say": "Match each part to the question it answers.", "how": "Each part of an argument answers one question."}, {"type": "sort", "mis": true, "bins": ["Claim", "Evidence"], "cards": [["Secrets should be told once they stop protecting.", 0], ["Some waited more than fifty years for a medal.", 1], ["Enigma stayed secret until the 1970s.", 1], ["It is a fact that old secrets should be told.", 0]], "say": "Mistake Detective! Claim, or evidence? Watch the trap.", "how": "Could you check it as a fact? Then it is evidence."}, {"type": "proof", "text": "C68.CODE.05", "q": "Which sentence tells what had to change once the Enigma secret came out?", "proof": "whole chapters of history books had to be rewritten", "look": "a fact about history books", "say": "Find the evidence in the text.", "how": "Find the third reason first. Then find the fact under it."}, {"type": "cloze", "t": "Mordechai's claim is that a government should tell ___.", "o": ["everything the day a war ends", "nothing, ever", "only good news"], "a": "everything the day a war ends", "say": "What does Mordechai want you to believe?", "how": "Read the title of his letter and his last paragraph."}, {"type": "order", "steps": ["claim", "first reason", "evidence for the first reason", "second reason", "evidence for the second reason"], "say": "Put Eli's argument map in order, top to bottom.", "how": "Claim first. Each reason is followed right away by its own evidence."}]};
  BITE['READ.COMP.L08.13'] = {"band": "M68", "pic": "🧠", "today": "Judge whether an argument's reasoning is sound", "why": "An argument can sound strong and still be broken inside. A careful reader finds the crack.", "ready": [{"q": "In \"We should save water because rivers are drying up,\" what is the reason?", "o": ["rivers are drying up", "we should save water", "because"], "a": "rivers are drying up"}], "bridge": "READ.COMP.L08.12", "bridgeName": "Map the Argument", "watch": {"q": "Mordechai's letter", "m": {"type": "scene", "e": "🔍", "t": "Just look at what happened with Enigma. The British hid it for thirty years. That proves that every government will hide everything it can for as long as it can."}, "steps": [{"t": "Ask of each reason: does it really lead to the claim? Mordechai uses one example, Enigma, to prove \"every government\" and \"everything\". Too few examples."}, {"t": "Ask: is the reason true? \"Nobody uses codes anymore\" is false. Computers use codes all the time. A false reason cannot hold up a claim."}, {"t": "Ask: is it a reason at all? \"Anyone who disagrees just does not care about the heroes\" attacks the people, not their idea."}, {"t": "Now compare Eli: \"a code that has already been replaced cannot help anyone.\" True, and it leads to his claim. Sound."}, {"t": "Teach it back: tell your chavrusa the three tests: enough examples? a true reason? a reason, not an attack?"}], "a": "Mordechai: one example, a false reason, an attack. Eli: a true reason that leads to his claim."}, "oops": {"q": "\"Mordechai writes with strong, certain words, so his reasoning must be strong.\"", "wrong": "True: he sounds sure", "right": "False: sounding sure is not sound reasoning", "why": "Test the reasons, not the tone. His reasons fail the three tests."}, "ways": ["worked example", "three tests", "compare two letters", "Mistake Detective", "find the proof", "teach it back"], "done": "You can test an argument's reasoning and find where it breaks!", "board": {"one": "Three tests for each reason: enough examples (not one case → always)? a true reason? a reason, not an attack on the person?", "activity": "Boys get reasons on cards and stand on the 'sound' or 'unsound' side of the room, then name the test that decides it.", "mistakes": ["Trusting a writer because he sounds certain", "Accepting one example as proof of always", "Missing an attack dressed up as a reason"]}, "do": [{"type": "proof", "text": "C68.CODE.05", "q": "Which sentence uses one example to prove something about every government?", "proof": "That proves that every government will hide everything", "look": "one example, then every", "say": "Find the leap from one to every.", "how": "Read Mordechai's second paragraph."}, {"type": "sort", "mis": true, "bins": ["Sound", "Unsound"], "cards": [["A replaced code cannot help an enemy.", 0], ["Enigma was hidden, so every government hides all.", 1], ["Nobody uses codes anymore.", 1], ["Many waited decades unthanked, so long secrets can hurt people.", 0], ["Mordechai sounds very sure, so his reasons are strong.", 1]], "say": "Mistake Detective! Sound reasoning, or unsound?", "how": "Use the three tests on each one."}], "your": [{"type": "order", "steps": ["Find the claim.", "Find a reason for it.", "Run the three tests on the reason.", "Decide: sound or unsound."], "say": "Put the steps for judging a reason in order.", "how": "Claim, then the reason, then the tests, then decide."}, {"type": "match", "pairs": [["\"The British hid Enigma, so every government hides everything.\"", "too few examples"], ["\"Nobody uses codes anymore.\"", "a false reason"], ["\"Anyone who disagrees does not care.\"", "attacking the person"]], "say": "Match each of Mordechai's lines to its problem.", "how": "Which test does each one fail?"}, {"type": "evidence", "q": "Which reason from the debate page is sound?", "p": ["Nobody uses codes anymore.", "A code that has already been replaced cannot help anyone.", "Anyone who disagrees just does not care about the heroes."], "a": 1, "look": "a true reason that leads to the claim", "say": "Tap the one sound reason.", "how": "Run the three tests on each. Only one passes all three."}, {"type": "cloze", "t": "\"Mordechai sounds very sure.\" That makes his reasoning ___.", "o": ["no stronger", "much stronger", "true"], "a": "no stronger", "say": "Does sounding sure make it sound?", "how": "Test the reasons, not the tone."}, {"type": "listen", "hear": "My neighbor's dog bit someone, so all dogs are dangerous and should be banned.", "o": ["too few examples", "attacking the person", "it is sound"], "a": "too few examples", "cap": "What is wrong with this reasoning?", "say": "Listen. What is wrong with the reasoning?", "how": "How many dogs does he know about?"}]};
  BITE['READ.COMP.L08.14'] = {"band": "M68", "pic": "⚖️", "today": "Judge whether the evidence is relevant and enough", "why": "A true fact can still prove nothing. Ask whether evidence fits the reason, and whether there is enough of it.", "ready": [{"q": "\"Boys need a skate park. Three boys were hurt in the street.\" What is the evidence?", "o": ["Three boys were hurt in the street.", "Boys need a skate park.", "a skate park"], "a": "Three boys were hurt in the street."}], "bridge": "READ.COMP.L08.12", "bridgeName": "Map the Argument", "watch": {"q": "Two letters, two kinds of evidence", "m": {"type": "scene", "e": "🔎", "t": "Eli: \"Some of them waited more than fifty years for a medal.\" Mordechai: \"Millions of dollars go to people who sit in locked rooms.\""}, "steps": [{"t": "Name the reason first. Eli's: long secrets hurt the people who earned credit."}, {"t": "Test 1, relevant: is the evidence about that reason? Waiting fifty years for a medal is exactly about being forgotten. Relevant."}, {"t": "Mordechai's millions of dollars may be true, but the question is when to tell secrets, not what they cost. Not relevant."}, {"t": "Test 2, enough: does the claim have enough? Eli says long secrets can hurt people and gives two cases, Bletchley Park and the code talkers. Mordechai says nobody uses codes and gives no evidence at all. Not enough."}, {"t": "Teach it back: tell your chavrusa the two tests: is it about the reason? Is there enough for the claim?"}], "a": "Eli: relevant, and two cases. Mordechai: off topic, and no evidence that nobody uses codes."}, "oops": {"q": "\"Millions of dollars go to code-breaking offices. It's a true fact, so it's good evidence.\"", "wrong": "Yes: true facts are good evidence", "right": "No: it is true but not relevant", "why": "The question is when to tell secrets. A fact about cost does not answer it."}, "ways": ["worked example", "two tests", "compare two letters", "Mistake Detective", "find the proof", "teach it back"], "done": "You can judge whether evidence is relevant and enough!", "board": {"one": "Two tests: relevant (is it about this reason?) and enough (does a big claim have more than one case?). True is not the same as relevant.", "activity": "Boys get a claim and a pile of fact cards, and keep only the cards that pass both tests.", "mistakes": ["Thinking any true fact is good evidence", "Accepting one example for a big claim", "Not naming the reason before testing the evidence"]}, "do": [{"type": "sort", "mis": true, "bins": ["Relevant", "Not relevant"], "cards": [["Some waited 50 years for a medal.", 0], ["Code offices cost millions.", 1], ["History books had to be rewritten.", 0], ["Bletchley Park was a country estate.", 1]], "say": "Mistake Detective! Relevant to when secrets should be told?", "how": "True is not enough. Is it about when to tell?"}, {"type": "proof", "text": "C68.CODE.05", "q": "Which sentence may be true but is not about when secrets should be told?", "proof": "Millions of dollars go to people who sit in locked rooms", "look": "a fact about money", "say": "Find the off-topic evidence.", "how": "Read Mordechai's letter. Which fact is about cost?"}], "your": [{"type": "tiles", "w": ["Good evidence", "is about the reason", "and is enough", "for the claim."], "extra": ["sounds loud"], "say": "Build the rule for good evidence.", "how": "Two tests: about the reason, and enough."}, {"type": "evidence", "q": "Claim: \"The code talkers saved lives.\" Which evidence is strongest?", "p": ["Navajo has many tones.", "Six code talkers sent and received over 800 messages at Iwo Jima without a mistake.", "The code talkers were young."], "a": 1, "look": "a fact that shows saved lives", "say": "Tap the strongest evidence.", "how": "Which fact is about the battle being won?"}, {"type": "match", "pairs": [["true but off topic", "not relevant"], ["one case for \"every\"", "not enough"], ["several matching facts", "relevant and enough"]], "say": "Match each problem to its verdict.
