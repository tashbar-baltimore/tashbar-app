 answer puts texts together?", "p": ["The waterman piece says the skipjack became the state boat in 1985; the estuary article says the bay is shallow.", "The waterman piece says diesel engines replaced sailboats; the oyster article shows the oyster harvest fell.", "The oyster article says the harvest fell, so that is the whole reason."], "a": 1, "look": "two sources that both answer the question", "say": "Tap the answer that joins two texts.", "how": "Do both pieces answer the question?"}, {"type": "listen", "hear": "Chaim told his father: I used the estuary article for where the water comes from, the oyster article for what nutrients do, and the waterman piece for the catch.", "o": ["a piece from each", "one was enough", "they disagree"], "a": "a piece from each", "cap": "Why did the speaker use three texts?", "say": "Listen. Why use three texts?", "how": "What did each text give?"}, {"type": "tiles", "w": ["Water from Pennsylvania drains to the bay (estuary article);", "its nutrients feed algae that rot and use up oxygen (oyster article);", "so crabs cannot thrive in dead zones (View B)."], "extra": ["the skipjack is the state boat (waterman piece);"], "say": "Build the answer, naming each text.", "how": "One piece from each text, each named."}]};

  BITE['READ.COMP.L08.19'] = {"band": "M68", "pic": "📖", "today": "Read a long story on your own, page by page", "why": "Long stories reward the reader who keeps track. A few small moves keep you from getting lost, so the ending hits you the way it should.", "ready": [{"q": "You just read a page. Which shows you understood it?", "o": ["you can say it in one sentence", "you read it fast", "you liked the picture"], "a": "you can say it in one sentence"}], "bridge": "READ.LIT.L08.02", "bridgeName": "Whose View?", "watch": {"q": "Page 1 of The Clock on Lombard Street", "m": {"type": "scene", "e": "🕰️", "t": "\"Zeidy, why did the big clock stop?\" Zeidy took the loupe out of his eye. \"It did not stop by itself,\" he said. \"I stopped it.\""}, "steps": [{"t": "Before reading: preview the title and pictures, then ask a question. Mine: will the clock on Lombard Street be saved?"}, {"t": "After page 1, sum it up in one sentence: the shop must close by March 31, and the stopped clock will be taken down."}, {"t": "Open questions: why did Zeidy stop it himself? Later, page 2 adds one: what is in the locked drawer? I keep them on a list."}, {"t": "Lost? On page 3 I could not say why the wheel matters. I reread: it is the heart of the clock, with three teeth missing. Now I can go on."}, {"t": "Teach it back: tell your chavrusa the four moves: ask, sum up each page, keep open questions, reread when lost."}], "a": "Ask, sum up, track open questions, reread when lost."}, "oops": {"q": "\"Page 2 is slow, so I'll skip to the end.\"", "wrong": "Fine: the end is what matters", "right": "No: you will miss the choice that drives the story", "why": "On page 2 Shuey takes the motor home. Skip it and the ending makes no sense."}, "ways": ["worked example", "read the whole story", "sum up each page", "open questions", "Mistake Detective", "teach it back"], "done": "You can read a long story on your own and keep track of it!", "board": {"one": "Four moves for a long story: ask a question before, sum up each page in one sentence, keep a list of open questions, reread when lost.", "activity": "Boys keep a sticky note per page: one sentence, plus any open question, then cross off questions as the story answers them.", "mistakes": ["Skipping slow pages", "Pushing on when lost", "Not tracking what the story has not told yet"]}, "do": [{"type": "read", "text": "C68.CLK.01", "say": "Read the whole story. Stop after each page.", "how": "Every page: sum it up, then add or cross off a question."}, {"type": "sort", "mis": true, "bins": ["Good move", "Mistake"], "cards": [["Sum up each page in one sentence.", 0], ["Skip page 2, it is slow.", 1], ["Reread page 3 when lost.", 0], ["Keep going when lost, hoping the next page explains it.", 1]], "say": "Mistake Detective! Good reading move, or a mistake?", "how": "Which moves keep you from getting lost?"}], "your": [{"type": "order", "steps": ["Shuey takes the motor home.", "Zeidy opens the locked drawer.", "Shuey cuts a tooth too short.", "The clock ticks, then stops.", "The crew finds the clock running."], "say": "Put the big events in order.", "how": "Use your one-sentence sum-ups."}, {"type": "match", "pairs": [["What is in the locked drawer?", "a wheel with missing teeth"], ["Will Shuey finish in time?", "yes, by midnight after Shabbos"], ["Will the clock stay up?", "yes, if someone winds it"]], "say": "Match each open question to its answer.", "how": "Where did the story finally answer it?"}, {"type": "evidence", "q": "Which sentence best sums up page 4?", "p": ["Shuey practices, cuts one tooth, then rushes and cuts the next too short.", "Shuey's friend Ezra watches him file and asks if he just rubs it.", "Shuey learns late for a Gemara test, so he reaches the shop on Monday."], "a": 0, "look": "the whole page in one sentence", "say": "Tap the best one-sentence sum-up.", "how": "Does it cover the whole page, not one detail?"}, {"type": "cloze", "t": "The question raised on page 1 is answered at shalosh seudos: Zeidy stopped the clock because it was telling ___.", "o": ["the wrong time", "no time at all", "the right time"], "a": "the wrong time", "say": "Fill in why Zeidy stopped the clock.", "how": "Reread what Zeidy says at shalosh seudos."}, {"type": "listen", "hear": "Page one ends with Zeidy saying he stopped the clock himself. I wrote 'Why?' on my sticky note and kept reading.", "o": ["add an open question", "reread the page", "sum it up"], "a": "add an open question", "cap": "What move did the reader use?", "say": "Listen. What reading move did he use?", "how": "Did the story tell him why yet?"}]};
  BITE['READ.LIT.L08.10'] = {"band": "M68", "pic": "⚙️", "today": "See how setting, people and plot change each other", "why": "A story works like a clock: every part turns another. See how the place, the people and the events push each other, and you see why the story had to go this way.", "ready": [{"q": "In a story, what is the setting?", "o": ["where and when it happens", "the main character", "the ending"], "a": "where and when it happens"}], "bridge": "READ.LIT.L08.02", "bridgeName": "Whose View?", "watch": {"q": "Three gears in one story", "m": {"type": "scene", "e": "⚙️", "t": "Now there was a glass apartment tower on one corner, a phone repair store on the other, and a parking garage where the bakery had been."}, "steps": [{"t": "Gear 1, setting shapes the problem: the street is changing. The building is sold, so the lease ends and the clock will come down."}, {"t": "Gear 2, a choice changes the plot: Shuey gives the motor back. If he had used it, there would be no last three teeth, no filing, no ruined tooth."}, {"t": "Setting turns the plot again: Shabbos stops all work for 25 hours. The wait makes the last night tense."}, {"t": "Gear 3, the plot changes the character: after the ruined tooth, Shuey makes himself go slower. At the end he never hurries."}, {"t": "Teach it back: tell your chavrusa the three gears, with one example of each from the story."}], "a": "The changing street makes the problem; Shuey's choices steer the plot; the plot makes Shuey patient."}, "oops": {"q": "\"The setting is just the backdrop. The story could happen anywhere.\"", "wrong": "True: setting is scenery", "right": "False: the changing street causes the problem", "why": "No new tower, no sold building, no lease ending, no deadline. The place makes the problem."}, "ways": ["worked example", "three gears", "find the proof", "Mistake Detective", "listen", "teach it back"], "done": "You can show how setting, people and plot change each other!", "board": {"one": "Three gears: the  "theme"], "a": "choice", "say": "Which gear turns here?", "how": "What if he had left on time?"}, {"type": "listen", "hear": "The town was on an island, and the ferry stopped in winter. So when Yosef got sick in January, the doctor had to come by boat through the ice.", "o": ["setting → problem", "choice → plot", "plot → person"], "a": "setting → problem", "cap": "Which gear is this?", "say": "Listen. Which gear turns here?", "how": "Could this problem happen in a city?"}, {"type": "tiles", "w": ["The street changes,", "so the lease ends;", "Shuey chooses the real wheel,", "and learns patience."], "extra": ["so the bakery opens;"], "say": "Build the chain of gears.", "how": "Setting, problem, choice, change."}]};
  BITE['READ.LIT.L08.11'] = {"band": "M68", "pic": "⏰", "today": "See how an author keeps you turning pages", "why": "When you cannot put a story down, the author did that on purpose. Knowing the tools makes you a sharper reader, and a better writer.", "ready": [{"q": "Which ending makes you want to read on?", "o": ["\"Then the door creaked open.\"", "\"Then everyone went to sleep.\"", "\"The end.\""], "a": "\"Then the door creaked open.\""}], "bridge": "READ.LIT.L08.10", "bridgeName": "How the Parts Fit", "watch": {"q": "Why you could not stop reading", "m": {"type": "scene", "e": "⏰", "t": "\"Eighteen days,\" Zeidy said. \"Three teeth. Can you do it?\" \"I don't know,\" said Shuey."}, "steps": [{"t": "Tool 1, a ticking deadline: March 31, then eighteen days, then six days, then eight o'clock Sunday. The clock in the story gets louder."}, {"t": "Tool 2, a question held back: \"I stopped it,\" on page 1. The reason waits until shalosh seudos, five pages later."}, {"t": "Tool 3, cliffhanger endings: pages stop on \"I don't know,\" on \"He had ruined the wheel,\" and on \"And then it stopped.\""}, {"t": "Even a quiet wait is tense: twenty-five hours of Shabbos, with no file allowed and the crew coming Sunday."}, {"t": "Teach it back: tell your chavrusa the three tools, and point to one place in the story where each one pulled you on."}], "a": "A tightening deadline, an answer held back, and pages that stop at the worst moment."}, "oops": {"q": "\"There is no danger or fighting, so this story has no suspense.\"", "wrong": "True: suspense needs action", "right": "False: a deadline and a secret build suspense", "why": "Will three teeth be done in eighteen days? Why did Zeidy stop the clock? Those questions kept you reading."}, "ways": ["worked example", "three tools", "find the proof", "Mistake Detective", "listen", "teach it back"], "done": "You can name how an author keeps you reading!", "board": {"one": "Three suspense tools: a ticking deadline, a question held back, ee sentences from the last chapter.", "o": ["all from one part", "theme is a topic", "nothing wrong"], "a": "all from one part", "cap": "What is wrong?", "say": "Listen. What should he fix?", "how": "Where did all his proofs come from?"}, {"type": "tiles", "w": ["The theme", "is a sentence about life,", "proved from the beginning,", "the middle and the end."], "extra": ["is one word,"], "say": "Build the rule.", "how": "Theme, then where the proofs come from."}]};
  UP['READ.LIT.L08.02'] = {"band": "M68", "pic": "👀", "today": "Contrast how two characters see the same thing", "why": "Two people can live the same moment and see it differently. Noticing that is reading deeply.", "ready": [{"q": "\"Rain! The trip is off,\" groaned Yossi. How does Yossi feel?", "o": ["disappointed", "excited", "sleepy"], "a": "disappointed"}], "bridge": "READ.LIT.L07.01", "bridgeName": "Character, conflict and theme", "watch": {"q": "The note from Dovi's school", "m": {"type": "scene", "e": "📝", "t": "\"What if it is not safe?\" Mama was saying. \"And what if it is safe, and we say no?\" Tatty answered. Neither of them noticed Shmuel in the doorway."}, "steps": [{"t": "Find each character's view of the same thing. Mama fears the shot might harm Dovi."}, {"t": "Tatty fears something else: a summer of polio without the shot. Same note, two different worries."}, {"t": "Prove each view with the character's own words: \"What if it is not safe?\" against \"What if it is safe, and we say no?\""}, {"t": "Now the reader's view. Shmuel heard them, but his parents do not know it. The reader knows something a character does not."}, {"t": "Teach it back: tell your chavrusa how to set two views side by side, each with its proof."}], "a": "Mama fears the vaccine; Tatty fears polio more. Shmuel, and the reader, see both."}, "oops": {"q": "\"Dovi put down his fork. He did not say anything.\" Dovi's view of the shots?", "wrong": "He does not care: he says nothing", "right": "He is scared", "why": "Silence can be a clue. His lip began to shake. Read actions, not only words."}, "ways": ["worked example", "read the whole story", "views side by side", "Mistake Detective", "evidence tap", "teach it back"], "done": "You can set two characters' views side by side and prove each one!", "board": {"one": "Same event, different views: find each character's view, prove it with his words or actions, then ask what the reader knows that a character does not.", "activity": "Boys r omething hidden from Dovi", "say": "Tap the fact Dovi does not know.", "how": "For each fact, ask: was Dovi there when it was said?"}, {"type": "cloze", "t": "At first Mama sees the test as a risk. By August, she sees it as ___.", "o": ["a way of helping everyone", "a mistake", "a waste of time"], "a": "a way of helping everyone", "say": "How did Mama's view change?", "how": "Reread what Mama says about the button in August."}]};
  UP['READ.COMP.L08.01'] = {"band": "M68", "pic": "🦀", "today": "Compare how two authors shape the same facts", "why": "Two writers can share the same facts and still give you different pictures. Each writer picks a focus: what he follows and puts in front. Seeing how each one does it lets you read like a judge.", "ready": [{"q": "Two texts are both about the same storm. What do they share?", "o": ["the topic", "the title", "the author"], "a": "the topic"}], "bridge": "READ.COMP.L07.03", "bridgeName": "Author's Build", "watch": {"q": "Two texts, one blue crab", "m": {"type": "scene", "e": "🦀", "t": "Crab article: \"A blue crab can turn them like little propellers and swim quickly.\" Waterman piece: \"Winter oystering can be bitter.\""}, "steps": [{"t": "Step 1, shared facts: both texts tell about blue crabs, the watermen who catch them, limits on catches, and crabs burying in the mud in winter."}, {"t": "Step 2, focus: the crab article follows the crab's life: swimming, molting, eggs. The waterman piece follows the man who catches it."}, {"t": "Step 3, words: the article says remarkable and true swimmer. The waterman piece says bitter, heavy, dangerous. Strong words show each writer's feeling: wonder against hard work. A plain list of facts shows no feeling."}, {"t": "Step 4, one fact shaped two ways: limits. The article shows limits leaving enough mothers to lay eggs; the waterman piece lists limits as one more change in a hard job. If someone says limits are pointless, the article's fact answers him."}, {"t": "Teach it back: tell your chavrusa the four steps: shared facts, focus, words, and how one fact is shaped."}], "a": "Same facts; the article shows a wonder of nature, the waterman piece a hard way of life."}, "oops": {"q": "\"Both texts are about crabs, so they say the same thing.\"", "wrong": "True: same topic, same message", "right": "False: same topic, different focus", "why": "Same facts can be chosen, ordered and worded to give a different picture."}, "ways": ["worked example", "two columns", "find the proof", "Mistake Detective", "listen", "teach it back"], "done": "You can show how two authors shape the same facts!", "board": {"one": "Two texts, one topic: find the shared facts, name each author's focus, compare the words, and show how one fact is shaped differently.", "activity": "Pairs each take one text, list its five most important words, then compare the lists.", "mistakes": ["Saying same topic means same message", "Comparing topics instead of how the facts are shaped", "Forgetting to prove each side with the text", "Not using a fact from a text to answer a view"]}, "do": [{"type": "storymap", "slots": ["Crab article focuses on", "Waterman piece focuses on", "Crab article's words", "Waterman piece's words"], "cards": ["larvae drifting out to the ocean", "trotlines and crab pots", "\"beautiful swimmer\"", "\"wind cuts through even the warmest coat\""], "extra": ["the price of crab meat"], "say": "Fill in the two columns.", "how": "Find what each text follows, and one strong phrase from each."}, {"type": "proof", "text": "C68.BAY.04", "q": "On the crab-pot page, which sentence shows the job is hard work?", "proof": "It is hot, wet, heavy work, done over and over", "look": "words about the work itself", "say": "Find the proof in the waterman piece.", "how": "Go to the page about crab pots."}], "your": [{"type": "order", "steps": ["Find the facts both texts share.", "Name each author's focus.", "Compare their strong words.", "Show one fact shaped two ways."], "say": "Put the four steps in order.", "how": "What must you know before you can compare words?"}, {"type": "sort", "mis": true, "bins": ["Read right", "Mistake"], "cards": [["Same topic, different focus.", 0], ["Both texts tell about limits, so they feel the same about limits.", 1], ["Both texts mention limits on crab catches.", 0], ["The waterman piece calls the crab remarkable.", 1]], "say": "Mistake Detective! Read right, or a mistake?", "how": "Check each line against both texts."}, {"type": "evidence", "q": "Same news, two writers. Shul bulletin: \"The new shul building opens Sunday at 9:00.\" Dovid's letter: \"We waited three years, and my Zeidy cried when he saw it.\" How do they shape it?", "p": ["The bulletin gives plain facts; the letter shows feelings.", "Both give only times.", "They tell about two different buildings."], "a": 0, "look": "which one shows feeling", "say": "Tap how each writer shapes the news.", "how": "Times and facts, or feelings?"}, {"type": "cloze", "t": "Someone says a waterman's job is easy. A fact from the waterman piece could answer him: in winter, spray ___ on the deck.", "o": ["freezes", "melts", "collects"], "a": "freezes", "say": "Use a fact from one text to answer a view.", "how": "Reread the page about winter oystering."}, {"type": "listen", "hear": "Shmuel wrote: Snow closed the yeshiva, and boys learned at home with their fathers. Binyamin wrote: Snow closed the yeshiva, and parents scrambled to keep everyone busy.", "o": ["same fact, new focus", "new facts, same focus", "same fact and focus"], "a": "same fact, new focus", "cap": "What do the two writers do?", "say": "Listen. How do the two writers differ?", "how": "Is the fact the same? Is the focus the same?"}]};

  if (window.TLCORE && TLCORE.units && TLCORE.units.add) TLCORE.units.add({"id": "C68.U75", "title": "Whose View?", "c": "READ", "grade": 7, "skills": ["READ.LIT.L08.02", "READ.COMP.L08.10", "READ.LIT.L08.09", "READ.COMP.L08.11"], "review": ["READ.COMP.L08.02", "READ.LIT.L08.01"], "n": 10, "items": [{"type": "evidence", "skill": "READ.LIT.L08.02", "q": "Avi cheered: \"No school today!\" Which line shows his brother Moshe sees the snow day differently?", "p": ["Moshe pulled on his boots.", "Moshe sighed: \"Now the siyum will be put off.\"", "Moshe looked out the window."], "a": 1, "look": "a line that shows a different feeling", "how": "Which line shows how Moshe feels about the snow?"}, {"type": "cloze", "skill": "READ.COMP.L08.10", "t": "\"Many neighbors want the new park open late. Still, I feel it should close at dark so younger children get home safely.\" The word where the author turns to his own view is ___.", "o": ["Still", "Many", "late"], "a": "Still", "how": "Find the turn word between their view and his."}, {"type": "evidence", "skill": "READ.LIT.L08.09", "q": "Which detail would a story writer most likely make up?", "p": ["the year the vaccine test began", "how many children took part in the test", "what a boy whispered to his brother that night"], "a": 2, "look": "a private moment no record keeps", "how": "Which detail could no record show?"}, {"type": "cloze", "skill": "READ.COMP.L08.11", "t": "Dovid wants to know which words the speaker said with the most feeling. He should ___.", "o": ["listen to a recording", "count the words in print", "check the page numbers"], "a": "listen to a recording", "how": "Which one lets you hear how the words were said?"}]});
  if (window.TLCORE && TLCORE.units && TLCORE.units.add) TLCORE.units.add({"id": "C68.U76", "title": "Trace and Judge", "c": "READ", "grade": 7, "skills": ["READ.COMP.L08.12", "READ.COMP.L08.13", "READ.COMP.L08.14", "READ.COMP.L08.15"], "review": ["READ.COMP.L08.10", "READ.LIT.L08.02"], "n": 10, "items": [{"type": "evidence", "skill": "READ.COMP.L08.12", "q": "\"Our school needs a bigger library. Last year, forty boys waited weeks for one book. More shelves would end the wait.\" Which sentence is the claim?", "p": ["Last year, forty boys waited weeks for one book.", "Our school needs a bigger library.", "More shelves would end the wait."], "a": 1, "look": "the main point the writer argues", "how": "Which sentence do the other two support?"}, {"type": "evidence", "skill": "READ.COMP.L08.13", "q": "Which reasoning is NOT sound?", "p": ["The bus broke down, so the boys on it came late.", "The clock was slow, so the bell rang late.", "One boy was late on Monday, so every boy in the class is always late."], "a": 2, "look": "one case stretched to cover everyone", "how": "Can one example prove \"every\" and \"always\"?"}, {"type": "cloze", "skill": "READ.COMP.L08.14", "t": "Claim: \"Our team practices hard.\" Evidence: \"Our team bus is ten years old.\" This evidence is ___.", "o": ["not relevant", "not enough", "relevant and enough"], "a": "not relevant", "how": "Is the evidence about practicing at all?"}, {"type": "cloze", "skill": "READ.COMP.L08.15", "t": "\"The spoiled players got a new field.\" The loaded word is ___.", "o": ["spoiled", "players", "field"], "a": "spoiled", "how": "Which word pushes a feeling instead of giving a fact?"}]});
  if (window.TLCORE && TLCORE.units && TLCORE.units.add) TLCORE.units.add({"id": "C68.U77", "title": "Two Authors, One Bay", "c": "READ", "grade": 7, "skills": ["READ.COMP.L08.01", "READ.COMP.L08.16", "READ.COMP.L08.17", "READ.COMP.L08.18"], "review": ["READ.COMP.L08.12", "READ.COMP.L08.14"], "n": 10, "pre": "lessons", "items": [{"type": "evidence", "skill": "READ.COMP.L08.01", "q": "Both texts report that the bay grass grew this year. Text 1, a state report: \"Grass beds grew again this year, mostly in the shallow lower bay. Cleaner water lets sunlight reach the bottom.\" Text 2, a letter to the Beacon from Mr. Dahan, who runs a fishing boat: \"Sure, there is more grass by my island. But up the rivers the water is still brown, and nothing grows there.\" How does each writer shape the same news?", "p": ["Text 2 says the grass did not really grow this year, so the two writers disagree about the facts.", "Text 1 leads with the gain and its cause; Text 2 grants the gain, then turns to the rivers.", "Text 1 gives only facts and Text 2 gives only feelings, so Text 2 adds nothing to the news."], "a": 1, "look": "what each writer puts first, and what he adds", "how": "Same news. What does each writer put first? What does the second one add?"}, {"type": "cloze", "skill": "READ.COMP.L08.16", "t": "Text 1: \"The bay grass grew this year because the water is cleaner.\" Text 2: \"Yes, there is more grass, but that is because last summer was cool, and grass grows best in a cool year.\" On the grass, the two writers ___.", "o": ["agree it grew but explain it two ways", "disagree about whether the grass grew at all", "agree that it grew and agree on the reason"], "a": "agree it grew but explain it two ways", "how": "First ask: do both say the grass grew? Then ask: do they give the same reason?"}, {"type": "evidence", "skill": "READ.COMP.L08.17", "q": "Question: why might crabbers near the lower-bay islands find more young crabs this year? Source 1, a state survey: \"Grass beds grew this year, mostly in the shallow lower bay.\" Source 2, a crabbing guide: \"Young crabs hide in grass beds while their shells are soft.\" Which answer puts the sources together?", "p": ["The guide says young crabs hide in grass while their shells are soft, so the guide alone answers it.", "The survey says more grass grew, so crabbers will find more young crabs anywhere they set pots.", "The survey says grass grew there; the guide says young crabs hide in grass. So: more hiding places."], "a": 2, "look": "an answer that joins a piece from each source", "how": "What does each source add? Which answer joins the two pieces to answer the question?"}, {"type": "evidence", "skill": "READ.COMP.L08.18", "q": "Chart: Underwater grass in the bay (thousands of acres). 2019: 67 · 2020: 62 · 2021: 68 · 2022: 76. Article: \"Cleaner water lets sunlight reach the grass.\" Which sentence reads the chart and the article correctly?", "p": ["The grass dipped in 2020, then grew two years running; the article gives one reason.", "The grass grew every year from 2019 to 2022, and the article explains why it kept growing.", "The chart shows a dip and then a rise, and it proves that cleaner water made the grass grow."], "a": 0, "look": "the trend from the chart, the reason from the text", "how": "Read the title. Compare each number with the next. Which one shows, and which one tells why?"}, {"type": "evidence", "skill": "READ.COMP.L08.01", "q": "Both texts report that forty oyster farms now line Back Creek. Text 1, the county paper: \"Forty oyster farms now line Back Creek, bringing jobs and cleaner water.\" Text 2, a letter from a neighbor: \"Forty farms now crowd Back Creek. My boys can no longer row to the island.\" How do they shape the same fact?", "p": ["They disagree about the facts: Text 1 says forty farms, and Text 2 says there are too many.", "Both writers are glad about the farms; Text 2 only adds a small story about his boys.", "Text 1 makes the farms a gain for the town; Text 2 makes them a loss for his family."], "a": 2, "look": "what each writer makes the forty farms seem", "how": "Same number. Does each writer make it sound good or bad, and for whom?"}, {"type": "evidence", "skill": "READ.COMP.L08.16", "q": "View A: \"Oyster farms clean the water, and the state should allow more of them.\" View B: \"Oyster farms clean the water, but they block the creeks where families fish and row, so the state should not allow more.\" Where do they agree, and where do they disagree?", "p": ["They agree the farms clean the water; they disagree about allowing more.", "They disagree about whether the farms clean the water, but agree that more should be allowed.", "They agree on everything; View B just adds one more fact about the creeks."], "a": 0, "look": "one shared point and one split", "how": "List what both say. Then find the point where they part ways."}, {"type": "evidence", "skill": "READ.COMP.L08.17", "q": "Question: why did the crab harvest fall this year? Text 1: \"A cold winter killed many crabs.\" Text 2: \"New rules cut the harvest season by two weeks.\" Which answer is strongest?", "p": ["A cold winter killed many crabs (Text 1), so fewer were left to catch; that one cause explains the drop.", "Two causes: the cold killed many crabs (Text 1), and a shorter season gave fewer days to catch them (Text 2).", "Both texts agree: a cold winter and the new rules killed many crabs, so there were fewer to catch."], "a": 1, "look": "an answer with a piece from each text, each named", "how": "Does the answer use both texts and say where each piece came from?"}, {"type": "evidence", "skill": "READ.COMP.L08.18", "q": "Chart: Crabs caught by the Mill Point boats (bushels). 2019: 600 · 2020: 540 · 2021: 410 · 2022: 370. Article: \"Many older watermen retired, and fewer boats went out each year.\" A writer says the chart proves fewer crabs live in the creek. What is wrong?", "p": ["Nothing; the catch fell every year, so the crabs in the creek must have fallen too.", "The chart counts crabs caught, not crabs living; fewer boats could explain the drop.", "The chart shows a rise in 2022, so the writer read the trend backwards."], "a": 1, "look": "what the chart counts, and what the article adds", "how": "Read the title: crabs living, or crabs caught? What does the article say changed?"}]});
  if (window.TLCORE && TLCORE.units && TLCORE.units.add) TLCORE.units.add({"id": "C68.U78", "title": "The Whole Story", "c": "READ", "grade": 7, "skills": ["READ.COMP.L08.19", "READ.LIT.L08.10", "READ.LIT.L08.11", "READ.LIT.L08.12"], "review": ["READ.COMP.L08.10", "READ.COMP.L08.18", "READ.COMP.L08.12"], "n": 10, "pre": "lessons", "items": [{"type": "evidence", "skill": "READ.COMP.L08.19", "q": "Sum up this page in one sentence. \"By noon the creek had climbed over the road. Mr. Katz drove the car up the hill, then ran back for the sefarim in the basement. The water was at his knees when he carried up the last box, and his wife was calling from the porch for him to hurry.\" Which is the best one-sentence sum-up?", "p": ["Mr. Katz drove the car up the hill and ran back down to the basement for the sefarim.", "The creek flooded the road, and Mr. Katz saved the car and the sefarim just in time.", "By noon the creek was over the road, the water reached his knees, and his wife called him."], "a": 1, "look": "one sentence that covers the start, middle and end of the page", "how": "Who did what, and how did it end? One sentence, the whole page."}, {"type": "cloze", "skill": "READ.LIT.L08.10", "t": "The storm cut the power, and the radio said the creek would crest within the hour. Shimon could stay by the radio or run down the hill to warn the Levys. He ran, and the Levys got out in time. The Levys are safe because ___.", "o": ["a choice changed the plot", "the setting shaped the problem", "the plot changed the character"], "a": "a choice changed the plot", "how": "The storm made the danger. What made the Levys safe? Ask: what if he had stayed?"}, {"type": "evidence", "skill": "READ.LIT.L08.11", "q": "Which chapter ending is a cliffhanger, not a ticking deadline or a question held back?", "p": ["The river would crest at six. It was already a quarter past five, and the boat still had no oars.", "Saba would never say why he kept the old rowboat in the shed, and tonight he went out to check it again.", "Then, over the roar of the water, they heard someone calling for help from the roof next door."], "a": 2, "look": "a page that stops at the worst moment", "how": "Is time running out? Is an answer saved for later? Or does it stop right at the danger?"}, {"type": "evidence", "skill": "READ.LIT.L08.12", "q": "Theme: \"Courage means acting while you are still afraid.\" Which three proofs show it best across the whole book?", "p": ["Ch. 1: Dov hides from the thunder. Ch. 4: shaking, he carries the Levys' baby up. Ch. 8: he admits he was afraid.", "Ch. 8: the fire chief praises Dov. Ch. 8: the Levys thank him. Ch. 8: Dov says he was scared the whole time.", "Ch. 1: the rain starts and the creek rises. Ch. 4: the water reaches the Levys' stairs. Ch. 8: the river goes down."], "a": 0, "look": "proofs about the theme, from the beginning, middle and end", "how": "Are the proofs about the theme, and are they spread across the book?"}, {"type": "evidence", "skill": "READ.COMP.L08.19", "q": "Before reading a long chapter called \"The Night the Bridge Fell\", Elisha reads its first line: \"At nine o'clock the Levys' truck was still on the far side of the creek.\" Which question will pull him through the chapter best?", "p": ["What time was it when the chapter started?", "Will the Levys get across before the bridge falls?", "Why are bridges built over creeks and rivers?"], "a": 1, "look": "a question the chapter itself will answer", "how": "Is it answered already? Will this chapter answer it? Use the title and the first line."}, {"type": "evidence", "skill": "READ.LIT.L08.10", "q": "At the start, Ezra laughs at the old mill. After the flood, he spends every Sunday helping to rebuild it. What link is this?", "p": ["the plot changes the character", "the setting shapes the problem", "a choice changes the plot"], "a": 0, "look": "who he is at the start, and at the end", "how": "Compare Ezra at the start and at the end. What changed him?"}, {"type": "evidence", "skill": "READ.LIT.L08.11", "q": "Why does the author end chapter 5 with \"Then the phone rang. It was the fire hall.\" and not tell the call until chapter 6?", "p": ["to show that time is running out before a deadline", "to make the reader turn the page to find out", "to slow the story down with a quiet, calm moment"], "a": 1, "look": "what the held-back call does to the reader", "how": "What do you want to do when the chapter stops there?"}, {"type": "evidence", "skill": "READ.LIT.L08.12", "q": "Which is a theme statement, not a summary or a rule?", "p": ["The Katz family loses its house in the flood.", "Losing a house does not mean losing a home.", "Always help your neighbors when a flood comes."], "a": 1, "look": "a full sentence about life that the story shows", "how": "A summary tells what happened. An order is a rule. A theme is what the story shows about life."}]});
