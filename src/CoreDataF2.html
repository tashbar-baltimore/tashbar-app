<script>
/* CoreDataF2.html: Core Growth job F, Kindergarten and Grade 1 games (K-1 boys get games only), lesson data (docs/core-growth/HOW-TO-ADD-A-SKILL.md). Keep this file under 150 KB.
   Every lesson listed for this file in src/CoreDataF.js goes in LESSONS, written  'ID':{name:'...', teach:[...], practice:[...], check:[...], re:[...]}
   (the server finds a lesson by that exact shape: quoted id, colon, brace, name first). Optional: Teacher Time, How-to boxes, One Bite. */
(function () {
  var LESSONS = {
  };
  var TEACH = {}, HOWTO = {}, BITE = {};
  /* ===== K-1 Unit 1 games (F-map sections 3 and 4). A K or Grade 1 boy plays these on his game path (docs/core-growth/HOW-TO-ADD-A-K1-GAME.md).
     Kindergarten Unit 1 is listening only: no letters are spoken or shown, and sort boxes are pictures (a K boy cannot read yet).
     The teaching is in the spoken lines (say), because the game speaks them. ===== */
  var K1G = [
    { id:'READ.PA.L01.07', grade:0, name:'Clap the Words', pic:'👏', after:'READ.PA.L01.01', acts:[
      {type:'listen', hear:'Shmuli runs fast.', o:['👏👏👏','👏👏','👏👏👏👏'], a:'👏👏👏', say:'Eli eats: clap, clap. Two words! Now listen. How many claps?', how:'Clap once for each word you hear.'},
      {type:'tiles', w:['👦','👀','🐰'], hear:'Eli sees Hop.', say:'Each picture is one word. Put them in order.', how:'Listen. Which word comes first? Then next?'},
      {type:'sort', bins:['👏','👏👏'], cards:[['🐐',0],['🐐🐔',1],['🍌',0],['🍎🍌',1]], say:'Banana is long, but one word. One clap or two?', how:'Two pictures: two words. Banana is long, but one word.'},
      {type:'listen', hear:'Eli has a pumpkin.', o:['👏👏👏👏','👏👏👏👏👏','👏👏👏'], a:'👏👏👏👏', mis:true, say:'Listen. How many words do you hear?', how:'Clap once for each word, not each part.'},
      {type:'listen', hear:'Shmuli has a big hat.', o:['👏👏👏👏👏','👏👏👏','👏👏👏👏'], a:'👏👏👏👏👏', say:'Listen. How many words? Clap each one.', how:'Clap once for each word you hear.'}]},

    { id:'READ.PA.L01.08', grade:0, name:'Rhyme Maker', pic:'🎩', after:'READ.PA.L01.02', acts:[
      {type:'match', pairs:[['🐝','🌳'],['🚗','⭐'],['🐐','⛵']], say:'Bee, tree. They end the same. Match the rhymes.', how:'Say both words. Do they end the same?'},
      {type:'listen', hear:'cake', o:['🐍','🐱','🍎'], a:'🐍', say:'Mendy baked a cake! Which picture rhymes with cake?', how:'Say cake, then each picture. Which ends the same?'},
      {type:'sort', bins:['👍','👎'], cards:[['🌳',0],['🐻',1],['🔑',0],['🐢',1]], say:'Rhymes with bee? Thumbs up. No? Thumbs down.', how:'Say bee. Say the picture. Do the ends match?'},
      {type:'findall', grid:['🍎','🎩','🐔','🦇','☀️','🐟'], find:['🎩','🦇'], findSay:'picture that rhymes with mat', say:'Dovid sat on a mat. Tap every picture that rhymes with mat.', how:'Say each picture. Does it end like mat?'},
      {type:'listen', hear:'bun', o:['☀️','🐟','🍞'], a:'☀️', mis:true, say:'Careful! Bread goes with bun, but does it rhyme? Tap the rhyme.', how:'Say bun, then each picture. Which ends the same?'}]},

    { id:'READ.PA.L01.09', grade:0, name:'Beat Builder', pic:'🥁', after:'READ.PA.L01.03', acts:[
      {type:'listen', hear:'cup... cake', o:['🧁','🎂','☕'], a:'🧁', say:'Sun, flower: sunflower! Now you. Push these two parts together.', how:'Say the two parts fast, as one word.'},
      {type:'listen', hear:'pop... corn', o:['🍿','🌽','🎈'], a:'🍿', say:'Listen. Push the parts together. Which picture?', how:'Say the two parts fast, as one word.'},
      {type:'sort', bins:['👏','👏👏'], cards:[['🐝',0],['🐵',1],['🐟',0],['🐰',1]], say:'Clap with Shmuli! Mon-key: two claps. Bee: one clap.', how:'Say it and clap. Count your claps.'},
      {type:'findall', grid:['🌈','🐝','🧁','🐟','🥕','🔑'], find:['🌈','🧁','🥕'], findSay:'picture with two claps', say:'Tap every picture with two claps.', how:'Say each one and clap. Two claps? Tap it.'},
      {type:'listen', hear:'Say cowboy without cow.', o:['👦','🐄','🤠'], a:'👦', mis:true, say:'Careful! Not the cow. Say cowboy, take off cow. What is left?', how:'Say cowboy. Now say it again, but leave off cow.'},
      {type:'listen', hear:'Say snowman without snow.', o:['⛄','❄️','👨'], a:'👨', say:'Yanky built a snowman. Take away snow. What is left?', how:'Say snowman. Say it again, but leave off snow.'}]},

    { id:'READ.PHON.L02.22', grade:1, name:'CVC Speedway', pic:'🏎️', after:'READ.PA.L02.01', acts:[
      {type:'tiles', w:['m','a','p'], extra:['o'], hear:'map', say:'Zevi has a map. Three sounds. One tile for each.', how:'Say it slowly. First sound, middle sound, last sound.'},
      {type:'match', pairs:[['bag','🎒'],['bus','🚌'],['web','🕸️']], say:'Help Avi read. Push the sounds together fast. Match it.', how:'Sound it out: first, middle, last. Then blend.'},
      {type:'listen', hear:'hip', o:['hip','hop','hap'], a:'hip', mis:true, say:'Careful! Listen to the middle sound.', how:'The first and last sounds are the same. Listen to the middle.'},
      {type:'sort', bins:['like cat','like six'], cards:[['cap',0],['pin',1],['map',0],['fin',1]], say:'Read it. Middle like cat, or middle like six?', how:'Look at the middle letter. Say its sound.'},
      {type:'findall', grid:['cat','cot','cut','hat','hot','hut'], find:['cat','hat'], findSay:'word with the middle sound of cat', say:'Tap every word with the middle sound of cat.', how:'Read each word. Look at the middle letter.'},
      {type:'tiles', w:['j','e','t'], extra:['i','a'], hear:'jet', say:'Zevi flies to Bubby on a jet. Middle sound like egg.', how:'Say it slowly. Listen to the middle sound.'}]},

    { id:'READ.PA.L02.02', grade:1, name:'Long or Short?', pic:'🐍', after:'READ.PHON.L02.22', acts:[
      {type:'sort', bins:['🎂','🐱'], cards:[['🍇',0],['🎩',1],['🐍',0],['🦇',1]], say:'Long like cake, or short like cat? Drag each picture.', how:'Say the picture. Listen to the middle sound.'},
      {type:'listen', hear:'kite, fish, socks', o:['🪁','🐟','🧦'], a:'🪁', say:'Yehuda packed three things. Which one has a long sound?', how:'Say each picture. Which middle sound says its name?'},
      {type:'listen', hear:'pin', o:['🐟','🚲'], a:'🐟', mis:true, say:'Careful! Pin, not pine. Like fish, or like bike?', how:'Say pin slowly. Does the middle say its name?'},
      {type:'findall', grid:['🐝','🥚','🌳','🛏️','🔑','🕸️'], find:['🐝','🌳','🔑'], findSay:'picture with the long sound of bee', say:'Bee has a long sound. Tap every picture with that sound.', how:'Say each picture. Does it sound like bee?'},
      {type:'match', pairs:[['🐍','🚂'],['🦇','🎩'],['🪁','🚲']], say:'Match the two pictures that have the same sound inside.', how:'Say both words. Listen to the middle sound.'}]},

    /* ===== K Unit 2 games: Meet m, a, s, t (F-map section 3). Letters are shown, never spoken alone: the voice says mmm, sss, tuh, each with its key word.
       No bare vowel sound is spoken (the voice reads it wrong): short a is "the first sound in apple". Reading pieces use only m, a, s, t and the heart words the, a. ===== */
    { id:'READ.PHON.L01.05', grade:0, name:'Moon and Apple', pic:'🌙', after:'READ.PHON.L01.01', acts:[
      {type:'listen', q:'m', pic:'🌙', hear:'sun, mouse, tiger', o:['☀️','🐭','🐯'], a:'🐭', say:'Eli sees the moon. This letter says mmm. Which starts with mmm?', how:'Say each picture. Do your lips hum mmm at the start?'},
      {type:'findall', q:'a', pic:'🍎', grid:['🐜','🦷','⚓','🐢','🪓','🧦'], find:['🐜','⚓','🪓'], findSay:'picture that starts like apple', say:'This letter starts apple. Tap every picture that starts like apple.', how:'Say each picture. Does it start like apple?'},
      {type:'sort', bins:['m','a'], cards:[['🐭',0],['⚓',1],['🐵',0],['🐜',1],['🧲',0]], say:'Does it start like moon, or like apple? Drag it.', how:'Say the picture slowly. Listen to the first sound.'},
      {type:'findall', grid:['m','n','n','m','n','m'], find:'m', findSay:'letter for mmm, with two humps', mis:true, say:'Careful! The mmm letter has two humps. Tap every one.', how:'Count the humps. Two humps says mmm. One hump does not.'},
      {type:'match', pairs:[['🍄','🌙'],['🚑','🍎']], say:'Match two pictures that start the same.', how:'Say both pictures. Listen to the very first sound.'},
      {type:'listen', hear:'mitten', o:['m','a','n'], a:'m', say:'Last one! Listen to the first sound. Tap its letter.', how:'Say the word slowly. Count the humps on the letter.'}]},

    { id:'READ.PHON.L01.06', grade:0, name:'Sss and Tuh', pic:'🐍', after:'READ.PHON.L01.05', acts:[
      {type:'listen', q:'s', pic:'🐍', hear:'moon, tiger, sun', o:['🌙','🐯','☀️'], a:'☀️', say:'This letter says sss, like snake. Which one starts with sss?', how:'Say each picture. Does it start with a hiss, sss?'},
      {type:'findall', q:'t', pic:'🐯', grid:['🍅','🐭','🚜','🌙','🐵','🚂'], find:['🍅','🚜','🚂'], findSay:'picture that starts with tuh', say:'This letter says tuh, like tiger. Tap pictures that start with tuh.', how:'Say each picture. Does it start like tiger?'},
      {type:'sort', bins:['s','t'], cards:[['🧦',0],['🐢',1],['🥪',0],['⛺',1]], say:'Zeidy asks: sss like snake, or tuh like tiger? Drag it.', how:'Say the picture slowly. Listen to the first sound.'},
      {type:'listen', hear:'sheep, seal, ship', o:['🐑','🦭','🚢'], a:'🦭', mis:true, say:'Careful! Shh is not sss, like snake. Which one starts with sss?', how:'Sss hisses like a snake. Shh is the quiet sound.'},
      {type:'match', pairs:[['🦷','t'],['☀️','s'],['🗺️','m']], say:'Say each picture. Match it to the letter it starts with.', how:'Say the picture. Hear the first sound. Find its letter.'},
      {type:'listen', hear:'table', o:['s','t','m'], a:'t', say:'Last one! Listen to the first sound. Tap its letter.', how:'Say the word slowly. Like snake, tiger, or moon?'}]},

    { id:'READ.PHON.L01.07', grade:0, name:'My First Words', pic:'📖', after:'READ.PA.L01.05', acts:[
      {type:'tiles', q:'am', w:['a','t'], extra:['m'], hear:'at', say:'Shmuli reads am: apple sound, then mmm. Now build this word!', how:'Say it slowly. One tile for each sound, in order.'},
      {type:'listen', hear:'mat', o:['sat','mat','am'], a:'mat', say:'Read each word. Push the sounds together. Tap the one you hear.', how:'Say the sound of each letter. Then say them fast.'},
      {type:'findall', grid:['am','at','am','mat','sat','am'], find:'am', findSay:'word that says am', say:'Read each word. Tap every word that says am.', how:'Look at the first letter, then the last letter.'},
      {type:'listen', hear:'sat', o:['mat','sat','at'], a:'sat', mis:true, say:'Careful! They all end the same. Look at the first letter.', how:'Do not guess from the end. Read every letter, from the start.'},
      {type:'sort', bins:['🟦🟦','🟦🟦🟦'], cards:[['am',0],['sat',1],['at',0],['mat',1]], say:'Read it out loud. One box for each sound. Two or three?', how:'Touch a box for each sound as you read it.'},
      {type:'tiles', w:['s','a','t'], extra:['m'], hear:'sat', say:'Last one! Eli sat down. Listen. Build the word.', how:'First sound, middle sound, last sound. Tap them in order.'}]},

    { id:'READ.FLU.L01.02', grade:0, name:'Heart Words: the, a', pic:'❤️', after:'READ.PHON.L01.07', acts:[
      {type:'findall', q:'the', pic:'❤️', grid:['the','then','that','the','tea','the'], find:'the', findSay:'word that says the', say:'Heart word: the, like the sun. Tap every one.', how:'Check every letter, in the same order as the top word.'},
      {type:'listen', q:'a', pic:'❤️', hear:'a mat', o:['a','the','at'], a:'a', say:'Heart word! Alone, this letter says uh. Tap the word you hear.', how:'Listen for the little word before mat.'},
      {type:'sort', bins:['❤️','🧩'], cards:[['the',0],['sat',1],['a',0],['mat',1],['am',1]], say:'Heart words we just know. Puzzle words we sound out. Which box?', how:'Heart words you know by heart. Puzzle words you sound out.'},
      {type:'tiles', w:['the','mat'], extra:['a','sat'], hear:'the mat', say:'Hop the bunny sits on the mat. Build what you hear.', how:'Which word comes first? Then which word?'},
      {type:'findall', grid:['a','at','am','a','the','a'], find:'a', findSay:'one-letter heart word', mis:true, say:'Careful! Find the heart word that is just one letter.', how:'It is all alone, just one letter. Not at, not am.'},
      {type:'tiles', w:['at','the','mat'], extra:['a','sat'], hear:'at the mat', say:'Last one! Hop sat. Where? Build it.', how:'Listen. Which word comes first? Then next?'}]},

    { id:'WRIT.HAND.L01.05', grade:0, name:'Write m, a, s, t', pic:'✏️', after:'READ.FLU.L01.02', acts:[
      {type:'trace', glyph:'m', name:'letter for mmm', say:'Eli says mmm, like moon. Start at the top. Two humps!', how:'Line down. Go back up and make two humps.'},
      {type:'listen', hear:'ant', o:['a','m','s'], a:'a', say:'What letter starts this word? Tap it. Then we trace it.', how:'Say ant slowly. Listen to the first sound.'},
      {type:'trace', glyph:'a', name:'letter that starts apple', say:'This letter starts apple. Hook on top, down, then a round belly.', how:'Make the hook, go down, then curve a round belly.'},
      {type:'findall', grid:['t','l','t','f','l','t'], find:'t', findSay:'letter for tuh, like tiger', mis:true, say:'Careful! Tuh, like tiger: a cross, no hook on top. Tap each.', how:'Look for a cross and a straight top. A hook on top is a different letter.'},
      {type:'trace', glyph:'s', name:'letter for sss', say:'Say sss, like snake. Start at the top. Curve back, then around.', how:'Make a little curve on top, then curve the other way.'},
      {type:'match', pairs:[['⛺','t'],['🧦','s'],['🐵','m']], say:'Say each picture. Match it to the letter it starts with.', how:'Say the picture. Hear the first sound. Find its letter.'},
      {type:'trace', glyph:'t', name:'letter for tuh', say:'Say tuh, like tiger. Line down, cross it. Show Abba on paper!', how:'Tall line from the top down. Then a short line across.'}]}
  ];
  if (window.TLCORE && TLCORE.k1) K1G.forEach(function (g) { TLCORE.k1.add(g); });
  if (window.TLCORE) TLCORE.add('F', LESSONS, { teach: TEACH, howto: HOWTO, bite: BITE });
})();
</script>
