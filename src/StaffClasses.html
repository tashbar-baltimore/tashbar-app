<script>
/* StaffClasses.html — "🕐 Your Classes & Bucket" on the staff screen (ClassesBucket.js). Added by sgPage_ right after StaffMore.
   A teacher, signed in with his own staff code:
   - says which Teacher Time each of his classes is (Teacher Time 1 1:20-1:55, Teacher Time 2 1:55-2:30, Mon-Thu), and its times if they differ;
   - assigns the work for a day (built lessons and/or his own lessons, for the whole class or chosen boys). Nothing assigned = Independent Study;
   - right now: "Independent Study now", "Free Play", or "Different work now" (a live class, TeacherMode) for the class or chosen boys;
   - changes today's times for one class.
   The Head of School also sets the school's times and the switch (off / test boys only / everyone). No money on this screen. */
(function(){
if(typeof S==='undefined'||typeof render!=='function'||typeof run!=='function') return;
const Y={d:null,cat:null,catMap:{},les:[],sheets:[],err:'',busy:false,edit:null,q:''};
const PER={T1:'Teacher Time 1',T2:'Teacher Time 2',IS:'Independent Study'};
const DOW=['','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const msg=e=>String(e&&e.message||e).replace(/^Error:\s*/,'');
const h12=t=>{ const m=/^(\d\d?):(\d\d)$/.exec(t||''); if(!m) return ''; const h=+m[1]; return (((h+11)%12)+1)+':'+m[2]; };
const dayName=d=>{ try{ const [y,m,dd]=d.split('-').map(Number); const x=new Date(Date.UTC(y,m-1,dd,12)); const t=Y.d&&Y.d.today===d?'Today':x.toLocaleDateString('en-US',{weekday:'long',timeZone:'UTC'}); return t+' '+x.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'}); }catch(e){ return d; } };
const dow=d=>{ try{ const [y,m,dd]=d.split('-').map(Number); return new Date(Date.UTC(y,m-1,dd,12)).getUTCDay()||7; }catch(e){ return 0; } };
try{ if(!document.getElementById('yc-staff-css')){ const s=document.createElement('style'); s.id='yc-staff-css'; s.textContent=`
.ycs{border:1px solid var(--line,#E5E7EB);border-radius:12px;padding:12px 14px;margin:10px 0;background:#fff}
.ycs h4{margin:0 0 4px;font-size:17px}.ycs .soft{color:var(--soft,#6B7280);font-size:14px}.ycs .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.ycs button,.ycp button.q{border:1px solid var(--line,#D1D5DB);background:#fff;border-radius:10px;padding:8px 12px;font:inherit;font-weight:700;cursor:pointer}
.ycs button.on,.ycp button.q.on{background:#EEF2FF;border-color:#6366F1}
.ycs select,.ycs input[type=time],.ycp input[type=time]{border:1px solid #D1D5DB;border-radius:10px;padding:7px 8px;font:inherit}
.ycwork{margin-top:8px;padding:8px 10px;border-radius:10px;background:#F8FAFC;font-size:15px}.ycwork.none{background:#FFFBEB}
.ycsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:6px 0 4px}.ycsum div{border-radius:10px;background:#F1F5F9;padding:8px 10px;font-size:14px}.ycsum b{display:block;font-size:15px}
.ycdays{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.ycp .sxpick{max-height:300px}`; document.head.appendChild(s); } }catch(e){}

const _render=render;
render=function(){ _render.apply(this,arguments);
  try{ const bar=document.querySelector('#app .bar'); if(bar&&!bar.querySelector('[data-yc]')){ const after=bar.querySelector('[data-sx="cls"]')||bar.querySelector('.tmb')||bar.firstChild;
    const html=`<button class="add" data-yc="open">🕐 Your Classes &amp; Bucket</button>`;
    if(after&&after.insertAdjacentHTML) after.insertAdjacentHTML('afterend',html); else bar.insertAdjacentHTML('afterbegin',html); }
    if(S.page==='ycp'){ const a=document.getElementById('app'); if(a) a.insertAdjacentHTML('beforeend',page()); }
  }catch(e){ console.error('StaffClasses',e); } };

function wrap(title,body){ return `<div class="shade" data-act="close"></div><aside class="drawer wide ycp" role="dialog" aria-label="${esc(title)}"><div class="dh"><h2>${esc(title)}</h2><button class="x" data-act="close" aria-label="Close">×</button></div>${body}<div class="err" role="alert">${esc(Y.err)}</div></aside>`; }
function lessonName(id){ if(/^SHEET\./.test(id)){ const w=Y.sheets.find(x=>x.skill===id); return w?w.title+' (worksheet)':'Worksheet'; } if(/^TCH\./.test(id)){ const l=Y.les.find(x=>'TCH.'+x.id===id); return l?l.title+' (my lesson)':id; } return Y.catMap[id]||id; }
function boyName(id){ return (Y.boys&&Y.boys[id])||id; }
function times(c){ const P=Y.d.settings.periods[c.period]; if(!P) return ''; const t=c.today&&c.today.from?c.today:(c.from?c:P); return h12(t.from)+'–'+h12(t.to)+(c.today&&c.today.from?' (changed for today)':c.from?' (this class)':''); }
function page(){ const D=Y.d;
  if(!D) return wrap('🕐 Your Classes & Bucket','<p>Loading…</p>');
  if(Y.edit) return wrap(Y.edit.title,editForm());
  const P=D.settings.periods, live=D.settings.live;
  let h=`<p class="soft" style="color:var(--soft);margin:0 0 6px">Monday to Thursday afternoons. In each Teacher Time a boy can open <b>only</b> what his teacher assigned for that day. If nothing is assigned, he goes to Independent Study.</p>
  <div class="ycsum">${['T1','T2','IS'].map(k=>`<div><b>${PER[k]}</b>${h12(P[k].from)}–${h12(P[k].to)}</div>`).join('')}</div>
  <p style="margin:4px 0 10px;font-size:14px">${live==='on'?'✅ On for every boy who is in a class.':live==='test'?'🧪 On for test boys only (TEST- accounts). Real boys use the app as usual.':'⏸️ Switched off. Every boy uses the app as usual.'}${D.me.head?' <button class="q" data-yc="settings">Change times or switch</button>':''}</p>`;
  if(D.overrides.length) h+=`<div class="sec"><h3>Right now</h3>${D.overrides.map(o=>`<div class="fix"><span><b>${o.mode==='free'?'🎈 Free Play':'📚 Independent Study now'}</b>${o.cls?' · '+esc(o.cls):''} · ${o.sids.length} boy${o.sids.length===1?'':'s'} · until ${esc(clock(o.until))}<br><small style="color:var(--soft)">${o.sids.map(boyName).map(esc).join(', ')}</small></span><button data-yc="endov" data-id="${esc(o.id)}">End</button></div>`).join('')}</div>`;
  h+=`<div class="ycs"><h4>📝 Worksheets</h4><div class="soft">Upload a worksheet (a PDF or a photo) or write one here. The boys write, draw and type right on it, then hand it in. Assign it like a lesson, or put it in a bucket.</div>
  <div class="row"><button data-yc="upload">⬆️ Upload a worksheet</button><button data-yc="write">✍️ Write a worksheet</button><button data-sx="les">📝 Build a quiz lesson</button></div>
  ${Y.sheets.filter(w=>w.mine).slice(0,30).map(w=>`<div class="fix"><span><b>${esc(w.title)}</b> <small style="color:var(--soft)">· ${w.pages} page${w.pages===1?'':'s'}${w.kind==='text'?' · written here':''}</small></span><span><button class="q" data-yc="work" data-id="${esc(w.id)}">See their work</button> <button class="q" data-yc="delsheet" data-id="${esc(w.id)}">Remove</button></span></div>`).join('')}</div>`;
  h+=`<div class="ycs"><h4>🔑 Who gets what, when</h4><div class="soft">During the afternoon everything is shut except class work and the bucket. Open parts of the app for your boys at set times (for example: after 3:00, boys who finished their core get the Canteen and Chavrusa duels). You can also take something away from one boy until a day you pick.</div><div class="row"><button data-yc="acc">Open the panel</button></div></div>`;
  h+=`<div class="ycs"><h4>📚 Independent Study buckets</h4><div class="soft">Each boy's daily list for Independent Study: core things he must do (any order), then add-ons (electives, trades, extras) that open once his core is done. It stays the same every day until you change it.</div><div class="row"><button data-yc="bkt">Set up buckets</button></div></div>`;
  if(!D.classes.length) h+=`<div class="ycs"><h4>You have no classes yet</h4><p class="soft">Make a class first (its name, subject and boys), then come back here to say which Teacher Time it is.</p><div class="row"><button data-sx="cls">👥 Make a class</button></div></div>`;
  h+=D.classes.map(c=>{ const todayW=c.assigned.find(a=>a.date===D.today), next=c.assigned.filter(a=>a.date>D.today);
    const work=!c.period?`<div class="ycwork none">Not in the afternoon schedule. Pick Teacher Time 1 or 2 to use it.</div>`:
      `<div class="ycwork${todayW?'':' none'}"><b>Today:</b> ${todayW?todayW.skills.map(s=>esc(todayW.names[s]||lessonName(s))).join(' · ')+(todayW.sids.length?` <span class="soft">(for ${todayW.sids.length} chosen boy${todayW.sids.length===1?'':'s'})</span>`:''):'nothing assigned, so the boys get Independent Study.'}${next.length?`<br><b>Coming up:</b> ${next.map(a=>esc(dayName(a.date))).join(', ')}`:''}</div>`;
    return `<div class="ycs"><h4>${esc(c.name)}</h4><div class="soft">${esc(c.subject||'')} · ${c.sids.length} boy${c.sids.length===1?'':'s'}${c.period?' · '+PER[c.period]+' '+esc(times(c)):''}</div>
    <div class="row"><label>Which class time: <select data-yc="period" data-id="${esc(c.id)}"><option value="">Not in the afternoon</option><option value="T1" ${c.period==='T1'?'selected':''}>Teacher Time 1</option><option value="T2" ${c.period==='T2'?'selected':''}>Teacher Time 2</option></select></label></div>
    ${work}
    ${c.period?`<div class="row"><button data-yc="assign" data-id="${esc(c.id)}">📝 Assign work</button><button data-yc="times" data-id="${esc(c.id)}">🕐 Change times</button></div>
    <div class="row"><span class="soft">Right now:</span><button data-yc="now" data-mode="IS" data-id="${esc(c.id)}">📚 Independent Study now</button><button data-yc="now" data-mode="free" data-id="${esc(c.id)}">🎈 Free Play</button><button data-yc="now" data-mode="work" data-id="${esc(c.id)}">🔁 Different work now</button></div>`:''}</div>`; }).join('');
  return wrap('🕐 Your Classes & Bucket',h); }

/* ---------- forms ---------- */
function boysPick(c,sel){ return `<div class="tmboys"><button class="${!sel.length?'on':''}" data-yc="allboys">${!sel.length?'✓ ':''}The whole class</button>${c.sids.map(id=>`<button class="${sel.includes(id)?'on':''}" data-yc="boy" data-id="${esc(id)}">${sel.includes(id)?'✓ ':''}${esc(boyName(id))}</button>`).join('')}</div>`; }
function lessonPick(sk){ const q=Y.q.toLowerCase(), mine=Y.sheets.map(w=>w.skill).concat(Y.les.map(l=>'TCH.'+l.id)), all=(Y.cat||[]).map(x=>x[0]);
  const list=mine.concat(all.filter(id=>!q||lessonName(id).toLowerCase().includes(q)||id.toLowerCase().startsWith(q)).slice(0,150));
  return `<div class="sxchips">${sk.length?sk.map(id=>`<span>${esc(lessonName(id))}</span>`).join(''):'<span>No lessons picked yet</span>'}</div>
  <div class="sxf"><label>Find a lesson<input id="yc-q" value="${esc(Y.q)}" placeholder="Type a subject or lesson name"></label></div>
  <div class="sxpick">${list.map(id=>`<button class="${sk.includes(id)?'on':''}" data-yc="pick" data-id="${esc(id)}">${sk.includes(id)?'✓ ':''}${esc(lessonName(id))} <small style="color:var(--soft)">${/^TCH\./.test(id)?'My lesson':/^SHEET\./.test(id)?'📝 Worksheet':''}</small></button>`).join('')}</div>`; }
function editForm(){ const E2=Y.edit, c=Y.d.classes.find(x=>x.id===E2.id)||{sids:[]};
  if(E2.kind==='assign'){ const days=Y.d.days.filter(d=>Y.d.settings.days.includes(dow(d)));
    return `<p class="soft" style="color:var(--soft)">${esc(c.name)} · ${PER[c.period]}. Pick the day and the lessons. During ${PER[c.period]} that day, these boys can open only these lessons. You can upload sheets and build worksheets here soon.</p>
    <div class="sec"><h3>Which day</h3><div class="ycdays">${days.map(d=>`<button class="q ${d===E2.date?'on':''}" data-yc="day" data-d="${d}">${esc(dayName(d))}</button>`).join('')}</div></div>
    <div class="sec"><h3>Lessons</h3>${lessonPick(E2.skills)}</div>
    <div class="sec"><h3>For which boys</h3>${boysPick(c,E2.sids)}</div>
    <button class="big a" data-yc="saveassign" ${Y.busy?'disabled':''}>${E2.skills.length?'Assign':'Save (nothing assigned = Independent Study)'}</button> <button class="q" data-yc="cancel">Cancel</button>`; }
  if(E2.kind==='times'){ const P=Y.d.settings.periods[c.period];
    return `<p class="soft" style="color:var(--soft)">${esc(c.name)} · ${PER[c.period]}. The school's time is ${h12(P.from)}–${h12(P.to)}.</p>
    <div class="sec"><h3>Today only</h3><div class="row" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input type="time" id="yc-tf" value="${esc(c.today&&c.today.from||'')}"> to <input type="time" id="yc-tt" value="${esc(c.today&&c.today.to||'')}">
    <button class="q" data-yc="savetoday">Save for today</button>${c.today?'<button class="q" data-yc="cleartoday">Back to the usual time</button>':''}</div></div>
    <div class="sec"><h3>Every day (this class's usual time)</h3><div class="row" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input type="time" id="yc-uf" value="${esc(c.from||'')}"> to <input type="time" id="yc-ut" value="${esc(c.to||'')}">
    <button class="q" data-yc="saveusual">Save as usual time</button>${c.from?'<button class="q" data-yc="clearusual">Use the school\'s time</button>':''}</div></div>
    <button class="q" data-yc="cancel">Done</button>`; }
  if(E2.kind==='now'){ const work=E2.mode==='work';
    return `<p class="soft" style="color:var(--soft)">${esc(c.name)}. ${work?'Until the time is up, these boys can open only the lessons you pick now.':E2.mode==='free'?'Free Play: these boys can use the whole app as usual until the time is up.':'These boys go to Independent Study until the time is up.'}</p>
    ${work?`<div class="sec"><h3>Lessons</h3>${lessonPick(E2.skills)}</div>`:''}
    ${work?'':`<div class="sec"><h3>For which boys</h3>${boysPick(c,E2.sids)}</div>`}
    <div class="sec"><h3>How long</h3><div class="tmmins">${[10,20,30,45,60].map(m=>`<button class="${m===E2.min?'on':''}" data-yc="min" data-m="${m}">${m} min</button>`).join('')}</div></div>
    <button class="big a" data-yc="savenow" ${Y.busy||(work&&!E2.skills.length)?'disabled':''}>Start now</button> <button class="q" data-yc="cancel">Cancel</button>`; }
  if(E2.kind==='upload') return `<p class="soft" style="color:var(--soft)">A PDF (up to 20 pages), or photos of the pages (JPG or PNG; pick them in order). Each page becomes a page the boys can write on.</p>
    <div class="sxf"><label>Title<input id="yc-st" value="${esc(E2.stitle||'')}" maxlength="80" placeholder="For example: Fractions practice, page 42"></label>
    <label>The file<input type="file" id="yc-file" accept="application/pdf,image/jpeg,image/png" multiple></label></div>
    ${E2.prog?`<p><b>${esc(E2.prog)}</b></p>`:''}
    <button class="big a" data-yc="doupload" ${Y.busy?'disabled':''}>Upload</button> <button class="q" data-yc="cancel">Cancel</button>`;
  if(E2.kind==='write') return `<p class="soft" style="color:var(--soft)">Write one question on each line. The app makes a clean worksheet (8 questions a page) with room under each question. The boys write or type their answers on it.</p>
    <div class="sxf"><label>Title<input id="yc-wt" value="${esc(E2.wtitle||'')}" maxlength="80" placeholder="For example: Parshas Vayeitzei review"></label>
    <label>Questions (one on each line, up to 40)<textarea id="yc-wl" rows="10" placeholder="Who did Yaakov meet at the well?&#10;Draw the ladder in Yaakov's dream.">${esc(E2.wlines||'')}</textarea></label></div>
    <button class="big a" data-yc="dowrite" ${Y.busy?'disabled':''}>Make the worksheet</button> <button class="q" data-yc="cancel">Cancel</button>`;
  if(E2.kind==='work'){ const W=E2.w; if(!W) return '<p>Loading…</p>';
    return `<p class="soft" style="color:var(--soft)">${esc(W.sheet.title)} · ${W.sheet.pages} page${W.sheet.pages===1?'':'s'}. Tap a boy to see his sheet.</p>
    ${W.boys.length?W.boys.map(b=>`<div class="fix"><span><b>${esc(b.name)}</b> <small style="color:var(--soft)">· ${b.status==='handed'?'✅ handed in':'✏️ working'} · ${esc(clock(b.at))}</small></span><span><button class="q" data-yc="seeone" data-sid="${esc(b.sid)}">See his sheet</button>${b.status==='handed'?` <button class="q" data-yc="reopen" data-sid="${esc(b.sid)}">Let him fix it</button>`:''}</span></div>`).join(''):'<p class="soft" style="color:var(--soft)">No boy has started it yet.</p>'}
    <button class="q" data-yc="cancel">Done</button>`; }
  if(E2.kind==='one'){ return `<p class="soft" style="color:var(--soft)">${esc(E2.name)} · ${E2.a?(E2.a.status==='handed'?'handed in':'still working'):''}</p><div id="yc-view">${E2.a?'':'<p>Loading…</p>'}</div>
    <div class="row" style="margin-top:10px"><button class="q" data-yc="backwork">‹ Back to the list</button></div>`; }
  if(E2.kind==='bkt'){ const BK=Y.bk; if(!BK) return '<p>Loading…</p>';
    const q=(E2.bq||'').toLowerCase(), boys=BK.boys.filter(b=>!q||b.name.toLowerCase().includes(q)).slice(0,200);
    const sum=id=>{ const b=BK.buckets[id]; return b?`${b.core.length} core${b.addons.length?' · '+b.addons.length+' add-on'+(b.addons.length===1?'':'s'):''}`:'no bucket'; };
    const lineList=(arr,part)=>arr.length?arr.map((x,i)=>`<div class="fix"><span>${x.t==='subj'?'🎯 ':x.t==='sheet'?'📝 ':'📘 '}${esc(x.t==='subj'||x.t==='sheet'?x.name:(Y.catMap[x.id]||x.name||x.id))}</span><button class="q" data-yc="bdel" data-part="${part}" data-i="${i}">Remove</button></div>`).join(''):`<p class="soft" style="color:var(--soft)">${part==='core'?'Nothing yet. Add 3 to 6 things he must do.':'No add-ons yet (optional).'}</p>`;
    const adder=part=>`<div class="ycdays">${BK.subjects.map(x=>`<button class="q" data-yc="badd" data-part="${part}" data-k="${esc(x.k)}">+ ${esc(x.name)}</button>`).join('')}</div>`;
    const ls=(E2.lq||'').toLowerCase(), found=ls.length>1?(Y.cat||[]).filter(x=>x[1].toLowerCase().includes(ls)||x[0].toLowerCase().startsWith(ls)).slice(0,40):[];
    return `<p class="soft" style="color:var(--soft)">1. Pick the boys (one boy, or a whole level group). 2. Build the list. 3. Save: every boy you picked gets this same list. Picking one boy shows his list now.</p>
    <div class="sec"><h3>1. Boys (${E2.sids.length} picked)</h3><div class="sxf"><label>Find a boy<input id="yc-bq" value="${esc(E2.bq||'')}" placeholder="Type a name"></label></div>
    <div class="tmboys">${boys.map(b=>`<button class="${E2.sids.includes(b.id)?'on':''}" data-yc="bboy" data-id="${esc(b.id)}">${E2.sids.includes(b.id)?'✓ ':''}${esc(b.name)} <small style="color:var(--soft)">· ${esc(sum(b.id))}</small></button>`).join('')}</div></div>
    <div class="sec"><h3>2. Core (must do, any order)</h3>${lineList(E2.core,'core')}<div class="soft" style="margin-top:6px">Add a subject at his own level (he gets his next lesson there):</div>${adder('core')}</div>
    <div class="sec"><h3>Add-ons (open after the core)</h3>${lineList(E2.addons,'addons')}${adder('addons')}</div>
    ${Y.sheets.length?`<div class="sec"><h3>Or add a worksheet</h3>${Y.sheets.slice(0,30).map(w=>`<div class="fix"><span>📝 ${esc(w.title)}</span><span><button class="q" data-yc="bsheet" data-part="core" data-id="${esc(w.id)}">+ Core</button> <button class="q" data-yc="bsheet" data-part="addons" data-id="${esc(w.id)}">+ Add-on</button></span></div>`).join('')}</div>`:''}
    <div class="sec"><h3>Or add one exact lesson</h3><div class="sxf"><label>Find a lesson<input id="yc-lq" value="${esc(E2.lq||'')}" placeholder="Type at least 2 letters"></label></div>
    ${found.length?`<div class="sxpick">${found.map(x=>`<div class="fix"><span>${esc(x[1])}</span><span><button class="q" data-yc="blesson" data-part="core" data-id="${esc(x[0])}">+ Core</button> <button class="q" data-yc="blesson" data-part="addons" data-id="${esc(x[0])}">+ Add-on</button></span></div>`).join('')}</div>`:''}</div>
    <button class="big a" data-yc="savebkt" ${Y.busy||!E2.sids.length?'disabled':''}>${E2.core.length?'Save for '+E2.sids.length+' boy'+(E2.sids.length===1?'':'s'):'Take the bucket away from '+E2.sids.length+' boy'+(E2.sids.length===1?'':'s')}</button> <button class="q" data-yc="cancel">Cancel</button>`; }
  if(E2.kind==='acc'){ const A2=Y.acc; if(!A2) return '<p>Loading…</p>';
    const dn=id=>{ const d=A2.doors.find(x=>x.id===id); return d?d.icon+' '+d.name:id; }, DY=['','Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const who=r=>r.classId?(r.cls||'a class'):(r.sids.length+' boy'+(r.sids.length===1?'':'s'));
    let h2=`<div class="sec"><h3>Opening times</h3>`;
    h2+=A2.rules.length?A2.rules.map(r=>`<div class="fix"><span><b>${esc(h12(r.from))}–${esc(h12(r.to))}</b> ${esc((r.days||[]).map(d=>DY[d]).join(' '))} · ${esc(who(r))}${r.when==='core'?' · <b>after their core is done</b>':''}<br><small style="color:var(--soft)">${r.doors.map(dn).map(esc).join(' · ')} · by ${esc(r.by)}</small></span>${r.mine||Y.d.me.head?`<span><button class="q" data-yc="editrule" data-id="${esc(r.id)}">Change</button> <button class="q" data-yc="delrule" data-id="${esc(r.id)}">Remove</button></span>`:''}</div>`).join(''):'<p class="soft" style="color:var(--soft)">No opening times yet. In the afternoon, only class work and the bucket are open.</p>';
    h2+=`<div class="row"><button class="q" data-yc="newrule">+ New opening time</button></div></div>`;
    h2+=`<div class="sec"><h3>Taken away</h3>`;

/* ---------- worksheets: pages to pictures, upload, and the teacher's view of a boy's sheet ---------- */
const PW=1000, PH=1294, U=10000;
function textPage(sh,i){ const c=document.createElement('canvas'); c.width=PW; c.height=PH; const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,PW,PH);
  let y=70; if(i===0){ g.fillStyle='#111827'; g.font='bold 40px Barlow,Arial,sans-serif'; g.fillText(String(sh.title).slice(0,60),60,y+10); y+=50; g.strokeStyle='#CBD5E1'; g.lineWidth=2; g.beginPath(); g.moveTo(60,y); g.lineTo(PW-60,y); g.stroke(); y+=40; }
  const L=(sh.lines||[]).slice(i*8,i*8+8); g.font='26px Barlow,Arial,sans-serif';
  L.forEach((t,j)=>{ g.fillStyle='#111827'; const words=(i*8+j+1)+'. '+t, out=[]; let line='';
    words.split(' ').forEach(w=>{ const tr=line?line+' '+w:w; if(g.measureText(tr).width>PW-120){ out.push(line); line=w; } else line=tr; }); out.push(line);
    out.slice(0,3).forEach(l=>{ g.fillText(l,60,y); y+=34; }); g.strokeStyle='#E2E8F0'; g.lineWidth=2; for(let k=0;k<2;k++){ y+=36; g.beginPath(); g.moveTo(80,y); g.lineTo(PW-60,y); g.stroke(); } y+=44; });
  return c.toDataURL('image/png'); }
function toJpeg(src,maxW){ return new Promise((ok,no)=>{ const im=new Image(); im.onload=()=>{ const sc=Math.min(1,maxW/im.width), c=document.createElement('canvas'); c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc);
  const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height); let q=0.85, d=c.toDataURL('image/jpeg',q); while(d.length>1.8e6&&q>0.4){ q-=0.15; d=c.toDataURL('image/jpeg',q); } ok(d); }; im.onerror=()=>no(new Error('That picture could not be opened. Please use a JPG or PNG photo.')); im.src=src; }); }
const readUrl=f=>new Promise((ok,no)=>{ const r=new FileReader(); r.onload=()=>ok(r.result); r.onerror=()=>no(new Error('That file could not be read.')); r.readAsDataURL(f); });
function pdfLib(){ if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib); return new Promise((ok,no)=>{ const s=document.createElement('script'); s.src='/vendor/pdf.min.js'; s.onload=()=>{ if(!window.pdfjsLib) return no(new Error('The PDF reader did not load.')); window.pdfjsLib.GlobalWorkerOptions.workerSrc='/vendor/pdf.worker.min.js'; ok(window.pdfjsLib); }; s.onerror=()=>no(new Error('The PDF reader did not load. Try photos of the pages instead.')); document.head.appendChild(s); }); }
async function pdfPages(file){ const lib=await pdfLib(), doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise, out=[];
  if(doc.numPages>20) throw new Error('That PDF has '+doc.numPages+' pages. A worksheet can have up to 20.');
  for(let i=1;i<=doc.numPages;i++){ const pg=await doc.getPage(i), v0=pg.getViewport({scale:1}), v=pg.getViewport({scale:Math.min(2.5,1600/v0.width)}), c=document.createElement('canvas'); c.width=Math.round(v.width); c.height=Math.round(v.height);
    const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); await pg.render({canvasContext:g,viewport:v}).promise; out.push(await toJpeg(c.toDataURL('image/png'),1600)); }
  return out; }
async function doUpload(E2,files){ Y.err=''; if(!String(E2.stitle||'').trim()){ Y.err='Give the worksheet a title.'; return render(); } if(!files.length){ Y.err='Pick the file first.'; return render(); }
  Y.busy=true; E2.prog='Getting the pages ready…'; render();
  try{ let pages=[]; const pdf=files.find(f=>/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name));
    if(pdf) pages=await pdfPages(pdf); else { for(const f of files.slice(0,20)){ if(!/^image\/(jpeg|png)$/.test(f.type)) throw new Error(f.name+': please use a PDF, JPG or PNG.'); pages.push(await toJpeg(await readUrl(f),1600)); } }
    const n=await run('ycSheetNew',S.token,{title:E2.stitle,kind:'pages'});
    for(let i=0;i<pages.length;i++){ E2.prog='Uploading page '+(i+1)+' of '+pages.length+'…'; render(); await run('ycSheetPage',S.token,n.id,i,pages[i]); }
    Y.sheets=await run('ycSheetReady',S.token,n.id,pages.length); Y.busy=false; Y.edit=null; render(); toast('Uploaded. Assign it to a class or put it in a bucket.');
  }catch(e){ Y.busy=false; E2.prog=''; Y.err=msg(e); render(); } }
async function showWork(a2){ const box=document.getElementById('yc-view'); if(!box||!a2) return; const sh=a2.sheet, work=a2.work||{pages:[]}; box.innerHTML='';
  for(let i=0;i<(sh.pages||1);i++){ let src; try{ src=sh.kind==='text'?textPage(sh,i):await run('ycSheetImg',S.token,sh.id,i); }catch(e){ box.insertAdjacentHTML('beforeend','<p>Page '+(i+1)+' did not load.</p>'); continue; }
    const im=await new Promise(ok=>{ const x=new Image(); x.onload=()=>ok(x); x.onerror=()=>ok(null); x.src=src; }); if(!im) continue;
    const c=document.createElement('canvas'); c.width=im.width; c.height=im.height; c.style.cssText='width:100%;border:1px solid #E5E7EB;border-radius:6px;margin:6px 0;background:#fff'; const g=c.getContext('2d'); g.drawImage(im,0,0); const f=c.width/U, p=(work.pages||[])[i]||{s:[],t:[]};
    g.lineCap='round'; g.lineJoin='round'; (p.s||[]).forEach(st=>{ g.strokeStyle=st.c; g.lineWidth=Math.max(1.5,st.w*f); g.beginPath(); g.moveTo(st.p[0]*f,st.p[1]*f); if(st.p.length===2) g.lineTo(st.p[0]*f+0.1,st.p[1]*f); for(let j=2;j<st.p.length;j+=2) g.lineTo(st.p[j]*f,st.p[j+1]*f); g.stroke(); });
    g.fillStyle='#1E3A8A'; g.font='600 '+Math.round(18*c.width/900)+'px Barlow,Arial,sans-serif'; (p.t||[]).forEach(t=>{ String(t.v||'').split('\n').forEach((l,k)=>g.fillText(l,t.x*f+6,t.y*f+Math.round(22*c.width/900)*(k+1))); });
    box.appendChild(c); } }

  if(a==='backacc'){ Y.edit={kind:'acc',title:'🔑 Who gets what, when'}; return render(); }
  if(a==='newrule'){ const c=(Y.acc.classes[0]||{}).id||''; Y.edit={kind:'rule',title:'New opening time',r:{doors:[],days:[1,2,3,4],from:'15:00',to:'15:30',when:'core',classId:c,sids:[]}}; return render(); }
  if(a==='editrule'){ const r=Y.acc.rules.find(x=>x.id===id); if(r) Y.edit={kind:'rule',title:'Change opening time',r:{id:r.id,doors:r.doors.slice(),days:(r.days||[1,2,3,4]).slice(),from:r.from,to:r.to,when:r.when,classId:r.classId,sids:r.sids.slice()}}; return render(); }
  const tog=(arr,v)=>{ const i=arr.indexOf(v); if(i<0) arr.push(v); else arr.splice(i,1); };
  if(E2&&E2.kind==='rule'){ const R=E2.r, keep=()=>{ const f=document.getElementById('yc-rf'), t=document.getElementById('yc-rt'); if(f) R.from=f.value; if(t) R.to=t.value; };
    if(a==='rdoor'){ keep(); tog(R.doors,id); return render(); } if(a==='rday'){ keep(); tog(R.days,+b.dataset.d); return render(); } if(a==='rwhen'){ keep(); R.when=b.dataset.v; return render(); }
    if(a==='rcls'){ keep(); R.classId=id; return render(); } if(a==='rboy'){ keep(); tog(R.sids,id); return render(); }
    if(a==='saverule'){ keep(); return act('ycSaveRule',[R],r=>{ Y.acc=r; Y.edit={kind:'acc',title:'🔑 Who gets what, when'}; toast('Saved.'); }); } }
  if(a==='delrule'){ if(!confirm('Remove this opening time?')) return; return act('ycDeleteRule',[id],r=>{ Y.acc=r; }); }
  if(a==='newnox'){ Y.edit={kind:'nox',title:'Take something away',n:{sids:[],doors:[],days:1,why:''}}; return render(); }
  if(E2&&E2.kind==='nox'){ const N=E2.n, keep=()=>{ const w=document.getElementById('yc-nwhy'); if(w) N.why=w.value; };
    if(a==='nboy'){ keep(); tog(N.sids,id); return render(); } if(a==='ndoor'){ keep(); tog(N.doors,id); return render(); } if(a==='ndays'){ keep(); N.days=+b.dataset.v; return render(); }
    if(a==='savenox'){ keep(); const d=new Date(); d.setDate(d.getDate()+N.days); d.setHours(7,0,0,0); return act('ycTakeAway',[{sids:N.sids,doors:N.doors,until:d.getTime(),why:N.why}],r=>{ Y.acc=r; Y.edit={kind:'acc',title:'🔑 Who gets what, when'}; toast('Taken away.'); }); } }
  if(a==='giveback') return act('ycGiveBack',[id],r=>{ Y.acc=r; toast('Given back.'); });
  if(a==='settings'){ Y.edit={kind:'settings',title:'School afternoon schedule',s:JSON.parse(JSON.stringify(Y.d.settings))}; return render(); }
  if(a==='live'&&E2){ E2.s.live=b.dataset.v; return render(); }
  if(a==='savesettings'&&E2) return act('ycSaveSettings',[{live:E2.s.live,periods:E2.s.periods}],()=>{ Y.edit=null; toast('Saved.'); load(); });
},true);
})();
</script>
