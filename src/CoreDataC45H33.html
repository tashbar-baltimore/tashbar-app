(function () {
  var P = {
    c45h3_b2c8: { title: 'Lost on the Ridge Trail, Chapter 8 in Short', text: 'Chapter 8 is Tzvi Hirsch\'s own account, written in his camp notebook the night after. He says he can only tell what he saw and heard and felt.\nHe tells how Scout knocked him over and licked his face, how Ranger Morales radioed "Found. Both boys. Both okay," and how the walk down took more than an hour. He tells how Reb Akiva hugged them, and how his mother cried on the phone.\nHe writes what he learned: when you are lost, you stop; Avrumi is braver than he thinks; and you can be scared and still do the right thing. He ends with a question he cannot answer: how did the searchers know to look on the west side of the ridge?' },
    c45h3_b2k8: { title: 'From Nosson\'s Notebook, Monday Night', text: 'I could not sleep. I kept thinking about the red cap. I saw it fly over the edge on the left side of the trail, but I did not see where the boys went after it. Reb Akiva told me that what I saw helped the rangers. I hope he is right.\nI do not know if Tzvi Hirsch and Avrumi are warm tonight. I do not know if they found any water. I only know that I said Tehillim for them twice, and that Dovid is still awake in the bunk above me.' },
    c45h3_b2c9: { title: 'Lost on the Ridge Trail, Chapter 9 in Short', text: 'Chapter 9 goes back to Monday and follows Reb Akiva. When he counted eight boys, not ten, Nosson told him he saw the red cap blow off to the west. Reb Akiva took the eight boys safely down and called for help.\nRanger Morales and his dog Scout began the search on the west slope. The whole camp said Tehillim. At night, a searcher named Carl heard faint whistle blasts, three at a time, but it was too dark and steep to climb. At dawn, a drone flew over the slope while Dovid watched the screen, and they saw the stone arrow and the orange poncho.\nOn Wednesday, the camp newspaper printed an article by a boy who slept through the whole night. It said the boys wandered for miles.' },
    c45h3_b2k9: { title: 'Two Accounts of the Rope Pull', text: 'A LETTER HOME FROM MENDY: Dear Abba and Ima, today was the big rope pull. I was third on the rope. My hands burned, and my feet slid in the mud, but we held on, and Bunk Daled won! I could hardly lift my fork at supper.\nFROM THE PINE LAKE RIPPLE, by Shmuly Rosen, who was at the dentist that day: Bunk Daled won the rope pull on Tuesday. Campers say it lasted more than an hour. Everyone cheered.' },
    c45h3_b2c10: { title: 'Lost on the Ridge Trail, Chapter 10 in Short', text: 'At the campfire, Tzvi Hirsch read the line from the camp newspaper that said they wandered for miles. "That\'s not what happened," he said. He told the true story: he ran after his cap without thinking, Avrumi followed him, and Avrumi said "Stop." They stayed in one spot all night, and that is why they were found.\nThen Avrumi said Tzvi Hirsch left something out: he admitted he was scared, he stopped himself twice, and the orange poncho was his idea. Ranger Morales taught the whole camp four words: Stop. Stay. Signal. Wait. Then he held up the red cap that Scout had found.\nOn Friday, Gold\'s Bakery sent rugelach for the whole camp. Avrumi drew a new map and marked one spot: "Where we stayed put. Together."' },
    c45h3_b2k10: { title: 'Two Accounts of the Rugelach', text: 'A NOTE FROM RABBI WEISS TO THE GOLD FAMILY: Thank you for the beautiful box of rugelach that arrived on Friday. Every camper and counselor had a piece at the oneg Shabbos. We are so grateful that the boys are safe.\nA LETTER HOME FROM DOVID: Dear Abba, a giant box came on Friday from Gold\'s Bakery! I ate four rugelach, two chocolate and two raspberry. Tzvi Hirsch called them "thank-you rugelach." I think they were the best thing that happened all summer, except the boys coming back.' },
    c45h3_b5c8: { title: 'Shabbos at the Lighthouse, Chapter 8 in Short', text: 'In the old log, the boys find a pencil note: "S.G. 1971. This light saved my life." S.G. is Shimon Gold. On Shabbos afternoon, Reb Shimon tells his own story.\nIn 1971 he was nineteen, working in the hot engine room of a cargo ship, the Atlantic Star. He loved the engines; they were like a great, beating heart. One October night a thick fog came, the radar was broken, and the captain guessed wrong about where they were. Down below, Reb Shimon did not know any of this. He only knew the men on deck were very quiet.\nThen the lookout heard the Kettle Shoal bell and saw its flash. The captain turned hard and called for full reverse, and Reb Shimon pulled the lever with shaking hands. The ship missed the shoal. Thirty-two men went home.\nHis father taught him: if someone does good for you, even if he never knows it, you owe him gratitude. So Reb Shimon cares for the light. "It is an old friend," he says.' },
    c45h3_b5k8: { title: 'My First Night Watch (from a young sailor\'s diary, 1958)', text: 'Tonight the captain trusted me with the night watch for the first time. I stood on the deck alone from midnight to four, with only the stars and the hum of the engines for company. I told myself I was not nervous, but my coffee went cold because I forgot to drink it.\nAt two o\'clock I saw a light flashing far off to the west. My heart jumped. I counted: one flash every ten seconds. I checked the chart with my flashlight. It was Sandy Point Light, right where it should be. I let out my breath.\nI think the cook was worried about me, because a warm biscuit appeared next to my elbow at three. I never saw who left it.' },
    c45h3_b5c9: { title: 'Shabbos at the Lighthouse, Chapter 9 in Short', text: 'After Havdalah, Captain Ray Turner and his son Cody climb up to thank the boys. The captain tells Friday night his way.\nHe stayed out too late fishing. At about 8:30 his engine quit, and the wind pushed the Miss Ellie toward the shoal. He looked for the light he had seen all his life, and it was gone. He was scared, and he tried not to let Cody see it. Cody put on his life jacket, and the captain called the Coast Guard.\nThen he saw one white flash, and another six seconds later: Kettle Shoal. Now he knew where he was. He dropped the anchor, and it caught. When the rescue boat came, a huge wave knocked the boat on its side and smashed the green light, but the boat came back up, and Cody was taken aboard first.\nAt the door, the captain says the light came back at 9:30. But Reb Shimon\'s log says 9:15.' },
    c45h3_b5k9: { title: 'The Bakery Van, Told Twice', text: 'TOLD BY TZVI HIRSCH: The snow was coming down hard, and Abba was late with the Friday deliveries. I watched from the bakery window. When the van finally turned the corner, I cheered so loudly that the twins woke up. Abba looked calm when he walked in, like it was nothing.\nTOLD BY ABBA: The snow was coming down hard, and I was late with the Friday deliveries. The van slid twice on Park Heights Avenue, and my hands were tight on the wheel the whole way. When I turned the corner, I saw a small face pressed to the bakery window. I made my face calm before I walked in, so nobody would worry.' },
    c45h3_b5c10: { title: 'Shabbos at the Lighthouse, Chapter 10 in Short', text: 'On Sunday, the six boys of the crew sit in the back room of Gold\'s Bakery with four accounts of Friday night: the Bay Courier newspaper story, a short Coast Guard report, Reb Shimon\'s log, and what Captain Turner told them. Avrumi draws a chart with a column for each account.\nAll four agree that the light went out, a backup lamp was lit, the engine failed and the father and son are safe. But they differ on times. The Coast Guard and the log say the backup lamp was lit at 9:15 and the rescue was at 9:46. The newspaper says about 10:00, and that the light was out "almost an hour." The newspaper does not mention the boys at all; it is not exactly wrong, but it leaves things out.\nBinyamin thinks the captain may not have seen the dimmer lamp through the rain until 9:30. So both can be true: each one is telling what he saw, from where he was.' },
    c45h3_b5k10: { title: 'The Science Fair Fire Alarm: Three Accounts', text: 'ACCOUNT A, from Dovid\'s notebook: At 10:15 the fire alarm went off during the science fair. I was standing at my table. We walked out the side door in two lines. It was a false alarm; the toaster in the teachers\' room burned a bagel. We were back inside by 10:30.\nACCOUNT B, from the school newsletter, written on Monday by a parent who heard about it: On Thursday, the science fair was interrupted when an alarm went off. Students left the building quickly and safely. The fair went on after a short break.\nACCOUNT C, from Mr. Halpern: At 10:12 the alarm sounded. I counted every boy at the side door. All were present. We returned at 10:31.' },
    c45h3_b5c11: { title: 'Shabbos at the Lighthouse, Chapter 11 in Short', text: 'On Wednesday the six boys go out to the lighthouse. Reb Shimon opens the old log to February 7, 1904, the day of the Great Baltimore Fire. Yehuda and Avrumi know the fire well: it burned more than fifteen hundred buildings and stopped at the Jones Falls.\nThe keeper wrote only twelve words: "A great red glow to the northwest all night. Baltimore is burning." From five miles out in the water, he could see only the glow. He could not see the streets, the fire engines or the people, so he wrote what he saw and guessed what it meant.\nThe newspapers that week wrote fast, from what firemen and shopkeepers told them, and some first stories were wrong. Tzvi Hirsch sums it up: each account is different because of who wrote it, where he was standing, what he could see and why he was writing it. So the boys decide the museum wall should show every account side by side.' },
    c45h3_b5k11: { title: 'Two Accounts of the Storm of 1933', text: 'From the Baltimore paper, August 23, 1933: The worst storm in memory struck the city last night. Streets downtown were under water, and frightened families fled their homes. Our reporter, writing from the newspaper office, heard the wind howl like a freight train until dawn.\nFrom a letter by Captain Elias Ward, master of the steamer Dorothy, written to his son: We rode out the storm at anchor in the bay, ten miles south of the city. The waves broke over the bow all night, but the old ship held. I saw no lights from Baltimore at all. I write this so that you will know your father is safe, and not to worry.' },
    c45h3_b5c12: { title: 'Shabbos at the Lighthouse, Chapter 12 in Short', text: 'Three weeks later, the new museum wall opens: ONE NIGHT, MANY EYES. Four frames hold the newspaper story, the Coast Guard report, Reb Shimon\'s log and the captain\'s story, each with a card saying who wrote it and how. Avrumi\'s chart shows where they agree and differ, and the 1904 log lies in a glass case.\nAt the bottom is Tzvi Hirsch\'s own page, in his own handwriting: nobody saw everything, so you must listen to all of them; and if someone helps you, even if he never knows it, you must say thank you.\nCaptain Turner and Cody arrive on the repaired Miss Ellie with the old bronze clapper of the fog bell, which came up in their anchor chain. They hang it, and Tzvi Hirsch rings the bell for the first time in fifty years. Reb Shimon writes one more line in the old log.' },
    c45h3_b5k12: { title: 'A Letter to the Coast Guard Station', text: 'Dear Coast Guard crew,\nMy name is Cody Turner. I am thirteen. On the night of the storm, my dad\'s boat, the Miss Ellie, was stuck on Kettle Shoal, and you came for us in waves taller than our cabin. One of you held my hand when I climbed across, even though my hand was bleeding. I never learned your name.\nI am writing to say thank you. My dad says a person who saves you deserves to be remembered, even if you never see him again. So I put your boat number on my bedroom wall, and every night I see it before I go to sleep.\nWith thanks,\nCody' }
