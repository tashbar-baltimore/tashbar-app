  I.forEach(function(x,j){ if(x.c===0x05E9&&!x.snd) un.push('ש without a shin or sin dot'); });
  var role=I.map(function(){ return null; });
  for(i=0;i<I.length;i++){ var x=I[i], prev=I[i-1];
   if(x.c===0x05D5&&x.dag&&!x.v&&(!prev||!prev.v||role[i-1]==='close')){ if(prev&&!prev.v&&role[i-1]!=='vowel'){ prev.v='kubutz'; role[i]='vowel'; continue; } if(!prev){ x.snd='alef'; x.v='kubutz'; x.vav=true; continue; } }
   if(x.c===0x05D5&&!x.dag&&x.v==='cholam'&&prev&&!prev.v){ prev.v='cholam'; role[i]='vowel'; continue; }

   if(x.dag&&pFull&&x.c!==0x05D5&&i>0){ beats[beats.length-1].close.push({ i:i, key:x.close }); }

    var na=i===0||(p&&p.v==='sheva'&&role[pj]==='close'&&i<last)||(x.dag&&pFull)||(I[i+1]&&I[i+1].c===x.c);

    if(na){ beats.push({ letters:[i], cv:x.snd+'+sheva', close:[] }); }

    continue; }

    beats.push({ letters:[i], cv:x.snd+'+'+x.v, close:[] }); continue; }
   if(!x.v){ if(i===last||(I[i+1]&&role[i+1]!=='vowel')){ role[i]='close'; if(beats.length) beats[beats.length-1].close.push({ i:i, key:x.close }); else un.push('first letter has no nekudah'); if(i!==last) un.push('a letter in the middle has no nekudah'); } }
  }
  for(i=0;i<I.length;i++){ if(role[i]==='vowel'||role[i]==='silent'){ var b=null; beats.forEach(function(bt){ bt.letters.concat(bt.close.map(function(c){ return c.i; })).forEach(function(j){ if(j===i-1) b=bt; }); }); if(b&&b.letters.indexOf(i)<0) b.letters.push(i); } }

   b.clips.forEach(function(k){ if(!HAS[k]) un.push('no clip in the recording list for '+k); }); var closers={}; b.close.forEach(function(c){ closers[c.i]=1; }); b.text=b.letters.map(function(j){ return closers[j]&&b.letters.indexOf(j)>0?G[j].ch.replace(/[\u05B0-\u05BB\u05C7]/g,''):G[j].ch; }).join(''); });

 function playClip(k,rate){ var min=new Promise(function(r){ setTimeout(r,rate>1?240:560); }); return Promise.all([min,playOne(k,rate)]); }

 /* the player: each beat slowly with its letters lit, then the whole word fast. Words a rebbe has not cleared (unsure) are not played. */
 function sio(mount,word,opts){ opts=opts||{}; var P=parse(word), okList=window.TL_SIO_OK||{};
  if(!P.beats){ mount.innerHTML='<div class="sio"><p class="sio-note">This is not a pointed word.</p></div>'; return P; }
  var cleared=P.ok||okList[word];
  mount.innerHTML='<div class="sio"><div class="sio-word kl-he" lang="he">'+P.g.map(function(c,i){ return '<span data-i="'+i+'">'+c+'</span>'; }).join('')+'</div><div class="sio-beats kl-he" lang="he">'+P.beats.map(function(b,i){ return '<b data-b="'+i+'">'+b.text+'</b>'; }).join('')+'</div>'
   +(cleared?'<button class="w-btn" type="button" data-sio="go">🔊 Sound it out</button>':'<p class="sio-note">A rebbe needs to check this word first.</p>')+(window.TL_CLIPS&&Object.keys(TL_CLIPS).length?'':'<p class="sio-note">The rebbe’s recordings are not in yet, so this shows the beats without sound.</p>')+'</div>';
  var spans=mount.querySelectorAll('.sio-word span'), bs=mount.querySelectorAll('.sio-beats b');
  function lit(b,on){ b.letters.forEach(function(j){ spans[j].classList.toggle('on',on); if(!on) spans[j].classList.add('done'); }); }
  var go=mount.querySelector('[data-sio="go"]'); if(go) go.onclick=function(){ go.disabled=true; spans.forEach(function(s){ s.classList.remove('done','on'); });
   playClip('phrase:sound-it-out').then(function(){ return seq(P.beats,function(b,i){ bs[i].classList.add('on'); lit(b,true); return seq(b.clips,function(k){ return playClip(k,.85); }).then(function(){ lit(b,false); bs[i].classList.remove('on'); return new Promise(function(r){ setTimeout(r,250); }); }); }); })
    .then(function(){ return playClip('phrase:say-it-fast'); }).then(function(){ spans.forEach(function(s){ s.classList.add('on'); }); return seq([].concat.apply([],P.beats.map(function(b){ return b.clips; })),function(k){ return playClip(k,1.35); }); })
    .then(function(){ spans.forEach(function(s){ s.classList.remove('on'); s.classList.add('done'); }); go.disabled=false; if(opts.onDone) opts.onDone(); }); };
  return P; }
