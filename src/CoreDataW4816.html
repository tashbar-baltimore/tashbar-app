  'WRIT.ESSAY.L05.03':{name:'TIDE Plan',
  teach:[
    {how:'The Glen Avenue Gazette wants a new piece: how the Gold family bakery makes challah for Shabbos. This piece does not try to convince anyone. It TEACHES. You know POW: Pick my idea, Organize my notes, Write and say more. Here, Pick my idea means: pick a topic you can teach.', q:'Tzvi Hirsch says: “I will teach how our bakery makes challah.” Which POW step is that?', o:['Pick my idea','Organize my notes','Write and say more']},
    {how:'For an opinion, you organized your notes with TREE. To teach, organize them with TIDE. T: Topic sentence: tell what you will teach. I: Important ideas: the main parts, often three. D: Details: facts about each idea. E: Ending: wrap it up and tell the reader what he now knows.', q:'Tzvi Hirsch’s note says: “braiding.” It is one main part of making challah. Which TIDE part is it?', o:['Important idea','Topic sentence','Ending']},
    {how:'The mistake: an opinion in a teaching plan. “I think challah is the best bread” is TREE talk. An information piece teaches facts, not what you like. Another mistake: important ideas with no details. Ask: Will my reader learn how it really works?', q:'Which plan is ready to write?', o:['A topic sentence, three important ideas, details for each, and an ending.','“I think challah is the best bread,” and three reasons.','Three important ideas, but no details.']}

      h:'The topic sentence tells what the whole piece teaches. An important idea is one main part, in a word or two. A detail is a fact about one part, often with a number.'},
    {t:'pairs', q:'Match each part of TIDE to its job.', pairs:[['Topic sentence','tell what I will teach'],['Important ideas','name the main parts'],['Details','give facts about each part'],['Ending','wrap it up']],

    {t:'order', q:'Put the parts of a teaching plan in TIDE order. Tap the tiles in order.', tiles:['Topic sentence','Important ideas','Details','Ending'],

    {t:'spotall', q:'Tzvi Hirsch is teaching how challah is made. Tap every note that is a DETAIL.', cells:[{label:'the dough rises for 2 hours',ok:true},{label:'each challah gets 6 strands',ok:true},{label:'the challos bake for 30 minutes',ok:true},{label:'braiding',ok:false},{label:'I think challah is the best bread',ok:false},{label:'Now you know how challah gets to your table.',ok:false}],

      h:'Check for all four TIDE parts. An opinion with reasons is a TREE plan, not TIDE.'},
    {t:'write', q:'Your turn to plan. Pick something you can teach: how your family gets ready for Shabbos, or how your shul gets ready for Yom Tov. Write POW at the top. Then make a TIDE: a topic sentence, three important ideas, two details for each, and an ending.', min:0, checks:['📰 My Topic sentence tells what I will teach.','💡 I have three Important ideas: the main parts.','🔍 Each idea has Details, and I have an Ending.'], h:'Pick a topic you know well. Ask: What are the main parts? For each part, ask: What facts can I teach?'}

  check:[

    {q:'Dovid plans a piece: how the class weather station works. One important idea is “the rain gauge.” His next note: “it filled to 2 inches last week.” Which TIDE part is the next note?', o:['Detail','Important idea','Topic sentence'], h:'Is it a main part, or a fact about one part?'},

  'WRIT.ESSAY.L05.04':{name:'Group It',
  teach:[
    {how:'Tzvi Hirsch has a pile of facts about the bakery. If he writes them in any order, the reader gets lost. So he sorts them into GROUPS. Facts about the same part go together. One group becomes one paragraph.', q:'Which two facts go in the same group?', o:['The dough rises for 2 hours. The mixer mixes flour, water, eggs and yeast.','The dough rises for 2 hours. The challos bake for 30 minutes.','Each challah gets 6 strands. The ovens run all night.']},
    {how:'Give each group a NAME. The name tells what all its facts have in common: Making the Dough, Braiding, Baking. Ask: What are these facts all about? If the name fits every fact in the group, it is a good name.', q:'Facts: each challah gets 6 strands; each braid takes about a minute. What is a good name for this group?', o:['Braiding','Baking','Challah']},
    {how:'The mistakes: one paragraph with facts from two groups mixed together, or a name that is too big. “Challah” is the topic of the whole piece, not the name of one group. And a name like “Stuff” tells nothing. Keep each group to one part.', q:'Which group name is too big?', o:['Challah','Making the Dough','Baking']}
  ],
  practice:[
    {t:'sort', q:'Sort Tzvi Hirsch’s bakery facts into groups.', bins:[{id:'D',label:'🥣 Making the Dough'},{id:'B',label:'🪢 Braiding'},{id:'K',label:'🔥 Baking'}],
      items:[{label:'The mixer mixes flour, water, eggs and yeast.',bin:'D'},{label:'The dough rises for 2 hours.',bin:'D'},{label:'Mr. Gold takes off a small piece of dough with a bracha.',bin:'D'},{label:'Each challah gets 6 strands.',bin:'B'},{label:'Each braid takes about a minute.',bin:'B'},{label:'The challos bake for 30 minutes.',bin:'K'},{label:'The ovens run all night on Thursday.',bin:'K'}],

    {t:'pairs', q:'Match each group of facts to its name.', pairs:[['rises for 2 hours; the mixer mixes flour and yeast','Making the Dough'],['6 strands; about a minute for each braid','Braiding'],['30 minutes; the ovens run all night','Baking']],
      h:'Ask: what are these facts all about?'},
    {t:'spotall', q:'This paragraph is about Braiding. Tap every fact that BELONGS in it.', cells:[{label:'Each challah gets 6 strands.',ok:true},{label:'Each braid takes about a minute.',ok:true},{label:'Tzvi Hirsch braids challah on Fridays.',ok:true},{label:'The dough rises for 2 hours.',ok:false},{label:'The challos bake for 30 minutes.',ok:false}],
      h:'Keep only facts about braiding. Facts about the dough or the oven go in their own group.'},
    {t:'sort', q:'Sort each group name.', bins:[{id:'G',label:'✅ Good name'},{id:'B',label:'📦 Too big: it names the whole piece'},{id:'N',label:'🤷 Tells nothing'}],
      items:[{label:'Making the Dough',bin:'G'},{label:'Braiding',bin:'G'},{label:'Baking',bin:'G'},{label:'Challah',bin:'B'},{label:'All About Challah',bin:'B'},{label:'Stuff',bin:'N'},{label:'Some Things',bin:'N'}],
      h:'A good name tells what one group of facts is about. A name for the whole piece is too big. A name like Stuff tells nothing.'},
    {t:'order', q:'Put Tzvi Hirsch’s groups in the order the bakers work. Tap the tiles in order.', tiles:['Making the Dough','Braiding','Baking'],
      h:'What happens first in the bakery? Dough first, then the braid, then the oven.'},
    {t:'pairs', q:'Match each mistake to its fix.', pairs:[['It mixes two groups.','Split it into two paragraphs.'],['A group has no name.','Ask what its facts are all about.'],['The name is “Challah.”','Pick a name for just one part.']],
      h:'What is wrong? Find the fix for that problem.'},
    {t:'write', q:'Your turn to write. Take your TIDE plan. List at least six facts. Sort them into groups, one group for each important idea. Give each group a name. Then write one paragraph for each group.', min:0, checks:['🗂️ Every fact is in a group with facts like it.','🏷️ Each group has a name that fits every fact in it.','📄 Each group became its own paragraph.'], h:'For each fact, ask: Which part is it about? Put it in that group. Then ask: What are these facts all about? That is the name.'}
  ],
  check:[
    {q:'Binyamin writes how his family makes plov for Shabbos. His groups are The Rice, The Meat and Cooking. He names one more group “Plov.” What is wrong with that name?', o:['Too big: it names the whole piece','Good name','Tells nothing'], h:'Is plov one part of the piece, or the whole topic?'},
    {q:'Dovid writes about the class weather station. One paragraph says: “The rain gauge filled to 2 inches. The wind vane points north. It rained on Tuesday too.” What is wrong?', o:['It mixes two groups','Nothing: it is one group','Too big: it names the whole piece'], h:'Are all the facts about the same part? Look for one that is about something else.'},
    {t:'order', q:'Avrumi writes how his Abba, a sofer, makes a mezuzah. Put his group names in the order the work happens. Tap the tiles in order.', tiles:['Getting the Klaf Ready','Writing the Words','Checking Every Letter'], h:'Which part happens first? Put the groups in the order the work happens.'}
  ],
  re:[
    {how:'A new way: groups are drawers in a dresser. Socks go in one drawer, shirts in another. Each drawer has a label. Each fact goes in the drawer where it belongs.', q:'In the dresser, what is the label on each drawer like?', o:['the group name','one fact','the ending']},
    {how:'A simpler step: start with just two groups. Ask about each fact: Is it about the dough, or about the oven?', q:'Is “The challos bake for 30 minutes” about the dough or the oven?', o:['the oven','the dough','neither']},
    {how:'The skill underneath: Umbrella Sentence. There, one topic sentence covered every detail in ONE paragraph. Now you go further: you sort many facts into several groups, give each group a name, and make each group its own paragraph.', q:'An umbrella sentence covers…', o:['every detail in the paragraph','only one detail','a different topic']}
  ]},

  'WRIT.ESSAY.L05.05':{name:'Headings Help',
  teach:[
    {how:'A heading is a short title over one part of your piece. It tells the reader what that part teaches. Your group names make great headings: Making the Dough, Braiding, Baking. A reader can look at the headings and jump right to the part he wants.', q:'Tzvi Hirsch’s paragraph tells about the 6 strands and how fast a braid is made. Which heading fits it?', o:['Braiding','Baking','Yum!']},
    {how:'A picture can teach too. Right under it, write a CAPTION: one short line that tells what the picture shows. A good caption gives the reader a fact. “Look at this!” or “My picture” tells him nothing.', q:'A picture shows Mr. Gold sliding a tray of challos into the oven. Which caption tells what it shows?', o:['Mr. Gold slides a tray of challos into the oven.','Look at this!','I love this picture.']},
    {how:'The mistakes: a heading that does not match its paragraph, a heading that is a whole long sentence, or a caption that does not say what the picture shows. Keep a heading short, three words or fewer, and check it against the paragraph under it.', q:'The paragraph is about the oven. Which heading is a mistake?', o:['Braiding','Baking','In the Oven']}
  ],
  practice:[

      h:'Read the paragraph. What is it all about? That is the heading.'},
    {t:'sort', q:'Sort each heading for the Braiding paragraph.', bins:[{id:'G',label:'✅ Good heading'},{id:'M',label:'🔀 Does not match'},{id:'L',label:'📏 Too long'}],
      items:[{label:'Braiding',bin:'G'},{label:'Six Strands',bin:'G'},{label:'Baking',bin:'M'},{label:'Making the Dough',bin:'M'},{label:'This part is all about how the bakers braid the challah',bin:'L'}],
      h:'A good heading is three words or fewer, and it matches the paragraph under it.'},
    {t:'spotall', q:'A picture shows Tzvi Hirsch braiding six strands of dough. Tap every caption that tells what the picture shows.', cells:[{label:'Tzvi Hirsch braids six strands into one challah.',ok:true},{label:'Six strands of dough become one braid.',ok:true},{label:'Look at this!',ok:false},{label:'My favorite picture.',ok:false},{label:'The challos bake for 30 minutes.',ok:false}],
      h:'A caption tells what is in THIS picture. A feeling, or a fact about something else, is not a caption for it.'},
    {t:'order', q:'Build the Baking part of Tzvi Hirsch’s page. Tap the parts in order, top to bottom.', tiles:['Heading: Baking','Picture: challos in the oven','Caption: Golden challos bake in the oven.'],
      h:'The heading goes on top of its part. The caption goes right under its picture.'},
    {t:'sort', q:'Sort each caption.', bins:[{id:'G',label:'✅ Tells what it shows'},{id:'N',label:'❌ Tells nothing'}],
      items:[{label:'Mr. Gold slides a tray of challos into the oven.',bin:'G'},{label:'The mixer turns flour, eggs and yeast into dough.',bin:'G'},{label:'Wow!',bin:'N'},{label:'Here is a picture.',bin:'N'},{label:'This is so cool.',bin:'N'}],
      h:'Does the caption tell the reader what he is looking at? Wow, Here is a picture, and so cool tell him nothing.'},
    {t:'pairs', q:'Match each mistake to its fix.', pairs:[['The heading does not match.','Read the paragraph and rename it.'],['The heading is a long sentence.','Cut it to three words or fewer.'],['The caption says “Wow!”','Tell what the picture shows.']],
      h:'What is wrong? Find the fix for that problem.'},
    {t:'write', q:'Your turn to write. Take your groups from last time. Write a short heading over each paragraph. Then draw one picture for one part, and write a caption under it that tells what it shows.', min:0, checks:['🏷️ Each paragraph has a short heading that matches it.','🖼️ I drew a picture for one part.','📝 My caption tells what the picture shows.'], h:'Use your group names as headings. For the caption, say: “This picture shows …” Then write what comes after those words.'}
  ],
  check:[
    {q:'Dovid writes about the class weather station. His paragraph tells how the rain gauge fills up and how to read the inches. He gives it the heading “The Wind Vane.” What is wrong with the heading?', o:['Does not match','Too long','Good heading'], h:'Read the paragraph. Is it about the wind vane?'},
    {q:'Avrumi draws his Abba, a sofer, writing a mezuzah with a feather quill. Under it he writes: “My Abba writes a mezuzah with a feather quill.” What kind of caption is it?', o:['Tells what it shows','Tells nothing','Does not match'], h:'Does the caption tell the reader what he is looking at?'},
    {t:'order', q:'Yehuda builds one part of his piece about Pesach cleaning in shul. Tap the parts in order, top to bottom.', tiles:['Heading: Cleaning the Shelves','Picture: men wiping the shelves','Caption: The men wipe all 40 shelves.'], h:'The heading goes on top of its part. The caption goes right under its picture.'}
  ],
  re:[
    {how:'A new way: headings are the signs over the aisles in a grocery. The sign says Bread or Fruit, so you know what is in that aisle before you walk in.', q:'Like an aisle sign, a heading tells…', o:['what that part is about','how the writer feels','the ending']},
    {how:'A simpler step: start with your group name. Write it over the paragraph. That is your heading.', q:'Tzvi Hirsch’s group is Baking. What is his heading?', o:['Baking','Braiding','The End']},
    {how:'The skill underneath: Group It. There you sorted facts into groups and named each one. Now you go further: the name goes on the page as a heading, and a picture with a caption teaches one part too.', q:'One group of facts becomes…', o:['one paragraph','one word','one picture']}

  'WRIT.PARA.L05.19':{name:'Facts and Quotes',
  teach:[
    {how:'You already say more with “For example” and “In fact.” A teaching piece goes further. Add FACTS the reader can check: a number (3 big ovens), a date (June 1985) or a name (Glen Avenue). A feeling, like “Challah is yummy,” is not a fact.', q:'Which sentence gives a fact with a date?', o:['Tzvi Hirsch’s Zeidy opened the bakery in 1985.','The bakery is the best on the street.','The bakery smells so good.']},
    {how:'Now add a QUOTE: an expert’s exact words. Put them inside quotation marks. Then say WHO said it, and his job: “You cannot rush good dough,” says Mr. Gold, the baker. An expert knows the topic from his work or his learning. Put the quote in the paragraph it teaches about.', q:'Who is the best expert to quote about why dough rises?', o:['Mr. Halpern, the science teacher','a boy walking past the bakery','Tzvi Hirsch’s baby brother']},
    {how:'The mistakes: a quote with no name, like “Someone said the dough needs time,” or a quote from someone who is not an expert. The reader asks: Who said that? How does he know? Always tell who said it, and pick a person who knows.', q:'Which quote tells who said it?', o:['“My father taught me the six-strand braid,” says Mr. Gold, the baker.','“My father taught me the six-strand braid.”','Someone said six strands are best.']}
  ],
  practice:[
    {t:'sort', q:'Sort each sentence from Tzvi Hirsch’s notes.', bins:[{id:'F',label:'🔢 A fact (a number, a date or a name)'},{id:'Q',label:'💬 A quote with who said it'},{id:'X',label:'😊 A feeling'}],
      items:[{label:'The bakery makes 300 challos each Friday.',bin:'F'},{label:'Tzvi Hirsch’s Zeidy opened the bakery in 1985.',bin:'F'},{label:'“You cannot rush good dough,” says Mr. Gold, the baker.',bin:'Q'},{label:'“Yeast makes tiny bubbles of gas, so the dough rises,” says Mr. Halpern, the science teacher.',bin:'Q'},{label:'Challah is the yummiest bread.',bin:'X'},{label:'The bakery is so cozy.',bin:'X'}],
      h:'A fact can be checked: a number, a date or a name. A quote has an expert’s exact words and his name. A feeling tells what someone likes.'},
    {t:'pairs', q:'Each quote belongs in one paragraph. Match each quote to its heading.', pairs:[['“You cannot rush good dough,” says Mr. Gold, the baker.','Making the Dough'],['“My father taught me the six-strand braid,” says Mr. Gold, the baker.','Braiding'],['“We check every tray at 30 minutes,” says Mr. Gold, the baker.','Baking']], h:'What is the quote about? Put it in the paragraph about the same part.'},
    {t:'spotall', q:'Tap every quote that tells WHO said it.', cells:[{label:'“You cannot rush good dough,” says Mr. Gold, the baker.',ok:true},{label:'Rabbi Feldman says, “Taking challah is a mitzvah.”',ok:true},{label:'“Yeast makes tiny bubbles of gas, so the dough rises,” says Mr. Halpern.',ok:true},{label:'“You cannot rush good dough.”',ok:false},{label:'Someone said the dough needs time.',ok:false}],
      h:'Look for a person’s name next to the quotation marks.'},
    {t:'order', q:'Build Tzvi Hirsch’s sentence with a quote. Tap the tiles in order.', tiles:['“You cannot','rush good dough,”','says Mr. Gold,','the baker.'],
      h:'The expert’s exact words go inside the quotation marks. Then say who said it, and his job.'},
    {t:'sort', q:'Topic: how the bakery makes challah. Who is an expert to quote?', bins:[{id:'E',label:'✅ An expert'},{id:'N',label:'❌ Not an expert'}],
      items:[{label:'Mr. Gold, the baker',bin:'E'},{label:'Mr. Halpern, the science teacher, about yeast',bin:'E'},{label:'Rabbi Feldman, about taking challah',bin:'E'},{label:'a boy walking past the bakery',bin:'N'},{label:'Tzvi Hirsch’s baby brother',bin:'N'}],
      h:'An expert knows the topic from his work or his learning.'},
    {t:'pairs', q:'Match each quote to the expert who said it.', pairs:[['“You cannot rush good dough.”','Mr. Gold, the baker'],['“Taking challah is a mitzvah.”','Rabbi Feldman'],['“Yeast makes tiny bubbles of gas, so the dough rises.”','Mr. Halpern, the science teacher']],
      h:'Who knows about baking? Who knows about the mitzvah? Who knows about science?'},
    {t:'write', q:'Your turn to write. Take one paragraph from your piece. Add one fact with a number, a date or a name. Then ask an expert one question: your Abba, your rebbe or a teacher. Add a short quote with his exact words, and say who said it.', min:0, checks:['🔢 I added a fact with a number, a date or a name.','💬 I put the expert’s exact words inside quotation marks.','🧑‍🏫 I said who said it, and his job.'], h:'Ask someone who knows your topic one question. Write his exact words. Then add says, his name, and his job.'}
  ],
  check:[
    {q:'Dovid writes about the class weather station: “It rained 2 inches last Tuesday.” What kind of sentence is it?', o:['A fact','A feeling','A quote with who said it'], h:'Does it have a number you can check, an expert’s words, or what someone likes?'},
    {q:'Binyamin writes about chess: “Think three moves ahead,” says Zeidy Yusupov, who has played chess for 50 years. What is this?', o:['A quote with who said it','A feeling','A fact with a date'], h:'Look for quotation marks and a name.'},
    {t:'order', q:'Build Avrumi’s sentence with a quote. Tap the tiles in order.', tiles:['“A sofer checks','every letter,”','says Mr. Katz,','a sofer.'], h:'The expert’s exact words go inside the quotation marks. Then say who said it, and his job.'}

  re:[
    {how:'A new way: a quote is like a guest speaker. You bring him into your piece, and you introduce him: his name and his job.', q:'When you bring in a quote, you tell the reader…', o:['who said it','how you feel','the ending']},

    {how:'The skill underneath: Say More. There you added “For example” or “In fact” to a detail. Now you go further: you bring in an expert, quote his exact words, say who he is, and put the quote in the paragraph it teaches about.', q:'In Say More, a fact often has…', o:['a number','a feeling','a question']}

  'WRIT.PARA.L05.20':{name:'Expert Words',
  teach:[
    {how:'Experts use the exact word for each thing. Mr. Gold does not say “the big machine.” He says “the mixer.” In your piece, use the exact topic word, so the reader learns it too: the dough, the yeast, the oven, the strands.', q:'Tzvi Hirsch wrote: “Then they put it in the hot thing.” Which exact word fixes “the hot thing”?', o:['the oven','the stuff','the place']},
    {how:'Hunt for thing words: thing, stuff, and “it” when the reader cannot tell what “it” means. Swap each one for the exact word. “The stuff makes it puff up” becomes “The yeast makes the dough rise.”', q:'Which sentence uses exact words?', o:['The yeast makes the dough rise.','The stuff makes it puff up.','That thing makes it get big.']},
    {how:'The mistake: a word that sounds expert but is the wrong word. The bakers braid the strands, not the yeast. Check: does the word name exactly the thing you mean? If you are not sure, ask the expert.', q:'Tzvi Hirsch means the long ropes of dough. Which word is exact AND right?', o:['strands','yeast','oven']}
  ],
  practice:[
    {t:'pairs', q:'Match each thing word to the exact word.', pairs:[['the big machine that stirs','the mixer'],['the stuff that makes it rise','the yeast'],['the hot thing','the oven'],['the long ropes of dough','the strands']],
      h:'Which exact word names that thing?'},
    {t:'sort', q:'Sort each phrase.', bins:[{id:'E',label:'✅ Exact word'},{id:'T',label:'🌫️ Thing word'}],
      items:[{label:'the mixer',bin:'E'},{label:'the egg wash',bin:'E'},{label:'the cooling rack',bin:'E'},{label:'the stuff',bin:'T'},{label:'the thing',bin:'T'},{label:'the shiny stuff',bin:'T'}],
      h:'An exact word names one thing. Thing, stuff and that do not.'},
