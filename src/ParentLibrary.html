<!-- ParentLibrary.html — "Practice at home" for parents (server: Library.js libParentCatalog / libParentAssign). Claude Code builder, 2026-11-16.
     Head of School: anyone but the child may assign. A parent assigns lessons from his OWN child's level; the boy sees them with his
     rebbe's picks. Only his own children (ppKid_). Nothing here pays or shows money. -->
<style>
#plx-btn{position:fixed;right:14px;bottom:14px;z-index:9000;border:0;border-radius:999px;padding:11px 16px;font:700 14px/1 system-ui,-apple-system,"Segoe UI",sans-serif;background:#16274A;color:#fff;box-shadow:0 6px 18px rgba(10,20,40,.25);cursor:pointer;display:none}
#plx-btn b{color:#F0B847}
#plx{--bg:#F5F3EE;--panel:#fff;--ink:#16233D;--soft:#5B6880;--line:#E2DED4;--honey:#E3A72F;--honey-soft:#FCF1D8;--honey-ink:#6B4A06;--good:#2E8B57;--good-soft:#E3F3EA;--navy:#16274A;
  position:fixed;inset:0;z-index:9500;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
@media (prefers-color-scheme:dark){#plx{--bg:#0F1625;--panel:#162033;--ink:#E9EDF5;--soft:#9AA6BC;--line:#26324A;--honey:#F0B847;--honey-soft:#3A2E14;--honey-ink:#F6D58C;--good:#5CC48A;--good-soft:#14301F;--navy:#0A1222}}
#plx[hidden],#plx [hidden]{display:none!important}
#plx *{box-sizing:border-box}#plx button,#plx select{font:inherit;color:inherit;cursor:pointer}
#plx .top{background:var(--navy);color:#fff;padding:12px 16px;display:flex;gap:10px;align-items:center}
#plx .top h1{margin:0 auto 0 0;font:700 18px/1.2 Georgia,"Times New Roman",serif}
#plx .top button{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:8px;padding:6px 12px;font-weight:600}
#plx .body{flex:1;overflow:auto;padding:14px 16px 90px;max-width:900px;width:100%;margin:0 auto}
#plx .lede{color:var(--soft);margin:0 0 12px}
#plx .kids{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
#plx .kids button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-weight:600}
#plx .kids button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
#plx .grp{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
#plx .grp h3{margin:0;padding:10px 12px;font-size:15px;display:flex;justify-content:space-between;gap:8px}
#plx .grp h3 small{color:var(--soft);font-weight:500}
#plx .ls{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;padding:0 12px 12px}
#plx .l{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:9px 10px;text-align:left;display:flex;justify-content:space-between;gap:8px;align-items:center;min-width:0}
#plx .l span{min-width:0}#plx .l b{display:block;font-weight:600}#plx .l small{color:var(--soft);font-size:12px}
#plx .l i{font-style:normal;font-weight:700;font-size:13px;color:var(--honey-ink);background:var(--honey-soft);border-radius:6px;padding:3px 8px;white-space:nowrap}
#plx .l.on i{background:var(--good-soft);color:var(--good)}
#plx .mine{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
#plx .mine div{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:4px 0;border-top:1px solid var(--line)}
#plx .mine div:first-of-type{border-top:0}
#plx .mine button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px;font-size:13px}
#plx .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--navy);color:#fff;border-radius:10px;padding:10px 14px;z-index:9600;max-width:calc(100vw - 32px)}
#plx .empty{color:var(--soft);padding:12px}
</style>
<button id="plx-btn" type="button">&#128218; <b>Practice</b> at home</button>
<div id="plx" hidden role="dialog" aria-label="Practice at home"></div>
<script>
(function(){
'use strict';
var X = { kid:null, data:{}, busy:false };
var btn = document.getElementById('plx-btn'), box = document.getElementById('plx');
function st(){ try { return (typeof S !== 'undefined' && S && S.token && S.d && S.d.kids && S.d.kids.length) ? S : null; } catch (e) { return null; } }
function call(fn){ var a = [].slice.call(arguments, 1); return new Promise(function(ok, no){ google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){ no(e && e.message ? e.message : String(e)); })[fn].apply(null, a); }); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
setInterval(function(){ btn.style.display = st() && box.hidden ? 'block' : 'none'; }, 800);
btn.onclick = function(){ var s = st(); if (!s) return; var k = s.d.kids[s.kid || 0] || s.d.kids[0]; X.kid = k.id; box.hidden = false; document.body.style.overflow = 'hidden'; load(); };
document.addEventListener('keydown', function(e){ if (!box.hidden && e.key === 'Escape') close(); });
function close(){ box.hidden = true; document.body.style.overflow = ''; }
function load(){ draw(); if (X.data[X.kid]) return; call('libParentCatalog', st().token, X.kid).then(function(d){ X.data[X.kid] = d; draw(); }).catch(function(e){ X.err = e; draw(); }); }
function draw(){
  var s = st(); if (!s) { close(); return; }
  var kid = s.d.kids.filter(function(k){ return k.id === X.kid; })[0] || s.d.kids[0], d = X.data[X.kid];
  var h = '<div class="top"><h1>Practice at home</h1><button type="button" data-x="close">Close</button></div><div class="body">';
  h += '<p class="lede">Choose lessons for ' + esc(kid.first || kid.name) + ' to practice. They appear on his screen with his rebbe\'s picks, marked "Practice at home". Every lesson here is at his own level.</p>';
  if (s.d.kids.length > 1) h += '<div class="kids">' + s.d.kids.map(function(k){ return '<button type="button" data-k="' + esc(k.id) + '" aria-pressed="' + (k.id === X.kid) + '">' + esc(k.first || k.name) + '</button>'; }).join('') + '</div>';
  if (!d) { h += '<div class="empty">' + (X.err ? 'Did not load: ' + esc(X.err) : 'Finding lessons at his level…') + '</div></div>'; box.innerHTML = h; wire(); return; }
  var mine = {}; (d.mine || []).forEach(function(m){ mine[m.id] = 1; });
  h += '<div class="mine"><b>You assigned</b>' + (d.mine && d.mine.length ? d.mine.map(function(m){ return '<div><span>' + esc(m.name) + '</span><button type="button" data-un="' + esc(m.id) + '">Take back</button></div>'; }).join('') : '<p class="lede" style="margin:4px 0 0">Nothing yet. Tap a lesson below.</p>') + '</div>';
  if (!d.groups.length) h += '<div class="empty">No lessons are ready at his level yet. His rebbe can set his level.</div>';
  d.groups.forEach(function(g){ h += '<div class="grp"><h3>' + esc(g.name) + '<small>' + (g.level ? 'his level' : 'his next lessons') + '</small></h3><div class="ls">' + g.cards.map(function(c){ var on = !!mine[c[0]];
    return '<button type="button" class="l' + (on ? ' on' : '') + '" data-c="' + esc(c[0]) + '"' + (on ? ' disabled' : '') + '><span><b>' + esc(c[1]) + '</b>' + (c[2] && c[2] !== c[1] ? '<small>' + esc(c[2]) + '</small>' : '') + '</span><i>' + (on ? 'Assigned' : 'Assign') + '</i></button>'; }).join('') + '</div></div>'; });
  h += '</div><div class="toast" id="plx-t" hidden></div>';
  box.innerHTML = h; wire();
}
function toast(m){ var t = document.getElementById('plx-t'); if (!t) return; t.textContent = m; t.hidden = false; clearTimeout(X.tt); X.tt = setTimeout(function(){ t.hidden = true; }, 4000); }
function act(cards, undo){ if (X.busy) return; X.busy = true; call('libParentAssign', st().token, X.kid, cards, !!undo).then(function(r){ X.busy = false; X.data[X.kid].mine = r.mine; draw(); toast(r.msg); }).catch(function(e){ X.busy = false; draw(); toast('Not saved: ' + e); }); }
function wire(){
  box.querySelector('[data-x=close]').onclick = close;
  box.querySelectorAll('[data-k]').forEach(function(b){ b.onclick = function(){ X.kid = b.dataset.k; load(); }; });
  box.querySelectorAll('[data-c]').forEach(function(b){ b.onclick = function(){ act([b.dataset.c]); }; });
  box.querySelectorAll('[data-un]').forEach(function(b){ b.onclick = function(){ act([b.dataset.un], true); }; });
}
})();
</script>
