(function () {
  var LESSONS = {
  'WRIT.RES.L07.01':{name:'Narrow the Question',
  teach:[
    {how:'A research report starts with a QUESTION. A boy who starts with a big TOPIC, like “water”, could fill a whole book and never finish. So NARROW it in three steps. TOPIC: water. ONE PART: Baltimore’s drinking water. ONE QUESTION about that part: “How does Baltimore’s water get from the reservoirs to our kitchen faucet?” A short report can answer that in about three body paragraphs.', q:'Mr. Gross gives The Beacon the topic “water.” Which is a narrowed question a short report can answer?', o:['How does Baltimore’s water get from the reservoirs to our kitchen faucet?','What is everything about water?','Is water important?']},
    {how:'Before you research, TEST the question three ways. RIGHT SIZE: not so big it fills a book, and not so small that one fact answers it (“How many reservoirs does Baltimore have?”). Can you answer it in about three paragraphs? NOT YES/NO: it starts with how, why or what, so the answer is more than one word. CAN BE FOUND: your sources can really answer it. The Beacon team has three practice sources, made up for these lessons: a library book, a web page about the city’s water, and Gavriel’s interview with an engineer. A question that passes all three tests is READY TO RESEARCH.', q:'The team’s sources: a library book, the city’s water web page and an engineer. Which question can those sources answer?', o:['How does a filtration plant clean the water?','What will Baltimore’s water be like in the year 2500?','What did every family in Baltimore talk about at the Shabbos table last week?']},
    {how:'Four mistakes. TOO BIG: the answer would fill a whole book (“How does water work all over the world?”). YES/NO: the answer is one word (“Does Baltimore have reservoirs?”). TOO SMALL: one fact answers it, so there is nothing to research (“How many reservoirs does Baltimore have?”). CAN’T BE FOUND: no source could know it, like the far future or a private fact (“Which boy in our yeshiva drank the most water this week?”). Fix each one: shrink it to one part, turn it into a how or why question that needs more than one fact, or ask what your sources can answer.', q:'Yoni’s question: “Does Baltimore clean its water?” Which mistake is it?', o:['yes/no','too big','can’t be found']}
  ],
  practice:[
    {t:'sort', q:'Each question has a mistake. Sort it.', bins:[{id:'T',label:'📚 Too big'},{id:'Y',label:'🔘 Yes/no'},{id:'C',label:'🚫 Can’t be found'}],
      items:[{label:'What is the history of all the water on earth?',bin:'T'},{label:'How do all the cities in the world get water?',bin:'T'},{label:'Is the water in Baltimore clean?',bin:'Y'},{label:'Does a filtration plant use sand?',bin:'Y'},{label:'What will the reservoirs look like in 300 years?',bin:'C'},{label:'Which boy in our class drank the most water last year?',bin:'C'}],
      h:'Would the answer fill a book? Is it one word? Could any source really know it?'},
    {t:'pairs', q:'Step 1 to step 2: match each big topic to ONE PART of it.', pairs:[['Water','Baltimore’s drinking water'],['Boats','the skimmer boats in the Inner Harbor'],['Bread','how a bakery braids challah'],['Trains','the train that carries freight past our yeshiva']],
      h:'The part is a smaller piece of the same topic, small enough for one short report.'},
    {t:'spotall', q:'Tap every question that is READY TO RESEARCH for a short Beacon report.', cells:[{label:'How does a filtration plant clean the water?',ok:true},{label:'Why does a city build dams on rivers?',ok:true},{label:'How do water pipes reach each house on our street?',ok:true},{label:'Does our shul have a sink?',ok:false},{label:'How does water work everywhere?',ok:false}],
      h:'Run the three tests on each one: right size, not yes/no, can be found.'},
    {t:'sort', q:'Sneaky ones! Is the question ready, or does it need fixing?', bins:[{id:'G',label:'✅ Ready to research'},{id:'N',label:'⚠️ Needs fixing'}],
      items:[{label:'Why do the reservoirs need dams?',bin:'G'},{label:'How does chlorine help clean the water?',bin:'G'},{label:'How do workers test the water each day?',bin:'G'},{label:'How many reservoirs does Baltimore have?',bin:'N'},{label:'How did every person in history get water?',bin:'N'},{label:'What was every Baltimore family’s favorite drink yesterday?',bin:'N'}],
      h:'A question can sound serious and still fail a test. Check all three: size, yes/no, can be found. Too small counts too: one fact answers it.'},
    {t:'order', q:'Build Akiva’s narrowed question. Tap the tiles in order.', tiles:['How does','Baltimore’s water','get from the reservoirs','to our kitchen faucet?'],
      h:'The question word first. Then what you are asking about. Then from where, and to where.'},
    {t:'pairs', q:'Match each weak question to the fix that makes it ready to research.', pairs:[['Does Baltimore have reservoirs?','How do Baltimore’s reservoirs store water?'],['What is everything about water?','How does Baltimore’s water reach our faucet?'],['What will our water be like in 300 years?','How do workers keep our water clean today?']],
      h:'Yes/no: turn it into a how question. Too big: shrink it to one part. Can’t be found: ask what your sources can answer.'},
    {t:'write', q:'Your turn to write. Pick a big topic for a Beacon report: your shul, Shabbos food, the yeshiva bus, or the harbor. Write the topic, then one part of it, then one question. Under it, write the three tests and say how your question passes each one.', min:0, checks:['🔍 I narrowed it: topic, one part, one question.','❓ It is a how, why or what question, not yes/no.','📚 It fits in about three paragraphs, and a real source can answer it.'], h:'Zoom in twice. Then put “How does” or “Why does” in front of the part. Name a source that could answer it: a book, a web page, or a person to interview.'}
  ],
  check:[
    {q:'Benny wants to write about Pesach for The Beacon. His question: “What is everything about Pesach?” Which mistake is it?', o:['too big','yes/no','can’t be found'], h:'Could the answer fill a whole book?'},
    {q:'Eli’s question for a report on the yeshiva’s new bus: “What will the bus look like in 50 years?” Which mistake is it?', o:['can’t be found','too big','yes/no'], h:'Could any book, web page or person really know the answer?'},
    {t:'order', q:'Topic: the yeshiva library. Zoom in from topic to question. Tap the tiles in order.', tiles:['The yeshiva library','Its new seforim','How does the library choose new seforim?'], h:'The whole topic first. Then one part. Then the question about that part.'}
  ],
  re:[
    {how:'A new way: think of a map on a phone. The topic is the whole city. Zoom in to one street: one part. Zoom in again to one house: the question. You can describe one house well; you cannot describe a whole city in three paragraphs.', q:'The narrowed question is like…', o:['zooming in on one house','looking at the whole city','closing the map']},
    {how:'A simpler step: write the topic. Under it, write one part of it. Then put “How does” or “Why does” in front of that part.', q:'To turn a part into a question that is not yes/no, start with…', o:['How does or Why does','Is or Does','The end']},
    {how:'The skill underneath: a question you can answer, not too big and not yes/no (Grade 4), and Pick the Pattern (this year), where the question chose the plan. Now you go further: you narrow a big topic step by step, topic, one part, one question, check that it is not too small either, and test that your own sources can answer it in a short report.', q:'Narrow the Question goes further by also asking…', o:['Can my sources answer it?','Is it funny?','Is it long?']}
  ]},

  'WRIT.RES.L07.02':{name:'Quote or Paraphrase?',
  teach:[
    {how:'You know two ways to use a source. QUOTE: his exact words, inside quotation marks. PARAPHRASE: the same meaning in your own words. Now you learn to CHOOSE. Most notes are PLAIN FACTS: where, what, when, the steps. Anyone would say them about the same way, so PARAPHRASE them. The book says: “Rain and melting snow fill the reservoirs.” Paraphrase: Mr. Weiss explains that the reservoirs fill up when it rains and when the snow melts.', q:'The web page says: “Water travels from the reservoirs to a filtration plant through large underground pipes.” Quote it or paraphrase it?', o:['paraphrase it','quote it','leave it out']},
    {how:'QUOTE only when the EXACT WORDS MATTER. Three reasons. A STRONG PHRASE: a WORD PICTURE that compares one thing to another, so sharp that your own words would be weaker. Mr. Weiss writes: “The reservoirs are the city’s savings account of water.” AN EXPERT’S OWN WORDS: a person who works in the field gives his own view, what he thinks from his work. There is no word picture; the words matter because HE said them. Mr. Haddad, the engineer: “Nobody notices clean water until it stops.” A DEFINITION: the exact meaning of a word. Ask: would my own words lose something?', q:'Which note should the Beacon team quote?', o:['Mr. Haddad: “Every glass of water has taken a long trip before it reaches your table.”','Web page: “Dirt settles to the bottom.”','Book: “Rain and melting snow fill the reservoirs.”']},
    {how:'Two mistakes. A WASTED QUOTE: a plain fact copied inside quotation marks. It adds nothing, and the paragraph turns into a pile of other people’s sentences. A LOST PHRASE: a strong phrase or an expert’s view squeezed into plain words, so its power is gone. “Mr. Haddad said people do not think about water much” loses his own view.', q:'Eli writes: The web page says, “Clean water is pumped into water mains.” What is wrong?', o:['a wasted quote','a lost phrase','nothing, it fits']}
  ],
  practice:[
    {t:'sort', q:'The Beacon team’s notes. Quote it or paraphrase it?', bins:[{id:'Q',label:'💬 Quote it'},{id:'P',label:'✏️ Paraphrase it'}],
      items:[{label:'Book: “The reservoirs are the city’s savings account of water.”',bin:'Q'},{label:'Mr. Haddad: “Nobody notices clean water until it stops.”',bin:'Q'},{label:'Book: “A reservoir is a lake that people make by building a dam across a river.”',bin:'Q'},{label:'Web page: “Water travels from the reservoirs to a filtration plant through large underground pipes.”',bin:'P'},{label:'Web page: “A small amount of chlorine is added to kill germs.”',bin:'P'},{label:'Book: “Rain and melting snow fill the reservoirs.”',bin:'P'}],
      h:'Ask: would my own words lose something? A strong phrase, an expert’s view or a definition: quote it. A plain fact: paraphrase it.'},
    {t:'pairs', q:'Match each reason to the note that shows it.', pairs:[['A strong phrase','“The reservoirs are the city’s savings account of water.”'],['An expert’s own words','Mr. Haddad: “Nobody notices clean water until it stops.”'],['A definition','“A water main is a big pipe under the street that carries water to many homes.”'],['A plain fact','“Rain and melting snow fill the reservoirs.”']],
      h:'A word picture that compares? An expert’s view from his work? The meaning of a word? Or a plain fact anyone could say?'},
    {t:'spotall', q:'Tap every sentence where the writer CHOSE RIGHT.', cells:[{label:'The city’s web page explains that sand and gravel filter the water as it flows through them.',ok:true},{label:'Mr. Weiss calls the reservoirs “the city’s savings account of water.”',ok:true},{label:'Mr. Haddad said, “Nobody notices clean water until it stops.”',ok:true},{label:'Mr. Weiss writes, “Rain and melting snow fill the reservoirs.”',ok:false},{label:'Mr. Haddad said water is important.',ok:false}],
      h:'A plain fact in quotation marks is a wasted quote. Strong words turned plain are a lost phrase.'},
    {t:'sort', q:'Sneaky ones! Sort each sentence.', bins:[{id:'G',label:'✅ Good choice'},{id:'W',label:'⚠️ A wasted quote'},{id:'L',label:'⚠️ A lost phrase'}],
      items:[{label:'Mr. Weiss calls the reservoirs “the city’s savings account of water.”',bin:'G'},{label:'The city’s web page explains that a little chlorine goes into the water to get rid of germs.',bin:'G'},{label:'The web page says, “Clean water is pumped into water mains.”',bin:'W'},{label:'Mr. Weiss writes, “Rain and melting snow fill the reservoirs.”',bin:'W'},{label:'Mr. Haddad said that people do not think about water much.',bin:'L'},{label:'Mr. Weiss says the reservoirs hold a lot of water.',bin:'L'}],
      h:'Quotation marks around a plain fact: wasted. A sharp phrase or a view gone flat: lost. Remember the originals: “savings account of water” and “Nobody notices clean water until it stops.”'},
    {t:'order', q:'Build Gavriel’s sentence. Weave in the strong phrase. Tap the tiles in order.', tiles:['Mr. Weiss calls','the reservoirs','“the city’s savings','account of water.”'],
      h:'Who first, then what he calls them. His exact words go last, inside the quotation marks.'},
    {t:'spotall', q:'Lines from Gavriel’s interview with Mr. Haddad. Tap every line the team should QUOTE.', cells:[{label:'“Every glass of water has taken a long trip before it reaches your table.”',ok:true},{label:'“Nobody notices clean water until it stops.”',ok:true},{label:'“A water main is a big pipe under the street that carries water to many homes.”',ok:true},{label:'“We test the water every day.”',ok:false},{label:'“Smaller pipes branch off the mains into each house.”',ok:false}],
      h:'A strong phrase, his own view, or a definition: quote. A plain fact about the job: paraphrase.'},
    {t:'write', q:'Your turn to write. Pick two notes from the Beacon team’s sources: one plain fact, and one strong phrase, expert’s view or definition. Write a sentence for each. Paraphrase the plain fact. Quote the other, and say who said it.', min:0, checks:['✏️ I paraphrased the plain fact in my own words.','💬 I quoted only words that matter: a strong phrase, an expert’s own words or a definition.','🔤 My quote is his exact words, inside quotation marks.'], h:'Plain facts to choose from: rain and melting snow fill the reservoirs; workers test the water every day. Words to quote: “the city’s savings account of water” or “Nobody notices clean water until it stops.”'}
  ],
  check:[
    {q:'A report on a bakery. Mr. Peretz, the baker, explains: “Proofing is the time the dough rests and rises before it bakes.” Quote it or paraphrase it?', o:['quote it','paraphrase it','leave it out'], h:'Does it give the exact meaning of a word?'},
    {q:'Same report. Benny writes: Mr. Peretz said, “The bakery opens at 5:00 in the morning.” What is wrong?', o:['a wasted quote','a lost phrase','nothing, it fits'], h:'Is the quote a plain fact anyone could say the same way?'},
    {t:'order', q:'Mr. Peretz said: “We light the ovens every morning before sunrise.” Paraphrase the plain fact. Tap the tiles in order.', tiles:['Mr. Peretz says','that before sunrise,','the bakers','light the ovens.'], h:'Who said it first. Then when. Then who does what.'}
  ],
  re:[
    {how:'A new way: quotes are like spices. A pinch, where it counts, makes the dish. A whole pot of spice ruins it. Plain facts are the main food: cook them in your own words.', q:'Quotes are like…', o:['spices: a pinch, where it counts','the main food','the plate']},
    {how:'A simpler step: for each note, ask one question: would my own words lose something? If not, paraphrase it. If yes, because it is a strong phrase, an expert’s view or a definition, quote it.', q:'If your own words would lose nothing…', o:['paraphrase it','quote it','copy it all']},
    {how:'The skill underneath: Proof from the Text and Quote It Right (Grade 5) taught you HOW to write a fact in your own words and HOW to weave in a quote. Now you go further: for every note you CHOOSE which one fits, by a rule, and you avoid wasted quotes and lost phrases.', q:'Quote or Paraphrase? goes further by teaching you to…', o:['choose which one fits each note','punctuate a quote','find a book']}
  ]},

  'WRIT.RES.L07.03':{name:'Credit the Source',
  teach:[
    {how:'In Grade 5 you wrote “According to the article,” before a fact. That tells the reader you used a source, but not WHICH one. Now give FULL CREDIT inside your paragraph: a SIGNAL PHRASE (who, plus a verb like explains, reports or says) with the AUTHOR or the TITLE. “In his book Where Our Water Begins, Nathan Weiss explains that…” “The city’s web page From Reservoir to Faucet reports that…” “Engineer Yosef Haddad told The Beacon, …” In Quote or Paraphrase? we wrote “the web page”; now name it.', q:'Which sentence gives full credit?', o:['In his book Where Our Water Begins, Nathan Weiss explains that the reservoirs fill up when it rains and when the snow melts.','According to a book, rain and melting snow fill the reservoirs.','Rain and melting snow fill the reservoirs.']},
    {how:'In Grade 5 you learned that a fact in your own words still gets a tag. Now most of your report is paraphrased, so this matters more than ever: every borrowed fact gets a signal phrase with the author or the title. Why does the reader need it? To CHECK the fact himself. To judge how much to TRUST it: an engineer at a filtration plant, or a stranger online? And to see which words and ideas are YOURS, so you never pass off someone else’s work as your own.', q:'Gavriel paraphrased a fact from the web page: the water passes through sand and gravel. Does it need credit?', o:['yes, a paraphrased fact needs credit too','no, only quotes need credit','no, because he changed the words']},
    {how:'Two mistakes. NO CREDIT: a borrowed fact or quote sits alone, as if you found it yourself. VAGUE CREDIT: “According to the article,” “I read online that,” “A book says,” “Experts say.” The reader cannot tell which source, so he cannot check it. Fix both the same way: a signal phrase with the author or the title.', q:'Yoni writes: “I read online that a small amount of chlorine kills germs in the water.” Which mistake is it?', o:['vague credit','no credit','full credit']}
  ],
  practice:[
    {t:'sort', q:'Every fact below came from the Beacon team’s sources. Sort each sentence.', bins:[{id:'F',label:'✅ Full credit'},{id:'V',label:'🌫️ Vague credit'},{id:'N',label:'🚫 No credit'}],
      items:[{label:'In his book Where Our Water Begins, Nathan Weiss explains that Baltimore’s water comes from three reservoirs outside the city.',bin:'F'},{label:'The city’s web page From Reservoir to Faucet reports that workers put a little chlorine in the water so germs cannot survive.',bin:'F'},{label:'According to the article, the water passes through sand and gravel.',bin:'V'},{label:'A website says water mains run under the streets.',bin:'V'},{label:'Workers test the water every day.',bin:'N'},{label:'Smaller pipes branch off the mains into each house.',bin:'N'}],
      h:'An author or a title: full. Just “the article” or “a website”: vague. Nothing at all: no credit.'},
    {t:'pairs', q:'Match each source to its signal phrase.', pairs:[['a fact from the library book','In his book Where Our Water Begins, Nathan Weiss explains that'],['a fact from the city web page','The city’s web page From Reservoir to Faucet reports that'],['words from the interview','Engineer Yosef Haddad told The Beacon,']],
      h:'A book: name the author. A web page: name its title. An interview: name the person and his job.'},
    {t:'spotall', q:'Tap every piece of the Beacon report that NEEDS CREDIT.', cells:[{label:'a quote from Mr. Haddad',ok:true},{label:'a fact from the book, in your own words',ok:true},{label:'a fact from the web page, in your own words',ok:true},{label:'your own topic sentence',ok:false},{label:'your own bridge sentence between two paragraphs',ok:false}],
      h:'Did it come from a source? Then it needs credit, even in your own words.'},
    {t:'sort', q:'Sneaky ones! Is the credit full, or does it need more?', bins:[{id:'F',label:'✅ Full credit'},{id:'M',label:'⚠️ Needs more'}],
      items:[{label:'Nathan Weiss writes that the reservoirs fill up when it rains and when the snow melts.',bin:'F'},{label:'Mr. Haddad, an engineer at a filtration plant, says workers test the water every day.',bin:'F'},{label:'The web page From Reservoir to Faucet explains that water mains run under the streets.',bin:'F'},{label:'According to the book, rain and melting snow fill the reservoirs.',bin:'M'},{label:'Experts say workers test the water every day.',bin:'M'},{label:'Someone said, “Nobody notices clean water until it stops.”',bin:'M'}],
      h:'Could the reader find this exact source? “The book”, “experts” and “someone” do not say which one.'},
    {t:'order', q:'Build Benny’s sentence with full credit. Tap the tiles in order.', tiles:['In his book Where Our Water Begins,','Nathan Weiss','calls the reservoirs','“the city’s savings account of water.”'],
      h:'Where first, then who. Then what he calls them, in his exact words.'},
    {t:'spotall', q:'Tap every reason a reader needs the credit.', cells:[{label:'to check the fact himself',ok:true},{label:'to judge how much to trust it',ok:true},{label:'to see which words and ideas are the writer’s own',ok:true},{label:'to make the paragraph longer',ok:false},{label:'to show how many books the writer read',ok:false}],
      h:'Think like the reader: what can he do once he knows where a fact came from?'},
    {t:'write', q:'Your turn to write. Write two or three sentences for the Beacon’s water report: one paraphrased fact and one quote, from two different sources. Give each one full credit.', min:0, checks:['📣 Each borrowed piece has a signal phrase.','✍️ Each names the author or the title.','🧾 I credited the paraphrased fact too, not only the quote.'], h:'Try “In his book Where Our Water Begins, Nathan Weiss explains that…” for a fact, and “Engineer Yosef Haddad told The Beacon,” before a quote.'}
  ],
  check:[
    {q:'A report on the yeshiva’s new sefer Torah. Yoni writes: “According to the article, the sofer worked on it for a year.” What kind of credit is this?', o:['vague credit','full credit','no credit'], h:'Which article? Could the reader find it?'},
    {q:'Eli writes: “In his book The Sofer’s Craft, Rabbi Dovid Stein explains that a sofer writes with a quill.” What kind of credit is this?', o:['full credit','vague credit','no credit'], h:'Is there a signal phrase? Does it name the author or the title?'},
    {t:'order', q:'Build a sentence that credits a paraphrased fact. Tap the tiles in order.', tiles:['Rabbi Stein','explains in his book','that a sofer','writes with a quill.'], h:'Who first, then the verb. Then the fact.'}
  ],
  re:[
    {how:'A new way: credit is like the return address on an envelope. It tells the reader exactly who sent the fact, so he can write back and check it. “A book” is like an envelope with no address.', q:'A signal phrase works like…', o:['a return address on an envelope','a stamp','the color of the envelope']},
    {how:'A simpler step: before every borrowed fact or quote, write WHO plus a verb: “Weiss explains that,” “The city’s web page reports that,” “Mr. Haddad says.”', q:'A signal phrase is…', o:['who, plus a verb like explains or says','a question','the last word']},
    {how:'The skill underneath: Proof from the Text (Grade 5), where a source tag like “According to the article,” went before a fact or a quote. Now you go further: you name the author or the title so the reader can find that exact source, you spot vague credit, and you can say why the reader needs it.', q:'Credit the Source goes further than “According to the article,” by…', o:['naming the author or the title','adding a picture','using more quotes']}
  ]},

  'WRIT.RES.L07.04':{name:'Notes to Outline',
  teach:[
    {how:'Your notes are sorted into groups. Now turn them into an OUTLINE: the plan of the whole report. Each group becomes a MAIN POINT: one for each body paragraph, written as a short sentence, in the order the report will go. For “How does Baltimore’s water get from the reservoirs to our kitchen faucet?”: I. The reservoirs store the water. II. A filtration plant cleans it. III. Pipes carry it to our homes.', q:'Which is a main point for the water report?', o:['A filtration plant cleans the water.','Chlorine kills germs.','Water.']},
    {how:'Under each main point go its SUB-POINTS: the facts that prove or explain it, marked A, B, C. After every sub-point, write its SOURCE in brackets, (book), (web page) or (interview), so you know whom to credit when you write. II. A filtration plant cleans it. A. Dirt settles to the bottom (web page). B. The water passes through sand and gravel (web page). C. Workers test it every day (interview).', q:'“Chlorine kills germs (web page).” Where does it go?', o:['a sub-point under II, a filtration plant','a main point of its own','under I, the reservoirs']},
    {how:'Three mistakes. A FACT AS A MAIN POINT: one small fact made into a whole paragraph (“II. Chlorine kills germs.”). UNDER THE WRONG POINT: a fact about pipes placed under the reservoirs. NO SOURCE: a sub-point with nothing in brackets, so later you cannot credit it. Check every line: main point, sub-point under the right point, source in brackets.', q:'Under “I. The reservoirs store the water,” Akiva wrote: “C. Water mains run under the streets (web page).” Which mistake is it?', o:['under the wrong point','no source','a fact as a main point']}
  ],
  practice:[
    {t:'sort', q:'Main point or sub-point? Sort each line of the water report outline.', bins:[{id:'M',label:'🏛️ Main point'},{id:'S',label:'🔹 Sub-point'}],
      items:[{label:'The reservoirs store the water.',bin:'M'},{label:'A filtration plant cleans it.',bin:'M'},{label:'Pipes carry it to our homes.',bin:'M'},{label:'Rain and melting snow fill the reservoirs.',bin:'S'},{label:'Dirt settles to the bottom.',bin:'S'},{label:'Smaller pipes branch off the mains into each house.',bin:'S'}],
      h:'Could it fill a whole paragraph? Main point. Is it one fact? Sub-point.'},
    {t:'pairs', q:'Match each sub-point to the main point it belongs under.', pairs:[['Rain and melting snow fill the reservoirs.','I. The reservoirs store the water.'],['The water passes through sand and gravel.','II. A filtration plant cleans it.'],['Water mains run under the streets.','III. Pipes carry it to our homes.']],
      h:'Ask: what is this fact about? Reservoirs, the plant, or pipes?'},
    {t:'spotall', q:'Tap every sub-point written the right way: a fact with its source in brackets.', cells:[{label:'Workers test the water every day (interview).',ok:true},{label:'A small amount of chlorine kills germs (web page).',ok:true},{label:'Rain and melting snow fill the reservoirs (book).',ok:true},{label:'Water mains run under the streets.',ok:false},{label:'Smaller pipes branch into each house (somewhere).',ok:false}],
      h:'Look at the end of each line. Does it name one of the team’s three sources?'},
    {t:'sort', q:'Outline mistakes! Sort each line.', bins:[{id:'R',label:'✅ Right'},{id:'W',label:'⚠️ Under the wrong point'},{id:'N',label:'⚠️ No source'}],
      items:[{label:'Under I (reservoirs): Rain and melting snow fill them (book).',bin:'R'},{label:'Under II (plant): Dirt settles to the bottom (web page).',bin:'R'},{label:'Under I (reservoirs): Chlorine kills germs (web page).',bin:'W'},{label:'Under II (plant): Smaller pipes branch off into each house (interview).',bin:'W'},{label:'Under III (pipes): Water mains run under the streets.',bin:'N'},{label:'Under II (plant): Workers test the water every day.',bin:'N'}],
      h:'First check: is the fact about that main point? Then check: is there a source in brackets?'},
