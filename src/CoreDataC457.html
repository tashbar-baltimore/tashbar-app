(function () {
  var P = {
    c45_thunder: { title: 'Thunder and Lightning', text: 'On a hot summer afternoon, Avrumi Katz and his Abba sat on the porch and watched dark clouds pile up over Baltimore. "Abba, what makes lightning?" Avrumi asked. Abba smiled and explained.\nInside a tall storm cloud, strong winds toss tiny bits of ice up and down. The bits bump and rub against each other. Because of all that bumping, the cloud builds up a huge charge of electricity. It is like the spark you feel when you touch a doorknob after walking on a rug, only millions of times bigger.\nFirst, the charge grows. Then, when it is big enough, it jumps across the sky or down to the ground in a giant spark. That spark is lightning.\nLightning is very hot, about five times hotter than the surface of the sun. It heats the air around it in a split second. As a result, the air bursts outward with a loud boom. That boom is thunder.\nLight travels much faster than sound, so you see the flash before you hear the boom. Count the seconds in between. Every five seconds means the storm is about one mile away.' },
    c45_fog: { title: 'Morning Fog', text: 'Some mornings, Glen Avenue disappears. The houses across the street look like gray shadows, and the trees fade into white. That is fog.\nFog forms on calm, clear nights. First, the ground loses its heat into the open sky. The ground gets colder and colder. As a result, the air right above the ground cools down too.\nCool air cannot hold as much water vapor as warm air. So some of the vapor turns into tiny drops of water. The drops are so small and light that they float in the air. Fog is really a cloud that sits on the ground.\nLater, the sun rises and warms the air. The tiny drops dry up, and the fog slowly fades away. Because of the sun, the houses come back, one by one.' },
    c45_cloud: { title: 'How a Cloud Forms', text: 'Look up on a summer day, and you may see a puffy white cloud. Where did it come from? It started as water down on the ground.\nFirst, the sun warms the water in lakes, rivers and even puddles. Some of the water evaporates. That means it turns into water vapor, a gas that you cannot see.\nNext, the warm, wet air rises. Why? Warm air is lighter than the cooler air around it.\nThen, high in the sky, the air cools. Cool air cannot hold as much water vapor as warm air, so the vapor condenses. It turns back into tiny drops of water. Each drop forms around a speck of dust, smoke or salt floating in the air.\nFinally, billions of these drops crowd together. As a result, we see a cloud. When the drops grow big and heavy, they fall as rain, and the water goes back to the ground to start again.' },
    c45_hail: { title: 'How Hail Grows', text: 'One summer afternoon, Tzvi Hirsch heard a loud rattle on the roof of his family\'s bakery. Little balls of ice were bouncing all over the sidewalk. It was hail, in the middle of summer!\nHail is made inside a tall thunderstorm cloud. First, strong winds called updrafts push raindrops high into the cloud. Up there, the air is below freezing, so the drops freeze into tiny balls of ice.\nNext, the ice balls fall a little, and fresh drops of water stick to them. Then the updraft pushes them up again, and the new water freezes into another layer of ice. This can happen again and again. Each trip adds a layer. That is why a hailstone cut in half often has rings, like an onion.\nFinally, the hailstones grow too heavy for the wind to hold up. So they fall to the ground, rattling on roofs and bouncing on sidewalks.' },
    c45_hurricane: { title: 'How a Hurricane Grows', text: 'A hurricane is one of the biggest storms on Earth. It can be hundreds of miles wide. But every hurricane starts small, over a warm ocean.\nMost hurricanes begin in late summer or early fall, when the sun has heated the top of the ocean to about 80 degrees Fahrenheit or more. Because the water is so warm, a lot of it evaporates.\nThe warm, wet air rises. It is lighter than the cooler air around it. High in the sky, the air cools, and its water vapor condenses into tall storm clouds.\nAs the air rises, more air rushes in across the water to take its place. That air warms up and rises too. The storm grows stronger and stronger.\nBecause the Earth turns, the rushing winds do not blow in a straight line. They curve and begin to spin in a giant circle. In the middle of the spinning storm is a calm, clear hole called the eye.\nWhen a hurricane moves over land, it loses the warm ocean water it needs. So it slowly grows weaker and dies out.' },
    c45_twostorms: { title: 'Two Spinning Storms', text: 'Hurricanes and tornadoes are both spinning storms with very strong winds. Both can knock down trees and tear the roofs off houses. But in many ways, the two storms are very different.\nA hurricane forms over a warm ocean. A tornado forms over land, under a giant thunderstorm cloud.\nA hurricane is huge. It can be hundreds of miles wide and cover many cities at once. A tornado is much smaller. Most tornadoes are less than a mile wide.\nA hurricane can last for a week or more. A tornado usually lasts only a few minutes.\nForecasters can watch a hurricane on satellite pictures for days before it reaches land. A tornado can form very quickly, and people may have only a few minutes of warning.\nThe two storms are different in size, place and time. But they are alike in one important way: when a warning comes, the safest thing to do is to listen and go where it is safe.' },
    c45_snowday: { title: 'A Snow Day in Baltimore', text: 'When a big snowstorm hits Baltimore, the whole city has a problem. Snow covers the streets, and ice makes them slippery. Buses get stuck, and cars slide at the corners.\nThe city has a plan to solve it. Before the snow even starts, trucks spread salt on the main roads. Salt keeps ice from forming, because salty water must get much colder than plain water before it freezes. When the snow begins to fall, big plows push it to the sides of the roads.\nFamilies help solve the problem too. On Glen Avenue, Yehuda Benaim and his Abba shoveled their front walk after Shacharis and sprinkled salt on the steps. Then they cleared the walk for Reb Gershon next door, who is eighty-one.\nBy the afternoon, the main roads were open again, and the sidewalks were safe. The snow was still there, but the problem was solved, one shovel at a time.' },
    c45_forecast: { title: 'How a Forecast Is Made', text: 'Every evening, the weather forecaster on the radio tells Baltimore if tomorrow will bring sun, rain or snow. How does he know? He follows the same steps every day.\nFirst, he gathers facts about the air. Twice a day, at hundreds of places around the world, weather balloons rise high into the sky. Each balloon carries a small box that measures the temperature, the wind and how wet the air is, and it radios the numbers back to the ground.\nNext, he looks at radar and satellite pictures. Radar shows where rain or snow is falling right now. Satellites far out in space take pictures of the clouds from above.\nThen, powerful computers use all these facts to figure out how the air will move over the next few days.\nFinally, the forecaster studies the computer maps, decides what he thinks will happen, and tells everyone the forecast.' },
    c45_rainorsnow: { title: 'Rain or Snow?', text: 'Rain and snow are both water that falls from clouds. Both start high up in a cloud, and both help fill rivers and lakes.\nBut rain and snow are different, too. Rain is liquid water. Snow is frozen water, made of tiny ice crystals that stick together into flakes.\nRain reaches the ground when the air near the ground is warmer than freezing. Snow reaches the ground when the air is cold all the way down.\nRaindrops are heavier, and they fall fast and splash. Snowflakes are light, and they drift down slowly and pile up.\nAfter a rainstorm, the water runs into the gutters right away. After a snowstorm, the snow can stay on the ground for days, until the sun melts it.\nSo the next time you look out the window, ask yourself: is it rain or snow, and how can you tell?' },
    c45_lightningrod: { title: 'The Lightning Rod', text: 'Long ago, lightning was a big problem for tall buildings. When lightning struck a tall tower or a barn, the building often caught fire. People did not know how to stop it.\nBenjamin Franklin, a printer and scientist in Philadelphia, thought of a solution. He knew that lightning is a giant spark of electricity. He also knew that electricity can travel easily through metal.\nHis idea was simple. Put a pointed iron rod on the very top of the building, and connect it to a thick wire that runs down the outside wall and deep into the ground.\nNow, when lightning strikes, it hits the rod instead of the roof. The electricity runs down the wire and into the ground, where it spreads out safely. The building is not harmed.\nThe solution worked so well that it is still used today. Look up at the top of a tall building in Baltimore, and you may see a lightning rod.' },
    c45_stormnight: { title: 'Counting the Thunder', text: 'Crack! A flash of lightning lit up Dovid\'s bedroom. He sat up in bed, his heart pounding.\n"Abba?" he called. "Are you awake?"\nAbba came in and sat on the edge of the bed. "I am here," he said softly. "Let\'s count together. One, two, three, four, five, six, seven, eight, nine, ten."\nBoom! The thunder rolled over the roof.\n"Ten seconds," said Abba. "Every five seconds is about one mile. Can you figure out how far away the storm is?"\nDovid thought for a moment. "Two miles!"\n"Right. And when the counting gets longer, the storm is moving away."\nThe next flash came, and they counted to fifteen. Then twenty. Then the rain softened to a whisper on the window.\nDovid lay back down. "Good night, Abba," he whispered. "Thank you for counting with me."' },
    c45_snowcall: { title: 'Will There Be School?', text: 'Binyamin pressed his nose against the cold window. Snow was falling fast, thick and white, and it had not stopped all night.\n"Zeidy," he asked, "do you think there is school tomorrow?"\nZeidy Yusupov looked up from the chessboard. "The radio will tell us at six o\'clock," he said. "Until then, it is your move."\nBinyamin moved his knight, but his eyes kept going back to the window. The wind howled, the shutters rattled, and the snow piled higher and higher on the porch rail.\nAt six, the radio crackled. "All schools in Baltimore will be closed tomorrow," said the announcer.\n"No school!" shouted Binyamin. "We can build a snow fort, learn with Zeidy, and go sledding!"\nZeidy smiled and tapped the board. "First," he said, "finish the game."' }
  };
