(function () {
  var LESSONS = {
  'WRIT.ESSAY.L07.09':{name:'Claim About a Character',
  teach:[
    {how:'The Beacon’s Book Corner prints a short story, “Show Me” (made up for these lessons). Shmuel was the best learner in sixth grade, and everyone knew it. When Rebbi gave out a hard Mishnah about a lost coin, Shmuel read it three times at home and still could not follow it. “I’ll do it myself,” he muttered, and he pushed the sefer to the edge of the table. At supper, when his mother asked about homework, he said, “It’s fine.” In the morning, his younger brother Pinchas, a fifth grader, saw the Mishnah and asked softly, “Want me to explain it? We learned it last month.” Shmuel froze. Then he slid the sefer to the middle of the table. “Show me.” A CLAIM ABOUT A CHARACTER says what he is LIKE (A TRAIT) or how he CHANGES (A CHANGE). A reader could disagree, so you must prove it. That is different from A PLOT FACT, which you can just point to on the page: “Shmuel read it three times.”', q:'Which is a claim about a character?', o:['Shmuel is too proud to ask for help.','Shmuel read the Mishnah three times.','Pinchas is in fifth grade.']},
    {how:'Prove the claim with TWO DETAILS from the story: what he says or does. One detail could be an accident; two make a pattern. Claim: Shmuel is too proud to ask for help. Detail 1: he mutters, “I’ll do it myself.” Detail 2: at supper he tells his mother, “It’s fine.” Then EXPLAIN what the details show about him: “Both times he hides that he is stuck, so no one sees the best learner needs help.” A CHANGE claim needs A DETAIL FROM THE START and A DETAIL FROM THE END. At the start, he pushes the sefer to the edge of the table. At the end, he slides it to the middle of the table and says, “Show me.”', q:'Claim: Shmuel changes from hiding that he is stuck to asking for help. Which two details prove the change?', o:['He pushes the sefer to the edge of the table; at the end he says, “Show me.”','He reads it three times; he has a brother.','The Mishnah is about a lost coin; it is morning.']},
    {how:'Three mistakes. A PLOT FACT, not a claim: “Shmuel has a younger brother.” Nobody can disagree, so there is nothing to prove. A DETAIL THAT DOES NOT PROVE IT: true, and from the story, but it shows something else. “Shmuel is proud. He reads the Mishnah three times. This shows his pride.” Reading it three times shows he works hard, not that he is proud. NO EXPLANATION: two details, and then the paragraph stops. The reader has to guess what they show. Fix it with one more sentence: what do both details show about him?', q:'Eli writes: “Shmuel is proud. He says, ‘I’ll do it myself.’ He tells his mother, ‘It’s fine.’” What is missing?', o:['an explanation','a claim','a detail']}
  ],
  practice:[
    {t:'sort', q:'Claim about a character, or a plot fact? Sort each sentence about “Show Me.”', bins:[{id:'C',label:'💡 Claim about a character'},{id:'P',label:'📖 Plot fact'}],
      items:[{label:'Shmuel is too proud to ask for help.',bin:'C'},{label:'Shmuel changes from hiding that he is stuck to asking for help.',bin:'C'},{label:'Pinchas is gentle with his older brother.',bin:'C'},{label:'Rebbi gave out a Mishnah about a lost coin.',bin:'P'},{label:'Pinchas is in fifth grade.',bin:'P'},{label:'Shmuel read the Mishnah three times.',bin:'P'}],
      h:'Could a reader disagree, so you must prove it? Claim. Can you just point to it on the page? Plot fact.'},
    {t:'pairs', q:'Match each claim to the detail that proves it.', pairs:[['Shmuel is too proud to ask for help.','He mutters, “I’ll do it myself.”'],['Pinchas is gentle.','He asks softly, “Want me to explain it?”'],['Shmuel works hard.','He reads the Mishnah three times.'],['In the end, Shmuel is ready to learn.','He slides the sefer to the middle of the table.']],
      h:'Read the claim. Then find what Shmuel or Pinchas says or does that shows it.'},
    {t:'spotall', q:'Claim: Shmuel changes from hiding that he is stuck to asking for help. Tap every detail that proves the change.', cells:[{label:'At the start, he pushes the sefer to the edge of the table.',ok:true},{label:'At supper, he tells his mother, “It’s fine.”',ok:true},{label:'At the end, he slides the sefer to the middle and says, “Show me.”',ok:true},{label:'Rebbi gave out a Mishnah about a lost coin.',ok:false},{label:'Pinchas is a fifth grader.',ok:false}],
      h:'A change needs a detail from the start (hiding) and a detail from the end (asking). A plain fact about the story proves nothing.'},
    {t:'sort', q:'Sneaky ones! Is the proof strong, or which mistake is it?', bins:[{id:'S',label:'✅ Strong proof'},{id:'D',label:'⚠️ A detail that does not prove it'},{id:'N',label:'⚠️ No explanation'}],
      items:[{label:'Shmuel is proud. He mutters, “I’ll do it myself,” and says, “It’s fine.” Both hide that he is stuck.',bin:'S'},{label:'Pinchas is gentle. He asks softly, and he offers help. Both show he is not showing off.',bin:'S'},{label:'Shmuel is proud. He reads the Mishnah three times. This shows his pride.',bin:'D'},{label:'Pinchas is gentle. He is in fifth grade. This shows he is kind.',bin:'D'},{label:'Shmuel is proud. He mutters, “I’ll do it myself.” He says, “It’s fine.”',bin:'N'},{label:'Pinchas is gentle. He asks softly. He offers help.',bin:'N'}],
      h:'First: does the detail really show the trait? If not, it is a detail that does not prove it. If the details fit, look for a last sentence that says what they show.'},
    {t:'order', q:'Build Akiva’s paragraph for the Book Corner. Tap the sentences in order.', tiles:['Shmuel is too proud to ask for help.','First, he mutters, “I’ll do it myself.”','Later, he tells his mother, “It’s fine.”','Both times, he hides that he is stuck.'],
      h:'The claim first. Then the first detail and the later one. The explanation of both comes last.'},
    {t:'pairs', q:'Match each mistake to an example.', pairs:[['A plot fact, not a claim','Shmuel has a younger brother.'],['A detail that does not prove it','Shmuel is proud. The Mishnah is about a coin. This shows his pride.'],['No explanation','Shmuel is proud. He says, “I’ll do it myself.” He says, “It’s fine.”']],
      h:'Nothing to argue about? A detail about something else? Or two details and then it stops?'},
    {t:'write', q:'Your turn to write. Write a claim about Pinchas (a trait) or about Shmuel’s change in “Show Me.” Prove it with two details from the story. Then write one sentence that explains what the details show.', min:0, checks:['💡 My claim says what the character is like, or how he changes.','🔍 I used two details from the story. For a change: one from the start, one from the end.','🧠 My last sentence explains what the details show about him.'], h:'Try: “Pinchas is gentle.” Look at HOW he speaks, and WHAT he offers. Then finish: “Both show that…”'}
  ],
  check:[
    {q:'A new Book Corner story, “The Window Seat”: Ezra always grabs the back window seat on the yeshiva bus. One rainy Sunday, a new boy with a cast on his arm has nowhere to sit, and Ezra gives him the window. Yoni writes: “Ezra rides the yeshiva bus every morning.” What is it?', o:['a plot fact','a claim about a character','an explanation'], h:'Could anyone disagree with it, or can you just point to it in the story?'},
    {q:'Same story. Claim: “Ezra changes from thinking only of himself to thinking of Refael.” Benny’s only proof: “At the next stop, Ezra gives Refael the window.” What does it still need?', o:['a detail from the start','a plot fact','a new claim'], h:'A change needs two ends. Which end is missing?'},
    {t:'order', q:'Build a change claim about Ezra. Tap the tiles in order.', tiles:['Ezra changes','from thinking','only of himself','to thinking of Refael.'], h:'Who first. Then “from” what he was like. Then “to” what he becomes.'}
  ],
  re:[
    {how:'A new way: a claim about a character is like a detective’s report. He names what he thinks is true, shows two clues, and says how the clues point there. One clue could be luck. Two clues and a reason make a case.', q:'The two details are like…', o:['a detective’s clues','the detective’s hat','the end of the case']},
    {how:'A simpler step: fill in a frame. “[Name] is [trait]. First, [detail]. Later, [detail]. Both times, [what they show].” For a change: “[Name] changes from … to ….”', q:'After the two details, the frame says…', o:['what both details show','a new character','the title']},
    {how:'The skill underneath: Quote evidence and explain it (this year), where you proved a claim about a real-world topic with evidence and an explanation. Now you go further: the claim is about a CHARACTER in a story, a trait or a change, the proof is two details of what he says and does, and a change needs one from the start and one from the end.', q:'Claim About a Character goes further by proving…', o:['what a character is like, or how he changes','that a school rule is fair','how to spell a name']}
  ]},

  'WRIT.PARA.L07.09':{name:'RACE Answer',
  teach:[
    {how:'Remember “Show Me” from the Book Corner. Shmuel, the best learner in sixth grade, could not follow a hard Mishnah. “I’ll do it myself,” he muttered, and he pushed the sefer to the edge of the table. At supper he told his mother, “It’s fine.” In the morning his younger brother Pinchas asked softly, “Want me to explain it?” Shmuel froze. Then he slid the sefer to the middle of the table. “Show me.” In Grade 4 the answer was a sentence you could find in the text. A why question about a story is different: the answer is NOT written on the page. You figure it out from what the character says and does, and then you prove it. That takes a real paragraph: RACE. R, RESTATE: turn the question into the start of your answer. A, ANSWER: give one clear answer in that sentence. Question: “Why does Shmuel push the sefer away?” Restate and answer: “Shmuel pushes the sefer away because he is too proud to say he is stuck.”', q:'Question: “Why does Shmuel push the sefer away?” Which sentence restates the question and answers it?', o:['Shmuel pushes the sefer away because he is too proud to say he is stuck.','Because he is proud.','The sefer goes to the edge of the table.']},
    {how:'C, CITE: prove the answer from the text, with a tag like “In the story,” or “The author writes,” and a detail or a quote. “In the story, he mutters, ‘I’ll do it myself.’” E, EXPLAIN: say how the cite proves your answer. Start with “This shows” or “This means”. “This shows he would rather quit than ask.” Cite is WHAT THE STORY SAYS. Explain is WHAT IT SHOWS. Four parts, three or four sentences: a real paragraph.', q:'Which sentence is the Explain?', o:['This shows he would rather quit than ask.','In the story, he mutters, “I’ll do it myself.”','Shmuel pushes the sefer away.']},
    {how:'Three mistakes. NO RESTATE: the answer starts with “Because he is proud.” The reader cannot tell what question it answers. NO EXPLAIN: the answer stops right after the quote, and the reader must guess how it proves anything. RETELLING: the answer tells what happens in the story, step by step, but never answers the question. “Shmuel reads a hard Mishnah. He pushes it away. Then Pinchas helps him.” Check: did I answer WHY, or just tell WHAT happened?', q:'Question: “Why does Shmuel say ‘Show me’?” Yoni writes: “Shmuel reads a Mishnah. He pushes it away. In the morning, Pinchas sees it.” Which mistake is it?', o:['retelling','no restate','no explain']}
  ],
  practice:[
    {t:'sort', q:'Two questions about “Show Me”: “Why does Shmuel push the sefer away?” and “How does Pinchas help Shmuel?” Sort each sentence by its RACE part.', bins:[{id:'R',label:'🔁 Restate + Answer'},{id:'C',label:'📌 Cite'},{id:'E',label:'🧠 Explain'}],
      items:[{label:'Shmuel pushes the sefer away because he is too proud to say he is stuck.',bin:'R'},{label:'Pinchas helps Shmuel by offering help in a gentle way.',bin:'R'},{label:'In the story, Shmuel mutters, “I’ll do it myself.”',bin:'C'},{label:'For example, Pinchas asks softly, “Want me to explain it?”',bin:'C'},{label:'This shows he would rather quit than ask.',bin:'E'},{label:'This means Pinchas helps without making his brother feel small.',bin:'E'}],
      h:'Restate + Answer uses the question’s words. Cite is what the story says. Explain says what it shows.'},
    {t:'pairs', q:'Match each RACE letter to its job.', pairs:[['R: Restate','turn the question into the start of your answer'],['A: Answer','give one clear answer'],['C: Cite','give a detail or a quote from the story'],['E: Explain','say how the cite proves your answer']],
      h:'R uses the question. A answers it. C shows where. E says how.'},
    {t:'spotall', q:'Question: “Why does Shmuel freeze?” Tap every answer that RESTATES the question.', cells:[{label:'Shmuel freezes because his younger brother knows what he does not.',ok:true},{label:'Shmuel freezes because he is ashamed to need help.',ok:true},{label:'The reason Shmuel freezes is that a younger boy offers to teach him.',ok:true},{label:'Because he is ashamed.',ok:false},{label:'He is surprised.',ok:false}],
      h:'Does the answer use the question’s words, “Shmuel freezes”? Then the reader knows what it answers.'},
    {t:'pairs', q:'Question: “Why does Shmuel push the sefer away?” Match each label to an answer.', pairs:[['Full RACE','Shmuel pushes the sefer away because he is proud. He mutters, “I’ll do it myself.” This shows he won’t ask.'],['No explain','Shmuel pushes the sefer away because he is proud. He mutters, “I’ll do it myself.”'],['No restate','Because he is proud. He mutters, “I’ll do it myself.” This shows he won’t ask.'],['Retelling','Shmuel reads a Mishnah. He pushes the sefer away. Then he eats supper.']],
      h:'Check each answer for all four parts. Which part is missing? Or does it only tell what happened?'},
    {t:'order', q:'Build Eli’s RACE answer to “Why does Shmuel push the sefer away?” Tap the sentences in order.', tiles:['Shmuel pushes the sefer away because he is too proud to say he is stuck.','For example, in the story, he mutters, “I’ll do it myself.”','This shows he would rather quit than ask.'],
      h:'Restate and answer first. “For example” brings the cite. “This shows” explains it.'},
    {t:'sort', q:'Sneaky ones! Cite or Explain?', bins:[{id:'C',label:'📌 Cite'},{id:'E',label:'🧠 Explain'}],
      items:[{label:'In the story, Shmuel froze.',bin:'C'},{label:'The author writes that Pinchas asks softly.',bin:'C'},{label:'At supper, Shmuel tells his mother, “It’s fine.”',bin:'C'},{label:'This shows he is ashamed to need help.',bin:'E'},{label:'This means Pinchas does not want to embarrass him.',bin:'E'},{label:'So Shmuel hides the problem even at home.',bin:'E'}],
      h:'Cite: you could find it in the story. Explain: it tells what that part shows or means.'},
    {t:'write', q:'Your turn to write. Answer this question about “Show Me” in a RACE paragraph: “Why does Shmuel finally say ‘Show me’?”', min:0, checks:['🔁 My first sentence restates the question and answers it.','📌 I cited the story with a tag and a detail or a quote.','🧠 I explained how the cite proves my answer, starting with “This shows” or “This means”.'], h:'Start: “Shmuel finally says ‘Show me’ because…” Look at HOW Pinchas asks. Then: “This shows…”'}
  ],
  check:[
    {q:'A new Book Corner story, “The Window Seat”: on a rainy Sunday, a new boy named Refael gets on the yeshiva bus with a cast on his arm. He stands in the aisle, holding the pole with his good hand. Then Ezra gives him the window seat. Question: “Why does Ezra give Refael the window?” Benny starts: “Because Refael is hurt.” Which mistake is it?', o:['no restate','retelling','no explain'], h:'Does the answer use the question’s words? Could a reader tell what question it answers?'},
    {q:'Same question. Gavriel writes: “Ezra gives Refael the window because Refael is hurt. In the story, Refael holds the pole with his good hand.” Which mistake is it?', o:['no explain','no restate','retelling'], h:'Find the four parts. What comes after the cite?'},
    {t:'order', q:'Build a RACE answer to “Why does Ezra give Refael the window?” Tap the sentences in order.', tiles:['Ezra gives Refael the window because Refael is hurt.','For example, in the story, Refael holds the pole with his good hand.','This shows Ezra sees how hard the ride is for him.'], h:'Restate and answer first. “For example” brings the cite. “This shows” explains it.'}
  ],
  re:[
    {how:'A new way: RACE is how you answer Rebbi in shiur. You say what he asked, you give the answer, you show the mekor inside, and you explain the pshat. Nobody says “the answer is yes” and sits down.', q:'Cite is like showing…', o:['the mekor inside','your pencil','the clock']},
    {how:'A simpler step: use three starters. Restate and answer: “[the question’s words] because…”. Cite: “In the story,…”. Explain: “This shows…”.', q:'The Explain sentence can start with…', o:['This shows','In the story,','Because']},
    {how:'The skill underneath: Answer from the Text (Grade 4), where you turned the question around and answered in one full sentence with a detail from the text. Now you go further: a why question about a story has an answer that is NOT written on the page. You figure it out, Cite the story with a tag, and Explain how the cite proves your answer, in a real paragraph.', q:'RACE goes further than Answer from the Text by adding…', o:['a Cite with a tag, and an Explain','a title','a drawing']}
  ]},

  'WRIT.PARA.L07.10':{name:'The Author’s Craft',
  teach:[
    {how:'Remember “Show Me.” It starts: “Shmuel was the best learner in sixth grade, and everyone knew it.” Stuck at home on a hard Mishnah, “I’ll do it myself,” he muttered, and he pushed the sefer to the edge of the table. At supper he told his mother, “It’s fine.” In the morning his younger brother Pinchas asked softly, “Want me to explain it?” Shmuel froze. Then he slid the sefer to the middle of the table. “Show me.” An author CHOOSES every part on purpose. Look for four kinds of choice. A WORD: “muttered,” not “said.” A DETAIL: the sefer pushed to the edge of the table. A SHORT SENTENCE: “Shmuel froze.” or “Show me.” A short sentence is about LENGTH: the whole sentence is tiny. (The single word “froze” would be a word choice; here we look at the whole two-word sentence.) WHERE THE STORY STARTS: with “everyone knew it.”', q:'In “Show Me,” which is a word choice?', o:['“muttered,” not “said”','the sefer at the edge of the table','starting with “everyone knew it”']},
    {how:'Writing about craft means saying WHY. Use the pattern: “The author [the choice] to show [something about the character]” or “to make the reader [feel or see something].” “The author writes ‘muttered,’ not ‘said,’ to show that Shmuel is upset and talking only to himself.” “The author ends with the short sentence ‘Show me.’ to make the reader feel how big that small step is.” “The author starts with ‘everyone knew it’ to show why asking for help is so hard for Shmuel.”', q:'Which sentence explains WHY?', o:['The author has Shmuel push the sefer to the edge of the table to show he is pushing the problem away.','The author has Shmuel push the sefer to the edge of the table.','Shmuel pushes the sefer.']},
    {how:'Two mistakes. NO WHY: you name the choice and stop. “The author uses the word ‘muttered.’” So what? A VAGUE WHY: a reason that fits any story in the world. “To make it interesting.” “To make the story better.” Fix both the same way: ask what THIS choice shows about THIS character, or what it makes the reader feel at THIS moment.', q:'Benny writes: “The author ends with ‘Show me.’ to make the story interesting.” Which mistake is it?', o:['a vague why','no why','nothing, it fits']}
  ],
  practice:[
    {t:'sort', q:'What kind of choice is it? Sort each one from “Show Me.”', bins:[{id:'W',label:'🔤 A word'},{id:'D',label:'🔍 A detail'},{id:'S',label:'✂️ A short sentence'}],
      items:[{label:'muttered',bin:'W'},{label:'softly',bin:'W'},{label:'the sefer pushed to the edge of the table',bin:'D'},{label:'the sefer slid to the middle of the table',bin:'D'},{label:'the whole sentence “Shmuel froze.”',bin:'S'},{label:'the whole sentence “Show me.”',bin:'S'}],
      h:'One word inside a longer sentence: a word. Something you can see happen: a detail. A whole sentence of two words: a short sentence.'},
    {t:'pairs', q:'Match each choice to WHY the author made it.', pairs:[['“muttered,” not “said”','to show Shmuel is upset and talking only to himself'],['the sefer pushed to the edge of the table','to show he is pushing the problem away'],['the short sentence “Show me.” at the end','to make the reader feel how big that small step is'],['starting with “everyone knew it”','to show why asking for help is so hard for him']],
      h:'Ask: why this, and not something else? What does it show, or make the reader feel?'},
    {t:'spotall', q:'Tap every sentence that says WHY the author made the choice.', cells:[{label:'The author writes “muttered” to show that Shmuel is upset.',ok:true},{label:'The author ends with “Show me.” to make the reader feel Shmuel’s big step.',ok:true},{label:'The author starts with “everyone knew it” to show why Shmuel cannot ask.',ok:true},{label:'The author uses the word “muttered.”',ok:false},{label:'The author ends with a short sentence.',ok:false}],
      h:'Look for “to show” or “to make the reader”, and a reason about this story.'},
    {t:'sort', q:'Sneaky ones! Real why, or which mistake?', bins:[{id:'G',label:'✅ Real why'},{id:'N',label:'⚠️ No why'},{id:'V',label:'⚠️ A vague why'}],
      items:[{label:'The author has Pinchas ask softly to show he is not showing off.',bin:'G'},{label:'The author has Shmuel slide the sefer to the middle to show he is letting his brother in.',bin:'G'},{label:'The author writes the short sentence “Shmuel froze.”',bin:'N'},{label:'The author starts with “everyone knew it.”',bin:'N'},{label:'The author writes “muttered” to make the story better.',bin:'V'},{label:'The author ends with “Show me.” to make it interesting.',bin:'V'}],
      h:'No reason at all: no why. A reason that would fit any story: vague. A reason about this story: real.'},
    {t:'order', q:'Build Gavriel’s sentence for the Book Corner. Tap the tiles in order.', tiles:['The author writes','“muttered,” not “said,”','to show that Shmuel is upset','and talking only to himself.'],
      h:'The author and the choice first. Then “to show” and what it shows.'},
    {t:'spotall', q:'The choice: the sefer pushed to the edge of the table. Tap every REAL why.', cells:[{label:'to show he is pushing the problem away',ok:true},{label:'to show he does not want anyone to see he is stuck',ok:true},{label:'to make the reader feel how alone he is',ok:true},{label:'to make the story interesting',ok:false},{label:'to make it better',ok:false}],
      h:'A real why is only true of THIS story. A why that fits any story is vague.'},
    {t:'write', q:'Your turn to write. Pick one choice the author made in “Show Me”: a word, a detail, a short sentence, or where the story starts. Write two sentences about it for the Book Corner, using the pattern “The author … to show …” or “… to make the reader …”.', min:0, checks:['🔍 I named the choice and quoted it.','🎯 I used “to show” or “to make the reader”.','💡 My why is about THIS story, not a reason that fits any story.'], h:'Try the detail at the end: the sefer slides to the middle of the table. What does that show about Shmuel now?'}
  ],
  check:[
    {q:'A new Book Corner story, “The Window Seat,” opens: “Every morning, Ezra ran to the yeshiva bus to get the window seat in the back row.” Later, Ezra gives that seat to a new boy with a cast on his arm. What kind of choice is the opening?', o:['where the story starts','a word','a short sentence'], h:'Is it about one word, a tiny sentence, or how the story begins?'},
    {q:'In the same story, the author writes the sentence “Every other seat was taken.” Yoni writes: “The author uses the sentence ‘Every other seat was taken.’” Which mistake is it?', o:['no why','a vague why','nothing, it fits'], h:'Does Yoni say why the author wrote it?'},
    {t:'order', q:'In “The Window Seat,” Refael stands holding the pole with his good hand. Build a sentence about the author’s choice. Tap the tiles in order.', tiles:['The author has Refael','hold the pole with his good hand','to show the reader','how hard the ride is for him.'], h:'The author and the choice first. Then “to show” and what it shows.'}
  ],
  re:[
    {how:'A new way: an author is like a photographer. He chooses what goes in the picture and what to zoom in on. Writing about craft asks: why did he zoom in HERE?', q:'Writing about craft asks…', o:['why the author zoomed in here','what camera he used','how long the story is']},
    {how:'A simpler step: copy the choice first: “The author writes ‘muttered’…”. Then ask one question: what does this tell me about Shmuel? Finish with “to show…”.', q:'After “The author writes ‘muttered’”, add…', o:['to show…','the end','a new story']},
    {how:'The skill underneath: Hook and Orient (this year), where YOU chose how to open your own story. Now you go further: you read someone else’s story, spot the choices the author made, a word, a detail, a short sentence or where it starts, and write WHY he made them.', q:'The Author’s Craft goes further by asking…', o:['why another author made his choices','how to spell his name','how long his story is']}
  ]},

  'WRIT.ESSAY.L07.10':{name:'Revise for Argument',
  teach:[
    {how:'Yoni wrote a Book Corner piece about “Show Me.” His claim: Shmuel changes from too proud to ask for help to ready to learn from his younger brother. In Grade 5 you revised the whole piece for order, missing parts and fit. Now REVISE FOR ARGUMENT: every body paragraph must PROVE THE CLAIM. Ask each paragraph one question: does this paragraph prove my claim? A paragraph that proves the claim has a point that links to the claim, a detail from the story, and an explanation.', q:'Which paragraph proves Yoni’s claim?', o:['At first, Shmuel hides that he is stuck. He mutters, “I’ll do it myself.” This shows he would rather quit than ask.','Then Shmuel goes home. In the morning, Pinchas sees the Mishnah. Pinchas is in fifth grade.','I once had a hard Gemara too, and my father helped me.']},
    {how:'The biggest mistake in writing about reading is RETELLING: a paragraph that tells what happens next, and next, and next. Every sentence is true, but it proves nothing: no point, no explanation. Yoni’s third paragraph: “Then Shmuel goes home. His mother asks about homework, and he says it is fine. In the morning, Pinchas sees the Mishnah.” That is retelling. A second mistake: OFF THE CLAIM, a paragraph about something else, like the writer’s own story. Yoni’s fifth paragraph: “I once had a hard Gemara too, and my father helped me.”', q:'“Then Shmuel goes home. In the morning, Pinchas sees the Mishnah.” Which is it?', o:['retelling','off the claim','proves the claim']},
    {how:'Three choices for each paragraph. KEEP IT if it proves the claim. FIX IT if it retells but has a good detail: add a point that links to the claim, keep the detail, and add an explanation. “Even at home, Shmuel keeps hiding. For example, when his mother asks about homework, he says, ‘It’s fine.’ He hides it even from his mother, which shows how strong his pride is at the start.” CUT IT if it is off the claim. Adding more events is NOT a fix: it is more retelling.', q:'Yoni’s paragraph about his own hard Gemara. What should he do?', o:['cut it','fix it','keep it']}
  ],
