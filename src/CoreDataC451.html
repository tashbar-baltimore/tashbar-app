(function () {
  var P = {
    c45_sukkah: { title: 'The Sukkah on Glen Avenue', text: 'On the night after Yom Kippur, Abba and Yehuda Benaim carried the sukkah boards up from the basement. There were eight boards, each one painted white with blue trim. Yehuda\'s job was to hold each board straight while Abba screwed them together. It took them almost two hours. By the time they finished, the moon was high, and Yehuda\'s arms ached.\nThe next morning, Savta came out with a bowl of dates and a ball of string. She showed Yehuda how to tie the dates so they would hang from the s\'chach like little brown lanterns. "In Morocco," she said, "my father hung dates and pomegranates in our sukkah every year." Yehuda tied twelve strings of dates. When his little sisters saw them, they clapped and asked if they could eat one.\n"After Yom Tov," said Savta, laughing.' },
    c45_bakery: { title: 'Friday at the Bakery', text: 'Every Friday, Tzvi Hirsch Gold wakes up at five o\'clock. His family owns the kosher bakery on the corner of Glen Avenue, and Friday is the busiest day of the week. Tzvi Hirsch\'s job is to fold the bakery boxes. He folds sixty boxes before davening. His Abba braids the challah dough, and the big oven heats up to four hundred degrees.\nBy seven o\'clock, the first trays come out, golden and shiny. People line up outside before the door even opens. Everyone wants fresh challah for Shabbos. Old Mr. Weiss always buys two round challos with raisins. Rabbi Feldman buys six small rolls for his children.\nAt eight, Tzvi Hirsch eats one warm roll and runs to catch the school bus. He is tired all morning, but he never complains. He says the smell of fresh challah is worth it.' },
    c45_bees: { title: 'Bees in Winter', text: 'When the weather turns cold, most insects hide or die. Honeybees do something different. They stay awake all winter inside the hive.\nThe bees crowd together in a tight ball called a winter cluster. The queen bee stays in the middle of the ball. The worker bees on the outside shiver their wing muscles without flying. All that shivering makes heat. On the coldest days, the middle of the cluster can be as warm as a summer afternoon.\nThe bees take turns. A bee on the cold outside slowly works her way in, and a warm bee moves out.\nTo keep shivering, the bees need energy. They eat the honey they stored in the summer. A strong hive can eat about thirty pounds of honey in one winter. That is why a good beekeeper never takes all the honey in the fall.' },
    c45_chess: { title: 'The Last Move', text: 'Binyamin Yusupov sat across the chessboard from his Zeidy. The kitchen was quiet except for the ticking of the clock above the sink. Zeidy had won the last six games in a row.\nBinyamin had only his king, a rook and two pawns left. Zeidy had a queen. Binyamin\'s hands were cold, and he kept rubbing them on his knees. He had not said a word in ten minutes.\nThen he saw it. If he moved his rook all the way across the board, Zeidy\'s king would have nowhere to go. Binyamin checked the move three times. He touched the rook, lifted it, and set it down with a soft click.\n"Check," he whispered. "And I think it\'s mate."\nZeidy leaned forward and looked at the board for a long time. Slowly, a smile spread across his face. He reached over and shook Binyamin\'s hand.\n"Seven games," said Zeidy. "It took you seven games. Next time it will take you six."' },
    c45_leaves: { title: 'Why Leaves Change Color', text: 'In the summer, most leaves are green. They are green because they are full of chlorophyll. Chlorophyll is a green material that helps a leaf use sunlight to make food for the tree.\nIn the fall, the days get shorter and cooler. The tree gets ready to rest for the winter, so it stops making chlorophyll. As the green fades away, other colors that were hiding in the leaf all summer begin to show. Yellow and orange were there the whole time, covered up by the green.\nSome trees, like maples, also make a brand new red color in the fall. Sunny days and cool nights make the reds brightest.\nAt last, the tree grows a thin wall where each leaf meets its branch. Water can no longer reach the leaf. It dries up, turns brown, and falls to the ground.' },
    c45_tower: { title: 'The Tower on the Hill', text: 'High on a hill in Baltimore stands a tall stone tower. It looks like a castle from a storybook, but it was built for a very plain reason: water.\nMore than one hundred years ago, the city needed a way to push water up into the houses on the hills. Workers pumped water into a tall pipe inside the tower. Because the water stood so high, its weight pushed it down and out through pipes, all the way into people\'s kitchens.\nThe builders did not want an ugly pipe sticking up over the city. So they wrapped it in a beautiful tower with arched windows and a pointed roof. Today the pipe is empty. Newer pumps do the work. But the tower still stands, and on clear days people can see it from miles away.' },
    c45_owls: { title: 'How Owls Hunt at Night', text: 'An owl can catch a mouse in the dark. How does it do it?\nFirst, an owl has huge eyes. They take in much more light than our eyes do, so the owl can see when the night looks black to us.\nSecond, an owl hears better than almost any other bird. One of its ears sits a little higher than the other. A sound reaches one ear a tiny bit before the other ear. That helps the owl tell exactly where the sound came from, even under the snow.\nThird, an owl flies without a sound. The edges of its feathers are soft and fringed, like a comb. They break up the air, so the wings do not whoosh. The mouse never hears it coming.' },
    c45_esrog: { title: 'The Missing Esrog (from Chapter 1)', text: 'When the bell rang again, the boys ran back up the stairs, red-cheeked and loud. They burst into the room. Then they stopped.\nRabbi Feldman was not there. His black coat still hung on the hook by the door. But the hook next to it, where his hat always hung, was empty.\nThe silver box sat on the desk where he had left it. The lid was open. Dovid reached it first. He looked inside and turned pale.\n"It\'s empty," he said. "The esrog is gone."\nYehuda leaned close to the box. The white cloth lay inside, folded neatly in half. It still smelled of lemons, strong and fresh. Yehuda thought about that. If you were stealing something, would you stop to fold the cloth?' },
    c45_snow: { title: 'A Quiet Morning', text: 'Avrumi woke up and lay still. The room was strangely bright, and the street outside was completely silent. No cars. No bus. Not even the usual garbage truck.\nHe heard the scrape, scrape, scrape of a shovel. When he went downstairs, Abba\'s boots stood by the door in a puddle of water, and Abba\'s cheeks were bright red. Ima was on the phone. "So no school at all today?" she said. "Thank you for calling."\nAvrumi\'s little brother ran past him in two sweaters, a hat and one mitten, shouting, "Where is my other mitten?"\nOn the kitchen table stood a pot of hot cocoa and seven mugs. Next to it lay Abba\'s gloves, soaking wet, and a long list in Ima\'s writing: "sled, scarves, extra socks, carrots for the nose."' },
    c45_nosson: { title: 'The Missing Esrog (from Chapter 2)', text: '"That," said Tzvi Hirsch, folding his arms, "is exactly what we want to know."\nNosson\'s cheeks turned pink. He put the magnifying glass down on the rebbe\'s desk very carefully, the way you put down something that is not yours, and walked to his seat without another word.\nYehuda looked at Nosson, who was reading his book, or pretending to. Nosson\'s shoulders were hunched up near his ears. He turned a page, then turned it back.\nTzvi Hirsch leaned forward. His face was red. "You see?" he whispered. "He took it. Case closed."\nYehuda felt his stomach tighten. He did not like the feeling. He looked down at his notebook, then over at Nosson, then down again. Binyamin, who sat next to him, said nothing at all. He only shook his head slowly, the way he did when someone made a bad move in chess.' },
    c45_spell: { title: 'The Last Word', text: 'Only two boys were left on the stage: Eli and Shloimy. The whole school sat in rows, and nobody made a sound.\n"Eli," said the judge, "your word is necessary."\nEli wiped his hands on his pants. He closed his eyes for a moment. Then he spelled it slowly, one letter at a time, and stopped.\nThe judge smiled. "Correct."\nEli let out a long breath, and his shoulders dropped. In the third row, his little brother jumped up and down, waving both arms over his head.\nShloimy, waiting for his turn, stared at the floor. He kept twisting the button on his shirt around and around. When the judge called his name, his voice came out as a squeak, and a few boys laughed. Shloimy\'s ears turned red.' },
    c45_gadget: { title: 'Dovid\'s Basement Laboratory', text: 'Dovid Lerner\'s basement is an unbelievable place. There are batteries, magnets, flashlights and a broken computer keyboard. On the wall hangs a calendar covered in reminders, and on the workbench sits a notebook full of drawings.\nDovid\'s newest invention is a remarkable alarm for the sukkah. When the wind blows too hard, a little fan spins, a wire touches a magnet, and a buzzer sounds. Then everyone knows to bring the cushions inside before they get wet.\nHis sister calls the basement a disaster. Dovid calls it a laboratory. His Abba, an engineer, calls it wonderful, as long as Dovid puts the tools back.' },
    c45_hunters: { title: 'The Hurricane Hunters', text: 'Most pilots stay far away from storms. The hurricane hunters fly right into them.\nThese pilots fly special airplanes into the middle of a hurricane. The ride is bumpy and dangerous. Inside the plane, scientists watch computer screens and measure the wind, the rain and the temperature.\nThey drop small instruments out of the plane. Each instrument falls through the storm on a little parachute and sends information back to the plane.\nWith that information, forecasters can predict where the hurricane will travel next. Then families in its path have time to get ready and stay safe. It is uncomfortable work, but it is important.' }
