<script>
/* ShWork.html — THE NEW SHELL (docs/SHELL-OVERHAUL.md; rules: docs/SHELL-CONTRACT.md). Workstream C: his work and his way up the mountain.
   Places (SHK.place):
   - 'work'  My work, in the study loft (kingdom, no door): DO THIS NOW first; Today's list (server tdlToday, Grade 2 up) or the 3 rounds;
             Today's path for TEST- boys (pfdToday); his rebbe's picks and shout-outs (sgMyDesk, sgShoutSeen); the school goal (msSchoolGoal);
             the Daily Mix; the bonus round (the Game Pavilion opens when his work is done); the treasure chest line.
   - 'map'   the Trail up the mountain (kingdom, no door): his map (window.TL_MAP from kmMyMap; how lessons are organized does not change):
             his goal now with ONE Start, the real skill, stops climbing to the BOSS fortress, the level check, locked stops say so,
             My subjects (change subject, more to learn, Find my levels), the skill tree, a fresh map after a mastered step (kmMyMap).
   Also SHK.subjects(): the clean list of his subjects and level panels (replaces the tlFindLevelCard chain on the old hub), and
   SHK.today(): today's progress for the home ("N of M done today") and the Game Pavilion lock.
   Lessons open only with SHK.openLesson(id). Buttons only from the button kit (window.TLK). Nothing here pays or sets money.
   Nothing is drawn by script at rest: movement is CSS only. Grade 2 and up only (SHK.on()). No double slash in this file. */
(function(){
if(!window.SHK||window.SHW) return;
const K=window.SHK, W=window.SHW={tdl:{},desk:null,deskAt:0,pfd:{},goal:null,goalAt:0,steps:{},shown:{},say:false};
const E=K.esc, L=()=>window.TLK;
const WORLDS={MATH:['🧮','Math'],READ:['📖','Reading'],LANG:['✍️','Writing'],SCI:['🔬','Science'],SOC:['🌍','Social Studies'],COMP:['💻','Computing'],HEB:['🔤','Lashon Hakodesh'],ELEC:['🛠️','Electives'],VOC:['🧰','Trades'],LIFE:['💰','Life & Money'],
 'K:KRI':['🔤','Kriyah'],'K:CHU':['📜','Chumash'],'K:RAS':['✒️','Rashi'],'K:MSH':['📚','Mishnayos'],'K:GEM':['🏛️','Gemara']};
const ORDER=['MATH','K:CHU','READ','K:GEM','K:MSH','K:RAS','K:KRI','LANG','HEB','SCI','SOC','LIFE','COMP','ELEC','VOC'];
const BADGE={MATH:'core-gm-world-math',READ:'core-gm-world-reading',LANG:'core-gm-world-writing',SCI:'core-gm-world-science',SOC:'core-gm-world-social-studies',COMP:'core-gm-world-computing','K:CHU':'core-gm-world-chumash','K:GEM':'core-gm-world-gemara'};
const ROUNDS=3;

/* ---------- who he is, his map, what he mastered ---------- */
function st(){ try{ return (typeof A!=='undefined'&&A.st)||null; }catch(e){ return null; } }
function sid(){ const s=st(); return s&&s.id?String(s.id):''; }
function M(){ const m=window.TL_MAP, s=st(); return m&&s&&m.sid===s.id?m:null; }
const MC=new WeakMap();
function srvMast(){ const m=M(); if(!m) return {}; if(MC.has(m)) return MC.get(m); const o={}; [m.subjects||{},m.kodesh||{}].forEach(G=>Object.keys(G).forEach(k=>(G[k].skills||[]).forEach(x=>{ if(x[2]) o[x[0]]=1; }))); MC.set(m,o); return o; }
function mast(id){ const s=st(), x=s&&s.skills&&s.skills[id]; return !!(x&&x.m)||!!srvMast()[id]; }
function known(id){ const m=M(); return !!(m&&m.lc&&m.lc.known&&m.lc.known.indexOf(id)>=0)&&!mast(id); }
function done(id){ return mast(id)||known(id); }
function lcOf(w){ return w&&!w.isK&&w.now&&typeof window.tlLevelCheckFor==='function'?window.tlLevelCheckFor(w.now):null; }
function nm(id){ const m=M(), n=m&&m.names&&m.names[id]; if(n) return n; try{ if(typeof BANK_ALL!=='undefined'&&BANK_ALL[id]&&BANK_ALL[id].name) return [BANK_ALL[id].name,'']; }catch(e){} return [String(id),'']; }
const realLevel=n=>!!(n[1]&&/ Level \d+$/.test(n[1]));
function day(at){ const d=new Date(Number(at)||0); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
const today=()=>day(Date.now());
function steps(){ const sk=(st()&&st().skills)||{}; return Object.keys(sk).filter(id=>sk[id]&&sk[id].m).length; }
function todayDone(){ const t=today(), sk=(st()&&st().skills)||{}; return Object.keys(sk).filter(id=>sk[id]&&sk[id].m&&day(sk[id].at)===t).sort((a,b)=>sk[a].at-sk[b].at); }
/* his worlds: one per subject he is placed in; the unit is the path, its last step the BOSS (the same rule as the map has always used) */
function worlds(){ const m=M(); if(!m) return []; const out=[];
 const add=(k,c,isK)=>{ if(!c||!c.level) return; const w0=WORLDS[k]||['⭐',k];
  let ids=isK?(c.skills||[]).map(x=>x[0]):((c.unit&&c.unit.ids)||[]); if(!ids.length&&c.now) ids=[c.now]; if(!ids.length) return;
  const now=ids.find(id=>!done(id))||'';
  out.push({k,icon:w0[0],name:w0[1],level:c.level,ids,now,cleared:!now,next:c.next,unitName:isK?(w0[1]+' Level '+c.level):((c.unit&&c.unit.name)||w0[1]),isK,c}); };
 Object.keys(m.subjects||{}).forEach(k=>add(k,m.subjects[k],false)); Object.keys(m.kodesh||{}).forEach(k=>add(k,m.kodesh[k],true));
 const o=k=>ORDER.indexOf(k)<0?99:ORDER.indexOf(k); return out.sort((a,b)=>o(a.k)-o(b.k)); }
function doneToday(w){ const t=today(), sk=(st()&&st().skills)||{}; return w.ids.some(id=>sk[id]&&sk[id].m&&day(sk[id].at)===t); }
function pick(ws){ const live=ws.filter(w=>w.now); return live.find(w=>!doneToday(w))||live[0]||ws[0]||null; }
const toBoss=w=>w&&w.now?w.ids.length-w.ids.indexOf(w.now)-1:0;
const k2=ws=>ws.length>0&&ws.every(w=>w.level<=2);

/* ---------- the server's answers (the newest one wins: ours, or the one the older add-on fetched) ---------- */
function tdlData(){ const s=sid(), mine=W.tdl[s], old=window.TL_TDL;
 if(old&&old.by&&Object.prototype.hasOwnProperty.call(old.by,s)){ const oa=(old.asked&&old.asked[s])||0; if(!mine||oa>mine.at) return old.by[s]; }
 return mine?mine.d:null; }
function desk(){ const s=st(); if(W.desk&&s&&W.desk.sid===s.id) return W.desk; const d=window.TL_DESK; return d&&s&&d.sid===s.id?d:null; }
function pfdData(){ const s=sid(), o=window.TLPFD; return (o&&o.by&&o.by[s])||W.pfd[s]||null; }

/* ---------- TODAY: his list (Grade 2 up, from the server) or the 3 rounds ---------- */
const SUBJ=id=>{ const p=(/^([A-Z]+)\./.exec(String(id||''))||[])[1]||''; return p==='READ'?'READ':(p==='LANG'||p==='WRIT')?'LANG':p==='MATH'?'MATH':(p==='LK'||p==='HEB')?'KODESH':(p==='SCI'||p==='SS')?'KNOW':''; };
function localToday(){ const o={}; todayDone().forEach(id=>{ const k=SUBJ(id); if(k) (o[k]=o[k]||[]).push(id); }); return o; }
function stepOf(w,j){ if(!w) return w; const up=(w.ids||[]).filter(id=>!done(id)), id=up[j]||(j===1&&w.next)||w.now; return id===w.now?w:Object.assign({},w,{now:id}); }
function lineWorld(it,ws){ const live=ws.filter(w=>w.now);
 if(it.k==='KODESH') return live.find(w=>w.k===it.w)||live.find(w=>w.isK||w.k==='HEB')||null;
 if(it.k==='KNOW') return live.find(w=>w.k===it.w)||live.find(w=>w.k==='SCI'||w.k==='SOC')||null;
 return live.find(w=>w.k===it.k)||null; }
function listPlan(ws){ const d=tdlData(); if(!d||!d.on||!Array.isArray(d.items)) return null;
 const loc=localToday(), rounds=[]; let dn=0, total=0;
 d.items.forEach(it=>{ const n=Math.max(0,Number(it.n)||0), ids=(it.ids||[]).slice(); (loc[it.k]||[]).forEach(id=>{ if(ids.indexOf(id)<0) ids.push(id); });
  const got=ids.slice(0,n), w=lineWorld(it,ws);
  for(let i=0;i<n;i++){ if(i<got.length) rounds.push({won:true,id:got[i],k:it.k,name:it.name}); else rounds.push({w:stepOf(w,i-got.length),k:it.k,name:it.name}); }
  dn+=got.length; total+=n; });
 /* open (the bonus round) only when the SERVER says the whole list is done: a row can turn done here first, the bonus is the server's */
 return {rounds,done:dn,total,left:Math.max(0,total-dn),open:!total||(dn>=total&&!!d.complete),list:true}; }
function plan(ws){ let p=null; try{ p=listPlan(ws); }catch(e){ console.error('ShWork list',e); } if(p) return p;
 const live=ws.filter(w=>w.now), dt=todayDone(), n=Math.min(ROUNDS,dt.length), out=[];
 if(!live.length) return {rounds:[],done:n,total:ROUNDS,open:true,left:0};
 const fresh=live.filter(w=>!doneToday(w)), order=fresh.concat(live.filter(w=>fresh.indexOf(w)<0));
 for(let i=0;i<ROUNDS;i++){ if(i<n){ out.push({won:true,id:dt[i]}); continue; } out.push({w:order[(i-n)%order.length]}); }
 return {rounds:out,done:n,total:ROUNDS,open:n>=ROUNDS,left:ROUNDS-n}; }
function lockText(P){ return P.list?`Finish ${P.left} more thing${P.left===1?'':'s'} on today's list to open the Game Pavilion!`:`Clear ${P.left} more round${P.left===1?'':'s'} of your work to open the Game Pavilion!`; }
K.today=function(){ const ws=worlds(), P=plan(ws); return {done:P.done,total:P.total||ROUNDS,left:P.left,open:!!P.open,list:!!P.list,line:P.rounds.length?(P.open?'All your work is done today!':P.done+' of '+(P.total||ROUNDS)+' done today'):'',lock:P.open?'':lockText(P)}; };

/* ---------- server calls this place needs (the old hidden home used to make them) ---------- */
function redraw(){ try{ if(K.open.indexOf('work')>=0) K.body('work',workHTML()); if(K.open.indexOf('map')>=0) K.body('map',mapHTML()); }catch(e){ console.error('ShWork redraw',e); } }
function askList(){ const s=sid(); if(!s) return Promise.resolve(); return K.call('tdlToday').then(d=>{ if(sid()===s) W.tdl[s]={d:d&&d.on?d:null,at:Date.now()}; }).catch(()=>{}); }
function askDesk(force){ const s=st(); if(!s) return Promise.resolve(); if(!force&&W.desk&&W.desk.sid===s.id&&Date.now()-W.deskAt<180000) return Promise.resolve();
 const id=s.id; return K.call('sgMyDesk').then(r=>{ if(st()&&st().id===id&&r){ W.desk=r; W.deskAt=Date.now(); } }).catch(()=>{ W.deskAt=Date.now(); }); }
function askGoal(){ if(W.goal&&Date.now()-W.goalAt<600000) return Promise.resolve(); W.goalAt=Date.now(); return K.call('msSchoolGoal').then(r=>{ W.goal=r||null; W.goalAt=Date.now(); }).catch(()=>{}); }
function askPath(){ const s=sid(); if(!/^TEST-/i.test(s)||pfdData()) return Promise.resolve(); return K.call('pfdToday').then(d=>{ if(d&&sid()===s) W.pfd[s]=d; }).catch(()=>{}); }
function refreshWork(){ Promise.all([askList(),askDesk(),askGoal(),askPath()]).then(()=>{ redraw(); bigShout(); }); }
function refreshMap(){ const s=sid(); if(!s) return; const n=steps(); if(!(s in W.steps)){ W.steps[s]=n; return; } if(n<=W.steps[s]) return; W.steps[s]=n;
 K.call('kmMyMap').then(r=>{ if(r&&r.sid===s&&sid()===s){ window.TL_MAP=r; redraw(); } }).catch(()=>{}); }
/* after a save: his list's count from the server and Today's path (only when the older add-ons that did this are gone, so nothing is asked twice) */
try{ if(typeof saveStudent==='function'&&!W._ss){ W._ss=saveStudent; saveStudent=function(s0,cb){ return W._ss.call(this,s0,function(r){
  try{ if(s0&&s0.id&&String(s0.id)===sid()){ if(!window.TL_TDL) askList().then(redraw); if(!window.TL_PFD&&r&&r.pfd){ W.pfd[s0.id]=r.pfd; if(r.pfd.moments&&r.pfd.moments.length) climb(r.pfd.moments); } } }catch(e){ console.error('ShWork save',e); }
  if(cb) return cb.apply(this,arguments); }); }; } }catch(e){}
try{ if(typeof loadStudent==='function'&&!W._ls){ W._ls=loadStudent; loadStudent=function(r){ const s0=W._ls.apply(this,arguments); try{ if(r&&r.id&&!window.TL_PFD){ if(r.pfd) W.pfd[r.id]=r.pfd; else delete W.pfd[r.id]; } }catch(e){} return s0; }; } }catch(e){}

/* TODAY'S PATH (Pathfinder D): only boys the server sends a path to (TEST- boys today). Kodesh first, one stop per subject, a booster stop last. */
function pathHTML(){ const d=pfdData(), s=st(); if(!d||!Array.isArray(d.stops)||!d.stops.length||!s) return '';

 const nToday=k=>{ const re=PRE[k]; if(!re) return 0; const t=new Date().toDateString(); return Object.keys(s.skills||{}).filter(id=>re.test(id)&&s.skills[id]&&s.skills[id].m&&s.skills[id].at&&new Date(s.skills[id].at).toDateString()===t).length; };
 const clean=n=>String(n||'').replace(/\s*\bLevel\s*\d+\b/gi,'').replace(/\s*\b\d+-\d+\b/g,'').replace(/\s+:/g,':').replace(/^\s*:\s*/,'').trim();
 const kod=d.stops.filter(t=>t.area==='kodesh'), rank=t=>['MATH','READ','WRIT','LANG'].indexOf(t.k), rest=d.stops.filter(t=>t.area!=='kodesh').sort((a,b)=>(rank(a)<0?9:rank(a))-(rank(b)<0?9:rank(b)));
 const all=kod.concat(rest), min=Math.max(2,Math.round((Number(d.total)||35)/Math.max(1,all.length)));
 const stop=(t,mn,booster)=>{ const ids=(t.ids||[]).filter(playable), nid=ids.find(id=>!isM(id)), dn=nToday(t.k)>=(booster&&d.stops.some(z=>z.k===t.k)?2:1)||!nid;
  const name=booster?'Booster: '+t.name:t.name, lesson=nid?clean((t.names&&t.names[nid])||nm(nid)[0]):'';
  const line=nid?'Next: '+lesson+(booster?' · extra practice':''):'Everything here is done. Great work!';
  if(!nid||dn&&!nid) return `<div class="shw-done"><div class="n" aria-hidden="true">✓</div><div class="t"><b>${E(name)}</b><span>${E(line)}</span></div>${pill('prog','Done')}</div>`;
  return `<button type="button" class="tlk tlk-tile shw-row" data-shw="play" data-id="${E(nid)}"><div class="n" aria-hidden="true">${booster?'🚀':E(t.ic||'⭐')}</div><div class="t"><b>${E(name)}</b><span>${E(line)}</span></div>${dn?pill('prog','Done'):pill('now','Your turn')}</button>`; };
 return `<section class="shk-card shw-card"><div class="shw-head"><div><small>TODAY'S PATH</small><h2>Your path up the mountain</h2></div></div><div class="shw-rows">${all.map(t=>stop(t,min,false)).join('')}${d.booster?stop(d.booster,Number(d.boostMin)||5,true):''}</div></section>`; }

 const unit=`<section class="shk-card shw-card shw-unit"><b>${badge(w.k,'shw-badge')||w.icon+' '}${E(w.unitName)}</b><div class="shw-k" style="margin-top:6px">${pill('subj',w.name+' · Level '+w.level)}${w.now?(left?pill('prog',left+' to the boss'):pill('now','Boss now!')):pill('prog','Cleared')}</div><div class="shw-act" style="margin-top:8px">${L().quiet(ws.length>1?'Change subject':'My subjects','data-shw="subjects"','tlk-small')}${K2?'':L().quiet('Skill tree','data-shw="tree"','tlk-small')}</div></section>`;
 return `<div class="shw-map"><aside class="shw-side">${goalHTML(w,p&&w.k===p.k)}${unit}</aside>${trailHTML(w)}</div>`; }
function intro(){ try{ const s=sid(), key='shw-zoom:'+s+':'+new Date().toDateString(); if(!s||W.zoom===key) return; W.zoom=key; try{ if(localStorage.getItem(key)) return; localStorage.setItem(key,'1'); }catch(e){}
 const t=document.querySelector('#shk-map .shw-trail'); if(t) t.classList.add('shw-intro'); }catch(e){} }
function scrollToNow(){ try{ const pg=document.getElementById('shk-map'), n=pg&&pg.querySelector('.shw-stop.s-now'); if(!n) return; const r=n.getBoundingClientRect(), want=r.top+pg.scrollTop-pg.clientHeight*0.45; if(want>0) pg.scrollTop=Math.round(want); }catch(e){} }
function openMap(){ css(); refreshMap(); K.page({id:'map',world:'k',scene:'ycw-k-trail',title:'My map',icon:'ycw-ic-trail',body:mapHTML(),onClose:()=>{ stopSay(); }});
 scrollToNow(); intro(); }
function lockMsg(b,id){ const tr=b.closest('.shw-trail'); if(!tr) return; tr.querySelectorAll('.shw-msg').forEach(x=>x.remove()); const n=nm(id), w=curWorld(worlds());
 const el=document.createElement('div'); el.className='shw-msg'; el.setAttribute('role','status'); const at=b.closest('.shw-at')||b; el.style.left=at.style.left; el.style.top=(parseFloat(at.style.top)+40)+'px';
 el.innerHTML=pill('lock','Locked · '+(w&&w.now&&b.classList.contains('s-lock')?'clear '+nm(w.now)[0]+' first':n[0])); tr.appendChild(el); clearTimeout(W.msgT); W.msgT=setTimeout(()=>{ el.remove(); },2600); }
/* MY SUBJECTS (change subject + more to learn + Find my levels): an inner page with the round Back */
function subjectsHTML(){ const ws=worlds(), cur=W.world, S=subjectsList();
 const tiles=ws.map(w=>{ const lc=lcOf(w); return `<button type="button" class="tlk tlk-tile shw-tile${w.k===cur?' on':''}" data-shw="world" data-k="${E(w.k)}"><span class="ic">${badge(w.k)||E(w.icon)}</span><b>${E(w.name)}</b><small>${w.cleared?'All cleared':lc?'Level check first':'Level '+E(w.level)+(w.k===cur?' · on your map now':'')}</small>${w.cleared?pill('prog','Cleared'):pill('subj','Level '+w.level)}</button>`; }).join('');
 const more=S.filter(x=>x.kind==='panel').map(x=>`<button type="button" class="tlk tlk-tile shw-tile" data-shw="panel" data-k="${E(x.k)}"><span class="ic" aria-hidden="true">${E(x.icon)}</span><b>${E(x.name)}</b><small>${E(x.sub)}</small>${x.items.some(i=>i.state==='go')?pill('now','Open'):pill('lock','Not open yet')}</button>`).join('');
 const lv=S.find(x=>x.kind==='find');
 return `<div class="shw-wrap">${ws.length?`<section class="shk-card shw-card"><h3>On my map</h3><div class="shw-tiles">${tiles}</div></section>`:''}${lv?`<section class="shk-card shw-card"><h3>🧭 Find my levels</h3><p>${E(lv.sub)}</p><div class="shw-act">${L().quiet('Find my levels','data-shw="levels"')}</div></section>`:''}${more?`<section class="shk-card shw-card"><h3>More to learn</h3><div class="shw-tiles">${more}</div></section>`:''}</div>`; }
function openSubjects(){ css(); K.page({id:'shw-subjects',world:'k',scene:'ycw-k-trail',title:'My subjects',icon:'ycw-ic-trail',back:true,body:subjectsHTML(),onBack:()=>K.close('shw-subjects','back'),onClose:how=>{ if(how==='home') K.closeAll(); }}); }
/* THE SKILL TREE: one branch per kind of skill in his level; tap a skill for its card */
function treeHTML(w){ const c=w.c||{}, sk=c.skills||[], S=c.strands||{}, br=[], idx={};
 sk.forEach(x=>{ const s=w.isK?'K':(String(x[0]).split('.')[1]||''); if(!(s in idx)){ idx[s]=br.length; br.push({name:w.isK?(w.name+' Level '+w.level):(S[s]||s),items:[]}); } br[idx[s]].items.push(x); });
 const built=sk.filter(x=>x[1]), nd=built.filter(x=>done(x[0])).length, pc=built.length?Math.round(100*nd/built.length):0;
 let h=`<section class="shk-card shw-card"><div class="shw-k">${pill('subj',w.name+' · Level '+w.level)}${pill('prog',nd+' of '+built.length+' skills done')}</div><span class="shw-bar"><i style="width:${Math.max(3,pc)}%"></i></span>${nd===built.length&&built.length?'<p>Level complete!</p>':''}</section>`;
 br.forEach(b=>{ const bb=b.items.filter(x=>x[1]), bd=bb.filter(x=>done(x[0])).length;
  h+=`<section class="shk-card shw-card"><div class="shw-head"><h3>${E(b.name)}</h3>${bb.length&&bd===bb.length?pill('prog','Complete'):pill('prog',bd+' of '+bb.length)}</div><div class="shw-nodes">${b.items.map(x=>{ const id=x[0], n=nm(id), s=!x[1]?'s':mast(id)?'d':known(id)?'k':id===w.now?'now':'u';
   const p=s==='d'?pill('prog','Mastered'):s==='k'?pill('prog','You know it'):s==='now'?pill('now','Your goal now'):s==='s'?pill('lock','Coming soon'):pill('lock','Locked');
   return `<button type="button" class="tlk tlk-tile shw-node" data-shw="tn" data-id="${E(id)}" data-st="${s}"><b>${s==='d'?'✓ ':s==='k'?'⏭ ':s==='now'?E(w.icon)+' ':''}${E(n[0])}</b>${p}</button>`; }).join('')}</div></section>`; });
 return `<div class="shw-tree">${h}</div>`; }
function openTree(k){ css(); const ws=worlds(), w=ws.find(x=>x.k===(k||W.world))||curWorld(ws); if(!w) return; W.world=w.k;
 K.page({id:'shw-tree',world:'k',scene:'ycw-k-trail',title:'Skill tree',icon:'ycw-ic-trail',back:true,body:treeHTML(w),onBack:()=>K.close('shw-tree','back'),onClose:how=>{ if(how==='home') K.closeAll(); }}); }
function treeSheet(id,s){ const n=nm(id), w=curWorld(worlds()), real=realLevel(n);
 const status=s==='d'?pill('prog','Mastered'):s==='k'?pill('prog','You know it · skipped'):s==='now'?pill('now','Your goal now'):s==='s'?pill('lock','Coming soon'):pill('lock','Locked');
 const line=n[1]?(real?`Real skill: <b>${E(n[0])}</b> · ${E(n[1])}`:`You learn: <b>${E(n[1])}</b>`):'';
 const more=s==='k'?'You showed you know this in your level check, so it is skipped. You can still play it for practice.':s==='u'&&w&&w.now?'Clear '+nm(w.now)[0]+' first. Every level you clear brings this one closer!':s==='s'?'This skill is being built. It opens soon!':'';
 K.pop({id:'shw-sheet',world:'k',title:n[0],icon:'ycw-ic-trail',body:`<div class="shw-sheet"><div class="shw-k">${status}</div>${line?`<p>${line}</p>`:''}${more?`<p>${E(more)}</p>`:''}${s==='d'||s==='k'||s==='now'?`<div class="shw-act">${L().main('Start','data-shw="play" data-id="'+E(id)+'"')}</div>`:''}</div>`}); }
/* READ IT TO ME: tap to read, tap again to stop */
function stopSay(){ W.say=false; try{ speechSynthesis.cancel(); }catch(e){} }
function say(t){ if(W.say){ stopSay(); return; } try{ const u=new SpeechSynthesisUtterance(t); u.rate=.95; u.onend=()=>{ W.say=false; }; speechSynthesis.cancel(); speechSynthesis.speak(u); W.say=true; }catch(e){ W.say=false; } }

/* ========== SHK.subjects(): his subjects and level panels ==========
   One clean list instead of the tlFindLevelCard chain on the old hub. The packs still describe their own panels (they are lesson files and
   stay as they are); this reads what each one offers him now and gives every panel the same shape:
   {k, kind:'map'|'panel'|'find'|'place', name, icon, sub, level, now, items:[{label, group, state:'go'|'lock', run()}], open()}
   - 'map'   a subject on his map (opens the Trail on that subject)
   - 'panel' a subject or track outside his map (Limudei Kodesh, Science, Electives, Fact Finders, Spark Path, Computer Town, Life & Money,
             Social Studies, B'Simcha, Hashem Moments, the Kindergarten to Grade 6 packs, Algebra Ascent, Practice Again, Daily Mix ...)
   - 'find'  Find my levels (math, reading, social studies), while any has no level yet
   - 'place' a card that belongs to another new-shell place (Mistake Detective and Kodesh Quest: the Game Pavilion; Talk to my Rebbe; the school goal: My work) */
const PLACE_CARDS={mdcard:'games',kkcard:'games',trcard:'talk',sgoal:'work'};
const txt=e=>e?(e.textContent||'').replace(/\s+/g,' ').trim():'';
const txtSp=e=>e?[...e.childNodes].map(n=>(n.textContent||'').replace(/\s+/g,' ').trim()).filter(Boolean).join(' · '):'';
function fire(b){ const id=b.getAttribute('data-id'), go=[...b.attributes].find(a=>/^data-/.test(a.name)&&a.name!=='data-id'&&a.value==='go');
 if(go&&id&&((typeof BANK_ALL!=='undefined'&&BANK_ALL[id])||(typeof GEN!=='undefined'&&GEN[id]))) return K.openLesson(id);
 K.closeAll(); const oc=b.getAttribute('onclick'), m=oc&&/^\s*([A-Za-z_$][\w$]*)\(\)\s*;?\s*$/.exec(oc); if(m&&typeof window[m[1]]==='function') return window[m[1]]();
 const c=document.createElement('button'); c.type='button'; [...b.attributes].filter(a=>/^data-/.test(a.name)).forEach(a=>c.setAttribute(a.name,a.value)); c.style.display='none'; document.body.appendChild(c); try{ c.click(); }catch(e){} c.remove(); }
function panelOf(sec){ const cls=String(sec.className||'').split(/\s+/).filter(Boolean), k=cls.indexOf('arpanel')>=0?'arpanel':cls[0]||'panel';
 const head=sec.querySelector('b,h3,h2'), name=txt(head)||k, sm=sec.querySelector('small'), ic=sec.querySelector('[aria-hidden="true"]'), icon=(ic&&txt(ic).length<=4&&txt(ic))||'⭐';
 const items=[]; sec.querySelectorAll('button,[role=button]').forEach(b=>{ const lock=b.disabled||/^🔒/.test(txt(b)), act=[...b.attributes].some(a=>/^data-/.test(a.name)&&a.name!=='data-id')||!!b.getAttribute('onclick');
  if(!lock&&!act) return; let g=b.parentElement, group='';
  while(g&&g!==sec){ const lab=[...g.children].find(c=>c!==b&&c.tagName!=='BUTTON'&&!c.querySelector('button')&&!c.contains(head)&&/\S/.test(c.textContent)); if(lab){ group=txtSp(lab); break; } g=g.parentElement; }
  const label=txt(b).replace(/^[▶🔒]\s*/u,'').trim()||b.getAttribute('aria-label')||'';
  items.push({label,group,state:lock?'lock':'go',run:lock?null:()=>fire(b)}); });
 const note=items.length?'':[...sec.querySelectorAll('p')].filter(p=>!p.querySelector('button')).map(txt).find(Boolean)||'';
 return {k,kind:PLACE_CARDS[k]?'place':'panel',place:PLACE_CARDS[k]||'',name,icon,sub:txt(sm)||note,note,items,open(){ openPanel(k); }}; }
function findLevels(){ const s=st(); if(!s) return null; const P=s.place||{}, left=[['MATH','Math'],['READ','Reading'],['SOC','Social Studies']].filter(x=>!P[x[0]]);
 if(!left.length||!(typeof window.tlOpenCheck==='function'||typeof window.tlFindLevel==='function')) return null;
 return {k:'levels',kind:'find',name:'Find my levels',icon:'🧭',sub:left.map(x=>x[1]).join(' · ')+': a quick check each. Not for marks.',left,items:[],open(){ openLevels(); }}; }
function subjectsList(){ const out=[], s=st(); if(!s) return out;
 worlds().forEach(w=>out.push({k:w.k,kind:'map',name:w.name,icon:w.icon,sub:w.cleared?'All cleared':'Level '+w.level,level:w.level,now:w.now,items:[],open(){ W.world=w.k; K.closeAll(); K.go('map'); }}));
 let h=''; try{ h=typeof window.tlFindLevelCard==='function'?window.tlFindLevelCard(s)||'':''; }catch(e){ console.error('ShWork subjects',e); }
 const box=document.createElement('div'); box.innerHTML=h; let lv=false;
 [...box.children].forEach(sec=>{ if(sec.classList.contains('tlfind')){ lv=true; return; } if(sec.tagName==='STYLE'||sec.tagName==='SCRIPT') return; out.push(panelOf(sec)); });
 const f=findLevels(); if(f) out.push(f); else if(lv) out.push({k:'levels',kind:'find',name:'Find my levels',icon:'🧭',sub:'A quick check of a few questions.',left:[],items:[],open(){ openLevels(); }});
 return out; }
K.subjects=function(){ try{ return subjectsList(); }catch(e){ console.error('ShWork subjects',e); return []; } };
function openPanel(k){ const x=subjectsList().find(y=>y.k===k); if(!x) return; css(); W.panel=x;
 const groups=[]; x.items.forEach((it,i)=>{ let g=groups.find(z=>z.name===it.group); if(!g){ g={name:it.group,items:[]}; groups.push(g); } g.items.push([it,i]); });
 const body=`<div class="shw-wrap"><section class="shk-card shw-card"><div class="shw-big" style="display:flex;gap:12px;align-items:center"><span style="font-size:48px" aria-hidden="true">${E(x.icon)}</span><div><h2>${E(x.name)}</h2>${x.sub?`<p>${E(x.sub)}</p>`:''}</div></div>${x.note&&x.note!==x.sub?`<p>${E(x.note)}</p>`:''}</section>${groups.map(g=>`<section class="shk-card shw-card">${g.name&&g.name!==x.name?`<h3>${E(g.name)}</h3>`:''}<div class="shw-nodes">${g.items.map(([it,i])=>it.state==='go'?`<button type="button" class="tlk tlk-tile shw-node" data-shw="item" data-i="${i}"><b>${E(it.label)}</b>${pill('now','Open')}</button>`:`<div class="shk-card shw-node" style="box-shadow:none;padding:10px 12px"><b style="font-size:14px">${E(it.label)}</b> ${pill('lock','Locked')}</div>`).join('')}</div></section>`).join('')}</div>`;
 K.page({id:'shw-panel',world:'k',scene:'ycw-k-library',title:x.name,icon:x.icon,back:true,body,onBack:()=>K.close('shw-panel','back'),onClose:how=>{ if(how==='home') K.closeAll(); }}); }
function openLevels(){ const f=findLevels(); const P=(st()&&st().place)||{};
 const rows=[['MATH','MATH','Math'],['READ','READ','Reading'],['SOC','SS','Social Studies']].map(r=>(P[r[0]]?L().quiet(r[2]+' · check again','data-shw="check" data-s="'+r[1]+'"'):L().quiet(r[2],'data-shw="check" data-s="'+r[1]+'"'))).join('');
 K.pop({id:'shw-levels',world:'k',title:'Find my levels',icon:'🧭',body:`<p style="font-size:17px">A short check for each subject finds where your own path starts. Not for marks.</p><div class="shw-list">${rows}</div>${f?'':'<p>All your levels are found.</p>'}`}); }
function check(s){ K.closeAll(); if(typeof window.tlOpenCheck==='function') return window.tlOpenCheck(s); if(s==='READ'&&typeof window.tlFindReadLevel==='function') return window.tlFindReadLevel(); if(typeof window.tlFindLevel==='function') return window.tlFindLevel(); }

/* STAND-IN for the seam (issue SHELL-KIT #647): SHK.openLesson calls window.GM_PLAY, which GameMap.html sets in the wrong scope today.
   Only when it is missing: the same steps as the map's Play (a K game pack that has the lesson, else startMission(world, id, 'skill')). */
if(typeof window.GM_PLAY!=='function') window.GM_PLAY=function(id){
 try{ const ob=window.ONE_BITE&&window.ONE_BITE[id]&&(window.OB_LIVE==='on'||(window.OB_LIVE==='test'&&/^TEST-/i.test(sid())));
  const P=ob?null:[window.KL,window.KR,window.KK].find(x=>x&&typeof x.has==='function'&&x.has(id)&&(typeof x.on!=='function'||x.on())); if(P) return P.open(id); }catch(e){}
 const pre=String(id).split('.')[0], alt=/^(LK|HEB)$/.test(pre)?'LK':/^(READ|WRIT|LANG)$/.test(pre)?'READ':/^(SS|SOC|FACT)$/.test(pre)?'SS':/^(COMP|VOC)$/.test(pre)?'COMP':pre;
 let c=''; try{ c=typeof WORLD!=='undefined'?(WORLD[pre]?pre:WORLD[alt]?alt:''):''; }catch(e){}
 const have=(typeof BANK_ALL!=='undefined'&&BANK_ALL[id])||(typeof GEN!=='undefined'&&GEN[id]);
 if(c&&have&&typeof startMission==='function') return startMission(c,id,'skill');
 try{ if(window.GM&&typeof GM.sync==='function'){ GM.tab='lib'; GM.sig=''; GM.sync(); } }catch(e){} };

/* ========== THE TWO PLACES ========== */
K.place({id:'work',name:'My work',world:'k',icon:'ycw-ic-work',scene:'ycw-k-study',order:1,
 show:()=>K.on(),
 sub:()=>{ const ws=worlds(), P=plan(ws), r=P.rounds.find(x=>!x.won&&x.w); return r?nm(r.w.now)[0]:P.open?'All your work is done today!':''; },
 pill:()=>{ const t=K.today(); return t.left&&!t.open?pill('now','Do this now'):pill('prog',t.open?'All done':t.line); },
 open:()=>{ css(); K.page({id:'work',world:'k',scene:'ycw-k-study',title:'My work',icon:'ycw-ic-work',body:workHTML()}); refreshWork(); bigShout(); }});
K.place({id:'map',name:'My map',world:'k',icon:'ycw-ic-trail',scene:'ycw-k-trail',order:2,
 show:()=>K.on(),
 sub:()=>{ const ws=worlds(), w=curWorld(ws); return w?w.name+' · Level '+w.level:'Your map is almost ready'; },
 pill:()=>{ const w=curWorld(worlds()); return w&&w.now?pill('prog',toBoss(w)+' to the boss'):''; },
 open:openMap});
/* the Trail on one subject or its skill tree, for other places (My profile's levels, Skill tree) */
K.trail=function(k,view){ if(k) W.world=k; if(view==='tree'){ K.go('map'); openTree(k); return; } K.go('map'); };

/* ========== TAPS ========== */
document.addEventListener('click',e=>{ const b=e.target&&e.target.closest&&e.target.closest('[data-shw]'); if(!b||!b.closest('.shk-page,.shk-pop')) return;
 const a=b.getAttribute('data-shw'), id=b.getAttribute('data-id'); e.preventDefault();
 try{ if(typeof SND!=='undefined'&&SND.tap&&a!=='play') SND.tap(); }catch(x){}
 if(a==='play'){ stopSay(); return K.openLesson(id); }
 if(a==='node'){ const w=curWorld(worlds()); if(done(id)||(w&&id===w.now)){ stopSay(); return K.openLesson(id); } return lockMsg(b,id); }
 if(a==='say') return say(b.getAttribute('data-text')||'');
 if(a==='subjects') return openSubjects();
 if(a==='world'){ W.world=b.getAttribute('data-k'); K.close('shw-subjects','back'); if(K.open.indexOf('map')>=0){ K.body('map',mapHTML()); scrollToNow(); } else K.go('map'); return; }
 if(a==='tree') return openTree();
 if(a==='tn') return treeSheet(id,b.getAttribute('data-st'));
 if(a==='panel') return openPanel(b.getAttribute('data-k'));
 if(a==='item'){ const it=W.panel&&W.panel.items[Number(b.getAttribute('data-i'))]; if(it&&it.run) it.run(); return; }
 if(a==='levels') return openLevels();
 if(a==='check') return check(b.getAttribute('data-s'));
 if(a==='thanks'){ const d=desk(), s=d&&(d.shouts||[]).find(x=>x.id===id); if(!s||s.thanked) return; seen(s,true); return; }
 if(a==='shoutok'){ if(W.thank) W.thank(); return; }
 if(a==='climbok'){ K.close('shw-climb','x'); return; }
});
})();
</script>
