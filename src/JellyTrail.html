<script>
/* JellyTrail.html — CHANUKAH SUFGANIYAH JELLY TRAIL, a Tashbar Store holiday item (HoS 2026-11-24, made in Claude Chat with the owner;
   look and timings kept exactly). "Sufganiyah jelly trail", $250.00, Chanukah shelf (src/Store.js hol-jelly), next to the Rolling donuts
   trail (a different item).
   1. THE ENGINE: jelly-trail.js from the handoff, unchanged except: its comments use slash-star (HtmlService rule: no slash-slash in

      the free tap splash (HomePlus.html) step aside while it is on (window.tlJellyOn / tlJellyTapOn).

   3. THE STORE PREVIEW: the card plays the real engine in its little window (TL_JELLY.preview), a fingertip swipe and a tap.

(function(){

/**
 * jelly-trail.js — Tashbar "sufganiyah" (Hanukkah jelly donut) finger trail.
 * Plain JavaScript (ES module). No TypeScript, no dependencies.
 *
 * What it does
 *   - Swipe: a thick, glossy raspberry-jelly trail that lags behind the finger, thins and drips.
 *   - Mini powdered jelly donuts hop off the trail and roll away, each leaving a jelly streak.
 *   - Tap: a big donut drops in, squishes (its jelly dot oozes and drips down the front),
 *     then bursts: jelly starburst splat, flying blobs, torn pieces, crumbs, a sugar puff,
 *     a flash ring and a little steam.
 *   - The jelly BENDS LIGHT: it refracts whatever is underneath it (text, cards, background),
 *     like a lens. See "How the light bending works" below.
 *
 * How the light bending works (read this before wiring it up)
 *   WebGL cannot read the web page that sits under it. So the engine is given a PICTURE of
 *   what is under the jelly (the "backdrop"): a <canvas> or <img> the same shape as the
 *   container. The jelly shader samples that picture with a bent offset, which is what
 *   makes the text underneath warp. If no backdrop is given, the jelly still works but has
 *   nothing to bend (it refracts a flat colour).
 *   You supply the picture with the `captureBackdrop` option: an (async) function that
 *   returns a canvas/image of exactly the area covered by the container. The React wrapper
 *   (JellyTrail.jsx) does this for you with html2canvas.
 *   Call `refreshBackdrop()` whenever what's under the jelly changes (the wrapper does this
 *   automatically on resize and when the wrapped content changes).
 *
 * Usage (no framework)
 *   import { createJellyTrail } from './jelly-trail.js';
 *   const trail = createJellyTrail(containerEl, { captureBackdrop: async () => myCanvas });
 *   trail.setOptions({ jelly: 1.2, donuts: 0.5 });
 *   trail.clear();
 *   trail.destroy();
 *
 *   containerEl must have a size. The engine adds two absolutely positioned canvases
 *   inside it (pointer-events: none) and listens for pointer events on it.
 */

const DEFAULTS = {
  jelly: 1,           /* trail thickness, 0.6 – 1.6 */
  donuts: 1,          /* how often mini donuts pop off the trail, 0 (none) – 2 */
  maxDpr: 2,          /* cap on devicePixelRatio (keeps Chromebooks fast) */
  hoverTrail: true,   /* a mouse leaves a trail just by moving (no button needed) */
  tapToPop: true,     /* a quick tap drops a big donut that bursts */
  captureBackdrop: null,  /* () => HTMLCanvasElement | HTMLImageElement | Promise<…> | null */
  backdropColor: null,    /* flat colour to refract until/unless a backdrop picture exists */
  ignoreSelector: 'button, a, input, select, textarea, label, [role="button"], [data-no-jelly]',
  zIndex: 10,
  eventTarget: null,  /* Tashbar: where to listen for the finger (default: the container) */
};

function createJellyTrail(container, options = {}) {
  if (!container) throw new Error('createJellyTrail: container element is required');
  const o = { ...DEFAULTS, ...options };
  if (getComputedStyle(container).position === 'static') container.style.position = 'relative';

  /* two layers: WebGL jelly (bottom) and 2D donuts/blobs/crumbs (top) */
  const makeLayer = (z) => {
    const c = document.createElement('canvas');
    c.setAttribute('aria-hidden', 'true');
    c.setAttribute('data-jelly-layer', '');
    Object.assign(c.style, { position: 'absolute', left: '0', top: '0', width: '100%', height: '100%', pointerEvents: 'none', zIndex: String(z) });
    container.appendChild(c);
    return c;
  };
  const glc = makeLayer(o.zIndex);
  const canvas = makeLayer(o.zIndex + 1);
  const ctx = canvas.getContext('2d');

  const CELL = 2;            /* css px per simulation cell */
  const T = 0.32;            /* surface threshold */
  const MAXH = 2.6;          /* max jelly thickness */
  const HALF_LIFE = 620;     /* ms to thin by half */
  let W = 0, Hh = 0, H = null, Tmp = null, rowOn = null, dpr = 1, vw = 0, vh = 0;
  let thick = o.jelly, donutAmt = o.donuts;
  let destroyed = false, lastBackdrop = null, bdToken = 0, bdTimer = 0;

  /* ================================================================
      WebGL jelly with refraction of the backdrop picture
     ================================================================ */
  let gl = null;
  try { gl = glc.getContext('webgl', { premultipliedAlpha: true, alpha: true, antialias: false }); } catch (e) { gl = null; }
  let prog, hTex, bgTex, uTex, uK, uH, uRes, uDpr, pack = null, prevY0 = 1e9, prevY1 = -1;

  function setupGL() {
    const deriv = !!gl.getExtension('OES_standard_derivatives');
    const vs = 'attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }';
    const fs = (deriv ? '#extension GL_OES_standard_derivatives : enable\n' : '') + `
precision highp float;
uniform sampler2D u_h; uniform vec2 u_tex; uniform float u_k; uniform float u_hpx;
uniform sampler2D u_bg; uniform vec2 u_res; uniform float u_dpr;
const float T = ${T.toFixed(3)}; const float MAXH = ${MAXH.toFixed(3)};
float dec(vec2 t){ vec4 c = texture2D(u_h, (t + 0.5) / u_tex); return (c.r * 65280.0 + c.g * 255.0) / 65535.0 * MAXH; }
float hAt(vec2 p){
  vec2 q = p - 0.5; vec2 i = floor(q); vec2 f = q - i;
  return mix(mix(dec(i), dec(i + vec2(1.0, 0.0)), f.x), mix(dec(i + vec2(0.0, 1.0)), dec(i + vec2(1.0, 1.0)), f.x), f.y);
}
void main(){
  vec2 p = vec2(gl_FragCoord.x, u_hpx - gl_FragCoord.y) * u_k;
  float h = hAt(p);
  if (h < T * 0.55) {
    /* soft shadow, with red light glowing through the thick jelly */
    vec2 so = vec2(1.0, 1.8);
    float sh = smoothstep(T * 0.8, T * 1.5, hAt(p - so)) * 0.3;
    float ca = smoothstep(T * 1.4, T * 3.0, hAt(p - so * 0.7)) * 0.35;
    if (sh < 0.004 && ca < 0.004) discard;
    gl_FragColor = vec4(vec3(1.0, 0.18, 0.25) * ca * 0.7, sh * 0.85);
    return;
  }
  float e = 1.4;
  float gx = (hAt(p + vec2(e, 0.0)) - hAt(p - vec2(e, 0.0))) / (2.0 * e) * 5.6;
  float gy = (hAt(p + vec2(0.0, e)) - hAt(p - vec2(0.0, e))) / (2.0 * e) * 5.6;
  vec3 n = normalize(vec3(-gx, -gy, 1.0));
  vec3 V = vec3(0.0, 0.0, 1.0);
  vec3 L = normalize(vec3(-0.55, -0.75, 0.9));
  vec3 HV = normalize(L + V);
  vec3 HV2 = normalize(normalize(vec3(0.7, 0.2, 1.6)) + V);
  float dif = max(0.0, dot(n, L));
  float sp = pow(max(0.0, dot(n, HV)), 60.0);
  float sp2 = pow(max(0.0, dot(n, HV2)), 10.0);
  float aw = ${deriv ? 'max(fwidth(h) * 0.9, 0.003)' : '0.02'};
  float edge = smoothstep(T - aw, T + aw, h);
  float th = clamp((h - T) / 1.4, 0.0, 1.0);
  float fres = 1.0 - n.z;
  float shade = 0.6 + 0.5 * dif;
  /* raspberry jam: bright red where thin, deep ruby where thick, darker at the rim */
  vec3 jam = vec3(205.0 - 85.0 * th - 70.0 * fres, 22.0 - 12.0 * th - 8.0 * fres, 48.0 - 24.0 * th - 14.0 * fres) / 255.0 * shade;
  vec2 suv = gl_FragCoord.xy / u_res;
  /* strong refraction: the jelly acts like a lens over the text and background beneath it.
     The slopes bend the view hard (most at the curved rims), and the three colours bend by
     slightly different amounts for a faint rainbow fringe.
     bend through a smoothed surface (wide sampling, linear in slope) so it reads as a clean lens:
     text under the flat middle shifts and warps but stays readable; the curved rims bend it hardest */
  float e2 = 6.0;
  float rx = (hAt(p + vec2(e2, 0.0)) - hAt(p - vec2(e2, 0.0))) / (2.0 * e2);
  float ry = (hAt(p + vec2(0.0, e2)) - hAt(p - vec2(0.0, e2))) / (2.0 * e2);
  vec2 bpx = vec2(rx, -ry) * 210.0;
  float bl = length(bpx); if (bl > 64.0) bpx *= 64.0 / bl;
  vec2 bend = bpx * u_dpr / u_res;
  vec3 under = vec3(
    texture2D(u_bg, suv - bend * 1.07).r,
    texture2D(u_bg, suv - bend).g,
    texture2D(u_bg, suv - bend * 0.93).b);
  /* colour like real jelly: it ABSORBS green and blue light passing through it, more where it's thicker
     (Beer-Lambert). Works on any background: rich red over white, deep ruby over dark purple. */
  vec3 absorb = exp(-vec3(0.22, 2.4, 2.0) * (0.55 + 1.6 * th + 0.7 * fres));
  float lum = dot(under, vec3(0.299, 0.587, 0.114));
  float body = (0.18 + 0.2 * th + 0.14 * fres) * mix(1.0, 0.4, smoothstep(0.35, 0.85, lum)); /* a bit more body on dark screens */
  vec3 col = mix(under * absorb * 1.08, jam, clamp(body, 0.0, 0.55));
  col += vec3(0.30, 0.02, 0.06) * (1.0 - th) * edge * 0.45;   /* light glowing through the thin edges */
  float s = sp * 0.22 + sp2 * 0.02;                            /* glare toned way down: the bending does the 3-D work now */
  col += vec3(1.0, 0.94, 0.94) * s;
  vec3 R = reflect(-V, n);
  vec3 env = mix(vec3(0.16, 0.06, 0.2), vec3(1.0, 0.85, 0.8), smoothstep(-0.25, 0.55, -R.y));
  float win = smoothstep(0.08, 0.0, abs(R.x + 0.3)) * smoothstep(0.05, 0.45, -R.y);
  col += env * (0.01 + 0.05 * fres) + vec3(1.0, 0.95, 0.92) * win * 0.05;
  gl_FragColor = vec4(clamp(col, 0.0, 1.0) * edge, edge);
}`;
    const sh = (type, src) => { const x = gl.createShader(type); gl.shaderSource(x, src); gl.compileShader(x);
      if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; };
    prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    uTex = gl.getUniformLocation(prog, 'u_tex'); uK = gl.getUniformLocation(prog, 'u_k'); uH = gl.getUniformLocation(prog, 'u_hpx');
    uRes = gl.getUniformLocation(prog, 'u_res'); uDpr = gl.getUniformLocation(prog, 'u_dpr');
    gl.uniform1i(gl.getUniformLocation(prog, 'u_h'), 0);
    gl.uniform1i(gl.getUniformLocation(prog, 'u_bg'), 1);
    const tex = (unit, filter) => {
      const t = gl.createTexture(); gl.activeTexture(unit); gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      return t;
    };
    bgTex = tex(gl.TEXTURE1, gl.LINEAR);
    hTex = tex(gl.TEXTURE0, gl.NEAREST);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  }
  if (gl) { try { setupGL(); } catch (e) { console.warn('WebGL jelly off:', e); gl = null; } }

  /* ---------------------------------------------------------------- the backdrop (what the jelly bends) */
  function flatColor() {
    if (o.backdropColor) return o.backdropColor;
    /* first non-transparent background going up from the container */
    for (let el = container; el; el = el.parentElement) {
      const bg = getComputedStyle(el).backgroundColor;
      if (bg && bg !== 'transparent' && !/rgba\([^)]*,\s*0\)$/.test(bg)) return bg;
    }
    return '#ffffff';
  }
  function uploadBackdrop(src) {
    if (!gl) return;
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, bgTex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    let ok = false;
    if (src) {
      try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src); ok = true; }
      catch (e) { console.warn('jelly-trail: backdrop could not be used (cross-origin image?) — bending a flat colour instead.', e); }
    }
    if (!ok) {
      const c = document.createElement('canvas'); c.width = c.height = 2;
      const x = c.getContext('2d'); x.fillStyle = flatColor(); x.fillRect(0, 0, 2, 2);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
    }
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.activeTexture(gl.TEXTURE0);
    kick();
  }
  async function refreshBackdrop() {
    if (destroyed || !gl) return;
    const token = ++bdToken;
    let src = null;
    if (o.captureBackdrop) {
      try { src = await o.captureBackdrop(); } catch (e) { console.warn('jelly-trail: captureBackdrop failed', e); }
    }
    if (destroyed || token !== bdToken) return;
    lastBackdrop = src || null;
    uploadBackdrop(lastBackdrop);
  }
  function scheduleBackdrop(ms = 250) { clearTimeout(bdTimer); bdTimer = setTimeout(refreshBackdrop, ms); }

  /* ---------------------------------------------------------------- 2D fallback when WebGL is unavailable */
  let fb = null, fbx = null, fbImg = null;
  function drawFallback2D() {
    if (!fb || fb.width !== W || fb.height !== Hh) {
      fb = document.createElement('canvas'); fb.width = W; fb.height = Hh;
      fbx = fb.getContext('2d'); fbImg = fbx.createImageData(W, Hh);
    }
    const d = fbImg.data;
    for (let i = 0, n = W * Hh; i < n; i++) {
      const h = H[i], j = i * 4;
      if (h < T) { d[j + 3] = 0; continue; }
      const th = Math.min(1, (h - T) / 1.4);
      d[j] = 205 - 90 * th; d[j + 1] = 20 - 10 * th; d[j + 2] = 45 - 20 * th; d[j + 3] = 235;
    }
    fbx.putImageData(fbImg, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(fb, -CELL * 0.5, -CELL * 0.5, W * CELL, Hh * CELL);
  }

  /* ---------------------------------------------------------------- size */
  function resize() {
    const r = container.getBoundingClientRect();
    vw = Math.max(1, Math.round(r.width)); vh = Math.max(1, Math.round(r.height));
    dpr = Math.min(window.devicePixelRatio || 1, o.maxDpr);
    canvas.width = Math.round(vw * dpr); canvas.height = Math.round(vh * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = Math.ceil(vw / CELL) + 2; Hh = Math.ceil(vh / CELL) + 2;
    H = new Float32Array(W * Hh); Tmp = new Float32Array(W * Hh); rowOn = new Uint8Array(Hh);
    if (gl) resizeGL(); else { glc.width = glc.height = 1; }
    buildSprites();
    kick();
    scheduleBackdrop(150);   /* the picture under the jelly changed size too */
  }

  function resizeGL() {
    glc.width = Math.round(vw * dpr); glc.height = Math.round(vh * dpr);
    pack = new Uint8Array(W * Hh * 4);
    gl.bindTexture(gl.TEXTURE_2D, hTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, Hh, 0, gl.RGBA, gl.UNSIGNED_BYTE, pack);
    gl.viewport(0, 0, glc.width, glc.height);
    gl.uniform2f(uTex, W, Hh); gl.uniform1f(uK, 1 / (dpr * CELL)); gl.uniform1f(uH, glc.height);
    gl.uniform2f(uRes, glc.width, glc.height); gl.uniform1f(uDpr, dpr);
    uploadBackdrop(lastBackdrop);
    prevY0 = 1e9; prevY1 = -1;
  }
  function drawGL(y0, y1) {
    const a0 = Math.max(0, Math.min(prevY0, y1 >= 0 ? y0 : 1e9)), a1 = Math.min(Hh - 1, Math.max(prevY1, y1));
    if (a1 >= a0) {
      for (let y = a0; y <= a1; y++) {
        const row = y * W;
        for (let x = 0; x < W; x++) { const q = (H[row + x] / MAXH * 65535) | 0, i4 = (row + x) * 4; pack[i4] = q >> 8; pack[i4 + 1] = q & 255; }
      }
      gl.bindTexture(gl.TEXTURE_2D, hTex);
      gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, a0, W, a1 - a0 + 1, gl.RGBA, gl.UNSIGNED_BYTE, pack.subarray(a0 * W * 4, (a1 + 1) * W * 4));
    }
    prevY0 = y1 >= 0 ? y0 : 1e9; prevY1 = y1;
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    if (y1 >= 0) gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function stamp(cx, cy, r, amp) {
    const x0 = Math.max(1, Math.floor(cx - r)), x1 = Math.min(W - 2, Math.ceil(cx + r));
    const y0 = Math.max(1, Math.floor(cy - r)), y1 = Math.min(Hh - 2, Math.ceil(cy + r));
    const r2 = r * r;
    for (let y = y0; y <= y1; y++) {
      let hit = false;
      for (let x = x0; x <= x1; x++) {
        const d2 = (x - cx) * (x - cx) + (y - cy) * (y - cy);
        if (d2 >= r2) continue;
        const f = 1 - d2 / r2, i = y * W + x, v = H[i] + amp * f * f;
        H[i] = v > MAXH ? MAXH : v; hit = true;
      }
      if (hit) rowOn[y] = 1;
    }
  }


  /* ================================================================
      Donuts (sufganiyot): golden fried dough, the pale ring around the
      middle, powdered sugar on top and a dab of jelly.
     ================================================================ */
  function drawDonut(c, r, seed, withShadow = true) {
    let s = seed;
    const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    if (withShadow) donutShadow(c, r);
    /* a puffy, slightly lumpy outline (fried dough is never a perfect circle) */
    const N = 40, ph1 = rnd() * 6.28, ph2 = rnd() * 6.28, pts = [];
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2, rr = r * (1 + 0.028 * Math.sin(3 * a + ph1) + 0.016 * Math.sin(5 * a + ph2));
      pts.push([Math.cos(a) * rr, Math.sin(a) * rr * (Math.sin(a) > 0 ? 0.9 : 0.95)]);
    }
    const body = () => {
      c.beginPath();
      const m = (i) => { const p = pts[i % N], q = pts[(i + 1) % N]; return [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2]; };
      let st = m(N - 1); c.moveTo(st[0], st[1]);
      for (let i = 0; i < N; i++) { const mm = m(i); c.quadraticCurveTo(pts[i][0], pts[i][1], mm[0], mm[1]); }
      c.closePath();
    };
    /* fried dough, lit from the upper left */
    body();
    const g = c.createRadialGradient(-r * 0.32, -r * 0.42, r * 0.04, 0, 0, r * 1.06);
    g.addColorStop(0, '#f3c074'); g.addColorStop(0.35, '#de9a45'); g.addColorStop(0.7, '#b96b2b'); g.addColorStop(1, '#7c3c12');
    c.fillStyle = g; c.fill();
    c.save(); body(); c.clip();
    /* mottled crust: uneven browning */
    for (let i = 0; i < 34; i++) {
      const x = (rnd() * 2 - 1) * r, y = (rnd() * 2 - 1) * r, rr = r * (0.08 + rnd() * 0.2), dark = rnd() < 0.6;
      const mg = c.createRadialGradient(x, y, 0, x, y, rr);
      mg.addColorStop(0, dark ? `rgba(110,50,12,${0.12 + rnd() * 0.14})` : `rgba(255,214,140,${0.1 + rnd() * 0.12})`);
      mg.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = mg; c.fillRect(x - rr, y - rr, rr * 2, rr * 2);
    }
    /* the pale un-fried band around the middle, where the dough floated at the oil line */
    const band = (off) => {
      c.beginPath();
      for (let j = 0; j <= 24; j++) {
        const x = -r * 1.05 + (j / 24) * r * 2.1, u = Math.max(0, 1 - (x / r) * (x / r));
        const y = r * (0.16 + 0.22 * Math.sqrt(u)) + Math.sin(x * 0.5 + ph1) * r * 0.025 + off;
        j ? c.lineTo(x, y) : c.moveTo(x, y);
      }
    };
    c.filter = `blur(${Math.max(0.8, r * 0.045)}px)`;
    c.lineCap = 'round';
    band(0); c.strokeStyle = 'rgba(250,228,182,0.82)'; c.lineWidth = r * 0.15; c.stroke();
    band(-r * 0.02); c.strokeStyle = 'rgba(255,244,214,0.55)'; c.lineWidth = r * 0.06; c.stroke();
    c.filter = 'none';
    /* tiny fry bubbles in the crust */

  if (eng) { eng.setOptions({ tapToPop: window.tlJellyTapOn() }); watch(); }
}
/* anything a boy draws or plays on (every canvas, writing boxes) blocks the jelly, marked just before the engine sees the touch */
addEventListener('pointerdown', function (e) {
  const t = e.target; if (!t || !t.closest) return;
  const area = t.closest('canvas, textarea, [contenteditable], [data-obk-trace]');
  if (area && !area.hasAttribute('data-no-jelly')) area.setAttribute('data-no-jelly', '');
}, { capture: true, passive: true });
setInterval(sync, 500);

/* THE STORE PREVIEW: the real engine in the card's little window. A fingertip swipes across, then taps (a donut drops and splats). */
function preview(el) {
  try {
    const r = el.getBoundingClientRect(); if (r.width < 40) return null;
    const tg = document.createElement('i');   /* a private target: the preview's own finger never reaches the page */
    const e = createJellyTrail(el, { tapToPop: true, hoverTrail: false, donuts: 0.8, zIndex: 1, eventTarget: tg, backdropColor: '#1E1B4B' });
    const x0 = 22, x1 = r.width - 40, yc = r.height / 2 - 4, amp = r.height * 0.2, dur = 1150, t0 = performance.now();
    const fire = (type, x, y) => { try { tg.dispatchEvent(new PointerEvent(type, { pointerId: 7, pointerType: 'touch', clientX: r.left + x, clientY: r.top + y })); } catch (err) {} };
    let started = false;
    const step = now => { const k = Math.min(1, (now - t0) / dur), q = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2, x = x0 + (x1 - x0) * q, y = yc + Math.sin(q * Math.PI * 2) * amp;
      if (!started) { started = true; fire('pointerdown', x, y); } else fire('pointermove', x, y);
      if (k < 1) requestAnimationFrame(step);
      else { fire('pointercancel', x, y); setTimeout(() => e.popAt(Math.max(30, x1 - 10), yc), 150); setTimeout(() => e.destroy(), 2800); } };
    requestAnimationFrame(step);
    return e;
  } catch (err) { return null; }
}
window.TL_JELLY = { create: createJellyTrail, sync: sync, engine: () => eng, preview: preview, bending: () => !!snap };
})();
