<script>
/* Tashbar Sound v1.2
   Background sound for every Tashbar page: 43 choices of nature, classical, energy (drums),
   places (classroom, laughter), calm music and noise.
   Every sound is made on the device with Web Audio. No sound files, no internet.

   Add to a page: load this file in a script tag before the end of the body, with
   data-user="T008" on the tag if the page knows who is signed in.
   Apps Script: paste this file into TashbarSound.html, wrapped in a script tag, and add
   the include('TashbarSound') scriptlet just before the end of the body on every page.

   Saving: each person's choices go to their school account through Sound.gs
   (soundGet / soundSave, tab Sound_Prefs). Nothing is saved on the device.
     TashbarSound.signIn('ms', token)      Quest calls this after a code sign-in
     TashbarSound.signOut()                stops the sound and forgets the person on this device
   Pages that keep their sign-in in sessionStorage ('tlSession', 'tl-session') are picked up
   automatically. A guest (not signed in) can listen; nothing is saved.
     TashbarSound.duck(true|false)         lower the music while the app plays its own sound
   Music lowers itself automatically while the device reads aloud (speechSynthesis). */
(function () {
  'use strict';
  if (window.TashbarSound) return;

  var ctx, vol, duckG, verbIn, NB = {}, SEAM = 0.05;
  var cur = null, curId = null, timerId = null, appDuck = false;
  var user = 'guest', prefs = defaults(), listeners = [], mem = {};

  function defaults() { return { id: 'rain', vol: 0.5, fav: [], on: false, timer: 0 }; }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  /* ---------- audio core ---------- */
  function init() {
    if (ctx) return true;
    if (!AC) return false;
    ctx = new AC();
    var comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 4;
    vol = ctx.createGain(); vol.gain.value = curve(prefs.vol);
    duckG = ctx.createGain();
    vol.connect(duckG); duckG.connect(comp); comp.connect(ctx.destination);
    var verb = ctx.createConvolver(); verb.buffer = impulse(3.4, 2.6);
    var vg = ctx.createGain(); vg.gain.value = 0.6;
    verb.connect(vg); vg.connect(vol); verbIn = verb;
    var len = Math.floor(ctx.sampleRate * 6), f = 2400;
    SEAM = f / ctx.sampleRate;
    ['white', 'pink', 'brown'].forEach(function (t) {
      var b = ctx.createBuffer(2, len, ctx.sampleRate);
      for (var c = 0; c < 2; c++) fillNoise(b.getChannelData(c), t, f);
      NB[t] = b;
    });
    setInterval(function () {
      var talking = false;
      try { talking = !!(window.speechSynthesis && window.speechSynthesis.speaking); } catch (e) {}
      duckG.gain.setTargetAtTime(talking || appDuck ? 0.22 : 1, ctx.currentTime, 0.25);
    }, 250);
    return true;
  }
  function curve(v) { return Math.pow(Math.max(0, Math.min(1, v)), 1.6) * 1.5; }
  function fillNoise(d, t, f) {
    var b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0, last = 0, i, w;
    for (i = 0; i < d.length; i++) {
      w = Math.random() * 2 - 1;
      if (t === 'white') d[i] = w * 0.5;
      else if (t === 'pink') {
        b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759;
        b2 = 0.969 * b2 + w * 0.153852; b3 = 0.8665 * b3 + w * 0.3104856;
        b4 = 0.55 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.016898;
        d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11; b6 = w * 0.115926;
      } else { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }

    for (i = 0; i < f; i++) { var a = i / f; d[i] = d[i] * a + d[d.length - f + i] * (1 - a); }
  }
  function impulse(sec, decay) {
    var n = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(2, n, ctx.sampleRate);
    for (var c = 0; c < 2; c++) { var d = b.getChannelData(c); for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay); }
    return b;
  }
  function F(type, f, q) { var x = ctx.createBiquadFilter(); x.type = type; x.frequency.value = f; if (q != null) x.Q.value = q; return x; }
  function G(g) { var x = ctx.createGain(); x.gain.value = g; return x; }
  function P(p) { if (ctx.createStereoPanner) { var x = ctx.createStereoPanner(); x.pan.value = p; return x; } return G(1); }
  function chain() { for (var i = 0; i < arguments.length - 1; i++) arguments[i].connect(arguments[i + 1]); return arguments[arguments.length - 1]; }

  /* a playing sound: owns its nodes and its schedulers, fades out on stop */
  function Voice(level, rev) {
    this.n = []; this.t = []; this.dead = false;
    this.out = G(0); this.out.connect(vol);
    this.out.gain.setTargetAtTime(level, ctx.currentTime, 0.6);
    if (rev) { this.send = G(rev); this.out.connect(this.send); this.send.connect(verbIn); }
  }
  Voice.prototype.keep = function (x) { this.n.push(x); return x; };
  Voice.prototype.every = function (ms, fn) { var s = this; this.t.push(setInterval(function () { if (!s.dead) fn(); }, ms)); };
  /* fn(t) schedules something at audio time t and returns seconds until the next call */
  Voice.prototype.gen = function (fn, delay) {
    var s = this, tn = ctx.currentTime + (delay || 0.05);
    function tick() {
      var now = ctx.currentTime, look = document.hidden ? 1.6 : 0.35;
      if (tn < now - 0.5) tn = now + 0.02;
      while (tn < now + look) tn += Math.max(0.004, fn(tn));

    tick(); this.every(90, tick);
  };
  Voice.prototype.stop = function () {
    var s = this; s.dead = true;
    s.t.forEach(function (id) { clearInterval(id); });
    s.out.gain.cancelScheduledValues(ctx.currentTime);
    s.out.gain.setTargetAtTime(0, ctx.currentTime, 0.35);
    setTimeout(function () {
      s.n.forEach(function (x) { try { x.stop(); } catch (e) {} try { x.disconnect(); } catch (e) {} });
      try { s.out.disconnect(); } catch (e) {} try { s.send && s.send.disconnect(); } catch (e) {}

    var s = ctx.createBufferSource(); s.buffer = NB[t]; s.loop = true;
    s.loopStart = 0; s.loopEnd = NB[t].duration - SEAM;
    s.start(0, rnd(0, NB[t].duration - 1)); return v.keep(s);

  function lfo(v, rate, depth, param, base) {

  /* ---------- instruments ---------- */
  function midi(n) {

    var b = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);

  function hz(n) { return 440 * Math.pow(2, ((typeof n === 'number' ? n : midi(n)) - 69) / 12); }
  function note(dest, f, t, dur, vel, kind) {
    var e = ctx.createGain(); e.connect(dest);
    if (kind === 'pad') {

      [-7, 7].forEach(function (dt) {
        var o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = dt;
        o.connect(lp); o.start(t); o.stop(t + dur + 3);
      });
      e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(vel * 0.06, t + Math.min(2.2, dur / 2));
      e.gain.setValueAtTime(vel * 0.06, t + dur); e.gain.linearRampToValueAtTime(0, t + dur + 2.8);
      return;
    }
    var bell = kind === 'bell';
    var parts = bell ? [[1, 1, 'sine'], [2.76, 0.22, 'sine'], [5.4, 0.07, 'sine']]
                     : [[1, 1, 'triangle'], [2, 0.32, 'sine'], [3, 0.1, 'sine'], [4.02, 0.04, 'sine']];
    var decay = bell ? 1.8 : Math.min(4, 1 + dur * 1.3);
    parts.forEach(function (p) {
      var o = ctx.createOscillator(); o.type = p[2]; o.frequency.value = f * p[0];
      var g = G(p[1]); o.connect(g); g.connect(e); o.start(t); o.stop(t + decay + 0.1);
    });
    e.gain.setValueAtTime(0.0001, t); e.gain.linearRampToValueAtTime(vel * 0.2, t + 0.005);
    e.gain.exponentialRampToValueAtTime(vel * 0.07, t + 0.3);
    e.gain.exponentialRampToValueAtTime(0.0001, t + decay);
  }
  /* "C4+E4:2 r:1 G4" → events in beats */
  function parse(str, def) {
    var ev = [], t = 0;
    str.trim().split(/\s+/).forEach(function (tok) {
      var p = tok.split(':'), d = p[1] != null ? +p[1] : def;
      if (p[0] !== 'r') ev.push([t, p[0].split('+').map(midi), d]);
      t += d;
    });
    return { ev: ev, len: t };
  }
  function seq(v, dest, spec) {
    var all = [], L = 0;
    spec.tracks.forEach(function (tr) {
      var p = parse(tr.s, tr.d || 1); L = Math.max(L, p.len);
      p.ev.forEach(function (e) { all.push([e[0], e[1], e[2], tr]); });
    });
    all.sort(function (a, b) { return a[0] - b[0]; });
    var spb = 60 / spec.bpm, i = 0, base = ctx.currentTime + 0.2, gap = spec.gap || 2;
    function tick() {
      var now = ctx.currentTime, look = document.hidden ? 1.6 : 0.35;
      for (;;) {
        if (i >= all.length) { i = 0; base += L * spb + gap; }
        var e = all[i], t = base + e[0] * spb;
        if (t > now + look) break;
        if (t > now - 0.05) e[1].forEach(function (m) {
          note(dest, hz(m), t, e[2] * spb, (e[3].v || 0.7) * rnd(0.88, 1.04), e[3].k || 'piano');
        });
        i++;
      }
    }
    tick(); v.every(70, tick);
  }
  function music(spec) {
    return function (v, o) { var lp = F('lowpass', spec.lp || 4200, 0.5); lp.connect(o); seq(v, lp, spec); };
  }
  function rep(s, n) { var a = []; for (var i = 0; i < n; i++) a.push(s); return a.join(' '); }

  /* ---------- the pieces (public domain compositions, played by the device) ---------- */
  var BACH = ['C4 E4 G4 C5 E5', 'C4 D4 A4 D5 F5', 'B3 D4 G4 D5 F5', 'C4 E4 G4 C5 E5', 'C4 E4 A4 E5 A5',

    'E3 F3 A3 C4 F4', 'D3 F3 A3 C4 F4', 'G2 D3 G3 B3 F4', 'C3 E3 G3 C4 E4'].map(function (c) {
      var n = c.split(' '), pat = [0, 1, 2, 3, 4, 2, 3, 4];

  var CANON_CH = ['D4 F#4 A4', 'C#4 E4 A4', 'B3 D4 F#4', 'C#4 F#4 A4', 'B3 D4 G4', 'D4 F#4 A4', 'B3 D4 G4', 'C#4 E4 A4']

  var GYM_LH = rep('G2:1 B3+D4+F#4:2 D2:1 A3+C#4+F#4:2', 10);

  var SOUNDS = [
    /* Nature */
    { id: 'rain', cat: 'Nature', name: 'Rain', icon: '🌧️', lvl: 1.55, make: function (v, o) { rain(v, o, false); } },

    { id: 'ocean', cat: 'Nature', name: 'Ocean waves', icon: '🌊', lvl: 0.57, make: function (v, o) {

        var lp = F('lowpass', 600, 0.7), g = G(0.4), pn = P(w[1]);

        var bp = F('bandpass', 2600, 0.8), g2 = G(0.05); chain(noise(v, 'white'), bp, g2, pn);

      });
    } },
    { id: 'stream', cat: 'Nature', name: 'Forest stream', icon: '🏞️', lvl: 2.56, make: function (v, o) {

      [700, 1400, 2600, 4200].forEach(function (fc, i) {
        var b = F('bandpass', fc, 4), g = G(0.12);

        v.gen(function (t) {

    { id: 'birds', cat: 'Nature', name: 'Morning birds', icon: '🐦', lvl: 3.12, make: function (v, o) {

    { id: 'wind', cat: 'Nature', name: 'Mountain wind', icon: '🌬️', lvl: 1.49, make: function (v, o) {

    var x = el('button', 'x', '×'); x.setAttribute('aria-label', 'Close'); x.onclick = function () { setOpen(false); ui.fab.focus(); };
    head.appendChild(x); p.appendChild(head);

    var now = el('div', 'now');
    ui.nIc = el('div', 'ic'); ui.nName = el('b'); ui.nSub = el('small');
    ui.pp = el('button', 'pp'); ui.pp.onclick = function () { if (curId) stop(); else play(prefs.id); };
    var row = el('div', 'row');
    var vl = el('label', 'vh', 'Volume'); vl.setAttribute('for', 'tsvol');
    ui.vol = el('input'); ui.vol.type = 'range'; ui.vol.id = 'tsvol'; ui.vol.min = 0; ui.vol.max = 1; ui.vol.step = 0.01;
    ui.vol.oninput = function () { setVol(+ui.vol.value); };
    var spk = el('span', '', '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#AEB9DA" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="#AEB9DA"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>');
    spk.setAttribute('aria-hidden', 'true');
    ui.nStar = el('button', 'star', '★'); ui.nStar.onclick = function () { toggleFav(prefs.id); };
    row.appendChild(spk); row.appendChild(vl); row.appendChild(ui.vol); row.appendChild(ui.nStar);
    now.appendChild(ui.nIc); now.appendChild(ui.nName); now.appendChild(ui.pp); now.appendChild(ui.nSub); now.appendChild(row);
    p.appendChild(now);

    ui.chips = el('div', 'chips'); ui.chips.setAttribute('role', 'group'); ui.chips.setAttribute('aria-label', 'Show');
    ['All', 'Mine'].concat(CATS).forEach(function (c) {
      var b = el('button', 'chip', c === 'Mine' ? '★ My picks' : c); b.dataset.c = c;
      b.onclick = function () { filter = c; render(); }; ui.chips.appendChild(b);
    });
    p.appendChild(ui.chips);
    ui.list = el('div', 'list'); p.appendChild(ui.list);

    var foot = el('div', 'foot');
    var lab = el('label', '', 'Stop after ');
    ui.timer = el('select'); ui.timer.id = 'tstimer';
    [[0, 'never'], [15, '15 minutes'], [30, '30 minutes'], [45, '45 minutes'], [60, '1 hour']].forEach(function (o) {
      var op = el('option', '', o[1]); op.value = o[0]; ui.timer.appendChild(op);
    });
    ui.timer.onchange = function () { prefs.timer = +ui.timer.value; armTimer(); save(); };
    lab.appendChild(ui.timer); foot.appendChild(lab);
    foot.appendChild(el('div', '', 'The sound is made on this computer, so it works without internet. It gets quieter while the app reads aloud.'));
    p.appendChild(foot);
  }
  function tile(s) {
    var b = el('button', 't' + (s.id === curId ? ' cur' : ''), '<span class="e" aria-hidden="true">' + s.icon + '</span><span>' + s.name + '</span>');
    b.setAttribute('aria-pressed', String(s.id === curId));
    b.onclick = function () { if (s.id === curId) stop(); else play(s.id); };
    var fav = prefs.fav.indexOf(s.id) >= 0;
    var st = el('span', 's' + (fav ? ' on' : ''), fav ? '★' : '☆');
    st.setAttribute('role', 'button'); st.setAttribute('tabindex', '0');
    st.setAttribute('aria-label', (fav ? 'Remove ' : 'Add ') + s.name + (fav ? ' from' : ' to') + ' my picks');
    st.style.display = 'grid'; st.style.placeItems = 'center';
    st.onclick = function (e) { e.stopPropagation(); toggleFav(s.id); };
    st.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); toggleFav(s.id); } };
    b.appendChild(st); return b;
  }
  function render() {
    if (!ui.wrap) return;
    var playing = !!curId;
    ui.wrap.classList.toggle('playing', playing);
    ui.wrap.classList.toggle('resume', !playing && prefs.on);
    var s = find(curId || prefs.id);
    ui.fab.setAttribute('aria-label', playing ? 'Background sound: ' + s.name + ' is playing' : prefs.on ? 'Background sound: tap to bring back ' + s.name : 'Background sound');
    ui.fab.title = playing ? s.name : prefs.on ? 'Tap anywhere to bring back ' + s.name : 'Background sound';
    if (!open) return;
    ui.nIc.textContent = s.icon; ui.nName.textContent = s.name;
    ui.nSub.textContent = playing ? 'Playing · ' + s.cat : 'Paused · ' + s.cat;
    ui.pp.innerHTML = playing ? I_PAUSE : I_PLAY; ui.pp.setAttribute('aria-label', playing ? 'Pause' : 'Play ' + s.name);
    ui.vol.value = prefs.vol;
    var fav = prefs.fav.indexOf(s.id) >= 0;
    ui.nStar.classList.toggle('on', fav); ui.nStar.setAttribute('aria-label', fav ? 'Remove from my picks' : 'Add to my picks'); ui.nStar.setAttribute('aria-pressed', String(fav));
    ui.timer.value = String(prefs.timer);
    [].forEach.call(ui.chips.children, function (b) { b.setAttribute('aria-pressed', String(b.dataset.c === filter)); });
    var keepTop = ui.list.scrollTop; ui.list.innerHTML = '';
    var groups = filter === 'All' ? CATS : filter === 'Mine' ? ['Mine'] : [filter];
    if (filter === 'All' && prefs.fav.length) groups = ['Mine'].concat(CATS);
    groups.forEach(function (g) {
      var items = g === 'Mine' ? prefs.fav.map(find).filter(Boolean) : SOUNDS.filter(function (x) { return x.cat === g; });
      var box = el('div', 'grp'); box.appendChild(el('h3', '', g === 'Mine' ? '★ My picks' : g));
      if (!items.length) box.appendChild(el('p', 'empty', 'Tap ☆ on any sound to keep it here.'));
      else { var grid = el('div', 'grid'); items.forEach(function (x) { grid.appendChild(tile(x)); }); box.appendChild(grid); }
      ui.list.appendChild(box);
    });
    ui.list.scrollTop = keepTop;
  }

  /* bring back the last sound at the first tap or key anywhere on the page */
  function onFirstGesture() {
    if (ctx && ctx.state !== 'running' && curId) { try { ctx.resume(); } catch (e) {} }
    if (prefs.on && !curId) play(prefs.id);
  }
  ['pointerdown', 'pointerup', 'touchend', 'keydown'].forEach(function (ev) {
    document.addEventListener(ev, function (e) {
      if (host && e.composedPath && e.composedPath().indexOf(host) >= 0) return;
      onFirstGesture();
    }, true);
  });

  /* ---------- public API ---------- */
  var ana = null, me = document.currentScript;
  window.TashbarSound = {
    version: '1.2.0',
    list: function () { return SOUNDS.map(function (s) { return { id: s.id, name: s.name, category: s.cat }; }); },
    play: play, stop: function () { stop(); },
    open: function () { mount(); setOpen(true); },
    setUser: function (id) {
      var wasOn = !!curId; if (cur) { cur.stop(); cur = null; curId = null; }
      user = String(id || 'guest'); load(); render();
      if (wasOn && prefs.on) play(prefs.id);
    },
    loadPrefs: function (p) { applyPrefs(p); mem[user] = JSON.stringify(prefs); render(); },
    signIn: function (kind, token) { signIn(kind, token, false); },
    signOut: signOut,
    getPrefs: function () { return JSON.parse(JSON.stringify(prefs)); },
    onPrefs: function (fn) { if (typeof fn === 'function') listeners.push(fn); },
    duck: function (on) { appDuck = !!on; },
    _level: function () { if (!ctx) return 0; if (!ana) { ana = ctx.createAnalyser(); ana.fftSize = 2048; duckG.connect(ana); } var d = new Float32Array(2048); ana.getFloatTimeDomainData(d); var m = 0; for (var i = 0; i < d.length; i++) m += d[i] * d[i]; return Math.sqrt(m / d.length); },
    mount: mount
  };
  if (me && me.dataset && me.dataset.user) user = me.dataset.user;
  load();
  function boot() { mount({ side: me && me.dataset && me.dataset.side }); }
  if (document.body) boot(); else document.addEventListener('DOMContentLoaded', boot);
  watchSession(); setInterval(watchSession, 1500);
  window.addEventListener('pagehide', flush);
})();

</script>
