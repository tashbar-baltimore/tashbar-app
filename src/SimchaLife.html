/* ===== B'SIMCHA morning (v119, CHANGE 1632 v2.2, first slice): once a day on the home screen, Today's Vort + Simcha of Today,
   then "What would help you today?": Some chizuk (the Chizuk Minute), A vort (a bitachon line with its source), I'm ready.
   NOT in this slice: "Talk to my Rebbe privately" (needs a private server path; a later build), journal, stories, Gam Zu L'Tovah game.
   Never beside a joke (the Joke Jar never opens on the home screen). No money, no server data: "shown today" is kept in this browser only.
   SWITCH: window.TL_SIM_MORNING_LIVE = false -> TEST- boys only; true -> every boy. ===== */
(function(){
window.TL_SIM_MORNING_LIVE = true;   /* HoS DECISION 2230 */
const S = window.TL_SIMCHA || {};
function on(){ const st = A && A.st; return !!(st && (window.TL_SIM_MORNING_LIVE || /^TEST-/.test(String(st.id || '')))); }
function E(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function day(){ const d = new Date(); return d.getFullYear() * 1000 + Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5); }
function pickDay(L, k){ if (!L || !L.length) return null; return L[(day() + (k || 0)) % L.length]; }
function line(x){ if (!x) return ''; if (typeof x === 'string') return '<p class="sm-line">' + E(x) + '</p>'; return '<p class="sm-line">' + E(x.text) + '</p>' + (x.src ? '<p class="sm-src">' + E(x.src) + '</p>' : ''); }
function key(){ return 'tlSimMorning:' + String((A.st && A.st.id) || 'x'); }
function shown(){ try { return localStorage.getItem(key()) === String(day()); } catch (e) { return true; } }
function mark(){ try { localStorage.setItem(key(), String(day())); } catch (e) {} }
try { if (!document.getElementById('sm-css')) { const s = document.createElement('style'); s.id = 'sm-css'; s.textContent = '.sm-line{font-size:1.15em;line-height:1.5;margin:.3em 0}.sm-src{font-size:.85em;opacity:.7;margin:0 0 .6em}.sm-h{font-weight:800;margin:.8em 0 .2em;color:#4338CA}.sm-needs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}'; document.head.appendChild(s); } } catch (e) {}
function needs(){ return (S.need || []).filter(n => !/rebbe/i.test(n.label)); }
function morning(){
  mark();
  const v = pickDay(S.vort), t = pickDay(S.today, 3);
  overlay('<div class="oe">'+tlOri('happy')+'</div><h2>Today\'s Vort</h2>' + line(v) +
    (t ? '<p class="sm-h">Simcha of Today</p>' + line(t) : '') +
    '<p class="sm-h">What would help you today?</p><div class="sm-needs">' +
    needs().map((n, i) => '<button class="btn" data-act="sm-need" data-i="' + i + '">' + E(n.icon) + ' ' + E(n.label) + '</button>').join('') + '</div>');
}
function chizuk(i){
  const L = S.chizuk || []; if (!L.length) { A.overlay = null; render(); return; }
  const last = i >= L.length - 1;
  overlay('<div class="oe">'+tlOri('calm')+'</div><h2>Chizuk Minute</h2><p class="sm-line" style="font-size:1.4em">' + E(L[i]) + '</p><p style="opacity:.6">' + (i + 1) + ' of ' + L.length + '</p>' +
    (last ? '<button class="btn go big" data-act="closeov">Back to learning</button>' : '<button class="btn go big" data-act="sm-chizuk" data-i="' + (i + 1) + '">Next</button>'));
  try { if (typeof speak === 'function') speak(L[i]); } catch (e) {}
}
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
  if (a === 'sm-need') { const n = needs()[+b.dataset.i]; if (!n) return;
    if (/chizuk/i.test(n.label)) return chizuk(0);
    if (/vort/i.test(n.label)) { const x = pickDay(S.bitachon, 1) || pickDay(S.hands); overlay('<div class="oe">📜</div><h2>A vort for you</h2>' + line(x) + '<button class="btn go big" data-act="closeov">Back to learning</button>'); return; }
    overlay('<div class="oe">🚀</div><h2>' + E(n.reply) + '</h2><button class="btn go big" data-act="closeov">Let\'s go</button>'); return; }
  if (a === 'sm-chizuk') return chizuk(+b.dataset.i);
});
let q = 0;
/* HoS 2026-11-21 one welcome: for a boy with a game map the game welcome already brings today's vort and chizuk, so this older
   night-sky card never opens there. */
function gameHome(){ try { return !!window.TL_MAP; } catch (e) { return false; } }
function check(){ q = 0; try { if (A && A.view === 'hub' && A.st && !A.overlay && on() && !gameHome() && !shown() && typeof overlay === 'function') setTimeout(() => { if (A.view === 'hub' && !A.overlay && !gameHome() && !shown()) morning(); }, 1200); } catch (e) {} }
try { new MutationObserver(() => { if (!q) { q = 1; requestAnimationFrame(check); } }).observe(document.body, { childList: true, subtree: true }); } catch (e) {}
window.tlSimMorning = morning;
})();

/* Every choice on a card is a possible GOOD: the story's real good (guesses[0]) plus two other goods from this pool. */
/* (guesses[1] and [2] in the story data are not shown; the game never offers a gloomy choice.) */
const GOODS = {
  K2: ['a new friend', 'a chance to help someone', 'something fun to learn', 'time with Abba or Zeidy', 'a nice surprise later', 'a chance to share'],
  '35': ['a new friend', 'a chance to do a chessed', 'learning something new', 'time with Abba or Zeidy', 'a better plan later', 'a chance to grow stronger'],
  '68': ['a new friend or chavrusa', 'a chance to do a chessed', 'discovering a new strength', 'time with family', 'a better path later on', 'growing in bitachon'],
};
const CHEERS = ['Good-Finder star!', 'You looked for the good!', 'That is the gam zu l\'tovah way!', 'Great eyes for the good!'];
const hash = s => { let h = 2166136261; for (const c of s) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; } return h; };
const shuffle = (a, seed) => { a = a.slice(); let h = hash(seed); for (let k = a.length - 1; k > 0; k--) { h = Math.imul(h ^ (h >>> 15), 2246822519) >>> 0; const j = h % (k + 1); [a[k], a[j]] = [a[j], a[k]]; } return a; };
function cards(band) {

    const sp = SPLIT[s.id]; const c = sp ? Object.assign({}, s, { first: sp[0], then: sp[1], guesses: sp[2], good: sp[2][0] }) : Object.assign({}, s, { good: GOOD[s.id] || (s.guesses && s.guesses[0]) });
    return c.first && c.then && c.guesses ? c : null;
  }).filter(c => c && (!band || c.band === band));

    back.append(next); card.append(back); next.focus(); try{ next.scrollIntoView({block:'nearest'}); }catch(e){}
  }

function ori(mood) {
  const eyes = mood === 'calm'
