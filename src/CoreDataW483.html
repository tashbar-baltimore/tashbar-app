    watch:{ q:'Claim: Our school should start a recycling program.', m:{type:'scene', e:'📰', t:'Akiva is writing an editorial for The Beacon.'}, steps:[
      {t:'Test 1, relevant: does it prove THIS claim?'},
      {t:'"Plastic was made a century ago." Same topic, but not relevant.'},
      {t:'Test 2, credible: can we trust the source?'},
      {t:'"Everyone knows recycling is great." No source. Not credible.'},
      {t:'"The city says recycling cuts school trash by a third." Both tests pass.'},

    oops:{ q:'Claim: our school should recycle.', wrong:'Everyone knows recycling is the best thing ever.', right:'The city’s report counts the trash schools throw out.', why:'"Everyone knows" has no source. Evidence needs a source you can check.' },
    ways:['worked example','sort it','match it','word tiles','Mistake Detective','teach it back'], done:'You can choose evidence that is relevant and credible.',

    do:[

        say:'Strong evidence, or weak? Sort each card.', how:'Strong: proves this claim AND has a source you can trust.'},
      {type:'match', pairs:[['The city’s trash report','Credible: a record'],['An ad for a company','Not credible: it sells'],['A hallway rumor','Not credible: unchecked']],
        say:'Match each source to how much you can trust it.', how:'Who made it? Do they know the facts? Do they want something?'}],
    your:[
      {type:'tiles', q:'Claim: boys need earlier bedtimes.', w:['According to','the nurse,','most boys','are too tired.'], extra:['everyone says'],
        say:'Build it: the trusted source first, then the fact.', how:'Name who knows. Then what they found.'},
      {type:'sort', q:'Claim: The Beacon should add a sports page.', bins:['Relevant','Not relevant'], cards:[['41 of 60 boys asked for sports.',0],['The league has no news coverage.',0],['The Beacon prints on Thursdays.',1],['The paper is blue.',1]],
        say:'Does each fact prove this claim?', how:'Same newspaper is not enough. Does it prove boys want sports news?'},
      {type:'match', pairs:[['Relevant','It proves this claim.'],['Credible','You can trust the source.'],['Not credible','A rumor or an ad.']],

  'WRIT.PARA.L07.01':{ band:'M68', pic:'🔗', today:'Glue your ideas together with the right words', why:'Glue words turn a pile of sentences into an argument the reader can follow.',
    ready:[{q:'"This shows that" starts the…', o:['explain','hook','greeting','title'], a:'explain'}],
    bridge:'WRIT.ESSAY.L07.02', bridgeName:'Quote evidence and explain it',
    watch:{ q:'Claim: The Beacon should come out every week.', m:{type:'scene', e:'📰', t:'Eli is arguing for a weekly Beacon at the staff meeting.'}, steps:[
      {t:'Reason 1: weekly news is timely.'},
      {t:'Job 1, add a reason: "In addition, issues are shorter."'},
      {t:'Job 2, show a result: "As a result, more boys read every page."'},
      {t:'Job 3, proof: "For example, 50 boys read every issue. This shows that weekly news works."'},
      {t:'Trap: "However" turns to the other side. It never adds a reason or shows a result.'},
      {t:'Teach it back: tell your chavrusa the three glue jobs and the "However" trap.'}], a:'In addition, … As a result, … This shows that …' },
    oops:{ q:'The rain stopped. ___, the game went on.', wrong:'However,', right:'As a result,', why:'"However" shows a contrast. The game going on is a result.' },
    ways:['worked example','sort it','match it','word tiles','Mistake Detective','teach it back'], done:'You can join ideas with glue words that match the connection.',
    board:{ one:'Decide the connection, then pick the glue: adds a reason, shows a result, points to proof.', activity:'Read sentence pairs aloud; the class holds up a card: ADD, RESULT or PROOF.', mistakes:['"However" when adding','"As a result" with no cause','"For example" before a result'] },
    do:[
      {type:'match', pairs:[['Reason 1 … Reason 2','In addition,'],['A cause … what it caused','As a result,'],['A claim … its evidence','For example,']],
        say:'Match each connection to the glue that fits.', how:'Decide the connection first. Then the glue.'},
      {type:'sort', bins:['Glue fits','Mistake: wrong glue'], cards:[['Rain stopped. As a result, we played.',0],['Rain stopped. However, we played.',1],['He practiced. Because of this, he won.',0],['He practiced. For example, he won.',1]], mis:true,
        say:'Does the glue fit? Sort each pair.', how:'Is the second idea a result, a contrast or an example?',
        why:{q:'Teach it back: your chavrusa asks, "Why is \'However\' wrong here?"', o:['"However" turns to the other side, but playing is a result','"However" is too short','"However" only goes at the end'], a:'"However" turns to the other side, but playing is a result'}}],
    your:[
      {type:'tiles', q:'Show a result.', w:['We gave $90.','As a result,','a family','got coats.'], extra:['However,'],
        say:'Build a sentence that shows a result.', how:'Cause first. Then the result glue. Then what happened.'},
      {type:'sort', bins:['Adds a reason','Shows a result','Points to proof'], cards:[['Furthermore,',0],['Consequently,',1],['For instance,',2],['In addition,',0],['As a result,',1]],
        say:'Sort each glue word by its job.', how:'One more reason? What happened? Or the evidence?'},
      {type:'evidence', q:'Eli’s paragraph for a weekly Beacon. Tap the sentence whose glue does not fit.', p:['The Beacon should come out every week.','First, weekly news is timely.','In addition, each issue would be shorter.','However, shorter issues are quicker to read.','As a result, more boys would read every page.'], a:3, look:'glue that does not match the connection',
        say:'Tap the sentence with the wrong glue word.', how:'Read the sentence before each glue word. Add, result, proof, or a turn?'},
      {type:'sort', q:'Akiva’s editorial.', bins:['Glue fits','Mistake'], cards:[['Weekly news is timely. Furthermore, it is short.',0],['Issues come out sooner. Consequently, more boys read.',0],['Weekly news is timely. However, it keeps news fresh.',1],['Issues come out sooner. For example, more boys read.',1]],
        say:'Does each glue word fit the argument?', how:'Read before and after. Does the connection match?'},
      {type:'tiles', q:'Add a reason.', w:['Weekly news','is timely.','In addition,','it is short.'], extra:['As a result,'],
        say:'Build a sentence that adds a reason.', how:'First reason. Adding glue. Next reason.'}] },

  'WRIT.PARA.L07.02':{ band:'M68', pic:'🎩', today:'Write your argument in a formal voice', why:'Adults take an argument seriously when it sounds serious, exact and respectful.',
    ready:[{q:'A letter to a company needs words that are…', o:['formal','friendly','simple','silly'], a:'formal'}],
    bridge:'WRIT.PARA.L06.03', bridgeName:'Who Is Reading?',
    watch:{ q:'Gavriel writes to Rabbi Rosen about the gym.', m:{type:'scene', e:'🏫', t:'Two classes share one small gym, and Gavriel wants to fix it.'}, steps:[
      {t:'First draft: "The gym is, like, way too small, you guys!!!"'},
      {t:'Cut the slang: "like", "way", "you guys".'},
      {t:'Cut the shouting: one period, no "!!!".'},
      {t:'Add an exact fact: "too small for two classes at once."'},
      {t:'Teach it back: tell your chavrusa the three fixes.'}], a:'The gym is too small for two classes at once.' },
    oops:{ q:'A letter to the menahel', wrong:'This is the worst thing ever, seriously!!!', right:'Students wait 20 minutes for lunch every day.', why:'Exaggeration and shouting sound less serious. An exact fact sounds strong.' },
    ways:['worked example','sort it','match it','word tiles','Mistake Detective','teach it back'], done:'You can write an argument in a formal voice.',
    board:{ one:'Formal voice: no slang, no shouting, exact facts, respectful.', activity:'Chavrusas rewrite three text-message sentences as one formal paragraph and read it aloud.', mistakes:['Slang like "way" and "totally"','"You guys"','Shouting with "!!!" or "the worst ever"'] },
    do:[
      {type:'sort', q:'A letter to the menahel.', bins:['Formal','Mistake: informal'], cards:[['Many students agree.',0],['Everybody totally loves it.',1],['The evidence shows a problem.',0],['This is so cool, you guys.',1]], mis:true,
        say:'Formal or informal? Sort each sentence.', how:'Formal is serious, exact and respectful. Slang is informal.'},
      {type:'tiles', q:'Build a formal request.', w:['Therefore,','I ask','for a later','start time.'], extra:['you guys'],
        say:'Build a formal sentence from the tiles.', how:'Linking word first. Then the polite request. Then what.'}],
    your:[
      {type:'match', pairs:[['a ton of boys','many students'],['super late','ten minutes late'],['waited forever','waited 20 minutes']],
        say:'Match each informal phrase to its formal fix.', how:'Replace slang with exact, respectful words.'},
      {type:'sort', bins:['Good formal fix','Mistake'], cards:[['The gym is too small.',0],['The gym is, like, tiny.',1],['We waited 20 minutes.',0],['We waited FOREVER!!!',1]],
        say:'Good formal fix, or a mistake?', how:'Exact facts, no slang, no shouting.'},
      {type:'tiles', q:'Make it formal.', w:['Lunch lines','take','twenty','minutes.'], extra:['forever!!!'],
        say:'Build the formal version.', how:'Use the exact time, not "forever".'},
      {type:'match', pairs:[['you guys','Rabbi Rosen'],['totally','completely'],['!!!','one period']],
        say:'Match each informal piece to its formal swap.', how:'What would a serious writer use instead?'},
      {type:'sort', bins:['Formal word','Informal word'], cards:[['therefore',0],['evidence shows',0],['totally',1],['stuff',1]],
        say:'Sort each word: formal or informal?', how:'Formal words are exact and respectful.'}] },

  'WRIT.PARA.L07.03':{ band:'M68', pic:'⚖️', today:'Close your case with a strong conclusion', why:'The last words are the ones the reader remembers when he decides.',
    ready:[{q:'A conclusion should NOT add a…', o:['new point','final thought','restated idea','strong claim'], a:'new point'}],
    bridge:'WRIT.ESSAY.L06.04', bridgeName:'Strong Finish',
    watch:{ q:'Argument: the library should stay open after Mincha.', m:{type:'scene', e:'📚', t:'Yoni finishes his Beacon editorial about library hours.'}, steps:[
      {t:'Job 1: say the claim again with force.'},
      {t:'Job 2: recall the strongest reason: more learning time.'},
      {t:'Job 3: tell the reader what to do: sign the request.'},
      {t:'Never end with "but maybe I am wrong".'},
      {t:'Teach it back: tell your chavrusa the three jobs.'}], a:'For these reasons, keeping the library open would give every boy more time to learn. Sign the request at the office.' },
    oops:{ q:'The end of the library argument', wrong:'But maybe it does not really matter.', right:'For these reasons, the library should stay open.', why:'Doubting your own claim at the end undoes the whole argument.' },
    ways:['worked example','sort it','match it','word tiles','Mistake Detective','teach it back'], done:'You can close an argument: claim, strongest reason, action.',
    board:{ one:'Close the case: claim with force, strongest reason, call to action. No new argument, no doubt.', activity:'Each boy reads only his last sentence; the class says FOLLOWS, NEW or WEAK.', mistakes:['A new argument at the end','"But maybe I am wrong"','Just stopping'] },
    do:[
      {type:'match', pairs:[['Claim with force','Our school must recycle.'],['Strongest reason','It cuts trash by a third.'],['Call to action','Use the blue bins.']],
        say:'Match each closing job to its sentence.', how:'Claim, strongest reason, action.'},
      {type:'sort', q:'Argument: The Beacon should be weekly.', bins:['Follows','Mistake: new argument','Mistake: weakens'], cards:[['Weekly keeps every boy informed.',0],['Also, print it in color.',1],['But monthly is fine too.',2]], mis:true,
        say:'Follows, new argument, or weakens? Sort each.', how:'Follows: the claim again. New: not proved yet. Weakens: doubts it.'}],
    your:[
      {type:'tiles', q:'A strong closing sentence.', w:['Therefore,','our class','should start','a chesed club.'], extra:['but maybe'],
        say:'Build a strong closing sentence.', how:'Closing words first. Then the claim with force.'},
      {type:'sort', q:'Argument: add a second recess.', bins:['Strong close','Mistake'], cards:[['A second recess helps focus.',0],['Recess needs new balls.',1],['I guess one is okay.',1],['Try it for one month.',0]],
        say:'Strong close, or a mistake?', how:'It follows from the argument and never doubts it.'},
      {type:'match', pairs:[['It adds a new argument.','Move it to the body.'],['It weakens the claim.','Say it with confidence.'],['It just stops.','Add a call to action.']],
        say:'Match each closing mistake to its fix.', how:'What would close the case strongly?'},
      {type:'sort', bins:['Strong start','Mistake'], cards:[['For these reasons,',0],['Therefore,',0],['But maybe',1],['Also,',1]],
        say:'Can each phrase start a strong close?', how:'Strong closing words sum up. "But maybe" doubts. "Also" adds.'},
      {type:'tiles', q:'A call to action.', w:['Please bring','a warm coat','to the office.'], extra:['maybe'],
        say:'Build a call to action.', how:'Tell the reader politely what to bring, and where.'}] }
  };
