    c45_tomthumb: { title: 'The Race Between a Horse and a Train', text: 'In the summer of 1830, a strange race took place near Baltimore. On one track stood a horse pulling a wagon full of passengers. On the other track stood a tiny steam engine called Tom Thumb.\nTom Thumb was built by a man named Peter Cooper. Many people at the time did not believe that a steam engine could ever be faster than a strong horse. Peter Cooper wanted to prove them wrong.\nAt first, the horse pulled ahead. Then Tom Thumb began to puff and roar. It picked up speed, caught the horse, and passed it while the passengers cheered and waved their hats.\nBut just as victory seemed certain, a belt slipped off a wheel inside the engine. The fire died down, the engine slowed, and the horse trotted past to win the race.\nTom Thumb lost that day, but it won something bigger. Everyone had seen how fast it could go. Within a few years, the railroad bought steam engines instead of horses, and trains soon carried people and goods across the country.' },
    c45_paper: { title: 'Making Paper by Hand', text: 'Long before factories, people made paper one sheet at a time. The work was slow, but the paper could last for hundreds of years.\nFirst, the papermaker collected old cotton rags. He cut them into small pieces and soaked them in water for days, until they turned soft and mushy. Then he beat the mushy rags until the threads came apart into a thick, wet pulp, a little like oatmeal.\nNext, he dipped a screen into a big tub of pulp and lifted it out flat. The water drained through the tiny holes, and a thin layer of threads stayed on top. That thin layer would become one sheet of paper.\nThe papermaker flipped the wet sheet onto a piece of felt and pressed many sheets together to squeeze out the last water. Finally, he hung them up to dry, like laundry on a line.\nSome of the oldest seforim in the world are printed on rag paper like this, and their pages are still strong today.' },
    c45_attic: { title: 'The Map in Zeidy\'s Attic (opening)', text: 'Zeidy Benaim\'s attic was the dustiest place in Baltimore, and Yehuda loved it. Every Chanukah, Zeidy let him climb the narrow ladder and look through one box. Just one.\nThis year Yehuda chose a flat wooden box with a rusty lock. The key was taped to the bottom. Inside, wrapped in a faded tallis bag, lay a folded paper, brown at the edges and soft as cloth.\nYehuda opened it slowly. It was a map of old Baltimore, drawn by hand in brown ink. The streets had names he had never heard of. Near the harbor, someone had drawn a tiny star and written three Hebrew letters next to it.\nDownstairs, Zeidy was singing as he cleaned the menorah. When Yehuda came down holding the map, the singing stopped. Zeidy put down the polishing cloth very slowly.\n"Where did you find that?" he asked, in a voice Yehuda had never heard before.\nLater, when Yehuda passed the kitchen, he saw Zeidy standing at the window, holding an old photograph of a young man in a cap, standing in front of a burned building. On the back of the photo, in the same brown ink, was the date: February 1904.' },
    c45_feeder: { title: 'The Empty Feeder', text: 'Every morning, Naftali filled the bird feeder outside the kitchen window with sunflower seeds. By lunchtime the birds had usually eaten about half.\nOn Tuesday, he filled it as always and went to school. When he came home at four, the feeder was completely empty, and the little door at the bottom was hanging open. Seed shells were scattered across the porch railing, but there were no seeds at all on the ground beneath the feeder.\nNaftali\'s little brother said he had seen a "fat, fluffy bird with a long gray tail" running along the fence that afternoon.\nThe next day, Naftali found a few small, muddy paw prints on the porch railing, each with five little toes. Right next to them sat one sunflower seed, neatly opened, with the shell split down the middle.\nNaftali\'s Abba laughed when he saw it. "I think your fluffy bird," he said, "does not have any feathers."' },
    c45_tryout: { title: 'The Choir Tryout', text: 'The sign on the shul door said: "Boys\' choir for the Chanukah concert. Tryouts Sunday at 4:00."\nShmuel Adler read it three times. He loved to sing. He sang in the shower, he sang on the way to school, and every Shabbos he sang zemiros so loudly that his little brothers covered their ears and laughed.\nBut singing alone in front of the choir leader was different. On Sunday, Shmuel walked to the shul very slowly. Twice he stopped and almost turned around. When he finally sat down on the bench outside the room, he could hear his own heart thumping.\nA boy came out of the room smiling. Then it was Shmuel\'s turn. He stood in front of the piano. His mouth was dry. The choir leader, Reb Tuvia, smiled kindly and played the first notes of "Maoz Tzur."\nShmuel closed his eyes and pretended he was at the Shabbos table. He sang the whole first verse without stopping. When he opened his eyes, Reb Tuvia was writing something on his list and nodding.\n"Practice is on Wednesdays," he said.' },
    c45_garden: { title: 'Rooftop Garden', text: 'When the yeshiva built a garden on its flat roof, the boys were not sure it would work. The roof was hot, windy and far from the ground.\nThe science teacher, Mr. Halpern, had a plan. The boys built wooden boxes and filled them with light soil. They planted tomatoes, peppers and basil, which grow well in hot sun. They tied each tomato plant to a stick so the wind could not knock it over.\nAll summer, a group of boys took turns watering the boxes every morning before davening. By August, the tomato plants were taller than the boys. The class picked more than two hundred tomatoes.\nThe garden helped the building, too. On the hottest days, the classroom right under the garden stayed cooler than the other rooms, because the soil and plants blocked the sun from heating the roof.\nThis year, three more schools in Baltimore have asked Mr. Halpern to help them build rooftop gardens of their own.' },
    c45_rowhouse: { title: 'Why Baltimore Has Rowhouses', text: 'Walk down almost any old street in Baltimore and you will see rowhouses: long lines of narrow brick houses, each one sharing its side walls with the house next door.\nIn the 1800s, Baltimore was growing fast. Thousands of families came to work in the busy harbor, the factories and the new railroad. They all needed homes close to their jobs, because most workers walked to work every day.\nLand near the harbor was expensive. A builder could fit only a few wide houses on one block, but he could fit twenty narrow rowhouses on the same land. Sharing walls also saved bricks, so each house cost less to build.\nMany rowhouses had white marble steps in front. Families scrubbed those steps every Saturday night or Sunday morning until they shone, and neighbors noticed whose steps were cleanest.\nToday, many of those same houses are more than one hundred years old. Families still live in them, still sit out on the front steps on summer evenings, and still wave to the neighbors on both sides.' },
    c45_pony: { title: 'The Pony Express', text: 'In 1860, a letter from New York to California could take a month or more by ship or stagecoach. Then a company started the Pony Express.\nYoung riders carried mail bags on fast horses across the plains, deserts and mountains. Every ten or fifteen miles, a rider reached a small station, jumped onto a fresh horse, and galloped on in less than two minutes. After about seventy-five miles, a new rider took the bag. In this way, the mail never stopped moving, day or night.\nThe Pony Express could carry a letter across the country in about ten days. Newspapers printed stories about its brave riders, and people cheered when the mail arrived.\nBut only eighteen months after it started, the Pony Express closed. In October 1861, workers finished the first telegraph line across the country. A message that took the riders ten days could now travel in a few minutes, along a wire.' },
    c45_museum: { title: 'A Visit to the Science Museum', text: 'Our class trip to the science museum was unforgettable. In the first room, a gigantic model of the human heart was big enough to walk through. A recording explained how the heart works continuously, day and night, without any rest.\nIn the next hall, we tried an experiment with electricity. When Dovid touched a metal ball, his hair stood straight up. Everyone burst out laughing, and Dovid laughed hardest of all.\nThe most impressive exhibit was the moon rock. It sat inside a thick glass case with an unbreakable lock. A sign said it was billions of years old. Mr. Halpern told us it was priceless and irreplaceable.\nOn the bus home, Avrumi drew a picture of everything we saw, and Binyamin made a list of questions for our next visit.' },
    c45_volcano: { title: 'Inside a Volcano', text: 'Deep beneath the ground, the rock is so hot that some of it melts. This melted rock is called magma. Because magma is lighter than the solid rock around it, it slowly rises.\nSometimes magma collects in a chamber under a mountain. Pressure builds and builds. When the pressure becomes unbearable, the volcano erupts, and the magma pours out as lava.\nVolcanoes can be unpredictable. Some eruptions are explosive, throwing ash high into the sky. Others are gentle, and the lava flows slowly downhill like hot syrup.\nScientists watch volcanoes carefully. They measure tiny movements of the ground and changes in the gases. These measurements help them make predictions, so families who live nearby can be warned before an eruption becomes dangerous.' }
