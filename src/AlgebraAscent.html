<title>Algebra Ascent</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* SUMMIT world (9th grade to PhD): a calm, grown-up trail map. Contour lines, altitude labels, trail-blaze orange.
   Layout: one column; the map is a vertical trail of camps; a lesson is a station trail over one working card. */
:root{
  --bg:#E8EEF1; --paper:#FFFFFF; --ink:#13202E; --soft:#58697A; --line:#C7D3DB; --grid:#E1E8EC;
  --blaze:#D9512A; --pine:#2A7A62; --sky:#2E66C9; --gold:#B57F0E; --good:#1F8656; --bad:#C0343D; --tint:#F3F6F8; --topo:rgba(19,32,46,.06);
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-head:"Bahnschrift","DIN Alternate","Avenir Next Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-math:"STIX Two Math","Cambria Math","Latin Modern Math",Cambria,"Times New Roman",serif;
  --f-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D151E; --paper:#15202B; --ink:#E3EBF1; --soft:#93A4B4; --line:#2A3A49; --grid:#1E2B37;
  --blaze:#FF7A4D; --pine:#4DB892; --sky:#6E9FFF; --gold:#E7B64E; --good:#4CC38A; --bad:#FF6B73; --tint:#1A2733; --topo:rgba(227,235,241,.05); color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#0D151E; --paper:#15202B; --ink:#E3EBF1; --soft:#93A4B4; --line:#2A3A49; --grid:#1E2B37;
  --blaze:#FF7A4D; --pine:#4DB892; --sky:#6E9FFF; --gold:#E7B64E; --good:#4CC38A; --bad:#FF6B73; --tint:#1A2733; --topo:rgba(227,235,241,.05); color-scheme:dark; }
html,body{height:100%}
body{margin:0;background-color:var(--bg);background-image:repeating-radial-gradient(circle at 85% -15%,transparent 0 26px,var(--topo) 26px 27px),repeating-radial-gradient(circle at -10% 110%,transparent 0 34px,var(--topo) 34px 35px);background-attachment:fixed;color:var(--ink);font:16px/1.5 var(--f-ui)}
.wrap{max-width:1000px;margin:0 auto;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:220px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:700 26px/1.1 var(--f-head);margin:0;letter-spacing:.2px}
.brand h1 small{display:block;font:500 13px var(--f-ui);color:var(--soft);letter-spacing:0;margin-top:3px}
.pill{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;min-height:38px}
.pill[aria-pressed="true"]{border-color:var(--blaze);color:var(--blaze)}
.btn{border:0;border-radius:12px;padding:11px 20px;font-weight:700;background:var(--blaze);color:#fff;min-height:46px}
.btn.alt{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--soft);border:1px dashed var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.eyebrow{font:700 12px var(--f-ui);letter-spacing:1.4px;text-transform:uppercase;color:var(--soft)}
h2{font:700 22px/1.2 var(--f-head);margin:0;text-wrap:balance}
h3{font:700 18px/1.25 var(--f-head);margin:0;text-wrap:balance}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.routes{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--tint);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--soft)}
.camp{position:relative;display:grid;grid-template-columns:86px 1fr;gap:14px}
.camp .alt{font:700 13px var(--f-mono);color:var(--soft);text-align:right;padding-top:20px;font-variant-numeric:tabular-nums}
.camp .alt b{display:block;font:700 15px var(--f-head);color:var(--ink);letter-spacing:.3px}
.camp .body{border-left:3px dotted var(--line);padding-left:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.camp.on .body{border-left-color:var(--blaze)}
.camp .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.bar{height:6px;background:var(--grid);border-radius:6px;overflow:hidden;width:140px}
.bar i{display:block;height:100%;background:var(--pine)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:72px;position:relative}
.tile .n{font:600 11px var(--f-mono);color:var(--soft)}
.tile b{font-size:15px;line-height:1.25}
.tile small{color:var(--soft);font-size:12.5px}
.tile.done{border-color:var(--pine)}
.tile.done::after{content:"";position:absolute;top:10px;right:10px;width:10px;height:10px;border-radius:50%;background:var(--pine)}
.tile.exam{background:var(--tint);border-style:dashed}
.stars{color:var(--gold);font-size:12px;letter-spacing:1px}
/* ---- scratch work drawer + calculator ---- */
.fab{position:fixed;right:18px;bottom:84px;z-index:60;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--paper);color:var(--ink);box-shadow:0 6px 16px rgba(19,32,46,.18)}
.fab.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.calc{position:fixed;right:18px;bottom:20px;z-index:61;width:52px;height:52px;border-radius:26px;background:var(--blaze);color:#111;box-shadow:0 8px 20px rgba(19,32,46,.25);overflow:hidden;transition:width .22s ease,height .22s ease,border-radius .22s ease}
.calc[hidden]{display:none}
.calc-dot{width:52px;height:52px;border:0;background:transparent;color:#111;display:grid;place-items:center;border-radius:50%}
.calc-body{display:none;padding:12px 14px 14px;flex-direction:column;gap:8px;height:100%}
.calc.open{width:272px;height:452px;border-radius:24px}
.calc.open .calc-dot{display:none}.calc.open .calc-body{display:flex}
.calc-top{display:flex;align-items:center;justify-content:space-between;font:700 13px var(--f-ui);letter-spacing:.6px;text-transform:uppercase}
.calc-x{border:0;background:transparent;color:#111;font-size:24px;line-height:1;width:34px;height:34px;border-radius:50%}
.calc-x:hover{background:rgba(0,0,0,.12)}
.calc-disp{background:rgba(255,255,255,.22);border-radius:14px;padding:8px 12px;text-align:right;min-height:68px}
.calc-ex{font:500 14px var(--f-mono);min-height:18px;word-break:break-all;opacity:.8}
.calc-out{font:700 26px var(--f-mono);word-break:break-all}
.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;flex:1}
.calc-keys button{border:0;background:transparent;color:#111;font:600 20px var(--f-ui);border-radius:50%;aspect-ratio:1;width:100%;max-width:52px;justify-self:center;transition:background .12s}
.calc-keys button:hover,.calc-keys button:focus-visible{background:rgba(0,0,0,.12);outline:none}
.calc-keys button:active{background:rgba(0,0,0,.2)}
.calc-keys .calc-eq{grid-column:1/-1;aspect-ratio:auto;max-width:none;height:42px;border-radius:21px;font-size:22px}
.calc-use{border:0;background:#111;color:var(--blaze);border-radius:12px;padding:8px;font:700 14px var(--f-ui)}
.scr{position:fixed;z-index:55;right:0;top:0;bottom:0;width:min(380px,40vw);background:var(--paper);border-left:1px solid var(--line);box-shadow:-10px 0 28px rgba(19,32,46,.12);display:flex;flex-direction:column;padding:12px 14px 14px;gap:10px}
.scr[hidden]{display:none}
.scr-hd{display:flex;align-items:center;gap:10px}.scr-hd b{flex:1;font-size:16px}
.scr-mode{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.scr-mode button,.scr-tools button{border:0;background:transparent;color:var(--ink);font:600 13px var(--f-ui);padding:6px 12px;border-radius:999px}
.scr-mode button[aria-pressed="true"],.scr-tools button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.scr-x{border:0;background:transparent;color:var(--ink);font-size:26px;width:36px;height:36px;border-radius:50%}
.scr-x:hover{background:var(--tint)}
.scr-q{font-size:14px;color:var(--ink);background:var(--tint);border-radius:12px;padding:8px 10px;max-height:28%;overflow:auto}
.scr-q .scr-lab{display:block;font:700 11px var(--f-ui);letter-spacing:.7px;text-transform:uppercase;color:var(--soft);margin-bottom:2px}
.scr-q svg{max-width:100%;height:auto}
.scr-draw{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0}
.scr-draw[hidden]{display:none}
.scr-draw canvas{flex:1;width:100%;min-height:0;border:1px solid var(--line);border-radius:12px;touch-action:none;cursor:crosshair;background:repeating-linear-gradient(var(--paper) 0 31px,var(--grid) 31px 32px)}
.scr-tools{display:flex;gap:4px;flex-wrap:wrap}
.scr-type{flex:1;width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:500 17px/32px var(--f-mono);color:var(--ink);background:repeating-linear-gradient(var(--paper) 0 31px,var(--grid) 31px 32px);background-attachment:local;resize:none}
body.scr-open .fab{right:calc(min(380px,40vw) + 18px)}
body.scr-open .calc{right:calc(min(380px,40vw) + 18px)}
body.scr-open .stage,body.scr-open .top{padding-right:min(380px,40vw)}
@media (max-width:760px){
  .scr{left:0;top:auto;width:auto;height:48vh;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -10px 28px rgba(19,32,46,.14)}
  body.scr-open .stage{padding-right:0;padding-bottom:48vh}body.scr-open .top{padding-right:0}
  body.scr-open .fab,body.scr-open .calc{right:14px;bottom:calc(48vh + 12px)}
  body.scr-open .calc{bottom:calc(48vh + 12px)}body.scr-open .fab{bottom:calc(48vh + 76px)}
  .fab{right:14px;bottom:78px}.calc{right:14px;bottom:16px}
  .calc.open{width:min(272px,calc(100vw - 28px));height:min(452px,calc(100vh - 100px))}
  body.scr-open .calc.open{bottom:16px}
}
/* ---- the winding trail map ---- */
.trail-map{position:relative;isolation:isolate;display:flex;flex-direction:column;gap:6px;padding:8px 0 30px}
.trail-map .road{position:absolute;left:0;top:0;z-index:1;pointer-events:none;overflow:visible}
.road path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.road .rsh path{stroke:rgba(19,32,46,.10)}
.road .rd path{stroke:color-mix(in srgb,var(--soft) 55%,var(--line))}
.road .rd path.dim{stroke:var(--line)}
.road .rdn path{stroke:var(--pine)}
.road .rcl path{stroke:var(--paper);stroke-width:2;stroke-dasharray:7 9;opacity:.9}
.region{position:relative;display:flex;flex-direction:column;gap:4px;padding:18px 0 22px}
.region::before{content:"";position:absolute;z-index:0;inset:0 -8px;border-radius:28px;background:repeating-radial-gradient(ellipse at var(--cx,20%) var(--cy,40%),transparent 0 22px,var(--topo) 22px 23.5px);opacity:.9;-webkit-mask:radial-gradient(closest-side,#000 45%,transparent);mask:radial-gradient(closest-side,#000 45%,transparent)}
.region.r0{--cx:18%;--cy:45%}.region.r1{--cx:82%;--cy:35%}.region.r2{--cx:50%;--cy:60%}
.region.off .stopcard,.region.off .campcard{opacity:.6}.region.off .stopcard:hover,.region.off .campcard:hover{opacity:1}.region.off .node{filter:saturate(.4)}
.stop{--x:var(--xd);position:relative;z-index:2;display:flex;align-items:center;min-height:84px}
.stop .node{position:absolute;left:calc(var(--x) * 100%);top:50%;transform:translate(-50%,-50%) scale(var(--s));width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--paper);color:var(--ink);border:3px solid var(--ink);font:700 15px var(--f-head);cursor:pointer;box-shadow:0 calc(var(--s) * 7px) calc(var(--s) * 12px) rgba(19,32,46,calc(var(--s) * .22)),0 0 0 5px var(--bg);transition:transform .15s}
.stop .node:hover{transform:translate(-50%,-50%) scale(calc(var(--s) * 1.1))}
.stop .node.did{background:var(--pine);border-color:var(--pine);color:#fff}
.stop .node.here{background:var(--blaze);border-color:var(--blaze);color:#fff}
.stop .node.here::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--blaze);opacity:.6;animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{transform:scale(.8);opacity:.7}100%{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.stop .node.here::after{animation:none}}
.stop .node.flag{border-radius:12px;background:var(--ink);border-color:var(--ink);color:var(--paper)}
.stop .node.flag.did{background:var(--pine);border-color:var(--pine)}
.stop .node.peak{width:58px;height:58px;border-radius:18px;background:var(--ink);border-color:var(--ink);color:var(--paper)}
.stop .node.peak.did{background:var(--pine);border-color:var(--pine)}
.stopcard,.campcard,.duo{width:min(330px,calc(var(--x) * 100% - 44px));box-shadow:0 2px 0 rgba(19,32,46,.04),0 calc(var(--s) * 6px) calc(var(--s) * 16px) rgba(19,32,46,calc(var(--s) * .08))}
.stop[data-side="l"] .stopcard,.stop[data-side="l"] .campcard,.stop[data-side="l"] .duo{margin-left:calc(var(--x) * 100% + 40px);width:min(330px,calc((1 - var(--x)) * 100% - 44px))}
.stop[data-side="r"] .stopcard,.stop[data-side="r"] .campcard,.stop[data-side="r"] .duo{margin-left:auto;margin-right:calc((1 - var(--x)) * 100% + 40px)}
.stop.camphd .campcard{width:min(440px,calc(var(--x) * 100% - 60px));background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:5px}
.stop.camphd[data-side="l"] .campcard{margin-left:calc(var(--x) * 100% + 50px);width:min(440px,calc((1 - var(--x)) * 100% - 60px))}
.stop.camphd[data-side="r"] .campcard{margin-right:calc((1 - var(--x)) * 100% + 50px)}
.region.on .campcard{border-color:var(--blaze);box-shadow:0 0 0 2px color-mix(in srgb,var(--blaze) 30%,transparent),0 8px 18px rgba(19,32,46,.08)}
.campcard .alt{font:700 19px var(--f-head);color:var(--ink);text-align:left;padding:0;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.campcard .alt span{font:700 12.5px var(--f-mono);color:var(--soft)}
.campcard h3{font:600 15px/1.35 var(--f-ui)}
.duo{display:flex;flex-direction:column;gap:6px;box-shadow:none}
.duo .stopcard{width:100%;margin:0!important}
.stopcard{min-height:0}
.stopcard.herecard{border-color:var(--blaze);border-width:2px}
.youare{position:absolute;top:-10px;right:12px;background:var(--blaze);color:#fff;font:700 11px var(--f-ui);letter-spacing:.6px;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.stopcard.done::after{display:none}
@media (max-width:620px){
  .stop{--x:var(--xp);min-height:80px}
  .stop .stopcard,.stop .campcard,.stop .duo,.stop[data-side] .stopcard,.stop[data-side] .campcard,.stop[data-side] .duo{margin-left:calc(var(--x) * 100% + 32px)!important;margin-right:0!important;width:calc((1 - var(--x)) * 100% - 34px)!important}
  .stop .node{width:34px;height:34px;font-size:14px}.stop .node.peak{width:48px;height:48px}
  .region::before{inset:0 -16px}
}
.trail{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.trail span{flex:1;min-width:28px;height:8px;border-radius:8px;background:var(--grid)}
.trail span.on{background:var(--blaze)}
.trail span.did{background:var(--pine)}
.lesson-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lesson-top h2{flex:1;min-width:200px}
.stage{display:flex;flex-direction:column;gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card .tag{font:700 12px var(--f-ui);letter-spacing:1.2px;text-transform:uppercase;color:var(--blaze)}
.q{font-size:19px;line-height:1.5}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{border:1.5px solid var(--line);background:var(--tint);border-radius:12px;padding:12px 14px;text-align:left;font-size:17px;min-height:54px}
.opt:hover:not(:disabled){border-color:var(--sky)}
.opt.right,.chipx.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--paper))}
.opt.wrong{border-color:var(--bad);opacity:.6}
.opt .gr{max-width:220px}
.fb{border-radius:12px;padding:12px 14px;background:var(--tint);font-size:16px}
.fb.good{border-left:4px solid var(--good)}
.fb.bad{border-left:4px solid var(--bad)}
.fb.re{border-left:4px solid var(--sky)}
.howbox{border:1px dashed var(--sky);border-radius:12px;padding:12px 14px;font-size:15.5px}
.steps{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.steps li{background:var(--tint);border-radius:10px;padding:8px 12px}
.inrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inrow input{flex:1;min-width:180px;font:18px var(--f-mono);padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
.kp{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tyas{min-height:1.4em;margin:6px 2px 8px;font-size:15px}.tyas .mono{font:600 17px var(--f-mono)}.tyas sup{font-size:.72em}
.kp button{min-width:44px;min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--tint);font:600 16px var(--f-mono)}
.mgrid{display:inline-grid;gap:8px;padding:6px 12px;border-left:3px solid var(--ink);border-right:3px solid var(--ink);border-radius:8px}
.mgrid input{width:70px;font:18px var(--f-mono);padding:8px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);text-align:center}
.pool,.built{display:flex;flex-direction:column;gap:8px}
.built{min-height:52px;padding:8px;border:2px dashed var(--line);border-radius:12px}
.ansrow:empty::before{content:"Tap tiles below to build your answer.";color:var(--soft);font-size:15px;padding:0 4px}
.built:empty::before{content:"Your steps will line up here.";color:var(--soft);font-size:15px;padding:6px 4px}
.work>.eyebrow{display:block;margin:22px 0 10px}.work>.eyebrow:first-child{margin-top:4px}
.stepbtn{text-align:left;border:1.5px solid var(--line);background:var(--tint);border-radius:12px;padding:10px 12px;font-size:16px}
.stepbtn.placed{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--paper));cursor:default}
.stepbtn.badline{border-color:var(--bad)}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.chipx{border:1.5px solid var(--line);background:var(--tint);border-radius:12px;padding:10px 12px;text-align:left;font-size:16px;min-height:48px}
.chipx.sel{border-color:var(--sky);box-shadow:0 0 0 3px color-mix(in srgb,var(--sky) 25%,transparent)}
.chipx.lock{border-color:var(--good);opacity:.75;cursor:default}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bin{border:2px dashed var(--line);border-radius:14px;padding:10px;min-height:90px;display:flex;flex-direction:column;gap:6px;background:transparent;text-align:left}
.bin h4{margin:0;font:700 14px var(--f-ui)}
.bin .chipx{font-size:14px;min-height:0;padding:6px 10px}
.cards{display:flex;flex-wrap:wrap;gap:8px}
.tiles2{display:flex;flex-wrap:wrap;gap:8px}
.tok{border:1.5px solid var(--line);background:var(--tint);border-radius:10px;padding:8px 12px;font-size:18px;min-height:46px}
.ansrow{display:flex;flex-wrap:wrap;gap:6px;min-height:52px;padding:8px;border:2px dashed var(--line);border-radius:12px;align-items:center}
.sl{display:grid;grid-template-columns:150px 1fr 50px;gap:10px;align-items:center}
.sl input{width:100%}
.sl output{font:700 16px var(--f-mono);text-align:right}
.readout{font-size:20px;text-align:center}

<script>
/* ===== ALGEBRA ASCENT core: random numbers, number helpers, math display, expression parser, answer checks, graphs.

var RNG = Math.random;

/* ---- fractions as [n, d] ---- */
function fr(n, d){ if (d === undefined) d = 1; if (d < 0){ n = -n; d = -d; } var g = gcd(n, d) || 1; return [n / g, d / g]; }

function fval(a){ return a[0] / a[1]; }
/* markup for a fraction value: 3, -2, \frac{3}{4}, -\frac{1}{2} */

function FP(a){ if (typeof a === 'number') return String(a); return a[1] === 1 ? String(a[0]) : a[0] + '/' + a[1]; }

/* ---- writing polynomials ---- */
/* term(c, v, p, first): one term with its sign. term(3,'x',2,true) -> '3x^2' ; term(-1,'x',1,false) -> ' - x' */
function term(c, v, p, first){
  if (c === 0) return '';

  var a = Math.abs(c);

  if (p === 0) body = String(a);
  else body = (a === 1 ? '' : String(a)) + v + (p === 1 ? '' : '^' + (String(p).length > 1 ? '{' + p + '}' : p));

/* poly([1,-5,6],'x') -> 'x^2 - 5x + 6' (coefficients from highest power down) */
function poly(cs, v){ v = v || 'x'; var n = cs.length - 1, s = '', first = true; for (var i = 0; i <= n; i++){ if (cs[i] === 0) continue; s += term(cs[i], v, n - i, first); first = false; } return s || '0'; }

/* (x + 3), (x - 2), (2x - 1) */

function sgn(n){ return n < 0 ? '- ' + Math.abs(n) : '+ ' + n; }
function pm(n){ return n < 0 ? '-' + Math.abs(n) : String(n); }
/* polynomial multiply */
function pmul(a, b){ var r = []; for (var i = 0; i < a.length + b.length - 1; i++) r.push(0); for (var i2 = 0; i2 < a.length; i2++) for (var j = 0; j < b.length; j++) r[i2 + j] += a[i2] * b[j]; return r; }

/* ===== MATH DISPLAY. Authors write $...$ inside text. Inside: ^{..} ^2 _{..} \frac{a}{b} \sqrt{a} \root{n}{a} \mat{1,2;3,4} \text{..}

    if (c === '!' && s[i + 1] === '='){ out += ' ≠ '; i += 2; continue; }

    if (c === '<'){ out += ' &lt; '; i++; continue; }

/* text with $math$ parts; **bold** in plain text */
function T(src){
  return String(src).split('$').map(function(part, k){
    if (k % 2) return '<span class="m">' + M(part) + '</span>';
    return esc(part).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  }).join('');

/* plain words for comparing and for logs */
function plain(src){ return String(src).replace(/\$/g, '').replace(/\\frac\{([^}]*)\}\{([^}]*)\}/g, '($1)/($2)').replace(/\\[a-zA-Z]+/g, '').replace(/[{}]/g, ''); }

/* ===== EXPRESSION PARSER for typed answers: numbers, letters, + - * / ^ ( ), sqrt ln log abs pi e, implicit times (2x, x(x+1), )( ). ===== */

var SK = [
/* ---------------- L10 Base Camp ---------------- */
{ id:'MATH.ALG.L10.01', t:'Clean Up the Mess', g:'like', srt:'like', peg:{ n:'Same Letter, Same Power', l:'Distribute to everyone inside. Only like terms (same letter, same power) can hold hands.' },
  hook:{ q:'Which is the same as $2(x + 3)$?', o:['$2x + 6$', '$2x + 3$', '$x + 6$'], why:'The 2 multiplies BOTH terms inside: $2x + 6$.' },
  mv:[['Most of algebra is cleaning up. Two moves do almost all of it.', '$3(x + 4) - 2x + 5$'], ['Move one: distribute. The 3 outside multiplies everyone inside, the x and the 4.', '$3 \\cdot x + 3 \\cdot 4 = 3x + 12$'],
    { p:'What is $3(x + 4)$?', o:['$3x + 12$', '$3x + 4$', '$x + 12$'], fb:'The 3 multiplies BOTH: 3 times x, and 3 times 4.' },
    ['Move two: combine like terms. Same letter, same power: they hold hands.', '$3x - 2x = x$, and $12 + 5 = 17$'], ['So the whole mess is just x plus 17.', '$3(x + 4) - 2x + 5 = x + 17$'], ['Careful: x and x squared are not like terms. Different powers never combine.', '$x + x^2$ stays $x + x^2$']],
  rt:['Picture it: $3(x + 4)$ is three bags, each holding one x and 4 marbles. Count: 3 x\'s and 12 marbles.', 'Story: Ezra buys 3 school kits, each with 1 notebook and 4 pens. He walks out with 3 notebooks and 12 pens. Notebooks and pens never mix.'],
  sheet:['$a(b + c) = ab + ac$', 'Like terms: same letter AND same power', '$3x + 5x = 8x$, but $x + x^2$ does not combine'] },
{ id:'MATH.ALG.L10.02', t:'Balance Both Sides', g:'lin', peg:{ n:'Both Sides, Same Move', l:'An equation is a balanced scale. Whatever you do to one side, do to the other.' },
  hook:{ q:'On Saba Yosef\'s old scale, 3 bags plus 2 weights balance 1 bag plus 10 weights. How much is one bag?', o:['4', '3', '6'], why:'$3x + 2 = x + 10$, so $2x = 8$ and $x = 4$.' },
  mv:[['An equation is a balanced scale. Whatever you do to one side, you do to the other.', '$3x + 2 = x + 10$'], ['First gather the x terms. Take one x off both sides.', '$2x + 2 = 10$'],
    { p:'What is the next move?', o:['Subtract 2 from both sides', 'Divide only the left side by 2', 'Add 2 to both sides'], fb:'Undo the plus 2 first: subtract 2 from both sides.' },
    ['Subtract 2 from both sides.', '$2x = 8$'], ['Divide both sides by 2.', '$x = 4$'], ['Always check. 3 times 4 plus 2 is 14. 4 plus 10 is 14. Balanced.', '$3(4) + 2 = 14 = 4 + 10$'], ['Fractions? Multiply every term by the bottom number first. The fraction buster.', '$\\frac{x}{3} + 1 = 5 \\to x + 3 = 15$']],
  rt:['Picture it: draw the scale. Take the same blocks off each pan until the bag is alone.', 'Story: Rivka and Chaim have equal piles of seforim. If Rivka gives away 2, Chaim gives away 2, and the piles are still equal.'],
  sheet:['Both sides, same move', 'x-terms to one side, numbers to the other', 'Fractions: multiply every term by the LCD', 'Check by putting the answer back in'] },
{ id:'MATH.ALG.L10.03', t:'Formula Surgery', g:'lit', peg:{ n:'Everyone Else Is a Number', l:'To solve a formula for one letter, treat every other letter like a number and undo, outside first.' },
  hook:{ q:'$A = lw$. A room has area 48 and length 8. What is the width?', o:['6', '40', '384'], why:'$w = \\frac{A}{l} = \\frac{48}{8} = 6$.' },
  mv:[['Formulas are equations with many letters. You can solve for any one of them.', '$P = 2l + 2w$'], ['Pretend the other letters are just numbers. We want l alone.', 'solve for $l$'], ['First undo the plus 2w. Subtract 2w from both sides.', '$P - 2w = 2l$'],
    { p:'Now $l$ is multiplied by 2. How do we undo that?', o:['Divide both sides by 2', 'Subtract 2 from both sides', 'Multiply both sides by 2'], fb:'Times is undone by divide.' },
    ['Divide both sides by 2.', '$l = \\frac{P - 2w}{2}$'], ['Same moves as with numbers. The letters just come along for the ride.', '$y = mx + b \\to x = \\frac{y - b}{m}$']],
  rt:['Picture it: cover the letter you want with your thumb. Peel off the layers around it, the outermost layer first.', 'Story: Moshe knows the sukkah fence is 30 feet around and 6 feet wide. 30 minus 12 is 18, so 2l = 18 and l = 9. The same steps work with letters.'],
  sheet:['Treat the other letters like numbers', 'Undo in reverse order (outside first)', '$A = lw \\Rightarrow w = \\frac{A}{l}$'] },
{ id:'MATH.ALG.L10.04', t:'The Flipping Alligator', g:'ineq', srt:'ineq', peg:{ n:'Negative Flips the Gator', l:'Solve like an equation, but multiplying or dividing by a negative flips the inequality.' },
  hook:{ q:'$3 < 5$ is true. Is $-3 < -5$ true?', o:['No: $-3 > -5$', 'Yes', 'You cannot tell'], why:'On the number line $-3$ is to the RIGHT of $-5$, so $-3 > -5$. Negatives reverse the order.' },
  mv:[['Inequalities solve just like equations, with one twist.', '$-2x + 4 < 10$'], ['Subtract 4 from both sides.', '$-2x < 6$'], ['Now divide by negative 2. Dividing by a negative flips the sign.', '$x > -3$'],
    { p:'Why does the sign flip?', o:['Negatives reverse the order: $3 < 5$ but $-3 > -5$', 'Because we divided', 'It always flips at the end'], fb:'Multiplying by a negative mirrors the number line, so the order reverses.' },
    ['On the number line: an open dot at negative 3, shaded to the right.', function(){ return NL(-3, '>'); }], ['Less than or equal uses a filled dot. Strict less than uses an open dot.', '$\\le$: filled dot, $<$: open dot']],
  rt:['Picture it: on a number line, multiplying by $-1$ mirrors everything around 0. What was on the left lands on the right, so the arrow turns.', 'Story: Nissim is taller than Rafael. Measure them going DOWN into a valley instead: now Rafael\'s number is bigger. Negatives reverse the order.'],
  sheet:['Solve like an equation', 'Multiply or divide by a negative: FLIP the sign', '$<, >$: open dot. $\\le, \\ge$: filled dot'] },
{ id:'MATH.ALG.L10.05', t:'Rise Before You Run', g:'slope', sld:'slope', peg:{ n:'Rise Over Run', l:'Slope = rise over run = change in y over change in x. In $y = mx + b$, m is how you Move, b is where you Begin.' },
  hook:{ q:'A ramp climbs 2 feet over 8 feet of ground. How steep is it?', o:['$\\frac{1}{4}$', '$4$', '$6$'], why:'Rise over run: $\\frac{2}{8} = \\frac{1}{4}$.' },
  mv:[['Slope measures steepness: how much you go up for each step across.', function(){ return G({ f:['0.5*x+1.5'], pts:[[1, 2, '(1, 2)'], [5, 4, '(5, 4)']], xr:[-2, 7], yr:[-1, 6] }); }], ['Rise is the change in y. Run is the change in x. You rise before you run, like getting out of bed.', '$m = \\frac{rise}{run} = \\frac{y_2 - y_1}{x_2 - x_1}$'],
    ['From the point 1, 2 to the point 5, 4: rise is 4 minus 2, which is 2. Run is 5 minus 1, which is 4.', '$m = \\frac{4 - 2}{5 - 1} = \\frac{2}{4} = \\frac{1}{2}$'],
    { p:'A line goes DOWN as you move right. Its slope is...', o:['negative', 'positive', 'zero'], fb:'Going down while moving right means the rise is negative.' },
    ['In y equals m x plus b: m is how you Move, b is where you Begin on the y axis.', '$y = mx + b$'], ['Flat lines have slope zero. Vertical lines have no slope at all: you cannot divide by a run of zero.', '$y = 3$: $m = 0$. $x = 2$: undefined']],
  rt:['Picture it: draw a staircase between the two points. Count the steps up (rise), then the steps across (run).', 'Story: Akiva walks to shul up a hill. For every 4 meters forward he climbs 1 meter. The slope of his walk is $\\frac{1}{4}$.'],
  sheet:['$m = \\frac{y_2 - y_1}{x_2 - x_1}$', '$y = mx + b$: m = slope, b = y-intercept', 'Horizontal: $m = 0$. Vertical: undefined'] },
{ id:'MATH.ALG.L10.06', t:'Twins and Crossroads', g:'lines', peg:{ n:'Flip and Switch', l:'Parallel lines: same slope. Perpendicular lines: flip the slope and switch its sign.' },
  hook:{ q:'Two train rails never meet. Their slopes are...', o:['the same', 'opposite signs', 'flipped'], why:'Lines that never meet climb at exactly the same rate.' },
  mv:[['Parallel lines never meet, so they climb at exactly the same rate. Same slope.', function(){ return G({ f:['2*x-3', '2*x+1'], xr:[-4, 4], yr:[-5, 5] }); }], ['Perpendicular lines cross at a right angle. Their slopes flip and switch sign.', '$2 \\to -\\frac{1}{2}$'],
    { p:'What slope is perpendicular to slope 3?', o:['$-\\frac{1}{3}$', '$\\frac{1}{3}$', '$-3$'], fb:'Flip 3 to $\\frac{1}{3}$, then switch the sign.' },
    ['Point-slope form builds a line from one point and a slope.', '$y - y_1 = m(x - x_1)$'], ['Through the point 2, 1 with slope negative one half.', '$y - 1 = -\\frac{1}{2}(x - 2)$'], ['Solve for y.', '$y = -\\frac{1}{2}x + 2$']],
  rt:['Picture it: lay a ruler at slope 2, then put the corner of a sheet of paper on it. The other edge has slope $-\\frac{1}{2}$.', 'Story: Dovid walks along one street; Bracha crosses it at a square corner. Their streets are perpendicular, so the slopes multiply to $-1$.'],
  sheet:['Parallel: $m_1 = m_2$', 'Perpendicular: $m_1 m_2 = -1$ (flip and switch)', 'Point-slope: $y - y_1 = m(x - x_1)$'] },
{ id:'MATH.ALG.L10.07', t:'Make It Vanish', g:'sys', peg:{ n:'Make a Zero Pair', l:'Add or subtract the equations so one variable cancels. Solve, then substitute back.' },
  hook:{ q:'At the bakery, 2 challahs and a cake cost 22 dollars. 1 challah and a cake cost 15 dollars. How much is one challah?', o:['7', '8', '5'], why:'Subtract the two orders: the cake cancels, and 1 challah = 22 - 15 = 7.' },
  mv:[['A system is two equations that are both true at once. The answer is the point where the lines cross.', function(){ return G({ f:['10-x', 'x-2'], pts:[[6, 4, '(6, 4)']], xr:[-1, 11], yr:[-3, 11] }); }], ['Elimination: add or subtract the equations so one variable vanishes.', '$x + y = 10$ and $x - y = 2$'],
    ['Add them. The y terms cancel.', '$2x = 12$, so $x = 6$'], { p:'Now find y.', o:['4', '6', '2'], fb:'Put $x = 6$ into $x + y = 10$: $y = 4$.' },
    ['Substitute back: y is 4. The answer is the point 6, 4.', '$(6, 4)$'], ['Parallel lines never cross: no solution. The same line twice: infinitely many.', 'no solution, or infinitely many']],
  rt:['Picture it: graph both lines. The crossing point is the one pair of numbers that works in both.', 'Story: Mendy and Yehuda each bought snacks. Comparing the two receipts, the items they both bought cancel out, and what is left tells you one price.'],
  sheet:['Elimination: add or subtract to cancel a variable', 'Substitution: solve one equation for a letter, plug it in', 'Answer is an ordered pair: check it in BOTH'] },
{ id:'MATH.ALG.L10.08', t:'Exponent Power Moves', g:'expo', srt:'expo', peg:{ n:'Multiply Adds, Power Multiplies', l:'Same base: multiplying adds exponents, dividing subtracts them, a power of a power multiplies them.' },
  hook:{ q:'Is $2^3 \\cdot 2^4$ equal to $2^7$ or $2^{12}$?', o:['$2^7$', '$2^{12}$', '$4^7$'], why:'Three 2s times four more 2s is seven 2s: $2^7$.' },
  mv:[['An exponent counts how many times you multiply.', '$x^3 = x \\cdot x \\cdot x$'], ['x cubed times x squared is three x\'s times two more: five in all. Multiplying adds the exponents.', '$x^3 \\cdot x^2 = x^5$'],
    { p:'$(x^3)^2 = ?$', o:['$x^6$', '$x^5$', '$x^9$'], fb:'Two copies of $x^3$: 3 + 3 = 6. A power of a power multiplies.' },
    ['Dividing cancels: x to the seventh over x squared leaves x to the fifth. Dividing subtracts.', '$\\frac{x^7}{x^2} = x^5$'], ['Anything to the zero power is 1. A negative exponent means one over.', '$x^0 = 1$, $x^{-2} = \\frac{1}{x^2}$'], ['The outside power hits everything inside, numbers too.', '$(3x^2)^2 = 9x^4$']],
  rt:['Picture it: write every x out in a row, then count them, or cancel top against bottom.', 'Story: Chana stacks 3 crates, then 2 more crates: 5 crates. If she builds the same 3-crate tower twice, she has 3 + 3 = 6.'],
  sheet:['$x^a x^b = x^{a+b}$', '$(x^a)^b = x^{ab}$', '$\\frac{x^a}{x^b} = x^{a-b}$', '$x^0 = 1$, $x^{-n} = \\frac{1}{x^n}$'] },
{ id:'MATH.ALG.L10.09', t:'The Box Never Lies', g:'pmul', peg:{ n:'Every Term Meets Every Term', l:'Multiply every term in the first by every term in the second (the box, or FOIL), then combine.' },
  hook:{ q:'Is $(x + 3)(x + 2)$ equal to $x^2 + 6$?', o:['No, it is $x^2 + 5x + 6$', 'Yes', 'No, it is $x^2 + 6x + 5$'], why:'The middle terms $3x + 2x = 5x$ are the part people forget.' },
  mv:[['To multiply two binomials, every term in the first meets every term in the second.', '$(x + 3)(x + 2)$'], ['Draw a box: x and 3 across the top, x and 2 down the side.', function(){ return T(BOX(['x', '3'], ['x', '2'], ['?', '?', '?', '?'])); }],
    ['Fill each cell by multiplying its row and column.', function(){ return T(BOX(['x', '3'], ['x', '2'], ['x^2', '3x', '2x', '6'])); }],
    { p:'Add the cells. What is the middle term?', o:['$5x$', '$6x$', '$x$'], fb:'$3x + 2x = 5x$.' },
    ['So the answer is x squared plus 5x plus 6.', '$x^2 + 5x + 6$'], ['FOIL is the same box: First, Outer, Inner, Last.', 'First, Outer, Inner, Last']],
  rt:['Picture it: a rectangle x + 3 wide and x + 2 tall. Its area is the four pieces added up.', 'Story: Shmuel invites 2 friends and Avraham invites 3. If every one of Shmuel\'s group shakes hands with every one of Avraham\'s, count every pair.'],
  sheet:['Box / FOIL: every term times every term', '$(a + b)^2 = a^2 + 2ab + b^2$ (never just $a^2 + b^2$)', '$(a + b)(a - b) = a^2 - b^2$'] },
{ id:'MATH.ALG.L10.10', t:'Product-Sum Detective', g:'fact', peg:{ n:'Multiply to c, Add to b', l:'Common factor first. For $x^2 + bx + c$, find two numbers that multiply to c and add to b.' },
  hook:{ q:'Which two numbers multiply to 12 and add to 7?', o:['3 and 4', '2 and 6', '1 and 12'], why:'$3 \\cdot 4 = 12$ and $3 + 4 = 7$.' },
  mv:[['Factoring is multiplying backwards: find the box from the total.', '$x^2 + 7x + 12 = (x + ?)(x + ?)$'], ['Find two numbers that multiply to 12 and add to 7. The product-sum detective.', 'product 12, sum 7'],
    { p:'Which pair works?', o:['3 and 4', '2 and 6', '12 and 1'], fb:'$3 \\cdot 4 = 12$ and $3 + 4 = 7$.' },
    ['So it factors as x plus 3 times x plus 4.', '$(x + 3)(x + 4)$'], ['Always pull out a common factor first.', '$2x^2 + 14x + 24 = 2(x^2 + 7x + 12)$'], ['Difference of squares: a squared minus b squared splits into a minus b times a plus b.', '$x^2 - 25 = (x - 5)(x + 5)$']],
  rt:['Picture it: draw the 2-by-2 box with $x^2$ and 12 in the corners. The other two cells must add to $7x$.', 'Story: Yisroel knows the area of the rug and how long its edges add up to. Which two side lengths fit both clues?'],
  sheet:['Greatest common factor first', '$x^2 + bx + c$: product c, sum b', '$a^2 - b^2 = (a - b)(a + b)$', 'Check by multiplying back'] },

/* ---------------- L11 Camp I ---------------- */
{ id:'MATH.ALG.L11.01', t:'The Vending Machine', g:'func', srt:'func', peg:{ n:'One Button, One Snack', l:'A function gives exactly one output for each input. The domain is the doorway: every input allowed.' },
  hook:{ q:'You press button B4 and get a pretzel AND a soda. Is that machine a function?', o:['No: one input gave two outputs', 'Yes', 'Only if they cost the same'], why:'A function must give exactly one output per input.' },
  mv:[['A function is a machine. Each input gives exactly one output.', '$f(x) = 2x + 1$'], ['f of 3 means: put 3 in for x. 2 times 3 plus 1 is 7.', '$f(3) = 7$'],
    { p:'$f(x) = x^2$. What is $f(-4)$?', o:['$16$', '$-16$', '$-8$'], fb:'$(-4)(-4) = 16$. Always use parentheses when you plug in.' },
    ['The domain is the doorway: every input allowed. The range is everything that comes out.', 'Domain = in. Range = out.'], ['Two things block the doorway: dividing by zero, and square roots of negatives.', '$\\frac{1}{x - 2}$: $x \\ne 2$. $\\sqrt{x - 3}$: $x \\ge 3$.'],
    ['On a graph, use the vertical line test. If a vertical line hits twice, it is not a function.', function(){ return G({ f:['x^2-2'], vx:[1], xr:[-4, 4], yr:[-3, 5] }); }]],
  rt:['Picture it: a table with an input column and an output column. If any input appears twice with different outputs, it fails.', 'Story: Tova\'s seating chart gives each guest exactly one seat. That is a function from guests to seats. A guest with two seats breaks it.'],
  sheet:['$f(a)$: replace every x with (a)', 'Domain: no zero denominators, no negatives under even roots', 'Vertical line test'] },
{ id:'MATH.ALG.L11.02', t:'Zero Is a Magic Number', g:'qfac', peg:{ n:'Someone Is Zero', l:'If a product is zero, one of its factors is zero. Get 0 on one side, factor, set each factor to 0.' },
  hook:{ q:'$a \\cdot b = 0$ and $a = 5$. What is $b$?', o:['0', '5', 'Anything'], why:'5 times something is 0 only if that something is 0.' },
  mv:[['Here is the most useful fact in algebra. If a product is zero, one of the factors must be zero.', '$ab = 0 \\Rightarrow a = 0$ or $b = 0$'], ['So to solve x squared minus x minus 6 equals 0, factor first.', '$(x - 3)(x + 2) = 0$'],
    { p:'So $x = ?$', o:['$3$ or $-2$', '$-3$ or $2$', '$6$'], fb:'$x - 3 = 0$ gives 3; $x + 2 = 0$ gives $-2$.' },
    ['Each factor gives a root: where the parabola crosses the x axis.', function(){ return G({ f:['x^2-x-6'], pts:[[3, 0, '3'], [-2, 0, '-2']], xr:[-4, 5], yr:[-7, 5] }); }], ['Warning: get zero on one side first. Never set factors equal to 6.', '$x^2 - x = 6 \\to x^2 - x - 6 = 0$']],
  rt:['Picture it: the roots are exactly where the parabola touches the x axis, where its height is zero.', 'Story: Zalman multiplies two secret numbers and gets 0. Without knowing anything else, you know one of them is 0.'],
  sheet:['Set = 0, factor, set each factor = 0', 'Roots are the x-intercepts', 'Never divide by x (you lose a root)'] },
{ id:'MATH.ALG.L11.03', t:'Half It, Square It', g:'csq', peg:{ n:'Half It, Square It, Add It', l:'For $x^2 + bx$: take half of b, square it, add it AND take it away.' },
  hook:{ q:'Which one is a perfect square?', o:['$x^2 + 6x + 9$', '$x^2 + 6x + 6$', '$x^2 + 9$'], why:'$x^2 + 6x + 9 = (x + 3)^2$.' },
  mv:[['Some quadratics are perfect squares in disguise.', '$x^2 + 6x + 9 = (x + 3)^2$'], ['The trick: half the middle number, then square it. Half of 6 is 3. 3 squared is 9.', '$\\frac{6}{2} = 3$, $3^2 = 9$'],
    ['For x squared plus 6x plus 2, add 9 and take 9 away, so nothing changes.', '$x^2 + 6x + 9 - 9 + 2$'], { p:'Group it: $(x + 3)^2 + ?$', o:['$-7$', '$11$', '$2$'], fb:'$-9 + 2 = -7$.' },
    ['So it is x plus 3, squared, minus 7. The vertex is at negative 3, negative 7.', '$(x + 3)^2 - 7$'], ['This exact trick, done with letters, gives the quadratic formula.', 'completing the square builds the formula']],
  rt:['Picture it: $x^2 + 6x$ is a square with two 3-wide strips. The missing corner is a 3-by-3 square: 9.', 'Story: Meir has 9 tiles short of a full square patio. He borrows 9 tiles, builds the square, then remembers he owes 9 back.'],
  sheet:['$x^2 + bx$: add $(\\frac{b}{2})^2$', 'Add AND subtract it (or add to both sides)', 'Vertex form: $a(x - h)^2 + k$'] },
{ id:'MATH.ALG.L11.04', t:'The Formula Song', g:'qform', srt:'qform', peg:{ n:'Sing the Formula', l:'Negative b, plus or minus the root, of b squared minus 4ac, all over 2a. The discriminant decides how many roots.' },
  hook:{ q:'Can every quadratic be factored with whole numbers?', o:['No', 'Yes', 'Only when $a = 1$'], why:'Most cannot. The quadratic formula always works.' },
  mv:[['When factoring fails, the quadratic formula always works.', '$x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}$'], ['Sing it: x equals negative b, plus or minus the square root, of b squared minus 4 a c, all over 2 a.', 'negative b, plus or minus the root, b squared minus 4ac, over 2a'],
    ['For 2 x squared plus 3x minus 2: a is 2, b is 3, c is negative 2.', '$a = 2$, $b = 3$, $c = -2$'], { p:'$b^2 - 4ac = ?$', o:['$25$', '$-7$', '$1$'], fb:'$9 - 4(2)(-2) = 9 + 16 = 25$.' },
    ['The root of 25 is 5. Negative 3 plus or minus 5, over 4: one half, or negative 2.', '$x = \\frac{-3 \\pm 5}{4} = \\frac{1}{2}, -2$'], ['The discriminant is the bouncer. Positive: two real roots. Zero: one. Negative: none that are real.', '$b^2 - 4ac$: positive 2, zero 1, negative 0']],
  rt:['Picture it: the discriminant tells whether the parabola crosses the x axis twice, touches it once, or misses it.', 'Story: Netanel tried for ten minutes to factor $3x^2 + 7x - 5$. The formula finished it in thirty seconds.'],
  sheet:['$x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}$', 'Discriminant $b^2 - 4ac$: +, 0, -', 'Standard form first: $ax^2 + bx + c = 0$'] },
{ id:'MATH.ALG.L11.05', t:'The Vertex Address', g:'vert', sld:'vert', peg:{ n:'Minus b over 2a', l:'The vertex of $ax^2 + bx + c$ sits at $x = -\\frac{b}{2a}$. In vertex form $a(x - h)^2 + k$, it is $(h, k)$.' },
  hook:{ q:'A ball is thrown up. Its highest point on the graph is called the...', o:['vertex', 'root', 'y-intercept'], why:'The top (or bottom) turning point of a parabola is the vertex.' },
  mv:[['Every parabola has a turning point, the vertex.', function(){ return G({ f:['-(x-1)^2+4'], pts:[[1, 4, 'vertex']], xr:[-3, 5], yr:[-3, 6] }); }], ['Its x coordinate has a home address: negative b over 2a.', '$x = -\\frac{b}{2a}$'],
    { p:'For $y = x^2 - 6x + 1$, the vertex x is...', o:['$3$', '$-3$', '$6$'], fb:'$-\\frac{-6}{2(1)} = 3$.' },
    ['Plug it back in for y. 9 minus 18 plus 1 is negative 8. Vertex: 3, negative 8.', '$(3, -8)$'], ['Vertex form shows it at a glance: h and k.', '$y = a(x - h)^2 + k$'], ['If a is positive the parabola opens up, a minimum. If a is negative, it opens down, a maximum.', '$a > 0$: smile. $a < 0$: frown.']],
  rt:['Picture it: the vertex sits on the line of symmetry, exactly halfway between the two roots.', 'Story: Gavriel kicks a ball. Halfway along its flight it is at its highest. That halfway point is $-\\frac{b}{2a}$.'],
  sheet:['Vertex x: $-\\frac{b}{2a}$, then plug in for y', '$y = a(x - h)^2 + k$: vertex $(h, k)$', '$a > 0$ opens up (minimum). $a < 0$ opens down (maximum)'] },
{ id:'MATH.ALG.L11.06', t:'Roots Live Underground', g:'rad', peg:{ n:'Power Over Root', l:'In $x^{m/n}$ the bottom n is the root (roots live underground) and the top m is the power.' },
  hook:{ q:'What is $9^{1/2}$?', o:['3', '4.5', '81'], why:'Power one half means square root: $\\sqrt{9} = 3$.' },
  mv:[['A fraction exponent hides a root.', '$x^{1/2} = \\sqrt{x}$'], ['The bottom of the fraction is the root. Roots live underground. The top is the power.', '$x^{m/n} = (\\root{n}{x})^m$'],
    ['8 to the two thirds: the cube root of 8 is 2. Then square it: 4.', '$8^{2/3} = (\\root{3}{8})^2 = 2^2 = 4$'], { p:'$27^{1/3} = ?$', o:['$3$', '$9$', '$81$'], fb:'The cube root of 27 is 3.' },
    ['To simplify a square root, pull out the biggest perfect square.', '$\\sqrt{50} = \\sqrt{25}\\sqrt{2} = 5\\sqrt{2}$'], ['A negative exponent still means one over.', '$16^{-1/2} = \\frac{1}{4}$']],
  rt:['Picture it: a square with area 50 sits between areas 49 and 64, so its side is a little more than 7. Check: $5\\sqrt{2} \\approx 7.07$.', 'Story: Ovadia\'s cube box holds 8 small cubes. Each edge is $\\root{3}{8} = 2$ cubes long. Two thirds power: the area of one face, 4.'],
  sheet:['$x^{m/n} = (\\root{n}{x})^m$', '$\\sqrt{ab} = \\sqrt{a}\\sqrt{b}$', 'Simplify: pull out the biggest perfect square', '$x^{-n} = \\frac{1}{x^n}$'] },
{ id:'MATH.ALG.L11.07', t:'The Imaginary Unit', g:'cplx', srt:'cplx', peg:{ n:'i Squared Is Negative One', l:'$i^2 = -1$. Powers of i cycle every 4: $i, -1, -i, 1$.' },
  hook:{ q:'What real number, times itself, gives $-1$?', o:['None: so mathematicians invented $i$', '$-1$', '$1$'], why:'$(-1)(-1) = 1$, not $-1$. No real number works, so we define $i$ with $i^2 = -1$.' },
  mv:[['No real number squares to negative one. So we invent one, and call it i.', '$i^2 = -1$'], ['Complex numbers are a plus b i: a real part and an imaginary part.', '$3 + 4i$'],
    ['Add them part by part, like terms.', '$(3 + 4i) + (1 - 2i) = 4 + 2i$'], { p:'$(2i)(3i) = ?$', o:['$-6$', '$6$', '$6i$'], fb:'$6i^2 = 6(-1) = -6$.' },
    ['Multiply with FOIL, then swap i squared for negative one.', '$(1 + i)(1 - i) = 1 - i^2 = 2$'], ['Powers of i repeat every four: i, negative one, negative i, one.', '$i^1 = i,\\ i^2 = -1,\\ i^3 = -i,\\ i^4 = 1$']],
  rt:['Picture it: multiplying by $i$ turns a point a quarter turn around 0. Four quarter turns bring it home: $i^4 = 1$.', 'Story: Binyamin treats $i$ just like the letter x, then remembers one rule: every $i^2$ becomes $-1$.'],
  sheet:['$i^2 = -1$', 'Powers cycle every 4: $i, -1, -i, 1$', '$(a + bi)(a - bi) = a^2 + b^2$'] },
{ id:'MATH.ALG.L11.08', t:'Distance from Zero', g:'absv', srt:'absv', peg:{ n:'Less thAND, GreatOR', l:'$|x - a| < b$: between (AND). $|x - a| > b$: outside (OR). $= b$: two answers.' },
  hook:{ q:'How many numbers are exactly 3 away from 0?', o:['2', '1', 'Infinitely many'], why:'3 and $-3$.' },
  mv:[['Absolute value is distance from zero. Distance is never negative.', '$|-5| = 5$'], ['x minus 2, absolute value, equals 5: the numbers 5 away from 2.', '$|x - 2| = 5 \\Rightarrow x = 7$ or $x = -3$'],
    { p:'$|x| < 3$ means x is...', o:['between $-3$ and 3', 'outside $-3$ and 3', 'exactly 3'], fb:'Close to 0: within 3 on either side.' },
    ['Less than: close in, an AND. Less thAND.', '$|x - 2| < 5 \\Rightarrow -3 < x < 7$'], ['Greater than: far out, an OR. GreatOR.', '$|x - 2| > 5 \\Rightarrow x < -3$ or $x > 7$']],
  rt:['Picture it: stand at the center on a number line. "Less than 5 away" is a band around you; "more than 5 away" is the two ends.', 'Story: Shlomo\'s yeshiva bus stops if you live less than 2 miles from the school. That is everyone inside a circle around it.'],
  sheet:['$|x| = b$: $x = b$ or $x = -b$', '$|x - a| < b$: $a - b < x < a + b$ (AND)', '$|x - a| > b$: outside the band (OR)'] },

/* ---------------- L12 Camp II ---------------- */
{ id:'MATH.ALG.L12.01', t:'Synthetic Shortcut', g:'synd', peg:{ n:'Bring Down, Multiply, Add', l:'Dividing by $x - c$: use c. Bring down, multiply by c, add, repeat. The last number is the remainder.' },
  hook:{ q:'To divide by $x - 2$ with synthetic division, which number goes in the box?', o:['$2$', '$-2$', '$x$'], why:'Use the number that makes $x - 2$ zero: 2.' },
  mv:[['Polynomial long division has a ten-second shortcut: synthetic division.', '$(x^3 - 2x^2 - 5x + 6) \\div (x - 3)$'], ['Write 3, the root of x minus 3, and the coefficients 1, negative 2, negative 5, 6.', '$3 \\mid 1,\\ -2,\\ -5,\\ 6$'],
    ['Bring down the 1. Multiply by 3, add to negative 2: that is 1. Multiply by 3, add to negative 5: negative 2.', '$1,\\ 1,\\ -2$'], { p:'Last step: $-2 \\cdot 3 + 6 = ?$', o:['$0$', '$12$', '$-12$'], fb:'$-6 + 6 = 0$: the remainder is 0.' },
    ['Remainder zero, so x minus 3 is a factor. The quotient is x squared plus x minus 2.', '$x^2 + x - 2$'], ['Missing powers need a zero placeholder.', '$x^3 + 1 \\to 1, 0, 0, 1$']],
  rt:['Picture it: each column is one power of x. Multiplying by c and adding is the long division, just without writing the x\'s.', 'Story: Eliyahu checks if $x - 3$ divides the polynomial. Ten seconds of bring down, multiply, add, and the 0 at the end says yes.'],
  sheet:['Divide by $x - c$: use $c$', 'Bring down, multiply, add, repeat', 'Zero placeholders for missing powers', 'Last number = remainder'] },
{ id:'MATH.ALG.L12.02', t:'Plug and Know', g:'remt', srt:'remt', peg:{ n:'Plug In c', l:'The remainder of $p(x) \\div (x - c)$ is $p(c)$. If $p(c) = 0$, then $x - c$ is a factor.' },
  hook:{ q:'$p(2) = 0$. Is $x - 2$ a factor of $p(x)$?', o:['Yes', 'No', 'Only if p is quadratic'], why:'Factor Theorem: $p(c) = 0$ exactly when $x - c$ is a factor.' },
  mv:[['Want the remainder without dividing? Just plug in.', 'remainder of $p(x) \\div (x - c)$ is $p(c)$'], ['p of x is x cubed minus 4x plus 1. Divide by x minus 2: plug in 2.', '$p(2) = 8 - 8 + 1 = 1$'],
    { p:'So the remainder is...', o:['$1$', '$0$', '$-1$'], fb:'$p(2) = 1$, so the remainder is 1.' },
    ['If the remainder is zero, x minus c is a factor. That is the Factor Theorem.', '$p(c) = 0 \\iff (x - c)$ is a factor'], ['Watch the sign: x plus 3 means plug in negative 3.', '$x + 3 = x - (-3)$']],
  rt:['Picture it: $p(c)$ is the height of the graph at $x = c$. Height 0 means the graph crosses there: a root, so a factor.', 'Story: Rafael needs to know if a number divides evenly. Instead of long division, he plugs in once.'],
  sheet:['Remainder Theorem: remainder = $p(c)$', 'Factor Theorem: $p(c) = 0 \\iff (x - c)$ is a factor', '$x + 3$: use $c = -3$'] },
{ id:'MATH.ALG.L12.03', t:'Root Suspects', g:'rrt', peg:{ n:'p over q', l:'Possible rational roots are $\\pm\\frac{p}{q}$: p divides the constant, q divides the leading coefficient.' },
  hook:{ q:'Which could be a root of $2x^3 + x^2 - 4x + 3$?', o:['$\\frac{3}{2}$', '$\\frac{2}{3}$', '$5$'], why:'$\\pm\\frac{p}{q}$: $p$ divides 3, $q$ divides 2. $\\frac{3}{2}$ is on the list.' },
  mv:[['Cubics are hard to factor. The Rational Root Theorem gives a short list of suspects.', '$\\pm\\frac{p}{q}$'], ['p divides the constant. q divides the leading coefficient. Last over first.', 'p: factors of the constant. q: factors of the leading number.'],
    ['For x cubed minus 6 x squared plus 11 x minus 6, the suspects are plus or minus 1, 2, 3, 6.', '$\\pm 1, \\pm 2, \\pm 3, \\pm 6$'], { p:'Test $x = 1$: $1 - 6 + 11 - 6 = ?$', o:['$0$: so 1 is a root', '$2$', '$-12$'], fb:'It is 0, so $x - 1$ is a factor.' },
    ['Divide out x minus 1 and factor what is left.', '$(x - 1)(x^2 - 5x + 6) = (x - 1)(x - 2)(x - 3)$']],
  rt:['Picture it: the graph crosses the x axis at the roots. The suspects list tells you where to look.', 'Story: Chaim has a lineup of suspects ($\\pm 1, \\pm 2, \\ldots$). He tests each with synthetic division until one confesses with a 0.'],
  sheet:['Possible rational roots: $\\pm\\frac{p}{q}$', 'Test with synthetic division', 'Divide out each root, factor the rest'] },
{ id:'MATH.ALG.L12.04', t:'Arms and Bounces', g:'endb', srt:'endb', peg:{ n:'Odd Crosses, Even Bounces', l:'At a zero: odd multiplicity crosses, even bounces. At the ends: even degree, arms the same way; odd, opposite.' },
  hook:{ q:'For $y = x^2$, the two ends of the graph point...', o:['both up', 'both down', 'opposite ways'], why:'Even degree with a positive leading coefficient: both arms up.' },
  mv:[['Far out, only the leading term matters. It decides where the arms point.', function(){ return G({ f:['x^3-3*x'], xr:[-3, 3], yr:[-5, 5] }); }], ['Even degree: both arms the same way. Odd degree: opposite ways.', 'even: same, odd: opposite'],
    ['Positive leading coefficient: the right arm goes up. Negative: it goes down.', 'positive: right arm up'], { p:'$y = -x^3 + \\ldots$: the right arm goes...', o:['down', 'up', 'flat'], fb:'Negative leading coefficient: the right end goes down.' },
    ['At each zero: odd multiplicity crosses, even multiplicity bounces.', function(){ return G({ f:['0.3*(x+2)*(x-1)^2'], pts:[[-2, 0, 'crosses'], [1, 0, 'bounces']], xr:[-3.5, 3], yr:[-3, 4] }); }]],
  rt:['Picture it: $(x - 1)^2$ is never negative, so the graph touches 0 at $x = 1$ and turns back. That is the bounce.', 'Story: Yosef watches the far ends of the graph from a mountain top: only the biggest power is visible from that far away.'],
  sheet:['Ends: even degree same direction, odd opposite', 'Leading coefficient positive: right end up', 'Zeros: odd multiplicity crosses, even bounces'] },
{ id:'MATH.ALG.L12.05', t:'Walls and Ceilings', g:'asym', srt:'asym', peg:{ n:'BOBO, BOTN, EATS DC', l:'Bigger On Bottom: $y = 0$. Bigger On Top: None. Exponents Are The Same: Divide Coefficients. Vertical asymptotes: bottom = 0.' },
  hook:{ q:'What happens to $\\frac{1}{x}$ when x gets very close to 0?', o:['It shoots off to huge values', 'It becomes 0', 'It becomes 1'], why:'Dividing by tiny numbers gives huge numbers: a vertical asymptote at $x = 0$.' },
  mv:[['Rational functions have walls the graph cannot cross. Those are vertical asymptotes.', function(){ return G({ f:['(2*x+1)/(x-1)'], vx:[1], hy:[2], xr:[-5, 6], yr:[-6, 8] }); }], ['Vertical asymptotes come from the bottom equal to zero. Here x equals 1.', '$x - 1 = 0 \\Rightarrow x = 1$'],
    ['Horizontal asymptotes: BOBO, BOTN, EATS DC.', 'Bigger On Bottom: 0. Bigger On Top: None. Exponents The Same: Divide Coefficients.'], { p:'$\\frac{2x + 1}{x - 1}$: same degree, so $y = ?$', o:['$2$', '$0$', 'none'], fb:'Divide the leading coefficients: $\\frac{2}{1} = 2$.' },
    ['If a factor cancels from top and bottom, it is a hole, not a wall.', '$\\frac{(x - 2)(x + 2)}{x - 2}$: hole at $x = 2$']],
  rt:['Picture it: plug in $x = 0.999$ and $x = 1.001$ into $\\frac{2x + 1}{x - 1}$. The values jump to huge negative and huge positive.', 'Story: Akiva compares two runners. If the bottom grows faster, the fraction shrinks to 0. Same speed: it settles at their ratio.'],
  sheet:['Vertical asymptote: bottom = 0 (after canceling)', 'Canceled factor: a hole', 'HA: BOBO $y = 0$, BOTN none, EATS DC divide leading coefficients'] },
{ id:'MATH.ALG.L12.06', t:'Sign Chart Strategy', g:'signc', srt:'signc', peg:{ n:'Fence and Test', l:'Zeros and undefined points fence the number line. Test one point in each room. Keep the rooms that match.' },
  hook:{ q:'$(x - 1)(x - 4)$ at $x = 2$ is...', o:['negative', 'positive', 'zero'], why:'$(1)(-2) = -2$: negative.' },
  mv:[['To solve x minus 1 times x minus 4 less than 0, we build a sign chart.', '$(x - 1)(x - 4) < 0$'], ['The zeros, 1 and 4, are fences. They cut the line into three rooms.', 'rooms: left of 1, between, right of 4'],
    ['Test one point in each room. 0 gives positive. 2 gives negative. 5 gives positive.', '$+\\quad -\\quad +$'], { p:'We want less than 0. Keep which room?', o:['between 1 and 4', 'left of 1', 'right of 4'], fb:'Negative lives between the fences.' },
    ['Answer: the open interval from 1 to 4.', '$(1, 4)$'], ['With a fraction, the bottom\'s zeros are fences too, but they are never included.', '$\\frac{x - 1}{x - 4} \\le 0 \\Rightarrow [1, 4)$']],
  rt:['Picture it: the graph of $(x - 1)(x - 4)$ dips below the x axis between 1 and 4.', 'Story: Mordechai checks the temperature in each room of a house with one thermometer per room. The sign cannot change inside a room.'],
  sheet:['Fences: zeros of top and bottom', 'Test one point per region', 'Include edges for $\\le, \\ge$, never where the bottom is 0'] },
{ id:'MATH.ALG.L12.07', t:'Shift Happens', g:'trans', sld:'trans', peg:{ n:'Inside Lies, Outside Tells the Truth', l:'Changes inside with x move left or right, the OPPOSITE way. Changes outside move up or down as written.' },
  hook:{ q:'$y = (x - 3)^2$ is $y = x^2$ moved...', o:['right 3', 'left 3', 'down 3'], why:'Inside changes do the opposite: minus 3 inside moves right.' },
  mv:[['Every basic graph can be moved, flipped and stretched.', function(){ return G({ f:['x^2', '(x-3)^2+1'], dash:[true, false], xr:[-3, 6], yr:[-2, 7] }); }], ['Outside changes tell the truth. Plus 1 outside moves up 1.', '$x^2 + 1$: up 1'],
    ['Inside changes lie. x minus 3 inside moves right 3, not left.', '$(x - 3)^2$: right 3'], { p:'$y = |x + 4| - 2$ is $|x|$ moved...', o:['left 4, down 2', 'right 4, down 2', 'left 4, up 2'], fb:'Inside $+4$: left 4. Outside $-2$: down 2.' },
    ['A minus sign in front flips the graph upside down.', '$-x^2$: flipped'], ['Why do inside changes lie? To get the old output at x equals 0, you now need x equals 3.', '$(x - 3)^2$ at $x = 3$ equals $0^2$']],
  rt:['Picture it: plug in to see. $(x - 3)^2$ is 0 when $x = 3$, so the bottom of the parabola moved to $x = 3$: to the right.', 'Story: Netanel\'s clock runs 3 minutes late. Everything happens 3 minutes later than planned, shifted right on the timeline.'],
  sheet:['$f(x - h) + k$: right h, up k', 'Inside: opposite direction. Outside: as written', '$-f(x)$: flip over the x axis. $af(x)$: stretch by a'] },
{ id:'MATH.ALG.L12.08', t:'Machines in a Row', g:'comp', peg:{ n:'Inside Out; Swap and Solve', l:'$f(g(x))$: do g first, then f. Inverse: write $y = f(x)$, swap x and y, solve for y.' },
  hook:{ q:'$f(x) = x + 1$ and $g(x) = 2x$. What is $f(g(3))$?', o:['7', '8', '6'], why:'Inside first: $g(3) = 6$. Then $f(6) = 7$.' },
  mv:[['Composition puts machines in a row. f of g of x: g works first.', '$f(g(x))$'], ['Work from the inside out, like unpacking a box.', '$g(3) = 6$, then $f(6) = 7$'],
    { p:'$g(f(3))$ for the same machines?', o:['8', '7', '6'], fb:'$f(3) = 4$, then $g(4) = 8$. Order matters!' },
    ['The inverse function undoes f. To find it, swap x and y, then solve.', '$y = 2x + 1 \\to x = 2y + 1 \\to y = \\frac{x - 1}{2}$'], ['Warning: f inverse is not one over f.', '$f^{-1}(x) \\ne \\frac{1}{f(x)}$'], ['Only one-to-one functions have inverses. Use the horizontal line test.', 'horizontal line test']],
  rt:['Picture it: the graph of $f^{-1}$ is the graph of f reflected across the line $y = x$, because x and y swap.', 'Story: Avigail wraps a gift (g) then puts it in a box (f). To undo, you open the box first, then unwrap: inverses undo in reverse order.'],
  sheet:['$f(g(x))$: inside first', 'Inverse: swap x and y, solve for y', '$f(f^{-1}(x)) = x$', '$f^{-1} \\ne \\frac{1}{f}$'] },

/* ---------------- L13 Camp III ---------------- */
{ id:'MATH.ALG.L13.01', t:'Doubling Power', g:'expg', srt:'expg', peg:{ n:'Over 1 Grows, Under 1 Shrinks', l:'$A = P(1 + r)^t$ for growth, $A = P(1 - r)^t$ for decay. The factor is what you multiply by each period.' },
  hook:{ q:'A city grows 10% a year. After 2 years, is it 20% bigger?', o:['No, 21% bigger', 'Yes, exactly 20%', 'No, 19% bigger'], why:'$1.1 \\cdot 1.1 = 1.21$: growth builds on growth.' },
  mv:[['Exponential growth multiplies by the same factor every period.', function(){ return G({ f:['2^x'], xr:[-2, 4], yr:[-1, 12] }); }], ['Growing 5 percent means multiplying by 1 point 0 5 each year.', '$A = P(1.05)^t$'],
    { p:'Losing 20% each year means multiplying by...', o:['$0.8$', '$0.2$', '$1.2$'], fb:'You keep 80%, so multiply by 0.8.' },
    ['A factor over 1 grows. A factor under 1 shrinks.', '$b > 1$: growth. $0 < b < 1$: decay.'], ['Half-life: a medicine halves every 6 hours. After 18 hours, three halvings.', '$A = A_0 (\\frac{1}{2})^{t/6}$']],
  rt:['Picture it: linear growth adds the same amount each year; exponential growth multiplies. After a while the multiplying graph rockets past.', 'Story: Rivka\'s sapling grows 10% taller each month. Each month\'s growth is 10% of a taller tree, so the growth itself keeps growing.'],
  sheet:['Growth: $A = P(1 + r)^t$', 'Decay: $A = P(1 - r)^t$', 'Half-life h: $A = A_0(\\frac{1}{2})^{t/h}$'] },
{ id:'MATH.ALG.L13.02', t:'Pert', g:'econ', peg:{ n:'Pert', l:'Continuous growth: $A = Pe^{rt}$. To find time, take ln: $t = \\frac{\\ln(A/P)}{r}$.' },
  hook:{ q:'The number $e$ is about...', o:['$2.718$', '$3.14$', '$1.618$'], why:'$e \\approx 2.718$, the base of continuous growth.' },
  mv:[['When growth happens every instant, not once a year, we use e.', '$e \\approx 2.718$'], ['The formula spells a word: Pert. A equals P e to the r t.', '$A = Pe^{rt}$'],
    ['500 bacteria growing at 20 percent per hour, after 3 hours: 500 times e to the 0 point 6.', '$500e^{0.6} \\approx 911$'], { p:'To solve $e^{x} = 5$, take...', o:['$\\ln$ of both sides', 'the square root', '$e$ of both sides'], fb:'$\\ln$ undoes $e$: $x = \\ln 5$.' },
    ['Doubling time: 2 equals e to the r t, so t equals ln 2 over r.', '$t = \\frac{\\ln 2}{r} \\approx \\frac{0.693}{r}$']],
  rt:['Picture it: $e^x$ and $\\ln x$ are mirror images across $y = x$. Each undoes the other.', 'Story: Mendy\'s yeast culture grows smoothly all night. He uses Pert to predict how big it will be by morning.'],
  sheet:['$A = Pe^{rt}$', '$\\ln$ undoes $e$: $\\ln(e^x) = x$', 'Doubling time: $t = \\frac{\\ln 2}{r}$'] },
{ id:'MATH.ALG.L13.03', t:'Log Asks What Power', g:'logv', peg:{ n:'Base to the Answer Gives the Inside', l:'$\\log_b x = y$ means $b^y = x$. A log is just an exponent.' },
  hook:{ q:'2 to what power is 8?', o:['3', '4', '6'], why:'$2^3 = 8$. That question has a name: $\\log_2 8 = 3$.' },
  mv:[['A logarithm asks one question: what power?', '$\\log_2 8 = ?$'], ['2 to what power gives 8? 3. So log base 2 of 8 is 3.', '$2^3 = 8 \\Rightarrow \\log_2 8 = 3$'],
    ['Base to the answer gives the inside. Loop from the base, to the answer, to the inside.', '$\\log_b x = y \\iff b^y = x$'], { p:'$\\log_3 \\frac{1}{9} = ?$', o:['$-2$', '$2$', '$\\frac{1}{3}$'], fb:'$3^{-2} = \\frac{1}{9}$.' },
    ['Log with no base means base 10. ln means base e.', '$\\log 1000 = 3$, $\\ln e = 1$'], ['The log of 1 is always 0, because anything to the zero is 1.', '$\\log_b 1 = 0$']],
  rt:['Picture it: on a number line of powers of 2 (1, 2, 4, 8, 16), $\\log_2$ tells you which step you are on.', 'Story: Shira asks "how many times must I double 1 to get 32?" She is computing $\\log_2 32 = 5$.'],
  sheet:['$\\log_b x = y \\iff b^y = x$', '$\\log_b 1 = 0$, $\\log_b b = 1$', '$\\log$ = base 10, $\\ln$ = base $e$'] },
{ id:'MATH.ALG.L13.04', t:'Log Laws', g:'logr', srt:'logr', peg:{ n:'Product Plus, Quotient Minus, Power to the Front', l:'$\\log(ab) = \\log a + \\log b$, $\\log\\frac{a}{b} = \\log a - \\log b$, $\\log a^n = n\\log a$.' },
  hook:{ q:'$\\log_2 4 + \\log_2 8 = \\log_2(?)$', o:['$32$', '$12$', '$2$'], why:'Adding logs multiplies the insides: $4 \\cdot 8 = 32$.' },
  mv:[['Logs are exponents, so they follow exponent rules.', 'logs are exponents'], ['Multiplying adds exponents, so the log of a product is a sum.', '$\\log(ab) = \\log a + \\log b$'],
    ['Dividing subtracts, so the log of a quotient is a difference.', '$\\log\\frac{a}{b} = \\log a - \\log b$'], { p:'$\\log x^5 = ?$', o:['$5\\log x$', '$\\log 5x$', '$(\\log x)^5$'], fb:'Power to the front.' },
    ['Powers jump to the front.', '$\\log a^n = n\\log a$'], ['There is NO rule for the log of a sum.', '$\\log(a + b) \\ne \\log a + \\log b$']],
  rt:['Picture it: $\\log_2 8 = 3$ and $\\log_2 4 = 2$; $\\log_2 32 = 5 = 3 + 2$. The rule is exponent adding in disguise.', 'Story: Yehuda\'s calculator lost its multiply key. With logs he can still multiply: add the logs instead.'],
  sheet:['$\\log(ab) = \\log a + \\log b$', '$\\log\\frac{a}{b} = \\log a - \\log b$', '$\\log a^n = n\\log a$', 'No rule for $\\log(a + b)$'] },
{ id:'MATH.ALG.L13.05', t:'Bring It Down', g:'expeq', peg:{ n:'Same Base, or Take the Log', l:'Same base: set exponents equal. Otherwise take a log and bring the exponent down. Always check log inputs are positive.' },
  hook:{ q:'$2^x = 32$. What is x?', o:['5', '16', '6'], why:'$32 = 2^5$.' },
  mv:[['If both sides share a base, set the exponents equal.', '$2^{x + 1} = 32 = 2^5 \\Rightarrow x + 1 = 5$'], ['If not, take the log of both sides and bring the exponent down.', '$3^x = 20 \\Rightarrow x\\ln 3 = \\ln 20$'],
    { p:'So $x = ?$', o:['$\\frac{\\ln 20}{\\ln 3}$', '$\\frac{\\ln 3}{\\ln 20}$', '$\\frac{20}{3}$'], fb:'Divide both sides by $\\ln 3$.' },
    ['For log equations, rewrite as a power.', '$\\log_2(x - 3) = 4 \\Rightarrow x - 3 = 16$'], ['Always check: the inside of a log must be positive. Reject fake answers.', 'check for extraneous answers']],
  rt:['Picture it: the graph of $3^x$ crosses the height 20 a little before $x = 3$ (since $3^3 = 27$). $\\frac{\\ln 20}{\\ln 3} \\approx 2.73$ fits.', 'Story: Dovid solved a log equation and got $x = 8$ or $x = -2$. Before handing in, he checked: $\\log(-2)$ does not exist, so only 8 survives.'],
  sheet:['Same base: set exponents equal', 'Otherwise: take $\\ln$, bring the exponent down', '$\\log_b(\\text{stuff}) = k \\Rightarrow \\text{stuff} = b^k$', 'Reject answers that make a log input $\\le 0$'] },
{ id:'MATH.ALG.L13.06', t:'Three Unknowns', g:'sys3', peg:{ n:'Kill the Same Variable Twice', l:'Use two different pairs of equations to remove the same variable, solve the 2-by-2, then back-substitute.' },
  hook:{ q:'How many equations do you need to pin down 3 unknowns?', o:['3', '2', '1'], why:'Usually one independent equation per unknown.' },
  mv:[['Three unknowns need three equations.', '$x + y + z = 6$, $x - y + z = 2$, $2x + y - z = 1$'], ['Use equations 1 and 2 to remove y: add them.', '$2x + 2z = 8$'],
    ['Use equations 2 and 3 to remove y again: add them.', '$3x = 3$, so $x = 1$'], { p:'From $2x + 2z = 8$ with $x = 1$, $z = ?$', o:['3', '4', '2'], fb:'$2 + 2z = 8$, so $z = 3$.' },
    ['Back-substitute: 1 plus y plus 3 equals 6, so y is 2.', '$(1, 2, 3)$'], ['In matrix language this is row reduction. Same moves, tidier notebook.', 'row reduction']],
  rt:['Picture it: each equation is a flat plane in space. The answer is the single point where all three planes meet.', 'Story: Esther, Miriam and Chana\'s ages add to 30. Three clues, three unknowns: knock out one sister at a time.'],
  sheet:['Eliminate the SAME variable from two pairs', 'Solve the 2-by-2', 'Back-substitute; check in all three'] },
{ id:'MATH.ALG.L13.07', t:'Patterns That Add Up', g:'seqs', srt:'seqs', peg:{ n:'Arithmetic Adds, Geometric Multiplies', l:'Arithmetic: $a_n = a_1 + (n - 1)d$. Geometric: $a_n = a_1 r^{n-1}$. Sums: $\\frac{n}{2}(a_1 + a_n)$ and $a_1\\frac{1 - r^n}{1 - r}$.' },
  hook:{ q:'What is $1 + 2 + 3 + \\ldots + 100$?', o:['5050', '10000', '5000'], why:'50 pairs that each add to 101: $50 \\cdot 101 = 5050$.' },
  mv:[['Arithmetic sequences add the same number each time.', '$3, 7, 11, 15, \\ldots$ (add 4)'], ['Term n: start at the first term and take n minus 1 jumps.', '$a_n = a_1 + (n - 1)d$'],
    ['Sum: pair the first and last. Average times how many.', '$S_n = \\frac{n}{2}(a_1 + a_n)$'], { p:'$2, 6, 18, 54, \\ldots$ is...', o:['geometric (times 3)', 'arithmetic', 'neither'], fb:'Each term is 3 times the one before.' },
    ['Geometric sequences multiply by the same ratio.', '$a_n = a_1 r^{n - 1}$'], ['If the ratio is between negative 1 and 1, the infinite sum settles down.', '$S = \\frac{a_1}{1 - r}$']],
  rt:['Picture it: stack the sequence as bars, then flip a copy upside down on top. Each column has the same height: first plus last.', 'Story: Akiva saves 1 dollar the first week, 2 the second, and so on. After 10 weeks he has $\\frac{10}{2}(1 + 10) = 55$.'],
  sheet:['Arithmetic: $a_n = a_1 + (n - 1)d$, $S_n = \\frac{n}{2}(a_1 + a_n)$', 'Geometric: $a_n = a_1r^{n-1}$, $S_n = a_1\\frac{1 - r^n}{1 - r}$', 'Infinite, $|r| < 1$: $S = \\frac{a_1}{1 - r}$'] },
{ id:'MATH.ALG.L13.08', t:'Pascal\'s Shortcut', g:'binom', peg:{ n:'Choose, Then Power Both', l:'The $x^k$ term of $(ax + b)^n$ is $C(n, k)(ax)^k b^{n - k}$. Raise BOTH numbers.' },
  hook:{ q:'$(x + 1)^2 = x^2 + 2x + 1$. The coefficients 1, 2, 1 are a row of...', o:['Pascal\'s triangle', 'the times table', 'prime numbers'], why:'Pascal\'s triangle rows: 1; 1 1; 1 2 1; 1 3 3 1 ...' },
  mv:[['Expanding a binomial to a big power by hand takes forever. Pascal\'s triangle shortcuts it.', '$1$ / $1\\ 1$ / $1\\ 2\\ 1$ / $1\\ 3\\ 3\\ 1$'], ['Each number is a choose number: n choose k.', '$C(n, k) = \\frac{n!}{k!(n - k)!}$'],
    ['The term with x to the k: choose, then put the powers on both pieces.', '$C(n, k)(ax)^k b^{n - k}$'], { p:'Coefficient of $x^2$ in $(x + 2)^3$?', o:['$6$', '$3$', '$12$'], fb:'$C(3, 2) \\cdot 1^2 \\cdot 2^1 = 3 \\cdot 2 = 6$.' },
    ['Do not forget to raise the numbers too.', '$(2x)^3 = 8x^3$, not $2x^3$']],
  rt:['Picture it: each number in Pascal\'s triangle is the two above it added. Row 4: 1, 4, 6, 4, 1.', 'Story: Zalman picks 2 of 5 friends for a chavrusa: $C(5, 2) = 10$ ways. The same choose numbers fill the triangle.'],
  sheet:['$(a + b)^n = \\sum C(n, k)a^kb^{n-k}$', '$C(n, k) = \\frac{n!}{k!(n - k)!}$', 'Raise the coefficients too'] },
{ id:'MATH.ALG.L13.09', t:'Circle Decoder', g:'circ', srt:'circ', peg:{ n:'Complete Both Squares', l:'Group x and y, complete each square. $(x - h)^2 + (y - k)^2 = r^2$: center $(h, k)$, radius r.' },
  hook:{ q:'$(x - 2)^2 + (y + 1)^2 = 9$ has center...', o:['$(2, -1)$', '$(-2, 1)$', '$(2, 1)$'], why:'Signs flip: $x - 2$ means $h = 2$; $y + 1$ means $k = -1$.' },
  mv:[['A circle is every point the same distance from the center.', '$(x - h)^2 + (y - k)^2 = r^2$'], ['The signs inside flip: x minus 2 means the center is at x equals 2.', 'center $(h, k)$, radius $r$'],
    ['Expanded form hides it. Group, then complete both squares.', '$x^2 + y^2 - 4x + 6y - 3 = 0$'], ['x squared minus 4x plus 4, and y squared plus 6y plus 9. Add 4 and 9 to the other side too.', '$(x - 2)^2 + (y + 3)^2 = 16$'],
    { p:'Center and radius?', o:['$(2, -3)$, radius 4', '$(-2, 3)$, radius 16', '$(2, -3)$, radius 16'], fb:'Signs flip; the radius is $\\sqrt{16} = 4$.' }],
  rt:['Picture it: the center is where both squared terms are zero.', 'Story: Rafael draws the shul\'s round table on graph paper. The equation hides its center until he completes the squares.'],
  sheet:['$(x - h)^2 + (y - k)^2 = r^2$', 'Expanded: complete the square in x and in y', 'Right side is $r^2$: take its root'] },

/* ---------------- L14 The Ridge ---------------- */
{ id:'MATH.ALG.L14.01', t:'Arrows That Add', g:'vec', peg:{ n:'Tip to Tail', l:'Add vectors part by part (tip to tail). Scale by multiplying every part. Length: $\\sqrt{\\text{sum of squares}}$.' },
  hook:{ q:'Walk 3 east, then 4 north. How far are you from where you started?', o:['5', '7', '1'], why:'Pythagoras: $\\sqrt{3^2 + 4^2} = 5$.' },
  mv:[['A vector is an arrow: it has a length and a direction. We write it with its parts.', '$v = (3, 4)$'], ['To add, put them tip to tail. In numbers: add matching parts.', '$(1, 2) + (3, -1) = (4, 1)$'],
    ['To scale, multiply every part.', '$3(2, -1) = (6, -3)$'], { p:'Length of $(6, 8)$?', o:['$10$', '$14$', '$100$'], fb:'$\\sqrt{36 + 64} = \\sqrt{100} = 10$.' },
    ['Length is Pythagoras, in any dimension.', '$\\|(a, b, c)\\| = \\sqrt{a^2 + b^2 + c^2}$']],
  rt:['Picture it: draw u, then start v at the tip of u. The sum goes from the start of u to the tip of v.', 'Story: Gavriel walks 2 blocks east and 1 north to Ezra\'s house, then 1 east and 3 north to shul. In total: 3 east, 4 north.'],
  sheet:['Add/subtract part by part', '$c(a, b) = (ca, cb)$', '$\\|v\\| = \\sqrt{v_1^2 + v_2^2 + \\ldots}$'] },
{ id:'MATH.ALG.L14.02', t:'The Dot Product', g:'dot', srt:'dot', peg:{ n:'Zero Dot, Right Angle', l:'$u \\cdot v = u_1v_1 + u_2v_2 + \\ldots$. It is zero exactly when the vectors are perpendicular.' },
  hook:{ q:'Two arrows at a perfect right angle. Their dot product is...', o:['0', '1', 'negative'], why:'$u \\cdot v = \\|u\\|\\|v\\|\\cos 90^\\circ = 0$.' },
  mv:[['The dot product multiplies matching parts and adds.', '$(1, 2, 3) \\cdot (4, 5, 6) = 4 + 10 + 18 = 32$'], ['It measures how much two arrows point the same way.', '$u \\cdot v = \\|u\\|\\|v\\|\\cos\\theta$'],
    { p:'$(2, 1) \\cdot (-1, 2) = ?$', o:['$0$', '$4$', '$-4$'], fb:'$-2 + 2 = 0$: perpendicular!' },
    ['Zero means perpendicular. That is the fastest right-angle test there is.', 'dot = 0 means perpendicular'], ['Positive: less than 90 degrees apart. Negative: more than 90.', 'positive: acute. negative: obtuse.']],
  rt:['Picture it: shine a light straight down onto u. The shadow of v on u has length $\\frac{u \\cdot v}{\\|u\\|}$. Perpendicular means no shadow.', 'Story: Yosef pulls a sled with a rope. Only the part of his pull along the snow moves the sled: that is the dot product at work.'],
  sheet:['$u \\cdot v = \\sum u_iv_i$', '$u \\cdot v = \\|u\\|\\|v\\|\\cos\\theta$', '$u \\cdot v = 0 \\iff$ perpendicular'] },
{ id:'MATH.ALG.L14.03', t:'Row Meets Column', g:'mmul', peg:{ n:'Row Times Column', l:'Entry (i, j) of AB = row i of A dotted with column j of B. Order matters: AB is usually not BA.' },
  hook:{ q:'Can you multiply a 2-by-3 matrix by a 3-by-4 matrix?', o:['Yes, and you get 2-by-4', 'No', 'Yes, and you get 3-by-3'], why:'Inner numbers match (3 and 3); outer numbers give the size: 2-by-4.' },
  mv:[['Matrix multiplication is not entry by entry. It is row times column.', '$\\mat{1,2;3,4}\\mat{5,6;7,8}$'], ['Top left: row 1 dotted with column 1. 1 times 5 plus 2 times 7 is 19.', '$1 \\cdot 5 + 2 \\cdot 7 = 19$'],
    { p:'Top right: row 1 with column 2 is...', o:['$22$', '$19$', '$12$'], fb:'$1 \\cdot 6 + 2 \\cdot 8 = 22$.' },
    ['Finish the rest the same way.', '$\\mat{19,22;43,50}$'], ['Order matters. B times A is usually different.', '$AB \\ne BA$ in general']],
  rt:['Picture it: slide row i of A along column j of B, multiply the pairs that line up, and add.', 'Story: Nissim\'s bakery: row = what one customer orders, column = price of each item. Row times column = that customer\'s bill.'],
  sheet:['$(AB)_{ij}$ = row i of A $\\cdot$ column j of B', 'Sizes: $(m \\times n)(n \\times p) = m \\times p$', '$AB \\ne BA$ usually'] },
{ id:'MATH.ALG.L14.04', t:'The Staircase', g:'rref', srt:'rref', peg:{ n:'Build the Staircase, Read the Bottom', l:'Row reduce to echelon form (a staircase of pivots). A row $0 = c$: no solution. A free variable: infinitely many.' },
  hook:{ q:'One equation says $0 = 5$. How many solutions does the system have?', o:['None', 'One', 'Infinitely many'], why:'$0 = 5$ is impossible.' },
  mv:[['Row reduction turns a system into a staircase.', '$\\mat{1,2,-1,\\mid 3;0,1,2,\\mid 1;0,0,1,\\mid 2}$'], ['Three legal moves: swap rows, scale a row, add a multiple of one row to another.', 'swap, scale, add'],
    ['Then solve from the bottom up. That is back-substitution.', '$z = 2$, then $y$, then $x$'], { p:'The last row reads $[0\\ 0\\ 0 \\mid 0]$. That means...', o:['a free variable: infinitely many', 'no solution', 'exactly one'], fb:'$0 = 0$ is always true: one variable is free.' },
    ['If a row says zero equals a nonzero number, the system is inconsistent: no solution.', '$[0\\ 0\\ 0 \\mid 4]$: no solution']],
  rt:['Picture it: three planes meeting at a point (one solution), along a line (infinitely many), or missing each other (none).', 'Story: Mendy cleans up a messy system the way he cleans his desk: one row at a time, top to bottom, until it is a neat staircase.'],
  sheet:['Row moves: swap, scale, add a multiple', 'Echelon form, then back-substitute', '$0 = c \\ne 0$: none. Free variable: infinitely many'] },
{ id:'MATH.ALG.L14.05', t:'The Determinant', g:'det', peg:{ n:'Down Minus Up', l:'$\\det\\mat{a,b;c,d} = ad - bc$. Zero determinant: not invertible, columns dependent.' },
  hook:{ q:'If a matrix squashes the whole plane onto a line, its determinant is...', o:['0', '1', '-1'], why:'The determinant is the area scale factor. Squashed flat: area 0.' },
  mv:[['The determinant of a 2-by-2 matrix: down the main diagonal, minus up the other.', '$\\det\\mat{a,b;c,d} = ad - bc$'], ['For 3, 1, 4, 2: 3 times 2 minus 1 times 4 is 2.', '$\\det\\mat{3,1;4,2} = 6 - 4 = 2$'],
    { p:'$\\det\\mat{2,4;1,2} = ?$', o:['$0$', '$8$', '$4$'], fb:'$4 - 4 = 0$: the columns are multiples of each other.' },
    ['Meaning: it is how much the matrix scales area. Zero means it squashes everything flat.', 'area scale factor'], ['For 3-by-3, expand along a row with signs plus, minus, plus.', '$+\\ -\\ +$']],
  rt:['Picture it: the columns $(a, c)$ and $(b, d)$ make a parallelogram. Its area is $|ad - bc|$.', 'Story: Akiva tests whether a system has one solution: determinant not zero, yes; determinant zero, no unique answer.'],
  sheet:['$\\det\\mat{a,b;c,d} = ad - bc$', '3-by-3: cofactor expansion, signs $+ - +$', '$\\det A = 0 \\iff$ not invertible', '$\\det(AB) = \\det A \\det B$'] },
{ id:'MATH.ALG.L14.06', t:'Undo a Matrix', g:'minv', peg:{ n:'Swap, Negate, Divide', l:'$A^{-1} = \\frac{1}{ad - bc}\\mat{d,-b;-c,a}$: swap a and d, negate b and c, divide by the determinant.' },
  hook:{ q:'For numbers, $5 \\cdot \\frac{1}{5} = 1$. For matrices, $A \\cdot A^{-1} = ?$', o:['the identity matrix $I$', '1', '0'], why:'The identity matrix plays the role of 1.' },
  mv:[['The inverse matrix undoes A. A times A inverse is the identity.', '$AA^{-1} = I$'], ['For 2-by-2 there is a formula: swap a and d, negate b and c, divide by the determinant.', '$A^{-1} = \\frac{1}{ad - bc}\\mat{d,-b;-c,a}$'],
    ['For 4, 7, 2, 6: determinant 24 minus 14 is 10.', '$\\frac{1}{10}\\mat{6,-7;-2,4}$'], { p:'When does $A^{-1}$ NOT exist?', o:['when $\\det A = 0$', 'when $a = 0$', 'never'], fb:'You cannot divide by a zero determinant.' },
    ['Then A x equals b has the answer x equals A inverse b.', '$x = A^{-1}b$']],
  rt:['Picture it: A stretches and turns the plane; $A^{-1}$ turns and shrinks it back.', 'Story: Bracha encodes a message by multiplying by A. Miriam decodes it by multiplying by $A^{-1}$.'],
  sheet:['$A^{-1} = \\frac{1}{ad - bc}\\mat{d,-b;-c,a}$', 'Exists iff $\\det A \\ne 0$', '$Ax = b \\Rightarrow x = A^{-1}b$', '$(AB)^{-1} = B^{-1}A^{-1}$'] },
{ id:'MATH.ALG.L14.07', t:'Independence Day', g:'indep', srt:'indep', peg:{ n:'Nobody Is a Combo', l:'Vectors are independent when none is a combination of the others. Square case: determinant not zero.' },
  hook:{ q:'$(2, 4)$ and $(1, 2)$: does the second add any new direction?', o:['No: it is half of the first', 'Yes', 'Only in 3D'], why:'$(2, 4) = 2(1, 2)$: same direction, dependent.' },
  mv:[['Vectors are independent when none of them is a combination of the others.', 'independent: nobody is a combo'], ['2, 4 and 1, 2 point the same way: dependent.', '$(2, 4) = 2(1, 2)$'],
    ['Quick test for n vectors in n dimensions: put them in as columns and take the determinant.', '$\\det \\ne 0 \\iff$ independent'], { p:'$\\det\\mat{1,3;2,6} = 0$. So the columns are...', o:['dependent', 'independent', 'perpendicular'], fb:'Zero determinant: dependent.' },
    ['The span is everything you can build from them. Independent vectors that span form a basis.', 'basis = independent + spanning']],
