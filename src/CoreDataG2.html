    'LANG.GRAM.L07.02':{name:"Myself for Emphasis", teach:[{"how": "An intensive pronoun (myself, himself, themselves...) adds emphasis right after a noun: \"Akiva himself checked every fact.\"", "q": "In \"The menahel himself read the article,\" what does \"himself\" do?", "o": ["adds emphasis", "receives the action", "asks a question"]}, {"how": "Test: take it out and see if the sentence still works. If it does, it is intensive. If not, it is reflexive (it receives the action).", "q": "\"Yoni taught himself to type.\" Take \"himself\" out. What is it?", "o": ["reflexive: the sentence needs it", "intensive: the sentence still works", "a subject"]}, {"how": "Never use myself in place of I or me: \"Eli and myself wrote it\" is wrong. Say \"Eli and I wrote it.\"", "q": "Which is correct?", "o": ["Eli and I wrote the headline.", "Eli and myself wrote the headline.", "Myself and Eli wrote the headline."]}], practice:[{"t": "sort", "q": "Sort: take the pronoun out. Does the sentence still work?", "bins": [{"id": "0", "label": "Intensive (adds emphasis)"}, {"id": "1", "label": "Reflexive (needed)"}], "items": [{"label": "Gavriel himself took the photo.", "bin": "0"}, {"label": "Gavriel blamed himself.", "bin": "1"}, {"label": "We ourselves counted the votes.", "bin": "0"}, {"label": "We introduced ourselves.", "bin": "1"}, {"label": "The editor himself called.", "bin": "0"}, {"label": "Benny reminded himself.", "bin": "1"}], "h": "Still works without it: intensive. Breaks without it: reflexive."}, {"t": "sort", "q": "Mistake Detective: is the -self word used right?", "bins": [{"id": "0", "label": "Correct"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "Akiva and I edited it.", "bin": "0"}, {"label": "Akiva and myself edited it.", "bin": "1"}, {"label": "Send it to Yoni or me.", "bin": "0"}, {"label": "Send it to Yoni or myself.", "bin": "1"}], "h": "Never use myself where I or me belongs."}, {"t": "order", "q": "Build the sentence with an intensive pronoun after     'LANG.GRAM.L08.03':{name:"Phrase or Clause?", teach:[{"how": "A clause has a subject and a verb: \"when the presses rolled\". A phrase does not: \"after the long meeting\".", "q": "Which is a clause?", "o": ["because the paper sold out", "after the long meeting", "in the newsroom"]}, {"how": "An independent clause can stand alone as a sentence. A dependent clause starts with a word like because, when, although or if, and cannot.", "q": "Which is an independent clause?", "o": ["Yoni interviewed the custodian", "although Yoni interviewed him", "when the custodian spoke"]}, {"how": "Phrases add detail inside a clause: \"With a borrowed camera, Gavriel shot the game.\"", "q": "In \"With a borrowed camera, Gavriel shot the game,\" what is \"With a borrowed camera\"?", "o": ["a phrase", "an independent clause", "a dependent clause"]}], practice:[{"t": "sort", "q": "Sort each group of words.", "bins": [{"id": "0", "label": "Phrase"}, {"id": "1", "label": "Independent clause"}, {"id": "2", "label": "Dependent clause"}], "items": [{"label": "in the school archive", "bin": "0"}, {"label": "Benny found a letter", "bin": "1"}, {"label": "because the ink had faded", "bin": "2"}, {"label": "during the debate", "bin": "0"}, {"label": "the vote was close", "bin": "1"}, {"label": "when the results came in", "bin": "2"}], "h": "Subject + verb? Then is it able to stand alone?"}, {"t": "spotall", "q": "Tap every group that has a subject and a verb.", "cells": [{"label": "the archive door", "ok": false}, {"label": "Akiva checked", "ok": true}, {"label": "since we started", "ok": true}, {"label": "under the old desk", "ok": false}], "h": "A clause has someone or something doing an action."}, {"t": "sort", "q": "Mistake Detective: is each one named right?", "bins": [{"id": "0", "label": "Named right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "\"because it rained\" is a dependent clause", "bin": "0"}, {"label": "\"because it rained\" is a phrase", "bin": "1"}, {"label": "\"after the game\" is a phrase", "bin": "0"}, {"label": "\"after the game\" is a clause", "bin": "1"}], "h": "Starting with after or because is not enough. Look for a subject and a verb."}, {"t": "order", "q": "Build a sentence: dependent clause first, then the independent clause.", "tiles": ["Although the deadline was close,", "the editors", "stayed calm."], "h": "Dependent clause, comma, independent clause."}, {"t": "pairs", "q": "Match each term to its test.", "pairs": [["phrase", "no subject-verb pair"], ["independent clause", "stands alone"], ["dependent clause", "needs another clause"]], "h": "Subject + verb, then can it stand alone?"}, {"t": "sort", "q": "After and before can start either one. Sort them.", "bins": [{"id": "0", "label": "Phrase"}, {"id": "1", "label": "Clause"}], "items": [{"label": "after lunch", "bin": "0"}, {"label": "after we ate lunch", "bin": "1"}, {"label": "before the print run", "bin": "0"}, {"label": "before the printer jammed", "bin": "1"}], "h": "Look for a subject and verb after the first word."}], check:[{"q": "\"while the printer warmed up\" — what is it?", "o": ["a dependent clause", "a phrase", "an independent clause"]}, {"q": "\"across the crowded gym\" — what is it?", "o": ["a phrase", "a dependent clause", "an independent clause"]}, {"q": "What does every clause have that a phrase does not?", "o": ["a subject and a verb", "a comma", "a capital letter"]}], re:[{"q": "Which is a phrase?", "o": ["on the front page", "the story ran", "because it ran"], "h": "No subject-verb pair."}, {"q": "Which is an independent clause?", "o": ["the editor smiled", "when the editor smiled", "with a smile"], "h": "It can stand alone."}, {"q": "\"After the game ended\" — what is it?", "o": ["a dependent clause", "a phrase", "an independent clause"], "h": "Game ended: subject and verb, but it cannot stand alone."}]},

    'LANG.GRAM.L09.02':{name:"Gerunds", teach:[{"how": "A gerund is a verb + -ing used as a noun: \"Writing takes practice.\" It can be the subject or the object.", "q": "In \"Debating sharpens the mind,\" what is \"Debating\"?", "o": ["a gerund used as the subject", "the main verb", "a describing word"]}, {"how": "Test: replace the -ing word with \"it\" or \"this\". If the sentence still works, it is a gerund.", "q": "\"Eli loves interviewing.\" Replace \"interviewing\" with \"it\". What is \"interviewing\"?", "o": ["a gerund: \"Eli loves it\" works", "the main verb", "a describing word"]}, {"how": "Not every -ing word is a gerund. In \"Eli is interviewing the menahel,\" interviewing is part of the verb (is interviewing).", "q": "In \"Gavriel is photographing the game,\" what is \"photographing\"?", "o": ["part of the verb", "a gerund", "a noun"]}], practice:[{"t": "sort", "q": "Sort each -ing word.", "bins": [{"id": "0", "label": "Gerund (a noun)"}, {"id": "1", "label": "Part of the verb"}], "items": [{"label": "Editing takes patience.", "bin": "0"}, {"label": "Akiva is editing now.", "bin": "1"}, {"label": "Yoni enjoys reporting.", "bin": "0"}, {"label": "Yoni was reporting live.", "bin": "1"}, {"label": "Proofreading saves us.", "bin": "0"}, {"label": "We are proofreading tonight.", "bin": "1"}], "h": "Try \"it\": if it fits, gerund. After is, are, was: part of the verb."}, {"t": "spotall", "q": "\"Fundraising was Benny's idea, and collecting helped.\" Tap every gerund.", "cells": [{"label": "Fundraising", "ok": true}, {"label": "collecting", "ok": true}, {"label": "was", "ok": false}, {"label": "helped", "ok": false}], "h": "A gerund names an activity, like a noun."}, {"t": "pairs", "q": "Match each sentence to the job of the -ing word.", "pairs": [["Reading builds vocabulary.", "gerund as subject"], ["Benny loves writing.", "gerund as object"], ["Benny is writing.", "part of the verb"]], "h": "Subject before the verb, object after it, or part of the verb."}, {     'LANG.GRAM.L09.03':{name:"Participles", teach:[{"how": "A participle is a verb form (-ing or -ed, or forms like broken) used as an adjective: \"the cheering crowd\", \"the broken press\".", "q": "In \"the cheering crowd,\" what does \"cheering\" do?", "o": ["describes the crowd", "names an activity", "is the main verb"]}, {"how": "A participial phrase describes a noun and sits right next to the noun it describes: \"Holding the camera high, Gavriel climbed the bleachers.\"", "q": "In \"Holding the camera high, Gavriel climbed,\" who is holding the camera?", "o": ["Gavriel, the noun right after the phrase", "the camera", "the bleachers"]}, {"how": "If the phrase sits next to the wrong noun, it dangles: \"Running for the bus, my notebook fell\" (the notebook was not running).", "q": "Which one dangles?", "o": ["Running for the bus, my notebook fell.", "Running for the bus, I dropped my notebook.", "My notebook fell while I ran for the bus."]}], practice:[{"t": "sort", "q": "Sort: is the verb form describing a noun, or acting as a noun?", "bins": [{"id": "0", "label": "Participle (describes)"}, {"id": "1", "label": "Gerund (a noun)"}], "items": [{"label": "the cheering crowd", "bin": "0"}, {"label": "Cheering is loud.", "bin": "1"}, {"label": "a broken printer", "bin": "0"}, {"label": "the winning team", "bin": "0"}, {"label": "Winning feels good.", "bin": "1"}, {"label": "Printing takes time.", "bin": "1"}], "h": "Before a noun or right next to it, describing: participle."}, {"t": "order", "q": "Build it: the participial phrase describes Gavriel.", "tiles": ["Holding the camera high,", "Gavriel", "climbed the bleachers."], "h": "Phrase, comma, then the noun it describes."}, {"t": "sort", "q": "Mistake Detective: clear, or does it dangle?", "bins": [{"id": "0", "label": "Clear"}, {"id": "1", "label": "Dangles"}], "items": [{"label": "Tired from the trip, Yoni slept.", "bin": "0"}, {"label": "Tired from the trip, the bed looked good.", "bin": "1"}, {"label": "Written     'LANG.GRAM.L09.04':{name:"Infinitives", teach:[{"how": "An infinitive is \"to\" + a verb: to write, to learn, to help. It can work as a noun, an adjective or an adverb.", "q": "Which is an infinitive?", "o": ["to report", "to the newsroom", "reported"]}, {"how": "Do not mix it up with a phrase: \"to\" + a noun (to the store) is a prepositional phrase, not an infinitive.", "q": "In \"Yoni went to the archive to search,\" which is the infinitive?", "o": ["to search", "to the archive", "went"]}, {"how": "Jobs: noun (\"To win is not everything\"), adjective (\"a story to tell\"), adverb (\"We came to help\").", "q": "In \"Benny has a story to tell,\" what does \"to tell\" do?", "o": ["describes the story, like an adjective", "names the subject", "tells where"]}], practice:[{"t": "sort", "q": "Sort each \"to\" group.", "bins": [{"id": "0", "label": "Infinitive"}, {"id": "1", "label": "Prepositional phrase"}], "items": [{"label": "to write", "bin": "0"}, {"label": "to the printer", "bin": "1"}, {"label": "to learn", "bin": "0"}, {"label": "to Rabbi Rosen", "bin": "1"}, {"label": "to explain", "bin": "0"}, {"label": "to the gym", "bin": "1"}], "h": "To + a verb: infinitive. To + a noun: phrase."}, {"t": "pairs", "q": "Match each infinitive to its job.", "pairs": [["To win is not everything.", "noun"], ["Benny has a story to tell.", "adjective"], ["We came to help.", "adverb: tells why"]], "h": "Is it the subject, does it describe a noun, or does it tell why?"}, {"t": "order", "q": "Build a sentence with an infinitive that tells why.", "tiles": ["The Beacon", "raised money", "to help", "a family in need."], "h": "What happened, then to + verb for the reason."}, {"t": "sort", "q": "Mistake Detective: is each \"to\" group named right?", "bins": [{"id": "0", "label": "Named right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "\"to search\" = infinitive", "bin": "0"}, {"label": "\"to the archive\" = infinitive", "bin": "1"}, {"label": "\"to win\" = infinitive", "   BITE['LANG.GRAM.L07.02'] = {"band": "M68", "pic": "🎯", "today": "Use myself and himself for emphasis, the right way", "why": "Used right, an intensive pronoun adds force. Used wrong, it is one of the most common errors in letters and speeches.", "ready": [{"q": "Which is correct?", "o": ["Eli and I went.", "Eli and me went.", "Me and Eli went.", "Myself went."], "a": "Eli and I went."}], "bridge": "LANG.GRAM.L07.01", "bridgeName": "Pronoun Precision", "watch": {"q": "The menahel himself read the article.", "m": {"type": "tiles", "w": ["The menahel", "himself", "read the article."], "hi": [1]}, "steps": [{"t": "\"Himself\" sits right after \"the menahel\" and adds emphasis: not just anyone, the menahel."}, {"t": "Test: take it out. \"The menahel read the article.\" Still works, so it is intensive.", "m": {"type": "tiles", "w": ["The menahel", "read the article."], "hi": [0]}}, {"t": "Compare: \"Yoni taught himself to type.\" Take it out: \"Yoni taught to type.\" Broken. That one is reflexive: it receives the action."}, {"t": "The trap: \"Eli and myself wrote it.\" Myself never replaces I or me. Eli and I wrote it."}, {"t": "Teach it back: tell your chavrusa the take-it-out test, and the one place myself never goes."}], "a": "Intensive = adds emphasis, can be removed. Never use myself for I or me."}, "oops": {"q": "Akiva and myself edited the front page.", "wrong": "Fine: myself sounds polite", "right": "Akiva and I edited the front page.", "why": "Myself is not a polite I. Use it only for emphasis or when the action comes back to the subject."}, "ways": ["worked example", "take-it-out test", "sort", "build with tiles", "teach it back", "Mistake Detective"], "done": "You can use intensive pronouns for emphasis, and keep myself out of the subject!", "board": {"one": "Intensive = noun + himself (removable, adds emphasis). Reflexive = action comes back (needed). Myself never replaces I or me.", "activity": "Boys read sentences aloud, then again without the -self word, and vote \"intensive\" or \"reflexive\".", "mistakes": ["\"Eli and myself\" as a subject", "\"to myself\" for \"to me\"", "Calling a reflexive pronoun intensive"]}, "do": [{"type": "sort", "bins": ["Intensive", "Reflexive"], "cards": [["Gavriel himself took the photo.", 0], ["Gavriel blamed himself.", 1], ["We ourselves counted the votes.", 0], ["We introduced ourselves.", 1]], "say": "Take the pronoun out. Does the sentence still work?", "how": "Still works: intensive. Breaks: reflexive."}, {"type": "match", "mis": true, "pairs": [["Akiva and myself edited it.", "mistake: use I"], ["Send it to Yoni or myself.", "mistake: use me"], ["Akiva himself edited it.", "right: emphasis"]], "say": "Mistake Detective! Match each to its verdict.", "how": "Myself never replaces I or me."}], "your": [{"type": "tiles", "w": ["The boys", "themselves", "printed", "the whole issue."], "extra": ["theirselves"], "say": "Build it with an intensive pronoun.", "how": "Noun, then the -selves word right after it."}, {"type": "sort", "bins": ["Correct", "Mistake"], "cards": [["Akiva and I edited it.", 0], ["Akiva and myself edited it.", 1], ["Send it to Yoni or me.", 0], ["Send it to Yoni or myself.", 1]], "say": "Is the pronoun used right?", "how": "I for the doer, me after to."}, {"type": "match", "pairs": [["I", "myself"], ["he", "himself"], ["we", "ourselves"], ["they", "themselves"]], "say": "Match each pronoun to its -self form.", "how": "-self for one, -selves for many."}, {"type": "sort", "bins": ["Intensive", "Reflexive"], "cards": [["Rabbi Rosen himself called.", 0], ["Benny reminded himself.", 1], ["The writers themselves voted.", 0], ["Yoni taught himself to type.", 1]], "say": "Intensive or reflexive?", "how": "Use the take-it-out test."}, {"type": "tiles", "w": ["Mr. Gross", "himself", "answered", "every letter."], "extra": ["hisself"], "say": "Add emphasis with himself.", "how": "Right after the noun it points to."}]};
  BITE['LANG.GRAM.L07.03'] = {"band": "M68", "pic": "🧭", "today": "Keep pronouns in the same person and number", "why": "A shift from \"a reporter\" to \"you\" confuses readers. Editors fix it first.", "ready": [{"q": "\"Many writers\" are...", "o": ["they", "he", "you", "I"], "a": "they"}], "bridge": "LANG.GRAM.L07.01", "bridgeName": "Pronoun Precision", "watch": {"q": "If a reporter checks facts, you will be trusted.", "m": {"type": "tiles", "w": ["If a reporter checks facts,", "you", "will be trusted."], "hi": [1]}, "steps": [{"t": "Start: \"a reporter\", third person, one. Then \"you\", second person. That is a shift."}, {"t": "Choose one point of view. Keep \"a reporter\", so the pronoun is he.", "m": {"type": "tiles", "w": ["If a reporter checks facts,", "he", "will be trusted."], "hi": [1]}}, {"t": "Or go plural all the way: If reporters check facts, they will be trusted.", "m": {"type": "tiles", "w": ["If reporters check facts,", "they", "will be trusted."], "hi": [1]}}, {"t": "Number too: \"Each writer handed in his story\", not \"their stories\". Each is one."}, {"t": "Teach it back: tell your chavrusa two kinds of shift: person (a reporter, you) and number (each, their)."}], "a": "If reporters check facts, they will be trusted."}, "oops": {"q": "Each editor brought their red pen.", "wrong": "Fine: their covers everyone", "right": "Each editor brought his red pen.", "why": "Each editor is one person. In formal writing, the pronoun must be one too."}, "ways": ["worked example", "sort", "match", "build with tiles", "teach it back", "Mistake Detective"], "done": "You can keep pronouns in the same person and number!", "board": {"one": "Pick a point of view and keep it; match the pronoun to its noun in number (each/every = one).", "activity": "Pass a paragraph around; each boy circles one shift and fixes it.", "mistakes": ["Sliding into \"you\"", "\"Each ... their\"", "Fixing person but breaking number"]}, "do": [{"type": "sort", "bins": ["Stays in person", "Shifts"], "cards": [["When we print early, we sleep more.", 0], ["When we print early, you sleep more.", 1], ["If a boy listens, he learns.", 0], ["If a boy listens, you learn.", 1]], "say": "Does it stay in one person?", "how": "Do the later pronouns match the first?"}, {"type": "match", "mis": true, "pairs": [["Each boy took their seats.", "mistake: number"], ["If we hurry, you will catch it.", "mistake: person"], ["Each boy took his seat.", "correct"]], "say": "Mistake Detective! What kind of mistake is it?", "how": "Person: who is speaking. Number: one or many."}], "your": [{"type": "tiles", "w": ["If reporters", "check facts,", "they", "will be trusted."], "extra": ["you"], "say": "Fix the shift. Stay with reporters.", "how": "Reporters are many: they."}, {"type": "sort", "bins": ["Fixed", "Still a mistake"], "cards": [["Each boy took his seat.", 0], ["Each boy took their seats.", 1], ["If we hurry, we will catch it.", 0], ["If we hurry, you will catch it.", 1]], "say": "Is the shift really fixed?", "how": "Number and person must match."}, {"type": "match", "pairs": [["one boy", "he, his"], ["many writers", "they, their"], ["Akiva and I", "we, our"]], "say": "Match each noun to its pronouns.", "how": "One or many? Who is speaking?"}, {"type": "tiles", "w": ["When a student", "reviews notes,", "he", "remembers more."], "extra": ["you"], "say": "Fix the shift. Stay with a student.", "how": "A student is one: he."}, {"type": "sort", "bins": ["Shift", "No shift"], "cards": [["When a writer edits, you improve.", 0], ["When we edit, we improve.", 1], ["Every editor has their pen.", 0], ["Every editor has his pen.", 1]], "say": "Shift or no shift?", "how": "Check person and number."}]};
  BITE['LANG.GRAM.L08.03'] = {"band": "M68", "pic": "🔬", "today": "Tell a phrase from a clause", "why": "Every comma rule and every strong sentence you write depends on knowing phrases and clauses.", "ready": [{"q": "\"Benny wrote the story.\" What is the verb?", "o": ["wrote", "Benny", "story", "the"], "a": "wrote"}], "bridge": "LANG.SENT.L05.03", "bridgeName": "Add a Phrase", "watch": {"q": "after the long meeting / when the presses rolled", "m": {"type": "tiles", "w": ["after the long meeting", "when the presses rolled"], "hi": [1]}, "steps": [{"t": "Test 1: subject and verb? \"after the long meeting\" has none. Phrase."}, {"t": "\"when the presses rolled\": presses (subject), rolled (verb). Clause.", "m": {"type": "tiles", "w": ["when", "the presses", "rolled"], "hi": [1, 2]}}, {"t": "Test 2: can it stand alone? \"When the presses rolled\" leaves us waiting. Dependent. \"The presses rolled.\" Independent."}, {"t": "Watch the trap: after and before can start a phrase (after lunch) or a clause (after we ate lunch)."}, {"t": "Teach it back: tell your chavrusa the two tests in order: subject and verb, then stand alone."}], "a": "Phrase: no subject-verb. Clause: subject + verb. Independent if it can stand alone."}, "oops": {"q": "\"because of the storm\"", "wrong": "a dependent clause: it starts with because", "right": "a phrase: no subject and verb", "why": "\"Because of\" + a noun is a phrase. \"Because the storm hit\" is a clause."}, "ways": ["worked example", "two tests", "sort", "build with tiles", "teach it back", "Mistake Detective"], "done": "You can tell a phrase from a clause, and an independent clause from a dependent one!", "board": {"one": "Test 1: subject + verb? (clause) Test 2: stands alone? (independent).", "activity": "Cards with phrases and clauses; boys build as many correct sentences as they can in pairs.", "mistakes": ["Judging by the first word only", "\"because of\" as a clause", "Calling any long group a clause"]}, "do": [{"type": "match", "pairs": [["in the school archive", "phrase"], ["Benny found a letter", "independent clause"], ["because the ink faded", "dependent clause"]], "say": "Match each group to its name. Use the two tests.", "how": "Subject and verb? Can it stand alone?"}, {"type": "sort", "mis": true, "bins": ["Named right", "Mistake"], "cards": [["\"because it rained\" = dependent clause", 0], ["\"because of rain\" = clause", 1], ["\"after the game\" = phrase", 0], ["\"after we won\" = phrase", 1]], "say": "Mistake Detective! Is each one named right?", "how": "The first word is not enough. Find subject and verb."}], "your": [{"type": "tiles", "w": ["Although the deadline was close,", "the editors", "stayed calm."], "extra": ["Although"], "say": "Build it: dependent clause first.", "how": "Dependent clause, comma, independent clause."}, {"type": "match", "pairs": [["phrase", "no subject-verb pair"], ["independent clause", "stands alone"], ["dependent clause", "needs another clause"]], "say": "Match each term to its test.", "how": "Subject and verb, then stand alone."}, {"type": "sort", "bins": ["Phrase", "Clause"], "cards": [["after lunch", 0], ["after we ate lunch", 1], ["before the print run", 0], ["before the printer jammed", 1]], "say": "Phrase or clause? Watch the trap words.", "how": "Look for a subject and verb after the first word."}, {"type": "tiles", "w": ["With a borrowed camera,", "Gavriel", "shot the game."], "say": "Build it: phrase first, then the clause.", "how": "Phrase, comma, then subject and verb."}, {"type": "sort", "bins": ["Independent", "Dependent"], "cards": [["the vote was close", 0], ["when the results came in", 1], ["Yoni asked a question", 0], ["if the editor agrees", 1]], "say": "Can each clause stand alone?", "how": "Read it alone. Are you left waiting?"}]};
  BITE['LANG.SENT.L08.01'] = {"band": "M68", "pic": "🏗️", "today": "Build compound-complex sentences that show how ideas connect", "why": "Strong arguments and news stories link several ideas in one clear sentence.", "ready": [{"q": "\"When the bell rang\" is...", "o": ["a dependent clause", "an independent clause", "a phrase", "a sentence"], "a": "a dependent clause"}], "bridge": "LANG.GRAM.L08.03", "bridgeName": "Phrase or Clause?", "watch": {"q": "When the bell rang, Akiva saved the file, and Eli shut the laptop.", "m": {"type": "tiles", "w": ["When the bell rang,", "Akiva saved the file,", "and", "Eli shut the laptop."], "hi": [0]}, "steps": [{"t": "Find the dependent clause: When the bell rang. It cannot stand alone.", "m": {"type": "tiles", "w": ["When the bell rang,", "Akiva saved the file,", "and", "Eli shut the laptop."], "hi": [0]}}, {"t": "Find the independent clauses: Akiva saved the file. Eli shut the laptop. Two.", "m": {"type": "tiles", "w": ["When the bell rang,", "Akiva saved the file,", "and", "Eli shut the laptop."], "hi": [1, 3]}}, {"t": "Two independent + one dependent = compound-complex. Commas: after the dependent clause, and before \"and\"."}, {"t": "Choose the joining word for the link: and adds, but contrasts, so gives the result."}, {"t": "Teach it back: tell your chavrusa the recipe: dependent, comma, independent, comma, joining word, independent."}], "a": "When the bell rang, Akiva saved the file, and Eli shut the laptop."}, "oops": {"q": "\"Because we prepared, we won but, the judges argued.\"", "wrong": "Commas look fine", "right": "\"Because we prepared, we won, but the judges argued.\"", "why": "The comma goes before the joining word, not after it."}, "ways": ["worked example", "count the clauses", "sort", "build with tiles", "teach it back", "Mistake Detective"], "done": "You can build compound-complex sentences with the right link and the right commas!", "board": {"one": "Compound-complex = 2+ independent clauses + 1+ dependent clause; comma after the dependent clause, comma before the joining word.", "activity": "Groups get one dependent and two independent clause strips and build the sentence; the class judges the link word.", "mistakes": ["Comma after the joining word", "A link word with the wrong meaning", "Counting a phrase as a clause"]}, "do": [{"type": "match", "pairs": [["The vote ended, and we counted.", "compound"], ["After the vote ended, we counted.", "complex"], ["After it ended, we counted, and Benny wrote it up.", "compound-complex"]], "say": "Count the clauses. Match each sentence to its kind.", "how": "Two independent? Any dependent?"}, {"type": "sort", "mis": true, "bins": ["Commas right", "Mistake"], "cards": [["When it rained, we stayed in, and we wrote.", 0], ["When it rained we stayed in and, we wrote.", 1], ["Because it was late, we ran, but we missed it.", 0], ["Because it was late, we ran but, we missed it.", 1]], "say": "Mistake Detective! Are the commas right?", "how": "After the dependent clause, and before the joining word."}], "your": [{"type": "tiles", "w": ["Although the archive was dusty,", "Benny found the letter,", "and", "Gavriel photographed it."], "say": "Build a compound-complex sentence.", "how": "Dependent, comma, independent, comma, and, independent."}, {"type": "match", "pairs": [["although", "despite this"], ["so", "a result"], ["but", "a contrast"], ["when", "a time"]], "say": "Match each word to the link it shows.", "how": "How do the ideas connect?"}, {"type": "sort", "bins": ["Right link", "Wrong link"], "cards": [["We prepared, so we won.", 0], ["We prepared, but we won.", 1], ["Although we lost, we smiled.", 0], ["Because we lost, we smiled.", 1]], "say": "Does the joining word fit the meaning?", "how": "Result: so. Contrast: but. Despite: although."}, {"type": "tiles", "w": ["When the results came in,", "Eli cheered,", "but", "Yoni checked the count."], "extra": ["so"], "say": "Build it. Show a contrast.", "how": "Contrast takes but."}, {"type": "match", "pairs": [["two independent, no dependent", "compound"], ["one independent, one dependent", "complex"], ["two independent, one dependent", "compound-complex"]], "say": "Match each clause count to its name.", "how": "Count the clauses."}]};
  BITE['LANG.GRAM.L09.02'] = {"band": "M68", "pic": "🏃", "today": "Spot a gerund: an -ing word working as a noun", "why": "Knowing verbals helps you vary sentences and avoid errors in formal writing.", "ready": [{"q": "\"Benny writes stories.\" What is the verb?", "o": ["writes", "Benny", "stories", "none"], "a": "writes"}], "bridge": "LANG.GRAM.L08.03", "bridgeName": "Phrase or Clause?", "watch": {"q": "Debating sharpens the mind.", "m": {"type": "tiles", "w": ["Debating", "sharpens", "the mind."], "hi": [0]}, "steps": [{"t": "Find the verb: sharpens. What sharpens? Debating. So debating is the subject: a noun."}, {"t": "Test: replace it with \"it\". It sharpens the mind. Works, so debating is a gerund.", "m": {"type": "tiles", "w": ["It", "sharpens", "the mind."], "hi": [0]}}, {"t": "Compare: \"Eli is debating.\" Here debating follows is. It is part of the verb, not a gerund."}, {"t": "A gerund can be the object too: Eli loves debating. Eli loves it."}, {"t": "Teach it back: tell your chavrusa the \"it\" test and the \"is\" trap."}], "a": "Debating is a gerund: an -ing word used as a noun."}, "oops": {"q": "Akiva is editing the front page.", "wrong": "\"editing\" is a gerund", "right": "\"is editing\" is the verb", "why": "After is, are or was, the -ing word is part of the verb. Try \"it\": \"Akiva is it the front page\" fails."}, "ways": ["worked example", "\"it\" test", "sort", "build with tiles", "teach it back", "Mistake Detective"], "done": "You can spot a gerund with the \"it\" test!", "board": {"one": "Gerund = verb + -ing used as a noun. Test: replace with \"it\".", "activity": "Boys list activities they love as gerunds (\"Learning Gemara\", \"fixing bikes\") and use each as a subject and an object.", "mistakes": ["Every -ing word is a gerund", "Missing the gerund as an object", "Confusing it with an -ing describer"]}, "do": [{"type": "sort", "bins": ["Gerund", "Part of the verb"], "cards": [["Editing takes patience.", 0], ["Akiva is editing now.", 1], ["Yoni enjoys reporting.", 0], ["Yoni was reporting live.", 1]], "say": "Use the \"it\" test. Sort each -ing word.", "how": "After is or was: part of the verb."}, {"type": "match", "mis": true, "pairs": [["\"He is running\": a gerund?", "mistake: part of the verb"], ["\"Running is fun\": a gerund?", "right: the subject"], ["\"I hate typing\": a gerund?", "right: the object"]], "say": "Mistake Detective! Match each claim to its verdict.", "how": "Is it after is or was? Then it is part of the verb."}], "your": [{"type": "tiles", "w": ["Checking", "every fact", "protects", "the paper."], "extra": ["is"], "say": "Build it with a gerund subject.", "how": "Gerund phrase first, then the verb."}, {"type": "sort", "bins": ["Gerund", "Not a gerund"], "cards": [["Interviewing is hard.", 0], ["The interviewing boy smiled.", 1], ["I tried skating.", 0], ["The skating rink froze.", 1]], "say": "Gerund, or another job?", "how": "Before a noun, the -ing word describes it."}, {"type": "match", "pairs": [["Reading builds vocabulary.", "gerund as subject"], ["Benny loves writing.", "gerund as object"], ["Benny is writing.", "part of the verb"]], "say": "Match each sentence to the -ing job.", "how": "Before the verb, after it, or part of it?"}, {"type": "tiles", "w": ["Benny", "enjoys", "writing", "mysteries."], "say": "Build it with a gerund object.", "how": "Subject, verb, then the gerund phrase."}, {"type": "sort", "bins": ["Gerund", "Part of the verb"], "cards": [["Proofreading saves us.", 0], ["We are proofreading tonight.", 1], ["Fundraising was his idea.", 0], ["He was fundraising all week.", 1]], "say": "Gerund, or part of the verb?", "how": "Use the \"it\" test."}]};
  BITE['LANG.GRAM.L09.03'] = {"band": "M68", "pic": "📸", "today": "Use participles to describe, without a dangle", "why": "Participles pack action into description. A dangling one can make a reader laugh at the wrong time.", "ready": [{"q": "In \"Debating sharpens the mind,\" what is \"Debating\"?", "o": ["a gerund", "a describing word", "the verb", "a clause"], "a": "a gerund"}], "bridge": "LANG.GRAM.L09.02", "bridgeName": "Gerunds", "watch": {"q": "Holding the camera high, Gavriel climbed the bleachers.", "m": {"type": "tiles", "w": ["Holding the camera high,", "Gavriel", "climbed the bleachers."], "hi": [0]}, "steps": [{"t": "\"Holding the camera high\" is a participial phrase. It describes someone."}, {"t": "Who is holding? The noun right after the comma: Gavriel. Clear.", "m": {"type": "tiles", "w": ["Holding the camera high,", "Gavriel", "climbed the bleachers."], "hi": [1]}}, {"t": "Single participles describe too: the cheering crowd, the broken press."}, {"t": "The dangle: \"Running for the bus, my notebook fell.\" The notebook was not running. Fix: Running for the bus, I dropped my notebook."}, {"t": "Teach it back: tell your chavrusa how to check a participial phrase: who is doing it, and is he right after the comma?"}], "a": "Holding the camera high, Gavriel climbed the bleachers."}, "oops": {"q": "Tired from the trip, the bed looked good.", "wrong": "Fine: it is a nice sentence", "right": "Tired from the trip, Yoni thought the bed looked good.", "why": "The phrase describes the noun right after it. The bed was not tired from the trip."}, "ways": ["worked example", "who-is-doing-it test", "sort", "build with tiles", "teach it back", "Mistake Detective"], "done": "You can use participles and keep them next to the right noun!", "board": {"one": "Participle = verb form used as an adjective. A participial phrase must sit next to the noun it describes.", "activity": "Read dangling sentences aloud and sketch the funny picture they make, then fix them.", "mistak
