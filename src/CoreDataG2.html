    'LANG.GRAM.L07.02':{name:"Myself for Emphasis", teach:[{"how": "An intensive pronoun (myself, himself, themselves...) adds emphasis right after a noun: \"Akiva himself checked every fact.\"", "q": "In \"The menahel himself read the article,\" what does \"himself\" do?", "o": ["adds emphasis", "receives the action", "asks a question"]}, {"how": "Test: take it out and see if the sentence still works. If it does, it is intensive. If not, it is reflexive (it receives the action).", "q": "\"Yoni taught himself to type.\" Take \"himself\" out. What is it?", "o": ["reflexive: the sentence needs it", "intensive: the sentence still works", "a subject"]}, {"how": "Never use myself in place of I or me: \"Eli and myself wrote it\" is wrong. Say \"Eli and I wrote it.\"", "q": "Which is correct?", "o": ["Eli and I wrote the headline.", "Eli and myself wrote the headline.", "Myself and Eli wrote the headline."]}], practice:[{"t": "sort", "q": "Sort: take the pronoun out. Does the sentence still work?", "bins": [{"id": "0", "label": "Intensive (adds emphasis)"}, {"id": "1", "label": "Reflexive (needed)"}], "items": [{"label": "Gavriel himself took the photo.", "bin": "0"}, {"label": "Gavriel blamed himself.", "bin": "1"}, {"label": "We ourselves counted the votes.", "bin": "0"}, {"label": "We introduced ourselves.", "bin": "1"}, {"label": "The editor himself called.", "bin": "0"}, {"label": "Benny reminded himself.", "bin": "1"}], "h": "Still works without it: intensive. Breaks without it: reflexive."}, {"t": "sort", "q": "Mistake Detective: is the -self word used right?", "bins": [{"id": "0", "label": "Correct"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "Akiva and I edited it.", "bin": "0"}, {"label": "Akiva and myself edited it.", "bin": "1"}, {"label": "Send it to Yoni or me.", "bin": "0"}, {"label": "Send it to Yoni or myself.", "bin": "1"}], "h": "Never use myself where I or me belongs."}, {"t": "order", "q": "Build the sentence with an intensive pronoun after     'LANG.GRAM.L08.03':{name:"Phrase or Clause?", teach:[{"how": "A clause has a subject and a verb: \"when the presses rolled\". A phrase does not: \"after the long meeting\".", "q": "Which is a clause?", "o": ["because the paper sold out", "after the long meeting", "in the newsroom"]}, {"how": "An independent clause can stand alone as a sentence. A dependent clause starts with a word like because, when, although or if, and cannot.", "q": "Which is an independent clause?", "o": ["Yoni interviewed the custodian", "although Yoni interviewed him", "when the custodian spoke"]}, {"how": "Phrases add detail inside a clause: \"With a borrowed camera, Gavriel shot the game.\"", "q": "In \"With a borrowed camera, Gavriel shot the game,\" what is \"With a borrowed camera\"?", "o": ["a phrase", "an independent clause", "a dependent clause"]}], practice:[{"t": "sort", "q": "Sort each group of words.", "bins": [{"id": "0", "label": "Phrase"}, {"id": "1", "label": "Independent clause"}, {"id": "2", "label": "Dependent clause"}], "items": [{"label": "in the school archive", "bin": "0"}, {"label": "Benny found a letter", "bin": "1"}, {"label": "because the ink had faded", "bin": "2"}, {"label": "during the debate", "bin": "0"}, {"label": "the vote was close", "bin": "1"}, {"label": "when the results came in", "bin": "2"}], "h": "Subject + verb? Then is it able to stand alone?"}, {"t": "spotall", "q": "Tap every group that has a subject and a verb.", "cells": [{"label": "the archive door", "ok": false}, {"label": "Akiva checked", "ok": true}, {"label": "since we started", "ok": true}, {"label": "under the old desk", "ok": false}], "h": "A clause has someone or something doing an action."}, {"t": "sort", "q": "Mistake Detective: is each one named right?", "bins": [{"id": "0", "label": "Named right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "\"because it rained\" is a dependent clause", "bin": "0"}, {"label": "\"because it rained\" is a phrase", "bin": "1"}, {"label": "\"after the game\" is a phrase", "bin": "0"}, {"label": "\"after the game\" is a clause", "bin": "1"}], "h": "Starting with after or because is not enough. Look for a subject and a verb."}, {"t": "order", "q": "Build a sentence: dependent clause first, then the independent clause.", "tiles": ["Although the deadline was close,", "the editors", "stayed calm."], "h": "Dependent clause, comma, independent clause."}, {"t": "pairs", "q": "Match each term to its test.", "pairs": [["phrase", "no subject-verb pair"], ["independent clause", "stands alone"], ["dependent clause", "needs another clause"]], "h": "Subject + verb, then can it stand alone?"}, {"t": "sort", "q": "After and before can start either one. Sort them.", "bins": [{"id": "0", "label": "Phrase"}, {"id": "1", "label": "Clause"}], "items": [{"label": "after lunch", "bin": "0"}, {"label": "after we ate lunch", "bin": "1"}, {"label": "before the print run", "bin": "0"}, {"label": "before the printer jammed", "bin": "1"}], "h": "Look for a subject and verb after the first word."}], check:[{"q": "\"while the printer warmed up\" — what is it?", "o": ["a dependent clause", "a phrase", "an independent clause"]}, {"q": "\"across the crowded gym\" — what is it?", "o": ["a phrase", "a dependent clause", "an independent clause"]}, {"q": "What does every clause have that a phrase does not?", "o": ["a subject and a verb", "a comma", "a capital letter"]}], re:[{"q": "Which is a phrase?", "o": ["on the front page", "the story ran", "because it ran"], "h": "No subject-verb pair."}, {"q": "Which is an independent clause?", "o": ["the editor smiled", "when the editor smiled", "with a smile"], "h": "It can stand alone."}, {"q": "\"After the game ended\" — what is it?", "o": ["a dependent clause", "a phrase", "an independent clause"], "h": "Game ended: subject and verb, but it cannot stand alone."}]},

    'LANG.GRAM.L09.02':{name:"Gerunds", teach:[{"how": "A gerund is a verb + -ing used as a noun: \"Writing takes practice.\" It can be the subject or the object.", "q": "In \"Debating sharpens the mind,\" what is \"Debating\"?", "o": ["a gerund used as the subject", "the main verb", "a describing word"]}, {"how": "Test: replace the -ing word with \"it\" or \"this\". If the sentence still works, it is a gerund.", "q": "\"Eli loves interviewing.\" Replace \"interviewing\" with \"it\". What is \"interviewing\"?", "o": ["a gerund: \"Eli loves it\" works", "the main verb", "a describing word"]}, {"how": "Not every -ing word is a gerund. In \"Eli is interviewing the menahel,\" interviewing is part of the verb (is interviewing).", "q": "In \"Gavriel is photographing the game,\" what is \"photographing\"?", "o": ["part of the verb", "a gerund", "a noun"]}], practice:[{"t": "sort", "q": "Sort each -ing word.", "bins": [{"id": "0", "label": "Gerund (a noun)"}, {"id": "1", "label": "Part of the verb"}], "items": [{"label": "Editing takes patience.", "bin": "0"}, {"label": "Akiva is editing now.", "bin": "1"}, {"label": "Yoni enjoys reporting.", "bin": "0"}, {"label": "Yoni was reporting live.", "bin": "1"}, {"label": "Proofreading saves us.", "bin": "0"}, {"label": "We are proofreading tonight.", "bin": "1"}], "h": "Try \"it\": if it fits, gerund. After is, are, was: part of the verb."}, {"t": "spotall", "q": "\"Fundraising was Benny's idea, and collecting helped.\" Tap every gerund.", "cells": [{"label": "Fundraising", "ok": true}, {"label": "collecting", "ok": true}, {"label": "was", "ok": false}, {"label": "helped", "ok": false}], "h": "A gerund names an activity, like a noun."}, {"t": "pairs", "q": "Match each sentence to the job of the -ing word.", "pairs": [["Reading builds vocabulary.", "gerund as subject"], ["Benny loves writing.", "gerund as object"], ["Benny is writing.", "part of the verb"]], "h": "Subject before the verb, object after it, or part of the verb."}, {     'LANG.GRAM.L09.03':{name:"Participles", teach:[{"how": "A participle is a verb form (-ing or -ed, or forms like broken) used as an adjective: \"the cheering crowd\", \"the broken press\".", "q": "In \"the cheering crowd,\" what does \"cheering\" do?", "o": ["describes the crowd", "names an activity", "is the main verb"]}, {"how": "A participial phrase describes a noun and sits right next to the noun it describes: \"Holding the camera high, Gavriel climbed the bleachers.\"", "q": "In \"Holding the camera high, Gavriel climbed,\" who is holding the camera?", "o": ["Gavriel, the noun right after the phrase", "the camera", "the bleachers"]}, {"how": "If the phrase sits next to the wrong noun, it dangles: \"Running for the bus, my notebook fell\" (the notebook was not running).", "q": "Which one dangles?", "o": ["Running for the bus, my notebook fell.", "Running for the bus, I dropped my notebook.", "My notebook fell while I ran for the bus."]}], practice:[{"t": "sort", "q": "Sort: is the verb form describing a noun, or acting as a noun?", "bins": [{"id": "0", "label": "Participle (describes)"}, {"id": "1", "label": "Gerund (a noun)"}], "items": [{"label": "the cheering crowd", "bin": "0"}, {"label": "Cheering is loud.", "bin": "1"}, {"label": "a broken printer", "bin": "0"}, {"label": "the winning team", "bin": "0"}, {"label": "Winning feels good.", "bin": "1"}, {"label": "Printing takes time.", "bin": "1"}], "h": "Before a noun or right next to it, describing: participle."}, {"t": "order", "q": "Build it: the participial phrase describes Gavriel.", "tiles": ["Holding the camera high,", "Gavriel", "climbed the bleachers."], "h": "Phrase, comma, then the noun it describes."}, {"t": "sort", "q": "Mistake Detective: clear, or does it dangle?", "bins": [{"id": "0", "label": "Clear"}, {"id": "1", "label": "Dangles"}], "items": [{"label": "Tired from the trip, Yoni slept.", "bin": "0"}, {"label": "Tired from the trip, the bed looked good.", "bin": "1"}, {"label": "Written in pencil, the note was faint.", "bin": "0"}, {"label": "Written in pencil, Benny read the note.", "bin": "1"}], "h": "Who is doing the -ing or -ed? It must be the noun right after the comma."}, {"t": "pairs", "q": "Match each participle to a noun it can describe.", "pairs": [["frozen", "pond"], ["smiling", "menahel"], ["torn", "page"]], "h": "Read them together: the frozen pond."}, {"t": "spotall", "q": "\"The excited boys, laughing loudly, ran quickly to the door.\" Tap every participle.", "cells": [{"label": "excited", "ok": true}, {"label": "laughing", "ok": true}, {"label": "ran", "ok": false}, {"label": "quickly", "ok": false}], "h": "A participle is a verb form describing a noun."}, {"t": "order", "q": "Build it: start with a participial phrase about Benny.", "tiles": ["Excited about the story,", "Benny", "wrote all night."], "h": "Phrase, comma, Benny, then the rest."}], check:[{"q": "In \"the smiling editor,\" what is \"smiling\"?", "o": ["a participle", "a gerund", "the main verb"]}, {"q": "\"Walking into the newsroom, the lights were bright.\" What is wrong?", "o": ["the phrase sits next to the wrong noun", "the comma should come after Walking", "it is a run-on"]}, {"q": "Where should a participial phrase sit?", "o": ["right next to the noun it describes", "at the very end always", "anywhere"]}], re:[{"q": "Which has a participle?", "o": ["the broken window", "Breaking is loud.", "He broke it."], "h": "Broken describes window."}, {"q": "Which is clear?", "o": ["Smiling, Akiva shook hands.", "Smiling, the hand was shaken.", "Smiling the hand, Akiva."], "h": "Akiva is smiling."}, {"q": "A participle works like a...", "o": ["describing word", "noun", "joining word"], "h": "It describes a noun."}]},
    'LANG.GRAM.L09.04':{name:"Infinitives", teach:[{"how": "An infinitive is \"to\" + a verb: to write, to learn, to help. It can work as a noun, an adjective or an adverb.", "q": "Which is an infinitive?", "o": ["to report", "to the newsroom", "reported"]}, {"how": "Do not mix it up with a phrase: \"to\" + a noun (to the store) is a prepositional phrase, not an infinitive.", "q": "In \"Yoni went to the archive to search,\" which is the infinitive?", "o": ["to search", "to the archive", "went"]}, {"how": "Jobs: noun (\"To win is not everything\"), adjective (\"a story to tell\"), adverb (\"We came to help\").", "q": "In \"Benny has a story to tell,\" what does \"to tell\" do?", "o": ["describes the story, like an adjective", "names the subject", "tells where"]}], practice:[{"t": "sort", "q": "Sort each \"to\" group.", "bins": [{"id": "0", "label": "Infinitive"}, {"id": "1", "label": "Prepositional phrase"}], "items": [{"label": "to write", "bin": "0"}, {"label": "to the printer", "bin": "1"}, {"label": "to learn", "bin": "0"}, {"label": "to Rabbi Rosen", "bin": "1"}, {"label": "to explain", "bin": "0"}, {"label": "to the gym", "bin": "1"}], "h": "To + a verb: infinitive. To + a noun: phrase."}, {"t": "pairs", "q": "Match each infinitive to its job.", "pairs": [["To win is not everything.", "noun"], ["Benny has a story to tell.", "adjective"], ["We came to help.", "adverb: tells why"]], "h": "Is it the subject, does it describe a noun, or does it tell why?"}, {"t": "order", "q": "Build a sentence with an infinitive that tells why.", "tiles": ["The Beacon", "raised money", "to help", "a family in need."], "h": "What happened, then to + verb for the reason."}, {"t": "sort", "q": "Mistake Detective: is each \"to\" group named right?", "bins": [{"id": "0", "label": "Named right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "\"to search\" = infinitive", "bin": "0"}, {"label": "\"to the archive\" = infinitive", "bin": "1"}, {"label": "\"to win\" = infinitive", "bin": "0"}, {"label": "\"to Eli\" = infinitive", "bin": "1"}], "h": "Only to + a verb is an infinitive."}, {"t": "spotall", "q": "\"Yoni went to school to interview the menahel and to check facts.\" Tap every infinitive.", "cells": [{"label": "to interview", "ok": true}, {"label": "to check", "ok": true}, {"label": "went", "ok": false}, {"label": "to school", "ok": false}], "h": "To + a verb."}, {"t": "order", "q": "Build it: start with an infinitive phrase that tells why.", "tiles": ["To finish on time,", "the editors", "stayed late."], "h": "Infinitive phrase, comma, the rest."}], check:[{"q": "In \"Gavriel went to the game to photograph it,\" what is \"to the game\"?", "o": ["a prepositional phrase", "an infinitive", "a verb"]}, {"q": "\"To finish the masechta is Benny's goal.\" What job does \"To finish the masechta\" do?", "o": ["a noun", "an adjective", "an adverb"]}, {"q": "What is an infinitive?", "o": ["\"to\" + a verb", "\"to\" + a noun", "a verb + -ing"]}], re:[{"q": "Which is an infinitive?", "o": ["to edit", "to the editor", "edited"], "h": "To + verb."}, {"q": "\"We stayed to help.\" What does \"to help\" tell?", "o": ["why", "where", "who"], "h": "Adverb: tells why."}, {"q": "\"I need a pen to write with.\" What does \"to write with\" describe?", "o": ["the pen", "I", "need"], "h": "Adjective."}]}

  BITE['LANG.GRAM.L07.02'] = {"band":"M68","pic":"🎯","today":"Use myself and himself for emphasis, the right way","why":"Used right, an intensive pronoun adds force. Used wrong, it is one of the most common errors in letters and speeches.","bridge":"LANG.GRAM.L07.01","bridgeName":"Pronoun Precision","done":"*Himself* adds emphasis. *Myself* never replaces *I* or *me*.","board":{"one":"Intensive = noun + himself (removable, adds emphasis). Reflexive = action comes back (needed). Myself never replaces I or me.","activity":"Boys read sentences aloud, then again without the -self word, and vote \"intensive\" or \"reflexive\".","mistakes":["\"Eli and myself\" as a subject","\"to myself\" for \"to me\"","Calling a reflexive pronoun intensive"]},"hook":{"kind":"whatswrong","pic":"🪞","t":"Akiva writes: \"Eli and myself wrote the article.\"","q":"What is wrong here?","o":["Myself should be I","Nothing, it sounds polite","Wrote should be write"],"pay":"*Myself* never replaces *I* or *me*. Eli and *I* wrote it."},"learn":[{"t":"*Intensive*: himself right after a noun adds *emphasis*.","m":{"type":"tiles","w":["The menahel","himself","read the article."],"hi":[1]}},{"t":"*Take-it-out test*: still works? It is *intensive*.","act":{"type":"sort","bins":["Intensive","Reflexive (the action goes back to the doer)"],"cards":[["Gavriel himself took the photo.",0],["Gavriel blamed himself.",1],["We ourselves counted the votes.",0],["We introduced ourselves.",1]],"say":"Take the pronoun *out*. Does the sentence still work?","how":"Still works: *intensive*. Breaks: *reflexive*."}},{"t":"Each pronoun has a *-self* form.","act":{"type":"match","pairs":[["I","myself"],["he","himself"],["we","ourselves"],["they","themselves"]],"say":"Match each pronoun to its *-self* form.","how":"*-self* for one, *-selves* for many."}},{"who":{"q":"\"Akiva and myself edited the front page.\"","o":[["Ari","Fine: myself sounds polite"],["Shneur","Akiva and I edited the front page."]],"a":1,"why":"*Myself* is not a polite *I*."}},{"t":"*Teach it back*: tell your chavrusa the test and trap.","m":{"type":"scene","e":"🗣️","t":"Tell your chavrusa the take-it-out test, and the one place myself never goes: in place of I or me."}}],"play":[{"type":"match","mis":true,"pairs":[["Akiva and myself edited it.","mistake: use I"],["Send it to Yoni or myself.","mistake: use me"],["Akiva himself edited it.","right: emphasis"]],"say":"Mistake Detective! Match each to its verdict.","how":"*Myself* never replaces *I* or *me*."},{"type":"sort","bins":["Intensive","Reflexive"],"cards":[["Rabbi Rosen himself called.",0],["Benny reminded himself.",1],["The writers themselves voted.",0],["Yoni taught himself to type.",1]],"say":"Intensive or reflexive?","how":"Use the *take-it-out* test."},{"type":"tiles","w":["The boys","themselves","printed","the whole issue."],"extra":["theirselves"],"say":"Build it with an intensive pronoun.","how":"Noun, then the *-selves* word right after it."},{"type":"sort","bins":["Correct","Mistake"],"cards":[["Akiva and I edited it.",0],["Dov and myself set up chairs.",1],["Send it to Yoni or me.",0],["Call Zeidy or myself.",1]],"say":"Is the pronoun used right?","how":"*I* for the doer, *me* after *to* or *call*."},{"type":"tiles","w":["Mr. Gross","himself","answered","every letter."],"extra":["hisself"],"say":"Challenge! Add emphasis with himself.","how":"Right after the noun it points to. *Hisself* is not a word."}]};
  BITE['LANG.GRAM.L07.03'] = {"band":"M68","pic":"🧭","today":"Keep pronouns in the same person and number","why":"A shift from \"a reporter\" to \"you\" confuses readers. Editors fix it first.","bridge":"LANG.GRAM.L07.01","bridgeName":"Pronoun Precision","done":"Stay in one *person* and one *number*, start to finish.","board":{"one":"Pick a point of view and keep it; match the pronoun to its noun in number (each/every = one).","activity":"Pass a paragraph around; each boy circles one shift and fixes it.","mistakes":["Sliding into \"you\"","\"Each ... their\"","Fixing person but breaking number"]},"hook":{"kind":"story","pic":"📰","t":"\"If a reporter checks facts, you will be trusted.\"","q":"Who will be trusted?","o":["the reporter","you, the reader","nobody can tell"],"pay":"Nobody can tell! It *shifted* from *a reporter* to *you*. Stay in one *person*."},"learn":[{"t":"*Person*: who is speaking. Pick one and *stay*.","act":{"type":"sort","bins":["Stays in person","Shifts"],"cards":[["When we print early, we sleep more.",0],["When we print early, you sleep more.",1],["If a camper listens, he learns.",0],["If a camper listens, you learn.",1]],"say":"Does it stay in one *person*?","how":"Do the later pronouns *match* the first?"}},{"t":"*Number*: one or many. Pronouns must *match*.","act":{"type":"match","pairs":[["one boy","he, his"],["many writers","they, their"],["Akiva and I","we, our"]],"say":"Match each noun to its *pronouns*.","how":"*One* or *many*? Who is speaking?"}},{"who":{"q":"\"Each editor brought their red pen.\"","o":[["Yisrael","Fine: their covers everyone"],["Mordechai","Each editor brought his red pen."]],"a":1,"why":"*Each* editor is *one*. So the pronoun is one."}},{"t":"*Teach it back*: tell your chavrusa the two shifts.","m":{"type":"scene","e":"🗣️","t":"Tell your chavrusa two kinds of shift: person (a reporter, then you) and number (each, then their)."}}],"play":[{"type":"match","mis":true,"pairs":[["Each boy took their seats.","mistake: number"],["If we hurry, you will catch it.","mistake: person"],["Each boy took his seat.","correct"]],"say":"Mistake Detective! What kind of mistake is it?","how":"*Person*: who is speaking. *Number*: one or many."},{"type":"tiles","w":["If reporters","check facts,","they","will be trusted."],"extra":["you"],"say":"Fix the shift. Stay with reporters.","how":"Reporters are *many*: *they*."},{"type":"sort","bins":["Shift","No shift"],"cards":[["When a writer edits, you improve.",0],["When we edit, we improve.",1],["Every editor has their pen.",0],["Every editor has his pen.",1]],"say":"Shift or no shift?","how":"Check *person* and *number*."},{"type":"tiles","w":["When a camper","packs early,","he","is never late."],"extra":["you","they"],"say":"Challenge! Fix the shift. Stay with a camper.","how":"A camper is *one*: *he*."}]};
  BITE['LANG.GRAM.L08.03'] = {"band":"M68","pic":"🔬","today":"Tell a phrase from a clause","why":"Every comma rule and every strong sentence you write depends on knowing phrases and clauses.","bridge":"LANG.SENT.L05.03","bridgeName":"Add a Phrase","done":"A *clause* has a subject and verb. A *phrase* does not.","board":{"one":"Test 1: subject + verb? (clause) Test 2: stands alone? (independent).","activity":"Cards with phrases and clauses; boys build as many correct sentences as they can in pairs.","mistakes":["Judging by the first word only","\"because of\" as a clause","Calling any long group a clause"]},"hook":{"kind":"mystery","pic":"🕵️","t":"\"after lunch\" and \"after we ate lunch\". Both start with after.","q":"Are they the same kind of word group?","o":["Yes, the same","No, they are different"],"pay":"*Different*! \"after we ate lunch\" has a *subject* and *verb*. It is a *clause*."},"learn":[{"t":"Test 1: a *clause* has a *subject* and a *verb*.","act":{"type":"sort","bins":["Phrase","Clause"],"cards":[["after lunch",0],["after we ate lunch",1],["before the print run",0],["before the printer jammed",1]],"say":"Phrase or clause? Watch the *trap* words.","how":"Find a *subject* and *verb* after the first word."}},{"t":"Test 2: can the clause *stand alone*?","act":{"type":"sort","bins":["Independent","Dependent"],"cards":[["the vote was close",0],["when the results came in",1],["Yoni asked a question",0],["if the editor agrees",1]],"say":"Can each clause *stand alone*?","how":"Read it alone. Are you left *waiting*?"}},{"who":{"q":"\"because of the storm\": what is it?","o":[["Nosson","a clause: it starts with because"],["Yair","a phrase: no subject and verb"]],"a":1,"why":"*Because of* + a noun is a *phrase*."}},{"t":"*Teach it back*: tell your chavrusa the two tests.","m":{"type":"scene","e":"🗣️","t":"Tell your chavrusa the two tests in order: subject and verb, then stand alone."}}],"play":[{"type":"sort","mis":true,"bins":["Named right","Mistake"],"cards":[["\"because it rained\" = dependent clause",0],["\"because of rain\" = clause",1],["\"after the game\" = phrase",0],["\"after we won\" = phrase",1]],"say":"Mistake Detective! Is each one named right?","how":"The first word is not enough. Find *subject* and *verb*."},{"type":"tiles","w":["Although the deadline was close,","the editors","stayed calm."],"extra":["Because of the close deadline,"],"say":"Build it: dependent clause first.","how":"*Dependent* clause, *comma*, *independent* clause."},{"type":"match","pairs":[["in the school archive","phrase"],["Benny found a letter","independent clause"],["because the ink faded","dependent clause"]],"say":"Match each group to its name.","how":"*Subject* and *verb*? Can it *stand alone*?"},{"type":"tiles","w":["With a borrowed camera,","Gavriel","shot the game."],"extra":["After Gavriel borrowed a camera,"],"say":"Challenge! Build it: phrase first, then the clause.","how":"Phrase, *comma*, then *subject* and *verb*."}]};
  BITE['LANG.SENT.L08.01'] = {"band":"M68","pic":"🏗️","today":"Build compound-complex sentences that show how ideas connect","why":"Strong arguments and news stories link several ideas in one clear sentence.","bridge":"LANG.GRAM.L08.03","bridgeName":"Phrase or Clause?","done":"Two independent + one dependent = *compound-complex*. Pick the link that fits.","board":{"one":"Compound-complex = 2+ independent clauses + 1+ dependent clause; comma after the dependent clause, comma before the joining word.","activity":"Groups get one dependent and two independent clause strips and build the sentence; the class judges the link word.","mistakes":["Comma after the joining word","A link word with the wrong meaning","Counting a phrase as a clause"]},"hook":{"kind":"puzzle","pic":"🔗","t":"\"When the bell rang, Akiva saved, and Eli shut the laptop.\"","q":"How many clauses can you find?","o":["2","3","4"],"pay":"*Three*: one dependent, two independent. That is *compound-complex*!"},"learn":[{"t":"A *dependent* clause cannot stand alone. A *comma* follows it.","m":{"type":"tiles","w":["When the bell rang,","Akiva saved the file,","and","Eli shut the laptop."],"hi":[0]}},{"t":"*Count* the clauses. The count names the sentence.","act":{"type":"match","pairs":[["two independent, no dependent","compound"],["one independent, one dependent","complex"],["two independent, one dependent","compound-complex"]],"say":"Match each *clause count* to its name.","how":"*Independent* stands alone. *Dependent* needs help."}},{"t":"Now sort real sentences by their *clauses*.","act":{"type":"sort","bins":["Compound","Complex","Compound-complex"],"cards":[["The vote ended, and we counted.",0],["After the vote ended, we counted.",1],["After it ended, we counted, and Benny wrote it up.",2],["Eli cheered, but Yoni checked.",0],["When the bus came, we left.",1],["If it rains, we stay, and we read.",2]],"say":"Sort each sentence by its *kind*.","how":"*Count*: how many independent? Any dependent?"}},{"who":{"q":"\"Because we prepared, we won but, the judges argued.\"","o":[["Shalom","The commas are fine"],["Elazar","Move the comma before but"]],"a":1,"why":"The comma goes *before* the joining word."}},{"t":"*Teach it back*: tell your chavrusa the recipe.","m":{"type":"scene","e":"🗣️","t":"Tell your chavrusa: dependent clause, comma, independent clause, comma, joining word, independent clause."}}],"play":[{"type":"sort","mis":true,"bins":["Commas right","Mistake"],"cards":[["When it rained, we stayed in, and we wrote.",0],["When it rained we stayed in and, we wrote.",1],["Because it was late, we ran, but we missed it.",0],["Because it was late, we ran but, we missed it.",1]],"say":"Mistake Detective! Are the commas right?","how":"After the *dependent* clause, and *before* the joining word."},{"type":"tiles","w":["Although the archive was dusty,","Benny found the letter,","and","Gavriel photographed it."],"extra":["but,"],"say":"Build a compound-complex sentence.","how":"Dependent, *comma*, independent, *comma*, and, independent."},{"type":"match","pairs":[["although","despite this"],["so","a result"],["but","a contrast"],["when","a time"]],"say":"Match each word to the link it shows.","how":"How do the ideas *connect*?"},{"type":"sort","bins":["Right link","Wrong link"],"cards":[["We prepared, so we won.",0],["We prepared, but we won.",1],["Although we lost, we smiled.",0],["Because we lost, we smiled.",1]],"say":"Does the joining word fit the meaning?","how":"Result: *so*. Contrast: *but*. Despite: *although*."},{"type":"tiles","w":["When the results came in,","Eli cheered,","but","Yoni checked the count."],"extra":["so"],"say":"Challenge! Build it. Show a contrast.","how":"A *contrast* takes *but*."}]};
  BITE['LANG.GRAM.L09.02'] = {"band":"M68","pic":"🏃","today":"Spot a gerund: an -ing word working as a noun","why":"Knowing verbals helps you vary sentences and avoid errors in formal writing.","bridge":"LANG.GRAM.L08.03","bridgeName":"Phrase or Clause?","done":"A *gerund* is an -ing *noun*. Use the *it* test, and watch the *is* trap.","board":{"one":"Gerund = verb + -ing used as a noun. Test: replace with \"it\".","activity":"Boys list activities they love as gerunds (\"Learning Gemara\", \"fixing bikes\") and use each as a subject and an object.","mistakes":["Every -ing word is a gerund","Missing the gerund as an object","Confusing it with an -ing describer"]},"hook":{"kind":"secret","pic":"🔤","t":"Code test: swap the -ing word for \"it\". \"Debating sharpens the mind.\"","q":"Does \"It sharpens the mind\" still work?","o":["Yes, it works","No, it breaks"],"pay":"It works! So *debating* is a *noun* here. That is a *gerund*."},"learn":[{"t":"A *gerund* is an *-ing* word working as a *noun*.","m":{"type":"tiles","w":["Debating","sharpens","the mind."],"hi":[0]}},{"t":"The *it test*: swap in *it*. Still works? Gerund.","act":{"type":"sort","bins":["Gerund","Part of the verb"],"cards":[["Editing takes patience.",0],["Akiva is editing now.",1],["Yoni enjoys reporting.",0],["Yoni was reporting live.",1]],"say":"Use the *it* test. Sort each -ing word.","how":"After *is* or *was*: part of the *verb*."}},{"t":"An *-ing* word before a noun only *describes* it.","act":{"type":"sort","bins":["Gerund","Not a gerund"],"cards":[["Interviewing is hard.",0],["The interviewing boy smiled.",1],["I tried skating.",0],["The skating rink froze.",1]],"say":"*Gerund*, or another job?","how":"Before a *noun*, the -ing word *describes* it."}},{"who":{"q":"\"Akiva is editing the front page.\" Is editing a gerund?","o":[["Ari","Yes, it ends in -ing"],["Shmaya","No, is editing is the verb"]],"a":1,"why":"After *is*, the -ing word is part of the *verb*."}},{"t":"*Teach it back*: tell your chavrusa the test and trap.","m":{"type":"scene","e":"🗣️","t":"Tell your chavrusa the \"it\" test, and the \"is\" trap: after is, are or was, the -ing word is part of the verb."}}],"play":[{"type":"match","mis":true,"pairs":[["\"He is running\": a gerund?","mistake: part of the verb"],["\"Running is fun\": a gerund?","right: the subject"],["\"I hate typing\": a gerund?","right: the object"]],"say":"Mistake Detective! Match each claim to its verdict.","how":"After *is* or *was*? Then it is part of the *verb*."},{"type":"tiles","w":["Checking","every fact","protects","the paper."],"extra":["is"],"say":"Build it with a gerund subject.","how":"*Gerund* phrase first, then the *verb*."},{"type":"sort","bins":["Gerund","Part of the verb"],"cards":[["Proofreading saves us.",0],["We are proofreading tonight.",1],["Fundraising was his idea.",0],["He was fundraising all week.",1]],"say":"Gerund, or part of the verb?","how":"Use the *it* test."},{"type":"match","pairs":[["Reading builds vocabulary.","gerund as subject"],["Benny loves writing.","gerund as object"],["Benny is writing.","part of the verb"]],"say":"Match each sentence to the -ing job.","how":"*Before* the verb, *after* it, or *part* of it?"},{"type":"tiles","w":["Benny","enjoys","writing","mysteries."],"extra":["is"],"say":"Challenge! Build it with a gerund object.","how":"Subject, verb, then the *gerund* phrase."}]};
  BITE['LANG.GRAM.L09.03'] = {"band":"M68","pic":"📸","today":"Use participles to describe, without a dangle","why":"Participles pack action into description. A dangling one can make a reader laugh at the wrong time.","bridge":"LANG.GRAM.L09.02","bridgeName":"Gerunds","done":"A *participle* describes. Keep the phrase right *next to* its noun.","board":{"one":"Participle = verb form used as an adjective. A participial phrase must sit next to the noun it describes.","activity":"Read dangling sentences aloud and sketch the funny picture they make, then fix them.","mistakes":["Dangling the phrase","Calling a gerund a participle","Forgetting the comma after an opening phrase"]},"hook":{"kind":"whatswrong","pic":"🛏️","t":"\"Tired from the trip, the bed looked good.\"","q":"What is wrong here?","o":["The bed was not tired","Nothing at all","It needs a question mark"],"pay":"The *bed* was not tired! The phrase must sit *next to* the one doing it."},"learn":[{"t":"A *participle* is an *-ing* or *-ed* word that *describes*.","act":{"type":"match","pairs":[["frozen","pond"],["smiling","menahel"],["torn","page"]],"say":"Match each *participle* to a noun.","how":"Read them together. Does it *describe*?"}},{"t":"Describes? *Participle*. Names an action? *Gerund*.","act":{"type":"sort","bins":["Participle","Gerund","Part of the verb"],"cards":[["the cheering crowd",0],["Cheering is loud.",1],["They are cheering.",2],["the winning team",0],["Winning is fun.",1],["We were winning.",2]],"say":"Which *job* does each -ing word do?","how":"*Describes*, *names*, or part of the *verb*?"}},{"t":"The phrase sits right *next to* the noun it describes.","act":{"type":"tiles","w":["Holding the camera high,","Gavriel","climbed the bleachers."],"extra":["the bleachers"],"say":"Build it. The phrase describes *Gavriel*.","how":"Phrase, *comma*, then the noun it describes."}},{"who":{"q":"\"Running for the bus, my notebook fell.\" Is it clear?","o":[["Hillel","Yes, it is clear"],["Avraham","No, the
