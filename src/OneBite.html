<script>
/* OneBite.html: the ONE BITE lesson player (HoS 2026-11-21: "a kid opens it up: this is what we are learning today, one little bite-sized piece,
   this is how we do it, this is how you are going to do it").
   Every lesson walks the same calm six steps:  1 TODAY'S BITE  2 WATCH ME  3 DO IT WITH ME  4 YOUR TURN  5 SHOW ME  6 BITE DONE.
   One thing per screen, one big button forward, no pop-ups, no money pill or banners during the bite, read-aloud on every screen.
   HOW IT WORKS (display and flow only):
     - It wraps startMission / render / overlay / phaseIntro LAST (loaded after GameMap), so it sits on top of every other add-on.
     - Steps 1 and 2 (and the ready check) are its own screens. Steps 3-5 are the engine's own question cards (every question kind keeps working),
       shown inside a calm frame. Step 6 replaces the busy result screen.
     - Mastery, saving, answers and money are the engine's own: buildMission / answer / next / finish are not changed. Nothing here sets an amount.
   CONTENT: a hand-written bite in window.ONE_BITE[skill id] (OneBiteData*.html) makes a bite great. Without one, the bite is built from the
     lesson's own Teacher Time (TL_TEACH: big, hook, ex, oops) or its How-to lines, so every lesson can play as a bite at once.
   ROUND 2 (HoS 2026-11-21 evening, docs/ONE-BITE-ROUND2.md): when a bite has do:[...] and your:[...], steps 3 and 4 are hands-on activities
     from the Activity Kit (OneBiteKit.html). Each activity is recorded as an engine result (p.results, phase teach/practice) so evidence rows save.
     "Your turn" ends after 3 right in a row (or when the list runs out) and goes straight to the 3 check questions (Show me).
     A bite with no do/your plays the lesson's own questions, capped at 2 guided + 5 practice, and also skips ahead after 3 right in a row.
     Little Learners (K1) always get a song or a movement (a wiggle break if the bite has none) and a celebration at the end.
   SWITCH: window.OB_LIVE = 'test' (TEST- boys only), 'on' (every boy), 'off'. window.OB_SUBJECTS (optional list of id prefixes) limits 'on'.
   Docs: docs/ONE-BITE-PLAYBOOK.md. No double slash in this file (HtmlService rule). */
(function(){
if(typeof render!=='function'||typeof A==='undefined'||typeof startMission!=='function') return;
const OB=window.OB=window.OB||{}; if(OB.on) return; OB.on=true;
if(!window.OB_LIVE) window.OB_LIVE='on';   /* HoS DECISION 2026-11-22: "the one bite should go live and be turned on for everyone" */
window.ONE_BITE=window.ONE_BITE||{};
const STEPS=['Today','Watch','With me','Your turn','Show me','Done'];   /* HoS 2026-11-21: boys never see the word "bite"; they see lesson and level, like the map */
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=s=>String(s==null?'':s).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
const LS={get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }};

/* ---------- who gets it ---------- */
function isTest(){ return !!(A.st&&/^TEST-/i.test(String(A.st.id||''))); }
function subjOk(id){ const L=window.OB_SUBJECTS; if(!L||!L.length) return true; return L.some(p=>String(id).indexOf(p)===0); }
function live(id,kind){ const v=window.OB_LIVE; if(!id||v==='off'||(kind&&kind!=='skill')) return false;
  if(v==='on') return subjOk(id)||isTest(); return isTest(); }
OB.live=live;

/* ---------- age bands ---------- */
function lvl(id){ const m=String(id||'').match(/\.L(\d+)/); return m?+m[1]:3; }
function band(id){ const b=(window.ONE_BITE[id]||{}).band; if(b) return b; const L=lvl(id); return L<=2?'K1':L<=4?'B23':L<=6?'E45':'M68'; }
const BANDS={ K1:{name:'Little Learners',read:true,min:'3-5'}, B23:{name:'Builders',read:false,min:'5'}, E45:{name:'Explorers',read:false,min:'5-7'}, M68:{name:'Masters',read:false,min:'7-10'} };
OB.band=band;

/* ---------- the bite: hand-written, or built from the lesson's own teaching ---------- */
function nameOf(id){ try{ return skillName(id); }catch(e){ return id; } }
function howLines(t){ if(!t) return []; if(Array.isArray(t)) return t.map(strip).filter(Boolean);
  return strip(t).split(/(?<=[.!?])\s+(?=[A-Z0-9"'(])/).map(s=>s.trim()).filter(Boolean).slice(0,6); }
function firstSentence(s){ s=strip(s); const m=s.match(/^.{8,140}?[.!?](\s|$)/); return m?m[0].trim():s.slice(0,140); }
function biteFor(id,items){
  const H=(window.TL_TEACH||{})[id]||{}, W=window.ONE_BITE[id]||null, it0=(items||[]).find(x=>x.phase==='teach')||(items||[])[0]||{};
  const auto={ id, band:band(id), auto:true,
    today: H.big?firstSentence(H.big):firstSentence(nameOf(id)),
    title: nameOf(id),
    why: H.hook?strip(H.hook):'',
    pic: (H.ex&&H.ex[0]&&H.ex[0].pic)||it0.pic||'',
    watch: null, oops: H.oops||null, done:'', ways:[] };
  const ex=(H.ex||[])[0];
  if(ex&&ex.steps&&ex.steps.length) auto.watch={q:strip(ex.q), steps:ex.steps.map(strip).filter(Boolean).slice(0,6), a:strip(ex.a), pic:ex.pic||''};
  else { const L=howLines(it0.how); if(L.length) auto.watch={q:strip(it0.q), steps:L.slice(0,5), a:'', pic:it0.pic||''}; }
  const kindWay={sort:'sort it',pairs:'match it',order:'build it',spotall:'spot it',write:'write it',num:'work it out'};
  const ways={}; if(auto.pic||(auto.watch&&auto.watch.pic)) ways['picture']=1; if(auto.watch) ways['worked example']=1; if(auto.oops) ways['Mistake Detective']=1;
  (items||[]).forEach(x=>{ const w=kindWay[x.kind||x.t]; if(w) ways[w]=1; }); auto.ways=Object.keys(ways);
  if(!W) return auto;
  const b=Object.assign({},auto,W,{auto:false}); if(W.watch&&!W.watch.steps) b.watch=auto.watch; if(!W.ways||!W.ways.length) b.ways=auto.ways;
  if(!b.why) b.why=auto.why; return b;
}
OB.biteFor=id=>{ let items=[]; try{ items=buildMission(id); }catch(e){} return biteFor(id,items); };

/* ---------- small visual models (ways of learning: picture, manipulatives) ---------- */
function model(m){ if(!m||typeof m!=='object') return '';
  try{
  if(m.type==='tenframe'){ const n=Math.max(0,Math.min(20,+m.n||0)), n2=Math.max(0,+m.n2||0), frames=(n+n2)>10?2:1; let h='<div class="ob-tf" role="img" aria-label="'+E(m.label||(n+(n2?' and '+n2:'')))+'">';
    for(let f=0;f<frames;f++){ h+='<div class="ob-tf-f">'; for(let k=0;k<10;k++){ const i=f*10+k; const cls=i<n?'a':i<n+n2?'b':''; h+='<i class="'+cls+'"></i>'; } h+='</div>'; } return h+'</div>'; }
  if(m.type==='line'){ const a=+m.from||0, b=+m.to||10, hops=(m.hops||[]).map(Number), W=320, pad=16, sx=v=>pad+(v-a)*(W-2*pad)/Math.max(1,b-a); let s='<svg class="ob-nl" viewBox="0 0 '+W+' 70" role="img" aria-label="'+E(m.label||'number line')+'"><line x1="'+pad+'" y1="50" x2="'+(W-pad)+'" y2="50" stroke="currentColor" stroke-width="3"/>';
    const step=Math.max(1,Math.ceil((b-a)/10)); for(let v=a;v<=b;v+=step){ s+='<line x1="'+sx(v)+'" y1="44" x2="'+sx(v)+'" y2="56" stroke="currentColor" stroke-width="2"/><text x="'+sx(v)+'" y="68" font-size="11" text-anchor="middle" fill="currentColor">'+v+'</text>'; }
    for(let k=0;k+1<hops.length;k++){ const x1=sx(hops[k]), x2=sx(hops[k+1]), mx=(x1+x2)/2; s+='<path d="M'+x1+' 46 Q'+mx+' '+(10)+' '+x2+' 46" fill="none" stroke="#FF7A3D" stroke-width="3"/><circle cx="'+x2+'" cy="46" r="4" fill="#FF7A3D"/>'; }
    return s+'</svg>'; }
  if(m.type==='blocks'){ const t=Math.min(9,+m.tens||0), o=Math.min(19,+m.ones||0); let h='<div class="ob-bl" role="img" aria-label="'+t+' tens and '+o+' ones">'; for(let i=0;i<t;i++) h+='<span class="ten"></span>'; for(let i=0;i<o;i++) h+='<span class="one"></span>'; return h+'</div>'; }
  if(m.type==='fbar'){ const n=Math.max(0,+m.n||0), d=Math.max(1,Math.min(16,+m.d||1)); let h='<div class="ob-fb" role="img" aria-label="'+n+' out of '+d+'">'; for(let i=0;i<d;i++) h+='<i class="'+(i<n?'a':'')+'"></i>'; return h+'</div>'; }
  if(m.type==='tiles'){ return '<div class="ob-tiles'+(m.he?' he':'')+'">'+(m.w||[]).map((w,i)=>'<span class="'+((m.hi||[]).indexOf(i)>=0?'hi':'')+'">'+E(w)+'</span>').join('')+'</div>'; }
  if(m.type==='emoji'){ const n=Math.max(0,Math.min(30,+m.n||1)); let h='<div class="ob-em" role="img" aria-label="'+n+'">'; for(let i=0;i<n;i++) h+='<span>'+E(m.e||'⭐')+'</span>'+((m.group&&(i+1)%m.group===0&&i<n-1)?'<b></b>':''); return h+'</div>'; }
  if(m.type==='kpic'){ if(window.OBK&&OBK.css) OBK.css(); return '<div class="ob-kpic">'+(Array.isArray(m.p)?m.p:[m.p]).map(x=>window.OBK&&OBK.pic?OBK.pic(x):E(x)).join('')+'</div>'; }
  if(m.type==='scene'){ return '<div class="ob-scene"><span class="ob-scene-e">'+E(m.e||'🏠')+'</span><p>'+E(m.t||'')+'</p></div>'; }
  if(m.type==='chant'){ return '<div class="ob-chant">'+(m.lines||[]).map(l=>'<p>🎵 '+E(l)+'</p>').join('')+'</div>'; }
  if(m.type==='move'){ return '<div class="ob-move"><span>🧍</span><p>'+E(m.t||'Stand up!')+'</p></div>'; }
  }catch(e){} return ''; }
OB.model=model;
function stepParts(s){ if(s&&typeof s==='object') return {t:strip(s.t||s.say||''), m:s.m||s.model||null}; return {t:strip(s), m:null}; }

/* ---------- state ---------- */
function P(){ return A.view==='play'&&A.play&&A.play.ob?A.play:null; }
function curDot(p){ const ob=p.ob; if(ob.stage==='today'||ob.stage==='ready'||ob.stage==='bridge') return 0; if(ob.stage==='watch') return 1;
  if(ob.stage==='do') return 2; if(ob.stage==='your'||ob.stage==='wiggle') return 3;
  const it=p.items[p.i]||{}; return it.phase==='warm'?0:it.phase==='teach'?2:it.phase==='practice'?3:4; }
function stripHTML(d,ob){ return '<ol class="ob-dots" aria-label="Step '+(d+1)+' of 6: '+STEPS[d]+'">'+STEPS.map((s,k)=>'<li class="'+(k<d?'done':k===d?'now':'')+'"><i></i></li>').join('')+'</ol><span class="ob-stepname">'+(d+1)+' of 6 · '+STEPS[d]+'</span>'; }
function sayAttr(t){ return E(strip(t)).slice(0,600); }
/* button system (HoS 2026-11-23): the lesson's round buttons and footer buttons are the kit's (X top left leaves and asks first; Read it to me and Easy-read are tools; the footer button is MAIN, words only) */
function GOC(){ return window.TLK?'tlk tlk-main ob-go':'ob-go'; } function LKC(){ return window.TLK?'tlk tlk-quiet ob-link':'ob-link'; }
function KC(html,cls){ return html.replace(/class="tlk (tlk-[a-z]+)/,'class="tlk $1 '+cls); }
function head(d,title,sayTxt){ const T=window.TLK; if(T) return '<div class="ob-head" role="banner">'+KC(T.x('data-ob="quit"','','Leave the lesson'),'ob-x')+stripHTML(d)+
  KC(T.tool('🔊','Read it to me','data-ob="say" data-text="'+sayAttr(sayTxt||title)+'"'),'ob-say')+KC(T.tool('Aa','Easy-read letters','data-ob="font"'),'ob-aa')+'</div>';
  return '<div class="ob-head" role="banner"><button class="ob-x" data-ob="quit" aria-label="Leave the lesson">✕</button>'+stripHTML(d)+
  '<button class="ob-say" data-ob="say" data-text="'+sayAttr(sayTxt||title)+'" aria-label="Read it to me">🔊</button><button class="ob-aa" data-ob="font" aria-label="Easy-read letters" title="Easy-read letters">Aa</button></div>'; }
function shell(d,inner,btn,sayTxt,extra){ const p=A.play, b=p.ob.bite;
  return '<div class="ob ob-'+b.band+'" data-dot="'+d+'">'+head(d,b.title,sayTxt)+'<main class="ob-main">'+inner+'</main>'+
  (btn?'<footer class="ob-foot">'+(extra||'')+btn+'</footer>':'')+'</div>'; }

/* ---------- screens before the questions ---------- */
function vToday(p){ const b=p.ob.bite;
  const inner='<div class="ob-tag">TODAY WE LEARN</div><div class="ob-bigpic" aria-hidden="true">'+E(b.pic||(WORLD[p.c]&&WORLD[p.c].icon)||'💡')+'</div>'+
    '<h1 class="ob-today">'+E(b.today)+'</h1>'+(b.why?'<p class="ob-why"><b>Why it matters:</b> '+E(b.why)+'</p>':'')+
    '<p class="ob-meta">'+E(b.title)+' · about '+BANDS[b.band].min+' minutes</p>';
  return shell(0,inner,'<button type="button" class="'+GOC()+'" data-ob="go">Let\'s learn it</button>',b.today+'. '+(b.why||'')); }
function vReady(p){ const ob=p.ob, R=ob.bite.ready||[], q=R[ob.ri]||{}, picked=ob.rsel;
  const opts=(q.o||[]).map((o,k)=>{ let cls=''; if(picked!=null){ if(o===q.a) cls='right'; else if(k===picked) cls='miss'; } return '<button class="ob-opt '+cls+'" data-ob="rpick" data-k="'+k+'" '+(picked!=null?'disabled':'')+'>'+E(o)+'</button>'; }).join('');
  const fb=picked==null?'':(q.o[picked]===q.a?'<p class="ob-good">Yes! You are ready.</p>':'<p class="ob-soft">That\'s okay. Let\'s keep going.</p>');
  const inner='<div class="ob-tag">READY CHECK · '+(ob.ri+1)+' of '+R.length+'</div>'+(q.pic?'<div class="ob-bigpic sm" aria-hidden="true">'+E(q.pic)+'</div>':'')+model(q.m)+'<h2 class="ob-q">'+E(q.q)+'</h2><div class="ob-opts">'+opts+'</div>'+fb;
  return shell(0,inner,picked!=null?'<button type="button" class="'+GOC()+'" data-ob="rnext">Next</button>':'',q.q); }
function vBridge(p){ const b=p.ob.bite, bn=b.bridgeName||nameOf(b.bridge);
  const inner='<div class="ob-tag">A QUICK STEP FIRST</div><div class="ob-bigpic" aria-hidden="true">🌉</div><h1 class="ob-today">Let\'s fill one gap first</h1><p class="ob-why">This lesson builds on <b>'+E(bn)+'</b>. A quick lesson on that, then we come right back here.</p>';
  return shell(0,inner,'<button type="button" class="'+GOC()+'" data-ob="bridge">Do the quick lesson</button>','Let\'s fill one gap first. '+bn,'<button type="button" class="'+LKC()+'" data-ob="skipbridge">Keep going here</button>'); }
function vWatch(p){ const ob=p.ob, w=ob.bite.watch||{}, steps=w.steps||[], k=ob.ws, oopsTurn=k>=steps.length&&ob.bite.oops&&!ob.oopsDone;
  if(oopsTurn){ const o=ob.bite.oops; const inner='<div class="ob-tag">🔍 MISTAKE DETECTIVE</div>'+(o.q?'<h2 class="ob-q">'+E(strip(o.q))+'</h2>':'')+
      '<div class="ob-oops"><div class="ob-wrong"><span>✗</span>'+E(strip(o.wrong))+'</div><div class="ob-right"><span>✓</span>'+E(strip(o.right))+'</div></div><p class="ob-why">'+E(strip(o.why))+'</p>';
    return shell(1,inner,'<button type="button" class="'+GOC()+'" data-ob="wnext">I\'ve got it</button>','Mistake detective. '+strip(o.q)+' Not '+strip(o.wrong)+'. It is '+strip(o.right)+'. '+strip(o.why)); }
  const shown=steps.slice(0,Math.min(k+1,steps.length)).map(stepParts);
  const last=k>=steps.length-1;
  const curM=shown.length&&shown[shown.length-1].m;
  const inner='<div class="ob-tag">👀 WATCH ME</div>'+(w.pic&&!curM?'<div class="ob-bigpic sm" aria-hidden="true">'+E(w.pic)+'</div>':'')+(curM?'':model(w.m))+(w.q?'<h2 class="ob-q">'+E(w.q)+'</h2>':'')+
    '<ol class="ob-steps">'+shown.map((s,i)=>{ const isNew=i===shown.length-1; return '<li class="'+(isNew?'new':'old')+'"><b>'+(i+1)+'</b><div>'+E(s.t)+(isNew?model(s.m):'')+'</div></li>'; }).join('')+'</ol>'+
    (last&&w.a?'<p class="ob-ans">✓ '+E(w.a)+'</p>':'')+'<p class="ob-meta">Step '+Math.min(k+1,steps.length||1)+' of '+(steps.length||1)+'</p>';
  const btn=last?'<button type="button" class="'+GOC()+'" data-ob="wnext">'+(ob.bite.oops&&!ob.oopsDone?'One more thing':'Now we do it together')+'</button>':'<button type="button" class="'+GOC()+'" data-ob="wstep">Next step</button>';
  const cur=shown[shown.length-1]; return shell(1,inner,btn,(k===0&&w.q?w.q+'. ':'')+(cur?cur.t:'')); }
function vDone(){ const r=A.res, ob=OB.res||{}, b=ob.bite||{}, ok=r.outcome==='mastered'||r.outcome==='replayok'||r.outcome==='bosswin';
  let earned=0; try{ earned=(r.payout||[]).reduce((a,x)=>a+(+x[1]||0),0); }catch(e){}
  let nx=null; try{ nx=suggestion(A.st); }catch(e){}
  const ret=OB.ret&&OB.ret.from===r.id?OB.ret:null;
  let btn='', title='', line='', icon='';
  if(ok){ icon='🌟'; title='LEVEL CLEAR!'; line=b.done?E(b.done):'You learned: <b>'+E(b.today||b.title||nameOf(r.id))+'</b>';
    if(ret) btn='<button type="button" class="'+GOC()+'" data-ob="back" data-id="'+E(ret.id)+'" data-c="'+E(ret.c)+'">Back to: '+E(nameOf(ret.id))+'</button>';
    else if(nx&&nx.kind!=='boss'&&nx.id) btn='<button type="button" class="'+GOC()+'" data-act="start" data-id="'+E(nx.id)+'" data-c="'+E(nx.c)+'">Next level</button>';
    else btn='<button type="button" class="'+GOC()+'" data-act="tohub">Back to my map</button>'; }
  else if(r.outcome==='retry'){ icon='💪'; title='Almost there!'; line=r.right+' of 3 on your own. A short practice round, then try the last 3 again.'; btn='<button type="button" class="'+GOC()+'" data-act="retry">Practice round</button>'; }
  else if(r.outcome==='checkin'){ icon='🤝'; title='Let\'s team up'; line='This one is tricky. Your rebbe or teacher will sit with you on it. Pick another bite for now.'; btn='<button type="button" class="'+GOC()+'" data-act="tohub">Back to my map</button>'; }
  else { icon='👍'; title='Good practice'; line='Practice keeps it strong.'; btn='<button type="button" class="'+GOC()+'" data-act="tohub">Back to my map</button>'; }
  const party=ok&&b.band==='K1'?'<div class="ob-party" aria-hidden="true">'+['⭐','🎉','🌟','✨','🎈','⭐','🌟','🎉'].map((x,i)=>'<i style="--i:'+i+'">'+x+'</i>').join('')+'</div>':'';
  const stars=ok&&r.stars?'<div class="ob-stars" aria-label="'+r.stars+' stars">'+'⭐'.repeat(r.stars)+'</div>':'';
  const inner=party+'<div class="ob-burst'+(party?' big':'')+'" aria-hidden="true">'+icon+'</div><h1 class="ob-done">'+title+'</h1>'+stars+'<p class="ob-why">'+line+'</p>'+
    (ok&&earned>0?'<p class="ob-earn"><span class="tlk-pill tlk-money">+ $'+earned.toFixed(2)+' earned</span></p>':'')+(ok?'<p class="ob-meta">It will come back for a quick review in a few days.</p>':'');
  return '<div class="ob ob-'+(b.band||'B23')+'" data-dot="5">'+head(5,b.title||'',strip(title+'. '+line))+'<main class="ob-main ob-center">'+inner+'</main><footer class="ob-foot">'+
    (ok&&!ret?'<button type="button" class="'+LKC()+'" data-act="tohub">My map</button>':'')+btn+'</footer></div>'; }

/* ---------- take over the start ---------- */
const _sm=startMission;
startMission=function(c,id,kind){
  const want=live(id,kind)&&!(A.st&&A.st.obOff);
  const out=_sm.apply(this,arguments);
  try{ const p=A.play;
    if(want&&A.view==='play'&&p&&p.id===id&&!p.ob){
      const bite=biteFor(id,p.items);
      p.ob={bite, stage:'today', ws:0, ri:0, rmiss:0, rsel:null, oopsDone:!bite.oops, pracOk:0, t0:Date.now()}; kitSetup(p);
      if(OB.pendingRet&&OB.pendingRet.bridge===id){ OB.ret={from:id,id:OB.pendingRet.id,c:OB.pendingRet.c}; OB.pendingRet=null; }
      OB.res={id, bite}; A.overlay=null; render(); scrollTo(0,0); autoSay();
    } else if(p&&kind==='retry'&&OB.res&&OB.res.id===id&&live(id,'skill')){
      p.ob={bite:OB.res.bite, stage:'q', ws:0, ri:0, rmiss:0, rsel:null, oopsDone:true, pracOk:0, retry:true, wiggled:true}; kitSetup(p);
      if(p.ob.kitOn) p.ob.stage=startYour(p); A.overlay=null; render(); autoSay();
    }
  }catch(e){ console.warn('OneBite start',e); }
  return out; };
window.startMission=startMission;

/* no pop-ups during a bite: phase pop-ups, warm-up pop-ups, combo pop-ups are skipped (the 6-dot strip shows the step) */
const _pi=phaseIntro; phaseIntro=function(){ if(P()) return; return _pi.apply(this,arguments); }; window.phaseIntro=phaseIntro;
const _ov=overlay; overlay=function(inner){ const p=P(); if(p&&!/quit-yes/.test(String(inner||''))) return; return _ov.apply(this,arguments); }; window.overlay=overlay;

/* calm: no confetti flying across the work during a bite (the right-answer sound and the green check stay) */
if(typeof burst==='function'){ const _bu=burst; burst=function(){ if(P()||(A.view==='result'&&OB.res&&OB.res.live)) return; return _bu.apply(this,arguments); }; window.burst=burst; }

/* ---------- drawing ---------- */
let dysOn=LS.get('ob-dys')==='1';
function bodyCls(on,p){ const bd=document.body; bd.classList.toggle('ob-on',!!on); bd.classList.toggle('ob-dys',!!on&&dysOn);
  ['K1','B23','E45','M68'].forEach(k=>bd.classList.toggle('ob-b-'+k,!!on&&p&&p.ob&&p.ob.bite.band===k)); }
const _r=render;
render=function(){
  const p=P();
  if(p&&p.ob.stage!=='q'){ css(); const el=document.getElementById('app'); bodyCls(true,p);
