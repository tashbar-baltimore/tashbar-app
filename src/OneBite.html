<script>
/* OneBite.html: the ONE BITE lesson player (HoS 2026-11-21: "a kid opens it up: this is what we are learning today, one little bite-sized piece,
   this is how we do it, this is how you are going to do it").
   Every lesson walks the same calm six steps:  1 TODAY'S BITE  2 WATCH ME  3 DO IT WITH ME  4 YOUR TURN  5 SHOW ME  6 BITE DONE.
   One thing per screen, one big button forward, no pop-ups, no money pill or banners during the bite, read-aloud on every screen.
   HOW IT WORKS (display and flow only):
     - It wraps startMission / render / overlay / phaseIntro LAST (loaded after GameMap), so it sits on top of every other add-on.
     - Steps 1 and 2 (and the ready check) are its own screens. Steps 3-5 are the engine's own question cards (every question kind keeps working),
       shown inside a calm frame. Step 6 replaces the busy result screen.
     - Mastery, saving, answers and money are the engine's own: buildMission / answer / next / finish are not changed. Nothing here sets an amount.
   CONTENT: a hand-written bite in window.ONE_BITE[skill id] (OneBiteData*.html) makes a bite great. Without one, the bite is built from the
     lesson's own Teacher Time (TL_TEACH: big, hook, ex, oops) or its How-to lines, so every lesson can play as a bite at once.
   ROUND 2 (HoS 2026-11-21 evening, docs/ONE-BITE-ROUND2.md): when a bite has do:[...] and your:[...], steps 3 and 4 are hands-on activities
     from the Activity Kit (OneBiteKit.html). Each activity is recorded as an engine result (p.results, phase teach/practice) so evidence rows save.
     "Your turn" ends after 3 right in a row (or when the list runs out) and goes straight to the 3 check questions (Show me).
     A bite with no do/your plays the lesson's own questions, capped at 2 guided + 5 practice, and also skips ahead after 3 right in a row.
     Little Learners (K1) always get a song or a movement (a wiggle break if the bite has none) and a celebration at the end.
   SWITCH: window.OB_LIVE = 'test' (TEST- boys only), 'on' (every boy), 'off'. window.OB_SUBJECTS (optional list of id prefixes) limits 'on'.
   Docs: docs/ONE-BITE-PLAYBOOK.md. No double slash in this file (HtmlService rule). */
(function(){
if(typeof render!=='function'||typeof A==='undefined'||typeof startMission!=='function') return;
const OB=window.OB=window.OB||{}; if(OB.on) return; OB.on=true;
if(!window.OB_LIVE) window.OB_LIVE='on';   /* HoS DECISION 2026-11-22: "the one bite should go live and be turned on for everyone" */
window.ONE_BITE=window.ONE_BITE||{};
const STEPS=['Today','Watch','With me','Your turn','Show me','Done'];
/* NEW LESSONS (HoS 2026-11-27, docs/lesson-redesign/DESIGN.md): a lesson with hook + learn + play plays five parts, every tap makes him think:
   THINK (the hook: he guesses) - LEARN (2-4 cards he works with; one is "Who's right?") - TRY IT (3-5 deep activities) - SHOW ME - DONE (the hook pays off).
   Words in *stars* show highlighted (TLK.keys). Lessons still in the old shape play the six steps as before. */
const STEPS2=['Think','Learn','Try it','Show me','Done'];
const HOOKS=OB.HOOKS={ puzzle:['🧩','Puzzle'], mystery:['🕵️','Mystery'], whatswrong:['🔍','What\'s wrong?'], guess:['🎯','Quick guess'], oddone:['👀','Odd one out'],
  riddle:['❓','Riddle'], notice:['🔎','Look closely'], predict:['🔮','Predict'], challenge:['🏆','Challenge'], story:['📖','Story time'], wouldyou:['🤔','You pick'],
  fact:['💥','Did you know?'], compare:['⚖️','Which is more?'], secret:['🔐','Crack the code'] };
function isNF(b){ return !!(b&&b.hook&&typeof b.hook==='object'&&Array.isArray(b.learn)&&b.learn.length&&Array.isArray(b.play)&&b.play.length); }
OB.isNF=isNF;
function nfNow(){ const p=A.play; const b=(p&&p.ob&&p.ob.bite)||(A.view==='result'&&OB.res&&OB.res.bite); return !!(b&&b.nf); }
function noStar(t){ return String(t==null?'':t).replace(/\*/g,''); }
function K(t){ if(window.TLK&&TLK.keys) return TLK.keys(t); return E(t).replace(/\*([^*]+)\*/g,'<mark class="tlk-key">$1</mark>'); }   /* HoS 2026-11-21: boys never see the word "bite"; they see lesson and level, like the map */
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=s=>String(s==null?'':s).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
const LS={get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }};

/* ---------- who gets it ---------- */
function isTest(){ return !!(A.st&&/^TEST-/i.test(String(A.st.id||''))); }
function subjOk(id){ const L=window.OB_SUBJECTS; if(!L||!L.length) return true; return L.some(p=>String(id).indexOf(p)===0); }
function live(id,kind){ const v=window.OB_LIVE; if(!id||v==='off'||(kind&&kind!=='skill')) return false;
  if(v==='on') return subjOk(id)||isTest(); return isTest(); }
OB.live=live;

/* ---------- age bands ---------- */
function lvl(id){ const m=String(id||'').match(/\.L(\d+)/); return m?+m[1]:3; }
function band(id){ const b=(window.ONE_BITE[id]||{}).band; if(b) return b; const L=lvl(id); return L<=2?'K1':L<=4?'B23':L<=6?'E45':'M68'; }
const BANDS={ K1:{name:'Little Learners',read:true,min:'3-5'}, B23:{name:'Builders',read:false,min:'5'}, E45:{name:'Explorers',read:false,min:'5-7'}, M68:{name:'Masters',read:false,min:'7-10'} };
OB.band=band;

/* ---------- the bite: hand-written, or built from the lesson's own teaching ---------- */
function nameOf(id){ try{ return skillName(id); }catch(e){ return id; } }
function howLines(t){ if(!t) return []; if(Array.isArray(t)) return t.map(strip).filter(Boolean);
  return strip(t).split(/(?<=[.!?])\s+(?=[A-Z0-9"'(])/).map(s=>s.trim()).filter(Boolean).slice(0,6); }
function firstSentence(s){ s=strip(s); const m=s.match(/^.{8,140}?[.!?](\s|$)/); return m?m[0].trim():s.slice(0,140); }
function biteFor(id,items){
  const H=(window.TL_TEACH||{})[id]||{}, W=window.ONE_BITE[id]||null, it0=(items||[]).find(x=>x.phase==='teach')||(items||[])[0]||{};
  const auto={ id, band:band(id), auto:true,
    today: H.big?firstSentence(H.big):firstSentence(nameOf(id)),
    title: nameOf(id),
    why: H.hook?strip(H.hook):'',
    pic: (H.ex&&H.ex[0]&&H.ex[0].pic)||it0.pic||'',
    watch: null, oops: H.oops||null, done:'', ways:[] };
  const ex=(H.ex||[])[0];
  if(ex&&ex.steps&&ex.steps.length) auto.watch={q:strip(ex.q), steps:ex.steps.map(strip).filter(Boolean).slice(0,6), a:strip(ex.a), pic:ex.pic||''};
  else { const L=howLines(it0.how); if(L.length) auto.watch={q:strip(it0.q), steps:L.slice(0,5), a:'', pic:it0.pic||''}; }
  const kindWay={sort:'sort it',pairs:'match it',order:'build it',spotall:'spot it',write:'write it',num:'work it out'};
  const ways={}; if(auto.pic||(auto.watch&&auto.watch.pic)) ways['picture']=1; if(auto.watch) ways['worked example']=1; if(auto.oops) ways['Mistake Detective']=1;
  (items||[]).forEach(x=>{ const w=kindWay[x.kind||x.t]; if(w) ways[w]=1; }); auto.ways=Object.keys(ways);
  if(!W) return auto;
  const b=Object.assign({},auto,W,{auto:false}); if(W.watch&&!W.watch.steps) b.watch=auto.watch; if(!W.ways||!W.ways.length) b.ways=auto.ways;
  if(!b.why) b.why=auto.why; b.nf=isNF(W); if(b.nf&&!b.today) b.today=noStar(W.hook.q||auto.today); return b;
}
OB.biteFor=id=>{ let items=[]; try{ items=buildMission(id); }catch(e){} return biteFor(id,items); };

/* ---------- small visual models (ways of learning: picture, manipulatives) ---------- */
function model(m){ if(!m||typeof m!=='object') return '';
  try{
  if(m.type==='tenframe'){ const n=Math.max(0,Math.min(20,+m.n||0)), n2=Math.max(0,+m.n2||0), frames=(n+n2)>10?2:1; let h='<div class="ob-tf" role="img" aria-label="'+E(m.label||(n+(n2?' and '+n2:'')))+'">';
    for(let f=0;f<frames;f++){ h+='<div class="ob-tf-f">'; for(let k=0;k<10;k++){ const i=f*10+k; const cls=i<n?'a':i<n+n2?'b':''; h+='<i class="'+cls+'"></i>'; } h+='</div>'; } return h+'</div>'; }
  if(m.type==='line'){ const a=+m.from||0, b=+m.to||10, hops=(m.hops||[]).map(Number), W=320, pad=16, sx=v=>pad+(v-a)*(W-2*pad)/Math.max(1,b-a); let s='<svg class="ob-nl" viewBox="0 0 '+W+' 70" role="img" aria-label="'+E(m.label||'number line')+'"><line x1="'+pad+'" y1="50" x2="'+(W-pad)+'" y2="50" stroke="currentColor" stroke-width="3"/>';
    const step=Math.max(1,Math.ceil((b-a)/10)); for(let v=a;v<=b;v+=step){ s+='<line x1="'+sx(v)+'" y1="44" x2="'+sx(v)+'" y2="56" stroke="currentColor" stroke-width="2"/><text x="'+sx(v)+'" y="68" font-size="11" text-anchor="middle" fill="currentColor">'+v+'</text>'; }
    for(let k=0;k+1<hops.length;k++){ const x1=sx(hops[k]), x2=sx(hops[k+1]), mx=(x1+x2)/2; s+='<path d="M'+x1+' 46 Q'+mx+' '+(10)+' '+x2+' 46" fill="none" stroke="#FF7A3D" stroke-width="3"/><circle cx="'+x2+'" cy="46" r="4" fill="#FF7A3D"/>'; }
    return s+'</svg>'; }
  if(m.type==='blocks'){ const t=Math.min(9,+m.tens||0), o=Math.min(19,+m.ones||0); let h='<div class="ob-bl" role="img" aria-label="'+t+' tens and '+o+' ones">'; for(let i=0;i<t;i++) h+='<span class="ten"></span>'; for(let i=0;i<o;i++) h+='<span class="one"></span>'; return h+'</div>'; }
  if(m.type==='fbar'){ const n=Math.max(0,+m.n||0), d=Math.max(1,Math.min(16,+m.d||1)); let h='<div class="ob-fb" role="img" aria-label="'+n+' out of '+d+'">'; for(let i=0;i<d;i++) h+='<i class="'+(i<n?'a':'')+'"></i>'; return h+'</div>'; }
  if(m.type==='tiles'){ return '<div class="ob-tiles'+(m.he?' he':'')+'">'+(m.w||[]).map((w,i)=>'<span class="'+((m.hi||[]).indexOf(i)>=0?'hi':'')+'">'+E(w)+'</span>').join('')+'</div>'; }
  if(m.type==='emoji'){ const n=Math.max(0,Math.min(30,+m.n||1)); let h='<div class="ob-em" role="img" aria-label="'+n+'">'; for(let i=0;i<n;i++) h+='<span>'+E(m.e||'⭐')+'</span>'+((m.group&&(i+1)%m.group===0&&i<n-1)?'<b></b>':''); return h+'</div>'; }
  if(m.type==='kpic'){ if(window.OBK&&OBK.css) OBK.css(); return '<div class="ob-kpic">'+(Array.isArray(m.p)?m.p:[m.p]).map(x=>window.OBK&&OBK.pic?OBK.pic(x):E(x)).join('')+'</div>'; }
  if(m.type==='scene'){ return '<div class="ob-scene"><span class="ob-scene-e">'+E(m.e||'🏠')+'</span><p>'+E(m.t||'')+'</p></div>'; }
  if(m.type==='chant'){ return '<div class="ob-chant">'+(m.lines||[]).map(l=>'<p>🎵 '+E(l)+'</p>').join('')+'</div>'; }
  if(m.type==='move'){ return '<div class="ob-move"><span>🧍</span><p>'+E(m.t||'Stand up!')+'</p></div>'; }
  if(MODELS2[m.type]) return MODELS2[m.type](m);
  }catch(e){} return ''; }
/* MORE PICTURE MODELS for grades 4-8 (row M2, HoS 2026-11-27 "much better informative graphics"): information only, never buttons.
   angle  {type:'angle', a:10, b:55, show:true}          a half protractor with two rays at a and b degrees; show:false hides the size
   lplot  {type:'lplot', d:8, vals:[1,2,3], xs:[2,4,1], unit:'inch'}   a line plot: Xs stacked over each value (vals are tops over d)
   rect   {type:'rect', w:5, h:3, unit:'ft', edge:false}  a rectangle of unit squares with its sides labeled; edge:true lights the edge
   scatter{type:'scatter', pts:[[1,23],[2,25]], line:[2,20], odd:[9,8]}   a scatter plot, an optional trend line y = m x + b, an outlier ring
   table  {type:'table', head:['','Chess','Ball'], rows:[['7th','13','10']], hi:[[0,1]]}   a small two-way table; hi lights cells (row, col)
   grid   {type:'grid', n:6, pts:[[3,2,'A'],[3,-2,"A'"]], mirror:'x', arrow:true}   a coordinate grid with labeled points (mirror lights an axis)
   tri    {type:'tri', a:'70°', b:'60°', c:'?', ext:'?'} angles at the corners  ·  {type:'tri', right:true, sides:['6','8','?']} legs and hypotenuse
   para   {type:'para', labels:{tBR:'130°', bBR:'?'}}   two parallel lines and a transversal; t/b = top or bottom crossing, TL TR BL BR = the corner
   solid  {type:'solid', kind:'cyl'|'cone'|'sphere', r:'3', h:'4'}   a cylinder, cone or sphere with its radius and height */
const NS=n=>String(Math.round(n*10)/10);
const MODELS2={
  angle(m){ const a=+m.a||0, b=+m.b||0, cx=160, cy=150, R=124, P=(d,r)=>[cx+r*Math.cos(d*Math.PI/180), cy-r*Math.sin(d*Math.PI/180)];
    let s='<svg class="ob-svgm" viewBox="0 0 320 172" role="img" aria-label="'+E(m.label||('an angle from '+a+' to '+b+' degrees'))+'">';
    s+='<path d="M'+(cx-R)+' '+cy+' A'+R+' '+R+' 0 0 1 '+(cx+R)+' '+cy+' Z" fill="#F4F7FC" stroke="#9AA6BD" stroke-width="2"/>';
    for(let d=0;d<=180;d+=10){ const o=P(d,R), i=P(d,d%30?R-8:R-14); s+='<line x1="'+NS(o[0])+'" y1="'+NS(o[1])+'" x2="'+NS(i[0])+'" y2="'+NS(i[1])+'" stroke="#9AA6BD" stroke-width="2"/>';
      if(d%30===0){ const t=P(d,R-28); s+='<text x="'+NS(t[0])+'" y="'+NS(t[1]+4)+'" font-size="12" text-anchor="middle" fill="#6B7894">'+(180-d)+'</text>'; } }
    const lo=Math.min(a,b), hi=Math.max(a,b), A1=P(180-lo,46), A2=P(180-hi,46), big=(hi-lo)>180?1:0;
    s+='<path d="M'+cx+' '+cy+' L'+NS(A1[0])+' '+NS(A1[1])+' A46 46 0 '+big+' 0 '+NS(A2[0])+' '+NS(A2[1])+' Z" fill="#FFD9C2"/>';
    [lo,hi].forEach(d=>{ const e=P(180-d,R+6); s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+NS(e[0])+'" y2="'+NS(e[1])+'" stroke="#FF7A3D" stroke-width="4" stroke-linecap="round"/>'; });
    if(m.show!==false){ const t=P(180-(lo+hi)/2,66); s+='<text x="'+NS(t[0])+'" y="'+NS(t[1]+6)+'" font-size="18" font-weight="900" text-anchor="middle" fill="#1F2A44">'+(hi-lo)+'°</text>'; }
    return s+'<circle cx="'+cx+'" cy="'+cy+'" r="4" fill="#1F2A44"/></svg>'; },
  lplot(m){ const d=+m.d||8, vals=(m.vals||[]).map(Number), xs=(m.xs||[]).map(Number), lo=Math.max(0,Math.min.apply(null,vals)-1), hi=Math.max.apply(null,vals)+1, W=320, pad=22, sx=v=>pad+(v-lo)*(W-2*pad)/Math.max(1,hi-lo), top=Math.max(1,Math.max.apply(null,xs)), H=34+top*20;
    let s='<svg class="ob-svgm" viewBox="0 0 '+W+' '+(H+38)+'" role="img" aria-label="'+E(m.label||'a line plot')+'"><line x1="'+pad+'" y1="'+H+'" x2="'+(W-pad)+'" y2="'+H+'" stroke="#1F2A44" stroke-width="3"/>';
    for(let v=lo;v<=hi;v++){ const x=sx(v); s+='<line x1="'+NS(x)+'" y1="'+(H-7)+'" x2="'+NS(x)+'" y2="'+(H+7)+'" stroke="#1F2A44" stroke-width="2"/><text x="'+NS(x)+'" y="'+(H+24)+'" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2A44">'+(v===0?'0':v===d?'1':v+'/'+d)+'</text>'; }
    vals.forEach((v,i)=>{ for(let k=0;k<(xs[i]||0);k++) s+='<text x="'+NS(sx(v))+'" y="'+(H-12-k*20)+'" font-size="20" font-weight="900" text-anchor="middle" fill="#FF7A3D">×</text>'; });
    return s+(m.unit?'<text x="'+(W-pad)+'" y="'+(H+36)+'" font-size="11" text-anchor="end" fill="#6B7894">'+E(m.unit)+'</text>':'')+'</svg>'; },
  rect(m){ const w=Math.max(1,Math.min(14,+m.w||1)), h=Math.max(1,Math.min(10,+m.h||1)), c=Math.min(26,Math.floor(250/w)), X=40, Y=12, u=E(m.unit||'');
    let s='<svg class="ob-svgm" viewBox="0 0 '+(X+w*c+20)+' '+(Y+h*c+34)+'" role="img" aria-label="'+E(m.label||('a rectangle '+w+' by '+h))+'">';
    for(let i=0;i<w;i++) for(let j=0;j<h;j++) s+='<rect x="'+(X+i*c)+'" y="'+(Y+j*c)+'" width="'+c+'" height="'+c+'" fill="'+(m.edge?'#fff':'#CDEBC0')+'" stroke="#9AA6BD" stroke-width="1"/>';
    s+='<rect x="'+X+'" y="'+Y+'" width="'+(w*c)+'" height="'+(h*c)+'" fill="none" stroke="'+(m.edge?'#FF7A3D':'#1F2A44')+'" stroke-width="'+(m.edge?5:2.5)+'"/>';
    s+='<text x="'+(X+w*c/2)+'" y="'+(Y+h*c+24)+'" font-size="14" font-weight="800" text-anchor="middle" fill="#1F2A44">'+w+' '+u+'</text><text x="'+(X-8)+'" y="'+(Y+h*c/2+5)+'" font-size="14" font-weight="800" text-anchor="end" fill="#1F2A44">'+h+' '+u+'</text>';
    return s+'</svg>'; },
  scatter(m){ const pts=(m.pts||[]).map(p=>[+p[0],+p[1]]), mx=Math.max(1,+m.maxX||Math.max.apply(null,pts.map(p=>p[0]))+1), my=Math.max(1,+m.maxY||Math.max.apply(null,pts.map(p=>p[1]))+5), W=300, H=170, L=34, B=24, sx=x=>L+x*(W-L-10)/mx, sy=y=>H-B-y*(H-B-10)/my;
    let s='<svg class="ob-svgm" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+E(m.label||'a scatter plot')+'"><line x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-6)+'" y2="'+(H-B)+'" stroke="#1F2A44" stroke-width="2"/><line x1="'+L+'" y1="'+(H-B)+'" x2="'+L+'" y2="6" stroke="#1F2A44" stroke-width="2"/>';
    s+='<text x="'+(W-6)+'" y="'+(H-6)+'" font-size="11" text-anchor="end" fill="#6B7894">'+E(m.x||'x')+'</text><text x="'+(L+4)+'" y="14" font-size="11" fill="#6B7894">'+E(m.y||'y')+'</text>';
    if(m.line){ const k=+m.line[0], c=+m.line[1]; s+='<line x1="'+NS(sx(0))+'" y1="'+NS(sy(c))+'" x2="'+NS(sx(mx))+'" y2="'+NS(sy(k*mx+c))+'" stroke="#3B6FD8" stroke-width="3" stroke-dasharray="7 5"/>'; }
    pts.forEach(p=>{ s+='<circle cx="'+NS(sx(p[0]))+'" cy="'+NS(sy(p[1]))+'" r="6" fill="#FF7A3D"/>'; });
    if(m.odd) s+='<circle cx="'+NS(sx(+m.odd[0]))+'" cy="'+NS(sy(+m.odd[1]))+'" r="12" fill="none" stroke="#1F2A44" stroke-width="2.5"/>';
    return s+'</svg>'; },
  grid(m){ const n=Math.max(2,Math.min(8,+m.n||6)), W=240, c=W/(2*n), X=v=>W/2+v*c, Y=v=>W/2-v*c;
    let s='<svg class="ob-svgm ob-sq" viewBox="-14 -14 '+(W+28)+' '+(W+28)+'" role="img" aria-label="'+E(m.label||'a coordinate grid')+'">';
    for(let v=-n;v<=n;v++){ s+='<line x1="'+X(v)+'" y1="0" x2="'+X(v)+'" y2="'+W+'" stroke="#E4E9F2" stroke-width="1"/><line x1="0" y1="'+Y(v)+'" x2="'+W+'" y2="'+Y(v)+'" stroke="#E4E9F2" stroke-width="1"/>'; }
    s+='<line x1="0" y1="'+(W/2)+'" x2="'+W+'" y2="'+(W/2)+'" stroke="'+(m.mirror==='x'?'#3B6FD8':'#1F2A44')+'" stroke-width="'+(m.mirror==='x'?4:2)+'"/><line x1="'+(W/2)+'" y1="0" x2="'+(W/2)+'" y2="'+W+'" stroke="'+(m.mirror==='y'?'#3B6FD8':'#1F2A44')+'" stroke-width="'+(m.mirror==='y'?4:2)+'"/>';
    s+='<text x="'+(W+2)+'" y="'+(W/2-5)+'" font-size="12" fill="#6B7894" text-anchor="end">x</text><text x="'+(W/2+6)+'" y="8" font-size="12" fill="#6B7894">y</text>';
    const P=m.pts||[]; if(m.arrow&&P.length>1) s+='<line x1="'+X(+P[0][0])+'" y1="'+Y(+P[0][1])+'" x2="'+X(+P[1][0])+'" y2="'+Y(+P[1][1])+'" stroke="#FF7A3D" stroke-width="2.5" stroke-dasharray="6 5"/>';
    P.forEach((p,i)=>{ const x=X(+p[0]), y=Y(+p[1]); s+='<circle cx="'+x+'" cy="'+y+'" r="7" fill="'+(i?'#3B6FD8':'#FF7A3D')+'"/><text x="'+(x+9)+'" y="'+(y-8)+'" font-size="13" font-weight="900" fill="#1F2A44">'+E((p[2]||'')+' ('+p[0]+', '+p[1]+')')+'</text>'; });
    return s+'</svg>'; },
  tri(m){ const r=!!m.right, A=[30,150], B=[r?30:270,r?30:150], C=r?[230,150]:[120,28], T=(p,t)=>t?'<text x="'+p[0]+'" y="'+p[1]+'" font-size="15" font-weight="900" text-anchor="middle" fill="#1F2A44">'+E(t)+'</text>':'';
    let s='<svg class="ob-svgm" viewBox="0 0 320 180" role="img" aria-label="'+E(m.label||'a triangle')+'">';

const _sm=startMission;

      p.ob={bite, stage:bite.nf?'hook':'today', ws:0, li:0, hsel:null, wsel:null, ri:0, rmiss:0, rsel:null, oopsDone:!bite.oops, pracOk:0, t0:Date.now()}; kitSetup(p);

function dress(p){ const app=document.getElementById('app'), play=app&&app.querySelector('.play'); if(!play) return;
  [...app.children].forEach(ch=>{ if(ch!==play&&!ch.classList.contains('overlay')&&!ch.querySelector('.overlay')) ch.remove(); });

  const old=play.querySelector('.ob-head'); if(old) old.remove();
  const nf=p.ob.bite.nf, tag=(nf?{2:'🎮 TRY IT',3:'⭐ SHOW ME'}:{0:'READY CHECK',2:'🤝 DO IT WITH ME',3:'✋ YOUR TURN',4:'⭐ SHOW ME'})[d]||'', showMe=nf?d===3:d===4;
  play.insertAdjacentHTML('afterbegin',head(d,p.ob.bite.title,strip(it.q))+'<div class="ob-tag ob-qtag">'+tag+(showMe?' · one try each':'')+'</div>');

/* ---------- read-aloud ---------- */
function say(t){ t=noStar(strip(t)); if(!t) return; try{ speak(t); }catch(e){} readAlong(); }
/* read-along: the instruction's words light up one by one while it is read (Builders and up read along; Little Learners just listen) */
let raT=null; function readAlong(){ try{ clearInterval(raT); const w=[...document.querySelectorAll('.obk-say span')]; if(!w.length) return; let k=0; w.forEach(x=>x.classList.remove('on'));
  raT=setInterval(()=>{ if(k>0&&w[k-1]) w[k-1].classList.remove('on'); if(k>=w.length||!w[k].isConnected){ clearInterval(raT); return; } w[k].classList.add('on'); k++; },380); }catch(e){} }
