function progressOf(el){ const all=el.querySelectorAll('button[class*="node"]'); if(!all.length) return null; let d=0; all.forEach(b=>{ if(/\bdone\b/.test(b.className)) d++; }); return [d,all.length]; }

function steps(st,tpl){
 const out=[];

 PLAN_CORE.forEach(c=>{ try{ if(!WORLD[c]) return; const ids=worldSkills(st,c), nid=nextFor(st,c), dn=ids.some(today);
  /* v172: no reading level yet and hardly started -> the Reading step is the reading level check (opens inside the app) */
  if(c==='READ'&&typeof window.tlOpenCheck==='function'&&!(st.place&&st.place.READ)&&Object.keys(st.skills||{}).filter(id=>/^READ\./.test(id)&&st.skills[id]&&st.skills[id].m).length<3){
   out.push({i:'📖',n:'Find your reading level',s:'A quick check, then your reading is ready',done:false,btn:'<button type="button" data-hp="check" data-s="READ">Start</button>'}); return; }
  let btn='', s='';
  if(nid){ s='Next: '+skillName(nid); btn=`<button type="button" data-act="start" data-id="${E(nid)}" data-c="${c}">${dn?'Keep going':'Play'}</button>`; }
  else if(bossReady(st,c)&&!st.boss[c]){ s='Boss Challenge: '+WORLD[c].boss; btn=`<button type="button" data-act="boss" data-c="${c}">Take it on</button>`; }
  else s='Everything here is done. Great work!';
  /* v197 (HoS 2026-11-15, Kodesh Quest in the curriculum): Reading and Math also offer the Quest land for his level (K to 4th grade) */
  let game=''; try{ if((c==='MATH'||c==='READ')&&typeof window.tlKQLands==='function'){ const m=/\.L(\d\d)\./.exec(String(nid||'')), pl=st.place&&st.place[c];
   const L=m?+m[1]:(pl&&(+pl.level||+pl))||1; if(L<=5){ const ls=window.tlKQLands(st,c,L); const id=ls.find(k=>{ const r=window.tlKQStars(st,k); return r[0]<r[1]; })||ls[0];
    if(id){ const w=(window.TL_KQ_LANDS||{})[id]||{name:id}; game=`<button type="button" class="hpgame" data-kk="land" data-land="${E(id)}" data-band="${E(window.tlKQBand(id,L))}" aria-label="Game: ${E(w.name)}">🎮 ${E(w.name)}</button>`; } } } }catch(e){}
  out.push({i:WORLD[c].icon,n:WORLD[c].name,s,done:dn||(!nid&&!btn),btn,game}); }catch(e){} });
 const lk=tpl.querySelector('.lkpanel');
 if(lk){ /* v156: continue the strand he is already learning (the most advanced strand with a mastered rung); if he has not started, open the panel so he picks */
  const trs=[...lk.querySelectorAll('.tr')].filter(tr=>tr.querySelector('.lknode.done')&&tr.querySelector('.lknode.now[data-lk="go"]'));
  const tr=trs.length?trs[trs.length-1]:null, b=tr?tr.querySelector('.lknode.now[data-lk="go"]'):null;
  const dn=Object.keys(st.skills||{}).some(id=>/^(LK|HEB)\./.test(id)&&today(id)), strand=tr?(tr.querySelector('.tn')||{}).firstChild:null;
  out.push({i:'📜',n:'Limudei Kodesh',s:b?((strand&&strand.textContent?strand.textContent.trim()+': ':'')+b.textContent.replace(/^[▶\s]+/,'')):'Choose your learning: Kriyah, Chumash, Rashi, Mishnayos, Gemara',done:dn,
   btn:b?`<button type="button" data-lk="go" data-id="${E(b.dataset.id)}">${dn?'Keep going':'Play'}</button>`:`<button type="button" data-hp="open" data-k="lkpanel">Choose</button>`}); }
 /* v151 HoS 2026-11-13: Science or Social Studies is part of the plan too, one of them each day (even days Science, odd days Social Studies). */
 const sw=(new Date().getDay()%2===0)?[['scipanel','🔬','Science','SCI'],['sspanel','🌍','Social Studies','SS']]:[['sspanel','🌍','Social Studies','SS'],['scipanel','🔬','Science','SCI']];
 for(const [k,ic,nm,pre] of sw){ const el=tpl.querySelector('.'+k); if(!el) continue;
  const b=el.querySelector('button[class*="node"].now:not([disabled])')||el.querySelector('button[data-id]:not([disabled])');
  const re=new RegExp('^'+pre+'\\.'), dn=Object.keys(st.skills||{}).some(id=>re.test(id)&&today(id));
  let btn;
  if(b){ const c=b.cloneNode(false); c.className=''; c.removeAttribute('aria-label'); c.textContent=dn?'Keep going':'Play'; btn=c.outerHTML; }
  else btn=`<button type="button" data-hp="open" data-k="${k}">Open</button>`;
  out.push({i:ic,n:nm,s:b?('Next: '+b.textContent.replace(/^[▶\s]+/,'')):(el.querySelector('p, small')||{textContent:'Open to see your next step'}).textContent.trim().slice(0,70),done:dn,btn});
  break; }
 return out;
}
