<script>
/* ArenaPage.html — v212 (takeover3, Head of School 2026-11-15: "a Chavrusa Arena … any subject … a clear winner that gains something").
   קִנְאַת סוֹפְרִים תַּרְבֶּה חָכְמָה. The boy's side of Arena.js.
   - LIVE DUEL: pick a subject (every subject in BANK_ALL) and a topic, or "Mix of what I mastered"; 10 questions are built from the
     lessons' tap questions; arOpen gives a 4-digit code; the chavrusa joins with the code; both answer the same questions while each sees
     the other's candles; the server checks every answer and decides the winner.
   - KINAS SOFRIM ENDING: both see the other's misses with the right answers; the one who did not win taps "He taught me" → teaching bonus.
   - REWARDS (server-side, Arena.js): Arena points (play 1, win +3, tie +1, teach +2), a title that rises with points, and trophies.
   - SHTENDER DUEL: two boys on one Chromebook, taking turns (practice, no points).
   Every answer is saved like any answer (evidence, phase 'arena'), so it lights the Olam Haba cloud (Kodesh brightest).
   Loaded after TorahTracks, before ClassMode (Photos.js and Speed.js). No "double slash" in this file. */
(function(){
if(typeof render!=='function'||typeof vHub!=='function'||typeof A==='undefined'||typeof BANK_ALL==='undefined') return;
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuf=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const SUBJ=[['LK','Kodesh','📜'],['HEB','Lashon Hakodesh','א'],['MATH','Math','➗'],['READ','Reading','📖'],['WRIT','Writing','✏️'],['LANG','Language','🔤'],['SCI','Science','🔬'],['SOC','Social Studies','🌎'],['SS','Social Studies','🌎'],['COMP','Computing','💻'],['ELEC','Electives','⚛️'],['LIFE','Life Skills','🧭'],['ART','Arts','🎨'],['FF','Fact Finders','🔎']];
const TITLES=[[0,'Talmid','תַּלְמִיד'],[10,'Chaver','חָבֵר'],[30,'Bar Plugta','בַּר פְּלוּגְתָּא'],[60,'Lamdan','לַמְדָן'],[120,'Charif','חָרִיף'],[200,'Talmid Chacham','תַּלְמִיד חָכָם'],[350,'Gaon','גָּאוֹן']];
const R={ g:null, cpoll:null, cev:{}, qsSent:false, v:'home', stats:null, busy:false, m:null, code:'', i:0, picked:{}, fb:null, poll:null, subj:null, filt:'', pp:null, err:'' };
function title(p){ let t=TITLES[0], nx=null; TITLES.forEach((x,k)=>{ if(p>=x[0]){ t=x; nx=TITLES[k+1]||null; } }); return {t:t,nx:nx}; }
function trophies(s){ const T=[]; if(!s) return T; [[1,'🥉','First win'],[5,'🥈','5 wins'],[10,'🥇','10 wins'],[25,'🏆','25 wins'],[50,'👑','50 wins']].forEach(x=>{ if(s.wins>=x[0]) T.push([x[1],x[2]]); });
 [[1,'🕯️','Taught a chavrusa'],[5,'📚','Taught 5 times'],[15,'🌟','Rebbe of the Arena: taught 15']].forEach(x=>{ if(s.taught>=x[0]) T.push([x[1],x[2]]); });
 Object.keys(s.subj||{}).forEach(k=>{ if(s.subj[k]>=3){ const S=SUBJ.find(x=>x[0]===k); if(S) T.push([S[2],S[1]+' champion']); } }); return T; }
/* ---------- questions from the lessons ---------- */
const okItem=it=>it&&typeof it==='object'&&(!it.t||it.t==='mc')&&typeof it.q==='string'&&it.q.length<300&&Array.isArray(it.o)&&it.o.length>=2&&it.o.length<=6&&it.o.every(x=>typeof x==='string'&&x&&x.length<160&&x.indexOf('<')<0)&&new Set(it.o).size===it.o.length&&!(it.pic&&(typeof it.pic!=='string'||it.pic.indexOf('<')>=0||it.pic.length>120));
/* math and other generated skills (GEN[id].gen()): number answers become 4 choices close to the right one */
function genMc(it){ if(!it||typeof it.q!=='string') return null; if(okItem(it)) return it;
 const a=typeof it.a==='number'?it.a:(/^-?\d+(\.\d+)?$/.test(String(it.a||''))?Number(it.a):null); if(a===null) return null;
 const step=Math.abs(a)>=100?10:(Math.abs(a)>=20?2:1), cand=shuf([a+step,a-step,a+1,a-1,a+10,a*2,a+step*2]).filter(x=>x!==a&&x>=0&&String(x)!==String(a));
 const d=[...new Set(cand.map(x=>Math.round(x*100)/100))].slice(0,3); if(d.length<2) return null;
 const u=it.unit?String(it.unit):''; const f=x=>u==='¢'?x+'¢':(u==='$'?'$'+x:String(x)); return {q:it.q.replace(/\s*\(type[^)]*\)/i,''), o:[f(a)].concat(d.map(f))}; }
function genItems(id,n){ const g=(typeof GEN!=='undefined')&&GEN[id]; if(!g||typeof g.gen!=='function') return []; const out=[], seen=new Set();
 for(let t=0;t<n*4&&out.length<n;t++){ let it=null; try{ it=genMc(g.gen()); }catch(e){} if(it&&!seen.has(it.q)){ seen.add(it.q); out.push({id:id,it:it}); } } return out; }
function itemsOf(id){ if(typeof GEN!=='undefined'&&GEN[id]&&!BANK_ALL[id]) return genItems(id,14); const sk=BANK_ALL[id]; if(!sk) return []; const out=[]; ['teach','practice','check'].forEach(ph=>(sk[ph]||[]).forEach(it=>{ if(okItem(it)) out.push({id:id,it:it}); })); return out; }
function subjOf(id){ return String(id).split('.')[0]; }
function skillName(id){ const s=BANK_ALL[id]||((typeof GEN!=='undefined')&&GEN[id]); return (s&&s.name)||id; }
function mastered(id){ try{ const s=A.st&&A.st.skills&&A.st.skills[id]; return !!(s&&s.m); }catch(e){ return false; } }
let SKC=null;
function skillsBy(){ if(SKC) return SKC; SKC={}; const all=Object.keys(BANK_ALL).concat(typeof GEN!=='undefined'?Object.keys(GEN).filter(k=>!BANK_ALL[k]):[]); all.forEach(id=>{ const k=subjOf(id); if(!SUBJ.some(x=>x[0]===k)) return; const n=itemsOf(id).length; if(n>=5) (SKC[k]=SKC[k]||[]).push(id); }); return SKC; }
function build(ids,n){ let pool=[]; ids.forEach(id=>{ pool=pool.concat(itemsOf(id)); }); const seen=new Set(); pool=shuf(pool).filter(x=>{ if(seen.has(x.it.q)) return false; seen.add(x.it.q); return true; }).slice(0,n||10);
 return pool.map(x=>{ const o=shuf(x.it.o); return {q:x.it.q, o:o, pic:x.it.pic||'', a:o.indexOf(x.it.o[0]), id:x.id}; }); }
/* ---------- server ---------- */
function call(fn,...a){ return run(fn,SRV.token,...a); }
function loadStats(){ call('arMyStats').then(s=>{ R.stats=s; if(document.getElementById('ar-ov')&&R.v==='home') draw(); }).catch(()=>{}); }
function startPoll(){ stopPoll(); R.poll=setInterval(()=>{ if(!R.m) return; call('arPoll',R.m.code).then(v=>{ const prev=R.m&&R.m.state; R.m=Object.assign(R.m,v); if(R.v==='wait'&&v.state==='go'){ R.v='count'; } if((R.v==='play'||R.v==='waitEnd')&&v.state==='done'){ R.v='done'; stopPoll(); loadStats(); try{ if(typeof saveStudent==='function') saveStudent(A.st); }catch(e){} } draw(); }).catch(e=>{ R.err=msg(e); }); },1500); }
function stopPoll(){ if(R.poll){ clearInterval(R.poll); R.poll=null; } }
function msg(e){ return String(e&&e.message||e||'Something went wrong.').replace(/^Error:\s*/,''); }
/* v227 (HoS: "Arena is regular learning, it earns the regular stuff"): each different right answer is its own item, so it pays T$ like any lesson
   (msCheckPay_: $1 a right answer, +50c on the first try, the normal cap per skill). Before, every Arena answer had the same item name, so a skill paid only once. */
function ev(id,ok,qt){  try{ if(typeof SRV!=='undefined'&&SRV&&Array.isArray(SRV.pendingEv)&&A.st){ SRV.pendingEv.push({at:Date.now(),student:A.st.id,skill:String(id),phase:'arena',item:'Arena: '+String(qt||'').replace(/\s+/g,' ').slice(0,100),first:!!ok,tries:1,hints:0,ms:0,ok:!!ok}); if(SRV.pendingEv.length>50) SRV.pendingEv.splice(0,SRV.pendingEv.length-50); } }catch(e){} }

function open(){ css(); R.v='home'; R.err=''; cfLoad(); let ov=document.getElementById('ar-ov'); if(!ov){ ov=document.createElement('div'); ov.id='ar-ov'; document.body.appendChild(ov); ov.addEventListener('click',onClick); ov.addEventListener('input',e=>{ if(e.target.classList.contains('srch')){ R.filt=e.target.value; const l=ov.querySelector('.tlist'); if(l) l.innerHTML=topicList(); } }); }
 loadStats(); draw(); try{ if(typeof SND!=='undefined') SND.tap(); }catch(e){} }
function close(){ if(R.cfTick){ clearInterval(R.cfTick); R.cfTick=null; } stopPoll(); if(R.cpoll){ clearInterval(R.cpoll); R.cpoll=null; } const ov=document.getElementById('ar-ov'); if(ov) ov.remove(); R.m=null; try{ render(); }catch(e){} }

function draw(){ const ov=document.getElementById('ar-ov'); if(!ov) return; const keep=ov.scrollTop; let h='';
 const v=R.v; if(v==='home') h=homeH(); else if(v==='subj') h=subjH(); else if(v==='topic') h=topicH(); else if(v==='wait') h=waitH(); else if(v==='join') h=joinH(); else if(v==='count') h=countH(); else if(v==='play') h=playH(); else if(v==='waitEnd') h=waitEndH(); else if(v==='done') h=doneH(); else if(v==='pp') h=ppH(); else if(v==='class') h=classH(); else if(v==='cf') h=cfH(); else if(v==='cfdone') h=cfDoneH();
 ov.innerHTML=head()+'<div class="in">'+(R.err?'<div class="err">'+E(R.err)+'</div>':'')+h+'</div>'; if(v==='topic'||v==='done') ov.scrollTop=keep; }
function homeH(){ const s=R.stats, p=s?s.pts:0, T=title(p), tr=trophies(s);
 return '<div class="card"><div style="display:flex;gap:12px;align-items:center"><div style="font-size:46px">🏅</div><div style="flex:1"><div class="big">'+E(T.t[1])+' <span style="font:700 20px Times New Roman,serif;color:#ffe8a3">'+T.t[2]+'</span></div>'
  +'<div>'+(s?'<span class="pts">'+p+' Arena points</span> '+s.wins+' win'+(s.wins===1?'':'s')+' · '+s.played+' duel'+(s.played===1?'':'s')+' · taught '+s.taught:'Loading your record…')+'</div>'

  +'<button class="btn" data-ar="new">⚔️ Start a duel<small>Pick any subject. Get a code. Your chavrusa joins.</small></button>'

/* v225 PARSHA SIYUM: the 54 parshiyos; a Parsha counts when he gets 7+ right in a Parsha duel or challenge (Arena.js arPoints_ pars) */
function siyumH(){ const T=window.tlChm; if(!T||!T.parshiyos||!R.stats) return ''; const done=new Set(R.stats.pars||[]), P=T.parshiyos, n=P.filter(x=>done.has(x)).length;

 if(!R.syOpen) return '<div class="card" style="display:flex;gap:10px;align-items:center"><div style="font-size:30px">📜</div><div style="flex:1"><b>Parsha Siyum</b><div class="prog">'+n+' of 54 parshiyos'+(medals.length?' · 🏅 '+medals.map(f=>f[0]).join(', '):'')+(n===54?' · 👑 SIYUM HATORAH!':'')+'</div><div style="height:8px;border-radius:9px;background:#fdf6e322;margin-top:6px"><i style="display:block;height:100%;width:'+Math.round(100*n/54)+'%;border-radius:9px;background:linear-gradient(90deg,#f2b84b,#ffe8a3)"></i></div></div><button class="x" data-ar="syopen">Chart ▾</button></div>';
 return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>📜 Parsha Siyum · '+n+' of 54</b><button class="x" data-ar="syopen">▴</button></div><div class="prog">Get 7 or more right in a Parsha duel or challenge to stamp a Parsha. Finish a sefer for a medal; all 54 is a Siyum HaTorah!</div>'

 if(a==='cfjoin'){ R.mode='cfjoin'; R.code=''; R.v='join'; return draw(); }
 if(a==='cftake'){ return cfTake(b.dataset.code); }
 if(a==='cfans'){ const c=R.cf, i=c.i; if(c.picked[i]||R.busy) return; const k=+b.dataset.k; R.busy=true; c.picked[i]={c:k,pending:true};
  call('arCfAns',c.code,i,k).then(r=>{ R.busy=false; c.picked[i]={c:k,ok:!!r.ok,right:r.right}; ev(c.qs[i].id,r.ok,c.qs[i].q); try{ if(typeof SND!=='undefined'){ if(r.ok&&SND.ok) SND.ok(); else if(!r.ok&&SND.no) SND.no(); } }catch(x){} draw();
   setTimeout(()=>{ if(R.v!=='cf') return; if(c.i<c.qs.length-1){ c.i++; draw(); } else { call('arCfDone',c.code).then(x=>{ R.cfr=x; R.v='cfdone'; if(R.cfTick){ clearInterval(R.cfTick); R.cfTick=null; } loadStats(); try{ if(typeof saveStudent==='function') saveStudent(A.st); }catch(e){} draw(); }).catch(err=>{ R.err=msg(err); draw(); }); } },900); }).catch(err=>{ R.busy=false; delete c.picked[i]; R.err=msg(err); draw(); }); return; }
 if(a==='cjoin'){ R.mode='class'; R.code=''; R.v='join'; return draw(); }
 if(a==='cans'){ const g=R.g; if(!g||!g.q||(g.me&&g.me.mine)||R.busy) return; R.busy=true; const c=+b.dataset.k; g.me=g.me||{}; g.me.mine={c:c}; draw(); call('chAnswer',g.code,g.i,c).then(v=>{ R.busy=false; R.g=v; draw(); }).catch(err=>{ R.busy=false; R.err=msg(err); draw(); }); return; }
 if(a==='subj'){ R.subj=b.dataset.k; R.filt=''; R.v='topic'; return draw(); }
 if(a==='plv'){ R.plv=+b.dataset.n; return draw(); }
 if(a==='ptopic'){ if(R.busy) return; R.busy=true; const nm=b.dataset.p, lv=R.plv||((A.st&&A.st.chm&&A.st.chm.lv)||3); b.innerHTML='<span>Opening Parshas '+E(nm)+'… 📜</span>';
  let done=false; const to=setTimeout(()=>{ if(done) return; done=true; R.busy=false; R.err='The Parsha could not open just now. Try again.'; draw(); },20000);
  window.tlChm.quiz(nm,lv,10,qs=>{ if(done) return; done=true; clearTimeout(to); R.busy=false; R.subj='PAR'; goWith(qs,'Parshas '+nm+' (Level '+lv+')',b); }); return; }
 if(a==='topic'||a==='mix'){ const ids=a==='mix'?topicIds().filter(mastered):[b.dataset.id]; const qs=build(ids,10); const S=SUBJ.find(x=>x[0]===R.subj)||['','','']; const label=a==='mix'?S[1]+': mix of what I mastered':skillName(ids[0]);
  return goWith(qs,label,b); }
 return onClick2(e,b,a);
}
/* v229 MAKSHAN MODE (grades 6-8, kinas sofrim): the chavrusa gives an answer to every question. Half the time he is right, half the time he is wrong.
   Agree when he is right; when he is wrong, ask the kasha AND give the right answer. Built from the same questions, so every subject works;
   the server needs nothing new (each question still has one right option). A question whose answer has Hebrew stays a plain question. */
const MK_WHO=['Your chavrusa','Reuven','Shimon','Levi','Yehuda','Dan','Naftali','Gad','Asher','Yissachar','Zevulun','Binyamin'];
function mkQ1(q,k){ const o=(q.o||[]).map(String), R0=o[q.a]; if(R0==null||o.some(x=>/[\u0590-\u05FF]/.test(x))||o.length<2) return q;
 const W=o.filter((x,j)=>j!==q.a).sort(()=>Math.random()-.5), wrongClaim=Math.random()<.5, claim=wrongClaim?W[0]:R0, who=MK_WHO[k%MK_WHO.length];
 const ks=(wrongClaim?[R0].concat(W.slice(1,2)):W.slice(0,2)).sort(()=>Math.random()-.5);
 const opts=['✅ Agree: that is right'].concat(ks.map(x=>'🧐 Kasha! It is: '+x)), a=wrongClaim?opts.indexOf('🧐 Kasha! It is: '+R0):0;
 return Object.assign({},q,{q:String(q.q).replace(/\s+$/,'')+'  🗣️ '+who+' says: “'+claim+'”. Agree, or kasha?',o:opts,a:a}); }
function goWith(qs,label,b){ const a='go'; if(R.mk){ qs=qs.map(mkQ1); label=label+' · Makshan'; }
  if(qs.length<5){ R.err='This topic does not have enough questions for a duel yet. Pick another one!'; return draw(); }
  if(R.mode==='pp'){ R.pp=Object.assign(R.pp,{step:'play',qs:qs,label:label,p:0,i:0,s:[0,0],c:[[],[]],pick:null}); R.v='pp'; return draw(); }
  if(R.mode==='cf'){ if(R.busy) return; R.busy=true; if(b) b.disabled=true; call('arCfMake',{subject:R.subj,label:label,qs:qs}).then(x=>{ R.busy=false; R.cf={code:x.code,qs:x.qs,label:x.label,i:0,picked:{},maker:true,start:Date.now()}; R.v='cf'; draw(); }).catch(err=>{ R.busy=false; R.err=msg(err); draw(); }); return; }
  if(R.busy) return; R.busy=true; if(b) b.disabled=true;
  call('arOpen',{subject:R.subj,topic:label,label:label,qs:qs}).then(v=>{ R.busy=false; R.m=v; R.v='wait'; draw(); startPoll(); }).catch(err=>{ R.busy=false; R.err=msg(err); draw(); }); return; }
function onClick2(e,b,a){
 if(a==='key'){ const k=b.dataset.k; if(k==='⌫') R.code=R.code.slice(0,-1); else if(k==='✓'){ if(R.mode==='cfjoin'){ if(R.code.length!==5){ R.err='A challenge code has 5 numbers.'; return draw(); } R.busy=false; return cfTake(R.code); } if(R.code.length!==4){ R.err='The code has 4 numbers.'; return draw(); } if(R.busy) return; R.busy=true;
   if(R.mode==='class'){ call('chJoin',R.code).then(v=>{ R.busy=false; R.g=v; R.v='class'; R.cev={}; chNeed(v); draw(); chPoll(); }).catch(err=>{ R.busy=false; R.err=msg(err); draw(); }); return; }
   call('arJoin',R.code).then(v=>{ R.busy=false; R.m=v; R.v='count'; draw(); startPoll(); }).catch(err=>{ R.busy=false; R.err=msg(err); draw(); }); return; } else if(R.code.length<(R.mode==='cfjoin'?5:4)) R.code+=k; return draw(); }
 if(a==='ans'){ const i=R.i; if(R.picked[i]||R.busy) return; const c=+b.dataset.k; R.busy=true; R.picked[i]={c:c,pending:true}; b.style.outline='3px solid #f2b84b';
  call('arAnswer',R.m.code,i,c).then(r=>{ R.busy=false; R.picked[i]={c:c,ok:!!r.ok,right:r.right}; R.m=Object.assign(R.m,r.view); ev(R.m.qs[i].id,r.ok,R.m.qs[i].q); try{ if(typeof SND!=='undefined'){ if(r.ok&&SND.ok) SND.ok(); else if(!r.ok&&SND.no) SND.no(); } }catch(x){} draw();
   setTimeout(()=>{ if(R.v!=='play') return; if(R.i<R.m.n-1){ R.i++; draw(); } else { R.v=R.m.state==='done'?'done':'waitEnd'; if(R.v==='done'){ stopPoll(); loadStats(); } draw(); } },900); }).catch(err=>{ R.busy=false; delete R.picked[i]; R.err=msg(err); draw(); }); return; }
 if(a==='ppans'){ const P=R.pp; if(P.pick) return; const c=+b.dataset.k, q=P.qs[P.i], ok=c===q.a; P.pick={c:c,ok:ok,right:q.a}; P.c[P.p][P.i]=c; if(ok) P.s[P.p]++; if(P.p===0) ev(q.id,ok,q.q); draw();
  setTimeout(()=>{ P.pick=null; if(P.i<P.qs.length-1){ P.i++; } else if(P.p===0){ P.p=1; P.i=0; P.step='pass'; } else { P.step='done'; try{ if(typeof saveStudent==='function') saveStudent(A.st); }catch(x){} } draw(); },900); return; }
 if(a==='ppnext'){ R.pp.step='play'; return draw(); }
 if(a==='taught'){ if(R.busy) return; R.busy=true; call('arTeach',R.m.code).then(r=>{ R.busy=false; R.m.taught=true; draw(); }).catch(err=>{ R.busy=false; R.err=msg(err); draw(); }); return; }
}
