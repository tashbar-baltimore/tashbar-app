   - SHTENDER DUEL: two boys on one Chromebook, taking turns (practice, no points).

   "And the winner is…", confetti, and a one-tap REMATCH. Answer with 1-6 or A-F; the code joins by itself on the last digit.
   v358 ARENA 2.0 (takeover2, HoS 2026-11-17: "super upgrade the chavrusa duel arena … creativity and ambition and excitement"), all server-checked in Arena.js:
   AVATARS on the podiums; LIGHTNING ROUND (20 questions, 75 seconds, a live fuse); three POWER-UPS once a duel (✂️ Split, 🛡️ Second Chance,
   ⚡ Double); kind CHEERS that fly to the chavrusa's screen (fixed messages only); an announcer (FINAL QUESTION, comeback, UNSTOPPABLE);
   the HANDSHAKE ending (both tap Yasher Koach: +1 each); WEEKLY QUESTS on the Arena home; new trophies (🤝 Mentsch, ⚡ Lightning). */

function trophies(s){ const T=[]; if(!s) return T; [[1,'🥉','First win'],[5,'🥈','5 wins'],[10,'🥇','10 wins'],[25,'🏆','25 wins'],[50,'👑','50 wins']].forEach(x=>{ if(s.wins>=x[0]) T.push([x[1],x[2]]); });

 [[1,'🤝','Good sport'],[10,'💛','Mentsch of the Arena: 10 handshakes']].forEach(x=>{ if((s.shakes||0)>=x[0]) T.push([x[1],x[2]]); }); [[1,'⚡','Lightning winner'],[5,'🌩️','Storm master: 5 Lightning wins']].forEach(x=>{ if((s.lwins||0)>=x[0]) T.push([x[1],x[2]]); });
 Object.keys(s.subj||{}).forEach(k=>{ if(s.subj[k]>=3){ const S=SUBJ.find(x=>x[0]===k); if(S) T.push([S[2],S[1]+' champion']); } }); return T; }
/* ---------- questions from the lessons ---------- */
const okItem=it=>it&&typeof it==='object'&&(!it.t||it.t==='mc')&&typeof it.q==='string'&&it.q.length<300&&Array.isArray(it.o)&&it.o.length>=2&&it.o.length<=6&&it.o.every(x=>typeof x==='string'&&x&&x.length<160&&x.indexOf('<')<0)&&new Set(it.o).size===it.o.length&&!(it.pic&&(typeof it.pic!=='string'||it.pic.indexOf('<')>=0||it.pic.length>120));
/* math and other generated skills (GEN[id].gen()): number answers become 4 choices close to the right one */
function genMc(it){ if(!it||typeof it.q!=='string') return null; if(okItem(it)) return it;
 const a=typeof it.a==='number'?it.a:(/^-?\d+(\.\d+)?$/.test(String(it.a||''))?Number(it.a):null); if(a===null) return null;
 const step=Math.abs(a)>=100?10:(Math.abs(a)>=20?2:1), cand=shuf([a+step,a-step,a+1,a-1,a+10,a*2,a+step*2]).filter(x=>x!==a&&x>=0&&String(x)!==String(a));
 const d=[...new Set(cand.map(x=>Math.round(x*100)/100))].slice(0,3); if(d.length<2) return null;
 const u=it.unit?String(it.unit):''; const f=x=>u==='¢'?x+'¢':(u==='$'?'$'+x:String(x)); return {q:it.q.replace(/\s*\(type[^)]*\)/i,''), o:[f(a)].concat(d.map(f))}; }
function genItems(id,n){ const g=(typeof GEN!=='undefined')&&GEN[id]; if(!g||typeof g.gen!=='function') return []; const out=[], seen=new Set();
 for(let t=0;t<n*4&&out.length<n;t++){ let it=null; try{ it=genMc(g.gen()); }catch(e){} if(it&&!seen.has(it.q)){ seen.add(it.q); out.push({id:id,it:it}); } } return out; }
function itemsOf(id){ if(typeof GEN!=='undefined'&&GEN[id]&&!BANK_ALL[id]) return genItems(id,14); const sk=BANK_ALL[id]; if(!sk) return []; const out=[]; ['teach','practice','check'].forEach(ph=>(sk[ph]||[]).forEach(it=>{ if(okItem(it)) out.push({id:id,it:it}); })); return out; }
function subjOf(id){ return String(id).split('.')[0]; }

let SKC=null;
function skillsBy(){ if(SKC) return SKC; SKC={}; const all=Object.keys(BANK_ALL).concat(typeof GEN!=='undefined'?Object.keys(GEN).filter(k=>!BANK_ALL[k]):[]); all.forEach(id=>{ const k=subjOf(id); if(!SUBJ.some(x=>x[0]===k)) return; const n=new Set(itemsOf(id).map(x=>x.it.q)).size; if(n>=5) (SKC[k]=SKC[k]||[]).push(id); }); return SKC; }
function build(ids,n){ let pool=[]; ids.forEach(id=>{ pool=pool.concat(itemsOf(id)); }); const seen=new Set(); pool=shuf(pool).filter(x=>{ if(seen.has(x.it.q)) return false; seen.add(x.it.q); return true; }).slice(0,n||10);

function call(fn,...a){ return run(fn,SRV.token,...a); }

function themEv(){ try{ const m=R.m; if(!m||!m.them||(R.v!=='play'&&R.v!=='waitEnd')) return; const ts=m.them.score||0, ms=m.me.score||0;

 const medals=SF.filter(f=>P.slice(f[1],f[2]).every(x=>done.has(x)));
 if(!R.syOpen) return '<div class="card" style="display:flex;gap:10px;align-items:center"><div style="font-size:30px">📜</div><div style="flex:1"><b>Parsha Siyum</b><div class="prog">'+n+' of 54 parshiyos'+(medals.length?' · 🏅 '+medals.map(f=>f[0]).join(', '):'')+(n===54?' · 👑 SIYUM HATORAH!':'')+'</div><div style="height:8px;border-radius:9px;background:#fdf6e322;margin-top:6px"><i style="display:block;height:100%;width:'+Math.round(100*n/54)+'%;border-radius:9px;background:linear-gradient(90deg,#f2b84b,#ffe8a3)"></i></div></div><button class="x" data-ar="syopen">Chart ▾</button></div>';
 return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>📜 Parsha Siyum · '+n+' of 54</b><button class="x" data-ar="syopen">▴</button></div><div class="prog">Get 7 or more right in a Parsha duel or challenge to stamp a Parsha. Finish a sefer for a medal; all 54 is a Siyum HaTorah!</div>'
