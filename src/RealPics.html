<script>
/* PICS-1 core (2026-11-18, CLAUDE for developer@; LOG RULE+LANES 0120-ET).
   Real pictures (photos, old printed scans, screenshots of free software) on lesson screens, with a BOX, an ARROW and a LABEL
   on the part the lesson talks about (e.g. the Gemara page with Rashi boxed).
   - TL_PICS:    the picture library. id -> {file, w, h, alt, source, licence, author}. Files are served by Firebase Hosting under /pics/.
   - TL_PIC_MAP: which screen shows which picture. Key 'LESSON.ID|question text' (one screen) or 'LESSON.ID|*' (every screen of
                 that lesson that has no picture of its own). Value {id, mark:[{box:[x,y,w,h] in % of the picture, label, from}], cap, keep}. keep: true also keeps the old emoji picture.
                 from = the side the arrow comes from: 'left' | 'right' | 'top' | 'bottom' (default 'left');
                 at = where along that side the arrow points, 0..1 (default 0.5), so two labels do not sit on each other.
   Lanes ADD entries with TL_PIC_ADD({...library...}, {...map...}) in their own file; nothing in the lesson packs changes.
   The emoji/text picture stays as the fallback (no network, missing file). Picture rules (Pictures.html PIC_BAN): boys and men only,
   frum settings, kosher food, no other religions' symbols. Only wraps render(); if this file fails, lessons look as before. */
window.TL_PICS = window.TL_PICS || {};
window.TL_PIC_MAP = window.TL_PIC_MAP || {};
window.TL_PIC_ADD = function (lib, map) { Object.assign(window.TL_PICS, lib || {}); Object.assign(window.TL_PIC_MAP, map || {}); };

    source: 'Library of Congress, LC-DIG-matpc-19320', licence: 'No known restrictions (Library of Congress)', author: 'American Colony / Matson' },
  'beis-hamikdash-model-schick': { file: 'beis-hamikdash-model-schick.jpg', w: 520, h: 510, alt: 'A model of the second Beis Hamikdash, as Dr. Schick built it',
    source: 'Library of Congress, LC-DIG-matpc-00134', licence: 'No known restrictions (Library of Congress)', author: 'Dr. Conrad Schick model; photo American Colony / Matson' }

  const KING = { box: [31.5, 9.5, 36.5, 53], label: 'Gemara: the king in the middle', from: 'bottom', at: 0.5 };
  const DAFNUM = { box: [12.3, 0.2, 3.8, 2.2], label: 'Daf ב, amud aleph', from: 'bottom', at: 0.5 };

  const OHEL = { box: [46, 1, 33, 45], label: 'Ohel Moed', from: 'left', at: 0.5 };
  const MIZB = { box: [37.5, 48, 12, 16], label: 'Mizbeach', from: 'bottom', at: 0.5 };
  const GATE = { box: [16.5, 67, 19, 20], label: 'Gate', from: 'top', at: 0.3 };
  const TFMARK = [{ box: [17.5, 34.5, 17.5, 25], label: 'Shel rosh (head)', from: 'top', at: 0.5 }, { box: [73.5, 39, 17.5, 26], label: 'Shel yad (arm)', from: 'top', at: 0.5 }];
  const HORN = { box: [2, 10.5, 44, 37.5], label: 'A ram\u2019s horn', from: 'right', at: 0.15 };
  return {
    'LK.GEM.L06.01|Where on the daf are the Mishna and the Gemara?': { id: G, mark: [GEMARA, RASHI], cap: CAP },

    'LK.GEM.L07.01|Rashi 6. Where is each one printed on the daf? Sort the cards.': { id: G, mark: [], cap: 'Look at the daf.' },
    /* batch 2 (2026-11-18): more daf screens on the same page */
    'LK.GEM.L06.02|On the daf, which comes first?': { id: G, mark: [MISHNA, GEMSTART], cap: 'First the Mishna, then the Gemara starts at גמ׳' },
    'LK.GEM.L06.04|Which comes first?': { id: G, mark: [MISHNA, GEMSTART], cap: 'First the Mishna, then the Gemara starts at גמ׳' },
    'LK.GEM.L06.04|What is in the middle of the daf?': { id: G, mark: [KING], cap: CAP },

    'LK.CHU.L05.03|Mishkan Words 1. Find aron in this pasuk. What is it?': { id: MK, mark: [OHEL], cap: 'A model of the Mishkan' },
    'LK.CHU.L05.03|Mishkan Words 3. What is a korban?': { id: MK, mark: [MIZB], cap: 'A model of the Mishkan' },

    'LK.CHU.L05.06|What does Parshas Terumah tell us?': { id: MK, mark: [OHEL, MIZB, GATE], cap: 'A model of the Mishkan' },
    'LK.CHU.L05.06|Parshas Terumah is in which sefer?': { id: MK, mark: [], cap: 'A model of the Mishkan' },
    'LK.CHU.L05.03|Mishkan Words Check 3. What is the Ohel Moed?': { id: MK, mark: [], cap: 'A model of the Mishkan' },
    'LK.CHU.L05.03|Mishkan Words 7. Find mizbayach in this pasuk. What is it?': { id: MK, mark: [], cap: 'A model of the Mishkan' },
    'LK.CHU.L05.03|Mishkan Words 7. Find mizbeiach in this pasuk. What is it?': { id: MK, mark: [], cap: 'A model of the Mishkan' },
    'LK.CHU.L05.06|Sum up Bamidbar 9:15 to 23, the cloud over the Mishkan.': { id: MK, mark: [], cap: 'A model of the Mishkan' },
    'LK.CHEM.L03.04|Who destroyed the second Beis Hamikdash?': { id: 'beis-hamikdash-model-schick', mark: [], cap: 'A model of the second Beis Hamikdash' },
    'LK.CHEM.L03.04|Tap every true fact about the second Beis Hamikdash.': { id: 'beis-hamikdash-model-schick', mark: [], cap: 'A model of the second Beis Hamikdash' },
    'LK.CHEM.L03.04|Tap every way we remember the Beis Hamikdash.': { id: 'beis-hamikdash-model-schick', mark: [], cap: 'A model of the second Beis Hamikdash' },
    'LK.MSH.L04.01|The Chumash says to make tefillin. Which Torah teaches HOW to make them?': { id: TF, mark: TFMARK, cap: 'Square and black, with straps: the Torah She\u2019be\u2019al Peh teaches how' },
    'LK.MSH.L08.02|The Chumash says to make tefillin. Which Torah teaches HOW to make them?': { id: TF, mark: [], cap: 'Real tefillin' },
    'SIM.L09.01|Put a bar mitzvah boy\'s new day in order. The cards say: put on tefillin daven with the minyan wake up and say Modeh Ani': { id: TF, mark: TFMARK, cap: 'Real tefillin' },
    'ELEC.SPEAK.L02.01|Which tells one thing about a shofar: it comes from an animal\'s horn, or I like to eat pizza for supper?': { id: SH, mark: [HORN], cap: 'A real shofar' },
    'ELEC.MUS.L01.01|Is the shofar\'s blast loud, or soft?': { id: SH, mark: [], cap: 'A real shofar' },

    'ELEC.LOGIC.L02.04|If the shofar blows on Rosh Hashanah, then what do we do: listen quietly, or talk to friends?': { id: SH, mark: [], cap: 'A real shofar' }

function rpNorm(s) { return String(s || '').replace(/\s+/g, ' ').trim(); }
function rpFind(id, it) { const M = window.TL_PIC_MAP; if (!it) return null; return M[id + '|' + rpNorm(it.q)] || M[id + '|*'] || null; }
function rpEsc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
/* The box, arrow and label, drawn over the picture in % units so they stay on the right spot at any size. */
function rpMarks(mark) {
  let svg = '', labels = '';
  (mark || []).forEach((m, i) => { const [x, y, w, h] = m.box, from = m.from || 'left', L = 14, at = m.at == null ? 0.5 : Math.max(0, Math.min(1, +m.at));
    let ax, ay, bx, by;   /* arrow from (ax,ay) to the edge of the box (bx,by) */
    if (from === 'right') { bx = x + w; by = y + h * at; ax = Math.min(99, bx + L); ay = by; }
    else if (from === 'top') { bx = x + w * at; by = y; ax = bx; ay = Math.max(1, by - L); }
    else if (from === 'bottom') { bx = x + w * at; by = y + h; ax = bx; ay = Math.min(99, by + L); }
    else { bx = x; by = y + h * at; ax = Math.max(1, bx - L); ay = by; }
    svg += `<rect x="${x}" y="${y}" width="${w}" height="${h}" class="rpr" style="animation-delay:${i * .5}s"/>` +
      `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" class="rpl" marker-end="url(#rph)" style="animation-delay:${i * .5 + .3}s"/>`;
    if (m.label) labels += `<span class="rpt rp-${from}" style="left:${ax}%;top:${ay}%;animation-delay:${i * .5 + .3}s">${rpEsc(m.label)}</span>`; });
  return `<svg class="rpsvg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><defs><marker id="rph" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#DC2626"/></marker></defs>${svg}</svg>${labels}`;
}
function rpHTML(use) { const P = window.TL_PICS[use.id]; if (!P) return '';
  const said = (use.mark || []).map(m => m.label).filter(Boolean).join(', ');
  return `<figure class="rp" data-rp="${rpEsc(use.id)}" role="img" aria-label="${rpEsc(P.alt + (said ? '. Look at the box: ' + said : ''))}">` +
    `<div class="rpbox" style="aspect-ratio:${P.w}/${P.h}"><img src="${RP_BASE + rpEsc(P.file)}" alt="" loading="eager" decoding="async" onerror="this.closest('.rp').classList.add('rpno')">${rpMarks(use.mark)}</div>` +
    `<figcaption>${rpEsc(use.cap || P.alt)}<button type="button" class="rpz" aria-label="Make the picture bigger">🔍</button></figcaption></figure>`; }
function rpZoom(fig) { const id = fig.getAttribute('data-rp'), P = window.TL_PICS[id]; if (!P) return; const d = document.createElement('div'); d.className = 'rpzoom';
  d.innerHTML = `<div class="rpzin">${fig.querySelector('.rpbox').outerHTML}<p class="rpcred">Picture: ${rpEsc(P.author)} · ${rpEsc(P.licence)}</p><button type="button" class="rpclose">Close ✕</button></div>`;
  d.addEventListener('click', e => { if (e.target === d || e.target.classList.contains('rpclose')) d.remove(); }); document.body.appendChild(d); requestAnimationFrame(() => rpFit(d.querySelector('.rpbox'))); }
function rpDecorate() { try { if (typeof A === 'undefined' || A.view !== 'play' || !A.play) return; const p = A.play, it = p.items[p.i]; const card = document.querySelector('.qcard'); if (!card || card.querySelector('.rp')) return;
  const use = rpFind(p.id, it); if (!use) return; const h = rpHTML(use); if (!h) return;
  const old = card.querySelector('.tlpic');   /* an emoji picture is replaced; Hebrew text the boy must read (a Rashi, a pasuk) always stays */
  if (old) { old.insertAdjacentHTML('beforebegin', h); const t = old.textContent || ''; if (!use.keep && !/[\u0590-\u05FF]/.test(t) && t.length < 40) old.classList.add('rpfall'); }
  else { const row = card.querySelector('.qrow') || card.firstElementChild; if (row) row.insertAdjacentHTML('afterend', h); }
  const fig = card.querySelector('.rp'); fig.querySelector('.rpz').onclick = () => rpZoom(fig); fig.querySelector('.rpbox').onclick = () => rpZoom(fig);
  rpFit(fig.querySelector('.rpbox')); requestAnimationFrame(() => rpFit(fig.querySelector('.rpbox')));
 } catch (e) { console.error('RealPics', e); } }
/* keep every label inside the picture (a label near an edge would be cut off) */
function rpFit(box) { if (!box) return; const b = box.getBoundingClientRect(); if (!b.width) return;
  box.querySelectorAll('.rpt').forEach(el => { el.style.marginLeft = el.style.marginTop = '0px'; const r = el.getBoundingClientRect(); let dx = 0, dy = 0;
    if (r.left < b.left + 4) dx = b.left + 4 - r.left; else if (r.right > b.right - 4) dx = b.right - 4 - r.right;
    if (r.top < b.top + 4) dy = b.top + 4 - r.top; else if (r.bottom > b.bottom - 4) dy = b.bottom - 4 - r.bottom;
    el.style.marginLeft = dx + 'px'; el.style.marginTop = dy + 'px'; }); }
window.addEventListener('resize', () => document.querySelectorAll('.rpbox').forEach(rpFit));
(function () {
  if (typeof window.render === 'function' && !window.render.__rp) { const _r = window.render; window.render = function () { const out = _r.apply(this, arguments); rpDecorate(); return out; }; window.render.__rp = true; }
  document.head.insertAdjacentHTML('beforeend', `<style id="realpics-css">
.rp{margin:6px auto 14px;max-width:min(560px,100%)}.rpbox{position:relative;width:100%;border-radius:14px;overflow:hidden;background:#F5F0E6;border:2px solid #E7DCC8;cursor:zoom-in}
.rpbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}.rpsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.rpr{fill:rgba(250,204,21,.18);stroke:#DC2626;stroke-width:.8;vector-effect:non-scaling-stroke;stroke-width:4px;rx:1;animation:rpin .5s both}
.rpl{stroke:#DC2626;stroke-width:5px;vector-effect:non-scaling-stroke;stroke-linecap:round;animation:rpin .5s both}
.rpt{position:absolute;transform:translate(-100%,-50%);background:#DC2626;color:#fff;font:800 clamp(14px,2.6vw,20px)/1.1 var(--display,system-ui);padding:5px 10px;border-radius:10px;white-space:nowrap;box-shadow:0 3px 0 #991B1B;animation:rpin .5s both}
.rpt.rp-right{transform:translate(0,-50%)}.rpt.rp-top{transform:translate(-50%,-100%)}.rpt.rp-bottom{transform:translate(-50%,0)}
.rp figcaption{display:flex;align-items:center;justify-content:center;gap:8px;font:600 15px/1.3 var(--display,system-ui);color:#57534E;margin-top:6px;text-align:center}
.rpz{border:0;background:#EEF2FF;border-radius:10px;font-size:18px;padding:4px 8px;cursor:pointer}
.rp.rpno{display:none}.rp:not(.rpno)+.tlpic.rpfall{display:none}
.rpzoom{position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,.88);display:flex;align-items:center;justify-content:center;padding:12px}
.rpzin{width:min(96vw,calc(92vh * .62),900px);max-height:96vh;overflow:auto}.rpzin .rpbox{cursor:default}.rpcred{color:#E2E8F0;font:13px system-ui;margin:6px 0}
.rpclose{font:700 18px system-ui;border:0;border-radius:12px;padding:10px 18px;background:#fff;cursor:pointer}
@keyframes rpin{from{opacity:0;transform-origin:center;}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.rpr,.rpl,.rpt{animation:none}}
</style>`);
})();
