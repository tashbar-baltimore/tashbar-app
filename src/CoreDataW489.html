  'WRIT.ESSAY.L08.04':{name:'Cause and Effect',
  teach:[
    {how:'An informative piece can be organized by CAUSE AND EFFECT. A cause is what makes something happen; an effect is what happens because of it. One plan is ONE CAUSE, MANY EFFECTS: one cause in the middle, and every effect comes straight from it. A long dry summer lowers the reservoirs, browns the lawns and shrinks the crops.', q:'Gavriel’s chart starts: “The power went out.” Which plan is one cause, many effects?', o:['The power went out, so the lights went dark, the fridge stopped and the fans went quiet.','The power went out, which led to a warm fridge, which led to spoiled milk.','The power went out on Tuesday, and Thursday was sunny.']},
    {how:'The other plan is A CHAIN: A causes B, and B causes C, like a row of dominoes. Each effect becomes the cause of the next step. Heavy snow fell, which led to icy roads; as a result, buses could not run safely; because of this, school closed.', q:'Which one is a chain?', o:['Yeast eats sugar and makes gas; the gas forms bubbles; the bubbles make the dough rise.','A storm closed school, stopped the mail and cancelled the game.','Bread is made of flour, water, yeast and salt.']},
    {how:'SIGNAL WORDS show the reader each link: "because of this," "as a result," "which led to," "this, in turn,". With these words, the cause comes FIRST and the effect comes after the signal word. The mistake is a FLIPPED link, where the effect is written as if it were the cause: "School closed, which led to the snow." Snow closes school, not the other way around.', q:'Which link is written the right way, cause first?', o:['Heavy rain fell, which led to a flooded road.','The road flooded, which led to heavy rain.','The road flooded; as a result, rain fell all night.']}

  'WRIT.PARA.L08.05':{name:'Precise and Technical',
  teach:[
    {how:'You already cut vague words like "stuff" and "things". Now go further: use the PRECISE TOPIC WORD, the exact word an expert uses. Writing about Baltimore’s water? Say "reservoir", not "the big lake". About bread? Say "yeast", not "the stuff that makes it puffy". A sentence with no topic word is VAGUE.', q:'Which sentence uses the precise topic word?', o:['Baltimore stores its drinking water in reservoirs.','Baltimore keeps its water in some big lake things.','Baltimore has stuff for its water.']},
    {how:'A topic word is new to many readers, so EXPLAIN IT the first time you use it. Three ways: after a comma ("klaf, parchment made from the skin of a kosher animal,"), with "called" ("the pages are sewn in groups called signatures"), or with "which is" ("black ice, which is a thin, clear layer of ice on a road,"). Topic word plus explanation is PRECISE AND EXPLAINED. A topic word with no help is NOT EXPLAINED.', q:'Which sentence is precise and explained?', o:['Gluten, a stretchy protein in wheat flour, traps the gas in dough.','Gluten traps the gas in dough.','The stretchy stuff traps the gas in dough.']},
    {how:'Explain the word only the FIRST time. After that, just use it, and use the SAME word every time. Switching to "the lake", "the water place" and "it" makes the reader wonder if you mean something new.', q:'Benny explained "reservoir" in his first sentence. In his third sentence, what should he write?', o:['the reservoir','the reservoir, a lake made to store drinking water,','the big water lake']}

    {t:'write', q:'Your turn to write. Pick a topic: Baltimore’s water, why bread rises, or how a sefer is bound. Write two sentences. Use one precise topic word, and explain it the first time.', min:0, checks:['🎯 I used the exact topic word.','💬 I explained it the first time: a comma, "called", or "which is".','🔁 The second time, I used the same word without explaining it again.'], h:'Try: "___, a ___ that ___, ___." Then use the word again plainly.'}

  check:[
    {q:'Eli’s piece on winter weather: “Sleet, which is rain that freezes into tiny ice balls as it falls, made the steps slippery.” Is it precise and explained, not explained, or vague?', o:['precise and explained','not explained','vague'], h:'Is there a topic word? Does the sentence tell the reader what it means?'},

  'WRIT.PARA.L08.06':{name:'Objective Tone',
  teach:[
    {how:'An informative piece keeps an OBJECTIVE tone: it gives facts the reader could check, not the writer’s feelings. A sentence that tells what the writer thinks or feels is an OPINION. Formal Voice cut slang ("gonna", "you guys"). Objective tone goes further: even a polite opinion does not belong in an information piece.', q:'Which sentence is objective?', o:['Baltimore’s water comes from three reservoirs.','Baltimore’s reservoirs are the most beautiful lakes in Maryland.','I think the reservoirs are interesting.']},
    {how:'Opinion clues come in two kinds. Easy to see: "I think", "I feel", "in my view", "amazing", "boring", "the best". Harder to see: LOADED WORDS that judge quietly. "The plows finally crawled in" says they were too slow. "Only ten inches fell" says it was not much. "A whole two days" says it was too long. One loaded word turns a fact into an opinion. Fix it: cut the clue, or swap in a plain fact: "The plows reached our street at noon."', q:'Find the loaded word: “The plows finally reached our street.”', o:['finally','plows','street']},
    {how:'Objective does not mean nobody’s view may appear. A reporter may give someone else’s view by naming who said it: "Mr. Gross said the trip was a success." It is a fact that he said it, so the sentence is still OBJECTIVE. But an UNNAMED VIEW, like "Everyone agrees the drill went well" or "Many people say", hides the writer’s own opinion behind "everyone". That is an OPINION.', q:'Which sentence stays objective?', o:['Rabbi Rosen said the new library is “a gift to every boy.”','Everyone agrees the new library is a gift to every boy.','I feel the new library is great.']}
  ],

      h:'Could the reader check it? Or does it tell what the writer thinks or feels?'},
    {t:'pairs', q:'Match each opinion to its objective fix.', pairs:[['Only ten inches fell.','Ten inches of snow fell.'],['Sewing the pages is boring.','The binder sews each group of pages.'],['I feel the lake is huge.','The reservoir holds billions of gallons.']],
      h:'Cut the feeling. Keep a fact the reader could check.'},
    {t:'spotall', q:'Tap every OPINION CLUE.', cells:[{label:'I think',ok:true},{label:'amazing',ok:true},{label:'boring',ok:true},{label:'finally',ok:true},{label:'only ten inches',ok:true},{label:'reservoir',ok:false},{label:'said',ok:false}],

      h:'Look for a clue word, a loaded word like "a whole", or a view with no name. One is enough to make it an opinion.'},
    {t:'order', q:'Build an objective sentence. Tap the tiles in order.', tiles:['The city','plows the','main roads','first.'], extra:['the best!'],
      h:'Who does it, what they do, and which comes first. No feelings.'},
    {t:'spotall', q:'Akiva’s piece on Baltimore’s water. Tap every sentence that is OBJECTIVE.', cells:[{label:'Rain and streams fill the reservoirs.',ok:true},{label:'Pipes carry the water to the city.',ok:true},{label:'The city’s engineer said the water is “safe to drink.”',ok:true},{label:'Our water is the best in America.',ok:false},{label:'I find water pipes boring.',ok:false},{label:'Everyone says our water is the safest anywhere.',ok:false}],
      h:'Could the reader check it? A view with a name on it is a fact about what he said.'},
    {t:'write', q:'Your turn to write. Topic: how a snowstorm closes school, or why bread rises. Write three objective sentences. Then read them again and cut any opinion clue.', min:0, checks:['📏 Every sentence is a fact a reader could check.','✂️ No "I think", no "the best", no loaded words like "finally" or "only".','🗣️ If I gave someone’s view, I named who said it.'], h:'Ask about each sentence: could the reader check it? If it tells what YOU feel, cut it or swap in a fact.'}

  check:[

  'WRIT.PARA.L08.07':{name:'Bring It Home',
  teach:[
    {how:'Strong Finish (Level 6) said your main point again. Now go further: an informative conclusion BRINGS IT HOME in two moves. Move 1, ONE TAKEAWAY: join the key points into one sentence that shows how they fit together, instead of listing them again. Not "Snow fell. Roads iced. Buses stopped. School closed." Instead: "In short, one night of heavy snow can ice the roads and shut a whole school." Move 2 comes next: WHY IT MATTERS.', q:'Benny’s piece explained how snow closes school. Which sentence joins the key points into one takeaway?', o:['In short, one night of heavy snow can ice the roads and shut a whole school.','Snow fell. The roads iced. The buses stopped. School closed.','I love snow days more than anything.']},
    {how:'Move 2, WHY IT MATTERS, stays objective: it shows how the facts help the reader, not how you feel. Start it with "Knowing this,". "Knowing this, families can check the news early on a snowy morning." Not "Snow days are awesome!"', q:'Which sentence says why it matters?', o:['Knowing this, a baker can keep dough warm so it rises well.','Bread is the best food ever.','Bread was first baked long ago.']},
    {how:'Three mistakes undo a conclusion. ADDS A NEW FACT: a brand-new fact the piece never explained ("Also, snowflakes have six sides."). AN OPINION RANT: the writer’s feelings pile up ("Snow is the worst and I hate it!"). COPIES THE OPENING: the first sentence again, word for word or nearly, so the reader learns nothing from the end. One takeaway plus why it matters, with none of these, BRINGS IT HOME.', q:'Bread piece opening: “Bread rises because of two things.” Which ending copies the opening?', o:['Bread rises because of two things.','In short, yeast makes the gas and gluten holds it, so the dough rises.','Knowing this, a baker can keep dough warm so it rises well.']}
  ],

      h:'Does it join the key points, tell the reader why they are useful, or neither?'},

      items:[{label:'In short, folding, sewing and a strong cover turn loose pages into a sefer that lasts. Knowing this, a boy can open his sefer gently.',bin:'G'},{label:'A sefer is held together in three steps.',bin:'C'},{label:'Binding is the coolest job ever and everyone should love it!',bin:'R'},{label:'As I said, a sefer is held together in three steps.',bin:'C'},{label:'To sum up, sewn pages and a cover keep a sefer whole. Knowing this, a boy can see why a sewn sefer lasts for years.',bin:'G'}],
      h:'Does it join the points and say why they matter? Or does it repeat the first line, or pile up feelings?'},

      h:'The takeaway first. Then "Knowing this," and how it helps. Leave out anything new.'},
    {t:'spotall', q:'Tap every sentence that says WHY IT MATTERS and stays objective.', cells:[{label:'Knowing this, drivers can watch for black ice.',ok:true},{label:'Knowing this, a baker can fix flat dough.',ok:true},{label:'Snow days are the greatest.',ok:false},{label:'Also, hail can be as big as a golf ball.',ok:false}],
