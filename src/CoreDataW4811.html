(function () {

  'WRIT.ESSAY.L05.02':{name:'POW + TREE',
  teach:[
    {how:'Rabbi Feldman has news: the class will take one trip, to the farm or to the aquarium. Who can convince him? You know POW from planning stories: Pick my idea, Organize my notes, Write and say more. For an opinion, Pick my idea means: pick the side you believe.', q:'Tzvi Hirsch decides: “I think our class should go to the farm.” Which POW step is that?', o:['Pick my idea','Organize my notes','Write and say more']},
    {how:'For a story, you organized your notes with W-W-W. For an opinion, organize them with TREE. T: Topic sentence: tell what you believe. R: Reasons: three reasons why. E: Explain: say more about each reason. E: Ending: wrap it up with your opinion again.', q:'Tzvi Hirsch’s note says: “we learn where our food comes from.” Which TREE part is it?', o:['Reasons','Topic sentence','Ending']},
    {how:'The mistake: a plan with one reason, or reasons with nothing to explain them. “The farm. It is good.” will not convince Rabbi Feldman. Ask: Will my reader believe this? Give three reasons, and explain each one.', q:'Whose plan is ready to write?', o:['Avrumi: his opinion, three reasons, a note to explain each, and an ending.','Avrumi: his opinion and one reason.','Avrumi: three reasons, but no opinion.']}
  ],
  practice:[
    {t:'sort', q:'Tzvi Hirsch’s TREE notes for the farm. Sort each note.', bins:[{id:'T',label:'🌳 Topic sentence'},{id:'R',label:'💡 Reason'},{id:'X',label:'🔍 Explain'}],
      items:[{label:'I think our class should go to the farm.',bin:'T'},{label:'we learn where our food comes from',bin:'R'},{label:'we watch wheat ground into flour at the mill',bin:'X'},{label:'we learn to care for animals',bin:'R'},{label:'each boy feeds the goats and milks a cow',bin:'X'}],
      h:'The topic sentence tells what he believes. A reason tells why, in a few words. An explain note tells exactly what will happen, so we know the reason is true.'},
    {t:'pairs', q:'Match each part of TREE to its job.', pairs:[['Topic sentence','tell what I believe'],['Reasons','tell why I believe it'],['Explain','say more about each reason'],['Ending','wrap it up and say my opinion again']],
      h:'Say TREE slowly. What does each part do for the reader?'},
    {t:'order', q:'Put the parts of an opinion plan in TREE order. Tap the tiles in order.', tiles:['Topic sentence','Reasons','Explain','Ending'],
      h:'T, R, E, E. Say the word TREE in your head.'},
    {t:'spotall', q:'Dovid wants the aquarium. Tap every note that is a REASON.', cells:[{label:'we learn how sea animals live',ok:true},{label:'rain cannot cancel an indoor trip',ok:true},{label:'it is close to school',ok:true},{label:'I think we should go to the aquarium',ok:false},{label:'over 500 kinds of sea animals',ok:false}],
      h:'A reason answers “why?” in a few words. What he believes is the topic sentence. A number that proves a reason is an explain note.'},
    {t:'pairs', q:'Match each of Dovid’s reasons to the note that explains it.', pairs:[['we learn how sea animals live','a guide teaches how fish breathe with gills'],['rain cannot cancel an indoor trip','the whole trip is inside the building'],['it is close to school','only 20 minutes by bus']],
      h:'Find the note that shows how we know the reason is true.'},
    {t:'sort', q:'Sort each plan: ready to write, or missing a part?', bins:[{id:'G',label:'✅ Ready to write'},{id:'M',label:'❌ Missing a part'}],
      items:[{label:'Opinion, three reasons, explain notes, ending',bin:'G'},{label:'Opinion and one reason',bin:'M'},{label:'Three reasons, but no opinion',bin:'M'},{label:'T, R, E, E: every part has a note',bin:'G'},{label:'Opinion and three reasons, but nothing to explain them',bin:'M'}],
      h:'Check for all four TREE parts: Topic sentence, Reasons, Explain, Ending.'},
    {t:'write', q:'Your turn to plan. Pick your side: the farm or the aquarium? Write POW at the top. Then make a TREE: your opinion, three reasons, a few words to explain each one, and an ending.', min:0, checks:['🌳 My Topic sentence tells what I believe.','💡 I have three reasons that tell why.','🔍 Each reason has an Explain note, and I have an Ending.'], h:'Pick your side first. Then ask: Why? Write three reasons. For each one, ask: How do I know?'}
  ],
  check:[
    {q:'Binyamin plans a piece: our class should start a chess club. His first note says: “I think every class needs a chess club.” Which TREE part is it?', o:['Topic sentence','Explain','Reasons'], h:'Does the note tell what he believes, why, or how we know?'},
    {q:'Avrumi plans a piece: Glen Avenue needs a crosswalk by the shul. His reason: the street is too busy to cross safely. His next note: “cars pass the shul every minute.” Which TREE part is the next note?', o:['Explain','Topic sentence','Ending'], h:'Does the note tell what he believes, or does it show how we know his reason is true?'},
    {t:'order', q:'Yehuda plans a piece about a class library shelf. Put his notes in TREE order. Tap the tiles in order.', tiles:['I think our class needs a library shelf.','Boys will read more.','We know because the 5th grade shelf sends home 20 books a week.','That is why our class needs a shelf.'], h:'T, R, E, E. What he believes comes first, and the wrap-up comes last.'}
  ],
  re:[
    {how:'A new way: picture a real tree. The top is the Topic sentence. The branches are the Reasons. The leaves on each branch Explain. The ground at the bottom is the Ending.', q:'In TREE, what do the branches stand for?', o:['Reasons','Ending','Topic sentence']},
    {how:'A simpler step: start with just T and R. Say what you believe. Then ask yourself “why?” three times.', q:'Which note answers “why?”', o:['it is close to school','I think we should go to the aquarium','the end']},
    {how:'The skill underneath: POW + WWW. You planned a story with POW and W-W-W. POW stays the same. Now you go further: TREE takes the place of W-W-W, because an opinion needs reasons and proof, not story events.', q:'In POW, what does the P stand for?', o:['Pick my idea','Plan the ending','Put it in order']}
  ]},

  'WRIT.PARA.L05.15':{name:'Reason or Not?',
  teach:[
    {how:'A reason tells WHY your opinion is right. A real reason works for the reader too, not only for you. Rabbi Feldman will ask: “Why is that good for the class?” A real reason has an answer.', q:'Opinion: our class should go to the aquarium. Which is a real reason?', o:['We will learn how sea animals live.','I like the aquarium.','Everyone wants to go.']},
    {how:'The mistake: a reason that is only a feeling. “Because I like it.” “Because it is fun.” “Because it is the best.” These tell about YOU. The reader may not feel the same way. A feeling is not a reason.', q:'Which reason is only a feeling?', o:['The farm is the best place ever.','We learn to care for animals.','We work as a team outside.']},
    {how:'Two more non-reasons. “Everyone wants it” does not tell why it is good. And an OFF-TOPIC fact, like “The bus is yellow,” is true, but it does not tell why. To fix a non-reason, ask “Why is that good for the class?” and write the answer.', q:'Dovid wrote: “I like fish.” Which fixes it into a real reason?', o:['We will learn how fish breathe.','I really, really like fish.','Fish are my favorite.']}
  ],
  practice:[
    {t:'sort', q:'Opinion: our class should go to the farm. Sort each sentence: a real reason, or not a reason?', bins:[{id:'R',label:'✅ Real reason'},{id:'N',label:'❌ Not a reason'}],
      items:[{label:'We learn where our food comes from.',bin:'R'},{label:'I like cows.',bin:'N'},{label:'We learn to care for animals.',bin:'R'},{label:'Everyone wants the farm.',bin:'N'},{label:'The farm is so much fun.',bin:'N'}],
      h:'Ask: “Why is that good for the class?” A real reason has an answer. A feeling, or “everyone wants it,” does not.'},
    {t:'pairs', q:'Match each non-reason to its kind.', pairs:[['I love sharks.','only a feeling'],['All my friends want to go.','everyone wants it'],['The bus is yellow.','off topic']],
      h:'Does it tell about me, about other people, or something true that is not about why?'},
    {t:'sort', q:'Sort each NON-reason: what kind of mistake is it?', bins:[{id:'F',label:'😊 Only a feeling'},{id:'E',label:'👥 Everyone wants it'},{id:'O',label:'🚫 Off topic'}],
      items:[{label:'Because I like it.',bin:'F'},{label:'The aquarium is the coolest.',bin:'F'},{label:'All my friends want to go.',bin:'E'},{label:'Every boy in class wants it.',bin:'E'},{label:'The farm has a red gate.',bin:'O'}],
      h:'A feeling tells about you. “Everyone wants it” tells about other people. Off topic is true, but it does not tell why.'},
    {t:'spotall', q:'Dovid’s reasons for the aquarium. Tap every REAL reason.', cells:[{label:'It is close, so the bus ride is short.',ok:true},{label:'We will learn how fish breathe.',ok:true},{label:'Rain cannot cancel an indoor trip.',ok:true},{label:'I love sharks.',ok:false},{label:'It is the best place in town.',ok:false},{label:'The aquarium has blue walls.',ok:false}],
      h:'Skip feelings, “everyone wants it,” and facts that do not tell why.'},
    {t:'order', q:'Dovid fixes “I like fish.” Build his real reason. Tap the tiles in order.', tiles:['We should go','to the aquarium','because we will learn','how fish breathe.'],
      h:'Start with the opinion. Then because. Then the reason that helps the class.'},
    {t:'sort', q:'Avrumi wants the farm. Sort each sentence: about Avrumi only, or good for the whole class?', bins:[{id:'M',label:'🙋 About me only'},{id:'C',label:'🏫 Good for the class'}],
      items:[{label:'I love goats.',bin:'M'},{label:'I want to ride the tractor.',bin:'M'},{label:'We learn to care for animals.',bin:'C'},{label:'We work as a team outside.',bin:'C'}],
      h:'Does it tell what Avrumi wants? Or why the trip helps everyone?'},
    {t:'write', q:'Your turn to write. Use your TREE plan. Test every reason: is it a real reason? Write your opinion and two real reasons. If you find “I like it,” fix it.', min:0, checks:['✅ Each reason tells why it is good for the reader or the class.','😊 No reason is only a feeling, like “I like it.”','👥 No reason is just “everyone wants it.”'], h:'For each reason, ask: “Why is that good for the class?” If you have an answer, write the answer.'}
  ],
  check:[
    {q:'Yehuda thinks the class should have a reading corner. He writes: “Because reading corners are the coolest.” What is this?', o:['only a feeling','a real reason','off topic'], h:'Ask: why is that good for the class? Does the sentence answer that?'},
    {q:'Yehuda’s next reason: “A quiet corner helps boys read longer.” What is this?', o:['a real reason','only a feeling','off topic'], h:'Does it tell why the corner is good for the class?'},
    {t:'order', q:'Binyamin wants a chess club. Build his real reason. Tap the tiles in order.', tiles:['Our class should','start a chess club','because chess teaches us','to keep trying.'], h:'Start with the opinion. Then because. Then the reason that helps the class.'}
  ],
  re:[
    {how:'A new way: the “Why is that good?” test. Say your reason. Then ask, “Why is that good for the class?” If all you can say is “because I like it,” it is not a reason yet.', q:'Which reason passes the test?', o:['We learn how sea animals live.','Sharks are cool.','I want to go.']},
    {how:'A simpler step: hunt for feeling words first: like, love, fun, best, cool. A reason built only on them is not a real reason.', q:'Which word is a feeling word?', o:['love','learn','animals']},
    {how:'The skill underneath: Say What You Think. There you said your opinion clearly in one sentence. Now you go further: give reasons, test each one, and fix the ones that are only a feeling.', q:'An opinion tells…', o:['what you think','a number','a story']}
  ]},

  'WRIT.PARA.L05.16':{name:'Back It Up',
  teach:[
    {how:'Yehuda always asks: “But how do we know?” A reason needs proof. Back it up with a FACT: a number, or something you can check. Or a DETAIL: exactly what you will see or do.', q:'Reason: the farm costs less. Which sentence backs it up with a fact?', o:['The farm is $8 a boy, and the aquarium is $12.','The farm is a really good deal.','Everyone knows farms are cheap.']},
    {how:'The proof must match THAT reason. Reason: rain cannot cancel the aquarium trip. Proof: the whole trip is indoors. A fact about sea animals is true, but it proves a different reason. That is the wrong reason.', q:'Reason: rain cannot cancel the aquarium trip. Which proof matches it?', o:['The whole trip is indoors.','It has over 500 kinds of sea animals.','It is 20 minutes by bus.']},
    {how:'The mistake: a feeling or a guess dressed up as proof. “Everyone knows it is great.” “I bet it is the best.” Those prove nothing. A fact or a detail can be checked.', q:'Reason: the aquarium teaches us about sea life. Which one is NOT real proof?', o:['Everyone knows it is great.','A guide teaches how fish breathe with gills.','It has over 500 kinds of sea animals.']}
  ],
  practice:[
    {t:'pairs', q:'Match each of Dovid’s reasons to the fact or detail that backs it up.', pairs:[['the bus ride is short','It is only 20 minutes by bus.'],['we will learn about sea life','A guide teaches how fish breathe with gills.'],['rain cannot cancel it','The whole trip is indoors.']],
      h:'Ask Yehuda’s question: how do we know THIS reason is true?'},
    {t:'sort', q:'Reason: at the farm, we learn where our food comes from. Sort each sentence: backs it up, or does not?', bins:[{id:'B',label:'✅ Backs it up'},{id:'N',label:'❌ Does not back it up'}],
      items:[{label:'We watch wheat ground into flour at the mill.',bin:'B'},{label:'Each boy milks a cow.',bin:'B'},{label:'Everyone knows farms are great.',bin:'N'},{label:'The farm is 40 minutes away.',bin:'N'},{label:'I bet it is the best trip.',bin:'N'}],
      h:'Does it prove THIS reason with a fact or a detail? A feeling, a guess, or a fact about something else does not.'},
    {t:'spotall', q:'Tap every sentence that is a FACT you could check.', cells:[{label:'The farm is $8 a boy.',ok:true},{label:'The farm is 40 minutes by bus.',ok:true},{label:'The aquarium has over 500 kinds of sea animals.',ok:true},{label:'The farm is the best.',ok:false},{label:'Everyone loves the aquarium.',ok:false}],
      h:'A fact can be checked: you could look it up or count it. A feeling cannot be checked.'},
    {t:'order', q:'Build Tzvi Hirsch’s reason with its proof. Tap the sentences in order.', tiles:['I think our class should go to the farm.','First, we will learn where our food comes from.','For example, we will watch wheat ground into flour at the mill.'],
      h:'The opinion comes first. Then the reason. The proof comes right after the reason it backs up.'},
    {t:'sort', q:'Reason: rain cannot cancel the aquarium trip. Sort each proof sentence.', bins:[{id:'G',label:'✅ Good proof'},{id:'F',label:'😊 A feeling or a guess'},{id:'W',label:'🔀 Wrong reason'}],
      items:[{label:'The whole trip is indoors.',bin:'G'},{label:'Sharks are amazing.',bin:'F'},{label:'I bet it stays dry in there.',bin:'F'},{label:'It has over 500 kinds of sea animals.',bin:'W'},{label:'The bus ride is 20 minutes.',bin:'W'}],
      h:'Good proof matches THIS reason and can be checked. A feeling or a guess cannot be checked. A true fact about another reason is the wrong reason.'},
    {t:'pairs', q:'Each proof is weak. Match it to a stronger fact or detail.', pairs:[['Farms are great for learning.','Each boy feeds the goats and milks a cow.'],['The farm is really cheap.','The farm is $8 a boy.'],['We would work together a lot.','The class plants a row of corn together.']],
      h:'Find the one about the same thing that you could check or see.'},
    {t:'write', q:'Your turn to write. Take your two real reasons from last time. After each one, write a fact or a detail that backs it up.', min:0, checks:['🔍 Each reason has a fact or a detail right after it.','🎯 Each proof matches its own reason.','😊 No proof is just a feeling or a guess.'], h:'For each reason, ask Yehuda’s question: “But how do we know?” Your answer is the proof.'}
  ],
  check:[
    {q:'Yehuda wants a class reading corner. Reason: a quiet corner helps boys read longer. Proof: “In the quiet library last month, boys read for 30 minutes, not 10.” What is the proof?', o:['good proof','a feeling or a guess','wrong reason'], h:'Does it match the reason? Could you check it?'},
    {q:'Binyamin wants a chess club. Reason: chess teaches us to keep trying. Proof: “A chess set costs only $10.” What is the proof?', o:['wrong reason','good proof','a feeling or a guess'], h:'It is a true fact. But does it prove THIS reason?'},
    {t:'order', q:'Build Avrumi’s reason with its proof. Tap the sentences in order.', tiles:['I think our shul needs a map of Glen Avenue.','First, guests could find their way.','For example, three guests got lost last Shabbos.'], h:'The opinion comes first. Then the reason. The proof comes right after the reason it backs up.'}
  ],
  re:[
    {how:'A new way: proof is a key that fits ONE lock. Try your proof in the reason’s lock. If it fits a different reason, it is the wrong key.', q:'Reason: the bus ride is short. Which key fits this lock?', o:['It is only 20 minutes by bus.','The whole trip is indoors.','Sharks are amazing.']},
    {how:'A simpler step: look for a number first. A number is often a fact you can check.', q:'Which sentence has a fact with a number?', o:['It is only 20 minutes by bus.','It is close enough.','It is not so far.']},
    {how:'The skill underneath: Say More. There you added an example or a fact to a detail. Now you go further: pick the proof that matches your reason, and throw out a feeling or a guess.', q:'Which words can start a sentence that says more?', o:['For example,','The end.','Once upon a time,']}
  ]},

  'WRIT.PARA.L05.17':{name:'Linking Words',
  teach:[
    {how:'Linking words are glue. They show the reader how your ideas fit together. “because” and “in order to” join your opinion to a reason. After “in order to,” put an action word: in order to learn, in order to see.', q:'“We should go to the farm ___ we will learn where our food comes from.” Which linking word fits?', o:['because','For instance,','In addition,']},
    {how:'“In addition,” adds your NEXT reason. “For instance,” brings in PROOF for the reason you just gave. “Therefore,” comes near the end: it shows your reasons lead back to your opinion.', q:'Dovid has given one reason. Now he wants to give his second reason. Which linking word starts it?', o:['In addition,','For instance,','because']},
    {how:'The mistake: the wrong glue. “For instance, rain cannot cancel the trip.” But that is a NEW reason, not proof, so it needs “In addition,”. Ask what job the sentence does first. Then pick the word.', q:'Dovid’s first reason: we learn about sea life. Which next sentence uses the wrong linking word?', o:['For instance, rain cannot cancel an indoor trip.','In addition, rain cannot cancel an indoor trip.','For instance, a guide teaches how fish breathe with gills.']}
  ],
  practice:[
    {t:'sort', q:'Sort each linking word by its job.', bins:[{id:'A',label:'➕ Adds a reason'},{id:'P',label:'🔍 Brings in proof'},{id:'J',label:'🔗 Joins opinion and reason'}],
      items:[{label:'In addition,',bin:'A'},{label:'Also,',bin:'A'},{label:'For instance,',bin:'P'},{label:'For example,',bin:'P'},{label:'because',bin:'J'},{label:'in order to',bin:'J'}],
      h:'Does it add the next reason, bring in proof, or join the opinion to a reason?'},
    {t:'pairs', q:'Match each sentence to the linking word that fills the blank.', pairs:[['We should go ___ it is close.','because'],['We should go ___ learn about sea life.','in order to'],['___ rain cannot cancel it. (a second reason)','In addition,']],
      h:'After in order to comes an action word. After because comes a reason. A new reason starts with In addition.'},
    {t:'order', q:'Glue Dovid’s paragraph together. Tap the sentences in order.', tiles:['I think our class should go to the aquarium.','First, we will learn about sea life.','For instance, a guide teaches how fish breathe with gills.','In addition, rain cannot cancel an indoor trip.'],
      h:'The opinion comes first. The proof comes right after its reason. In addition brings the next reason.'},
    {t:'spotall', q:'Tzvi Hirsch wrote: “I think we should go to the farm because we will learn where our food comes from. For instance, we will watch wheat ground into flour. In addition, we will learn to care for animals.” Tap every linking word.', cells:[{label:'because',ok:true},{label:'For instance,',ok:true},{label:'In addition,',ok:true},{label:'farm',ok:false},{label:'wheat',ok:false},{label:'animals',ok:false}],
      h:'Linking words glue ideas together. Things, like wheat or animals, are not linking words.'},
    {t:'sort', q:'Each sentence comes right after the reason “we learn about sea life.” Sort it: right glue, or wrong glue?', bins:[{id:'R',label:'✅ Right glue'},{id:'W',label:'❌ Wrong glue'}],
      items:[{label:'For instance, a guide teaches how fish breathe.',bin:'R'},{label:'In addition, the bus ride is short.',bin:'R'},{label:'For instance, the bus ride is short.',bin:'W'},{label:'We should go in order to it is close.',bin:'W'}],
      h:'Proof gets For instance. A new reason gets In addition. After in order to comes an action word.'},
    {t:'pairs', q:'Match each linking word to its job.', pairs:[['In addition,','adds the next reason'],['For instance,','brings in proof'],['in order to','tells the goal, with an action word'],['Therefore,','leads back to the opinion']],
      h:'Think about where each word goes in an opinion piece.'},
    {t:'write', q:'Your turn to write. Glue your opinion paragraph together. Use because or in order to in your first sentence, For instance before a proof, and In addition before your second reason.', min:0, checks:['🔗 I joined my opinion and a reason with because or in order to.','🔍 I used For instance before a proof.','➕ I used In addition before my next reason.'], h:'Write your opinion and first reason in one sentence with because. Then For instance and your proof. Then In addition and your next reason.'}
  ],
  check:[
    {q:'Mr. Halpern asks if the class should build a weather station. Dovid writes: “We should build one because we would learn to read the weather. ___ each morning we would read the rain gauge and write the number on a chart.” Which linking word fits?', o:['For instance,','In addition,','because'], h:'Is it a new reason, or a detail that shows exactly how we would learn the weather?'},
    {q:'Binyamin writes: “Our class should start a chess club ___ learn to keep trying when we lose.” Which linking word fits?', o:['in order to','For instance,','In addition,'], h:'What comes right after the blank: an action word, or a whole new sentence?'},
    {t:'order', q:'Glue Tzvi Hirsch’s paragraph about baking challah together. Tap the sentences in order.', tiles:['I think our class should bake challah for Shabbos.','First, we would learn a real skill.','For instance, we would braid the dough ourselves.','In addition, we could give challos to families.'], h:'The opinion comes first. The proof comes right after its reason. In addition brings the next reason.'}
  ],
  re:[
    {how:'A new way: linking words are road signs for your reasons. “In addition” says: another reason ahead! “For instance” says: proof ahead!', q:'Which sign says “proof ahead”?', o:['For instance,','In addition,','because']},
    {how:'A simpler step: start with just “because.” Write your opinion, then “because,” then your reason, all in one sentence.', q:'Which sentence uses because to join an opinion and a reason?', o:['We should go to the farm because it costs less.','Because. The farm.','The farm is because.']},
    {how:'The skill underneath: Road Sign Words. You used transition words to move between details. Now you go further: in an opinion, each linking word has a job: join a reason, add one, or bring in proof.', q:'What do transition words do?', o:['link ideas together','end the story','name a feeling']}
  ]},

  'WRIT.PARA.L05.18':{name:'Opinion Ending',
  teach:[
    {how:'The Ending is the last E in TREE. It does two jobs. First, say your opinion again, in new words. Start with “For all these reasons,” or “That is why”. Then give a PUSH: tell the reader what to do. “So please choose the farm!”', q:'Which sentence is a push?', o:['So please choose the farm, Rabbi Feldman!','I think we should go to the farm.','We will watch wheat ground into flour.']},
    {how:'Stay on your side all the way to the end. An ending that switches sides, like “But the aquarium is fine too,” tells the reader you were not sure. And do not add a NEW reason at the end. The ending wraps up. It does not start something new.', q:'Tzvi Hirsch is for the farm. Which ending sentence switches sides?', o:['But the aquarium would be fine too.','For all these reasons, the farm is the right trip for our class.','So please choose the farm!']},
    {how:'One more mistake: no push. “That is all I think.” The reader nods and does nothing. A push asks for action: please choose, let’s sign up, come and help. Make it polite, and make it clear.', q:'Which ending has a push?', o:['That is why we should go to the aquarium. Let’s sign up today!','That is all I think.','The end.']}
  ],
  practice:[
    {t:'sort', q:'Tzvi Hirsch’s ending sentences. Sort each one: says the opinion again, or a push?', bins:[{id:'O',label:'🔁 Opinion again'},{id:'P',label:'👉 A push'}],
      items:[{label:'For all these reasons, the farm is the right trip for us.',bin:'O'},{label:'That is why our class should visit the farm.',bin:'O'},{label:'So please choose the farm, Rabbi Feldman!',bin:'P'},{label:'Let’s sign up for the farm today!',bin:'P'}],
      h:'Opinion again tells what he believes. A push asks the reader to do something.'},
    {t:'pairs', q:'Match each ending mistake to its fix.', pairs:[['It switches sides.','Keep the same side to the end.'],['It adds a new reason.','Move the reason up into the body.'],['It has no push.','Ask the reader to act: please choose.']],
      h:'What is wrong? Find the fix for that problem.'},
    {t:'spotall', q:'Dovid is for the aquarium. Tap every sentence that belongs in his ending.', cells:[{label:'For all these reasons, the aquarium is the trip for us.',ok:true},{label:'So please choose the aquarium, Rabbi Feldman!',ok:true},{label:'That is why our class should go to the aquarium.',ok:true},{label:'But the farm might be fun too.',ok:false},{label:'Also, the gift shop sells shark hats.',ok:false},{label:'That is all.',ok:false}],
      h:'Skip anything that switches sides, adds a new reason, or just stops with no push.'},
    {t:'order', q:'Build Tzvi Hirsch’s ending. Tap the sentences in order.', tiles:['We will learn about food, care for animals and work as a team.','For all these reasons, the farm is the right trip for our class.','So please choose the farm, Rabbi Feldman!'],
