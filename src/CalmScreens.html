<script>
/* CalmScreens.html — calm, clear opening screens (HoS 2026-11-19: "fix the flashing opening screens and make the presentation
   for the students much clearer"). Claude Code builder. Joined to the boy page by sgQuest_ (StaffGrid.js), LAST.
   1. No flashing while the page opens. The page is built from layers (QuestPage, then HomePage, then SignInEnergy), and each one
      painted its own sign-in look for a moment: four different screens in two seconds. sgQuest_ now puts a small cover in <head>
      (html.tl-boot: dark night-sky colour, nothing drawn); this file, the last layer, lifts it once, so the boy sees ONE screen.
      Safety: the cover lifts by itself after 4 seconds even if something fails (sgQuest_), so nobody is ever stuck on a blank page.
   2. Pop-ups and home cards no longer blink. Every redraw re-made them and replayed their fade-in, so "Today's Vort" flashed
      on, off, on, and on a slow Chromebook the home subject cards stayed invisible for 3+ seconds while lessons loaded (their
      slide-in kept restarting). Now a pop-up fades in only when it first appears, and the home cards simply appear.
   3. The sign-in chalkboard logo still writes itself in once, but its shine and honey drips no longer repeat every 6-7 seconds.
   4. A calmer, clearer home screen: the chizuk strip shows ONE still line instead of scrolling words; the subject pictures stop
      bobbing; the Olam Haba cloud sits still in the bottom corner instead of floating over the Play buttons; on phones the floating
      clock stays off the home screen (as HomePage.html already meant: "the floating clock covered Let's go! on phones").
   It changes no lesson, no money and no server call. Off switch: window.TL_CALM = false.
   No slash-slash in this file (HtmlService rule). */
(function(){
if(window.__tlCalm) return; window.__tlCalm=true;
function lift(){ try{ document.documentElement.classList.remove('tl-boot'); }catch(e){} }
if(window.TL_CALM===false){ lift(); return; }
(function(){ if(document.getElementById('tl-calm-css')) return; var s=document.createElement('style'); s.id='tl-calm-css'; s.textContent=''
+'.overlay.tl-still,.overlay.tl-still *{animation:none!important}'
+'.sg5logo .sg5shine,.sg5logo .sg5drip,.sg5logo .sg5drop{animation:none!important}'
+'.hf-kl,.hf-door,.hlg{animation:none!important}'
+'body:is(.hl-hub,.hf-home) .hlmq .in{animation:none!important;width:auto!important;justify-content:center;text-align:center;padding:0 12px}'
+'body:is(.hl-hub,.hf-home) .hlmq .in span:not(:first-child){display:none!important}'
+'body:is(.hl-hub,.hf-home) .hf-kl .ic,body:is(.hl-hub,.hf-home) .hf-door .ico{animation:none!important}'
+'html body.ohmini #ohb .ohc{animation:none!important}'
+'html body.oh-sky:is(.hl-hub,.hf-home).ohmini #ohsky,html body.oh-sky:is(.hl-hub,.hf-home).ohmini #ohsky.slim,html body.oh-sky:is(.hl-hub,.hf-home).ohmini #ohsky:not(.slim){top:auto!important;bottom:calc(12px + env(safe-area-inset-bottom,0px))!important;right:10px!important}'
+'@media (max-width:760px){html body:is(.hl-hub,.hf-home) #tlclock{display:none!important}body:is(.hl-hub,.hf-home){padding-bottom:72px}}';
document.head.appendChild(s); })();
/* pop-ups: fade in once, then stay calm through redraws.
   2026-11-19 (moshe@ session: "the startup ... shows the same screen popping up a bunch of times"): the old way froze a redrawn pop-up
   (tl-still), which cut its opening a fifth of a second in and looked like a jump. Now, when a redraw makes the SAME pop-up again (same
   html), every animation in the new copy is moved to the time it had reached on screen, so the opening plays once, all the way through,
   and moving parts (the sun, floating balloons) keep going without restarting. Without getAnimations, the old tl-still way is used. */
if(typeof render==='function'){ var lastOv=null, ovAt=0, _rc=render;
 render=function(){ var r=_rc.apply(this,arguments); try{ var h=A&&A.overlay&&A.overlay.html||null;
  if(h&&h===lastOv){ var o=document.querySelectorAll('.overlay'), t=performance.now()-ovAt;
   for(var i=0;i<o.length;i++){ if(typeof o[i].getAnimations==='function'){ var an=o[i].getAnimations({subtree:true}); for(var j=0;j<an.length;j++){ try{ an[j].currentTime=t; }catch(x){} } } else o[i].classList.add('tl-still'); } }
  else if(h) ovAt=performance.now();
  lastOv=h; }catch(e){} return r; }; }
/* SOFT 3D (2026-11-20, moshe@ session: "I don't love the 3-D effect of a lot of the buttons ... more modern sleek 3-D effect, a tiny bit
   more natural shadow, not that boxy shadow underneath ... don't ruin the childish appeal"). Many buttons and tiles sit on a solid
   "ledge" (a shadow with no blur, e.g. 0 8px 0 dark-orange). This rewrites every such shadow, in every style on the page (and in
   styles that add-ons add later), into a soft, natural one in the same colour family: lifted a little, blurred, see-through.
   Colours, shapes and the press-down feel stay. Inset shadows and blurred shadows are left alone. Off switch: window.TL_SOFT3D = false. */
(function(){ if(window.TL_SOFT3D===false||window.__tlSoft3d) return; window.__tlSoft3d=true;
 var done=typeof WeakSet==='function'?new WeakSet():null, cv=null;
 function rgba(c,a){ try{ if(!cv) cv=document.createElement('canvas').getContext('2d'); cv.fillStyle='#000'; cv.fillStyle=c; var v=cv.fillStyle;
   if(v.charAt(0)==='#'){ var n=parseInt(v.slice(1),16); return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a.toFixed(3)+')'; }
   var m=v.match(/rgba?\(([^)]+)\)/); if(!m) return null; var p=m[1].split(',').map(function(x){ return parseFloat(x); }); var al=p.length>3?p[3]:1; return 'rgba('+p[0]+','+p[1]+','+p[2]+','+(a*al).toFixed(3)+')'; }catch(e){ return null; } }
 function layers(v){ var out=[], d=0, cur=''; for(var i=0;i<v.length;i++){ var ch=v.charAt(i); if(ch==='(') d++; if(ch===')') d--; if(ch===','&&d===0){ out.push(cur.trim()); cur=''; } else cur+=ch; } if(cur.trim()) out.push(cur.trim()); return out; }
 function soften(v){ if(!v||v.indexOf('px')<0) return null; var L=layers(v), changed=false;
  var R=L.map(function(l){ if(/\binset\b/.test(l)||/var\(/.test(l)) return l;
    var col=(l.match(/(rgba?\([^)]*\)|hsla?\([^)]*\)|#[0-9a-fA-F]{3,8}\b|\b[a-z]+\b)/)||[])[0]; if(!col||/^(none|inset)$/.test(col)) return l;
    var nums=l.replace(col,' ').trim().split(/\s+/).map(function(x){ return /^-?[\d.]+(px)?$/.test(x)?parseFloat(x):NaN; });
    if(nums.length<2||nums.some(isNaN)) return l; var x=nums[0], y=nums[1], b=nums.length>2?nums[2]:0, sp=nums.length>3?nums[3]:0;
    if(b!==0||sp!==0||x!==0||y<2) return l;
    var c=rgba(col,.34); if(!c) return l; changed=true;
    return '0 '+Math.max(2,Math.round(y*.7))+'px '+Math.round(y*2+6)+'px '+c; });
  return changed?R.join(', '):null; }
 function walk(rules){ for(var i=0;i<rules.length;i++){ var r=rules[i];
   if(r.cssRules&&r.cssRules.length) walk(r.cssRules);
   var st=r.style; if(!st) continue; var v=st.getPropertyValue('box-shadow'); if(!v) continue; var n=soften(v); if(n) st.setProperty('box-shadow',n,st.getPropertyPriority('box-shadow')); } }
 function scan(){ try{ var ss=document.styleSheets; for(var i=0;i<ss.length;i++){ var sh=ss[i]; if(done&&done.has(sh)) continue; var rules=null; try{ rules=sh.cssRules; }catch(e){ continue; } if(!rules) continue; walk(rules); if(done) done.add(sh); } }catch(e){} }
 scan(); var t=null; try{ new MutationObserver(function(){ clearTimeout(t); t=setTimeout(scan,60); }).observe(document.documentElement,{childList:true,subtree:true}); }catch(e){ setInterval(scan,2000); }
 window.tlSoft3dScan=scan; })();
/* show the finished page in one go */
if(window.requestAnimationFrame) requestAnimationFrame(function(){ requestAnimationFrame(lift); }); else setTimeout(lift,0);
})();
</script>
