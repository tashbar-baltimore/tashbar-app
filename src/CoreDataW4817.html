  'WRIT.ESSAY.L06.07':{name:'Same and Different',
  teach:[
    {how:'Yehuda is writing a Gazette piece, “Two Sukkahs.” He will compare the yeshiva sukkah with Dovid’s family sukkah at home. His notes: The yeshiva sukkah stands in the parking lot and seats 120 boys. Mr. Halpern and the eighth graders built it on a Sunday, in six hours, with wooden walls. The Lerner sukkah is on the back porch and seats 10 people. Dovid and his Abba built it in two hours, with canvas walls. Both sukkahs have bamboo mats for s’chach, and both have paper chains made by boys. To COMPARE, first list your POINTS: the things you will look at in both, like size, walls and s’chach. For each point, ask: are the two ALIKE or DIFFERENT?', q:'Point: size. The yeshiva sukkah seats 120 boys. The Lerner sukkah seats 10 people. Alike or different?', o:['different','alike','it is not a point']},
    {how:'Then choose a PLAN for the body. A BLOCK plan: one block all about the yeshiva sukkah (its size and walls), then one block all about the Lerner sukkah, with the SAME points in the SAME order. A POINT BY POINT plan: one paragraph for each point, and each paragraph tells about BOTH sukkahs. Either way, the opening names both things, and a closing ends the piece.', q:'Paragraph 1: the size of both sukkahs. Paragraph 2: the walls of both. Paragraph 3: the s’chach of both. Which plan is it?', o:['point by point','block','one side only']},
    {how:'Choose the plan that fits best. TWO points, or a short piece: a block plan works well. THREE or more points: point by point is best, so the reader sees each point side by side and does not have to remember all of one sukkah while he reads about the other. Two mistakes. ONE SIDE ONLY: a point tells about just one of the two things. ORDER DOES NOT MATCH: in a block plan, the second block takes the points in a different order.', q:'Yehuda has four points to compare: size, walls, s’chach and who built it. Which plan fits best?', o:['point by point','block','one side only']}
  ],
  practice:[

  'WRIT.PARA.L06.13':{name:'In Contrast',
  teach:[
    {how:'In Grade 4 your linking words joined an opinion to its reasons, and in Because, So, Therefore your links pointed from reason to result. Now you link two THINGS you compare. A COMPARE WORD tells the reader, before he reads on, if the next part is the SAME or NOT THE SAME. An ALIKE WORD shows the same: “Similarly,” or “Both”. “The yeshiva sukkah has bamboo mats for s’chach. Similarly, the Lerner sukkah has bamboo mats.” “Both sukkahs have paper chains made by boys.”', q:'Which word shows the two sukkahs are ALIKE?', o:['Similarly,','However,','Unlike']},
    {how:'A DIFFERENT WORD shows they are not the same: “In contrast,” “However,” “On the other hand,” or “Unlike”. “The yeshiva sukkah seats 120 boys. In contrast, the Lerner sukkah seats 10 people.” “Similarly,” “In contrast,” “However,” and “On the other hand,” start a sentence, with a comma after. “Unlike” comes before the first thing: “Unlike the yeshiva sukkah, the Lerner sukkah has canvas walls.”', q:'“The yeshiva sukkah has wooden walls. ___ the Lerner sukkah has canvas walls.” Which word fits?', o:['In contrast,','Similarly,','Both']},
    {how:'Two mistakes. The WRONG SIGNAL: an alike word before something different, or a different word before something the same. “The yeshiva sukkah seats 120 boys. Similarly, the Lerner sukkah seats 10 people.” 120 and 10 are not the same! TWO DIFFERENT POINTS: the two sentences are not about the same point. “The yeshiva sukkah has wooden walls. In contrast, the Lerner sukkah seats 10 people.” Walls and size cannot be compared. Keep the SAME point on both sides.', q:'“The yeshiva sukkah seats 120 boys. Similarly, the Lerner sukkah seats 10 people.” What is wrong?', o:['wrong signal','two different points','nothing, it links the right way']}
  ],
  practice:[
    {t:'sort', q:'Sort each compare word: an alike word, or a different word?', bins:[{id:'A',label:'🟰 Alike word'},{id:'D',label:'↔️ Different word'}],
      items:[{label:'Similarly,',bin:'A'},{label:'Both',bin:'A'},{label:'In contrast,',bin:'D'},{label:'However,',bin:'D'},{label:'On the other hand,',bin:'D'},{label:'Unlike',bin:'D'}],
      h:'Does the word tell the reader “the same” or “not the same”?'},
    {t:'pairs', q:'Match each sentence about the yeshiva sukkah to the sentence that links to it.', pairs:[['The yeshiva sukkah has bamboo mats for s’chach.','Similarly, the Lerner sukkah has bamboo mats.'],['The yeshiva sukkah seats 120 boys.','In contrast, the Lerner sukkah seats 10 people.'],['The yeshiva sukkah has wooden walls.','However, the Lerner sukkah has canvas walls.'],['The yeshiva sukkah stands in the parking lot.','On the other hand, the Lerner sukkah is on the back porch.']],
      h:'Find the same point on both sides: s’chach, size, walls or place. Then check the word: same or not the same?'},
    {t:'order', q:'Build the sentence with “Unlike”. Tap the parts in order.', tiles:['Unlike the yeshiva sukkah,','the Lerner sukkah','has canvas walls.'], extra:['Similarly,'],
      h:'“Unlike” and the first thing come first, then a comma. Then the other thing and how it is different.'},
    {t:'spotall', q:'Tap every sentence or pair that links the RIGHT way.', cells:[{label:'The yeshiva sukkah took six hours to build. In contrast, the Lerner sukkah took two hours.',ok:true},{label:'Both sukkahs have paper chains made by boys.',ok:true},{label:'The yeshiva sukkah has bamboo mats. Similarly, the Lerner sukkah has bamboo mats.',ok:true},{label:'The yeshiva sukkah has bamboo mats. However, the Lerner sukkah has bamboo mats.',ok:false},{label:'The yeshiva sukkah seats 120 boys. On the other hand, the Lerner sukkah has canvas walls.',ok:false}],
      h:'Same point on both sides? And does the word match: same, or not the same?'},
    {t:'sort', q:'Sort each pair: does it link the right way, or is it a mistake?', bins:[{id:'R',label:'✅ Links the right way'},{id:'W',label:'❌ Mistake: wrong signal'},{id:'T',label:'❌ Mistake: two different points'}],
      items:[{label:'The yeshiva sukkah is in the parking lot. In contrast, the Lerner sukkah is on the back porch.',bin:'R'},{label:'Unlike the yeshiva sukkah, the Lerner sukkah took only two hours to build.',bin:'R'},{label:'The yeshiva sukkah has wooden walls. Similarly, the Lerner sukkah has canvas walls.',bin:'W'},{label:'The yeshiva sukkah has bamboo mats. In contrast, the Lerner sukkah has bamboo mats too.',bin:'W'},{label:'The yeshiva sukkah has wooden walls. In contrast, the Lerner sukkah seats 10 people.',bin:'T'}],
      h:'First check: are both sentences about the same point? Then check: does the word say same or not the same, and is that true?'},
    {t:'order', q:'Build a compare paragraph about the two sukkahs. Tap the sentences in order.', tiles:['The yeshiva sukkah and the Lerner sukkah are alike in some ways.','One way is the s’chach: both have bamboo mats.','However, the two sukkahs are very different in size.','The yeshiva sukkah seats 120 boys. In contrast, the Lerner sukkah seats only 10 people.'], extra:['Similarly, both sukkahs are huge.'],
      h:'“One way” points back to the “some ways” sentence. “However” turns from alike to different. The size details come after “different in size.”'},
    {t:'write', q:'Your turn. Write three sentences comparing the two sukkahs: one with an alike word (Similarly, or Both), one with a different word (In contrast, However, On the other hand, or Unlike), and one more of your choice.', min:0, checks:['🟰 My alike word comes before something that is the same.','↔️ My different word comes before something that is different.','🎯 Each pair talks about the SAME point on both sides.'], h:'Pick a point first: size, walls, s’chach or place. Say “same” or “different” out loud. Then pick the word.'}
  ],
  check:[
    {q:'Tzvi Hirsch compares his Bubby’s challah and the bakery challah. “Bubby’s challah is sweet. ___ the bakery challah is sweet.” Which kind of word fits the blank?', o:['an alike word','a different word','a reason word'], h:'Sweet and sweet: same, or not the same?'},
    {q:'“Bubby braids her challah with six strands. Similarly, the bakery braids its challah with three strands.” What is wrong?', o:['wrong signal','two different points','nothing, it links the right way'], h:'Six and three: same, or not the same? Does “Similarly” fit?'},
    {t:'order', q:'Bubby’s challah is free. The bakery challah costs $6. Build the sentence with “Unlike”. Tap the parts in order.', tiles:['Unlike the bakery challah,','Bubby’s challah','costs nothing.'], extra:['Similarly,'], h:'“Unlike” and the first thing come first, then a comma. Then the other thing.'}
  ],
  re:[
    {how:'A new way: an alike word is like an equals sign (=). A different word is like a not-equal sign (≠). Put the right sign between the two things.', q:'“In contrast,” is like…', o:['a not-equal sign','an equals sign','a plus sign']},
    {how:'A simpler step: before you write, say “same” or “different” out loud for the point. Same: Similarly, or Both. Different: In contrast, or However.', q:'The point is different. Which word can you use?', o:['In contrast,','Similarly,','Both']},
    {how:'The skill underneath: Because, So, Therefore (this year) and Grade 4’s Linking Words, where every link has a job. Now you go further: compare words link two THINGS, tell the reader alike or different, and stay on the same point.', q:'Compare words tell the reader…', o:['alike or different','reason or result','first or last']}
  ]},

  'WRIT.PARA.L06.14':{name:'Quote It Right',
  teach:[
    {how:'In Proof from the Text you wrote a FULL QUOTE with a source tag: Mr. Halpern said, “A garden is a science lab that grows.” Now you go further. WEAVE a few of his words into the middle of YOUR OWN sentence: Mr. Halpern called the garden “a science lab that grows.” That is a WOVEN QUOTE. The quotation marks go only around HIS exact words. Your words stay outside them, and your sentence still says who said it. For the sukkah piece, Mr. Halpern said, “This sukkah is a dining room for the whole yeshiva.”', q:'Which sentence weaves a quote into the writer’s own sentence?', o:['Mr. Halpern called the yeshiva sukkah “a dining room for the whole yeshiva.”','Mr. Halpern said, “This sukkah is a dining room for the whole yeshiva.”','Mr. Halpern said the sukkah is big.']},
    {how:'Punctuate each kind the right way. A FULL QUOTE: the tag, a COMMA, the quotation mark, then a CAPITAL letter, because the quote starts a sentence. Dovid’s Zaidy says, “A small sukkah can hold a big simcha.” A WOVEN QUOTE: NO comma before it and NO capital, because it is the middle of your sentence. Dovid’s Zaidy says a small sukkah “can hold a big simcha.” In both, the period goes INSIDE the closing quotation mark.', q:'Which full quote is punctuated right?', o:['Dovid’s Zaidy says, “A small sukkah can hold a big simcha.”','Dovid’s Zaidy says “a small sukkah can hold a big simcha.”','Dovid’s Zaidy says, A small sukkah can hold a big simcha.']},
    {how:'Three mistakes. NO QUOTATION MARKS: his exact words with no marks look like YOUR words. A PUNCTUATION MISTAKE: no comma or capital in a full quote, or a comma and a capital before a woven quote. CHANGED WORDS: inside quotation marks, every word must be exactly what he said. If you want other words, leave out the marks and say it in your own words.', q:'“Mr. Halpern called the sukkah a dining room for the whole yeshiva.” These are his exact words. What is wrong?', o:['no quotation marks','changed words','nothing, it is woven right']}
  ],
  practice:[
    {t:'sort', q:'Sort each sentence: a full quote, or a woven quote?', bins:[{id:'F',label:'💬 Full quote (tag, comma, capital)'},{id:'W',label:'🧵 Woven quote (inside my sentence)'}],
      items:[{label:'Mr. Halpern said, “This sukkah is a dining room for the whole yeshiva.”',bin:'F'},{label:'Dovid’s Zaidy says, “A small sukkah can hold a big simcha.”',bin:'F'},{label:'Mr. Halpern called the sukkah “a dining room for the whole yeshiva.”',bin:'W'},{label:'Dovid’s Zaidy says a small sukkah “can hold a big simcha.”',bin:'W'},{label:'Mr. Halpern called the garden “a science lab that grows.”',bin:'W'}],
      h:'A tag, a comma, then a capital: a full quote. His words in the middle of your sentence, with no comma: a woven quote.'},
    {t:'pairs', q:'Match each full quote to the same words woven into a sentence.', pairs:[['Mr. Halpern said, “This sukkah is a dining room for the whole yeshiva.”','Mr. Halpern called the sukkah “a dining room for the whole yeshiva.”'],['Dovid’s Zaidy says, “A small sukkah can hold a big simcha.”','Dovid’s Zaidy says a small sukkah “can hold a big simcha.”'],['Mr. Halpern said, “A garden is a science lab that grows.”','Mr. Halpern called the garden “a science lab that grows.”']],
      h:'Find the same exact words in both. Who said them?'},
    {t:'spotall', q:'Tap every sentence that is punctuated right.', cells:[{label:'Mr. Halpern said, “This sukkah is a dining room for the whole yeshiva.”',ok:true},{label:'Dovid’s Zaidy says a small sukkah “can hold a big simcha.”',ok:true},{label:'Mr. Halpern called the sukkah “a dining room for the whole yeshiva.”',ok:true},{label:'Mr. Halpern said “this sukkah is a dining room for the whole yeshiva.”',ok:false},{label:'Dovid’s Zaidy says a small sukkah, “Can hold a big simcha.”',ok:false}],
      h:'Full quote: comma and capital. Woven quote: no comma, no capital. The period goes inside the closing mark.'},
    {t:'order', q:'Weave Mr. Halpern’s words into your own sentence. Tap the parts in order.', tiles:['Mr. Halpern','called the yeshiva sukkah','“a dining room for the whole yeshiva.”'], extra:['Everyone said,'],
      h:'Who said it comes first. Then your own words. His words come last, inside the quotation marks.'},
    {t:'sort', q:'Dovid’s Zaidy said, “A small sukkah can hold a big simcha.” Mr. Halpern said, “This sukkah is a dining room for the whole yeshiva.” Sort each sentence: quoted right, or a mistake?', bins:[{id:'R',label:'✅ Quoted right'},{id:'N',label:'❌ Mistake: no quotation marks'},{id:'C',label:'❌ Mistake: changed words'}],
      items:[{label:'Dovid’s Zaidy says a small sukkah “can hold a big simcha.”',bin:'R'},{label:'Mr. Halpern called the sukkah “a dining room for the whole yeshiva.”',bin:'R'},{label:'Dovid’s Zaidy says a small sukkah can hold a big simcha.',bin:'N'},{label:'Mr. Halpern called the sukkah “a lunchroom for all the boys.”',bin:'C'},{label:'Dovid’s Zaidy says a small sukkah “holds a really big simcha.”',bin:'C'}],
      h:'Are his exact words inside quotation marks? Check every word against what he really said.'},
    {t:'order', q:'Build Zaidy’s full quote. Watch the comma and the capital. Tap the parts in order.', tiles:['Dovid’s Zaidy says,','“A small sukkah','can hold a big simcha.”'], extra:['“a small sukkah'],
      h:'The tag and a comma come first. A full quote starts with a capital letter.'},
    {t:'write', q:'Your turn. Write two sentences for Yehuda’s sukkah piece. In one, give a full quote with a tag, comma and capital. In the other, weave a few of Dovid’s Zaidy’s words, “can hold a big simcha,” into your own sentence.', min:0, checks:['🧵 I wove a few exact words into my own sentence.','✍️ My full quote has a comma before it and starts with a capital.','🔤 My quoted words are exact, in quotation marks, and I said who said them.'], h:'For the woven quote, start with who said it and your own words. Put his few words last, with no comma and no capital.'}
  ],
  check:[
    {q:'Tzvi Hirsch’s Bubby said, “Challah tastes best when you braid it with love.” Tzvi Hirsch writes: Bubby says challah “tastes best when you braid it with love.” What kind of quote is it?', o:['a woven quote','a full quote','no quotation marks'], h:'Are Bubby’s words in the middle of Tzvi Hirsch’s own sentence?'},
    {q:'Bubby’s real words: “Challah tastes best when you braid it with love.” A boy writes: Bubby says to braid challah, “With love.” What is wrong?', o:['a punctuation mistake','changed words','nothing, it is quoted right'], h:'Are her words in the middle of his own sentence? Then no comma and no capital.'},
    {t:'order', q:'Bubby said, “Challah tastes best when you braid it with love.” Weave her last few words into your own sentence. Tap the parts in order.', tiles:['Bubby says','to braid challah','“with love.”'], extra:[', “With love.”'], h:'Who said it first, then your own words. Her few words come last, in quotation marks: no comma, no capital.'}
  ],
  re:[
    {how:'A new way: quotation marks are like a frame around a picture. They show exactly which words are someone else’s. Everything outside the frame is yours.', q:'Quotation marks are like…', o:['a frame around his exact words','a period','a title']},
    {how:'A simpler step: write the full quote first. Then pick the best few words, and build your own sentence that ends with them.', q:'To weave a quote, keep…', o:['a few of his exact words','all your own words','no quotation marks']},
    {how:'The skill underneath: Proof from the Text (this year) gave a full quote with a source tag, and Dialogue + Action taught commas and quotation marks for talk. Now you go further: you weave a few exact words into your own sentence, and punctuate full and woven quotes the right way.', q:'A woven quote sits…', o:['in the middle of your own sentence','after “The end.”','in the title']}
  ]},

  'WRIT.ESSAY.L06.08':{name:'Two Texts, One Piece',
  teach:[
    {how:'In Proof from the Text you used one text. Now Yehuda has TWO short texts on one topic. TEXT 1, Avrumi’s article “The Yeshiva Sukkah”: “The yeshiva sukkah stands in the parking lot and seats 120 boys. Mr. Halpern and the eighth graders built it on a Sunday, in six hours, with wooden walls and bamboo mats for s’chach. Every class hung a paper chain it made. Mr. Halpern said, ‘This sukkah is a dining room for the whole yeshiva.’” TEXT 2, Dovid’s article “Our Sukkah at Home”: “Our sukkah is on our back porch and seats 10 people. My Abba and I built it in two hours, with canvas walls and bamboo mats for s’chach. My little brothers hung paper chains they made. My Zaidy says, ‘A small sukkah can hold a big simcha.’” Step 1: pick ONE POINT that BOTH texts talk about.', q:'Which point do BOTH texts talk about?', o:['how the sukkah was built','the yeshiva parking lot','what Zaidy says']},
    {how:'Step 2: take ONE DETAIL FROM EACH TEXT about that point. Step 3: NAME BOTH TEXTS, so the reader knows where each detail came from: “In Avrumi’s article,” or “Dovid writes that”. Step 4: say what the two texts show together: “Both texts show that…”. Point: the sukkahs are very different in size. In Avrumi’s article, the yeshiva sukkah seats 120 boys. In contrast, Dovid writes that his family’s sukkah seats only 10 people. Both texts show that a sukkah can be any size.', q:'Which sentence names the text its detail came from?', o:['In Avrumi’s article, the yeshiva sukkah seats 120 boys.','The yeshiva sukkah seats 120 boys.','Everyone knows the yeshiva sukkah is big.']},
    {how:'Three mistakes. ONE TEXT ONLY: both details come from the same text, so the paragraph is not about two texts. TEXT NOT NAMED: like a missing source tag in Proof from the Text, the detail is real, but the reader cannot tell which text it came from. WRONG TEXT NAMED: the detail is named with the other text. Always look back and check.', q:'“In Dovid’s article, the sukkah seats 120 boys.” What is wrong?', o:['wrong text named','one text only','text not named']}
  ],
  practice:[
    {t:'sort', q:'Sort each detail: which text is it from?', bins:[{id:'A',label:'📄 Avrumi’s article (the yeshiva sukkah)'},{id:'D',label:'🏠 Dovid’s article (the sukkah at home)'}],
