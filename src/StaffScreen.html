</style></head><body><div id="app"><div class="center"><div class="box"><h2>One moment…</h2></div></div></div>
<script>
const S={token:null,d:null,q:'',open:null,card:null,add:false,busy:false,err:'',money:null,seenHint:false,last:Date.now(),out:false,tm:false,tmCat:null,tmSel:{},tmSubj:'',tmLvl:0,tmSkill:'',tmMin:45,cls:[]};
const run=(fn,...a)=>new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...a));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const msgOf=e=>String((e&&e.message)||e||'Something went wrong.').replace(/^Error:\s*/,'');
const money=c=>(c<0?'-':'')+'$'+(Math.abs(c)/100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
function sess(v){ try{ if(v===undefined) return JSON.parse(sessionStorage.getItem('tl-session')||'null'); v===null?sessionStorage.removeItem('tl-session'):sessionStorage.setItem('tl-session',JSON.stringify(v)); }catch(e){ return null; } }
function seen(k,v){ try{ if(v) localStorage.setItem('sg-'+k,'1'); return localStorage.getItem('sg-'+k)==='1'; }catch(e){ return !!v; } }
let tt; function toast(m){ let t=$('toast'); if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; t.setAttribute('role','status'); document.body.appendChild(t); } t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>{t.hidden=true;},3000); }
const nm=id=>((S.d&&S.d.names[id])||[id,''])[0];
const subjName=k=>k==='LK'?'Limudei Kodesh':((S.d.subjects.find(s=>s[0]===k))||[k,k])[1];
const boy=id=>S.d.boys.find(b=>b.id===id);
const homeUrl=()=>S.d&&S.d.appUrl?S.d.appUrl:'';
const STAT={green:'Mastered',yellow:'Working',red:'Stuck (many misses)',gray:'Not started'};
/* v65: curriculum catalog ("what is in each box") */
const CAT=()=>(S.d&&S.d.cat)||{list:{},strands:{},curr:{}};
const lvOf=id=>{ const m=/\.L(\d\d)\./.exec(String(id)); return m?+m[1]:0; };
const gradeOf=l=>l===1?'Kindergarten':l>=2&&l<=9?'Grade '+(l-1):l>=10?'High school':'';
const strandOf=(k,id)=>{ const c=String(id).split('.')[1]||''; return ((CAT().strands[k==='LANG'&&String(id).startsWith('WRIT')?'LANG':k]||{})[c])||c; };
const lvlItems=(k,l)=>(CAT().list[k]||[]).filter(x=>lvOf(x[0])===l);
const levelsOf=k=>[...new Set((CAT().list[k]||[]).map(x=>lvOf(x[0])))].filter(Boolean).sort((a,b)=>a-b);
function lvlName(k,l){ if(!l) return ''; const w=k==='MATH'?(S.d.worlds[l]||''):k==='READ'?'Story Road':''; return [gradeOf(l),w].filter(Boolean).join(' · '); }
function prog(c){ const sk=c&&c.skills||[]; return {done:sk.filter(x=>x[2]).length,ready:sk.filter(x=>x[1]).length,all:sk.length}; }
function inBox(k,l,b){ const c=b&&b.cells[k], his=c&&c.level===l, mast={}, items=lvlItems(k,l);
 if(his) (c.skills||[]).forEach(x=>{ if(x[2]) mast[x[0]]=1; });
 if(!items.length) return `<p style="color:var(--soft)">No lessons are listed for this level yet.</p>`;
 const by={}; items.forEach(x=>{ const s=strandOf(k,x[0]); (by[s]=by[s]||[]).push(x); });
 return `<div class="inbox">${Object.keys(by).map(st=>`<h4>${esc(st)}</h4><ul>${by[st].map(x=>{ const now=his&&c.now===x[0], ok=mast[x[0]], cls=now?'now':ok?'ok':x[3]?'':'off', ic=now?'▶':ok?'✅':x[3]?'📘':'🛠';
   return `<li class="${cls}"><i aria-hidden="true">${ic}</i><span><b>${esc(x[1])}</b>${x[2]?`<small>${esc(x[2])}</small>`:''}${now?'<small><b>On this one now</b></small>':ok?'<small>Mastered</small>':x[3]?'':'<small>Lesson still being built</small>'}</span></li>`; }).join('')}</ul>`).join('')}</div>`; }

/* ---------- sign out (button, or by itself after a few idle minutes) ---------- */
function signOut(auto){ const u=homeUrl(); sess(null); S.token=null; S.d=S.d?{appUrl:S.d.appUrl}:null; S.open=null; S.card=null; S.add=false; S.out=auto?'idle':'tap';
 /* Head of School 2026-11-11: sign out = straight back to the home keypad, no extra screen */
 if(u){ try{ window.open(u,'_top'); return; }catch(e){} } render(); }
function outHTML(){ const u=homeUrl();
 return `<div class="center"><div class="box"><h2>${S.out==='idle'?'Signed out after a few quiet minutes.':'You are signed out.'}</h2><p>The next person types their code on the sign-in screen.</p>${u?`<a class="big a" href="${esc(u)}" style="text-decoration:none">Go to the sign-in screen</a>`:''}</div></div>`; }

 let body=`<p class="curr">${esc(CAT().curr[k]||'')}</p><div class="facts"><div><small>Where they are</small>${c.level?`Level ${c.level}${lvlName(k,c.level)?' · '+esc(lvlName(k,c.level)):''}`:'Not placed yet'}</div>`;
 if(c.level&&P.all) body+=`<div><small>Progress in this level</small>${P.done} of ${P.all} mastered · ${P.ready} lesson${P.ready===1?'':'s'} ready to play</div>`;
 if(path&&c.level){ body+=`<div><small>On now</small>${c.now?`${esc(nm(c.now))} <small style="display:inline">· ${esc(strandOf(k,c.now))}</small>`:'Every ready skill at their place is done'}</div><div><small>Next</small>${c.next?esc(nm(c.next)):'—'}</div>`; }
 body+=`<div><small>How it is going</small>${STAT[c.status]}${c.dot?' · stuck today':''}</div></div>`;
 if(path&&c.level){
  body+=`<button class="big a" data-act="give" ${S.busy?'disabled':''}>Give a different skill</button>
  <button class="big b" data-act="skip" ${c.next&&!S.busy?'':'disabled'}>Skip ahead${c.next?': '+esc(nm(c.next)):''}</button>
  <button class="big c" data-act="back" ${c.prev&&!S.busy?'':'disabled'}>Go back a step${c.prev?': '+esc(nm(c.prev)):''}</button>`;
  if(S.open.pick) body+=`<div class="sec"><h3>Pick the skill to give</h3><div class="chips">${c.skills.map(x=>`<button class="chip${x[0]===c.now?' on':''}" data-act="pick" data-s="${x[0]}" ${x[1]&&!S.busy?'':'disabled'}><b>${esc(nm(x[0]))}</b><small>${x[2]?'Mastered':x[1]?'Lesson ready':'Lesson coming'}</small></button>`).join('')}</div></div>`;
 }
 body+=`<div class="sec"><h3>What is inside each level</h3><p class="curr" style="margin:2px 0 0">Tap a number to look inside. The gold ring is their level. Looking does not change anything.</p>
 <div class="peek" role="tablist">${nums.map(l=>`<button class="${l===view?'on':''}${l===c.level?' his':''}" data-act="peek" data-l="${l}" role="tab" aria-selected="${l===view}" aria-label="Level ${l}${l===c.level?', their level':''}">${l}</button>`).join('')}</div>
 <h3 style="font-size:16px;margin-top:8px">Level ${view}${lvlName(k,view)?' · '+esc(lvlName(k,view)):''}</h3>${inBox(k,view,b)}
 ${view!==c.level?`<button class="big a" data-act="lvl" data-l="${view}" ${S.busy?'disabled':''}>Move to Level ${view}</button><p class="curr">The student starts at the first ready lesson of Level ${view}.</p>`:''}</div>`;
 return `<div class="shade" data-act="close"></div><aside class="drawer" role="dialog" aria-label="${esc(b.name)}, ${esc(subjName(k))}"><div class="dh"><h2>${esc(b.name)}<br><span style="font-size:16px;color:var(--soft)">${esc(subjName(k))}</span></h2><button class="x" data-act="close" aria-label="Close">×</button></div>${body}<div class="err" role="alert">${esc(S.err)}</div></aside>`; }
function cardPanel(){ const b=boy(S.card); if(!b) return '';
 let h=`<p class="curr">Tap a subject to see what is inside their level and to change their work.</p><div class="card">${S.d.subjects.map(s=>{ const k=s[0], c=b.cells[k], sw={green:'g',yellow:'y',red:'r',gray:'gr'}[c.status], P=prog(c), pct=P.all?Math.round(P.done/P.all*100):0;
   return `<button class="subj" data-act="sq" data-id="${esc(b.id)}" data-k="${k}"><i class="sw ${sw}" aria-hidden="true"></i><span class="t"><b>${esc(s[1])}</b><small>${esc(CAT().curr[k]||'')}</small></span><span class="lvb">${c.level?'Level '+c.level:'Not placed'}<small>${esc(lvlName(k,c.level))}</small></span>${c.now?`<span class="nw"><small>On now:</small> <b>${esc(nm(c.now))}</b> <small>· ${esc(strandOf(k,c.now))}${P.all?` · ${P.done} of ${P.all} done in this level`:''}${c.dot?' · stuck today':''}</small></span>`:c.level&&P.all?`<span class="nw"><small>${P.done} of ${P.all} done in this level</small></span>`:''}${P.all?`<span class="pbar" aria-hidden="true"><i style="width:${pct}%"></i></span>`:''}</button>`; }).join('')}</div>`;
 if(S.d.head){ const m=S.money;
  h+=`<div class="sec"><h3>Fix points</h3>${!m?'<p style="color:var(--soft)">Loading…</p>':`<div class="bal">${money(m.balanceCents)}</div>
  <div class="f"><label>Amount to add (use a minus sign to take away)<input id="fx-amt" inputmode="decimal" placeholder="e.g. 5.00 or -5.00" autocomplete="off"></label>
  <label>Reason<input id="fx-why" maxlength="160" placeholder="e.g. Lost when the Wi-Fi dropped" autocomplete="off"></label>
  <button class="big a" data-act="fix" ${S.busy?'disabled':''}>Save fix</button></div>
  ${m.fixes.length?`<div style="margin-top:8px">${m.fixes.map(f=>`<div class="fix"><span>${new Date(f.at).toLocaleDateString()} · ${money(f.cents)} · ${esc(f.reason)}${f.undone?' (undone)':''}</span>${!f.undoOf&&!f.undone?`<button data-act="undo" data-t="${esc(f.txn)}">Undo</button>`:''}</div>`).join('')}</div>`:''}`}</div>`; }
 { const p=b.pf, d=p?p.dot:'none'; h+=`<div class="sec"><h3>Pathfinder</h3><p style="margin:0 0 8px">${PFT[d]}${p&&p.assessed?' · '+Object.keys(p.assessed).map(k=>subjName(k)+' Level '+p.assessed[k].level).join(' · '):''}${p&&p.alert?' · <b style="color:var(--r)">alert</b>':''}</p><button class="big c" data-act="pf" data-id="${esc(b.id)}">Open their Pathfinder report</button></div>`; }
 h+=`<div class="sec"><h3>Written work</h3><a class="big c" style="text-decoration:none;text-align:center" href="${esc(homeUrl()+'?ms=1&staff=1&old=1')}">Check their written work</a></div>`;
 h+=`<div class="sec"><h3>Sign-in code</h3>${S.codeSet&&S.codeSet.id===b.id?codeBox(b.name,S.codeSet.code):`<p style="color:var(--soft);margin:0 0 8px">Codes are kept secret, so the old code can’t be shown. You can give a new one.</p>
  <div class="f"><label>New code (4 digits)<input id="cd-code" inputmode="numeric" maxlength="4" autocomplete="off"></label>
  <button class="big c" data-act="gencode" data-f="cd-code" ${S.busy?'disabled':''}>Make one for me</button>
  <button class="big a" data-act="setcode" ${S.busy?'disabled':''}>Save new code</button></div>`}</div>`;
 if(!b.test) h+=`<div class="sec"><h3>Remove student</h3>${S.card2?`<p>Remove ${esc(b.name)} from the list? Their work and history are kept, not deleted.</p><button class="big a" data-act="arch" style="background:var(--r)" ${S.busy?'disabled':''}>Yes, remove this student</button><button class="big c" data-act="noarch">Keep this student</button>`:`<button class="big c" data-act="arch1">Remove student</button>`}</div>`;
 return `<div class="shade" data-act="close"></div><aside class="drawer" role="dialog" aria-label="${esc(b.name)}"><div class="dh"><h2>${esc(b.name)}</h2><button class="x" data-act="close" aria-label="Close">×</button></div>${h}<div class="err" role="alert">${esc(S.err)}</div></aside>`; }
function codeBox(name,code){ return `<div class="sec" style="text-align:center"><p style="margin:0 0 6px">${esc(name)}’s sign-in code:</p><div style="font:700 44px/1.1 monospace;letter-spacing:.3em;padding-left:.3em">${esc(code)}</div><p style="color:var(--soft);margin:6px 0 0">Write it down and give it to the student. It works now.</p></div>`; }
function addPanel(){
 if(S.added) return `<div class="shade" data-act="close"></div><aside class="drawer" role="dialog" aria-label="Student added"><div class="dh"><h2>Student added</h2><button class="x" data-act="close" aria-label="Close">×</button></div>${codeBox(S.added.name,S.added.code)}<button class="big a" data-act="close">Done</button><button class="big c" data-act="addmore">Add another student</button></aside>`;
 return `<div class="shade" data-act="close"></div><aside class="drawer" role="dialog" aria-label="Add student"><div class="dh"><h2>Add student</h2><button class="x" data-act="close" aria-label="Close">×</button></div>
 <div class="f"><label>First and last name<input id="ad-name" maxlength="60" autocomplete="off"></label>
 <label>Grade<select id="ad-grade"><option value="">Pick</option>${['K','1','2','3','4','5','6','7','8'].map(g=>`<option>${g}</option>`).join('')}</select></label>
 <label>Sign-in code (4 digits, their own)<input id="ad-code" inputmode="numeric" maxlength="4" autocomplete="off"></label>
 <button class="big c" data-act="gencode" data-f="ad-code" ${S.busy?'disabled':''}>Make one for me</button>
 <label class="ck"><input type="checkbox" id="ad-ok"> This is a real Tashbar student (not a test name)</label>
 <button class="big a" data-act="addgo" ${S.busy?'disabled':''}>Add student</button></div><div class="err" role="alert">${esc(S.err)}</div></aside>`; }
/* ---------- Teacher mode (v51): a teacher-led class lesson. Picked boys can open ONLY this lesson until class ends. ---------- */
function clock(t){ try{ return new Date(t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); }catch(e){ return ''; } }
function bname(id){ const b=S.d&&S.d.boys&&S.d.boys.find(x=>x.id===id); return b?b.name:id; }
function clsHTML(){ const l=(S.cls||[]).filter(c=>c.until>Date.now()); if(!l.length) return '';
 return `<div class="cls">${l.map(c=>`<div class="cl" role="status"><span>🧑‍🏫 Class lesson: <b>${esc(c.name)}</b> · ${c.sids.length} student${c.sids.length===1?'':'s'} · ends ${esc(clock(c.until))} · by ${esc(c.by)}</span><span class="sp"></span><button data-act="tmmore" data-id="${esc(c.id)}" ${S.busy?'disabled':''}>+10 min</button><button class="end" data-act="tmend" data-id="${esc(c.id)}" ${S.busy?'disabled':''}>End class</button></div>`).join('')}</div>`; }
function tmPanel(){ const cat=S.tmCat, sel=Object.keys(S.tmSel).filter(k=>S.tmSel[k]);
 let h=`<p style="color:var(--soft);margin:0 0 6px">Pick the students and one lesson. Until class ends, those students can open only this lesson. Everything else in the app is closed for them. Their screens unlock by themselves when time is up.</p>`;
 h+=`<div class="sec"><h3>1. Students (${sel.length} picked)</h3><div class="tmrow"><button data-act="tmall">Pick all</button><button data-act="tmnone">Clear</button></div><div class="tmboys">${S.d.boys.map(b=>`<button class="${S.tmSel[b.id]?'on':''}" data-act="tmboy" data-id="${esc(b.id)}" aria-pressed="${S.tmSel[b.id]?'true':'false'}">${S.tmSel[b.id]?'✓ ':''}${esc(b.name)}</button>`).join('')}</div></div>`;
 if(!cat) h+=`<div class="sec"><h3>2. Lesson</h3><p style="color:var(--soft)">Loading the lessons…</p></div>`;
 else { const subs=Object.keys(cat.subjects).filter(k=>cat.lessons.some(x=>x.subj===k)), lv=[...new Set(cat.lessons.filter(x=>x.subj===S.tmSubj).map(x=>x.level))].sort((a,b)=>a-b), ls=cat.lessons.filter(x=>x.subj===S.tmSubj&&x.level===S.tmLvl);
  h+=`<div class="sec"><h3>2. Lesson</h3><div class="f"><label>Subject<select id="tm-subj"><option value="">Pick</option>${subs.map(k=>`<option value="${k}" ${k===S.tmSubj?'selected':''}>${esc(cat.subjects[k])}</option>`).join('')}</select></label>
  <label>Level<select id="tm-lvl" ${S.tmSubj?'':'disabled'}><option value="0">Pick</option>${lv.map(l=>`<option value="${l}" ${l===S.tmLvl?'selected':''}>Level ${l}</option>`).join('')}</select></label>
  <label>Lesson<select id="tm-skill" ${S.tmLvl?'':'disabled'}><option value="">Pick</option>${ls.map(x=>`<option value="${esc(x.id)}" ${x.id===S.tmSkill?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label></div></div>`; }
 h+=`<div class="sec"><h3>3. How long</h3><div class="tmmins">${[20,30,45,60,90].map(m=>`<button class="${m===S.tmMin?'on':''}" data-act="tmmin" data-m="${m}">${m} min</button>`).join('')}</div></div>`;
 h+=`<button class="big a" data-act="tmgo" ${S.busy||!sel.length||!S.tmSkill?'disabled':''}>Start class lesson${sel.length?` for ${sel.length} student${sel.length===1?'':'s'}`:''}</button>`;
 const l=(S.cls||[]).filter(c=>c.until>Date.now()); if(l.length) h+=`<div class="sec"><h3>Running now</h3>${l.map(c=>`<div class="fix"><span><b>${esc(c.name)}</b> · ends ${esc(clock(c.until))}<br><small style="color:var(--soft)">${c.sids.map(bname).map(esc).join(', ')}</small></span><button data-act="tmend" data-id="${esc(c.id)}">End</button></div>`).join('')}</div>`;
 return `<div class="shade" data-act="close"></div><aside class="drawer" role="dialog" aria-label="Teacher mode"><div class="dh"><h2>🧑‍🏫 Teacher mode</h2><button class="x" data-act="close" aria-label="Close">×</button></div>${h}<div class="err" role="alert">${esc(S.err)}</div></aside>`; }
document.addEventListener('change',e=>{ const id=e.target.id; if(id==='tm-subj'){ S.tmSubj=e.target.value; S.tmLvl=0; S.tmSkill=''; render(); } else if(id==='tm-lvl'){ S.tmLvl=+e.target.value; S.tmSkill=''; render(); } else if(id==='tm-skill'){ S.tmSkill=e.target.value; render(); } });
function render(){ const a=$('app'), hadQ=document.activeElement&&document.activeElement.id==='q';
 if(S.out){ a.innerHTML=outHTML(); return; }
 if(!S.d||!S.d.boys){ a.innerHTML='<div class="center"><div class="box"><h2>Loading the students…</h2></div></div>'; return; }
 a.innerHTML=topHTML()+clsHTML()+`<div class="bar"><button class="add" data-act="add">+ Add student</button><button class="add tmb" data-act="tm">🧑‍🏫 Teacher mode</button><input class="search" id="q" placeholder="Find a student" value="${esc(S.q)}" aria-label="Find a student" autocomplete="off"><span class="sp" style="flex:1"></span><div class="legend"><span><i class="sw g"></i>Mastered</span><span><i class="sw y"></i>Working</span><span><i class="sw r"></i>Stuck</span><span><i class="sw gr"></i>Not started</span><span><i class="dot" style="position:static"></i>Stuck today</span></div></div>`+hintHTML()+nowHTML()+`<div class="gw">${gridHTML()}</div>`+(S.page==='lk'?lkPage():S.page==='fam'?famPage():S.page==='grp'?grpPage():S.page==='month'?monthPage():S.page==='rep'?repPage():S.page==='map'?mapPage():S.tm?tmPanel():S.open?sqPanel():S.card?cardPanel():S.add?addPanel():'');
 if(hadQ&&$('q')){ const q=$('q'); q.focus(); q.setSelectionRange(q.value.length,q.value.length); } }

/* ---------- actions ---------- */
function put(b){ const i=S.d.boys.findIndex(x=>x.id===b.id); if(i>=0){ if(!b.pf&&S.d.boys[i].pf) b.pf=S.d.boys[i].pf; S.d.boys[i]=b; } }
function act(fn,args,done){ S.busy=true; S.err=''; render(); return run(fn,S.token,...args).then(r=>{ S.busy=false; done(r); render(); }).catch(e=>{ S.busy=false; const m=msgOf(e); if(/sign in/i.test(m)){ return signOut(false); } S.err=m; render(); }); }
function give(skill){ const k=S.open.k, id=S.open.id; act('sgGive',[id,k,skill],b=>{ put(b); S.open.pick=false; toast(`Saved: ${b.name} now on ${nm(skill)}`); }); }
document.addEventListener('click',e=>{ const t=e.target.closest('[data-act]'); if(!t||t.disabled) return; const a=t.dataset.act;
 if(a==='out'){ sess(null); if(!homeUrl()){ e.preventDefault(); signOut(false); } return; }
 if(a==='music'){ const off=!S.d.musicOff; t.disabled=true; run('sgMusicSet',S.token,off).then(r=>{ S.d.musicOff=!!r.off; render(); toast(r.off?'Music is off for the whole school. Sound effects still work.':'Music is on. Each student picks their own music.'); }).catch(err=>{ t.disabled=false; toast(msgOf(err)); }); return; }
 if(a==='hintok'){ seen('hint1',true); return render(); }
 if(a==='pf'){ const u=homeUrl(); if(u) window.open(u+'?pf=1&report='+encodeURIComponent(t.dataset.id),'_top'); return; }
 if(a==='close'){ S.page=null; S.tm=false; S.open=null; S.card=null; S.add=false; S.added=null; S.codeSet=null; S.card2=false; S.err=''; return render(); }
 if(a==='tm'){ S.open=null; S.card=null; S.add=false; S.err=''; S.tm=true; render(); if(!S.tmCat) run('tmCatalog',S.token).then(c=>{ S.tmCat=c; render(); }).catch(err=>{ S.err=msgOf(err); render(); }); return; }
 if(a==='tmboy'){ const id=t.dataset.id; S.tmSel[id]=!S.tmSel[id]; return render(); }
 if(a==='tmall'){ S.d.boys.forEach(b=>S.tmSel[b.id]=true); return render(); }
 if(a==='tmnone'){ S.tmSel={}; return render(); }
 if(a==='tmmin'){ S.tmMin=+t.dataset.m; return render(); }
 if(a==='tmgo'){ const sids=Object.keys(S.tmSel).filter(k=>S.tmSel[k]), sk=S.tmSkill, n=(S.tmCat.lessons.find(x=>x.id===sk)||{}).name||'';
   return act('tmStart',[sids,sk,S.tmMin],l=>{ S.cls=l; S.tm=false; S.tmSel={}; toast(`Class started: ${n} for ${sids.length} student${sids.length===1?'':'s'}. Their screens lock to this lesson within half a minute.`); }); }
 if(a==='tmend') return act('tmEnd',[t.dataset.id],l=>{ S.cls=l; toast('Class ended. The students’ apps open again within half a minute.'); });
 if(a==='tmmore') return act('tmExtend',[t.dataset.id,10],l=>{ S.cls=l; toast('Added 10 minutes.'); });
 if(a==='addmore'){ S.added=null; S.err=''; render(); const n=$('ad-name'); if(n) n.focus(); return; }
 if(a==='gencode'){ const f=t.dataset.f, keep={}; ['ad-name','ad-grade','ad-code','cd-code'].forEach(i=>{ const x=$(i); if(x) keep[i]=x.value; }); const ok=($('ad-ok')||{}).checked;
   return act('sgFreeCode',[],r=>{ setTimeout(()=>{ Object.keys(keep).forEach(i=>{ const x=$(i); if(x) x.value=keep[i]; }); const x=$(f); if(x) x.value=r.code; const c=$('ad-ok'); if(c) c.checked=!!ok; },0); }); }
 if(a==='setcode'){ const id=S.card, code=(($('cd-code')||{}).value||'').trim();
   return act('sgSetCode',[id,code],r=>{ S.codeSet={id,code}; toast(r.same?`That is already ${r.name}’s code.`:`New code saved for ${r.name}.`); }); }
 if(a==='sq'){ S.card=null; S.add=false; S.err=''; S.open={id:t.dataset.id,k:t.dataset.k,pick:false}; return render(); }
 if(a==='card'){ S.open=null; S.add=false; S.err=''; S.card2=false; S.codeSet=null; S.card=t.dataset.id; S.money=null; render(); if(S.d.head) run('sgMoney',S.token,S.card).then(m=>{ S.money=m; render(); }).catch(err=>{ S.err=msgOf(err); render(); }); return; }
 if(a==='add'){ S.open=null; S.card=null; S.err=''; S.added=null; S.add=true; render(); const n=$('ad-name'); if(n) n.focus(); return; }
 if(a==='rep'){ S.open=null; S.card=null; S.add=false; S.tm=false; S.err=''; S.page='rep'; S.rep=null; render(); run('sgReports',S.token).then(r=>{ S.rep=r; render(); }).catch(err=>{ S.err=msgOf(err); render(); }); return; }
 if(a==='grp'||a==='month'){ S.open=null; S.card=null; S.add=false; S.tm=false; S.err=''; S.page=a; return render(); }
 if(a==='cert') return printCert(t.dataset.id);
 if(a==='lk'){ S.open=null; S.card=null; S.add=false; S.tm=false; S.err=''; S.page='lk'; S.lk=null; render(); return lkLoad(); }
 if(a==='fam'){ S.open=null; S.card=null; S.add=false; S.tm=false; S.err=''; S.page='fam'; S.fam=null; S.famEdit=null; render(); return famLoad(); }
 if(a==='famprint') return famPrint(null);
 if(a==='famone') return famPrint([t.dataset.id]);
 if(a==='famedit'){ S.famEdit=S.famEdit===t.dataset.id?null:t.dataset.id; return render(); }
 if(a==='famsave'){ const id=t.dataset.id, f={parents:($('fe-p')||{}).value||'',email:($('fe-e')||{}).value||'',phone:($('fe-ph')||{}).value||''}; return act('sgFamilySet',[id,f],()=>{ S.famEdit=null; toast('Contact saved.'); famLoad(); }); }
 if(a==='fambulk'){ const tx=($('fam-bulk')||{}).value||''; if(!tx.trim()){ S.err='Paste the list first.'; return render(); } return act('sgFamilyBulk',[tx],r=>{ toast(`Saved ${r.saved} contact${r.saved===1?'':'s'}.`+(r.missed.length?` Not found: ${r.missed.slice(0,5).join('; ')}`:'')); famLoad(); }); }
 if(a==='prize'){ const ym=t.dataset.ym; if(!confirm(`Award the prizes for ${ym}? Each prize pays only once.`)) return; return act('sgAwardPrizes',[ym],r=>{ S.prize=r; toast(r.paid.length?`Paid ${r.paid.length} prize${r.paid.length===1?'':'s'}.`:'Nothing new to pay.'); }); }
 if(a==='map'){ S.open=null; S.card=null; S.add=false; S.tm=false; S.err=''; S.page='map'; return render(); }
 if(a==='repdone') return act('sgReportDone',[t.dataset.s,t.dataset.i],r=>{ S.rep=r; toast('Marked as fixed.'); });
 if(a==='give'){ S.open.pick=!S.open.pick; return render(); }
 if(a==='peek'){ S.open.view=+t.dataset.l; return render(); }
 if(a==='pick') return give(t.dataset.s);
 if(a==='skip'){ const c=boy(S.open.id).cells[S.open.k]; if(c.next) give(c.next); return; }
 if(a==='back'){ const c=boy(S.open.id).cells[S.open.k]; if(c.prev) give(c.prev); return; }
 if(a==='lvl'){ const l=+t.dataset.l, k=S.open.k; return act('sgLevel',[S.open.id,k,l],b=>{ put(b); S.open.pick=false; toast(`Saved: ${b.name}, ${subjName(k)} Level ${l}`); }); }
 if(a==='arch1'){ S.card2=true; return render(); }
 if(a==='noarch'){ S.card2=false; return render(); }
 if(a==='arch'){ const id=S.card, n=boy(id).name; return act('sgArchive',[id],()=>{ S.d.boys=S.d.boys.filter(b=>b.id!==id); S.card=null; S.card2=false; toast(`${n} removed. Their work is kept.`); }); }
 if(a==='fix'){ const amt=Math.round(parseFloat(String(($('fx-amt')||{}).value||'').replace(/[$,\s]/g,''))*100), why=(($('fx-why')||{}).value||'').trim();
   if(!amt){ S.err='Type an amount, like 5.00 or -5.00.'; return render(); } return act('sgFixPoints',[S.card,amt,why],m=>{ S.money=m; toast('Fix saved.'); }); }
 if(a==='undo') return act('sgUndoFix',[S.card,t.dataset.t],m=>{ S.money=m; toast('Fix undone.'); });
 if(a==='addgo'){ const name=($('ad-name')||{}).value||'', grade=($('ad-grade')||{}).value||'', code=($('ad-code')||{}).value||'', ok=!!($('ad-ok')||{}).checked;
   return act('sgAddStudent',[name,grade,code,ok],r=>{ S.added={name:r.name,code:code.replace(/\D/g,'')}; toast(`${r.name} added. They can sign in with their code now.`); load(); }); }
});
document.addEventListener('input',e=>{ if(e.target.id==='q'){ S.q=e.target.value; render(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&(S.open||S.card||S.add||S.tm)){ S.open=null; S.card=null; S.add=false; S.tm=false; render(); } });

/* ---------- start ---------- */
function loadCls(){ if(!S.token) return; run('tmList',S.token).then(l=>{ S.cls=l||[]; render(); }).catch(()=>{}); }
setInterval(()=>{ if(S.token&&S.d&&S.d.boys) loadCls(); },60000);
function load(){ run('sgLoad',S.token).then(d=>{ S.d=d; try{ Object.keys((d.cat&&d.cat.list)||{}).forEach(k=>d.cat.list[k].forEach(x=>{ if(!d.names[x[0]]) d.names[x[0]]=[x[1],x[2]]; })); }catch(e){} render(); loadCls(); loadNow(); }).catch(e=>{ const m=msgOf(e); run('msAppUrl').then(u=>{ S.d={appUrl:u}; signOut(false); }).catch(()=>signOut(false)); if(!/sign in/i.test(m)) toast(m); }); }
(function boot(){ const t=sess(); if(t&&t.role==='staff'&&t.token&&Date.now()-(t.at||0)<6*3600e3){ S.token=t.token; return load(); }
 run('msAppUrl').then(u=>{ S.d={appUrl:u}; signOut(false); }).catch(()=>{ S.out='tap'; render(); }); })();
</script></body></html>
