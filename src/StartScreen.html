<style id="ts-css">
/* StartScreen.html — THE START SCREEN (HoS 2026-11-23, made in Claude Chat and ported as is): a ~3 s intro (the Hive logo builds, then the
   authentic TASHBAR wordmark), then the code card; the 4th number signs in by itself; on success the logo zooms INTO the aleph and the map
   is behind it. Joined to the boy page by sgQuest_ (StaffGrid.js), after SignInEnergy and before CalmScreens.
   It draws its own stage ABOVE the old sign-in page and gives the code to the app's own sign-in (pinGo: the one-trip msSignInFast, staff and
   parent codes, the Wi-Fi fallback), so sign-in itself is not changed. Off switch: window.TL_START = false (back to the old page).
   No slash-slash in this file (HtmlService rule). */
#tsStage{
  --ts-bg-1:#3d22a6; --ts-bg-2:#24106e; --ts-bg-3:#120838;

}
#tsStage *{box-sizing:border-box}
body.ts-on{overflow:hidden!important}
/* while this screen is up, nothing underneath is drawn: the old sign-in page and its moving background, and the map being built during the zoom
   (it is shown, still covered, once the screen is all purple); the corner menu waits until this screen is gone */
body.ts-on:not(.ts-reveal) #app,body.ts-on #sg6bg,body.ts-on #hpbg,body.ts-on #sg6fx,body.ts-on #sg6mu,body.ts-on #tlmenu{display:none!important}
#tsStage{font-family:'Rubik',system-ui,sans-serif;color:#fff;display:none}
body.ts-on #tsStage{display:block}

.ts-stage{position:fixed;inset:0;overflow:hidden;z-index:2147482000;transition:opacity .35s ease;
  background:radial-gradient(ellipse 70% 60% at 50% 40%,var(--ts-bg-1) 0%,var(--ts-bg-2) 50%,var(--ts-bg-3) 100%)}
.ts-stage.ts-gone{opacity:0}
.ts-stage.ts-wait .ts-page,.ts-stage.ts-wait .ts-lockup,.ts-stage.ts-wait .ts-music{visibility:hidden}
.ts-honey{position:absolute;inset:0;width:100%;height:100%}
.ts-honey path{fill:none;stroke:var(--ts-gold);stroke-opacity:.07;stroke-width:1.2}
.ts-glow{position:absolute;left:50%;top:8%;width:min(600px,90vw);height:420px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,186,60,.18),rgba(255,186,60,0));pointer-events:none}

/* ---------- Lockup (logo + authentic TASHBAR wordmark) ---------- */
.ts-lockup{position:absolute;left:50%;top:50%;display:flex;align-items:center;gap:26px;pointer-events:none;
  transform:translate(-50%,-50%) translateY(var(--ts-dy,0px)) scale(var(--ts-s1,.46));transform-origin:center}
.ts-logo{width:200px;height:160px;flex:none}

.ts-ring{fill:none;stroke:var(--ts-gold);stroke-width:3;opacity:0;transform-origin:90px 88px}
.ts-hexfill,.ts-aleph{transform-origin:90px 88px}
.ts-cell{transform-box:fill-box;transform-origin:center}
.ts-burst{fill:none;stroke:var(--ts-gold);stroke-width:2.5;opacity:0}
.ts-words{display:flex;flex-direction:column;gap:4px;align-items:flex-start}

/* ---------- Page (greeting + card + quote) ---------- */
.ts-page{position:absolute;left:50%;top:0;display:flex;flex-direction:column;align-items:center;padding:20px 16px 16px;

.ts-slot{flex:none}
.ts-greet{font-size:17px;font-weight:500;color:#e2dbff;text-align:center;margin:6px 0 14px}

.ts-card{width:400px;max-width:calc(100vw - 32px);padding:22px 24px 16px;background:#fbfaff;border-radius:28px;color:var(--ts-ink);

.ts-slots{display:flex;justify-content:center;gap:12px;margin:14px 0 16px}
.ts-slotbox{width:48px;height:54px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--ts-gold);display:flex;align-items:center;justify-content:center;transition:background .2s}
.ts-slotin{width:42px;height:48px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#fff8e3;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:var(--ts-ink)}
.ts-slotbox.full .ts-slotin{background:linear-gradient(180deg,#ffe58a,#ffb627)}
.ts-slotbox.next{animation:tsSlotPulse 1.2s ease-in-out infinite}
.ts-card.wrong .ts-slotbox{background:#e5486f}
.ts-card.wrong{animation:tsShake .4s}
@keyframes tsSlotPulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes tsShake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.ts-keys{display:grid;grid-template-columns:repeat(3,64px);justify-content:center;column-gap:28px;row-gap:12px}

.ts-key.soft{background:transparent;box-shadow:none;color:var(--ts-muted);font-size:16px;font-weight:600}
.ts-key.del{background:#ffe9ef;color:#b4234f;box-shadow:0 2px 0 #f8cfdb}

.ts-help{margin-top:12px;text-align:center;font-size:13px;color:var(--ts-muted);min-height:16px}

  if (typeof vSignin !== 'function' || typeof render !== 'function' || typeof pinGo !== 'function') return;
  var $ = function (id) { return document.getElementById(id); };
  var host = $('tsStage'), stage = $('tsStageIn'), page = $('tsPage'), lockup = $('tsLockup'), slot = $('tsSlot');
  var card = $('tsCard'), help = $('tsHelp'), zoom = $('tsZoom');
  var slotEls = [].slice.call($('tsSlots').children);
  var ALEPH_W = 45.6;            /* width of the aleph outline in logo units */
  var FINAL_SCALE = 0.46;        /* lockup size at the top of the page */
  var HELP0 = 'You can type your code, too.';
  var code = '', busy = false, shown = false, zooming = false;

  function wanted() { try { return window.TL_START !== false && A.view === 'signin' && !A.staffUrl; } catch (e) { return false; } }

  /* ---- Hooks: the app's own sign-in (pinGo) checks the code; this screen only watches how it ends ---- */
  var hooks = {
    /* true = a boy is signed in (the map is drawn underneath), false = wrong code or no Wi-Fi, 'away' = a staff or parent code (their page opens) */
    checkCode: function (c) {
      return new Promise(function (done) {
        A.err = ''; A.pin = c; A.busy = false;
        try { pinGo(); } catch (e) { return done(false); }

          if (A.view !== 'signin' && A.st) return done(true);

          setTimeout(watch, 80);
        })();
      });
    },
    /* after the zoom: the map is already there underneath; lift the screen */
    onSuccess: function () { hide(true); }
  };

  /* ---- Greeting: time of day + weekday + Hebrew date ---- */
  function greet() {
    var h = new Date().getHours();
    var hello = h < 12 ? 'Good morning!' : h < 17 ? 'Good afternoon!' : 'Good evening!';
    var day = new Date().toLocaleDateString('en-US', { weekday: 'long' });
    var heb = '';
    try { heb = new Intl.DateTimeFormat('en-u-ca-hebrew', { day: 'numeric', month: 'long' }).format(new Date()); } catch (e) {}
    $('tsGreet').innerHTML = hello + ' <b>·</b> ' + day + (heb ? ', ' + heb : '');
  }
  /* the quote: one of the app's thoughts (HomePage.html TL_THOUGHTS), the same one all day */
  function quote() {

    if (!T.length) return;
    var t = T[Math.floor(Date.now() / 864e5) % T.length], esc2 = function (s) { return String(s).replace(/[&<>"]/g, function (m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]; }); };
    $('tsQuote').innerHTML = '“' + esc2(t[0]) + '” <span>— ' + esc2(String(t[1] || '').toUpperCase()) + '</span>';
  }

  /* ---- Honeycomb background ---- */
  function drawHoney() {
    var W = innerWidth, H = innerHeight, r = 34, w = Math.sqrt(3) * r, h = 1.5 * r, d = '';
    for (var row = -1; row * h < H + r; row++) for (var col = -1; col * w < W + w; col++) {

      d += 'Z';
    }

  }

  /* ---- Layout: works on Chromebooks and phones ---- */
  function layout() {
    if (!shown) return;
    var vw = innerWidth, vh = innerHeight;
    var Lw = lockup.offsetWidth, Lh = lockup.offsetHeight;
    var s0 = Math.min(1, (vw - 32) / Lw, (vh * 0.6) / Lh);
    var s1 = Math.min(FINAL_SCALE, (vw - 32) / Lw);
    slot.style.height = (Lh * s1 + 4) + 'px';
    page.style.setProperty('--ts-ps', 1);
    var ps = Math.min(1, (vh - 8) / page.offsetHeight);
    page.style.setProperty('--ts-ps', ps);
    var slotCenterY = (20 + (Lh * s1 + 4) / 2) * ps;
    stage.style.setProperty('--ts-s0', s0);
    stage.style.setProperty('--ts-s1', s1 * ps);
    stage.style.setProperty('--ts-dy', (slotCenterY - vh / 2) + 'px');
    stage.style.setProperty('--ts-slide', ((Lw - 200) / 2) + 'px');
    drawHoney();
  }

  /* ---- Code entry ---- */
  function paint() {
    slotEls.forEach(function (el, i) {
      el.classList.toggle('full', i < code.length);
      el.classList.toggle('next', i === code.length);
      el.firstElementChild.textContent = code[i] || '';
    });
  }
  function type(d) {
    if (busy || zooming || code.length >= 4) return;
    code += d; paint();
    if (code.length === 4) submit();
  }
  function del() { if (busy || zooming) return; code = code.slice(0, -1); paint(); }
  function submit() {
    busy = true;
    setTimeout(function () {
      Promise.resolve(hooks.checkCode(code)).catch(function () { return false; }).then(function (ok) {
        if (ok === 'away') { hide(false); busy = false; code = ''; paint(); return; }
        if (ok) return zoomIn();
        card.classList.remove('wrong'); void card.offsetWidth; card.classList.add('wrong');
        help.textContent = /reach the school|Wi-Fi/i.test(A.err || '') ? A.err : 'That code didn’t work. Try again!';
        A.err = '';
        setTimeout(function () { card.classList.remove('wrong'); code = ''; paint(); busy = false; }, 600);
      });
    }, 300);
  }

  $('tsKeys').addEventListener('click', function (e) {
    e.stopPropagation();
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.tsd) type(b.dataset.tsd);
    else if (b.dataset.tsk === 'del') del();
    else if (b.dataset.tsk === 'help') help.textContent = 'Forgot your code? Ask your teacher.';
  });
  /* the keyboard: this screen takes the digits and Backspace first, so the old page underneath never sees them */
  window.addEventListener('keydown', function (e) {
    if (!shown) return;
    if (/^[0-9]$/.test(e.key)) { e.preventDefault(); e.stopImmediatePropagation(); type(e.key); }
    else if (e.key === 'Backspace') { e.preventDefault(); e.stopImmediatePropagation(); del(); }
    else if (e.key === 'Enter') { e.preventDefault(); e.stopImmediatePropagation(); }
  }, true);

  /* the music button: the sign-in music (EnergyMusic.html), on and off */
  function musicLabel() { var on = !!(window.TL_EM && TL_EM.playing()); var m = $('tsMusic'); m.classList.toggle('on', on); m.setAttribute('aria-pressed', on ? 'true' : 'false'); m.setAttribute('aria-label', on ? 'Stop the music' : 'Music'); }
  $('tsMusic').addEventListener('click', function (e) {
    e.stopPropagation(); if (!window.TL_EM) return;
    try { TL_EM.playing() ? TL_EM.signin(false) : TL_EM.signin(true); } catch (x) {}
    setTimeout(musicLabel, 150);
  });

  /* ---- Zoom into the aleph ---- */
  function zoomIn() {
    zooming = true;
    var logoSvg = $('tsLogo').querySelector('svg');
    var old = zoom.querySelector('.ts-zoomlogo'); if (old) old.remove();
    var clone = logoSvg.cloneNode(true);
    [].forEach.call(clone.querySelectorAll('.ts-ring,.ts-burst,.ts-hexo'), function (n) { n.remove(); });
    [].forEach.call(clone.querySelectorAll('[class]'), function (n) { if (!n.classList.contains('ts-outl') && !n.classList.contains('ts-hexbody')) n.removeAttribute('class'); });
    clone.querySelector('linearGradient').id = 'tsHoneyGrad2';
    clone.querySelector('[fill="url(#tsHoneyGrad)"]').setAttribute('fill', 'url(#tsHoneyGrad2)');
    clone.setAttribute('class', 'ts-zoomlogo');
    clone.removeAttribute('role'); clone.setAttribute('aria-hidden', 'true');
    zoom.insertBefore(clone, zoom.querySelector('.ts-fill'));

    var a = logoSvg.querySelector('.ts-aleph').getBoundingClientRect();
    var dx = a.left + a.width / 2 - innerWidth / 2, dy = a.top + a.height / 2 - innerHeight / 2;
    var sc = a.width / ALEPH_W;
    stage.classList.add('ts-zooming');
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    clone.animate(reduce ? [{ opacity: 1 }, { opacity: 1 }] : [
      { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + sc + ')', easing: 'cubic-bezier(.4,0,.3,1)', offset: 0 },
      { transform: 'translate(0,0) scale(.95)', easing: 'ease-in-out', offset: .35 },
      { transform: 'scale(1.12)', easing: 'cubic-bezier(.85,0,1,.35)', offset: .58 },
      { transform: 'scale(90)', offset: 1 }
    ], { duration: 1700, fill: 'forwards' });
    setTimeout(function () { document.body.classList.add('ts-reveal'); try { render(); } catch (e) {} }, 1750);
    setTimeout(function () { hooks.onSuccess(code); }, 2300);
  }

  /* ---- Show / hide with the app's own state ---- */
  function start() {
    if (!shown) return;
    layout();
    stage.classList.remove('ts-intro'); void stage.offsetWidth; stage.classList.add('ts-intro'); stage.classList.remove('ts-wait');
  }
  function show() {
    shown = true; zooming = false; busy = false; code = ''; paint(); help.textContent = A.bootErr ? 'Can’t reach the school. Check the Wi-Fi.' : HELP0;
    stage.classList.remove('ts-zooming', 'ts-gone'); var z = zoom.querySelector('.ts-zoomlogo'); if (z) z.remove();
    greet(); quote(); musicLabel();
    document.body.classList.add('ts-on'); host.setAttribute('aria-hidden', 'false');
    stage.classList.add('ts-wait');
    /* the intro starts once the fonts are in (at most 1.2 s, so a slow network never keeps the screen empty) */
    var go = function () { if (!shown) return; var fr = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
      Promise.race([fr, new Promise(function (r) { setTimeout(r, 1200); })]).then(start); };
    /* wait for the page's opening cover (CalmScreens) to lift, at most 4 s, so the intro is seen from the start */
    var t0 = Date.now(); (function waitCover() { if (document.documentElement.classList.contains('tl-boot') && Date.now() - t0 < 4000) return setTimeout(waitCover, 60); go(); })();
  }
  function hide(fade) {
    if (!shown) return; shown = false;
    var end = function () { if (shown) return; document.body.classList.remove('ts-on', 'ts-reveal'); host.setAttribute('aria-hidden', 'true'); stage.classList.remove('ts-intro', 'ts-zooming', 'ts-gone'); zooming = false; busy = false; code = ''; paint(); };
    if (fade) { stage.classList.add('ts-gone'); setTimeout(end, 380); } else end();
  }
  function sync() { if (zooming || busy) return; var w = wanted(); if (w && !shown) show(); else if (!w && shown) hide(false); else if (w && !busy) help.textContent = A.bootErr ? 'Can’t reach the school. Check the Wi-Fi.' : (help.textContent === 'Can’t reach the school. Check the Wi-Fi.' ? HELP0 : help.textContent); }

  /* the old page underneath stays a plain place-holder while this screen is up (the old code pad is not drawn) */
  var prevSignin = vSignin;
  vSignin = function () { if (wanted()) return '<section class="ts-host" aria-hidden="true"></section>'; return prevSignin.apply(this, arguments); };
  var prevRender = render;
  render = function () { var r = prevRender.apply(this, arguments); try { sync(); } catch (e) {} return r; };
  addEventListener('resize', layout);
  window.TL_START_SCREEN = { replay: function () { if (shown) start(); }, hooks: hooks };
  try { sync(); if (A.view === 'signin') render(); } catch (e) {}
})();
</script>
