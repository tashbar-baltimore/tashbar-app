<script>
/* StaffLive.html — v197 (takeover3, Head of School 2026-11-15: "do all of them"). Loaded LAST by sgPage_ (uses window.SPX and SPD).
   1. 📱 WALK-AROUND (a tab; the first tab on a phone): one screen for a rebbe walking the room: who needs him now, who is working
      (and on what), who has not started; each boy has one-tap 📜 Torah moment, 🎉 shout-out and his card.
   2. 📜 TORAH MOMENT: from the boy card or Walk-around. The boy's Olam Haba cloud bursts with a golden surge and the rebbe's name
      (a note of kind "torah", sent to the boy). Staff can also send a 🕯️ Good Shabbos message to everyone shown.
   3. ☁️ CLASS SKY: full screen for the projector. One big Olam Haba sky for the boys shown; every answer anyone gives rises into it
      as a spark with his first name; Torah learning rises as golden Hebrew letters. Effort only: no scores, no ranking, no numbers.
   4. 🎓 BECHINA DAY: the "Ready for a level bechina" boys one at a time: tick each lesson ✓ or ✗ as he answers, then Passed (marks
      the whole level) or Not yet (a private note), and on to the next boy. At the end: a printable summary.
   5. 📜 PARSHA OF THE WEEK: the rebbe picks this week's Parsha (from the 54) and, if he wants, one Kodesh lesson; every boy sees it
      on his home screen with a Start button; the card shows who has finished it.
   No "double slash" in this file. */
(function(){
if(typeof S==='undefined'||typeof render!=='function'||typeof run!=='function'||!window.SPX) return;
const X=window.SPX, SP=X.SP;
const L={sky:null,bd:null,par:null,parBusy:0,tm:null,cat:null,shab:null,started:false};
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg=e=>String(e&&e.message||e).replace(/^Error:\s*/,'');
const say=t=>{ try{ toast(t); }catch(e){} };
const ago=t=>{ if(!t) return ''; const m=Math.round((Date.now()-t)/60000); if(m<1) return 'just now'; if(m<60) return m+' min ago'; const h=Math.round(m/60); return h<24?h+' h ago':Math.round(h/24)+' d ago'; };
const boys=()=>(S.d&&S.d.boys||[]).filter(b=>!b.test&&X.inGrp(b.id));
const nameOf=id=>{ const b=(S.d&&S.d.boys||[]).find(x=>x.id===id); return b?b.name:id; };
const first=id=>nameOf(id).split(' ')[0];
const HEB='אבגדהוזחטיכלמנסעפצקרשת';
function css(){ if(document.getElementById('sl-css')) return; const s=document.createElement('style'); s.id='sl-css'; s.textContent=`
.sl-now{max-width:900px;margin:10px auto 40px;padding:0 12px;display:grid;gap:12px}
.sl-now h2{margin:4px 0;font-size:22px}.sl-now .sub{color:var(--soft);font-size:14px;margin:0}
.sl-sec{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px}.sl-sec h3{margin:0 0 8px;font-size:17px;display:flex;gap:8px;align-items:center}.sl-sec h3 small{color:var(--soft);font-weight:600;font-size:13px}
.sl-sec.hot{border-color:#f0b4ad;background:#fff6f5}
.sl-b{display:flex;gap:8px;align-items:center;padding:10px;border-radius:14px;background:var(--bg);margin-bottom:6px}
.sl-b .nm{flex:1 1 auto!important;width:auto!important;min-width:0;border:0;background:none;text-align:left;font-weight:800;font-size:17px;color:var(--ink);padding:0;cursor:pointer}.sl-b .nm small{display:block;font-weight:600;font-size:13px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl-b button.q{flex:none;border:0;border-radius:12px;width:46px;height:46px;font-size:22px;background:#fff;box-shadow:0 2px 0 var(--line);cursor:pointer}
.sl-b button.q.tor{background:linear-gradient(135deg,#fde68a,#f59e0b)}
.sl-tools{display:flex;gap:8px;flex-wrap:wrap}.sl-btn{border:0;border-radius:12px;padding:10px 14px;background:var(--navy);color:#fff;font-weight:800;font-size:14px;cursor:pointer}.sl-btn.gold{background:linear-gradient(90deg,#f59e0b,#eab308)}.sl-btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.sl-pop{position:fixed;z-index:205;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,94vw);background:#fff;border-radius:20px;box-shadow:0 30px 80px rgba(20,30,70,.4);padding:18px}
.sl-pop h3{margin:0 0 6px;font-size:19px}.sl-pop p{margin:0 0 10px;color:var(--soft);font-size:14px}.sl-pop textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit;box-sizing:border-box}.sl-pop .row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.sl-shade{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:204}
.sl-par{background:linear-gradient(135deg,#fff7ed,#fff);border:1px solid #fed7aa;border-radius:16px;padding:12px 14px;margin:0 0 12px}
.sl-par h3{margin:0 0 6px;font-size:17px}.sl-par .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sl-par select,.sl-par input{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px}
.sl-par .who{margin-top:8px;font-size:14px;color:var(--soft)}.sl-par .who b{color:#15803d}
.sl-chm{margin-top:12px;border-top:1px dashed #fed7aa;padding-top:10px}.sl-chm h4{margin:0 0 4px;font-size:15px}.sl-chm .sub{font-size:13px;color:var(--soft);margin-bottom:6px}
.sl-chm .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}.sl-chm .b{display:flex;gap:6px;align-items:center;justify-content:space-between;background:#fff;border:1px solid #fde4c4;border-radius:10px;padding:6px 8px;font-size:13px}
.sl-chm .b b{font-size:14px}.sl-chm .b small{color:var(--soft)}.sl-chm select{padding:4px 6px!important;font-size:13px!important}.sl-chm .md{color:#b45309}
#slsky{position:fixed;inset:0;z-index:300;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#fff8dc 0%,#ffe7a3 18%,#8ec5ff 45%,#3b5bdb 80%,#1e2a78 100%);font-family:var(--body,'Barlow'),sans-serif}
#slsky .cl{position:absolute;left:50%;top:5%;width:min(46vw,560px);transform:translateX(-50%);filter:drop-shadow(0 0 calc(30px + 60px*var(--g,.3)) rgba(255,214,90,.95))}
#slsky .cap{position:absolute;left:0;right:0;top:calc(5% + min(31vw,380px));text-align:center;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.35)}
#slsky .cap .he{font:700 clamp(30px,4vw,54px) 'Frank Ruhl Libre','David',serif}#slsky .cap b{display:block;font:800 clamp(18px,2.2vw,30px) var(--display,'Barlow'),sans-serif}
#slsky .cap small{display:block;font:700 clamp(14px,1.4vw,20px) var(--body,'Barlow'),sans-serif;opacity:.9;margin-top:6px}
#slsky .sp{position:absolute;left:0;top:0;pointer-events:none;font:800 clamp(16px,1.6vw,24px) var(--display,'Barlow'),sans-serif;color:#fff;text-shadow:0 0 12px #ffd447,0 0 4px #fff;white-space:nowrap}
#slsky .sp.k{color:#fff3c4;font-family:'Frank Ruhl Libre','David',serif;font-size:clamp(26px,2.6vw,40px)}
#slsky .slx{position:absolute;right:16px;top:16px;width:auto;height:auto;border:0;border-radius:12px;padding:10px 14px;background:rgba(255,255,255,.88);color:#1e2a78;font-weight:800;font-size:15px;cursor:pointer;white-space:nowrap}
#slsky .slx2{right:118px}
#slbd{position:fixed;inset:0;z-index:300;background:#f8fafc;overflow:auto}
#slbd .in{max-width:760px;margin:0 auto;padding:18px}#slbd h2{margin:0;font-size:26px}#slbd .tr{color:var(--soft);font-weight:700}
#slbd .ls{display:grid;gap:6px;margin:14px 0}#slbd .ls div{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px}
#slbd .ls span{flex:1}#slbd .ls button{border:1px solid var(--line);background:#fff;border-radius:10px;width:44px;height:40px;font-size:18px;cursor:pointer}#slbd .ls button.on.ok{background:#dcfce7;border-color:#22c55e}#slbd .ls button.on.no{background:#fee2e2;border-color:#ef4444}
#slbd .big{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}#slbd .big button{flex:1;min-width:150px;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:800;cursor:pointer}
#slbd .pass{background:#16a34a;color:#fff}#slbd .notyet{background:#f59e0b;color:#fff}#slbd .skip{background:#e2e8f0}
#slbd .bar{height:8px;border-radius:999px;background:#e2e8f0;overflow:hidden;margin:8px 0 14px}#slbd .bar i{display:block;height:100%;background:#16a34a}
@media print{ body.sl-printing #app>*:not(#slbd){display:none!important} body.sl-printing #slbd{position:static} body.sl-printing .sl-noprint{display:none!important} }
`; document.head.appendChild(s); }

/* ---------- 📜 Torah moment / 🕯️ Shabbos message ---------- */
function popHTML(){ const P=L.tm; if(!P) return ''; const shab=P.kind==='shabbos', n=P.sids.length;
 return `<div class="sl-shade" data-sl="tmx"></div><div class="sl-pop" role="dialog"><h3>${shab?'🕯️ Good Shabbos message':P.kind==='praise'?'🎉 Shout-out':'📜 Torah moment'} ${n===1?'for '+E(first(P.sids[0])):'for '+n+' students'}</h3>
 <p>${shab?'Every student sees it on their Erev Shabbos screen, next to their week of Torah learning.':'Their Olam Haba cloud bursts with a golden surge and your name. It is saved in their notes.'}</p>
 <textarea id="sl-tt" rows="3" maxlength="600">${E(P.text)}</textarea>
 <div class="row"><button class="sl-btn ghost" data-sl="tmx">Cancel</button><button class="sl-btn gold" data-sl="tmgo">${shab?'🕯️ Send to all':'📜 Send the Torah moment'}</button></div></div>`; }
function openTorah(sids){ L.tm={kind:'torah',sids,text:sids.length===1?`I saw you learning Torah so beautifully, ${first(sids[0])}! A real Torah moment. ✨`:'A Torah moment for our class! ✨'}; render(); setTimeout(()=>{ const t=document.getElementById('sl-tt'); t&&t.focus(); },50); }
function openShabbos(){ const sids=boys().map(b=>b.id); L.tm={kind:'shabbos',sids,text:'Good Shabbos! Share one thing you learned this week at your Shabbos table. 🕯️'}; render(); }

/* ---------- 📱 Walk-around ---------- */
function nowView(){ const T=SP.today, N=(S.now&&S.now.list)||[], B=boys(); let h=`<div class="sl-now"><div><h2>📱 Walk-around${X.grpName()?' · '+E(X.grpName()):''}</h2><p class="sub">Tap a name for their card. 📜 = Torah moment (their Olam Haba cloud bursts with your name). 🎉 = shout-out.</p></div>`;
 const row=(id,sub)=>`<div class="sl-b"><button class="nm" data-act="card" data-id="${E(id)}">${E(nameOf(id))}<small>${sub||''}</small></button><button class="q tor" data-sl="torah" data-id="${E(id)}" aria-label="Torah moment">📜</button><button class="q" data-sl="shout" data-id="${E(id)}" aria-label="Shout-out">🎉</button></div>`;
 const urg=N.filter(x=>x.kind!=='idle'&&X.inGrp(x.sid)), W={stuck:'🆘 stuck',checkin:'🧱 failed the check again',guess:'⚡ guessing'};
 h+=`<div class="sl-sec ${urg.length?'hot':''}"><h3>🔔 Needs you now <small>${urg.length?urg.length+' student'+(urg.length===1?'':'s'):'nobody right now ✅'}</small></h3>${urg.map(x=>row(x.sid,E(W[x.kind]||x.kind)+(x.skill?' · '+E(x.skillName||x.skill):''))).join('')}</div>`;
 if(T){ const by={}; T.boys.forEach(b=>by[b.id]=b); const work=B.filter(b=>by[b.id]&&(by[b.id].answers+by[b.id].kAnswers)>0).sort((a,b)=>by[b.id].last-by[a.id].last), idle=B.filter(b=>!by[b.id]||!(by[b.id].answers+by[b.id].kAnswers));
  h+=`<div class="sl-sec"><h3>✏️ Working <small>${work.length} · newest first</small></h3>${work.map(b=>{ const t=by[b.id], a=t.answers+t.kAnswers, r=t.right+t.kRight; return row(b.id,`${E(ago(t.last))} · ${a} answers · ${a?Math.round(100*r/a):0}% right${t.kAnswers?' · 📜 '+t.kAnswers+' Torah':''}`); }).join('')||'<p class="sub">Nobody yet today.</p>'}</div>`;
  h+=`<div class="sl-sec"><h3>💤 Not started today <small>${idle.length}</small></h3>${idle.map(b=>row(b.id,'')).join('')||'<p class="sub">Everyone started. 🙌</p>'}</div>`; }
 else h+='<div class="sl-sec">Loading today…</div>';
 h+=`<div class="sl-tools"><button class="sl-btn gold" data-sl="sky">☁️ Class Olam Haba sky</button><button class="sl-btn ghost" data-sl="shab">🕯️ Good Shabbos message to all</button><button class="sl-btn ghost" data-sl="bday">🎓 Bechina day</button></div>`;
 return h+'</div>'; }

/* ---------- ☁️ Class sky (projector) ---------- */
const CLOUD='<svg viewBox="0 0 120 80" aria-hidden="true"><defs><radialGradient id="slg" cx="50%" cy="58%" r="60%"><stop offset="0" stop-color="#fff8d6"/><stop offset=".55" stop-color="#ffe08a"/><stop offset="1" stop-color="#f6c343" stop-opacity="0"/></radialGradient></defs><path d="M28 66h66a20 20 0 0 0 1-40 26 26 0 0 0-49-6 18 18 0 0 0-26 14 16 16 0 0 0 8 32z" fill="#fff" stroke="#eab308" stroke-width="2.5"/><ellipse cx="60" cy="46" rx="40" ry="22" fill="url(#slg)"/></svg>';
function openSky(){ if(document.getElementById('slsky')) return; css(); const d=document.createElement('div'); d.id='slsky';
 d.innerHTML=`<div class="cl">${CLOUD}</div><div class="cap"><div class="he">עוֹלָם הַבָּא</div><b>${E(X.grpName()||'Our class')} · Olam Haba</b><small>Every try rises into our sky ✨ Torah learning shines brightest</small></div><button class="slx" data-sl="skyx">✕ Close</button><button class="slx slx2" data-sl="skyfs">⛶ Full screen</button>`;
 document.body.appendChild(d); L.sky={since:Date.now()-60000,g:.3,timer:null,amb:null}; skyPoll(); L.sky.timer=setInterval(skyPoll,5000);
 L.sky.amb=setInterval(()=>{ if(!document.getElementById('slsky')) return; spark(null,Math.random()<.4); },700); }
function closeSky(){ const d=document.getElementById('slsky'); if(d) d.remove(); if(L.sky){ clearInterval(L.sky.timer); clearInterval(L.sky.amb); } L.sky=null; try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){} }
function skyPoll(){ const K=L.sky; if(!K) return; const sids=boys().map(b=>b.id);
 run('sgClassSky',S.token,X.SP.grp?sids:[],K.since).then(r=>{ if(!L.sky) return; K.since=r.now; (r.ev||[]).slice(-30).forEach((e,i)=>setTimeout(()=>spark(e.first,e.k),i*160));
  K.g=Math.min(1,.25+Math.sqrt((r.today.n||0)+(r.today.k||0)*4)/40); const d=document.getElementById('slsky'); if(d) d.style.setProperty('--g',K.g.toFixed(2)); }).catch(()=>{}); }
function spark(name,k){ const d=document.getElementById('slsky'); if(!d) return; const cl=d.querySelector('.cl').getBoundingClientRect(), W=innerWidth, H=innerHeight;
 const p=document.createElement('i'); p.className='sp'+(k?' k':''); p.textContent=name?(k?'📜 ':'✨ ')+name:(k?HEB[Math.floor(Math.random()*HEB.length)]:'✦'); d.appendChild(p);
 const x0=W*(.05+Math.random()*.9), y0=H+20, x1=cl.left+cl.width*(.3+Math.random()*.4), y1=cl.top+cl.height*.55, dur=(k?3200:4600)+Math.random()*1200;
 p.animate([{transform:`translate(${x0}px,${y0}px) scale(.8)`,opacity:0},{transform:`translate(${x0+(Math.random()-.5)*80}px,${y0-(y0-y1)*.35}px) scale(1)`,opacity:1,offset:.2},{transform:`translate(${x1}px,${y1}px) scale(.5)`,opacity:0}],{duration:dur,easing:'ease-in-out',fill:'both'}).onfinish=()=>p.remove(); }

/* ---------- 🎓 Bechina day ---------- */
function openBday(){ css(); run('sgBechinaReady',S.token).then(r=>{ const Q=(r.ready||[]).filter(x=>X.inGrp(x.sid)); if(!Q.length){ say('Nobody is ready for a level bechina right now.'); return; }
  L.bd={q:Q,i:0,res:[],det:null,tick:{}}; loadBdDet(); drawBd(); }).catch(e=>say(msg(e))); }
function loadBdDet(){ const B=L.bd, x=B.q[B.i]; if(!x) return; B.det=null; run('sgKodeshBoy',S.token,x.sid,x.k).then(r=>{ if(L.bd!==B) return; B.det=(r.lessons||[]).filter(l=>l[2]===x.level); drawBd(); }).catch(()=>{ B.det=[]; drawBd(); }); }
function drawBd(){ const B=L.bd; let d=document.getElementById('slbd'); if(!B){ if(d) d.remove(); document.body.classList.remove('sl-printing'); return; } if(!d){ d=document.createElement('div'); d.id='slbd'; document.body.appendChild(d); }
 const x=B.q[B.i], done=B.i>=B.q.length;
 if(done){ const ok=B.res.filter(r=>r.r==='pass'), ny=B.res.filter(r=>r.r==='notyet');
  d.innerHTML=`<div class="in"><h2>🎓 Bechina day: done!</h2><p class="tr">${new Date().toLocaleDateString()} · ${E(X.grpName()||'')}</p><div class="sl-sec"><h3>✓ Passed <small>${ok.length}</small></h3>${ok.map(r=>`<div>✓ <b>${E(r.name)}</b> · ${E(r.track)} Level ${r.level}</div>`).join('')||'—'}</div>
   <div class="sl-sec" style="margin-top:10px"><h3>⏳ Not yet <small>${ny.length}</small></h3>${ny.map(r=>`<div>⏳ <b>${E(r.name)}</b> · ${E(r.track)} Level ${r.level}${r.miss.length?' · review: '+E(r.miss.join(', ')):''}</div>`).join('')||'—'}</div>
   <div class="big sl-noprint"><button class="skip" data-sl="bdprint">🖨 Print</button><button class="pass" data-sl="bdx">Close</button></div></div>`; return; }
 const ls=B.det; const ticks=B.tick;
 d.innerHTML=`<div class="in"><div style="display:flex;justify-content:space-between;align-items:center" class="sl-noprint"><b class="tr">🎓 Bechina day · ${B.i+1} of ${B.q.length}</b><button class="sl-btn ghost" data-sl="bdx">✕ Close</button></div><div class="bar"><i style="width:${Math.round(100*B.i/B.q.length)}%"></i></div>
  <h2>${E(x.name)}</h2><div class="tr">${E(x.track)} · Level ${x.level} · ${x.n} lessons, all mastered in the app</div>
  <div class="ls">${ls?ls.map(l=>`<div><span>${E(l[1])}</span><button class="${ticks[l[0]]==='ok'?'on ok':''}" data-sl="tk" data-l="${E(l[0])}" data-v="ok" aria-label="Knew it">✓</button><button class="${ticks[l[0]]==='no'?'on no':''}" data-sl="tk" data-l="${E(l[0])}" data-v="no" aria-label="Not yet">✗</button></div>`).join(''):'<div>Loading their lessons…</div>'}</div>
  <div class="big"><button class="pass" data-sl="bdpass">✓ Passed Level ${x.level}</button><button class="notyet" data-sl="bdno">⏳ Not yet</button><button class="skip" data-sl="bdskip">Skip ›</button></div></div>`; }
function bdNext(r){ const B=L.bd, x=B.q[B.i]; const miss=(B.det||[]).filter(l=>B.tick[l[0]]==='no').map(l=>l[1]); if(r) B.res.push({name:x.name,track:x.track,level:x.level,r,miss}); B.i++; B.tick={}; loadBdDet(); drawBd(); }

/* ---------- 📜 Parsha of the week (This week and Limudei Kodesh tabs) ---------- */
function loadPar(){ if(L.parBusy) return; L.parBusy=1; run('sgParshaInfo',S.token).then(r=>{ L.parBusy=0; L.par=r; render(); }).catch(()=>{ L.parBusy=0; }); }
function loadCat(){ if(L.cat) return; run('sgPickCatalog',S.token).then(r=>{ L.cat=r.lessons.filter(x=>/^LK/.test(x[2])); render(); }).catch(()=>{}); }
/* v202: the Chumash page (ChumashPage.html) for the rebbe: each boy's level, the level the rebbe sets, parshiyos mastered */
function chmHTML(P,B){ const C=P.chm; if(!C) return ''; const lvo=(v,own)=>`<option value="0">${own?'Their choice (now '+own+')':'Their choice'}</option>`+[1,2,3,4,5,6,7,8].map(n=>`<option value="${n}" ${v===n?'selected':''}>Level ${n}</option>`).join('');
 const nm=P.parsha&&P.parsha.name;
 const used=B.filter(b=>(C[b.id]||{}).used).length, med=B.reduce((t,b)=>t+((C[b.id]||{}).n||0),0);
 if(!L.chmOpen) return `<div class="sl-chm"><div class="row"><h4 style="margin:0">📖 Chumash page</h4><span class="sub" style="margin:0">${used} of ${B.length} students learning · ${med} Parsha medal${med===1?'':'s'}</span><button class="sl-btn ghost sd-noprint" data-sl="chmopen">Levels ▾</button></div></div>`;
 return `<div class="sl-chm"><div class="row"><h4 style="margin:0">📖 Chumash page: levels</h4><button class="sl-btn ghost sd-noprint" data-sl="chmopen">Close ▴</button></div><div class="sub">Every student has all 54 parshiyos with every word, English and Rashi. Set their level here (1–8; Rashi starts at 4). 🏅 = Parsha mastered.</div>

 if(a==='skyfs'){ try{ document.getElementById('slsky').requestFullscreen(); }catch(x){} return; }
 if(a==='bday'){ openBday(); return; }
 if(a==='bdx'){ L.bd=null; drawBd(); return; }
 if(a==='tk'){ const B=L.bd; if(!B) return; B.tick[b.dataset.l]=B.tick[b.dataset.l]===b.dataset.v?null:b.dataset.v; drawBd(); return; }
 if(a==='bdskip'){ bdNext(null); return; }
 if(a==='aron'||a==='aroff'){ b.disabled=true; run('arSet',S.token,a==='aron').then(r=>{ if(L.par) L.par.arena=r; say(a==='aron'?'⚔️ The Arena is open.':'⚔️ The Arena is closed. Students see "closed" until you open it.'); render(); }).catch(err=>{ b.disabled=false; say(msg(err)); }); return; }
 if(a==='chnew'){ chOpenUI(); return; }
 if(a==='arlist'){ L.arOpen=!L.arOpen; render(); return; }
 if(a==='chmopen'){ L.chmOpen=!L.chmOpen; render(); return; }
 if(a==='chall'){ const sel=document.getElementById('sl-chall'); if(!sel||sel.value===''){ say('Pick a level first.'); return; } const v=+sel.value, ids=boys().map(x=>x.id); b.disabled=true; run('sgChmSetLevel',S.token,ids,v).then(r=>{ L.par=r; say(v?'📖 The whole class is on Chumash Level '+v+'.':'📖 Each student chooses their own level now.'); render(); }).catch(err=>{ b.disabled=false; say(msg(err)); }); return; }
 if(a==='bdpass'){ const B=L.bd, x=B.q[B.i]; b.disabled=true; run('sgLevelBechina',S.token,x.sid,x.k,x.level).then(()=>{ say('🎓 Mazel tov! '+x.name.split(' ')[0]+' passed.'); bdNext('pass'); }).catch(err=>{ say(msg(err)); b.disabled=false; }); return; }
 if(a==='bdno'){ const B=L.bd, x=B.q[B.i], miss=(B.det||[]).filter(l=>B.tick[l[0]]==='no').map(l=>l[1]);
  run('sgNote',S.token,x.sid,'note',`Bechina ${x.track} Level ${x.level}: not yet.${miss.length?' Review: '+miss.join(', ')+'.':''}`,false).catch(()=>{}); bdNext('notyet'); return; }
 if(a==='bdprint'){ document.body.classList.add('sl-printing'); window.print(); setTimeout(()=>document.body.classList.remove('sl-printing'),500); return; }
 if(a==='parset'||a==='parclr'){ const n=a==='parclr'?'':(document.getElementById('sl-pn')||{}).value, l=a==='parclr'?'':(document.getElementById('sl-pl')||{}).value, t=(document.getElementById('sl-pt')||{}).value||'';
  if(a==='parset'&&!n){ say('Pick the Parsha first.'); return; } run('sgSetParsha',S.token,n,l,t).then(r=>{ L.par=r; L.parPick=null; say(n?'📜 Parshas '+n+' is set. Every student sees it on their home screen.':'Parsha cleared.'); render(); }).catch(err=>say(msg(err))); return; }
},true);
document.addEventListener('change',e=>{ const t=e.target; if(t&&t.id==='sl-pn'){ L.parPick=t.value; render(); }
 if(t&&t.classList&&t.classList.contains('sl-chl')){ const v=+t.value; t.disabled=true; run('sgChmSetLevel',S.token,[t.dataset.id],v).then(r=>{ L.par=r; say(v?'📖 Chumash Level '+v+' is set. They see it next time they open the Chumash.':'📖 They choose their own level now.'); render(); }).catch(err=>{ t.disabled=false; say(msg(err)); }); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(document.getElementById('slsky')) closeSky(); else if(L.bd){ L.bd=null; drawBd(); } else if(L.tm){ L.tm=null; render(); } } });
setInterval(()=>{ if(SP.tab==='now'&&S.token&&!document.hidden&&!S.card&&!document.querySelector('.sl-pop,.sd-pop')) render(); },30000);
if(S.d&&S.d.boys) render();
})();
</script>
