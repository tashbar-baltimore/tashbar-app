const onHub=()=>{ try{ return window.HOME_ORDER2!==false&&A.view==='hub'&&!!A.st&&!!document.getElementById('hlx'); }catch(e){ return false; } };
function undock(){ const c=document.getElementById('tlcash'); if(c&&c.classList.contains('docked')){ c.classList.remove('docked'); document.body.appendChild(c); } }
function arrange(){ try{
  const on=onHub(); document.body.classList.toggle('hl2',on); if(!on){ undock(); return; }
  const hp=document.querySelector('.hp'), hlx=document.getElementById('hlx'), bar=document.querySelector('#hlx-top header.hpbar');
  /* 1. the logo, centered across the top */
  document.querySelectorAll('.hl2-logo').forEach(x=>{ if(x.parentNode!==hlx) x.remove(); });
  const lg=bar&&bar.querySelector('.tl-logo'); if(lg&&!hlx.querySelector(':scope > .hl2-logo')){ const w=document.createElement('div'); w.className='hl2-logo'; w.appendChild(lg.cloneNode(true)); hlx.insertBefore(w,hlx.firstChild); }
  /* 2. Start here front and center; the money and Today's steps under it */
  const st=hlx.querySelector('.hlx-start'); if(st){ let u=st.querySelector('.hl2-under'); if(!u){ u=document.createElement('div'); u.className='hl2-under'; st.appendChild(u); }
    const steps=st.querySelector(':scope > .hlx-steps'); if(steps) u.appendChild(steps);
    const c=document.getElementById('tlcash'); if(c&&c.parentNode!==u){ c.classList.add('docked'); u.insertBefore(c,u.firstChild); } }
  /* 2a. the greeting, centered above Start here; the streak alone in the corner, on one line */
  try{ const top=hlx.querySelector('#hlx-top'), stt=hlx.querySelector('.hlx-start'), hello=bar&&bar.querySelector('.hello');
    if(top&&stt&&hello){ let g=top.querySelector('.hl2-greet'); if(!g){ g=document.createElement('div'); g.className='hl2-greet'; stt.parentNode.insertBefore(g,stt); }
      const gb=hello.querySelector(':scope > b'); if(gb){ g.innerHTML=''; g.appendChild(gb); }
      const sk=hello.querySelector(':scope > .streak'), m=sk&&String(sk.textContent).match(/(\d+)/), n=m?+m[1]:0;
      const want=n>=2?'<span class="hl2-skf" aria-hidden="true">🔥<em>'+n+'</em></span><span>day streak</span>':'<span class="hl2-skf" aria-hidden="true">🔥</span><span>Start a streak today!</span>';
      let c=hello.querySelector(':scope > .hl2-sk'); if(!c){ c=document.createElement('span'); hello.appendChild(c); }
      if(c.dataset.n!==String(n)){ c.dataset.n=String(n); c.className='hl2-sk'+(n>=2?'':' off'); c.innerHTML=want; c.setAttribute('aria-label',n>=2?n+' day streak':'Start a streak today'); } } }catch(e){}
  /* 2b. fewer words: Start here gets a progress bar; started lesson cards get a thin bar; the Pathfinder note is one line */
  try{ const go=hlx.querySelector('.hlx-go'), sm=go&&go.querySelector('small');
    if(go&&sm){ const m=String(sm.textContent).match(/(\d+)\s*of\s*(\d+)/); const d=m?+m[1]:0, n=m?Math.max(1,+m[2]):0;
      let b=go.querySelector('.hl2-pbar'); if(n&&d===0){ if(b) b.remove(); go.classList.remove('hl2-done'); go.setAttribute('aria-label','Start here'); } else if(n){ if(!b){ b=document.createElement('span'); b.className='hl2-pbar'; b.innerHTML='<i></i>'; go.appendChild(b); const t=go.querySelector('.hlx-gt'); if(t&&!t.querySelector('.hl2-ok')) t.insertAdjacentHTML('beforeend','<span class="hl2-ok" aria-hidden="true">✓</span>'); }
        const pc=Math.round(Math.min(1,d/n)*100); b.firstChild.style.width=pc+'%'; go.classList.toggle('hl2-done',d>=n); go.setAttribute('aria-label','Start here: '+d+' of '+n+' steps done today'); } } }catch(e){}
  hlx.querySelectorAll('.hf-kwrap .hf-kl').forEach(k=>{ if(k.querySelector('.hl2-kbar')) return; const sm=k.querySelector('.tx small'); const m=sm&&String(sm.textContent).match(/finished\s+(\d+)\s+of\s+(\d+)/i);
    if(m&&+m[1]>0){ const tx=k.querySelector('.tx'); if(tx) tx.insertAdjacentHTML('beforeend','<span class="hl2-kbar" role="img" aria-label="'+m[1]+' of '+m[2]+' done"><i style="width:'+Math.round(+m[1]/Math.max(1,+m[2])*100)+'%"></i></span>'); } });
  hlx.querySelectorAll(':scope > .cn-card .tlq .h').forEach(h=>{ if(!h.dataset.hl2){ h.dataset.hl2='1'; h.textContent='🧭 Finish your Pathfinder to get all your lesson money'; } });
  /* 3. the quick tools fold into the ⋮ menu */
  qtMenu(bar);
  /* 4. the Canteen money card(s) at the bottom, as wide as the banner */
  const app=document.getElementById('app'); if(app) app.querySelectorAll(':scope > .cn-card').forEach(c=>hlx.appendChild(c));
}catch(e){ console.error('Home order 2',e); } }
const QT=window.HL2QT=window.HL2QT||{open:false};
function qtMenu(bar){ const tools=bar&&bar.querySelector('.tools'); if(!tools) return;
  const list=[tools.querySelector('#mubtn'),tools.querySelector('[data-tr="open"]'),tools.querySelector('[data-act="sound"]'),tools.querySelector('.stcannon')].filter(Boolean);
  let m=tools.querySelector(':scope > .hl2-qt'); const fresh=!m;
  if(!m){ m=document.createElement('div'); m.className='hl2-qt still'; m.innerHTML='<span class="hl2-qtbg" aria-hidden="true"></span><button type="button" class="hl2-qtt" aria-label="Tools: music, messages, sound" aria-expanded="false"><span aria-hidden="true">✕</span></button>'; tools.appendChild(m); }
  const n=list.length, GAP=54; let changed=fresh;
  list.forEach((b,i)=>{ if(b.parentNode!==m){ m.appendChild(b); changed=true; } b.classList.add('hl2-qti');
    b.style.setProperty('--dy',((i-(n-1)/2)*11)+'px'); b.style.setProperty('--dx0','0px'); b.style.setProperty('--dx',(-(n-i)*GAP)+'px');
    b.style.setProperty('--do',((n-1-i)*70)+'ms'); b.style.setProperty('--dc',(i*50)+'ms'); b.tabIndex=QT.open?0:-1; });
  m.style.setProperty('--qtw',(n*GAP+48)+'px');
  m.classList.toggle('open',QT.open); m.querySelector('.hl2-qtt').setAttribute('aria-expanded',String(QT.open));
  if(changed) requestAnimationFrame(()=>requestAnimationFrame(()=>m.classList.remove('still'))); }
function qtSet(open){ QT.open=open; const m=document.querySelector('.hpbar .tools .hl2-qt'); if(m) qtMenu(m.closest('.hpbar')); }
document.addEventListener('click',e=>{ const t=e.target; if(!t||!t.closest) return; if(t.closest('.hl2-qtt')){ e.preventDefault(); qtSet(!QT.open); return; }
  if(QT.open&&!t.closest('.hl2-qt')) qtSet(false); },true);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&QT.open) qtSet(false); });
const _r=render;
render=function(){ try{ const c=document.getElementById('tlcash'); if(c&&c.closest('#app')){ c.classList.remove('docked'); document.body.appendChild(c); } }catch(e){}
  const out=_r.apply(this,arguments); arrange(); return out; };
setInterval(arrange,500);   /* the money badge is made a moment after the home is drawn, and leaves it on other pages */
})();
</script>
