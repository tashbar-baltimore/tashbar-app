      {type:'tiles', w:['f','l','oa','t'], extra:['ow'], hear:'float', say:'Shmuli\'s toy boat can float. Build float.', how:'The oh sound is in the middle, so use o-a.'},

      {type:'dictation', hear:'Show me the boat.', w:['Show','me','the','boat.'], extra:['Shoa'], say:'Listen. Build it. Pick the right spelling.', how:'Show ends with o-w. Boat has o-a in the middle.'}]},

    { id:'READ.LV.L02.09', grade:1, name:'Which Team? Spell It!', pic:'✏️', after:'READ.LV.L02.08', acts:[
