      {type:'listen', hear:'her', o:['her','hur','hir'], a:'her', say:'Er has three spellings. Pick the one you have read.', how:'Her is a short word you know. It uses e-r.'},
      {type:'listen', q:'Shmuli is ___ in line.', hear:'Now read the sentence.', o:['first','furst','ferst'], a:'first', say:'Read it. Which spelling is right?', how:'First uses i-r, like bird and shirt.'},
      {type:'dictation', hear:'A bird ate the corn.', w:['A','bird','ate','the','corn.'], extra:['berd','carn.'], say:'Listen. Build it. Pick the right spellings.', how:'Bird uses i-r. Corn has the or sound.'}]},

    { id:'READ.FLU.L02.10', grade:1, name:'Who Is Talking?', pic:'💬', after:'READ.PHON.L02.26', acts:[
      {type:'listen', q:'"I can run fast," said Dov.', hear:'Who is talking?', o:['Dov','Abba','Shmuli'], a:'Dov', say:'Talking marks hug the talking words. Who is talking?', how:'Find the word said. The name next to it is the talker.'},
      {type:'sort', bins:['Talking words','Who said it'], cards:[['"Can I play?"',0],['said Ben',1],['"Let us go!"',0],['yelled Zev',1]], say:'Sort the talking words from who said them.', how:'Talking words are inside the marks. The name tells who.'},
      {type:'listen', q:'Shmuli said, "Zeidy, see the big star!"', hear:'Who is talking?', o:['Shmuli','Zeidy','Dov'], a:'Shmuli', mis:true, say:'Zeidy is in it too. But who is talking?', how:'The talker is next to said. Zeidy is who he talks to.'},
      {type:'evidence', q:'What did Abba say?', p:['Abba went to the farm.','"Shmuli, it is time to go," said Abba.','Shmuli got his coat.'], a:1, look:'what Abba said', say:'Tap the sentence where Abba talks.', how:'Look for the talking marks.'},
      {type:'listen', q:'"Help!" yelled Ben.', hear:'How should Ben sound?', o:['😱','😴','😊'], a:'😱', say:'Stand up and read it like Ben! How does he sound?', how:'Help, the mark at the end and yelled tell you: loud!'},
      {type:'dictation', hear:'"Come in!" said Zeidy.', w:['"Come','in!"','said','Zeidy.'], extra:['sed'], say:'Listen. Build it with the talking marks.', how:'The talking words come first, then said Zeidy.'},
      {type:'listen', q:'"Shh, the baby is sleeping," said Abba.', hear:'How should Abba sound?', o:['🤫','😱','😂'], a:'🤫', say:'Read it like Abba. How should he sound?', how:'Shh and sleeping tell you: soft and quiet.'},
      {type:'evidence', q:'Who helps the boys feel safe?', p:['"A storm is coming!" yelled Dov.','"Do not be afraid," said Zeidy.','"I will go in," said Shmuli.'], a:1, look:'who helps them feel safe', say:'Read what each one says. Who helps them feel safe?', how:'Read the talking words. Who says something kind?'}]},

    /* ===== Grade 1 Unit 10 · Two-syllable words (F-map section 4). Two-Part Words (READ.PHON.L02.03) and Ending Smart (.04) are the existing
       games of this unit; the beat and split games follow Two-Part Words, -er/-est and neat copying follow Ending Smart. Taught now also: bossy r (Unit 9). ===== */
    { id:'READ.PA.L02.04', grade:1, name:'Every Beat Has a Vowel', pic:'👏', after:'READ.PHON.L02.03', acts:[
      {type:'tiles', w:['bas','ket'], extra:['ba'], hear:'basket', pic:'🧺', say:'Every beat has a vowel. Build basket, one beat at a time.', how:'Bas, ket. Each beat has its own vowel.'},
      {type:'sort', bins:['one beat','two beats'], cards:[['coat',0],['catnip',1],['shark',0],['rainbow',1],['sleep',0],['sunset',1]], say:'Clap it. Every clap has a vowel. One beat or two?', how:'Clap as you say it. A vowel team is one beat.'},
      {type:'listen', hear:'napkin', o:['napkin','catnip','pumpkin'], a:'napkin', say:'Now find the word you hear.', how:'Say it in beats: nap, kin. Find nap, then kin.'},
      {type:'findall', grid:['boat','robot','seed','rabbit','rain','sunset'], find:['robot','rabbit','sunset'], findSay:'word with two beats', mis:true, say:'Shmuli counts o-a as two beats. Find the real two-beat words.', how:'A team like o-a is one sound. Count the vowel sounds.'},
      {type:'tiles', w:['mag','net'], extra:['mg'], hear:'magnet', pic:'🧲', say:'Each beat needs a vowel. Build magnet.', how:'Mag has a vowel. Net has a vowel. No vowel, no beat.'},
      {type:'match', pairs:[['rocket','🚀'],['hotdog','🌭'],['tennis','🎾']], say:'Jump two times, once for each beat! Now match.', how:'Read one beat, then the next. Push them together.'},
      {type:'dictation', hear:'The kitten is in the basket.', w:['The','kitten','is','in','the','basket.'], extra:['baskt.'], say:'Listen. Build it. Every beat needs a vowel.', how:'Kit, ten. Bas, ket. Each beat has a vowel.'}]},

    { id:'READ.PHON.L02.27', grade:1, name:'Rab-bit Split', pic:'🐰', after:'READ.PA.L02.04', acts:[
      {type:'tiles', w:['rab','bit'], extra:['ra'], hear:'rabbit', pic:'🐰', say:'Two consonants in the middle? Split between them. Build rabbit.', how:'Rab, bit. The line goes between the two b\'s.'},
      {type:'listen', hear:'insect', o:['insect','inside','index'], a:'insect', say:'Now find the word you hear.', how:'Split it: in, sect. Read each beat.'},
      {type:'sort', bins:['Right split 👍','Wrong split 👎'], cards:[['pic | nic',0],['pi | cnic',1],['sun | set',0],['su | nset',1],['muf | fin',0],['mu | ffin',1]], mis:true, say:'Shmuli split these words. Did he split between the two?', how:'Find the two consonants in the middle. The line goes between them.'},
      {type:'tiles', w:['pic','nic'], extra:['pik'], hear:'picnic', pic:'🧺', say:'Bubby packs lunch for a picnic. Build picnic.', how:'Pic, nic. Both beats end the same way: the c tile.'},
      {type:'match', pairs:[['hammer','🔨'],['ladder','🪜'],['letter','✉️']], say:'Tap your knees two times! Now read and match.', how:'Split between the two consonants. Read each beat.'},
      {type:'evidence', q:'What did Shmuli see?', p:['Shmuli went to the garden.','He could see a rabbit by the carrots.','It ran into a basket.'], a:1, look:'what he could see', say:'Read it. Tap the sentence that tells what Shmuli saw.', how:'Read each one. Which one tells what he could see?'},
      {type:'dictation', hear:'The rabbit hid in the garden.', w:['The','rabbit','hid','in','the','garden.'], extra:['rabit'], say:'Listen. Build it. Pick the right spelling.', how:'Rab, bit. Rabbit has two b\'s, one in each beat.'}]},

    { id:'READ.PHON.L02.28', grade:1, name:'Fast, Faster, Fastest', pic:'🏎️', after:'READ.PHON.L02.04', acts:[
      {type:'tiles', w:['fast','er'], extra:['ar'], hear:'faster', say:'Add er to fast. Faster means more fast. Build faster.', how:'Fast, then the ending: er. Faster means more fast.'},
      {type:'sort', bins:['er','est'], cards:[['darker',0],['darkest',1],['quicker',0],['quickest',1],['sharper',0],['sharpest',1]], say:'Er means more. Est means the most. Sort by the ending.', how:'Look at the very end of the word. Er or est?'},
      {type:'listen', hear:'longest', o:['longest','longer','long'], a:'longest', say:'Now find the word you hear.', how:'Listen to the end: est. Find the word with est.'},
      {type:'sort', bins:['Right 👍','Fix it 👎'], cards:[['A jet is faster than a car.',0],['A jet is fastest than a car.',1],['Ben is the quickest of the three kids.',0],['Ben is the quicker of the three kids.',1]], mis:true, say:'Shmuli mixes up er and est. Is each one right?', how:'Two things? Use er. Three or more? Use est.'},
      {type:'listen', q:'Dov is quick. Zev is ___. Ben is the quickest.', hear:'Now read the sentences.', o:['quicker','quickest','quick'], a:'quicker', say:'Read it. Which word fits?', how:'Zev is more quick than Dov, but not the most.'},
      {type:'tiles', w:['soft','est'], extra:['ist'], hear:'softest', say:'Bubby\'s challah is the softest! Build softest.', how:'Soft, then the ending for the most: est.'},
      {type:'match', pairs:[['fastest','🏎️'],['sweetest','🍭'],['longest','🐍']], say:'Run in place! Now read and match.', how:'Read the word, then the ending. Est means the most.'},
      {type:'dictation', hear:'This is the longest train.', w:['This','is','the','longest','train.'], extra:['longist'], say:'Listen. Build it. Pick the right spelling.', how:'The most ending is spelled e-s-t.'}]},

    { id:'WRIT.HAND.L02.04', grade:1, name:'Copy It Neatly', pic:'✏️', after:'READ.PHON.L02.28', acts:[
      {type:'sort', bins:['Neat 👍','Fix it 👎'], cards:[['The goat is in the barn.',0],['the goat is in the barn.',1],['The goat is inthe barn.',1],['The goat is in the barn',1]], say:'Neat copy: a big first letter, spaces, and a dot.', how:'Check three things: big first letter, spaces, dot at the end.'},
      {type:'listen', q:'Shmuli wrote: Ilike my kite.', hear:'What does he need to fix?', o:['a gap','a big letter','a dot'], a:'a gap', say:'What did Shmuli forget? Look closely.', how:'Look between the words. Is there a gap?'},
      {type:'trace', glyph:'g', name:'the letter for guh', say:'Shake out your hand! Tail letters hang below. Trace guh.', how:'Make a ball. Pull the tail below the line. Hook it.'},
      {type:'dictation', hear:'I can see the farm.', w:['I','can','see','the','farm.'], extra:['i'], mis:true, say:'Shmuli writes I small. Build it the right way.', how:'The word I is always a big letter.'},
      {type:'trace', glyph:'y', name:'the letter for yuh', say:'Another tail letter! Trace yuh, down below the line.', how:'A short slant, then a long slant down below the line.'},
      {type:'listen', q:'Shmuli wrote: I play with ben.', hear:'What does he need to fix?', o:['a gap','a big letter','a dot'], a:'a big letter', say:'What did Shmuli forget? Look closely.', how:'Ben is a name. Names start with a big letter.'},
      {type:'dictation', hear:'Dov and Zev play tag.', w:['Dov','and','Zev','play','tag.'], extra:['dov'], say:'Names get big letters too. Build it, then copy on paper!', how:'Big letters for the first word and names. Dot at the end.'}]}
  ];
  if (window.TLCORE && TLCORE.k1) K1G.forEach(function (g) { TLCORE.k1.add(g); });
  if (window.TLCORE) TLCORE.add('F', LESSONS, {});
})();
</script>
