<style>
/* PATHFINDER v5 screens (07 PATHFINDER BUILD PROMPT v5, Stage A). Added before </body> of PathfinderPage by pfDoGet_. */
.mz{font-size:21px;line-height:2.15;background:#fffdf6;border:2px solid #efe6c8;border-radius:16px;padding:14px 18px;overflow-wrap:anywhere}
.mz .mc{display:inline-flex;flex-wrap:wrap;gap:4px;vertical-align:middle;margin:2px 2px;padding:3px;border:2px dashed #c9c2ad;border-radius:12px;background:#fff}
.mz .mc button{min-height:44px;min-width:56px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:19px;font-weight:600;padding:2px 10px;line-height:1.2}
.mz .mc button.sel{border-color:var(--blue);background:#eef3ff;box-shadow:0 0 0 2px #c9d7ff inset}
.mz .mc.done{border-style:solid;border-color:#c9d7ff}
.ex{font-size:20px;margin:10px 0}.ex .mc{display:inline-flex;gap:4px;padding:3px;border:2px dashed #c9c2ad;border-radius:12px}.ex .mc button{min-height:44px;border:2px solid var(--line);border-radius:10px;background:#fff;padding:2px 10px;font-size:18px}
.ex .mc button.ok{border-color:var(--ok);background:#e3f4e4}
.lsn{display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px}.lsn .ear{font-size:72px}
.vtag{display:inline-block;font-size:13px;font-weight:700;color:#5b4a00;background:#fff3cd;border-radius:8px;padding:2px 8px}
.hint{border:2px dashed #c9c2ad;border-radius:16px;padding:14px;background:#fffdf3;font-size:20px}
.hint .k{font-size:14px;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.4px}
.teach{font-size:22px;line-height:1.55}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.picks button{min-height:84px;border:3px solid var(--line);border-radius:16px;background:#fff;font-size:17px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px}
.picks button span{font-size:32px}.picks button.sel{border-color:var(--blue);background:#eef3ff}
.feel{display:flex;flex-direction:column;gap:10px;margin-top:10px}.feel .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;padding:8px 10px;background:#fff}
.feel .row b{min-width:140px;font-size:18px}.feel .row button{min-width:64px;min-height:64px;border:3px solid var(--line);border-radius:14px;background:#fff;font-size:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.feel .row button small{font-size:11px;color:var(--soft);font-weight:600;margin-top:2px}.feel .row button.sel{border-color:var(--blue);background:#eef3ff}
.typebox{width:100%;min-height:150px;font:inherit;font-size:20px;border:3px solid var(--line);border-radius:14px;padding:10px;margin-top:10px}
.typesrc{font-size:20px;line-height:1.6;background:#fffdf6;border:2px solid #efe6c8;border-radius:14px;padding:10px 14px}
.v5rep .kv div b{font-size:20px}
.v5wait{background:#f3f1ff;border-radius:12px;padding:8px 12px;margin:6px 0;font-size:15px}
@media(max-width:560px){.feel .row b{min-width:100%}.feel .row button{min-width:58px;min-height:58px;font-size:26px}.mz{font-size:19px;padding:10px 12px}.mz .mc button{min-width:48px;font-size:17px;padding:2px 8px}}
</style>
<script>
/* v5 stops: Silent reading (maze), Listening and reading, Computing (+ typing), Life and Money, What helps me, About me,
   Writing (sentence tiles). The server keeps every answer and every key; this page only draws and sends what he chose. */
window.PF5UI=(function(){
 const V5=['MAZE','LR','COMP','LIFE','HELP','ABOUT','WRIT'];
 const EMI={'Sports':'⚽','Animals':'🐾','Building and making things':'🔨','Computers and coding':'💻','Space and science':'🔭','History and stories of the past':'🏺','Drawing and art':'🎨','Music':'🎵','Cooking and baking':'🧁','Cars, trucks and trains':'🚂','Nature and hiking':'🥾','Learning Gemara and Chumash':'📜','Puzzles and games':'🧩','Reading books':'📚','English':'🇺🇸','Yiddish':'🗣️','Hebrew':'🇮🇱','Other':'🌍'};
 const X={}; let spokenKey=null, mzTimer=null, mzSave=null, tyTimer=null;
 const plain=s=>String(s||'').replace(/<\/?i>/g,'');
 const sayList=(stem,ch)=>plain(stem)+' '+(ch||[]).map((c,i)=>String.fromCharCode(65+i)+'. '+plain(c)).join('. ');
 const phon=s=>String(s||'').replace(/\/([a-z]+)\//gi,'$1,');   /* temporary voice: "/s/" read as "s" */
 const head=(v,t)=>`<div class="qhead">${esc(v.v5.label)}${t?' · '+t:''} <span class="draft">draft</span></div>`;
 const foot=(act,label,dis)=>`<div class="foot"><button class="big" data-act="${act}" ${dis||P.busy?'disabled':''}>${P.busy?'Saving…':label}</button></div>`;
 const act=(k,a,o)=>call('pf5Act',[Object.assign({k:k,act:a},o||{})]);
 const qchoices=q=>`<div class="choices">${q.choices.map((c,i)=>`<button class="ch${X.sel===i?' sel':''}" data-act="xpick" data-i="${i}" aria-label="${esc(plain(c))}">${rich(c)}</button>`).join('')}</div>`;
 const qtyped=q=>{ const keys=['1','2','3','4','5','6','7','8','9','0','.','/','−'].concat(q.money?['$','¢']:[]);
  return `<div class="typed"><input class="ans" id="ansbox" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" maxlength="16" aria-label="Your answer" value="${esc(P.typed)}"><div class="pad">${keys.map(k=>`<button data-act="key" data-k="${esc(k)}" aria-label="${k==='−'?'minus':k==='¢'?'cents':k==='$'?'dollars':k}">${esc(k)}</button>`).join('')}<button class="w" data-act="key" data-k="back" aria-label="Erase">⌫</button><button data-act="key" data-k="space" aria-label="space">␣</button></div></div>`; };
 const canQ=q=>q.choices?X.sel!=null:!!String(P.typed||'').trim();
 const valQ=q=>q.choices?q.choices[X.sel]:String(P.typed||'').trim();
 function reset(){ X.sel=null; X.multi=null; X.feel=null; P.typed=''; P.moved=false; }

 /* ---------------- screens ---------------- */
 function html(v){ const w=v.v5, k=w.k; let h='';
  if(k==='MAZE') return maze(v);
  if(k==='LR') return lr(v);
  if(k==='COMP'||k==='LIFE') return xq(v);
  if(k==='HELP') return whm(v);
  if(k==='ABOUT') return about(v);
  if(k==='WRIT') return tiles(v);
  return h; }

 function maze(v){ const w=v.v5;
  if(w.step==='intro') return `<div class="card">${head(v)}<h2>Silent reading</h2><p>Read the story to yourself. When you come to a box with three words, tap the word that makes sense, then keep reading. Go until the story ends or the time is up. Read carefully: there is no prize for rushing.</p>
   <div class="ex">Try it: The cat <span class="mc">${['blue','ran','the'].map(o=>`<button data-act="xex" data-o="${o}" class="${X.ex===o&&o==='ran'?'ok':X.ex===o?'sel':''}">${o}</button>`).join('')}</span> up the tree.</div>
   <p style="color:var(--soft);margin:0">${X.ex==='ran'?'Yes! “ran” makes sense.':X.ex?'Read the sentence with that word. Does it make sense? Try another.':'Tap the word that fits.'}</p></div>${foot('xmzstart','Start reading ➜',X.ex!=='ran')}`;
  X.mz=X.mz&&X.mz.pid===w.title+'|'+w.grade?X.mz:{pid:w.title+'|'+w.grade,picks:Object.assign({},w.picks||{}),t0:Date.now()-(180000-(w.left||0))};
  const at={}; (w.choices||[]).forEach(c=>{ at[c.i]=c; });
  let body=esc(w.first)+' ';
  (w.tokens||[]).forEach((t,i)=>{ const c=at[i]; if(!c){ body+=esc(t)+' '; return; } const pk=(X.mz.picks[c.n]||{}).o;
   body+=esc(c.b)+`<span class="mc${pk?' done':''}" data-n="${c.n}">${c.o.map(o=>`<button data-act="xmz" data-n="${c.n}" data-o="${esc(o)}" class="${pk===o?'sel':''}" aria-pressed="${pk===o}">${esc(o)}</button>`).join('')}</span>`+esc(c.a)+' '; });
  return `<div class="card">${head(v,'Grade '+w.grade)}<h3>${esc(w.title)}</h3><div class="mz" id="mz">${body}</div></div>${foot('xmzdone','I’m finished ➜')}`; }

 function lr(v){ const w=v.v5, vt=`<span class="vtag" title="Until a man records the audio, the computer voice reads">🔈 ${esc(w.voice||'temporary voice')}</span>`;
  if(w.step==='intro') return `<div class="card">${head(v)}<h2>Listening and reading</h2><p>You will <b>hear</b> one story and <b>read</b> another one yourself. After each story there are 5 questions. The questions and answers are read to you.</p><p>${vt}</p></div>${foot('xlrbegin','Let’s start ➜')}`;
  if(w.step==='confirm') return `<div class="card center">${head(v)}<h2>One more pair</h2><p>Great work. Here is one more story to hear and one to read, with 5 questions each.</p></div>${foot('xlrgo','Go on ➜')}`;
  const part=`Part ${w.partN} of ${w.parts}`;
  if(w.step==='passage'&&w.mode==='listen') return `<div class="card">${head(v,part)}<div class="lsn"><div class="ear">🎧</div><h2>Listen to the story</h2><p class="center" style="margin:0">The story is not on the screen. Listen carefully. You may play it ${w.plays?'one more time':'and then once more'}.</p>${vt}
   ${w.plays===0?`<button class="big gold" data-act="xlrplay">▶ Play the story</button>`:w.replayLeft>0?`<button class="big ghost" data-act="xlrplay">🔁 Play it one more time</button>`:'<p style="color:var(--soft)">You heard it twice.</p>'}</div></div>${foot('xlrready','I’m ready for the questions ➜',!w.plays)}`;
  if(w.step==='passage') return `<div class="card">${head(v,part)}<div class="passage"><h4>📖 Read this story yourself${w.title?': '+esc(w.title):''}</h4><div class="ptxt">${esc(w.text)}</div></div></div>${foot('xlrready','I’m ready for the questions ➜')}`;
  const q=w.q;
  return `<div class="card">${head(v,part+' · question '+q.n+' of '+q.of)}${w.mode==='read'?`<div class="passage"><h4>${esc(w.title||'')}</h4><div class="ptxt">${esc(w.text)}</div></div>`:`<p style="margin:0 0 6px">🎧 ${vt}</p>`}
   <div class="stem"><button class="say" data-act="xsay" aria-label="Read the question to me">🔊</button><span>${esc(q.stem)}</span></div>${qchoices(q)}</div>${foot('xans','Next ➜',!canQ(q))}`; }

 function xq(v){ const w=v.v5, name=w.k==='COMP'?'Computing':'Life and Money';
  if(w.step==='intro') return `<div class="card">${head(v)}<h2>${name}</h2><p>The questions start easy and get harder. Do your best on each one. When they get too hard, we stop.</p></div>${foot('xbegin','Let’s start ➜')}`;
  if(w.step==='typing'){ const T=w.typing;
   if(!T.started) return `<div class="card">${head(v,'typing check')}<h2>Typing check</h2><p>Copy the words below into the box. Type for one minute. Spelling and capitals count. I will tell you when to stop.</p><div class="typesrc">${esc(T.text)}</div></div><div class="foot">${T.optional?`<button class="idk" data-act="xtypeskip">Skip (K–1)</button>`:''}<button class="big" data-act="xtypestart" ${P.busy?'disabled':''}>Start typing ➜</button></div>`;
   return `<div class="card">${head(v,'typing check')}<div class="typesrc">${esc(T.text)}</div><textarea class="typebox" id="typebox" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="Type the words here">${esc(X.typed||'')}</textarea></div>${foot('xtypedone','I’m done ➜')}`; }
  const q=w.q;
  return `<div class="card">${head(v,'question '+q.n)}<div class="stem"><button class="say" data-act="xsay" aria-label="Read the question to me">🔊</button><span>${esc(q.stem)}</span></div>${q.typed?qtyped(q):qchoices(q)}</div>${foot('xans','Next ➜',!canQ(q))}`; }

 function whm(v){ const w=v.v5;
  if(w.step==='teach') return `<div class="card">${head(v)}<h2>Let’s learn: ${esc(w.name)}</h2><div class="stem"><button class="say" data-act="xsay" aria-label="Read it to me">🔊</button><span class="teach">${esc(w.teach)}</span></div></div>${foot('xnext','I’m ready to try ➜')}`;
  if(w.step==='hint'){ const H=w.hint; return `<div class="card">${head(v,'hint '+H.n)}<h2>Here is a hint</h2><div class="hint"><div class="k">${H.kind==='picture'?'🖼️ A picture':H.kind==='example'?'✏️ An example':'👣 The first step'}</div>${H.picture?'<p style="margin:6px 0 0"><b>Picture (art coming):</b> '+esc(H.text)+'</p>':'<p style="margin:6px 0 0">'+esc(H.text)+'</p>'}</div></div>${foot('xnext','Try again ➜')}`; }
  const q=w.q;
  return `<div class="card">${head(v,'try '+q.n)}<div class="stem"><button class="say" data-act="xsay" aria-label="Say it again">🔊</button><span>${esc(q.stem)}</span></div>${q.typed?qtyped(q):qchoices(q)}</div>${foot('xans','Check ➜',!canQ(q))}`; }

 function about(v){ const w=v.v5, s=w.screen, many=/pick many/.test(s.type), two=/up to 2/.test(s.type);
  let h=`<div class="card">${head(v,s.n+' of '+s.of)}<div class="stem"><button class="say" data-act="xsay" aria-label="Read it to me">🔊</button><span>${esc(s.text)}</span></div>`;
  if(s.id==='feel'){ X.feel=X.feel||{}; h+=`<div class="feel">${s.options.map((o,i)=>`<div class="row"><b>${esc(o)}</b>${w.faces.map(f=>`<button data-act="xface" data-i="${i}" data-f="${f[0]}" class="${X.feel[i]===f[0]?'sel':''}" aria-label="${esc(o+': '+f[1])}">${f[2]}<small>${esc(f[1])}</small></button>`).join('')}</div>`).join('')}</div>`; }
  else { X.multi=X.multi||[]; h+=`<div class="picks">${s.options.map(o=>`<button data-act="xmulti" data-o="${esc(o)}" class="${X.multi.indexOf(o)>=0?'sel':''}" aria-pressed="${X.multi.indexOf(o)>=0}">${EMI[o]?`<span>${EMI[o]}</span>`:''}${esc(o)}</button>`).join('')}</div>${two?'<p style="color:var(--soft);margin:8px 0 0">Pick one or two.</p>':''}`; }
  const ok=s.id==='feel'?Object.keys(X.feel||{}).length===s.options.length:(X.multi||[]).length>0;
  return h+`</div>${foot('xabout',s.n<s.of?'Next ➜':'Finish ➜',!ok)}`; }

 function tiles(v){ const w=v.v5, T=w.tiles; if(P.orderFor!==T.id){ P.orderFor=T.id; P.order=T.tiles.slice(); P.moved=false; P.pickT=null; }
  return `<div class="card">${head(v,T.practice?'practice '+T.n+' of 3 · this does not count':'sentence '+T.n+' of 3')}<div class="stem"><button class="say" data-act="xsay" aria-label="Read it to me">🔊</button><span>Put the words in order to make a sentence.</span></div>
   <div class="tiles" id="tiles" role="list">${P.order.map((t,i)=>`<button class="otile${P.pickT===i?' pick':''}" data-ti="${i}" role="listitem" aria-label="${esc(t)}, place ${i+1}">${esc(t)}</button>`).join('')}</div>
   <p class="center" style="color:var(--soft);font-size:15px;margin:6px 0 0">Drag a word to move it, or tap a word and then the place it should go.</p></div>${foot('xtiles','Next ➜',!P.moved)}`; }

 /* ---------------- after render: speech, timers, drag ---------------- */
 function after(v){ const w=v.v5, key=w.k+'|'+w.step+'|'+(w.q?w.q.id:w.screen?w.screen.id:w.tiles?w.tiles.id:w.hint?w.hint.n:w.partN||'');
  clearTimeout(mzTimer); clearInterval(mzSave); clearTimeout(tyTimer);
  if(w.k==='MAZE'&&w.step==='run'){ const left=Math.max(0,180000-(Date.now()-X.mz.t0)); mzTimer=setTimeout(()=>mazeDone(),left+300); mzSave=setInterval(()=>{ run('pf5Act',P.token,{k:'MAZE',act:'save',picks:mzPicks()}).catch(()=>{}); },30000); }
  if(w.k==='COMP'&&w.step==='typing'&&w.typing.started){ const b=$('typebox'); if(b){ if(document.activeElement!==b){ b.focus(); try{ b.setSelectionRange(b.value.length,b.value.length); }catch(e){} } X.ty0=X.ty0||Date.now(); tyTimer=setTimeout(()=>typeDone(),Math.max(0,60000-(Date.now()-X.ty0))); } }
  if(w.k==='WRIT') bindOrder();
  if(spokenKey===key) return; spokenKey=key; X.shown=Date.now();
  if(w.k==='MAZE') return;                                            /* silent */
  if(w.k==='LR'&&w.step==='q') return speak(sayList(w.q.stem,w.q.choices));
  if(w.k==='LR'&&w.step==='intro'&&v.young) return speak('Listening and reading. You will hear one story and read another. Then answer five questions about each.');
  if(w.k==='HELP'){ if(w.step==='teach') return speak(phon(w.teachSay)); if(w.step==='hint') return speak((w.hint.picture?'Here is a picture hint. ':'')+w.hint.text); if(w.step==='check') return speak(phon(w.q.listen?w.q.listen:sayList(w.q.stem,w.q.choices))); }
  if(w.k==='ABOUT'){ const s=w.screen; return speak(s.text+' '+(s.id==='feel'?'For each one, tap a face: love it, like it, so-so, or not fun yet. '+s.options.join(', '):s.options.join(', '))); }
  if(w.k==='WRIT'&&(v.young||w.tiles.practice&&w.tiles.n===1)) return speak('Put the words in order to make a sentence.');
  if((w.k==='COMP'||w.k==='LIFE')&&w.step==='q'&&v.young) return speak(w.q.choices?sayList(w.q.stem,w.q.choices):w.q.stem); }
 function mzPicks(){ return Object.keys(X.mz.picks).map(n=>({n:+n,o:X.mz.picks[n].o,ms:X.mz.picks[n].ms})); }
 function mazeDone(){ if(!P.v||!P.v.v5||P.v.v5.k!=='MAZE'||P.busy) return; clearTimeout(mzTimer); clearInterval(mzSave); act('MAZE','done',{picks:mzPicks(),ms:Date.now()-X.mz.t0}); }
 function typeDone(){ if(!P.v||!P.v.v5||P.v.v5.step!=='typing'||P.busy) return; const b=$('typebox'); const t=b?b.value:X.typed||''; const ms=Date.now()-(X.ty0||Date.now()); X.ty0=null; X.typed=''; act('COMP','typedone',{text:t,ms}); }

 /* ---------------- taps ---------------- */
 function click(a,t,v){ if(!/^x/.test(a)) return false; const w=v&&v.v5; if(!w) return true;
  if(a==='xsay'){ if(w.k==='LR'&&w.q) speak(sayList(w.q.stem,w.q.choices)); else if(w.k==='HELP') speak(phon(w.step==='teach'?w.teachSay:w.q.listen||sayList(w.q.stem,w.q.choices))); else if(w.k==='ABOUT') speak(w.screen.text+' '+w.screen.options.join(', ')); else if(w.q) speak(w.q.choices?sayList(w.q.stem,w.q.choices):w.q.stem); else speak('Put the words in order to make a sentence.'); return true; }
  if(a==='xpick'){ X.sel=+t.dataset.i; render(); return true; }
  if(a==='xex'){ X.ex=t.dataset.o; render(); return true; }
  if(a==='xmzstart'){ X.mz=null; act('MAZE','start'); return true; }
  if(a==='xmz'){ const n=+t.dataset.n, o=t.dataset.o; X.mz.picks[n]={o,ms:Date.now()-X.mz.t0}; const box=t.parentNode; box.querySelectorAll('button').forEach(b=>{ b.classList.toggle('sel',b===t); b.setAttribute('aria-pressed',b===t); }); box.classList.add('done'); return true; }
  if(a==='xmzdone'){ mazeDone(); return true; }
  if(a==='xlrbegin'){ act('LR','begin'); return true; }
  if(a==='xlrgo'){ act('LR','go'); return true; }
  if(a==='xlrplay'){ call('pf5Act',[{k:'LR',act:'play'}],nv=>{ if(nv.v5&&nv.v5.mode==='listen'&&!nv.note) setTimeout(()=>speak(nv.v5.text),200); }); return true; }
  if(a==='xlrready'){ try{ speechSynthesis.cancel(); }catch(e){} act('LR','ready'); return true; }
  if(a==='xbegin'){ act(w.k,'begin'); return true; }
  if(a==='xnext'){ try{ speechSynthesis.cancel(); }catch(e){} act('HELP','next'); return true; }
  if(a==='xans'){ const q=w.q; if(!canQ(q)) return true; const val=valQ(q), ms=Date.now()-(X.shown||Date.now()); try{ speechSynthesis.cancel(); }catch(e){} reset(); act(w.k,'answer',{item:q.id,value:val,ms}); return true; }
  if(a==='xtypestart'){ X.ty0=null; X.typed=''; act('COMP','typestart'); return true; }
  if(a==='xtypeskip'){ act('COMP','typeskip'); return true; }
  if(a==='xtypedone'){ typeDone(); return true; }
  if(a==='xmulti'){ const o=t.dataset.o, s=w.screen, two=/up to 2/.test(s.type); X.multi=X.multi||[]; const i=X.multi.indexOf(o); if(i>=0) X.multi.splice(i,1); else { if(two&&X.multi.length>=2) X.multi.shift(); X.multi.push(o); } render(); return true; }
  if(a==='xface'){ X.feel=X.feel||{}; X.feel[+t.dataset.i]=t.dataset.f; render(); return true; }
  if(a==='xabout'){ const s=w.screen, vals=s.id==='feel'?s.options.map((o,i)=>X.feel[i]||''):(X.multi||[]); try{ speechSynthesis.cancel(); }catch(e){} reset(); act('ABOUT','answer',{id:s.id,values:vals,ms:Date.now()-(X.shown||Date.now())}); return true; }
  if(a==='xtiles'){ const T=w.tiles, order=P.order.slice(), ms=Date.now()-(X.shown||Date.now()); P.orderFor=null; P.moved=false;
   call('pf5Act',[{k:'WRIT',act:'tiles',item:T.practice?T.id:T.id,order,ms}],nv=>{ if(T.practice&&nv.practiceOk!=null) toasts([{k:nv.practiceOk?'cheer':'coin',t:nv.practiceOk?'✓ That’s right!':'Good try. Let’s do another one.'}]); }); return true; }
  return true; }
 document.addEventListener('input',e=>{ if(!P.v||!P.v.v5) return; if(e.target.id==='ansbox'){ const b=document.querySelector('[data-act="xans"]'); if(b) b.disabled=!String(P.typed||'').trim()||P.busy; } if(e.target.id==='typebox') X.typed=e.target.value; });
 document.addEventListener('paste',e=>{ if(e.target&&e.target.id==='typebox') e.preventDefault(); });
 document.addEventListener('keydown',e=>{ if(!P.v||!P.v.v5||P.busy) return; if(e.key==='Enter'&&e.target&&e.target.id==='ansbox'){ e.preventDefault(); const b=document.querySelector('[data-act="xans"]'); if(b&&!b.disabled) b.click(); } });

 /* ---------------- staff report ---------------- */
 const NAME={MAZE:'Silent reading (maze)',LR:'Listening and reading',COMP:'Computing',LIFE:'Life and Money',HELP:'What helps me',ABOUT:'About me',WRIT:'Writing: sentence tiles'};
 const codes=(x,R,n)=>{ const ks=Object.keys(x.errors||{}).sort((a,b)=>x.errors[b]-x.errors[a]); return ks.length?`<h4 style="margin:12px 0 4px">Mistake patterns${n?' (top '+n+')':''}</h4><table>${ks.slice(0,n||99).map(c=>`<tr><td>${esc(R.codes[c]||c)}</td><td>${x.errors[c]} time${x.errors[c]>1?'s':''}</td></tr>`).join('')}</table>`:''; };
 const FACE={love:'😍 love it',like:'🙂 like it',soso:'😐 so-so',notyet:'😕 not fun yet'};
 function rep(x,R,s){ const d=x.detail||{}; let h=`<div class="card v5rep" style="background:#fbfaf6"><h3>${esc(NAME[x.subject]||x.subject)}${x.level?': Level '+x.level:''} <span class="draft">draft questions</span></h3>`;
  if(d.kind==='maze') h+=`<div class="kv"><div><small>Score (right − ½ × wrong)</small><b>${d.score}</b></div><div><small>Right · wrong</small>${d.correct} · ${d.incorrect}</div><div><small>Wrong kind of word (MAZE-SYNTAX)</small>${d.syntax}</div><div><small>Wrong meaning (MAZE-MEANING)</small>${d.meaning}</div><div><small>Reached</small>choice ${d.last} of ${d.total}${d.skipped?' · '+d.skipped+' skipped (not counted)':''}</div><div><small>Per minute</small>${d.perMin!=null?d.perMin+' (finished early)':'— (used the full 3 minutes)'}</div><div><small>Passage</small>grade ${d.grade}, form ${esc(d.form)}</div></div>
   <p style="color:var(--soft);font-size:14px">${d.incorrect?d.syntax>d.meaning?'More wrong-kind-of-word picks: guessing or not reading the sentence.':'Mostly wrong-meaning picks: reads the sentence but does not check that it makes sense (comprehension monitoring).':'No wrong picks.'} No flags until the pilot sets local cut-offs.</p>`;
  else if(d.kind==='lr') h+=`<div class="kv"><div><small>Listening (grade ${d.grade})</small><b>${d.listen} of 5</b></div><div><small>Reading (grade ${d.grade})</small><b>${d.read} of 5</b></div><div><small>Order · form</small>${esc(d.order)} · ${esc(d.form)}</div><div><small>Replays</small>${d.replays}</div><div><small>Voice</small>${esc(d.voice||'')}</div>${d.confirm?`<div><small>Grade-below pair (grade ${d.confirm.grade})</small>listening ${d.confirm.listen} · reading ${d.confirm.read}</div>`:''}</div>
   <table style="margin-top:8px"><tr><th>Profile rule</th><th>Result</th></tr>${['decoding_barrier','language_barrier','listening_low'].map(n=>`<tr><td>${n.replace('_',' ')}</td><td>${d[n]===true?'<b>yes (seen twice)</b>':d[n]==='pending'?'pattern seen twice; waits for oral reading':'no'}</td></tr>`).join('')}</table>`;
  else if(d.kind==='computing'||d.kind==='money') { const t=d.typing; h+=`<div class="kv"><div><small>Level</small><b>${x.level<=1?'below Level 2':'Level '+x.level}</b></div><div><small>Right</small>${d.right} of ${d.asked}${d.stoppedEarly?' (stopped after 3 misses in a row)':''}</div><div><small>Form</small>${esc(d.form)}</div>${d.kind==='computing'?`<div><small>Typing</small>${!t?'—':t.skipped?'skipped (K–1)':t.wpm+' WPM · '+Math.round(t.accuracy*100)+'% accurate'}</div>`:''}</div>`; }
  else if(d.kind==='whm') h+=`<div class="kv"><div><small>Tried</small>${esc(d.subject==='MATH'?'Math':'Reading')} · ${esc(d.name)} (Level ${d.level})</div><div><small>Hints needed</small><b>${d.hints_needed==='not yet'?'not yet (3 hints)':d.hints_needed}</b></div><div><small>What unlocked it</small>${esc({picture:'the picture',example:'a worked example',first_step:'the first step done for them',none:'—'}[d.unlocked_by]||d.unlocked_by)}</div></div>
   <p>${d.hints_needed===0?'Learned it from the short lesson alone.':d.hints_needed==='not yet'?'Did not get it yet, even with all three hints: teach this kind of skill step by step, with a teacher beside them.':'Got it after '+(d.unlocked_by==='picture'?'a picture':d.unlocked_by==='example'?'a worked example':'the first step was shown')+': start new skills that way.'}</p>`;
  else if(d.kind==='about'){ const A=d.answers||{}; h+=`<div class="kv"><div><small>Likes</small>${esc((A.interests||[]).join(', ')||'—')}</div><div><small>Home languages</small>${esc((A.languages||[]).join(', ')||'—')}</div><div><small>Wants to get better at</small>${esc((A.better||[]).join(', ')||'—')}</div></div>
   <table style="margin-top:8px"><tr><th>Subject</th><th>How it feels</th></tr>${Object.keys(A.feel||{}).map(k=>`<tr><td>${esc(k)}</td><td>${esc(FACE[A.feel[k]]||A.feel[k])}</td></tr>`).join('')}</table>`; }
  else if(d.kind==='tiles') h+=`<div class="kv"><div><small>Sentences right</small><b>${d.right} of ${d.of}</b></div><div><small>Practice</small>${d.practice} of 3${d.practice<2?' (gate not passed)':''}</div><div><small>Band · form</small>${esc(d.band)} · ${esc(d.form)}</div></div>`;
  h+=(x.flags||[]).map(f=>`<div class="flag">${esc(f)}</div>`).join('')+codes(x,R,x.subject==='LR'?0:0);
  return h+'</div>'; }
 function repNotes(R){ const fam=(R.notes||[]).filter(n=>n.kind==='about-family');
  return `<div class="card"><h3>About me · family box <span class="pill p-working">staff or parent only</span></h3><p style="color:var(--soft);margin:0 0 8px">${esc(R.aboutFamilyAsk||'Anything we should know about their learning history?')} Never shown to the student. Never sent to Claude.</p>
   ${fam.map(n=>`<div class="v5wait">${esc(new Date(n.at).toLocaleDateString())} · ${esc(n.by)}: ${esc(n.text)}</div>`).join('')}
   <textarea id="famtext" maxlength="2000" style="width:100%;min-height:80px;font:inherit;padding:10px;border-radius:12px;border:2px solid var(--line)"></textarea><button class="big ghost" data-ract5="family" ${P.busy?'disabled':''}>Save the note</button>
   <h4 style="margin:14px 0 4px">Not measured yet</h4><div class="v5wait">Oral reading (WCPM, accuracy, percentile, flag), word list and rapid naming: wait for the microphone permission, the parent notice and the speech-tool decision.</div><div class="v5wait">Spelling stage, copying speed and the writing piece with its four trait scores: Writing Stage B, not installed in this build.</div></div>`; }
 document.addEventListener('click',e=>{ const t=e.target.closest&&e.target.closest('[data-ract5]'); if(!t||t.disabled||P.mode!=='report') return; const txt=($('famtext')||{}).value||''; if(!txt.trim()) return;
  P.busy=true; P.err=''; render(); run('pfAboutFamily',P.token,P.sid,txt).then(r=>{ P.busy=false; P.rep=r; render(); }).catch(err=>{ P.busy=false; P.err=msgOf(err); render(); }); });
 return {html,after,click,rep,repNotes,isV5:k=>V5.indexOf(k)>=0};
})();
</script>
