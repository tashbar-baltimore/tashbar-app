#ysheet .ysload{padding:40px;color:#64748B;font:700 18px var(--body,'Barlow'),sans-serif}`; document.head.appendChild(s); }
function host(){ let h=document.getElementById('ysheet'); if(!h){ h=document.createElement('div'); h.id='ysheet'; h.setAttribute('role','dialog'); h.setAttribute('aria-label','Worksheet'); document.body.appendChild(h); } return h; }
function draw(){ const sh=Q.sheet, k=K(); if(!sh) return; const n=sh.pages||1, i=Q.page, pill=(t,x)=>k?k.pill(t,x):`<span>${E(x)}</span>`;
  const tool=(id,icon,label)=>{ const b=k?k.tool(icon,label,'data-ys="tool" data-t="'+id+'"'):''; return Q.tool===id?b.replace('tlk tlk-tool','tlk tlk-tool on'):b; };
  const col=(c,icon,label)=>{ const b=k?k.tool(icon,label,'data-ys="color" data-c="'+c+'"'):''; return Q.tool==='pen'&&Q.color===c?b.replace('tlk tlk-tool','tlk tlk-tool on'):b; };
  host().innerHTML=`<div class="ysbar">${k?k.x('data-ys="close"','tl','Close'):''}<h2>${E(Q.title||sh.title)}</h2>${pill('prog','Page '+(i+1)+' of '+n)}
   ${Q.edit?`<div class="ystools">${tool('pen','✏️','Write and draw')}${col('#111827','⚫','Black')}${col('#2563EB','🔵','Blue')}${col('#DC2626','🔴','Red')}${tool('text','🔤','Type an answer')}${tool('erase','🧽','Eraser')}${k?k.tool('↩️','Undo','data-ys="undo"'):''}</div>`:pill('prog',Q.status==='handed'?'Handed in ✓':'Closed')}
   <span data-ys-st>${Q.edit?pill('lock',Q.saving?'Saving…':Q.dirty?'Not saved yet':'Saved'):''}</span></div>
   <div class="ysbody"><div class="yspage" data-ys-page><div class="ysload">Loading the page…</div></div></div>
   <div class="ysfoot"><div class="ysmid">${i>0&&k?k.quiet(k.WORDS.back,'data-ys="prev"'):''}${i<n-1&&k?k.quiet(k.WORDS.next,'data-ys="next"'):''}</div>
   <div class="ysmid">${Q.edit&&k?k.main('Hand it in','data-ys="hand"'):''}</div></div>`;
  loadPage(i); }
function setStatus(){ const el=document.querySelector('#ysheet [data-ys-st]'), k=K(); if(el&&k&&Q.edit) el.innerHTML=k.pill('lock',Q.saving?'Saving…':Q.dirty?'Not saved yet':'Saved'); }
function loadPage(i){ const sh=Q.sheet, box=document.querySelector('#ysheet [data-ys-page]'); if(!box) return;
  const show=src=>{ if(Q.page!==i||!document.contains(box)) return; box.innerHTML=`<img alt="Page ${i+1} of the worksheet" src="${src}"><canvas></canvas>`; const img=box.querySelector('img'); const go=()=>setupCanvas(box,img); if(img.complete) go(); else img.onload=go; };
  if(Q.imgs[i]) return show(Q.imgs[i]);
  if(sh.kind==='text'){ Q.imgs[i]=textPage(sh,i); return show(Q.imgs[i]); }
  run('ycSheetImg',SRV.token,sh.id,i).then(src=>{ Q.imgs[i]=src; show(src); }).catch(e=>{ box.innerHTML=`<div class="ysload">That page did not load. ${E(String(e&&e.message||e).replace(/^Error:\s*/,''))}</div>`; }); }
function setupCanvas(box,img){ const cv=box.querySelector('canvas'), W=box.clientWidth, H=img.clientHeight||box.clientHeight, r=window.devicePixelRatio||1;
  cv.width=Math.round(W*r); cv.height=Math.round(H*r); Q.cv=cv; Q.W=W; Q.H=H; Q.r=r; paint(); texts(box);
  let cur=null;
  const pt=e=>{ const b=cv.getBoundingClientRect(); return [Math.round((e.clientX-b.left)/b.width*U), Math.round((e.clientY-b.top)/b.width*U)]; };
  cv.onpointerdown=e=>{ if(!Q.edit) return; e.preventDefault(); const p=pt(e), pw=pageWork(Q.page);
    if(Q.tool==='text'){ pw.t.push({x:p[0],y:p[1],v:''}); Q.undo.push({k:'t',page:Q.page}); texts(box,pw.t.length-1); change(); return; }
    if(Q.tool==='erase'){ eraseAt(p); cur={erase:true}; cv.setPointerCapture(e.pointerId); return; }
    cur={c:Q.color,w:Q.color==='#111827'?28:26,p:[p[0],p[1]]}; pw.s.push(cur); Q.undo.push({k:'s',page:Q.page}); cv.setPointerCapture(e.pointerId); };
  cv.onpointermove=e=>{ if(!cur) return; e.preventDefault(); const p=pt(e); if(cur.erase){ eraseAt(p); return; } const n=cur.p.length; if(Math.abs(cur.p[n-2]-p[0])+Math.abs(cur.p[n-1]-p[1])<12) return; if(cur.p.length<4000) cur.p.push(p[0],p[1]); paint(); };
  cv.onpointerup=cv.onpointercancel=()=>{ if(cur){ cur=null; paint(); change(); } }; }
function eraseAt(p){ const pw=pageWork(Q.page), before=pw.s.length; pw.s=pw.s.filter(st=>{ for(let j=0;j<st.p.length;j+=2) if(Math.abs(st.p[j]-p[0])<160&&Math.abs(st.p[j+1]-p[1])<160) return false; return true; }); if(pw.s.length!==before){ paint(); change(); } }
function paint(){ const cv=Q.cv; if(!cv) return; const g=cv.getContext('2d'), f=cv.width/U; g.clearRect(0,0,cv.width,cv.height); g.lineCap='round'; g.lineJoin='round';
  (pageWork(Q.page).s||[]).forEach(st=>{ g.strokeStyle=st.c; g.lineWidth=Math.max(1.5,st.w*f); g.beginPath(); g.moveTo(st.p[0]*f,st.p[1]*f); if(st.p.length===2) g.lineTo(st.p[0]*f+0.1,st.p[1]*f); for(let j=2;j<st.p.length;j+=2) g.lineTo(st.p[j]*f,st.p[j+1]*f); g.stroke(); }); }
function texts(box,focus){ box.querySelectorAll('.ystx').forEach(x=>x.remove()); const pw=pageWork(Q.page), b=box.clientWidth;
  pw.t.forEach((t,j)=>{ const ta=document.createElement('textarea'); ta.className='ystx'; ta.value=t.v||''; ta.maxLength=400; ta.setAttribute('aria-label','Your answer'); if(!Q.edit) ta.readOnly=true;
    ta.style.left=(t.x/U*b)+'px'; ta.style.top=(t.y/U*b)+'px'; ta.style.maxWidth=Math.max(140,b-t.x/U*b-8)+'px';
    ta.oninput=()=>{ t.v=ta.value; change(); }; ta.onblur=()=>{ if(!ta.value.trim()&&Q.edit){ pw.t.splice(pw.t.indexOf(t),1); texts(box); change(); } };
    box.appendChild(ta); if(focus===j){ ta.focus(); setTimeout(()=>{ if(document.activeElement!==ta) ta.focus(); },30); } }); }
function change(){ Q.dirty=true; setStatus(); clearTimeout(Q.timer); Q.timer=setTimeout(()=>save(false),2500); }
function save(hand){ if(!Q.edit||!Q.sheet) return Promise.resolve(); if(!Q.dirty&&!hand) return Promise.resolve(); clearTimeout(Q.timer); Q.saving=true; setStatus();
  const w=JSON.parse(JSON.stringify(Q.work||{v:1,pages:[]})); w.pages.forEach(p=>{ p.t=(p.t||[]).filter(t=>String(t.v||'').trim()); });
  Q.dirty=false; return run('ycSheetSave',SRV.token,Q.sheet.id,w,!!hand).then(r=>{ Q.saving=false; Q.status=r.status; setStatus(); return r; })
   .catch(e=>{ Q.saving=false; Q.dirty=true; setStatus(); try{ toast(String(e&&e.message||e).replace(/^Error:\s*/,'')); }catch(x){} throw e; }); }
function close(){ const done=()=>{ Q.open=false; const h=document.getElementById('ysheet'); if(h) h.remove(); Q.cv=null; };
  if(Q.dirty&&Q.edit) save(false).then(done,done); else done(); }
function open(id,title){ css(); Object.assign(Q,{open:true,id,title:title||'',sheet:null,work:null,page:0,tool:'pen',color:'#111827',edit:true,status:'new',dirty:false,saving:false,imgs:{},undo:[]});
  host().innerHTML=`<div class="ysbar">${K()?K().x('data-ys="close"','tl','Close'):''}<h2>${E(title||'Worksheet')}</h2></div><div class="ysload">Opening your worksheet…</div>`;
  run('ycSheetOpen',SRV.token,id).then(r=>{ if(!Q.open||Q.id!==id) return; Q.sheet=r.sheet; Q.work=r.work&&Array.isArray(r.work.pages)?r.work:{v:1,pages:[]}; Q.edit=!!r.canEdit; Q.status=r.status; draw(); })
   .catch(e=>{ host().innerHTML=`<div class="ysbar">${K()?K().x('data-ys="close"','tl','Close'):''}<h2>${E(title||'Worksheet')}</h2></div><div class="ysload">${E(String(e&&e.message||e).replace(/^Error:\s*/,''))}</div>`; }); }
document.addEventListener('click',e=>{ const b=e.target.closest&&e.target.closest('#ysheet [data-ys]'); if(!b) return; const a=b.dataset.ys; try{ SND.tap(); }catch(x){}
  if(a==='close') return close();
  if(a==='tool'){ Q.tool=b.dataset.t; return draw(); }
  if(a==='color'){ Q.tool='pen'; Q.color=b.dataset.c; return draw(); }
  if(a==='undo'){ const u=Q.undo.pop(); if(!u) return; const pw=pageWork(u.page); if(u.k==='s') pw.s.pop(); else pw.t.pop(); if(u.page!==Q.page){ Q.page=u.page; return draw(); } paint(); const box=document.querySelector('#ysheet [data-ys-page]'); if(box) texts(box); return change(); }
  if(a==='prev'||a==='next'){ if(Q.dirty) save(false).catch(()=>{}); Q.page=Math.max(0,Math.min((Q.sheet.pages||1)-1,Q.page+(a==='next'?1:-1))); return draw(); }
  if(a==='hand'){ const k=K(); const d=document.createElement('div'); d.className='ysask'; d.innerHTML=`<div>${k.ask({icon:'📝',title:'Hand it in?',text:'Your teacher will see your work. After this you cannot change it.',yes:'Hand it in',yesAttrs:'data-ys="handyes"',noAttrs:'data-ys="handno"'})}</div>`; host().appendChild(d); return; }
  if(a==='handno'){ const d=document.querySelector('#ysheet .ysask'); if(d) d.remove(); return; }
  if(a==='handyes'){ const d=document.querySelector('#ysheet .ysask'); if(d) d.remove(); Q.dirty=true; return save(true).then(()=>{ Q.edit=false; close(); try{ toast('Handed in! Great work. ⭐'); SND.win&&SND.win(); }catch(x){} try{ window.TM_CHECK&&setTimeout(window.TM_CHECK,800); }catch(x){} },()=>{}); }
},true);
window.addEventListener('resize',()=>{ if(Q.open&&Q.sheet){ const box=document.querySelector('#ysheet [data-ys-page]'), img=box&&box.querySelector('img'); if(img) setupCanvas(box,img); } });
/* the class time moved on: close the sheet (his work was saved as he went) */
function sync(skills){ if(!Q.open||!Q.sheet) return; if((skills||[]).indexOf('SHEET.'+Q.sheet.id)>=0) return; if(Q.dirty&&Q.edit) save(false).catch(()=>{}); Q.edit=false; close(); try{ toast('Class time is over. Your work is saved.'); }catch(x){} }
window.TL_SHEET={open,close,sync,state:()=>Q};
})();
</script>
