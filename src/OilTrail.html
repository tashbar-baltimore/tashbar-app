 * olive-oil-trail.js — Tashbar olive oil finger trail (Hanukkah).
 * Plain JavaScript (ES module). No TypeScript, no dependencies.

 * What it does
 *   - Swipe: a thick, glossy golden olive-oil trail that lags behind the finger, thins,
 *     breaks into beads and drips.

 *   what is under the oil (the "backdrop"): a <canvas> or <img> the same shape as the

const DEFAULTS = {
  thickness: 1,       /* trail thickness, 0.6 – 1.6 */
  drips: 1,           /* how much the oil drips, 0 (none) – 2 */
  maxDpr: 2,          /* cap on devicePixelRatio (keeps Chromebooks fast) */
  hoverTrail: true,   /* a mouse leaves a trail just by moving (no button needed) */
  tapToPop: true,     /* a quick tap drops an olive that cracks and bursts */
  captureBackdrop: null,  /* () => HTMLCanvasElement | HTMLImageElement | Promise<…> | null */
  backdropColor: null,    /* flat colour to refract until/unless a backdrop picture exists */
  ignoreSelector: 'button, a, input, select, textarea, label, [role="button"], [data-no-oil]',
  zIndex: 10,
  eventTarget: null,  /* Tashbar: where to listen for the finger (default: the container) */

function createOliveOilTrail(container, options = {}) {

  const off = document.createElement('canvas');     /* used only by the no-WebGL fallback */

  const CELL = 2;                 /* css px per simulation cell */
  const T = 0.32;                 /* surface threshold */
  const MAXH = 2.4;               /* max oil thickness */
  const HALF_LIFE = 430;          /* ms for the oil to thin by half */

  let aimX = 0, aimY = 0, viewX = 0, viewY = 0;   /* viewing angle, from where the pointer is */

    const vs = 'attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }';

precision highp float;
uniform sampler2D u_h; uniform vec2 u_tex; uniform float u_k; uniform float u_hpx;
uniform sampler2D u_bg; uniform vec2 u_res; uniform float u_dpr; uniform vec2 u_view;
const float T = ${T.toFixed(3)}; const float MAXH = ${MAXH.toFixed(3)};

}

    vec2 so = vec2(1.0 + u_view.x * 1.2, 1.7 + u_view.y * 1.2);
    float hs = hAt(p - so);
    float sh = smoothstep(T * 0.8, T * 1.5, hs) * 0.24;

    float hc = hAt(p - so * 0.7);

  vec3 n = normalize(vec3(-gx, -gy, 1.0));
  /* the viewing angle follows the pointer, so highlights and reflections slide like real glass */
  vec3 V = normalize(vec3(u_view * 0.7, 1.0));
  vec3 L = normalize(vec3(-0.55 - u_view.x * 0.6, -0.75 - u_view.y * 0.6, 0.9));
  vec3 HV = normalize(L + V);

  float dif = max(0.0, dot(n, L));
  float sp = pow(max(0.0, dot(n, HV)), 48.0);
  float sp2 = pow(max(0.0, dot(n, HV2)), 8.0);
  float aw = ${deriv ? 'max(fwidth(h) * 0.9, 0.003)' : '0.02'};
  float edge = smoothstep(T - aw, T + aw, h);

  float th = clamp((h - T) / 1.3, 0.0, 1.0);

  /* golden olive oil: pale gold where thin, deep amber-gold where thick, darker at the rim */
  vec3 oilc = vec3(240.0 - 50.0 * th - 50.0 * fres, 228.0 - 42.0 * th - 52.0 * fres, 112.0 - 80.0 * th - 45.0 * fres) / 255.0 * shade;
  /* light bends through the oil like a lens: what's underneath is shifted by the slope of a smoothed
     surface, so text under the oil warps but stays readable; the curved rims bend it hardest */
  vec2 suv = gl_FragCoord.xy / u_res;
  float e2 = 7.5;
  float rx = (hAt(p + vec2(e2, 0.0)) - hAt(p - vec2(e2, 0.0))) / (2.0 * e2);
  float ry = (hAt(p + vec2(0.0, e2)) - hAt(p - vec2(0.0, e2))) / (2.0 * e2);
  vec2 bpx = vec2(rx, -ry) * (380.0 + 260.0 * th);                   /* thick oil is a stronger lens */
  float bl = length(bpx); if (bl > 130.0) bpx *= 130.0 / bl;
  vec2 bend = bpx * u_dpr / u_res;
  /* a drop of oil is a convex lens: it pulls the view in toward its middle, so what's under it is MAGNIFIED

  vec3 under = vec3(
    texture2D(u_bg, suv + bend * 1.03).r,
    texture2D(u_bg, suv + bend).g,
    texture2D(u_bg, suv + bend * 0.97).b);
  float lum = dot(under, vec3(0.299, 0.587, 0.114));
  float bright = smoothstep(0.15, 0.75, lum);                          /* 0 on dark screens, 1 on light ones */
  /* colour like real olive oil: it ABSORBS blue (and a little green) light passing through it,
     more where it's thicker. Strong on light screens (reads as clear gold), gentle on dark
     screens (stays glassy instead of muddy). */
  vec3 absorb = exp(-vec3(0.04, 0.16, 1.25) * (0.45 + 1.2 * th + 0.5 * fres) * mix(0.32, 1.0, bright));
  float body = (0.04 + 0.08 * th + 0.14 * fres) * mix(1.4, 0.6, bright);   /* clear: you see straight through the oil */
  vec3 col = mix(under * absorb * mix(1.15, 1.04, bright), oilc, clamp(body, 0.0, 0.3));
  /* real liquid edge: where the surface curves steeply, light is bent away and the edge goes dark */
  col *= 1.0 - 0.32 * smoothstep(0.62, 0.96, fres) * mix(0.6, 1.0, bright);
  float s = sp * 0.16 + sp2 * 0.015;                                  /* glare toned way down: the bending gives the 3-D look */
  col += vec3(1.0, 0.98, 0.9) * s;
  /* reflected room: dim version of what's under it, warm light above, a soft window streak */
  vec3 R = reflect(-V, n);
  vec3 env = mix(under * 0.55, vec3(1.0, 0.86, 0.55), smoothstep(-0.25, 0.55, -R.y));
  float win = smoothstep(0.09, 0.0, abs(R.x + 0.3 + u_view.x * 0.35)) * smoothstep(0.05, 0.45, -R.y);
  col += env * (0.02 + 0.08 * fres) * (1.0 - bright);                /* dark screens: a faint warm glow on the rims */
  col = mix(col, env, (0.01 + 0.05 * fres) * bright);                 /* light screens: a faint reflection instead */
  col += vec3(1.0, 0.96, 0.85) * win * 0.05;
  /* a crisp lit rim on the side facing the light (the meniscus catching it) */
  float rimLit = smoothstep(0.22, 0.6, fres) * max(0.0, dot(normalize(n.xy + 1e-4), normalize(vec2(-0.55, -0.75))));
  col += vec3(1.0, 0.92, 0.6) * rimLit * 0.12;
  /* light focused inside thick oil: a faint warm glow in the core */
  col += vec3(1.0, 0.8, 0.28) * th * th * (1.0 - fres) * 0.1;
  float a = edge + film * 0.0;
  gl_FragColor = vec4(clamp(col, 0.0, 1.0) * a, a);
}`;
    const sh = (type, src) => { const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o);
      if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
    glProg = gl.createProgram();
    gl.attachShader(glProg, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(glProg, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(glProg);
    if (!gl.getProgramParameter(glProg, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(glProg));
    gl.useProgram(glProg);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(glProg, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    uTex = gl.getUniformLocation(glProg, 'u_tex'); uK = gl.getUniformLocation(glProg, 'u_k'); uH = gl.getUniformLocation(glProg, 'u_hpx');
    gl.uniform1i(gl.getUniformLocation(glProg, 'u_h'), 0);
    gl.uniform1i(gl.getUniformLocation(glProg, 'u_bg'), 1);
    uRes = gl.getUniformLocation(glProg, 'u_res'); uDpr = gl.getUniformLocation(glProg, 'u_dpr'); uView = gl.getUniformLocation(glProg, 'u_view');
    bgTex = gl.createTexture(); gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, bgTex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.activeTexture(gl.TEXTURE0);
    glTex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, glTex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  /* ---------------------------------------------------------------- the backdrop (what the oil bends) */
  function flatColor() {
    if (o.backdropColor) return o.backdropColor;
    /* first non-transparent background going up from the container */
    for (let el = container; el; el = el.parentElement) {
      const bg = getComputedStyle(el).backgroundColor;

      try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src); ok = true; }
      catch (e) { console.warn('olive-oil-trail: backdrop could not be used (cross-origin image?) — bending a flat colour instead.', e); }
    }

      const c = document.createElement('canvas'); c.width = c.height = 2;
      const x = c.getContext('2d'); x.fillStyle = flatColor(); x.fillRect(0, 0, 2, 2);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
    }
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.activeTexture(gl.TEXTURE0);
    kick();
  }
  async function refreshBackdrop() {
    if (destroyed || !gl) return;

    let src = null;
    if (o.captureBackdrop) {
      try { src = await o.captureBackdrop(); } catch (e) { console.warn('olive-oil-trail: captureBackdrop failed', e); }
    }

    lastBackdrop = src || null;
    uploadBackdrop(lastBackdrop);
  }
  function scheduleBackdrop(ms = 250) { clearTimeout(bdTimer); bdTimer = setTimeout(refreshBackdrop, ms); }

  /* ---------------------------------------------------------------- size */
  function resize() {
    const r = container.getBoundingClientRect();
    vw = Math.max(1, Math.round(r.width)); vh = Math.max(1, Math.round(r.height));
    dpr = Math.min(window.devicePixelRatio || 1, o.maxDpr);
    canvas.width = Math.round(vw * dpr); canvas.height = Math.round(vh * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = Math.ceil(vw / CELL) + 2; Hh = Math.ceil(vh / CELL) + 2;
    H = new Float32Array(W * Hh); Tmp = new Float32Array(W * Hh); rowOn = new Uint8Array(Hh);
    off.width = W; off.height = Hh; img = octx.createImageData(W, Hh);
    if (gl) resizeGL(); else { glc.width = glc.height = 1; }
    kick();
    scheduleBackdrop(150);   /* the picture under the oil changed size too */
  }

  function resizeGL() {
    glc.width = Math.round(vw * dpr); glc.height = Math.round(vh * dpr);
    pack = new Uint8Array(W * Hh * 4);
    gl.bindTexture(gl.TEXTURE_2D, glTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, Hh, 0, gl.RGBA, gl.UNSIGNED_BYTE, pack);
    gl.viewport(0, 0, glc.width, glc.height);
    gl.uniform2f(uTex, W, Hh); gl.uniform1f(uK, 1 / (dpr * CELL)); gl.uniform1f(uH, glc.height);
    gl.uniform2f(uRes, glc.width, glc.height); gl.uniform1f(uDpr, dpr);

  function drawGL(y0, y1) {
    const a0 = Math.max(0, Math.min(prevY0, y1 >= 0 ? y0 : 1e9)), a1 = Math.min(Hh - 1, Math.max(prevY1, y1));
    if (a1 >= a0) {

        const row = y * W;
        for (let x = 0; x < W; x++) {
          const q = (H[row + x] / MAXH * 65535) | 0, o = (row + x) * 4;
          pack[o] = q >> 8; pack[o + 1] = q & 255;

  /* add a soft round blob of oil (sim coords) */
  function stamp(cx, cy, r, amp) {
    const x0 = Math.max(1, Math.floor(cx - r)), x1 = Math.min(W - 2, Math.ceil(cx + r));
    const y0 = Math.max(1, Math.floor(cy - r)), y1 = Math.min(Hh - 2, Math.ceil(cy + r));

    for (let y = y0; y <= y1; y++) {
      let hit = false;
      for (let x = x0; x <= x1; x++) {

  /* ---- strokes ---- */
  const strokes = new Map();
  let lastStampDist = 0;
  function addPoint(s, x, y, t) {
    /* viscous lag: the oil blob trails behind the finger like thick liquid, then catches up */
    s.tx = x; s.ty = y;
    if (s.bx === undefined) { s.bx = x; s.by = y; }
    s.bx += (x - s.bx) * 0.3; s.by += (y - s.by) * 0.3;
    x = s.bx; y = s.by;
    if (s.last) {
      const dx = x - s.last.x, dy = y - s.last.y, d = Math.hypot(dx, dy);
      if (d < 1) return;

      const target = Math.max(8, Math.min(22, 22 - speed * 5)) * thick;
      s.w += (target - s.w) * 0.3;

      const amp = 0.55 + 0.35 / (1 + speed);                          /* slow = more oil */

  /* ---- drips: run down slowly, leaving a thin line with a bead at the front ---- */
  const drips = [];
  function addDrip(x, y, r, vol) { if (drips.length < 40) drips.push({ x, y, r, vol, vy: 0, ph: Math.random() * 6 }); }

  /* ---- flying droplets (drawn as beads, then land as oil) ---- */
  const drops = [];
  function addDroplet(x, y, vx, vy, r) { if (drops.length < 90) drops.push({ x, y, vx, vy, r, t: 0, land: 0.12 + Math.random() * 0.16 }); }

      for (let y = b0; y <= b1; y++) { const r = y * W; for (let x = 1; x < W - 1; x++) { const i = r + x; Tmp[i] = (H[i - 1] + 2 * H[i] + H[i + 1]) * 0.25; } }
      for (let y = a0; y <= a1; y++) { const r = y * W; for (let x = 1; x < W - 1; x++) { const i = r + x; H[i] = H[i] * 0.72 + 0.28 * (Tmp[i - W] + 2 * Tmp[i] + Tmp[i + W]) * 0.25; } rowOn[y] = 1; }
      for (let y = b0; y <= b1; y++) { if (y < a0 || y > a1) { const r = y * W; for (let x = 0; x < W; x++) Tmp[r + x] = 0; } }
      /* gravity: thick oil slowly sags downward, like real liquid on glass */
      for (let y = a1; y >= a0; y--) {
        const r = y * W;
        for (let x = 1; x < W - 1; x++) {
          const i = r + x, ex = H[i] - 0.9;

        }

    }

    ctx.clearRect(0, 0, vw, vh);

    /* shade the oil */
    if (gl) { drawGL(y0, y1); if (y1 >= 0) busy = true; }

        const row = y * W;

          const i = row + x, h = H[i], o = i * 4;
          if (h < T * 0.75) { px[o + 3] = 0; continue; }

    }

    /* olives: pop, crack, split */
    for (let i = olives.length - 1; i >= 0; i--) {
      const o = olives[i]; o.t += dt * 1000;
      if (o.t >= OLIVE_POP) { olives.splice(i, 1); split(o); continue; }
      busy = true;
      /* drop in, then a quick hard press: it flattens and cracks (bottom stays planted), then crushes */
      let sx, sy, k = 0;

      h.vy += 1500 * dt; h.x += h.vx * dt; h.y += h.vy * dt; h.rot += h.vr * dt;

        if (ch.t >= ch.stick) { ch.stuck = true; ch.squash = 1.5; stamp(ch.x / CELL, ch.y / CELL, ch.size * 0.6, 0.6); }

    }

    /* pits: pop out with a small hop, then fall straight down the screen under gravity (no rolling or spinning) */
    for (let i = pits.length - 1; i >= 0; i--) {
      const p = pits[i]; p.t += dt * 1000;
      if (p.y > vh + 40 || p.t >= 4000) { pits.splice(i, 1); continue; }
      busy = true;
      p.vy += 1500 * dt; p.x += p.vx * dt; p.y += p.vy * dt;           /* gravity pulls it straight down */
      p.vx *= Math.exp(-1.2 * dt);                                      /* barely drifts sideways */

  }

  resize();
  refreshBackdrop();

  /* ---------------------------------------------------------------- public API */
  return {
    /** change options live, e.g. { thickness: 1.3, drips: 0 } */
    setOptions(next = {}) {

      if ('thickness' in next) thick = +next.thickness;

}

/* ================================================================ THE APP RULE (Tashbar) ================================================================ */
/* The oil is the default trail from 23 Nov 2026 through 3 Tevet 5787 (the last day of Chanukah). Hebrew date from Intl (the app's own way). */
const START = new Date(2026, 10, 23);
function today() { const d = window.TL_OIL_DAY instanceof Date ? window.TL_OIL_DAY : new Date(); return d; }
function inSeason() {
  const d = today(); if (d < START) return false;
  try {
    const p = new Intl.DateTimeFormat('en-u-ca-hebrew', { day: 'numeric', month: 'long', year: 'numeric' }).formatToParts(d);
    const get = t => (p.filter(x => x.type === t)[0] || {}).value || '';
    const y = parseInt(get('year'), 10), m = get('month'), day = parseInt(get('day'), 10);
    if (y !== 5787) return false;
    return m === 'Kislev' || (m === 'Tevet' && day <= 3);
  } catch (e) { return d < new Date(2026, 11, 13); }
}
/* on for a signed-in boy who has not bought a trail of his own (a bought trail or tap blast wins) */
function boughtTrail() { try { return typeof window.tlStoreTrailOn === 'function' && window.tlStoreTrailOn(); } catch (e) { return false; } }
function boughtTap() { try { return typeof window.tlTapStyle === 'function' && !!window.tlTapStyle(); } catch (e) { return false; } }
function signedIn() { try { return typeof A !== 'undefined' && A && A.st && A.view !== 'signin'; } catch (e) { return false; } }
window.tlOilOn = function () { return window.TL_OIL_OFF !== true && signedIn() && inSeason() && !boughtTrail(); };
/* HomePlus asks this before its free tap splash: the olive is the free tap during the oil season (a bought tap blast still wins) */
window.tlOilTapOn = function () { return window.tlOilOn() && !boughtTap(); };

/* LIGHT BENDING (HoS 2026-11-23: "not bending on the homepage or anywhere else"): on every page of the boy's home (#gm) a half-size snapshot
   of the screen is taken with html2canvas (our own /vendor/ copy, loaded only when needed) once he has been idle 1.5 s (taps, keys and
   scrolling count as busy; moving the mouse to pour oil does not), and retaken when the page changes. Lessons: the plain page colour. */
const VENDOR = '/vendor/html2canvas.min.js';
let h2c = null, snap = null, snapSig = '', snapTimer = 0, snapping = false, lastInput = 0, gmChanges = 0, gmWatched = null, scrolls = 0, redraws = 0;

const gmObs = typeof MutationObserver === 'function' ? new MutationObserver(() => { gmChanges++; }) : null;

function loadH2c() {

  const gm = document.getElementById('gm'); if (!gm) return;

      ignoreElements: el => { if (el.tagName === 'SCRIPT' || el.tagName === 'NOSCRIPT') return true;
        if (el.hasAttribute && (el.hasAttribute('data-oil-layer') || el.hasAttribute('data-jelly-layer') || el.id === 'tl-oil' || el.id === 'tl-jelly' || el.id === 'hpblade')) return true;
        if (el.tagName === 'STYLE' || el.tagName === 'LINK') return false;   /* many of the app's style sheets sit in the body: keep them all */

let eng = null, box = null;

    try {
      box = document.createElement('div'); box.id = 'tl-oil'; box.setAttribute('aria-hidden', 'true');
      box.style.cssText = 'position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:2147483199';
      document.body.appendChild(box);

        /* HoS 2026-11-24: an olive on EVERY tap, buttons too (not only empty space); never where a boy types or draws */
        ignoreSelector: 'input, select, textarea, [contenteditable], [data-no-oil]',

})();
