<script>
/* OilTrail.html — CHANUKAH OLIVE OIL TRAIL (HoS 2026-11-23, made in Claude Chat with the owner; look and timings kept exactly).
   1. THE ENGINE: oil-trail.js from the handoff, unchanged except: its comments use slash-star (HtmlService rule: no slash-slash in this
      file), and "export function createOilTrail" is a plain function exposed as window.TL_OIL.create.
   2. THE APP RULE (HoS 2026-11-23): from 23 Nov 2026 through 3 Tevet 5787 the oil is every signed-in boy's DEFAULT trail: it replaces
      the free glowing streak and the free tap splash (HomePlus.html asks window.tlOilOn()). A boy who BOUGHT a trail or tap blast keeps
      his own. After Chanukah the default goes back to the streak (and the oil becomes a store item, a separate change).
      Background: on every page of the home a snapshot of the screen (light bending, see LIGHT BENDING below); in lessons null, a see-through golden film.
      Anything a boy draws on (every canvas, writing boxes) gets data-no-oil, so the oil never gets in the way of tracing or games.
   Test switch: window.TL_OIL_DAY = a Date to pretend today is that day (tests only). Off switch: window.TL_OIL = false before load.
   No slash-slash in this file (HtmlService rule). */
(function(){
if(window.TL_OIL===false||window.TL_OIL) return;

/*
 * oil-trail.js: Hanukkah olive oil trail (Fruit-Ninja style).
 * Plain JS, no dependencies. Mouse, touch (up to 2 fingers) and pen.
 *
 *   const oil = createOilTrail({ background: '/images/map-bg.jpg' });
 *   oil.setEnabled(false);       (stop drawing; existing oil fades away)
 *   oil.setBackground(img);      (what the oil bends: image, canvas, URL or draw function)
 *   oil.clear();                 (wipe the oil now)
 *   oil.destroy();               (remove everything)
 *
 * Two canvases sit on top of the page with pointer-events: none, so every
 * click and tap still reaches the app underneath.
 */

const DEFAULTS = {
  container: null,       /* element to put the canvases in (default: document.body) */
  zIndex: 9999,
  enabled: true,
  background: null,      /* see setBackground(); null = oil is see-through but does not bend the page */
  thickness: 1,          /* 0.6 to 1.6 */
  drips: 1,              /* 0 (none) to 2 */
  dprCap: 2,             /* max device pixel ratio for the canvases */
  hoverTrail: true,      /* a mouse leaves oil just by moving, without pressing */
  crackOnTap: true,      /* a quick tap drops an olive that gets crushed */
  /* taps on these never crack an olive; [data-no-oil] also blocks the trail entirely */
  ignore: 'button, a, input, select, textarea, label, [role="button"], [contenteditable], [data-no-oil]',
};

function createOilTrail(options = {}) {
  const o = { ...DEFAULTS, ...options };
  let enabled = !!o.enabled, thick = o.thickness, dripAmt = o.drips;
  const reduced = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) dripAmt = 0;

  /* ---------------------------------------------------------------- canvases */
  const host = o.container || document.body;
  const mk = () => {
    const c = document.createElement('canvas');
    c.setAttribute('aria-hidden', 'true');
    Object.assign(c.style, { position: 'fixed', left: '0', top: '0', width: '100%', height: '100%', pointerEvents: 'none', zIndex: String(o.zIndex) });
    host.appendChild(c);
    return c;
  };
  const glc = mk();                       /* the oil itself (WebGL) */
  const canvas = mk();                    /* olives, pits, flesh, droplets (2D, on top) */
  const ctx = canvas.getContext('2d');
  const off = document.createElement('canvas'), octx = off.getContext('2d');

  /* ---------------------------------------------------------------- simulation constants */
  const CELL = 2;          /* css px per simulation cell */
  const T = 0.32;          /* surface threshold */
  const MAXH = 2.4;        /* max oil thickness */
  const HALF_LIFE = 430;   /* ms for the oil to thin by half */
  let W = 0, Hh = 0, H = null, Tmp = null, rowOn = null, img = null, dpr = 1, vw = 0, vh = 0;

  /* ---------------------------------------------------------------- WebGL renderer */
  let gl = null;
  try { gl = glc.getContext('webgl', { premultipliedAlpha: true, alpha: true, antialias: false }); } catch (e) { gl = null; }
  let glProg = null, glTex = null, bgTex = null, uTex, uK, uH, uRes, uDpr, uHasBg, pack = null, prevY0 = 1e9, prevY1 = -1;
  const scene = document.createElement('canvas'), sctx = scene.getContext('2d');
  let bgSource = null, bgImage = null, hasBg = false;

  function setupGL() {
    const deriv = !!gl.getExtension('OES_standard_derivatives');
    const vs = 'attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }';
    const fs = (deriv ? '#extension GL_OES_standard_derivatives : enable\n' : '') + `
precision highp float;
uniform sampler2D u_h; uniform vec2 u_tex; uniform float u_k; uniform float u_hpx;
uniform sampler2D u_bg; uniform vec2 u_res; uniform float u_dpr; uniform float u_hasBg;
const float T = ${T.toFixed(3)}; const float MAXH = ${MAXH.toFixed(3)};
float dec(vec2 t){ vec4 c = texture2D(u_h, (t + 0.5) / u_tex); return (c.r * 65280.0 + c.g * 255.0) / 65535.0 * MAXH; }
float hAt(vec2 p){
  vec2 q = p - 0.5; vec2 i = floor(q); vec2 f = q - i;
  return mix(mix(dec(i), dec(i + vec2(1.0, 0.0)), f.x), mix(dec(i + vec2(0.0, 1.0)), dec(i + vec2(1.0, 1.0)), f.x), f.y);
}
void main(){
  vec2 p = vec2(gl_FragCoord.x, u_hpx - gl_FragCoord.y) * u_k;
  float h = hAt(p);
  if (h < T * 0.55) {
    /* soft shadow under the oil, with a warm caustic glow inside it */
    vec2 so = vec2(1.0, 1.7);
    float sh = smoothstep(T * 0.8, T * 1.5, hAt(p - so)) * 0.24;
    float ca = smoothstep(T * 1.4, T * 3.0, hAt(p - so * 0.7)) * 0.32;
    if (sh < 0.004 && ca < 0.004) discard;
    gl_FragColor = vec4(vec3(1.0, 0.93, 0.45) * ca * 0.8, sh * 0.8);
    return;
  }
  float e = 1.4;
  float gx = (hAt(p + vec2(e, 0.0)) - hAt(p - vec2(e, 0.0))) / (2.0 * e) * 5.2;
  float gy = (hAt(p + vec2(0.0, e)) - hAt(p - vec2(0.0, e))) / (2.0 * e) * 5.2;
  vec3 n = normalize(vec3(-gx, -gy, 1.0));
  vec3 V = vec3(0.0, 0.0, 1.0);
  vec3 L = normalize(vec3(-0.55, -0.75, 0.9));
  vec3 HV = normalize(L + V);
  vec3 HV2 = normalize(normalize(vec3(0.7, 0.2, 1.6)) + V);
  float dif = max(0.0, dot(n, L));
  float sp = pow(max(0.0, dot(n, HV)), 48.0);
  float sp2 = pow(max(0.0, dot(n, HV2)), 8.0);
  float aw = ${deriv ? 'max(fwidth(h) * 0.9, 0.003)' : '0.02'};
  float edge = smoothstep(T - aw, T + aw, h);
  float th = clamp((h - T) / 1.3, 0.0, 1.0);
  float fres = 1.0 - n.z;
  float shade = 0.62 + 0.5 * dif;
  /* golden olive oil with a hint of green, a little deeper where thick and at the rim */
  vec3 oilc = vec3(240.0 - 50.0 * th - 50.0 * fres, 228.0 - 42.0 * th - 52.0 * fres, 112.0 - 80.0 * th - 45.0 * fres) / 255.0 * shade;
  float s = sp * 0.55 + sp2 * 0.06;
  vec3 R = reflect(-V, n);
  vec3 env = mix(vec3(0.16, 0.08, 0.36), vec3(1.0, 0.86, 0.55), smoothstep(-0.25, 0.55, -R.y));
  float win = smoothstep(0.09, 0.0, abs(R.x + 0.3)) * smoothstep(0.05, 0.45, -R.y);
  vec3 glow = vec3(1.0, 0.98, 0.9) * s + env * (0.04 + 0.16 * fres) + vec3(1.0, 0.96, 0.85) * win * 0.16;
  if (u_hasBg > 0.5) {
    /* refraction: what's underneath is shifted by the surface slope */
    vec2 suv = gl_FragCoord.xy / u_res;
    vec2 bend = vec2(n.x, -n.y) * (14.0 + 22.0 * th) * u_dpr / u_res;
    vec3 under = texture2D(u_bg, suv - bend).rgb;
    vec3 tint = mix(vec3(1.0, 0.97, 0.66), vec3(0.93, 0.9, 0.36), th);
    float body = 0.08 + 0.18 * th + 0.22 * fres;
    vec3 col = mix(under * tint * 1.1, oilc, clamp(body, 0.0, 0.45)) + glow;
    gl_FragColor = vec4(clamp(col, 0.0, 1.0) * edge, edge);
  } else {
    /* no background given: a see-through golden film, the real page shows through */
    float ta = clamp(0.16 + 0.24 * th + 0.3 * fres, 0.0, 0.6);
    vec3 col = oilc * ta + glow;
    gl_FragColor = vec4(clamp(col, 0.0, 1.0) * edge, ta * edge);
  }
}`;
    const sh = (type, src) => { const x = gl.createShader(type); gl.shaderSource(x, src); gl.compileShader(x);
      if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; };
    glProg = gl.createProgram();
    gl.attachShader(glProg, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(glProg, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(glProg);
    if (!gl.getProgramParameter(glProg, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(glProg));
    gl.useProgram(glProg);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(glProg, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    uTex = gl.getUniformLocation(glProg, 'u_tex'); uK = gl.getUniformLocation(glProg, 'u_k'); uH = gl.getUniformLocation(glProg, 'u_hpx');
    uRes = gl.getUniformLocation(glProg, 'u_res'); uDpr = gl.getUniformLocation(glProg, 'u_dpr'); uHasBg = gl.getUniformLocation(glProg, 'u_hasBg');
    gl.uniform1i(gl.getUniformLocation(glProg, 'u_h'), 0);
    gl.uniform1i(gl.getUniformLocation(glProg, 'u_bg'), 1);
    const tex = (unit, filter) => {
      const t = gl.createTexture(); gl.activeTexture(unit); gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      return t;
    };
    bgTex = tex(gl.TEXTURE1, gl.LINEAR);
    glTex = tex(gl.TEXTURE0, gl.NEAREST);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  }
  if (gl) { try { setupGL(); } catch (e) { console.warn('OilTrail: WebGL off, using 2D fallback.', e); gl = null; } }

  /* ---------------------------------------------------------------- background (for the light-bending) */
  /* src can be: an image URL, an <img>, a <canvas>/ImageBitmap/<video>, or a function (ctx, width, height) that draws it. */
  function setBackground(src) {
    bgSource = src || null; bgImage = null;
    if (typeof src === 'string') {
      const im = new Image(); im.crossOrigin = 'anonymous'; im.decoding = 'async';
      im.onload = () => { if (bgSource === src) { bgImage = im; drawScene(); kick(); } };
      im.onerror = () => console.warn('OilTrail: could not load background', src);
      im.src = src;
    } else if (src && typeof src !== 'function') {
      bgImage = src;
      if (src instanceof HTMLImageElement && !src.complete) src.addEventListener('load', () => { drawScene(); kick(); }, { once: true });
    }
    drawScene(); kick();
  }
  function drawScene() {
    if (!gl) return;
    const c = sctx;
    let ok = false;
    if (typeof bgSource === 'function' || bgImage) {
      scene.width = glc.width; scene.height = glc.height;
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      c.clearRect(0, 0, vw, vh);
      try {
        if (typeof bgSource === 'function') { bgSource(c, vw, vh); ok = true; }
        else {
          const iw = bgImage.naturalWidth || bgImage.videoWidth || bgImage.width, ih = bgImage.naturalHeight || bgImage.videoHeight || bgImage.height;
          if (iw && ih) {
            /* same as CSS background-size: cover; background-position: center */
            const k = Math.max(vw / iw, vh / ih);
            c.drawImage(bgImage, (vw - iw * k) / 2, (vh - ih * k) / 2, iw * k, ih * k);
            ok = true;
          }
        }
      } catch (e) { console.warn('OilTrail: background draw failed', e); ok = false; }
    }
    hasBg = ok;
    gl.useProgram(glProg);
    gl.uniform1f(uHasBg, hasBg ? 1 : 0);
    if (!ok) return;
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, bgTex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, scene); }
    catch (e) { console.warn('OilTrail: background blocked (cross-origin image?)', e); hasBg = false; gl.uniform1f(uHasBg, 0); }
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.activeTexture(gl.TEXTURE0);
  }

  function resizeGL() {
    glc.width = Math.round(vw * dpr); glc.height = Math.round(vh * dpr);
    pack = new Uint8Array(W * Hh * 4);
    gl.bindTexture(gl.TEXTURE_2D, glTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, Hh, 0, gl.RGBA, gl.UNSIGNED_BYTE, pack);
    gl.viewport(0, 0, glc.width, glc.height);
    gl.uniform2f(uTex, W, Hh); gl.uniform1f(uK, 1 / (dpr * CELL)); gl.uniform1f(uH, glc.height);
    gl.uniform2f(uRes, glc.width, glc.height); gl.uniform1f(uDpr, dpr);
    drawScene();
    prevY0 = 1e9; prevY1 = -1;
  }
  function drawGL(y0, y1) {
    /* upload only the rows that changed (this frame's band plus last frame's) */
    const a0 = Math.max(0, Math.min(prevY0, y1 >= 0 ? y0 : 1e9)), a1 = Math.min(Hh - 1, Math.max(prevY1, y1));
    if (a1 >= a0) {
      for (let y = a0; y <= a1; y++) {
        const row = y * W;
        for (let x = 0; x < W; x++) {
          const q = (H[row + x] / MAXH * 65535) | 0, i4 = (row + x) * 4;
          pack[i4] = q >> 8; pack[i4 + 1] = q & 255;
        }
      }
      gl.bindTexture(gl.TEXTURE_2D, glTex);
      gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, a0, W, a1 - a0 + 1, gl.RGBA, gl.UNSIGNED_BYTE, pack.subarray(a0 * W * 4, (a1 + 1) * W * 4));
    }
    prevY0 = y1 >= 0 ? y0 : 1e9; prevY1 = y1;
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    if (y1 >= 0) gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function resize() {
    vw = innerWidth; vh = innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, o.dprCap);
    canvas.width = Math.round(vw * dpr); canvas.height = Math.round(vh * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = Math.ceil(vw / CELL) + 2; Hh = Math.ceil(vh / CELL) + 2;
    H = new Float32Array(W * Hh); Tmp = new Float32Array(W * Hh); rowOn = new Uint8Array(Hh);
    off.width = W; off.height = Hh; img = octx.createImageData(W, Hh);
    if (gl) resizeGL();
    kick();
  }

  /* ---------------------------------------------------------------- oil */
  function stamp(cx, cy, r, amp) {
    const x0 = Math.max(1, Math.floor(cx - r)), x1 = Math.min(W - 2, Math.ceil(cx + r));
    const y0 = Math.max(1, Math.floor(cy - r)), y1 = Math.min(Hh - 2, Math.ceil(cy + r));
    const r2 = r * r;
    for (let y = y0; y <= y1; y++) {
      let hit = false;
      for (let x = x0; x <= x1; x++) {
        const d2 = (x - cx) * (x - cx) + (y - cy) * (y - cy);
        if (d2 >= r2) continue;
        const f = 1 - d2 / r2, i = y * W + x, v = H[i] + amp * f * f;
        H[i] = v > MAXH ? MAXH : v; hit = true;
      }
      if (hit) rowOn[y] = 1;
    }
  }

  const strokes = new Map();
  let lastStampDist = 0;
  function addPoint(s, x, y, t) {
    /* viscous lag: the oil trails behind the finger like thick liquid, then catches up */
    s.tx = x; s.ty = y;
    if (s.bx === undefined) { s.bx = x; s.by = y; }
    s.bx += (x - s.bx) * 0.3; s.by += (y - s.by) * 0.3;
    x = s.bx; y = s.by;
    if (s.last) {
      const dx = x - s.last.x, dy = y - s.last.y, d = Math.hypot(dx, dy);
      if (d < 1) return;
      const speed = d / Math.max(t - s.last.t, 1);                    /* px/ms */
      const target = Math.max(8, Math.min(22, 22 - speed * 5)) * thick;
      s.w += (target - s.w) * 0.3;
      const steps = Math.ceil(d / (CELL * 0.5));
      const amp = 0.55 + 0.35 / (1 + speed);                          /* slow = more oil */
      for (let k = 1; k <= steps; k++) stamp((s.last.x + dx * k / steps) / CELL, (s.last.y + dy * k / steps) / CELL, s.w / 2 / CELL, amp * 0.42);
      lastStampDist += d;
      if (dripAmt > 0 && lastStampDist > 70 / dripAmt && Math.random() < 0.55 && speed < 2.2) {
        lastStampDist = 0;
        addDrip(x / CELL + (Math.random() - 0.5) * 2, (y + s.w * 0.25) / CELL, 1.6 + Math.random() * 1.1, 0.9 + Math.random() * 1.2);
      }
      if (speed > 1.8 && Math.random() < 0.07) {
        const a = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.8, v = 160 + Math.random() * 200;
        addDroplet(x, y, Math.cos(a) * v, Math.sin(a) * v, 1.6 + Math.random() * 1.6);
      }
    }
    s.last = { x, y, t };
  }

  const drips = [], drops = [];
  function addDrip(x, y, r, vol) { if (drips.length < 40) drips.push({ x, y, r, vol, vy: 0, ph: Math.random() * 6 }); }
  function addDroplet(x, y, vx, vy, r) { if (drops.length < 90) drops.push({ x, y, vx, vy, r, t: 0, land: 0.12 + Math.random() * 0.16 }); }

  /* ---------------------------------------------------------------- olives */
  const olives = [], shards = [], pits = [], rings = [], chunks = [];
  function olivePath(c) {
    c.beginPath(); c.moveTo(0, -21);
    c.bezierCurveTo(10, -21, 16.5, -10, 16.5, 2);
    c.bezierCurveTo(16.5, 14, 9.5, 22.5, 0, 22.5);
    c.bezierCurveTo(-9.5, 22.5, -16.5, 14, -16.5, 2);
    c.bezierCurveTo(-16.5, -10, -10, -21, 0, -21);
    c.closePath();
  }
  function makeSpecks() {
    const s = [];
    for (let i = 0; i < 26; i++) { const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()); s.push(Math.cos(a) * r * 14, Math.sin(a) * r * 19 + 1, 0.35 + Math.random() * 0.5); }
    return s;
  }
  function drawOliveSkin(c, specks) {
    c.save(); c.fillStyle = 'rgba(0,0,0,0.28)'; c.filter = 'blur(4px)';
    c.beginPath(); c.ellipse(2, 23, 14, 4, 0, 0, Math.PI * 2); c.fill(); c.restore();
    olivePath(c);
    const g = c.createRadialGradient(-5, -8, 1, 1, 2, 27);
    g.addColorStop(0, '#c3d86e'); g.addColorStop(0.3, '#86a437'); g.addColorStop(0.64, '#56751c'); g.addColorStop(1, '#253608');
    c.fillStyle = g; c.fill();
    c.save(); olivePath(c); c.clip();
    const ss = c.createRadialGradient(6, 12, 2, 6, 12, 20);
    ss.addColorStop(0, 'rgba(210,220,90,0.28)'); ss.addColorStop(1, 'rgba(210,220,90,0)');
    c.fillStyle = ss; c.fillRect(-20, -24, 40, 50);
    const gb = c.createRadialGradient(0, -18, 1, 0, -16, 12);
    gb.addColorStop(0, 'rgba(150,140,50,0.4)'); gb.addColorStop(1, 'rgba(150,140,50,0)');
    c.fillStyle = gb; c.fillRect(-20, -24, 40, 30);
    for (let i = 0; i < specks.length; i += 3) {
      c.fillStyle = `rgba(235,245,190,${0.2 * specks[i + 2]})`;
      c.beginPath(); c.arc(specks[i], specks[i + 1], specks[i + 2], 0, Math.PI * 2); c.fill();
    }
    c.save(); c.translate(-7, -8); c.rotate(-0.45);
    const hl = c.createLinearGradient(0, -8, 0, 8);
    hl.addColorStop(0, 'rgba(255,255,255,0.7)'); hl.addColorStop(1, 'rgba(255,255,255,0.05)');
    c.fillStyle = hl; c.beginPath(); c.ellipse(0, 0, 3.6, 8, 0, 0, Math.PI * 2); c.fill();
    c.restore();
    c.fillStyle = 'rgba(255,255,255,0.95)';
    c.beginPath(); c.ellipse(-4.2, -14.5, 1.3, 0.9, -0.5, 0, Math.PI * 2); c.fill();
    c.strokeStyle = 'rgba(240,255,190,0.22)'; c.lineWidth = 1.6;
    c.beginPath(); c.ellipse(1, 2, 15.4, 20.2, 0, 0.1, 1.3); c.stroke();
    c.restore();
    c.fillStyle = '#5a4a38'; c.beginPath(); c.ellipse(0, -20.4, 2.6, 1.2, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#20140c'; c.beginPath(); c.ellipse(0, -20.5, 1.2, 0.6, 0, 0, Math.PI * 2); c.fill();
  }
  function drawCracks(c, cracks, p) {
    c.lineCap = 'round'; c.lineJoin = 'round';
    for (const pass of [0, 1]) {
      c.strokeStyle = pass ? 'rgba(240,245,205,0.95)' : 'rgba(20,30,0,0.7)';
      c.lineWidth = pass ? 1.1 : 2.4;
      for (const cr of cracks) {
        const segs = cr.length / 2 - 1, upto = p * segs;
        c.beginPath(); c.moveTo(cr[0], cr[1]);
        for (let s = 1; s <= Math.ceil(upto); s++) {
          const f = Math.min(1, upto - (s - 1));
          c.lineTo(cr[(s - 1) * 2] + (cr[s * 2] - cr[(s - 1) * 2]) * f, cr[(s - 1) * 2 + 1] + (cr[s * 2 + 1] - cr[(s - 1) * 2 + 1]) * f);
        }
        c.stroke();
      }
    }
  }
  function pitPath(c) {

/* ================================================================ THE APP RULE (Tashbar) ================================================================ */
/* The oil is the default trail from 23 Nov 2026 through 3 Tevet 5787 (the last day of Chanukah). Hebrew date from Intl (the app's own way). */
const START = new Date(2026, 10, 23);
function today() { const d = window.TL_OIL_DAY instanceof Date ? window.TL_OIL_DAY : new Date(); return d; }
function inSeason() {
  const d = today(); if (d < START) return false;
  try {
    const p = new Intl.DateTimeFormat('en-u-ca-hebrew', { day: 'numeric', month: 'long', year: 'numeric' }).formatToParts(d);
    const get = t => (p.filter(x => x.type === t)[0] || {}).value || '';
    const y = parseInt(get('year'), 10), m = get('month'), day = parseInt(get('day'), 10);
    if (y !== 5787) return false;
    return m === 'Kislev' || (m === 'Tevet' && day <= 3);
  } catch (e) { return d < new Date(2026, 11, 13); }
}
/* on for a signed-in boy who has not bought a trail of his own (a bought trail or tap blast wins) */
