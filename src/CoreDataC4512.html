(function () {

    c45_u56glow: { title: 'The Night the Sky Glowed (a story)', text: 'My name is Shloimy, and I was eleven years old the winter Baltimore burned. On Sunday morning, February 7, 1904, the fire bells began to ring downtown. That evening, Papa let me climb up to our flat roof, on the east side of the Jones Falls.\nFrom up there I could not see the flames themselves. I saw only a wall of smoke and a sky as orange as a pumpkin. It was the most frightening sky in the world.\nBelow us, wagons rattled down the street, piled high with boxes and chairs. My little brother called them a parade. To me, they looked like people running from a monster.\nSomewhere in that smoke was Uncle Ber\'s shoe store. Nobody had told us yet if it was safe. I held on to the cold chimney and whispered Tehillim, the way Mama does. My knees shook the whole time.\nAll night the bells kept ringing, and Papa said the wind was pushing the fire our way. I stayed on that roof until Papa carried me down to bed. Even in my dreams, the sky was orange.' },
    c45_u56falls: { title: 'I Watched the Fire Stop (a story)', text: 'I am Nachum, and in the winter of 1904 I was twelve. On Monday, February 8, the second day of the great fire, Papa and I walked to the bridge over the Jones Falls. He held my hand so tightly that it hurt.\nAcross the water, the whole downtown seemed to be burning. On our side, firemen stood in a long line, aiming their hoses across the stream. A crowd waited behind them, silent.\nFrom where we stood, behind the crowd, I could see only the backs of the firemen and clouds of steam over the water. My stomach felt tight, like a fist. No one had brought us any news yet about the stores across the water.\nI thought the firemen were the bravest men in the world. Their coats were black with soot, and still not one of them stepped back.\nHours later, the smoke over the water turned from black to gray, and then to white. Papa let out a long breath. "Baruch Hashem," he whispered. We walked home slowly, and I looked back at the stream again and again.' },
    c45_u56shoes: { title: 'The Shoe Store: One Scene, Two Narrators (a story)', text: 'NARRATOR 1: YANKEL, AGE 11\nSmoke was rolling down the street when Tatty unlocked our shoe store. "Fill your arms, Yankel!" he said. I grabbed four boxes and ran them out to Mr. Fox\'s wagon. Ash floated down like gray snow and stuck in my hair. I raced back for more. Twelve trips! I counted every one. A policeman shouted that the fire was two blocks away. My heart jumped, but I felt strong, like a real man helping his father. When the wagon pulled away, I sat up high on the boxes and waved at the orange sky.\nNARRATOR 2: TATTY, MR. BER FISHMAN\nSmoke was rolling down the street when I unlocked our shoe store. Twenty years of work stood on those shelves. I told Yankel to fill his arms, and I filled mine. Each time he ran back inside, I watched the door until he came out again. A policeman shouted that the fire was two blocks away. We had saved only a few boxes. The rest of the store would burn. When the wagon pulled away, my son sat up high on the boxes, waving. I looked back once at the shelves I had built. Then I thanked Hashem that my boy was safe beside me.' },
    c45_u56hose: { title: 'The Hydrant: One Scene, Two Narrators (a story)', text: 'NARRATOR 1: JOE MARKS, A MADE-UP FIREMAN FROM PHILADELPHIA\nOur train pulled into Baltimore on Sunday night. We had come about a hundred miles to help. We rolled our engine to a hydrant near the fire and hooked up the hose, or tried to. The end of our hose did not fit the hydrant. I tried it every way I knew. My hands were frozen, and the fire was one block away. A crowd was watching us, and I felt ashamed in front of them, though it was not our fault. Many cities made their hoses their own way.\nNARRATOR 2: SHIMMY, AGE 11\nI was standing at the corner with Zeidy when the Philadelphia firemen came. Their engine was shiny red, with brass that glowed like gold in the firelight. They rolled it right up to the hydrant. Then one fireman turned the hose end around and around. The end of their hose did not fit the hydrant. He shook his head and shouted something I could not hear. Zeidy said, "Come, Shimmy. They have work, and we are in the way." I walked home backward, watching that shiny engine until I could not see it.' },
    c45_u56three: { title: 'Three Accounts of the Great Fire', text: 'ACCOUNT 1: A FIREFIGHTER\'S ACCOUNT (by a made-up fireman from Washington)\nWe came by train on Sunday and rushed our engine to a hydrant. Our hose end would not fit it. We stood beside a full engine with no water while the building in front of us burned. Later we found a way to get water, and we fought all night beside the Baltimore men. My face stung from the heat, and my gloves froze to the hose.\nACCOUNT 2: A NEWSPAPER-STYLE REPORT (written for this lesson)\nBALTIMORE, Tuesday, February 9, 1904. The great fire that began on Sunday morning in the Hurst building is under control at last. It burned for about thirty hours. More than 1,500 buildings are gone, across about 140 acres of downtown. Firemen came by train from Washington, Philadelphia and New York. Dynamite was used to knock down buildings in the fire\'s path. The fire was stopped at the Jones Falls. No deaths from the fire itself have been reported.\nACCOUNT 3: A SHOPKEEPER\'S LETTER (by a made-up shopkeeper)\nMonday night. Dear Shimon, Baruch Hashem, we are all safe. My little seforim store is gone. Yossel and I carried out as many siddurim and Chumashim as we could hold, and the rest is ashes. Tomorrow I begin again. Tell Mama we will be at her table for Shabbos. Your brother, Mendel' },
    c45_u56memory: { title: 'Two Accounts: A Memory and a History', text: 'ACCOUNT A: A BOY\'S MEMORY (by a made-up man, written in 1964)\nI was ten when Baltimore burned. Sixty years later, I still remember my father\'s face. Our family lived above his bakery, near the Jones Falls. All Sunday night we packed: the challah pans, the big mixing bowl, Mama\'s candlesticks. On Monday the fire reached the other side of the Falls and stopped. Our bakery was saved. That Friday, my father baked challah for every family on our street whose home was full of smoke. I carried the loaves, one family at a time.\nACCOUNT B: A HISTORY-BOOK REPORT (written for this lesson)\nThe Great Baltimore Fire began on Sunday morning, February 7, 1904, and burned for about thirty hours. It destroyed more than 1,500 buildings across about 140 acres, almost the whole downtown. Strong winds carried the flames from block to block. On Monday, the fire was finally stopped at the Jones Falls. Afterward, the city rebuilt, and many streets were made wider.' },
    c45_u56blasts: { title: 'Two Accounts of the Dynamite', text: 'ACCOUNT 1: A FIREMAN\'S REPORT (by a made-up Baltimore fireman, for his chief)\nSir, here is what I saw on Sunday night at the fire line. Men set dynamite in buildings in the fire\'s path, to knock them down so the fire would have nothing to burn. Some blasts helped. Others threw burning pieces into the air and started new fires. My company stood close enough to feel each blast in our chests. I write this so that the next time, we will know what works and what does not.\nACCOUNT 2: A BOY\'S LETTER (by a made-up boy, Ezra, age 11, to his cousin)\nDear Cousin Mordy, You missed the most exciting night of my life! BOOM! All night we heard the dynamite. Each blast shook our windows like thunder, and the baby cried. Papa would not let me go near the fire, so I watched the glow from our back porch, far across the Jones Falls. Papa says the city will be built again, even better. I cannot wait to tell you everything when you come for Pesach! Your cousin, Ezra' },
    c45_u56worry: { title: 'Two Accounts: A Letter and a Faraway Report', text: 'ACCOUNT A: A LETTER (by a made-up tailor in Baltimore, to his mother)\nTuesday, February 9, 1904. Dear Mama, Please do not believe the scary stories in the New York papers. Yes, the fire burned the building right across the street from my shop. I stood at the window all Monday morning and felt its heat through the glass. But the wind turned, and my shop is standing. We are all well, Baruch Hashem, and the children ate a good supper tonight. Do not worry about us. Your loving son, Hershel\nACCOUNT B: A NEWSPAPER-STYLE REPORT FROM NEW YORK (written for this lesson)\nNEW YORK, Monday, February 8, 1904. News of a terrible fire in Baltimore is reaching this city by telegraph. Reports say that block after block of downtown Baltimore has burned since Sunday morning. Fire engines and firemen from New York were sent south by train to help. Nobody here yet knows how many buildings are lost, or when the flames will stop.' }
