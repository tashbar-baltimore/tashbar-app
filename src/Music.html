function muClubStep(c,P,N,i,t){ const bar=P.bars[i>>4]; if(!bar) return; const s=i&15, sec=bar.sec, b=bar.b, L=bar.len, st=P.spb/4, G=P.mood, dnb=G==='dnb';

 if(dnb){ if((s===4||s===12)&&!brk&&!gap&&!(intro&&b<8)&&!(build&&b>=L-2)) muSnare(c,t,.42,N.out); }

  else { if(s%4===2&&!(intro&&b<4)&&!brk) muNz(c,t,N.out,'highpass',7000,.7,.14,.2); if((drop||groove||(G==='techno'&&brk))&&s%2===1) muNz(c,t,N.out,'highpass',8500,.7,.06,.04); } }

    fl.frequency.setValueAtTime(300,t); fl.frequency.exponentialRampToValueAtTime(300+(a.acc?2600:1300)*P.cut*sweep,t+.012); fl.frequency.exponentialRampToValueAtTime(260,t+st*1.2); } }
  else if(G==='trance'||(G==='edm'&&!drop)){ if(s%4!==0) muVoice(c,'sawtooth',muHz(rootB),t,st*.8,.17,N.duck,850*sweep,2); }
  else if(G==='edm'){ if(s===0||s===8){ muVoice(c,'square',muHz(rootB),t,P.spb*1.9,.13,N.duck,700); muVoice(c,'sine',muHz(rootB-12),t,P.spb*1.9,.22,N.duck); } }
  else if(s===0||s===8){ [-12,12].forEach(dt=>muVoice(c,'sawtooth',muHz(rootB),t,P.spb*1.9,.1,N.duck,520,3,.01,dt)); muVoice(c,'sine',muHz(rootB-12),t,P.spb*1.9,.22,N.duck,0,0,.01); } }

  else if(P.stab[s]&&s%2===0) tones.slice(0,3).forEach(d=>muVoice(c,'sawtooth',muHz(muDeg(P,d,0)),t,st*.8,.045,[N.duck,N.send],1600,4)); } }
