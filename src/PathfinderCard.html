<script>
/* PathfinderCard.html: added after QuestPage by sgQuest_ (StaffGrid.js), like SignOutBar. Reads QuestPage's A (view), SRV (token) and
   window.TL_MAP (his own map, which rides with sign-in).
   HEAD OF SCHOOL DECISION 2026-11-20 ("split the Pathfinder"): the big Pathfinder is no longer pushed. No full-screen
   "First, your Pathfinder" gate, no invitation, no corner card, and no server call on the way home (the card used to ask
   pfHello, pfGateInfo and msAppUrl at every sign-in). The hidden .pf-card element stays so older add-ons that look for it still work.
   In its place: the 🎫 LEVEL CHECK. Before his FIRST lesson in a Math or Reading level that has a check he has not taken
   (TL_MAP.lc from KidMap.js: 1 = waiting), startMission opens a short check of that level. The server (PathfinderLevel.js) picks and
   scores the questions and saves his 🎫 Level Pass (any score): lessons at that level then pay in full, and skills he got right are
   skipped. No money for the check itself. "Not now" plays the lesson as before. */
(function(){
 window.pfCardInfo_=function(){ return { show:false, confirm:[] }; };   /* PathfinderGo waits for this; nothing to wait for now */
 var card=document.createElement('div'); card.className='pf-card'; card.style.display='none'; document.body.appendChild(card);
 function tok(){ try{ return typeof SRV!=='undefined'&&SRV&&SRV.token; }catch(e){ return null; } }
 function map(){ try{ var m=window.TL_MAP; return m&&m.lc&&typeof A!=='undefined'&&A&&A.st&&m.sid===A.st.id?m:null; }catch(e){ return null; } }
 function subjOf(id){ var m=/^(MATH|READ)\.[A-Z]+\.L(\d\d)\./.exec(String(id||'')); return m?{k:m[1],L:Number(m[2])}:null; }
 var NAME={MATH:'Math',READ:'Reading'};
 /* also used by GameMap.html: {k, L, min} when this lesson's level still waits for its check, else null */
 window.tlLevelCheckFor=function(id){ var s=subjOf(id), m=map(); if(!s||!m||!m.lc[s.k]) return null; return m.lc[s.k][s.L-1]===1?{k:s.k,L:s.L,min:(m.lc.min&&m.lc.min[s.k]&&m.lc.min[s.k][s.L-1])||3}:null; };
 var CF=null;
 function esc(x){ return String(x==null?'':x).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
 function hush(){ try{ speechSynthesis.cancel(); }catch(e){} }
 function cfClose(){ hush(); var o=document.getElementById('pf-cf'); if(o) o.remove(); }
 function cfBox(h){ cfClose(); var o=document.createElement('div'); o.id='pf-cf'; o.setAttribute('role','dialog'); o.setAttribute('aria-modal','true'); o.setAttribute('aria-label','Level check'); o.innerHTML='<div class="bx">'+h+'</div>'; document.body.appendChild(o); var f=o.querySelector('input,button.go'); if(f) try{ f.focus(); }catch(e){} return o; }
 function say(t){ try{ var s=window.speechSynthesis; if(!s) return; s.cancel(); var u=new SpeechSynthesisUtterance(String(t||'')); u.rate=.95; s.speak(u); }catch(e){} }
 function cfQ(){ var it=CF.d.items[CF.i], n=CF.d.items.length, h='<div class="pg">🎫 '+esc(NAME[CF.k])+' Level '+CF.L+' · Question '+(CF.i+1)+' of '+n+'</div><div class="bar"><i style="width:'+Math.round(100*CF.i/n)+'%"></i></div>';
  if(it.passage) h+='<div class="ps"><b>'+esc(it.passage.title)+'</b><div>'+esc(it.passage.text).replace(/\n/g,'<br>')+'</div></div>';
  h+='<h2>'+esc(it.stem)+'</h2>'+(it.show?'<p class="sh">'+esc(it.show)+'</p>':'');
  if(it.fmt==='CHOICE') h+='<div class="chs">'+it.choices.map(function(c){ return '<button type="button" class="ch" data-v="'+esc(c)+'">'+esc(c)+'</button>'; }).join('')+'</div>';
  else h+='<input id="pf-cf-in" autocomplete="off" aria-label="Your answer"'+(it.rem?' placeholder="like 12 R3"':'')+'><button type="button" class="go" data-v="">Next →</button>';
  h+='<div class="how"><b>How to do it</b>'+(it.fmt==='CHOICE'?'Read it, then tap the answer you think is right.':'Work it out, type your answer, then tap Next.'+(it.rem?' Write a remainder with R, like 12 R3.':''))+' Not sure? Make your best guess. A skill you get right is a skill you skip!</div>';
  h+='<button type="button" class="rd" data-rd="1">🔊 Read it to me</button>';
  var o=cfBox(h);
  o.querySelectorAll('button[data-v]').forEach(function(b){ b.onclick=function(){ var v=it.fmt==='CHOICE'?b.getAttribute('data-v'):(document.getElementById('pf-cf-in')||{}).value||''; cfNext(v); }; });
  o.querySelector('[data-rd]').onclick=function(){ say([it.say||it.stem,it.show||''].concat(it.fmt==='CHOICE'?it.choices:[]).join('. ')); };
  var inp=document.getElementById('pf-cf-in'); if(inp) inp.onkeydown=function(e){ if(e.key==='Enter') cfNext(inp.value||''); }; }
 function knownList(r){ if(!r.known||!r.known.length) return '<p>No skips this time: every skill at this level is waiting for you. That is fine. Now you get full pay while you learn them!</p>';
  return '<p><b>You already know '+r.known.length+' skill'+(r.known.length>1?'s':'')+'. You skip '+(r.known.length>1?'them':'it')+':</b></p><ul class="kn">'+r.known.map(function(id,i){ var n=(r.names||[])[i]||[id,'']; return '<li>⏭ <b>'+esc(n[0])+'</b>'+(n[1]?' · '+esc(n[1]):'')+'</li>'; }).join('')+'</ul>'; }
 function cfNext(v){ CF.ans.push({item:CF.d.items[CF.i].id,value:v}); CF.i++; if(CF.i<CF.d.items.length) return cfQ();
  cfBox('<div class="ic">🎫</div><h2>Checking…</h2>');
  var c=CF; google.script.run.withSuccessHandler(function(r){
    var m=map(); if(m){ m.lc[c.k][c.L-1]=2; (r.known||[]).forEach(function(id){ if(m.lc.known.indexOf(id)<0) m.lc.known.push(id); }); }
    var skip=(r.known||[]).indexOf(c.id)>=0;
    var o=cfBox('<div class="ic">🎫</div><div class="pass">LEVEL PASS · '+esc(NAME[c.k]).toUpperCase()+' LEVEL '+c.L+'</div><h2>'+r.right+' of '+r.of+' right</h2>'+knownList(r)+'<p class="full">💵 Full pay is unlocked for every lesson at '+esc(NAME[c.k])+' Level '+c.L+'.</p><button type="button" class="go">'+(skip?'Back to my map':'Go to my lesson →')+'</button>');
    o.querySelector('button.go').onclick=function(){ cfClose(); CF=null; if(!skip){ c.go(); return; }
      try{ if(window.GM){ GM.sig=''; GM.world=''; } A.view='hub'; render(); }catch(e){}
      try{ var t=tok(); if(t) google.script.run.withSuccessHandler(function(nm){ if(nm&&A&&A.st&&nm.sid===A.st.id){ window.TL_MAP=nm; try{ if(window.GM&&GM.sync){ GM.sig=''; GM.sync(); } }catch(e){} } }).kmMyMap(t); }catch(e){} }; })
   .withFailureHandler(function(e){ var o=cfBox('<div class="ic">🙂</div><h2>We could not save the check</h2><p>'+esc(e&&e.message||'Try again in a minute.')+'</p><button type="button" class="go">Go to my lesson →</button>'); o.querySelector('button.go').onclick=function(){ cfClose(); CF=null; c.go(); }; })
   .pfLevelCheckSave(tok(),c.k,c.L,c.ans); }
 var _sm=window.startMission;
 if(typeof _sm==='function') window.startMission=function(c,id,kind){ var self=this, args=arguments, go=function(){ return _sm.apply(self,args); };
  try{ var lc=window.tlLevelCheckFor(id); if(CF||!lc||(kind&&kind!=='skill')||!tok()) return go();
   CF={k:lc.k,L:lc.L,id:id,go:go,i:0,ans:[],d:null}; cfBox('<div class="ic">🎫</div><h2>One moment…</h2>');
   google.script.run.withSuccessHandler(function(d){ var m=map();
     if(!d||d.done||!d.items||!d.items.length){ if(m&&d&&d.done) m.lc[lc.k][lc.L-1]=2; else if(m&&!d) m.lc[lc.k][lc.L-1]=0; CF=null; cfClose(); return go(); }
     CF.d=d; var o=cfBox('<div class="ic">🎫</div><div class="pass">LEVEL CHECK · '+esc(NAME[lc.k]).toUpperCase()+' LEVEL '+lc.L+'</div><h2>New level! Quick check first</h2><p>'+d.items.length+' questions · about '+(d.minutes||lc.min)+' minutes. Just do your best.</p><ul class="kn"><li>⏭ A skill you get right is a skill you <b>skip</b>.</li><li>💵 Taking it unlocks <b>full pay</b> at this level.</li></ul><button type="button" class="go">Start the check →</button><button type="button" class="later">Not now (lessons here pay 25¢ of each $1)</button>');
     o.querySelector('button.go').onclick=cfQ; o.querySelector('button.later').onclick=function(){ CF=null; cfClose(); go(); }; })
    .withFailureHandler(function(){ CF=null; cfClose(); go(); }).pfLevelCheckStart(tok(),lc.k,lc.L);
  }catch(e){ CF=null; cfClose(); return go(); } };
 var cs=document.createElement('style');
 cs.textContent='#pf-cf{position:fixed;inset:0;z-index:2147483600;background:rgba(20,18,50,.62);display:grid;place-items:center;padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch}#pf-cf .bx{background:#fff;border-radius:28px;max-width:640px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:22px;box-sizing:border-box;text-align:center;border:4px solid #FFD23F;box-shadow:0 10px 0 #7C4DFF;font:600 18px system-ui,"Segoe UI",sans-serif;color:#1E1B4B}#pf-cf .ic{font-size:56px;line-height:1}#pf-cf .pass{display:inline-block;margin:8px 0 2px;background:linear-gradient(135deg,#7C4DFF,#FF2E63);color:#fff;border-radius:999px;padding:5px 14px;font-weight:900;font-size:13px;letter-spacing:.12em}#pf-cf h2{margin:8px 0 12px;font-size:24px}#pf-cf .pg{color:#5d6779;font-size:14px;font-weight:800}#pf-cf .bar{height:8px;border-radius:99px;background:#EEF;margin:6px 0 10px;overflow:hidden}#pf-cf .bar i{display:block;height:100%;background:#7C4DFF}#pf-cf .ps{text-align:left;background:#fbfaf6;border-radius:14px;padding:12px;margin:10px 0;font-weight:500;line-height:1.5;max-height:40vh;overflow:auto}#pf-cf .sh{font-size:22px}#pf-cf ul.kn{text-align:left;margin:8px 0 12px;padding-left:4px;list-style:none}#pf-cf ul.kn li{margin:6px 0}#pf-cf .full{background:#ECFDF5;border-radius:14px;padding:10px;font-weight:800;color:#065F46}#pf-cf button{display:block;width:100%;border:0;border-radius:16px;min-height:56px;font-weight:800;font-size:19px;font-family:inherit;cursor:pointer;margin-top:10px;background:#F4F4F5;color:#1E1B4B}#pf-cf button.go{background:#4F46E5;color:#fff}#pf-cf button.later{background:transparent;border:2px solid #d4d4dc;font-size:15px;min-height:48px}#pf-cf button.rd{font-size:15px;min-height:46px;background:#FFF7D6}#pf-cf .how{text-align:left;background:#EEF2FF;border-radius:14px;padding:10px 12px;margin-top:12px;font-size:15px;font-weight:600}#pf-cf .how b{display:block;font-weight:900;color:#4F46E5}#pf-cf input{width:100%;box-sizing:border-box;font-weight:700;font-size:24px;font-family:inherit;padding:12px;border-radius:14px;border:2px solid #c9c9d6;text-align:center}';
 document.head.appendChild(cs);
})();
</script>
