<script>
/* CoreUnits.html: UNIT CHECKS (the "boss level") AND TEST-OUT (the pre-check), Core Growth job T, T-5, 2026-11-24. Server: src/CoreChecks.js.
   A job lists its units in its data file:  TLCORE.units.add({ id:'C45.U01', title:'Main Idea Detectives', c:'READ', grade:5,
     skills:['READ.COMP.L06.13', ...] (the unit's small skills, in order), review:['READ.COMP.L05.01', ...] (2-3 from earlier units), n:10 });
   PRE-CHECK (before the unit): one question per skill. A skill he answers right is "shown": the server takes it out of his path, so he never
     sits through what he already knows. One pre-check per unit.
   UNIT CHECK (after the unit): 8-12 questions mixing every skill of the unit plus 2-3 review skills, one try each, a dramatic entrance and a
     win moment. 8 of 10 (80%) passes and opens the next unit. A miss names the skill, and "Practice" opens exactly that small lesson.
   Questions come from each skill's own check questions (tap kinds: choose one, put in order), or from unit.items (Activity Kit tap kinds).
   No money, no mastery: a pre-check or unit check pays nothing (an HoS DECISION would be needed). Buttons only from window.TLK.
   Switch window.CU_LIVE: 'test' (TEST- boys only, the default), 'on', 'off'. With it on, starting the first lesson of a unit offers the
   pre-check, and starting a unit whose earlier unit is finished but not passed opens that unit's check first.
   No double slash in this file. */
(function () {

  function mastered(id) { try { var s = A.st.skills[id]; return !!(s && s.m); } catch (e) { return false; } }

  U.err = function (u) {

    if (!u.title) return 'title is needed';

      .filter(function (x) { return !used[x.q]; });
    var it = ok[0]; if (!it) return null; used[it.q] = 1;
    return it.t === 'mc' ? { skill: id, kind: 'mc', q: it.q, p: it.p || '', o: it.shown.slice(), a: it.correct } : { skill: id, kind: 'order', q: it.q, p: it.p || '', tiles: it.tiles.slice() };
  }
  function build(u, mode) {

    var per = function (id) { var own = extra.filter(function (x) { return x.skill === id && !x.__used; })[0]; if (own) { own.__used = 1; return { skill: id, kind: 'kit', act: own }; } return fromSkill(id, used); };
    u.skills.forEach(function (id) { var q = per(id); if (q) out.push(q); });

      var n = u.n || 10, i = 0; while (out.length < Math.min(n, 12) && i < u.skills.length * 2) { var q2 = per(u.skills[i % u.skills.length]); if (q2) out.push(q2); i++; }

  }

  /* ---------- screens ---------- */
  function top() { var k = K(); return '<div class="cu-top">' + (k ? k.x('data-cu="exit"', 'tl', 'Leave the check') : '') + '<div class="cu-ttl">' + esc(S.u.title) + '</div><div>' + (S.view === 'q' ? pill('prog', (S.i + 1) + ' of ' + S.qs.length) : '') + '</div></div>'; }

      '<p class="cu-lead">' + (pre ? 'One question for each lesson in this unit. Every one you get right is a lesson you skip.' : 'Every skill from this unit, plus a few from before. One try each. You are ready.') + '</p>' +

  }

      '<div class="cu-pool">' + st.pool.map(function (t, j) { return st.used[j] ? '' : qb(t, 'data-cu="tile" data-k="' + j + '"' + (a ? ' disabled' : ''), 'cu-tile'); }).join('') + '</div>'; }

    var miss = S.missed;
    return '<div class="cu-end"><div class="cu-big" aria-hidden="true">💪</div><h2>Almost there!</h2><div>' + pill('prog', right + ' of ' + n + ' right') + pill('now', 'Win with ' + Math.ceil(n * 0.8)) + '</div>' +
      '<p>Practice ' + (miss.length === 1 ? 'this lesson' : 'these lessons') + ', then try the boss again:</p><div class="cu-practice">' +
      miss.map(function (id, k) { return btn(k === 0 ? 'main' : 'quiet', 'Practice: ' + nameOf(id), 'data-cu="practice" data-k="' + esc(id) + '"'); }).join('') + '</div></div>';
  }
  function draw() {
    var el = S.el; el.className = S.mode === 'pre' ? 'pre' : 'boss';

    if (S.view === 'q' && S.qs[S.i].kind === 'kit' && W.OBK) try { OBK.mount(el.querySelector('.cu-kit'), S.qs[S.i].act, S.ks, {}); } catch (e) {}

  }
  function answer(ok, pick) {

    draw();
  }
  function setQ(i) { S.i = i; S.view = 'q'; var q = S.qs[i]; if (q.kind === 'order') { var pool = shuf(q.tiles); if (pool.every(function (x, k) { return x === q.tiles[k]; })) pool.reverse(); S.ord = { pool: pool, slots: q.tiles.map(function () { return -1; }), used: {} }; }
    if (q.kind === 'kit' && W.OBK) S.ks = OBK.init(q.act, {}); draw(); }
  function finishCheck() {

    if (S.mode === 'pre') { var sk = {}; S.qs.forEach(function (q, k) { if (S.ans[k] && S.ans[k].ok) sk[q.skill] = 1; });

  }
  function close(res) { if (!S) return; var r = S.resolve, el = S.el, out = res || { mode: S.mode, unit: S.u.id, done: S.view === 'end', passed: !!S.passed, shown: S.shown || [], missed: S.missed || [] }; S = null; document.removeEventListener('keydown', onKey, true); if (el) el.remove(); r(out); }

    if (a === 'check') { if (t.getAttribute('aria-disabled') === 'true') return; var qq = S.qs[S.i]; return answer(qq.tiles.every(function (x, n) { return S.ord.pool[S.ord.slots[n]] === x; })); }

  }
  function worldOf(id) { var p = id.split('.')[0]; try { return WORLD[p] ? p : (/^(LANG|WRIT)$/.test(p) && WORLD.WRIT ? 'WRIT' : 'READ'); } catch (e) { return 'READ'; } }
  function practice(id) { try { (U.origStart || W.startMission)(worldOf(id), id, 'skill'); } catch (e) {} }

    return new Promise(function (resolve) {

  /* ---------- the hooks: before a lesson starts (TEST- boys only while CU_LIVE is 'test') ---------- */
  function hook() {

  }

    '#cun{position:fixed;inset:0;z-index:2147483500;display:flex;flex-direction:column;background:#F4F1EA;color:#1F2633;font:17px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}#cun *{box-sizing:border-box}' +
