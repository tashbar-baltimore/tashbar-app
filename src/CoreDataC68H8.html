  BITE['READ.COMP.L08.19'] = {"band": "M68", "pic": "📖", "today": "Read a long story on your own, page by page", "why": "Long stories reward the reader who keeps track. A few small moves keep you from getting lost, so the ending hits you the way it should.", "ready": [{"q": "You just read a page. Which shows you understood it?", "o": ["you can say it in one sentence", "you read it fast", "you liked the picture"], "a": "you can say it in one sentence"}], "bridge": "READ.LIT.L08.02", "bridgeName": "Whose View?", "watch": {"q": "Page 1 of The Clock on Lombard Street", "m": {"type": "scene", "e": "🕰️", "t": "\"Zeidy, why did the big clock stop?\" Zeidy took the loupe out of his eye. \"It did not stop by itself,\" he said. \"I stopped it.\""}, "steps": [{"t": "Before reading: preview the title and pictures, then ask a question. Mine: will the clock on Lombard Street be saved?"}, {"t": "After page 1, sum it up in one sentence: the shop must close by March 31, and the stopped clock will be taken down."}, {"t": "Open questions: why did Zeidy stop it himself? Later, page 2 adds one: what is in the locked drawer? I keep them on a list."}, {"t": "Lost? On page 3 I could not say why the wheel matters. I reread: it is the heart of the clock, with three teeth missing. Now I can go on."}, {"t": "Teach it back: tell your chavrusa the four moves: ask, sum up each page, keep open questions, reread when lost."}], "a": "Ask, sum up, track open questions, reread when lost."}, "oops": {"q": "\"Page 2 is slow, so I'll skip to the end.\"", "wrong": "Fine: the end is what matters", "right": "No: you will miss the choice that drives the story", "why": "On page 2 Shuey takes the motor home. Skip it and the ending makes no sense."}, "ways": ["worked example", "read the whole story", "sum up each page", "open questions", "Mistake Detective", "teach it back"], "done": "You can read a long story on your own and keep track of it!", "board": {"one": "Four moves for a long story: ask a question befo   if (window.TLCORE && TLCORE.units && TLCORE.units.add) TLCORE.units.add({"id": "C68.U77", "title": "Two Authors, One Bay", "c": "READ", "grade": 7, "skills": ["READ.COMP.L08.01", "READ.COMP.L08.16", "READ.COMP.L08.17", "READ.COMP.L08.18"], "review": ["READ.COMP.L08.12", "READ.COMP.L08.14"], "n": 10, "pre": "lessons", "items": [{"type": "evidence", "skill": "READ.COMP.L08.01", "q": "Both texts report that the bay grass grew this year. Text 1, a state report: \"Grass beds grew again this year, mostly in the shallow lower bay. Cleaner water lets sunlight reach the bottom.\" Text 2, a letter to the Beacon from Mr. Dahan, who runs a fishing boat: \"Sure, there is more grass by my island. But up the rivers the water is still brown, and nothing grows there.\" How does each writer shape the same news?", "p": ["Text 2 says the grass did not really grow this year, so the two writers disagree about the facts.", "Text 1 leads with the gain and its cause; Text 2 grants the gain, then turns to the rivers.", "Text 1 gives only facts and Text 2 gives only feelings, so Text 2 adds nothing to the news."], "a": 1, "look": "what each writer puts first, and what he adds", "how": "Same news. What does each writer put first? What does the second one add?"}, {"type": "cloze", "skill": "READ.COMP.L08.16", "t": "Text 1: \"The bay grass grew this year because the water is cleaner.\" Text 2: \"Yes, there is more grass, but that is because last summer was cool, and grass grows best in a cool year.\" On the grass, the two writers ___.", "o": ["agree it grew but explain it two ways", "disagree about whether the grass grew at all", "agree that it grew and agree on the reason"], "a": "agree it grew but explain it two ways", "how": "First ask: do both say the grass grew? Then ask: do they give the same reason?"}, {"type": "evidence", "skill": "READ.COMP.L08.17", "q": "Question: why might crabbers near the lower-bay islands find more young crabs this year? Source 1, a state survey: \"Grass beds grew this year, mostly in the shallow lower bay.\" Source 2, a crabbing guide: \"Young crabs hide in grass beds while their shells are soft.\" Which answer puts the sources together?", "p": ["The guide says young crabs hide in grass while their shells are soft, so the guide alone answers it.", "The survey says more grass grew, so crabbers will find more young crabs anywhere they set pots.", "The survey says grass grew there; the guide says young crabs hide in grass. So: more hiding places."], "a": 2, "look": "an answer that joins a piece from each source", "how": "What does each source add? Which answer joins the two pieces to answer the question?"}, {"type": "evidence", "skill": "READ.COMP.L08.18", "q": "Chart: Underwater grass in the bay (thousands of acres). 2019: 67 · 2020: 62 · 2021: 68 · 2022: 76. Article: \"Cleaner water lets sunlight reach the grass.\" Which sentence reads the chart and the article correctly?", "p": ["The grass dipped in 2020, then grew two years running; the article gives one reason.", "The grass grew every year from 2019 to 2022, and the article explains why it kept growing.", "The chart shows a dip and then a rise, and it proves that cleaner water made the grass grow."], "a": 0, "look": "the trend from the chart, the reason from the text", "how": "Read the title. Compare each number with the next. Which one shows, and which one tells why?"}, {"type": "evidence", "skill": "READ.COMP.L08.01", "q": "Both texts report that forty oyster farms now line Back Creek. Text 1, the county paper: \"Forty oyster farms now line Back Creek, bringing jobs and cleaner water.\" Text 2, a letter from a neighbor: \"Forty farms now crowd Back Creek. My boys can no longer row to the island.\" How do they shape the same fact?", "p": ["They disagree about the facts: Text 1 says forty farms, and Text 2 says there are too many.", "Both writers are glad about the farms; Text 2 only adds a small story about his boys.", "Text 1 makes the farms a gain for the town; Text 2 llen too.", "The chart counts crabs caught, not crabs living; fewer boats could explain the drop.", "The chart shows a rise in 2022, so the writer read the trend backwards."], "a": 1, "look": "what the chart counts, and what the article adds", "how": "Read the title: crabs living, or crabs caught? What does the article say changed?"}]});

t out to check it again.", "Then, over the roar of the water, they heard someone calling for help from the roof next door."], "a": 2, "look": "a page that stops at the worst moment", "how": "Is time running out? Is an answer saved for later? Or does it stop right at the danger?"}, {"type": "evidence", "skill": "READ.LIT.L08.12", "q": "Theme: \"Courage means acting while you are still afraid.\" Which three proofs show it best across the whole book?", "p": ["Ch. 1: Dov hides from the thunder. Ch. 4: shaking, he carries the Levys' baby up. Ch. 8: he admits he was afraid.", "Ch. 8: the fire chief praises Dov. Ch. 8: the Levys thank him. Ch. 8: Dov says he was scared the whole time.", "Ch. 1: the rain starts and the creek rises. Ch. 4: the water reaches the Levys' stairs. Ch. 8: the river goes down."], "a": 0, "look": "proofs about the theme, from the beginning, middle and end", "how": "Are the proofs about the theme, and are they spread across the book?"}, {"type": "evidence", "skill": "READ.COMP.L08.19", "q": "Before reading a long chapter called \"The Night the Bridge Fell\", Elisha reads its first line: \"At nine o'clock the Levys' truck was still on the far side of the creek.\" Which question will pull him through the chapter best?", "p": ["What time was it when the chapter started?", "Will the Levys get across before the bridge falls?", "Why are bridges built over creeks and rivers?"], "a": 1, "look": "a question the chapter itself will answer", "how": "Is it answered already? Will this chapter answer it? Use the title and the first line."}, {"type": "evidence", "skill": "READ.LIT.L08.10", "q": "At the start, Ezra laughs at the old mill. After the flood, he spends every Sunday helping to rebuild it. What link is this?", "p": ["the plot changes the character", "the setting shapes the problem", "a choice changes the plot"], "a": 0, "look": "who he is at the start, and at the end", "how": "Compare Ezra at the start and at the end. What changed him?"}, {"type": "evidence", "skill": "READ.LIT.L08.11", "q": "Why does the author end chapter 5 with \"Then the phone rang. It was the fire hall.\" and not tell the call until chapter 6?", "p": ["to show that time is running out before a deadline", "to make the reader turn the page to find out", "to slow the story down with a quiet, calm moment"], "a": 1, "look": "what the held-back call does to the reader", "how": "What do you want to do when the chapter stops there?"}, {"type": "evidence", "skill": "READ.LIT.L08.12", "q": "Which is a theme statement, not a summary or a rule?", "p": ["The Katz family loses its house in the flood.", "Losing a house does not mean losing a home.", "Always help your neighbors when a flood comes."], "a": 1, "look": "a full sentence about life that the story shows", "how": "A summary tells what happened. An order is a rule. A theme is what the story shows about life."}]});
