    'READ.LIT.L07.02':{name:"Theme, Topic or Moral?", teach:[{"q": "\"Trees.\" Is that a topic, a theme or a moral?", "o": ["a topic", "a theme", "a moral"], "how": "A topic is a word or a short phrase: what the story is about."}, {"q": "\"What we build today can shelter people long after us.\" What is this?", "o": ["a theme", "a topic", "a moral"], "how": "A theme is a full sentence about life that the story shows."}, {"q": "\"Always plant for your children!\" What is this?", "o": ["a moral", "a theme", "a topic"], "how": "A moral tells you what to do. It is a command, often stated outright, like at the end of a fable."}], practice:[{"t": "sort", "q": "Sort each one: topic, theme or moral?", "bins": [{"id": "t", "label": "Topic"}, {"id": "h", "label": "Theme"}, {"id": "m", "label": "Moral"}], "items": [{"label": "giving", "bin": "t"}, {"label": "Quiet giving can change a whole community.", "bin": "h"}, {"label": "Give, and do not ask for thanks!", "bin": "m"}, {"label": "a tailor in Baltimore", "bin": "t"}, {"label": "Real kindness does not need an audience.", "bin": "h"}, {"label": "Never brag about your tzedakah.", "bin": "m"}], "h": "Word = topic. Sentence about life = theme. Command = moral."}, {"t": "pairs", "q": "Match each kind to its test.", "pairs": [["topic", "a word or short phrase"], ["theme", "a full sentence about life"], ["moral", "a command: do this, do not do that"]], "h": "Ask: word, sentence, or command?"}, {"t": "order", "q": "Put the steps for finding a theme in order.", "tiles": ["Name the topic in a word or two.", "Ask what the character learns or shows.", "Write it as a sentence about anyone, not just him.", "Check it fits the whole story, start to end."], "h": "What do you need before you can say what the story teaches?"}, {"t": "spotall", "q": "Tap every sentence that is a THEME (not a topic or a moral).", "cells": [{"label": "Patience finds what speed misses.", "ok": true}, {"label": "Always be patient!", "ok": false}, {"label": "A friend nce about life that fits the whole passage?"}, {"q": "Passage: \"Every year, Moishe's father planted a tree for each of his children. Moishe grumbled that he would be grown up before his little tree gave any shade. This summer, on the hottest day, Moishe sat in the cool shade of the big oak his grandfather had planted for his father. He did not grumble.\" \"Always plant trees for your children!\" What is this?", "o": ["a moral: a command", "a theme: a sentence about life", "a topic: what the passage is about"], "h": "Is it telling you what to DO?"}], re:[{"q": "\"Courage.\" Topic, theme or moral?", "o": ["topic", "theme", "moral"], "h": "One word."}, {"q": "\"Never give up!\" Topic, theme or moral?", "o": ["moral", "theme", "topic"], "h": "It is a command."}, {"q": "\"Small acts of courage can change a life.\" Topic, theme or moral?", "o": ["theme", "moral", "topic"], "h": "A sentence about life."}]},
    'READ.LIT.L07.03':{name:"Plot in Episodes", teach:[{"q": "What is an episode in a story?", "o": ["one scene or event that moves the plot forward", "the title of a chapter", "a list of the characters"], "how": "A long plot is built from episodes, one after another, like links in a chain."}, {"q": "What does a SETBACK episode do to the plot?", "o": ["it raises the stakes and the tension", "it ends the story", "it introduces the setting"], "how": "When things go wrong, the reader worries more. That is rising tension."}, {"q": "How are the episodes of a good plot connected?", "o": ["each one causes or changes the next", "they could go in any order", "they all happen on the same day"], "how": "Ask: because of this, what happens next?"}], practice:[{"t": "order", "q": "Put the episodes of \"The Last Daf\" in order.", "tiles": ["Rafi promises a siyum by the shloshim.", "The flu puts him behind.", "He skims and remembers nothing.", "He helps Ezra and slows down.", "He tells his father the truth."], "h": "Ask of each event: what made this happen?"}, {"t": "pairs", "q": "Match each episode to the job it does in the plot.", "pairs": [["Rafi makes a promise", "sets up the goal"], ["the flu", "a setback that raises the stakes"], ["Ezra asks for help", "a new choice"], ["he tells his father", "turns toward the ending"]], "h": "What does each episode change?"}, {"t": "sort", "q": "Does each episode raise the tension, or let it out?", "bins": [{"id": "u", "label": "Raises tension"}, {"id": "d", "label": "Lets it out"}], "items": [{"label": "He falls three dapim behind.", "bin": "u"}, {"label": "He finishes the masechta months later.", "bin": "d"}, {"label": "He cannot remember what he skimmed.", "bin": "u"}, {"label": "The old man shakes his hand.", "bin": "d"}], "h": "Do you worry more, or relax?"}, {"t": "spotall", "q": "Tap every episode CAUSED by the episode before it.", "cells": [{"label": "He skims, because he is behind.", "ok": true}, {"label": "Saba drinks mint tea.", "ok": false}, {"label": "He slows down, because teaching Ezra helps him understand.", "ok": true}, {"label": "It is Thursday.", "ok": false}], "h": "Look for \"because\": one episode leads to the next."}, {"t": "sort", "q": "Mistake Detective: is each one an episode, or not?", "bins": [{"id": "e", "label": "An episode"}, {"id": "n", "label": "Not an episode"}], "items": [{"label": "Rafi gets the flu for six days.", "bin": "e"}, {"label": "Rafi is a good boy.", "bin": "n"}, {"label": "Ezra asks Rafi for help.", "bin": "e"}, {"label": "The kitchen has a table.", "bin": "n"}], "h": "An episode is something that HAPPENS and moves the plot."}, {"t": "pairs", "q": "Match each plot part to its place.", "pairs": [["rising action", "the episodes that build tension"], ["climax", "the moment the conflict turns"], ["resolution", "how it ends up"]], "h": "Build, turn, end."}], check:[{"q": "Episodes: (1) Dov promises to run the Chanukah food drive by himself. (2) On the first day, only three cans come in. (3) He asks his whole class to help, and each boy brings a friend. (4) By the last night, the boxes fill the hallway. Which episode is the turning point?", "o": ["episode 3: he asks his class to help", "episode 2: only three cans come in", "episode 4: the boxes fill the hallway"], "h": "Where does the plot change direction?"}, {"q": "Episodes: (1) Dov promises to run the Chanukah food drive by himself. (2) On the first day, only three cans come in. (3) He asks his whole class to help, and each boy brings a friend. (4) By the last night, the boxes fill the hallway. What job does episode 2 do in the plot?", "o": ["a setback that raises the stakes", "the ending that wraps the whole story up", "it tells where the story happens"], "h": "Does it make you worry more, or less?"}, {"q": "Episodes: (1) Dov promises to run the Chanukah food drive by himself. (2) On the first day, only three cans come in. (3) He asks his whole class to help, and each boy brings a friend. (4) By the last night, the boxes fill the hallway. Why does episode 4 happen?", "o": ["the class joined in, in episode 3", "Dov kept working alone, night after night, all week", "it was Chanukah"], "h": "Which earlier episode CAUSED the full hallway?"}], re:[{"q": "A scene that moves the plot forward is...", "o": ["an episode", "a setting", "a topic"], "h": "It happens, and things change."}, {"q": "A setback in the middle of a story...", "o": ["raises the tension", "ends the story", "names the characters"], "h": "Things go wrong. You worry."}, {"q": "In a strong plot, each episode...", "o": ["leads to the next", "could go anywhere", "repeats the last one"], "h": "Because of this, then that."}]},
    'READ.LIT.L07.04':{name:"How a Character Changes", teach:[{"q": "How do you show that a character changed?", "o": ["give a \"before\" proof and an \"after\" proof", "say he is nicer now", "name his best friend"], "how": "Change needs two proofs: how he was, and how he is."}, {"q": "What usually CAUSES a character to change?", "o": ["an event he must respond to", "the title of the story", "nothing; characters change by luck"], "how": "Look for the trigger: something happens, and he must respond."}, {"q": "Why look at how a character RESPONDS to trouble?", "o": ["his response shows who he is and who he is becoming", "it is the shortest part", "it tells the setting"], "how": "Trouble is a test. His answer to it shows his character."}], practice:[{"t": "order", "q": "Put Eli's change in order.", "tiles": ["Eli wants to name a suspect fast.", "He learns the keys do not fit.", "He sees the harm a guess can do.", "He argues against his own guess."], "h": "What was Eli like at the start? What changed him?"}, {"t": "sort", "q": "Rafi in \"The Last Daf\": before or after?", "bins": [{"id": "b", "label": "Before"}, {"id": "a", "label": "After"}], "items": [{"label": "He skims and skips the Rashi.", "bin": "b"}, {"label": "He writes a question in the margin.", "bin": "a"}, {"label": "He counts dapim on a card.", "bin": "b"}, {"label": "He spends a morning on three lines.", "bin": "a"}], "h": "Rushing, or learning slowly?"}, {"t": "pairs", "q": "Match each trigger to the response it brings.", "pairs": [["the flu puts Rafi behind", "he starts to skim"], ["Ezra asks for help", "he sits down and teaches"], ["his father asks a question", "he sees what he really gained"]], "h": "Something happens; how does he answer it?"}, {"t": "spotall", "q": "Tap every line that shows a CHANGE, not just a feeling.", "cells": [{"label": "Eli argues against his own guess.", "ok": true}, {"label": "Eli feels sad for a minute.", "ok": false}, {"label": "Rafi reads the Rashi he used to skip.", "ok": true}, {"label": "Rafi is tired.", "ok": false}], "h": "A change shows in what he DOES differently."}, {"t": "sort", "q": "Mistake Detective: Yanky says these prove a change. Right or wrong?", "bins": [{"id": "r", "label": "Proves a change"}, {"id": "w", "label": "Does not prove it"}], "items": [{"label": "Before: he skims. After: he reads every Rashi.", "bin": "r"}, {"label": "He has a Gemara.", "bin": "w"}, {"label": "Before: he names a suspect. After: \"we still can't print it.\"", "bin": "r"}, {"label": "He was upset one day.", "bin": "w"}], "h": "A change needs a before AND an after."}, {"t": "pairs", "q": "Match each part of a character change to its meaning.", "pairs": [["before", "how he acts at the start"], ["trigger", "the event that tests him"], ["after", "how he acts now"]], "h": "Start, test, now."}], check:[{"q": "Passage: \"When Yehuda's family moved, he refused to unpack. 'We will not stay,' he said, and he kept his books in the box. Then the boy next door, Nachum, asked him to be his chavrusa. By Purim, Yehuda's books were on the shelf, and he was the one showing a new boy around the yeshiva.\" What is the trigger for Yehuda's change?", "o": ["Nachum asks him to be his chavrusa", "his family moves to a new city far away from his old yeshiva", "it is Purim"], "h": "Which event pushes him to act differently?"}, {"q": "Passage: \"When Yehuda's family moved, he refused to unpack. 'We will not stay,' he said, and he kept his books in the box. Then the boy next door, Nachum, asked him to be his chavrusa. By Purim, Yehuda's books were on the shelf, and he was the one showing a new boy around the yeshiva.\" Which detail proves the change best?", "o": ["he shows a new boy around the yeshiva", "he kept all of his books packed in the box for weeks", "he said, \"We will not stay\""], "h": "Which detail shows the AFTER?"}, {"q": "Passage: \"When Yehuda's family moved, he refused to unpack. 'We will not stay,' he said, and he kept his books in the box. Then the boy next door, Nachum, asked him to be his chavrusa. By Purim, Yehuda's books were on the shelf, and he was the one showing a new boy around the yeshiva.\" How does Yehuda change?", "o": ["from refusing to belong to helping others belong", "from a boy who loves his old city to a boy who forgets it completely", "he does not change at all"], "h": "Compare the start and the end."}], re:[{"q": "To prove a character changed, you need...", "o": ["a before proof and an after proof", "one adjective", "the title"], "h": "Two proofs."}, {"q": "The event that pushes a character to change is the...", "o": ["trigger", "setting", "topic"], "h": "It tests him."}, {"q": "\"He felt bad for a minute.\" Does that prove a change?", "o": ["no: a feeling is not a change", "yes: he felt something", "yes: it is in the story"], "h": "A change shows in what he does."}]},
    'READ.LIT.L07.05':{name:"Just the Story", teach:[{"q": "What belongs in an objective summary of a story?", "o": ["the main character, the problem, the key events and the ending", "your favorite part", "every small detail"], "how": "A summary is short and fair: only the big pieces, in order."}, {"q": "What does \"objective\" mean?", "o": ["no opinions, just what happened", "very long", "full of feelings"], "how": "Objective: anyone who read it would agree with every sentence."}, {"q": "\"The ending was amazing.\" Does this belong in a summary?", "o": ["no: it is an opinion", "yes: it is true", "yes: summaries need feelings"], "how": "Amazing, boring, best: these are opinion words. Leave them out."}], practice:[{"t": "sort", "q": "Summary of \"The Last Daf\": belongs, or leave it out?", "bins": [{"id": "b", "label": "Belongs"}, {"id": "o", "label": "Leave it out"}], "items": [{"label": "Rafi promises to finish the masechta by the shloshim.", "bin": "b"}, {"label": "Saba's tea was mint.", "bin": "o"}, {"label": "He falls behind and tries to skim.", "bin": "b"}, {"label": "It is the best story in the book.", "bin": "o"}], "h": "Big events stay. Small details and opinions go."}, {"t": "order", "q": "Put a summary of \"The Last Daf\" in order.", "tiles": ["Rafi promises a siyum for his grandfather's shloshim.", "Sick and behind, he skims and learns nothing.", "Helping a younger boy, he learns to go slowly.", "He says over one piece he truly understands."], "h": "Which sentence could only come after another one?"}, {"t": "spotall", "q": "Tap every opinion word that does not belong in a summary.", "cells": [{"label": "amazing", "ok": true}, {"label": "promised", "ok": false}, {"label": "boring", "ok": true}, {"label": "helped", "ok": false}], "h": "Which words tell what YOU think?"}, {"t": "pairs", "q": "Match each summary problem to its fix.", "pairs": [["\"I loved the ending.\"", "take out your opinion"], ["every detail of the flu", "keep only the big event"], ["the ending told first", "put events in order"]], "h": "Opinion, too much, or wrong order?"}, {"t": "sort", "q": "Mistake Detective: is each summary sentence objective?", "bins": [{"id": "y", "label": "Objective"}, {"id": "n", "label": "Not objective"}], "items": [{"label": "Benny finds a peppermint wrapper.", "bin": "y"}, {"label": "Eli foolishly blames Mr. Dahan.", "bin": "n"}, {"label": "The boys learn who sent the envelopes.", "bin": "y"}, {"label": "Reb Feivel is the sweetest old man ever.", "bin": "n"}], "h": "Would every reader agree with it?"}, {"t": "pairs", "q": "Match each summary part to its question.", "pairs": [["who", "the main character"], ["problem", "what goes wrong"], ["end", "how it turns out"]], "h": "Who, problem, end."}], check:[{"q": "Passage: \"Chaim promised his mother he would watch his little brother at the park. A soccer game started, and Chaim joined it. When he looked up, Shloimy was gone. Chaim searched the whole park, his heart pounding, and found him at last by the duck pond, feeding bread to the ducks. Chaim held his hand the whole way home and told his mother everything.\" Which is the best objective summary?", "o": ["Chaim loses his brother while playing soccer, finds him by the pond, and tells his mother the truth.", "Chaim is careless and should have known better than to play soccer when he was supposed to be watching Shloimy.", "The ducks eat bread."], "h": "Which one is short, in order, and has no opinion?"}, {"q": "Passage: \"Chaim promised his mother he would watch his little brother at the park. A soccer game started, and Chaim joined it. When he looked up, Shloimy was gone. Chaim searched the whole park, his heart pounding, and found him at last by the duck pond, feeding bread to the ducks. Chaim held his hand the whole way home and told his mother everything.\" Which sentence is NOT objective?", "o": ["Chaim was a terrible big brother.", "Chaim joined a soccer game.", "Chaim found Shloimy by the duck pond."], "h": "Which one judges Chaim?"}, {"q": "Passage: \"Chaim promised his mother he would watch his little brother at the park. A soccer game started, and Chaim joined it. When he looked up, Shloimy was gone. Chaim searched the whole park, his heart pounding, and found him at last by the duck pond, feeding bread to the ducks. Chaim held his hand the whole way home and told his mother everything.\" Which detail should a summary leave out?", "o": ["Shloimy was feeding bread to the ducks.", "Chaim promised his mother he would watch his little brother.", "Chaim told his mother everything."], "h": "Which detail does not change the story?"}], re:[{"q": "An objective summary has...", "o": ["no opinions", "many feelings", "every detail"], "h": "Just what happened."}, {"q": "\"The story was boring.\" In a summary, this is...", "o": ["an opinion to leave out", "a key event", "the ending"], "h": "Is it what happened, or what you think?"}, {"q": "A summary tells events...", "o": ["in order", "backwards", "in any order"], "h": "First to last."}]},

  var TEACH = {
    "READ.LIT.L07.02":{"hook": "A word, a lesson, or a command? Strong readers know the difference.", "big": "Three things get mixed up all the time. The topic is what a story is about, in a word or short phrase: giving, a tailor, a locked room. The theme is a full sentence about life that the story shows, true for anyone, not only the characters: \"Real kindness does not need an audience.\" A moral is a command, usually said outright, often at the end of a fable: \"Never brag about your tzedakah!\" A story can have a moral, but most good stories leave their theme unsaid and let you find it. When you write a theme, make it a sentence about people in general, and check that it fits the whole story.", "intro": ["Name the topic in a word or two.", "Ask what the character learns or shows.", "Write it as a sentence about anyone.", "Check it fits the whole story."], "ex": [{"q": "Rabbi Rosen's words about Mr. Mandel", "steps": ["Topic: a secret donor.", "Theme: quiet giving can keep a whole community alive.", "Moral he gives: \"We will thank him... quietly.\""], "a": "Topic, theme and moral: three different things."}, {"q": "\"Never skim a Gemara!\"", "steps": ["It tells you what to do.", "So it is a moral, not a theme."], "a": "a moral"}], "oops": {"q": "\"Honesty\" is the theme of the story. Right?", "wrong": "Yes, honesty is the theme", "right": "No, \"honesty\" is a topic", "why": "One word is a topic. Make it a sentence about life: \"Honesty builds trust that lasts.\""}, "idea": ["Topic: a word. Theme: a sentence about life. Moral: a command."], "try": {"q": "Which one is a theme?", "o": ["Kindness can travel far beyond the giver.", "kindness"], "a": "Kindness can travel far beyond the giver.", "steps": ["Is it a full sentence?", "Is it about life?"]}},
    "READ.LIT.L07.03":{"hook": "A long story is not one big event. It is a chain, link by link.", "big": "Authors build a plot out of episodes: scenes in which something happens and something changes. In \"The Last Daf\", Rafi makes a promise, gets the flu, skims, helps Ezra, slows down, falls behind and tells his father the truth. Each episode has a job. Some set up the goal, some are setbacks that raise the stakes, some give the character a new choice, and one turns the story toward its ending. A strong reader can say not only what happened, but what each episode DOES, and how each one causes the next.", "intro": ["List the episodes in order.", "For each one, ask: what changed?", "Name its job: goal, setback, choice, turn or ending.", "Ask: because of this, what happens next?"], "ex": [{"q": "The flu in \"The Last Daf\"", "steps": ["What changed? He fell behind.", "Job: a setback that raises the stakes.", "What does it cause? He starts to skim."], "a": "A setback that causes the next episode."}, {"q": "Ezra asks for help", "steps": ["What changed? Rafi must choose: his goal, or a younger boy.", "Job: a new choice.", "It causes him to slow down."], "a": "A choice that turns him."}], "oops": {"q": "\"Rafi is a good boy\" is an episode. Right?", "wrong": "Yes, it is part of the story", "right": "No, nothing happens in it", "why": "An episode is something that happens and changes things. A description is not an episode."}, "idea": ["A plot is a chain: each episode causes or changes the next."], "try": {"q": "What do you ask to link two episodes?", "o": ["Because of this, what happens next?", "Which one is longer?"], "a": "Because of this, what happens next?", "steps": ["Take one episode.", "Find what it causes."]}},
    "READ.LIT.L07.04":{"hook": "The best characters do not stay the same. Can you prove how they changed?", "big": "A character shows who he is by how he responds to trouble. Something happens (the trigger), he must answer it, and over the story he may change. To prove a change, you need two proofs from the text: one that shows how he was before, and one that shows how he is after. A feeling for a minute is not a change; a change shows in what he does differently. Eli starts by writing a man's name next to \"stole\" and ends by arguing against his own guess. Rafi starts by skimming and ends by reading every Rashi. Each change also points to the story's theme.", "intro": ["Find how he acts at the start (before).", "Find the event that tests him (trigger).", "Find how he responds.", "Find how he acts at the end (after), and prove both."], "ex": [{"q": "Eli in the Beacon mystery", "steps": ["Before: he names Mr. Dahan.", "Trigger: the keys do not fit.", "Response: \"What if I had said it out loud?\"", "After: \"And we still can't print it.\""], "a": "From quick to careful."}, {"q": "Rafi in \"The Last Daf\"", "steps": ["Before: he skims.", "Trigger: Ezra asks for help.", "After: he reads the Rashi and writes a question."], "a": "From racing to learning slowly."}], "oops": {"q": "\"Eli felt bad, so he changed.\" Is that proof?", "wrong": "Yes, feeling bad is a change", "right": "No, show what he does differently", "why": "A change needs a before and an after in what he does."}, "idea": ["Before, trigger, response, after: that is how a character changes."], "try": {"q": "What two proofs show a change?", "o": ["a before proof and an after proof", "two proofs from the same page"], "a": "a before proof and an after proof", "steps": ["Find the start.", "Find the end."]}},
    "READ.LIT.L07.05":{"hook": "Tell a whole book in four sentences, and leave yourself out of it.", "big": "An objective summary tells the main character, the problem, the key events in order, and the ending, in a few sentences. It leaves out small details (what color the tea was) and it leaves out your opinions (amazing, boring, foolish). Every sentence should be one that anyone who read the story would agree with. The hard part is choosing: in a long book like The Beacon and the Locked Archive, you keep only the episodes that change the story, and you say them fairly, even about a character you did not like.", "intro": ["Name the main character and his problem.", "Pick the key events that change the story.", "Tell them in order, then the ending.", "Cross out every opinion word."], "ex": [{"q": "Summarize \"The Last Daf\" in one sentence.", "steps": ["Who: Rafi. Problem: a promise to finish a masechta.", "Key change: helping Ezra teaches him to go slowly.", "End: he says over one piece he truly understands."], "a": "Rafi tries to finish a masechta for his grandfather, falls behind, and learns that understanding matters more than speed."}, {"q": "\"Eli foolishly blames Mr. Dahan.\"", "steps": ["\"foolishly\" is a judgment.", "Objective: \"Eli suspects Mr. Dahan.\""], "a": "Remove the opinion word."}], "oops": {"q": "Is \"Benny bravely shows his clue\" objective?", "wrong": "Yes, it is what happened", "right": "No: \"bravely\" is the writer's opinion", "why": "Objective: \"Benny shows his clue.\" Leave the judging to the reader."}, "idea": ["A fair summary: big events, in order, no opinions."], "try": {"q": "Which word must come out of a summary?", "o": ["amazing", "found"], "a": "amazing", "steps": ["Is it an opinion?", "Then take it out."]}},
'READ.LIT.L07.34':{ hook:'The thief turns out to be a rescuer. Now the real secret begins.',
      big:'In chapter 5 the first mystery is solved and a deeper one opens. The boys learn why Reb Feivel took the papers: a leak was ruining them, and he was drying and typing every page as a gift. His goal changes how we see everything before: they were not chasing a thief, they were chasing a man quietly saving something. Then the ledger shows that in 1953 the yeshiva almost closed, and a friend nobody knew sent eighteen dollars every week. Watch how a character\'s goal and a new conflict move the plot, and notice the theme the author begins to build: quiet kindness can save more than anyone knows.',
      intro:['Find what the character wants.','Find what stands in his way.','See how his answer changes the story so far.','Notice the theme the chapter begins to show.'],
      ex:[{q:'Reb Feivel took the papers in secret.', steps:['His goal: save the papers as a gift.','His problem: the papers were rotting.','His answer: dry them and type every word.'], a:'He is a rescuer, not a thief.'},
          {q:'The ledger: "From a friend. Eighteen dollars."', steps:['New conflict: who was the friend?','The plot turns from "who took the papers" to "who saved the yeshiva".'], a:'A new, bigger mystery.'}],
      oops:{ q:'"Reb Feivel took the papers, so he is a thief." Right?', wrong:'Yes: he took them in secret', right:'No: he took them to save them', why:'Ask why a character acts, not only what he does.' },
      idea:['A character\'s goal can turn a whole story around.'],
      'try':{ q:'What should you ask about a character who acts in secret?', o:['why he did it','how old he is','what he ate'], a:'why he did it', steps:['Find his goal.','Then judge his act.'] } },
    'READ.LIT.L07.35':{ hook:'Ten old envelopes, a number on each, and nothing else. Or is there?',
      big:'In chapter 6 the boys start from almost nothing: plain envelopes with a pencilled 18. Benny looks where nobody else looked and finds printing on a flap; Gavriel finds a crossed seven. Eli glues three guesses into a front-page story, and Akiva stops him: if one guess is wrong, real families are hurt. The chapter shows the book\'s conflict again, speed against truth, and builds its theme: a good guess still has to be proved. Notice the difference between the topic (old envelopes), the theme (a careful search beats a quick guess) and a moral someone might shout (always check twice!).',
      intro:['Name the topic in a word or phrase.','Find the conflict in the chapter.','Say the theme as a sentence about life.','Do not mix it up with a command.'],
      ex:[{q:'Eli: "Mandel... Tailoring... Lombard Street. Done."', steps:['Three guesses, each from torn letters.','Akiva: "three guesses glued together."','The conflict again: speed or truth.'], a:'A guess must still be proved.'},
          {q:'Topic or theme: "old envelopes"?', steps:['It is a phrase, not a sentence.','So it is a topic.'], a:'topic'}],
      oops:{ q:'"Always check twice!" Is that the theme of chapter 6?', wrong:'Yes, it is the lesson', right:'No, it is a moral: a command', why:'A theme is a sentence about life, like "A careful search beats a quick guess."' },
      idea:['Topic: a phrase. Theme: a sentence about life. Moral: a command.'],
      'try':{ q:'Which one is a theme?', o:['A careful search beats a quick guess.','old envelopes','Check twice!'], a:'A careful search beats a quick guess.', steps:['Is it a sentence?','Is it about life?'] } },
    'READ.LIT.L07.36':{ hook:'One yellow receipt in a box from 1954 solves a mystery from 1953.',
      big:'Chapter 7 is the climax of the second mystery. Yoni\'s Zaidy remembers Mr. Mandel, a tailor who lost everyone and lived on bread and tea. Gavriel finds the shop in an old city directory. Eli, who once wanted to print a guess, now argues against his own guess: there could be two tailors who crossed their sevens. Then Benny finds the proof: a receipt with the same printing, paper and handwriting as the envelopes. Watch two things at once: how the plot reaches its turning point, and how Eli has changed.',
      intro:['Find the episode where the big question is answered.','Ask what makes the proof strong.','Compare a character now with how he was before.','Name the change, and prove it.'],
      ex:[{q:'The receipt next to the envelope', steps:['Same printed shop name.','Same crossed sevens.','Same pencil, pressed hard.'], a:'Three matches: proof.'},
          {q:'Eli: "And we still can\'t print it."', steps:['Before: he wanted to print three guesses.','Now: he doubts a guess that fits.'], a:'Eli has changed from fast to careful.'}],
      oops:{ q:'"Mandel was kind, so he must be the friend." Is that proof?', wrong:'Yes, kind people give', right:'No, it is still a guess', why:'Proof is something you can hold next to the envelope and see match.' },
      idea:['A climax answers the big question. A changed character shows it in what he does.'],
      'try':{ q:'What makes proof strong?', o:['it matches in more than one way','it is very old','it is about a kind man'], a:'it matches in more than one way', steps:['Count the matches.','More than one is strong.'] } },
    'READ.LIT.L07.37':{ hook:'A book ends twice: once when the problem is solved, and once when you see what it meant.',
      big:'Chapter 8 resolves the book. The Beacon\'s special issue tells Mr. Mandel\'s story; Rabbi Rosen starts a fund with no name on it, to give the way Mr. Mandel gave; Reb Feivel gives his father\'s key to Benny. The characters\' changes are complete: Eli learned that being right beats being fast, and Benny went from a silent new boy to the lead writer. Benny\'s four drafts teach one more thing: a story is about a person, not only about clues. The last line on the whiteboard gives the book\'s theme in a sentence: a guess is a question; treat it like one.',
      intro:['Find how the main problem is resolved.','See how each main character has changed.','State the theme in one sentence.','Sum up the book fairly, without opinions.'],
      ex:[{q:'"We will never put a name on it."', steps:['Mr. Mandel gave without his name.','The yeshiva gives the same way.'], a:'The resolution honors him in his own way.'},
          {q:'Benny\'s fourth draft', steps:['Drafts 1-3: the mystery, then too sad, then better.','Draft 4 starts with the man himself.'], a:'A story is about a person.'}],
      oops:{ q:'"Chapter 8 is the best chapter." Does that belong in a summary?', wrong:'Yes, it is true', right:'No, it is an opinion', why:'A summary tells what happened, not what you think of it.' },
      idea:['The ending shows what the whole book meant.'],
      'try':{ q:'What is the resolution of a story?', o:['how the main problem ends','the first clue','the title'], a:'how the main problem ends', steps:['Find the main problem.','Find how it ends.'] } }

  var HOWTO = {
    "READ.LIT.L07.02":{"s": "One word or short phrase? That is the topic.\nA full sentence about life? That is a theme.\nA command (do, never, always)? That is a moral.", "q": {"Passage: \"Every year, Moishe's father planted a tree for each of his children. Moishe grumbled that he would be grown up before his little tree gave any shade. This summer, on the hottest day, Moishe sat in the cool shade of the big oak his grandfather had planted for his father. He did not grumble.\" What is the TOPIC of this passage?": "A topic is a word or a short phrase.", "Passage: \"Every year, Moishe's father planted a tree for each of his children. Moishe grumbled that he would be grown up before his little tree gave any shade. This summer, on the hottest day, Moishe sat in the cool shade of the big oak his grandfather had planted for his father. He did not grumble.\" Which is the best THEME?": "Which is a sentence about life that fits the whole passage?", "Passage: \"Every year, Moishe's father planted a tree for each of his children. Moishe grumbled that he would be grown up before his little tree gave any shade. This summer, on the hottest day, Moishe sat in the cool shade of the big oak his grandfather had planted for his father. He did not grumble.\" \"Always plant trees for your children!\" What is this?": "Is it telling you what to DO?", "\"Courage.\" Topic, theme or moral?": "One word.", "\"Never give up!\" Topic, theme or moral?": "It is a command.", "\"Small acts of courage can change a life.\" Topic, theme or moral?": "A sentence about life."}},
    "READ.LIT.L07.03":{"s": "List the episodes in order.\nAsk: what changed in this episode, and what is its job?\nLink them: because of this, what happens next?", "q": {"Episodes: (1) Dov promises to run the Chanukah food drive by himself. (2) On the first day, only three cans come in. (3) He asks his whole class to help, and each boy brings a friend. (4) By the last night, the boxes fill the hallway. Which episode is the turning point?": "Where does the plot change direction?", "Episodes: (1) Dov promises to run the Chanukah food drive by himself. (2) On the first day, only three cans come in. (3) He asks his whole class to help, and each boy brings a friend. (4) By the last night, the boxes fill the hallway. What job does episode 2 do in the plot?": "Does it make you worry more, or less?", "Episodes: (1) Dov promises to run the Chanukah food drive by himself. (2) On the first day, only three cans come in. (3) He asks his whole class to help, and each boy brings a friend. (4) By the last night, the boxes fill the hallway. Why does episode 4 happen?": "Which earlier episode CAUSED the full hallway?", "A scene that moves the plot forward is...": "It happens, and things change.", "A setback in the middle of a story...": "Things go wrong. You worry.", "In a strong plot, each episode...": "Because of this, then that."}},
    "READ.LIT.L07.04":{"s": "Find how he acts at the start, and at the end.\nFind the event that tested him.\nProve the change with a before and an after.", "q": {"Passage: \"When Yehuda's family moved, he refused to unpack. 'We will not stay,' he said, and he kept his books in the box. Then the boy next door, Nachum, asked him to be his chavrusa. By Purim, Yehuda's books were on the shelf, and he was the one showing a new boy around the yeshiva.\" What is the trigger for Yehuda's change?": "Which event pushes him to act differently?", "Passage: \"When Yehuda's family moved, he refused to unpack. 'We will not stay,' he said, and he kept his books in the box. Then the boy next door, Nachum, asked him to be his chavrusa. By Purim, Yehuda's books were on the shelf, and he was the one showing a new boy around the yeshiva.\" Which detail proves the change best?": "Which detail shows the AFTER?", "Passage: \"When Yehuda's family moved, he refused to unpack. 'We will not stay,' he said, and he kept his books in the box. Then the boy next door, Nachum, asked him to be his chavrusa. By Purim, Yehuda's books were on the shelf, and he was the one showing a new boy around the yeshiva.\" How does Yehuda change?": "Compare the start and the end.", "To prove a character changed, you need...": "Two proofs.", "The event that pushes a character to change is the...": "It tests him.", "\"He felt bad for a minute.\" Does that prove a change?": "A change shows in what he does."}},
    "READ.LIT.L07.05":{"s": "Who is the main character, and what is his problem?\nKeep only the events that change the story, in order.\nCross out every opinion word.", "q": {"Passage: \"Chaim promised his mother he would watch his little brother at the park. A soccer game started, and Chaim joined it. When he looked up, Shloimy was gone. Chaim searched the whole park, his heart pounding, and found him at last by the duck pond, feeding bread to the ducks. Chaim held his hand the whole way home and told his mother everything.\" Which is the best objective summary?": "Which one is short, in order, and has no opinion?", "Passage: \"Chaim promised his mother he would watch his little brother at the park. A soccer game started, and Chaim joined it. When he looked up, Shloimy was gone. Chaim searched the whole park, his heart pounding, and found him at last by the duck pond, feeding bread to the ducks. Chaim held his hand the whole way home and told his mother everything.\" Which sentence is NOT objective?": "Which one judges Chaim?", "Passage: \"Chaim promised his mother he would watch his little brother at the park. A soccer game started, and Chaim joined it. When he looked up, Shloimy was gone. Chaim searched the whole park, his heart pounding, and found him at last by the duck pond, feeding bread to the ducks. Chaim held his hand the whole way home and told his mother everything.\" Which detail should a summary leave out?": "Which detail does not change the story?", "An objective summary has...": "Just what happened.", "\"The story was boring.\" In a summary, this is...": "Is it what happened, or what you think?", "A summary tells events...": "First to last."}},
