    'READ.VOC.L03.02':{name:"Same Root, Same Family", teach:[{"how": "A word family is a group of words built on one root word. Happy, unhappy, happiness and happily all have the root happy inside. (In happiness, the y turns to i.)", "q": "Which word is in the happy family?", "o": ["happiness", "hammer", "puppy"]}, {"how": "Find the root inside a long word. Cover the part before it and the part after it: helper → help, helpful → help, careless → care.", "q": "What is the root in \"helpful\"?", "o": ["help", "ful", "he"]}, {"how": "Know the root, and you can figure out the new word. A helper is someone who helps. A baker is someone who bakes. Kindness is being kind.", "q": "Use the root. What is a \"painter\"?", "o": ["someone who paints", "a can of paint", "a kind of brush"]}], practice:[{"t": "sort", "q": "Sort each word into its family.", "bins": [{"id": "0", "label": "help family"}, {"id": "1", "label": "happy family"}, {"id": "2", "label": "kind family"}], "items": [{"label": "helper", "bin": "0"}, {"label": "helpful", "bin": "0"}, {"label": "unhappy", "bin": "1"}, {"label": "happiness", "bin": "1"}, {"label": "kindness", "bin": "2"}, {"label": "unkind", "bin": "2"}], "h": "Find the root word inside."}, {"t": "pairs", "q": "Match each word to its root.", "pairs": [["helper", "help"], ["happiness", "happy"], ["careless", "care"], ["player", "play"]], "h": "Cover the beginning and ending parts."}, {"t": "sort", "q": "Mistake Detective: is the root right, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "The root of \"player\" is play.", "bin": "0"}, {"label": "The root of \"player\" is lay.", "bin": "1"}, {"label": "The root of \"kindness\" is kind.", "bin": "0"}, {"label": "The root of \"kindness\" is ness.", "bin": "1"}], "h": "The root is a whole word you know."}, {"t": "spotall", "q": "\"The helper was helpful and full of kindness.\" Tap every word in the help family.", "cells": [{"label": "helper",     'READ.VOC.L03.03':{name:"Two Words, One Word", teach:[{"how": "A compound word is two small words joined into one word: snow + man = snowman, lunch + box = lunchbox, sun + flower = sunflower, bird + house = birdhouse.", "q": "Which is a compound word?", "o": ["bedtime", "running", "happy"]}, {"how": "To find the meaning, read the two small words. A lunchbox is a box for your lunch. A bookshelf is a shelf for books. Bedtime is the time to go to bed.", "q": "What is a bookshelf?", "o": ["a shelf for books", "a book about shelves", "a very tall book"]}, {"how": "Most of the time, the last word tells what it is, and the first word tells which kind. A raincoat is a kind of coat. A sunflower is a kind of flower.", "q": "A raincoat is a kind of...", "o": ["coat", "rain", "cloud"]}], practice:[{"t": "pairs", "q": "Match the two halves of each compound word.", "pairs": [["snow", "man"], ["lunch", "box"], ["sun", "flower"], ["tooth", "brush"]], "h": "Say them together. Is it a real word?"}, {"t": "sort", "q": "Sort: is it two small words joined?", "bins": [{"id": "0", "label": "Compound word"}, {"id": "1", "label": "Not a compound word"}], "items": [{"label": "sunflower", "bin": "0"}, {"label": "bedtime", "bin": "0"}, {"label": "lunchbox", "bin": "0"}, {"label": "happy", "bin": "1"}, {"label": "jumping", "bin": "1"}, {"label": "table", "bin": "1"}], "h": "Look for two whole words inside."}, {"t": "sort", "q": "Mistake Detective: is the meaning right, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "A lunchbox is a box for lunch.", "bin": "0"}, {"label": "A lunchbox is a lunch for a box.", "bin": "1"}, {"label": "A raincoat is a coat for rain.", "bin": "0"}, {"label": "A raincoat is rain on a coat.", "bin": "1"}], "h": "The last word tells what it is."}, {"t": "spotall", "q": "\"After supper, Naftali put his toothbrush and his notebook in his backpack.\" Tap every compound word.", "cells": [{"label": "toothbrush", "ok": true}, {"label": "notebook", "ok": true}, {"label": "backpack", "ok": true}, {"label": "supper", "ok": false}, {"label": "put", "ok": false}], "h": "Find two whole words joined together."}, {"t": "order", "q": "Build the sentence.", "tiles": ["Avi", "packed", "his lunchbox", "for school."], "h": "Who? Did what? What? Where to?"}, {"t": "pairs", "q": "Match each compound word to its meaning.", "pairs": [["lunchbox", "a box for lunch"], ["raincoat", "a coat for rain"], ["bookshelf", "a shelf for books"], ["birdhouse", "a house for birds"]], "h": "Read the two small words."}], check:[{"q": "\"Naftali wrote the list in his notebook.\" A notebook is a kind of...", "o": ["book", "note", "pen"]}, {"q": "Tatty built a birdhouse for the yard. Which two words make \"birdhouse\"?", "o": ["bird + house", "bir + dhouse", "birdh + ouse"]}, {"q": "Dovid rang the doorbell. In \"doorbell,\" which word tells what it is?", "o": ["the last word", "the first word", "neither word"]}], re:[{"q": "What is a lunchbox?", "o": ["a box for lunch", "a kind of lunch", "a time for lunch"], "h": "The last word tells what it is: a box."}, {"q": "Which is a compound word?", "o": ["snowman", "snowing", "snowy"], "h": "Find two whole words inside."}, {"q": "Which two words make \"backpack\"?", "o": ["back + pack", "backp + ack", "bac + kpack"], "h": "Find two whole words."}]},
    'READ.VOC.L03.04':{name:"Clue Spotter", teach:[{"how": "Stuck on a word? Do not skip it. Read the whole sentence. Find the clue words. Guess the meaning. Check: does it make sense?", "q": "\"Moshe was famished, so he ate two bowls of soup.\" Which words are the clue?", "o": ["he ate two bowls of soup", "Moshe was", "so"]}, {"how": "A same-meaning clue tells you the meaning in easier words, often right after a comma: \"The box was enormous, very big.\" Enormous means very big. \"The rope was mighty, very strong.\" Mighty means strong.", "q": "\"The soup was scalding, very hot.\" What does scalding mean?", "o": ["very hot", "very cold", "very salty"]}, {"how": "An opposite clue often uses but. The other part means the opposite: \"Chaim was timid, but his brother was brave.\" Timid means not brave.", "q": "\"Dovid was calm, but Eli was upset.\" What does calm mean?", "o": ["not upset", "very upset", "very loud"]}], practice:[{"t": "pairs", "q": "Match each hard word to its meaning.", "pairs": [["enormous", "very big"], ["scalding", "very hot"], ["timid", "not brave"], ["famished", "very hungry"]], "h": "Use the clues from the sentences."}, {"t": "sort", "q": "Sort: what kind of clue does each sentence have?", "bins": [{"id": "0", "label": "Same-meaning clue"}, {"id": "1", "label": "Opposite clue"}], "items": [{"label": "The room was tidy, neat and clean.", "bin": "0"}, {"label": "The room was tidy, but the yard was messy.", "bin": "1"}, {"label": "Avi was weary, very tired.", "bin": "0"}, {"label": "Avi was weary, but Dovid was full of energy.", "bin": "1"}], "h": "But often shows an opposite clue."}, {"t": "sort", "q": "Mistake Detective: is the meaning right, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "\"The lake was frigid, icy cold.\" Frigid means icy cold.", "bin": "0"}, {"label": "\"The lake was frigid, icy cold.\" Frigid means warm.", "bin": "1"}, {"label": "\"Eli was glum, but Shimon was cheerful.\" Glum means sad.", "bin": "0"}, {"label": "\"Eli was glum, but Shimon was cheerful.\" Glum means happy.", "bin": "1"}], "h": "Find the clue. Does the meaning make sense?"}, {"t": "spotall", "q": "\"The puppy was tiny, so small it fit in Zeidy's hand.\" Tap every clue for tiny.", "cells": [{"label": "so small", "ok": true}, {"label": "it fit in Zeidy's hand", "ok": true}, {"label": "The puppy", "ok": false}, {"label": "was", "ok": false}], "h": "Clue words help you see what tiny means."}, {"t": "order", "q": "Put the clue steps in order.", "tiles": ["Read the whole sentence.", "Find the clue words.", "Guess the meaning.", "Check: does it make sense?"], "h": "Read, find, guess, check."}, {"t": "pairs", "q": "Match each word to its clue meaning.", "pairs": [["weary", "very tired"], ["glum", "sad"], ["frigid", "icy cold"], ["tidy", "neat and clean"]], "h": "Think of the sentences where you met them."}], check:[{"q": "\"Yaakov was exhausted, very, very tired, after the long trip.\" What kind of clue helps you?", "o": ["a same-meaning clue", "an opposite clue", "no clue at all"]}, {"q": "\"Bubby's cookies were delicious, but the old crackers were yucky.\" What kind of clue helps with delicious?", "o": ["an opposite clue", "a same-meaning clue", "no clue at all"]}, {"q": "\"The sukkah was sturdy, so strong that the wind could not shake it.\" What does sturdy mean?", "o": ["strong", "weak", "tiny"]}], re:[{"q": "\"The mouse was tiny, very small.\" What does tiny mean?", "o": ["very small", "very big", "very fast"], "h": "The clue is right after the comma."}, {"q": "\"Avi was calm, but Moshe was nervous.\" Which word shows an opposite clue?", "o": ["but", "was", "Avi"], "h": "But tells you the next part means the other way."}, {"q": "What do you do first when you meet a hard word?", "o": ["Read the whole sentence.", "Skip the page.", "Close the book."], "h": "The clues are in the sentence."}]},
    'READ.VOC.L03.05':{name:"Look It Up", teach:[{"how": "A glossary is a small word list in the back of a book. It tells what the hard words in that book mean.", "q": "Where do you find a glossary?", "o": ["in the back of the book", "on the cover", "in the middle of a story"]}, {"how": "Glossary words go in ABC order. Look at the first letter: apple comes before barn, and barn comes before cow. Same first letter? Look at the second letter: bake comes before bird.", "q": "Which word comes first in ABC order?", "o": ["harvest", "orchard", "seed"]}, {"how": "Each entry has the word, then its meaning. Read the meaning, then put it back in the sentence to check. Example: \"orchard: a field of fruit trees.\"", "q": "Glossary: \"harvest: to pick crops when they are ready.\" What does harvest mean?", "o": ["to pick crops when they are ready", "a kind of tree", "a field of fruit trees"]}], practice:[{"t": "order", "q": "Put the glossary words in ABC order.", "tiles": ["crop", "harvest", "orchard", "soil"], "h": "Look at the first letter of each word."}, {"t": "pairs", "q": "Read the glossary. Match each word to its meaning.", "pairs": [["orchard", "a field of fruit trees"], ["soil", "the dirt plants grow in"], ["sprout", "to start to grow"], ["crop", "a plant grown for food"]], "h": "Find the word, then read what comes after it."}, {"t": "sort", "q": "Mistake Detective: is the list in ABC order?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "apple, barn, cow", "bin": "0"}, {"label": "cow, barn, apple", "bin": "1"}, {"label": "bake, bird, bus", "bin": "0"}, {"label": "bird, bake, bus", "bin": "1"}], "h": "First letter first. Same first letter? Check the second letter."}, {"t": "spotall", "q": "Tap every word that comes before \"melon\" in ABC order.", "cells": [{"label": "apple", "ok": true}, {"label": "grape", "ok": true}, {"label": "kiwi", "ok": true}, {"label": "plum", "ok": false}, {"label": "tomato", "ok": false}], "h": "M is in the middle. Which first letters come before m?"}, {"t": "sort", "q": "Sort: front half or back half of the glossary?", "bins": [{"id": "0", "label": "Front half (A to M)"}, {"id": "1", "label": "Back half (N to Z)"}], "items": [{"label": "apple", "bin": "0"}, {"label": "garden", "bin": "0"}, {"label": "leaf", "bin": "0"}, {"label": "plant", "bin": "1"}, {"label": "seed", "bin": "1"}, {"label": "water", "bin": "1"}], "h": "A to M is the front half. N to Z is the back half."}, {"t": "order", "q": "Put the look-it-up steps in order.", "tiles": ["Turn to the glossary.", "Find the word in ABC order.", "Read its meaning.", "Check it in the sentence."], "h": "Turn, find, read, check."}], check:[{"q": "A glossary lists \"seed,\" \"harvest,\" and \"soil.\" Which word comes first?", "o": ["harvest", "seed", "soil"]}, {"q": "Shloimy meets the hard word \"vine\" in his book about grapes. Where can he look up what it means?", "o": ["in the back of the book", "on the cover", "in the title"]}, {"q": "\"Sprout\" and \"soil\" both start with s. Which letter do you look at next?", "o": ["the second letter", "the last letter", "the first letter again"]}], re:[{"q": "Which comes first in ABC order?", "o": ["apple", "banana", "cherry"], "h": "A comes before b and c."}, {"q": "Glossary: \"soil: the dirt plants grow in.\" What is soil?", "o": ["the dirt plants grow in", "a kind of seed", "a fruit tree"], "h": "Read what comes after the word."}, {"q": "What is a glossary?", "o": ["a word list in the back of a book", "the name of a book", "the first page of a story"], "h": "It tells what the hard words mean."}]},
    'READ.VOC.L03.06':{name:"Toss, Throw, Hurl", teach:[{"how": "Some words mean almost the same thing, but one is stronger. Toss is a gentle throw. Throw is in the middle. Hurl is a very hard throw.", "q": "Which word means the hardest throw?", "o": ["hurl", "toss", "throw"]}, {"how": "Describing words have shades too: warm, hot, scorching. Scorching is the hottest of all. Cold words line up the same way: cool, cold, freezing.", "q": "Which word is the hottest?", "o": ["scorching", "warm", "hot"]}, {"how": "Glance is a quick look. Look is in the middle. Stare is a long, long look. Pick the word that fits just right.", "q": "\"Avi ___ at the clock for just one second.\" Which word fits best?", "o": ["glanced", "stared", "hurled"]}], practice:[{"t": "order", "q": "Put the words in order, from gentle to strongest.", "tiles": ["toss", "throw", "hurl"], "h": "Toss is gentle. Hurl is the strongest."}, {"t": "pairs", "q": "Match each word to its meaning.", "pairs": [["glance", "a quick look"], ["stare", "a long look"], ["toss", "a gentle throw"], ["hurl", "a very hard throw"]], "h": "Think: how strong or how long?"}, {"t": "sort", "q": "Mistake Detective: does the word fit, or is it a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "Zeidy tossed the ball gently to the baby.", "bin": "0"}, {"label": "Zeidy hurled the ball gently to the baby.", "bin": "1"}, {"label": "The sidewalk was scorching, so we walked in the shade.", "bin": "0"}, {"label": "The tea was scorching, so Moshe gulped it right away.", "bin": "1"}], "h": "Is the word too strong or too weak for the sentence?"}, {"t": "spotall", "q": "Tap every word that is the strongest of its group.", "cells": [{"label": "hurl", "ok": true}, {"label": "scorching", "ok": true}, {"label": "stare", "ok": true}, {"label": "toss", "ok": false}, {"label": "warm", "ok": false}, {"label": "glance", "ok": false}], "h": "Hurl, scorching and stare are at the top."}, {"t": "order", "q": "Put the words in order, from least hot to hottest.", "tiles": ["warm", "hot", "scorching"], "h": "Warm, then hot, then the hottest."}, {"t": "sort", "q": "Sort each word: weaker, or stronger?", "bins": [{"id": "0", "label": "Weaker word"}, {"id": "1", "label": "Stronger word"}], "items": [{"label": "toss", "bin": "0"}, {"label": "hurl", "bin": "1"}, {"label": "glance", "bin": "0"}, {"label": "stare", "bin": "1"}, {"label": "cool", "bin": "0"}, {"label": "freezing", "bin": "1"}], "h": "Compare it with its partner."}], check:[{"q": "\"Yehuda ___ the ball as hard as he could, all the way across the field.\" Which word fits best?", "o": ["hurled", "tossed", "glanced"]}, {"q": "Which word is colder than cool but not as cold as freezing?", "o": ["cold", "warm", "scorching"]}, {"q": "\"On the ___ summer day, the sand burned Dovi's feet.\" Which word fits best?", "o": ["scorching", "warm", "cool"]}], re:[{"q": "Which word means a gentle throw?", "o": ["toss", "hurl", "throw"], "h": "Toss is soft and easy."}, {"q": "Which word means a quick look?", "o": ["glance", "stare", "gaze"], "h": "A glance takes just a second."}, {"q": "Which word is hotter than hot?", "o": ["scorching", "warm", "cool"], "h": "Scorching is the hottest."}]},
    'READ.VOC.L04.04':{name:"Un-, Re-, Pre-, Dis-", teach:[{"how": "A prefix is a word part at the front of a word. It changes the meaning. un- means not: unhappy = not happy, unkind = not kind, unsafe = not safe, unfair = not fair.", "q": "What does unsafe mean?", "o": ["not safe", "safe again", "safe before"]}, {"how": "re- means again: reread = read again, refill = fill again, retell = tell again, rewrite = write again.", "q": "What does refill mean?", "o": ["fill again", "not fill", "fill before"]}, {"how": "pre- means before: preheat = heat before, prewash = wash before. dis- means not: dislike = not like, disagree = not agree, dishonest = not honest.", "q": "Bubby will preheat the oven before she bakes. What does preheat mean?", "o": ["heat before", "heat again", "not heat"]}], practice:[{"t": "sort", "q": "Sort by what the prefix means.", "bins": [{"id": "0", "label": "Not"}, {"id": "1", "label": "Again"}, {"id": "2", "label": "Before"}], "items": [{"label": "unkind", "bin": "0"}, {"label": "dislike", "bin": "0"}, {"label": "retell", "bin": "1"}, {"label": "rewrite", "bin": "1"}, {"label": "preheat", "bin": "2"}, {"label": "prewash", "bin": "2"}], "h": "un- and dis- mean not. re- means again. pre- means before."}, {"t": "pairs", "q": "Match each word to its meaning.", "pairs": [["unsafe", "not safe"], ["reread", "read again"], ["preheat", "heat before"], ["disagree", "not agree"]], "h": "Read the prefix first, then the base word."}, {"t": "sort", "q": "Mistake Detective: right, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "refill means fill again", "bin": "0"}, {"label": "refill means not fill", "bin": "1"}, {"label": "unfair means not fair", "bin": "0"}, {"label": "unfair means fair again", "bin": "1"}, {"label": "prewash means wash before", "bin": "0"}, {"label": "prewash means wash again", "bin": "1"}], "h": "Check what the prefix means."}, {"t": "spotall", "q": "\"Chaim was unhappy, so he reread the note and rewrote his answer.\" Tap every word with a prefix.", "cells": [{"label": "unhappy", "ok": true}, {"label": "reread", "ok": true}, {"label": "rewrote", "ok": true}, {"label": "note", "ok": false}, {"label": "answer", "ok": false}], "h": "Look for un-, re-, pre- or dis- at the front."}, {"t": "order", "q": "Build the sentence that means Avi will tell the story again.", "tiles": ["Avi", "will", "retell", "the story."], "h": "re- means again: retell."}, {"t": "pairs", "q": "Match each meaning to its word.", "pairs": [["not kind", "unkind"], ["tell again", "retell"], ["wash before", "prewash"], ["not honest", "dishonest"]], "h": "Pick the prefix that matches the meaning."}], check:[{"q": "\"I will reheat the soup for supper,\" said Ima. What does reheat mean?", "o": ["heat again", "heat before", "not heat"]}, {"q": "Dovid did not understand the story, so he read it one more time. Which word tells what he did?", "o": ["reread", "unread", "disread"]}, {"q": "Yanky does not like cold weather. Which word tells how he feels about it?", "o": ["dislike", "relike", "prelike"]}], re:[{"q": "What does retell mean?", "o": ["tell again", "not tell", "tell before"], "h": "re- means again."}, {"q": "What does unkind mean?", "o": ["not kind", "kind again", "kind before"], "h": "un- means not."}, {"q": "What does prewash mean?", "o": ["wash before", "wash again", "not wash"], "h": "pre- means before."}]},
    'READ.VOC.L04.05':{name:"-ful, -less, -able", teach:[{"how": "A suffix is a word part at the end of a word. It changes the meaning. -ful means full of: careful = full of care, joyful = full of joy, helpful = full of help, thankful = full of thanks.", "q": "What does joyful mean?", "o": ["full of joy", "without joy", "joy again"]}, {"how": "-less means without: careless = without care, fearless = without fear, endless = without an end, helpless = without help.", "q": "What does fearless mean?", "o": ["without fear", "full of fear", "fear again"]}, {"how": "-able means can be: washable = can be washed, breakable = can be broken, fixable = can be fixed.", "q": "What does breakable mean?", "o": ["can be broken", "without breaks", "full of breaks"]}], practice:[{"t": "sort", "q": "Sort by what the suffix means.", "bins": [{"id": "0", "label": "Full of"}, {"id": "1", "label": "Without"}, {"id": "2", "label": "Can be"}], "items": [{"label": "helpful", "bin": "0"}, {"label": "thankful", "bin": "0"}, {"label": "careless", "bin": "1"}, {"label": "endless", "bin": "1"}, {"label": "washable", "bin": "2"}, {"label": "fixable", "bin": "2"}], "h": "-ful: full of. -less: without. -able: can be."}, {"t": "pairs", "q": "Match each word to its meaning.", "pairs": [["careful", "full of care"], ["careless", "without care"], ["washable", "can be washed"], ["fearless", "without fear"]], "h": "Read the base word, then the suffix."}, {"t": "sort", "q": "Mistake Detective: right, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "helpless means without help", "bin": "0"}, {"label": "helpless means full of help", "bin": "1"}, {"label": "readable means can be read", "bin": "0"}, {"label": "readable means without reading", "bin": "1"}, {"label": "thankful means full of thanks", "bin": "0"}, {"label": "thankful means without thanks", "bin": "1"}], "h": "Check what the suffix means."}, {"t": "spotall", "q": "\"Yehuda was careful with the breakable cup and thankful for the help.\" Tap every word with a suffix.", "cells": [{"label": "careful", "ok": true}, {"label": "breakable", "ok": true}, {"label": "thankful", "ok": true}, {"label": "cup", "ok": false}, {"label": "help", "ok": false}], "h": "Look for -ful, -less or -able at the end."}, {"t": "order", "q": "Build the sentence about a shirt that can be washed.", "tiles": ["The", "washable", "shirt", "got clean."], "h": "-able means can be: washable."}, {"t": "pairs", "q": "Match each meaning to its word.", "pairs": [["full of hope", "hopeful"], ["without hope", "hopeless"], ["can be fixed", "fixable"]], "h": "Pick the suffix that matches the meaning."}], check:[{"q": "Zeidy looked at the broken chair. \"I can fix it,\" he said. Which word tells what the chair is?", "o": ["fixable", "fixless", "fixful"]}, {"q": "\"The stars went on and on, with no end.\" Which word means without an end?", "o": ["endless", "endful", "endable"]}, {"q": "Shimmy carried all the bags in for Mommy. What kind of boy was he?", "o": ["helpful", "helpless", "helpable"]}], re:[{"q": "What does careless mean?", "o": ["without care", "full of care", "can be cared"], "h": "-less means without."}, {"q": "What does thankful mean?", "o": ["full of thanks", "without thanks", "can be thanked"], "h": "-ful means full of."}, {"q": "What does washable mean?", "o": ["can be washed", "without washing", "full of washing"], "h": "-able means can be."}]},
    'READ.VOC.L04.06':{name:"Root Finder", teach:[{"how": "The root is the main word inside a bigger word. Cover the prefix or suffix to find it: replay → play, playful → play, unhelpful → help.", "q": "What is the root in \"replay\"?", "o": ["play", "re", "lay"]}, {"how": "Know the root, and you can work out the meaning. Playful means full of play. Replay means play again. A player is someone who plays. A singer is someone who sings.", "q": "What does playful mean?", "o": ["full of play", "play again", "someone who plays"]}, {"how": "Roots hide in harder words too. When we have company, people are together with us. A companion is a friend who is together with you. Same root, same idea: together.", "q": "Zeidy walked to shul with his companion. What is a companion?", "o": ["a friend who is with you", "a big store", "a quiet place"]}], practice:[{"t": "sort", "q": "Sort each word by its root.", "bins": [{"id": "0", "label": "Root: play"}, {"id": "1", "label": "Root: help"}], "items": [{"label": "playful", "bin": "0"}, {"label": "replay", "bin": "0"}, {"label": "player", "bin": "0"}, {"label": "helpful", "bin": "1"}, {"label": "helper", "bin": "1"}, {"label": "unhelpful", "bin": "1"}], "h": "Cover the prefix and suffix. What main word is left?"}, {"t": "pairs", "q": "Match each word to its meaning.", "pairs": [["replay", "play again"], ["player", "someone who plays"], ["helper", "someone who helps"], ["unhelpful", "not helpful"]], "h": "Find the root, then add the meaning of the parts."}, {"t": "sort", "q": "Mistake Detective: right, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "The root of helpful is help.", "bin": "0"}, {"label": "The root of helpful is ful.", "bin": "1"}, {"label": "The root of replay is play.", "bin": "0"}, {"label": "The root of replay is re.", "bin": "1"}], "h": "The root is the main word, not the prefix or suffix."}, {"t": "spotall", "q": "\"The teacher said the reader should reread the story.\" Tap every word with the root read.", "cells": [{"label": "reader", "ok": true}, {"label": "reread", "ok": true}, {"label": "teacher", "ok": false}, {"label": "story", "ok": false}, {"label": "should", "ok": false}], "h": "Cover the prefix or suffix. Is read left? A reader is someone who reads."}, {"t": "order", "q": "Build the sentence that tells what player means.", "tiles": ["A", "player", "is someone", "who plays."], "h": "Player has the root play."}, {"t": "pairs", "q": "Match each word to its meaning.", "pairs": [["company", "people together"], ["companion", "a friend who is with you"], ["playful", "full of play"]], "h": "Company and companion share a root: together."}], check:[{"q": "\"Shloimie is a fast reader.\" What does reader mean?", "o": ["someone who reads", "read again", "not reading"]}, {"q": "\"We had company for Shabbos.\" Companion has the same root as company. What idea do they share?", "o": ["together", "alone", "weather"]}, {"q": "\"The baby bird was helpless without its mother.\" What is the root of helpless?", "o": ["help", "less", "bird"]}], re:[{"q": "What is the root in \"helper\"?", "o": ["help", "er", "helps"], "h": "Cover the ending to find the root."}, {"q": "What does replay mean?", "o": ["play again", "not play", "full of play"], "h": "re- means again, and play is the root."}, {"q": "Company and companion share a root. What is a companion?", "o": ["a friend who is with you", "a store that sells things", "a person who lives far away"], "h": "Same root, same idea: together."}]},
    'READ.VOC.L04.07':{name:"Thought, Believed, Suspected", teach:[{"how": "Some words tell how sure a person is. Picture a ladder. At the top is knew: sure, with proof. At the bottom is wondered: not sure at all, just asking.", "q": "Which word is at the top of the sure ladder?", "o": ["knew", "wondered", "suspected"]}, {"how": "In the middle of the ladder: believed and thought mean fairly sure, but with no proof. Suspected is lower: he has a guess, but no proof yet.", "q": "\"Moshe suspected his little brother ate the last cookie.\" Does Moshe have proof?", "o": ["no, he has a guess", "yes, he saw it", "yes, his brother told him"]}, {"how": "Look for clues. Saw it with his own eyes? Use knew. Just a question in his head? Use wondered.", "q": "\"Chaim ___ if it would snow on Sunday.\" Which word fits?", "o": ["wondered", "knew", "believed"]}], practice:[{"t": "order", "q": "Build the sure ladder: most sure first.", "tiles": ["knew", "thought", "wondered"], "h": "Knew is at the top. Wondered is at the bottom."}, {"t": "sort", "q": "Sort: very sure, or not sure yet?", "bins": [{"id": "0", "label": "Very sure"}, {"id": "1", "label": "Not sure yet"}], "items": [{"label": "knew", "bin": "0"}, {"label": "was certain", "bin": "0"}, {"label": "wondered", "bin": "1"}, {"label": "suspected", "bin": "1"}, {"label": "had proof", "bin": "0"}, {"label": "was asking himself", "bin": "1"}], "h": "Proof means very sure. A guess or a question means not sure yet."}, {"t": "sort", "q": "Mistake Detective: does the word fit the clues?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "Avi saw the bus leave, so he knew he missed it.", "bin": "0"}, {"label": "Avi saw the bus leave, so he wondered if he missed it.", "bin": "1"}, {"label": "Dovid had no clues, so he wondered who took his pen.", "bin": "0"}, {"label": "Dovid had no clues, so he knew who took his pen.", "bin": "1"}], "h": "Proof? Knew. No clues? Wondered."}, {"t": "spotall", "q": "\"Yossi wondered where his hat was. He suspected his brother hid it. Then he saw it on the hook, so he knew.\" Tap every word that shows he was not sure yet.", "cells": [{"label": "wondered", "ok": true}, {"label": "suspected", "ok": true}, {"label": "knew", "ok": false}, {"label": "saw", "ok": false}, {"label": "hook", "ok": false}], "h": "Wondered and suspected are low on the ladder."}, {"t": "pairs", "q": "Match each word to how sure it is.", "pairs": [["knew", "sure, with proof"], ["wondered", "asking, not sure at all"], ["suspected", "a guess, with no proof"]], "h": "Think of the ladder: top, low, bottom."}, {"t": "order", "q": "Build the sentence. Pinny is sure, with proof.", "tiles": ["Pinny", "knew", "the answer,", "because he checked."], "h": "He checked, so he has proof: knew."}], check:[{"q": "\"Shimon saw the moon with his own eyes. He ___ it was out.\" Which word fits best?", "o": ["knew", "wondered", "suspected"]}, {"q": "\"Ari had no idea who left the note on his desk. He ___ who wrote it.\" Which word fits best?", "o": ["wondered", "knew", "believed"]}, {"q": "\"Eli suspected the cake was for him, but nobody said so.\" How sure is Eli?", "o": ["not sure yet", "very sure", "sure, with proof"]}], re:[{"q": "Which word means sure, with proof?", "o": ["knew", "wondered", "suspected"], "h": "Knew is at the top of the ladder."}, {"q": "Moshe had no clue what was in the box. He ___ what was inside.", "o": ["wondered", "knew", "was certain"], "h": "No clue? He is asking himself: wondered."}, {"q": "Which word is at the bottom of the sure ladder?", "o": ["wondered", "knew", "believed"], "h": "Wondered means not sure at all."}]},
    'LANG.USE.L04.01':{name:"Say It Better", teach:[{"how": "Plain words are fine, but a strong word paints a picture. Instead of went, try raced, tiptoed or marched.", "q": "\"The baby was sleeping, so Avi ___ past the door.\" Which word paints the best picture?", "o": ["tiptoed", "stomped", "raced"]}, {"how": "Pick the word that fits the feeling. Instead of said, try whispered or shouted. Instead of good, try delicious or wonderful.", "q": "\"Bubby's kugel was ___!\" Which word tells the most about the taste?", "o": ["delicious", "good", "nice"]}, {"how": "A stronger word can take the place of \"very\" too. Instead of very big, say huge or enormous. Instead of very cold, say freezing.", "q": "Which is the strongest way to say \"very cold\"?", "o": ["freezing", "cold", "kind of cold"]}], practice:[{"t": "pairs", "q": "Match each plain phrase to a stronger word.", "pairs": [["went fast", "raced"], ["said quietly", "whispered"], ["very big", "huge"], ["very good food", "delicious"]], "h": "The strong word paints a clearer picture."}, {"t": "sort", "q": "Sort: plain word, or strong word?", "bins": [{"id": "0", "label": "Plain"}, {"id": "1", "label": "Strong"}], "items": [{"label": "went", "bin": "0"}, {"label": "raced", "bin": "1"}, {"label": "said", "bin": "0"}, {"label": "shouted", "bin": "1"}, {"label": "big", "bin": "0"}, {"label": "enormous", "bin": "1"}], "h": "A strong word tells exactly how."}, {"t": "sort", "q": "Mistake Detective: does the strong word fit?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "In shul, Moshe whispered to his friend.", "bin": "0"}, {"label": "In shul, Moshe shouted to his friend.", "bin": "1"}, {"label": "Eli was so happy that he grinned.", "bin": "0"}, {"label": "Eli was so happy that he frowned.", "bin": "1"}], "h": "A strong word must fit the scene and the feeling."}, {"t": "spotall", "q": "\"The wind howled, and Dovid raced home in the freezing rain.\" Tap every strong word that paints a picture.", "cells": [{"label": "howled", "ok": true}, {"label": "raced", "ok": true}, {"label": "freezing", "ok": true}, {"label": "home", "ok": false}, {"label": "and", "ok": false}], "h": "Strong words tell exactly how something looked, sounded or felt."}, {"t": "order", "q": "Build the sentence with a strong sound word.", "tiles": ["The thunder", "boomed", "over", "the city."], "h": "Boomed tells how loud the thunder was."}, {"t": "sort", "q": "Sort: which scene does each word fit?", "bins": [{"id": "0", "label": "Quiet scene"}, {"id": "1", "label": "Loud scene"}], "items": [{"label": "whispered", "bin": "0"}, {"label": "tiptoed", "bin": "0"}, {"label": "shouted", "bin": "1"}, {"label": "stomped", "bin": "1"}, {"label": "boomed", "bin": "1"}], "h": "Ask: is it a quiet word or a loud word?"}], check:[{"q": "Shmuel could not wait to get to the Chanukah party, so he ___ down the street. Which word paints the best picture?", "o": ["raced", "went", "tiptoed"]}, {"q": "\"It is late, and Abba is sleeping,\" Ari ___. Which word fits best?", "o": ["whispered", "shouted", "boomed"]}, {"q": "\"The snowman in the yard was very big.\" Which word says it better?", "o": ["huge", "big", "little"]}], re:[{"q": "Which word paints a better picture than \"went\"?", "o": ["marched", "go", "goes"], "h": "A strong action word shows how."}, {"q": "Which word tells the most about food?", "o": ["delicious", "good", "fine"], "h": "Delicious tells how it tastes."}, {"q": "Avi did not want to wake the baby. How did he walk?", "o": ["tiptoed", "stomped", "raced"], "h": "A quiet word fits a quiet scene."}]},
    'READ.VOC.L05.02':{name:"Tele, Photo, Graph", teach:[{"how": "Many English words are built from old Greek parts. Tele means far. Phon means sound. A telephone carries sound from far away: tele + phone.", "q": "What does \"tele\" mean?", "o": ["far", "light", "self"]}, {"how": "Graph means write or draw. Photo means light. A photograph is a picture made with light: photo + graph. A telegraph sent written messages far away: tele + graph.", "q": "What does \"graph\" mean?", "o": ["write or draw", "sound", "far"]}, {"how": "Auto means self. An autograph is your name, written by yourself: auto + graph. Find the parts, put their meanings together, then check the word in the sentence.", "q": "What does \"auto\" mean?", "o": ["self", "light", "sound"]}], practice:[{"t": "pairs", "q": "Match each Greek part to its meaning.", "pairs": [["tele", "far"], ["photo", "light"], ["graph", "write or draw"], ["auto", "self"], ["phon", "sound"]], "h": "Think of a word you know: telephone, photograph, autograph."}, {"t": "sort", "q": "Sort each word by the Greek part it has.", "bins": [{"id": "0", "label": "Has tele (far)"}, {"id": "1", "label": "Has graph (write or draw)"}], "items": [{"label": "telephone", "bin": "0"}, {"label": "television", "bin": "0"}, {"label": "telescope", "bin": "0"}, {"label": "autograph", "bin": "1"}, {"label": "photograph", "bin": "1"}, {"label": "paragraph", "bin": "1"}], "h": "Look at the start for tele. Look at the end for graph."}, {"t": "sort", "q": "Mistake Detective: right, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "A telephone carries sound from far away.", "bin": "0"}, {"label": "A photograph is a picture made with sound.", "bin": "1"}, {"label": "An autograph is a name you write yourself.", "bin": "0"}, {"label": "Tele means light.", "bin": "1"}], "h": "Check each part: tele = far, photo = light, graph = write, auto = self."}, {"t": "order", "q": "Build what an autograph is.", "tiles": ["An autograph", "is a name", "written by", "yourself."], "h": "Auto = self, graph = write."}, {"t": "spotall", "q": "Tap every part that means light or write.", "cells": [{"label": "photo", "ok": true}, {"label": "graph", "ok": true}, {"label": "tele", "ok": false}, {"label": "auto", "ok": false}], "h": "Photo = light. Graph = write or draw."}, {"t": "order", "q": "Build what a telegraph did.", "tiles": ["A telegraph", "sent written messages", "far away."], "h": "Tele = far, graph = write."}], check:[{"q": "Avrumi asked the visiting rebbe to sign his name in Avrumi's sefer. What did Avrumi get?", "o": ["an autograph", "a photograph", "a telephone"]}, {"q": "A photometer is a tool that measures something. Use its first part. What does it measure?", "o": ["light", "sound", "writing"]}, {"q": "The word \"phonics\" has the part \"phon.\" So phonics is about...", "o": ["sound", "light", "self"]}], re:[{"q": "What does \"photo\" mean?", "o": ["light", "far", "self"], "h": "A photograph is a picture made with light."}, {"q": "Which word means \"sound from far away\"?", "o": ["telephone", "autograph", "photograph"], "h": "Tele = far, phon = sound."}, {"q": "What does \"graph\" mean?", "o": ["write or draw", "far", "sound"], "h": "An autograph is written by you."}]},
    'READ.VOC.L05.03':{name:"Word Part Builder", teach:[{"how": "Many long words are built from three parts: a prefix first, the root or base word in the middle, and a suffix at the end. re + port + er = reporter.", "q": "In \"reporter,\" which part is the root?", "o": ["port", "re", "er"]}, {"how": "Each part adds meaning. Prefixes: un = not, re = back or again, dis = not. Roots: port = carry. Suffixes: -er = one who, -able = able to be, -ful = full of, -ness = being. A reporter is one who carries news back.", "q": "What does the suffix -er mean?", "o": ["one who", "not", "again"]}, {"how": "To find the meaning, start with the root or base word, add the suffix, then add the prefix: break, breakable (able to be broken), unbreakable (not able to be broken). More: un + help + ful = unhelpful, un + read + able = unreadable.", "q": "What does \"unbreakable\" mean?", "o": ["not able to be broken", "broken again", "one who breaks"]}], practice:[{"t": "sort", "q": "Sort each word part.", "bins": [{"id": "0", "label": "Prefix"}, {"id": "1", "label": "Root or base"}, {"id": "2", "label": "Suffix"}], "items": [{"label": "un", "bin": "0"}, {"label": "re", "bin": "0"}, {"label": "port", "bin": "1"}, {"label": "break", "bin": "1"}, {"label": "able", "bin": "2"}, {"label": "er", "bin": "2"}], "h": "Prefixes come first, suffixes at the end, the root in the middle."}, {"t": "order", "q": "Build the word that means \"not able to be broken.\"", "tiles": ["un", "break", "able"], "h": "Prefix, then base word, then suffix."}, {"t": "sort", "q": "Mistake Detective: right, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "Unhelpful means not helpful.", "bin": "0"}, {"label": "A reporter is one who breaks.", "bin": "1"}, {"label": "Refillable means able to be filled again.", "bin": "0"}, {"label": "Unbreakable means broken again.", "bin": "1"}], "h": "Check every part: prefix, root, suffix."}, {"t": "pairs", "q": "Match each word to its meaning.", "pairs": [["reporter", "one who carries news back"], ["unbreakable", "not able to be broken"], ["refillable", "able to be filled again"], ["unhelpful", "not helpful"]], "h": "Start with the root, add the suffix, then the prefix."}, {"t": "spotall", "q": "Tap every word that has a prefix, a root or base, and a suffix.", "cells": [{"label": "disagreement", "ok": true}, {"label": "unkindness", "ok": true}, {"label": "kind", "ok": false}, {"label": "report", "ok": false}], "h": "Look for a part at the start AND a part at the end."}, {"t": "order", "q": "Build the word that means \"able to be filled again.\"", "tiles": ["re", "fill", "able"], "h": "Again = re. Able to be = able."}], check:[{"q": "Tzvi Hirsch wants one word for \"not able to be read.\" Which word fits?", "o": ["unreadable", "reader", "rereading"]}, {"q": "Dovid splits \"unthankful\" into un + thank + ful. What does the suffix -ful mean?", "o": ["full of", "not", "again"]}, {"q": "Bubby calls her old candlesticks \"irreplaceable.\" Which part should you start with to find the meaning?", "o": ["the root or base word", "the prefix", "the suffix"]}], re:[{"q": "What does \"re\" mean in refillable?", "o": ["again", "not", "full of"], "h": "Refill means fill again."}, {"q": "Which word means \"one who carries news back\"?", "o": ["reporter", "unbreakable", "portable"], "h": "re + port + er."}, {"q": "Which part comes at the end of a word?", "o": ["the suffix", "the prefix", "the root"], "h": "A suffix is added at the end."}]},
    'READ.VOC.L05.04':{name:"Definition Clues", teach:[{"how": "Sometimes the writer gives the meaning right in the sentence. That is a definition clue. Look for signal words: which means, or, that is, and commas or dashes around the meaning.", "q": "Which words signal a definition clue?", "o": ["which means", "such as", "because"]}, {"how": "\"Zeidy is a philatelist, a person who collects stamps.\" The meaning sits right after the comma. \"The menahel is punctual, which means always on time.\"", "q": "\"Zeidy is a philatelist, a person who collects stamps.\" What does philatelist mean?", "o": ["a person who collects stamps", "a kind of stamp", "a letter carrier"]}, {"how": "An example clue lists examples that show the meaning. Signal words: such as, for example, like, including. \"Avrumi loves legumes, such as beans, lentils and chickpeas.\" So legumes are foods like beans and lentils.", "q": "Which words signal an example clue?", "o": ["such as", "which means", "that is"]}], practice:[{"t": "sort", "q": "Sort the signal words.", "bins": [{"id": "0", "label": "Definition clue"}, {"id": "1", "label": "Example clue"}], "items": [{"label": "which means", "bin": "0"}, {"label": "that is", "bin": "0"}, {"label": "a person who", "bin": "0"}, {"label": "such as", "bin": "1"}, {"label": "for example", "bin": "1"}, {"label": "including", "bin": "1"}], "h": "A meaning comes next, or a list of examples?"}, {"t": "spotall", "q": "\"We packed provisions, such as bread, apples and water, for the trip.\" Tap every example of provisions.", "cells": [{"label": "bread", "ok": true}, {"label": "apples", "ok": true}, {"label": "water", "ok": true}, {"label": "trip", "ok": false}], "h": "The examples come right after \"such as.\""}, {"t": "sort", "q": "Mistake Detective: right, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "\"Such as\" signals an example clue.", "bin": "0"}, {"label": "\"Which means\" signals an example clue.", "bin": "1"}, {"label": "\"That is\" signals a definition clue.", "bin": "0"}, {"label": "\"For example\" signals a definition clue.", "bin": "1"}], "h": "Which means, that is: a meaning. Such as, for example: examples."}, {"t": "order", "q": "Build the sentence with a definition clue.", "tiles": ["Dovid felt elated,", "which means", "very happy,", "after the siyum."], "h": "The new word, the signal, then the meaning."}, {"t": "pairs", "q": "Read each clue. Match it to the meaning.", "pairs": [["philatelist, a person who collects stamps", "a stamp collector"], ["punctual, which means always on time", "never late"], ["legumes, such as beans and lentils", "foods like beans"]], "h": "The meaning is right there in the clue."}, {"t": "order", "q": "Build the sentence with an example clue.", "tiles": ["Bubby grows herbs,", "such as", "mint and basil,", "in her garden."], "h": "The new word, then such as, then the examples."}], check:[{"q": "\"The doctor said Zeidy's cold was mild, that is, not serious.\" Which kind of clue is this?", "o": ["a definition clue", "an example clue", "no clue at all"]}, {"q": "\"The shul closet holds necessities, such as soap, towels and blankets.\" Which kind of clue helps with \"necessities\"?", "o": ["an example clue", "a definition clue", "no clue at all"]}, {"q": "\"The baker used a spatula, a flat tool for lifting and spreading.\" What shows where the meaning starts?", "o": ["the comma", "such as", "because"]}], re:[{"q": "\"The menahel is punctual, which means always on time.\" What does punctual mean?", "o": ["always on time", "very late", "very strict"], "h": "The meaning comes after \"which means.\""}, {"q": "Which signal words point to examples?", "o": ["for example", "that is", "which means"], "h": "Examples follow for example or such as."}, {"q": "\"Avrumi loves legumes, such as beans and lentils.\" What are legumes?", "o": ["foods like beans and lentils", "sweet desserts", "kinds of drinks"], "h": "The examples show the meaning."}]},
    'READ.VOC.L05.05':{name:"Dictionary Pro", teach:[{"how": "A dictionary shows how to say a word. Dots split it into syllables: dic·tion·ar·y has 4 syllables. Here, the stressed syllable, the one you say loudest, is in capitals: DIC·tion·ar·y. The stress is on the first syllable.", "q": "How many syllables are in pho·to·graph?", "o": ["3", "2", "4"]}, {"how": "Some words move their stress when they change jobs. A REC·ord (noun) is a written list of what happened. To re·CORD (verb) is to write it down or save it. A PRES·ent (noun) is a gift. To pre·SENT (verb) is to give or show.", "q": "Zeidy will re·CORD the niggun. Is re·CORD a noun or a verb?", "o": ["a verb", "a noun", "an adjective"]}, {"how": "Many words have more than one meaning. The dictionary numbers them: sense 1, sense 2. Read every sense, then pick the one that fits your sentence. pitcher: 1. a jug for pouring 2. the player who throws the ball.", "q": "\"Ima filled the pitcher with water.\" Which sense fits?", "o": ["sense 1", "sense 2", "both"]}], practice:[{"t": "sort", "q": "Sort by where the stress falls.", "bins": [{"id": "0", "label": "Noun (a thing)"}, {"id": "1", "label": "Verb (an action)"}], "items": [{"label": "REC·ord", "bin": "0"}, {"label": "re·CORD", "bin": "1"}, {"label": "PRES·ent", "bin": "0"}, {"label": "pre·SENT", "bin": "1"}, {"label": "OB·ject", "bin": "0"}, {"label": "ob·JECT", "bin": "1"}], "h": "Stress first: usually a noun. Stress second: usually a verb."}, {"t": "pairs", "q": "Match each word to its number of syllables.", "pairs": [["dic·tion·ar·y", "4 syllables"], ["pho·to·graph", "3 syllables"], ["pen·cil", "2 syllables"], ["chair", "1 syllable"]], "h": "Count the parts between the dots."}, {"t": "sort", "q": "Mistake Detective: is the stress right?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "Yehuda will pre·SENT his project.", "bin": "0"}, {"label": "Yehuda will PRES·ent his project.", "bin": "1"}, {"label": "We kept a REC·ord of the score.", "bin": "0"}, {"label": "We kept a re·CORD of the score.", "bin": "1"}], "h": "An action: stress second. A thing: stress first."}, {"t": "spotall", "q": "bat: 1. a club for hitting a ball 2. a flying animal. Tap every sentence that uses sense 2.", "cells": [{"label": "A bat flew out of the attic.", "ok": true}, {"label": "The bat slept upside down in the cave.", "ok": true}, {"label": "Dovid swung the bat hard.", "ok": false}, {"label": "Pass me the bat and the ball.", "ok": false}], "h": "Try each sense in the sentence."}, {"t": "order", "q": "Build the steps for picking the right meaning.", "tiles": ["Read every sense,", "try each one in your sentence,", "then pick the one that fits."], "h": "Read, try, pick."}, {"t": "order", "q": "Build dictionary, one syllable at a time.", "tiles": ["dic", "tion", "ar", "y"], "h": "Say it slowly: dic, tion, ar, y."}], check:[{"q": "\"Ima did not ob·JECT when we asked to learn late.\" Here, ob·JECT is...", "o": ["a verb", "a noun", "an adjective"]}, {"q": "bank: 1. the land along a river 2. a place that keeps money. \"Tatty took a check to the bank.\" Which sense fits?", "o": ["sense 2", "sense 1", "neither one"]}, {"q": "A dictionary shows LEM·on. Which syllable is stressed?", "o": ["the first syllable", "the second syllable", "neither one"]}], re:[{"q": "Which one is the noun that means a gift?", "o": ["PRES·ent", "pre·SENT", "both"], "h": "A noun like this has the stress first."}, {"q": "How many syllables are in dic·tion·ar·y?", "o": ["4", "3", "2"], "h": "Count the parts between the dots."}, {"q": "pitcher: 1. a jug for pouring 2. the player who throws the ball. \"The pitcher threw a fast ball.\" Which sense fits?", "o": ["sense 2", "sense 1", "both"], "h": "Try each sense in the sentence."}]},
    'READ.VOC.L05.07':{name:"Idioms and Sayings", teach:[{"how": "An idiom is a group of words that means something different from the plain words. \"That test was a piece of cake\" means it was very easy. No cake at all!", "q": "What does \"a piece of cake\" mean?", "o": ["very easy", "a dessert", "very hard"]}, {"how": "More idioms: \"under the weather\" means feeling sick. \"Lend a hand\" means help. \"In hot water\" means in trouble. Use the rest of the sentence to figure out the meaning.", "q": "\"Zeidy is under the weather today.\" What does that mean?", "o": ["Zeidy feels sick.", "Zeidy is outside in the rain.", "Zeidy is very happy."]}, {"how": "An adage or proverb is an old, wise saying that gives advice or teaches a truth. \"The early bird catches the worm\" means starting early helps you succeed. \"Don't count your chickens before they hatch\" means don't be sure of something before it happens. Pirkei Avos teaches: \"Who is wise? One who learns from everyone.\"", "q": "What does \"The early bird catches the worm\" teach?", "o": ["Starting early helps you succeed.", "Birds like worms.", "Sleep late."]}], practice:[{"t": "sort", "q": "Sort: an idiom, or a wise saying?", "bins": [{"id": "0", "label": "Idiom"}, {"id": "1", "label": "Wise saying"}], "items": [{"label": "a piece of cake", "bin": "0"}, {"label": "under the weather", "bin": "0"}, {"label": "lend a hand", "bin": "0"}, {"label": "The early bird catches the worm.", "bin": "1"}, {"label": "Don't count your chickens before they hatch.", "bin": "1"}, {"label": "Practice makes perfect.", "bin": "1"}], "h": "An idiom has a hidden meaning. A wise saying gives advice or teaches a truth."}, {"t": "pairs", "q": "Match each idiom to its meaning.", "pairs": [["a piece of cake", "very easy"], ["under the weather", "feeling sick"], ["lend a hand", "help"], ["in hot water", "in trouble"]], "h": "Do not read it word for word. What does it really mean?"}, {"t": "sort", "q": "Mistake Detective: right meaning, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "\"Lend a hand\" means help.", "bin": "0"}, {"label": "\"In hot water\" means taking a bath.", "bin": "1"}, {"label": "\"A piece of cake\" means very easy.", "bin": "0"}, {"label": "\"Under the weather\" means out in the rain.", "bin": "1"}], "h": "An idiom does not mean its plain words."}, {"t": "spotall", "q": "\"Avrumi said the math sheet was a piece of cake, so he offered to lend a hand to his brother.\" Tap every idiom.", "cells": [{"label": "a piece of cake", "ok": true}, {"label": "lend a hand", "ok": true}, {"label": "the math sheet", "ok": false}, {"label": "his brother", "ok": false}], "h": "An idiom does not mean its plain words."}, {"t": "order", "q": "Build the wise saying.", "tiles": ["Don't count your chickens", "before", "they hatch."], "h": "It tells you not to be sure too early."}, {"t": "pairs", "q": "Match each saying to what it teaches.", "pairs": [["The early bird catches the worm.", "Starting early helps you succeed."], ["Don't count your chickens before they hatch.", "Don't be sure of something before it happens."], ["Who is wise? One who learns from everyone.", "A wise person learns from all people."], ["Say little and do much.", "Do more than you promise."]], "h": "Ask: what advice is it giving?"}], check:[{"q": "Before the spelling bee, Binyamin said, \"I studied all week. This will be a piece of cake!\" What does he mean?", "o": ["very easy", "a dessert", "very hard"]}, {"q": "Dovid told everyone he would win the raffle before it was even drawn. Which saying fits?", "o": ["Don't count your chickens before they hatch.", "The early bird catches the worm.", "Practice makes perfect."]}, {"q": "Tzvi Hirsch forgot his homework again. \"Now I'm in hot water,\" he said. What does he mean?", "o": ["in trouble", "in the bath", "very warm"]}], re:[{"q": "What does \"lend a hand\" mean?", "o": ["help", "give your hand away", "wave hello"], "h": "It is an idiom."}, {"q": "Which one is a wise saying?", "o": ["The early bird catches the worm.", "a piece of cake", "under the weather"], "h": "A wise saying gives advice or teaches a truth."}, {"q": "\"Who is wise? One who learns from everyone.\" What does it teach?", "o": ["A wise person learns from all people.", "Only teachers are wise.", "Wise people never ask."], "h": "It is from Pirkei Avos."}]},
    'READ.VOC.L05.08':{name:"School Words", teach:[{"how": "School questions use special words. Each one tells you what to do. Compare means tell how things are alike. Contrast means tell how they are different.", "q": "Which word asks how things are alike?", "o": ["compare", "contrast", "summarize"]}, {"how": "Explain means tell why or how. Describe means tell what something is like, with details: how it looks, sounds, smells, tastes or feels.", "q": "Which word asks you to tell why?", "o": ["explain", "describe", "compare"]}, {"how": "Summarize means tell only the most important points, in a few sentences, in your own words. Skip the small details.", "q": "Which word asks for only the main points?", "o": ["summarize", "describe", "contrast"]}], practice:[{"t": "pairs", "q": "Match each school word to its job.", "pairs": [["compare", "tell how they are alike"], ["contrast", "tell how they are different"], ["explain", "tell why or how"], ["describe", "tell what it is like"], ["summarize", "tell the main points"]], "h": "Each word tells you what to do."}, {"t": "sort", "q": "Apples and bananas: sort each sentence.", "bins": [{"id": "0", "label": "Compare (alike)"}, {"id": "1", "label": "Contrast (different)"}], "items": [{"label": "Both are fruits.", "bin": "0"}, {"label": "Both make a good snack.", "bin": "0"}, {"label": "Both grow on plants.", "bin": "0"}, {"label": "Apples are red, but bananas are yellow.", "bin": "1"}, {"label": "You must peel a banana, but you can eat an apple with its skin.", "bin": "1"}, {"label": "Apples crunch, but bananas are soft.", "bin": "1"}], "h": "Both = alike. But = different."}, {"t": "sort", "q": "Mistake Detective: right, or a mistake?", "bins": [{"id": "0", "label": "Right"}, {"id": "1", "label": "Mistake"}], "items": [{"label": "Compare: tell how they are alike.", "bin": "0"}, {"label": "Contrast: tell how they are alike.", "bin": "1"}, {"label": "Explain: tell why or how.", "bin": "0"}, {"label": "Summarize: tell every small detail.", "bin": "1"}], "h": "Check each school word against its job."}, {"t": "spotall", "q": "Rabbi Feldman asked, \"Describe the shul.\" Tap every answer that describes.", "cells": [{"label": "It has tall windows.", "ok": true}, {"label": "The seats are soft and blue.", "ok": true}, {"label": "We daven there because Zeidy does.", "ok": false}, {"label": "Both shuls have a bimah.", "ok": false}], "h": "Describe = what it is like: looks, sounds, feels."}, {"t": "order", "q": "Build the school question.", "tiles": ["Explain", "why", "we light", "the menorah."], "h": "The school word comes first."}, {"t": "order", "q": "Build the school question.", "tiles": ["Describe", "how", "the challah", "smells."], "h": "The school word comes first."}], check:[{"q": "The test says, \"Contrast summer and winter.\" What should Avrumi write about?", "o": ["how they are different", "how they are alike", "why it snows"]}, {"q": "Mr. Halpern wants the boys to tell WHY ice melts in the sun. Which school word will his question use?", "o": ["explain", "describe", "summarize"]}, {"q": "Dovid read a long book about the Chofetz Chaim. His rebbe wants just the main points in three sentences. Which word is in the question?", "o": ["summarize", "describe", "compare"]}], re:[{"q": "Which word asks you to tell what something is like?", "o": ["describe", "explain", "contrast"], "h": "Describe = details: looks, sounds, feels."}, {"q": "Compare means...", "o": ["tell how they are alike", "tell how they are different", "tell why"], "h": "Compare = alike."}, {"q": "Which word asks for the main points only?", "o": ["summarize", "describe", "explain"], "h": "Summarize = main points, few words."}]}

  BITE['READ.VOC.L03.03'] = {"band": "B23", "pic": "🌻", "today": "Join two small words to make one big word", "why": "If you know the two small words, you can figure out the big word.", "ready": [{"q": "Which is a whole word?", "o": ["box", "bx", "oxb"], "a": "box"}], "bridge": "READ.VOC.L03.02", "bridgeName": "Same Root, Same Family", "watch": {"q": "What is a lunchbox?", "m": {"type": "tiles", "w": ["lunch", "box"], "hi": [0, 1]}, "steps": [{"t": "Look for two small words inside: lunch and box.", "m": {"type": "tiles", "w": ["lunch", "box"], "hi": [0, 1]}}, {"t": "The last word tells what it is: a box.", "m": {"type": "tiles", "w": ["lunch", "box"], "hi": [1]}}, {"t": "The first word tells which kind: a box for lunch.", "m": {"type": "tiles", "w": ["lunch", "box"], "hi": [0]}}, {"t": "Same trick: a sunflower is a kind of flower.", "m": {"type": "tiles", "w": ["sun", "flower"], "hi": [1]}}, {"t": "Chant it and push your hands together!", "m": {"type": "chant", "lines": ["Two small words, side by side,", "Make one word, nice and wide!"]}}], "a": "a box for lunch"}, "oops": {"q": "What is a raincoat?", "wrong": "rain on a coat", "right": "a coat for rain", "why": "The last word tells what it is. A raincoat is a coat."}, "ways": ["worked example", "chant", "match", "sort", "word-part builder", "Mistake Detective"], "done": "You can figure out compound words!", "board": {"one": "A compound word is two small words joined: lunch + box. The last word tells what it is.", "activity": "Each boy gets half a word card; he finds the boy with the other half and they say what their compound word means.", "mistakes": ["Calling jumping a compound word", "Mixing up the order: a lunchbox is a lunch for a box", "Splitting in the wrong place: sunflow + er"]}, "do": [{"type": "match", "pairs": [["snow", "man"], ["lunch", "box"], ["tooth", "brush"]], "say": "Match the two halves of each compound word.", "how": "Say them together. Is it a real word?"}, {"type": "sort", "mis": true, "bins"
