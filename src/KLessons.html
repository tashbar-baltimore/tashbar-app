ich'],['buildCount']],\n real:['buildCount',{build:'hex6',intro:'The tiles on the shul floor are hexagons made of triangles.'}],\n check:[['buildshape'],['buildWhich'],['buildCount']]}\n];\n/* ================= RUNNER ================= */\nlet done=Object.assign({},window.KL_DONE||{}); try{ Object.assign(done,JSON.parse(localStorage.getItem('kmath-done')||'{}')||{}); }catch(e){}\nasync function play(spec,mode){ MODE=mode; const [kind,cfg]=spec; const c=Object.assign({},cfg||{}); if(c.intro) await say(c.intro); const r=await G[kind](c); BOT=null; const first=r[0], line=r[1]||''; if(CUR) post({tlK:1, skill:CUR, phase:mode==='check'?'check':'practice', item:String(kind)+(c.intro?' (real life)':''), first:!!first});\n  if(first){ stars++; await say(any(PRAISE)+' '+line); } else await say(line+' Good trying!'); await wait(250); return first; }\nasync function lesson(Ls){ EPOCH++; CUR=Ls.id; stars=0; $('track').hidden=false; $('home').hidden=false; $('h1').innerHTML=Ls.t+' \u003csmall\u003e'+Ls.id+' · '+Ls.sub+'\u003c/small\u003e';\n  station(0); await say('Warm-up!'); for(const s of Ls.warm) await play(s,'help');\n  station(1); await Ls.story();\n  station(2); await say('Movie time! Watch and listen.'); await Ls.movie();\n  station(3); await say('Now let’s do it together!'); for(const s of Ls.together) await play(s,'help');\n  station(4); await say('Your turn to practice!'); for(const s of shuffle(Ls.practice.slice(0,5)).concat(shuffle(Ls.practice.slice(5)))) await play(s,'practice');\n  station(5); await play(Ls.real,'practice');\n  station(6); await say('Quick check. Do it all by yourself!'); let ok=0; for(const s of Ls.check) ok+=(await play(s,'check'))?1:0;\n  station(7); confetti(); chime(); setTimeout(chime,400*FAST); done[Ls.id]=Math.max(done[Ls.id]||0,ok); try{ localStorage.setItem('kmath-done',JSON.stringify(done)); }catch(e){}\n  view('\u003cdiv class=\"start\" id=\"fin\"\u003e\u003cdiv class=\"hero\"\u003e⭐🎉⭐\u003c/div\u003e\u003ch2\u003eYou did it!\u003c/h2\u window.addEventListener('message',e=>{ try{ const d=e.data; if(!d||typeof d!=='object'||(d.tlK!==1&&d.tlKDone!==1)) return;
  const f=document.querySelector('#klov iframe'); if(!f||e.source!==f.contentWindow) return;
  if(typeof A==='undefined'||!A.st||typeof saveStudent!=='function'||typeof SRV==='undefined') return;
  const skill=String(d.skill||''); if(IDS.indexOf(skill)<0) return;
  if(d.tlK===1){ const item=String(d.item||'').replace(/[^A-Za-z0-9 ()-]/g,'').slice(0,60)||'item', ph=d.phase==='check'?'check':'practice', first=!!d.first;
    SRV.pendingEv.push({at:Date.now(),student:A.st.id,skill:'KLESSON.'+skill,phase:ph,item:item,first:first,tries:first?1:2,hints:0,ms:0,ok:true});
    if(SRV.pendingEv.length>50) SRV.pendingEv.splice(0,SRV.pendingEv.length-50); }
  else { const ok=Math.max(0,Math.min(3,Math.round(Number(d.ok)||0))); const st=A.st; if(!st.klm||typeof st.klm!=='object') st.klm={}; st.klm[skill]=Math.max(Number(st.klm[skill])||0,ok); }
  clearTimeout(qT); qT=setTimeout(()=>{ qT=null; try{ saveStudent(A.st); }catch(x){} },2500);
}catch(err){ console.error('K lessons',err); } });
window.KL={ has:id=>IDS.indexOf(String(id))>=0, open:id=>open(String(id||'')), list:()=>LIST.slice(), on:()=>{ try{ return on(A.st); }catch(e){ return false; } } };
})();
</script>
