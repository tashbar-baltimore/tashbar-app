    'READ.COMP.L09.17':{ hook:'A film of a bridge twisting, a chart of a city\'s deaths, a report on why: each tells a different part of the truth.',

      intro:['Decide what you need to know.','Motion? Choose a video.','Numbers over time? Choose a chart.','Reasons? Choose print.'],

    'READ.COMP.L09.19':{ hook:'A dramatic story with a clear lesson is easy to believe. A careful reader checks it first.',
      big:'A claim is a statement someone wants you to accept, like "The parade caused Philadelphia\'s disaster." To check it, find what at least two careful sources say. Do they agree on the facts? Do they show other causes too? How many cases did they study? Then give a verdict. Fully supported: careful sources agree, and nothing else explains it. Partly supported: true, but not the whole story. Not supported: careful sources show it is wrong. The 1918 flu article shows all of this. The parade did spread the flu. But Philadelphia was also a crowded port that the flu reached early, so "the parade alone caused it" is only partly supported.',
      intro:['State the claim exactly.','Find what each source says.','Look for other causes.','Give a verdict: fully, partly or not supported.'],
