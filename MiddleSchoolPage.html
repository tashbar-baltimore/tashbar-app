  {q:'Which sentence is too informal for a business letter?', o:['Hey, gimme the boards ASAP.','Please let me know the total cost.','We would like to place an order.'], h:'Look for slang.'},
  {q:'Proofreading a business letter matters because:', o:['mistakes make the company look careless','it makes the letter longer','teachers like red pens'], h:'Think about the customer.'},
 ],
 check:[
  {q:'Best first sentence for a letter asking a hardware store to donate sandpaper?', o:['Our school trades class is asking local businesses to donate sandpaper for student projects.','Give us sandpaper.','Hello, sandpaper is rough.']},
  {q:'Which closing is professional?', o:['Sincerely,','See ya,','Peace out,']},
  {t:'write', q:'Write a short customer note (4 to 6 sentences) from Tashbar Trades Co. to a family who bought a sefarim shelf. Thank them, explain how to care for the shelf, and invite them to the next market.', min:45, checks:['I used a greeting and a polite closing.','My purpose is clear in the first sentence.','I used a professional tone with no slang.']},
 ]},

'WRIT.RES.L09.03': {name:'Short research report',
 teach:[
  {how:'A research report starts with a thesis: one sentence that says what the report will show.', q:'Best thesis for a report on the Erie Canal?', o:['The Erie Canal made shipping cheaper and helped New York City grow into a major port.','The Erie Canal is a canal.','I like canals.']},
  {how:'Group your notes by subtopic. Each subtopic becomes a paragraph.', q:'Notes: "cost dropped 90%," "opened 1825," "NYC trade grew," "dug by hand." Which two fit a paragraph on economic effects?', o:['cost dropped 90% and NYC trade grew','opened 1825 and dug by hand','dug by hand and NYC trade grew']},
  {how:'End with a conclusion that restates the thesis and why it matters.', q:'Best conclusion sentence?', o:['By lowering costs and linking markets, the Erie Canal changed how America traded.','The end.','Canals have water.']},
 ],
 practice:[
  {q:'Which is a researchable question?', o:['How did the transcontinental railroad change travel times?','Do I like trains?','What is my favorite color?'], h:'It can be answered with facts.'},
  {q:'Which note is a fact you would need to cite?', o:['The railroad was finished in 1869.','Trains are cool.','I want to ride a train.'], h:'Facts from sources get cited.'},
  {q:'What is the best order for a short report?', o:['thesis, body paragraphs, conclusion','conclusion, thesis, body','body only'], h:'Start with what you will show.'},
  {q:'Which detail best supports the thesis "Bees are vital to farming"?', o:['Bees pollinate about one-third of food crops.','Bees are yellow.','Some bees live in hives.'], h:'Which one is about farming?'},
  {q:'Where does the list of sources go?', o:['at the end of the report','in the title','nowhere'], h:'After the conclusion.'},
  {q:'Which is the best report title?', o:['How Glaciers Shaped the Great Lakes','Stuff About Ice','Report'], h:'Specific and clear.'},
 ],
 check:[
  {q:'Best thesis for a report on lighthouses?', o:['Lighthouses saved countless ships by warning sailors of danger before modern navigation.','Lighthouses are tall.','I visited a lighthouse.']},
  {q:'Notes: "warned ships of rocks," "built of stone," "foghorns in bad weather," "keepers lived inside." Which two fit a paragraph on how lighthouses kept ships safe?', o:['warned ships of rocks and foghorns in bad weather','built of stone and keepers lived inside','keepers lived inside and built of stone']},
  {t:'write', p:'Source 1 (Union Pacific history page): Before 1869, crossing the country by wagon took about four to six months.\nSource 2 (National Park Service, Golden Spike): After the railroad opened, a coast-to-coast trip took about a week.', q:'Write one report paragraph (5 to 7 sentences) on how the transcontinental railroad changed travel. Use both sources and name each one.', min:60, checks:['I started with a topic sentence.','I used facts from both sources and named them.','I explained why the change mattered.']},
 ]},
};

/* Math generators, the tape-measure generator and Trades content. Every call makes a fresh item, so retries never repeat. */
const RI=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const PICK=a=>a[Math.floor(Math.random()*a.length)];
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
function fracStr(n,d){ if(d<0){n=-n;d=-d} const g=gcd(n,d); n/=g; d/=g; if(d===1) return String(n);
  const neg=n<0; n=Math.abs(n); const w=Math.floor(n/d), r=n%d; return (neg?'-':'')+(w?w+' ':'')+r+'/'+d; }
function money(c){ return '$'+(c/100).toFixed(2); }
function uniq(list){ const out=[]; for(const x of list){ if(!out.includes(x)) out.push(x); } return out; }
function opts(correct, distract){ const o=uniq([correct, ...distract.filter(x=>x!==correct)]); while(o.length<3) o.push(String(Number(o[o.length-1])+1 || o.length)); return o.slice(0,3); }
const N=(q,a,h,extra)=>Object.assign({t:'num',q,a,h},extra||{});
const M=(q,o,h)=>({q,o,h});

const GEN = {
'MATH.OPS.L03.01': {name:'Add and subtract within 100',
 how:['To add, add the tens, then the ones: 47 + 28 → 60 + 15 = 75.','To subtract, take away the tens, then the ones: 83 − 25 → 63 − 5 = 58.','Check subtraction by adding back: 58 + 25 = 83.'],
 gen(){ if(Math.random()<.5){ const a=RI(12,68), b=RI(11,99-a); return N(`${a} + ${b} = ?`, a+b, 'Add the tens first, then add the ones.'); }
   const a=RI(31,99), b=RI(11,a-6); return N(`${a} − ${b} = ?`, a-b, 'Take away the tens, then the ones. Regroup a ten if you need more ones.'); }},
'MATH.PV.L03.01': {name:'Read, write and compare numbers to 1,000',
 how:['Each digit has a place: 482 = 4 hundreds, 8 tens, 2 ones.','To compare, look at the hundreds first. If they match, look at the tens.','> means greater than. < means less than. The open side faces the bigger number.'],
 gen(){ const k=RI(0,2);
  if(k===0){ const n=RI(102,989); const pl=PICK(['hundreds','tens','ones']); const d={hundreds:Math.floor(n/100),tens:Math.floor(n/10)%10,ones:n%10}[pl]; return N(`What digit is in the ${pl} place of ${n}?`, d, 'Hundreds is the first digit, tens the middle, ones the last.'); }
  if(k===1){ const h=RI(1,9),t=RI(0,9),o=RI(0,9); return N(`${h} hundreds, ${t} tens and ${o} ones make what number?`, h*100+t*10+o, 'Write the hundreds digit, then the tens, then the ones.'); }
  let a=RI(100,999), b=Math.random()<.15?a:RI(100,999); if(Math.random()<.4){ b=Math.floor(a/100)*100+RI(0,99); }
  const s=a>b?'>':a<b?'<':'='; return M(`Which sign goes in the box? ${a} ☐ ${b}`, [s,...['>','<','='].filter(x=>x!==s)], 'Compare the hundreds, then the tens, then the ones.'); }},
'MATH.OPS.L03.02': {name:'Add and subtract within 1,000 with regrouping',
 how:['Line up ones under ones, tens under tens, hundreds under hundreds.','Adding: when a column makes 10 or more, carry 1 to the next column.','Subtracting: when the top digit is too small, borrow 1 from the next column.'],
 gen(){ if(Math.random()<.5){ const a=RI(118,689), b=RI(105,980-a); return N(`${a} + ${b} = ?`, a+b, 'Start with the ones. Carry when a column reaches 10.'); }
   const a=RI(305,990), b=RI(108,a-50); return N(`${a} − ${b} = ?`, a-b, 'Start with the ones. Borrow from the next column when the top digit is smaller.'); }},
'MATH.MEAS.L03.04': {name:'Count money and make change',
 how:['A quarter is 25¢, a dime is 10¢, a nickel is 5¢, a penny is 1¢.','Count the biggest coins first, then add the smaller ones.','Change = what you paid − the price. $1 = 100¢.'],
 gen(){ if(Math.random()<.5){ const q=RI(0,3),d=RI(0,4),n=RI(0,3),p=RI(0,4); if(q+d+n+p===0) return this.gen(); return N(`How many cents? ${q} quarters, ${d} dimes, ${n} nickels, ${p} pennies`, q*25+d*10+n*5+p, 'Quarters 25¢ each, dimes 10¢, nickels 5¢, pennies 1¢.', {unit:'¢'}); }
   const item=PICK(['pencil','eraser','ruler','pack of nails','sticker']); const pr=RI(1,19)*5; return N(`A ${item} costs ${pr}¢. You pay with $1. How much change, in cents?`, 100-pr, '$1 is 100¢. Subtract the price from 100.', {unit:'¢'}); }},

'MATH.OPS.L05.01': {name:'Multiply multi-digit numbers',
 how:['Break the bigger number into parts: 34 × 6 = 30 × 6 + 4 × 6 = 180 + 24 = 204.','For 2-digit × 2-digit, multiply by the ones, then by the tens, then add.','Estimate first to check: 48 × 21 is about 50 × 20 = 1,000.'],
 gen(){ if(Math.random()<.5){ const a=RI(112,899), b=RI(3,9); return N(`${a} × ${b} = ?`, a*b, 'Multiply the hundreds, tens and ones by the small number, then add the parts.'); }
   const a=RI(13,89), b=RI(12,49); return N(`${a} × ${b} = ?`, a*b, `Try ${a} × ${b%10} plus ${a} × ${b-b%10}.`); }},
'MATH.OPS.L05.02': {name:'Long division with remainders',
 how:['Divide, multiply, subtract, bring down. Repeat.','What is left over at the end is the remainder. It must be smaller than the divisor.','Check: quotient × divisor + remainder = the starting number.'],
 gen(){ const d=RI(3,9), qq=RI(21,149), r=RI(0,d-1); const n=qq*d+r; return N(`${n} ÷ ${d} = ?  (type like 23 R4)`, r?`${qq}R${r}`:`${qq}`, `Check with ${d} × your answer + remainder = ${n}.`, {kind:'rem'}); }},
'MATH.FRAC.L05.01': {name:'Equivalent fractions and comparing fractions',
 how:['Multiply the top and bottom by the same number to get an equal fraction: 2/3 = 4/6.','To compare, give both fractions the same bottom number.','With the same bottom, the bigger top is the bigger fraction.'],
 gen(){ if(Math.random()<.5){ const b=RI(2,6), a=RI(1,b-1), k=RI(2,5); const c=`${a*k}/${b*k}`; const ds=[`${a+k}/${b+k}`,`${a*k}/${b*k+1}`,`${a*k+1}/${b*k}`,`${a}/${b*k}`].filter(x=>{const [p,q]=x.split('/').map(Number);return p*b!==a*q}); return M(`Which fraction is equal to ${a}/${b}?`, opts(c,ds), `Multiply ${a} and ${b} by the same number.`); }
   let b1=RI(2,8), a1=RI(1,b1-1), b2=RI(2,8), a2=RI(1,b2-1); const L=a1*b2, R=a2*b1; const s=L>R?'>':L<R?'<':'='; return M(`Which sign goes in the box? ${a1}/${b1} ☐ ${a2}/${b2}`, [s,...['>','<','='].filter(x=>x!==s)], `Rename both with ${b1*b2} on the bottom, then compare the tops.`); }},
'MATH.FRAC.L05.02': {name:'Add and subtract fractions with like denominators',
 how:['Same bottom number? Add or subtract only the tops: 3/8 + 2/8 = 5/8.','The bottom number stays the same.','Simplify if you can: 4/8 = 1/2.'],
 gen(){ const d=RI(4,12); if(Math.random()<.5){ const a=RI(1,d-1), b=RI(1,d-1); return N(`${a}/${d} + ${b}/${d} = ?`, (a+b)/d, `Add the tops: ${a} + ${b}. Keep ${d} on the bottom.`, {kind:'frac'}); }
   const a=RI(2,d), b=RI(1,a-1); return N(`${a}/${d} − ${b}/${d} = ?`, (a-b)/d, `Subtract the tops: ${a} − ${b}. Keep ${d} on the bottom.`, {kind:'frac'}); }},

'MATH.ALG.L07.02': {name:'Ratios and unit rates',
 how:['A unit rate is "per one": the cost of ONE item, miles in ONE hour.','Divide the total by the number of items: $4.50 ÷ 6 pens = $0.75 per pen.','Use unit rates to compare deals: the lower price per item is the better buy.'],
 gen(){ const k=RI(0,2);
  if(k===0){ const n=RI(3,9), u=RI(3,40)*5; const item=PICK(['pens','screws (per pack)','notebooks','pine boards','clamps']); return N(`${n} ${item} cost ${money(n*u)}. What is the cost of 1? (in dollars)`, u/100, `Divide ${money(n*u)} by ${n}.`, {unit:'$'}); }
  if(k===1){ const h=RI(2,6), s=RI(9,14)*5; return N(`A bus travels ${h*s} miles in ${h} hours. How many miles per hour?`, s, `Divide ${h*s} by ${h}.`); }
  const a=RI(3,8), ua=RI(20,60), b=a+RI(2,6), ub=ua+PICK([-6,-3,3,6]); const better=ua<ub?`${a} for ${money(a*ua)}`:`${b} for ${money(b*ub)}`; const worse=ua<ub?`${b} for ${money(b*ub)}`:`${a} for ${money(a*ua)}`; return M(`Which is the better buy? ${a} for ${money(a*ua)} or ${b} for ${money(b*ub)}`, [better,worse,'They cost the same per item'], 'Find the price of ONE in each deal.'); }},
'MATH.ALG.L08.02': {name:'Percents: discounts, tax and interest',
 how:['Percent means "out of 100": 20% = 0.20.','Discount: price × percent = amount off. Sale price = price − amount off.','Tax or interest: amount × percent = the extra. New total = amount + extra.'],
 gen(){ const k=RI(0,2);
  if(k===0){ const p=PICK([10,20,25,50]), pr=RI(2,12)*20; return N(`A drill costs $${pr}. It is ${p}% off. What is the sale price, in dollars?`, pr*(100-p)/100, `${p}% of ${pr} is ${pr*p/100}. Subtract it.`, {unit:'$'}); }
  if(k===1){ const p=PICK([5,6,10]), pr=RI(2,15)*10; return N(`A toolbox costs $${pr} plus ${p}% tax. What is the total, in dollars?`, pr*(100+p)/100, `${p}% of ${pr} is ${(pr*p/100)}. Add it.`, {unit:'$'}); }
  const p=PICK([5,10]), b=RI(2,10)*20; return N(`Your savings of $${b} earn ${p}% interest. How many dollars of interest do you earn?`, b*p/100, `${p}% of ${b} = ${b} × ${p/100}.`); }},
'MATH.NUM.L07.01': {name:'Integers: add and subtract negative numbers',
 how:['On a number line, adding a positive moves right; adding a negative moves left.','Subtracting a number is the same as adding its opposite: 5 − (−3) = 5 + 3 = 8.','Think of temperature: −4° then warming 10° is 6°.'],
 gen(){ let a=RI(-15,15)||-7, b=RI(-15,15)||4; if(Math.random()<.5){ return N(`${a} + (${b}) = ?`, a+b, b<0?'Adding a negative moves left on the number line.':'Adding a positive moves right on the number line.'); }
   return N(`${a} − (${b}) = ?`, a-b, `Change it to adding the opposite: ${a} + (${-b}).`); }},
'MATH.ALG.L07.04': {name:'Write and evaluate expressions',
 how:['To evaluate, put the number in for the letter, then follow order of operations.','3x means 3 times x. When x = 5, 3x + 4 = 15 + 4 = 19.','"5 more than twice n" means 2n + 5.'],
 gen(){ const k=RI(0,2);
  if(k===0){ const a=RI(2,9), b=RI(1,20), x=RI(2,10); return N(`Evaluate ${a}x + ${b} when x = ${x}.`, a*x+b, `${a} × ${x} first, then add ${b}.`); }
  if(k===1){ const a=RI(2,6), b=RI(1,9), x=RI(1,8); return N(`Evaluate ${a}(x + ${b}) when x = ${x}.`, a*(x+b), `Parentheses first: ${x} + ${b}, then multiply by ${a}.`); }
  const a=RI(2,9), b=RI(1,12); const w={2:'twice',3:'three times',4:'four times',5:'five times',6:'six times',7:'seven times',8:'eight times',9:'nine times'}[a];
  return M(`Which expression means "${b} more than ${w} n"?`, [`${a}n + ${b}`,`${b}n + ${a}`,`${a}(n + ${b})`], `"${w} n" is ${a}n. "${b} more" means + ${b}.`); }},

'MATH.ALG.L09.01': {name:'Slope and rate of change',
 how:['Slope = rise ÷ run = (change in y) ÷ (change in x).','From (2, 3) to (6, 11): rise 8, run 4, slope 2.','A negative slope means the line goes down from left to right.'],
 gen(){ const x1=RI(-5,5), y1=RI(-6,6), run=PICK([1,2,3,4]), m=PICK([-3,-2,-1,1,2,3,0.5,-0.5]); const x2=x1+run*(m%1?2:1); const y2=y1+m*(x2-x1); return N(`What is the slope of the line through (${x1}, ${y1}) and (${x2}, ${y2})?`, m, `Rise: ${y2} − (${y1}). Run: ${x2} − (${x1}). Divide.`, {kind:'frac'}); }},
'MATH.FUNC.L09.02': {name:'Graph and write linear equations',
 how:['Slope-intercept form: y = mx + b. m is the slope, b is where the line crosses the y-axis.','A line with slope 3 crossing at (0, 2) is y = 3x + 2.','To find y for a given x, plug x in: y = 3(4) + 2 = 14.'],
 gen(){ const m=PICK([-4,-3,-2,2,3,4,5]), b=RI(-9,9)||3; const fmt=(m,b)=>`y = ${m}x ${b<0?'−':'+'} ${Math.abs(b)}`; const k=RI(0,2);
  if(k===0) return M(`Which equation has slope ${m} and crosses the y-axis at ${b}?`, [fmt(m,b),fmt(b,m),fmt(-m,b)].filter((v,i,a)=>a.indexOf(v)===i).concat([fmt(m,-b)]).slice(0,3), 'y = mx + b: m is the slope, b is the y-intercept.');
  if(k===1) return N(`What is the y-intercept of ${fmt(m,b)}?`, b, 'It is the number added at the end (b).');
  const x=RI(-3,5); return N(`For ${fmt(m,b)}, what is y when x = ${x}?`, m*x+b, `Multiply ${m} × ${x}, then add ${b}.`); }},
'MATH.ALG.L09.04': {name:'Systems of two linear equations',
 how:['A system has two equations. The solution makes BOTH true.','Add the equations to cancel a variable: (x + y) + (x − y) = 2x.','Put your answer back into both equations to check.'],
 gen(){ const x=RI(-4,12), y=RI(-4,12); const ask=PICK(['x','y']); if(Math.random()<.5) return N(`x + y = ${x+y}\nx − y = ${x-y}\nWhat is ${ask}?`, ask==='x'?x:y, 'Add the two equations to get 2x, then find y.', {pre:true});
   const a=RI(2,4); return N(`${a}x + y = ${a*x+y}\nx + y = ${x+y}\nWhat is ${ask}?`, ask==='x'?x:y, `Subtract the second equation from the first to get ${a-1}x.`, {pre:true}); }},
'MATH.ALG.L09.02': {name:'Exponents and scientific notation',
 how:['2⁵ means 2 × 2 × 2 × 2 × 2 = 32.','Multiplying powers of the same base: add the exponents. 3² × 3³ = 3⁵.','Scientific notation: one digit before the decimal, times a power of 10. 4,500,000 = 4.5 × 10⁶.'],
 gen(){ const sup=n=>String(n).split('').map(c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[c]).join(''); const k=RI(0,2);
  if(k===0){ const b=PICK([2,3,4,5,10]), e=b===2?RI(3,7):RI(2,4); return N(`${b}${sup(e)} = ?`, Math.pow(b,e), `Multiply ${b} by itself ${e} times.`); }
  if(k===1){ const b=PICK([2,3,5,7]), e1=RI(2,6), e2=RI(2,6); return N(`${b}${sup(e1)} × ${b}${sup(e2)} = ${b} to what power?`, e1+e2, 'Same base: add the exponents.'); }
  const d=RI(11,99), e=RI(4,8); const n=d*Math.pow(10,e-1); const lead=(d/10).toString(); return M(`Write ${n.toLocaleString('en-US')} in scientific notation.`, [`${lead} × 10${sup(e)}`,`${d} × 10${sup(e-1)}`,`${lead} × 10${sup(e+1)}`], 'Move the decimal until one digit is in front; count the moves.'); }},

'VOC.MEAS.L07.01': {name:'Read a tape measure to 1/16 inch',
 how:['The longest lines mark whole inches. The next longest mark halves, then quarters, then eighths.','The shortest lines are sixteenths. There are 16 in every inch.','Count sixteenths from the last whole inch, then simplify: 6/16 = 3/8.'],
 gen(){ const w=RI(0,2), k=RI(1,15); const pos=w+k/16; const c=fracStr(w*16+k,16)+' in'; const near=[k+1,k-1,k+2,k-2].filter(x=>x>=1&&x<=15&&x!==k).map(x=>fracStr(w*16+x,16)+' in'); return {q:'Where is the red arrow?', o:opts(c,near), h:'Count the small marks from the last whole inch. Each is 1/16.', tape:pos}; }},
};

function rangeBelow(r){ const i=RANGES.indexOf(r); return i>0?RANGES[i-1]:null; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }
function clone(x){ return JSON.parse(JSON.stringify(x)); }
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- missions ---------- */
function prepItem(raw, phase){
 const it=clone(raw); it.phase=phase;
 if(!it.t) it.t = it.tape!==undefined ? 'mc' : (it.o?'mc':'num');
 if(it.t==='mc'){ it.correct=it.o[0]; it.shown=shuffle(it.o); }
 if(it.t==='order'){ it.correct=it.tiles.join(' '); it.shown=shuffle(it.tiles); if(it.shown.join(' ')===it.correct && it.tiles.length>1) it.shown=it.tiles.slice().reverse(); }
 return it;
}
function buildMission(id){
 if(GEN[id]){ const g=GEN[id]; const mk=(ph,i)=>{const it=g.gen(); if(ph==='teach') it.how=g.how[i]; return prepItem(it,ph)};
  return [0,1,2].map(i=>mk('teach',i)).concat([0,1,2,3,4,5].map(i=>mk('practice',i)),[0,1,2].map(i=>mk('check',i))); }
 const s=BANK_ALL[id];
 return s.teach.map(x=>prepItem(x,'teach')).concat(s.practice.map(x=>prepItem(x,'practice')), s.check.map(x=>prepItem(x,'check')));
}
function buildRetry(id){ // second round: practice again, then check again
 const all=buildMission(id); return all.filter(i=>i.phase!=='teach');
}
function buildBoss(c, range){
 const ids=WEEK[c][range]; const out=[];
 ids.forEach(id=>{ let pool;
  if(GEN[id]) pool=[GEN[id].gen(),GEN[id].gen()];
  else pool=shuffle(BANK_ALL[id].practice.concat(BANK_ALL[id].check).filter(x=>x.t!=='write')).slice(0,2);
  pool.forEach(x=>{ const it=prepItem(x,'check'); it.skill=id; out.push(it); }); });
 return shuffle(out);
}
function parseNum(s){
 s=String(s).trim().replace(/[$¢,]/g,'').replace(/\b(in|inches|dollars|cents|mph)\b/gi,'').replace(/[−–]/g,'-').trim();
 if(!s) return NaN;
 let m=s.match(/^(-?)(\d+)\s+(\d+)\/(\d+)$/); if(m){ const v=+m[2]+ (+m[3])/(+m[4]); return m[1]?-v:v; }
 m=s.match(/^(-?\d+)\/(-?\d+)$/); if(m){ return (+m[1])/(+m[2]); }
 if(/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return parseFloat(s);
 return NaN;
}
function checkAnswer(it, ans){
 if(it.t==='mc') return ans===it.correct;
 if(it.t==='order') return ans===it.correct;
 if(it.t==='num'){
  if(it.kind==='rem'){ const n=String(ans).toUpperCase().replace(/\s+/g,'').replace(/R0$/,''); return n===String(it.a); }
  const v=parseNum(ans); return isFinite(v) && Math.abs(v-it.a)<1e-6; }
 if(it.t==='write') return true;
 return false;
}

/* ---------- student state ---------- */
function newStudent(r){ return {id:r.id, name:r.name, ranges:clone(r.ranges), skills:{}, fails:{}, fallback:{}, balance:0, ledger:[], flags:[], writing:{}, signoffs:{}, boss:{}, weekBonus:false, v:1}; }
function pay(st, amt, why){ st.balance=Math.round((Number(st.balance)||0)*100+amt*100)/100; st.ledger.unshift({at:Date.now(), amt, why}); }
function flag(st, text, kind){ st.flags.unshift({at:Date.now(), text, kind:kind||'info', open:true}); }
function mastered(st,id){ return !!(st.skills[id]&&st.skills[id].m); }
function coreList(st,c){ return WEEK[c][st.ranges[c]]; }
function nextFor(st,c){
 if(c==='VOC'){ return WEEK.VOC.find(id=>!mastered(st,id))||null; }
 const fb=st.fallback[c]; if(fb && !mastered(st,fb)) return fb;
 return coreList(st,c).find(id=>!mastered(st,id)) || null;
}
function bossReady(st,c){ return coreList(st,c).every(id=>mastered(st,id)); }
function cellStatus(st,c,id){
 if(mastered(st,id)) return 'done';
 return nextFor(st,c)===id ? 'now' : 'locked';
}
function masteredCount(st){ return Object.values(st.skills).filter(s=>s.m).length; }

/* ---------- store (db capability, with in-memory fallback for previews) ---------- */
const Store = {
 db:null, live:false, roster:null, students:{}, listeners:[],
 async init(){
  try{ const c=window.claude; this.db = c && c.use ? await c.use('db') : null; }catch(e){ this.db=null; }
  if(!this.db){ this.live=false; this.roster=this.roster||{students:[]}; App.render(); return; }
  this.live=true;
  let loaded=false; const timer=setTimeout(()=>{ if(!loaded){ App.note='Saved data hasn’t loaded yet. Check your connection.'; App.render(); } },10000);
  this.db.doc('config/roster').onSnapshot(s=>{ loaded=true; clearTimeout(timer); App.note=''; this.roster=s.exists?s.data():{students:[]}; App.render(); }, e=>{ App.note='Saved data can’t be reached right now.'; App.render(); });
  this.db.collection('students').onSnapshot(q=>{ q.docs.forEach(d=>{ this.students[d.id]=d.data(); }); App.render(); }, ()=>{});
 },
 async verify(who,digits){ const ro=this.roster||{}; const want= who==='staff'? ro.staffCode : ((ro.students||[]).find(r=>r.id===who)||{}).code; return {ok: !!want && digits===String(want)}; },
 student(id){ const r=(this.roster&&this.roster.students||[]).find(x=>x.id===id); if(!r) return null; return this.students[id]?clone(this.students[id]):newStudent(r); },
 async save(st){ st.v=(st.v||0)+1; this.students[st.id]=clone(st); App.render(); if(this.db){ try{ await this.db.doc('students/'+st.id).set(clone(st)); }catch(e){ App.toast('Couldn’t save: '+(e&&e.code||'error')); } } },
 async addEvidence(sid, rows){ const k='ev_'+sid; this[k]=(this[k]||[]).concat(rows);
  if(this.db){ try{ const ref=this.db.doc('evidence/'+sid); const cur=await ref.get(); const old=cur.exists?(cur.data().rows||[]):[]; await ref.set({rows:old.concat(rows).slice(-1500)}); }catch(e){} } },
 async evidence(sid){ if(this.db){ try{ const d=await this.db.doc('evidence/'+sid).get(); return d.exists?(d.data().rows||[]):[]; }catch(e){ return []; } } return this['ev_'+sid]||[]; },
 async resetStudent(id){ const r=this.roster.students.find(x=>x.id===id); const st=newStudent(r); this.students[id]=st; App.render(); if(this.db){ await this.db.doc('students/'+id).set(clone(st)); await this.db.doc('evidence/'+id).set({rows:[]}); } else { this['ev_'+id]=[]; } },
};

/* ---------- sound + speech ---------- */
const FX={ctx:null, on:true,
 tone(f,d,type,when){ if(!this.on) return; try{ this.ctx=this.ctx||new (window.AudioContext||window.webkitAudioContext)(); const c=this.ctx, o=c.createOscillator(), g=c.createGain(); o.type=type||'sine'; o.frequency.value=f; const t=c.currentTime+(when||0); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.18,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+.05);}catch(e){} },
 right(){ this.tone(660,.12,'triangle'); this.tone(990,.18,'triangle',.1); },
 wrong(){ this.tone(220,.18,'sine'); },
 win(){ [523,659,784,1047].forEach((f,i)=>this.tone(f,.22,'triangle',i*.12)); },
};
function speak(text){ try{ if(!('speechSynthesis' in window)) return App.toast('Read-aloud isn’t available on this device.'); speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.rate=.95; speechSynthesis.speak(u);}catch(e){ App.toast('Read-aloud isn’t available here.'); } }

 async signIn(role,sid,token){ this.session={role,sid:sid||null,at:Date.now(),token:token||null}; if(Store.afterSignIn) await Store.afterSignIn(this.session); this.mode=role==='staff'?'staff':'kid'; this.si={step:'pick',who:null,digits:'',tries:0,until:0}; try{ sessionStorage.setItem('tl-session',JSON.stringify(this.session)); }catch(e){} location.hash = role==='kid'?sid:''; this.render(); FX.right(); },
 signOut(){ this.session=null; this.play=null; this.evRows=null; try{ sessionStorage.removeItem('tl-session'); }catch(e){} if(location.hash) location.hash=''; this.render(); if(this._home){ try{ window.top.location.href=this._home; }catch(e){} } },

 renderWeek(st,kid){

 /* ----- play ----- */
 startPlay(kind, id, opt){
  const st=Store.student(this.sid()); if(!st) return;

  if(kind==='boss'){ c=id; items=buildBoss(c, st.ranges[c]); title='Boss challenge'; }
  else if(kind==='revise'){ c=currOf(id); const s=BANK_ALL[id]; const w=s.check.find(x=>x.t==='write'); const it=prepItem(w,'check'); it.prev=st.writing[id].text; it.note=st.writing[id].note; items=[it]; title=skillName(id); }
  else { c=currOf(id); items=buildMission(id); title=skillName(id); }
  this.play={kind, id, c, items, i:0, title, results:[], tries:0, hints:0, t0:Date.now(), fb:null, sel:null, order:[], text:'', ticks:{}, replay:!!(opt&&opt.replay), round:1, reveal:false};

 },
 renderPlay(){
  const p=this.play; if(p.done) return this.renderResult();
  const it=p.items[p.i]; const C=CURR[p.c];

  let passage='';
  if(it.p){ const P=PASS[it.p]; passage = P? `<aside class="passage"><div class="ph"><b>${esc(P.title)}</b><button class="btn sm ghost" data-act="say" data-text="${esc(P.text)}" aria-label="Read the passage aloud">🔊</button></div><div class="ptext">${esc(P.text).replace(/\n/g,'<br>')}</div></aside>` : `<aside class="passage"><div class="ph"><b>Read</b><button class="btn sm ghost" data-act="say" data-text="${esc(it.p)}" aria-label="Read aloud">🔊</button></div><div class="ptext">${esc(it.p).replace(/\n/g,'<br>')}</div></aside>`; }

  let body='';
  const locked = p.fb && (p.fb.ok || it.phase==='check');
  if(it.tape!==undefined) body+=tapeSVG(it.tape);
  if(it.t==='mc') body+=`<div class="opts">${it.shown.map((o,k)=>`<button class="opt ${p.sel===o?(p.fb?(p.fb.ok?'right':'wrongsel'):'sel'):''} ${locked&&o===it.correct&&it.phase!=='check'?'right':''}" data-act="pick" data-k="${k}" ${locked?'disabled':''}>${esc(o)}</button>`).join('')}</div>`;
  if(it.t==='num') body+=`<form class="numrow" data-act="numform"><label for="numin" class="vh">Your answer</label><input id="numin" class="inp big" inputmode="decimal" autocomplete="off" placeholder="${it.unit==='$'?'$':it.unit==='¢'?'¢':'Answer'}" ${locked?'disabled':''}><button class="btn go" ${locked?'disabled':''}>Check</button></form>`;
  if(it.t==='order') body+=`<div class="built" aria-label="Your sentence">${p.order.map((k,j)=>`<button class="tile on" data-act="untile" data-j="${j}" ${locked?'disabled':''}>${esc(it.shown[k])}</button>`).join('')||'<span class="small">Tap the tiles in order.</span>'}</div><div class="tiles">${it.shown.map((t,k)=>p.order.includes(k)?'':`<button class="tile" data-act="tile" data-k="${k}" ${locked?'disabled':''}>${esc(t)}</button>`).join('')}</div>${p.order.length===it.shown.length&&!locked?'<button class="btn go" data-act="ordercheck">Check</button>':''}`;
  if(it.t==='write'){ const words=(p.text.trim().match(/\S+/g)||[]).length; body+=`${it.note?`<div class="how warnbox"><b>Teacher note</b><p>${esc(it.note)}</p></div>`:''}<label for="wr" class="vh">Your writing</label><textarea id="wr" class="inp area" rows="8" placeholder="Write here…">${esc(p.text|| it.prev || '')}</textarea><div class="wc small"><span id="wcount">${words}</span> / ${it.min} words</div><div class="checks">${it.checks.map((c,k)=>`<label class="chk"><input type="checkbox" data-act="tick" data-k="${k}" ${p.ticks[k]?'checked':''}> ${esc(c)}</label>`).join('')}</div><button class="btn go" data-act="submitwrite" id="wsub">Turn it in</button>`; }

  return `<div class="play ${C.cls}"><div class="ptop"><button class="btn sm ghost" data-act="quit" aria-label="Leave the mission">✕</button><div class="ptitle"><span class="mono">${p.kind==='boss'?'BOSS · '+p.c:p.id}</span><b>${C.icon} ${esc(p.title)}</b></div><span class="phase ph-${it.phase}">${p.kind==='boss'?'Boss':phaseName}</span></div>
   <div class="dots" aria-label="Item ${p.i+1} of ${p.items.length}">${dots}</div>
   <div class="pbody ${passage?'withp':''}">${passage}<div class="qcard">${how}${q}${body}${fb}${next}</div></div></div>`;
 },

  const p=this.play, it=p.items[p.i]; const ok=checkAnswer(it,ans);

 async finish(){
  const p=this.play; const st=Store.student(this.sid()); p.done=true;
  const rows=p.results.filter(Boolean).map(r=>({at:Date.now(), student:st.id, skill:r.skill, phase:p.kind==='boss'?'boss':r.phase, item:r.q, first:r.first, tries:r.tries, hints:r.hints, ms:r.ms, ok:r.ok}));
  const checks=p.results.filter(r=>r&&r.phase==='check');
  p.payout=[];
  if(p.kind==='revise'){ const w=st.writing[p.id]; w.text=p.text; w.status='pending'; w.rev=(w.rev||0)+1; pay(st,PAY.revise,`Revision: ${p.id}`); p.payout.push(['Revision',PAY.revise]); flag(st,`${p.id} writing revised, ready to review`,'review'); p.outcome='revised'; }
  else if(p.kind==='boss'){ const right=checks.filter(r=>r.ok).length; p.score=right; if(right>=7){ if(!st.boss[p.c]){ st.boss[p.c]=true; pay(st,PAY.boss,`Boss challenge: ${CURR[p.c].label}`); p.payout.push(['Boss win',PAY.boss]); } p.outcome='bosswin'; } else p.outcome='bossmiss'; }
  else if(p.replay){ p.outcome= checks.every(r=>r.ok)?'replayok':'replaymiss'; }
  else {
   const allOk = checks.length===3 && checks.every(r=>r.ok); const id=p.id;
   if(allOk){ const first=!(st.fails[id]>0); st.skills[id]={m:true, at:Date.now(), first}; pay(st,PAY.skill,`Mastered ${id}`); p.payout.push(['Skill mastered',PAY.skill]);
    if(first){ pay(st,PAY.first,`First-try bonus: ${id}`); p.payout.push(['First try',PAY.first]); }
    if(!st.weekBonus && masteredCount(st)>=3){ st.weekBonus=true; pay(st,PAY.week3,'3 skills this week'); p.payout.push(['3 skills this week',PAY.week3]); }
    const c=currOf(id); if(st.fallback[c]===id){ delete st.fallback[c]; flag(st,`${id} review mastered; back to ${coreList(st,c).find(x=>!mastered(st,x))||'the week plan'}`,'info'); }
    if(p.text){ st.writing[id]={text:p.text, status:'pending', at:Date.now()}; }
    p.outcome='mastered';
   } else {
    st.fails[id]=(st.fails[id]||0)+1; p.outcome='retry';
    if(p.text){ st.writing[id]={text:p.text, status:'draft', at:Date.now()}; }
    if(st.fails[id]>=2){ const c=currOf(id); const below=c==='VOC'?null:rangeBelow(st.ranges[c]);
     if(below && !st.fallback[c]){ const pre=WEEK[c][below][3]; if(!mastered(st,pre)){ st.fallback[c]=pre; p.outcome='dropped'; p.pre=pre; flag(st,`Missed ${id} twice. Moved to prerequisite ${pre} (Range ${below}).`,'drop'); st.fails[id]=0; } else { flag(st,`Missed ${id} twice; prerequisite ${pre} already mastered. Please check in.`,'drop'); } }
     else if(!below){ flag(st,`Missed ${id} twice at Range A. Please check in.`,'drop'); }
    }
   }
  }
  await Store.addEvidence(st.id, rows);
  await Store.save(st);
  if(p.payout.length){ FX.win(); setTimeout(confetti,30); }
 },
 renderResult(){
  const p=this.play; const C=CURR[p.c]; const tot=(p.payout||[]).reduce((a,x)=>a+x[1],0);

 async onClick(e){
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act;
  if(['tick','numform'].includes(a)) return;
  const p=this.play;
  if(a==='say'){ speak(b.dataset.text); return; }
  if(a==='signout') return this.signOut();
  if(a==='si-pick'){ this.si.step='code'; this.si.who=b.dataset.sid; this.si.digits=''; this.si.err=false; return this.render(); }
  if(a==='si-staff'){ this.si.step='code'; this.si.who='staff'; this.si.digits=''; this.si.err=false; return this.render(); }
  if(a==='si-back'){ this.si.step='pick'; this.si.who=null; this.si.digits=''; this.si.err=false; return this.render(); }
  if(a==='si-key'){ if(this.si.digits.length<4){ this.si.digits+=b.dataset.k; this.si.err=false; } return this.render(); }
  if(a==='si-del'){ this.si.digits=this.si.digits.slice(0,-1); return this.render(); }
  if(a==='si-go'){ const si=this.si; if(si.busy) return; si.busy=true; let res; try{ res=await Store.verify(si.who, si.digits); }catch(err){ res={ok:false}; } si.busy=false;
   if(res&&res.ok){ return this.signIn(si.who==='staff'?'staff':'kid', si.who==='staff'?null:si.who, res.token); }
   si.tries++; si.digits=''; si.err=true; FX.wrong(); if(si.tries>=5||(res&&res.wait)){ si.until=Date.now()+30000; si.tries=0; setTimeout(()=>this.render(),30500); } return this.render(); }
  if(a==='play') return this.startPlay('mission', b.dataset.id);
  if(a==='replay') return this.startPlay('mission', b.dataset.id, {replay:true});
  if(a==='boss') return this.startPlay('boss', b.dataset.c);
  if(a==='revise') return this.startPlay('revise', b.dataset.id);
  if(a==='quit'){ this.play=null; this.render(); return; }
  if(a==='pick'&&p){ const it=p.items[p.i]; p.sel=it.shown[+b.dataset.k]; return this.answer(p.sel); }
  if(a==='tile'&&p){ p.order.push(+b.dataset.k); p.fb=null; return this.render(); }
  if(a==='untile'&&p){ p.order.splice(+b.dataset.j,1); p.fb=null; return this.render(); }
  if(a==='ordercheck'&&p){ const it=p.items[p.i]; const ans=p.order.map(k=>it.shown[k]).join(' '); this.answer(ans); if(!p.fb.ok && it.phase!=='check'){ p.order=[]; this.render(); } return; }
  if(a==='submitwrite'&&p){ const it=p.items[p.i]; const words=(p.text.trim().match(/\S+/g)||[]).length; if(words<it.min) return this.toast(`Write at least ${it.min} words. You have ${words}.`); if(it.checks.some((c,k)=>!p.ticks[k])) return this.toast('Tick each box when your writing does it.'); this.answer(p.text); return; }
  if(a==='next'&&p) return this.next();
  if(a==='retry'&&p){ const id=p.id; this.play=null; this.startPlay('mission', id); this.play.items=buildRetry(id); this.render(); return; }
  const sid=this.sid(); if(!sid) return; const st=Store.student(sid);
  if(a==='range'){ const c=b.dataset.c, i=RANGES.indexOf(st.ranges[c])+(+b.dataset.d); if(i<0||i>3) return; st.ranges[c]=RANGES[i]; delete st.fallback[c]; if(Store.setRange) Store.setRange(st.id,c,RANGES[i]); flag(st,`${CURR[c].label} moved to Range ${RANGES[i]} by staff`,'info'); st.flags[0].open=false; await Store.save(st); this.toast(`${CURR[c].label} is now Range ${RANGES[i]}.`); }
  if(a==='approve'){ st.writing[b.dataset.id].status='approved'; await Store.save(st); this.toast('Approved.'); }
  if(a==='sendback'){ const id=b.dataset.id; const n=document.getElementById('note-'+id); st.writing[id].status='revise'; st.writing[id].note=(n&&n.value.trim())||'Please revise and add more detail.'; await Store.save(st); this.toast('Sent back. He’ll see a Revise button.'); }
  if(a==='signoff'){ const id=b.dataset.id; st.signoffs[id]={at:Date.now()}; pay(st,PAY.signoff,`Hands-on sign-off: ${id}`); await Store.save(st); this.toast('Signed off.'); }
  if(a==='dismiss'){ st.flags[+b.dataset.i].open=false; await Store.save(st); }
  if(a==='reset'){ this.confirm=sid; this.render(); }
  if(a==='reset-no'){ this.confirm=null; this.render(); }
  if(a==='reset-yes'){ this.confirm=null; await Store.resetStudent(sid); this.evRows=null; this.toast(`${sid} reset.`); this.render(); }
  if(a==='ev-load'){ this.evRows={sid, rows:await Store.evidence(sid)}; this.render(); }
  if(a==='ev-csv'){ const rows=await Store.evidence(sid); const csv=['timestamp,student_id,skill_id,phase,item,correct,first_try,attempts,hints,seconds'].concat(rows.map(r=>[new Date(r.at).toISOString(),r.student,r.skill,r.phase,'"'+String(r.item).replace(/"/g,'""')+'"',r.ok?1:0,r.first?1:0,r.tries,r.hints,Math.round(r.ms/1000)].join(','))).join('\n');
   let saved=false; try{ const dl=window.claude&&await window.claude.use('downloads'); if(dl){ await dl.save({filename:`evidence-${sid}.csv`, data:csv}); saved=true; } }catch(err){}
   if(!saved){ try{ await navigator.clipboard.writeText(csv); this.toast('CSV copied. Paste it into the Sheet.'); }catch(err){ this.toast('Couldn’t export here.'); } } }
 },
 onInput(e){ const p=this.play; if(!p) return; if(e.target.id==='wr'){ p.text=e.target.value; const w=document.getElementById('wcount'); if(w) w.textContent=(p.text.trim().match(/\S+/g)||[]).length; }
  if(e.target.dataset&&e.target.dataset.act==='tick'){ p.ticks[e.target.dataset.k]=e.target.checked; } },
};
function fracOrNum(it){ if(it.kind==='rem') return String(it.a).replace('R',' R'); if(it.kind==='frac') return fracStr(Math.round(it.a*16000),16000); return (Math.round(it.a*100)/100).toString(); }

/* ---------- tape measure drawing ---------- */
function tapeSVG(pos){
 const W=640, x0=20, inch=200; let t='';
 for(let k=0;k<=48;k++){ const x=x0+k*inch/16; const h= k%16===0?46: k%8===0?34: k%4===0?26: k%2===0?19:12; t+=`<line x1="${x}" y1="10" x2="${x}" y2="${10+h}" class="tk"/>`; if(k%16===0) t+=`<text x="${x+4}" y="74" class="tn">${k/16}</text>`; }
 const ax=x0+pos*inch;
 return `<div class="tape"><svg viewBox="0 0 ${W} 110" role="img" aria-label="Tape measure with a red arrow"><rect x="10" y="8" width="${W-20}" height="72" rx="6" class="tb"/>${t}<path d="M${ax} 82 l-9 20 h18 z" class="arr"/><line x1="${ax}" y1="8" x2="${ax}" y2="84" class="arrl"/></svg></div>`;
}
/* ---------- confetti ---------- */
function confetti(){ const cv=document.getElementById('conf'); if(!cv||matchMedia('(prefers-reduced-motion: reduce)').matches) return; const r=cv.getBoundingClientRect(); cv.width=r.width; cv.height=r.height; const g=cv.getContext('2d'); const cols=['#5B3BE0','#F2B705','#1C7F4D','#2F6FE4','#D9661F'];
 const ps=Array.from({length:90},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,s:5+Math.random()*6,c:PICK(cols),r:Math.random()*6}));
 let f=0; (function step(){ g.clearRect(0,0,cv.width,cv.height); ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1; g.save(); g.translate(p.x,p.y); g.rotate(p.r); g.fillStyle=p.c; g.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); g.restore();}); if(++f<150) requestAnimationFrame(step); else g.clearRect(0,0,cv.width,cv.height); })(); }

/* ---------- Apps Script store: saves to the school staging Google Sheet ---------- */
(function(){
 if(!(window.google && google.script && google.script.run)) return;
 const run=(fn,...args)=>new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e))[fn](...args));
 const tok=()=>App.session&&App.session.token;
 Object.assign(Store,{
  live:true, pendingEv:{},
  async init(){
   try{ const b=await run('msBootstrap'); this.roster={students:b.students}; App.note=''; }
   catch(e){ App.note='The school database can’t be reached right now. Try again in a minute.'; this.roster={students:[]}; }
   if(App.session&&App.session.token){ try{ await this.reload(); }catch(e){ App.signOut(); } }
   App.render();
  },
  async reload(){ const d=await run('msLoad', tok()); this.roster={students:d.roster.length?d.roster:this.roster.students}; this.students={}; Object.entries(d.states||{}).forEach(([k,v])=>this.students[k]=v); App.render(); },
  async verify(who,digits){ return await run('msSignIn', who, digits); },
  async afterSignIn(sess){ App.session=sess; await this.reload(); },
  async save(st){
   const prev=this.students[st.id]; const prevLen=prev?(prev.ledger||[]).length:0;
   const bank=st.ledger.slice(0, Math.max(0, st.ledger.length-prevLen));
   const ev=this.pendingEv[st.id]||[]; this.pendingEv[st.id]=[];
   st.v=(st.v||0)+1; this.students[st.id]=clone(st); App.render();
   try{ const r=await run('msSave', tok(), st.id, clone(st), ev, bank); if(r&&typeof r.balance==='number'&&this.students[st.id]){ this.students[st.id].balance=r.balance; if(Array.isArray(r.ledger)) this.students[st.id].ledger=r.ledger; App.render(); } }
   catch(e){ App.toast('Couldn’t save to the school database. Check the Wi-Fi, then try again.'); }
  },
  async addEvidence(sid, rows){ this.pendingEv[sid]=(this.pendingEv[sid]||[]).concat(rows); },
  async evidence(sid){ try{ return await run('msEvidence', tok(), sid); }catch(e){ return []; } },
  async resetStudent(id){ await run('msReset', tok(), id); delete this.students[id]; App.render(); },
  setRange(sid,c,r){ run('msSetRange', tok(), sid, c, r).catch(()=>App.toast('Couldn’t save the range change.')); },
 });
})();

App.start();

/* TL-015 corner balance (boy's view) + TL-017 best built-in Google voice. */
(function(){
 'use strict';
 const nlScore=v=>{const n=String(v.name||''),g=/google/i.test(n),nat=/natural|neural|enhanced|premium|\bhd\b|wavenet|studio|chirp|journey/i.test(n);return (g?1000:0)+(g&&nat?400:0)+(/^google us english$/i.test(n)?200:0)+(/en[-_]US/i.test(v.lang)?60:/en[-_]GB/i.test(v.lang)?30:0)+(/microsoft mark/i.test(n)?300:0)+(!g&&nat?150:0)+(v.localService?5:0)-(/espeak|compact|novelty|whisper|bad news|bells|zarvox|albert|bubbles|cellos|jester|organ|superstar|trinoids|wobble/i.test(n)?900:0);};
 let nlPicked=null;
 function nlVoice(){try{if(nlPicked)return nlPicked;const vs=window.speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));const best=vs.slice().sort((a,b)=>nlScore(b)-nlScore(a))[0]||null;if(best)nlPicked=best;return best;}catch(e){return null;}}
 try{if(window.speechSynthesis&&window.speechSynthesis.addEventListener)window.speechSynthesis.addEventListener('voiceschanged',()=>{nlPicked=null;});}catch(e){}
 try{if(window.speechSynthesis&&!window.speechSynthesis.__nl){const ss=window.speechSynthesis,orig=ss.speak.bind(ss);
  ss.speak=function(u){try{if(u&&!u.voice){const v=nlVoice();if(v){u.voice=v;u.lang=v.lang;}else if(!ss.getVoices().length){let done=false;const go=()=>{if(done)return;done=true;try{const w=nlVoice();if(w){u.voice=w;u.lang=w.lang;}}catch(e){}orig(u);};try{ss.addEventListener('voiceschanged',go,{once:true});}catch(e){}setTimeout(go,1200);return;}}}catch(e){}return orig(u);};ss.__nl=true;window.nlVoice=nlVoice;}}catch(e){}
 let shown=null,who='',actx=null;
 function coin(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;actx=actx||new AC();const t=actx.currentTime;[[1319,0,.09],[1760,.08,.18]].forEach(([f,s,d])=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+s);g.gain.exponentialRampToValueAtTime(.16,t+s+.012);g.gain.exponentialRampToValueAtTime(.0001,t+s+d);o.connect(g);g.connect(actx.destination);o.start(t+s);o.stop(t+s+d+.03);});}catch(e){}}
 function paint(){try{
  const s=App.session,b=document.getElementById('td-corner')||(()=>{const x=document.createElement('button');x.id='td-corner';x.type='button';x.onclick=()=>{const k=document.querySelector('.ledger');if(k)k.scrollIntoView({behavior:'smooth',block:'center'});};document.body.append(x);return x;})();
  if(!s||s.role!=='kid'||!s.sid){b.hidden=true;shown=null;return;}
  if(who!==s.sid){who=s.sid;shown=null;}
  const st=Store&&Store.students&&Store.students[s.sid],v=Math.round((Number(st&&st.balance)||0)*100);
  b.hidden=false;if(v===shown)return;
  b.innerHTML='<span class="td-coin" aria-hidden="true">$</span><b>$'+td(v/100)+'</b>';b.setAttribute('aria-label','My bank: $'+td(v/100)+'. Tap to see my bank statement.');
  if(shown!==null&&v>shown){b.classList.remove('td-pop');void b.offsetWidth;b.classList.add('td-pop');coin();const p=document.createElement('span');p.className='td-plus';p.setAttribute('aria-hidden','true');p.textContent='+$'+td((v-shown)/100);b.append(p);setTimeout(()=>p.remove(),1700);}
  shown=v;}catch(e){}}
 try{const r=App.render.bind(App);App.render=function(){const out=r.apply(this,arguments);paint();return out;};}catch(e){}
 setInterval(paint,1500);paint();
})();
