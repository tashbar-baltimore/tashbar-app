<script>
/* Reading curriculum content. Convention: o[0] is the correct option (shuffled on screen). */
const PASS = {
shtender: {title:'The Shtender', text:`On Sunday morning, Avi went to his grandfather's workshop behind the house. Zeidy was building a shtender for the shul.

"You can help me sand the top," Zeidy said. He gave Avi a block of wood wrapped in sandpaper. Avi rubbed the wood in long, smooth lines, the way Zeidy showed him. By lunchtime the top felt as smooth as glass.

In the afternoon, they screwed the legs on and carried the shtender to the shul together. The gabbai put it at the front, right next to the aron kodesh.`},
siddur: {title:'The Lost Siddur', text:`After Mincha on Tuesday, Moshe could not find his siddur. He looked under his seat and on the bookshelf. Then he remembered: he had used it on the bus that morning.

Moshe ran outside just as the bus driver, Mr. Klein, was walking toward the building. In his hand was a small blue siddur. "I found this on the back seat," Mr. Klein said.

Moshe thanked him and wrote his name inside the cover so it would never get lost again.`},
bridge: {title:'The Brooklyn Bridge', text:`When the Brooklyn Bridge opened in 1883, it was the longest suspension bridge in the world. Its chief engineer, John Roebling, died from an injury before construction began, so his son Washington took over.

Washington Roebling became sick from working deep under the river in the caissons, the huge underwater boxes used to build the towers' foundations. Unable to visit the site, he watched through a telescope from his window and sent instructions every day.

The work was dangerous. More than twenty workers died during the fourteen years of building. Still, the bridge was built to last. Roebling made it six times stronger than it needed to be. More than 140 years later, over 100,000 vehicles cross it every day.`},
railroad: {title:'The Transcontinental Railroad', text:`In 1869, workers drove a final spike at Promontory Summit, Utah, joining two railroads into one line across the country. Before that, a trip from New York to California took months by wagon or by ship around South America. After the railroad, the same trip took about a week.

Building it was brutal work. Crews blasted tunnels through solid granite in the Sierra Nevada mountains, sometimes moving forward only a foot a day. Thousands of workers from China did much of this dangerous work for the Central Pacific line.`},
broken: {title:'The Broken Shtender', text:`Shlomo had worked on his shtender for three weeks in Trades Co. It was his first big project, and he planned to give it to his father for his birthday.

On Thursday, as he carried it across the shop, he tripped on a cord. The shtender hit the floor, and one leg snapped. Shlomo felt his face get hot. He wanted to throw the pieces in the scrap bin and never think about it again.

Mr. Adler, the shop teacher, picked up the broken leg and turned it over. "The break is clean," he said. "A good joint will make it stronger than before. But it's your choice."

Shlomo stared at the pieces for a long time. Then he picked up a clamp. He stayed after school twice that week, gluing and shaping a new joint.

On Sunday, he gave his father the shtender. His father ran his hand over the repaired leg. "This is the best part," he said.`},
longway: {title:'The Long Way Home', text:`Pinchas was the fastest runner in his grade, and he knew it. During the yeshiva field day, he raced ahead of everyone in the long run.

Near the finish, he heard a shout behind him. A younger boy, Hillel, had fallen and was holding his ankle. Pinchas could hear the other runners catching up.

He stopped, turned around and jogged back. He helped Hillel stand and walked him slowly to the first-aid table. Pinchas finished the race last.

That afternoon, the menahel handed out the awards. The last one was a new award, made that day. It said "True Winner" and had Pinchas's name on it.`},
drill: {title:'Cordless Drill: Quick Start', text:`1. Charge the battery fully before first use (about 1 hour). The light turns green when charged.
2. Slide the battery into the handle until it clicks.
3. Set the direction switch: push right for forward (drilling), left for reverse (removing screws).
4. Turn the clutch ring to choose torque. Lower numbers (1–5) for small screws; higher numbers (15–20) for large screws. Use the drill symbol for drilling holes.
5. Always wear safety glasses.

WARNING: Do not use near water. Remove the battery before changing bits.`},

• 3 shelves — 14 inches each

Kerf: allow 1/8 inch for each saw cut.
Note: Cut sides first. Sand all edges before assembly.`},
};

'READ.VOC.L04.01': {name:'Use context clues for new words',
 teach:[
  {how:'Look at the words around a hard word. They often explain it.', q:'"The road was so narrow that only one car could pass." Narrow means:', o:['not wide','very long','bumpy']},
  {how:'Sometimes the sentence gives the opposite. Look for "but" or "unlike."', q:'"Yosef was timid, but his brother was bold and loud." Timid means:', o:['shy','brave','noisy']},
  {how:'Sometimes the sentence gives examples.', q:'"Hand tools, such as hammers and saws, hung on the wall." Hand tools are:', o:['tools you hold and use by hand','tools that run on power','tools for cooking']},
 ],
 practice:[
  {q:'"The bread was stale, hard and dry from sitting out all week." Stale means:', o:['old and dry','fresh','sweet'], h:'The clue words are "hard and dry."'},
  {q:'"The rebbe was elated when the whole class knew the answer; he smiled from ear to ear." Elated means:', o:['very happy','angry','tired'], h:'How does someone feel when he smiles from ear to ear?'},
  {q:'"The path was hazardous, with loose rocks and a steep drop." Hazardous means:', o:['dangerous','pretty','easy'], h:'Loose rocks and a steep drop are a clue.'},
  {q:'"Dovid was famished after the long fast and ate two bowls of soup." Famished means:', o:['very hungry','full','sleepy'], h:'He ate two bowls after a fast.'},
  {q:'"Unlike the fragile glass cup, the metal cup did not break when it fell." Fragile means:', o:['easy to break','heavy','shiny'], h:'"Unlike" tells you it is the opposite of not breaking.'},
  {q:'"The boys had to conserve water on the trip, using only a little each day." Conserve means:', o:['save','spill','heat'], h:'Using only a little each day is a clue.'},
 ],
 check:[
  {q:'"The workshop was cluttered, with wood scraps and tools covering every table." Cluttered means:', o:['messy and full','clean','empty']},
  {q:'"Chaim was reluctant to jump in the cold lake and waited a long time." Reluctant means:', o:['not wanting to','excited','fast']},
  {q:'"The old bridge was sturdy enough to hold a heavy truck." Sturdy means:', o:['strong','weak','new']},
 ]},

  {p:'shtender', how:'"Who" questions ask about a person. Find the name in the story.', q:'Who was building the shtender?', o:['Zeidy','Avi','the gabbai']},
  {p:'shtender', how:'"When" questions ask about time. Look for a day or a time word.', q:'When did Avi go to the workshop?', o:['Sunday morning','Friday afternoon','Monday night']},

 ],

  {p:'shtender', q:'Who put the shtender at the front?', o:['the gabbai','Avi','Zeidy'], h:'Look at the last sentence.'},

 ],
 check:[

  {p:'siddur', q:'Where had he used it that morning?', o:['on the bus','in the shul','at home']},

'READ.COMP.L05.01': {name:'Main idea and supporting details',
 teach:[
  {how:'The main idea is what the whole paragraph is mostly about. The details support it.', p:'Honeybees are busy workers. Some bees gather nectar from flowers. Others guard the hive. Still others take care of the young bees. Every bee has a job.', q:'What is the main idea?', o:['Every bee in a hive has a job.','Bees guard the hive.','Flowers have nectar.']},
  {how:'A detail is one small part. The main idea covers all the details.', p:'A good hammer has a few important parts. The head strikes the nail. The claw pulls nails out. The handle gives you grip and swing.', q:'What is the main idea?', o:['A hammer has parts that each do a job.','The claw pulls nails out.','Handles are made of wood.']},
  {how:'Often the first sentence states the main idea.', p:'Baltimore has a long history as a port city. Ships have brought goods into its harbor for over 250 years. Today, huge cargo ships still unload cars and machines there.', q:'What is the main idea?', o:['Baltimore has long been an important port.','Cargo ships are huge.','Cars come from far away.']},
 ],
 practice:[
  {p:'Camels are built for the desert. Their humps store fat for energy. Their wide feet keep them from sinking in sand. Long eyelashes keep sand out of their eyes.', q:'What is the main idea?', o:["Camels' bodies help them live in the desert.",'Camels have long eyelashes.','Sand is hot.'], h:'Which choice covers ALL the details, not just one?'},
  {p:'Saving money takes a plan. First, decide what you are saving for. Next, set aside a little each week. Finally, don’t spend it on things you don’t need.', q:'What is the main idea?', o:['Saving money takes a plan.','Decide what you want.','Spending is fun.'], h:'Look at the first sentence.'},
  {p:'Before the Erie Canal, moving goods from New York City to the Great Lakes took weeks by wagon. After the canal opened in 1825, boats did it in days, and shipping costs fell sharply.', q:'What is the main idea?', o:['The Erie Canal made shipping goods much faster and cheaper.','Wagons were slow.','The canal opened in 1825.'], h:'What changed because of the canal?'},
  {p:'Many animals get ready for winter. Squirrels bury nuts. Some birds fly south. Bears eat a lot and then sleep for months.', q:'What is the main idea?', o:['Animals prepare for winter in different ways.','Bears sleep in winter.','Birds fly south.'], h:'Squirrels, birds and bears are all examples of what?'},
  {p:'A sharp saw is safer than a dull one. A dull saw needs more force, so it can slip. A sharp saw cuts with less pushing and stays on the line.', q:'What is the main idea?', o:['A sharp saw is safer to use than a dull one.','Saws can slip.','Lines guide a cut.'], h:'Look at the first sentence.'},
  {p:'The human heart is a strong pump. It beats about 100,000 times a day. With each beat it pushes blood through the whole body.', q:'What is the main idea?', o:['The heart is a powerful pump that never stops working.','Blood moves.','Bodies are big.'], h:'What are all the details about?'},
 ],
 check:[
  {p:'Lighthouses kept sailors safe for hundreds of years. Their bright lights warned ships away from rocks. Their horns sounded in fog. Each one had a keeper who kept the light burning all night.', q:'What is the main idea?', o:['Lighthouses helped keep ships safe.','Lighthouses had keepers.','Fog is thick.']},
  {p:'Recycling paper helps in several ways. It saves trees. It uses less water than making new paper. It also keeps trash out of landfills.', q:'What is the main idea?', o:['Recycling paper has many benefits.','Paper comes from trees.','Landfills are full.']},
  {p:'Ants work as a team. When one ant finds food, it leaves a scent trail. Other ants follow the trail and carry the food home together.', q:'What is the main idea?', o:['Ants work together to find and carry food.','Ants leave a scent.','Food is heavy.']},
 ]},

'READ.COMP.L05.02': {name:'Sequence and cause and effect',
 teach:[
  {how:'Signal words like first, next, then and finally show order.', p:'First, Eli measured the board. Next, he marked a line. Then he cut along the line. Finally, he sanded the edge.', q:'What did Eli do right after he marked the line?', o:['cut along the line','sanded the edge','measured the board']},
  {how:'A cause is WHY something happened. The effect is WHAT happened. Look for "because" or "so."', p:'Because it rained all night, the baseball field was full of puddles, so the game was moved to Monday.', q:'Why was the game moved?', o:['The field was full of puddles from the rain.','It was Monday.','The players were tired.']},
  {how:'One effect can cause another, like a chain.', p:'The power went out during the storm. The freezer stopped working, so the ice cream melted.', q:'What caused the ice cream to melt?', o:['The freezer stopped when the power went out.','The storm was loud.','It was summer.']},
 ],
 practice:[
  {p:'Shimon forgot to water the plant for two weeks. Its leaves turned brown and dry.', q:'What was the effect of forgetting to water the plant?', o:['The leaves turned brown and dry.','Shimon forgot.','Plants need sun.'], h:'The effect is what happened.'},
  {p:'To make the challah, Ari’s father mixed the dough, let it rise for an hour, braided it, and then baked it.', q:'What happened right after the dough rose?', o:['It was braided.','It was mixed.','It was baked.'], h:'Find "rise," then read the next step.'},
  {p:'The bus was late, so Yehuda missed the start of davening. He davened quickly, then joined the class.', q:'Why did Yehuda miss the start of davening?', o:['The bus was late.','He davened quickly.','He joined the class.'], h:'Look before the word "so."'},
  {p:'In the spring, the snow on the mountains melts. The water flows into rivers. The rivers rise and sometimes flood the towns nearby.', q:'What happens right before the rivers rise?', o:['The water flows into the rivers.','The towns flood.','It is winter.'], h:'Put the events in a line.'},
  {p:'The class saved money for three weeks. Then they voted on a prize. Finally, they bought a new basketball.', q:'What did the class do first?', o:['saved money for three weeks','voted on a prize','bought a basketball'], h:'Look for the first event.'},
  {p:'A frost hit the orchard in May. Many apple blossoms froze, so the farmer picked far fewer apples that fall.', q:'What was one effect of the May frost?', o:['The farmer picked fewer apples.','It was May.','The orchard was big.'], h:'What happened because of the frost?'},
 ],
 check:[
  {p:'Menachem left his bike in the rain for a week. The chain rusted, so now it squeaks and is hard to pedal.', q:'Why is the bike hard to pedal?', o:['The chain rusted in the rain.','Menachem is tired.','The bike is new.']},
  {p:'First, turn off the power. Next, remove the old bulb. Then screw in the new bulb. Last, turn the power back on.', q:'What is the second step?', o:['Remove the old bulb.','Turn off the power.','Screw in the new bulb.']},
  {p:'The town built a new bridge over the river. Now trucks no longer drive through the center of town, and the streets are quieter.', q:'What made the streets quieter?', o:['Trucks use the new bridge instead of driving through town.','The river is wide.','The town is small.']},
 ]},

'READ.COMP.L06.01': {name:'Make inferences from clues',
 teach:[
  {how:'An inference uses clues in the text plus what you already know. The text does not say it straight out.', p:'Binyamin’s shoes were muddy, his coat was wet, and he was shivering when he came in.', q:'What can you infer?', o:['It was rainy and cold outside.','It was a sunny day.','Binyamin was at home all day.']},
  {how:'Ask yourself: which clues point to the answer?', p:'Mr. Levy looked at the clock, tapped his foot and sighed. The bus was twenty minutes late.', q:'How does Mr. Levy probably feel?', o:['impatient','happy','sleepy']},
  {how:'Pick the answer the clues support best, not just one that could be true.', p:'The table was set with the white cloth, two candlesticks and a covered challah.', q:'What is most likely about to happen?', o:['a Shabbos meal','a science class','a ball game']},
 ],
 practice:[
  {p:'Yitzy grinned and held up his test so everyone could see it.', q:'What can you infer?', o:['He did well on the test.','He failed the test.','He lost his test.'], h:'Would you show everyone a bad test?'},
  {p:'The ground was covered with branches, and a tree lay across the road.', q:'What most likely happened?', o:['There was a strong storm.','It was a calm night.','Someone planted a tree.'], h:'What knocks down trees?'},
  {p:'Reuven yawned again and again and rubbed his eyes during the shiur.', q:'What can you infer?', o:['Reuven is tired.','Reuven is hungry.','Reuven is excited.'], h:'Yawning and rubbing eyes are clues.'},
  {p:'The baker came out covered in flour, holding a tray of fresh rolls.', q:'What was the baker just doing?', o:['baking','painting','driving'], h:'Flour and fresh rolls.'},
  {p:'Every seat was full, and people stood along the walls to hear the speaker.', q:'What can you infer about the speaker?', o:['Many people wanted to hear him.','No one liked him.','He spoke very quietly.'], h:'Why would people stand to listen?'},
  {p:'Akiva checked his list twice, packed his tefillin, and set his alarm for 5:30.', q:'What can you infer?', o:['He has an early trip or day tomorrow.','He plans to sleep late.','He lost his tefillin.'], h:'Why set an alarm so early and pack?'},
 ],
 check:[
  {p:'The puppy’s tail wagged fast, and it ran in circles when the boys came home.', q:'How does the puppy feel?', o:['excited','scared','bored']},
  {p:'Nosson’s hands were covered in sawdust, and there was a pencil behind his ear.', q:'Where was Nosson most likely?', o:['in the woodshop','at the swimming pool','at the dentist']},
  {p:'The lights in the store were off, and a sign on the door said "See you Sunday."', q:'What can you infer?', o:['The store is closed now.','The store is having a sale.','The store just opened.']},
 ]},

'READ.VOC.L06.01': {name:'Greek and Latin roots',
 teach:[
  {how:'Roots carry meaning. "port" means carry: a portable tool can be carried.', q:'What does "transport" mean?', o:['carry across','look across','write across']},
  {how:'"graph" means write. An autograph is a name you write yourself.', q:'A paragraph is something that is:', o:['written','heard','carried']},
  {how:'"tele" means far. A telescope helps you see far away.', q:'Which word means "sound from far away"?', o:['telephone','microphone','photograph']},
 ],
 practice:[
  {q:'"aqua" means water. An aquarium holds:', o:['water and fish','books','tools'], h:'Think water.'},
  {q:'"spect" means look. To inspect means to:', o:['look at closely','carry in','write down'], h:'spect = look.'},
  {q:'"bio" means life. Biology is the study of:', o:['living things','rocks','numbers'], h:'bio = life.'},
  {q:'"micro" means small. A microscope helps you see:', o:['very small things','things far away','sounds'], h:'micro = small.'},
  {q:'"struct" means build. A structure is something:', o:['built','written','seen'], h:'struct = build.'},
  {q:'"dict" means say. To predict is to:', o:['say before it happens','look again','carry away'], h:'pre = before, dict = say.'},
 ],
 check:[
  {q:'"geo" means earth. Geography is the study of:', o:['the earth and its places','stars','music']},
  {q:'"aud" means hear. An audience is a group that:', o:['listens','writes','builds']},
  {q:'"therm" means heat. A thermometer measures:', o:['temperature','distance','weight']},
 ]},

'READ.COMP.L07.01': {name:'Cite text evidence for an answer',
 teach:[
  {p:'bridge', how:'Evidence is the exact sentence that proves an answer. Pick the one that would convince someone.', q:'Which sentence shows the bridge was a record-breaker?', o:['When the Brooklyn Bridge opened in 1883, it was the longest suspension bridge in the world.','The work was dangerous.','His son Washington took over.']},
  {p:'bridge', how:'Make sure the evidence matches the claim, not just the topic.', q:'Claim: Washington Roebling kept leading the work even when he was sick. Best evidence?', o:['Unable to visit the site, he watched through a telescope from his window and sent instructions every day.','Washington Roebling became sick from working deep under the river.','Still, the bridge was built to last.']},
  {p:'bridge', how:'Choose the most specific sentence.', q:'Claim: Building the bridge cost lives. Best evidence?', o:['More than twenty workers died during the fourteen years of building.','The work was dangerous.','It was the longest suspension bridge in the world.']},
 ],
 practice:[
  {p:'bridge', q:'Claim: The bridge was built to be very strong. Best evidence?', o:['Roebling made it six times stronger than it needed to be.','The bridge opened in 1883.','Its chief engineer was John Roebling.'], h:'Look for a sentence about strength.'},
  {p:'bridge', q:'Claim: The bridge is still important today. Best evidence?', o:['More than 140 years later, over 100,000 vehicles cross it every day.','Still, the bridge was built to last.','The work was dangerous.'], h:'Which sentence talks about today?'},
  {p:'bridge', q:'Which detail explains why Washington Roebling became sick?', o:['He worked deep under the river in the caissons.','He watched through a telescope.','His father was the chief engineer.'], h:'Find the word "sick."'},
  {p:'bridge', q:'Claim: John Roebling never saw construction begin. Best evidence?', o:['John Roebling died from an injury before construction began.','His son Washington took over.','It was the longest suspension bridge.'], h:'Find "before construction."'},
  {p:'bridge', q:'Which words explain what caissons are?', o:["the huge underwater boxes used to build the towers' foundations",'the longest suspension bridge in the world','over 100,000 vehicles cross it every day'], h:'Look right after the word "caissons."'},
  {p:'bridge', q:'How long did it take to build the bridge?', o:['fourteen years','six years','140 years'], h:'Look in the sentence about workers.'},
 ],
 check:[
  {p:'railroad', q:'Claim: The railroad made cross-country travel much faster. Best evidence?', o:['After the railroad, the same trip took about a week.','Building it was brutal work.','In 1869, workers drove a final spike at Promontory Summit.']},
  {p:'railroad', q:'Claim: Some of the work went very slowly. Best evidence?', o:['Crews blasted tunnels through solid granite, sometimes moving forward only a foot a day.','Thousands of workers from China did much of this dangerous work.','The railroad joined two lines into one.']},
  {p:'railroad', q:'Claim: Before the railroad, travel west was hard. Best evidence?', o:['A trip from New York to California took months by wagon or by ship around South America.','Workers drove a final spike at Promontory Summit, Utah.','After the railroad, the same trip took about a week.']},
 ]},

'READ.COMP.L07.02': {name:'Write an objective summary',
 teach:[
  {how:'A summary gives the main points, short, in your own words. It leaves out small details.', p:'The Wright brothers ran a bicycle shop in Ohio. They used money from the shop to build gliders and test their ideas about flight. In 1903, at Kitty Hawk, North Carolina, they flew the first powered airplane for 12 seconds.', q:'Which is the best objective summary?', o:['The Wright brothers used money from their bicycle shop to develop flight and flew the first powered airplane in 1903.','The Wright brothers were the most amazing inventors ever.','The first flight lasted 12 seconds.']},
  {how:'An objective summary leaves out opinions. No "I think," no "amazing."', p:'Maple syrup comes from the sap of maple trees. In early spring, farmers drill small holes and collect the sap. They boil it for hours until most of the water is gone. It takes about 40 gallons of sap to make one gallon of syrup.', q:'Which is the best objective summary?', o:['Farmers collect maple sap in spring and boil it for hours; about 40 gallons of sap make one gallon of syrup.','Maple syrup is the best topping in the world.','Farmers drill small holes.']},
  {how:'Keep the main events in order.', p:'Yaakov wanted to join the chess club, but he kept losing. He studied one opening every night for a month. At the next tournament, he won three games.', q:'Which is the best objective summary?', o:['Yaakov kept losing at chess, studied every night for a month, and then won three tournament games.','I think Yaakov should have tried harder sooner.','Yaakov studied one opening.']},
 ],
 practice:[
  {p:'Coral reefs cover a tiny part of the ocean floor, yet about a quarter of all ocean fish live around them. Warmer water can cause corals to turn white and die. Scientists are testing ways to grow new coral and replant reefs.', q:'Which is the best objective summary?', o:['Coral reefs support many fish, are harmed by warming water, and scientists are trying to regrow them.','Coral reefs are beautiful and everyone should visit one.','Corals can turn white.'], h:'Find the choice with every main point and no opinion.'},
  {p:'The Pony Express carried mail between Missouri and California in 1860 and 1861. Riders changed horses every 10 to 15 miles and delivered letters in about ten days. It ended when the telegraph line was finished.', q:'Which is the best objective summary?', o:['The Pony Express delivered mail across the West in about ten days until the telegraph replaced it in 1861.','The Pony Express riders were the bravest people in history.','Riders changed horses often.'], h:'"Bravest" is an opinion. One detail is not a summary.'},
  {p:'Dovid’s family moved to a new city. At first he missed his friends. Then he joined the afternoon basketball league, and by Chanukah he had made two close friends.', q:'Which is the best objective summary?', o:['After moving, Dovid missed his old friends, joined a basketball league, and made new friends by Chanukah.','Moving is always hard and nobody likes it.','Dovid joined a basketball league.'], h:'Keep the events in order.'},
  {p:'Volcanoes form where melted rock, called magma, pushes up through cracks in the earth’s crust. When magma reaches the surface it is called lava. Over many eruptions, layers of cooled lava can build a mountain.', q:'Which is the best objective summary?', o:['Volcanoes form when magma rises through the crust, erupts as lava, and builds up layers over time.','Volcanoes are the scariest thing in nature.','Magma is melted rock.'], h:'Which choice covers the whole process?'},
  {p:'A town wanted a new playground. Students wrote letters to the town council, raised money at a bake sale, and helped plan the design. The playground opened the next summer.', q:'Which is the best objective summary?', o:['Students wrote letters, raised money and helped plan, and the new playground opened the next summer.','The students’ bake sale had great cookies.','The town council got letters.'], h:'Main events, in order, no opinion.'},
  {p:'Honey almost never spoils. It has very little water and is slightly acidic, so germs cannot grow in it. Jars of honey thousands of years old have been found still safe to eat.', q:'Which is the best objective summary?', o:['Honey lasts a very long time because its low water and acid stop germs from growing.','Honey is the tastiest food there is.','Old jars of honey were found.'], h:'"Tastiest" is an opinion.'},
 ],
 check:[
  {p:'Benjamin Franklin started a library in Philadelphia so people could share books. Members paid a small fee, and the money bought more books. It became one of the first lending libraries in America.', q:'Which is the best objective summary?', o:['Franklin started a library in Philadelphia where members’ fees bought shared books; it was one of America’s first lending libraries.','Franklin was a genius who did everything right.','Members paid a small fee.']},
  {p:'Ezra broke his arm in the fall and could not write for six weeks. He learned to type with one hand and finished all his assignments on time.', q:'Which is the best objective summary?', o:['Ezra broke his arm, learned to type with one hand, and still finished his work on time.','Ezra was very unlucky.','Ezra could not write.']},
  {p:'Glaciers are huge sheets of ice that move slowly downhill. As they move, they scrape rock and carve valleys. Many lakes in the northern United States were formed by glaciers long ago.', q:'Which is the best objective summary?', o:['Glaciers are slow-moving ice that carve the land, forming valleys and many northern U.S. lakes.','Glaciers are amazing and cold.','Glaciers scrape rock.']},
 ]},

'READ.LIT.L07.01': {name:'Character, conflict and theme',
 teach:[
  {p:'broken', how:'A character’s actions and words show what he is like.', q:'What does Shlomo’s choice to stay after school show about him?', o:['He doesn’t give up.','He is careless.','He doesn’t care about his father.']},
  {p:'broken', how:'The conflict is the problem the main character faces.', q:'What is Shlomo’s main conflict?', o:['His shtender breaks and he must decide whether to fix it.','He can’t find the shop.','His father doesn’t like woodwork.']},
  {p:'broken', how:'The theme is the lesson the story teaches. It applies beyond this one story.', q:'Which is the best theme?', o:['Fixing a mistake can make something better than before.','Shops are dangerous.','Birthdays are fun.']},
 ],
 practice:[
  {p:'broken', q:'How did Shlomo feel right after the leg snapped?', o:['upset and embarrassed','proud','bored'], h:'Look at "face get hot" and what he wanted to do.'},
  {p:'broken', q:'What caused the shtender to break?', o:['Shlomo tripped on a cord.','Mr. Adler dropped it.','The wood was rotten.'], h:'Look at Thursday.'},
  {p:'broken', q:'What role does Mr. Adler play?', o:['He guides Shlomo but lets him decide.','He fixes the shtender for him.','He makes Shlomo throw it away.'], h:'Read his last words: "it’s your choice."'},
  {p:'broken', q:'What is the turning point of the story?', o:['Shlomo picks up a clamp.','Shlomo trips on the cord.','Shlomo starts the project.'], h:'When does Shlomo decide what to do?'},
  {p:'broken', q:'Why does his father say "This is the best part"?', o:['The repair shows Shlomo’s effort and growth.','The leg is a different color.','He didn’t notice the repair.'], h:'He ran his hand over the repaired leg.'},
  {p:'broken', q:'How does Shlomo change in the story?', o:['He goes from wanting to quit to working hard to fix it.','He goes from happy to angry.','He does not change.'], h:'Compare the beginning and the end.'},
 ],
 check:[
  {p:'longway', q:'What is Pinchas’s conflict?', o:['He must choose between winning and helping Hillel.','He forgets the race route.','He is too slow.']},
  {p:'longway', q:'What does stopping to help show about Pinchas?', o:['He cares more about others than about winning.','He was tired.','He didn’t like running.']},
  {p:'longway', q:'Which is the best theme?', o:['Kindness matters more than winning.','Running is good exercise.','Field days are long.']},
 ]},

'READ.VOC.L08.01': {name:'Figurative language',
 teach:[
  {how:'A simile compares two things using "like" or "as."', q:'"The gym was as hot as an oven." This is a:', o:['simile','fact','question']},
  {how:'A metaphor compares by saying one thing IS another.', q:'"The classroom was a beehive of activity." What does it mean?', o:['The room was busy and full of movement.','There were bees in the class.','The class was quiet.']},
  {how:'An idiom is a saying that does not mean its exact words.', q:'"It’s raining cats and dogs." What does it mean?', o:['It is raining very hard.','Animals are falling.','It is a light rain.']},
 ],
 practice:[
  {q:'"Chaim was a rock for his friends." This means Chaim was:', o:['dependable and strong','hard and cold','heavy'], h:'What is good about a rock?'},
  {q:'"The old car coughed and groaned up the hill." Giving a thing human actions is called:', o:['personification','simile','rhyme'], h:'Cars don’t really cough. People do.'},
  {q:'"I’ve told you a million times." This big exaggeration is called:', o:['hyperbole','simile','fact'], h:'Not really a million.'},
  {q:'"Hit the books" means:', o:['study hard','hit something','throw books'], h:'It’s an idiom.'},
  {q:'"His words were as sharp as a knife." This means his words were:', o:['hurtful','helpful','quiet'], h:'What does a sharp knife do?'},
  {q:'"Time flies when you’re learning something fun." This means:', o:['Time seems to pass quickly.','Clocks have wings.','Time stops.'], h:'How fast do flying things move?'},
 ],
 check:[
  {q:'"The wind howled through the trees." This is:', o:['personification','simile','hyperbole']},
  {q:'"The test was a breeze." This means the test was:', o:['easy','windy','long']},
  {q:'"Moshe was as quiet as a mouse." This is a:', o:['simile','metaphor','idiom']},
 ]},

'READ.COMP.L09.01': {name:'Judge an argument’s claims and evidence',
 teach:[
  {how:'The claim is what the writer wants you to believe or do.', p:'Our school should start a woodshop. Students who learn trades gain skills they can use for life. A survey of local builders found that 7 out of 10 cannot find enough trained workers.', q:'What is the writer’s claim?', o:['The school should start a woodshop.','7 out of 10 builders can’t find workers.','Students gain skills.']},
  {how:'Strong evidence is a fact, number or example that is relevant and reliable.', p:'Our school should start a woodshop. Students who learn trades gain skills they can use for life. A survey of local builders found that 7 out of 10 cannot find enough trained workers.', q:'Which is the strongest evidence in the paragraph?', o:['the survey of local builders','the word "should"','the title "school"']},
  {how:'Weak evidence: one person’s story, a feeling, or something unrelated.', p:'Phones should be banned during class. My friend’s cousin says phones made his grades worse.', q:'Why is this evidence weak?', o:['One person’s story isn’t enough to prove it.','It uses numbers.','It is about phones.']},
 ],
 practice:[
  {p:'The city should add bike lanes on Park Avenue. Last year, 40 bike accidents happened there, and cities that added lanes saw accidents drop by about half.', q:'How strong is the evidence?', o:['Strong: it gives local numbers and results from other cities.','Weak: it is only an opinion.','Weak: it is unrelated to bikes.'], h:'Does it use facts tied to the claim?'},
  {p:'Everyone should eat breakfast because it is the best meal and I always feel great after it.', q:'What is the main weakness?', o:['It relies on the writer’s own feelings, not facts.','It has too many statistics.','It is too long.'], h:'Where is the proof?'},
  {p:'Recess should be longer. Studies show students pay better attention after active breaks. Also, longer recess is more fun.', q:'Which reason is the least strong evidence?', o:['Longer recess is more fun.','Students pay better attention after breaks.','Studies were done.'], h:'Which one is just a feeling?'},
  {p:'We should not build the new mall, because the people who want it are greedy.', q:'What is wrong with this argument?', o:['It attacks people instead of giving reasons about the mall.','It uses too much evidence.','It has no claim.'], h:'Is "greedy" a reason about the mall?'},
  {p:'Last year our library lent 80,000 books and ran 300 free classes, and half its visitors have no internet at home.', q:'Which claim does this evidence best support?', o:['Libraries are still needed.','Books are old.','Internet is expensive.'], h:'What do all three facts show?'},
  {p:'Either we cancel the trip or the whole school will fail its exams.', q:'What is the problem with this reasoning?', o:['It gives only two choices when there are more.','It uses a statistic.','It is about a trip.'], h:'Are there really only two options?'},
 ],
 check:[
  {p:'Our town should plant more trees. Trees lower summer temperatures on streets by several degrees, and a city study found shaded streets need less road repair.', q:'How strong is this evidence?', o:['Strong: it gives facts and a study connected to the claim.','Weak: it is a personal story.','Weak: it is off topic.']},
  {p:'This game is the best because everybody is buying it.', q:'What is the weakness?', o:['Being popular doesn’t prove it is the best.','It gives too many facts.','It is too short.']},
  {p:'Students should learn to budget. In one survey, most adults said they wished they had learned about money in school, and students in budgeting classes saved more later.', q:'What is the claim?', o:['Students should learn to budget.','Adults wished they learned about money.','Students saved more.']},
 ]},

'READ.LIT.L09.01': {name:'Author’s purpose and point of view',
 teach:[
  {how:'Authors write to inform, to persuade, or to entertain.', p:'Lightning heats the air around it to about 50,000°F, which is hotter than the surface of the sun.', q:'The author’s main purpose is to:', o:['inform','persuade','entertain']},
  {how:'First person uses "I" and "we." Third person uses "he" and "they."', p:'I tightened the last screw and stepped back. My first shelf actually stood straight.', q:'What point of view is this?', o:['first person','third person','second person']},
  {how:'The author’s viewpoint is his opinion. Strong words give it away.', p:'Wasting food is a shameful habit we must break today.', q:'What is the author’s viewpoint on wasting food?', o:['It is wrong and must stop.','It doesn’t matter.','It is sometimes good.']},
 ],
 practice:[
  {p:'Come to the Trades Co. market this Sunday! Every shelf is handmade, and every purchase supports student workers.', q:'The author’s purpose is to:', o:['persuade','inform','entertain'], h:'Is he trying to get you to do something?'},
  {p:'The ostrich tried to hide behind a lamppost, but its long neck stuck out like a flagpole, and all the birds laughed.', q:'The author’s purpose is to:', o:['entertain','inform','persuade'], h:'Is this meant to be funny?'},
  {p:'Dovid looked at the broken window. He knew he should tell the truth, but his stomach twisted.', q:'What point of view is this?', o:['third person','first person','second person'], h:'Look for "he" or "I."'},
  {p:'Some people think homework helps students practice. Others think it takes away family time. Both sides have research to back them up.', q:'What is the author’s viewpoint here?', o:['The author stays neutral and presents both sides.','The author is against homework.','The author loves homework.'], h:'Does he pick a side?'},
  {p:'The new bridge is a disaster: ugly, overpriced and late.', q:'Which words show the author’s viewpoint?', o:['disaster, ugly, overpriced','the new bridge','is'], h:'Look for strong opinion words.'},
  {p:'A healthy plant needs light, water and air. Without light, plants cannot make food.', q:'Why did the author write this?', o:['to explain what plants need','to sell plants','to tell a funny story'], h:'Is he teaching, selling or joking?'},
 ],
 check:[
  {p:'You need to see this exhibit. It’s the best one the museum has ever had, and tickets are almost gone!', q:'The author’s purpose is to:', o:['persuade','inform','entertain']},
  {p:'We hiked for hours, and I was sure we were lost until I spotted the trail marker.', q:'What point of view is this?', o:['first person','third person','second person']},
  {p:'Bees pollinate about one-third of the food crops we eat, including apples and almonds.', q:'The author’s purpose is to:', o:['inform','persuade','entertain']},
 ]},

'READ.COMP.L09.02': {name:'Read technical documents',
 teach:[
  {p:'drill', how:'Technical writing gives steps in order. Read each step fully before acting.', q:'What must you do before first use?', o:['Charge the battery fully.','Change the bit.','Set the clutch to 20.']},
  {p:'drill', how:'Look for the exact detail: numbers, settings, colors.', q:'How do you know the battery is charged?', o:['The light turns green.','The drill beeps.','It gets warm.']},
  {p:'drill', how:'Warnings tell you what NOT to do. They matter most.', q:'What should you do before changing a bit?', o:['Remove the battery.','Charge the battery.','Turn the clutch to 1.']},
 ],
 practice:[
  {p:'drill', q:'You want to remove a screw. Which way should the direction switch go?', o:['left','right','up'], h:'Step 3.'},
  {p:'drill', q:'Which clutch setting is best for a small screw?', o:['3','18','the drill symbol'], h:'Step 4: lower numbers for small screws.'},
  {p:'drill', q:'Which setting should you use to drill a hole?', o:['the drill symbol','1','5'], h:'End of step 4.'},
  {p:'drill', q:'Where should you NOT use the drill?', o:['near water','in a workshop','on wood'], h:'Read the warning.'},
  {p:'drill', q:'What should you always wear?', o:['safety glasses','a watch','gloves with fringes'], h:'Step 5.'},
  {p:'drill', q:'How long does the first charge take?', o:['about 1 hour','about 5 minutes','about 1 day'], h:'Step 1.'},
 ],
 check:[
  {p:'cutsheet', q:'Which pieces should be cut first?', o:['the sides','the shelves','it doesn’t matter']},
  {p:'cutsheet', q:'How many shelf pieces are needed?', o:['3','2','5']},
  {p:'cutsheet', q:'What must you do before assembly?', o:['Sand all edges.','Paint the board.','Charge the drill.']},
 ]},

'READ.COMP.L09.03': {name:'Check facts across sources',
 teach:[
  {how:'When sources disagree, trust the one that is more reliable and more recent.', p:'Source A (encyclopedia, 2024): Mount Everest is 29,032 feet tall.\nSource B (travel brochure, 1985): Mount Everest is about 29,000 feet tall.', q:'Which source should you use for the exact height?', o:['Source A: it is recent and from a reference work.','Source B: it is older.','Neither: they disagree completely.']},
  {how:'A fact that two reliable sources agree on is well supported.', p:'Source A (encyclopedia): The Chesapeake Bay is the largest estuary in the United States.\nSource B (Maryland state website): The Chesapeake Bay is the nation’s largest estuary.', q:'What can you conclude?', o:['Both reliable sources agree, so the fact is well supported.','The sources disagree.','Neither source can be trusted.']},
  {how:'An opinion is not a fact, even when it appears in a source.', p:'Blog post: The Erie Canal was the most boring project ever built.', q:'Can you use this as a fact in a report?', o:['No, it is an opinion.','Yes, it is from a blog.','Yes, it uses the word "most."']},
 ],
 practice:[
  {p:'Source A (science museum website): Light from the sun takes about 8 minutes to reach Earth.\nSource B (forum comment): Sunlight reaches us instantly.', q:'Which is more reliable?', o:['Source A','Source B','Both equally'], h:'Who wrote each one?'},
  {p:'Source A (2010 guide): The town has 12,000 people.\nSource B (2023 census): The town has 14,500 people.', q:'Which number should a report use for today?', o:['14,500','12,000','the average of the two'], h:'Which is newer and official?'},
  {p:'Source A (encyclopedia): The Liberty Bell is in Philadelphia.\nSource B (National Park Service): The Liberty Bell is displayed in Philadelphia, Pennsylvania.', q:'What do the sources show?', o:['They agree on the fact.','They disagree.','Neither is reliable.'], h:'Compare what they say.'},
  {p:'Advertisement: Our glue is the strongest in the world!', q:'How should a researcher treat this?', o:['As a sales claim that needs checking.','As a proven fact.','As a scientific study.'], h:'Who benefits from the claim?'},
  {p:'Source A says a project took 14 years. Source B says it took 12 years.', q:'What is the best next step?', o:['Check a third reliable source.','Pick the bigger number.','Use both numbers without explaining.'], h:'How do you break a tie?'},
  {p:'Source: a history textbook written by a professor, with a list of references.', q:'Why is this likely reliable?', o:['An expert wrote it and lists references.','It is long.','It has pictures.'], h:'Think about who wrote it.'},
 ],
 check:[
  {p:'Source A (personal website, no author): Spiders are insects.\nSource B (university biology page): Spiders are arachnids, not insects.', q:'Which should you trust?', o:['Source B','Source A','Both']},
  {p:'Source A (2005 map): The highway has 4 lanes.\nSource B (2024 state road report): The highway was widened to 6 lanes in 2019.', q:'How many lanes does the highway have now?', o:['6','4','5']},
  {p:'Opinion column: Baseball is the greatest sport ever invented.', q:'How should this be used in a report?', o:['As one person’s opinion, not a fact.','As a proven fact.','As data.']},
 ]},
};

/* Writing curriculum content (WRIT + LANG). o[0] correct. t:'order' tiles in correct order. t:'write' open writing. */
const WRIT = {
'LANG.SENT.L03.01': {name:'Complete sentences: fix fragments and run-ons',
 teach:[
  {how:'A complete sentence has a subject (who) and a predicate (what he does), and it is a complete thought.', q:'Which is a complete sentence?', o:['The boys built a birdhouse.','Built a birdhouse.','The boys with the hammer.']},
  {how:'A fragment is missing a part. Ask: Who? Did what?', q:'"Running down the hall." What is missing?', o:['who is running','an ending mark','a verb']},
  {how:'A run-on joins two sentences with no break. Fix it with a period, or with a comma and "and," "but" or "so."', q:'Which fixes the run-on "I finished my work I went outside"?', o:['I finished my work. I went outside.','I finished my work I, went outside.','I finished. my work I went outside.']},
 ],
 practice:[
  {q:'Which is a complete sentence?', o:['Yossi fixed the chair.','Fixed the chair yesterday.','Yossi and the chair.'], h:'Who? Did what? Both must be there.'},
  {q:'Which is a fragment?', o:['Because it was raining.','It was raining.','We stayed inside.'], h:'Which one leaves you waiting for more?'},
  {q:'Which is a run-on?', o:['The bell rang we ran to class.','The bell rang, and we ran to class.','The bell rang.'], h:'Look for two sentences with no break.'},
  {q:'Fix: "The saw is sharp be careful."', o:['The saw is sharp. Be careful.','The saw is sharp be. Careful.','The saw, is sharp be careful.'], h:'Split the two thoughts with a period.'},
  {q:'Which is a complete sentence?', o:['After Maariv, we went home.','After Maariv.','Went home after Maariv.'], h:'Who went home?'},
  {q:'"The tall boy in the front row." What does it need?', o:['a predicate (what he did)','a subject','a capital letter'], h:'We know who. What did he do?'},
 ],
 check:[
  {q:'Which is a complete sentence?', o:['The shop smells like fresh wood.','Smells like fresh wood.','The shop with fresh wood.']},
  {q:'Which is a fragment?', o:['When the bus came.','The bus came.','We got on the bus.']},
  {q:'Fix: "My brother likes math he solves puzzles every day."', o:['My brother likes math. He solves puzzles every day.','My brother likes math he. Solves puzzles every day.','My brother, likes math he solves puzzles every day.']},
 ]},

'LANG.MECH.L04.01': {name:'Capitals, end marks and commas in a list',
 teach:[
  {how:'Start every sentence with a capital. Names of people, places and days get capitals too.', q:'Which is correct?', o:['On Monday, Eli went to Baltimore.','on Monday, Eli went to baltimore.','On monday, eli went to Baltimore.']},
  {how:'A statement ends with a period. A question ends with a question mark. Strong feeling ends with an exclamation point.', q:'Which mark ends this? "Where is the tape measure_"', o:['?','.','!']},
  {how:'Put commas between three or more items in a list.', q:'Which is correct?', o:['We need nails, screws, and glue.','We need nails screws and glue.','We need, nails screws, and glue.']},
 ],
 practice:[
  {q:'Which is correct?', o:['Mr. Stern lives on Park Heights Avenue.','mr. stern lives on park heights avenue.','Mr. stern lives on Park heights Avenue.'], h:'Names of people and streets get capitals.'},
  {q:'Which mark ends this? "Watch out for the falling board_"', o:['!','?','.'], h:'It is a warning with strong feeling.'},
  {q:'Which is correct?', o:['I packed a ruler, a pencil, and an eraser.','I packed a ruler a pencil, and an eraser.','I packed, a ruler, a pencil and, an eraser.'], h:'A comma goes after each item except the last.'},
  {q:'Which word should always start with a capital letter?', o:['Tuesday','morning','table'], h:'Days of the week are names.'},
  {q:'Which mark ends this? "The shelf has three boards_"', o:['.','?','!'], h:'It just tells a fact.'},
  {q:'Which is correct?', o:['Did you finish the cut list?','did you finish the cut list?','Did you finish the cut list.'], h:'Capital first, and it asks something.'},
 ],
 check:[
  {q:'Which is correct?', o:['On Friday, Avi and Shmuel cleaned the shop.','on friday, Avi and shmuel cleaned the shop.','On Friday avi and Shmuel cleaned the Shop.']},
  {q:'Which is correct?', o:['Bring a hammer, a saw, and a clamp.','Bring a hammer a saw and a clamp.','Bring, a hammer a saw, and a clamp.']},
  {q:'Which mark ends this? "How long is the board_"', o:['?','.','!']},
 ]},

'WRIT.SENT.L04.01': {name:'Combine sentences with and, but, so',
 teach:[
  {how:'Use "and" to join two ideas that go together.', q:'Combine: "Eli measured the board. Eli cut the board."', o:['Eli measured and cut the board.','Eli measured the board but cut the board.','Eli measured the board so Eli cut.']},
  {how:'Use "but" to show a difference.', q:'Combine: "The saw is old. It still cuts well."', o:['The saw is old, but it still cuts well.','The saw is old, so it still cuts well.','The saw is old, and it is new.']},
  {how:'Use "so" to show a result.', q:'Combine: "It was raining. We played inside."', o:['It was raining, so we played inside.','It was raining, but we played inside.','It was raining and, we played inside.']},
 ],
 practice:[
  {t:'order', q:'Build one sentence from: "The glue was wet. We waited."', tiles:['The glue was wet,','so','we waited.'], h:'Cause first, then "so," then the result.'},
  {t:'order', q:'Build one sentence from: "Yosef likes math. He likes science."', tiles:['Yosef','likes','math','and','science.'], h:'Start with who, end with the second subject.'},
  {q:'Choose the joining word: "I studied hard, ___ I passed the test."', o:['so','but','or'], h:'Passing was the result.'},
  {q:'Choose the joining word: "The box was heavy, ___ we carried it together."', o:['so','but','or'], h:'Carrying it together was the result.'},
  {t:'order', q:'Build one sentence from: "The shop was noisy. Dovid stayed focused."', tiles:['The shop was noisy,','but','Dovid stayed focused.'], h:'These two ideas are different. Use "but."'},
  {q:'Choose the joining word: "Chaim wanted to play, ___ he had to finish his work first."', o:['but','so','and'], h:'He wanted one thing, but had to do another.'},
 ],
 check:[
  {q:'Combine: "The board was too long. Avi cut it."', o:['The board was too long, so Avi cut it.','The board was too long, but Avi cut it.','The board was too long and, Avi.']},
  {t:'order', q:'Build one sentence from: "Menachem sanded the shelf. He painted it."', tiles:['Menachem sanded the shelf','and','painted it.']},
  {q:'Choose the joining word: "It was late, ___ the boys kept learning."', o:['but','so','or']},
 ]},

'WRIT.PARA.L04.01': {name:'Paragraph: topic sentence, three details, closing',
 teach:[
  {how:'A topic sentence tells what the whole paragraph is about.', q:'Which is the best topic sentence for a paragraph about shop safety?', o:['Three rules keep everyone safe in the shop.','I like wood.','Saws are made of metal.']},
  {how:'Every detail must support the topic sentence.', q:'Topic: "Shabbos at our house is peaceful." Which detail does NOT belong?', o:['My bike has a flat tire.','We eat slowly and sing zemiros.','Nobody rushes to go anywhere.']},
  {how:'A closing sentence wraps up, often by saying the main idea in new words.', q:'Best closing for a paragraph about why a workshop is a great class?', o:['For all these reasons, the workshop is the best part of my week.','Wood has a smell.','My neighbor has a garage.']},
 ],
 practice:[
  {q:'Best topic sentence for a paragraph about Baltimore’s harbor?', o:['Baltimore’s harbor is busy with ships, boats and visitors.','Water is wet.','I went to the beach once.'], h:'It should cover the whole paragraph.'},
  {q:'Topic: "Saving money is smart." Which detail supports it?', o:['Savings help you buy something big later.','Money is green.','My friend has a wallet.'], h:'Which one explains why saving is smart?'},
  {q:'Which detail does NOT belong in a paragraph about how to plant a seed?', o:['My favorite color is blue.','Dig a small hole.','Water it every day.'], h:'Which one is off topic?'},
  {q:'In a paragraph, what comes first?', o:['the topic sentence','the closing sentence','a detail'], h:'It tells what the paragraph is about.'},
  {q:'Best closing for a paragraph about the first day of Trades Co.?', o:['By the end of the day, I knew this would be my favorite class.','The shop has a door.','Tomorrow is Tuesday.'], h:'It should wrap up the main idea.'},
  {q:'Topic: "Winter is my favorite season." Which is a strong detail?', o:['I love sledding down the big hill near the shul.','Summer is hot.','Some trees are tall.'], h:'Which one shows why he likes winter?'},
 ],
 check:[
  {q:'Best topic sentence for a paragraph about caring for tools?', o:['Taking care of your tools makes them last longer.','Tools are in the shop.','I have a red hammer.']},
  {q:'Topic: "Our class trip was exciting." Which detail does NOT belong?', o:['My cousin lives in Ohio.','We rode a ferry across the harbor.','We saw a real submarine.']},
  {t:'write', q:'Write a paragraph about your favorite thing to build or make. Use a topic sentence, three details and a closing sentence.', min:40, checks:['I started with a topic sentence.','I wrote three details.','I ended with a closing sentence.']},
 ]},

'WRIT.PARA.L05.01': {name:'Paragraph with transition words',
 teach:[
  {how:'Transitions connect ideas. First, next, then and finally show order.', q:'"___, gather your tools. Next, measure the board."', o:['First','However','Finally']},
  {how:'"However" shows a contrast: something different from what came before.', q:'"The plan looked easy. ___, the cuts were tricky."', o:['However','For example','First']},
  {how:'"For example" brings in an example. "As a result" shows an effect.', q:'"We practiced every day. ___, we won the game."', o:['As a result','For example','However']},
 ],
 practice:[
  {q:'"Many trees lose their leaves in fall. ___, maples turn bright red first."', o:['For example','However','Finally'], h:'Maples are an example of trees.'},
  {q:'"Sand the wood. ___, wipe away the dust."', o:['Then','However','For example'], h:'This is the next step.'},
  {q:'"Avi wanted to go outside. ___, it was raining."', o:['However','As a result','First'], h:'Rain is a problem, a contrast.'},
  {q:'"The bridge was closed. ___, traffic was slow all day."', o:['As a result','For example','First'], h:'Slow traffic was the effect.'},
  {q:'"___, put away every tool before you leave."', o:['Finally','However','For example'], h:'This is the last step.'},
  {q:'Which transition shows a contrast?', o:['On the other hand','Next','For example'], h:'Contrast means the other side.'},
 ],
 check:[
  {q:'"The shelf wobbled. ___, we added a brace."', o:['As a result','For example','However']},
  {q:'"Some tools need power. ___, a hammer does not."', o:['However','As a result','First']},
  {t:'write', q:'Write a paragraph of at least 5 sentences about your morning routine. Use at least three transitions, such as first, next, then, after that or finally.', min:50, checks:['I used at least three transition words.','My steps are in order.','I have a topic sentence and a closing.']},
 ]},

'WRIT.PARA.L05.02': {name:'Step-by-step how-to paragraph',
 teach:[
  {how:'A how-to paragraph teaches the steps in order so someone else can do it.', q:'What should a how-to paragraph start with?', o:['A sentence that says what you will make or do','The last step','A joke']},
  {how:'Each step starts with an action word: cut, measure, sand.', q:'Which is the clearest step?', o:['Measure 12 inches from the end of the board.','Then you sort of do the measuring.','Boards are nice.']},
  {how:'Put the steps in the order they really happen.', t:'order', q:'Put the steps in order to make a sandwich.', tiles:['Take two slices of bread.','Spread on the filling.','Put the slices together.']},
 ],
 practice:[
  {t:'order', q:'Put the steps in order to plant a seed.', tiles:['Dig a small hole.','Drop in the seed.','Cover it with soil.','Water it.'], h:'What must happen before the seed goes in?'},
  {q:'Which step is missing? "Fill the kettle. ___. Pour the hot water."', o:['Heat the water.','Drink the tea.','Buy a kettle.'], h:'What happens between filling and pouring?'},
  {t:'order', q:'Put the steps in order to hang a picture.', tiles:['Mark the spot on the wall.','Hammer in the nail.','Hang the picture on the nail.'], h:'Mark first, hang last.'},
  {q:'Which detail helps the reader most?', o:['Use a 1/4-inch drill bit.','Use a bit.','Use something good.'], h:'Exact sizes help.'},
  {q:'Which is the best last sentence for a how-to paragraph?', o:['Now your birdhouse is ready to hang outside.','I like birds.','First, get wood.'], h:'It should finish the job.'},
  {t:'order', q:'Put the steps in order to wash your hands.', tiles:['Wet your hands.','Rub with soap for 20 seconds.','Rinse with water.','Dry with a towel.'], h:'Wet, soap, rinse, dry.'},
 ],
 check:[
  {t:'order', q:'Put the steps in order to change a light bulb.', tiles:['Turn off the light.','Unscrew the old bulb.','Screw in the new bulb.','Turn the light on.']},
  {q:'Which step is clearest?', o:['Sand the edges until they feel smooth.','Do the sanding thing.','Sanding happens.']},
  {t:'write', q:'Write a how-to paragraph that teaches a skill you know, such as folding a paper airplane or setting the table for Shabbos. Give at least four steps in order.', min:50, checks:['I said what we are making or doing.','I gave at least four steps in order.','Each step starts with an action word.']},
 ]},

'LANG.GRAM.L05.01': {name:'Keep verb tense consistent',
 teach:[
  {how:'Keep the same time in a sentence. If it happened in the past, use past-tense verbs.', q:'Which is correct?', o:['Yesterday we walked to shul and davened.','Yesterday we walk to shul and davened.','Yesterday we walked to shul and daven.']},
  {how:'Past: walked, built. Present: walk, build. Future: will walk, will build.', q:'"Tomorrow, Eli ___ the shelf."', o:['will paint','painted','paints']},
  {how:'Some past-tense verbs change spelling: go → went, make → made.', q:'"Last week Shmuel ___ a birdhouse."', o:['made','make','maked']},
 ],
 practice:[
  {q:'Which is correct?', o:['He opened the box and took out the drill.','He opened the box and takes out the drill.','He opens the box and took out the drill.'], h:'Both verbs should be past.'},
  {q:'"Every day, Ari ___ to school."', o:['walks','walked','will walked'], h:'"Every day" is present.'},
  {q:'"Last night we ___ our homework."', o:['finished','finish','will finish'], h:'"Last night" is past.'},
  {q:'Which is correct?', o:['The boys ran to the field and played ball.','The boys run to the field and played ball.','The boys ran to the field and play ball.'], h:'Match both verbs.'},
  {q:'"Yesterday I ___ a new word."', o:['learned','learn','will learn'], h:'Yesterday is past.'},
  {q:'"Next week the class ___ the museum."', o:['will visit','visited','visits'], h:'Next week is future.'},
 ],
 check:[
  {q:'Which is correct?', o:['Chaim swept the floor and washed the tables.','Chaim sweeps the floor and washed the tables.','Chaim swept the floor and washes the tables.']},
  {q:'"Last Sunday we ___ to the lake."', o:['went','go','goed']},
  {q:'"Tomorrow I ___ my cut list."', o:['will check','checked','checks']},
 ]},

'WRIT.PARA.L06.01': {name:'Summary paragraph',
 teach:[
  {how:'A summary tells only the main points, in your own words, in order.', q:'What belongs in a summary?', o:['the main events or ideas','every small detail','your opinion']},
  {p:'shtender', how:'Leave out small details and your opinions.', q:'Which detail should you leave OUT of a summary of "The Shtender"?', o:['Avi rubbed the wood in long, smooth lines.','Zeidy and Avi built a shtender.','They brought it to the shul.']},
  {p:'shtender', how:'Start by naming the main character and what the story is about.', q:'Best first sentence for a summary of "The Shtender"?', o:['Avi helps his grandfather build a shtender for the shul.','The wood was smooth as glass.','I think Avi is nice.']},
 ],
 practice:[
  {q:'How long should a summary be compared to the original?', o:['much shorter','the same length','longer'], h:'Only the main points.'},
  {p:'siddur', q:'Best one-sentence summary of "The Lost Siddur"?', o:['Moshe lost his siddur, the bus driver returned it, and Moshe wrote his name in it.','Moshe looked under his seat.','The siddur was small and blue.'], h:'Problem, what happened, how it ended.'},
  {q:'Which does NOT belong in a summary?', o:['I think the story was boring.','the main character’s problem','how the problem was solved'], h:'Leave out opinions.'},
  {q:'A summary should be written:', o:['in your own words','copied word for word','as questions'], h:'Retell, don’t copy.'},
  {p:'Camels are built for the desert. Their humps store fat for energy. Their wide feet keep them from sinking in sand. Long eyelashes keep sand out of their eyes.', q:'Best one-sentence summary?', o:['Camels have body parts that help them survive in the desert.','Camels have eyelashes.','Camels are my favorite animal.'], h:'Cover everything in one idea.'},
  {q:'What order should a summary follow?', o:['the same order as the original','random order','most exciting first'], h:'Keep the original order.'},
 ],
 check:[
  {p:'The Pony Express carried mail between Missouri and California in 1860 and 1861. Riders changed horses every 10 to 15 miles and delivered letters in about ten days. It ended when the telegraph line was finished.', q:'Best summary sentence?', o:['The Pony Express carried mail across the West in about ten days until the telegraph replaced it.','Riders changed horses.','The Pony Express was cool.']},
  {q:'Which belongs in a summary?', o:['the main problem and how it ends','the color of a character’s shirt','what you would have done']},
  {p:'longway', t:'write', q:'Read "The Long Way Home." Write a summary paragraph of 3 to 5 sentences in your own words.', min:35, checks:['I named the main character and his problem.','I told the main events in order.','I left out my opinion and small details.']},
 ]},

'WRIT.ESSAY.L07.01': {name:'State a claim with reasons',
 teach:[
  {how:'A claim is a statement people could argue about. A fact can be proven.', q:'Which is a claim?', o:['Every middle school should teach a trade.','Baltimore is in Maryland.','A foot has 12 inches.']},
  {how:'Good reasons explain WHY the claim is right.', q:'Claim: "Students should keep a budget." Best reason?', o:['A budget helps you save for things you really want.','Budgets are on paper.','My friend has a budget.']},
  {how:'A strong claim is clear and specific.', q:'Which claim is clearest?', o:['Our school should add a 20-minute reading period every day.','Reading is kind of good.','Stuff should change.']},
 ],
 practice:[
  {q:'Which is a fact, not a claim?', o:['Water freezes at 32°F.','Winter is the best season.','Schools should start later.'], h:'Which one can be proven?'},
  {q:'Claim: "The school should start a woodshop." Which reason is strongest?', o:['Students learn measuring and planning skills they will use for life.','Wood smells nice.','I want to use a saw.'], h:'Which reason helps everyone, not just you?'},
  {q:'Which claim is clear and specific?', o:['The town should build a bike path along the river by next summer.','Things in town are bad.','Bikes exist.'], h:'What, where, when.'},
  {q:'Which reason does NOT support "Students should learn to cook"?', o:['Kitchens have windows.','Cooking teaches measuring and fractions.','Knowing how to cook helps you stay healthy.'], h:'Which one has nothing to do with the claim?'},
  {q:'Which is a claim?', o:['Homework should be limited to one hour a night.','Homework is given in school.','Some students do homework.'], h:'Could someone disagree?'},
  {q:'Claim: "Every shop should have a first-aid kit." Best reason?', o:['Small injuries can be treated right away.','Kits are white.','Tape is sticky.'], h:'Why does it matter?'},
 ],
 check:[
  {q:'Which is a claim?', o:['Our yeshiva should hold a monthly chesed day.','Our yeshiva has a gym.','June has 30 days.']},
  {q:'Claim: "Students should earn money for mastering skills." Best reason?', o:['Rewards for real progress can motivate students to keep learning.','Dollars are green.','Money is paper.']},
  {t:'write', q:'Write a claim about something you think should change in school or your community. Give two reasons that support it.', min:40, checks:['My claim is something people could argue about.','I gave two reasons.','Each reason explains WHY.']},
 ]},

'WRIT.ESSAY.L07.02': {name:'Quote evidence and explain it',
 teach:[
  {how:'Evidence backs your claim. Quote the exact words, inside quotation marks.', q:'Which correctly quotes the text?', o:['The article says, "Over 100,000 vehicles cross it every day."','The article says over 100,000 vehicles cross it every day."','The article says, Over 100,000 vehicles cross it every day.']},
  {how:'After the quote, explain how it proves your claim.', q:'Claim: The Brooklyn Bridge is still important. Quote: "Over 100,000 vehicles cross it every day." Best explanation?', o:['This shows that huge numbers of people still depend on the bridge.','This is a quote.','Bridges are made of steel.']},
  {how:'Introduce a quote with a lead-in, such as "According to the article,".', q:'Which is the best lead-in?', o:['According to the article,','Quote:','Here is words:']},
 ],
 practice:[
  {p:'railroad', q:'Claim: The railroad changed travel. Best evidence?', o:['"After the railroad, the same trip took about a week."','"Building it was brutal work."','"In 1869, workers drove a final spike."'], h:'Which quote is about travel?'},
  {q:'Claim: Sharp tools are safer. Quote: "A dull saw needs more force, so it can slip." Best explanation?', o:['This shows that dull tools can cause accidents, so keeping tools sharp is a safety rule.','This sentence is about saws.','Saws are sharp.'], h:'Connect the quote back to the claim.'},
  {q:'Which is punctuated correctly?', o:['Mr. Adler said, "A good joint will make it stronger."','Mr. Adler said "a good joint will make it stronger".','Mr. Adler said, a good joint will make it stronger.'], h:'Comma, quotation marks, capital, period inside.'},
  {q:'What is the job of the explanation after a quote?', o:['to show how the quote proves the claim','to repeat the quote','to change the topic'], h:'Why did you pick this quote?'},
  {p:'longway', q:'Claim: Pinchas showed kindness. Best evidence?', o:['"He stopped, turned around and jogged back."','"Pinchas was the fastest runner in his grade."','"That afternoon, the menahel handed out the awards."'], h:'Which quote shows him helping?'},
  {q:'Which is the WEAKEST explanation of a quote?', o:['This quote is good.','This shows Pinchas gave up winning to help someone in need.','This proves he cared more about Hillel than the race.'], h:'Which one doesn’t explain anything?'},
 ],
 check:[
  {p:'bridge', q:'Claim: Washington Roebling was determined. Best evidence?', o:['"He watched through a telescope from his window and sent instructions every day."','"The work was dangerous."','"The Brooklyn Bridge opened in 1883."']},
  {q:'Which is punctuated correctly?', o:['The manual says, "Always wear safety glasses."','The manual says "always wear safety glasses"','The manual says, Always wear safety glasses.']},
  {p:'bridge', t:'write', q:'Claim: The Brooklyn Bridge was a great achievement. Write 3 to 5 sentences: state the claim, quote one piece of evidence from the passage, and explain how it proves the claim.', min:40, checks:['I stated the claim.','I quoted exact words in quotation marks.','I explained how the quote proves the claim.']},
 ]},

'LANG.GRAM.L08.01': {name:'Clauses and complex sentences',
 teach:[
  {how:'An independent clause can stand alone. A dependent clause cannot; it starts with words like because, when, although or if.', q:'Which is a dependent clause?', o:['because the glue was wet','the glue was wet','we waited']},
  {how:'A complex sentence has one independent clause and at least one dependent clause.', q:'Which is a complex sentence?', o:['When the bell rang, we went to Mincha.','The bell rang.','The bell rang, and we went to Mincha.']},
  {how:'When the dependent clause comes first, put a comma after it.', q:'Which is punctuated correctly?', o:['If it rains, the trip will move to Monday.','If it rains the trip, will move to Monday.','If, it rains the trip will move to Monday.']},
 ],
 practice:[
  {q:'Which is the independent clause in "Although the board was long, it fit in the car"?', o:['it fit in the car','Although the board was long','the board'], h:'Which part can stand alone?'},
  {q:'Which word starts a dependent clause?', o:['because','and','the'], h:'And joins two independent clauses.'},
  {q:'Combine with "because": "We stayed inside. It was snowing."', o:['We stayed inside because it was snowing.','Because we stayed inside it was snowing.','We stayed inside, it was snowing because.'], h:'Because goes before the reason.'},
  {q:'Which is a complex sentence?', o:['Since the saw was dull, Eli sharpened it.','Eli sharpened the saw.','The saw was dull, so Eli sharpened it.'], h:'Look for since, because, when, if.'},
  {q:'Which is punctuated correctly?', o:['After we finished, we cleaned the shop.','After we finished we, cleaned the shop.','After, we finished we cleaned the shop.'], h:'The comma goes after the dependent clause.'},
  {q:'Which is a dependent clause?', o:['until the paint dries','the paint dries','wait'], h:'It can’t stand alone.'},
 ],
 check:[
  {q:'Which is a complex sentence?', o:['Before he cut the board, Avi checked his measurement.','Avi checked his measurement.','Avi checked his measurement, and he cut the board.']},
  {q:'Combine with "when": "The light turns green. The battery is charged."', o:['When the light turns green, the battery is charged.','The light turns green when, the battery is charged.','When the light turns green the battery, is charged.']},
  {q:'Which word starts a dependent clause?', o:['although','but','or']},
 ]},

'WRIT.ESSAY.L08.02': {name:'Answer a counterclaim',
 teach:[
  {how:'A counterclaim is the other side’s view. Naming it makes your argument stronger.', q:'Claim: "School should start at 9:00." Which is a counterclaim?', o:['Some people say a later start would make the day end too late.','School should start at 9:00.','Sleep helps students learn.']},
  {how:'A rebuttal answers the counterclaim with a reason or evidence.', q:'Counterclaim: "Woodshop is too dangerous." Best rebuttal?', o:['With safety training, a license for each tool and an adult supervising, the risk is small.','Woodshop is fun.','Some people don’t like wood.']},
  {how:'Use phrases like "Some people argue…" and "However, …".', q:'Which sentence introduces a counterclaim?', o:['Some people argue that phones help students learn.','Phones are made of glass.','In conclusion, phones are bad.']},
 ],
 practice:[
  {q:'Claim: "Students should earn money for mastering skills." Which is a counterclaim?', o:['Some people worry students will care about money more than learning.','Money is fun.','Students like rewards.'], h:'What would someone on the other side say?'},
  {q:'Best rebuttal to "Pay will make students care only about money"?', o:['Pay only comes from real mastery, so the only way to earn is to learn.','Money is good.','Students should work.'], h:'Answer the worry with a reason.'},
  {q:'Which word often starts a rebuttal?', o:['However','Firstly','Because'], h:'It turns back to your side.'},
  {q:'Why include a counterclaim?', o:['It shows you understand the other side and makes your argument stronger.','It makes the essay longer.','It changes your claim.'], h:'Think about convincing a reader.'},
  {q:'Counterclaim: "Electives take time away from core subjects." Best rebuttal?', o:['Trades electives use math and reading every day, so they support core skills.','Electives are nice.','Core subjects are hard.'], h:'Show the elective helps the core.'},
  {q:'Which is NOT a counterclaim to "We need a new library"?', o:['Libraries hold books.','Some say most people read online now.','Others argue the money should fix the roads.'], h:'Which one doesn’t argue against it?'},
 ],
 check:[
  {q:'Claim: "Homework should be limited." Which is a counterclaim?', o:['Some people say homework helps students practice skills.','Homework should be limited.','Students are busy.']},
  {q:'Best rebuttal to "A school garden costs too much"?', o:['Seeds and soil are cheap, and the garden can sell produce to cover its costs.','Gardens are green.','Some people like gardens.']},
  {t:'write', q:'Claim: "Middle schools should offer a trades class." Write 3 to 5 sentences: give one counterclaim and a rebuttal that answers it.', min:40, checks:['I stated a counterclaim fairly.','I answered it with a reason or evidence.','I used phrases like "Some people argue" and "However."']},
 ]},

'WRIT.RES.L09.01': {name:'Find and judge sources',
 teach:[
  {how:'Reliable sources have a known expert author or organization and are up to date.', q:'Which source is most reliable for facts about bridges?', o:['A university engineering department website','An anonymous comment','An ad for car insurance']},
  {how:'Check the date. For facts that change, newer is better.', q:'You need Baltimore’s population today. Which source?', o:['Recent U.S. Census data','A 1990 almanac','A novel set in Baltimore']},
  {how:'Watch for bias: is the source trying to sell or persuade?', q:'Which source is most likely biased about a drill?', o:['The drill company’s ad','A consumer testing report','A government safety notice']},
 ],
 practice:[
  {q:'Which website ending belongs to a U.S. government agency?', o:['.gov','.com','.biz'], h:'gov = government.'},
  {q:'Which is the best source for a report on volcanoes?', o:['A national geological survey website','A social media post','A video game'], h:'Who are the experts?'},
  {q:'Why is a source with no author less reliable?', o:['You can’t check who wrote it or whether he is an expert.','It is shorter.','It has more pictures.'], h:'Who stands behind it?'},
  {q:'Two sources disagree. What should you do?', o:['Check a third reliable source.','Use the one you like.','Leave the topic out.'], h:'Break the tie.'},
  {q:'Which is a primary source about the Brooklyn Bridge opening?', o:['A newspaper article printed the day it opened in 1883','A 2020 encyclopedia article','A modern travel blog'], h:'Primary = from the time it happened.'},
  {q:'Which source is most up to date on bike helmet laws?', o:['The state government’s current website','A 1998 magazine','A friend’s opinion'], h:'Laws change. Find the official, current one.'},
 ],
 check:[
  {q:'Which is most reliable for facts about tornadoes?', o:['The National Weather Service website','An anonymous forum','A movie about storms']},
  {q:'Which source is most likely biased?', o:['A company website selling the product','A university study','A government report']},
  {q:'Which is a primary source?', o:['A soldier’s letter written during the war','A textbook chapter about the war','A website summary of the war']},
 ]},

'WRIT.RES.L09.02': {name:'Paraphrase and cite',
 teach:[
  {how:'Paraphrasing means saying the idea in your own words and your own sentence shape. Changing one or two words is still copying.', p:'Original: "Honey almost never spoils because germs cannot grow in it."', q:'Which is the best paraphrase?', o:['Germs can’t live in honey, so it lasts a very long time.','Honey almost never spoils because germs cannot grow in it.','Honey almost never goes bad because germs cannot grow in it.']},
  {how:'Even a paraphrase needs a citation: say where the idea came from.', q:'Which sentence includes a citation?', o:['According to the National Park Service, the Liberty Bell is in Philadelphia.','The Liberty Bell is in Philadelphia.','I think the Liberty Bell is in Philadelphia.']},
  {how:'Use quotation marks only when you copy exact words.', q:'You copy five words exactly from a source. You must:', o:['put them in quotation marks and cite the source','change one word','leave out the source']},
 ],
 practice:[
  {p:'Original: "The Erie Canal cut shipping costs by about 90 percent."', q:'Which is the best paraphrase?', o:['Shipping became roughly ten times cheaper after the Erie Canal opened.','The Erie Canal cut shipping costs by about 90 percent.','The Erie Canal cut shipping prices by about 90 percent.'], h:'Change the sentence shape, not just one word.'},
  {q:'What is plagiarism?', o:['using someone else’s words or ideas without credit','citing a source','writing your own ideas'], h:'Credit matters.'},
  {p:'Original: "Bees pollinate about one-third of the crops we eat."', q:'Which is the best paraphrase?', o:['Roughly a third of our food crops depend on bees to pollinate them.','Bees pollinate about one-third of the crops we eat.','Bees pollinate about a third of the crops we eat.'], h:'Rebuild the sentence.'},
  {q:'Which is a correct short citation?', o:['(National Weather Service, 2024)','[the internet]','(I read it)'], h:'Name the source and year.'},
  {q:'When should you cite a source?', o:['whenever you use its facts, ideas or words','only for exact quotes','never in a short report'], h:'Ideas count too.'},
  {p:'Original: "Glaciers carve valleys as they slowly move downhill."', q:'Which is the best paraphrase?', o:['As glaciers creep down slopes, they cut out valleys.','Glaciers carve valleys as they slowly move downhill.','Glaciers carve valleys as they slowly go downhill.'], h:'New words and new order.'},
 ],
 check:[
  {p:'Original: "Lightning heats the air to about 50,000 degrees Fahrenheit."', q:'Which is the best paraphrase?', o:['A lightning bolt can make the air around it roughly 50,000°F.','Lightning heats the air to about 50,000 degrees Fahrenheit.','Lightning warms the air to about 50,000 degrees Fahrenheit.']},
  {q:'Which needs a citation?', o:['a statistic you found in an article','your own opinion','a story about your own day']},
  {q:'Which sentence uses a source correctly?', o:['According to NASA, sunlight takes about 8 minutes to reach Earth.','Sunlight takes about 8 minutes to reach Earth, I copied this.','Sunlight takes about 8 minutes, trust me.']},
 ]},

'WRIT.ESSAY.L09.01': {name:'Business writing',
 teach:[
  {how:'A business letter has a greeting, a clear purpose in the first sentence, details, and a polite closing.', q:'Best first sentence for a letter to a lumber store?', o:['I am writing to ask for a price on ten pine boards for our school shop.','Hi! What’s up?','Wood is great.']},
  {how:'Use a polite, professional tone. No slang.', q:'Which closing is professional?', o:['Thank you for your help. Sincerely, Avi Gold, Tashbar Trades Co.','Later!','Bye, from me.']},
  {how:'Be specific: what, how many, when.', q:'Which request is clearest?', o:['Please deliver 10 pine boards, 1 × 8 × 8 feet, by Friday, November 20.','Please send some wood soon.','We need stuff for shop.']},
 ],
 practice:[
  {q:'Which tone is right for a customer note?', o:['polite and clear','silly','angry'], h:'You want customers to come back.'},
  {q:'A customer’s shelf arrived scratched. Best first sentence?', o:['Thank you for letting us know about the scratch; we will fix it this week.','That’s not our fault.','Scratches happen.'], h:'Thank, then fix.'},
  {q:'What belongs in an invoice?', o:['item, price, quantity and total','a joke','your favorite tool'], h:'What does the customer pay for?'},
  {q:'Best subject line for an email to the menahel about the market?', o:['Trades Co. market: request to use the gym on Sunday','Hi','Question??'], h:'Say exactly what it is about.'},
