function load(name,cb){ if(C.cache[name]) return cb(C.cache[name]);

function prep(d){
 d.p.forEach((ps,i)=>{ ps.i=i; ps.W=ps.w.map((w,j)=>{ const segs=w[0].split('/'), ms=w[1].split('/'), st=w[3]; const L=d.lex[w[2]]||['','', 'word',0];

   return {j:j,segs:segs,ms:ms,st:st,n:w[2],stem:segs[st],root:L[0],g:L[1],kind:L[2],cur:L[3],pre:pre,suf:suf,txt:segs.join('')}; }); });
 /* frequency of lemmas in this parsha */
 const f={}; d.p.forEach(ps=>ps.W.forEach(w=>{ if(w.n) f[w.n]=(f[w.n]||0)+1; })); d.freq=f;
 d.nounList=Object.keys(f).filter(n=>d.lex[n]&&d.lex[n][3]&&d.lex[n][2]==='word'&&d.lex[n][1]&&!/^\(/.test(d.lex[n][1])).sort((a,b)=>f[b]-f[a]);
 d.rootList=Object.keys(f).filter(n=>d.lex[n]&&d.lex[n][2]==='verb'&&d.lex[n][0]&&d.lex[n][0].length===3&&d.lex[n][3]).sort((a,b)=>f[b]-f[a]);
 return d; }

function rootMarks(w,strict){ /* which letters of the stem are the shoresh (in order). Weak letters: a י may show as ו, and a missing ה, י, ו or נ is allowed */
 if(!w.root||w.kind!=='verb') return null; const r=w.root.split('').map(fin), chars=[...w.stem], out=[]; let k=0, miss=0;
 const eq=(a,b)=>a===b||(!strict&&((a==='י'&&b==='ו')||(a==='ו'&&b==='י')));
 for(let i=0;i<chars.length&&k<r.length;i++){ const ch=chars[i]; if(!/[\u05D0-\u05EA]/.test(ch)) continue;
  if(eq(r[k],fin(ch))){ out.push(i); k++; continue; }
  if(!strict&&'היונ'.indexOf(r[k])>=0&&k+1<r.length&&fin(ch)===r[k+1]){ miss++; k++; out.push(i); k++; } }
 if(k<r.length&&!strict&&'היונ'.indexOf(r[r.length-1])>=0&&k===r.length-1){ miss++; k++; }
 return k===r.length&&miss<=1&&out.length>=2?new Set(out):null; }
function wordHTML(w,opt){ opt=opt||{}; let h='';
 w.pre.forEach(p=>{ h+='<span class="cp">'+E(p.s)+'</span>'; });
 const rm=opt.noRoot?null:rootMarks(w); if(rm){ const chars=[...w.stem]; let cur=''; let inR=false; const flush=()=>{ if(cur) h+=inR?'<span class="cr">'+E(cur)+'</span>':'<span class="cs">'+E(cur)+'</span>'; cur=''; };
   chars.forEach((ch,i)=>{ const isL=/[א-ת]/.test(ch); if(isL){ const r=rm.has(i); if(r!==inR){ flush(); inR=r; } } cur+=ch; }); flush(); }
 else h+='<span class="cs">'+E(w.stem)+'</span>';
 w.suf.forEach(s=>{ h+='<span class="cx">'+E(s.s)+'</span>'; });
 return h; }
function pasukHTML(ps,opt){ opt=opt||{}; return ps.W.map(w=>'<span class="cw'+(opt.sel===w.j?' on':'')+(opt.mark===w.j?' mk':'')+'" data-chm="w" data-j="'+w.j+'">'+(opt.plain?E(w.txt):wordHTML(w))+'</span>').join(' ')+'<span class="cso">׃</span>'; }
function sufCode(m){ const x=/^Sp(\d[mfc][sp])/.exec(m||''); return x?x[1]:(/^Sd/.test(m||'')?'dir':null); }
function wordCard(w){ let rows='';
 w.pre.forEach(p=>{ const c=p.c, m=/^C/.test(p.m)?'and':(PRE_M[c]||''); rows+='<div class="cwr"><b class="cp">'+E(p.s)+'</b> <span>prefix · means <b>'+E(m)+'</b>'+(c==='ו'&&w.ms[w.st]&&/w/.test(w.ms[w.st].slice(2,3))?' (and it turns the word into the past)':'')+'</span></div>'; });

function open(name){ css(); const s=S(); const rl=rebbeLv(); if(rl&&rl!==s.rlv){ s.lv=rl; s.rlv=rl; C.rebbeNew=true; } if(!rl&&s.rlv){ s.rlv=0; } C.lv=Math.max(1,Math.min(8,s.lv||1)); C.name=name||weekParsha()||s.last||'Bereishis'; s.last=C.name; C.view='home'; C.q=null;
 let ov=document.getElementById('chm-ov'); if(!ov){ ov=document.createElement('div'); ov.id='chm-ov'; document.body.appendChild(ov); ov.addEventListener('click',onClick); ov.addEventListener('change',onChange); }
 try{ if(typeof SND!=='undefined') SND.tap(); }catch(e){}
 draw(); }
function close(){ const ov=document.getElementById('chm-ov'); if(ov) ov.remove(); C.q=null; save(); try{ render(); }catch(e){} }
function top(){ const opts=SEF.map(s=>'<optgroup label="'+E(s[0])+'">'+PAR.slice(s[2],s[3]).map(p=>'<option value="'+E(p[0])+'"'+(p[0]===C.name?' selected':'')+'>'+E(p[0])+' · '+E(p[1])+'</option>').join('')+'</optgroup>').join('');
 return '<div class="chm-top"><button class="chm-btn x" data-chm="close">✕</button><h2>Chumash <span class="he">חוּמָשׁ</span></h2>'
  +(C.view!=='home'?'<button class="chm-btn" data-chm="home">⬅ '+E(C.name)+'</button>':'<select data-chm="par" aria-label="Parsha">'+opts+'</select>')
  +'<button class="chm-btn" data-chm="levels">Level '+C.lv+(rebbeLv()?' ✓':'')+'</button></div>'; }
function draw(){ const ov=document.getElementById('chm-ov'); if(!ov) return;
 ov.innerHTML=top()+'<div class="chm-body"><div class="chm-msg">📜 Opening Parshas '+E(C.name)+'…</div></div>';
 if(C.view==='levels') return drawLevels();
 load(C.name,d=>{ if(!document.getElementById('chm-ov')) return; const b=ov.querySelector('.chm-body'); if(!b) return;
  if(C.view==='home') b.innerHTML=homeHTML(d);
  else if(C.view==='read') b.innerHTML=readHTML(d);
  else if(C.view==='all') b.innerHTML=allHTML(d);
  else if(C.view==='q') b.innerHTML=qHTML(d);
  else if(C.view==='done') b.innerHTML=doneHTML(d);
  if(C.view!=='q') ov.scrollTop=C.keepScroll?ov.scrollTop:0; C.keepScroll=false; }); }

 let h='<div class="chm-hero"><div class="nm">פָּרָשַׁת '+E(HEBOF(C.name))+'</div><div>Parshas '+E(C.name)+(wk?' · <b>this week\'s Parsha from your rebbe</b>':'')+' · '+d.p.length+' pesukim</div>'

  +(C.rebbeNew?'<div style="margin-top:6px">⭐ Your rebbe put you on Level '+C.lv+'!</div>':'')
  +((ps.m||[]).length?'<div style="margin-top:6px">🏅 Mastered at level '+ps.m.join(', ')+'</div>':'')+'</div>';
 h+='<div class="chm-grid"><button class="chm-act big" data-chm="start" data-k="test"><div class="ic">🏆</div><div class="t">Parsha Bechina · Level '+C.lv+'</div><div class="d">10 questions from everything in your level. Get 8 to master Parshas '+E(C.name)+'.</div></button>';
 L.k.forEach(k=>{ const K=KIND[k]; h+='<button class="chm-act" data-chm="'+(k==='read'?'read':'start')+'" data-k="'+k+'"><div class="ic">'+K[0]+'</div><div class="t">'+K[1]+'</div><div class="d">'+E(K[2])+'</div>'+(k!=='read'?stars(ps.k[k]):'')+'</button>'; });
 h+='</div>';
 if((d.hi||[]).length){ h+='<h3>⭐ Pesukim to know</h3><div class="chm-hi">'+d.hi.map(i=>'<div class="chm-pl star" data-chm="pas" data-i="'+i+'">'+pasukHTML(d.p[i],{plain:true})+'<span class="rf">'+E(d.p[i].r)+'</span></div>').join('')+'</div>'; }
 const R=rng(d); h+='<h3>📖 Your pesukim ('+R.length+')</h3><div class="chm-pesall">'+R.slice(0,12).map(p=>'<div class="chm-pl" data-chm="pas" data-i="'+p.i+'">'+pasukHTML(p,{plain:true})+'<span class="rf">'+E(p.r)+'</span></div>').join('')+'</div>'
  +'<div class="chm-nav"><button class="chm-btn" data-chm="all">All '+d.p.length+' pesukim of the Parsha</button></div>';
 return h; }

 d.p.forEach(p=>{ const c=p.r.split(':')[0]; if(c!==per){ per=c; h+='<h3>Perek '+E(c)+'</h3>'; } h+='<div class="chm-pl'+((d.hi||[]).includes(p.i)?' star':'')+'" data-chm="pas" data-i="'+p.i+'">'+pasukHTML(p,{plain:true})+'<span class="rf">'+E(p.r)+'</span></div>'; });
 return h+'</div>'; }

 h+='<div class="chm-nav"><button class="chm-btn" data-chm="prev"'+(C.pi<=0?' disabled':'')+'>⬅ Previous pasuk</button><button class="chm-btn g" data-chm="next"'+(C.pi>=d.p.length-1?' disabled':'')+'>Next pasuk ➡</button></div>';
 return h; }
function drawLevels(){ const ov=document.getElementById('chm-ov'); const b=ov&&ov.querySelector('.chm-body'); if(!b) return;
 const rl=rebbeLv(); if(rl){ b.innerHTML='<div class="chm-done"><div class="big">📖</div><h2>Your rebbe set your level: Level '+rl+' · שָׁלָב '+LV[rl].h+'</h2><p>'+E(LV[rl].t)+'</p><p>When you are ready for the next level, show your rebbe your 🏅 Parsha medals!</p><button class="chm-btn g" data-chm="home">Back</button></div>'; return; }

/* ---------- questions ---------- */
function mkQ(d,k){ const R=rng(d), all=d.p; const L=LV[C.lv];
 const words=[]; R.forEach(p=>p.W.forEach(w=>words.push([p,w])));
 if(k==='pre'){ const c=words.filter(([p,w])=>w.pre.length&&w.pre.every(x=>L.pre.indexOf(x.c)>=0)&&w.stem); if(!c.length) return null; const [p,w]=pick(c); const x=pick(w.pre);
  const right=/^C/.test(x.m)?'and':PRE_M[x.c]; if(!right) return null; const pool=[...new Set([...L.pre].map(c=>c==='ו'?'and':PRE_M[c]))].filter(m=>m!==right);
  return {k:k,t:'What does the blue letter '+'<b class="cp" style="font-family:Times New Roman,serif;font-size:26px">'+E(x.s)+'</b> at the start mean?',w:w,p:p,opts:shuf([right,...shuf(pool).slice(0,3)]),a:right}; }
 if(k==='mean'){ const nouns=d.nounList.slice(0,L.nouns), roots=C.lv>=2?d.rootList.slice(0,L.roots):[]; const pool=nouns.concat(roots); if(pool.length<4) return null;
  const n=pick(pool); const c=words.filter(([p,w])=>w.n===n); const pw=c.length?pick(c):(()=>{ for(const p of all){ const w=p.W.find(w=>w.n===n); if(w) return [p,w]; } })(); if(!pw) return null; const [p,w]=pw;
  const right=d.lex[n][1]; const others=shuf(pool.filter(x=>x!==n).map(x=>d.lex[x][1]).filter(g=>g!==right)).slice(0,3); if(others.length<3) return null;
  return {k:k,t:'What does this word mean?',w:w,p:p,opts:shuf([right,...others]),a:right,noRoot:true}; }
 if(k==='suf'){ const basic=L.suf==='basic'?['3ms','3fs','1cs','2ms']:null; const c=words.filter(([p,w])=>w.suf.length===1&&sufCode(w.suf[0].m)&&sufCode(w.suf[0].m)!=='dir'&&(!basic||basic.includes(sufCode(w.suf[0].m)))); if(!c.length) return null;
  const [p,w]=pick(c); const code=sufCode(w.suf[0].m), right=SUF_SHORT[code]; const pool=[...new Set(Object.values(SUF_SHORT))].filter(x=>x!==right&&(!basic||basic.map(b=>SUF_SHORT[b]).includes(x)||Math.random()<.3));
  return {k:k,t:'What does the green ending <b class="cx" style="font-family:Times New Roman,serif;font-size:26px">'+E(w.suf[0].s)+'</b> mean?',w:w,p:p,opts:shuf([right,...shuf(pool).slice(0,3)]),a:right}; }
 if(k==='root'){ const ok=new Set(d.rootList.slice(0,Math.max(L.roots,15))); const c=words.filter(([p,w])=>w.kind==='verb'&&ok.has(w.n)&&rootMarks(w,C.lv<=3)); if(!c.length) return null; const [p,w]=pick(c);
  const right=dots(w.root); const others=new Set(); const letters=[...cons(w.stem)].map(fin);
  shuf(d.rootList).forEach(n=>{ const r=d.lex[n][0]; if(r!==w.root&&others.size<2) others.add(dots(r)); });
  for(let t=0;t<20&&others.size<3;t++){ if(letters.length>=3){ const s=shuf(letters).slice(0,3).join(''); if(s!==w.root) others.add(dots(s)); } }
  shuf(d.rootList).forEach(n=>{ const r=d.lex[n][0]; if(r!==w.root&&others.size<3) others.add(dots(r)); });
  return {k:k,t:'What is the shoresh of this word?',w:w,p:p,opts:shuf([right,...[...others].slice(0,3)]),a:right,he:true,noRoot:true}; }
 if(k==='build'){ const c=R.filter(p=>p.W.length>=3); if(!c.length) return null; const p=pick(c); const n=Math.min(p.W.length,C.lv>=5?10:7); const st=p.W.length>n?Math.floor(Math.random()*(p.W.length-n+1)):0; const seq=p.W.slice(st,st+n);
  return {k:k,t:'Build the pasuk: tap the words in order.',p:p,seq:seq,chips:shuf(seq.map((w,i)=>({i:i,txt:w.txt}))),got:0,miss:0,part:p.W.length>n}; }
 if(k==='which'){ const c=R.filter(p=>p.e); if(c.length<2) return null; const p=pick(c); const others=shuf(all.filter(x=>x!==p&&x.e)).slice(0,3);
  const short=x=>x.W.slice(0,9).map(w=>w.txt).join(' ')+(x.W.length>9?' …':'');
  return {k:k,t:'Which pasuk says this?',en:p.e,opts:shuf([p,...others].map(short)),a:short(p),he:true,sm:true}; }
 if(k==='rashi'){ const c=[]; R.forEach(p=>(p.ra||[]).forEach(r=>{ const dh=cons(r[0]).split(/\s+/).filter(Boolean); if(!dh.length||dh.length>5) return; const pc=p.W.map(w=>cons(w.txt));
   for(let s=0;s+dh.length<=pc.length;s++){ if(dh.every((x,i)=>pc[s+i]===x)){ c.push([p,r,s,dh.length]); break; } } }));
  if(!c.length) return null; const [p,r,s,n]=pick(c); const seg=(a)=>p.W.slice(a,a+n).map(w=>w.txt).join(' ');
  const starts=new Set([s]); for(let t=0;t<30&&starts.size<4;t++){ const a=Math.floor(Math.random()*Math.max(1,p.W.length-n+1)); starts.add(a); }
  const opts=[...starts].map(seg).filter((v,i,a)=>a.indexOf(v)===i); if(opts.length<2) return null;
  const body=r[1].length>260?r[1].slice(0,260).replace(/\s\S*$/,'')+' …':r[1];
  return {k:k,t:'Read Rashi. Which words of the pasuk is he explaining?',p:p,rashi:body,rs:C.lv>=5,opts:shuf(opts),a:seg(s),he:true,sm:true}; }
 return null; }
function startRound(k){ C.round={k:k,n:0,ok:0,total:k==='test'?10:8,seen:{}}; C.view='q'; nextQ(); }
function nextQ(){ const d=C.cache[C.name]; if(!d) return; const r=C.round; if(r.n>=r.total){ return finish(); }
 const kinds=r.k==='test'?LV[C.lv].k.filter(k=>k!=='read'):[r.k]; let q=null;
 for(let t=0;t<25&&!q;t++){ const kk=r.k==='test'?pick(kinds):r.k; q=mkQ(d,kk); if(q){ const key=kk+'|'+(q.a||'')+'|'+(q.w?q.p.i+'.'+q.w.j:(q.p?q.p.i:'')); if(r.seen[key]&&t<20) q=null; else r.seen[key]=1; } }
 if(!q){ C.view='home'; try{ toast('This Parsha does not have enough of those at your level yet. Try another activity!'); }catch(e){} return draw(); }
 C.q=q; C.q.done=false; draw(); }
function qHTML(d){ const q=C.q, r=C.round; if(!q) return '';
 let h='<div style="font-size:14px;color:#6b5434">'+E(r.k==='test'?'🏆 Parsha Bechina':KIND[r.k][1])+' · question '+(r.n+1)+' of '+r.total+'</div><div class="chm-bar"><i style="width:'+Math.round(100*r.n/r.total)+'%"></i></div><div class="chm-q"><div class="qt">'+q.t+'</div>';
 if(q.k==='build'){ h+='<div class="chm-en" style="text-align:left">'+E(q.p.e)+'</div>'+(q.part?'<div style="font-size:13px;margin-top:6px">(part of the pasuk)</div>':'');
  h+='<div class="chm-built">'+q.seq.slice(0,q.got).map(w=>E(w.txt)).join(' ')+'</div><div class="chm-chips">'+q.chips.map((c,i)=>'<button class="chm-chip'+(c.used?' used':'')+'" data-chm="chip" data-n="'+i+'">'+E(c.txt)+'</button>').join('')+'</div>'; }
 else { if(q.w) h+='<div class="qw">'+(q.k==='mean'||q.k==='root'?'<span class="cs">'+E(q.w.txt)+'</span>':wordHTML(q.w,{noRoot:true}))+'</div>';
  if(q.p&&q.k!=='rashi') h+='<div class="qp chm-plain">'+pasukHTML(q.p,{plain:true,mark:q.w?q.w.j:-1})+'</div>';
  if(q.k==='rashi') h+='<div class="qp">'+pasukHTML(q.p,{plain:true})+'</div><div class="chm-rashi"><div class="rh'+(q.rs?' rs':'')+'">'+E(q.rashi)+'</div></div>';
  if(q.en) h+='<div class="chm-en">'+E(q.en)+'</div>';
  h+='<div class="chm-opts">'+q.opts.map((o,i)=>'<button class="chm-opt'+(q.he?' he':'')+(q.sm?' sm':'')+(q.done&&o===q.a?' ok':'')+(q.done&&q.pickN===i&&o!==q.a?' no':'')+'" data-chm="opt" data-n="'+i+'">'+E(o)+'</button>').join('')+'</div>'; }
 h+='<div class="chm-fb '+(q.done?(q.right?'ok':'no'):'')+'">'+(q.done?(q.right?pick(['Yes! ✨','Right! Chazak!','Beautiful! 🌟','You got it!']):'Good try! The answer is: '+E(q.a)):'')+'</div>';
 if(q.done&&q.w&&q.k!=='build') h+=wordCard(q.w);
 if(q.done) h+='<div class="chm-nav" style="justify-content:center"><button class="chm-btn g" data-chm="nextq">Next ➡</button></div>';
 return h+'</div>'; }
function answer(ok){ const q=C.q, r=C.round; q.done=true; q.right=!!ok; r.n++; if(ok) r.ok++;
 /* v202: every answer is recorded like any Kodesh answer (staff "This week", reports). The Olam Haba cloud lights from this record (OlamHaba watchEv) */
 let rec=false; try{ if(typeof SRV!=='undefined'&&SRV&&Array.isArray(SRV.pendingEv)&&A.st){ SRV.pendingEv.push({at:Date.now(),student:A.st.id,skill:'LK.QUEST.chumash',phase:'practice',item:String(C.name+' '+(r.k==='test'?'bechina':r.k)+' L'+C.lv).slice(0,80),first:!!ok,tries:1,hints:0,ms:0,ok:!!ok}); rec=true; if(SRV.pendingEv.length>50) SRV.pendingEv.splice(0,SRV.pendingEv.length-50); } }catch(e){}
 try{ if(!rec&&window.tlOH) window.tlOH.effort(true,!!ok,'chumash'); }catch(e){}
 try{ if(typeof SND!=='undefined'){ if(ok&&SND.ok) SND.ok(); else if(!ok&&SND.no) SND.no(); } }catch(e){}
 C.keepScroll=true; draw(); }
function finish(){ const r=C.round, ps=PS(C.name); const st=r.ok>=r.total?3:(r.ok>=Math.ceil(r.total*.75)?2:(r.ok>=Math.ceil(r.total*.5)?1:0));
 let mast=false; if(r.k==='test'){ if(r.ok>=8&&ps.m.indexOf(C.lv)<0){ ps.m.push(C.lv); ps.m.sort(); mast=true; } ps.k.test=Math.max(ps.k.test||0,st); ps.at=Date.now(); }
 else ps.k[r.k]=Math.max(ps.k[r.k]||0,st);
 C.lastRound={ok:r.ok,total:r.total,k:r.k,st:st,mast:mast}; C.view='done'; C.rebbeNew=false; save();
 try{ if(window.tlOH&&(mast||st>=2)) window.tlOH.surge(true,mast?'חֲזַק וֶאֱמַץ!':'יִישַׁר כֹּחַ!',mast?'You mastered Parshas '+C.name+'! ✨':'Beautiful learning! ✨'); }catch(e){}
 draw(); }

 return '<div class="chm-done"><div class="big">'+(x.mast?'🏅':(x.st>=2?'🌟':'📜'))+'</div><h2>'+(x.mast?'Parshas '+E(C.name)+' — mastered at Level '+C.lv+'!':'You got '+x.ok+' of '+x.total)+'</h2>'

  +'<div class="chm-nav" style="justify-content:center"><button class="chm-btn g" data-chm="start" data-k="'+E(x.k)+'">Again</button><button class="chm-btn" data-chm="home">Back to Parshas '+E(C.name)+'</button></div></div>'; }

function onChange(e){ const t=e.target; if(t&&t.dataset&&t.dataset.chm==='par'){ C.name=t.value; S().last=C.name; C.view='home'; draw(); } }
function onClick(e){ const b=e.target.closest('[data-chm]'); if(!b) return; const a=b.dataset.chm; const d=C.cache[C.name];
 if(a==='close') return close();
 if(a==='home'){ C.view='home'; C.q=null; return draw(); }
 if(a==='retry') return draw();
 if(a==='levels'){ C.view='levels'; const ov=document.getElementById('chm-ov'); ov.innerHTML=top()+'<div class="chm-body"></div>'; return drawLevels(); }
 if(a==='lv'){ C.lv=+b.dataset.n; S().lv=C.lv; save(); C.view='home'; return draw(); }
 if(a==='all'){ C.view='all'; return draw(); }
 if(a==='read'){ C.view='read'; C.pi=(d&&d.hi&&d.hi.length)?d.hi[0]:0; C.wi=-1; return draw(); }
 if(a==='pas'){ C.view='read'; C.pi=+b.dataset.i; C.wi=-1; return draw(); }
 if(a==='w'&&C.view==='read'){ const j=+b.dataset.j; C.wi=C.wi===j?-1:j; C.keepScroll=true; try{ if(window.tlOH) window.tlOH.effort(true,true,'chumash'); }catch(x){} return draw(); }
 if(a==='en'){ C.en=!C.en; C.keepScroll=true; return draw(); }
 if(a==='ra'){ C.ra=!C.ra; C.keepScroll=true; return draw(); }
 if(a==='prev'&&d){ C.pi=Math.max(0,C.pi-1); C.wi=-1; return draw(); }
 if(a==='next'&&d){ C.pi=Math.min(d.p.length-1,C.pi+1); C.wi=-1; try{ if(window.tlOH) window.tlOH.effort(true,true,'chumash'); }catch(x){} return draw(); }
 if(a==='start') return startRound(b.dataset.k);
 if(a==='nextq') return nextQ();
 if(a==='opt'&&C.q&&!C.q.done){ const i=+b.dataset.n; C.q.pickN=i; return answer(C.q.opts[i]===C.q.a); }
 if(a==='chip'&&C.q&&!C.q.done){ const q=C.q, c=q.chips[+b.dataset.n]; if(!c||c.used) return;
  if(q.seq[q.got].txt===c.txt){ c.used=true; q.got++; if(q.got>=q.seq.length) return answer(q.miss===0); C.keepScroll=true; return draw(); }
  q.miss++; b.classList.add('no'); b.style.background='#fde0dc'; setTimeout(()=>{ b.style.background=''; },400); return; }
}

/* ---------- the hub card ---------- */
function card(){ const s=S(), wk=weekParsha(), nm=wk||s.last||'Bereishis', m=mastered();
 return '<div class="chm-card" data-chmopen="'+E(nm)+'" role="button" tabindex="0"><div class="sc">📜</div><div class="tx"><div class="t1">Chumash <span class="he">חוּמָשׁ</span> · Parshas '+E(nm)+'</div>'
  +'<div class="t2">'+(wk?'This week\'s Parsha · ':'')+'Every pasuk, every word · Level '+(s.lv||1)+(m?' · 🏅 '+m+' of 54 parshiyos mastered':'')+'</div></div><div class="go">Learn ➡</div></div>'; }
document.addEventListener('click',e=>{ const c=e.target.closest&&e.target.closest('[data-chmopen]'); if(c){ e.preventDefault(); open(c.dataset.chmopen); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&document.getElementById('chm-ov')) close(); });
const _vHub=vHub;
vHub=function(){ const h=_vHub.apply(this,arguments); try{ if(!A.st) return h; css(); const s=card(); const i=h.indexOf('</header>'); return i>=0?h.slice(0,i+9)+s+h.slice(i+9):s+h; }catch(e){ console.error('Chumash',e); return h; } };
window.tlChm={open:open,close:close};
window.tlChmQ=()=>{ const q=C.q; return q&&q.seq&&q.seq[q.got]?q.seq[q.got].txt:null; };
window.tlChmRootCover=()=>{ const d=C.cache[C.name]; if(!d) return null; let v=0,s=0,l=0; d.p.forEach(p=>p.W.forEach(w=>{ if(w.kind==='verb'&&w.root){ v++; if(rootMarks(w,true)) s++; if(rootMarks(w,false)) l++; } })); return {verbs:v,strict:s,loose:l}; };
})();
