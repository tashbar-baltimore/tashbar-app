<title>Spark Path Electricity</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Lexend:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow workbench column; a copper trace links the level "bulbs" on the map, each bulb lights when mastered. */
:root{
  --bg:#EDF1F3; --board:#FAFBFC; --ink:#16212B; --muted:#56687A; --line:#C9D3DB;
  --copper:#B5602A; --glow:#FFC21A; --go:#1E8C57; --stop:#C6352B; --blue:#2D61D4;
  --plastic:#2A3946; --glass:#E7EEF4; --water:#5AA7E0;
  --f-display:"Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Lexend", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E151B; --board:#16202A; --ink:#E5ECF1; --muted:#93A5B4; --line:#2B3946;
  --copper:#DA8642; --glow:#FFCB3D; --go:#3BC27E; --stop:#F2665D; --blue:#7298FF;
  --plastic:#A9B9C6; --glass:#24323F; --water:#4C95CC; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E151B; --board:#16202A; --ink:#E5ECF1; --muted:#93A5B4; --line:#2B3946;
  --copper:#DA8642; --glow:#FFCB3D; --go:#3BC27E; --stop:#F2665D; --blue:#7298FF;
  --plastic:#A9B9C6; --glass:#24323F; --water:#4C95CC; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding:16px 0 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top h1{font-size:1.35rem;flex:1;min-width:0}
.cash{font-family:var(--f-mono);font-weight:700;background:var(--board);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:600;cursor:pointer;background:var(--blue);color:#fff;min-height:48px}
.btn.alt{background:var(--board);color:var(--ink);border:1.5px solid var(--line)}
.btn.small{min-height:38px;padding:6px 14px;font-size:.95rem}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{border:1.5px solid var(--line);background:var(--board);border-radius:10px;width:42px;height:42px;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:22px;height:22px}
.intro{color:var(--muted);margin:0 0 18px;max-width:60ch}
/* map */
.map{position:relative;display:grid;gap:14px;padding-left:34px}
.map::before{content:"";position:absolute;left:14px;top:20px;bottom:20px;width:5px;border-radius:3px;background:var(--copper);opacity:.85}
.stop{position:relative;display:flex;gap:14px;align-items:center;background:var(--board);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.stop[disabled]{cursor:default;opacity:.6}
.stop .bulbnode{position:absolute;left:-36px;top:50%;transform:translateY(-50%);width:34px;height:34px}
.stop .num{font-family:var(--f-display);font-size:.8rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.stop h3{font-size:1.12rem}
.stop p{margin:2px 0 0;color:var(--muted);font-size:.93rem}
.stop .meta{margin-left:auto;flex:none;font-size:.85rem;font-weight:600}
.stop.next{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent)}
.stop.boss{border-style:dashed}
.tag{display:inline-block;font-size:.75rem;font-weight:600;border-radius:999px;padding:2px 9px;border:1px solid var(--line)}
.tag.done{background:color-mix(in srgb,var(--go) 16%,transparent);border-color:transparent;color:var(--go)}
.tag.next{background:var(--blue);color:#fff;border-color:transparent}
.staff{margin-top:26px;background:var(--board);border:1.5px solid var(--line);border-radius:16px;padding:4px 16px}
.staff summary{cursor:pointer;font-weight:600;padding:12px 0}
.staff h3{font-size:1rem;margin:14px 0 6px}
.staff table{border-collapse:collapse;width:100%;font-size:.88rem}
.staff td,.staff th{border-top:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
.tbl{overflow-x:auto}
.staff ul{padding-left:20px;margin:6px 0}
.mono{font-family:var(--f-mono);font-size:.85em}
/* lesson */
.phases{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.phase{font-size:.82rem;font-weight:600;padding:4px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.phase.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.phase.ok{color:var(--go);border-color:var(--go)}
.card{background:var(--board);border:1.5px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:14px}
.art{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.art svg{width:100%;max-width:440px;height:auto}
.art.two svg{max-width:300px;flex:1 1 220px}
.say{display:flex;gap:12px;align-items:flex-start}
.say p{margin:0;font-size:1.08rem;max-width:62ch}
.q{font-size:1.12rem;font-weight:500}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.opt{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:14px;cursor:pointer;font-weight:500;text-align:left;min-height:56px}
.opt.right{border-color:var(--go);background:color-mix(in srgb,var(--go) 14%,var(--board))}
.opt.wrong{border-color:var(--stop);background:color-mix(in srgb,var(--stop) 10%,var(--board))}
.opt.safe{border-color:var(--go)} .opt.danger{border-color:var(--stop)}
.fb{border-radius:12px;padding:10px 14px;font-weight:500}
.fb.good{background:color-mix(in srgb,var(--go) 14%,transparent);color:var(--go)}
.fb.bad{background:color-mix(in srgb,var(--stop) 12%,transparent);color:var(--stop)}
.fb.info{background:color-mix(in srgb,var(--blue) 12%,transparent);color:var(--blue)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.dots{display:flex;gap:6px;margin-left:auto}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--go)} .dots i.no{background:var(--stop)} .dots i.cur{background:var(--blue)}
.hinttap{font-size:.9rem;color:var(--muted);text-align:center}
.bench{border:2px dashed var(--copper);border-radius:14px;padding:12px 14px}
.bench b{font-family:var(--f-display);letter-spacing:.04em}
.big{font-family:var(--f-display);font-size:2rem}
.meterbar{height:16px;border-radius:8px;background:var(--line);overflow:hidden}
.meterbar i{display:block;height:100%;width:0;background:var(--glow);transition:width .1s linear}
.dial{display:flex;gap:8px;flex-wrap:wrap}
.dial .btn.on{outline:3px solid var(--glow)}
/* svg parts */
.board{fill:var(--board)}
.mask{fill:var(--board)}
.w{stroke:var(--copper);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.e{stroke:var(--blue);stroke-width:5;fill:none;stroke-dasharray:1 18;stroke-linecap:round;animation:flow 1.1s linear infinite}
.st-short .e{animation-duration:.25s;stroke:var(--stop)}
.st-dim .e{animation-duration:3s}
@keyframes flow{to{stroke-dashoffset:-19}}
.tip{fill:var(--copper)}
.bat{fill:var(--plastic)} .batcap{fill:var(--copper)} .batband{fill:var(--glow)}
.battxt{fill:var(--bg);font:700 15px var(--f-mono)}
.lbl{fill:var(--muted);font:500 12px var(--f-body)}
.lblb{fill:var(--ink);font:600 13px var(--f-body)}
.glass{fill:var(--glass);stroke:var(--muted);stroke-width:2}
.fil{stroke:var(--muted);stroke-width:2;fill:none}
.base{fill:var(--muted)}
.halo{fill:var(--glow);opacity:0}
.on .halo{opacity:.55}
.on .glass{fill:var(--glow)}
.on .fil{stroke:#B65C00}
.dimbulb .halo{opacity:.2}
.dimbulb .glass{fill:color-mix(in srgb,var(--glow) 45%,var(--glass))}
.ledd{fill:color-mix(in srgb,#E0352B 35%,var(--glass));stroke:#C02A22;stroke-width:1.5}
.on .ledd{fill:#FF3B30}
.on .ledhalo{opacity:.6}
.ledhalo{fill:#FF5B4F;opacity:0}
.burnt .ledd{fill:#6B6B6B;stroke:#444}
.resb{fill:#D8B98A;stroke:#8A6A3E;stroke-width:1.5}
.sw{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.pivot{fill:var(--ink)}
.hit{fill:transparent;stroke:var(--blue);stroke-width:2;stroke-dasharray:5 4}
.slot.edit{cursor:pointer}
.slot.edit:hover .hit,.slot.edit:focus .hit{fill:color-mix(in srgb,var(--blue) 10%,transparent)}
.slot:focus{outline:none}
.hotlbl{fill:var(--stop);font:700 16px var(--f-display)}
.metal{fill:#9AA7B2;stroke:#5E6B75;stroke-width:1.5}
.gold{fill:#D6A23A;stroke:#8F6A1A;stroke-width:1.5}
.pink{fill:#F09AAE;stroke:#B8566E;stroke-width:1.5}
.woodf{fill:#B98552;stroke:#7A5530;stroke-width:1.5}
.plas{fill:#4E86D9;stroke:#2D5BA5;stroke-width:1.5}
.rub{fill:none;stroke:#C9A15A;stroke-width:4}
.clipj{fill:var(--stop)}
.redf{fill:var(--stop)} .gof{fill:var(--go)} .inkf{fill:var(--ink)} .mutedf{fill:var(--muted)} .glowf{fill:var(--glow)} .bluef{fill:var(--blue)}
.reds{stroke:var(--stop);fill:none} .inks{stroke:var(--ink);fill:none} .muteds{stroke:var(--muted);fill:none}
.waterpipe{stroke:var(--water);stroke-width:16;fill:none;stroke-linejoin:round;opacity:.45}
.waterflow{stroke:var(--water);stroke-width:6;fill:none;stroke-dasharray:4 14;stroke-linecap:round;animation:flow 1s linear infinite}
.spin{animation:spin 4s linear infinite;transform-box:view-box}
.spinfast{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.tapbulb{cursor:pointer}
.disp{fill:#C9D9B8;stroke:var(--ink);stroke-width:2}
.disptxt{font:700 26px var(--f-mono);fill:#1B2A12}
.meterbody{fill:#F2B705;stroke:var(--ink);stroke-width:2}
.burst{position:fixed;inset:0;pointer-events:none;z-index:20}
@media (prefers-reduced-motion: reduce){.e,.waterflow,.spin,.spinfast{animation:none}}
@media (max-width:480px){body{font-size:16px}.card{padding:14px}.stop .meta{display:none}}
.how{margin:6px 0 12px;padding:10px 14px;border-radius:14px;background:var(--board);border:2px solid var(--glow)}.how .row{margin:0}.how ol{margin:6px 0 0;padding-left:1.4em;display:grid;gap:4px}.how li{line-height:1.45}
</style>

<div class="wrap">
  <header class="top">
    <button class="iconbtn" id="backBtn" aria-label="Back to the map" hidden><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7" class="inks" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <h1 id="title">Spark Path: Electricity</h1>
    <span class="cash" id="cash" aria-label="Dollars earned" hidden style="display:none">$0</span><!-- builder v54: hidden; Spark Path dollars are not school bank money (money rule) -->
  </header>
  <main id="app"></main>
</div>
<canvas class="burst" id="burst" aria-hidden="true"></canvas>

<script>
/* ---------- state ---------- */
const LS='tashbar-spark-electricity-v1';
let S={done:{},cash:0,unlockAll:false};
try{const r=localStorage.getItem(LS); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
const app=document.getElementById('app');
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- read aloud ---------- */
function speak(t){try{const s=window.speechSynthesis; if(!s) return; s.cancel(); const u=new SpeechSynthesisUtterance(t.replace(/<[^>]+>/g,'')); u.rate=.95; const v=s.getVoices().find(v=>/en-US/.test(v.lang)&&/Google|Natural|Samantha/.test(v.name)); if(v) u.voice=v; s.speak(u);}catch(e){}}
const SPK='<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" class="inkf"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" class="inks" stroke-width="2" stroke-linecap="round"/></svg>';
function sayBtn(t){return `<button class="iconbtn" data-say="${esc(t)}" aria-label="Read aloud">${SPK}</button>`;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]'); if(b) speak(b.dataset.say);});

/* ---------- sound ---------- */
let AC=null;
function tone(f=880,d=.22,type='sine',vol=.15){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(),g=AC.createGain(); o.type=type;o.frequency.value=f; g.gain.value=vol; o.connect(g);g.connect(AC.destination); o.start(); g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d); o.stop(AC.currentTime+d);}catch(e){}}
const yay=()=>{tone(660,.12);setTimeout(()=>tone(990,.18),110);};
const nope=()=>tone(220,.2,'triangle',.1);

/* ---------- circuit engine ---------- */
const COND={wire:1,bulb:1,swClosed:1,led:1,res470:1,res1M:1,coin:1,foil:1,clip:1,nail:1,
  gap:0,swOpen:0,bulbOut:0,ledRev:0,eraser:0,wood:0,spoon:0,band:0};
const NAMES={wire:'wire',gap:'gap',bulb:'bulb',bulbOut:'empty socket',swOpen:'switch (open)',swClosed:'switch (closed)',
  led:'LED',ledRev:'LED (backwards)',res470:'470 Ω resistor',res1M:'1,000,000 Ω resistor',coin:'coin',foil:'foil',clip:'paper clip',nail:'steel nail',
  eraser:'eraser',wood:'wood stick',spoon:'plastic spoon',band:'rubber band'};
function evalC(c){
  const k=[c.top,c.right,c.bottom];
  if(c.dead) return 'open';
  if(k.some(x=>!COND[x])) return 'open';
  const led=k.includes('led'), bulb=k.includes('bulb'), r470=k.includes('res470'), r1M=k.includes('res1M');
  if(!led&&!bulb&&!r470&&!r1M) return 'short';
  if(led){ if(!r470&&!r1M) return 'burnt'; if(r1M) return 'dim'; return 'lit'; }
  if(bulb) return r1M?'dim':'lit';
  return 'dim';
}
function comp(kind,st,rot=0){
  const tx=(x,y,cls,txt)=>`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" class="${cls}" transform="rotate(${-rot} ${x} ${y})">${txt}</text>`;
  const stub=(a)=>`<line x1="-34" x2="${-a}" y1="0" y2="0" class="w"/><line x1="${a}" x2="34" y1="0" y2="0" class="w"/>`;
  switch(kind){
    case 'wire': return `<line x1="-34" x2="34" class="w"/>`;
    case 'gap': return stub(13)+`<circle cx="-13" r="4" class="tip"/><circle cx="13" r="4" class="tip"/>`;
    case 'bulb': case 'bulbOut': {
      const cls= kind==='bulbOut'?'':(st==='lit'?'on':st==='dim'?'dimbulb':'');
      return stub(9)+`<g class="${cls}"><circle cy="-26" r="30" class="halo"/><rect x="-9" y="-11" width="18" height="11" rx="2" class="base"/>`+
        (kind==='bulbOut'?`<circle cy="-25" r="14" class="muteds" stroke-width="2" stroke-dasharray="4 4"/>`:`<circle cy="-25" r="14" class="glass"/><path d="M-5 -11 V-22 Q0 -31 5 -22 V-11" class="fil"/>`)+`</g>`; }
    case 'swOpen': return stub(18)+`<circle cx="-18" r="5" class="pivot"/><circle cx="18" r="4" class="pivot"/><line x1="-18" y1="0" x2="12" y2="-19" class="sw"/>`;
    case 'swClosed': return stub(18)+`<circle cx="-18" r="5" class="pivot"/><circle cx="18" r="4" class="pivot"/><line x1="-18" y1="0" x2="18" y2="-1" class="sw"/>`;
    case 'led': case 'ledRev': {
      const cls= kind==='led'?(st==='lit'?'on':st==='burnt'?'burnt':''):'';
      const plus= kind==='led'?-1:1;
      return stub(8)+`<g class="${cls}"><circle cy="-22" r="22" class="ledhalo"/><rect x="-11" y="-12" width="22" height="4" rx="1" class="ledd"/><path d="M-9 -12 V-24 A9 9 0 0 1 9 -24 V-12 Z" class="ledd"/>`+
        tx(plus*20,-10,'lblb','+')+tx(-plus*20,-10,'lblb','−')+
        (st==='burnt'&&kind==='led'?tx(0,-42,'hotlbl','POP!'):'')+`</g>`; }
    case 'res470': case 'res1M': {
      const bands= kind==='res470'?['#E6C200','#7A3EC8','#8B4A1E']:['#8B4A1E','#111','#2E8B57'];
      return stub(16)+`<rect x="-17" y="-7" width="34" height="14" rx="6" class="resb"/>`+bands.map((b,i)=>`<rect x="${-9+i*7}" y="-7" width="3.5" height="14" fill="${b}"/>`).join('')+
        tx(0,rot===90?44:22,'lbl',kind==='res470'?'470 Ω':'1,000,000 Ω'); }
    default: return stub(16)+`<path d="M-24 -5 L-14 0 L-24 5Z M24 -5 L14 0 L24 5Z" class="clipj"/>`+itemArt(kind)+tx(0,rot===90?48:24,'lbl',NAMES[kind]||kind);
  }
}
function itemArt(k){
  switch(k){
    case 'coin': return `<circle r="11" class="gold"/><circle r="7" fill="none" stroke="#8F6A1A"/>`;
    case 'nail': return `<rect x="-14" y="-2.5" width="26" height="5" class="metal"/><rect x="-16" y="-7" width="4" height="14" class="metal"/><path d="M12 -2.5 L17 0 L12 2.5Z" class="metal"/>`;
    case 'foil': return `<path d="M-14 -7 L-6 -10 L2 -6 L9 -10 L14 -4 L12 6 L4 9 L-4 6 L-12 9 L-15 1Z" class="metal"/>`;
    case 'clip': return `<path d="M-13 4 H9 a4 4 0 0 0 0 -8 H-9 a3 3 0 0 0 0 6 H6" fill="none" stroke="#7D8A94" stroke-width="2.5"/>`;
    case 'eraser': return `<rect x="-13" y="-7" width="26" height="14" rx="3" class="pink"/>`;
    case 'wood': return `<rect x="-15" y="-4" width="30" height="8" rx="2" class="woodf"/>`;
    case 'spoon': return `<ellipse cx="-7" cy="0" rx="8" ry="6" class="plas"/><rect x="0" y="-2" width="15" height="4" rx="2" class="plas"/>`;
    case 'band': return `<ellipse rx="12" ry="7" class="rub"/>`;
  }
  return '';
}
function batt(label,dead){
  return `<g><rect x="-22" y="-44" width="44" height="88" class="mask"/><rect x="-6" y="-42" width="12" height="7" rx="2" class="batcap"/><rect x="-17" y="-36" width="34" height="74" rx="5" class="bat"/><rect x="-17" y="-36" width="34" height="20" rx="5" class="batband"/>`+
    `<text y="-21" text-anchor="middle" class="battxt" style="fill:#16212B">+</text><text y="30" text-anchor="middle" class="battxt">−</text>`+
    `<text x="-24" y="4" text-anchor="end" class="lblb">${label}</text>${dead?'<text x="-24" y="20" text-anchor="end" class="lbl">dead</text>':''}</g>`;
}
function circ(c,o={}){
  const st=evalC(c); const ed=o.edit||{};
  const flow= (st==='lit'||st==='short'||st==='dim');
  const slot=(name,x,y,rot)=>{
    const e=ed[name]; const k=c[name];
    return `<g transform="translate(${x} ${y}) rotate(${rot})" class="slot${e?' edit':''}" ${e?`data-slot="${name}" role="button" tabindex="0" aria-label="${name} part: ${NAMES[k]}. Tap to change."`:''}>`+
      `<rect x="-36" y="-9" width="72" height="18" class="mask"/>`+(e?`<rect x="-40" y="-46" width="80" height="78" rx="10" class="hit"/>`:'')+comp(k,st,rot)+`</g>`;
  };
  return `<svg viewBox="0 0 400 250" class="circ st-${st}" role="img" aria-label="Circuit: battery, ${NAMES[c.top]}, ${NAMES[c.right]}, ${NAMES[c.bottom]}">`+
   `<rect x="2" y="2" width="396" height="246" rx="16" class="board"/>`+
   `<path d="M60 40 H350 V205 H60 Z" class="w"/>`+
   (flow?`<path d="M60 165 V205 H350 V40 H60 V80" class="e"/>`:'')+
   slot('top',205,40,0)+slot('right',350,122,90)+slot('bottom',205,205,180)+
   `<g transform="translate(60 122)">${batt(c.bat||'1.5V',c.dead)}</g>`+
   (st==='short'?`<text x="60" y="236" text-anchor="middle" class="hotlbl">HOT!</text>`:'')+
   `</svg>`;
}
/* note: bottom slot is rotated 180 so a bulb there points inward */

/* ---------- series / parallel ---------- */
function bulbAt(x,y,rot,state,id){
  const cls= state==='out'?'':state;
  return `<g transform="translate(${x} ${y}) rotate(${rot})" class="tapbulb" data-bulb="${id}" role="button" tabindex="0" aria-label="Bulb ${id}. Tap to ${state==='out'?'screw it back in':'unscrew it'}">`+
    `<rect x="-30" y="-48" width="60" height="62" fill="transparent"/><rect x="-11" y="-6" width="22" height="12" class="mask"/>`+
    `<g class="${cls}"><circle cy="-22" r="26" class="halo"/><rect x="-8" y="-9" width="16" height="9" rx="2" class="base"/>`+
    (state==='out'?`<circle cy="-21" r="12" class="muteds" stroke-width="2" stroke-dasharray="4 4"/>`:`<circle cy="-21" r="12" class="glass"/><path d="M-4 -9 V-18 Q0 -26 4 -18 V-9" class="fil"/>`)+`</g></g>`;
}
function spSvg(mode,outs){
  const a=outs.A, b=outs.B; let sa,sb;
  if(mode==='series'){const on=!a&&!b; sa=a?'out':on?'dimbulb':''; sb=b?'out':on?'dimbulb':'';}
  else {sa=a?'out':'on'; sb=b?'out':'on';}
  const bt=`<g transform="translate(40 121) scale(.8)">${batt('3V')}</g>`;
  if(mode==='series') return `<svg viewBox="0 0 230 200" role="img" aria-label="Series circuit"><rect x="1" y="1" width="228" height="198" rx="14" class="board"/>`+
    `<text x="115" y="22" text-anchor="middle" class="lblb">Series: one path</text><path d="M40 66 H200 V176 H40 Z" class="w"/>`+bulbAt(95,66,0,sa,'A')+bulbAt(160,66,0,sb,'B')+bt+`</svg>`;
  return `<svg viewBox="0 0 230 200" role="img" aria-label="Parallel circuit"><rect x="1" y="1" width="228" height="198" rx="14" class="board"/>`+
    `<text x="115" y="22" text-anchor="middle" class="lblb">Parallel: two paths</text><path d="M40 66 H200 V176 H40 Z M120 66 V176" class="w"/>`+bulbAt(120,121,-90,sa,'A')+bulbAt(200,121,-90,sb,'B')+bt+`</svg>`;
}

  {art:()=>mini(C('bulb','gap','wire')),text:'One gap anywhere stops all of the flow. The electrons can\'t jump across air. The bulb goes dark.'},
  {art:A.short,text:'A loop also needs a load, like a bulb, an LED or a motor. A loop of only wire is a short circuit, and it gets hot. Every circuit you build has a load.'}],

  build('Fix the circuit so the bulb lights.',C('gap','wire','bulb'),{top:['gap','wire']},'lit','The gap is on the top. Tap it.'),

{id:'VOC.ELEC.L07.05',name:'Conductors and Insulators',sub:'What lets electricity through',
 learn:[
  {art:()=>mini(C('bulb','coin','wire')),text:'A conductor lets electrons flow through it. Metals are conductors: copper, steel, aluminum foil, coins.'},
  {art:()=>mini(C('bulb','eraser','wire')),text:'An insulator stops the flow. Plastic, rubber, dry wood, glass and paper are insulators.'},
  {art:A.wire,text:'A wire uses both. The copper inside carries the electrons. The plastic coat outside keeps them in, and protects your hands.'}],
 practice:['coin','eraser','foil','wood','clip','band'].map(k=>{const ok=COND[k]===1;return mc(`We put a ${NAMES[k]} in the gap. Will the bulb light?`,['Yes, it conducts','No, it insulates'],ok?0:1,ok?'Metals are conductors. It lets the electrons through.':'It is not metal, so it is an insulator. It blocks the flow.',()=>mini(C('bulb',k,'wire')),{fixed:true,reveal:true});}),
 check:[
  mc('We put a steel nail in the gap. Will the bulb light?',['Yes, it conducts','No, it insulates'],0,null,()=>mini(C('bulb','nail','wire')),{fixed:true,reveal:true}),

  mc('Why does a wire have a plastic coat?',['Plastic is an insulator, so it keeps the flow in','Plastic makes the flow faster','It is only for color'],0,null,A.wire)],

  {art:()=>`<div class="art two">${mini(C('bulb','swOpen','wire'))}${mini(C('bulb','swClosed','wire'))}</div>`,html:true,text:'A switch is a gate in the loop. Open switch: there is a gap, so the light is off. Closed switch: the loop is complete, so the light is on.'},
  {art:()=>mini(C('bulb','swClosed','wire')),text:'The light switch on your wall does the same thing: it opens and closes a loop. We never open a wall switch. That is wall power.'},
  {art:()=>mini(C('bulb','swClosed','gap')),text:'A switch only works if the rest of the loop is closed. Here the switch is closed, but there is still a gap, so the bulb stays dark.'}],

{id:'VOC.ELEC.L08.01',name:'Series and Parallel',sub:'One path or many paths',
 learn:[
  {art:()=>spSvg('series',{A:0,B:0}),text:'Series means one path. The electrons go through bulb A, then bulb B. If one bulb comes out, the path is broken and both go dark. Bulbs in series also glow dimmer.'},
  {art:()=>spSvg('parallel',{A:0,B:0}),text:'Parallel means separate paths. Each bulb gets its own loop to the battery. Take one out and the other stays bright.'},
  {art:A.house,text:'Homes are wired in parallel, so turning off the kitchen light doesn\'t turn off the whole house. Sukkah lights on one string are often in series: one bad bulb, and the whole string goes dark.'}],

  sp('Unscrew one bulb in each circuit. In which circuit does the other bulb stay on?',['Parallel','Series'],0,'Tap a bulb in each circuit to unscrew it, and watch the other bulb.'),
  sp('With all bulbs in, which circuit has brighter bulbs?',['Parallel','Series'],0,'In series, the two bulbs share one push. In parallel, each gets the full push.'),
  sp('How many paths does the series circuit have?',['One','Two'],0,'Trace the wire with your finger. Series has only one way around.'),
  mc('One bulb on a string of sukkah lights burns out, and every bulb goes dark. The string is wired in…',['Series','Parallel'],0,'One path broken means everything stops. That is series.'),
  mc('Your home is wired in…',['Parallel','Series'],0,'Each room has its own path, so lights can be on or off separately.',A.house),
  sp('Unscrew bulb A in the parallel circuit. What happens to bulb B?',['It stays on','It goes off'],0,'Parallel bulbs each have their own path.')],
 check:[
  sp('Which circuit has only one path for the electrons?',['Series','Parallel'],0),
  mc('In parallel, one bulb is taken out. The other bulb…',['Stays on','Goes off'],0),
  mc('Why are homes wired in parallel?',['So each light works on its own','To make every light dimmer','To use less wire'],0,null,A.house)],
 bench:'With the supervisor: build two bulbs in series, then the same two bulbs in parallel. Unscrew one bulb in each and compare. Supervisor signs off.'},

/* ---------- map ---------- */
function bulbNode(state){
  const on=state==='done';
  return `<svg class="bulbnode" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="15" r="16" fill="var(--glow)" opacity="${on?.45:0}"/><circle cx="17" cy="14" r="10" fill="${on?'var(--glow)':'var(--board)'}" stroke="${state==='next'?'var(--blue)':'var(--muted)'}" stroke-width="2.5"/><rect x="12" y="23" width="10" height="7" rx="2" fill="var(--muted)"/></svg>`;
}
function unlocked(i){ if(S.unlockAll) return true; if(i===0) return true; return !!S.done[LEVELS[i-1].id]; }
function showMap(){
  $('#backBtn').hidden=true; $('#title').textContent='Spark Path: Electricity'; updCash();
  const all=LEVELS.length, n=LEVELS.filter(l=>S.done[l.id]).length;
  let nextFound=false;
  let html=`<p class="intro">Learn how electricity is made and how it moves, one level at a time. Each level has 3 picture lessons, 6 practice games, and 3 check questions. Get all 3 checks right to light up the level. <b>${n} of ${all}</b> levels lit.</p><div class="map">`;
  LEVELS.forEach((l,i)=>{
    const done=!!S.done[l.id], open=unlocked(i); let st='locked';
    if(done) st='done'; else if(open && !nextFound){st='next';nextFound=true;} else if(open) st='open';
    html+=`<button class="stop ${st==='next'?'next':''}" data-lv="${i}" ${open?'':'disabled'}>${bulbNode(st)}<div style="min-width:0"><div class="num">Level ${i+1} · ${l.id}</div><h3>${l.name}</h3><p>${l.sub}</p></div><span class="meta">${done?'<span class="tag done">Lit</span>':st==='next'?'<span class="tag next">Start</span>':open?'<span class="tag">Open</span>':'<span class="tag">Locked</span>'}</span></button>`;
  });
  const bossOpen=S.unlockAll||n===all; const bd=!!S.done[BOSS.id];
  html+=`<button class="stop boss ${bossOpen&&!bd?'next':''}" data-lv="boss" ${bossOpen?'':'disabled'}>${bulbNode(bd?'done':bossOpen?'next':'locked')}<div style="min-width:0"><div class="num">Boss</div><h3>${BOSS.name}</h3><p>${BOSS.sub}</p></div><span class="meta">${bd?'<span class="tag done">Won</span>':bossOpen?'<span class="tag next">Start</span>':'<span class="tag">Locked</span>'}</span></button></div>`;
  html+=staffPanel();
  app.innerHTML=html;
  app.querySelectorAll('.stop').forEach(b=>b.onclick=()=>{const v=b.dataset.lv; v==='boss'?startBoss():startLevel(+v);});
  const ua=$('#unlockAll'); if(ua){ua.checked=!!S.unlockAll; ua.onchange=()=>{S.unlockAll=ua.checked;save();showMap();};}
  const rs=$('#resetAll'); if(rs) rs.onclick=()=>{ if(rs.dataset.armed){S={done:{},cash:0,unlockAll:false};save();showMap();} else {rs.dataset.armed=1; rs.textContent='Tap again to erase progress on this device';} };
  window.scrollTo(0,0);
}

  return `<details class="staff"><summary>For staff: skill IDs, safety rules, bench sign-offs</summary>
  <h3>Safety rules for this track</h3><ul><li>Batteries only: AA (1.5 V) and 9 V. Never over 12 V. No wall-current wiring at this age.</li><li>A qualified adult supervises every bench session. Kits stay locked until the boy passes Level 1.</li><li>Every circuit has a load (bulb, LED or resistor). No shorts.</li><li>Beep mode only with the battery removed.</li></ul>

let R=null;
function startLevel(i){ const L=LEVELS[i]; R={L,i,phase:'learn',k:0,results:[],first:true}; render(); }
function startBoss(){
  const pool=LEVELS.flatMap(l=>l.check);
  R={L:Object.assign({},BOSS,{check:shuffle(pool).slice(0,8)}),boss:true,phase:'check',k:0,results:[]}; render();
}
function header(){
  const ph=R.boss?[['check','8 jobs']]:[['learn','Learn'],['practice','Practice'],['check','Check']];
  const order=['learn','practice','check','done'];
  return `<div class="phases">${ph.map(([p,n])=>`<span class="phase ${R.phase===p?'on':order.indexOf(R.phase)>order.indexOf(p)?'ok':''}">${n}</span>`).join('')}</div>`;
}
function dots(total){
  let s='<span class="dots" aria-hidden="true">';
  for(let j=0;j<total;j++){const r=R.results[j]; s+=`<i class="${r===true?'ok':r===false?'no':j===R.k?'cur':''}"></i>`;}
  return s+'</span>';
}
function render(){
  $('#backBtn').hidden=false; $('#title').textContent=R.L.name;
  if(R.phase==='learn') return renderLearn();
  if(R.phase==='practice'||R.phase==='check') return renderItem();
  if(R.phase==='done') return renderDone();
}
function renderLearn(){
  const c=R.L.learn[R.k];
  const art= c.html? c.art() : `<div class="art">${c.art()}</div>`;
  app.innerHTML=header()+`<section class="card"><div class="row"><b>Picture lesson ${R.k+1} of 3</b><span class="dots">${[0,1,2].map(j=>`<i class="${j<R.k?'ok':j===R.k?'cur':''}"></i>`).join('')}</span></div>${art}<div class="say">${sayBtn(c.text)}<p>${c.text}</p></div>
  <div class="row end">${R.k>0?'<button class="btn alt" id="prev">Back</button>':''}<button class="btn" id="next">${R.k<2?'Next picture':'Start practice'}</button></div></section>`;
  $('#next').onclick=()=>{ if(R.k<2){R.k++;} else {R.phase='practice';R.k=0;R.results=[];} render(); window.scrollTo(0,0); };
  const p=$('#prev'); if(p) p.onclick=()=>{R.k--;render();};
}
function current(){ return R.phase==='practice'? R.L.practice[R.k] : R.L.check[R.k]; }
function total(){ return R.phase==='practice'? R.L.practice.length : R.L.check.length; }
function renderItem(){
  const it=current(), isCheck=R.phase==='check';
  const label= R.boss?`Job ${R.k+1} of ${total()}`: isCheck?`Check ${R.k+1} of 3 · no hints`:`Practice ${R.k+1} of 6`;
  app.innerHTML=header()+`<section class="card" id="itemCard"><div class="row"><b>${label}</b>${dots(total())}</div>${spHow(it)}<div id="itemBody"></div><div id="fb" aria-live="polite"></div><div class="row end" id="nav"></div></section>`;
  R.tries=0;
  ITEMS[it.t](it,$('#itemBody'),(ok,explain)=>answered(ok,explain,it));
  window.scrollTo(0,0);
}
function answered(ok,explain,it){
  const isCheck=R.phase==='check'; const fb=$('#fb'), nav=$('#nav');
  if(isCheck){
    R.results[R.k]=ok; ok?yay():nope();
    spPost({ev:{skill:R.boss?BOSS.id:R.L.id,phase:R.boss?'sparkboss':'check',item:it.q,ok:!!ok,first:!!ok,tries:1}});
    fb.innerHTML= ok?`<div class="fb good">Correct.</div>`:`<div class="fb bad">Not this time.${explain?' '+explain:''}</div>`;
    nav.innerHTML=`<button class="btn" id="go">${R.k<total()-1?'Next':'See result'}</button>`;
    $('#itemBody').querySelectorAll('button,[role=button],[data-slot]').forEach(b=>{if(!b.dataset.say&&!b.classList.contains('keep')) {b.disabled=true;b.style.pointerEvents='none';}});
    $('#go').onclick=()=>{ if(R.k<total()-1){R.k++;renderItem();} else {R.phase='done';render();} };
    $('#go').focus();
    return true;
  }
  R.tries++;
  if(ok){ if(R.results[R.k]===undefined) R.results[R.k]=R.tries===1; yay();
    spPost({ev:{skill:R.L.id,phase:'practice',item:it.q,ok:true,first:R.tries===1,tries:R.tries}});
    fb.innerHTML=`<div class="fb good">${R.tries===1?'Yes! First try.':'Got it.'}${explain?' '+explain:''}</div>`;
    nav.innerHTML=`<button class="btn" id="go">${R.k<total()-1?'Next':'Go to the check'}</button>`;
    $('#go').onclick=()=>{ if(R.k<total()-1){R.k++;renderItem();} else {R.phase='check';R.k=0;R.results=[];renderItem();} };
    $('#go').focus(); return true;
  }
  nope();
  const hint=it.hint||'Look again.';
  fb.innerHTML=`<div class="fb bad">Not yet. <span style="font-weight:400">${hint}</span> Try again.</div>`;
  speak('Not yet. '+hint);
  return false;
}
function renderDone(){
  if(R.boss){
    const n=R.results.filter(Boolean).length, win=n>=7;
    if(win&&!S.done[BOSS.id]){S.done[BOSS.id]=true;S.cash+=30;save();burst();}
    spPost({boss:BOSS.id,n,win});

    app.innerHTML=`<section class="card" style="text-align:center"><div class="big">${n} of 8</div><h2>${win?'Fix-It Shop beaten!':'Not yet'}</h2><p>${win?'You fixed '+n+' of 8 jobs. The whole Spark Path is lit.':'You need 7 of 8. Look at the levels where you missed, then try the boss again.'}</p><div class="row" style="justify-content:center"><button class="btn" id="map">Back to the map</button>${win?'':'<button class="btn alt" id="again">Try again</button>'}</div></section>`;

  app.innerHTML=header().replace('class="phase on"','class="phase ok"')+`<section class="card"><div style="text-align:center"><div class="big">${n} of 3</div><h2>${pass?'Level lit!':'Not yet'}</h2><p>${pass?'You mastered '+L.name+'.':'You need all 3. Practice again, then retry the check. You\'ve got this.'}</p></div>
   ${pass?`<div class="bench"><b>BENCH TASK</b> <span class="tag">with your supervisor</span><p style="margin:6px 0 0">${L.bench}</p></div>`:''}
   <div class="row" style="justify-content:center">${pass?(nextI!==null?`<button class="btn" id="nx">Next level: ${LEVELS[nextI].name}</button>`:'<button class="btn" id="bs">Take on the Boss</button>'):'<button class="btn" id="rp">Practice again</button><button class="btn alt" id="rc">Retry the check</button>'}<button class="btn alt" id="map">Map</button></div></section>`;
  $('#map').onclick=showMap;
  const nx=$('#nx'); if(nx) nx.onclick=()=>startLevel(nextI);
  const bs=$('#bs'); if(bs) bs.onclick=startBoss;

}

    else if(T.kind==='bat'){ if(mode==='V'){reading=T.v;} else {reading='—'; note='Beep mode is only for parts with no battery in them. Use V for batteries.';} }
    else { if(mode==='beep'){ reading=T.ok?'0.2':'OL'; if(T.ok) tone(2400,.35,'square',.08); note=T.ok?'BEEP! The path is unbroken.':'No beep. OL means open loop.'; } else {reading='0.00'; note='0 volts: a wire has no push of its own. Use beep mode for wires.';} }
    draw(true); $('#mnote').innerHTML=note?`<div class="fb info">${note}</div>`:'';
  };
  setM('off');
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=+b.dataset.i===it.a; b.classList.add(ok?'right':'wrong'); const fin=done(ok,isCheck&&!ok?'The answer: '+it.opts[it.a]+'.':''); if(fin||isCheck) el.querySelectorAll('.opt').forEach(x=>x.disabled=true); if(isCheck&&!ok) el.querySelector(`.opt[data-i="${it.a}"]`).classList.add('right');});
 },
 meter4(it,el,done){
  let mode='off'; const L='ABCD';
  el.innerHTML=`<div class="say">${sayBtn(it.q)}<p class="q">${it.q}</p></div>
   <div class="row" style="justify-content:center"><span class="dial"><button class="btn alt small keep" data-m="off">Off</button><button class="btn alt small keep" data-m="V">V (volts)</button><button class="btn alt small keep" data-m="beep">Beep</button></span></div>
   <div class="opts">${[0,1,2,3].map(i=>`<div class="card" style="padding:12px;gap:8px"><svg viewBox="0 0 200 40" aria-hidden="true"><path d="M20 20 H180" stroke="#2D5BA5" stroke-width="12" stroke-linecap="round"/><path d="M6 20 H20 M180 20 H194" class="w"/></svg><div class="row"><b>Wire ${L[i]}</b><span class="mono" id="r${i}" style="margin-left:auto">—</span></div><button class="btn alt small keep" data-t="${i}">Test wire ${L[i]}</button></div>`).join('')}</div>
   <p class="q" style="margin:0">Which wire is broken?</p><div class="opts">${[0,1,2,3].map(i=>`<button class="opt" data-i="${i}">Wire ${L[i]}</button>`).join('')}</div>`;
  el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m; el.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b)); tone(300,.04,'square',.05);});
  el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const i=+b.dataset.t, r=$('#r'+i);
    if(mode!=='beep'){ r.textContent= mode==='V'?'0.00 V':'off'; $('#fb').innerHTML=`<div class="fb info">Set the dial to Beep to check a wire.</div>`; return; }
    $('#fb').innerHTML=''; if(i===it.broken){ r.textContent='OL · no beep'; } else { r.textContent='beep ✓'; tone(2400,.3,'square',.08);} });
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=+b.dataset.i===it.broken; b.classList.add(ok?'right':'wrong'); const fin=done(ok,''); if(fin) el.querySelectorAll('.opt').forEach(x=>x.disabled=true);});
 }
};
function revealHide(it){ // show the circuit with the test item but no flow yet
  const svg=artOf(it.art); return svg.replace(/<path d="M60 165[^>]*class="e"\/>/,'').replace(/class="on"/g,'').replace(/st-(lit|open)/,'st-wait');
}
let GEN=null; function stopGen(){ if(GEN) cancelAnimationFrame(GEN); GEN=null; }

/* ---------- celebration ---------- */
function burst(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=$('#burst'), x=cv.getContext('2d'); cv.width=innerWidth; cv.height=innerHeight;
  const cols=['#FFC21A','#B5602A','#2D61D4','#1E8C57'];
  const P=[...Array(90)].map(()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:Math.random()*-11-3,s:Math.random()*5+3,c:cols[Math.floor(Math.random()*4)],l:1}));
  let f=0; const step=()=>{ x.clearRect(0,0,cv.width,cv.height); P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.l-=.012; x.globalAlpha=Math.max(0,p.l); x.fillStyle=p.c; x.fillRect(p.x,p.y,p.s,p.s*1.6);}); if(++f<110) requestAnimationFrame(step); else x.clearRect(0,0,cv.width,cv.height); };
  step(); yay(); setTimeout(()=>tone(1320,.25),260);
}

showMap();
